summary:
  text: >-
    OMB guidance implementing section 4 of Executive Order 14319. It requires agencies to include
    contractual requirements on compliance with the order's two Unbiased AI Principles,
    truth-seeking and ideological neutrality, in any new solicitation or order for a large language
    model and to update their procurement policies by March 11, 2026, and says agencies should, to
    the extent practicable, modify existing contracts for large language models. It does not apply
    to national security systems, and agencies are not required to apply it to models acquired under
    a free, open-source license.
  reviewed_at: 2026-10-08
