summary:
  text: >-
    Establishes a White House Task Force on Artificial Intelligence Education, chaired by the
    Director of the Office of Science and Technology Policy, and directs it to plan a Presidential
    Artificial Intelligence Challenge for students and educators. It directs Task Force agencies to
    seek public-private partnerships to develop online resources for teaching AI literacy from
    kindergarten through grade 12, and directs the Secretary of Education, the National Science
    Foundation, and the Secretary of Agriculture to prioritize AI in teacher training, research, and
    related programs. It also directs the Secretary of Labor to seek to increase participation in
    AI-related Registered Apprenticeships.
