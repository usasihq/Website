summary:
  text: >-
    A NIST report that examines existing standards, tools, methods, and practices, and the potential
    development of further standards and techniques, for authenticating content and tracking its
    provenance, labeling synthetic content such as through watermarking, detecting synthetic
    content, preventing generative AI from producing child sexual abuse material or non-consensual
    intimate imagery of real individuals, testing software used for these purposes, and auditing and
    maintaining synthetic content. It uses the definition of synthetic content from Executive Order
    14110 and notes that the efficacy of many of the technical approaches it describes has not yet
    been fully examined.
