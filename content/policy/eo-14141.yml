summary:
  text: >-
    Sets five guiding principles for developing AI infrastructure, including data centers, in the
    United States. It directs the Secretaries of Defense and Energy to identify sites on Federal
    land that may be suitable for leasing to non-Federal entities to build and operate frontier AI
    data centers and clean energy facilities to serve them, and sets out steps on permitting,
    electric grid interconnection, and transmission for those sites.
  reviewed_at: 2026-10-08
