status_note:
  text: >-
    The Federal Register's executive order notes for this order, retrieved on 2026-10-08, list no
    revoking or amending order. OMB issued Memorandum M-26-04 on December 11, 2025 to implement
    section 4 of the order.
  reviewed_at: 2026-10-08
  source_ids: [eo-14319-fr-record, m-26-04-text]
superseded_by: null
summary:
  text: >-
    Directs agency heads to procure only large language models developed in accordance with two
    "Unbiased AI Principles": truth-seeking and ideological neutrality. It directs OMB to issue
    implementing guidance within 120 days, and directs agencies to include terms requiring
    compliance with the principles in new contracts for large language models, with decommissioning
    costs charged to the vendor if the agency terminates a contract for noncompliance. The order
    states that it builds on Executive Order 13960.
  reviewed_at: 2026-10-08
