summary:
  text: >-
    OMB guidance to agencies on their use of AI, which the memorandum says the AI in Government Act
    of 2020 required; it rescinds and replaces M-24-10. It directs each agency to retain or
    designate a Chief AI Officer within 60 days, requires agencies covered by the Chief Financial
    Officers Act to develop and publish AI strategies within 180 days, and requires minimum risk
    management practices for high-impact AI, with agencies to stop using such AI if proper risk
    mitigation is not possible. Agencies must also keep updating their annual AI use case
    inventories and develop compliance plans.
  reviewed_at: 2026-10-08
