summary:
  text: >-
    States a policy "to sustain and enhance America's global AI dominance" and directs the Assistant
    to the President for Science and Technology, the Special Advisor for AI and Crypto, and the
    Assistant to the President for National Security Affairs to develop an AI action plan within 180
    days. It directs a review of all actions taken under the revoked Executive Order 14110, so that
    agencies can suspend, revise, or rescind those found inconsistent with the order's policy, and
    directs OMB to revise memoranda M-24-10 and M-24-18 within 60 days.
  reviewed_at: 2026-10-08
