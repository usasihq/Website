issuer: President of the United States (Donald J. Trump)
issuer_org_slug: null
date: 2020-12-03
date_label: signed
status: in-effect
status_note:
  text: >-
    The Federal Register's executive order notes for this order, retrieved on 2026-10-08, list no
    revoking or amending order. OMB Memorandum M-26-04 of December 11, 2025 describes this order as
    an existing directive that its guidance builds on.
  reviewed_at: 2026-10-08
  source_ids: [eo-13960-fr-record, m-26-04-text]
superseded_by: null
summary:
  text: >-
    Sets out nine principles that agencies must follow when designing, developing, acquiring, and
    using AI in the Federal Government, including that such use be lawful, accurate, safe,
    understandable, transparent, and accountable. It directs OMB to publish a roadmap for policy
    guidance on agency use of AI, and directs agencies to prepare annual inventories of their
    non-classified and non-sensitive AI use cases and make them public where practicable. The order
    does not apply to AI used in defense or national security systems, to AI embedded in common
    commercial products, or to AI research and development activities.
  reviewed_at: 2026-10-08
  source_ids: [eo-13960-text]
