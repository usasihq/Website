summary:
  text: >-
    OMB guidance on agencies' acquisition of AI systems and services, issued consistent with the
    Advancing American AI Act, Executive Order 14179, and M-25-21; it rescinds and replaces M-24-18.
    It requires agencies to update internal acquisition procedures within 270 days, states a policy
    to maximize the use of AI products and services developed and produced in the United States, and
    gives guidance across the acquisition lifecycle, including contract terms on intellectual
    property rights and protections against vendor lock-in. It applies to contracts awarded under
    solicitations issued 180 days or more after the memorandum, and to options exercised after that
    date.
  reviewed_at: 2026-10-08
