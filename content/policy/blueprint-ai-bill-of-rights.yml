summary:
  text: >-
    A white paper from the White House Office of Science and Technology Policy that identifies five
    principles to guide the design, use, and deployment of automated systems: safe and effective
    systems; algorithmic discrimination protections; data privacy; notice and explanation; and human
    alternatives, consideration, and fallback. It is accompanied by a handbook, From Principles to
    Practice, with steps for applying the principles. Its legal disclaimer states that it is
    non-binding and does not constitute U.S. government policy.
  reviewed_at: 2026-10-08
