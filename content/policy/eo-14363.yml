summary:
  text: >-
    Establishes the Genesis Mission, a national effort to apply AI to scientific discovery,
    implemented within the Department of Energy by the Secretary of Energy, with the Assistant to
    the President for Science and Technology providing general leadership and coordinating
    participating agencies through the National Science and Technology Council. It directs the
    Secretary to establish and operate the American Science and Security Platform, providing
    high-performance computing, AI modeling frameworks and agents, domain-specific foundation
    models, secure access to datasets, and tools for AI-augmented experimentation. It also directs
    the Secretary to identify at least 20 national science and technology challenges for the Mission
    and to report to the President annually.
