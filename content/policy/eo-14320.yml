summary:
  text: >-
    Directs the Secretary of Commerce to establish an American AI Exports Program within 90 days and
    to issue a public call for proposals from industry-led consortia for full-stack AI export
    packages, covering AI-optimized hardware and cloud services, data pipelines, models, security
    measures, and applications. Proposals selected by the Secretary are to be designated priority AI
    export packages, and the Economic Diplomacy Action Group, chaired by the Secretary of State, is
    to coordinate Federal financing tools to support them. Proposals must comply with U.S. export
    control regimes, outbound investment regulations, and end-user policies.
  reviewed_at: 2026-10-08
