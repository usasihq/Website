summary:
  text: >-
    Establishes the American AI Initiative, a Federal Government strategy guided by five principles
    and coordinated through the National Science and Technology Council Select Committee on
    Artificial Intelligence. It directs agencies that perform or fund research to treat AI as a
    research and development priority, directs all agencies to review Federal data and models for
    opportunities to increase access by the non-Federal AI research community, and directs agencies
    that provide educational grants to consider AI a priority area in existing fellowship and
    service programs. It also directs OMB to issue a memorandum to agencies on regulatory and
    non-regulatory approaches to AI applications, and directs NIST to issue a plan for Federal
    engagement in developing AI technical standards.
