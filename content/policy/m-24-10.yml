summary:
  text: >-
    OMB guidance to agencies, issued consistent with the AI in Government Act of 2020, the Advancing
    American AI Act, and Executive Order 14110, on governance, innovation, and risk management for
    agency use of AI. It required each agency to designate a Chief AI Officer within 60 days,
    required agencies covered by the Chief Financial Officers Act to develop enterprise strategies
    for responsible AI use, and required minimum risk management practices for safety-impacting and
    rights-impacting AI. It also gave recommendations for managing AI risks in Federal procurement.
  reviewed_at: 2026-10-08
