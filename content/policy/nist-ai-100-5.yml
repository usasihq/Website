summary:
  text: >-
    A plan for U.S. engagement with standards organizations, industry, academia, civil society, and
    foreign governments on developing and implementing AI-related consensus standards, prepared by
    the Department of Commerce in coordination with the Department of State and other agencies in
    accordance with section 11(b) of Executive Order 14110. It sorts AI topics into three tiers by
    readiness for standardization, with terminology, testing and evaluation methods, digital content
    transparency, risk management, and security and privacy among those it calls urgently needed and
    ready, and recommends engagement activities for the U.S. government and other stakeholders.
