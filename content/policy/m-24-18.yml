summary:
  text: >-
    OMB guidance on agencies' acquisition of AI, issued consistent with the Advancing American AI
    Act, Executive Order 14110, and OMB Memorandum M-24-10. It required agencies to create or update
    acquisition policies, procedures, and practices to reflect new AI governance responsibilities,
    and set requirements and guidance on cross-functional and interagency collaboration, managing AI
    risk and performance, and promoting a competitive AI market.
