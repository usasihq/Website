summary:
  text: >-
    Directs the Secretary of Commerce to launch an initiative to provide financial support for
    qualifying data center projects and the components they depend on, where a data center project
    is a facility requiring more than 100 megawatts of new load dedicated to AI inference, training,
    simulation, or synthetic data generation. It directs agencies to identify existing, and
    establish new, categorical exclusions under the National Environmental Policy Act for such
    projects, sets out other measures to expedite environmental reviews and permitting, and directs
    agencies to offer sites on Federal lands and military installations for them. It revokes
    Executive Order 14141.
  reviewed_at: 2026-10-08
