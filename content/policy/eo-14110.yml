status_note:
  text: >-
    Revoked by Executive Order 14148 of January 20, 2025 (Initial Rescissions of Harmful Executive
    Orders and Actions), section 2(ggg). Executive Order 14179 of January 23, 2025 directs a review
    of actions taken under the revoked order.
  reviewed_at: 2026-10-08
