summary:
  text: >-
    Sets eight guiding principles and priorities for Federal AI policy and assigns tasks to agencies
    on safety and security, innovation and competition, workers, equity and civil rights, consumer
    protection, privacy, Federal Government use of AI, and international engagement. It directs the
    Secretary of Commerce to require companies developing potential dual-use foundation models to
    report on training activities, the ownership and security of model weights, and red-team test
    results, and to require reports on large-scale computing clusters. It directs NIST to develop AI
    safety and security guidelines, including a generative AI companion resource to the AI RMF, and
    directs OMB to issue guidance on agency use of AI, including the designation of Chief AI
    Officers.
  reviewed_at: 2026-10-08
