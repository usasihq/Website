summary:
  text: >-
    A plan developed under Executive Order 14179; its introduction carries the names of the
    Assistant to the President for Science and Technology, the Special Advisor for AI and Crypto,
    and the Assistant to the President for National Security Affairs. It sets out recommended
    Federal policy actions under three pillars: Accelerate AI Innovation, Build American AI
    Infrastructure, and Lead in International AI Diplomacy and Security. Recommended actions include
    revising the NIST AI Risk Management Framework to eliminate references to misinformation,
    diversity, equity, and inclusion, and climate change; updating Federal procurement guidelines
    for large language models; streamlining permitting for data centers, semiconductor manufacturing
    facilities, and energy infrastructure; and exporting American AI to allies and partners.
  reviewed_at: 2026-10-08
