slug: take-it-down-act
title: Tools to Address Known Exploitation by Immobilizing Technological Deepfakes on Websites and Networks Act
short_title: TAKE IT DOWN Act
document_type: law
identifier: Public Law 119-12
issuer: U.S. Congress
issuer_org_slug: null
date: 2025-05-19
date_label: enacted
status: in-effect
status_note:
  text: >-
    Approved May 19, 2025. Section 3 gave covered platforms one year after enactment to establish
    the notice and removal process.
  reviewed_at: 2026-10-08
  source_ids: [pl-119-12]
superseded_by: null
summary:
  text: >-
    Makes it a Federal crime to knowingly publish, through an interactive computer service,
    nonconsensual intimate visual depictions of an identifiable individual, including "digital
    forgeries," which the Act defines to include depictions created through artificial intelligence
    or other technological means. It requires covered platforms to establish a process through which
    individuals can request removal of such depictions and to remove them within 48 hours of a valid
    request. A failure to reasonably comply with these notice and removal obligations is treated as
    an unfair or deceptive act or practice under the Federal Trade Commission Act, which the
    Commission enforces.
  reviewed_at: 2026-10-08
  source_ids: [pl-119-12]
