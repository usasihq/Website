summary:
  text: >-
    A cross-sectoral profile of and companion resource for the AI RMF 1.0 for generative AI,
    developed under section 4.1(a)(i)(A) of Executive Order 14110. It defines risks that are novel
    to or exacerbated by the use of generative AI and suggests actions to help organizations govern,
    map, measure, and manage those risks across the AI lifecycle.
