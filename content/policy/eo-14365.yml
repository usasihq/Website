summary:
  text: >-
    States a policy of "a minimally burdensome national policy framework for AI" and directs the
    Attorney General to establish an AI Litigation Task Force to challenge State AI laws
    inconsistent with that policy. It directs the Secretary of Commerce to publish an evaluation of
    State AI laws and to issue a policy notice making States with laws identified in that evaluation
    ineligible for certain non-deployment funds under the Broadband Equity Access and Deployment
    Program, to the maximum extent allowed by Federal law. It directs the Chairman of the Federal
    Communications Commission to begin a proceeding on whether to adopt a Federal reporting and
    disclosure standard for AI models that preempts conflicting State laws, and the Chairman of the
    Federal Trade Commission to issue a policy statement on how the FTC Act applies to AI models. It also directs a legislative
    recommendation for a uniform Federal AI policy framework that preempts conflicting State AI
    laws, which is not to propose preempting otherwise lawful State laws on topics such as child
    safety protections.
  reviewed_at: 2026-10-08
