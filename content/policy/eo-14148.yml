summary:
  text: >-
    Revokes a list of executive orders and presidential memoranda issued from January 2021 to
    January 2025, including Executive Order 14110 on artificial intelligence. It directs the
    Directors of the Domestic Policy Council and the National Economic Council to review Federal
    actions taken under the revoked orders and to submit a further list of orders to rescind and
    replace, and directs the National Security Advisor to review National Security Memoranda issued
    from January 20, 2021 through January 20, 2025.
