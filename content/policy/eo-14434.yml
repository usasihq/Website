slug: eo-14434
title: Inaugurating the Era of Super Intelligence
short_title: null
document_type: executive-order
identifier: EO 14434
issuer: President of the United States (Donald J. Trump)
issuer_org_slug: null
date: 2026-09-29
date_label: signed
status: in-effect
status_note:
  text: >-
    The Federal Register's executive order notes for this order, retrieved on 2026-10-08, list no
    revoking or amending order. NIST's super intelligence page states that, per this order, NIST is
    working to update its communications to incorporate the term "super intelligence". Separately,
    NIST's center page now uses the name Center for Advancing Innovation and Standards for Super
    Intelligence (CAISSI), while items from July 2026 listed on that page use the earlier name Center
    for AI Standards and Innovation (CAISI); NIST's pages do not say when or why the name changed.
  reviewed_at: 2026-10-08
  source_ids: [eo-14434-fr-record, nist-super-intelligence, nist-caissi]
superseded_by: null
summary:
  text: >-
    Sets a policy that, to the maximum extent permitted by law, the executive branch will use the
    terms "Super Intelligence" and "SI" in place of "Artificial Intelligence" and "AI", and directs
    agencies to do so in official correspondence, public communications, websites, reports, policy
    documents, and other non-statutory documents. It does not require changes to previously issued
    regulations, Presidential actions, contracts, grants, or other historical documents. For the
    order's purposes the new terms mean the technologies covered by the statutory definition of
    artificial intelligence at 15 U.S.C. 9401(3), and the Assistant to the President for Science and
    Technology is to propose legislative language for a Federal definition within 60 days.
  reviewed_at: 2026-10-08
  source_ids: [eo-14434-text]
