summary:
  text: >-
    OMB guidance, required by Executive Order 13859, on regulatory and non-regulatory approaches to
    AI applications developed and deployed outside the Federal Government; government use of AI is
    outside its scope. It sets out ten principles for agencies to consider, including public trust,
    public participation, risk assessment and management, benefits and costs, fairness and
    non-discrimination, and safety and security, and states that agencies must avoid regulatory or
    non-regulatory actions that needlessly hamper AI innovation and growth. Agencies with regulatory
    authorities were to submit plans to achieve consistency with the memorandum by May 17, 2021.
  reviewed_at: 2026-10-08
