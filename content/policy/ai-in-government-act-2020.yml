date: 2020-12-27
date_label: enacted
status: in-effect
status_note:
  text: >-
    OMB Memorandum M-25-21 of April 3, 2025 states that the AI in Government Act of 2020 required
    its issuance, and directs agencies to develop compliance plans consistent with section 104(c)
    and (d) of the Act. Section 103(d) of the Act provides that section 103, which creates the AI
    Center of Excellence, ceases to be effective 5 years after the date of enactment. USASI has not
    confirmed whether a later law changed that date.
  reviewed_at: 2026-10-08
  source_ids: [m-25-21-text, pl-116-260]
superseded_by: null
summary:
  text: >-
    Creates an AI Center of Excellence within the General Services Administration to facilitate the
    adoption of AI in the Federal Government and improve cohesion and competency in its use. It
    requires the OMB Director to issue a memorandum to agencies on their acquisition and use of AI,
    including approaches to remove barriers to that use and best practices for identifying and
    mitigating discriminatory impact or bias, and to update it every two years for 10 years. Each
    agency must post a plan to achieve consistency with the memorandum or a written determination
    that it does not use and does not anticipate using AI. The Act also directs the Office of
    Personnel Management to identify AI skills and competencies and to establish or update an
    occupational job series for AI positions.
  reviewed_at: 2026-10-08
  source_ids: [pl-116-260]
