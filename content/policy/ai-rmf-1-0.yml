summary:
  text: >-
    A framework intended for voluntary use by organizations that design, develop, deploy, or use AI
    systems, developed as directed by the National Artificial Intelligence Initiative Act of 2020.
    Part 1 describes how organizations can frame AI risks and lists characteristics of trustworthy
    AI systems: valid and reliable, safe, secure and resilient, accountable and transparent,
    explainable and interpretable, privacy enhanced, and fair with their harmful biases managed.
    Part 2, the Core, organizes risk management into four functions: Govern, Map, Measure, and
    Manage.
  reviewed_at: 2026-10-08
