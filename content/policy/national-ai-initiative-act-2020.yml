issuer: U.S. Congress
issuer_org_slug: null
date: 2021-01-01
date_label: enacted
status: in-effect
status_note:
  text: >-
    Most of the Act's provisions are codified in chapter 119 of title 15 of the United States Code
    (2024 edition), and Executive Order 14434 of September 29, 2026 uses its definition of artificial
    intelligence at 15 U.S.C. 9401(3). Section 5101(e) provides that the Initiative terminates 10
    years after the date of enactment.
  reviewed_at: 2026-10-08
  source_ids: [usc-15-ch119, eo-14434-text, pl-116-283]
superseded_by: null
summary:
  text: >-
    Directs the President to establish a National Artificial Intelligence Initiative to support AI
    research and development, education and workforce training, and the coordination of Federal AI
    activities, and provides for a National Artificial Intelligence Initiative Office, an
    interagency committee, and a National Artificial Intelligence Advisory Committee. It provides
    for a network of National Artificial Intelligence Research Institutes and a task force on a
    National AI Research Resource. It directs NIST to support the development of AI standards and to
    develop a voluntary risk management framework for trustworthy AI systems, and sets out AI
    activities for the National Oceanic and Atmospheric Administration, the National Science
    Foundation, and the Department of Energy.
  reviewed_at: 2026-10-08
