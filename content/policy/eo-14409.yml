summary:
  text: >-
    Directs agencies to prioritize the cyber defense of national security systems and of Department
    of War and civilian Federal information systems, and directs the Secretary of the Treasury, in
    consultation with the National Security Agency, the Cybersecurity and Infrastructure Security
    Agency, and the National Cyber Director, to form an AI cybersecurity clearinghouse, in voluntary
    collaboration with the AI industry and critical infrastructure operators, to coordinate the
    discovery and remediation of software vulnerabilities. It directs those agencies, in
    consultation with NIST and others, to develop a classified benchmarking process to determine
    when an AI model is a "covered frontier model" and to design a voluntary framework through which
    developers could give the Federal Government access to such models for up to 30 days before
    releasing them to other trusted partners. The order states that nothing in its frontier model
    section authorizes a mandatory governmental licensing, preclearance, or permitting requirement
    for new AI models, and it directs the Attorney General to prioritize enforcement of Federal
    criminal laws against unauthorized computer access using AI.
  reviewed_at: 2026-10-08
