slug: ibm-releases-granite-time-series-patchtst-fm-r2
title: IBM releases the Granite Time Series PatchTST-FM-r2 forecasting model under Apache 2.0 or OpenMDW
event_date: 2026-09-09
published_at: 2026-10-13
category: release
summary:
  text: >-
    On September 9, 2026 IBM Research announced Granite Time Series PatchTST-FM-r2, a zero-shot
    forecasting model of about 385M parameters that succeeds PatchTST-FM-r1 in the Granite TSFM family.
    The announcement lists a context length of up to 8,192 steps, flexible forecast lengths, and
    probabilistic forecasts from a 99-quantile prediction head. The weights are on Hugging Face and the
    code is in the granite-tsfm repository, and the model is dual-licensed under Apache 2.0 and OpenMDW
    1.0, with either license available to choose. USASI has not tested the model.
  source_ids: [patchtst-fm-r2-blog]
