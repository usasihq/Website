slug: google-releases-embeddinggemma-2
title: Google releases EmbeddingGemma 2, an open-weight multimodal embedding model under Apache 2.0
event_date: 2026-10-06
published_at: 2026-10-07
category: release
summary:
  text: >-
    On October 6, 2026 Google announced EmbeddingGemma 2, a multimodal embedding model built on
    the Gemma 4 architecture. The announcement says the model maps text, code, images, video, and
    audio into a shared embedding space, contains 740 million parameters, and produces 768-dimensional
    vectors that can be truncated to 512, 256, or 128 dimensions using Matryoshka Representation
    Learning. Google says the weights are released under the Apache 2.0 license and are available on
    Hugging Face and Kaggle, with on-device variants in the LiteRT Community on Hugging Face. USASI
    has a release record for the earlier EmbeddingGemma 300M; a record for this release has not yet
    been added.
