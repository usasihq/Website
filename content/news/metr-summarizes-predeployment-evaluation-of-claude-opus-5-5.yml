slug: metr-summarizes-predeployment-evaluation-of-claude-opus-5-5
title: METR publishes a summary of its predeployment evaluation of Claude Opus 5.5
event_date: 2026-09-22
published_at: 2026-10-13
category: research
summary:
  text: >-
    On September 22, 2026, METR published a preliminary summary of its predeployment evaluation of
    Anthropic's Claude Opus 5.5, focused on the model's potential effect on AI research and
    development. METR says it tested the model through API access over 10 business days on five
    tasks; it drafted the summary, Anthropic could review and edit it, and the final text also
    appears in the Claude Opus 5.5 system card. METR concludes that the model is unlikely to be able
    to fully automate AI R&D, but expects it to noticeably accelerate researchers and automate
    limited aspects of R&D. METR says the work was not meant to verify compliance with any threshold
    in Anthropic's policies and did not assess alignment properties.
