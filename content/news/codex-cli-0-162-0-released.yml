slug: codex-cli-0-162-0-released
title: OpenAI releases Codex CLI 0.162.0 with managed Git worktree tools
event_date: 2026-10-08
published_at: 2026-10-09
category: release
summary:
  text: >-
    On October 8, 2026 OpenAI published version 0.162.0 of its open-source Codex CLI on GitHub. The
    release notes add tools for creating and listing managed Git worktrees from trusted local
    projects when the worktrees feature is enabled, and add task pinning in the agent Command
    Center with the `p` key. They also say live web access and remote compaction can be configured for
    custom Responses-compatible model providers, and that a signed PowerShell installer is now
    published with Windows releases. USASI has not tested these changes.
