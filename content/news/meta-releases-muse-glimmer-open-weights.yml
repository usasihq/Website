slug: meta-releases-muse-glimmer-open-weights
title: Meta releases Muse Glimmer as an open-weight model under Apache 2.0
event_date: 2026-08
published_at: 2026-09-29
category: release
summary:
  text: >-
    In August 2026 Meta Superintelligence Labs published Muse Glimmer, a model of about 30
    billion parameters that takes text and images as input and was distilled from Muse Spark.
    Its weights can be downloaded from Hugging Face without an access request under the Apache
    2.0 license, and the repository also includes a separate Muse Glimmer Usage Policy that
    lists prohibited uses. Muse Glimmer has its own release record under the Muse family.
