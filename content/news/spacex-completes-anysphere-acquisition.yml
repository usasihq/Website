slug: spacex-completes-anysphere-acquisition
title: SpaceX completes its acquisition of Anysphere, the developer of Cursor
event_date: 2026-08-14
published_at: 2026-09-29
category: acquisition
summary:
  text: >-
    SpaceX completed its acquisition of Anysphere, Inc., the company behind the Cursor coding
    tool, on August 14, 2026, through a merger of a SpaceX subsidiary into Anysphere. SpaceX's
    Form 8-K says Anysphere survives as a wholly owned subsidiary of Space Exploration
    Technologies Corp., and Cursor announced the same day that it is now part of SpaceX. The
    Anysphere record now lists SpaceX as its parent company.
