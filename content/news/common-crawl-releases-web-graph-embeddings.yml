slug: common-crawl-releases-web-graph-embeddings
title: Common Crawl releases experimental web graph embeddings for web hosts
event_date: 2026-09-07
published_at: 2026-10-13
category: release
summary:
  text: >-
    On September 7, 2026, Common Crawl published an experimental dataset of 128-dimensional
    embeddings for web hosts, learned from hyperlinks alone in its host-level web graph for the
    November 2025, December 2025, and January 2026 crawls. The model uses no page text, metadata, or
    hostnames and was trained only on hosts with at least eight links. The data is published as
    Parquet files on Common Crawl's S3 bucket and on Hugging Face, where the dataset card says its
    use is subject to the Common Crawl Terms of Use; the source code is on GitHub. Common Crawl says
    it is yet to be seen whether it will publish graph embeddings on a regular basis.
  source_ids: [cc-wge-blog, cc-wge-card]
