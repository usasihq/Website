slug: together-ai-publishes-tev1-4b-experimental
title: Together AI publishes Tev1-4B-experimental, a decision model whose weights license is not yet final
event_date: 2026-09-23
published_at: 2026-10-13
category: release
summary:
  text: >-
    Together AI published Tev1-4B-experimental on September 23, 2026: an experimental 4B decision
    model, fine-tuned from Qwen3.5-4B, that is trained to choose one option from a structured
    state, question and list of choices. Together AI's blog post says the model is available on
    its serverless platform and walks through fine-tuning a similar classifier with code from the
    togethercomputer/tev1 GitHub repository. The weights are posted on Hugging Face, but the model
    card says the release license for the fine-tuned weights is still being finalized, while the
    base Qwen3.5-4B model is Apache-2.0. The card also says prompt injection, multilingual
    behavior and calibration have not been comprehensively evaluated. USASI has not tested the
    model.
  source_ids: [together-tev1-blog, together-tev1-card]
