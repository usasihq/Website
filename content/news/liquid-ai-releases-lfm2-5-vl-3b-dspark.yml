slug: liquid-ai-releases-lfm2-5-vl-3b-dspark
title: Liquid AI releases LFM2.5-VL-3B-DSpark, a draft model for faster vision-language decoding
event_date: 2026-09-24
published_at: 2026-10-01
category: release
summary:
  text: >-
    Liquid AI announced LFM2.5-VL-3B-DSpark on September 24, 2026. It is an experimental draft
    model of about 280 million parameters that speeds up text generation by its LFM2.5-VL-3B
    vision-language model through speculative decoding; Liquid AI says the target model's output
    is unchanged. The weights are on Hugging Face in Safetensors and GGUF formats, with support in
    SGLang, MLX-VLM, and llama.cpp. They are released under the LFM Open License v1.0, the same
    license as other LFM2.5 releases, which limits commercial use by larger companies through an
    annual-revenue threshold.
  source_ids: [dspark-blog, dspark-card, dspark-license]
