slug: modular-open-sources-mojo-compiler
title: Modular open-sources the Mojo compiler and tooling
event_date: 2026-08-18
published_at: 2026-09-29
category: license
summary:
  text: >-
    At its ModCon conference on August 18, 2026, Modular announced that the full Mojo language,
    including the compiler and tooling, is open source; the modular repository that holds it is
    licensed under Apache 2.0 with LLVM exceptions, while the prebuilt mojo package on PyPI
    declares a separate Modular license. Modular also said the MAX license no longer contains
    device usage restrictions. On September 17 it said the Mojo compiler had begun accepting
    outside contributions.
