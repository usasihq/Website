slug: prime-rl-0-8-0-adds-multi-agent-rl
title: Prime Intellect releases prime-rl 0.8.0 with multi-agent reinforcement learning support
event_date: 2026-08-07
published_at: 2026-10-13
category: release
summary:
  text: >-
    Prime Intellect published version 0.8.0 of prime-rl on GitHub on August 7, 2026. The release notes say it integrates verifiers 0.3.0 for
    multi-agent (single-policy) training and adds two named algorithms for multi-agent environments:
    RAE (Role-conditioned Advantage Estimation) and Hierarchical GRPO. The notes also list a move of
    the inference stack to vLLM 0.26.0, a NIXL and ModelExpress weight-synchronization path, and ZMQ
    as the default rollout transport. USASI has not tested this release.
  source_ids: [prime-rl-v0-8-0-release]
