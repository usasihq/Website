slug: anthropic-updates-usage-policy-2026
title: Anthropic updates its Usage Policy, effective November 12, 2026
event_date: 2026-10-08
published_at: 2026-10-09
category: policy
summary:
  text: >-
    On October 8, 2026 Anthropic published a summary of updates to its Usage Policy, which it says
    take effect on November 12. The post says rules on deceptive activity that were previously spread
    across several sections are consolidated into a new section titled "Do Not Engage in Deceptive
    Campaigns or Artificial Activity", and that the elections section is renamed "Do Not Undermine
    Democratic Processes". It says the weapons prohibitions now explicitly include the software and
    components that make weapons work and actions such as arming drones and other autonomous
    vehicles, and it adds requirements for models connected to hardware that takes autonomous
    physical actions, including that a qualified operator can observe and stop the equipment. This
    item describes Anthropic's own policy for use of its models; it is not a government rule.
