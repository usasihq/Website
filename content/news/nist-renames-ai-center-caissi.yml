slug: nist-renames-ai-center-caissi
title: NIST adopts "super intelligence" wording and introduces its CAISSI center page
event_date: 2026-09-29
published_at: 2026-10-01
category: policy
summary:
  text: >-
    NIST says it is updating its communications to use the term "super intelligence," as
    directed by a September 29, 2026 executive order titled "Inaugurating the Era of Super
    Intelligence." As of October 1, 2026, NIST's center page describes the Center for Advancing
    Innovation and Standards for Super Intelligence (CAISSI), while NIST news items published
    through September refer to the Center for AI Standards and Innovation (CAISI). USASI is an
    independent project and is not affiliated with NIST or any government agency.
