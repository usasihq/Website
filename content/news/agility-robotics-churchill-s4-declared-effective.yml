slug: agility-robotics-churchill-s4-declared-effective
title: SEC declares the Agility Robotics and Churchill Capital Corp XI Form S-4 effective; vote set for November 2
event_date: 2026-10-13
published_at: 2026-10-15
category: acquisition
summary:
  text: >-
    Agility Robotics said on October 13, 2026 that the SEC declared effective the Form S-4
    registration statement for its proposed business combination with Churchill Capital Corp XI,
    a Nasdaq-listed blank check company. Churchill XI has set an extraordinary general meeting for
    November 2, 2026 to vote on the transaction, with a record date of September 14, 2026, and the
    companies expect the deal to close in November 2026. The transaction has not closed: it remains
    subject to approval by Churchill XI shareholders and other customary closing conditions. If it
    closes, the combined company is expected to trade on Nasdaq as AGLT.
