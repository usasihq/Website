slug: ai2-releases-benchmirt
title: Ai2 releases BenchMIRT, a method, code, and data for auditing LLM benchmarks prompt by prompt
event_date: 2026-09-01
published_at: 2026-10-13
category: research
summary:
  text: >-
    Ai2 introduced BenchMIRT on September 1, 2026, describing it as a method for auditing LLM
    benchmarks at the level of individual prompts. According to Ai2, it uses multidimensional Item
    Response Theory to estimate which underlying capabilities are most closely associated with
    getting each question right. Ai2 published a
    technical report, code on GitHub, and data in a Hugging Face collection. The post does not state a
    license. USASI has not tested this method.
