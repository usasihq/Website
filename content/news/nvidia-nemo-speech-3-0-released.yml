slug: nvidia-nemo-speech-3-0-released
title: NVIDIA releases NeMo Speech 3.0, the first major release after the NeMo repository split
event_date: 2026-08-07
published_at: 2026-10-13
category: release
summary:
  text: >-
    NVIDIA published NeMo Speech 3.0 on GitHub on August 7, 2026. The release notes call it the
    first major release after the repository was split and renamed to NVIDIA-NeMo/Speech, which
    now focuses on ASR, TTS, audio processing, speaker tasks and SpeechLM, while LLM, VLM,
    diffusion, export and evaluator collections have moved to separate repositories. The notes
    say the release's central focus is technical debt, including the removal of deprecated code and
    a migration to the uv package manager. They also list support for training SpeechLM models with
    NeMo Automodel and the training and evaluation modules behind Nemotron VoiceChat. USASI has
    not tested this release.
  source_ids: [nemo-speech-3-0-release]
related_organizations: [nvidia]
related_artifacts: [nemo-framework, parakeet]
