slug: openai-releases-gpt-6-astra
title: OpenAI releases GPT-6 Astra in its API
event_date: 2026-09-03
published_at: 2026-10-13
category: release
summary:
  text: >-
    OpenAI's API changelog records the release of GPT-6 Astra (gpt-6-astra) on September 3, 2026,
    for the Responses and Chat Completions endpoints, and says to use it for reasoning, coding,
    computer use, research, and document creation. The migration notes say GPT-6 Astra does not
    support the none reasoning effort level, custom temperature or top_p values, or log
    probabilities, and that tool calling requires the Responses API. The entry also says
    misalignment monitoring asynchronously checks for potential issues during agent work in
    supported Responses API requests, and can trigger safety alerts or stop a conversation for
    review. In a safety overview listed in its news feed the same day, OpenAI says GPT-6 Astra is
    its first model to reach the Critical level of cybersecurity capability under its Preparedness
    Framework. GPT-6 Astra is a hosted model; no release of weights is described. USASI has not
    tested it.
  source_ids: [openai-api-changelog, openai-news-feed]
