slug: nvidia-and-cisco-announce-usfp-optics-form-factor
title: NVIDIA and Cisco announce plans for USFP, a pluggable optics form factor, and an open specification
event_date: 2026-10-12
published_at: 2026-10-13
category: governance
summary:
  text: >-
    On October 12, 2026 NVIDIA and Cisco announced plans for Ultra-Dense Small Form Factor Pluggable
    (USFP), an optical module form factor designed for 400Gb/s-per-lane electrical signals. The
    companies say they plan to create an open industry specification for USFP through an upcoming
    community-led multi-source project, and that they are working with TE Connectivity and Amphenol
    on USFP cages, connectors, and modules. The release describes the first USFP-based transceivers
    as planned and gives no availability date; the specification has not yet been published.
