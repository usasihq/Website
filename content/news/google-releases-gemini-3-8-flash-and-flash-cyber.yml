slug: google-releases-gemini-3-8-flash-and-flash-cyber
title: Google releases Gemini 3.8 Flash and, for vetted defenders, Gemini 3.8 Flash Cyber
event_date: 2026-09-02
published_at: 2026-10-13
category: release
summary:
  text: >-
    On September 2, 2026 Google introduced two Gemini 3.8 models, which it says share the same
    foundational intelligence: Gemini 3.8 Flash, which Google says improves on 3.7 Flash in software
    engineering, agentic tasks, and multi-step reasoning, and Gemini 3.8 Flash Cyber, a
    cybersecurity model for vulnerability detection and automated patching. Google says developers can use 3.8 Flash in the
    Gemini API through Google AI Studio and Android Studio, and that it is available to Google AI
    Pro and Ultra subscribers in the Gemini app. Gemini 3.8 Flash Cyber ships with more permissive
    cybersecurity mitigations and is offered only to trusted defenders through Google's new
    Fairwind Program. Both are hosted models; no release of weights is described. USASI has not
    tested them.
  source_ids: [google-gemini-3-8-flash]
