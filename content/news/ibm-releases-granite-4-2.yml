slug: ibm-releases-granite-4-2
title: IBM releases Granite 4.2 language models in 3B, 8B, and 30B sizes under Apache 2.0
event_date: 2026-08-25
published_at: 2026-09-29
category: release
summary:
  text: >-
    IBM released Granite 4.2 on August 25, 2026: dense, decoder-only language models with
    built-in reasoning in 3B, 8B, and 30B sizes, post-trained from IBM's own Granite 4.1 base
    models. The weights are published on Hugging Face under the Apache 2.0 license. The catalog
    has a release record for each size under the Granite family.
