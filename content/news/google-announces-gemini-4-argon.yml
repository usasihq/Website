slug: google-announces-gemini-4-argon
title: Google announces Gemini 4 Argon, starting with a limited rollout to cyber defenders
event_date: 2026-09-30
published_at: 2026-10-02
category: release
summary:
  text: >-
    Google announced Gemini 4 Argon on September 30, 2026, describing it as a model for real-world
    coding, enterprise knowledge work, and cyber defense. Google says the model is rolling out
    first to a set of trusted cyber defenders through its Fairwind Program, and that it will make
    Argon available to developers, enterprises, and consumers later; the announcement gives no
    date for that wider availability. Google says the model's output token limit is 1 million
    tokens, up from 64K. The announcement does not mention published weights or a license.
