slug: google-introduces-weathernext-3
title: Google introduces WeatherNext 3, an hourly global weather model that uses live satellite data
event_date: 2026-09-03
published_at: 2026-10-13
category: release
summary:
  text: >-
    On September 3, 2026 Google DeepMind and Google Research introduced WeatherNext 3, a global
    weather forecasting model that ingests live geostationary satellite data and produces a new
    forecast every hour. The announcement says it resolves some surface variables at 5-kilometer
    resolution, other surface variables at 10 kilometers, and atmospheric variables at 25
    kilometers, and adds forecasts of 100-meter wind speeds and solar radiation for renewable energy
    planning. Google says WeatherNext 3 begins powering weather features in Search, the Gemini app,
    Google Maps, the Google Maps Platform Weather API, and Google Earth Engine, and that its forecast
    data can be queried in BigQuery and Earth Engine or downloaded in bulk from Google Cloud Storage.
    The announcement links to a paper and does not describe a release of model weights. USASI has
    not tested WeatherNext 3.
