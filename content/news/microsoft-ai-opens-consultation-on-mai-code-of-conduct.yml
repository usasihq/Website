slug: microsoft-ai-opens-consultation-on-mai-code-of-conduct
title: Microsoft AI publishes a draft Code of Conduct for MAI models and opens a public consultation
event_date: 2026-09-14
published_at: 2026-10-13
category: governance
summary:
  text: >-
    On September 14, 2026 Microsoft AI published a first draft of a Code of Conduct for its MAI models,
    which it describes as a training manual for how it develops its models and how they are meant to
    behave in deployment. The draft sets out "Absolute Constraints" in areas such as weapons of mass
    harm, child safety, and harmful manipulation at scale, along with defaults that enterprise partners
    can configure. Microsoft AI opened a six-week public consultation on the draft the same day, and says
    it will then publish a summary of what it learned and changed and release a revised version later in
    2026. The page does not give an exact closing date for comments.
