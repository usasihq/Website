slug: ollama-0-35-0-adds-decision-models
title: Ollama 0.35.0 adds decision models through a /v1/systemone endpoint
event_date: 2026-09-28
published_at: 2026-10-13
category: release
summary:
  text: >-
    Ollama published version 0.35.0 on GitHub on September 28, 2026. The release notes say Ollama
    now supports decision models through `/v1/systemone`, based on TypeSafe's Jev API, and that
    decision models return choices, probabilities, and scores instead of text. The models
    listed as available are Nimble from Bespoke Labs and Tev1 from Together AI, and the API supports three
    question types: `choice`, `noul`, and `score`. USASI has not tested this feature.
  source_ids: [ollama-v0-35-0-release]
