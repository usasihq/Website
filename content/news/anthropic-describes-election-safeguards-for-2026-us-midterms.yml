slug: anthropic-describes-election-safeguards-for-2026-us-midterms
title: Anthropic describes Claude election safeguards ahead of the 2026 U.S. midterms
event_date: 2026-10-14
published_at: 2026-10-15
category: policy
summary:
  text: >-
    On October 14, 2026 Anthropic described its preparations for the 2026 U.S. midterm elections.
    It says Claude.ai continues to show a banner linking to TurboVote from Democracy Works for
    questions about registration, polling places, and election dates, that later this month it
    will draw official voting information from Democracy Works into responses in the United States,
    and that Claude will show up-to-date results on election night and in the following days.
    Anthropic also says it updated its Usage Policy's election rules, published a guide for
    campaigns, and added classifiers aimed at multi-step abuse such as fake social media accounts
    and news sites. It says the Institute for Strategic Dialogue and the McCain Institute tested
    these safeguards and found Claude could miss a malicious campaign spread across many
    harmless-looking requests.
