slug: nvidia-releases-kumo-tabular
title: NVIDIA releases Kumo Tabular, an open-weight model for predictions on tables
event_date: 2026-09-29
published_at: 2026-10-01
category: release
summary:
  text: >-
    NVIDIA published Kumo Tabular on September 29, 2026: a pretrained model for classification
    and regression on tabular data that takes labeled example rows as context and predicts values
    for new rows without task-specific training. It comes in three sizes, from 28 million to 215
    million parameters, and NVIDIA says it was pretrained entirely on artificial tables. The
    weights are on Hugging Face under the OpenMDW-1.1 license, and inference runs through NVIDIA's
    open-source structured-data-models library.
