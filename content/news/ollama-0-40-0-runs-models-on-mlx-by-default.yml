slug: ollama-0-40-0-runs-models-on-mlx-by-default
title: Ollama 0.40.0 runs supported models on MLX by default on Apple Silicon
event_date: 2026-10-06
published_at: 2026-10-13
category: release
summary:
  text: >-
    Ollama published version 0.40.0 on GitHub on October 6, 2026, after a series of release
    candidates that began with v0.40.0-rc0 on September 25. According to the release notes, model
    architectures supported by the MLX runtime now run on MLX automatically on Apple Silicon devices,
    with models listed including qwen3.8, gemma4, qwen3.6, and qwen3.5. The notes say decision
    models (Nimble, tev1, clef, and clef-flash) and the embeddinggemma-2 embedding model are also
    available on MLX, and that Ollama will continue testing and enabling additional models. USASI
    has not tested this release.
  source_ids: [ollama-v0-40-0-release, ollama-v0-40-0-rc0]
