slug: codex-cli-0-161-0-released
title: OpenAI releases Codex CLI 0.161.0 with GPT-6.1 Sol as the default model
event_date: 2026-10-07
published_at: 2026-10-08
category: release
summary:
  text: >-
    On October 7, 2026 OpenAI published version 0.161.0 of its open-source Codex CLI on GitHub. The
    release notes say GPT-6.1 Sol is now the default model in the bundled and Amazon Bedrock
    catalogs, and that Amazon Bedrock supports multi-agent V2 and Ultra reasoning on compatible
    models. The notes also add a `/mcp login <name>` command for signing in to MCP servers from an
    active terminal session, and make Daybreak opt-in through `--enable cli_daybreak`. USASI has not
    tested these changes.
