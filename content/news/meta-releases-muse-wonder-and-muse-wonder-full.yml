slug: meta-releases-muse-wonder-and-muse-wonder-full
title: Meta releases Muse Wonder and Muse Wonder Full through its Model API and Muse Code
event_date: 2026-10-12
published_at: 2026-10-13
category: release
summary:
  text: >-
    On October 12, 2026 Meta announced two new models in its Muse family, Muse Wonder and Muse
    Wonder Full, which it says were built on the groundwork laid with Muse Spark. According to the
    announcement, Muse Wonder is available that day for developers and builders through the Meta
    Model API and Muse Code, and Muse Wonder Full is available to Muse Code subscribers. Meta says
    Muse Wonder will soon power experiences in Muse, rolling out first to subscribers. The
    announcement does not name a license or say that model weights are released, and USASI has not
    tested either model.
  source_ids: [meta-muse-wonder-announcement]
