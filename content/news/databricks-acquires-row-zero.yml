slug: databricks-acquires-row-zero
title: Databricks acquires Row Zero, the maker of a spreadsheet for large datasets
event_date: 2026-09-24
published_at: 2026-10-01
category: acquisition
summary:
  text: >-
    Databricks announced on September 24, 2026, that it has acquired Row Zero, which makes a
    spreadsheet application designed to work with very large datasets and to be used by people
    and AI agents together. Databricks says Row Zero will be integrated natively with its data and
    AI platform, including its Genie assistant, building on components such as Unity Catalog, and
    that it will continue to support data sources outside Databricks. The announcement does not
    disclose financial terms.
