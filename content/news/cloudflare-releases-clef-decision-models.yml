slug: cloudflare-releases-clef-decision-models
title: Cloudflare releases Clef and Clef-flash decision models under Apache 2.0
event_date: 2026-10-01
published_at: 2026-10-01
category: release
summary:
  text: >-
    On October 1, 2026, Cloudflare released Clef and Clef-flash, the first models trained by its
    Workers AI team. They are decision models: given a state and a set of typed questions, they
    return a probability for each allowed answer, so an agent can classify or route a task. Clef
    is post-trained from Qwen3.8-27B and Clef-flash from Qwen3.5-9B. The weights are on Hugging
    Face under the Apache 2.0 license, and both models are also hosted on Workers AI. Cloudflare
    also announced reinforcement-learning fine-tuning of Clef for customers, offered for now as a
    hands-on service with its forward-deployed engineers.
