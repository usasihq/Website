slug: character-ai-team-expected-to-join-disney
title: Members of Character.AI's technical team are expected to join Disney
event_date: 2026-09-18
published_at: 2026-09-29
category: governance
summary:
  text: >-
    On September 18, 2026, Character.AI and The Walt Disney Company announced that members of
    Character.AI's technical team are expected to join Disney. Neither announcement describes an
    acquisition or a licensing agreement, and Character.AI said its app remains live. The move
    has only been announced, and the Character.AI record still lists the company as privately
    held with no parent organization.
