slug: faiss-1-15-0-released
title: Faiss 1.15.0 adds a Metal IVF-PQ index, EDEN quantizer indexes, and a cuVS IVF-SQ backend
event_date: 2026-08-03
published_at: 2026-10-13
category: release
summary:
  text: >-
    Meta's Faiss project published version 1.15.0 on GitHub on August 3, 2026; the changelog in the
    release dates the version July 31, 2026. Additions listed in the notes include MetalIndexIVFPQ with
    product quantization and residual encoding, EDEN quantizer indexes, a cuVS IVF-SQ backend, multi-GPU
    CAGRA-to-HNSW builds, memory-mapped I/O for Flat and static Vamana SVS indices, and RISC-V RVV
    distance and RaBitQ kernels. The notes also list faiss-gpu-cuvs pip wheel packaging and optimizations
    to RaBitQ fast scan and HNSW search. USASI has not tested these changes.
  source_ids: [faiss-v1-15-0-release]
