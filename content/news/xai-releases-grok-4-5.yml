slug: xai-releases-grok-4-5
title: xAI makes Grok 4.5 available on its API
event_date: 2026-07-08
published_at: 2026-10-13
category: release
summary:
  text: >-
    xAI's API release notes record that on July 8, 2026 Grok 4.5, described as a model for coding,
    agentic tasks, and knowledge work, became available on the xAI API with configurable reasoning
    effort (low, medium, or high, with high as the default). A later entry, dated July 17, says
    Grok 4.5 became available in the API console in the EU. The release notes describe a
    hosted model and do not describe a release of weights. USASI has not tested Grok 4.5.
  source_ids: [xai-release-notes]
related_organizations: [xai]
related_artifacts: [grok]
