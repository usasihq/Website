slug: modular-26-6-opens-mojo-compiler-to-contributions
title: Modular 26.6 and Mojo 1.1 open the Mojo compiler to outside contributions
event_date: 2026-09-17
published_at: 2026-10-13
category: release
summary:
  text: >-
    Modular released MAX 26.6 and Mojo 1.1 on September 17, 2026, and said it is now accepting
    contributions to the Mojo compiler, which it open-sourced under the Apache 2.0 license at
    ModCon in August. Modular also says it has migrated its internal issues to public GitHub
    issues. The release notes say Mojo 1.1 marks more standard library APIs as stable, including
    String, SIMD and List, and removes deprecated items such as the fn and alias keywords. MAX
    26.6 adds an audio generation pipeline that launches with support for MiniMax-Music3, and
    support for Thinking Machines' Inkling architecture. USASI has not tested this release.
  source_ids: [modular-26-6-blog, modular-26-6-release]
