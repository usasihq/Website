slug: sentence-transformers-6-0-0-adds-multivectorencoder
title: Sentence Transformers 6.0.0 adds MultiVectorEncoder for ColBERT-style late-interaction models
event_date: 2026-08-18
published_at: 2026-10-13
category: release
summary:
  text: >-
    Sentence Transformers version 6.0.0 was published on GitHub on August 18, 2026. The release
    notes describe it as a major release that introduces Multi-Vector Embedding models, also known as
    late-interaction or ColBERT-style models, as a fourth model type, `MultiVectorEncoder`,
    alongside `SentenceTransformer`, `CrossEncoder`, and `SparseEncoder`. The notes say PyLate and
    Stanford-NLP ColBERT checkpoints load directly into it, that the dependency floor moves to
    `transformers` v5, and that the release contains breaking changes covered in a migration guide.
    USASI has not tested this release.
  source_ids: [sentence-transformers-v6-0-0-release]
related_organizations: [hugging-face]
related_artifacts: [sentence-transformers]
