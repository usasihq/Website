slug: isaac-lab-3-0-early-access-released
title: Isaac Lab 3.0 Early Access published with multi-backend physics and kit-less workflows
event_date: 2026-09-16
published_at: 2026-10-13
category: release
summary:
  text: >-
    The Isaac Lab project published Isaac Lab 3.0 Early Access on GitHub on September 16, 2026.
    The release notes describe a multi-backend architecture in which supported tasks can switch
    physics, rendering or visualization backends without rewriting the environment, and say many
    workflows can now run without installing or launching Isaac Sim, for example with Newton
    physics. The release is built for Isaac Sim 6.1, Python 3.12, PyTorch 2.11, NVIDIA Warp 1.16
    and Newton 1.5.2. Between Early Access and General Availability, which is targeted toward
    the end of October 2026, the release branch will focus only on bug fixes, stability,
    compatibility and documentation improvements. USASI has not tested this release.
  source_ids: [isaac-lab-3-0-ea-release]
