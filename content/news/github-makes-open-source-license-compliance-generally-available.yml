slug: github-makes-open-source-license-compliance-generally-available
title: GitHub makes open source license compliance checks generally available for Enterprise Cloud
event_date: 2026-10-16
published_at: 2026-10-18
category: release
summary:
  text: >-
    In an October 16, 2026 changelog entry, GitHub said open source license compliance is generally
    available for GitHub Enterprise Cloud customers, including data-resident GHEC, for repositories
    with GitHub Code Security enabled. GitHub says the feature adds an enterprise-wide license policy,
    activated through a ruleset with a new "Require license compliance results before merging"
    condition, and that pull requests adding or modifying dependencies are annotated for each
    noncompliant dependency. Since the June public preview, GitHub says it has added license data for
    data residency customers, audit log events for policy changes, and API endpoints for managing the
    policy and for checking whether packages comply with it, which it says lets coding agents avoid
    recommending packages that violate an organization's policy.
