slug: xai-developer-docs-adopt-spacexsi-name
title: xAI's developer documentation now uses the name SpaceXSI
event_date: 2026-10-11
published_at: 2026-10-11
category: governance
summary:
  text: >-
    As of October 11, 2026, xAI's developer documentation at docs.x.ai is titled "SpaceXSI
    Docs", describes itself as the official SpaceXSI API documentation, and opens with "Get
    started with SpaceX Super Intelligence". The page's structured data still names the
    organization xAI and lists "SpaceXAI Docs" among the site's alternate names, and the
    company's Greenhouse job board still carried the name SpaceXAI the same day. xAI has been a
    wholly owned subsidiary of SpaceX since February 2026. USASI has not found an official
    announcement of the new name, and no change to the company's legal name has been
    documented; the catalog record now reads "xAI (SpaceXSI)".
  source_ids: [spacexsi-docs-overview, xai-greenhouse-board, spacex-10q-2026q2]
