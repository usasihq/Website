slug: liquid-ai-releases-lfm2-5-vl-3b
title: Liquid AI releases LFM2.5-VL-3B, an open-weight vision-language model for on-device use
event_date: 2026-08-12
published_at: 2026-10-13
category: release
summary:
  text: >-
    Liquid AI announced LFM2.5-VL-3B on August 12, 2026, a non-reasoning vision-language model that
    it says answers directly to keep latency low for real-time and on-device applications. The model
    card says it uses the LFM2.5-2.6B language model as its backbone with a SigLIP2 NaFlex vision
    encoder, and lists a context length of 32,768 tokens. Weights are on Hugging Face with GGUF,
    ONNX, and MLX exports, under the LFM Open License v1.0. USASI has not tested this model.
  source_ids: [liquid-lfm2-5-vl-3b-blog, lfm2-5-vl-3b-card, lfm2-5-vl-3b-license]
