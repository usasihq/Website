slug: character-ai-begins-chapter-11-sale-process
title: Character.AI begins a voluntary Chapter 11 process to pursue a court-supervised sale of the company
event_date: 2026-10-12
published_at: 2026-10-13
category: governance
summary:
  text: >-
    Character.AI announced on its blog that it has initiated a voluntary Chapter 11 bankruptcy
    process to facilitate a court-supervised sale of the company. According to the case website
    of its claims and noticing agent, Character Technologies, Inc. d/b/a Character.AI filed a
    voluntary petition for relief under Chapter 11 on October 12, 2026, and the case is
    administered under Case No. 26-11603 in the United States Bankruptcy Court for the District of
    Delaware. The company says it hopes the sale process will yield a proposal that allows the
    platform to keep operating, that the platform will be wound down if no such bid is available,
    and that it currently expects the sale process to be complete by the end of November or perhaps
    early December 2026. It says the platform remains up and running at this time. The outcome of
    the sale is not yet known.
