slug: cognition-releases-swe-2
title: Cognition releases SWE-2, a coding model post-trained from Kimi K3, in Devin
event_date: 2026-09-10
published_at: 2026-10-13
category: release
summary:
  text: >-
    Cognition introduced SWE-2 on September 10, 2026. The announcement says SWE-2 is post-trained
    from Kimi K3, a 2.8T-parameter model, and that it is available in Devin, starting with Devin
    Desktop and the CLI, with a rollout to Devin Web and Fusion. The post does not say that the
    model's weights are published. USASI has not tested this model.
