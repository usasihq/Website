slug: waymo-publishes-av-incident-management-exercise-framework
title: Waymo announces a framework for incident management exercises for automated vehicle fleets
event_date: 2026-10-07
published_at: 2026-10-13
category: research
summary:
  text: >-
    On October 7, 2026, Waymo announced a framework for planning, testing, and strengthening
    incident-management capabilities for automated vehicle fleets, set out in a paper its
    researchers posted on arXiv on September 4, 2026, "On Being Prepared: Automated Vehicle Incident
    Management Exercise Practices." The framework adapts established emergency-management practice,
    including FEMA's Homeland Security Exercise and Evaluation Program, and describes four exercise
    categories, from consultations and workshops to full-scale exercises. Waymo says it provides a
    shared approach for AV developers, operational partners, first responders, and public-safety
    agencies.
