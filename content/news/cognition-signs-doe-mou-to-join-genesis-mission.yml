slug: cognition-signs-doe-mou-to-join-genesis-mission
title: Cognition signs a memorandum of understanding with the Department of Energy to join the Genesis Mission
event_date: 2026-07-22
published_at: 2026-10-13
category: policy
summary:
  text: >-
    Cognition said on July 22, 2026 that it has signed a memorandum of understanding with the U.S.
    Department of Energy to join the Genesis Mission, which the post describes as launched by
    executive order in November 2025. According to the post, Cognition will contribute alongside DOE
    and the national laboratories in four areas: software and data security, modernizing legacy
    scientific code, expanding scientific workforce capacity, and cloud modernization. The post does not give
    further terms of the memorandum.
