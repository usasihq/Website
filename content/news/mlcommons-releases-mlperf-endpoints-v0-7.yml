slug: mlcommons-releases-mlperf-endpoints-v0-7
title: MLCommons releases MLPerf Endpoints v0.7, a benchmark for buyers of hosted inference
event_date: 2026-07-28
published_at: 2026-10-13
category: release
summary:
  text: >-
    On July 28, 2026, MLCommons announced MLPerf Endpoints v0.7, a foundation release of a new MLPerf
    benchmark aimed at enterprise buyers procuring inference compute from neoclouds, cloud
    providers, and managed services. The release covers three benchmarks with initial results from
    CoreWeave, Google, Intel, KRAI, and NVIDIA, and supports automated submission pipelines,
    continuous review tooling, and dynamic result visualization. Results and tooling are at
    endpoints.mlcommons.org. MLCommons says it will deliver MLPerf Endpoints v1.0 later in 2026, with
    more buyer-centric rules and agentic workloads.
