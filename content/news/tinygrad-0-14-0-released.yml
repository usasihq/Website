slug: tinygrad-0-14-0-released
title: tinygrad 0.14.0 released with tool calling in tinygrad.llm and parallel kernel compilation
event_date: 2026-08-24
published_at: 2026-10-13
category: release
summary:
  text: >-
    The tinygrad project published version 0.14.0 on GitHub on August 24, 2026. The release
    notes list improvements to tinygrad.llm, including RDNA3 kernels for Qwen 3.8 27B, a faster
    tokenizer and tool calling support. Kernels are now compiled in parallel by default, and
    Python scalars are now weak dtypes. The notes also say Tensor.training and Tensor.train()
    were removed in favor of a TRAINING ContextVar, and that GPT-OSS 20B was added as an MLPerf
    training benchmark. USASI has not tested this release.
  source_ids: [tinygrad-0-14-0-release]
