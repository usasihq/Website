slug: openai-releases-gpt-5-6-model-family
title: OpenAI releases the GPT-5.6 model family, GPT-5.6 Sol, Terra, and Luna, in its API
event_date: 2026-07-09
published_at: 2026-10-13
category: release
summary:
  text: >-
    OpenAI's API changelog records that on July 9, 2026 it released the GPT-5.6 model family:
    GPT-5.6 Sol for frontier capability, GPT-5.6 Terra for a balance of intelligence and cost, and
    GPT-5.6 Luna for efficient, high-volume workloads. The entry says the gpt-5.6 alias routes
    requests to gpt-5.6-sol, and it lists the Responses, Chat Completions, and Batch endpoints. It
    also says GPT-5.6 adds Programmatic Tool Calling, explicit prompt caching controls, persisted
    reasoning, max reasoning effort, and Pro mode, with Multi-agent orchestration in beta for the
    Responses API. The changelog describes hosted models offered through OpenAI's API; it does not
    describe a release of model weights. USASI has not tested these models.
  source_ids: [openai-api-changelog]
related_organizations: [openai]
