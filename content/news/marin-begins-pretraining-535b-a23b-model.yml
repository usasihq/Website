slug: marin-begins-pretraining-535b-a23b-model
title: Marin begins pretraining Marin 535B-A23B, a mixture-of-experts model
event_date: 2026-09-03
published_at: 2026-10-13
category: research
summary:
  text: >-
    In a launch note dated September 3, 2026, first published on the Open Athena blog and mirrored
    by Marin, Marin said it had started pretraining Marin 535B-A23B a couple of weeks earlier. The
    note describes a mixture-of-experts model with 535 billion total parameters and 23 billion
    active, planned to pretrain for about three months on 18 trillion tokens, and says the team
    ported its infrastructure and training stack from Google TPUs on GCP to NVIDIA GPUs on
    CoreWeave before launch, with post-training to follow. It says the entire run, including architecture, data, and predicted
    loss, is documented on GitHub; it does not give a date or license for releasing the model's
    weights.
