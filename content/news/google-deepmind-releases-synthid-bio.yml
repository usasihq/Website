slug: google-deepmind-releases-synthid-bio
title: Google DeepMind introduces SynthID Bio and open-sources code for watermarking AI-designed proteins
event_date: 2026-09-30
published_at: 2026-10-13
category: research
summary:
  text: >-
    On September 30, 2026 Google DeepMind introduced SynthID Bio, a family of watermarking methods
    for AI-generated protein sequences and 3D structures, which it describes as a proof of concept.
    The repository README says SynthID Bio-sequence adds watermarked sampling to ProteinMPNN, and
    the announcement says SynthID Bio-structure fine-tunes a small part of AlphaFold 3's diffusion
    network so that predicted coordinates carry a detectable signature. Google DeepMind says it is
    publishing a methods paper, open-sourcing the code and in vitro data, and releasing weights to
    the research community. In the public repository, the software is licensed under Apache 2.0,
    the in vitro validation data supporting the paper is licensed under CC BY 4.0, and AlphaFold 3
    model parameters remain under the AlphaFold 3 terms of use. USASI has not tested SynthID Bio.
