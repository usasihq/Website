slug: biohub-esm-3-4-0-adds-esmc-and-esmfold2-support
title: Biohub's esm 3.4.0 package adds full support for ESMC and ESMFold2
event_date: 2026-08-27
published_at: 2026-10-13
category: release
summary:
  text: >-
    Biohub published version 3.4.0 of its esm Python package on August 27, 2026. The release notes
    say it adds full support for ESMC and ESMFold2, a test suite for both, and a compatibility layer
    for the Hugging Face ports of ESMC and ESMFold2, while maintaining support for legacy model
    weights. Biohub's Hugging Face organization hosts ESMC-6B-hf, whose model card describes ESMC as
    a protein language model, says the ESMC 6B model has 6 billion parameters, and says Biohub is
    releasing source code and model weights for ESMC 6B, ESMFold2, and ESMC sparse autoencoders. The repository README says the
    models are available under the MIT license. USASI has not tested this release.
