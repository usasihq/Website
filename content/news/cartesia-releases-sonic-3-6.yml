slug: cartesia-releases-sonic-3-6
title: Cartesia releases Sonic-3.6 text-to-speech with Odia, Urdu, and Hindi-English code-switching
event_date: 2026-08-27
published_at: 2026-10-13
category: release
summary:
  text: >-
    On August 27, 2026 Cartesia announced Sonic-3.6, a text-to-speech model that it says arrived two
    months after Sonic-3.5 and is generally available in its playground and through its API. The
    announcement says Odia and Urdu are added as new languages. It also describes Hinglish support for switching between Hindi and
    English in a single generation, better accent retention for instant voice clones, and an
    optional locale field that controls how dates, times, and numbers are read. The post does not
    describe a release of model weights. USASI has not tested Sonic-3.6.
