slug: inception-releases-mercury-2-5
title: Inception releases Mercury 2.5, a diffusion language model, and previews Mercury Voice
event_date: 2026-09-08
published_at: 2026-10-13
category: release
summary:
  text: >-
    On September 8, 2026 Inception released Mercury 2.5, a diffusion language model (dLLM) that it
    describes as a step up in quality over Mercury 2 with the same low-latency serving
    profile. The announcement lists tunable reasoning, parallel tool calls, and schema-aligned JSON
    among its capabilities and says Mercury models are available through the Inception API,
    Baseten, and OpenRouter. Alongside it, Inception announced previews of Mercury Voice, a dLLM
    optimized for voice agents, and Mercury Router, which routes prompts to other open and closed
    models. In a separate post on September 29, 2026, Inception said Mercury Voice had become
    generally available to enterprise customers through an OpenAI API compatible endpoint. Neither
    post describes a release of model weights. USASI has not tested these models.
  source_ids: [inception-mercury-2-5, inception-mercury-voice]
