slug: google-deepmind-releases-alphaprotein-novo
title: Google DeepMind releases AlphaProtein Novo code and non-commercial generator weights
event_date: 2026-10-05
published_at: 2026-10-13
category: release
summary:
  text: >-
    Google DeepMind published AlphaProtein Novo (AP Novo), a generative diffusion pipeline for de
    novo enzyme design through structural motif scaffolding, in a GitHub repository whose commits
    are dated from October 5, 2026. The README says the diffusion model co-generates protein
    structures and sequences conditioned on a catalytic motif and ligand context, and that it can be
    combined with LigandMPNN sequence redesign and AlphaFold 3 structure prediction; it points to a
    bioRxiv preprint describing the work. The software is licensed under Apache 2.0, but the
    generator weights are downloaded separately under terms of use, last modified October 5, 2026,
    that allow only non-commercial use by, or on behalf of, non-commercial organizations. USASI has
    not tested AlphaProtein Novo.
