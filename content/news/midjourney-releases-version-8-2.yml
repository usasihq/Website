slug: midjourney-releases-version-8-2
title: Midjourney launches its V8.2 image model
event_date: 2026-07-24
published_at: 2026-10-13
category: release
summary:
  text: >-
    On July 24, 2026 Midjourney announced that it was launching its V8.2 image model that day. The
    post says the update focuses on aesthetics, image quality, and personalization, that random
    low-quality results should be much less frequent, and that creating personalization profiles
    for V8.2 draws on a larger and improved pool of images. On August 27, 2026 Midjourney began letting
    everyone test its first V8.2 image edit model, which supports instruction-based editing,
    inpainting, and outpainting. V8.2 is offered through Midjourney's own service; the post does not
    describe a release of model weights. USASI has not tested V8.2.
  source_ids: [midjourney-v8-2, midjourney-v8-edit]
