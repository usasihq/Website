slug: world-labs-introduces-atlas-world-model
title: World Labs introduces Atlas, a world model offered through early access
event_date: 2026-09-01
published_at: 2026-10-13
category: release
summary:
  text: >-
    On September 1, 2026 World Labs introduced Atlas, which it calls its next-generation world model
    and describes as a multimodal autoregressive diffusion transformer pretrained from scratch. The
    announcement says Atlas generates images and videos from one or more images with camera
    control, reconstructs real-world scenes from one to dozens of input images with explicit 3D
    outputs, models space and time from input videos for Real-to-Sim robotics workflows, and
    generates images and 360 panoramas from text. World Labs says Atlas will power future versions of
    its Marble product, and the page offers a request form for early access rather than a public
    release or downloadable weights. USASI has not tested Atlas.
