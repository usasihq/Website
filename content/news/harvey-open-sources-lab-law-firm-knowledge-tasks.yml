slug: harvey-open-sources-lab-law-firm-knowledge-tasks
title: Harvey open-sources a synthetic law firm knowledge expansion of its Legal Agent Benchmark
event_date: 2026-08-07
published_at: 2026-10-13
category: research
summary:
  text: >-
    On August 7, 2026 Harvey announced that it is open-sourcing an expansion of LAB, its Legal Agent
    Benchmark: a synthetic law firm called Calderwood & Harkness whose files cover 266 matters for 46
    fictional clients across 15 practice areas. The expansion has 250 tasks that test retrieval and
    reasoning over the firm's documents, and an LLM judge scores each task against a per-task rubric. The
    tasks are published in the harveyai/harvey-labs repository on GitHub. USASI has not run the
    benchmark.
