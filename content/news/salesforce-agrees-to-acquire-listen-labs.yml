slug: salesforce-agrees-to-acquire-listen-labs
title: Salesforce signs a definitive agreement to acquire Listen Labs; the deal has not yet closed
event_date: 2026-09-29
published_at: 2026-10-13
category: acquisition
summary:
  text: >-
    On September 29, 2026 Salesforce announced a definitive agreement to acquire Listen Labs, an
    AI-powered customer research and human simulation platform whose AI agents design studies, conduct
    research, and synthesize insights. Salesforce says the deal would complement Marketing Cloud, Service Cloud, and its
    wider AI portfolio. Closing is expected in the fourth quarter of Salesforce's fiscal year 2027,
    subject to customary closing conditions including required regulatory clearance. The announcement
    does not disclose financial terms.
