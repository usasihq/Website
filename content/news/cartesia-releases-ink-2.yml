slug: cartesia-releases-ink-2
title: Cartesia releases Ink-2, a speech-to-text model for real-time voice agents
event_date: 2026-07-09
published_at: 2026-10-13
category: release
summary:
  text: >-
    On July 9, 2026 Cartesia released Ink-2, a speech-to-text model built for real-time voice
    agents. The announcement says Ink-2 has built-in semantic endpointing that uses meaning rather
    than silence to decide when a speaker's turn is over, and that it natively emits turn.start,
    turn.eager_end, and turn.end events without an external voice activity detector. Cartesia also
    says it worked on recognizing structured entities such as phone numbers, email addresses, and
    dates. Ink-2 is available through Cartesia's playground and API and through LiveKit, Vapi, and
    Pipecat; the post does not describe a release of model weights. USASI has not tested Ink-2.
  source_ids: [cartesia-ink-2]
