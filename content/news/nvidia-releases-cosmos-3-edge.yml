slug: nvidia-releases-cosmos-3-edge
title: NVIDIA releases Cosmos3-Edge, a 4B omnimodal world model, under OpenMDW-1.1
event_date: 2026-07-20
published_at: 2026-10-13
category: release
summary:
  text: >-
    NVIDIA's Hugging Face model card gives July 20, 2026 as the release date of Cosmos3-Edge, a
    4B-parameter model in the Cosmos3 collection, on both Hugging Face and GitHub. The card
    describes Cosmos3 as omnimodal world models built on a Mixture-of-Transformers architecture
    that take text, image, video and action-trajectory inputs and generate text, images, video and
    action outputs for physical AI uses such as robotics and autonomous vehicles. The model is
    released under OpenMDW-1.1 and is described as ready for commercial and non-commercial use. A
    note on the card says the generator checkpoint and runtime defaults were updated on August
    25, 2026. USASI has not tested the model.
