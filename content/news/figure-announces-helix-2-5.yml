slug: figure-announces-helix-2-5
title: Figure announces Helix 2.5, a humanoid control model pretrained on its Index dataset
event_date: 2026-09-17
published_at: 2026-10-13
category: research
summary:
  text: >-
    On September 17, 2026, Figure announced Helix 2.5, a neural network for whole-body control of a
    humanoid robot on long tasks in homes it has not visited. Figure says Helix 2.5 was pretrained
    from random initialization entirely on Index, its dataset of human behavior, and that a single
    base model was then adapted to tidying living rooms, folding towels, and making beds. Figure
    tested these behaviors in 30 Bay Area homes in which it says no data had been collected. The
    announcement does not say whether Helix 2.5's weights or code will be released.
