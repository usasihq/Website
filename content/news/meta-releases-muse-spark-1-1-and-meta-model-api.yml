slug: meta-releases-muse-spark-1-1-and-meta-model-api
title: Meta releases Muse Spark 1.1 and opens the Meta Model API in public preview
event_date: 2026-07-09
published_at: 2026-10-13
category: release
summary:
  text: >-
    On July 9, 2026 Meta Superintelligence Labs introduced Muse Spark 1.1, which the announcement
    describes as a multimodal reasoning model built for agentic tasks and an upgrade over Muse Spark.
    Meta says the model is available in "Thinking" mode in the Meta AI app and on meta.ai, and that
    developers can reach it through the Meta Model API, which the post introduces as a public preview.
    The post lists a 1-million-token context window, computer use across multiple applications, and the
    ability to work as a main agent that delegates to parallel subagents. It does not say that the
    weights are released or give license terms. USASI has not tested Muse Spark 1.1.
  source_ids: [meta-muse-spark-1-1-blog]
