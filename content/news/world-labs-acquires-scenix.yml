slug: world-labs-acquires-scenix
title: World Labs announces that robotics company SceniX is joining it
event_date: 2026-07-21
published_at: 2026-10-13
category: acquisition
summary:
  text: >-
    On July 21, 2026 World Labs announced that SceniX, a robotics company, is joining World Labs;
    the post is titled "World Labs Acquires SceniX". World Labs says robotics is where spatial
    intelligence becomes physical and that it expects the two teams' technical strengths to be
    complementary, and it says it will share more later about the technologies SceniX has built.
    The announcement gives no financial terms. On September 28, 2026 World Labs announced that it is
    joining AMD, an agreement USASI covered separately.
