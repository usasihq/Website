slug: open-webui-0-11-0-redesigns-interface-adds-sub-agents
title: Open WebUI 0.11.0 ships a redesigned interface and optional sub-agents
event_date: 2026-07-27
published_at: 2026-10-13
category: release
summary:
  text: >-
    Open WebUI published version 0.11.0 on GitHub on July 27, 2026. The release notes say the
    interface has been visually rebuilt, from the chat view to the admin panel. They also list
    sub-agents, which administrators can enable through an `ENABLE_SUBAGENTS` setting so that a
    model can hand parts of a task to background helper agents that report results back into the
    chat. Other listed additions include chat forking, chat timers, webhook notification targets,
    and LDAP group synchronization. USASI has not tested this release.
