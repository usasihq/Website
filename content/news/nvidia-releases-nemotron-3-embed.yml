slug: nvidia-releases-nemotron-3-embed
title: NVIDIA releases Nemotron 3 Embed multilingual text embedding models in 1B and 8B sizes
event_date: 2026-07-16
published_at: 2026-10-13
category: release
summary:
  text: >-
    NVIDIA's Hugging Face model cards give July 16, 2026 as the release date of
    Nemotron-3-Embed-8B-BF16 and Nemotron-3-Embed-1B-BF16, text embedding models for retrieval and
    semantic similarity in retrieval-augmented generation systems. The cards say the models were
    evaluated across 34 languages and output 4096-dimensional (8B) and 2048-dimensional (1B)
    vectors that can be shortened by slicing and re-normalizing. Both are licensed under
    OpenMDW-1.1, and the 8B card says it is built with Mistral AI's Ministral-3-8B-Instruct-2512,
    released under Apache 2.0. USASI has not tested the models.
  source_ids: [nemotron-3-embed-8b-card, nemotron-3-embed-1b-card]
