slug: liquid-ai-releases-lfm2-5-2-6b
title: Liquid AI releases LFM2.5-2.6B, an open-weight on-device model trained for agentic workloads
event_date: 2026-08-04
published_at: 2026-10-13
category: release
summary:
  text: >-
    Liquid AI announced LFM2.5-2.6B on August 4, 2026, describing it as a 2.6B-parameter model
    trained for agentic workloads such as planning, calling tools, and multi-step tasks on devices
    including phones and CPUs. The base model (LFM2.5-2.6B-Base) and the post-trained model
    (LFM2.5-2.6B) were published on Hugging Face. The model card lists a context length of 131,072
    tokens and says the model is not recommended for agentic coding and knowledge-heavy tasks. The
    weights are released under the LFM Open License v1.0. USASI has not
    tested this model.
