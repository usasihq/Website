slug: arc-institute-releases-pie-perturbation-model
title: Arc Institute releases PIE, a model for predicting cell responses to perturbations
event_date: 2026-10-05
published_at: 2026-10-13
category: research
summary:
  text: >-
    On October 5, 2026, Arc Institute announced PIE ("Perturbation is Everything"), a model that
    predicts how cells respond to perturbations in contexts it has not seen by drawing on curated
    biological databases such as Cellosaurus, NCBI, Gene Ontology, DepMap, and PubChem. Arc says the
    full codebase, including training and evaluation pipelines, is on GitHub, with model checkpoints
    and processed datasets on Hugging Face and a bioRxiv preprint. The repository's README says PIE
    is released under the Creative Commons Attribution-NonCommercial-ShareAlike 4.0 license, which
    allows non-commercial use with attribution. USASI has not tested PIE.
