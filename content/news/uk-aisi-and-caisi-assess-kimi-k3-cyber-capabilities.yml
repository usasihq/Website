slug: uk-aisi-and-caisi-assess-kimi-k3-cyber-capabilities
title: UK AISI and NIST's CAISI publish a preliminary assessment of Kimi K3's cyber capabilities
event_date: 2026-07-23
published_at: 2026-10-13
category: research
summary:
  text: >-
    On July 23, 2026, NIST published a joint preliminary evaluation by the UK AI Security Institute
    and the Center for AI Standards and Innovation (CAISI) of Kimi K3, a model Moonshot AI released
    on July 16, 2026. The page describes a small set of public and private benchmarks and reports
    results on ExploitBench, a public exploit-development benchmark developed by Carnegie Mellon
    University, and on "The Last Ones," a simulated corporate network attack range, comparing Kimi
    K3 with U.S. and PRC models.
    It also reports that Kimi K3's safeguards did not prevent it from attempting cyber exploit
    development or offensive cyber operations during the evaluations. The authors describe the
    results as preliminary.
