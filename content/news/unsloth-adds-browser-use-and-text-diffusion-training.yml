slug: unsloth-adds-browser-use-and-text-diffusion-training
title: Unsloth release adds Browser use, Qwen-Image-2.1-Turbo, and text-diffusion LLM training
event_date: 2026-10-12
published_at: 2026-10-13
category: release
summary:
  text: >-
    On October 12, 2026 Unsloth published release v0.1.906-beta on its GitHub repository. The
    release notes say models can now use a browser in Unsloth, opening, reading, and interacting
    with pages in their own tab, and that Unsloth asks the user before the model signs in, posts a
    form, or presses a button that buys, sends, or deletes. The notes also list running
    Qwen-Image-2.1-Turbo from the Images page, training text-diffusion LLMs with a new
    DiffusionTrainer, faster MoE GGUFs that are larger than available VRAM on NVIDIA and AMD GPUs,
    and speculative decoding for MLX on Mac. USASI has not tested this release.
  source_ids: [unsloth-v0-1-906-beta]
