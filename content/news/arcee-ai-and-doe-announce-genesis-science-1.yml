slug: arcee-ai-and-doe-announce-genesis-science-1
title: Arcee AI announces Genesis-Science-1, an open science model being built with the Department of Energy
event_date: 2026-07-22
published_at: 2026-10-13
category: research
summary:
  text: >-
    Arcee AI wrote on July 22, 2026 that it and the U.S. Department of Energy had announced the
    development of Genesis-Science-1 (GS1), describing it as an open model for scientific research
    built with DOE and its national laboratories through the Genesis Mission. Arcee says GS1 is
    built on its next generation of Trinity models and will be a trillion-parameter-class language
    model. The weights have not been
    released: Arcee says GS1 will be released openly later in the year with the weights, a technical
    report, and public demonstrations. The post does not state a license.
  source_ids: [arcee-gs1-blog]
