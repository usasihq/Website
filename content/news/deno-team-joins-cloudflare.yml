slug: deno-team-joins-cloudflare
title: The Deno team joins Cloudflare to work on self-hosted Workers and Durable Objects
event_date: 2026-10-09
published_at: 2026-10-11
category: acquisition
summary:
  text: >-
    On October 9, 2026 Cloudflare and Deno announced that the Deno team is joining Cloudflare. The
    Cloudflare post, filed under its Acquisitions tag, says the team will work to simplify
    self-hosting Workers and Durable Objects and that Cloudflare's workerd and Deno's celld are being
    merged. Deno's post says the company will support the Deno runtime for another year with monthly
    bug-fix and security releases and then end its own development of the runtime, which will remain
    open source; Deno Deploy will keep operating for six months before shutting down, and JSR will
    continue with its infrastructure moving to Cloudflare. Neither post states deal terms or a
    closing date.
  source_ids: [cloudflare-deno-blog, deno-cloudflare-blog]
