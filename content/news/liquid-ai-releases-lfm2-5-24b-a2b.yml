slug: liquid-ai-releases-lfm2-5-24b-a2b
title: Liquid AI releases LFM2.5-24B-A2B, an open-weight mixture-of-experts model for on-device agents
event_date: 2026-10-13
published_at: 2026-10-15
category: release
summary:
  text: >-
    Liquid AI announced LFM2.5-24B-A2B on October 13, 2026, describing it as a reasoning model
    built for fast, private agents on-device and as the largest and final model in the LFM2.5
    family. The release includes a base model (LFM2.5-24B-A2B-Base) and a post-trained model
    (LFM2.5-24B-A2B), published as open weights on Hugging Face. The model card lists 24.0B total
    parameters with 2.45B active per token and a context length of 131,072 tokens, and says the
    model is not recommended for knowledge-heavy tasks on its own. The weights are released under
    the LFM Open License v1.0. USASI has not tested this model.
