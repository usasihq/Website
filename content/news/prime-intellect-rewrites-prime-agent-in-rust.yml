slug: prime-intellect-rewrites-prime-agent-in-rust
title: Prime Intellect releases a Rust rewrite of Prime Agent with Windows support in beta
event_date: 2026-10-09
published_at: 2026-10-12
category: release
summary:
  text: >-
    On October 9, 2026 Prime Intellect said on its blog that it had shipped Prime Agent rewritten
    from the ground up in Rust. The post describes Prime Agent as a long-running daemon with a
    worker process per session. With the rewrite, Prime Intellect is also releasing native Windows
    support, in beta, and installation through Homebrew. The post says Prime Agent remains open
    source and links to its GitHub repository; it does not name a license, and USASI has not
    confirmed one or tested the software.
