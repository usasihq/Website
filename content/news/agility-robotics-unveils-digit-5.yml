slug: agility-robotics-unveils-digit-5
title: Agility Robotics unveils Digit 5, a humanoid robot designed to work near people
event_date: 2026-09-15
published_at: 2026-10-13
category: release
summary:
  text: >-
    Agility Robotics unveiled Digit 5, its next-generation humanoid robot, on September 15, 2026.
    Agility says Digit 5 continuously monitors for people and responds by autonomously avoiding,
    stopping, or assuming a seated position, with an independent safety controller overseeing those
    responses, so that it can work in close proximity to people without the physical safety barriers
    required by traditional automation. The company expects early access to begin in the first half
    of 2027 and general availability for manufacturing, warehouse, and distribution operators by the
    end of 2027. The press release carries forward-looking-statement disclosures for Agility's
    proposed business combination with Churchill Capital Corp XI.
