slug: hermes-agent-0-20-0-adds-voice-and-a2a
title: Nous Research releases Hermes Agent 0.20.0 with conversational voice and A2A v1.0 support
event_date: 2026-08-03
published_at: 2026-10-13
category: release
summary:
  text: >-
    Nous Research published Hermes Agent v0.20.0 (tagged v2026.8.3) on GitHub on August 3, 2026,
    calling it "The Herald Release." The release notes list streaming conversational voice with
    barge-in and on-device wake words, and a new bundled plugin that implements the Agent-to-Agent
    (A2A) protocol v1.0 so Hermes can discover, talk to, and be driven by other A2A-compatible
    agents. The notes also list signed outbound webhooks, grounded research with citations and
    fact-checking, and a plugin SDK for the desktop app. USASI has not tested this release.
  source_ids: [hermes-agent-v0-20-0-release]
related_organizations: [nous-research]
related_artifacts: [hermes-agent, a2a-protocol]
