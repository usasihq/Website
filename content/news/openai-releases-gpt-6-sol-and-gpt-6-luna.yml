slug: openai-releases-gpt-6-sol-and-gpt-6-luna
title: OpenAI releases GPT-6 Sol and GPT-6 Luna in its API
event_date: 2026-09-22
published_at: 2026-10-13
category: release
summary:
  text: >-
    On September 22, 2026 OpenAI released GPT-6 Sol (gpt-6-sol) and GPT-6 Luna (gpt-6-luna),
    according to its API changelog, which describes them as reasoning models that accept text and
    image inputs and generate text through the Responses and Chat Completions APIs. OpenAI's
    announcement, as listed in its news feed, presents them as two models with different balances
    of capability and cost. In a separate changelog entry dated September 25, OpenAI says it fixed
    a bug in image encoding that degraded image understanding in both models, and recommends
    rerunning evaluations for use cases with image inputs. Both are hosted models; no release of
    weights is described. USASI has not tested them.
  source_ids: [openai-api-changelog, openai-news-feed]
