slug: nvidia-launches-open-agent-safety-platform
title: NVIDIA launches Open Agent Safety Platform, pairing open-source OpenShell with a Sentry reference design
event_date: 2026-09-28
published_at: 2026-10-13
category: release
summary:
  text: >-
    NVIDIA announced the NVIDIA Open Agent Safety Platform on September 28, 2026, describing it
    as an open software platform and reference system design to strengthen AI security from
    agent testing to deployment. It consists of NVIDIA OpenShell, open-source runtime software
    that traces agent actions and enforces policy, and NVIDIA Sentry, a reference design for an
    out-of-band watchdog that runs on BlueField-4 DPUs and can quarantine agents that attempt to
    move outside their boundaries. NVIDIA says the platform software, including OpenShell and
    skills, is available through its developer resources page and GitHub, and describes Sentry
    as built on NVIDIA DOCA software. USASI has not tested OpenShell.
  source_ids: [nvidia-oasp-press-release]
