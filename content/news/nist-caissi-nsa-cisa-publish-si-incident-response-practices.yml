slug: nist-caissi-nsa-cisa-publish-si-incident-response-practices
title: NIST CAISSI, NSA, and CISA publish voluntary incident response practices for super intelligence training and evaluation
event_date: 2026-10-16
published_at: 2026-10-17
category: policy
summary:
  text: >-
    On October 16, 2026 NIST's Center for Advancing Innovation and Standards for Super Intelligence
    (CAISSI), the National Security Agency's Super Intelligence Security Center, and the
    Cybersecurity and Infrastructure Security Agency published ten key practices for managing
    potential incidents during super intelligence (SI) training and evaluation. NIST describes the
    document as voluntary and says it focuses in particular on incidents in which SI agents take
    significant uninstructed actions that compromise operator policies, controls, or security
    measures. The practices are divided into five stages: preparation, detection, response,
    recovery, and reporting, and NIST says they are grounded in existing frameworks including NIST
    SP 800-61r3. NIST says further work on agentic SI training and evaluation will be considered in
    future phases.
