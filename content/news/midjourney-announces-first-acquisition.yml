slug: midjourney-announces-first-acquisition
title: Midjourney announces its first acquisition, Co–Star
event_date: 2026-07-23
published_at: 2026-10-13
category: acquisition
summary:
  text: >-
    On July 23, 2026 Midjourney announced on its updates blog that its first acquisition is
    Co–Star. The post says Co–Star's founder and team will join Midjourney to help build a broader
    organization around product and design, while Co–Star itself will remain entirely under its
    founder's control and direction. The post links the move to plans for what it calls a very
    unusual research lab, starting with Midjourney Medical, and to half a dozen projects it expects
    to announce over the following six months. The post does not give financial terms or say
    whether the transaction has closed.
