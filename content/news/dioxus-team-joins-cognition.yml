slug: dioxus-team-joins-cognition
title: The Dioxus team joins Cognition, which says it will keep supporting Dioxus open source work
event_date: 2026-09-10
published_at: 2026-10-13
category: acquisition
summary:
  text: >-
    Cognition announced on September 10, 2026 that Jonathan Kelley and the Dioxus team are joining
    Cognition; the post does not describe deal terms or call it an acquisition. Cognition says it will
    continue to support Dioxus' open source work and plans to keep supporting Dioxus, Blitz, Taffy,
    and Subsecond, with more investment in Dioxus-Native and Blitz. The post says the team will also
    work on Devin's virtual machine, computer-use skills, and testing capabilities.
