slug: cloudflare-open-sources-cloudflare-os
title: Cloudflare open-sources Cloudflare OS, a platform for agent workspaces and internal apps
event_date: 2026-08-05
published_at: 2026-10-13
category: release
summary:
  text: >-
    On August 5, 2026 Cloudflare announced that it is open-sourcing a new version of Cloudflare OS, which
    it describes as an open platform for agents, apps, and work that combines an agent workspace, a
    security and governance framework, and a platform for modifiable apps. The core code is in the
    cloudflare/cloudflare-os repository on GitHub, with a separate starter repository for deployments.
    Cloudflare says agents start with no access and that Gatekeepers, which are Workers, handle OAuth,
    hold credentials, enforce policy, and record reads, while every inference call runs through
    Cloudflare AI Gateway. Cloudflare says it is working on bringing Cloudflare OS to the Cloudflare
    dashboard as a fully managed product, and the post does not name the license. USASI has not tested Cloudflare OS.
  source_ids: [cloudflare-os-blog]
