slug: google-makes-gemini-4-argon-available-to-developers-and-subscribers
title: Google makes Gemini 4 Argon available to developers and to Google AI Pro and Ultra subscribers
event_date: 2026-10-13
published_at: 2026-10-15
category: release
summary:
  text: >-
    On October 13, 2026 Google said developers can start building with Gemini 4 Argon on the paid
    tier of the Gemini API in Google AI Studio and Android Studio, and that Google AI Ultra
    subscribers can try the model in AI Studio and in Google Antigravity. A separate post the same
    day says Google AI Pro and Ultra subscribers can now access Gemini 4 Argon in the Gemini app;
    it does not list countries. Google first announced the model on September 30, 2026 with a
    limited rollout to cyber defenders. Neither post mentions released weights; access is through
    hosted products and the API. USASI has not tested Gemini 4 Argon.
  source_ids: [google-build-with-gemini-4-argon, google-gemini-app-argon-availability]
