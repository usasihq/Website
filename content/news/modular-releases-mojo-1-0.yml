slug: modular-releases-mojo-1-0
title: Modular releases Mojo 1.0 alongside MAX 26.5
event_date: 2026-08-11
published_at: 2026-10-13
category: release
summary:
  text: >-
    Modular released Mojo 1.0 with its Modular 26.5 release on August 11, 2026. Modular's
    announcement says that during the 1.x timeframe changes should be primarily additive, and the
    GitHub release notes say Modular has started marking a small set of standard library APIs as
    stable. The notes warn of more breaking changes than usual, saying nearly every one ships with
    a deprecated alias and a compiler fix-it. In MAX 26.5, most GPU programming APIs moved out of
    the Mojo standard library into a new top-level max package, and Apple silicon GPU support was
    extended back to M1 devices. USASI has not tested this release.
  source_ids: [modular-26-5-blog, modular-26-5-release]
