slug: nvidia-launches-open-secure-ai-alliance
title: NVIDIA and inaugural partners launch the Open Secure AI Alliance for open AI security tools
event_date: 2026-07-27
published_at: 2026-10-13
category: governance
summary:
  text: >-
    NVIDIA announced the Open Secure AI Alliance on July 27, 2026, describing it as an effort to
    develop and share open technologies, techniques and tools to safeguard software and AI agents.
    The inaugural partners NVIDIA lists include Cisco, Dell Technologies, HPE, Intel, Anyscale,
    Crusoe, Fireworks AI and the Linux Foundation, and NVIDIA says the alliance builds on the Linux
    Foundation's Akrites initiative and OpenSSF community work. NVIDIA says it is contributing
    open models, model weights, data and agent harness research, and that its open-source NVIDIA
    Labs Object-Oriented Agent (NOOA) research framework is available on GitHub. NVIDIA also names
    HPE's contributions to the SPIFFE/SPIRE identity framework among the alliance's work.
