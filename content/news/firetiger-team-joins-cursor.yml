slug: firetiger-team-joins-cursor
title: The Firetiger team joins Cursor to work on agents for software in production
event_date: 2026-08-13
published_at: 2026-10-13
category: acquisition
summary:
  text: >-
    Cursor announced on August 13, 2026 that the team behind Firetiger, a company that builds agents
    that work on software once it reaches production, is joining Cursor. The post says Firetiger's
    work will show up across Cursor as it expands from writing code to running it in production. It
    does not state deal terms or say whether Firetiger's standalone product will continue.
