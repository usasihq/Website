slug: salesforce-agrees-to-acquire-braze
title: Salesforce signs a definitive agreement to acquire Braze
event_date: 2026-10-20
published_at: 2026-10-20
category: acquisition
summary:
  text: >-
    On October 20, 2026 Salesforce announced that it has entered into a definitive agreement to
    acquire Braze, a Nasdaq-listed customer engagement platform. Salesforce says Braze is expected
    to strengthen Marketing Cloud's cross-channel personalization and that Braze's real-time
    engagement and AI decisioning capabilities are expected to complement its Data 360, Customer
    360, Agentforce and SIForce layers. The acquisition has not closed: Salesforce says it is
    expected to close in its fiscal year 2028, subject to customary closing conditions including
    approval by Braze's shareholders and required regulatory approvals.
