slug: coreweave-launches-forge-with-weights-and-biases
title: CoreWeave launches Forge, bringing Weights & Biases Models into one AI development platform
event_date: 2026-09-30
published_at: 2026-10-01
category: release
summary:
  text: >-
    CoreWeave announced CoreWeave Forge on September 30, 2026, a development platform that brings
    training, inference, evaluation, and agent development into one environment. Forge includes
    Weights & Biases Models for tracking and comparing experiments. Weights & Biases, which
    CoreWeave acquired in 2025, says W&B software-as-a-service accounts now sign in through
    CoreWeave Forge and that self-hosted and dedicated deployments are unchanged. The open-source
    wandb client library remains available under the MIT License.
