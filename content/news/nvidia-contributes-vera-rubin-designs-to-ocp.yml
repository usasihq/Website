slug: nvidia-contributes-vera-rubin-designs-to-ocp
title: NVIDIA contributes Vera Rubin rack and compute tray designs to the Open Compute Project
event_date: 2026-10-12
published_at: 2026-10-13
category: governance
summary:
  text: >-
    In an October 12, 2026 blog post tied to the OCP Global Summit, NVIDIA said it contributed Vera
    Rubin rack and compute tray designs to the Open Compute Project through its MGX architecture.
    The post says NVIDIA joined AMD, Google, and Meta at OCP to publish a new open specification,
    and describes the Open Data Center Specification v0.7 as a blueprint for AI factory facility
    design. It says the OCP Grid Resilience Specification was published by Google, Meta, Microsoft,
    and NVIDIA, and that NVIDIA expanded DSX OS with open-source components for configuring
    networks and validating clusters, without naming a license for them. USASI has not reviewed the contributed designs or specifications.
