slug: google-deepmind-launches-alphagenome-atlas
title: Google DeepMind launches AlphaGenome Atlas, precomputed predictions for human DNA variants
event_date: 2026-09-08
published_at: 2026-10-13
category: research
summary:
  text: >-
    On September 8, 2026 Google DeepMind introduced AlphaGenome Atlas, a resource of precomputed
    AlphaGenome predictions for the effects of single-nucleotide variants, covering every possible
    single-letter change in the human genome. The announcement says Atlas is detailed in a paper and
    is available through a free website portal for non-commercial academic research, through the
    AlphaGenome API, and as a skill in Google Antigravity, with commercial use on Google Cloud
    planned. Alongside it, Google DeepMind released the AlphaGenome Variant Impact (AVI) score,
    which combines AlphaGenome and AlphaMissense predictions into a single number per variant;
    Atlas also includes AVI feature attributions and a collection of recurrent DNA sequence motifs.
    USASI has not tested AlphaGenome Atlas.
