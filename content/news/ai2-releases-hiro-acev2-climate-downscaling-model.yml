slug: ai2-releases-hiro-acev2-climate-downscaling-model
title: Ai2 releases HiRO-ACEv2, an updated climate emulator and 3 km downscaling system, under Apache 2.0
event_date: 2026-10-14
published_at: 2026-10-16
category: research
summary:
  text: >-
    Ai2 announced HiRO-ACEv2 on October 14, 2026 as the newest update to its High Resolution
    Output Ai2 Climate Emulator system, pairing an updated ACE model with a new downscaling model,
    HiROv2. The model card describes HiROv2 as a diffusion model that generates 3 km
    precipitation, 10 m winds, and sea level pressure from coarse ACE output, and releases the
    ACE2S-X-SHiELD and HiROv2 checkpoints with inference configs under Apache 2.0 for research and
    educational use. The card says the model was not trained or tested outside 66S to 70N, is not
    expected to generalize to climates outside its 10-year training data, and that ACE2S-X-SHiELD
    is not suitable for weather forecasting. USASI has not tested this model.
  source_ids: [ai2-hiro-acev2-blog, hiro-acev2-card]
