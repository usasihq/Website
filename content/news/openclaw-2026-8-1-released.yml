slug: openclaw-2026-8-1-released
title: OpenClaw 2026.8.1 adds conversation search, remote sessions, and masked credential requests
event_date: 2026-08-31
published_at: 2026-10-13
category: release
summary:
  text: >-
    The OpenClaw project published OpenClaw 2026.8.1 on GitHub on August 31, 2026. The release notes
    highlight search across visible conversation text, sessions that run on paired devices or cloud
    workers and move the session workspace with them, and interactive widgets that can be pinned to
    session dashboards. They also describe private credential requests, which let an agent ask for a
    credential through a masked prompt without putting its value in chat or model context. The notes
    advise backing up configuration and state before updating. USASI has not tested this release.
