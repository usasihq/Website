slug: nvidia-releases-cuda-python-1-0
title: NVIDIA releases CUDA Python 1.0 with semantic versioning commitments
event_date: 2026-08-25
published_at: 2026-10-13
category: release
summary:
  text: >-
    NVIDIA announced CUDA Python 1.0 on its technical blog on August 25, 2026, saying it released
    the milestone with CUDA 13.3 and that Python is now a supported way to use the CUDA platform.
    The post says 1.0 is a milestone rather than a single package version: components such as
    cuda.core 1.0.0, cuda.compute 1.0.0 and nvmath-python 1.0 are versioned independently, and what
    changes with 1.0 is a commitment to semantic versioning. NVIDIA notes that some newer pieces,
    including the Numba CUDA MLIR kernel generator, are not yet covered by that commitment. USASI
    has not tested these libraries.
