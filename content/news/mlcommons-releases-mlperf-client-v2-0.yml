slug: mlcommons-releases-mlperf-client-v2-0
title: MLCommons releases MLPerf Client v2.0 with image generation and agentic AI tests
event_date: 2026-08-18
published_at: 2026-10-13
category: release
summary:
  text: >-
    MLCommons released version 2.0 of MLPerf Client, its benchmark for running AI workloads locally
    on PCs, on August 18, 2026. The release adds an image generation category, with Flux.2 klein 4B
    as an experimental test, and an agentic AI category with Software Engineering Agent and Data
    Analyst Agent scenarios that break end-to-end results into LLM inference and tool execution
    time. Phi 4 Mini Instruct replaces Phi 3.5 mini instruct in the required LLM workloads, and Qwen
    3 8B is added as an experimental test. MLCommons says v2.0 is free to download for Windows,
    macOS, and Linux from GitHub. USASI has not tested MLPerf Client.
