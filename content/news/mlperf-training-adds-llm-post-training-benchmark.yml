slug: mlperf-training-adds-llm-post-training-benchmark
title: MLPerf Training adds an LLM post-training benchmark, starting with round v6.1
event_date: 2026-09-24
published_at: 2026-10-13
category: release
summary:
  text: >-
    MLCommons announced on September 24, 2026 that MLPerf Training is adding an LLM post-training
    benchmark, beginning with the v6.1 submission round in October 2026. The benchmark reports the
    wall-clock time a system needs to reach a quality target when post-training Qwen3.5-397B-A17B
    with reinforcement learning with verifiable rewards, using Group Relative Policy Optimization, on
    Python software engineering problems from the R2E-Gym dataset. Agents work in sandboxed Linux
    containers, and the specification and reference implementation are in the mlcommons/training
    repository.
