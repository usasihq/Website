slug: linux-foundation-launches-x402-foundation
title: Linux Foundation announces the operational launch of the x402 Foundation for agent payments
event_date: 2026-07-14
published_at: 2026-10-13
category: governance
summary:
  text: >-
    On July 14, 2026 the Linux Foundation announced the operational launch of the x402 Foundation, an
    open-governance body formed to steward the x402 protocol. The press release describes x402 as an
    open standard for internet-native payments over HTTP, contributed by Coinbase, that lets AI agents,
    APIs, and applications send and receive payments. It says the foundation is now fully active
    under formal, open governance and lists premier members including Amazon Web Services, Cloudflare,
    Coinbase, Google, Mastercard, Stripe, and Visa.
