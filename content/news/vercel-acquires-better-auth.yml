slug: vercel-acquires-better-auth
title: Vercel announces it is acquiring Better Auth; the authentication library stays MIT-licensed
event_date: 2026-07-07
published_at: 2026-10-13
category: acquisition
summary:
  text: >-
    On July 7, 2026 Vercel announced that it is acquiring Better Auth, the company behind the open-source
    TypeScript authentication library of the same name. Vercel says the library remains free and open
    source under the MIT license and keeps its name, and that the team will continue to lead development
    with the same open contribution model and community governance. Better Auth's founder and core team
    are joining Vercel, and Vercel says the team will continue its Agent Auth work, which gives each
    agent its own identity, bringing agent identity to Vercel Connect and eve. The post does not say whether the deal has closed and does not disclose
    financial terms.
