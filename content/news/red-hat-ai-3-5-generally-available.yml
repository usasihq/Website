slug: red-hat-ai-3-5-generally-available
title: Red Hat AI 3.5 becomes generally available with EvalHub and wider llm-d support
event_date: 2026-09-09
published_at: 2026-10-13
category: release
summary:
  text: >-
    Red Hat announced on September 9, 2026 that Red Hat AI 3.5 is generally available, including as part
    of Red Hat AI Factory with NVIDIA. The release makes EvalHub generally available for safety
    benchmarking and compliance reporting before deployment, shows Garak results on evaluated catalog
    models, integrates NeMo Guardrails to intercept malicious tool calls, and adds AutoRAG and observability
    features such as per-user token metering and MLflow agentic tracing. Red Hat says llm-d distributed
    inference now extends beyond OpenShift to third-party Kubernetes services, generally available on
    CoreWeave CKS and Microsoft Azure, with Amazon EKS in technology preview. USASI has not tested Red
    Hat AI 3.5.
