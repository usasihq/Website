slug: cline-introduces-cline-desktop
title: Cline introduces Cline Desktop, an early desktop app for running Cline agent sessions
event_date: 2026-09-14
published_at: 2026-10-13
category: release
summary:
  text: >-
    Cline introduced Cline Desktop on September 14, 2026, describing it as an early version of its
    open-source app for open-weight models. The post says the app is a workspace for running agent
    sessions in parallel, scheduling recurring tasks, and extending agents through a Marketplace, and
    that it uses the same Cline harness, rebuilt around the Cline SDK. The beta is offered for Mac and
    Windows; the post says the Mac app is fully open source, like the extension and CLI. Sessions can
    be started in the CLI or extension and continued in the desktop app. USASI has not tested this
    app.
  source_ids: [cline-desktop-blog]
