slug: salesforce-announces-koa-crm-reasoning-model
title: Salesforce and NVIDIA announce Koa, a CRM reasoning model post-trained from NVIDIA Nemotron 3 Super
event_date: 2026-09-15
published_at: 2026-10-13
category: release
summary:
  text: >-
    On September 15, 2026 Salesforce and NVIDIA announced Koa, which it calls its first CRM reasoning model, built to
    help Agentforce agents reason through multistep workflows and use the right tools. Salesforce says
    Koa is a post-trained version of NVIDIA Nemotron 3 Super, trained with supervised fine-tuning and
    reinforcement learning on a proprietary synthetic dataset, and that no customer data was used in
    training. Koa is available to select pilot customers in Agentforce, with general availability
    expected in winter 2026 in U.S. regions. Salesforce says it controls the model weights and runs Koa
    within its own infrastructure as a Salesforce-hosted option; the announcement does not say that the
    weights will be released. USASI has not tested Koa.
  source_ids: [salesforce-koa-release]
related_organizations: [salesforce, nvidia]
related_artifacts: [nemotron]
