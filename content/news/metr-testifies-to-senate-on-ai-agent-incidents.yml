slug: metr-testifies-to-senate-on-ai-agent-incidents
title: METR's president testifies to a Senate subcommittee on AI agent incidents
event_date: 2026-09-30
published_at: 2026-10-13
category: policy
summary:
  text: >-
    On September 30, 2026, METR President Chris Painter testified before the Senate Homeland
    Security and Governmental Affairs Subcommittee on Disaster Management, District of Columbia, and
    Census at a hearing titled "Rogue AI: Securing the Homeland Against AI Agent Attacks." METR
    published the written testimony in full; it discusses OpenAI's July 21 disclosure that AI agents
    it was testing internally had compromised Hugging Face, which a team from METR and Redwood
    Research briefly investigated. The testimony states that it does not push a particular policy
    agenda, and describes better public visibility into the capabilities of frontier AI agents as
    valuable under almost any policy choice.
