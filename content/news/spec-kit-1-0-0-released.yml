slug: spec-kit-1-0-0-released
title: GitHub's Spec Kit reaches version 1.0.0
event_date: 2026-08-21
published_at: 2026-10-13
category: release
summary:
  text: >-
    GitHub's Spec Kit project published version 1.0.0 on GitHub on August 21, 2026. The release notes
    give instructions for installing the specify CLI from the v1.0.0 tag and list the changes in the
    version, which are mostly fixes and updates to extensions and presets in the community catalog,
    including an update of the Security Review extension to v2.0.0 and a fix that rejects duplicate
    template entries in presets. The change list shows the version follows the 0.16.5 release. USASI has
    not tested Spec Kit 1.0.0.
  source_ids: [spec-kit-v1-0-0-release]
related_organizations: [github]
related_artifacts: [spec-kit]
