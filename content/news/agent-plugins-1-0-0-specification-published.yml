slug: agent-plugins-1-0-0-specification-published
title: Agent Plugins 1.0.0 published as an open specification for packaging agent skills and MCP servers
event_date: 2026-08-06
published_at: 2026-10-13
category: governance
summary:
  text: >-
    On August 6, 2026 Vercel announced Agent Plugins 1.0.0, an open, vendor-neutral specification for
    packaging extensions for AI agents so that one plugin format works across compatible clients. A
    plugin is a directory with a plugin.json manifest and fixed locations for its components, with Agent
    Skills under skills/ and MCP server configuration in mcp.json. Vercel says it initiated the proposal,
    that representatives from AWS, Anysphere, GitHub, Microsoft, OpenAI, and Vercel refined it into
    version 1.0.0, and that the initial
    Technical Steering Committee includes core maintainers from AWS, Cursor, Microsoft, OpenAI, and
    Vercel. ChatGPT and Codex, Cursor, GitHub Copilot, Kiro, and VS Code are listed as supported at
    launch.
  source_ids: [vercel-agent-plugins-post]
