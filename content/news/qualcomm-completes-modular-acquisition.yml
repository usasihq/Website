slug: qualcomm-completes-modular-acquisition
title: Qualcomm completes its acquisition of Modular
event_date: 2026-07-28
published_at: 2026-09-29
category: acquisition
summary:
  text: >-
    Qualcomm completed its acquisition of Modular Inc on July 28, 2026, according to its
    quarterly report, and the closing was announced on July 29. Modular's announcement says
    Mojo, MAX, and Modular Cloud continue as products and brands, supported through Qualcomm
    Technologies. The Modular record now lists Qualcomm as its parent company, and Modular
    remains the maintainer of the Mojo and MAX records.
