slug: microsoft-ai-releases-mai-thinking-1
title: Microsoft AI releases the MAI-Thinking-1 reasoning model in public preview on Microsoft Foundry
event_date: 2026-08-12
published_at: 2026-10-13
category: release
summary:
  text: >-
    On August 12, 2026 Microsoft AI introduced MAI-Thinking-1, a reasoning model from its
    Superintelligence team, and made it available in public preview on Microsoft Foundry. The
    announcement describes a sparse mixture-of-experts model with 35B active and about 1T total
    parameters, a 256k-token context window, and function calling, and says it is compatible with the
    Chat Completions API. Microsoft AI says it did not distill the model from other labs' models and that
    safety training runs in the same reinforcement learning loop as capability training. The post does
    not say that the weights are released. USASI has not tested MAI-Thinking-1.
  source_ids: [mai-thinking-1-post]
