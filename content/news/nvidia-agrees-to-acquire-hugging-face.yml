slug: nvidia-agrees-to-acquire-hugging-face
title: NVIDIA agrees to acquire Hugging Face; the deal has not yet closed
event_date: 2026-09-02
published_at: 2026-09-29
category: acquisition
summary:
  text: >-
    NVIDIA entered into a definitive agreement to acquire Hugging Face, Inc. on September 2,
    2026, and announced it the next day. NVIDIA's Form 8-K says the transaction is expected to
    close in the first half of 2027, subject to closing conditions including regulatory
    approvals, so Hugging Face is still listed as a privately held company with no parent
    organization. NVIDIA says the Hugging Face platform will stay open to models from other
    developers and will not require NVIDIA hardware.
