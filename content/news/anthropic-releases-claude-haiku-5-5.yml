slug: anthropic-releases-claude-haiku-5-5
title: Anthropic releases Claude Haiku 5.5
event_date: 2026-10-07
published_at: 2026-10-08
category: release
summary:
  text: >-
    On October 7, 2026 Anthropic announced Claude Haiku 5.5, a model it describes as designed
    for high-volume, cost-sensitive tasks such as summaries, classification requests, and database
    queries. The announcement gives the API model ID claude-haiku-5-5 and says the model is available
    on the Claude Platform, Amazon Web Services, Google Cloud, and Microsoft Azure, and it points to
    a Haiku 5.5 System Card for evaluation and safety details. The same post announces SDK updates
    that add beta support for computer use and browser use in Python and TypeScript. The
    announcement describes a hosted model; it does not describe a release of model weights.
