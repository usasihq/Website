slug: writer-releases-palmyra-x6
title: WRITER releases Palmyra X6, post-trained on GLM 5.2, alongside WRITER Agent upgrades
event_date: 2026-08-13
published_at: 2026-10-13
category: release
summary:
  text: >-
    WRITER announced Palmyra X6 on August 13, 2026 as its new flagship model, aimed at marketing and
    revenue workflows and designed to run inside the WRITER Agent harness. The announcement says X6 was
    post-trained on top of GLM 5.2, an open-weight model. The same release adds WRITER Agent features
    including batch execution, sub-agent delegation, support for enabling models from providers such as
    Anthropic and OpenAI, and bring-your-own-model support for Microsoft Azure, AWS Bedrock, and NVIDIA
    NIM. The announcement does not say whether Palmyra X6 weights are released. USASI has not tested
    Palmyra X6.
