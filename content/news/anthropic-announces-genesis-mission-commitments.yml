slug: anthropic-announces-genesis-mission-commitments
title: Anthropic announces commitments to the federal Genesis Mission
event_date: 2026-10-08
published_at: 2026-10-09
category: policy
summary:
  text: >-
    On October 8, 2026 Anthropic announced commitments to the Genesis Mission, which it describes as
    a federal initiative to accelerate scientific and technological discovery through AI. The post
    says that over the next three years Anthropic will provide Claude, Claude Code, and API credits
    to Genesis Mission research projects, partner with agencies and national laboratories on science
    priorities including fusion energy and quantum computing, and provide training, onboarding, and
    technical support to scientists on those projects. It names NASA, the National Institutes of
    Health, and the National Science Foundation among participating agencies. These are commitments
    Anthropic describes in its own announcement; this item does not describe any government action.
