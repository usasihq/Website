slug: ai2-bolmo-research-published-in-nature
title: Ai2's Bolmo byte-level language model research is published in Nature, with new checkpoints
event_date: 2026-10-07
published_at: 2026-10-13
category: research
summary:
  text: >-
    Ai2 said on October 7, 2026 that the research behind Bolmo, its family of fully open byte-level
    language models introduced the previous December, has been published in Nature. Ai2 writes that
    the paper applies the same "byteifying" process to Qwen 3 8B and Llama 3 8B to create two new
    byte-level models, Bwen 8B and Blama 8B, and that it is releasing new checkpoints, including
    Stage 1 checkpoints, on Hugging Face. The Bwen 8B model card describes it as Qwen3 8B Base
    retrofitted to operate over bytes instead of tokens and lists the Apache 2.0 license. USASI has
    not tested these models.
