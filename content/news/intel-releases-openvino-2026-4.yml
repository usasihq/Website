slug: intel-releases-openvino-2026-4
title: Intel releases OpenVINO 2026.4 with multi-token prediction decoding in OpenVINO GenAI
event_date: 2026-09-16
published_at: 2026-10-13
category: release
summary:
  text: >-
    Intel published OpenVINO 2026.4.0 on GitHub on September 16, 2026. The release notes say
    OpenVINO GenAI adds Multi-Token Prediction (MTP) speculative decoding for Gemma 4, Qwen3.5 and
    Qwen3.6 on CPUs and GPUs, and introduces DFlash acceleration for Qwen models on GPUs as a
    preview. Newly supported models on CPU and GPU include Kokoro-82M, Qwen3-ASR, Muse Glimmer
    30B, Qwen3.8 27B and Gemma 4 12B. OpenVINO GenAI also adds an ASRPipeline for Node.js, and the
    notes say support for Python 3.10 will be discontinued in OpenVINO 2026.5. USASI has not
    tested this release.
