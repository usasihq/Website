slug: anthropic-gives-metr-employee-like-access-for-risk-assessments
title: Anthropic gives a METR team employee-like access and describes publication terms for outside evaluators
event_date: 2026-10-15
published_at: 2026-10-16
category: governance
summary:
  text: >-
    In an October 15, 2026 update on independent evaluators, Anthropic said it has begun giving a
    small team from METR employee-like access, with internal tools and systems roughly comparable
    to those of its own risk assessment teams, under enforceable agreements, and that METR will
    publish its risk assessments. Anthropic says it cannot veto publication but can require
    redactions limited to narrow, predefined categories such as customer data, privileged
    information, and model architectures, and that evaluators may say publicly whether redactions
    were justified. The post describes three tiers of evaluator access and says SecureBio is
    reviewing the chemical and biological weapons chapter of Anthropic's August Risk Report. These
    are Anthropic's own descriptions; the post does not include METR's assessments.
