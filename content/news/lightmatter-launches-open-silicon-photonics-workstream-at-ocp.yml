slug: lightmatter-launches-open-silicon-photonics-workstream-at-ocp
title: Open Silicon Photonics for AI Systems initiative becomes an Open Compute Project workstream
event_date: 2026-08-13
published_at: 2026-10-13
category: governance
summary:
  text: >-
    Lightmatter announced on August 13, 2026 that the Open Silicon Photonics for AI Systems
    initiative, first announced earlier in the year, has launched as an official workstream
    within the Open Compute Project. The coalition's members include Dell Technologies, Qualcomm
    and Lightmatter, and the initiative has published a white paper titled "Architecture Vision:
    Open Silicon Photonics for AI Systems." Lightmatter says the paper will guide the
    development of a shared co-packaged optics (CPO) blueprint for AI clusters that comply with
    the Modular Hardware System (MHS) and Open Rack v3 (ORv3) designs. The release says
    submission of the first specifications is anticipated in the fourth quarter of 2026.
