slug: amd-agrees-to-acquire-taalas
title: AMD agrees to acquire Taalas, a developer of AI inference silicon
event_date: 2026-08-06
published_at: 2026-10-13
category: acquisition
summary:
  text: >-
    AMD announced on August 6, 2026, that it has reached a definitive agreement to acquire Taalas,
    a company founded in 2023 and headquartered in Toronto that develops specialized silicon for AI
    inference. AMD says it plans to integrate Taalas' technology into its accelerator roadmap and
    to develop system-level solutions with AMD Instinct GPUs. The release says the acquisition is
    subject to customary closing conditions and regulatory approvals, and it does not give an
    expected closing date. USASI has not seen an announcement that the deal has closed.
