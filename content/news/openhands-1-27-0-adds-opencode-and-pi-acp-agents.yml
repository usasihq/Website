slug: openhands-1-27-0-adds-opencode-and-pi-acp-agents
title: OpenHands 1.27.0 adds OpenCode and Pi as built-in ACP agents
event_date: 2026-10-12
published_at: 2026-10-13
category: release
summary:
  text: >-
    OpenHands 1.27.0 was published on the project's GitHub repository on October 12, 2026. Its
    release notes list adding OpenCode and Pi as built-in ACP agents on local backends, taking ACP
    model lists from the agent instead of hardcoding them, connecting Agent Canvas to DigitalOcean
    Managed Agents on desktop and web, and a persisted automation draft management UI. A separate
    bug-fix release, 1.27.1, followed the same day. USASI has not tested either release.
  source_ids: [openhands-1-27-0-release, openhands-1-27-1-release]
