slug: cloudflare-releases-clef-omni
title: Cloudflare releases Clef-omni, a multimodal decision model, under Apache 2.0
event_date: 2026-10-09
published_at: 2026-10-11
category: release
summary:
  text: >-
    On October 9, 2026 Cloudflare released Clef-omni, a decision model in its Clef family that
    accepts audio and video input alongside text and images, and published its weights on Hugging
    Face. The model card lists the Apache 2.0 license and describes Clef-Omni as a 30B-A3B
    mixture-of-experts model that returns a probability for every allowed option of each typed
    question, without free-form text generation. It is post-trained from Qwen3-Omni-30B-A3B-Instruct,
    a base model Cloudflare did not develop. In the same post Cloudflare said it lowered the price of
    Clef-flash and made Clef
    faster. USASI has not tested the model.
  source_ids: [clef-omni-blog, clef-omni-card]
