slug: nist-joins-genesis-mission-through-doe-agreement
title: NIST signs an agreement with DOE's Office of Science to join the Genesis Mission
event_date: 2026-08-04
published_at: 2026-10-13
category: policy
summary:
  text: >-
    On August 4, 2026, NIST announced that it and the Department of Energy's Office of Science had
    signed a memorandum of understanding to apply AI-accelerated innovation to national science and
    technology challenges tied to the Genesis Mission. The agencies will coordinate and share
    resources in biotechnology, quantum science, and materials design and discovery. NIST will carry
    out two efforts through its Centers for AI in Manufacturing and Critical Infrastructure, a
    partnership with MITRE: one on AI-driven autonomous agents and human-in-the-loop robotics for
    manufacturing, and one on AI-based agents that detect and respond to cyberthreats against
    critical infrastructure. NIST describes both as two-year sprints.
