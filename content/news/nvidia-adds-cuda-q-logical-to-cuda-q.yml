slug: nvidia-adds-cuda-q-logical-to-cuda-q
title: NVIDIA adds CUDA-Q Logical, a fault-tolerant quantum orchestration layer, to open-source CUDA-Q
event_date: 2026-09-14
published_at: 2026-10-13
category: release
summary:
  text: >-
    NVIDIA announced on September 14, 2026 that its open-source CUDA-Q platform now includes
    CUDA-Q Logical, an orchestration layer for designing and testing applications for
    fault-tolerant quantum computers that use logical qubits. NVIDIA says CUDA-Q Logical is
    available through GitHub. The announcement also says that QUOPS, a cross-platform benchmark
    developed by Sandia National Laboratories to measure progress toward utility-scale quantum
    applications, has a reference implementation available in CUDA-Q. USASI has not tested
    CUDA-Q Logical.
