slug: anthropic-releases-claude-opus-5
title: Anthropic releases Claude Opus 5
event_date: 2026-07-24
published_at: 2026-10-13
category: release
summary:
  text: >-
    On July 24, 2026 Anthropic announced Claude Opus 5 and said it was available that day on all
    platforms, with the API model ID claude-opus-5. Anthropic's release notes say the model
    supports a 1M token context window and 128k max output tokens, is available on the Claude API,
    Amazon Bedrock, Claude Platform on AWS, Google Cloud, and Microsoft Foundry, and allows
    thinking to be disabled only at effort high or below, a breaking change from Claude Opus 4.8.
    The announcement says requests flagged by its cybersecurity classifiers in Claude.ai, Claude
    Code, and Claude Cowork fall back to Opus 4.8 by default, and it introduced two updates in beta:
    mid-conversation tool changes on the Claude Platform and automatic fallbacks on the API. Opus 5 is a hosted model; the announcement
    does not describe a release of weights. USASI has not tested it.
  source_ids: [anthropic-opus-5, claude-release-notes]
