slug: microsoft-releases-vibevoice-asr-streaming
title: Microsoft releases VibeVoice-ASR-Streaming, an MIT-licensed streaming speech recognition model
event_date: 2026-09-03
published_at: 2026-10-13
category: release
summary:
  text: >-
    The news log in Microsoft's VibeVoice repository lists the release of VibeVoice-ASR-Streaming on
    September 3, 2026, describing it as a unified streaming ASR model that continuously transcribes who
    said what as speech arrives, with support for customized hotwords and 10 languages. The Hugging Face
    card for VibeVoice-ASR-Streaming-7B names the languages as Chinese, English, French, German, Italian,
    Japanese, Korean, Portuguese, Russian, and Spanish, and says the project is licensed under the MIT
    License. A technical report on the model was submitted to arXiv on September 2, 2026. USASI has not
    tested VibeVoice-ASR-Streaming.
