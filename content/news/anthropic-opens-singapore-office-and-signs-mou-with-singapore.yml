slug: anthropic-opens-singapore-office-and-signs-mou-with-singapore
title: Anthropic opens a Singapore office and signs an MOU with Singapore's digital ministry
event_date: 2026-10-14
published_at: 2026-10-15
category: policy
summary:
  text: >-
    On October 14, 2026 Anthropic announced that it has opened an office in Singapore, which it
    describes as its fifth in the Asia-Pacific region. Anthropic co-founder Ben Mann and Kai Fong
    Chng, Permanent Secretary of Singapore's Ministry of Digital Development and Information, signed
    a memorandum of understanding on the sidelines of Singapore International Cyber Week. The
    announcement says the MOU covers cooperation on AI safety, security, and model evaluation,
    research on AI adoption and its effects, and responsible adoption across the public and private
    sectors, including technical exchanges with Singapore's AI safety and assurance institutions. An
    MOU sets out intended cooperation; the announcement does not describe binding commitments.
