title: White House science summit lists industry partners in the Genesis Mission Consortium
event_date: 2026-10-08
published_at: 2026-10-11
category: policy
summary:
  text: >-
    On October 8, 2026 the White House published a fact sheet on science initiatives announced at
    its "Science: A New Golden Age" summit. It says eleven industry partners committed SI-for-science
    tools and compute credits to the Genesis Mission Consortium, and names NVIDIA, AMD, OpenAI,
    Anthropic, Google, AMP, Emerald AI, AWS, Armada, Crusoe, and Micron. The same fact sheet says
    NIH, DOE, and Biohub launched a virtual biology initiative to build data and models for virtual
    cells. The fact sheet describes announcements and commitments rather than an executive
    order.
