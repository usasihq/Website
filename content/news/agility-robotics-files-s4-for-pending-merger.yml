slug: agility-robotics-files-s4-for-pending-merger
title: Agility Robotics and Churchill Capital Corp XI file a Form S-4 for their pending merger
event_date: 2026-09-04
published_at: 2026-09-29
category: acquisition
summary:
  text: >-
    Agility Robotics, Inc. and Churchill Capital Corp XI, a publicly traded blank check company,
    filed a registration statement on Form S-4 with the SEC on September 4, 2026, for the
    business combination they announced in June 2026. The merger is pending: it still needs
    approval by Churchill XI's shareholders, SEC review of the registration statement, regulatory
    and stock exchange approvals, and other closing conditions. If it closes, the combined
    company would trade under the ticker AGLT.
