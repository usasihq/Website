slug: open-webui-0-12-0-released
title: Open WebUI 0.12.0 adds Realtime voice calls and two-factor sign-in
event_date: 2026-10-10
published_at: 2026-10-11
category: release
summary:
  text: >-
    On October 10, 2026 the Open WebUI project published version 0.12.0 on GitHub. The release notes
    say administrators can switch Call mode from Standard to Realtime, so voice calls go through an
    OpenAI Realtime voice model that hands questions and tasks to the chat's selected model, and that
    models can show an animated 3D avatar during Realtime calls. Administrators can also require an
    authenticator app at sign-in, with single-use recovery codes. The notes further add an Allow
    replies sharing mode for shared chats and named model controls, such as a Thinking control that
    sets reasoning effort. USASI has not tested these changes.
  source_ids: [open-webui-v0-12-0]
