slug: amd-agrees-to-acquire-world-labs
title: AMD agrees to acquire World Labs; the deal has not yet closed
event_date: 2026-09-28
published_at: 2026-10-01
category: acquisition
summary:
  text: >-
    AMD announced on September 28, 2026, that it has entered into a definitive agreement to
    acquire World Labs, the AI model and research lab that makes the Marble world-model product
    and the open-source Spark renderer. AMD says the transaction is expected to close by the end
    of 2026, subject to regulatory approvals and other customary closing conditions. Until it
    closes, World Labs is listed as an independent company.
