slug: lm-studio-introduces-bionic-agent-app
title: LM Studio introduces Bionic, a separate agent app for open models
event_date: 2026-07-16
published_at: 2026-10-13
category: release
summary:
  text: >-
    LM Studio introduced LM Studio Bionic on July 16, 2026, describing it as an AI agent made for open
    models. The post says Bionic is a new, separate app from LM Studio, that local models in it are
    powered by the LM Studio runtime, and that it can also use large open models through LM Studio
    Secure Cloud, which requires an LM Studio account with billing. Described uses include coding,
    document and file work, and research. The post does not say whether Bionic's software is open
    source. USASI has not tested this app.
