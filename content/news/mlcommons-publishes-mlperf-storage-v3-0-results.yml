slug: mlcommons-publishes-mlperf-storage-v3-0-results
title: MLCommons publishes MLPerf Storage v3.0 results with KV cache and vector database tests
event_date: 2026-09-01
published_at: 2026-10-13
category: release
summary:
  text: >-
    MLCommons published results for version 3.0 of its MLPerf Storage benchmark suite on September
    1, 2026. The suite measures the performance of storage systems for machine learning workloads,
    and v3.0 adds a KV Cache test of storage performance for LLM inference cache read and write
    operations and a Vector Database test covering vector indexing and querying. Version 3.0 also
    adds support for an S3 object storage access layer alongside the existing POSIX layer, supported
    for training, checkpointing, and some vector database tests. Results are on the MLCommons
    Storage benchmark results page.
