slug: skild-ai-introduces-s1
title: Skild AI introduces S1, a robotics model that learns tasks from a video demonstration
event_date: 2026-08-18
published_at: 2026-10-13
category: research
summary:
  text: >-
    Skild AI introduced S1 on August 18, 2026, describing it as a robotics foundation model built
    from the ground up as an in-context learner: tasks are specified by a video demonstration rather
    than by language, with no fine-tuning or post-training. Skild says the same weights produced
    every example in its post and that S1 is already at work with its commercial partners, and the
    post invites sign-ups for early access. The post does not say that S1's weights or code are
    released.
