slug: xai-releases-grok-4-7
title: xAI makes Grok 4.7 available on its API
event_date: 2026-09-21
published_at: 2026-10-13
category: release
summary:
  text: >-
    xAI's API release notes record that on September 21, 2026 Grok 4.7, which the notes describe as
    SpaceXSI's frontier model for coding, agentic tasks, and knowledge work, became available on the
    xAI API as grok-4.7. The entry says the model has a 500k context window, accepts text and image
    inputs with text-only output, supports low, medium, high (default), and xhigh reasoning effort,
    and is also served on the US regional endpoint. It adds that Grok 4.7 Fast, the same model, is
    available only in Cursor and Grok Build, not on the public xAI API. Grok 4.7 follows Grok 4.6,
    which the release notes list on August 12. These are hosted models; no release of weights is
    described. USASI has not tested Grok 4.7.
  source_ids: [xai-release-notes]
