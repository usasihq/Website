slug: mozilla-ai-introduces-otari
title: Mozilla.ai introduces Otari, an open-source LLM control plane under Apache 2.0
event_date: 2026-07-06
published_at: 2026-10-13
category: release
summary:
  text: >-
    Mozilla.ai introduced Otari on July 6, 2026, calling it the open-source LLM control plane built by
    Mozilla.ai. The announcement says it routes requests across multiple LLM providers through a
    single endpoint, with budgets and usage visibility for LLM spend, centralized API keys and
    access controls, automatic failover, and Agent Harnesses for building agent-ready
    applications. The GitHub repository describes Otari as an open-source, OpenAI-compatible LLM gateway
    that you run yourself, and it is licensed under Apache 2.0; the post says it can be deployed in hosted or
    self-hosted environments. USASI has not tested this software.
  source_ids: [mozilla-ai-otari-blog, otari-repo]
