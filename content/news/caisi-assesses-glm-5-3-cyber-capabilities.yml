slug: caisi-assesses-glm-5-3-cyber-capabilities
title: NIST's CAISI publishes an assessment of Z.ai's GLM-5.3 cyber capabilities
event_date: 2026-09-17
published_at: 2026-10-13
category: research
summary:
  text: >-
    On September 17, 2026, NIST's Center for AI Standards and Innovation (CAISI) published an
    assessment of the cyber capabilities of GLM-5.3, a model from the PRC-based company Z.ai, which
    released it in August 2026 and made its weights public two weeks later. CAISI ran the model as an
    agent with bash and Python tools on four benchmarks covering vulnerability discovery and exploit
    development, including its private CAISI OSS-Fuzz benchmark, and tested U.S. models with cyber
    safeguards disabled for comparison. The assessment compares GLM-5.3 with the U.S. and PRC
    models CAISI has evaluated, using per-benchmark results and an aggregate cyber capability index
    based on Item Response Theory, and notes that it does not compare against models that have been
    developed but not yet released.
