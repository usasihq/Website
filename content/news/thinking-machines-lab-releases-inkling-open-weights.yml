slug: thinking-machines-lab-releases-inkling-open-weights
title: Thinking Machines Lab releases Inkling, its first open-weight model, under Apache 2.0
event_date: 2026-07-15
published_at: 2026-10-13
category: release
summary:
  text: >-
    On July 15, 2026 Thinking Machines Lab released Inkling, a model it says it trained from scratch
    and published with full weights. The announcement describes a mixture-of-experts transformer with
    975B total and 41B active parameters, a context window of up to 1M tokens, and native reasoning
    over text, images, and audio, and calls it the first in a family of models of different sizes.
    The weights are published on Hugging Face without gating under the Apache 2.0 license, and the
    model is also available for fine-tuning on the company's Tinker platform. The announcement says
    some reported results came from a different checkpoint than the one released. USASI has not
    tested Inkling.
  source_ids: [tml-introducing-inkling, hf-inkling]
