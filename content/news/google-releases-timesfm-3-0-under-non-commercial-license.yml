slug: google-releases-timesfm-3-0-under-non-commercial-license
title: Google releases TimesFM 3.0 weights under a non-commercial license
event_date: 2026-08
published_at: 2026-09-29
category: license
summary:
  text: >-
    Google Research released TimesFM 3.0, a time-series forecasting model, in August 2026 under
    the TimesFM Non-Commercial License v1.0 instead of the Apache 2.0 license used for earlier
    TimesFM weights. The license allows use of the weights only for non-commercial purposes and
    prohibits redistributing them; the repository says commercial and production use of TimesFM
    3.0 is permitted through authorized Google Cloud services such as BigQuery ML. Weights up to
    version 2.5 and the TimesFM source code remain under Apache 2.0.
  source_ids: [timesfm3-license, timesfm-readme, timesfm3-blog]
