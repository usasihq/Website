slug: anduril-acquires-popoto-modem
title: Anduril acquires Popoto Modem, an underwater acoustic communications company
event_date: 2026-10-02
published_at: 2026-10-13
category: acquisition
summary:
  text: >-
    Anduril announced on October 2, 2026 that it has acquired Popoto Modem, an underwater acoustics
    company based in Massachusetts. Anduril says Popoto Modem's acoustic communications technology
    enables persistent, multi-node mesh networking underwater, and that it has worked with the
    company for over a year, integrating its modems into Anduril maritime systems. Anduril's
    immediate priority is scaling integrations into its Copperhead family of autonomous underwater
    vehicles, and it says the acquisition lets it extend to subsea the integration its Lattice
    software provides for platforms above the waterline. The announcement does not disclose terms.
