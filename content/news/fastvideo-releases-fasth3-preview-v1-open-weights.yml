slug: fastvideo-releases-fasth3-preview-v1-open-weights
title: FastVideo releases FastH3 Preview v1, an open-weight 4-step distillation of MiniMax H3
event_date: 2026-08-27
published_at: 2026-10-13
category: release
summary:
  text: >-
    On August 27, 2026, the FastVideo project released FastH3 Preview v1, which its repository
    describes as an open-weight, 4-step sparse-distilled MiniMax-H3 model for synchronized video and
    audio generation, developed with Nuva Lab and the NVIDIA FastGen team. The recommended
    checkpoint was trained with data-free DMD2 and VSA-H3 sparse attention, requires FastVideo's
    VSA-H3 attention backend, and is also offered as a matching LoRA adapter. Its model card says
    the checkpoint inherits the MiniMax H3 Community License. USASI has not tested FastH3.
