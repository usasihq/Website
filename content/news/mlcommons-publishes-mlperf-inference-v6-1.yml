slug: mlcommons-publishes-mlperf-inference-v6-1
title: MLCommons publishes MLPerf Inference v6.1 results with two new tests
event_date: 2026-09-16
published_at: 2026-10-01
category: release
summary:
  text: >-
    MLCommons published results for version 6.1 of the MLPerf Inference benchmark suite on
    September 16, 2026. The round added two tests: an end-to-end retrieval-augmented generation
    test that runs a question-answering pipeline of several separate models, and an Edge Agentic
    Inference test built around multi-turn workloads such as agentic coding. Speculative decoding
    is now allowed in the interactive scenario for two of the inference benchmarks. Results are
    published on MLCommons' datacenter and edge results pages.
