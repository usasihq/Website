slug: strands-agents-releases-strands-harness
title: Strands Agents releases Strands harness, an Apache 2.0 general-purpose agent harness
event_date: 2026-09-21
published_at: 2026-10-13
category: release
summary:
  text: >-
    On September 21, 2026 the Strands Agents project released Strands harness, which it describes as a
    fully assembled agent harness that can run locally or be deployed to a chosen provider, built as a
    general-purpose agent rather than a coding agent. It is available under the Apache 2.0 license, is
    built on the Strands Harness SDK, and can be used from Python or TypeScript. The post says its
    default context management truncates tool results over about 1,500 tokens and compacts the context
    when the context window is more than 85 percent full, and that it runs on models from Amazon Bedrock,
    Anthropic, OpenAI, and Google as well as local Ollama models. USASI has not tested Strands harness.
  source_ids: [strands-harness-blog]
