slug: open-secure-ai-alliance-joins-linux-foundation
title: The NVIDIA-founded Open Secure AI Alliance moves to the Linux Foundation
event_date: 2026-09-14
published_at: 2026-10-13
category: governance
summary:
  text: >-
    The Linux Foundation announced on September 14, 2026 that the Open Secure AI Alliance, which
    NVIDIA established in collaboration with members including the Linux Foundation, has joined
    the Linux Foundation as a neutral home. The announcement says the alliance's work will run
    alongside existing Linux Foundation security communities, including the Open Source Security
    Foundation (OpenSSF). It names the Shared AI Findings Exchange (SAFE), an effort to collect
    and analyze findings from AI security incidents, as a core initiative, and invited
    contributions to the SAFE proposal until September 21.
