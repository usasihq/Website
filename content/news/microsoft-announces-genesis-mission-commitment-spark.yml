slug: microsoft-announces-genesis-mission-commitment-spark
title: Microsoft commits to the Genesis Mission with a SPARK program office and four initial projects
event_date: 2026-07-22
published_at: 2026-10-13
category: policy
summary:
  text: >-
    On July 22, 2026 Microsoft announced a long-term commitment to the Department of Energy's Genesis
    Mission, centered on SPARK (Scientific Partnership Advancing Research & Knowledge), a new program
    office that Microsoft calls the single front door and coordination hub for Genesis Mission
    collaboration with the company. The commitment includes access to Microsoft Discovery, which
    Microsoft says is now generally available, and Microsoft says Azure capabilities will help extend
    DOE's American Science Cloud. Microsoft describes four of the first projects under the partnership,
    with Pacific Northwest National Laboratory, Lawrence Livermore National Laboratory, the Johns Hopkins
    University Applied Physics Laboratory, and Idaho National Laboratory, covering work from energy
    storage materials to nuclear licensing.
