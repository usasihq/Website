slug: meta-launches-muse-image-and-previews-muse-video
title: Meta launches Muse Image and previews Muse Video, its first Superintelligence Labs media models
event_date: 2026-07-07
published_at: 2026-10-13
category: release
summary:
  text: >-
    On July 7, 2026 Meta Superintelligence Labs launched Muse Image, an image generation model that can
    edit images, compose from multiple references, and use tools, and previewed Muse Video, which Meta
    says is built on the same pretraining base as Muse Image and supports native audio. Meta describes
    them as the first media generation models developed by Meta Superintelligence Labs. Muse Image is
    available in the Meta AI app and on meta.ai, in Instagram Stories in the U.S., and in WhatsApp in a
    limited set of countries, while Muse Video is described as coming soon, without a date. Meta says
    Muse Image outputs in the Meta AI app and on meta.ai include Content Seal, an invisible watermark;
    the post does not mention an API, open weights, or a license. USASI has not tested either model.
  source_ids: [meta-muse-image-video-blog]
