slug: unsloth-introduces-unsloth-desktop
title: Unsloth introduces Unsloth Desktop, an open-source app to run and train models locally
event_date: 2026-08-11
published_at: 2026-10-13
category: release
summary:
  text: >-
    Unsloth announced Unsloth Desktop in a GitHub release published on August 11, 2026. The release
    notes describe it as an open-source app for Windows, macOS, and Linux that runs and trains AI
    models locally, and say models can also be exported to NVFP4, GGUF, and other formats. Listed
    features include training without code, sandboxed Python and Bash execution, web search, Deep
    Research, RAG, and MCP tools, and an OpenAI-compatible API for local models. The notes say it
    runs on CPU or multiple GPUs across NVIDIA, AMD, Intel, and Mac hardware. USASI has not tested
    this app.
  source_ids: [unsloth-desktop-release]
related_organizations: [unsloth]
related_artifacts: [unsloth-library]
