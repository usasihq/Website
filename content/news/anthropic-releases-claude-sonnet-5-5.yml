slug: anthropic-releases-claude-sonnet-5-5
title: Anthropic releases Claude Sonnet 5.5
event_date: 2026-09-28
published_at: 2026-10-01
category: release
summary:
  text: >-
    Anthropic announced Claude Sonnet 5.5 on September 28, 2026, describing it as a faster,
    lower-cost complement to Claude Opus 5.5. Anthropic says it is available in the Claude apps
    and on its platforms, including Amazon Web Services, Google Cloud, and Microsoft Azure.
    Anthropic's model documentation lists the API identifier claude-sonnet-5-5 with a 1M-token
    context window. It is a hosted model; Anthropic has not published its weights.
