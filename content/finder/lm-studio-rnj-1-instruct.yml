slug: lm-studio-rnj-1-instruct
title: LM Studio with Rnj-1 Instruct
tasks: [write-code, chat-and-write]
runs: local
summary:
  text: >-
    LM Studio is a desktop app for downloading and running language models on your computer, with
    a chat interface and a local OpenAI-compatible server. Its model catalog includes Essential AI's
    Rnj-1 as essentialai/rnj-1, built from rnj-1-instruct, an 8B model that Essential AI describes as
    optimized for code and STEM tasks, including tool calling and agentic coding.
  reviewed_at: 2026-10-13
  source_ids: [lms-docs, lms-cat-rnj, rnj-card]
components:
  - role: app
    name: LM Studio
    record_slug: element-labs
    url: https://lmstudio.ai/docs/app
  - role: runtime
    name: llama.cpp engine inside LM Studio
    record_slug: llama-cpp
    url: https://lmstudio.ai/docs/app
  - role: model
    name: Rnj-1 Instruct (LM Studio catalog entry essentialai/rnj-1)
    record_slug: rnj-1-instruct
    url: https://lmstudio.ai/models/essentialai/rnj-1
platforms:
  values: [windows, macos, linux]
  source_ids: [lms-sysreq, lms-docs]
accelerators:
  values: [apple-silicon, cpu-only]
  source_ids: [lms-sysreq, lms-docs]
memory:
  variant: LM Studio's essentialai/rnj-1 entry (lmstudio-community rnj-1-instruct GGUF)
  gpu_gb: null
  system_gb: 6
  statement:
    text: >-
      LM Studio's catalog page for essentialai/rnj-1 lists a minimum system memory of 6 GB. The
      entry is based on lmstudio-community's rnj-1-instruct GGUF, offered as Q4_K_M, Q6_K, and Q8_0
      files.
    reviewed_at: 2026-10-13
    source_ids: [lms-cat-rnj, rnj-lmsc-api]
skill: beginner
skill_note: >-
  LM Studio is a graphical installer; you find and download the model in its Discover tab and load
  it from the Chat tab without using a command line.
account_required:
  value: false
  source_ids: [lms-offline, rnj-lmsc-api]
cost_basis:
  value: free-download
  note: >-
    LM Studio's Free plan includes running local models with llama.cpp and MLX, and Essential AI
    licenses rnj-1-instruct under Apache 2.0. Paid LM Studio plans add hosted open models and more
    included usage.
  source_ids: [lms-pricing, rnj-card]
data_location:
  text: >-
    On your machine. LM Studio's offline guide says a downloaded model runs locally, nothing you
    enter in chats leaves your device, and its local server answers requests on your computer.
    Searching for and downloading models needs an internet connection.
  reviewed_at: 2026-10-13
  source_ids: [lms-offline]
getting_started:
  - "Check the system requirements, then download and install LM Studio for your operating system."
  - "In the Discover tab, search for rnj-1 and download the essentialai/rnj-1 entry."
  - "In the Chat tab, open the model loader and select the downloaded model."
  - "Set a system prompt such as \"You are a helpful assistant.\" and a temperature between 0 and 0.2, as Essential AI recommends, then describe the code you need."
getting_started_source_ids: [lms-sysreq, lms-basics, lms-cat-rnj, rnj-card]
limitations:
  - text: >-
      Essential AI says that without a system prompt and a low temperature the model can truncate
      its answers or write code even for non-code requests.
    reviewed_at: 2026-10-13
    source_ids: [rnj-card]
  - text: >-
      On macOS, LM Studio needs Apple Silicon and macOS 14 or newer; Intel-based Macs are not
      supported. On Windows it needs an x64 CPU with AVX2 or an ARM (Snapdragon X Elite) system, and
      16GB of RAM and 4GB of dedicated VRAM are recommended.
    reviewed_at: 2026-10-13
    source_ids: [lms-sysreq]
  - text: >-
      LM Studio's terms of use license the software solely for personal or internal business
      purposes and prohibit redistributing, modifying, or reverse engineering it.
    reviewed_at: 2026-10-13
    source_ids: [lms-terms]
unverified:
  - USASI has not tested this configuration.
  - LM Studio's page does not say which download option its 6 GB minimum refers to; the larger Q6_K and Q8_0 files may need more memory.
  - How well Rnj-1 works with a coding tool connected to LM Studio's local server is not documented.
  - LM Studio's pages reviewed do not name supported NVIDIA, AMD, or Intel graphics on Windows or Linux, so GPU acceleration on those cards is not established here.
