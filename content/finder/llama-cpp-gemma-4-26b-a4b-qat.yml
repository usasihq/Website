slug: llama-cpp-gemma-4-26b-a4b-qat
title: llama.cpp server with Gemma 4 26B A4B (QAT Q4_0 GGUF)
tasks: [chat-and-write, work-with-documents]
runs: local
summary:
  text: >-
    llama.cpp's llama-server runs a GGUF model on your own computer and serves a built-in web chat
    interface and an OpenAI-compatible API. Google publishes Gemma 4 26B A4B, a mixture-of-experts
    model with about 3.8 billion of its 25.2 billion parameters active per token, as a Q4_0 GGUF
    built with quantization-aware training, together with a projector file for image input.
  reviewed_at: 2026-10-13
  source_ids: [lcpp-server, gemma-core, gemma26-qat-card, gemma26-qat-api]
components:
  - role: runtime
    name: llama.cpp (llama-server and its web UI)
    record_slug: llama-cpp
    url: https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md
  - role: model
    name: Gemma 4 26B A4B instruction-tuned, QAT Q4_0 GGUF
    record_slug: gemma-4-26b-a4b
    url: https://huggingface.co/google/gemma-4-26B-A4B-it-qat-q4_0-gguf
platforms:
  values: [windows, macos, linux]
  source_ids: [lcpp-install]
accelerators:
  values: [nvidia, amd, apple-silicon, intel, cpu-only]
  source_ids: [lcpp-readme]
memory:
  variant: Gemma 4 26B A4B at Q4_0 (4-bit), as in Google's gemma-4-26B-A4B-it-qat-q4_0-gguf
  gpu_gb: 14.4
  system_gb: null
  statement:
    text: >-
      Google's Gemma 4 documentation lists about 14.4 GB of GPU or TPU memory to load Gemma 4 26B
      A4B at Q4_0 (4-bit), based on the model weights plus a 20% loading overhead. It explains that
      all 26 billion parameters must be loaded even though only about 4 billion are active per
      token, and that the figure excludes supporting software and the context window.
    reviewed_at: 2026-10-13
    source_ids: [gemma-core]
skill: intermediate
skill_note: >-
  Install llama.cpp from a package manager or a release, download the model file and its image
  projector from Hugging Face, and start llama-server from a terminal.
account_required:
  value: false
  source_ids: [gemma26-qat-api, lcpp-install]
cost_basis:
  value: free-download
  note: >-
    llama.cpp is open-source software under the MIT License, and Google publishes the Gemma 4 26B
    A4B QAT GGUF under Apache 2.0 on Hugging Face without gating.
  source_ids: [lcpp-license, gemma26-qat-card, gemma26-qat-api]
data_location:
  text: >-
    On your machine. llama-server listens on 127.0.0.1 by default, and its web UI keeps
    conversations in your browser's IndexedDB storage. The model files are downloaded once from
    Hugging Face.
  reviewed_at: 2026-10-13
  source_ids: [lcpp-server, lcpp-ui, gemma26-qat-api]
getting_started:
  - "Install llama.cpp with Homebrew (macOS and Linux), Winget (Windows), conda-forge, or a pre-built release from GitHub."
  - "From Google's google/gemma-4-26B-A4B-it-qat-q4_0-gguf repository, download gemma-4-26B_q4_0-it.gguf and, for image input, gemma-4-26B-it-mmproj.gguf."
  - "Start `llama-server -m gemma-4-26B_q4_0-it.gguf --mmproj gemma-4-26B-it-mmproj.gguf`; leave out `--mmproj` for text only, and add `-c` to set the context size."
  - "Open http://127.0.0.1:9931 in a browser; the web UI accepts images, PDFs, and text files as attachments."
getting_started_source_ids: [lcpp-install, gemma26-qat-api, lcpp-server, lcpp-multimodal, lcpp-ui]
limitations:
  - text: >-
      By default llama-server adjusts settings you leave unset, such as the context size, to fit in
      device memory, with a minimum context of 4,096 tokens.
    reviewed_at: 2026-10-13
    source_ids: [lcpp-server]
  - text: >-
      The server README describes multimodal (image) support as an experimental feature;
      llama.cpp's multimodal page lists Gemma 4 26B A4B among the supported vision models.
    reviewed_at: 2026-10-13
    source_ids: [lcpp-server, lcpp-multimodal]
  - text: >-
      The install page's conda-forge builds cover CUDA and Vulkan on Windows and Linux and Metal on
      macOS; the README lists AMD (HIP) and Intel (SYCL) GPU backends with links to build
      instructions.
    reviewed_at: 2026-10-13
    source_ids: [lcpp-install, lcpp-readme]
  - text: >-
      The server README recommends setting an API key and using a reverse proxy before exposing
      llama-server publicly.
    reviewed_at: 2026-10-13
    source_ids: [lcpp-server]
unverified:
  - USASI has not tested this configuration.
  - Google's figure covers the model weights only; memory for the image projector and for the context size llama-server chooses is not documented.
  - Google notes its memory numbers may change with the inference tool and environment.
  - Which pre-built llama.cpp packages include AMD or Intel GPU support is not established here.
