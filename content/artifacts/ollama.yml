summary:
  text: >-
    Ollama is an open-source application and runtime for downloading and running open models on
    macOS, Windows, and Linux. It has an API, Python and JavaScript client libraries, and
    integrations with coding agents and other tools. Its company, Ollama Inc., also offers
    cloud-hosted models.
  source_ids: [ollama-readme, ollama-terms, ollama-pricing]
useful_for:
  text: >-
    Running open models on a local machine with GPU acceleration on NVIDIA, AMD, and Apple
    hardware, and serving them to local applications.
  source_ids: [ollama-gpu-docs, ollama-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Ollama's terms of service say its website, software, APIs, and related services are provided
    by Ollama Inc. The terms are governed by California law, with arbitration in San Francisco.
    Ollama Inc.'s July 2026 press release (distributed by Business Wire) is datelined Palo Alto,
    California. Its job
    board lists roles in Palo Alto. No foreign parent or headquarters was found.
  source_ids: [ollama-terms, ollama-pr-series-b, ollama-jobs]
