summary:
  text: >-
    Lance is an open lakehouse format for multimodal AI data, made up of a file format, a table
    format, and a catalog specification for building a lakehouse on object storage. The core
    project provides a Rust SDK with Python and Java bindings and supports vector and full-text
    search, random access, data versioning, and adding columns without rewriting tables.
  source_ids: [lance-readme, lance-community]
useful_for:
  text: >-
    Storing and querying images, video, audio, text, and embeddings for search engines, feature
    stores, and large-scale training pipelines that need fast random access.
  source_ids: [lance-readme]
eligibility:
  status: pending_review
  basis: undetermined
  explanation: >-
    In November 2025 LanceDB, a San Francisco company whose products build on Lance, announced
    that all Lance-related projects had moved to a separate lance-format GitHub organization under
    community governance modeled on the Apache Software Foundation. Lance is not hosted by a
    foundation or other legal entity, and the announcement leaves joining one to the community. A
    Project Management Committee votes on releases, governance, and specification changes, and any
    PMC member can veto a proposal. On the PMC roster, 9 of 19 members give LanceDB as their
    self-reported affiliation and the rest list eight other companies. Because no single documented
    governing or maintaining entity exists, the us-governed-project basis cannot be established
    under the current policy; an editor should decide how multi-company community governance of
    this kind is treated.
  source_ids: [lance-governance-blog, lance-community, lance-pmc, lance-voting, yc-lancedb]
  assessed_at: 2026-09-29
