summary:
  text: >-
    OLMo-core is Ai2's Python library of building blocks for large-scale distributed training
    with PyTorch, used for its OLMo language models. The repository also holds the official
    training scripts for released OLMo 2 and Olmo 3 models and has beta support for text
    generation, including a chat demo. Version 3.0.0 was released on October 1, 2026.
  source_ids: [ oc-readme, oc-docs, oc-release-3 ]
  reviewed_at: 2026-10-08
useful_for:
  text: >-
    Re-running or adapting the published OLMo training scripts, which are launched with torchrun
    and accept command-line overrides, and building other distributed PyTorch training runs from
    the library's components. For evaluation, the README points to Ai2's OLMo Eval and OLMES
    repositories.
  source_ids: [ oc-readme, oc-docs ]
  reviewed_at: 2026-10-08
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The repository is in Ai2's allenai GitHub organization, the package is published on PyPI
    as ai2-olmo-core, and the documentation says OLMo-core is developed and maintained at the
    Allen Institute for Artificial Intelligence (AI2). Ai2 describes itself as a Seattle-based
    nonprofit AI research institute founded in 2014.
  source_ids: [ oc-readme, oc-pypi, oc-docs, ai2-about ]
  assessed_at: 2026-10-08
availability:
  status: public
