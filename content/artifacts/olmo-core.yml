license_notes:
  text: >-
    The repository's LICENSE file is the Apache License 2.0 text, and the PyPI package carries
    the same license. Optional dependencies named in the README, such as flash-attn and
    TransformerEngine, come from other projects with their own terms, which this record does not
    assess.
  source_ids: [ oc-license, oc-pypi, oc-readme ]
  reviewed_at: 2026-10-08
checklist:
  source_code:
    status: public
    note: Library source in src/olmo_core, tests in src/test, and official training scripts in src/scripts/official.
    source_ids: [ oc-readme ]
    reviewed_at: 2026-10-08
  documentation:
    status: public
    note: >-
      The Read the Docs site has an overview, guides, examples, and an API reference. At review
      the site showed version 2.6.0, while the latest tagged release was 3.0.0.
    source_ids: [ oc-docs, oc-release-3 ]
    reviewed_at: 2026-10-08
  installation:
    status: public
    note: >-
      The README says to install PyTorch for the user's system first, then install from PyPI or
      from source; some features need optional dependencies, and the published Docker images
      include them.
    source_ids: [ oc-readme ]
    reviewed_at: 2026-10-08
  supported_platforms:
    status: partial
    note: >-
      The package requires Python 3.10 or later. The README says the Docker images are tested on
      Ai2's in-house H100 clusters and may not work with other hardware or driver and CUDA
      versions; no general platform list is given.
    source_ids: [ oc-pypi, oc-readme ]
    reviewed_at: 2026-10-08
  release_status:
    status: public
    note: Tagged GitHub releases with release notes and matching PyPI versions; 3.0.0 was released on 2026-10-01.
    source_ids: [ oc-release-3, oc-pypi ]
    reviewed_at: 2026-10-08
run_notes:
  - text: >-
      The 3.0.0 release notes say it removed the olmo_core.model_ladder API and its training
      scripts, so existing ladder configurations need an earlier revision.
    source_ids: [ oc-release-3 ]
    reviewed_at: 2026-10-08
  - text: >-
      The official training scripts can also be launched with OLMo-core's Beaker launch tool,
      which the README says requires access to Beaker; otherwise they run with torchrun.
    source_ids: [ oc-readme ]
    reviewed_at: 2026-10-08
