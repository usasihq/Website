summary:
  text: >-
    LangGraph is an open-source, low-level orchestration framework and runtime for long-running,
    stateful agents. It is built by LangChain Inc. but can be used without the LangChain
    library, and a JavaScript/TypeScript version, LangGraph.js, lives in a separate repository.
    The README credits Pregel and Apache Beam as inspirations.
  source_ids: [langgraph-readme, langgraph-docs-overview]
useful_for:
  text: >-
    Agent workflows that must survive failures and resume from where they stopped, that let
    humans inspect or change agent state mid-run, and that need short-term and long-term memory.
  source_ids: [langgraph-docs-overview, langgraph-readme]
