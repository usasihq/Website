    to LangChain, Inc. LangChain's about page says the company is headquartered in San Francisco,
    and its terms of service identify LangChain Inc. as a Delaware corporation. No foundation or
    multi-organization governance body is documented.
  source_ids: [langgraph-readme, langgraph-license, langchain-about, langchain-tos]
