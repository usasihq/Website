summary:
  text: >-
    HydraGNN is a PyTorch implementation of multi-headed graph neural networks from Oak Ridge
    National Laboratory, with separate output heads for graph-level and node-level properties.
    Its README lists distributed training with DDP, FSDP, and DeepSpeed; equivariant layers such
    as EGNN, PaiNN, MACE, and DimeNet; heterogeneous graph learning; global attention through
    GPS; and training of machine-learned interatomic potentials with energy-conserving forces.
  source_ids: [hydragnn-repo]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Training graph neural network surrogate models on atomistic and materials data, such as
    density functional theory outputs, including distributed training at supercomputing scale.
    The README
    also documents constraint-aware training for optimal power flow problems and gives example
    scripts for each workflow.
  source_ids: [hydragnn-repo]
  reviewed_at: 2026-10-01
