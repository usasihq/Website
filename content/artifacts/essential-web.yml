run_notes: []
provenance:
  text: >-
    Built from Common Crawl: 89 snapshots from the DCLM pool (CC-MAIN-2013-20 to
    CC-MAIN-2022-49) plus 12 later snapshots (CC-MAIN-2023-06 to CC-MAIN-2024-38), all
    extracted with resiliparse. Taxonomy labels were
    produced by EAI-Distill-0.5b, which Essential AI fine-tuned from Qwen2.5-0.5B-Instruct
    (from Alibaba Cloud's Qwen family) on labels generated by Qwen2.5-32B-Instruct; the
    dataset card refers to the labeler as EAI-Taxonomy-0.5b.
  derived_from:
