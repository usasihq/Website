summary:
  text: >-
    Essential-Web v1.0 is a web text dataset of about 24 trillion tokens in 23.6 billion
    documents, built by Essential AI from 101 Common Crawl snapshots. Every document carries
    metadata from a 12-category taxonomy covering subject (Free Decimal Correspondence, a
    Dewey Decimal-inspired scheme), page type, reasoning depth, education level, and quality,
    so subsets can be selected with metadata filters.
  source_ids: [essential-web-card, essential-web-paper]
useful_for:
  text: >-
    Building domain-specific pretraining sets without custom classifiers by filtering on the
    taxonomy labels. Essential AI has published math, code, STEM, and medical subsets curated
    this way.
  source_ids: [essential-web-card]
