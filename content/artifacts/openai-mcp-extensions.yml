summary:
  text: >-
    OpenAI MCP Extensions is a specification and pair of SDKs from OpenAI that add
    ChatGPT-specific capabilities on top of the Model Context Protocol (MCP) and MCP Apps, so that
    plugins can appear in ChatGPT's interface. Documented extensions include sidebar and thread
    entrypoints, file-type handlers, structured settings, composer at-mentions, and extended form
    elicitation. The TypeScript SDK extends the official MCP TypeScript SDKs for servers and
    apps; the Python SDK extends the official MCP Python SDK for servers.
  source_ids: [ mcpx-repo, mcpx-spec, mcpx-ts-readme, mcpx-py-readme ]
  reviewed_at: 2026-10-04
useful_for:
  text: >-
    Building MCP servers and MCP Apps that integrate with ChatGPT beyond what the standard MCP
    specification provides. The extensions target ChatGPT as the host; the specification lists
    which features each ChatGPT platform supports.
  source_ids: [ mcpx-repo, mcpx-spec ]
  reviewed_at: 2026-10-04
