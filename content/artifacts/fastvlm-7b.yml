license_notes:
  text: >-
    The weights license grants a personal, non-exclusive, revocable license to use, copy,
    modify, distribute, and create derivatives only for non-commercial scientific research,
    excluding product development and commercial use; derivatives are held to the same limit.
    Redistribution requires passing on the agreement with a specified attribution notice.
    No patent rights are granted, and the agreement is governed by California law. The
    Qwen2-7B language model it builds on is separately published under Apache 2.0 on Hugging
    Face.
  source_ids: [fastvlm-license, qwen2-7b-hf]
checklist:
  weights:
    status: public
    note: >-
      Weights are published on Hugging Face without an access gate; the repository also links
      stage 2 and stage 3 PyTorch checkpoints and an int4 Apple silicon export.
    source_ids: [fastvlm7b-hf-api, fastvlm-readme]
  inference_code:
    status: public
    note: >-
      The ml-fastvlm repository provides a predict.py script, export code for Apple silicon,
      and an iOS/macOS demo app; the card also shows Transformers inference with remote code.
    source_ids: [fastvlm-readme, fastvlm7b-card]
  training_code:
    status: unknown
    note: >-
      The README says FastVLM variants were trained with the LLaVA codebase and directs users
      to LLaVA's instructions for training; FastVLM-specific training scripts were not found.
    source_ids: [fastvlm-readme]
  training_data_information:
    status: partial
    note: >-
      The paper describes the datasets used in each training stage (for example the LLaVA-558K
      alignment and LLaVA-665K instruction data in its base setup) and the DataCompDR-1B data
      used to pretrain FastViTHD; availability of every dataset for the released checkpoint was
      not verified.
    source_ids: [fastvlm-paper]
  training_recipe:
    status: partial
    note: >-
      The paper describes the multi-stage training setup (connector training, resolution
      scaling, visual instruction tuning, and a further stage 3), with some hyperparameters
      and compute details.
    source_ids: [fastvlm-paper]
  evaluation_materials:
    status: partial
    note: The card and paper report benchmark results; evaluation code for re-running them was not identified.
    source_ids: [fastvlm7b-card, fastvlm-paper]
run_notes:
  - text: >-
      The repository recommends exporting PyTorch checkpoints for Apple silicon with its
      model_export code and provides a pre-exported 7B stage 3 checkpoint with int4
      quantization for the language model.
    source_ids: [fastvlm-readme]
provenance:
  text: >-
    Built by Apple from its FastViTHD vision encoder and the Qwen2-7B language model, which
    was developed by the Qwen Team at Alibaba Group (per the Qwen2 Technical Report) and is
    published on Hugging Face. The configuration identifies the architecture as
    LlavaQwen2ForCausalLM.
  derived_from:
    - name: Qwen2-7B
      artifact_slug: null
      url: https://huggingface.co/Qwen/Qwen2-7B
      note: Language model decoder.
  source_ids: [fastvlm-readme, fastvlm7b-config, qwen2-7b-hf, qwen2-report]
