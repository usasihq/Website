summary:
  text: >-
    FastVLM 7B is the 7B variant of Apple's FastVLM release. It combines Apple's FastViTHD
    vision encoder with the Qwen2-7B language model in a LLaVA-style architecture and accepts
    an image plus a text prompt to generate text.
  source_ids: [fastvlm7b-card, fastvlm-readme, fastvlm7b-config]
useful_for:
  text: >-
    The paper and Apple's research article describe FastVLM for high-resolution and text-rich
    image understanding with low time-to-first-token, including on-device use. Its license
    limits use to non-commercial research.
  source_ids: [fastvlm-paper, apple-ml-fastvlm, fastvlm-license]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model license states the model is developed and released by Apple Inc., and the paper
    lists Apple as the authors' affiliation. Apple Inc. has its principal executive offices in
    Cupertino, California, per its Form 10-K for fiscal year 2025. The language model is the
    third-party Qwen2-7B, recorded under provenance; that base is not U.S.-developed.
  source_ids: [fastvlm-license, fastvlm-paper, aapl-10k-2025, fastvlm-readme]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Downloadable from Hugging Face without an access gate and from Apple's CDN via the
    repository's download script, under a license that permits only non-commercial research
    use.
  source_ids: [fastvlm7b-hf-api, fastvlm-readme, fastvlm-license]
