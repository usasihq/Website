summary:
  text: >-
    Chai-1 is a multi-modal foundation model from Chai Discovery for predicting molecular
    structures, covering proteins, small molecules, DNA, RNA, glycosylations, and other
    modifications. It was first released in September 2024, and its license changed in
    November 2024 (see the release record). The chai_lab package (latest PyPI release 0.6.1,
    March 2025) runs it locally.
  reviewed_at: 2026-10-01
  source_ids: [chai-readme, chai-license-history, chai-pypi]
useful_for:
  text: >-
    Folding complexes given as FASTA input, optionally with MSAs, templates, user-specified
    inter-chain contact or covalent-bond restraints, and custom embeddings, per the repository
    README.
  reviewed_at: 2026-10-01
  source_ids: [chai-readme]
