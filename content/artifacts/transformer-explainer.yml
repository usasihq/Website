summary:
  text: >-
    Transformer Explainer is an open-source interactive visualization that runs the GPT-2
    (small) model, which has 124 million parameters, in the web browser. Users enter their own
    text and follow how the Transformer's components and operations combine to predict the next
    token. It was created by the Polo Club of Data Science at Georgia Tech and is described in a
    CHI 2026 paper.
  source_ids: [te-readme, te-site, te-paper]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Learning how Transformer-based text-generation models work without installing anything:
    the paper describes an overview of the model's data flow with explanations that reveal
    mathematical detail on demand, and lets learners change the input and sampling settings
    such as temperature and see next-token predictions update.
  source_ids: [te-paper, te-site]
  reviewed_at: 2026-10-01
