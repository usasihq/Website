summary:
  text: >-
    V-JEPA 2 is Meta's family of self-supervised video encoders, pretrained on video with a
    masked latent-feature prediction objective. Meta released it in June
    2025 with ViT-L, ViT-H, and ViT-g encoders and an action-conditioned world model (V-JEPA
    2-AC) post-trained on robot video, and in March 2026 added V-JEPA 2.1, a retrained family
    (ViT-B to a 2B-parameter ViT-G) aimed at dense, temporally consistent features.
  source_ids: [vjepa2-readme, vjepa2-blog, vjepa2-paper, vjepa21-paper]
useful_for:
  text: >-
    Video and image representations for classification, action anticipation, and retrieval, and
    as a video encoder for vision-language models; V-JEPA 2-AC is documented for planning robot
    manipulation from image goals.
  source_ids: [vjepa2-readme, hf-vjepa2-vitg-384]
