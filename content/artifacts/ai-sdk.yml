summary:
  text: >-
    The AI SDK is an open-source TypeScript toolkit from Vercel for building AI applications and
    agents. AI SDK Core gives one API for generating text and structured output, calling tools,
    and building agents across model providers, and AI SDK UI provides hooks for chat and
    generative interfaces in web frameworks.
  source_ids: [readme, docs-intro]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Adding model calls, structured output, tool use, and agent loops to TypeScript
    applications, and switching between model providers without rewriting application code.
  source_ids: [readme, docs-intro]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The AI SDK is published in Vercel's vercel organization on GitHub, its LICENSE assigns
    copyright to Vercel, Inc., and its README says the library is created by Vercel and Next.js
    team members with community contributions. Vercel's blog refers to its San Francisco
    headquarters, and its terms name Vercel Inc. under California law. No foundation or
    multi-organization governance is documented.
  source_ids: [repo, license, readme, vercel-blog-hq, vercel-terms]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code and documentation are public, and the package installs from npm. By default,
    model strings are routed through Vercel AI Gateway, which needs its own credentials; provider
    packages allow direct connections to model providers under their own terms.
  source_ids: [readme, repo, ai-gateway-docs]
  reviewed_at: 2026-10-01
licenses:
  - name: Apache License 2.0
    spdx: Apache-2.0
    url: https://github.com/vercel/ai/blob/main/LICENSE
    applies_to: code
    source_ids: [license]
    reviewed_at: 2026-10-01
license_notes:
  text: >-
    The Apache 2.0 license covers the AI SDK code. It does not cover Vercel AI Gateway or the
    model providers the SDK calls; those services have their own terms and pricing.
  source_ids: [license, readme, ai-gateway-docs]
  reviewed_at: 2026-10-01
