summary:
  text: >-
    Chronos is Amazon's family of pretrained time-series forecasting models. It includes the
    original T5-based Chronos models (March 2024, 8M to 710M parameters), the patch-based
    Chronos-Bolt models (November 2024), and Chronos-2 (October 2025), a 120M-parameter
    encoder-only model that adds multivariate and covariate-informed forecasting.
  source_ids: [chronos-readme, chronos2-card]
useful_for:
  text: >-
    The repository describes zero-shot probabilistic forecasting, with local inference through
    the chronos-forecasting package and production deployment on Amazon SageMaker.
  source_ids: [chronos-readme, chronos2-card]
