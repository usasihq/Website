summary:
  text: >-
    PyTorch Lightning is an open-source Python framework that structures PyTorch training code and
    handles engineering tasks such as multi-GPU and multi-node distributed training and mixed
    precision. The same repository contains Lightning Fabric, a lighter layer for scaling custom
    PyTorch training loops, and both ship in the lightning package. It was open-sourced in 2019
    and is maintained by Lightning AI.
  source_ids: [pl-repo, lightning-about]
useful_for:
  text: >-
    Training and fine-tuning PyTorch models on CPUs, GPUs (CUDA or Apple MPS), or TPUs, from a
    single device to multiple nodes, without rewriting the model code.
  source_ids: [pl-repo]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The project is hosted in Lightning AI's GitHub organization, and Lightning AI describes itself
    as the creator of PyTorch Lightning and handled the project's April 2026 security advisory and
    PyPI publishing. Lightning AI's documented entities are U.S.-based: an SEC Form D filed in
    January 2026 by Lightning AI, Inc. (Delaware) gives a San Francisco principal place of
    business, and the website privacy policy gives a New York address for Grid.ai, Inc. doing
    business as Lightning AI. The project's governance page gives final decisions to a single
    project lead and release decisions to its maintainers; this assessment rests on the
    maintaining company, not on individuals.
  source_ids: [pl-repo, lightning-about, pl-advisory, lightning-form-d-2026, lightning-privacy, pl-governance]
  assessed_at: 2026-09-29
