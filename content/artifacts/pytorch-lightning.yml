run_notes:
  - text: >-
      Security: versions 2.6.2 and 2.6.3 uploaded to PyPI on April 30, 2026 were published by an
      attacker using stolen PyPI credentials and ran a credential-stealing payload on import
      (CVE-2026-44484). Lightning AI says the GitHub source was not affected, the two versions were
      quarantined and retired, and anyone who imported them should rotate exposed credentials;
      later releases start at 2.6.4.
    source_ids: [pl-advisory, pl-incident-blog, pl-releases]
