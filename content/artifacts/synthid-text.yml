summary:
  text: >-
    SynthID Text is Google DeepMind's reference implementation of the text watermarking method
    described in its 2024 Nature paper. The method changes only how a language model samples
    tokens, using a configuration built around a sequence of integer keys, and detects the
    watermark from the text without running the model. The repository provides mean, weighted
    mean, and Bayesian scoring functions for detection, a mix-in that adds watermarking to Gemma
    and GPT-2 classes from Hugging Face Transformers, a Colab notebook, and human evaluation
    data.
  source_ids: [ st-readme, st-paper ]
  reviewed_at: 2026-10-08
useful_for:
  text: >-
    Reproducing and studying the paper's watermarking and detection methods. The README says the
    code is for reference and research reproducibility, is not intended for production use, and
    points to the SynthID Text implementation in Hugging Face Transformers for production.
  source_ids: [ st-readme ]
  reviewed_at: 2026-10-08
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    The repository is in Google DeepMind's GitHub organization, and its license section and
    package metadata name DeepMind Technologies Limited, a UK company, as copyright holder and
    author. UK Companies House lists DeepMind Holdings Limited as holding 75% or more of
    DeepMind Technologies Limited's shares and voting rights, and lists Alphabet Inc., a Delaware
    corporation, as holding 75% or more of DeepMind Holdings Limited's. Alphabet's fiscal 2025
    Form 10-K gives its principal executive offices in Mountain View, California. This is the
    same us-control basis as the catalog's google-deepmind record, which treats Google DeepMind
    as part of Google: Google's CEO announced it in April 2023 as a unit combining DeepMind and
    Google Research's Brain team. This review did not examine which entities employ the
    repository's maintainers.
  source_ids: [ st-readme, st-pyproject, ch-dmt-psc, ch-dmh-psc, alphabet-10k-2025-cover, google-blog-gdm-2023 ]
  assessed_at: 2026-10-08
