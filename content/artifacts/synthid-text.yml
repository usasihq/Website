license_notes:
  text: >-
    The README states that all software is under Apache 2.0 and all other materials under CC-BY
    4.0, with copyright held by DeepMind Technologies Limited, and that this is not an official
    Google product. The human evaluation data, which compares watermarked and unwatermarked
    text from Gemma 7B, falls under the "other materials" statement; the README gives code for
    loading the matching prompts separately from the ELI5 dataset.
  source_ids: [ st-readme ]
  reviewed_at: 2026-10-08
checklist:
  source_code:
    status: public
    note: Python source for watermarking, the three detectors, and Bayesian detector training, with tests.
    source_ids: [ st-readme ]
    reviewed_at: 2026-10-08
  documentation:
    status: public
    note: >-
      The README explains the watermarking configuration, applying a watermark, detection, and
      the human data, and links a Colab notebook that runs end to end with Gemma or GPT-2.
    source_ids: [ st-readme ]
    reviewed_at: 2026-10-08
  installation:
    status: public
    note: >-
      Installable from PyPI or from source with pip; the package requires Python 3.9 or later
      and pins specific versions of PyTorch (2.4.0), Transformers (4.43.3), and NumPy.
    source_ids: [ st-readme, st-pyproject ]
    reviewed_at: 2026-10-08
  supported_platforms:
    status: partial
    note: >-
      The package metadata lists Python 3.10 and 3.11 and "OS Independent", but it depends on
      jax[cuda]; the README describes running the notebook on Colab runtimes or locally from
      source. No tested platform list is given.
    source_ids: [ st-pyproject, st-readme ]
    reviewed_at: 2026-10-08
  release_status:
    status: public
    note: >-
      Tagged releases 0.1 through 0.2.1 were published in November 2024, all marked as
      pre-releases on GitHub, and PyPI shows 0.2.1 (uploaded 2024-11-14) as the latest version,
      marked "Development Status :: 4 - Beta".
    source_ids: [ st-releases, st-pypi ]
    reviewed_at: 2026-10-08
run_notes:
  - text: >-
      The README says the Bayesian detector must be trained on watermarked and unwatermarked text
      for each watermarking key, with training data representative of the text the system will
      generate. It also notes that the mix-in uses a static watermarking configuration and that
      the hashing function gives no guarantee of cryptographic security.
    source_ids: [ st-readme ]
    reviewed_at: 2026-10-08
  - text: >-
      For the notebook, the README suggests a GPU with 16GB of memory (such as a T4) for Gemma
      v1.0 2B IT, 32GB (such as an A100) for Gemma v1.0 7B IT, and any runtime for GPT-2. Its
      watermarking example loads Gemma in bfloat16; the README does not say what precision the
      memory suggestions assume.
    source_ids: [ st-readme ]
    reviewed_at: 2026-10-08
  - text: >-
      Google DeepMind and Hugging Face's announcement says SynthID Text was added to Transformers
      in version 4.46.0, that watermarking is less effective on factual responses, and that
      detection confidence falls when text is thoroughly rewritten or translated.
    source_ids: [ hf-synthid-blog ]
    reviewed_at: 2026-10-08
