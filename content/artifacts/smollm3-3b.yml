    The post-training dataset SmolTalk2 states that its newly created subsets are Apache 2.0 and
    that the existing public datasets it includes keep their original licenses.
  source_ids: [smoltalk2-card]
checklist:
  weights:
    status: public
    note: >-
      Final weights are on Hugging Face without gating; intermediate checkpoints, including
      mid-training and SFT checkpoints, are published separately.
    source_ids: [mc-smollm3-3b]
  inference_code:
    status: public
    note: >-
      The card documents inference with Transformers v4.53.0 or later and with vLLM and SGLang,
      and lists quantized options for llama.cpp, ONNX, MLX, MLC, and ExecuTorch.
    source_ids: [mc-smollm3-3b]
  training_code:
    status: public
    note: >-
      Nanotron pretraining configs for the three stages and long-context extension are in the
      huggingface/smollm repository; the mid-training, SFT, and APO configs are in the
      alignment-handbook SmolLM3 recipe.
    source_ids: [mc-smollm3-3b, smollm-text-readme, alignment-handbook-smollm3]
  training_data_information:
    status: public
    note: >-
      The pretraining datasets are listed in a public Hugging Face collection, and the
      mid-training, SFT, and preference data are published as SmolTalk2. Several listed
      datasets are published by third parties (for example DCLM and The Stack v2) under their
      own terms.
    source_ids: [mc-smollm3-3b, smollm3-pretraining-collection, smoltalk2-card]
  training_recipe:
    status: public
    note: >-
      The blog post gives the web, code, and math proportions for each pretraining stage, the
      long-context extension, and the post-training stages; the configs include exact data
      weights.
    source_ids: [smollm3-blog]
  evaluation_materials:
    status: public
    note: >-
      The card reports base and instruct evaluation results run with Hugging Face's lighteval
      and states that evaluation configs and code are in the huggingface/smollm repository.
    source_ids: [mc-smollm3-3b]
run_notes:
  - text: >-
      The card states the shipped config supports 65,536-token context and describes enabling
      YaRN rope scaling (factor 2.0) for inputs up to about 128k tokens; it recommends
      temperature 0.6 and top_p 0.95.
    source_ids: [mc-smollm3-3b]
provenance:
  text: >-
    Post-trained by Hugging Face from its own SmolLM3-3B-Base, which was pretrained from scratch
    on public datasets. The mid-training data (NVIDIA's Llama-Nemotron post-training dataset and
    OpenThoughts3) contains reasoning traces, and several SmolTalk2 SFT subsets were generated
    with Qwen3-32B or DeepSeek-V3, so the post-training data includes outputs of third-party
    models.
  derived_from:
    - name: SmolLM3-3B-Base
      artifact_slug: null
      url: https://huggingface.co/HuggingFaceTB/SmolLM3-3B-Base
      note: Hugging Face base model; no separate catalog record.
    - name: FineWeb-Edu (subset of FineWeb)
      artifact_slug: fineweb
      url: https://huggingface.co/datasets/HuggingFaceFW/fineweb-edu
      note: One of the web pretraining datasets.
    - name: SmolTalk2
      artifact_slug: null
      url: https://huggingface.co/datasets/HuggingFaceTB/smoltalk2
      note: Mid-training, SFT, and preference data.
  source_ids: [mc-smollm3-3b, smollm3-blog, smollm3-pretraining-collection, smoltalk2-card]
