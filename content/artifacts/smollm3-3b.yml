summary:
  text: >-
    SmolLM3-3B is the instruct model of Hugging Face's SmolLM3 release (July 2025), a 3B-parameter
    decoder-only transformer pretrained on about 11 trillion tokens of web, code, math, and
    reasoning data in stages, then mid-trained on reasoning data and aligned with supervised
    fine-tuning and Anchored Preference Optimization. It can answer with or without an extended
    reasoning trace, supports tool calling, and natively covers six European languages.
  source_ids: [mc-smollm3-3b, smollm3-blog]
useful_for:
  text: >-
    The model card documents chat with switchable extended thinking (/think and /no_think),
    tool calling with XML- or Python-style tool definitions, and long inputs; the SmolLM
    repository describes the family as small enough for on-device use.
  source_ids: [mc-smollm3-3b, smollm-repo-readme]
