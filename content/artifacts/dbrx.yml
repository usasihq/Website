availability:
  status: not_public
  access_conditions: >-
    No longer distributed by Databricks. Its Hugging Face organization lists no public models, Hugging Face's
    Transformers documentation states the original DBRX Instruct checkpoint was closed, and Databricks retired DBRX
    from its Foundation Model APIs and fine-tuning service during 2025. Copies uploaded by third parties remain on
    Hugging Face but are not Databricks distributions.
