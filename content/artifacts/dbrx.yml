summary:
  text: >-
    DBRX is a decoder-only language model from Databricks that uses a fine-grained mixture-of-experts design with
    132B total and 36B active parameters (16 experts, 4 active per input), pretrained on 12T tokens of text and code
    with a 32K-token context. It was released on March 27, 2024 as DBRX Base and the finetuned DBRX Instruct.
  source_ids: [dbrx-blog, hf-transformers-dbrx]
