archive_note: >-
  Historical record. Databricks no longer distributes DBRX Base: its Hugging Face organization lists no public models,
  the databricks/dbrx GitHub repository returned HTTP 404 when checked on 2026-09-29, and DBRX was retired from
  Databricks' Foundation Model APIs and fine-tuning service in 2025.
