summary:
  text: >-
    DBRX Base is the pretrained version of DBRX, a mixture-of-experts language model with 132B total and 36B active
    parameters (16 experts, 4 active per input) trained on 12T tokens of text and code with a 32K-token context.
  source_ids: [dbrx-blog, hf-transformers-dbrx]
useful_for: null
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    DBRX Base was developed and released by Databricks, which states on its About page that it is headquartered in San
    Francisco, California.
  source_ids: [dbrx-blog, databricks-about]
  assessed_at: 2026-09-29
availability:
  status: not_public
  access_conditions: >-
    Weights were published on Hugging Face at release in March 2024. As of this review Databricks' Hugging Face
    organization lists no public models, and Databricks retired DBRX from its hosted Foundation Model
    APIs and fine-tuning service during 2025.
  source_ids: [dbrx-blog, databricks-hf-org, hf-transformers-dbrx, databricks-retired-models, databricks-release-notes-2025-04]
licenses:
  - name: Databricks Open Model License
    spdx: null
    url: https://www.databricks.com/legal/open-model-license
    applies_to: weights-and-code
    source_ids: [dbrx-license]
license_notes:
  text: >-
    Custom license dated March 27, 2024 covering the DBRX models, weights, and code identified at the databricks/dbrx
    GitHub repository. It grants a royalty-free limited license to use, modify, and distribute DBRX, but prohibits
    using DBRX, its derivatives, or its outputs to improve other large language models; requires a separate license
    from Databricks for licensees whose products had more than 700 million monthly active users on the release date;
    and requires compliance with the Databricks Open Model Acceptable Use Policy.
  source_ids: [dbrx-license, dbrx-aup]
checklist:
  weights:
    status: not_public
    note: >-
      Published on Hugging Face at release (March 2024). Databricks' Hugging Face organization now lists no public models, so the official checkpoint is no longer publicly downloadable.
    source_ids: [dbrx-blog, databricks-hf-org, hf-transformers-dbrx]
  inference_code:
    status: public
    note: >-
      Hugging Face Transformers includes a DBRX model implementation (DbrxForCausalLM). The databricks/dbrx GitHub
      repository referenced at release returned HTTP 404 when checked on 2026-09-29.
    source_ids: [hf-transformers-dbrx]
  training_code:
    status: unknown
    note: >-
      The announcement says DBRX was trained with optimized versions of Databricks' open-source libraries MegaBlocks,
      LLM Foundry, Composer, and Streaming; the exact training code used for DBRX was not located.
    source_ids: [dbrx-blog]
  training_data_information:
    status: unknown
    note: >-
      The announcement gives only a high-level description (12T tokens of curated text and code, processed with
      Databricks tools) and does not list data sources.
    source_ids: [dbrx-blog]
  training_recipe:
    status: partial
    note: >-
      The announcement describes the architecture, curriculum learning over the data mix, and the training cluster
      (3,072 NVIDIA H100 GPUs) at a high level, without a full training configuration.
    source_ids: [dbrx-blog]
  evaluation_materials:
    status: partial
    note: Benchmark results were published in the announcement; evaluation code specific to this release was not assessed.
    source_ids: [dbrx-blog]
run_notes: []
provenance:
  text: Pretrained by Databricks on 12T tokens of text and code, per the release announcement.
  derived_from: []
  source_ids: [dbrx-blog]
tags: [language-model, mixture-of-experts]
