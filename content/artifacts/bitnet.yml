summary:
  text: >-
    bitnet.cpp is Microsoft's official inference framework for 1-bit large language models,
    such as BitNet b1.58, whose weights are ternary (1.58-bit). It provides optimized kernels for
    running these models on x86 and ARM CPUs, with a separate GPU inference kernel, and is based
    on llama.cpp.
  source_ids: [readme]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Running ternary BitNet models locally on CPUs, including Microsoft's BitNet b1.58 2B4T
    language model and BitNet embedding models.
  source_ids: [readme, model-card]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The repository is in Microsoft's GitHub organization, the README describes bitnet.cpp as the
    official inference framework for 1-bit LLMs, and the LICENSE names Microsoft Corporation as
    copyright holder. Microsoft is headquartered in the United States (see the Microsoft record).
  source_ids: [license, readme]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: null
