    applies_to: code
    source_ids: [license]
    reviewed_at: 2026-10-01
license_notes:
  text: >-
    The MIT entry covers the bitnet.cpp code. The BitNet b1.58 2B4T weights are published
    separately on Hugging Face; that model card states that the model weights and code are
    released under the MIT License, and its LICENSE file names Microsoft Corporation.
  source_ids: [license, model-card, model-license]
  reviewed_at: 2026-10-01
checklist:
  source_code:
    status: public
    note: Public repository in Microsoft's GitHub organization.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  documentation:
    status: public
    note: The README documents requirements, building, usage, benchmarking, and checkpoint conversion, with linked guides for the GPU kernel and CPU optimizations.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      Build from source with Python 3.10 or later, CMake 3.22 or later, and Clang 18 or later
      (Visual Studio 2022 tooling on Windows); conda is recommended. A setup script prepares a
      downloaded model and builds the kernels.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      The README lists which CPU kernels (I2_S, TL1, TL2) support each model on x86 and ARM, and
      gives build instructions for Windows and Debian/Ubuntu. GPU inference uses a separate
      kernel documented in the repository.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  release_status:
    status: partial
    note: >-
      The README announces bitnet.cpp 1.0 (October 17, 2024) and later kernel updates, but the
      GitHub repository has no published releases; it is built from the main branch.
    source_ids: [readme, releases]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The BitNet b1.58 2B4T model card says its efficiency benefits require bitnet.cpp; running
      the model with the standard Transformers library is not expected to give speed, latency,
      or energy gains.
    source_ids: [model-card]
    reviewed_at: 2026-10-01
  - text: >-
      The README's build example downloads the GGUF version of BitNet b1.58 2B4T from Hugging
      Face and prepares it with the i2_s quantization type.
    source_ids: [readme]
    reviewed_at: 2026-10-01
provenance:
  text: >-
    bitnet.cpp is based on the llama.cpp framework, and its kernels build on the lookup-table
    methods of Microsoft's T-MAC project, per the README.
  derived_from:
    - name: llama.cpp
      artifact_slug: llama-cpp
      url: https://github.com/ggml-org/llama.cpp
      note: Framework that bitnet.cpp is based on.
    - name: T-MAC
      artifact_slug: null
      url: https://github.com/microsoft/T-MAC
      note: Lookup-table kernel methods.
  source_ids: [readme]
