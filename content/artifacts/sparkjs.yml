summary:
  text: >-
    Spark is an open-source JavaScript renderer for 3D Gaussian splats built on THREE.js, made
    by World Labs. It renders splats together with ordinary meshes, loads common splat formats
    such as PLY, SPZ, and SPLAT, and lets splats be edited and animated on the GPU. Spark 2.0
    added a level-of-detail system for streaming large splat worlds.
  source_ids: [repo, spark-site, spark2-blog]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Displaying 3D Gaussian splat scenes, including worlds exported from World Labs' Marble, in
    web pages and THREE.js applications.
  source_ids: [repo, spark2-blog]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The README and documentation site say Spark is built by World Labs, and the LICENSE assigns
    copyright to World Labs Technologies, Inc. World Labs' terms of service give that company's
    address in San Francisco, California, and AMD's September 2026 press release describes
    World Labs as headquartered in San Francisco. AMD's announced acquisition of World Labs was
    pending as of this assessment and will be reassessed if it completes. Eligibility rests on
    the maintaining company, not on contributors.
  source_ids: [repo, spark-site, license, wl-terms, amd-ir-world-labs]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code, documentation, and npm and CDN builds are public. Splat assets used in the
    examples are fetched from remote URLs and are not part of the code license.
  source_ids: [repo, spark-docs]
  reviewed_at: 2026-10-01
