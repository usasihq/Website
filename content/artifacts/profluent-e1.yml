summary:
  text: >-
    Profluent-E1 is a family of protein encoder language models from Profluent, announced in
    November 2025 in 150M, 300M, and 600M parameter sizes. The models can take homologous
    sequences alongside a query sequence (retrieval augmentation) or run on a single sequence,
    and Profluent presents them as drop-in replacements for ESM-family encoders.
  reviewed_at: 2026-10-01
  source_ids: [profluent-e1-showcase, e1-readme, hf-profluent-models]
useful_for:
  text: >-
    Profluent describes uses in protein fitness prediction, structure prediction, and
    representation learning; the repository includes notebooks for embeddings, zero-shot
    fitness prediction of substitution mutants, and in-silico site-saturation mutagenesis.
  reviewed_at: 2026-10-01
  source_ids: [profluent-e1-showcase, e1-readme]
