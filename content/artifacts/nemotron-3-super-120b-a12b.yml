  source_ids: [nvidia-nemotron-open-model-license]
checklist:
  weights:
    status: public
    note: BF16, FP8, and NVFP4 post-trained checkpoints and a BF16 base checkpoint are published on Hugging Face.
    source_ids: [super-model-card, super-recipe-doc, super-hf-metadata]
  inference_code:
    status: public
    note: The model card gives deployment instructions for vLLM, SGLang, TensorRT-LLM, and Transformers.
    source_ids: [super-model-card]
  training_code:
    status: public
    note: >-
      The Apache-2.0 Nemotron Developer Repository provides pretraining, SFT, RL, and evaluation
      stages built on Megatron-Bridge, NeMo RL, and NeMo Evaluator.
    source_ids: [super-recipe-doc, nemotron-repo-license]
  legacy_training_data_information:
    status: partial
    note: >-
      The model card lists the pre- and post-training datasets. Major portions are released in
      Hugging Face collections, some requiring access approval, while several third-party and
      NVIDIA datasets are listed as private and not publicly accessible.
    source_ids: [super-model-card, nemotron-pretraining-collection]
  training_recipe:
    status: public
    note: >-
      The recipe documents each stage described in the model card (pretraining, SFT, and RL)
      plus quantization and evaluation. NVIDIA notes the recipes use only the open-sourced data
      subset, so results will differ, and marks a knowledge-distillation stage as not yet published.
    source_ids: [super-recipe-doc, super-model-card]
  evaluation_materials:
    status: public
    note: >-
      The model card publishes benchmark results collected with the NeMo Evaluator SDK; it says
      some benchmarks used internal scaffolding not yet open-sourced.
    source_ids: [super-model-card]
  training_data_access:
    status: partial
    note: >-
      The model card says NVIDIA releases its final pre-training and post-training data, with an
      ungated sample set and gating and approval required for the remaining code, math, and
      multilingual data. It also lists third-party and NVIDIA datasets used in training as
      private and not publicly accessible.
    source_ids: [super-model-card]
    reviewed_at: 2026-10-02
run_notes:
  - text: >-
      The model card documents serving with vLLM, SGLang, TensorRT-LLM, and Transformers, and
      states a minimum of 8x H100-80GB GPUs for the BF16 checkpoint; it points to the NVFP4
      checkpoint for running on a single B200 or DGX Spark.
    source_ids: [super-model-card]
provenance:
  text: >-
    Post-trained by NVIDIA (supervised fine-tuning and reinforcement learning) from its own
    pre-trained Nemotron 3 Super base checkpoint. The model card says post-training synthetic
    data was generated with teacher models, including third-party open models such as
    GPT-OSS-120B.
  derived_from:
    - name: NVIDIA-Nemotron-3-Super-120B-A12B-Base-BF16
      artifact_slug: null
      url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-Base-BF16
      note: NVIDIA's pre-trained base checkpoint for this release.
  source_ids: [super-model-card]
