summary:
  text: >-
    Nemotron 3 Super is an NVIDIA language model with 120B total and 12B active parameters,
    using a hybrid Mamba-2 and attention architecture with latent mixture-of-experts layers
    and multi-token prediction, and configurable reasoning. NVIDIA released BF16, FP8, and
    NVFP4 checkpoints and a separate base checkpoint on Hugging Face.
  source_ids: [super-model-card, super-recipe-doc]
useful_for:
  text: >-
    The model card lists agentic workflows, long-context reasoning, high-volume workloads such
    as IT ticket automation, tool use, and retrieval-augmented generation, and states the model
    is ready for commercial use.
  source_ids: [super-model-card]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model card names NVIDIA Corporation as the model developer. NVIDIA's principal
    executive offices are in Santa Clara, California, per its Form 10-Q for the quarter ended
    July 26, 2026.
  source_ids: [super-model-card, nvidia-10q-q2fy2027]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Weights are downloadable from Hugging Face under the NVIDIA Nemotron Open Model License;
    the repository metadata showed no access gate when checked. The NIM container version is
    covered by separate NVIDIA software license terms.
  source_ids: [super-model-card, super-hf-metadata]
