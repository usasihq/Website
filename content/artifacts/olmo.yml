summary:
  text: >-
    OLMo (styled Olmo in recent releases) is Ai2's series of open language models. Releases
    have included the first OLMo 1B and 7B models (February 2024), OLMoE (September 2024),
    OLMo 2 (November 2024 to May 2025), and Olmo 3 at 7B and 32B (November 2025), with Olmo
    3.1 32B checkpoints added in December 2025. In March 2026 Ai2 also released Olmo Hybrid, a
    7B model that mixes attention layers with linear RNN layers.
  source_ids: [ai2-release-notes, ai2-olmo3-blog, ai2-olmohybrid-blog]
useful_for:
  text: >-
    Ai2 presents the series as a way to study how language models are built, publishing
    training data, code, intermediate checkpoints, and evaluation tools alongside the weights.
    The current Olmo 3 line includes base, Instruct (chat and tool use), and Think
    (reasoning) variants.
  source_ids: [ai2-docs-olmo, ai2-olmo-page]
