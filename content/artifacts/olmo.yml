provenance:
  text: >-
    Olmo 3 is pretrained on Dolma 3, the latest version of Ai2's Dolma corpus, and
    post-trained on the Dolci datasets. Earlier 2024 releases used earlier Dolma versions
    (for example, Dolma v1.7 for OLMo 7B April 2024).
