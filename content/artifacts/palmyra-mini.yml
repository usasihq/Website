summary:
  text: >-
    A small text model from Writer, fine-tuned from Qwen2.5-1.5B, that the model card lists
    at 1.7 billion parameters with a 131,072-token context window. It is the non-reasoning
    member of the three-model Palmyra-mini family that Writer released in September 2025.
  source_ids: [palmyra-mini-card, palmyra-mini-blog]
useful_for:
  text: >-
    The model card describes it as intended for research and development in generative AI,
    particularly tasks that need mathematical and logical reasoning. Writer's engineering
    post describes running the Palmyra-mini models locally, including on an iPhone with
    llama.cpp.
  source_ids: [palmyra-mini-card, writer-eng-palmyra-mini]
