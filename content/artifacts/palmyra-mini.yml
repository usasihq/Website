    and platform services agreement. The base model, Qwen2.5-1.5B, comes from Alibaba Cloud's
    Qwen family and is not thereby U.S.-developed; eligibility here rests on Writer as the
    developer and maintainer of this fine-tune.
  source_ids: [palmyra-mini-card, writer-company, writer-psa, qwen-hf-org]
