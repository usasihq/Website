summary:
  text: >-
    StarCoder2 is a family of code generation models from the BigCode project, released on
    February 28, 2024 in 3B, 7B, and 15B sizes and trained on The Stack v2. Per Hugging Face's
    announcement, ServiceNow trained the 3B model, Hugging Face the 7B model, and NVIDIA the
    15B model. The bigcode organization on Hugging Face also hosts an instruction-tuned
    variant, StarCoder2-15B-Instruct-v0.1.
  source_ids: [hf-starcoder2-blog, starcoder2-paper, hf-bigcode-api]
useful_for:
  text: >-
    The base models are intended for code completion and fill-in-the-middle tasks; the model
    cards say they are not instruction models.
  source_ids: [starcoder2-15b-card, starcoder2-repo]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Multi-organization assessment. The StarCoder2 report says the BigCode project is
    stewarded by ServiceNow and Hugging Face, and Hugging Face's announcement describes it as
    led jointly by the two. ServiceNow, Inc. is headquartered in Santa Clara, California (2025
    Form 10-K). Hugging Face's privacy policy names Hugging Face, Inc. as the provider of its
    services and says the company and its servers are located in the United States, with
    Hugging Face SAS in Paris as its EU main establishment (see the Hugging Face record for
    the full dual-country assessment). Contributors to BigCode come from many institutions, including
    outside the United States; eligibility rests on the two documented stewards, not on
    contributors. Each release is assessed on its own record.
  source_ids: [starcoder2-paper-html, hf-starcoder2-blog, now-10k-2025, hf-privacy]
  assessed_at: 2026-09-29
