summary:
  text: >-
    Continue is an open-source AI coding agent that ships as a VS Code extension, a JetBrains
    plugin, and a command-line tool. Its maintainers put out a final 2.0.0 release, which removed
    anonymous telemetry and the authentication layer. The repository now says it is no longer
    actively maintained and is read-only.
  source_ids: [continue-readme, continue-docs]
useful_for:
  text: >-
    AI-assisted coding inside VS Code, JetBrains IDEs, or a terminal, with custom AI code agents
    that developers can create, share, and use. The code can serve as a base for forks under its
    Apache 2.0 license.
  source_ids: [continue-docs, continue-readme, continue-license]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The LICENSE file and the README assign copyright to Continue Dev, Inc. Continue's terms of
    service give a San Francisco, California street address for Continue Dev, Inc. and deem the
    service based in California, and Y Combinator lists the company in San Francisco. Continue's
    website says the company has since been acquired by
    Cursor, whose terms of service name Anysphere, Inc. as its provider. No foundation or
    community governance body has taken over maintenance, and the repository is no longer
    actively maintained.
  source_ids: [continue-license, continue-readme, continue-tos, yc-continue, continue-home, cursor-tos]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    The code is still downloadable, but the repository is read-only and no longer actively
    maintained.
  source_ids: [continue-repo, continue-readme, continue-license]
