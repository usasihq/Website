license_notes:
  text: >-
    Custom Liquid AI license (card license field "lfm1.0") modeled on Apache 2.0. It grants
    perpetual, royalty-free copyright and patent licenses, requires redistributors to include
    the license and mark modified files, and ends patent rights for anyone who files patent
    litigation over the work. Section 5 makes commercial rights conditional on the licensee's
    legal entity not exceeding a "Threshold" defined as annual revenue of US$10,000,000 or more,
    and states that commercial use by a legal entity that exceeds the Threshold is not licensed.
    The Threshold does not apply to a qualified non-profit organization's use for non-commercial
    or research purposes. Liquid's license page FAQ says fine-tuned models may be kept
    proprietary and that hosting platforms may host and distribute the models. The release post
    describes the weights as deployable without restrictions; the license text limits commercial
    use as described here.
  source_ids: [lfm25-8b-license-file, liquid-lfm-license, lfm25-8b-blog]
checklist:
  weights:
    status: public
    note: Ungated safetensors weights on Hugging Face; GGUF, ONNX, and MLX conversions are published as separate repositories.
    source_ids: [mc-lfm25-8b-a1b]
  inference_code:
    status: public
    note: >-
      The model card documents inference with Hugging Face Transformers (5.0.0 or later), vLLM,
      SGLang, llama.cpp, MLX, and LM Studio; no custom modeling code is needed in the repository.
    source_ids: [mc-lfm25-8b-a1b]
  training_code:
    status: unknown
    note: >-
      No training code release was found in the model card, release post, or LFM2 technical
      report. Liquid documents fine-tuning with third-party tools (Unsloth, TRL), which is not
      training code for this release.
    source_ids: []
  legacy_training_data_information:
    status: unknown
    note: The model card and release post give the 38-trillion-token pretraining budget but do not describe data sources or composition.
    source_ids: []
  training_recipe:
    status: partial
    note: >-
      The release post outlines the stages at a high level (scaled-up pretraining, context
      extension to 32K and then 128K tokens, reasoning training, preference optimization against
      repetitive loops, and reward-based hallucination mitigation) without full configurations.
    source_ids: [lfm25-8b-blog]
  evaluation_materials:
    status: partial
    note: The model card and release post report benchmark tables; evaluation code or prompts are not linked.
    source_ids: [mc-lfm25-8b-a1b, lfm25-8b-blog]
run_notes:
  - text: >-
      The model card recommends temperature 0.2, top_k 80, and repetition_penalty 1.05, and
      shows Transformers loading in bfloat16. It also points to a separate 328M speculative
      decoding drafter, LFM2.5-8B-A1B-DSpark, for use with SGLang.
    source_ids: [mc-lfm25-8b-a1b]
provenance:
