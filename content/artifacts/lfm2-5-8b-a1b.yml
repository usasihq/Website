summary:
  text: >-
    A text-only mixture-of-experts model with 8.3B total and 1.5B active parameters, built from
    18 double-gated convolution blocks and 6 grouped-query attention blocks. Liquid AI pretrained
    it on 38 trillion tokens, extended its context to 128,000 tokens, and tuned it for reasoning;
    it writes a chain of thought before its final answer. It succeeds LFM2-8B-A1B.
  source_ids: [mc-lfm25-8b-a1b, lfm25-8b-blog]
useful_for:
  text: >-
    The model card recommends it for agentic workflows, tool use, structured outputs,
    multilingual assistants, and on-device personal-assistant applications, and says it is not
    the best fit for heavy programming or knowledge-intensive question answering without
    retrieval.
  source_ids: [mc-lfm25-8b-a1b]
