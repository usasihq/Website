checklist:
  source_code:
    status: public
    note: Public GitHub repository under the Apache License 2.0.
    source_ids: [fastvideo-repo, fastvideo-license]
    reviewed_at: 2026-10-01
  documentation:
    status: public
    note: >-
      The documentation site covers installation, an inference quick start, training
      workflows, optimizations, and a support matrix; a cookbook gives model-specific recipes.
    source_ids: [fastvideo-docs, fastvideo-repo]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      The README recommends creating a uv environment and installing the fastvideo package with
      a CUDA 12 or CUDA 13 PyTorch backend. Apple Silicon users follow an MLX install guide, and
      NVIDIA DGX Spark (ARM64) requires an editable install from source.
    source_ids: [fastvideo-repo]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      The README lists H100, A100, and RTX 4090 GPUs and Linux, Windows, and macOS, plus MLX on
      Apple Silicon, and links a support matrix of models, hardware assumptions, and
      optimization compatibility.
    source_ids: [fastvideo-repo, fastvideo-docs]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Versioned GitHub releases are published; the most recent listed is v0.2.0, released June
      4, 2026.
    source_ids: [fastvideo-releases]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The README's quick start creates a Python 3.12 environment with uv and installs FastVideo
      with UV_TORCH_BACKEND=cu126 (CUDA 12) or cu130 (CUDA 13). It notes that there is no
      prebuilt ARM wheel for the FastVideo CUDA kernel, so DGX Spark installs compile it from
      source.
    source_ids: [fastvideo-repo]
    reviewed_at: 2026-10-01
provenance:
  text: >-
    The README states that FastVideo learned design ideas from and reused code from Wan-Video,
    ThunderKittens, DMD2, diffusers, xDiT, vLLM, and SGLang. Checkpoints released through the
    project, such as the FastH3 models, are distilled from third-party base models (for example
    MiniMax-H3); those base models are not developed by the Hao AI Lab.
  derived_from: []
  source_ids: [fastvideo-repo]
