summary:
  text: >-
    FastVideo is a post-training and inference framework for accelerated video generation,
    maintained by the Hao AI Lab at UC San Diego. Its README lists full and LoRA fine-tuning of
    open video diffusion transformers, Distribution Matching Distillation (DMD2), Video Sparse
    Attention and sparse distillation, causal distillation through Self-Forcing, and
    sequence-parallel distributed training and inference.
  source_ids: [fastvideo-repo, haolab-home]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Fine-tuning and distilling open video generation models so they need fewer denoising steps,
    and running them with optimized attention backends through a command-line interface or
    Python API. The README also describes a real-time video generation and editing app built on
    the framework.
  source_ids: [fastvideo-repo]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    FastVideo is maintained in the Hao AI Lab's GitHub organization. The Hao AI Lab describes
    itself as a lab at UC San Diego that develops and maintains open-source models, evaluations,
    and systems. UC San Diego is a public university campus of the University of California in
    La Jolla, California. Eligibility rests on the maintaining lab; the base video models that
    FastVideo fine-tunes or distills come from other developers and are not assessed here.
  source_ids: [fastvideo-repo, hao-github, haolab-home, ucsd-catalog]
  assessed_at: 2026-10-01
