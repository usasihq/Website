summary:
  text: >-
    Nemotron is NVIDIA's family of models for building AI agents. The current generation is
    organized into Nano, Lightning, Super, and Ultra tiers; NVIDIA publishes the weights on
    Hugging Face and, for several releases, training datasets and training recipes.
  source_ids: [nemotron-dev-page, nemotron-hf-collection, nemotron-repo-readme]
useful_for:
  text: >-
    NVIDIA describes the tiers as ranging from efficient sub-agents and high-volume task
    execution to multi-agent reasoning and complex agentic tasks.
  source_ids: [nemotron-dev-page, nemotron-repo-readme]
