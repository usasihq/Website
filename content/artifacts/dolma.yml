  text: >-
    Dolma moved to ODC-BY in April 2024, per the v1.x dataset card, which also states that
    users remain bound by the terms of the original data sources. The Dolma 3 cards state the
    data is intended for research and educational use under Ai2's Responsible Use Guidelines.
  source_ids: [dolma-card, dolma3-pool]
checklist:
