    Dolma is created and published by Ai2 (Allen Institute for AI) under its Hugging Face and
    GitHub organizations, and Ai2's documentation presents it as Ai2's training corpus. Ai2
    describes itself as a Seattle-based non-profit AI research institute.
  source_ids: [ai2-docs-dolma, dolma-card, dolma-toolkit-repo, ai2-about]
  assessed_at: 2026-09-29
