summary:
  text: >-
    Dolma is Ai2's family of English pretraining corpora built from web pages, academic
    publications, code, and encyclopedic text, used to train the OLMo models. The first
    release (v1, August 2023) was updated through v1.7 (April 2024); Dolma 3, used for Olmo 3,
    consists of a pool of about 9.3 trillion tokens and curated pretraining, mid-training, and
    long-context mixes. A Dolma 3.5 pool with additional sources and filtering has since been
    published.
  source_ids: [dolma-card, dolma3-pool, dolma3-repo, ai2-docs-dolma, dolma35-pool]
useful_for:
  text: >-
    Documented for language model pretraining and research on pretraining data. The
    accompanying Dolma toolkit supports tagging, deduplication, mixing, filtering, and
    tokenization for reproducing or building similar corpora.
  source_ids: [ai2-docs-dolma, dolma-paper]
eligibility:
  status: eligible
  basis: us-governed-project
