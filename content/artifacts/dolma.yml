    source_ids: [dolma-card, dolma3-pool, dolma3-mix-7b]
  documentation:
    status: public
    note: >-
      The Dolma paper includes a datasheet appendix; the dolma3 repository documents how the
      Dolma 3 datasets were built.
    source_ids: [dolma-paper, dolma-card, dolma3-repo]
  licensing:
    status: public
    note: ODC-BY for the data; Apache 2.0 for the toolkit code.
    source_ids: [dolma-card, dolma3-pool, dolma-toolkit-license]
  stated_limitations:
    status: public
    note: >-
      The paper's Limitations section notes the English-only focus, incomplete coverage of
      curation practices, ablations run only at 1B scale, and that full manual inspection of
      the corpus is not feasible. The Olmo 3 7B mix card notes that some PDFs were redacted
      after training.
    source_ids: [dolma-paper, dolma3-mix-7b]
run_notes: []
provenance:
  text: >-
    Assembled by Ai2 from existing sources. Dolma v1.7 draws on Common Crawl, RefinedWeb,
    StarCoder, C4, Reddit, peS2o, arXiv and StackExchange via RedPajama, and Wikipedia, among
    others. The Dolma 3 pool combines Common Crawl, olmOCR-processed science PDFs, Stack-Edu,
    arXiv, FineMath, and Wikipedia.
  derived_from:
    - name: Common Crawl
      artifact_slug: null
      url: null
      note: Main web source across versions.
    - name: Stack-Edu
      artifact_slug: null
      url: https://huggingface.co/datasets/HuggingFaceTB/stack-edu
      note: Code source in the Dolma 3 pool.
    - name: FineMath
      artifact_slug: null
      url: https://huggingface.co/datasets/HuggingFaceTB/finemath
      note: Math web pages in the Dolma 3 pool.
  source_ids: [dolma-card, dolma3-pool]
