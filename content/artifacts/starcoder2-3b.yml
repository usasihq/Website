license_notes:
  text: >-
    BigCode OpenRAIL-M v1 is a custom responsible-AI license. It grants royalty-free rights to
    use, modify, and share the model, including commercially, but makes compliance with the
    use restrictions in its Attachment A a condition of the grant and requires those
    restrictions to be carried into any shared copies or modifications. It does not cover
    source code or training data. The card adds that the model can reproduce training code
    verbatim, which may carry its own license and attribution requirements.
  source_ids: [bigcode-openrail-m, starcoder2-3b-card]
checklist:
  weights:
    status: public
    note: null
    source_ids: [starcoder2-3b-card, hf-api-starcoder2-3b]
  inference_code:
    status: public
    note: >-
      The card and repository document inference with Hugging Face Transformers and serving
      with text-generation-inference.
    source_ids: [starcoder2-3b-card, starcoder2-repo]
  training_code:
    status: unknown
    note: >-
      The StarCoder2 repository publishes only a LoRA fine-tuning script, which the rubric does
      not count as training code for the base model. The card does not name the pretraining
      framework, and this catalog did not find the pretraining code for this model published.
    source_ids: [starcoder2-3b-card, starcoder2-repo]
  training_data_information:
    status: partial
    note: >-
      The Stack v2 is on Hugging Face behind a terms-of-use acceptance, with provenance
      information for each file, but its terms say bulk download of the file contents
      requires an agreement with Software Heritage and Inria.
    source_ids: [stack-v2-card, starcoder2-paper-html]
  training_recipe:
    status: partial
    note: >-
      The card documents architecture, objective, token count (3+ trillion), 1.2 million
      pretraining steps, bfloat16 precision, and 160 A100 GPUs; the report describes base
      training at a 4k context window followed by 16k long-context training.
    source_ids: [starcoder2-3b-card, starcoder2-paper-html]
  evaluation_materials:
    status: public
    note: >-
      The card and report give benchmark results. The StarCoder2 repository directs users to the
      public BigCode Evaluation Harness to evaluate StarCoder2 models, and the report documents
      its prompts and says evaluation code is available through that harness. This catalog did
      not confirm that the harness covers every reported evaluation.
    source_ids: [starcoder2-3b-card, starcoder2-repo, starcoder2-paper-html]
run_notes:
  - text: >-
      The model card reports memory footprints measured with Transformers'
      get_memory_footprint (model weights only): 12,624.81 MB in full precision, 6,312.41 MB
      in bfloat16, 3,434.07 MB with 8-bit bitsandbytes quantization, and 1,994.90 MB with
      4-bit quantization.
    source_ids: [starcoder2-3b-card]
provenance:
  text: >-
    Trained by ServiceNow for the BigCode project on The Stack v2 (built from the Software
    Heritage archive, with opt-out requests excluded) and additional sources such as arXiv
    and Wikipedia.
  derived_from:
    - name: The Stack v2 (train split)
      artifact_slug: null
      url: https://huggingface.co/datasets/bigcode/the-stack-v2-train
      note: Pretraining data; no separate catalog record.
  source_ids: [starcoder2-3b-card, hf-starcoder2-blog, stack-v2-card]
