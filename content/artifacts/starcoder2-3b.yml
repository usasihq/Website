summary:
  text: >-
    The smallest StarCoder2 base model, with about 3B parameters, trained on more than 3
    trillion tokens from The Stack v2 and other sources. Its model card lists 17 programming
    languages, grouped-query attention, a 16,384-token context window with 4,096-token
    sliding-window attention, and a fill-in-the-middle objective. ServiceNow trained it for
    the BigCode project.
  source_ids: [starcoder2-3b-card, hf-starcoder2-blog, hf-api-starcoder2-3b]
useful_for:
  text: >-
    Code completion. The card notes it is not an instruction model, so commands such as
    "write a function that..." do not work well.
  source_ids: [starcoder2-3b-card]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Published in the BigCode organization on Hugging Face and trained by ServiceNow,
    according to Hugging Face's announcement. The StarCoder2 report says BigCode is stewarded
    by ServiceNow (Santa Clara, California, per its 2025 Form 10-K) and Hugging Face (whose
    privacy policy names Hugging Face, Inc. as its service provider and says the company is
    located in the United States). Eligibility rests on these documented organizations, not
    on individual contributors.
  source_ids: [starcoder2-3b-card, starcoder2-paper-html, hf-starcoder2-blog, now-10k-2025, hf-privacy]
  assessed_at: 2026-09-29
