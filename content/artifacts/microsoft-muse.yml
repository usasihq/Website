summary:
  text: >-
    Muse is Microsoft Research's name for its World and Human Action Model (WHAM), a generative
    model of gameplay trained on human play data from the Xbox game Bleeding Edge. It can
    generate game visuals, controller actions, or both. It was developed by Microsoft Research's
    Game Intelligence and Teachable AI Experiences teams with Ninja Theory.
  source_ids: [msr-muse-blog, wham-model-card]
useful_for:
  text: >-
    Microsoft describes it as a research model for exploring how generative AI can support
    gameplay ideation. The model card says it is intended for academic research only.
  source_ids: [msr-muse-blog, wham-model-card]
