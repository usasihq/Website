    note: PyTorch and Flax checkpoints are published on Hugging Face without an access gate.
    source_ids: [timesfm25-hf-api, timesfm25-flax-hf-api, timesfm-readme]
  inference_code:
    status: public
    note: The Apache-2.0 timesfm package provides inference code; the model card includes a PyTorch example.
    source_ids: [timesfm25-card, timesfm-readme, timesfm-license]
  training_code:
    status: unknown
    note: >-
      A LoRA fine-tuning example (Transformers with PEFT) was added in April 2026; no
      pre-training code for version 2.5 was found.
    source_ids: [timesfm-readme]
  legacy_training_data_information:
    status: partial
    note: >-
      The model card lists GiftEvalPretrain, Wikimedia pageviews (cutoff November 2023),
      Google Trends top queries (cutoff end of 2022), and synthetic and augmented data. The
      synthetic data is not documented as released.
    source_ids: [timesfm25-card]
  training_recipe:
    status: unknown
    note: >-
      The ICML 2024 paper describes the original TimesFM approach; the changes in 2.5 are
      summarized only as a list in the README.
    source_ids: [timesfm25-card, timesfm-readme]
  evaluation_materials:
    status: unknown
    note: No evaluation results or evaluation code specific to 2.5 were found in the sources read.
    source_ids: []
run_notes:
  - text: >-
      The model card shows loading the checkpoint with the timesfm package
      (TimesFM_2p5_200M_torch) and compiling a forecast configuration with a maximum context
      and horizon before forecasting.
    source_ids: [timesfm25-card]
provenance:
  text: >-
    Trained by Google Research as the third open TimesFM checkpoint. The card lists training
    data from GiftEvalPretrain (Salesforce), Wikimedia pageviews, Google Trends, and synthetic
    data. No other base model is named.
  derived_from: []
  source_ids: [timesfm25-card]
