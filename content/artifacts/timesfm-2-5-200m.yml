summary:
  text: >-
    TimesFM 2.5 is a 200M-parameter time-series forecasting model from Google Research,
    released in September 2025. Compared with TimesFM 2.0 it has fewer parameters (200M,
    down from 500M), a context length of up to 16k points, an optional 30M quantile head for
    continuous quantile forecasts up to a 1k horizon, and no frequency indicator input.
  source_ids: [timesfm-readme, timesfm25-card]
useful_for:
  text: >-
    The repository describes zero-shot point and quantile forecasting; covariate support
    through XReg was added for 2.5 in October 2025.
  source_ids: [timesfm-readme]
