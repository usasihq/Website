summary:
  text: >-
    OpenHands is an open-source platform for building and running AI coding agents. Its main
    repository now holds Agent Canvas, a self-hosted browser control center. Agent Canvas runs the
    OpenHands agent, or other agents that support the Agent Client Protocol, on local, remote, or
    cloud backends. The agent itself, the Python SDK, and the Agent Server are developed in the
    separate Software Agent SDK repository.
  source_ids: [oh-readme, oh-sdk-readme, oh-docs-home]
useful_for:
  text: >-
    Running coding agents for tasks such as dependency updates, refactors, and code review, and
    setting up automations triggered on a schedule or by events from services like GitHub and
    Slack. Agents can run on a laptop, in Docker containers, on VMs, or on hosted backends.
  source_ids: [oh-readme, oh-sdk-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    OpenHands' terms of service describe the service as built on All Hands AI's own open-source
    software and point to the OpenHands GitHub repository for its license terms. They also say
    All Hands AI is headquartered in the United States, and the privacy policy gives a Cambridge,
    Massachusetts mailing address. The README calls OpenHands Cloud "our
    commercial offering". The LICENSE files assign copyright to "OpenHands contributors" rather than
    to a company. No foundation or multi-organization governance body is documented.
  source_ids: [oh-tos, oh-privacy, oh-readme, oh-license, oh-sdk-license]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: null
