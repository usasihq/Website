    url: https://github.com/OpenHands/software-agent-sdk/blob/main/LICENSE
    applies_to: code
    source_ids: [oh-sdk-license]
license_notes:
  text: >-
    The MIT licenses cover the Agent Canvas and Software Agent SDK repositories. OpenHands Cloud
    is a managed commercial service. The enterprise edition is described as source-available and
    commercially licensed for self-hosting, not MIT-licensed. The documentation says each public
    OpenHands repository carries its own license.
  source_ids: [oh-license, oh-sdk-license, oh-docs-home, oh-enterprise]
checklist:
  source_code:
    status: public
    note: null
    source_ids: [oh-repo, oh-sdk-readme]
  documentation:
    status: public
    note: null
    source_ids: [oh-docs-home]
  installation:
    status: public
    note: >-
      Documented installs via npm or npx, Docker, a VM or self-hosted backend, or from source. The
      npm and source installs need Node.js 24 or later and uv; the Docker install needs Docker.
    source_ids: [oh-canvas-setup, oh-readme]
  supported_platforms:
    status: public
    note: >-
      The docs recommend macOS, Linux, or Windows (PowerShell or WSL2) for the most reliable local
      setup and say mobile Linux environments are not a primary supported target. An early preview
      desktop app is available for all three operating systems.
    source_ids: [oh-canvas-setup]
  release_status:
    status: public
    note: Versioned releases (v1.x) are published on GitHub. The README labels Agent Canvas as beta.
    source_ids: [oh-releases, oh-readme]
run_notes:
  - text: >-
      The README warns that running without a sandbox gives the agent full access to the host
      filesystem. The Docker options run agents in containers, and the self-hosting guide covers
      security hardening for internet-facing installs.
    source_ids: [oh-readme]
