summary:
  text: >-
    The largest of the three Zamba2-VL vision-language models Zyphra released in June 2026,
    with about 8B parameters. It pairs the Zamba2-7B hybrid state-space language model with
    the Qwen2.5-VL vision encoder and handles single- and multi-image understanding and
    grounding.
  source_ids: [zamba2-vl-blog, zamba2-vl-7b-card]
useful_for:
  text: >-
    The model card describes it as a generalist model for on-device applications and reports
    results on visual question answering, OCR, chart and document understanding, and
    multimodal reasoning benchmarks. Zyphra's
    announcement says the hybrid backbone keeps a fixed-size recurrent state rather than a
    growing key-value cache, which lowers time to first token on long inputs.
  source_ids: [zamba2-vl-7b-card, zamba2-vl-blog]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Developed and published by Zyphra. The technical report lists the authors' affiliation
    as Zyphra, San Francisco, CA, and Zyphra's terms of use name Zyphra Technologies, Inc. at
    a San Francisco address. The vision encoder comes from Alibaba Cloud's Qwen2.5-VL; that
    component is not thereby U.S.-developed, and eligibility here rests on Zyphra as the
    developer of this model.
  source_ids: [zamba2-vl-report, zyphra-terms, zamba2-vl-7b-card, qwen-hf-org]
