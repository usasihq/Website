checklist:
  weights:
    status: public
    note: null
    source_ids: [zamba2-vl-7b-card]
  inference_code:
    status: public
    note: >-
      Inference uses the zamba2-vl branch of Zyphra's Transformers fork (based on
      Transformers 4.57.1), qwen-vl-utils, flash_attn, and Zyphra's forks of mamba-ssm and
      causal-conv1d, per the model card.
    source_ids: [zamba2-vl-7b-card, zamba2-vl-blog]
  training_code:
    status: unknown
    note: >-
      The technical report points to the checkpoints and inference code; it does not mention
      a training code release.
    source_ids: [zamba2-vl-report]
  training_data_information:
    status: partial
    note: >-
      The technical report names the public datasets used in its training stages, for
      example LLaVA-ReCap-558K, FineVision, PixMo, The Cauldron, and DocMatix, and says
      document and OCR data were upsampled.
    source_ids: [zamba2-vl-report]
  training_recipe:
    status: partial
    note: >-
      The report describes three stages: alignment with only the MLP adapter trained (vision
      encoder and language backbone frozen), then joint pretraining and supervised
      fine-tuning of the full model.
    source_ids: [zamba2-vl-report]
  evaluation_materials:
    status: partial
    note: >-
      The model card reports scores measured with Zyphra's own evaluation harness based on
      VLMEvalKit; the harness itself is not linked.
    source_ids: [zamba2-vl-7b-card]
run_notes:
  - text: >-
      The model card says the model can run without the optimized Mamba2 kernels but that
      this is not recommended because latency and memory use are significantly higher. Its
      example loads the model in bfloat16 on a CUDA device with FlashAttention 2.
    source_ids: [zamba2-vl-7b-card]
provenance:
  text: >-
    Built by Zyphra on its Zamba2-7B language model, with the vision transformer from
    Qwen2.5-VL as the vision backbone; Qwen is a model family built by Alibaba Cloud. The
    model uses the Mistral v0.1 tokenizer.
  derived_from:
    - name: Zamba2-7B
