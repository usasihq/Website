summary:
  text: >-
    TimesFM 3.0 is a Google Research time-series forecasting model released in August 2026.
    Google's announcement gives it 330 million parameters and describes native multivariate
    forecasting, support for past-only and past-and-future covariates, and probabilistic
    forecasts with nine quantiles. The model card lists a 20-layer transformer architecture.
  source_ids: [timesfm3-card, timesfm3-blog, timesfm-readme]
useful_for:
  text: >-
    The repository presents TimesFM 3.0 for zero-shot univariate and multivariate forecasting
    with covariates. Its weights license limits downloaded use to non-commercial,
    non-production purposes.
  source_ids: [timesfm-readme, timesfm3-license]
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    The model card states TimesFM was developed by Google Research, and the weights license is
    issued by Google LLC. Alphabet Inc.'s fiscal 2025 Form 10-K lists its principal executive
    offices in Mountain View, California, and Exhibit 21.01 lists Google LLC as a Delaware
    subsidiary of Alphabet.
  source_ids: [timesfm3-card, timesfm3-license, alphabet-10k-2025, alphabet-10k-2025-ex21]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Weights are downloadable from Hugging Face without an access gate, but only for
    non-commercial, non-production use under the TimesFM Non-Commercial License v1.0.
    Commercial and production use is offered through Google Cloud services such as BigQuery ML.
  source_ids: [timesfm3-hf-api, timesfm3-license, timesfm-readme]
licenses:
  - name: TimesFM Non-Commercial License v1.0
    spdx: null
    url: https://huggingface.co/google/timesfm-3.0-pytorch/blob/main/LICENSE
    applies_to: weights
    source_ids: [timesfm3-card, timesfm3-license]
  - name: Apache License 2.0 (timesfm source code)
    spdx: Apache-2.0
    url: https://raw.githubusercontent.com/google-research/timesfm/master/LICENSE
    applies_to: code
    source_ids: [timesfm-license, timesfm-readme]
license_notes:
  text: >-
    The TimesFM Non-Commercial License v1.0 is issued by Google LLC. It grants a personal,
    non-transferable, revocable license to use and create derivatives only for non-commercial
    purposes, which it defines to exclude revenue-generating activity, production systems,
    interactions with end users, and training or distilling other models for commercial use.
    It prohibits distributing the model or derivatives. Model outputs are not treated as
    derivatives, but the restrictions also bar using outputs for commercial or production
    purposes. The repository notes that earlier TimesFM weights (up to 2.5) remain under
    Apache 2.0.
  source_ids: [timesfm3-license, timesfm-readme]
checklist:
  weights:
    status: public
    note: Weights (safetensors) are published on Hugging Face without an access gate, under a non-commercial license.
    source_ids: [timesfm3-hf-api, timesfm3-card]
  inference_code:
    status: public
    note: >-
      The Apache-2.0 timesfm package (PyPI "timesfm") includes TimesFM 3.0 inference code with
      PyTorch and Apple MLX backends; the README gives usage examples.
    source_ids: [timesfm-readme, timesfm-pypi, timesfm-license]
  training_code:
    status: unknown
    note: >-
      The repository includes a fine-tuning example (Transformers with PEFT/LoRA), added in
      April 2026 before the 3.0 release; no pre-training code for TimesFM 3.0 was found.
    source_ids: [timesfm-readme]
  training_data_information:
    status: partial
    note: >-
      The model card lists GiftEvalPretrain (excluding datasets overlapping with fev-bench),
      Wikipedia pageviews, Google Trends top queries, and synthetic and augmented data. The
      synthetic data is not documented as released.
    source_ids: [timesfm3-card]
  training_recipe:
    status: unknown
    note: >-
      The model card lists architecture settings, and the blog post describes the approach at
      a high level; no technical report for version 3.0 was found.
    source_ids: [timesfm3-card, timesfm3-blog]
  evaluation_materials:
    status: partial
    note: >-
      The README and blog report benchmark standings on fev-bench, TIME, and GIFT-Eval; code
      to re-run those evaluations for this release was not identified.
    source_ids: [timesfm-readme, timesfm3-blog]
run_notes:
  - text: >-
      The README documents installation with "pip install timesfm[torch]" or
      "pip install timesfm[mlx]" (MLX-native inference on Apple silicon without PyTorch) and
      notes that contexts longer than 15,360 points are truncated to the most recent points.
    source_ids: [timesfm-readme]
provenance:
  text: >-
    Trained by Google Research. The model card lists training data from GiftEvalPretrain,
    Wikipedia pageviews, Google Trends, and synthetic data. No other base model is named.
  derived_from: []
  source_ids: [timesfm3-card]
