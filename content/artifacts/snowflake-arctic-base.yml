    status: unknown
    note: >-
      The announcement describes a cookbook series on pretraining, fine-tuning, data, and systems; this review did not
      verify whether it documents the full Arctic training configuration.
    source_ids: [arctic-blog]
  evaluation_materials:
    status: partial
    note: Benchmark comparisons are published as figures in the repository README; evaluation code was not located.
    source_ids: [arctic-github]
run_notes:
  - text: >-
      The model card documents use with Transformers 4.39 or later (with trust_remote_code) and DeepSpeed 0.14.2 or
      later, and the GitHub repository includes a vLLM deployment tutorial.
    source_ids: [arctic-base-card, arctic-github]
  - text: >-
      Because of the model size, the model card recommends a single 8xH100 instance; its example loads the model in
      bfloat16 with DeepSpeed FP8 quantization (FP6 is also supported) and a max_memory setting of 150GiB per GPU.
    source_ids: [arctic-base-card]
provenance:
