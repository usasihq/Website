summary:
  text: >-
    Arctic Base is the pretrained checkpoint of Snowflake Arctic, a dense-MoE hybrid transformer (a 10B dense model
    plus a residual 128x3.66B MoE MLP) with 480B total and 17B active parameters, pretrained from scratch by the
    Snowflake AI Research Team. It takes text input and generates text and code.
  source_ids: [arctic-base-card]
