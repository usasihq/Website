    source_ids: [arctic-base-card, arctic-github]
  training_code:
    status: unknown
    note: >-
      The repository's training folder contains a LoRA fine-tuning script and a checkpoint converter; pretraining code
      for Arctic was not located.
    source_ids: [arctic-github]
  legacy_training_data_information:
    status: unknown
