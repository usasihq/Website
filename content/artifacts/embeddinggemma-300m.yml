summary:
  text: >-
    EmbeddingGemma is a multilingual text embedding model in the Gemma family, built from Gemma 3
    with T5Gemma initialization. Google's documentation gives its size as 308M parameters; the
    Hugging Face card calls it a 300M-parameter model. It accepts up to 2,048 input tokens and
    outputs 768-dimensional vectors, which can be truncated to 512, 256, or 128 dimensions
    through Matryoshka Representation Learning. Google's release page dates its release to
    September 4, 2025.
  source_ids: [ eg-hf-card, eg-overview, gemma-releases ]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    The model card lists retrieval, semantic similarity, classification, clustering, code
    retrieval, question answering, and fact verification. Google's documentation presents it
    for on-device use on phones, laptops, and tablets, including offline use and mobile-first
    retrieval-augmented generation together with Gemma 3n.
  source_ids: [ eg-hf-card, eg-overview ]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    The model card names Google DeepMind as the author, and the Gemma Terms of Use that govern it
    are issued by Google LLC. Google's CEO announced Google DeepMind in 2023 as a group combining
    DeepMind and Google Research's Brain team. Alphabet Inc.'s fiscal 2025 Form 10-K gives its
    principal executive offices in Mountain View, California, and Exhibit 21.01 lists Google LLC
    as a Delaware subsidiary.
  source_ids: [ eg-hf-card, gemma-terms, google-blog-gdm-2023, alphabet-10k-2025-cover, alphabet-10k-2025-ex21 ]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Downloadable from Hugging Face after logging in and acknowledging Google's usage license; the
    gate text says requests are processed immediately, although the repository metadata lists
    the gate mode as manual. Google's overview also points to Kaggle and Vertex AI.
  source_ids: [ eg-hf-api, eg-hf-card, eg-overview ]
  reviewed_at: 2026-10-01
licenses:
  - name: Gemma Terms of Use
    spdx: null
    url: https://ai.google.dev/gemma/terms
    applies_to: weights
    source_ids: [ gemma-terms, eg-hf-card, eg-hf-api ]
    reviewed_at: 2026-10-01
license_notes:
  text: >-
    EmbeddingGemma is listed in the appendix of the Gemma Terms of Use (last modified April 1,
    2026), so the separate Apache 2.0 license for Gemma 4 does not apply to it. The terms allow
    use, modification, and distribution subject to the Gemma Prohibited Use Policy, which they
    incorporate. Redistributors must pass on the use restrictions and a copy of the terms, mark
    modified files, and include a specified notice file. Model Derivatives include models trained
    by distillation or on synthetic outputs from Gemma. Google may restrict use it believes
    violates the terms and may terminate them on breach. California law governs.
  source_ids: [ gemma-terms ]
  reviewed_at: 2026-10-01
checklist:
  weights:
    status: public
    note: >-
      Safetensors weights on Hugging Face behind a license acknowledgment that the gate says is
      processed immediately.
    source_ids: [ eg-hf-api, eg-hf-card ]
    reviewed_at: 2026-10-01
  inference_code:
    status: public
    note: >-
      The model card documents inference with Sentence Transformers, using the Gemma 3
      implementation in Hugging Face Transformers as the backbone.
    source_ids: [ eg-hf-card ]
    reviewed_at: 2026-10-01
  training_code:
    status: unknown
    note: >-
      The card says training used JAX and ML Pathways; no published training code was found.
      Google's documentation links a fine-tuning guide.
    source_ids: [ eg-hf-card, eg-overview ]
    reviewed_at: 2026-10-01
  training_data_information:
    status: partial
    note: >-
      The card describes about 320 billion training tokens drawn from web documents in over 100
      languages, code and technical documents, and synthetic and task-specific data, with CSAM,
      sensitive-data, and quality filtering. The data itself is not released, and this review
      does not judge the description complete.
    source_ids: [ eg-hf-card ]
    reviewed_at: 2026-10-01
  training_recipe:
    status: partial
    note: >-
      The paper describes encoder-decoder initialization, geometric embedding distillation, a
      spread-out regularizer, and merging of checkpoints trained on varied data mixtures. The
      card names TPUv5e hardware. This is not a complete recipe.
    source_ids: [ eg-paper, eg-hf-card ]
    reviewed_at: 2026-10-01
  evaluation_materials:
    status: partial
    note: The model card reports benchmark results; evaluation code was not reviewed.
    source_ids: [ eg-hf-card ]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The model card says EmbeddingGemma activations do not support float16 and recommends
      float32 or bfloat16. It shows separate query and document encoding methods in Sentence
      Transformers, and task-specific prompts such as a code-retrieval query prefix.
    source_ids: [ eg-hf-card ]
    reviewed_at: 2026-10-01
provenance:
  text: >-
