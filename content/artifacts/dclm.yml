license_notes:
  text: >-
    The paper states that the datasets are distributed under CC-BY-4.0 and that use is also
    subject to Common Crawl's Terms of Use. Separately from the license, the dataset card states
    that DCLM-Baseline is intended for research use in the context of the DCLM benchmark.
  source_ids: [dclm-paper, cc-terms, dclm-card]
checklist:
  access:
    status: public
    note: Downloadable from Hugging Face without gating and from Common Crawl's S3 bucket.
    source_ids: [dclm-card, dclm-repo-readme, dclm-cc-baseline]
  provenance:
    status: public
    note: >-
      Derived from Common Crawl (DCLM-Pool) through resiliparse text extraction, a
      reproduction of RefinedWeb's heuristic filters, Bloom-filter deduplication, and a
      fastText quality classifier trained on OpenHermes 2.5 and r/ExplainLikeImFive data.
      Records keep WARC metadata and source URLs.
    source_ids: [dclm-card, dclm-repo-readme, dclm-paper]
  documentation:
    status: public
    note: The paper includes a datasheet; the repository README documents processing, tokenization, training, and evaluation steps.
    source_ids: [dclm-paper, dclm-repo-readme]
  licensing:
    status: public
    note: CC-BY-4.0 for the data (with Common Crawl's Terms of Use); MIT for the code.
    source_ids: [dclm-card, dclm-paper, dclm-license]
  stated_limitations:
    status: public
    note: >-
      The dataset card notes biases inherited from Common Crawl, weaker coverage of code and
      math, and research-only use. The paper says the pools received no special treatment for
      personal or sensitive information. The README notes a September 2025 fix to baseline
      values that makes earlier CORE and EXTENDED scores not directly comparable to newer ones.
    source_ids: [dclm-card, dclm-paper, dclm-repo-readme]
run_notes: []
provenance:
  text: >-
    DCLM-Pool is text extracted from Common Crawl, and DCLM-Baseline is a filtered and
    deduplicated subset of it. The quality classifier was trained on OpenHermes 2.5 and
    r/ExplainLikeImFive data.
  derived_from:
    - name: Common Crawl
      artifact_slug: common-crawl-corpus
      url: https://commoncrawl.org
      note: Source of DCLM-Pool, from which DCLM-Baseline is filtered.
  source_ids: [dclm-card, dclm-paper]
