summary:
  text: >-
    DataComp-LM (DCLM) is a benchmark and testbed for pretraining-data curation: participants
    build a training set, by filtering a standard pool or mixing in their own data, then train
    models with fixed code at scales from about 400M to 7B parameters and evaluate them on 53
    downstream tasks. Its released data include DCLM-Pool, a 240T-token corpus extracted from
    Common Crawl, and DCLM-Baseline, a 4T-token, roughly 3B-document filtered subset used as
    the reference dataset.
  source_ids: [dclm-site, dclm-card, dclm-repo-readme, dclm-paper]
useful_for:
  text: >-
    Research on pretraining-data curation with a fixed training and evaluation recipe. The
    dataset card describes DCLM-Baseline as a research baseline for the DCLM benchmark and
    says it is not intended for training production models or for domains such as code and
    math.
  source_ids: [dclm-card, dclm-repo-readme]
eligibility:
  status: pending_review
  basis: undetermined
  explanation: >-
    The dataset card says DCLM-Baseline was curated by "the DCLM team", and the paper's
    datasheet says the DCLM team is responsible for maintaining the assets, which Common Crawl
    and Hugging Face host. The code and data are published under the mlfoundations GitHub and
    Hugging Face organizations, and the MIT license names "mlfoundations" as copyright holder;
    no legal entity or institution is identified as the maintainer. The paper lists authors
    from many U.S. and non-U.S. institutions (including the University of Washington, Apple,
    Toyota Research Institute, UT Austin, Tel Aviv University, Stanford, LAION, and JSC), but
    author affiliation does not establish a maintaining institution. No U.S. maintaining
    institution is documented, so eligibility is unresolved.
  source_ids: [dclm-card, dclm-paper, dclm-repo-readme, dclm-license]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    DCLM-Baseline is downloadable from Hugging Face without gating (JSONL and Parquet versions)
    and from Common Crawl's S3 bucket. DCLM-Pool is hosted by Common Crawl; the README says S3
    downloads need valid AWS credentials but should not incur costs.
  source_ids: [dclm-card, dclm-repo-readme, dclm-cc-baseline]
