run_notes:
  - text: >-
      The documentation describes running models locally with Transformers (the transformers extra)
      or Ollama and lists vllm and mlx-lm extras. The README warns that the built-in
      LocalPythonExecutor is not a security boundary and recommends running agent code in a sandbox
      such as E2B, Blaxel, Modal, or Docker.
    source_ids: [docs-home, docs-install, repo]
    reviewed_at: 2026-10-01
