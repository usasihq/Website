summary:
  text: >-
    smolagents is an open-source Python library from Hugging Face for building agents with few
    abstractions. Its CodeAgent writes its actions as Python code, a ToolCallingAgent uses
    conventional tool calling, and agents and tools can be shared through the Hugging Face Hub.
  source_ids: [repo, docs-home]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Building code-executing or tool-calling agents with models from many sources. The library is
    client code and does not include model weights; it can run models locally through Transformers
    or Ollama, or call hosted models through Hugging Face Inference Providers, LiteLLM, or
    OpenAI-compatible servers, whose terms and openness vary by model and provider.
  source_ids: [repo, docs-home]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    smolagents is developed in Hugging Face's GitHub organization, its README carries a copyright
    notice for the HuggingFace Team, and its documentation is published on Hugging Face's
    documentation site. Hugging Face's terms of service identify Hugging Face, Inc., a Delaware
    corporation, as the provider of its services under New York law, and its privacy policy states
    that the company and its servers are located in the United States (a French entity is named as
    its EU main establishment). NVIDIA announced on September 3, 2026 an agreement to acquire
    Hugging Face; this assessment does not rely on it. See the hugging-face organization record for
    the full dual-country assessment.
  source_ids: [repo, docs-home, hf-tos, hf-privacy, nvidia-hf-blog]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code is public and the package installs from PyPI. Hosted model providers require their
    own accounts or API keys; local models run through Transformers or Ollama.
  source_ids: [repo, docs-install, docs-home]
  reviewed_at: 2026-10-01
