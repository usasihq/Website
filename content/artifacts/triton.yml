summary:
  text: >-
    Triton is a language and compiler for writing custom deep-learning compute kernels for GPUs
    in a Python-based programming environment; its compiler uses MLIR and generates code through
    LLVM. Its license names Philippe Tillet (2018–2020) and
    OpenAI (2020–2022) as copyright holders; development now takes place in the triton-lang
    GitHub organization.
  source_ids: [triton-readme, triton-docs, triton-license]
useful_for:
  text: >-
    Writing custom neural-network kernels in Python as an alternative to hand-written CUDA; the
    documentation includes installation instructions and tutorials.
  source_ids: [triton-readme, triton-docs]
eligibility:
  status: pending_review
  basis: undetermined
  explanation: >-
    No current governing or maintaining organization is documented. The project's governance
    document assigns control to individual core maintainers and a lead core maintainer, and names
    no company or foundation. OpenAI appears only as a copyright holder for 2020–2022 in the
    license. Eligibility cannot rest on individual maintainers, so this record stays in draft
    until an official source documents the maintaining entity.
  source_ids: [triton-contributing, triton-license, triton-docs]
