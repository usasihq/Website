summary:
  text: >-
    Dory1.0-4B is a 4B-parameter looped (latent-recurrent) language model from NVIDIA's Nemotron
    Labs. It reuses a shared block of layers several times per token, so one checkpoint can run at
    different compute levels by changing the loop count. The card lists English as the supported
    language and a context of up to 256K tokens, and NVIDIA publishes BF16, MXFP8, NVFP4, and GGUF
    (Q5_K_M) versions.
  source_ids: [dory-model-card, dory-hf-metadata, dory-mxfp8-metadata, dory-nvfp4-metadata, dory-gguf-metadata]
useful_for:
  text: >-
    The model card describes it as aimed at general-purpose reasoning on a small footprint, with
    the loop count adjustable to trade inference compute against accuracy, and says it is ready for
    commercial or non-commercial use.
  source_ids: [dory-model-card]
