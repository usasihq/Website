checklist:
  weights:
    status: public
    note: BF16, MXFP8, NVFP4, and GGUF (Q5_K_M) checkpoints are published on Hugging Face.
    source_ids: [dory-model-card, dory-hf-metadata, dory-mxfp8-metadata, dory-nvfp4-metadata, dory-gguf-metadata]
    reviewed_at: 2026-10-18
  inference_code:
    status: partial
    note: >-
      The card gives serving instructions for vLLM and llama.cpp, but at release support in both
      came from pull requests not yet in a tagged release of either project.
    source_ids: [dory-model-card]
    reviewed_at: 2026-10-18
  training_code:
    status: unknown
    note: >-
      The card names Megatron-LM, NeMo RL, and NeMo Gym as the software used, but no
      Dory-specific training code was found.
    source_ids: []
  training_data_information:
    status: partial
    note: >-
      The card describes data types, domains, languages, token counts, collection periods, and
      post-training synthetic-data and filtering methods at a high level, and refers to the
      Nemotron 3.5 Lightning card for pre-training and RL dataset details.
    source_ids: [dory-model-card]
    reviewed_at: 2026-10-18
  training_data_access:
    status: unknown
    note: >-
      The repository metadata tags NVIDIA's pre-training and post-training dataset collections,
      but the card does not state which of the data used is downloadable.
    source_ids: []
  training_pipeline:
    status: unknown
    note: null
    source_ids: []
  training_recipe:
    status: partial
    note: >-
      The card outlines the stages: 6T tokens of pre-training (NVFP4 for roughly the first 4.5T,
      then BF16), 300B tokens of context extension, SFT, and GRPO reinforcement learning. No
      configurations are published with it.
    source_ids: [dory-model-card]
    reviewed_at: 2026-10-18
  evaluation_materials:
    status: partial
    note: >-
      The card reports results measured with NeMo Gym and the NeMo Evaluator SDK but does not
      publish model-specific commands for re-running them.
    source_ids: [dory-model-card]
    reviewed_at: 2026-10-18
run_notes:
  - text: >-
      The card documents serving with vLLM (validated at a 256K-token context) and with llama.cpp
      on Apple Silicon Macs using the Q5_K_M GGUF export, and lists NVIDIA H100, B200, B300, and
      DGX Spark as test hardware. It recommends two loops as the default and describes a
      last-loop KV-cache mode that keeps cache size at the one-loop level regardless of loop count.
    source_ids: [dory-model-card]
provenance:
  text: >-
    Trained by NVIDIA from pre-training onward; the card and repository metadata name no base
    model. The MXFP8, NVFP4, and GGUF repositories are quantized versions of the BF16 checkpoint.
    The card says post-training synthetic data was generated with teacher models, including
    third-party open models such as GPT-OSS-120B.
  derived_from: []
  source_ids: [dory-model-card, dory-hf-metadata]
