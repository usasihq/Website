summary:
  text: >-
    Granite is IBM's family of models. IBM lists language, speech, vision, guardian (risk
    detection), embedding, and time-series lines. The most recent language-model generation on
    IBM's Granite page is Granite 4.2: dense reasoning models in 3B, 8B, and 30B sizes, released
    in August 2026 and post-trained from Granite 4.1 base models.
  source_ids: [ibm-granite-page, granite-4-2-blog]
useful_for:
  text: >-
    IBM positions Granite models for enterprise workloads. Granite 4.2 model cards list
    reasoning, code generation, tool calling, agentic workflows, and multilingual dialog.
  source_ids: [ibm-granite-page, granite-4-2-8b-card]
