summary:
  text: >-
    A long-context follow-up to Rnj-1 Instruct that extends the context window from 32K to
    160K tokens. Essential AI built it from the Rnj-1 base model, switching most attention
    layers to block-local attention with a group of global layers in the middle, and added
    long-context mid-training data and more software-engineering training data.
  source_ids: [rnj-1-5-card]
useful_for:
  text: >-
    Coding, including agentic software-engineering tasks run in harnesses such as SWE-Agent
    and mini-swe-agent, and tasks that need retrieval over long inputs. The card says the
    model was optimized for long-context comprehension rather than long-context generation.
  source_ids: [rnj-1-5-card]
