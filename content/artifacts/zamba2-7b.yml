summary:
  text: >-
    The 7B base model in Zyphra's Zamba2 series, announced in October 2024. It interleaves
    Mamba2 blocks with two shared attention blocks in an alternating pattern and adds LoRA
    projectors to the shared MLP blocks so that each shared block can specialize by depth.
  source_ids: [zamba2-7b-blog, zamba2-7b-card]
useful_for:
  text: >-
    The model card presents it as a general-purpose base model for efficient inference with
    low memory use on consumer hardware. It is not tuned for instruction following or chat
    and has no moderation; Zyphra released a separate instruction-tuned Zamba2-7B-Instruct.
  source_ids: [zamba2-7b-card, zamba2-7b-blog]
