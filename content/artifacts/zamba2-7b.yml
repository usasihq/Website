  inference_code:
    status: public
    note: >-
      Supported in Hugging Face Transformers from version 4.48.0; Zyphra also publishes a
      standalone PyTorch implementation of the Zamba2 models on GitHub.
    source_ids: [hf-docs-zamba2, zamba2-repo, zamba2-7b-blog]
  training_code:
    status: unknown
    note: >-
      Zyphra's announcement says training used an internal framework built on Megatron-LM;
      this catalog found no public release of that framework.
    source_ids: [zamba2-7b-blog]
  training_data_information:
    status: partial
    note: >-
      The model card says pretraining used text and code from open web datasets, including
      Zyphra's Zyda (which is downloadable), followed by an annealing phase on a smaller
      high-quality mixture. No complete list of the mixture was found.
    source_ids: [zamba2-7b-card, zyda-card]
  training_recipe:
    status: partial
    note: >-
      Two-phase pretraining (main pretraining, then annealing) and the architecture are
      described at a high level in the model card and announcement.
    source_ids: [zamba2-7b-card, zamba2-7b-blog]
  evaluation_materials:
    status: unknown
    note: null
    source_ids: []
run_notes:
  - text: >-
      The model card's quick start installs mamba-ssm (v2.1.0) and causal-conv1d for the
      optimized Mamba2 kernels and loads the model with Transformers on a CUDA device in
      bfloat16. It says running without those kernels is not recommended because latency and
      memory use are significantly higher.
    source_ids: [zamba2-7b-card]
provenance:
  text: >-
    A Zyphra base model pretrained on open web text and code, including Zyphra's Zyda
    dataset, using the Mistral v0.1 tokenizer. It serves as the language backbone of
    Zamba2-VL-7B.
  derived_from:
    - name: Zyda
      artifact_slug: null
      url: https://huggingface.co/datasets/Zyphra/Zyda
      note: Zyphra pretraining dataset named in the model card.
  source_ids: [zamba2-7b-card, hf-docs-zamba2, zyda-card, zamba2-vl-7b-card]
