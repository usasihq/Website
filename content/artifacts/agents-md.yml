summary:
  text: >-
    AGENTS.md is an open convention for a Markdown file, placed in a code repository, that gives
    AI coding agents project-specific context and instructions such as build steps, test
    commands, and code conventions. It is plain Markdown with no required fields; in a monorepo,
    nested files can apply to subprojects, with the file closest to the edited code taking
    precedence. OpenAI released it in August 2025 and contributed it to the Agentic AI
    Foundation in December 2025.
  source_ids: [agentsmd-site, agentsmd-repo, lf-aaif-press]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Giving coding agents a predictable place to find a repository's setup, testing, and
    contribution instructions, separate from the human-facing README.
  source_ids: [agentsmd-site, agentsmd-repo]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    AGENTS.md has been established as AGENTS.md a Series of LF Projects, LLC under a technical
    charter adopted December 8, 2025; LF Projects is a Delaware series limited liability company.
    The charter makes the project's technical chair its primary contact with the Agentic AI
    Foundation, which it describes as a directed fund of The Linux Foundation, and the website
    states that the format is stewarded by that foundation. The Linux Foundation describes itself as a 501(c)(6) nonprofit with a legal
    postal address in San Francisco, California. Technical governance positions are held by
    individuals, not companies. Eligibility rests on this documented governance, not on the
    original developer or on contributors' affiliations or nationality.
  source_ids: [agentsmd-charter, agentsmd-site, lfprojects, aaif-charter, lf-about, lf-privacy]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    The format description, examples, and website source are public. Whether a given coding
    agent reads AGENTS.md depends on that agent.
  source_ids: [agentsmd-site, agentsmd-repo]
  reviewed_at: 2026-10-01
