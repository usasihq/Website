    source_ids: [a2a-readme]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      Official SDKs cover Python, Go, JavaScript, Java, .NET, and Rust; the specification defines
      JSON-RPC, gRPC, and HTTP+JSON/REST bindings.
    source_ids: [a2a-readme, a2a-spec]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      The specification page presents version 1.0.0 as the latest released version. The
      repository's latest tagged release reviewed is v1.0.1, published May 28, 2026; v1.0.0 was
      published March 12, 2026.
    source_ids: [a2a-spec, a2a-releases]
    reviewed_at: 2026-10-01
run_notes: []
provenance:
  text: >-
    Google launched A2A in April 2025 and transferred the specification, SDKs, and developer
    tooling to The Linux Foundation on June 23, 2025, with AWS, Cisco, Google, Microsoft,
    Salesforce, SAP, and ServiceNow named as founding members. The project joined the Agentic
    AI Foundation in August 2026.
