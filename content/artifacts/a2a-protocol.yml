summary:
  text: >-
    Agent2Agent (A2A) is an open protocol for communication between AI agents built on different
    frameworks and run by different parties. Agents publish Agent Cards describing their
    capabilities and endpoints, and exchange messages and long-running tasks over JSON-RPC,
    gRPC, or HTTP+JSON bindings without exposing internal state or tools. The project publishes
    the specification, SDKs, and samples.
  source_ids: [a2a-readme, a2a-spec]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Letting independently built agents discover one another and delegate or coordinate tasks
    across vendor and framework boundaries.
  source_ids: [a2a-readme, a2a-spec]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    A2A is an open-source project under The Linux Foundation, which Google transferred to it in
    June 2025; the documentation site carries a Linux Foundation copyright, and the project's
    governance charter refers to a series agreement and series manager. In August 2026 it became
    a Growth Stage project of the Agentic AI Foundation, a directed fund of The Linux
    Foundation. The Linux Foundation describes itself as a 501(c)(6) nonprofit with a legal
    postal address in San Francisco, California. The Technical Steering Committee has eight
    company-held seats (AWS, Cisco, Google, IBM, Microsoft, Salesforce, SAP, and ServiceNow);
    this multi-organization governance was assessed, and eligibility rests on the documented
    Linux Foundation stewardship rather than on the composition of the committee or the
    nationality of contributors.
  source_ids: [a2a-readme, lf-a2a-press, a2a-site, a2a-governance, a2a-joins-aaif, a2a-blog-aaif, aaif-charter, lf-about, lf-privacy]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    The specification, SDKs, and samples are public. Interacting with a particular A2A agent is
    governed by that agent operator's own authentication and terms.
  source_ids: [a2a-readme, a2a-spec]
  reviewed_at: 2026-10-01
