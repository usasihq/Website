summary:
  text: >-
    Docling is an open-source Python toolkit that converts documents such as PDF, DOCX, PPTX,
    XLSX, HTML, images, audio, and other formats into a structured DoclingDocument that can be
    exported as Markdown, HTML, or JSON for generative AI applications. It includes PDF layout,
    reading-order, and table-structure analysis, OCR, and optional vision-language model
    pipelines. The project began at IBM Research in Zurich and has been hosted by the LF AI &
    Data Foundation since 2025.
  source_ids: [docling-readme, docling-tech-report, lfaidata-docling-blog, lfaidata-docling-page]
useful_for:
  text: >-
    Preparing documents for retrieval-augmented generation and agent workflows, with local
    execution for sensitive or air-gapped data, integrations with frameworks such as
    LangChain, LlamaIndex, CrewAI, and Haystack, a command-line tool, an MCP server, and an API
    server (docling-serve).
  source_ids: [docling-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Docling is hosted as a project of the LF AI & Data Foundation, which describes itself as an
    umbrella foundation of the Linux Foundation. The foundation's project page states that IBM
    donated Docling as an Incubation-stage project in March 2025 (its induction was announced
    in April 2025) and that it became a Graduate-tier project in August 2026. The Linux Foundation's privacy policy gives a mailing address in San Francisco,
    California. The project was started by IBM Research's Zurich team; IBM is recorded as the
    originating organization, and eligibility rests on the U.S.-based foundation hosting the
    project, not on where its developers work.
  source_ids: [docling-readme, lfaidata-docling-blog, lfaidata-docling-page, lf-privacy]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
