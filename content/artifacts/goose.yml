license_notes:
  text: >-
    The repository's LICENSE is the Apache License 2.0 with a 2024 copyright notice for Block,
    Inc.; Block's launch announcement also stated Apache 2.0. The governance document says
    documentation other than specifications is made available under CC BY 4.0, but no separate
    documentation license file is recorded here. The license does not cover model weights or
    third-party providers and extensions.
  source_ids: [goose-license, block-goose-launch, goose-governance]
  reviewed_at: 2026-10-01
