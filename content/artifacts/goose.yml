    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      Desktop app and CLI for macOS (Apple silicon and Intel), Linux (Debian/Ubuntu,
      RHEL/Fedora, and other distributions), and Windows, including WSL for the CLI.
