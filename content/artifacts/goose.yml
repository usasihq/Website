summary:
  text: >-
    goose is an open-source, general-purpose AI agent that runs on the user's machine, with a
    desktop app, a command-line interface, and an API, and is written in Rust. It works with
    multiple hosted and local model providers and connects to extensions through the Model
    Context Protocol. Block created goose and contributed it to the Agentic AI Foundation.
  source_ids: [goose-repo, goose-quickstart, goose-governance]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Running a local agent for software development and for other tasks such as research,
    writing, automation, and data analysis, with a choice of model provider and MCP-based
    extensions.
  source_ids: [goose-repo, goose-quickstart]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The project's governance document states that goose, founded by Block and now stewarded by
    the Agentic AI Foundation, has been established as a series of LF Projects, LLC, a Delaware
    series limited liability company, and that governance changes also need LF Projects'
    approval. The Agentic AI Foundation is a directed fund of The Linux Foundation, which
    describes itself as a 501(c)(6) nonprofit with a legal postal address in San Francisco,
    California. Maintainer roles are tied to individuals rather than employers. Block, which
    created goose, lists its principal executive office in Oakland, California, but eligibility
    rests on the current documented governance, not on the founding company or contributors.
  source_ids: [goose-governance, lfprojects, aaif-charter, lf-about, lf-privacy, block-10k-2025]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code, desktop and CLI downloads, and documentation are public. A model provider must
    be configured, for example with an API key or a supported subscription; provider access is
    governed by that provider's terms.
  source_ids: [goose-repo, goose-install]
  reviewed_at: 2026-10-01
licenses:
