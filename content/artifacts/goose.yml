    source_ids: [goose-release]
    reviewed_at: 2026-10-01
run_notes: []
provenance:
  text: >-
    Block's Open Source Program Office announced codename goose on January 28, 2025. Block
    contributed goose as a founding project of the Agentic AI Foundation, announced on December
    9, 2025, and on April 7, 2026 the repository moved from Block's GitHub organization to
    aaif-goose and the documentation to goose-docs.ai.
  derived_from: []
