summary:
  text: >-
    Molmo2-O-7B is the Molmo 2 vision-language model built on Ai2's Olmo 3 7B Instruct language
    model with a SigLIP 2 vision encoder, released in December 2025. It accepts images, multiple
    images, and video with text, and can answer questions, caption, and point to or track objects.
    Ai2 describes it as the variant whose full model flow is open, since its language model is
    also Ai2's.
  source_ids: [mc-molmo2-o-7b, ai2-molmo2-blog]
useful_for:
  text: >-
    Video and image question answering, captioning, counting, and grounding (pointing and
    tracking), as shown in the model card's examples.
  source_ids: [mc-molmo2-o-7b]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    The model card states the Molmo2 family was developed by the Allen Institute for AI (Ai2),
    which describes itself as a Seattle-based non-profit AI research institute. Its language
    model, Olmo 3 7B Instruct, is also an Ai2 model.
  source_ids: [mc-molmo2-o-7b, ai2-about]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Downloadable from Hugging Face without gating. The card says the model is intended for
    research and educational use under Ai2's Responsible Use Guidelines and was trained on
    third-party datasets that are limited to academic and non-commercial research use.
  source_ids: [mc-molmo2-o-7b]
licenses:
  - name: Apache License 2.0
    spdx: Apache-2.0
    url: https://huggingface.co/allenai/Molmo2-O-7B
    applies_to: weights
    source_ids: [mc-molmo2-o-7b]
  - name: Apache License 2.0 (allenai/molmo2)
    spdx: Apache-2.0
    url: https://raw.githubusercontent.com/allenai/molmo2/main/LICENSE
    applies_to: code
    source_ids: [molmo2-license]
license_notes:
  text: >-
    The weights are Apache 2.0, but the card states the model is intended for research and
    educational use in line with Ai2's Responsible Use Guidelines, and that some of its
    third-party training data is limited to academic and non-commercial research use, so users
    should review those sources. Ai2's Molmo2 datasets are ODC-BY; the Molmo2-Cap card adds
    that it contains text captions generated with GPT-4.1 and GPT-5, subject to OpenAI's terms.
  source_ids: [mc-molmo2-o-7b, ai2-rug, molmo2-cap-card]
checklist:
  weights:
    status: public
    note: >-
      Final weights are on Hugging Face; the molmo2 repository also links pretraining and SFT
      checkpoints for Molmo2-O-7B.
    source_ids: [mc-molmo2-o-7b, molmo2-repo-readme]
  inference_code:
    status: public
    note: >-
      The card documents inference with Transformers 4.57.1 (with trust_remote_code), and the
      repository documents vLLM inference.
    source_ids: [mc-molmo2-o-7b, molmo2-repo-readme]
  training_code:
    status: public
    note: >-
      The card said training code would follow later; the allenai/molmo2 repository now
      publishes pretraining, SFT, long-context SFT, and evaluation scripts, with Molmo2-O-7B
      trained using the olmo3_7b_instruct setting.
    source_ids: [mc-molmo2-o-7b, molmo2-repo-readme]
  legacy_training_data_information:
    status: partial
    note: >-
      Ai2's nine Molmo2 datasets are public on Hugging Face (ODC-BY), and the repository
      provides download scripts for the academic datasets; some of those must be downloaded
      manually under their own licensing agreements. The Olmo 3 language model's training
      data is documented on its own record.
    source_ids: [mc-molmo2-o-7b, ai2-molmo2-blog, molmo2-repo-readme, molmo2-cap-card]
  training_recipe:
    status: public
    note: >-
      The Molmo 2 paper and the repository describe the pretraining, SFT, and long-context SFT
      stages.
    source_ids: [molmo2-paper, molmo2-repo-readme]
  evaluation_materials:
    status: public
    note: >-
      The card reports an average over 15 academic benchmarks and points to the technical
      report; the repository includes evaluation scripts.
    source_ids: [mc-molmo2-o-7b, molmo2-repo-readme]
run_notes:
  - text: >-
      The model card's quick start installs transformers 4.57.1 with torch, accelerate, decord2,
      and molmo_utils, and loads the model with trust_remote_code=True.
    source_ids: [mc-molmo2-o-7b]
provenance:
  text: >-
    Built by Ai2 from its own Olmo 3 7B Instruct language model and a SigLIP vision encoder
    published by Google (the card names SigLIP 2 and links google/siglip-so400m-patch14-384),
    then trained on Ai2's Molmo2 datasets and third-party academic datasets. The paper states
    the new Molmo2 data was collected without using closed vision-language models; the
    Molmo2-Cap card states that some of its text captions were generated with OpenAI's GPT-4.1
    and GPT-5.
  derived_from:
    - name: Olmo 3 7B Instruct
      artifact_slug: olmo-3-7b-instruct
      url: https://huggingface.co/allenai/Olmo-3-7B-Instruct
      note: Language model backbone (Ai2).
    - name: SigLIP (google/siglip-so400m-patch14-384)
      artifact_slug: null
      url: https://huggingface.co/google/siglip-so400m-patch14-384
      note: Vision encoder published by Google.
    - name: Molmo2 datasets
      artifact_slug: null
      url: https://huggingface.co/collections/allenai/molmo2-data
      note: Ai2's image, multi-image, and video training data (ODC-BY).
  source_ids: [mc-molmo2-o-7b, molmo2-paper, molmo2-cap-card]
