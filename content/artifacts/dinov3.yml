summary:
  text: >-
    DINOv3 is Meta's third generation of self-supervised vision backbones, announced in August
    2025. The suite includes a 6.7B-parameter ViT-7B/16, distilled Vision Transformers from
    21M to 840M parameters, ConvNeXt models, and two backbones trained on satellite
    imagery, plus task heads for classification, depth, detection, and segmentation. The
    web-image models were trained on LVD-1689M, a curated set of about 1.7 billion images.
  source_ids: [dinov3-readme, meta-dinov3-blog, hf-dinov3-vit7b16]
useful_for:
  text: >-
    Frozen image features for downstream tasks such as classification, retrieval, depth
    estimation, semantic segmentation, and video tracking; the model card recommends fine-tuning
    only as a last resort.
  source_ids: [hf-dinov3-vit7b16]
