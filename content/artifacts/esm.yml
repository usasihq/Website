summary:
  text: >-
    Protein language models developed by EvolutionaryScale and, since its team joined Biohub in
    November 2025, released by Biohub. The line includes ESM3 (June 2024), a generative model
    that reasons over protein sequence, structure, and function, with a largest version of 98B
    parameters and a small open model; ESM C (ESM Cambrian, December 2024), representation
    models at 300M, 600M, and 6B parameters; and, from May 2026, ESMFold2 structure prediction
    models and sparse autoencoders built on ESM C.
  source_ids: [es-esm3-blog, es-esmc-blog, esm3-readme, biohub-esm-repo, biohub-world-model, biohub-announcement]
useful_for:
  text: >-
    Protein representation learning and fine-tuning (ESM C), protein generation from partial
    sequence, structure, and function prompts (ESM3), and structure prediction for proteins and
    other biomolecules (ESMFold2).
  source_ids: [esm3-readme, biohub-esm-repo, mc-esmfold2]
