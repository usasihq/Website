run_notes:
  - text: >-
      The ESM3 README lists medium (7B) and large (98B) ESM3 models that are accessed through
      Biohub, with only the esm3-sm-open-v1 weights on Hugging Face; the hosted API moved from
      forge.evolutionaryscale.ai to biohub.ai, and the esm SDK still uses Forge class names.
    source_ids: [esm3-readme, biohub-esm-repo]
provenance:
  text: >-
    ESM3 was trained on 2.78 billion natural proteins (771 billion unique tokens at its largest
    scale); ESM C was trained on protein sequences from UniRef, MGnify, and the Joint Genome
    Institute. ESMFold2 is built on ESMC 6B language model embeddings.
