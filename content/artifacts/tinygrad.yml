summary:
  text: >-
    tinygrad is a small end-to-end deep learning framework with a tensor library and autograd,
    an IR and compiler that fuse and lower kernels, a JIT, and modules for neural networks,
    optimizers, and datasets. Its API is similar to PyTorch's, and it supports both training and
    inference across several accelerator backends.
  source_ids: [readme, tc-home]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Training and running neural networks on NVIDIA, AMD, Apple, Qualcomm, and other hardware with
    a compact, readable codebase, including example scripts for running LLaMA, Stable Diffusion,
    and Whisper locally.
  source_ids: [readme, showcase, runtime-docs]
  reviewed_at: 2026-10-01
