run_notes:
  - text: >-
      The showcase documents running LLaMA with examples/llama.py, Stable Diffusion with
      examples/stable_diffusion.py, and Whisper with examples/whisper.py.
    source_ids: [showcase]
    reviewed_at: 2026-10-01
  - text: >-
      The default device is selected automatically from the available hardware and can be forced
      with an environment variable such as DEV=CPU.
