summary:
  text: >-
    TensorRT-LLM is NVIDIA's open-source library for running large language model inference on
    NVIDIA GPUs. It provides a Python LLM API, optimized kernels, Python and C++ runtimes, and
    an online serving command (trtllm-serve).
  source_ids: [trtllm-github-api, trtllm-docs-home]
useful_for:
  text: >-
    The documentation covers offline inference through the LLM API, online serving,
    quantization, speculative decoding, KV cache management, LoRA adapters, and parallelism
    strategies for deploying models on NVIDIA GPUs.
  source_ids: [trtllm-docs-home]
