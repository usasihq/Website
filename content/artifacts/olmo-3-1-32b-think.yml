license_notes:
  text: >-
    The model card states the model is licensed under Apache 2.0 and intended for research
    and educational use in accordance with Ai2's Responsible Use Guidelines, which list
    categories of prohibited use. The post-training datasets are ODC-BY but include
    third-party sources under their own licenses, per their dataset cards.
  source_ids: [mc-olmo31-32b-think, ai2-rug, dolci-think-sft-32b]
checklist:
  weights:
    status: public
    note: Final weights and RL step checkpoints (step revisions) are published on Hugging Face.
    source_ids: [mc-olmo31-32b-think]
  inference_code:
    status: public
    note: The model card documents inference with Hugging Face Transformers and vLLM.
    source_ids: [mc-olmo31-32b-think]
  training_code:
    status: public
    note: >-
      open-instruct publishes the Olmo 3 32B Think SFT, DPO, and RL scripts, and OLMo-core
      publishes the 32B base-model pretraining, mid-training, and long-context scripts.
    source_ids: [open-instruct-olmo3, olmo-core-olmo3]
  training_data_information:
    status: public
    note: >-
      The 32B pretraining mix (Dolma 3 Mix 6T), the 32B mid-training and long-context mixes,
      and the Dolci Think SFT, DPO, and RL datasets used for the 32B Think line are
      downloadable from Hugging Face without gating under ODC-BY.
    source_ids: [dolma3-mix-6t, dolmino-1125, longmino-1125, dolci-think-sft-32b, dolci-think-dpo-32b, dolci-think-rl-32b]
  training_recipe:
    status: public
    note: >-
      The technical report describes Olmo 3.1 Think 32B as the Olmo 3 Think 32B RL run
      continued from 750 to 2,300 steps (an additional 21 days on 224 GPUs). The open-instruct
      README lists the 32B Think scripts and an experiment report covering 3.1.
    source_ids: [olmo3-report, open-instruct-olmo3]
  evaluation_materials:
    status: public
    note: >-
      The model card publishes evaluation results against its SFT, DPO, and Olmo 3 32B Think
      predecessors; OLMES documents commands for running the Olmo 3 evaluation suites.
    source_ids: [mc-olmo31-32b-think, olmes-repo]
run_notes:
  - text: >-
      The model card documents inference with Hugging Face Transformers 4.57.0 or later and
      with vLLM, recommending temperature 0.6, top_p 0.95, and up to 32,768 generated tokens.
    source_ids: [mc-olmo31-32b-think]
provenance:
  text: >-
    Trained by Ai2 from its own Olmo 3 32B base model (Olmo-3-1125-32B) through the
    Olmo-3-32B-Think-SFT and Olmo-3-32B-Think-DPO checkpoints, then RLVR; Olmo 3.1 extends the
    Olmo 3 32B Think RL run. The base model was pretrained on the Dolma 3 Mix (6T).
  derived_from:
    - name: Olmo 3 32B (base), Olmo-3-1125-32B
      artifact_slug: null
      url: https://huggingface.co/allenai/Olmo-3-1125-32B
      note: Base model; no separate catalog record.
    - name: Dolma 3 Mix (6T)
      artifact_slug: dolma
      url: https://huggingface.co/datasets/allenai/dolma3_mix-6T
      note: Pretraining data for the 32B base model.
    - name: Dolci-Think-RL-32B
      artifact_slug: null
      url: https://huggingface.co/datasets/allenai/Dolci-Think-RL-32B
      note: RL prompts used for Olmo 3 and 3.1 32B Think.
  source_ids: [mc-olmo31-32b-think, olmo3-report, dolma3-mix-6t, dolci-think-rl-32b]
