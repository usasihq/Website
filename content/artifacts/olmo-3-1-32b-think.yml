summary:
  text: >-
    A 32B reasoning model from Ai2's December 2025 Olmo 3.1 update. It was produced by
    continuing the reinforcement learning run behind Olmo 3 32B Think for about three more
    weeks with additional passes over the Dolci-Think-RL data, and it writes a reasoning trace
    before its final answer.
  source_ids: [mc-olmo31-32b-think, ai2-olmo3-blog, olmo3-report]
useful_for:
  text: >-
    Ai2 describes the Think models as reasoning models aimed at math, code, and precise
    instruction following.
  source_ids: [ai2-docs-olmo, mc-olmo31-32b-think]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    The model card states the model was developed by the Allen Institute for AI (Ai2), which
    describes itself as a Seattle-based non-profit AI research institute.
  source_ids: [mc-olmo31-32b-think, ai2-about]
  assessed_at: 2026-09-29
availability:
