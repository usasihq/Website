summary:
  text: >-
    Cosmos3-Super is the 64B-parameter model in NVIDIA's Cosmos 3 family, released on May 31,
    2026. It uses a mixture-of-transformers design with an autoregressive tower that generates
    text and a diffusion tower that generates images, video, audio, and robot actions, and it
    takes combinations of text, image, video, audio, and action-trajectory inputs.
  source_ids: [super-card, cosmos3-report]
useful_for:
  text: >-
    The card lists physical AI uses in robotics, autonomous vehicles, and industrial and smart
    spaces; NVIDIA positions Super for post-training robotics and autonomous-vehicle models
    and for synthetic data generation and distillation.
  source_ids: [super-card, cosmos3-press, cosmos-github]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model card names NVIDIA as the model developer. NVIDIA's principal executive offices
    are in Santa Clara, California, per its Form 10-Q for the quarter ended July 26, 2026. The
    model is initialized from third-party Qwen3-VL weights, recorded under provenance; that
    base is not U.S.-developed.
  source_ids: [super-card, nvidia-10q-q2fy2027, cosmos3-report, qwen3-vl-github]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Weights are downloadable from Hugging Face without an access gate under OpenMDW-1.1; the
    card states the model is ready for commercial and non-commercial use and lists global
    deployment geography.
  source_ids: [super-hf-api, super-card]
