license_notes:
  text: >-
    OpenMDW-1.1 grants permission to deal in the "Model Materials" (model architecture and
    parameters plus related data, documentation, and software) without restriction under
    copyright, patent, database, and trade secret rights. Distributors must keep a copy of the
    agreement and applicable notices, and rights end for anyone who sues claiming the
    materials infringe a patent or copyright, unless responding to a suit brought first. It
    places no restrictions on outputs. The technical report calls it the Linux Foundation's
    OpenMDW-1.1 License. It is not on this catalog's OSI-approved list.
  source_ids: [openmdw-1-1, cosmos-license, cosmos3-report]
checklist:
  weights:
    status: public
    note: Weights are published on Hugging Face without an access gate.
    source_ids: [super-hf-api, super-card]
  inference_code:
    status: public
    note: >-
      The card documents inference with vLLM-Omni, vLLM, Hugging Face Diffusers, and SGLang
      Diffusion, and uses the Cosmos-Framework package for prompt upsampling.
    source_ids: [super-card, cosmos-framework-readme]
  training_code:
    status: partial
    note: >-
      Cosmos-Framework publishes a distributed trainer whose documented recipes cover
      supervised fine-tuning (including LoRA for Super) of released checkpoints. The report
      describes the internal training infrastructure used for both towers but does not identify
      it as Cosmos-Framework, and pre-training configurations were not found.
    source_ids: [cosmos-framework-readme, cosmos-framework-training, cosmos3-report]
  legacy_training_data_information:
    status: partial
    note: >-
      The card summarizes the corpus (about 1.3B data points from 393 dataset entries, drawn
      from NVIDIA-owned data and public datasets, plus synthetic data) and links a public
      summary of training content. The report lists five synthetic datasets released on
      Hugging Face; most training data is not released.
    source_ids: [super-card, cosmos3-report]
  training_recipe:
    status: public
    note: >-
      The technical report describes the reasoner and generator training stages (pre-training,
      mid-training, and post-training), data mixtures, optimizer settings, learning-rate
      schedules, token counts, and GPU counts.
    source_ids: [cosmos3-report]
  evaluation_materials:
    status: partial
    note: >-
      The card and report publish benchmark results, and the report releases one human
      evaluation benchmark (Cosmos-HUE); code to re-run all reported evaluations was not
      verified.
    source_ids: [super-card, cosmos3-report]
run_notes:
  - text: >-
      The card lists PyTorch, vLLM-Omni, Diffusers, and SGLang as runtimes; NVIDIA Ampere,
      Hopper, and Blackwell GPUs; and Linux as the only tested operating system. It states
      that only BF16 precision is tested and gives a recommended vLLM-Omni serving setup for
      eight H200, H100, or A100 GPUs.
    source_ids: [super-card]
provenance:
  text: >-
    Trained by NVIDIA. The technical report states that Cosmos3-Super adapts the Qwen3-VL 32B
    architecture and is initialized from pre-trained Qwen3-VL-32B weights (developed by the
    Qwen team at Alibaba Cloud), and that visual generation uses the video VAE encoder from
    Wan2.2-TI2V-5B (published on Hugging Face by Wan-AI). The card lists synthetic training
    data generated with HiDream-I1, Qwen-Image-2512, and Qwen3-VL.
  derived_from:
    - name: Qwen3-VL-32B
      artifact_slug: null
      url: https://github.com/QwenLM/Qwen3-VL
      note: Initialization weights for the language and vision backbone.
    - name: Wan2.2-TI2V-5B video VAE
      artifact_slug: null
      url: https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B
      note: Video VAE encoder used for visual generation; published by Wan-AI under Apache 2.0.
  source_ids: [cosmos3-report, super-card, qwen3-vl-github, wan22-card]
