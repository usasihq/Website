license_notes:
  text: >-
    The Apache 2.0 license is stated in the model card metadata and summary table. IBM's
    machine-readable training-data disclosures are published separately under CDLA Permissive
    v2.
  source_ids: [model-card, disclosures-readme]
checklist:
  weights:
    status: public
    note: Safetensors weights in bfloat16 are published in the Hugging Face repository.
    source_ids: [model-card]
  inference_code:
    status: public
    note: >-
      The model card documents running the model with Hugging Face Transformers, vLLM, and
      SGLang, and the repository includes a chat template and a reasoning-parser plugin.
    source_ids: [model-card]
  training_code:
    status: unknown
    note: >-
      The model card names NVIDIA's NeMo RL and NeMo Gym for reinforcement learning. This review
      did not find IBM's own training code or configurations for this release.
    source_ids: []
  training_data_information:
    status: partial
    note: >-
      IBM's disclosure file lists pre-training and post-training datasets by category, with URLs
      for most of them. Several entries are internal, acquired, or synthetic datasets that are
      not publicly obtainable.
    source_ids: [disclosure-8b]
  training_recipe:
    status: partial
    note: >-
      The technical blog documents the post-training procedure, including the SFT data mixture
      and configuration (learning rate, batch size, warm-up, epochs) and per-stage GRPO
      reinforcement-learning and RLHF settings. Pre-training of the Granite 4.1 base model is
      referred to a separate Granite 4.1 blog that this review did not assess, and no training
      code or configuration files were found.
    source_ids: [model-card, tech-blog]
  evaluation_materials:
    status: partial
    note: >-
      The model card publishes a results table and states that evaluations use a framework based
      on NVIDIA's NeMo Evaluator SDK. This review did not find IBM's evaluation configurations or
      prompts.
    source_ids: [model-card]
run_notes:
  - text: >-
      The model card documents serving with vLLM (v0.20 or later for the bundled
      granite_thinking_parser) and with SGLang (v0.5.18 or later), and loading with Hugging Face
      Transformers. It recommends temperature 1.0 and top_p 0.95 for all modes.
    source_ids: [model-card]
  - text: >-
      IBM also publishes quantized variants of this model in the ibm-granite Hugging Face
      organization, including GGUF, FP8, MXFP4, NVFP4, and MLX builds.
    source_ids: [hf-ibm-granite-models]
provenance:
  text: >-
    Post-trained by IBM from its own Granite 4.1 8B Base model, using supervised fine-tuning,
    reinforcement learning, and RLHF.
  derived_from:
    - name: Granite 4.1 8B Base
      artifact_slug: null
      url: https://huggingface.co/ibm-granite/granite-4.1-8b-base
      note: IBM base model; pre-trained from scratch per the Granite 4.2 technical blog.
  source_ids: [model-card, tech-blog]
