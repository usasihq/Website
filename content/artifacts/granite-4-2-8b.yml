summary:
  text: >-
    Granite 4.2 8B is an 8-billion-parameter dense decoder-only language model from IBM with
    built-in reasoning, selectable thinking, non-thinking, and low-effort modes, and tool calling.
    It supports a 128K-token context natively; the model card documents extension to 512K.
  source_ids: [model-card]
useful_for:
  text: >-
    The model card lists reasoning, code generation, tool calling, agentic workflows, and
    multilingual dialog in 12 tested languages.
  source_ids: [model-card]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Developed by IBM's Granite Team per the model card. IBM's principal executive offices are in
    Armonk, New York, per its fiscal 2025 Form 10-K. It is post-trained from IBM's own Granite 4.1
    8B Base, not from another developer's weights.
  source_ids: [model-card, ibm-10k-2025]
  assessed_at: 2026-09-29
availability:
