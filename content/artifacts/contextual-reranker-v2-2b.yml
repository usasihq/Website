run_notes:
  - text: >-
      The card recommends vLLM for production (vLLM 0.8.5 or later for BF16, vLLM 0.10.0 for NVFP4)
      and documents a simpler Hugging Face Transformers path (Transformers 4.51.0 or later, BF16
      only; NVFP4 is not supported there).
    source_ids: [ ctx-rerank-v2-2b-card ]
    reviewed_at: 2026-10-02
provenance:
  text: >-
    The card and announcement do not name a base checkpoint. The published configuration
    declares the Qwen3ForCausalLM architecture (model type qwen3), which is the architecture of
    Alibaba Cloud's Qwen3 models; whether the weights were initialized from a Qwen3 checkpoint is
    not documented in the sources reviewed.
