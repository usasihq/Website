summary:
  text: >-
    The 2B-parameter size of Contextual AI Reranker v2, an instruction-following multilingual
    reranker released in August 2025. Given a query, an optional natural-language instruction,
    and a document, it outputs a relevance score; the card lists support for more than 100
    languages and inputs of up to 32K tokens.
  source_ids: [ ctx-rerank-v2-2b-card, ctx-rerank-v2-blog ]
  reviewed_at: 2026-10-02
useful_for:
  text: >-
    Re-ranking retrieved documents with custom instructions, such as prioritizing recent
    information, handling conflicting retrieval results, and multilingual or long-context search.
  source_ids: [ ctx-rerank-v2-2b-card ]
  reviewed_at: 2026-10-02
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model is published in Contextual AI's Hugging Face organization and the card names
    Contextual AI as its developer. Contextual AI, Inc. gives a Mountain View, California postal
    address in its privacy notice (see the Contextual AI record). The checkpoint the model was
    trained from is not disclosed; its configuration declares the Qwen3 architecture (see
    provenance), so this record does not treat any underlying base weights as U.S.-developed.
  source_ids: [ ctx-rerank-v2-2b-card, ctx-privacy, ctx-rerank-v2-2b-config ]
  assessed_at: 2026-10-02
availability:
  status: public
  access_conditions: >-
    Downloadable from Hugging Face without gating, for noncommercial use under CC BY-NC-SA 4.0.
    Contextual AI also serves managed versions through its hosted Rerank API.
  source_ids: [ ctx-rerank-v2-2b-card, ctx-rerank-v2-2b-meta, ctx-rerank-v2-blog ]
  reviewed_at: 2026-10-02
