summary:
  text: >-
    The openly released small ESM3 model, which EvolutionaryScale describes as a 1.4B-parameter
    open model. ESM3 is a generative masked language model that takes partial prompts across
    protein sequence, structure, and function tracks and predicts all three. EvolutionaryScale
    released it in June 2024; Biohub now distributes it under the MIT license.
  source_ids: [es-esm3-blog, esm3-readme, mc-esm3-open]
useful_for:
  text: >-
    Designing or completing proteins from partial sequence, structure, and function prompts,
    run locally on a GPU or CPU with the esm package.
  source_ids: [mc-esm3-open, esm3-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Developed by EvolutionaryScale, PBC (New York address in its former terms of use, effective
    January 15, 2025) and now
    published by Biohub, whose repository license names Chan Zuckerberg Biohub, Inc. The IRS
    lists Chan Zuckerberg Biohub Inc in Redwood City, California as a 501(c)(3) organization.
  source_ids: [es-terms-legacy, es-esm3-blog, biohub-esm-license, irs-eo-bmf-ca]
  assessed_at: 2026-09-29
