license_notes:
  text: >-
    The model card's text (its metadata has no license field) and the ESM3 README place the
    model under the MIT license, and the LICENSE file names Chan Zuckerberg Biohub, Inc. as
    copyright holder (2026). The EvolutionaryScale site still hosts an EvolutionaryScale, PBC
    Community License Agreement covering the ESM-3 open model code and weights that limits use
    to non-commercial purposes; the current Biohub materials state MIT, and the sources
    reviewed do not say when the terms changed. Biohub's README also asks users to follow its
    Acceptable Use Policy.
  source_ids: [mc-esm3-open, hf-api-esm3-open, esm3-readme, biohub-esm-license, es-community-license]
checklist:
  weights:
    status: public
    note: Downloadable from Hugging Face without gating.
    source_ids: [mc-esm3-open, hf-api-esm3-open]
  inference_code:
    status: public
    note: >-
      The esm package (pip install esm) loads the model locally; the ESM3 README gives an
      example.
    source_ids: [esm3-readme, mc-esm3-open]
  training_code:
    status: unknown
    note: >-
      The public repository covers local inference and API clients; no ESM3 training code was
      identified in the pages reviewed.
    source_ids: []
  training_data_information:
    status: partial
    note: >-
      The card describes training on 2.78 billion natural proteins, augmented to 3.15 billion
      sequences, 236 million structures, and 539 million function-annotated proteins (771
      billion tokens), with viral proteins and some USDA Select Agent proteins removed. The
      training set itself was not found as a download.
    source_ids: [mc-esm3-open]
  training_recipe:
    status: unknown
    note: >-
      The ESM3 paper in Science describes the model; it was not reviewed for this record.
    source_ids: []
  evaluation_materials:
    status: unknown
    note: null
    source_ids: []
run_notes:
  - text: >-
      The ESM3 README loads the model with ESM3.from_pretrained("esm3-sm-open-v1") and runs it on
      "cuda" or "cpu".
    source_ids: [esm3-readme]
provenance:
  text: >-
    Trained by EvolutionaryScale on natural protein sequences with synthetic augmentation;
    viral data and some proteins from organisms on the USDA Select Agents and Toxins list were
    removed, and the function decoder was filtered for potentially harmful keywords.
  derived_from: []
  source_ids: [mc-esm3-open, es-esm3-blog]
