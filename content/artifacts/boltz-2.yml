summary:
  text: >-
    Boltz-2 is a biomolecular foundation model that predicts the 3D structures of complexes of
    proteins, nucleic acids, and small molecules together with protein-ligand binding affinity.
    It was released in June 2025 by the Boltz team at MIT Jameel Clinic with Recursion and is
    now presented by Boltz PBC as one of its open-source models. It ships as a structure and
    confidence checkpoint plus a separate affinity checkpoint.
  reviewed_at: 2026-10-01
  source_ids: [boltz-boltz2-post, boltz-home, hf-boltz2-api]
useful_for:
  text: >-
    The README describes structure prediction from YAML inputs and two affinity outputs: a
    binder probability intended for separating binders from decoys in hit discovery, and an
    affinity value intended for comparing related binders during hit-to-lead and lead
    optimization. The announcement adds contact constraints, template guidance, and
    method-conditioning options.
  reviewed_at: 2026-10-01
  source_ids: [boltz-readme, boltz-boltz2-post]
