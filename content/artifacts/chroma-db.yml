summary:
  text: >-
    Chroma is an open-source database for AI applications that stores documents, embeddings, and
    metadata and supports vector, full-text, regex, and metadata search. It can run in memory
    inside a program, persist to local disk, or run as a server, with client libraries for Python,
    JavaScript/TypeScript, and Rust.
  source_ids: [chroma-repo, chroma-getting-started, chroma-home]
useful_for:
  text: >-
    Retrieval for LLM applications, such as semantic search over documents and
    retrieval-augmented generation, from local prototypes to a client-server deployment.
  source_ids: [chroma-repo, chroma-getting-started]
