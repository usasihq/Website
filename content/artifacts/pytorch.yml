    spdx: BSD-3-Clause
    url: https://github.com/pytorch/pytorch/blob/main/LICENSE
    applies_to: code
    source_ids: [pytorch-license, pytorch-readme]
license_notes:
  text: >-
    The README calls the license "BSD-style". The LICENSE file contains the three BSD clauses,
    preceded by copyright notices for PyTorch and Caffe2 contributors such as Facebook, Inc.,
    Idiap Research Institute, DeepMind Technologies, NEC Laboratories America, and NYU. GitHub's
    license detection assigns no SPDX identifier (it reports "Other"); this catalog records
    BSD-3-Clause because the text fits the SPDX BSD-3-Clause matching template, whose third
    clause allows named organizations in place of "the copyright holder".
  source_ids: [pytorch-license, pytorch-readme, github-license-api, spdx-bsd3-template]
checklist:
  source_code:
    status: public
    note: Developed in the public pytorch/pytorch GitHub repository.
    source_ids: [pytorch-repo]
  documentation:
    status: public
    note: Versioned documentation is published at docs.pytorch.org (version 2.14 at review time).
    source_ids: [pytorch-docs]
  installation:
    status: public
    note: >-
      The project documents pip installation for Python, LibTorch for C++, and building from
      source. The latest stable release requires Python 3.10 or later.
    source_ids: [pytorch-get-started]
  supported_platforms:
    status: public
    note: >-
      The install page covers Linux (distributions with glibc 2.28 or later), macOS 10.15 or
      later, and Windows, with CUDA, ROCm, and CPU builds.
    source_ids: [pytorch-get-started]
  release_status:
    status: public
    note: Versioned releases are published on GitHub, including v2.14.0 on September 2, 2026.
    source_ids: [pytorch-release-2-14]
