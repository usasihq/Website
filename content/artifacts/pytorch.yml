summary:
  text: >-
    PyTorch is an open-source machine learning framework for tensors and dynamic neural networks
    in Python, with GPU acceleration and a C++ distribution (LibTorch). Meta originally developed
    it and released it in 2016. Since September 2022 it has been hosted by the PyTorch
    Foundation under the Linux Foundation.
  source_ids: [pytorch-repo, pytorch-get-started, lf-pytorch-press]
useful_for:
  text: >-
    Building, training, and running neural network models in Python or C++ on CPUs and on NVIDIA
    (CUDA) or AMD (ROCm) GPUs.
  source_ids: [pytorch-get-started, pytorch-repo]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The PyTorch code base is established as PyTorch a Series of LF Projects, LLC, and supported by
    the PyTorch Foundation, a directed fund of The Linux Foundation. The Linux Foundation is a
    U.S. 501(c)(6) nonprofit whose privacy policy gives a contact mailing address in San
    Francisco, California.
    Technical decisions are made by individual maintainers under the project's published
    governance, separate from the foundation's business governance.
  source_ids: [ptf-charter, lf-about, lf-privacy, pytorch-governance]
  assessed_at: 2026-09-29
