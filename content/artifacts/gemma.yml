license_notes:
  text: >-
    Licensing differs by generation. Gemma 4 is released under the Apache License 2.0. Gemma 1
    through 3, Gemma 3n, and several specialized variants are covered by the Gemma Terms of Use,
    which incorporate a Prohibited Use Policy, apply to the models listed in their appendix, and
    direct readers to the separate Gemma 4 license for Gemma 4. Check the terms for each release
    before use.
