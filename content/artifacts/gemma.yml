summary:
  text: >-
    Gemma is a family of open-weight models credited to Google DeepMind. Google's release page
    lists general-purpose generations including Gemma 3 (2025) and Gemma 4 (2026), along with
    specialized variants such as EmbeddingGemma, MedGemma, ShieldGemma, and FunctionGemma.
  source_ids: [gemma-releases, gdm-gemma]
