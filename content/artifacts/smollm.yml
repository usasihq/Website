provenance:
  text: >-
    Trained from scratch by Hugging Face on public datasets. SmolLM used the SmolLM-Corpus
    (Cosmopedia v2, synthetic textbooks and stories generated with Mixtral; FineWeb-Edu; and
    Python-Edu, filtered from The Stack); SmolLM2 added the FineMath,
    Stack-Edu, and SmolTalk datasets; SmolLM3's pretraining mix includes FineWeb-Edu, DCLM,
    FineWeb-2, FineMath, and Stack-Edu among other public datasets.
  derived_from:
    - name: FineWeb-Edu (subset of FineWeb)
      artifact_slug: fineweb
      url: https://huggingface.co/datasets/HuggingFaceFW/fineweb-edu
      note: Educational web subset filtered from FineWeb; used across SmolLM generations.
  source_ids: [smollm-blog, smollm2-paper, smollm3-pretraining-collection, fineweb-paper]
