summary:
  text: >-
    SmolLM is Hugging Face's series of small language models. The first SmolLM release (July
    2024) came in 135M, 360M, and 1.7B sizes; SmolLM2 kept those three sizes, with the 1.7B model
    trained on about 11 trillion tokens (paper February 2025); and SmolLM3 (July 2025) is a 3B
    model released as base and instruct checkpoints, with a dual-mode reasoning instruct model.
    The SmolVLM vision-language models are maintained in the same repository.
  source_ids: [smollm-blog, smollm2-paper, smollm-text-readme, smollm3-blog, smollm-repo-readme]
useful_for:
  text: >-
    Hugging Face describes the models as compact enough to run on-device, and publishes the
    training data mixtures, configurations, and code alongside the weights.
  source_ids: [smollm-repo-readme, smollm-text-readme]
