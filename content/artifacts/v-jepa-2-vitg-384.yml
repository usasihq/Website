summary:
  text: >-
    The 1-billion-parameter ViT-g/16 encoder from Meta's V-JEPA 2, in the version that takes
    64-frame clips at 384-pixel resolution. It was pretrained with self-supervision on
    VideoMix22M, a mix of about 22 million video and image samples. Meta's action-conditioned
    V-JEPA 2-AC world model was post-trained from a ViT-g/16 V-JEPA 2 encoder.
  source_ids: [hf-vjepa2-vitg-384, vjepa2-readme, vjepa2-paper-html]
useful_for:
  text: >-
    The model card describes use as a video and image encoder for video classification,
    retrieval, and as the video encoder of vision-language models.
  source_ids: [hf-vjepa2-vitg-384]
