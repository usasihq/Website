license_notes:
  text: >-
    The repository README says most of V-JEPA 2 is licensed under MIT, with three
    data-augmentation and worker-initialization files under Apache 2.0, but does not name a
    separate license for the checkpoints linked from the README. The Hugging Face card for this
    checkpoint declares Apache-2.0. Meta's announcement says the code and checkpoints are
    available for commercial and research applications.
  source_ids: [vjepa2-readme, hf-vjepa2-vitg-384, vjepa2-blog]
checklist:
  weights:
    status: public
    note: Ungated Hugging Face repository and direct download link.
    source_ids: [hf-api-vjepa2-vitg-384, vjepa2-readme]
  inference_code:
    status: public
    note: >-
      The repository provides PyTorch Hub loaders and a demo; the model card documents use with
      Hugging Face Transformers.
    source_ids: [vjepa2-readme, hf-vjepa2-vitg-384]
  training_code:
    status: public
    note: >-
      The repository publishes the V-JEPA 2 pretraining loop and launch commands, with
      pretraining and cooldown configurations for ViT-g/16 (including a 384-pixel cooldown).
    source_ids: [vjepa2-readme, vjepa2-configs-vitg16]
  training_data_information:
    status: partial
    note: >-
      The paper lists VideoMix22M's components (Something-Something v2, Kinetics, HowTo100M,
      YT-Temporal-1B, and ImageNet) and says all sources are publicly available. The YT-Temporal-1B
      portion was filtered by retrieval-based curation; this review did not find the curated
      subset list published.
    source_ids: [vjepa2-paper-html]
  training_recipe:
    status: public
    note: >-
      Pretraining and cooldown configuration files are published, and the paper documents
      pretraining hyperparameters in its appendix.
    source_ids: [vjepa2-configs-vitg16, vjepa2-paper-html]
  evaluation_materials:
    status: public
    note: >-
      The repository publishes attentive-probe evaluation code, evaluation configs for the ViT-g
      384-pixel model (for example SSv2, Diving48, EPIC-KITCHENS-100, Kinetics-400, ImageNet-1k),
      and trained probe checkpoints.
    source_ids: [vjepa2-readme, vjepa2-configs-eval-vitg384]
run_notes:
  - text: >-
      The README notes that the code depends on decord, which does not support macOS, and
      documents Python 3.12 environment setup; the model card documents loading with Transformers'
      AutoModel and AutoVideoProcessor.
    source_ids: [vjepa2-readme, hf-vjepa2-vitg-384]
