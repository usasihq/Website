summary:
  text: >-
    A 20-billion-parameter Evo 2 checkpoint with 1 million base-pair context, released in
    February 2026. Arc created it from Evo 2 40B without additional training by removing layers
    that logit-lens analysis showed could be dropped with little effect on loss, while keeping
    the unembedding layer.
  source_ids: [mc-evo2-20b, evo2-v050-release]
useful_for:
  text: >-
    The same tasks as Evo 2 40B (likelihood scoring, embeddings, and generation of DNA
    sequences) on less hardware; the release notes describe it as running on a single H100 GPU
    instead of two.
  source_ids: [evo2-v050-release, evo2-repo]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The checkpoint is published in Arc Institute's Hugging Face organization and announced in
