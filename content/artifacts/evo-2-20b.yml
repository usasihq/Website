  source_ids: [evo2-license]
checklist:
  weights:
    status: public
    note: >-
      Weights are on Hugging Face without gating; a Savanna-format checkpoint
      (savanna_evo2_20b) is also published.
    source_ids: [mc-evo2-20b, hf-api-evo2-20b, hf-api-arc-models]
  inference_code:
    status: public
    note: The evo2 package on GitHub supports evo2_20b under Apache 2.0.
    source_ids: [evo2-repo, evo2-license]
  training_code:
    status: partial
    note: >-
      No further training was done; the weights come from Evo 2 40B, which the README says was
      trained with the open-source Savanna framework. Code for the layer-removal step was not
      identified.
    source_ids: [evo2-v050-release, evo2-repo]
  legacy_training_data_information:
    status: public
    note: >-
      The card lists OpenGenome2, the Evo 2 pretraining dataset, which is downloadable from
      Hugging Face.
    source_ids: [mc-evo2-20b, opengenome2-card]
  training_recipe:
    status: partial
    note: >-
      The release notes describe the layer-removal method at a high level; the exact layers
      removed were not found in the pages reviewed.
    source_ids: [evo2-v050-release]
  evaluation_materials:
    status: partial
    note: >-
      The release notes compare the 20B and 40B checkpoints on variant effect prediction and
      gene completion; evaluation scripts for those comparisons were not identified.
    source_ids: [evo2-v050-release]
run_notes:
  - text: >-
      The README states that evo2_20b needs FP8 through NVIDIA Transformer Engine and an NVIDIA
      Hopper GPU for numerical accuracy; the release notes say it runs on a single H100.
    source_ids: [evo2-repo, evo2-v050-release]
provenance:
  text: >-
    Derived by Arc Institute from its own Evo 2 40B checkpoint through layer removal, without
    additional training.
  derived_from:
    - name: Evo 2 40B (evo2_40b)
      artifact_slug: evo-2-40b
      url: https://huggingface.co/arcinstitute/evo2_40b
      note: Source checkpoint.
  source_ids: [evo2-v050-release]
