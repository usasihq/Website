summary:
  text: >-
    Pythia is EleutherAI's suite of language models built for research on how models learn
    during training and change with scale. The main suite has eight sizes from 70M to 12B
    parameters, each trained once on the Pile and once on a deduplicated Pile, on the same data
    in the same order, with 154 checkpoints per model. The current suite was retrained and
    re-released in April 2023; 14M and 31M models and additional random-seed runs were added
    later.
  source_ids: [pythia-repo, mc-pythia-12b, pythia-paper]
useful_for:
  text: >-
    EleutherAI states the suite is intended for research on the behavior and limitations of
    language models, including interpretability and learning dynamics, and not for deployment.
  source_ids: [mc-pythia-12b, pythia-repo]
