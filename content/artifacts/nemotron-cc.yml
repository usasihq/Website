license_notes:
  text: >-
    The paper states the original release is under the Common Crawl Terms of Use, which grant
    a limited, non-transferable license and note that crawled content may carry its owners'
    terms. The NVIDIA Data Agreement for Model Training (version of August 15, 2025) makes the
    data available solely for internal training of the user's AI models; it prohibits
    redistributing or sublicensing the datasets, grants no rights in copyrighted material
    contained in them, lets either party terminate on 30 days' notice (after which copies must
    be deleted), and is governed by U.S. and Delaware law. The v2 card lists the models used to
    generate synthetic data across its dataset collection and states that models trained on the
    data may be subject to the Qwen and DeepSeek license agreements; the v2.1 card also names
    the Phi-4 license agreement.
  source_ids: [ncc-paper, cc-terms, nv-data-agreement, ncc-v2-card, ncc-v21-card]
checklist:
  access:
    status: partial
    note: >-
      Original release downloadable from Common Crawl. v2 and v2.1 require sharing contact
      information and accepting NVIDIA's agreement on Hugging Face, and the Hub reports manual
      approval of access requests for both.
    source_ids: [ncc-cc-page, ncc-v2-card, ncc-v21-card, ncc-v2-hub-api, ncc-v21-hub-api, hf-gated-docs]
  provenance:
    status: public
    note: >-
      The Common Crawl page lists the crawls included and the quality and synthetic-type
      partitions; each record keeps its source URL and WARC record ID. The v2 and v2.1 cards
      name the added snapshots and the models used to generate synthetic data.
    source_ids: [ncc-cc-page, ncc-v2-card, ncc-v21-card]
  documentation:
    status: public
    note: >-
      The construction pipeline (extraction, classifier ensembling, quality bucketing, synthetic
      rephrasing, with prompt templates in an appendix) is described in the paper; v2 and v2.1
      have dataset cards.
    source_ids: [ncc-paper, ncc-v2-card, ncc-v21-card]
  licensing:
    status: public
    note: Terms documented for each release; neither set of terms is an open data license.
    source_ids: [ncc-paper, cc-terms, nv-data-agreement]
  stated_limitations:
    status: public
    note: >-
      The paper's Limitations section says the rephrased data was not checked for factual
      accuracy or fidelity, the methods were tried only on English text, not every pipeline
      step was ablated, and the dataset was not decontaminated against benchmarks.
    source_ids: [ncc-paper]
run_notes: []
provenance:
  text: >-
    Built by NVIDIA from Common Crawl web archives. For the original release, synthetic
    rephrasings were generated with the instruct version of Mistral NeMo 12B. The v2 card's
    per-dataset table lists Mistral-Nemo-12B-Instruct and Qwen3-30B-A3B for Nemotron-CC-v2. The
    v2.1 card lists Qwen3-30B-A3B for its synthetic and translated subsets, and says its STEM
    question-answer subset was built from documents in Essential-Web.
  derived_from:
    - name: Common Crawl
      artifact_slug: common-crawl-corpus
      url: https://commoncrawl.org
      note: Source web archive; the original release covers crawls CC-MAIN-2013-20 through CC-MAIN-2024-30.
  source_ids: [ncc-paper, ncc-cc-page, ncc-v2-card, ncc-v21-card]
