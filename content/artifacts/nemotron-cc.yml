summary:
  text: >-
    Nemotron-CC is NVIDIA's English pretraining dataset built from Common Crawl. The original
    release (December 2024) has 6.3T tokens, 4.4T globally deduplicated original tokens and
    1.9T synthetic tokens, drawn from 99 Common Crawl snapshots (CC-MAIN-2013-20 through
    CC-MAIN-2024-30) and split into five quality buckets. Nemotron-CC-v2 (August 2025) and
    Nemotron-CC-v2.1 (December 2025), published on Hugging Face, add newer snapshots, further
    synthetic rephrasings, translated question-answer data, and other subsets.
  source_ids: [ncc-cc-page, ncc-paper, ncc-research-page, ncc-v2-card, ncc-v21-card]
useful_for:
  text: >-
    Documented for pretraining language models, including over long token horizons. The v2
    card describes it as intended for training foundation language models and for community
    work on open models.
  source_ids: [ncc-paper, ncc-v2-card]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The dataset is created and published by NVIDIA: the paper's authors are listed with an
    NVIDIA affiliation, the v2 card names NVIDIA as data developer, and the v2.1 card names NVIDIA
    Corporation as dataset owner. NVIDIA
    Corporation's principal executive offices are in Santa Clara, California, per its Form
    10-Q for the quarter ended July 26, 2026.
  source_ids: [ncc-paper, ncc-v2-card, ncc-v21-card, nvidia-10q-q2fy2027]
  assessed_at: 2026-09-29
availability:
  status: partial
  access_conditions: >-
    The original release is downloadable from Common Crawl's data site as partitioned
    .jsonl.zstd files (about 10.4 TiB). Nemotron-CC-v2 and v2.1 are gated on Hugging Face:
    users must share contact information (including company and institutional email) and agree
    to the NVIDIA Data Agreement for Model Training, confirming that they intend to use the data
    for model training only. The Hugging Face API reports both gates as manual, meaning the
    dataset authors approve each access request.
  source_ids: [ncc-cc-page, ncc-v2-card, ncc-v21-card, ncc-v2-hub-api, ncc-v21-hub-api, hf-gated-docs]
