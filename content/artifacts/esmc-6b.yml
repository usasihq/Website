summary:
  text: >-
    The largest ESM C (ESM Cambrian) protein language model: 6 billion parameters, 80 transformer
    layers, and 2.37e23 training FLOPs. EvolutionaryScale introduced ESM C in December 2024;
    Biohub's May 2026 release of ESMC, ESMFold2, and ESM Atlas included the 6B weights, and
    ESMFold2 is trained on top of a frozen ESMC 6B.
  source_ids: [mc-esmc-6b, es-esmc-blog, biohub-esm-repo, biohub-world-model]
useful_for:
  text: >-
    Producing protein representations and embeddings for downstream tasks such as protein
    engineering and variant effect prediction, and fine-tuning for token or sequence
    classification; the card also points to sparse autoencoders for interpreting its features.
  source_ids: [mc-esmc-6b, biohub-esm-repo]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    ESM C was introduced by EvolutionaryScale, PBC (New York address in its former terms of
    use, effective January 15, 2025), and the 6B weights are published by Biohub, whose repository license names Chan
    Zuckerberg Biohub, Inc. The IRS lists Chan Zuckerberg Biohub Inc in Redwood City,
    California as a 501(c)(3) organization.
  source_ids: [es-esmc-blog, es-terms-legacy, mc-esmc-6b, biohub-esm-license, irs-eo-bmf-ca]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Downloadable from Hugging Face without gating. The card lists uses prohibited by Biohub's
    Acceptable Use Policy as out of scope.
  source_ids: [mc-esmc-6b, hf-api-esmc-6b]
licenses:
  - name: MIT License
    spdx: MIT
    url: https://raw.githubusercontent.com/Biohub/esm/main/LICENSE.md
    applies_to: weights-and-code
    source_ids: [mc-esmc-6b, biohub-esm-repo, biohub-esm-license]
license_notes:
  text: >-
    The card's license field lists "mit" and "other", with the license link pointing to the
    repository's third-party notice, which lists the licenses of code dependencies such as
    PyTorch, flash-attn, and xformers. The repository README states the models are available
    under the MIT license and asks users to follow Biohub's Acceptable Use Policy.
    EvolutionaryScale's December 2024 ESM C post, as archived on 2024-12-05, released the 300M and 600M weights and offered ESM C 6B through its Forge API
    and AWS SageMaker, while the current version of that post states that all three sizes were
    released as open weights under the MIT license.
  source_ids: [mc-esmc-6b, biohub-esm-third-party, biohub-esm-repo, es-esmc-blog-archived, es-esmc-blog]
checklist:
  weights:
    status: public
    note: Downloadable from Hugging Face without gating.
    source_ids: [mc-esmc-6b, hf-api-esmc-6b]
  inference_code:
    status: public
    note: >-
      The card documents loading the model with Hugging Face Transformers, and the esm package
      provides the production inference path.
    source_ids: [mc-esmc-6b, biohub-esm-repo]
  training_code:
    status: unknown
    note: No ESM C training code was identified in the pages reviewed.
    source_ids: []
  legacy_training_data_information:
    status: partial
    note: >-
      The card names the sources (UniRef, MGnify, and JGI sequences clustered at 70% identity
      into 83M, 372M, and 2B clusters) but does not provide the training set itself.
    source_ids: [mc-esmc-6b]
  training_recipe:
    status: partial
    note: >-
      The card describes two stages: 1 million steps at 512-token context with 64% metagenomic
      data, then 500,000 steps at 2,048-token context with 37.5% metagenomic data. Further details
      are in the preprint, which was not reviewed.
    source_ids: [mc-esmc-6b]
  evaluation_materials:
    status: unknown
    note: The card refers to the preprint for performance metrics; the preprint was not reviewed.
    source_ids: []
run_notes:
  - text: >-
      The card documents inference with Hugging Face Transformers (AutoModelForMaskedLM) and
      recommends a GPU; using the flash attention backend requires running the model in
      bfloat16. The context window is 2,048 tokens.
    source_ids: [mc-esmc-6b]
provenance:
  text: >-
    Trained on protein sequences from public databases (UniRef and MGnify) and the Joint Genome
    Institute. The 300M and 600M ESM C models are separate, smaller variants released alongside
    it.
  derived_from: []
  source_ids: [mc-esmc-6b, es-esmc-blog]
