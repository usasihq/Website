license_notes:
  text: >-
    The model card says the models are available under Apache 2.0 and OpenAI's gpt-oss
    usage policy. The USAGE_POLICY file shipped with the weights is a short statement
    asking users to comply with all applicable law; it adds no further listed
    restrictions.
  source_ids: [gpt-oss-model-card, hf-gpt-oss-20b-usage-policy]
checklist:
  weights:
    status: public
    note: MXFP4-quantized MoE weights plus an original-format checkpoint are in the Hugging Face repository.
    source_ids: [hf-gpt-oss-20b]
  inference_code:
    status: public
    note: The GitHub repository has reference PyTorch, Triton, and Metal implementations, tools, and a Responses API server.
    source_ids: [gh-gpt-oss]
  training_code:
    status: unknown
    note: The official repository covers inference, tools, and evaluation; no training code was found.
    source_ids: []
  training_data_information:
    status: partial
    note: >-
      The model card describes a text-only dataset of trillions of tokens focused on
      STEM, coding, and general knowledge, filtered for hazardous biosecurity content,
      with a June 2024 knowledge cutoff. The data itself is not released.
    source_ids: [gpt-oss-model-card]
  training_recipe:
    status: partial
    note: >-
      The model card documents architecture, tokenizer, training compute (almost 10x
      fewer H100-hours than the 2.1 million used for gpt-oss-120b), and post-training with
      chain-of-thought reinforcement learning at a high level, not in reproducible detail.
    source_ids: [gpt-oss-model-card]
  evaluation_materials:
    status: public
    note: The model card reports benchmark and safety results; the repository includes evaluation code adapted from simple-evals for running GPQA and HealthBench.
    source_ids: [gpt-oss-model-card, gh-gpt-oss-evals]
run_notes:
  - text: >-
      The model card documents running the model with Transformers, vLLM, Ollama, and LM
      Studio, and OpenAI's repository provides reference PyTorch, Triton, and Metal
      implementations.
    source_ids: [hf-gpt-oss-20b, gh-gpt-oss]
  - text: >-
      OpenAI states that with its MoE weights in MXFP4 precision (4.25 bits per
      parameter), gpt-oss-20b can run on systems with as little as 16GB of memory; the
      model card lists the checkpoint size as 12.8 GiB.
    source_ids: [gpt-oss-model-card, hf-gpt-oss-20b]
  - text: >-
      The model must be prompted with OpenAI's harmony response format; the model card
      says it will not work correctly otherwise.
    source_ids: [hf-gpt-oss-20b]
