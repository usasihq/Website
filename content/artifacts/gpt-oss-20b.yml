summary:
  text: >-
    gpt-oss-20b is the smaller gpt-oss model: a 24-layer mixture-of-experts transformer
    with 20.9B total and about 3.6B active parameters per token, using 32 experts with the
    top 4 selected per token. It is text-only, supports context up to 131,072 tokens, and
    ships with its MoE weights quantized to MXFP4.
  source_ids: [gpt-oss-model-card]
useful_for:
  text: >-
    Presented for lower-latency, local, or specialized use cases, including tool use and
    function calling; the model card says it can be fine-tuned on consumer hardware.
  source_ids: [hf-gpt-oss-20b]
