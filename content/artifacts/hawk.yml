provenance:
  text: >-
    Hawk is an original METR repository, not a fork. It depends on Inspect AI, the open-source
    evaluation framework created by the UK AI Security Institute, and can run scans with Inspect
    Scout, which is maintained in the meridianlabs-ai GitHub organization.
  derived_from:
    - name: Inspect AI (UK AI Security Institute)
      artifact_slug: null
      url: https://inspect.aisi.org.uk
      note: Evaluation framework Hawk runs; not a catalog member.
  source_ids: [ hawk-repo ]
