summary:
  text: >-
    Inspect-Hawk is METR's open-source platform for running Inspect AI evaluations on cloud
    infrastructure. Users define tasks, agents, and models in a YAML file; Hawk runs each
    evaluation in an isolated Kubernetes pod, manages model API credentials through a proxy,
    streams logs, stores results in a PostgreSQL warehouse, and serves a web interface for
    browsing them. It is built on Inspect AI, the evaluation framework created by the UK AI
    Security Institute.
  source_ids: [ hawk-repo, hawk-docs ]
  reviewed_at: 2026-10-02
useful_for:
  text: >-
    Teams that run model evaluations regularly and want to run grids of tasks, agents, and models
    on their own AWS deployment, control which users can run or view results for each model, and
    run Inspect Scout scans over transcripts from earlier runs.
  source_ids: [ hawk-repo ]
  reviewed_at: 2026-10-02
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Hawk is published in METR's GitHub organization, and its MIT license names METR as the 2026
    copyright holder. METR (Model Evaluation and Threat Research, Inc.) is listed in the IRS
    exempt-organization extract for California as a Section 501(c)(3) organization, and its staff
    work in Berkeley, California (see the METR record). Hawk builds on Inspect AI, which the
    README attributes to the UK AI Security Institute; that dependency is recorded as provenance
    and is not a catalog member.
  source_ids: [ hawk-repo, hawk-license, irs-eo-bmf-ca ]
  assessed_at: 2026-10-02
availability:
  status: public
  access_conditions: >-
    Source code is public on GitHub and the CLI is installed from PyPI. Running evaluations at
    scale requires deploying Hawk to the user's own AWS account (EKS, ECS Fargate, Aurora
    PostgreSQL, S3, and related services) and supplying model provider access.
  source_ids: [ hawk-repo, hawk-docs ]
  reviewed_at: 2026-10-02
licenses:
  - name: MIT License
    spdx: MIT
    url: https://github.com/METR/hawk/blob/main/LICENSE
    applies_to: code
    source_ids: [ hawk-license ]
    reviewed_at: 2026-10-02
license_notes:
  text: >-
    The MIT license covers Hawk's own code. It does not cover the evaluated models or the
    cloud services Hawk deploys to, which are used under their providers' terms.
  source_ids: [ hawk-license, hawk-repo ]
  reviewed_at: 2026-10-02
