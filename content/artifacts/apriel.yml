provenance:
  text: >-
    The Apriel-1.5-15b-Thinker report says the model started from Mistral AI's
    Pixtral-12B-Base-2409 (using a copy hosted by Unsloth) and was depth-upscaled from 40 to
    48 decoder layers before continued pretraining. Apriel-1.6-15b-Thinker builds on Apriel 1.5, and Super Apriel is
    distilled from Apriel 1.6.
