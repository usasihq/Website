summary:
  text: >-
    Apriel is ServiceNow's series of small open-weight language models, built by its SLAM
    (ServiceNow Language Models) lab. Apriel-5B was the first release. It was followed by
    15B-parameter reasoning models: Apriel-Nemotron-15b-Thinker, the multimodal
    Apriel-1.5-15b-Thinker, and Apriel-1.6-15b-Thinker (December 2025). In
    April 2026 ServiceNow released Super Apriel, a 15B model derived from Apriel 1.6 whose
    layers can switch between attention and linear-time mixers at inference time.
  source_ids: [apriel-5b-card, apriel-nemotron-card, apriel-1-5-card, apriel-1-6-blog, superapriel-paper, hf-servicenow-ai]
useful_for:
  text: >-
    ServiceNow describes the Apriel models as general-purpose instruction models for code
    assistance, multi-step reasoning, question answering, function calling, and agent use
    cases, and says they are not meant for safety-critical use without human oversight.
  source_ids: [apriel-1-6-card]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The Apriel models are developed and published by ServiceNow, Inc., a Delaware
    corporation headquartered in Santa Clara, California. Apriel 1.5 and later releases
    build on Pixtral-12B-Base-2409, a base model published by Mistral AI, so that base is not
    treated as ServiceNow-developed. Eligibility of each release is assessed on the release
    record.
  source_ids: [hf-servicenow-ai, now-10k-2025, apriel-1-5-paper]
