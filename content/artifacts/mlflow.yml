summary:
  text: >-
    MLflow is an open-source platform for managing machine learning and generative AI
    development. For LLM applications and agents it provides tracing and observability (with
    OpenTelemetry integration), evaluation, prompt management and optimization, and an AI
    Gateway; for model training it provides experiment tracking, model evaluation, a model
    registry, and deployment tools. Databricks created MLflow, which joined the Linux Foundation
    in June 2020.
  source_ids: [mlflow-readme, lf-mlflow-press]
useful_for:
  text: >-
    Tracking experiments and models, tracing and evaluating LLM and agent applications, and
    deploying models to targets such as Docker, Kubernetes, and cloud ML services. It can run
    locally, on-premises, or on managed services.
  source_ids: [mlflow-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    MLflow is governed as MLflow Project, a Series of LF Projects, LLC, under a technical charter
    adopted on June 2, 2020 that places technical oversight with a Technical Steering Committee;
    LF Projects, LLC is a Delaware series limited liability company. The Linux Foundation
    announced the project joining in June 2020 in a San Francisco-datelined release, and its
    privacy policy gives a San Francisco, California mailing address. The mlflow.org site footer
    names MLflow Project, a Series of LF Projects, LLC. The project was created by Databricks,
    whose 2018 copyright notice remains in the license file.
  source_ids: [mlflow-charter, mlflow-site, lf-mlflow-press, lf-privacy, mlflow-license]
  assessed_at: 2026-09-29
