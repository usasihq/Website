summary:
  text: >-
    Muse is a model family from Meta Superintelligence Labs, introduced with Muse Spark in April
    2026. Muse Spark versions are offered through Meta AI and the Meta Model API without public
    weights. Muse Glimmer, released in August 2026, is an open-weight model distilled from Muse
    Spark. Meta's developer site also lists Muse Image and Muse Voice Transcribe.
  source_ids: [muse-spark-announcement, muse-glimmer-model-card, meta-dev-site]
useful_for:
  text: >-
    Meta describes Muse Spark as a multimodal reasoning model with tool use and multi-agent
    orchestration, and Muse Glimmer as a model for local agentic and coding tasks on consumer
    hardware.
  source_ids: [muse-spark-blog, muse-glimmer-model-card]
