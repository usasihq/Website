license_notes:
  text: >-
    Neither version grants a single license for the data. The V2 card refers users to the Common
    Crawl Foundation Terms of Use for the data and applies Apache 2.0 to the code; the V1 card
    asks users to follow the license of each subset (for example, the GitHub subset was limited
    to MIT, BSD, and Apache-licensed projects).
  source_ids: [rpv2-card, rpv1-card]
