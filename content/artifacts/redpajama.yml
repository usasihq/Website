summary:
  text: >-
    RedPajama is Together AI's open pretraining dataset project. RedPajama-V1 (RedPajama-Data-1T,
    2023) is a 1.2-trillion-token reproduction of the LLaMA training-data recipe drawn from
    Common Crawl, C4, GitHub, arXiv, Wikipedia, and Stack Exchange. The current version,
    RedPajama-V2 (October 2023), contains over 100 billion documents from 84 Common Crawl
    snapshots in English, German, French, Spanish, and Italian, with more than 40 precomputed
    quality signals and duplicate markers; its deduplicated, annotated portion is about 30
    trillion tokens.
  source_ids: [rpv1-card, rpv2-card, rp-repo-readme, rpv2-blog, rp-paper]
useful_for:
  text: >-
    Building filtered pretraining mixes for large language models: users select documents by
    snapshot, language, and partition and apply the provided quality signals and duplicate IDs
    to create their own subsets.
  source_ids: [rpv2-card, rp-paper]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The datasets are published under Together's Hugging Face and GitHub organizations, and the
    dataset card's software citation names Together Computer as author. Together's terms of
    service identify Together Computer, Inc., a Delaware corporation, and give a San Francisco,
    California address for copyright notices. The V2 card also thanks the RedPajama-V1 partners (including
    Stanford research groups, Mila, Université de Montréal, ETH DS3Lab, LAION, and Ontocord.ai);
    Together remains the publishing and maintaining entity.
  source_ids: [rpv2-card, rp-repo-readme, together-tos]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Both versions are downloadable from Hugging Face without gating. The V2 card directs users
    to the Common Crawl Foundation Terms of Use for the data. In V1 the 'book' configuration is
    marked defunct and no longer accessible because of reported copyright infringement in its
    Books3 content.
  source_ids: [rpv2-card, rpv1-card]
