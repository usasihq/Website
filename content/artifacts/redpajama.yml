run_notes:
  - text: >-
      The V2 card notes that downloading a full snapshot for a given partition and language
      requires about 1 TB of disk space per snapshot, and provides a small 'sample'
      configuration for exploration.
    source_ids: [rpv2-card]
provenance:
  text: >-
    V2 was built from 84 Common Crawl snapshots processed with the CCNet pipeline into head,
    middle, and tail perplexity buckets; head and middle documents were annotated with quality
    signals and duplicates were marked with a Bloom filter rather than removed. V1 followed the
    LLaMA paper's data recipe using Common Crawl dumps processed with CCNet, C4, permissively
    licensed GitHub code, arXiv, Wikipedia, and Stack Exchange.
  derived_from:
    - name: Common Crawl
      artifact_slug: common-crawl-corpus
      url: https://commoncrawl.org/
      note: Sole source for V2 and the largest source for V1.
  source_ids: [rpv2-card, rpv1-card]
