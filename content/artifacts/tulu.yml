summary:
  text: >-
    Tülu is Ai2's line of instruction-following models together with the open post-training
    recipe used to produce them. Tülu 3 (November 2024) applied supervised fine-tuning, Direct
    Preference Optimization, and reinforcement learning with verifiable rewards (RLVR) to Meta's
    Llama 3.1 base models at 8B and 70B, followed by a 405B model in January 2025 and by Tülu
    3.1 8B, which changed only the final RL stage (from PPO to GRPO).
  source_ids: [ai2-tulu-page, tulu3-paper, ai2-tulu3-blog, ai2-tulu3-405b-blog, mc-tulu31-8b]
useful_for:
  text: >-
    Ai2 presents Tülu 3 as a documented, reproducible post-training package, releasing the
    models together with training data, code, and evaluation tools. The model card notes it
    is one step in the process of training fully open models such as OLMo.
  source_ids: [ai2-tulu-page, tulu3-paper, mc-tulu31-8b]
