provenance:
  text: >-
    The Tülu 3 models are post-trained from Meta's Llama 3.1 base models (8B, 70B, and 405B);
    the Tülu cards state that the size and composition of the Llama 3.1 pretraining corpus is
    unknown. Ai2 supplies the post-training data (the Tülu 3 SFT mixture, preference mixtures,
    and RLVR prompts), code, and recipe.
