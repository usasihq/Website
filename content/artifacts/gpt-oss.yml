summary:
  text: >-
    gpt-oss is OpenAI's series of open-weight, text-only reasoning models, released in
    August 2025 in two sizes: gpt-oss-120b and gpt-oss-20b. Both are mixture-of-experts
    transformers trained for OpenAI's harmony response format. OpenAI later published
    gpt-oss-safeguard models fine-tuned from them for safety classification.
  source_ids: [gpt-oss-model-card, gh-gpt-oss, hf-gpt-oss-safeguard-120b]
useful_for:
  text: >-
    The model card describes use in agentic workflows with instruction following, tool
    use such as web search and Python execution, adjustable reasoning effort, and
    structured outputs.
  source_ids: [gpt-oss-model-card]
