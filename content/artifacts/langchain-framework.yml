summary:
  text: >-
    LangChain is an open-source Python framework for building agents and LLM applications. It
    gives a standard interface across model providers and many third-party integrations. Its agent
    API is built on LangGraph, and a JavaScript/TypeScript version, LangChain.js, lives in a
    separate repository.
  source_ids: [langchain-readme, langchain-docs-overview]
useful_for:
  text: >-
    Building tool-using agents; switching between model providers through one interface; and
    connecting models to data sources, vector stores, and retrievers through integration packages.
  source_ids: [langchain-readme, langchain-docs-overview]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The repository sits in the langchain-ai GitHub organization, and its LICENSE file assigns
    copyright to LangChain, Inc. LangChain's about page lists LangChain among the open-source
    frameworks the company develops and says the company is headquartered in San Francisco. Its
    terms of service identify LangChain Inc. as a Delaware corporation. No foundation or
    multi-organization governance body is documented.
  source_ids: [langchain-license, langchain-about, langchain-tos]
  assessed_at: 2026-09-29
