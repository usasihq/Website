checklist:
  weights:
    status: public
    reviewed_at: 2026-10-18
    note: >-
      Bfloat16 safetensors shards with the adapters embedded are published in the Hugging Face
      repository.
    source_ids: [model-card, hf-api, hf-config]
  inference_code:
    status: public
    reviewed_at: 2026-10-18
    note: >-
      The model card documents inference with Hugging Face Transformers and vLLM through the
      open Granite Switch package, and the repository ships the chat template with the adapter
      activation logic.
    source_ids: [model-card, switch-readme]
  training_code:
    status: unknown
    note: >-
      The composition script that rebuilds this checkpoint from the base model and adapters is
      public, but this review did not assess training code for the base model, adapters, or
      speech model.
    source_ids: []
  training_data_information:
    status: unknown
    note: null
    source_ids: []
  training_recipe:
    status: unknown
    note: >-
      BUILD.md documents the composition (adapter ranks, alpha values, and target modules). The
      training procedures of the composed components were not assessed in this review.
    source_ids: []
  evaluation_materials:
    status: partial
    reviewed_at: 2026-10-18
    note: >-
      The model card reports results for the decision adapter on a public decision benchmark and
      describes the invocation recipe; no evaluation code or configurations were found for this
      release.
    source_ids: [model-card]
run_notes:
  - text: >-
      The model card lists Python 3.9 or later, PyTorch 2.11.0 or later, Transformers 5.16 to
      5.17.0, and optionally vLLM 0.26.0 up to (not including) 0.28.0, and documents serving the
      checkpoint with the vLLM OpenAI-compatible server.
    source_ids: [model-card]
    reviewed_at: 2026-10-18
  - text: >-
      The model card describes the base model as having 8 billion parameters and a context length
      of 131,072 tokens; config.json sets max_position_embeddings to 131,072. BUILD.md reports
      8,776,400,896 parameters after composing the base model with the two adapters.
    source_ids: [model-card, hf-config, build-md]
    reviewed_at: 2026-10-18
  - text: >-
      The speech-to-text cascade is English-only and returns lowercase, unpunctuated transcripts;
      the card notes the speech model and the language model are not jointly trained, so a
      mistranscription can change the response. The checkpoint's config.json leaves asr_model_id
      unset, which per the Granite Switch audio documentation selects
      ibm-granite/granite-speech-5.0-470m-turboctc and can be overridden.
    source_ids: [model-card, hf-config, audio-doc]
    reviewed_at: 2026-10-18
provenance:
  text: >-
    Composed by IBM, without joint training, from its own Granite 4.1 8B instruct model, the
    guardian-core aLoRA from IBM's Granite Guardian Library r1.0, the decision aLoRA from IBM's
    Granite Core Library r1.0, and IBM's Granite Speech 5.0 470M TurboCTC speech model. Granite
    4.1 8B is fine-tuned from IBM's Granite 4.1 8B Base.
  derived_from:
    - name: Granite 4.1 8B
      artifact_slug: null
      url: https://huggingface.co/ibm-granite/granite-4.1-8b
      note: IBM base language model; its card names the Granite Team, IBM as developer.
    - name: Granite Guardian Library r1.0 (guardian-core aLoRA)
      artifact_slug: null
      url: https://huggingface.co/ibm-granite/granitelib-guardian-r1.0
      note: IBM adapter library with adapters for Granite 4.0 and 4.1 models.
    - name: Granite Core Library r1.0 (decision aLoRA)
      artifact_slug: null
      url: https://huggingface.co/ibm-granite/granitelib-core-r1.0
      note: IBM adapter library with adapters for Granite 4.0 and 4.1 models.
    - name: Granite Speech 5.0 470M TurboCTC
      artifact_slug: null
      url: https://huggingface.co/ibm-granite/granite-speech-5.0-470m-turboctc
      note: >-
        IBM English speech-recognition model (conformer CTC encoder); its card says it was
        trained by IBM on public English audio corpora.
  source_ids: [model-card, build-md, base-model-card, guardian-lib-card, core-lib-card, speech-model-card]
