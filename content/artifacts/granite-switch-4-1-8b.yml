summary:
  text: >-
    Granite Switch 4.1 8B is a composed checkpoint from IBM that pairs the Granite 4.1 8B language
    model with two activated-LoRA adapters (a general decision adapter and a Guardian safety-risk
    detector) and a speech-to-text cascade, so chat, decision, safety-check, and transcription
    requests can be served from one endpoint. Adapters are switched on through control tokens in
    the chat template.
  source_ids: [model-card, launch-blog, build-md]
  reviewed_at: 2026-10-18
useful_for:
  text: >-
    The model card describes chat responses, multiple-choice decisions returned as probabilities
    over option labels, detection of safety risks such as harm or jailbreaking, and English
    speech transcription on the same endpoint.
  source_ids: [model-card]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Published by IBM's Granite organization on Hugging Face and announced on IBM's Granite blog.
    IBM's corporate address is in Armonk, New York, per its U.S. contact page. The base model,
    both adapters, and the speech model are IBM releases; no other developer's weights are
    included by default.
  source_ids: [model-card, launch-blog, base-model-card, speech-model-card, ibm-contact]
  assessed_at: 2026-10-18
availability:
  status: public
  reviewed_at: 2026-10-18
  access_conditions: >-
