license_notes:
  text: >-
    Per LICENSE_NOTICE, code committed before commit a76068d (January 10, 2025) is under the MIT
    License; code from that commit through commit 60d84a3 (April 18, 2025) is under the BSD
    3-Clause License; and code contributed or modified afterward is under the Open WebUI License.
    That license adds to the BSD terms a clause prohibiting removal or alteration of the "Open
    WebUI" branding except for deployments of up to 50 end users in a rolling 30-day period,
    with prior written permission, or under an enterprise license. The project's documentation
    says the license, in effect from v0.6.6, is not an OSI-approved open-source license.
    Contributors agree to a contributor license agreement.
  source_ids: [license-notice, license, license-history, license-docs, commit-mit-to-bsd, commit-branding]
  reviewed_at: 2026-10-01
checklist:
  source_code:
    status: public
    note: Public repository; current code is under the Open WebUI License (see license notes).
    source_ids: [readme, license]
    reviewed_at: 2026-10-01
  documentation:
    status: public
    note: Official documentation covers installation, features, enterprise licensing, and the license.
    source_ids: [docs, license-docs]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      The README documents installation with pip (Python 3.11) and with Docker, including images
      that bundle Ollama or enable CUDA; the docs also list uv and a desktop app, and the README
      mentions Docker Compose, Kustomize, and Helm.
    source_ids: [readme, docs]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: partial
    note: >-
      The docs list Docker images for linux/amd64 and Python 3.11 for pip and uv installs; CUDA
      images require the NVIDIA container toolkit on Linux or WSL. No complete operating-system
      support matrix was found in the pages reviewed.
    source_ids: [docs, readme]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Reviewed release v0.11.4, published September 21, 2026. This entry describes the project
      rather than one release.
    source_ids: [release]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The README documents an offline mode: setting HF_HUB_OFFLINE=1 prevents attempts to
      download models from the internet.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  - text: >-
      The README says Docker installs should mount the open-webui data volume so the database is
      not lost.
    source_ids: [readme]
    reviewed_at: 2026-10-01
