summary:
  text: >-
    Open WebUI is a self-hosted web interface for AI models that is built to run entirely
    offline. It connects to Ollama and OpenAI-compatible APIs and includes retrieval over local
    documents, role-based user and group permissions, plugins, and voice features.
  source_ids: [readme, docs]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Providing a browser-based chat interface, with multi-user access controls, in front of
    local models served by Ollama or other OpenAI-compatible servers on infrastructure you
    control.
  source_ids: [readme]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The LICENSE names Open WebUI Inc. as copyright holder, and the project's careers page
    identifies Open WebUI Inc. as the employer. The openwebui.com terms of service name Open
    WebUI, Inc. as the site's owner and give its contact address in San Francisco, California.
    The pages reviewed do not state where the company is incorporated or describe the address as
    a headquarters. Eligibility rests on this documented U.S. company, not on contributors.
  source_ids: [license, careers, terms]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code and container images are public. Under the current license, removing or
    altering Open WebUI branding is allowed only for deployments with no more than 50 end users
    in a rolling 30-day period, with written permission, or under an enterprise license.
  source_ids: [readme, license]
  reviewed_at: 2026-10-01
