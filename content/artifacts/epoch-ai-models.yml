    listed in the IRS exempt-organization extract for California as a Section 501(c)(3)
    organization (see the Epoch AI record).
  source_ids: [ epoch-ai-models-data, epoch-privacy, irs-eo-bmf-ca ]
  assessed_at: 2026-10-02
