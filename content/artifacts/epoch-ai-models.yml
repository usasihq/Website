checklist:
  access:
    status: public
    note: CSV downloads for each subset are linked from the dataset page.
    source_ids: [ epoch-ai-models-data ]
    reviewed_at: 2026-10-02
  provenance:
    status: partial
    note: >-
      Epoch says models were collected from literature reviews, Papers With Code, historical
      accounts, highly cited publications, conference proceedings, and suggestions from
      individuals. The documentation includes a section on how values such as training compute
      are estimated.
    source_ids: [ epoch-ai-models-data, epoch-ai-models-docs ]
    reviewed_at: 2026-10-02
  documentation:
    status: public
    note: >-
      A documentation page defines the subsets and covers records, field definitions, and
      estimation methods, and a changelog is published.
    source_ids: [ epoch-ai-models-docs ]
    reviewed_at: 2026-10-02
  licensing:
    status: public
    note: Creative Commons Attribution 4.0, stated on the dataset and documentation pages.
    source_ids: [ epoch-ai-models-data, epoch-ai-models-docs ]
    reviewed_at: 2026-10-02
  stated_limitations:
    status: partial
    note: >-
      The dataset page says the list of models is not exhaustive and that the explorer only shows
      models for which Epoch has estimates, which are limited by publicly available information.
    source_ids: [ epoch-ai-models-data ]
    reviewed_at: 2026-10-02
run_notes:
  - text: >-
      Epoch says the CSV files are updated daily and that major new models are generally added
      within two weeks of release. At review, the notable-models and all-models files were dated
      October 1, 2026.
    source_ids: [ epoch-ai-models-data, epoch-ai-models-docs ]
