summary:
  text: >-
    A public database of machine learning models maintained by Epoch AI, recording for each model
    estimates such as training compute, parameter count, training dataset size, training cost,
    training duration, and power draw. It is published as an interactive explorer and as CSV
    files covering notable models, large-scale models (trained with at least 10^23 FLOP),
    frontier models (top five in training compute when released), and all models.
  source_ids: [ epoch-ai-models-data, epoch-ai-models-docs ]
  reviewed_at: 2026-10-02
useful_for:
  text: >-
    Studying trends in the resources used to train machine learning models over time, such as
    growth in training compute or parameter counts, with citations to the sources behind each
    estimate.
  source_ids: [ epoch-ai-models-data ]
  reviewed_at: 2026-10-02
