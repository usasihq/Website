summary:
  text: >-
    Grok is xAI's family of large language models, first launched in November 2023 and
    offered mainly through the Grok assistant and the xAI API. xAI has published weights
    for two earlier models: Grok-1 in March 2024 and Grok 2 in August 2025. SpaceX's
    prospectus describes current Grok models as proprietary.
