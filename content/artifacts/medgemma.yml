summary:
  text: >-
    MedGemma is a collection of Gemma 3 variants trained by Google on medical text and images,
    published as part of Health AI Developer Foundations (HAI-DEF). MedGemma 1 was released in
    May 2025 (4B multimodal and 27B text-only) with a 27B multimodal variant in July 2025, and
    MedGemma 1.5 4B followed in January 2026.
  source_ids: [mg15-model-card, mg1-model-card, gemma-releases]
useful_for:
  text: >-
    Google describes MedGemma as a starting point for developers building healthcare AI
    applications that involve text generation, and states that developers are expected to
    validate and adapt it for their use case; it is not intended to directly inform clinical
    decisions.
  source_ids: [mg15-model-card, mg15-blog]
