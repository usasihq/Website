license_notes:
  text: >-
    The model cards state that use of MedGemma is governed by the Health AI Developer
    Foundations (HAI-DEF) Terms of Use. The HAI-DEF terms incorporate a prohibited use
    policy and restrict uses that could cause a health regulator to treat Google as a medical
    device manufacturer; HAI-DEF source code deliverables are licensed under Apache 2.0.
  source_ids: [haidef-terms, mg15-model-card]
