summary:
  text: >-
    Diffusers is Hugging Face's open-source PyTorch library for pretrained diffusion models that
    generate images, video, and audio. It is organized around the DiffusionPipeline API, with
    interchangeable noise schedulers and model components, and supports adapters such as LoRA.
    Version 0.40.0 (August 2026) removed JAX/Flax support.
  source_ids: [diffusers-repo, diffusers-docs, diffusers-readme, diffusers-release]
useful_for:
  text: >-
    Running inference with diffusion pipelines in a few lines of code, assembling custom
    diffusion systems from models and schedulers, and training or fine-tuning diffusion models.
    The documentation also describes memory-saving options such as offloading and quantization.
  source_ids: [diffusers-readme, diffusers-docs]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Diffusers is developed in Hugging Face's GitHub organization, and its README carries a
    HuggingFace Team copyright notice. Hugging Face's terms of service identify Hugging Face,
