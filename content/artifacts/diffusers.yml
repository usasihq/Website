    source_ids: [diffusers-release]
run_notes:
  - text: >-
      The installation guide states that Diffusers sends telemetry (library versions, the
      requested model or pipeline class, and the Hub checkpoint path) when loading from the Hub,
      not for local files, and that it can be turned off with HF_HUB_DISABLE_TELEMETRY=1. Offline
      use is possible with HF_HUB_OFFLINE=1 once files are cached.
    source_ids: [diffusers-install]
