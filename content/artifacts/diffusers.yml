    and its privacy policy states that the company and its servers are located in the United
    States (the French entity is named as its EU main establishment). See the hugging-face
    organization record for the full dual-country assessment.
  source_ids: [diffusers-repo, diffusers-readme, hf-tos, hf-privacy]
  assessed_at: 2026-09-29
