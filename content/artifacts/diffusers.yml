      The installation guide states Diffusers is tested with PyTorch 2.6+ and documents a setup
      for NVIDIA ARM64 devices; the README links a guide for Apple silicon. The v0.40.0 release
      notes describe tensor-parallel support for CUDA and AWS Neuron.
    source_ids: [diffusers-install, diffusers-readme, diffusers-release]
