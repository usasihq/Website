summary:
  text: Hermes Agent is an agent runtime from Nous Research with command-line and messaging
    interfaces, persistent memory, reusable skills, and scheduled tasks. It can connect to different
    model providers and local or remote execution backends. It is separate from the Hermes family of
    language models.
  source_ids:
    - repo
    - docs
  reviewed_at: 2026-10-01
useful_for:
  text: Building persistent assistants and tool-using workflows with configurable model providers,
    execution environments, and messaging channels.
  source_ids:
    - docs
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: Nous Research publishes and maintains Hermes Agent. Its official portal terms identify
    Nous Research, Inc. as a Delaware corporation, and its careers page documents New York office
    operations and Hermes Agent engineering roles. These sources establish U.S.-based project
    stewardship; they do not establish a headquarters address.
  source_ids:
