summary:
  text: >-
    d1 is Liquid AI's family of decision models. Instead of generating text, a d1 model takes a
    state (text, JSON, images, or for some checkpoints audio) and a set of named questions and
    returns typed answers (yes/no, a choice, or a score) in a single forward pass. Liquid AI
    released the first open-weight d1 models, d1-3B and the experimental d1-omni-600M, on
    October 7, 2026.
  reviewed_at: 2026-10-11
  source_ids: [d1-blog, mc-d1-3b]
useful_for:
  text: >-
    Pipeline steps that need a structured decision rather than generated text, such as routing
    and triage, moderation, classification, reranking, judge-style scoring, and agent guardrails,
    per the d1-3B model card.
  reviewed_at: 2026-10-11
