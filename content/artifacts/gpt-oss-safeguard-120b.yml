license_notes:
  text: >-
    The technical report says the models are available under Apache 2.0 and OpenAI's gpt-oss
    usage policy. The USAGE_POLICY file shipped with the weights asks users to comply with all
    applicable law and lists no further restrictions. The GitHub repository holds documentation
    and an example spam policy with a labeled sample set, not model code.
  source_ids: [ safeguard-tech-report, hf-safeguard-120b-usage-policy, gh-safeguard ]
  reviewed_at: 2026-10-01
checklist:
  weights:
    status: public
    note: Safetensors weights in the ungated Hugging Face repository.
    source_ids: [ hf-api-safeguard-120b ]
    reviewed_at: 2026-10-01
  inference_code:
    status: public
    note: >-
      The model card says the model is used like gpt-oss-120b, following the gpt-oss
      cookbooks. OpenAI's user guide documents running it with vLLM, Hugging Face Transformers,
      Ollama, and LM Studio.
    source_ids: [ hf-safeguard-120b, safeguard-guide ]
    reviewed_at: 2026-10-01
  training_code:
    status: unknown
    note: No training or fine-tuning code for gpt-oss-safeguard was found in the official repositories reviewed.
    source_ids: []
  training_data_information:
    status: unknown
    note: >-
      The technical report says the models are fine-tunes of gpt-oss trained without any
      additional biological or cybersecurity data. It does not otherwise describe the
      post-training data.
    source_ids: [ safeguard-tech-report ]
    reviewed_at: 2026-10-01
  training_recipe:
    status: unknown
    note: >-
      The report says the model was post-trained to reason from a provided policy but gives no
      further training details.
    source_ids: [ safeguard-tech-report ]
    reviewed_at: 2026-10-01
  evaluation_materials:
    status: partial
    note: >-
      The technical report gives results on internal multi-policy evaluations, OpenAI's 2022
      moderation set, ToxicChat, a multilingual benchmark, and chat-safety evaluations. The
      internal sets and evaluation code were not found to be published.
    source_ids: [ safeguard-tech-report ]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The model must be used with OpenAI's harmony response format; the model card says it will
      not work correctly otherwise.
    source_ids: [ hf-safeguard-120b ]
    reviewed_at: 2026-10-01
  - text: >-
      OpenAI's user guide places the policy in the system message, where the reasoning effort
      (low, medium, or high) is also set. It suggests policies of about 400 to 600 tokens and
      notes small but meaningful accuracy losses as more policies are added.
    source_ids: [ safeguard-guide ]
    reviewed_at: 2026-10-01
  - text: >-
      The technical report notes that dedicated classifiers trained on large labeled sets can
      still outperform the model, and that it can be time- and compute-intensive to run across
      all platform content.
    source_ids: [ safeguard-tech-report ]
    reviewed_at: 2026-10-01
provenance:
  text: Fine-tuned by OpenAI from its gpt-oss-120b open-weight model.
  derived_from:
