summary:
  text: >-
    gpt-oss-safeguard-120b is the larger gpt-oss-safeguard model, a text-only safety reasoning
    model fine-tuned from gpt-oss-120b. The model card gives 117B total parameters with 5.1B
    active. Its configuration lists 36 layers, 128 experts with 4 used per token, and a
    maximum of 131,072 position embeddings. The mixture-of-experts weights are quantized to
    MXFP4; attention, router, embedding, and output layers are not.
  source_ids: [ hf-safeguard-120b, hf-safeguard-120b-config, safeguard-tech-report ]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Classifying text against a safety policy written by the user, for example for filtering LLM
    inputs and outputs or labeling content, with the model's reasoning visible to developers.
    OpenAI's README presents the 120b size for production, general-purpose, high-reasoning use.
  source_ids: [ hf-safeguard-120b, gh-safeguard ]
  reviewed_at: 2026-10-01
