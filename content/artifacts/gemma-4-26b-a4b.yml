checklist:
  weights:
    status: public
    note: Pre-trained and instruction-tuned checkpoints are published in safetensors format on Hugging Face.
    source_ids: [hf-card-26b-a4b-it, hf-api-26b-a4b-it, hf-api-26b-a4b]
  inference_code:
    status: public
    note: >-
      The model card documents inference with Hugging Face Transformers; Google DeepMind's
      Apache-2.0 gemma JAX library also supports Gemma 4.
    source_ids: [hf-card-26b-a4b-it, gemma-jax-repo]
  training_code:
    status: unknown
    note: >-
      The gemma JAX library includes fine-tuning code. This catalog did not find published code
      used to pre-train Gemma 4.
    source_ids: [gemma-jax-repo]
  training_data_information:
    status: partial
    note: >-
      The model card and technical report describe the data types (web documents, code,
      mathematics, images) and a January 2025 cutoff; the data itself is not released.
    source_ids: [hf-card-26b-a4b-it, gemma-4-tech-report]
  training_recipe:
    status: partial
    note: >-
      The technical report describes the architecture, compute setup (TPUv4 and TPUv6e, JAX,
      Pathways), and data filtering, and says pre-training and post-training follow the Gemma 3
      approach; it is not a complete recipe.
    source_ids: [gemma-4-tech-report]
  evaluation_materials:
    status: partial
    note: Benchmark results for the instruction-tuned models are reported in the model card and technical report.
    source_ids: [hf-card-26b-a4b-it, gemma-4-tech-report]
run_notes:
  - text: >-
      The model card shows loading the model with Hugging Face Transformers
      (AutoModelForMultimodalLM) and recommends sampling with temperature 1.0, top_p 0.95, and
      top_k 64.
    source_ids: [hf-card-26b-a4b-it]
