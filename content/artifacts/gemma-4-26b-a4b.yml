summary:
  text: >-
    Gemma 4 26B A4B is the mixture-of-experts model in the Gemma 4 generation, with 25.2 billion
    total and 3.8 billion active parameters (8 of 128 experts active, plus one shared expert). It
    accepts text and image input, can process video as frames, and generates text, with a
    256K-token context window. Google's release page dates the initial Gemma 4 release, which
    included this size, to March 31, 2026.
  source_ids: [hf-card-26b-a4b-it, gemma-4-model-card, gemma-releases]
useful_for:
  text: >-
    The model card lists text generation, chatbots, summarization, image data extraction, NLP and
    vision-language research, and language-learning tools among intended uses, and documents a
    configurable thinking mode and native function calling.
  source_ids: [hf-card-26b-a4b-it]
