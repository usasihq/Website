checklist:
  source_code:
    status: public
    note: Public GitHub repository under the Apache License 2.0.
    source_ids: [prime-rl-readme, prime-rl-license]
  documentation:
    status: public
    note: >-
      The repository's docs directory covers architecture, configuration, training, evaluation,
      scaling, algorithms, and development, and Prime Intellect's documentation site has a
      prime-rl section.
    source_ids: [prime-rl-readme, prime-docs]
  training_code:
    status: public
    note: Includes trainers for SFT and RL plus evaluation tooling, with optimized training code for selected model families.
    source_ids: [prime-rl-readme]
  data_information:
    status: public
    note: >-
      The README describes training on verifiers environments, installed from the Environments
      Hub or as opt-in workspace packages, and walks through example tasks such as text
      reversal, Wordle, and Wikipedia search.
    source_ids: [prime-rl-readme]
  reproducibility_instructions:
    status: partial
    note: >-
      The README gives setup checks and end-to-end example runs, from small single-GPU tasks to
      Slurm-based training of larger models. A step-by-step reproduction of the INTELLECT-3 run
      was not found in the repository.
    source_ids: [prime-rl-readme]
run_notes:
  - text: >-
      The README states that at least one NVIDIA GPU is required, that the project is developed
      and tested on NVIDIA RTX 3090/4090/5090, A100, H100, H200, and B200 GPUs, and that setup
      uses uv with Python 3.12.
    source_ids: [prime-rl-readme]
