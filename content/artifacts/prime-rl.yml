summary:
  text: >-
    prime-rl is Prime Intellect's open-source framework for large-scale, asynchronous
    reinforcement learning and supervised fine-tuning of language models. It separates an
    FSDP2-based trainer, a vLLM inference service, and an orchestrator that gathers rollouts from
    verifiers environments, and it supports multi-node deployment on Slurm and Kubernetes.
  source_ids: [prime-rl-readme, i3-report-pdf]
useful_for:
  text: >-
    Post-training language models, including large mixture-of-experts models, with SFT, RL, and
    evaluations, from a single GPU up to large clusters. Prime Intellect used it to train
    INTELLECT-2 and INTELLECT-3.
  source_ids: [prime-rl-readme, mc-intellect-2, i3-report-pdf]
