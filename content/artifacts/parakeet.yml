summary:
  text: >-
    Parakeet is NVIDIA's family of automatic speech recognition models built on the FastConformer
    encoder in the NeMo toolkit, released with CTC, RNN-T, TDT, and hybrid TDT-CTC decoders. The
    first checkpoints were published on Hugging Face in December 2023; the card for one of them,
    parakeet-rnnt-1.1b, says it was developed jointly by the NVIDIA NeMo and Suno.ai teams.
    Later releases include the English parakeet-tdt-0.6b-v2 (April
    2025), the 25-language parakeet-tdt-0.6b-v3 (August 2025), and parakeet-unified-en-0.6b
    (April 2026), which handles offline and streaming transcription in one model; there are also
    language-specific checkpoints such as Japanese, Danish, and Vietnamese.
  source_ids: [hf-parakeet-listing, rnnt-1-1b-card, v3-card, unified-card, nemo-speech-readme]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Transcribing speech to text in batch or streaming settings, with punctuation,
    capitalization, and timestamps in recent releases, for uses the cards list such as voice
    assistants, transcription and captioning services, and voice analytics.
  source_ids: [v3-card, unified-card]
  reviewed_at: 2026-10-01
