  basis: us-headquarters
  explanation: >-
    The Parakeet checkpoints are published in NVIDIA's Hugging Face organization and announced in
    NVIDIA's NeMo Speech repository, and the cards describe training with NVIDIA's NeMo toolkit.
    NVIDIA's principal executive offices are in Santa Clara, California, per its Form 10-Q for
    the quarter ended July 26, 2026. The parakeet-rnnt-1.1b card says that early checkpoint was
    developed jointly with the Suno.ai team.
