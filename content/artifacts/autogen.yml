summary:
  text: >-
    AutoGen is Microsoft's open-source Python framework for building multi-agent AI applications
    that act autonomously or alongside people. It comprises an event-driven Core, the
    higher-level AgentChat API, Extensions for external services such as MCP servers and code
    execution, and the no-code AutoGen Studio. The project is now in maintenance mode, and
    Microsoft directs new users to its successor, Microsoft Agent Framework.
  source_ids: [autogen-readme, autogen-docs]
useful_for:
  text: >-
    Prototyping and running conversational single- and multi-agent applications that call
    language models and tools. New users are advised to start with Microsoft Agent Framework
    instead.
  source_ids: [autogen-docs, autogen-readme]
