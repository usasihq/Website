license_notes:
  text: >-
    The Apache 2.0 license applies to the CLI's code. It does not cover the Google services the CLI
    connects to; the documentation lists separate terms of service and privacy notices that differ
    by authentication method.
  source_ids: [license, tos-privacy]
  reviewed_at: 2026-10-01
