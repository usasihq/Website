  release_status:
    status: public
    note: >-
      Reviewed v0.62.0, marked Latest and published September 29, 2026. The README describes weekly
      stable and preview releases and daily nightly releases. This entry describes the project
      rather than one release.
    source_ids: [release, repo]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The installation guide lists Node.js 20.0.0 or newer and an internet connection as
      requirements. The documentation reviewed (README, installation guide, terms page, and FAQ)
      describes only Google-hosted model access and does not document local model providers.
    source_ids: [install, repo, tos-privacy, faq]
    reviewed_at: 2026-10-01
