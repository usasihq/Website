summary:
  text: >-
    Gemini CLI is an open-source AI agent from Google that runs in a terminal and uses Google's
    Gemini models. It has built-in tools for file operations, shell commands, web fetching, and
    Google Search grounding, supports MCP servers and extensions, and can run non-interactively in
    scripts.
  source_ids: [repo]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Querying and editing codebases, automating operational tasks, and scripted or CI use from a
    terminal. Gemini CLI is open-source client code: the Gemini models it calls are hosted by Google
    and are not open, and use requires signing in with a Google account, a Gemini API key, or
    Vertex AI.
  source_ids: [repo, tos-privacy]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Gemini CLI is developed in the google-gemini GitHub organization and distributed on npm as
    @google/gemini-cli. Its README says it is built by Google and the open source community, and
    its contributing guide requires contributors to sign Google's Contributor License Agreement.
    Google's terms of service identify Google LLC, organized under the laws of Delaware, at 1600
    Amphitheatre Parkway, Mountain View, California. See the google organization record.
  source_ids: [repo, contributing, google-terms]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code is public. Use requires an internet connection and authentication with a Google
    account, a Gemini API key, or Vertex AI; each path is governed by its own Google terms and
    privacy notice. The Gemini models themselves are not open.
  source_ids: [repo, install, tos-privacy]
  reviewed_at: 2026-10-01
licenses:
