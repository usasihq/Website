    source_ids: [repo, install]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      The installation guide's recommended specifications list macOS 15 or later, Windows 11 24H2
      or later, and Ubuntu 20.04 or later, with Node.js 20 or newer and a Bash, Zsh, or PowerShell
      shell.
    source_ids: [install]
