summary:
  text: >-
    llama.cpp is a C/C++ library and set of tools for running LLM and vision-language model
    inference locally or in the cloud, built on the ggml tensor library. It supports integer
    quantization and many hardware backends. It includes a command-line interface and an
    OpenAI-compatible server.
  source_ids: [llamacpp-readme]
useful_for:
  text: >-
    Running quantized models on local hardware, including CPU-only systems, Apple silicon, and a
    range of GPUs.
  source_ids: [llamacpp-readme, llama-app]
eligibility:
  status: pending_review
  basis: undetermined
  explanation: >-
    Governance is unresolved. In February 2026 the ggml team announced that it was joining
    Hugging Face, and ggml.ai says the company was acquired by Hugging Face in 2026. The same
    announcements say the ggml-org projects remain community driven. They also say the community
    will keep operating autonomously and making its own technical decisions, with Hugging Face
    providing resources. No governance document names Hugging Face (or another U.S. entity) as
    the governing or maintaining organization of llama.cpp. The sources reviewed do not state
    where ggml.ai was based. Hugging Face's own ownership may also change: on September 3, 2026
    NVIDIA announced that it has agreed to acquire Hugging Face. Eligibility is not inferred from
    the corporate affiliation of maintainers.
  source_ids: [ggml-hf-discussion, hf-ggml-blog, ggml-ai-site, nvidia-hf-blog]
  assessed_at: 2026-09-29
