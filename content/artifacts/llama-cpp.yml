summary:
  text: >-
    llama.cpp is a C/C++ library and set of tools for running LLM and vision-language model
    inference locally or in the cloud, built on the ggml tensor library. It supports integer
    quantization and many hardware backends. It includes a command-line interface and an
    OpenAI-compatible server.
  source_ids: [llamacpp-readme]
useful_for:
  text: >-
    Running quantized models on local hardware, including CPU-only systems, Apple silicon, and a
    range of GPUs.
  source_ids: [llamacpp-readme, llama-app]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    ggml.ai, the company Georgi Gerganov founded in 2023 to support ggml development, says it was
    acquired by Hugging Face in 2026. Hugging Face's February 20, 2026 announcement says the ggml team
    joined Hugging Face, dedicates all of its time to maintaining llama.cpp, and keeps leadership of the
    project's technical direction, while the project stays open source and community driven. The
    documented maintaining entity is therefore the ggml team within Hugging Face, a U.S. company in this
    catalog. NVIDIA's pending agreement to acquire Hugging Face would not change the U.S. basis.
    Eligibility rests on this documented ownership and maintenance, not on contributors' nationality.
  source_ids: [hf-ggml-blog, ggml-ai-site, ggml-hf-discussion, nvidia-hf-blog]
  assessed_at: 2026-10-01
