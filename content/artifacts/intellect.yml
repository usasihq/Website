summary:
  text: >-
    INTELLECT is Prime Intellect's series of open-weight models. INTELLECT-1 is a 10B model
    trained from scratch on 1 trillion tokens with compute from distributed community
    contributors; INTELLECT-2 is a 32B model produced by a distributed reinforcement-learning run
    on QwQ-32B; INTELLECT-3 (November 2025) is a 106B mixture-of-experts model (12B active)
    post-trained from GLM-4.5-Air-Base with supervised fine-tuning and large-scale RL; and
    INTELLECT-3.1 continues INTELLECT-3 with further RL.
  source_ids: [mc-intellect-1, mc-intellect-2, mc-intellect-3, mc-intellect-3-1, i3-blog]
useful_for:
  text: >-
    The recent INTELLECT models are reasoning models aimed at math, code, science, and agentic
    tasks such as tool use and software engineering, and Prime Intellect uses them to
    demonstrate its open training stack (prime-rl, verifiers, and the Environments Hub).
  source_ids: [i3-blog, i3-report-arxiv, mc-intellect-3-1]
