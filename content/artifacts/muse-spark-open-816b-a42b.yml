license_notes:
  text: >-
    Custom Meta license (card license field "other", license_name "muse-model-license"). The
    LICENSE.md file is behind the access gate and was not fetched; the terms here are from the
    license text Meta publishes in the repository's gating prompt, dated October 15, 2026. It
    covers the model, code, weights, configuration, and documentation and grants broad rights to
    use, modify, fine-tune, distill, distribute, and sell, subject to conditions: copies must
    include the license and the incorporated Usage Policy (Exhibit A), and products using the
    model or its derivatives must prominently display "Built with Muse Spark Open". A licensee
    offering models to third parties as an API service, whose group gross revenue exceeds US$20
    million in any 12-month period, must notify Meta and sign a separate agreement first; internal
    use, research, and use inside the licensee's own non-API products are exempt. Meta claims no
    ownership of outputs. The Usage Policy prohibits uses including military and weapons
    applications, and the model is not intended for people under 18.
  source_ids: [muse-spark-open-hf-api, muse-spark-open-card]
checklist:
  weights:
    status: partial
    reviewed_at: 2026-10-18
    note: >-
      BF16 weights (Muse-Spark-Open-816B-A42B) and an NVFP4 checkpoint
      (Muse-Spark-Open-816B-A42B-NVFP4) are on Hugging Face behind a manually approved access
      gate.
    source_ids: [muse-spark-open-hf-api, muse-spark-open-collection, muse-spark-open-card]
  inference_code:
    status: public
    reviewed_at: 2026-10-18
    note: >-
      The model card lists support in SGLang, vLLM, Hugging Face Transformers, TensorRT-LLM,
      Unsloth, llama.cpp, and MLX, and Meta's developer blog gives serving commands for several
      of them. No separate Meta reference inference repository was found.
    source_ids: [muse-spark-open-card, muse-spark-open-dev-blog]
  training_code:
    status: unknown
    note: >-
      Meta points to fine-tuning and reinforcement-learning tooling (including TorchTitan and
      Hugging Face TRL); no code used to train this model was found.
    source_ids: []
  training_data_information:
    status: partial
    reviewed_at: 2026-10-18
    note: >-
      The model card describes text, image, audio, and video data from public sources, web
      crawls, third parties, Meta products and services, and synthetic generation, cleaned,
      deduplicated, and filtered, covering more than 100 languages. No dataset listing is given.
    source_ids: [muse-spark-open-card]
  training_data_access:
    status: unknown
    note: null
    source_ids: []
  training_pipeline:
    status: unknown
    note: null
    source_ids: []
  training_recipe:
    status: unknown
    note: >-
      The sources say only that this version shares its base model with Muse Spark 1.3 and has
      additional safety post-training; no recipe details were found.
    source_ids: []
  evaluation_materials:
    status: partial
    reviewed_at: 2026-10-18
    note: >-
      The model card reports benchmark and safety evaluation results and links an evaluation
      methodology report, which was not reviewed here. Evaluation code was not located.
    source_ids: [muse-spark-open-card]
run_notes:
  - text: >-
      The model card states that running the model locally requires at least 700GB of GPU memory
      for the NVFP4 checkpoint and 2TB for BF16, plus a supported inference framework. Meta's
      developer blog says MLX can serve the NVFP4 checkpoint across two Mac Studios with M5 Ultra
      and 512GB of unified memory each, or four with 256GB each.
    source_ids: [muse-spark-open-card, muse-spark-open-dev-blog]
  - text: >-
      The model card recommends temperature 1.0, top_p 1.0, and top_k disabled, and documents a
      reasoning_effort setting (low, medium, high, or xhigh; default xhigh).
    source_ids: [muse-spark-open-card]
provenance:
  text: >-
    Meta's PyTorch team says Muse Spark Open shares its base model with Muse Spark 1.3, a Meta
    model offered without public weights; the model card says the open version adds safety
    post-training.
  derived_from:
    - name: Muse Spark 1.3
      artifact_slug: null
      url: null
      note: Same organization; shared base model, weights not public.
  source_ids: [pytorch-muse-spark-open, muse-spark-open-card]
