summary:
  text: >-
    Muse Spark Open is the open-weight version of Meta's Muse Spark, released on October 15,
    2026. The model card describes a mixture-of-experts transformer with 816B total and 42B active
    parameters (256 experts, 8 active per token, 62 layers) plus a 1.8B-parameter perception
    encoder. It accepts text, image, video, and audio input, produces text, and supports a 1M-token
    context at inference. Meta says this version received additional safety post-training for use
    as a standalone model.
  source_ids: [muse-spark-open-card, muse-spark-open-dev-blog]
useful_for:
  text: >-
    The model card lists long-horizon reasoning, agentic task completion, coding agents, tool use,
    multimodal reasoning over screenshots, documents, images, audio, and video, synthetic data
    generation, and LLM-as-a-judge evaluation. Meta recommends deploying it inside a larger system
    with guardrails suited to the use case.
  source_ids: [muse-spark-open-card]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model card names Meta Superintelligence Labs as author and Meta Platforms, Inc. or Meta
    Platforms Ireland Limited as model provider; the license names Meta Platforms, Inc. as
    copyright holder. Meta Platforms, Inc. is a Delaware company whose principal executive offices
    are in Menlo Park, California, per its Form 10-K. The Irish entity acts as licensor only for
    licensees in the European region.
  source_ids: [muse-spark-open-card, muse-spark-open-hf-api, meta-10k-2025]
  assessed_at: 2026-10-18
availability:
  status: partial
  reviewed_at: 2026-10-18
  access_conditions: >-
    The Hugging Face repositories are gated with manual approval: downloading requires accepting
    the Muse Model License and submitting a form asking for name, date of birth, country,
    affiliation, and job title. The model card says the model is also offered through third-party
    inference providers.
  source_ids: [muse-spark-open-hf-api, muse-spark-open-collection, muse-spark-open-card]
