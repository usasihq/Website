summary:
  text: >-
    Trinity-Large-Thinking is a reasoning-tuned sparse mixture-of-experts model with
    about 398B total and 13B active parameters per token and a 512k-token context
    window. It was post-trained from Trinity-Large-Base with chain-of-thought and
    agentic reinforcement learning, and writes its reasoning in think blocks before
    answering.
  source_ids: [hf-trinity-large-thinking]
useful_for:
  text: >-
    The model card documents it for tool calling, multi-step planning, and use as
    the model behind agent frameworks, and notes that reasoning content must be kept
    in the conversation history across turns.
  source_ids: [hf-trinity-large-thinking]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Developed and published by Arcee AI, Inc., a U.S. company with a documented San
    Francisco base (see the arcee-ai record). It is post-trained from Arcee's own
    Trinity-Large-Base checkpoint.
  source_ids: [hf-trinity-large-thinking, arcee-trinity-manifesto]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: Weights download from Hugging Face without an access gate. Also served through Arcee's paid API and OpenRouter.
  source_ids: [hf-trinity-large-thinking, arcee-tlt-blog]
