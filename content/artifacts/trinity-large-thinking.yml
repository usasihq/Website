license_notes:
  text: >-
    Arcee announced this release on 2026-04-01 under Apache 2.0. On 2026-05-28 the
    Hugging Face repository changed its license to OpenMDW-1.1, and Arcee states it
    moved earlier Trinity releases to that license. OpenMDW-1.1 grants broad use
    rights and places no restrictions on outputs. It requires keeping the license
    and notices when redistributing, and ends the rights of anyone who sues claiming
    the materials infringe a patent or copyright.
  source_ids: [arcee-tlt-blog, tlt-commit-history, arcee-openmdw-blog, tlt-license-file]
checklist:
  weights:
    status: public
    note: Weights are in the ungated Hugging Face repository; Arcee also publishes GGUF, FP8, NVFP4, and W4A16 variants as separate repositories.
    source_ids: [hf-trinity-large-thinking, hf-arcee-trinity-listing]
  inference_code:
    status: public
    note: The repository includes modeling code (modeling_afmoe.py), and the model card documents running it with vLLM and Transformers.
    source_ids: [hf-trinity-large-thinking, tlt-repo-files]
  training_code:
    status: unknown
    note: The technical report says training used a modified version of TorchTitan but does not link a release.
    source_ids: [trinity-tech-report]
  legacy_training_data_information:
    status: partial
    note: The technical report describes the pretraining mix (curated web, synthetic, multilingual, and code data). No public release of the data itself was found.
    source_ids: [trinity-tech-report]
  training_recipe:
    status: partial
    note: Pretraining settings are documented in the technical report. The post-training for this variant is described only briefly on the model card.
    source_ids: [trinity-tech-report, hf-trinity-large-thinking]
  evaluation_materials:
    status: partial
    note: Benchmark results are published on the model card; evaluation code is not linked.
    source_ids: [hf-trinity-large-thinking]
run_notes:
  - text: >-
      The model card documents serving with vLLM 0.11.1 or later, using the
      deepseek_r1 reasoning parser and qwen3_coder tool-call parser, and running with
      Transformers from the main branch or with trust_remote_code enabled.
    source_ids: [hf-trinity-large-thinking]
provenance:
  text: >-
    Post-trained from Trinity-Large-Base, Arcee's own 17-trillion-token pretrained
    checkpoint. The model card names Datology as data partner and Prime Intellect as
    compute partner.
  derived_from:
    - name: Trinity-Large-Base
      artifact_slug: null
      url: https://huggingface.co/arcee-ai/Trinity-Large-Base
      note: Same organization; pretrained foundation checkpoint.
  source_ids: [hf-trinity-large-thinking]
