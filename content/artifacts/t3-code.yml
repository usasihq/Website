summary:
  text: >-
    T3 Code is an open-source app for running and controlling coding agents. A local server
    starts sessions in agent tools the user has already installed and signed in to, including
    Claude Code, Codex, Cursor, Grok Build, OpenCode, and Google Antigravity, and the user works
    with them from a desktop app, a web app, or iOS and Android apps, including from another
    machine or a phone.
  source_ids: [repo, install-docs, remote-docs, site]
  reviewed_at: 2026-10-18
useful_for:
  text: >-
    Working with several coding agents from one interface, including handing tasks from one agent
    to another and following their progress remotely. T3 Code is client and server code: the
    agents and the hosted models behind them are separate products with their own subscriptions
    and terms, and T3 Code does not include model weights.
  source_ids: [repo, release, remote-docs, terms]
  reviewed_at: 2026-10-18
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    T3 Code is developed in the Ping.gg GitHub organization, whose listed location is the United
    States. The MIT LICENSE assigns copyright to T3 Tools Inc., and the contributing guide says the
    maintainers are not actively seeking outside contributions and that features need prior
    maintainer approval. The T3 Code terms of service name T3 Tools, Inc. as the provider of T3
    Code, apply California law, and give a San Francisco, California address in the United States;
    the privacy policy says the services are provided from the United States. No foundation or
    multi-organization governance is documented. See the ping-labs organization record.
  source_ids: [repo-api, github-org, license, contributing, terms, privacy]
  assessed_at: 2026-10-18
availability:
  status: public
  access_conditions: >-
    Source code and release builds are public. At least one supported agent tool must be installed
    and signed in, under that provider's own account and terms. Local and direct connections work
    without a T3 account; the optional T3 Connect service requires a T3 account. T3 Code sends
    anonymous usage data by default, which can be turned off with an environment variable.
  source_ids: [repo, install-docs, privacy, terms]
  reviewed_at: 2026-10-18
licenses:
  - name: MIT License
    spdx: MIT
    url: https://github.com/pingdotgg/t3code/blob/main/LICENSE
    applies_to: code
    source_ids: [license, repo-api]
    reviewed_at: 2026-10-18
license_notes:
  text: >-
    The MIT license (copyright 2026 T3 Tools Inc.) applies to the code in the pingdotgg/t3code
    repository. The terms of service say portions of T3 Code are available as open-source software
    under their repository licenses, while the terms govern the hosted app at app.t3.codes and the
    T3 Connect service, and T3 Tools' trademarks may not be used without permission. Neither covers the third-party agents or models that T3 Code
    controls.
  source_ids: [license, terms]
  reviewed_at: 2026-10-18
checklist:
  source_code:
    status: public
    note: >-
      Public monorepo with the desktop, web, server, mobile, and marketing apps. It contains agent
      orchestration code, not model weights. The contributing guide says outside contributions are
      not actively sought.
    source_ids: [repo, repo-api, contributing]
    reviewed_at: 2026-10-18
  documentation:
    status: public
    note: >-
      User and internals documentation is kept in the repository's docs folder; the README says
      there is no separate documentation site yet.
    source_ids: [repo, install-docs]
    reviewed_at: 2026-10-18
  installation:
    status: public
    note: >-
      The install guide documents a shell or PowerShell install script for the t3 command, a
      one-off npx run, desktop builds from GitHub Releases, winget, scoop, Homebrew, a .deb package,
      the AUR, and the App Store and Google Play mobile apps.
    source_ids: [install-docs, repo]
    reviewed_at: 2026-10-18
  supported_platforms:
    status: public
    note: >-
      Release v0.1.0 includes desktop builds for macOS (Apple Silicon and Intel), Windows (x64 and
      arm64), and Linux (x64 and arm64 AppImage and .deb). The install guide says there is no t3
      command-line executable for Intel Macs, documents running agents inside Windows Subsystem
      for Linux, and lists iOS and Android apps that connect to a server on another machine.
    source_ids: [release, install-docs]
    reviewed_at: 2026-10-18
  release_status:
    status: public
    note: >-
      Reviewed v0.1.0, the latest stable release, published October 15, 2026. The repository also
      publishes nightly and preview pre-releases. The README says the project is very early and to
      expect bugs, and the terms describe it as an early-stage product with beta features. This
      entry describes the project rather than one release.
    source_ids: [release, repo, terms]
    reviewed_at: 2026-10-18
run_notes:
  - text: >-
      The install guide says the t3 command starts a local server and opens the web app, t3 serve
      starts the server without a browser, and t3 service install keeps it running in the
      background on macOS and Linux.
    source_ids: [install-docs]
    reviewed_at: 2026-10-18
  - text: >-
      Remote devices can connect over the local network, Tailscale, another VPN, a public URL, SSH,
      or T3 Connect, using a one-time pairing link or a T3 Connect sign-in.
    source_ids: [remote-docs]
    reviewed_at: 2026-10-18
