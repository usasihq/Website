summary:
  text: >-
    Contextual AI's reranker models score how relevant retrieved documents are to a query and
    can follow a natural-language instruction about how to rank them, for example to prefer
    recent sources. Reranker v2, released in August 2025, comes in 1B, 2B, and 6B sizes with
    quantized versions, supports more than 100 languages and inputs of up to 32K tokens, and is
    published as open weights for noncommercial use; managed versions are served through
    Contextual AI's Rerank API.
  source_ids: [ ctx-rerank-v2-blog, ctx-rerank-v2-2b-card, ctx-component-apis ]
  reviewed_at: 2026-10-02
useful_for:
  text: >-
    Re-ranking documents in retrieval-augmented generation and search pipelines, including
    multilingual collections and cases with conflicting or time-sensitive information.
  source_ids: [ ctx-rerank-v2-2b-card ]
