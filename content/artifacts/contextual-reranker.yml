provenance:
  text: >-
    Neither the v2 model cards nor the announcement name the checkpoint the rerankers were
    trained from. The published model configuration declares the Qwen3ForCausalLM architecture
    (model type qwen3), the architecture of Alibaba Cloud's Qwen3 models; this catalog does not
    infer from that alone which weights, if any, the rerankers derive from.
