summary:
  text: >-
    The largest V-JEPA 2.1 model, a 2-billion-parameter ViT-G/16 video and image encoder released
    by Meta in March 2026. V-JEPA 2.1 changes the V-JEPA 2 recipe to learn dense, temporally
    consistent features, using a dense predictive loss over all tokens, self-supervision at
    several intermediate layers, and separate tokenizers for images and videos. Meta distilled
    this model into smaller ViT-B and ViT-L variants.
  source_ids: [vjepa2-readme, vjepa21-paper-html]
useful_for:
  text: >-
    Dense and global visual features for tasks the paper evaluates, including depth estimation,
    action recognition and anticipation, robot grasping, and navigation.
  source_ids: [vjepa21-paper, vjepa21-paper-html]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The paper lists all authors as affiliated with FAIR at Meta (the first author also lists
    Universidad de Zaragoza, with the work done at Meta), and the checkpoint and code are
    published by Meta in the facebookresearch vjepa2 repository under a Meta Platforms
    copyright. Meta Platforms, Inc. has its principal executive offices in Menlo Park,
    California, per its Form 10-K.
  source_ids: [vjepa21-paper-html, vjepa2-readme, vjepa2-license, meta-10k-2025]
  assessed_at: 2026-09-29
availability:
