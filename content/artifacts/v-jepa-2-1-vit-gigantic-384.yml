license_notes:
  text: >-
    The repository README says most of the project is licensed under MIT, with three
    data-augmentation and worker-initialization files under Apache 2.0. It does not name a
    separate license for the V-JEPA 2.1 checkpoints, so no weights license is recorded here.
  source_ids: [vjepa2-readme]
checklist:
  weights:
    status: public
    note: Direct download link in the README; no gating.
    source_ids: [vjepa2-readme]
  inference_code:
    status: public
    note: The repository provides PyTorch Hub loaders for the V-JEPA 2.1 models.
    source_ids: [vjepa2-readme]
  training_code:
    status: public
    note: >-
      The repository includes a V-JEPA 2.1 pretraining loop (app/vjepa_2_1) and pretraining and
      cooldown configurations for ViT-G/16.
    source_ids: [vjepa2-readme, vjepa21-configs-vitgg16]
  legacy_training_data_information:
    status: partial
    note: >-
      The paper describes VisionMix-163M, which replaces V-JEPA 2's ImageNet images with LVD-142M
      and rebalances the video sources (SSv2, Kinetics, HowTo100M, YT-Temporal-1B). LVD-142M is a
      curated image set from Meta's earlier work that this review did not find released.
    source_ids: [vjepa21-paper-html]
  training_recipe:
    status: partial
    note: >-
      The paper describes the training phases (135,000 pretraining iterations, then a 12,000-
      iteration cooldown at higher resolution and more frames), and configs are published. The
      published ViT-G/16 cooldown config is named for 256-pixel input, while the checkpoint is a
      384-pixel model; this review did not confirm that the configs reproduce the released
      checkpoint.
    source_ids: [vjepa21-paper-html, vjepa21-configs-vitgg16, vjepa2-readme]
  evaluation_materials:
    status: public
    note: >-
      The repository publishes frozen-evaluation code and a V-JEPA 2.1 evaluation config set for
      this model (configs/eval_2_1/vitG-384), covering SSv2, Diving48, EPIC-KITCHENS-100,
      Kinetics-400, ImageNet-1k, COIN, and Jester. This review did not confirm configs for every
      task reported in the paper, such as depth estimation or robot grasping.
    source_ids: [vjepa2-readme, vjepa21-configs-eval-vitgg384]
