summary:
  text: >-
    Liger Kernel is an open-source collection of Triton GPU kernels for training large
    language models, developed at LinkedIn. It provides Hugging Face-compatible
    implementations of layers such as RMSNorm, RoPE, SwiGLU, and cross-entropy (including a
    fused linear cross-entropy), plus memory-efficient losses for post-training methods such
    as DPO, ORPO, and KTO.
  source_ids: [liger-readme, li-liger-blog]
useful_for:
  text: >-
    Reducing GPU memory use and increasing throughput when training or fine-tuning language
    models, either by patching a Hugging Face Transformers model with one line of code or by
    composing models from its modules. It works with PyTorch FSDP, DeepSpeed, and DDP, and is
    integrated in trainers such as Axolotl, LLaMA-Factory, TRL's SFTTrainer, and the Hugging
    Face Trainer.
  source_ids: [liger-readme]
