summary:
  text: >-
    Segment Anything is Meta's family of promptable segmentation models. The original SAM (April
    2023) produces object masks in images from prompts such as points or boxes; SAM 2 (July 2024, updated as SAM 2.1 in
    September 2024) extends this to video with streaming memory; SAM 3 (November 2025, updated as
    SAM 3.1 in March 2026) adds detection, segmentation, and tracking of every instance of a
    concept named by a short text phrase or image exemplar. Licenses differ by generation:
    Apache 2.0 for SAM and SAM 2, and Meta's custom SAM License for SAM 3.
  source_ids: [sam1-readme, sam1-paper, sam2-readme, sam2-release-notes, sam3-readme, sam3p1-release-notes, sam3-license]
useful_for:
  text: >-
    Interactive and automatic segmentation of objects in images and videos; SAM 3 also accepts
    open-vocabulary text prompts to find all matching instances.
  source_ids: [sam2-readme, sam3-readme]
