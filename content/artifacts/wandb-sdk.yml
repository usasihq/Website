summary:
  text: >-
    wandb is the open-source Python library and command-line tool for Weights & Biases. Training
    scripts and notebooks use it to record runs with their hyperparameters and metrics on a W&B
    server, where results can be viewed and compared; a Public API in the same SDK queries logged
    data afterward.
  source_ids: [wandb-readme, wandb-pypi, wandb-sdk-docs]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Tracking, visualizing, and comparing machine learning experiments, and adding experiment
    tracking and data versioning to existing projects through W&B's integrations with ML
    frameworks and libraries.
  source_ids: [wandb-readme, wandb-sdk-docs]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The wandb repository is maintained under the wandb GitHub organization by Weights & Biases;
    PyPI lists Weights & Biases as the package author, and the MIT license names Weights and
    Biases, Inc. as copyright holder. Weights & Biases' Master Service Agreement gives its
    principal place of business as San Francisco, California, and CoreWeave, a Delaware
    corporation headquartered in Livingston, New Jersey, acquired all of its equity in May 2025.
    The SDK reference is now published in CoreWeave's documentation.
  source_ids: [wandb-repo, wandb-pypi, wandb-license, wb-msa, cw-10k-2025, wandb-sdk-docs]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code is public on GitHub under the MIT License, and the package installs from PyPI with
    pip install wandb. Logging results requires a W&B account and API key for a W&B server, which
    is a separate hosted or self-managed service.
  source_ids: [wandb-repo, wandb-license, wandb-pypi, wandb-readme]
  reviewed_at: 2026-10-01
licenses:
  - name: MIT License
    spdx: MIT
    url: https://raw.githubusercontent.com/wandb/wandb/main/LICENSE
