    source_ids: [wandb-license, wandb-pypi]
    reviewed_at: 2026-10-01
license_notes:
  text: >-
    The MIT license covers the code in the wandb repository. The W&B platform that the library
    logs to is provided under W&B's Master Service Agreement, not under this license.
  source_ids: [wandb-license, wb-msa]
  reviewed_at: 2026-10-01
