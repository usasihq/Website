summary:
  text: >-
    Reka Flash is a line of Reka language models; this record covers its open-weight releases.
    Reka Flash 3 (March 2025) is a 21B-parameter
    reasoning model that Reka says was pretrained from scratch on publicly accessible and
    synthetic data, then instruction-tuned and trained with reinforcement learning; it was
    released as open weights under the Apache License 2.0. Reka Flash 3.1 (July 2025) updated it
    with further reinforcement learning aimed at coding and agentic tasks, and was released with a
    3.5-bit quantized version and the Reka Quant quantization library.
  source_ids: [ reka-flash3-post, reka-flash3-card, reka-flash31-post, reka-flash31-card ]
  reviewed_at: 2026-10-02
useful_for:
  text: >-
    Reka describes the open Flash models as suited to general chat, coding, instruction
    following, and function calling in low-latency or local deployments, and Flash 3.1 as a base
    for fine-tuning on agentic tasks.
  source_ids: [ reka-flash3-post, reka-flash31-card ]
  reviewed_at: 2026-10-02
