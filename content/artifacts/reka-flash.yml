provenance:
  text: >-
    Reka states that Reka Flash 3 was pretrained from scratch, and that Reka Flash 3.1 is an
    update to Reka Flash 3. Both are distributed in a Llama-compatible format so that libraries
    supporting Llama can run them; that is a file-format choice, not a statement that the weights
    derive from Llama.
