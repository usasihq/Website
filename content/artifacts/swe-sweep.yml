summary:
  text: >-
    SWE-sweep is a software-engineering benchmark in which a coding agent is given a real
    repository containing many known bugs, with no hint about their type or location, and must
    find and fix as many as it can. Each task is built from real GitHub issue and pull-request
    pairs at a commit where many of those bugs are present at once, and repairs are graded with
    hidden tests from the fixing pull requests plus the existing test suite to catch regressions.
    The paper describes 100 repositories across 22 programming languages.
  source_ids: [ sweep-paper, sweep-site, sweep-repo ]
  reviewed_at: 2026-10-04
useful_for:
  text: >-
    Evaluating coding agents on open-ended repository maintenance, where the agent must decide
    what is broken before repairing it, rather than resolving a single reported issue.
  source_ids: [ sweep-paper, sweep-site ]
  reviewed_at: 2026-10-04
