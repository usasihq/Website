license_notes:
  text: >-
    The MIT license covers the SWE-sweep repository. Tasks are built from third-party open-source
    repositories that the paper says were selected from permissively licensed projects; each of
    those projects remains under its own license, which the paper's appendix lists per
    repository.
  source_ids: [ sweep-license, sweep-paper ]
  reviewed_at: 2026-10-04
checklist:
  code:
    status: public
    note: >-
      The evaluation harness is public under the MIT License. The README describes it as a thin
      wrapper around the Harbor framework.
    source_ids: [ sweep-repo, sweep-license ]
    reviewed_at: 2026-10-04
  tasks_data:
    status: public
    note: >-
      Task definitions are in the repository's tasks directory. The paper says the dataset and
      harness are released, along with rollouts for the models reported in its main results.
    source_ids: [ sweep-repo, sweep-paper ]
    reviewed_at: 2026-10-04
  methodology:
    status: public
    note: >-
      The paper describes repository selection, task construction, and grading. The README gives
      the scoring rule: a task scores zero if the patch introduces new failures in the visible
      test suite; otherwise it scores the share of bugs whose hidden tests pass, and the final
      score is the share of all bugs resolved across tasks.
    source_ids: [ sweep-paper, sweep-repo ]
    reviewed_at: 2026-10-04
  reproducibility_instructions:
    status: public
    note: >-
      The README gives installation steps, a setup check command, commands to evaluate a patch
      for one task, and commands to summarize graded runs.
    source_ids: [ sweep-repo ]
    reviewed_at: 2026-10-04
  limitations:
    status: public
    note: >-
      The paper's discussion states that tasks include only bugs that were reported in an issue
      and fixed by a pull request, so the benchmark under-counts the bugs actually present in each
      codebase.
    source_ids: [ sweep-paper ]
    reviewed_at: 2026-10-04
run_notes:
  - text: >-
      At release the README warns that Harbor 0.23 does not yet support the separate verifier
      environments and collect hooks the tasks use, so the project pins a compatible Harbor
      revision from source until Harbor 0.24 is released. The test suite runs on Python 3.12 and
      3.13 in CI.
    source_ids: [ sweep-repo ]
    reviewed_at: 2026-10-04
  - text: >-
      The paper states that its experiments ran in Docker containers without internet access.
    source_ids: [ sweep-paper ]
    reviewed_at: 2026-10-04
