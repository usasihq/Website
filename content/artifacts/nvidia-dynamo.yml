  installation:
    status: public
    note: >-
      The README documents prebuilt vLLM, SGLang, and TensorRT-LLM runtime containers, PyPI
      installation with backend extras, Kubernetes deployment, and building from source.
    source_ids: [dynamo-readme, dynamo-pypi]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      For v1.5.0 the compatibility page lists NVIDIA Blackwell, Hopper, Ada Lovelace, and Ampere
      GPUs, Ubuntu 24.04 (Ubuntu 22.04 for wheels only), and x86_64 and ARM64 (ARM64 on Ubuntu
      24.04 only). The documentation home page also mentions AMD GPUs and Intel XPUs.
    source_ids: [dynamo-compat, dynamo-docs-home]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Versioned releases are published on GitHub. Dynamo 1.0 was announced in March 2026;
      v1.5.0, published on GitHub on September 21, 2026, was the current GA release when checked.
      Model-specific preview builds are also tagged.
    source_ids: [dynamo-release-1-5-0, dynamo-compat, dynamo-press-1-0]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The README documents a single-node quick start that runs the Dynamo frontend and a vLLM or
      SGLang worker inside a prebuilt container with file-based discovery; etcd and NATS are not
      required for local or Kubernetes deployments.
    source_ids: [dynamo-readme]
    reviewed_at: 2026-10-01
