summary:
  text: >-
    Dynamo is NVIDIA's open-source framework for serving generative AI models across many GPUs
    and nodes. It sits above inference engines such as vLLM, SGLang, and TensorRT-LLM and adds
    disaggregated prefill and decode, KV-cache-aware request routing, KV cache offloading, and
    SLA-based autoscaling behind an OpenAI-compatible frontend. It is written in Rust and Python.
  source_ids: [dynamo-readme, dynamo-docs-home]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    The README positions Dynamo for serving models across multiple GPUs or nodes, for example
    when prefill and decode need to scale independently or requests should be routed by KV
    cache overlap; it notes that a single model on a single GPU is usually served by an
    inference engine alone.
  source_ids: [dynamo-readme]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    NVIDIA announced Dynamo as its open-source inference software in March 2025 and publishes
    its documentation on docs.nvidia.com. The repository sits in the separate ai-dynamo GitHub
    organization, but its README and contribution guide carry NVIDIA Corporation & Affiliates
    copyright notices and no other governing entity is documented. NVIDIA's principal executive
    offices are in Santa Clara, California, per its Form 10-Q for the quarter ended July 26, 2026.
  source_ids: [dynamo-press-2025, dynamo-docs-home, dynamo-readme, dynamo-contributing, nvidia-10q-q2fy2027]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code is public on GitHub. The README documents prebuilt runtime containers on NVIDIA
    NGC, the ai-dynamo package on PyPI, and Kubernetes deployment through the Dynamo Platform.
  source_ids: [dynamo-readme, dynamo-pypi]
  reviewed_at: 2026-10-01
licenses:
