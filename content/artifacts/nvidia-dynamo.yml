license_notes:
  text: >-
    The LICENSE file applies Apache 2.0 to the codebase except for test data files under
    lib/llm/tests/data/deepseek-v3.2, which it says are derived from the DeepSeek-V3.2 model
    repository and are under the MIT License. Contributions must be signed off under the
    Developer Certificate of Origin. The license does not cover the models served with Dynamo.
  source_ids: [dynamo-license, dynamo-contributing]
  reviewed_at: 2026-10-01
checklist:
