checklist:
  source_code:
    status: public
    note: >-
      Public monorepo containing the Python and TypeScript SDKs, Strands harness, the CLI, and the
      documentation site; client code only.
    source_ids: [repo]
    reviewed_at: 2026-10-01
  documentation:
    status: public
    note: Public official documentation at strandsagents.com.
    source_ids: [docs-home, docs-providers, docs-quickstart-python]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      Python: pip install strands-agents (with strands-agents-tools for prebuilt tools);
      TypeScript: npm install @strands-agents/sdk. The harness packages are strands-harness and
      @strands-agents/harness.
    source_ids: [repo, docs-quickstart-python]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      The README lists Python 3.10 or newer for the Python SDK and Node.js 22 or newer for the
      TypeScript SDK; some model providers are documented for only one language.
    source_ids: [repo, docs-providers]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Reviewed Python SDK release python/v1.57.2, marked Latest and published October 1, 2026.
      Releases are tagged per package (for example python/, typescript/, harness-*, and mcp/).
      This entry describes the project rather than one release.
    source_ids: [release]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The model-provider documentation lists Ollama and llama.cpp providers for the Python SDK, with
      Ollama installed as the strands-agents[ollama] extra and requiring a running Ollama server.
      The Python quickstart's default provider is Amazon Bedrock.
    source_ids: [docs-providers, docs-ollama, docs-quickstart-python]
    reviewed_at: 2026-10-01
