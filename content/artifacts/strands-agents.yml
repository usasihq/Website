summary:
  text: >-
    Strands Agents is an open-source SDK from AWS for building and running AI agents in Python and
    TypeScript. It runs a model-driven agent loop in the developer's own process, with tools,
    MCP support, multi-agent patterns, memory and sessions, and tracing. Its repository also holds
    Strands harness, a preassembled agent, along with a CLI and the documentation site.
  source_ids: [repo, aws-announcement]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Writing agents that run without a hosted control plane and can be deployed on different
    infrastructure. Strands is open-source client code that calls a model provider: Amazon Bedrock
    by default, other hosted providers, or local runtimes such as Ollama and llama.cpp. The SDK does
    not include model weights, and hosted models keep their own terms and availability.
  source_ids: [repo, docs-providers, docs-quickstart-python]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    AWS announced Strands Agents on its Open Source Blog in May 2025 as an open-source SDK it
    released. The repository's NOTICE file assigns copyright to Amazon.com, Inc. or its affiliates,
    and its contributing guide adopts the Amazon Open Source Code of Conduct and directs security
    reports to AWS. The repository is hosted in a separate strands-agents GitHub organization; no
    foundation or multi-organization governance body is documented. The AWS Customer Agreement
    gives Amazon Web Services, Inc. an address at 410 Terry Avenue North, Seattle, Washington. See
    the amazon organization record.
  source_ids: [aws-announcement, notice, contributing, repo, aws-agreement]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code and documentation are public. With the default Amazon Bedrock provider, the Python
    quickstart requires AWS credentials and model access enabled in the Bedrock console; other
    providers need their own credentials.
  source_ids: [repo, docs-quickstart-python]
  reviewed_at: 2026-10-01
