summary:
  text: >-
    OpenXLA is an open-source project that develops machine learning compiler and infrastructure
    components linking frameworks such as JAX, PyTorch, and TensorFlow to hardware backends. Its
    website lists XLA (a compiler for GPUs, CPUs, and ML accelerators), StableHLO (a portable
    operation set), Shardy (an MLIR-based tensor partitioner), PJRT (a device and compiler
    interface), XProf (profiling tools), and Tokamax.
  source_ids: [openxla-site, xla-readme]
useful_for:
  text: >-
    XLA compiles models from ML frameworks for execution on different hardware, and StableHLO and
    PJRT are described as interfaces that let frameworks and compilers or devices interoperate.
  source_ids: [openxla-site, xla-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    OpenXLA lists member organizations from several countries, with Google as the founding member,
    but this catalog found no documentation of a separate multi-company governing body. The XLA
    contribution guide says the project follows Google's Open Source Community Guidelines and
    requires Google's Contributor License Agreement. The StableHLO governance page says Google
    engineers took responsibility for StableHLO's technical leadership during its 2022
    bootstrapping phase, with an open governance model stated as a future aim; no later
    project-wide governance document was found. On that basis the documented
    maintaining entity is Google, whose parent Alphabet Inc. has its principal executive offices in
    Mountain View, California, per its fiscal 2025 Form 10-K. This assessment should be revisited
    if OpenXLA adopts a new governance structure.
  source_ids: [xla-contributing, stablehlo-governance, openxla-members, openxla-site, alphabet-10k-2025]
  assessed_at: 2026-09-29
