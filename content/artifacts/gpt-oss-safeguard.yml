summary:
  text: >-
    gpt-oss-safeguard is a pair of open-weight, text-only reasoning models from OpenAI,
    gpt-oss-safeguard-120b and gpt-oss-safeguard-20b, post-trained from the corresponding gpt-oss
    models to classify content against a policy that the user supplies. OpenAI's technical report
    is dated October 29, 2025. OpenAI lists the models as a model partner of the Robust Open
    Online Safety Tools (ROOST) Model Community, a group of safety practitioners working with
    open models.
  source_ids: [ safeguard-tech-report, gh-safeguard, hf-safeguard-120b, hf-safeguard-20b ]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    The model cards list safety uses such as filtering LLM inputs and outputs, online content
    labeling, and offline labeling for trust-and-safety work. OpenAI recommends the base gpt-oss
    models for other applications, including end-user chat.
  source_ids: [ hf-safeguard-120b, safeguard-tech-report ]
  reviewed_at: 2026-10-01
