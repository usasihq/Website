summary:
  text: >-
    Grok-1 is a 314-billion-parameter mixture-of-experts language model (8 experts, 2
    used per token) that xAI trained from scratch. The published checkpoint is the raw
    base model from pretraining that ended in October 2023 and is not fine-tuned for
    dialogue or other applications.
  source_ids: [xai-grok-os, gh-grok-1]
