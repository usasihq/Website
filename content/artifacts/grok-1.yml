run_notes:
  - text: >-
      The GitHub repository documents running the checkpoint with its JAX example code
      (run.py) and says a machine with enough GPU memory is required; the Hugging Face card
      says a multi-GPU machine is needed. The model supports activation sharding and 8-bit
      quantization.
    source_ids: [gh-grok-1, hf-grok-1]
  - text: >-
      Documented specifications: 64 layers, 48 query heads and 8 key/value heads, a
      131,072-token SentencePiece tokenizer, rotary embeddings, and a maximum context of
      8,192 tokens.
    source_ids: [gh-grok-1]
provenance:
  text: >-
    xAI states that Grok-1 was trained from scratch using a custom training stack built on
    JAX and Rust.
