summary:
  text: >-
    openpi is Physical Intelligence's repository of code and model checkpoints for
    its π0, π0-FAST, and π0.5 vision-language-action models for robot control. It
    provides base checkpoints pre-trained on more than 10,000 hours of robot data,
    fine-tuned checkpoints for the ALOHA, DROID, and LIBERO setups, and JAX and
    PyTorch code for inference and fine-tuning.
  source_ids: [openpi-readme]
useful_for:
  text: >-
    The README documents fine-tuning the base models on a user's own robot data
    (converted to the LeRobot dataset format), serving a policy over a websocket for
    remote inference, and running the provided checkpoints on DROID and ALOHA robots.
    It describes the release as an experiment that may not transfer to every robot.
  source_ids: [openpi-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The repository is published by the Physical Intelligence team, per its README. The π0
    paper gives the authors' affiliation as Physical Intelligence, San Francisco, California,
    USA, and The Robot Report describes the company as San Francisco-based; the
    physical-intelligence record documents its headquarters.
  source_ids: [openpi-readme, pi0-paper-html, robotreport-openpi]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Code is on GitHub. Checkpoints download from a public Google Cloud Storage bucket
    (gs://openpi-assets), which the code fetches automatically.
  source_ids: [openpi-readme, openpi-gcs-listing, robotreport-openpi]
