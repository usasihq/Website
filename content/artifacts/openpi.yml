    applies_to: code
    source_ids: [openpi-license-file]
license_notes:
  text: >-
    The repository's LICENSE file is Apache 2.0. The repository also contains Google's
    Gemma Terms of Use (LICENSE_GEMMA.txt, added September 2025) without saying which
    files or checkpoints it covers; the π0 paper says the model uses PaliGemma as its
    base. The README does not state separate license terms for the checkpoints.
  source_ids: [openpi-license-file, openpi-gemma-license, openpi-gemma-commit, pi0-paper-html, openpi-readme]
checklist:
  source_code:
    status: public
    note: Model, training, and serving code in JAX, with PyTorch versions of π0 and π0.5.
    source_ids: [openpi-readme]
  documentation:
    status: public
    note: The README and docs folder cover installation, inference, fine-tuning, remote inference, and troubleshooting.
    source_ids: [openpi-readme]
  training_code:
    status: public
    note: >-
      Fine-tuning scripts and configs are included, plus an approximate open-source
      version of the pipeline used to train π0-FAST-DROID. The README does not
      describe releasing the base-model pre-training pipeline.
    source_ids: [openpi-readme]
  data_information:
    status: partial
    note: >-
      Fine-tuning examples use public LIBERO and DROID data. The π0 paper describes
      the pre-training mixture (mostly internal robot data plus OXE, Bridge v2, and
      DROID); no public release of the internal data was found.
    source_ids: [openpi-readme, pi0-paper-html]
  reproducibility_instructions:
    status: partial
    note: >-
      Step-by-step instructions cover LIBERO fine-tuning and evaluation and DROID
      training; reproducing the base-model pre-training is not covered.
    source_ids: [openpi-readme]
run_notes:
  - text: >-
      The README estimates, assuming a single NVIDIA GPU, more than 8 GB of GPU memory
      for inference (example RTX 4090), more than 22.5 GB for LoRA fine-tuning, and
      more than 70 GB for full fine-tuning (A100 80GB or H100). It states that JAX
      inference keeps most weights in bfloat16 and training defaults to mixed
      precision (float32 weights, mostly bfloat16 activations). The repository is
      tested only on Ubuntu 22.04.
    source_ids: [openpi-readme]
provenance:
  text: >-
    The π0 paper states that π0 uses PaliGemma, an open 3-billion-parameter
    vision-language model, as its base model and adds a flow-matching architecture
    for actions; the openpi model code pairs a PaliGemma backbone with a separate
    action expert.
  derived_from:
    - name: PaliGemma
      artifact_slug: null
      url: null
      note: Vision-language base model named in the π0 paper.
  source_ids: [pi0-paper-html, openpi-model-code]
