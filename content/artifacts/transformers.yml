  installation:
    status: public
    note: >-
      Documented installation with pip or uv (for example the transformers[torch] extra), from
      source, as an editable install, and from conda-forge.
    source_ids: [transformers-install]
  supported_platforms:
    status: public
    note: >-
      The installation guide states the library works with PyTorch and is tested on Python 3.10+
      and PyTorch 2.5+, and documents setups for NVIDIA GPUs (CUDA), Intel GPUs (XPU), CPU-only
      use, and NVIDIA ARM64 devices.
    source_ids: [transformers-install]
  release_status:
