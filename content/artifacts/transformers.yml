    source_ids: [transformers-release]
run_notes:
  - text: >-
      The installation guide documents offline use: download a model repository in advance and
      set HF_HUB_OFFLINE=1 (or pass local_files_only=True) so that loading does not contact the
      Hub.
    source_ids: [transformers-install]
