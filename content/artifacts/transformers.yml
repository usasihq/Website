summary:
  text: >-
    Transformers is Hugging Face's open-source Python library of model definitions for text,
    vision, audio, video, and multimodal models, used for both inference and training. Its
    README presents it as a shared model-definition layer that other training frameworks and
    inference engines build on, and it loads pretrained checkpoints from the Hugging Face Hub.
  source_ids: [transformers-repo, transformers-readme]
useful_for:
  text: >-
    Loading and running pretrained models through the high-level Pipeline API or model classes,
    fine-tuning them, and serving or chatting with a model from the command line.
  source_ids: [transformers-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Transformers is developed in Hugging Face's GitHub organization and its LICENSE names the
    Hugging Face team as copyright holder. Hugging Face's terms of service identify Hugging Face,
    Inc., a Delaware corporation, as the provider of its services, under New York law and courts,
    and its privacy policy states that the company and its servers are located in the United
    States (the French entity is named as its EU main establishment). See the hugging-face
    organization record for the full dual-country assessment.
  source_ids: [transformers-repo, transformers-license, hf-tos, hf-privacy]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Source code on GitHub under the Apache License 2.0; installable with pip or uv, or from
    conda-forge.
  source_ids: [transformers-repo, transformers-license, transformers-install]
