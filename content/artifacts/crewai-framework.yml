summary:
  text: >-
    CrewAI is an open-source Python framework for multi-agent workflows. It offers Crews, where
    role-based agents work together autonomously, and Flows, which give event-driven control over
    workflow steps. The README describes it as a standalone Python framework with its own
    primitives for agents, tasks, crews, flows, tools, and orchestration.
  source_ids: [crewai-readme]
useful_for:
  text: >-
    Building multi-agent automations in Python in which agents with defined roles, goals, and
    tools handle tasks together, combined where needed with explicit, event-driven workflow logic.
  source_ids: [crewai-readme]
eligibility:
  status: pending_review
  basis: undetermined
  explanation: >-
    The LICENSE file assigns copyright to crewAI, Inc., and the repository is under the crewAIInc
    GitHub organization, so the maintaining entity is the company. CrewAI's terms of use identify
    CrewAI, Inc. as a Delaware corporation, and its 2025 and 2026 press releases are datelined San
    Francisco, but no official page, terms document, or regulatory filing found states the
    company's headquarters or principal office. Whether the maintaining entity is U.S.-based
    therefore follows the unresolved assessment in the CrewAI organization record. No foundation
    or multi-organization governance body is documented.
  source_ids: [crewai-license, crewai-repo, crewai-tos, crewai-pr-2026-02]
  assessed_at: 2026-09-29
