run_notes:
  - text: >-
      The README says CrewAI collects anonymous usage telemetry by default. Setting
      OTEL_SDK_DISABLED=true turns it off. A separate opt-in setting, share_crew, sends detailed
      crew and task data.
    source_ids: [crewai-readme]
