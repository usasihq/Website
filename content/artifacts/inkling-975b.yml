summary:
  text: >-
    Inkling is a 66-layer decoder-only mixture-of-experts transformer with 975B total and
    41B active parameters, routing each token to 6 of 256 experts plus 2 shared experts.
    It accepts text, image, and audio input, outputs text, and supports a context window
    of up to 1M tokens. Thinking Machines Lab says it trained the model from scratch on
    45 trillion tokens of text, images, audio, and video.
  source_ids: [tml-inkling-card, tml-inkling-news]
useful_for:
  text: >-
    The model card describes use by developers building agentic and tool-use systems,
    coding assistants, chatbots, and retrieval-augmented generation systems, and says the
    weights are released to support research, fine-tuning, and integration into
    third-party products.
  source_ids: [tml-inkling-card, hf-inkling]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model card names Thinking Machines Lab, Inc. as the model provider; the company
    states in its privacy notice that it is based in the United States (see the
    organization record for the San Francisco headquarters assessment).
  source_ids: [tml-inkling-card, tml-privacy]
  assessed_at: 2026-09-29
availability:
