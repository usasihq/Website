license_notes:
  text: >-
    The Hugging Face repository declares Apache 2.0 in its metadata and links to the
    Apache license text; it has no separate LICENSE file. Thinking Machines Lab also
    publishes a Model Acceptable Use Policy (July 15, 2026) stating that anyone who
    accesses, downloads, or uses its model materials agrees to be bound by it. The policy
    lists prohibited uses such as weapons development, CSAM, fraud, and unauthorized
    surveillance, and does not mention the Apache license.
  source_ids: [hf-inkling, tml-model-aup]
checklist:
  weights:
    status: public
    note: Published as a BF16 checkpoint and a separate NVFP4-quantized checkpoint.
    source_ids: [hf-inkling, tml-inkling-card]
  inference_code:
    status: public
    note: >-
      The model card documents deployment with open-source SGLang, vLLM, TokenSpeed,
      Unsloth, and Hugging Face Transformers, with published recipes.
    source_ids: [tml-inkling-card, hf-inkling]
  training_code:
    status: unknown
    note: >-
      The Tinker Cookbook is published for fine-tuning; no code for training Inkling itself
      was found.
    source_ids: []
  legacy_training_data_information:
    status: partial
    note: >-
      The model card and training-data documentation describe source categories (public
      web content and repositories, data acquired from third parties or partners, and
      synthetic data), deduplication, and filtering. The data is not released.
    source_ids: [tml-inkling-card, tml-training-data-doc, hf-inkling]
  training_recipe:
    status: partial
    note: >-
      The announcement describes the architecture, the optimizer setup (Muon for large
      matrices, Adam for other parameters), weight-decay scheduling, an SFT bootstrap, and
      large-scale reinforcement learning at a high level.
    source_ids: [tml-inkling-news]
  evaluation_materials:
    status: partial
    note: >-
      Benchmark and safety results are published in the model card and as evaluation
      result files in the Hugging Face repository. The announcement notes that some
      reported results came from a different checkpoint than the one released.
    source_ids: [hf-inkling, tml-inkling-news]
run_notes:
  - text: >-
      The model card states that the BF16 checkpoint needs at least 2 TB of aggregated GPU
      memory (for example 8x NVIDIA B300 or 16x H200), and that the NVFP4-quantized
      checkpoint needs at least 600 GB (W4A4 on 4x B300, which requires SM100+
      architecture, or W4A16 on 8x H200).
    source_ids: [tml-inkling-card]
  - text: >-
      Documented deployment frameworks are SGLang, vLLM, TokenSpeed, Unsloth, and Hugging
      Face Transformers; the model is also available through Tinker and third-party
      inference providers.
    source_ids: [tml-inkling-card, hf-inkling]
provenance:
  text: >-
    Thinking Machines Lab says it trained Inkling from scratch. Its announcement states
    that post-training began with supervised fine-tuning on synthetic data generated by
    open-weights models including Kimi K2.5, which it says was a small fraction of compute,
    followed by large-scale reinforcement learning. No other model's weights are named as
    a starting point.
  derived_from: []
  source_ids: [tml-inkling-news]
