summary:
  text: >-
    ROCm is AMD's open software stack for GPU-accelerated computing on AMD GPUs. Its Core SDK
    includes the HIP runtime and programming interface, compilers including LLVM, math and deep
    learning libraries such as rocBLAS and MIOpen, the RCCL communication library, and profiling,
    debugging, and monitoring tools. Since version 7.14 it has been built and released through
    TheRock, AMD's open build and release system; version 10.1.0 was released on October 5, 2026.
  source_ids: [ rocm-what-is, rocm-release-notes, therock-readme ]
  reviewed_at: 2026-10-08
useful_for:
  text: >-
    Programming and running AI and high-performance computing workloads on AMD Instinct, Radeon,
    and Ryzen GPUs. The 10.1.0 release notes list support for PyTorch 2.14.0, JAX 0.11.1, vLLM
    0.29.0, SGLang 0.5.18, and MIGraphX 2.18, and drop support for TensorFlow 2.19.1.
  source_ids: [ rocm-what-is, rocm-release-notes ]
  reviewed_at: 2026-10-08
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    AMD's license page states that ROCm is released by Advanced Micro Devices, Inc. Advanced
    Micro Devices, Inc. is a Delaware corporation whose Form 10-Q for the quarter ended June 27,
    2026 gives its address as Santa Clara, California, on the cover page.
  source_ids: [ rocm-license, amd-10q-q2-2026-cover ]
  assessed_at: 2026-10-08
availability:
  status: public
  access_conditions: >-
    Open-source components are released through public GitHub repositories, packages on
    repo.radeon.com, and other channels. AMD keeps proprietary products only on repo.radeon.com,
    in a separate subdirectory, and distributes ROCprof Trace Decoder and the AOCC CPU
    optimizations in binary form only.
  source_ids: [ rocm-license ]
  reviewed_at: 2026-10-08
