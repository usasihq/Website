license_notes:
  text: >-
    AMD licenses ROCm per component. Its license page lists each component's terms, says that
    components may include third-party code under additional licenses, and says the MIT license
    on the ROCm repository covers what is mainly documentation. ROCprof Trace Decoder and the
    AOCC CPU optimizations are binary-only and governed by separate license agreements. The
    GPL entries are recorded without SPDX identifiers because the page does not say whether
    "only" or "or later" terms apply.
  source_ids: [ rocm-license ]
  reviewed_at: 2026-10-08
checklist:
  source_code:
    status: partial
    note: >-
      Open-source components are in public repositories, and TheRock provides a CMake
      super-project for building ROCm from source. Two components are distributed in binary form
      only.
    source_ids: [ rocm-license, therock-readme ]
    reviewed_at: 2026-10-08
  documentation:
    status: public
    note: >-
      AMD's documentation portal has release notes, a compatibility matrix, installation guides,
      and a ROCm handbook with programming and optimization guides.
    source_ids: [ rocm-what-is, rocm-release-notes, rocm-compat ]
    reviewed_at: 2026-10-08
  installation:
    status: public
    note: >-
      AMD documents installation through Linux package managers, the amdgpu-install script (for
      Radeon and Ryzen), Python wheels, tarballs, and a runfile installer. TheRock's README says a
      source build needs about 200 GB of free disk space and can take hours.
    source_ids: [ rocm-install, therock-readme ]
    reviewed_at: 2026-10-08
  supported_platforms:
    status: public
    note: >-
      The compatibility matrix lists supported AMD Instinct, Radeon, and Ryzen devices. The
      installation guide covers Ubuntu, Debian, RHEL, Oracle Linux, Rocky Linux, and SLES, native
      Windows 11, and a WSL2 technical preview.
    source_ids: [ rocm-compat, rocm-install ]
    reviewed_at: 2026-10-08
  release_status:
    status: public
    note: >-
      Versioned releases with release notes; ROCm Core SDK 10.1.0 was released on 2026-10-05 and
      tagged in the TheRock repository.
    source_ids: [ rocm-release-notes, therock-release-10-1 ]
    reviewed_at: 2026-10-08
run_notes:
  - text: >-
      Release and build instructions moved to TheRock starting with ROCm 7.14. The former ROCm/ROCm
      GitHub repository now appears as ROCm/legacy-rocm-build, and AMD's documentation includes a
      transition guide from the legacy release stream.
    source_ids: [ therock-readme, rocm-legacy-repo, rocm-what-is ]
    reviewed_at: 2026-10-08
  - text: >-
      The 10.1.0 release notes describe added support for Ubuntu 26.04.1 and Ubuntu 24.04.5 and for
      SR-IOV GPU virtualization on several Instinct and Radeon PRO GPUs; the compatibility matrix
      is the reference for a given device and operating system.
    source_ids: [ rocm-release-notes, rocm-compat ]
    reviewed_at: 2026-10-08
