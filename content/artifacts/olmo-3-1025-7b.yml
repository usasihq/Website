summary:
  text: >-
    The pretrained base model at the 7B scale in Ai2's Olmo 3 release, trained in three
    stages (pretraining, mid-training, and long-context extension) on Dolma 3 data. The model
    card lists 5.93 trillion training tokens, 32 layers, and a 65,536-token context length.
  source_ids: [mc-olmo3-7b, ai2-olmo3-blog]
useful_for:
  text: >-
    Ai2 documents base models as starting points for custom fine-tuning and for research on
    pretrained models; the model card publishes intermediate checkpoints from each training
    stage and fine-tuning instructions using OLMo-core.
  source_ids: [mc-olmo3-7b, ai2-docs-olmo]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    The model card states the model was developed by the Allen Institute for AI (Ai2), which
    describes itself as a Seattle-based non-profit AI research institute.
  source_ids: [mc-olmo3-7b, ai2-about]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Downloadable from Hugging Face without gating. The card says the model is intended for
    research and educational use in line with Ai2's Responsible Use Guidelines.
  source_ids: [mc-olmo3-7b]
