  - name: Apache License 2.0 (OLMo-core)
    spdx: Apache-2.0
    url: https://raw.githubusercontent.com/allenai/OLMo-core/main/LICENSE
    applies_to: code
    source_ids: [olmo-core-license]
license_notes:
  text: >-
    The model card states that the code and model are released under Apache 2.0 and that the
    model is intended for research and educational use in accordance with Ai2's Responsible
    Use Guidelines, which list categories of prohibited use.
  source_ids: [mc-olmo3-7b, ai2-rug]
checklist:
  weights:
    status: public
    note: Final weights and staged intermediate checkpoints are published on Hugging Face.
    source_ids: [mc-olmo3-7b]
  inference_code:
    status: public
    note: >-
      The model card documents inference with Hugging Face Transformers and lists OLMo-core
      as the core repository for training, inference, and fine-tuning.
    source_ids: [mc-olmo3-7b, olmo-core-olmo3]
  training_code:
    status: public
    note: >-
      OLMo-core publishes the official Olmo 3 7B pretraining, mid-training, and long-context
      scripts.
    source_ids: [olmo-core-olmo3, olmo-core-license]
  training_data_information:
    status: partial
    note: >-
      The Dolma 3 Mix used for pretraining is downloadable under ODC-BY, but its dataset card
      says some olmOCR science PDFs were redacted after Olmo 3 7B was trained (marked
      [REMOVED]) and that this affects reproducibility. Mid-training and long-context mixes are
      linked from the model card.
    source_ids: [dolma3-mix-7b, mc-olmo3-7b]
  training_recipe:
    status: public
    note: >-
      The technical report documents stages, schedules, and configurations, and the OLMo-core
      scripts encode the official runs.
    source_ids: [olmo3-report, olmo-core-olmo3]
  evaluation_materials:
    status: public
    note: >-
      The model card publishes base-model evaluation results; OLMES documents commands for
      running the task suites from the Olmo 3 technical report.
    source_ids: [mc-olmo3-7b, olmes-repo]
run_notes:
  - text: >-
      The model card documents inference with Hugging Face Transformers version 4.57.0 or
      later, and optional 8-bit loading through bitsandbytes.
    source_ids: [mc-olmo3-7b]
  - text: >-
      Intermediate checkpoints are available as Hugging Face repository revisions named
      stage1-stepXXX (pretraining), stage2-stepXXX (mid-training), and stage3-stepXXX (long
      context).
    source_ids: [mc-olmo3-7b]
provenance:
  text: >-
    Trained from scratch by Ai2. Per the model card, stage 1 used the Dolma 3 Mix (5.93T
    tokens), stage 2 used the Dolma 3 Dolmino Mix (100B tokens), and stage 3 used the Dolma 3
    Longmino Mix (50B tokens).
  derived_from:
    - name: Dolma 3 Mix (6T, 1025)
      artifact_slug: dolma
      url: https://huggingface.co/datasets/allenai/dolma3_mix-6T-1025-7B
      note: Stage 1 pretraining data.
    - name: Dolma 3 Dolmino Mix (100B, 1025)
      artifact_slug: dolma
      url: https://huggingface.co/datasets/allenai/dolma3_dolmino_mix-100B-1025
      note: Stage 2 mid-training data.
    - name: Dolma 3 Longmino Mix (50B, 1025)
      artifact_slug: dolma
      url: https://huggingface.co/datasets/allenai/dolma3_longmino_mix-50B-1025
      note: Stage 3 long-context data.
  source_ids: [mc-olmo3-7b, dolma3-mix-7b]
