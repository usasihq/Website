checklist:
  weights:
    status: public
    note: Safetensors and PyTorch weight files are in the Hugging Face repository, which is not gated.
    source_ids: [fl2-large-api]
    reviewed_at: 2026-10-01
  inference_code:
    status: public
    note: >-
      The repository includes the modeling and processing code, and the card gives Transformers
      examples for each task plus a sample inference notebook.
    source_ids: [fl2-large-card, fl2-large-api]
    reviewed_at: 2026-10-01
  training_code:
    status: unknown
    note: No official Florence-2 training code was linked from the model card, the report, or the Microsoft Research publication page.
    source_ids: [fl2-large-card, florence2-paper, msr-florence2-pub]
    reviewed_at: 2026-10-01
  training_data_information:
    status: partial
    note: >-
      The report describes building FLD-5B from images drawn from ImageNet-22k, Object 365, Open
      Images, Conceptual Captions, and LAION, annotated by specialist models and refined through
      filtering and iterative model refinement. This review confirms disclosure, not completeness
      across every provenance, labeling, and processing requirement.
    source_ids: [florence2-paper]
    reviewed_at: 2026-10-01
  training_data_access:
    status: unknown
    note: No official download of the FLD-5B annotations was linked from the model card, the report, or the Microsoft Research publication page.
    source_ids: [fl2-large-card, florence2-paper, msr-florence2-pub]
    reviewed_at: 2026-10-01
  training_recipe:
    status: partial
    note: >-
      The report gives the optimizer (AdamW with cosine decay), maximum learning rate, warmup,
      batch size, image sizes, sample counts, and initialization for the original large model;
      the card describes the later 4k-context continued pretraining only briefly.
    source_ids: [florence2-paper, fl2-large-card]
    reviewed_at: 2026-10-01
  evaluation_materials:
    status: partial
    note: The card and report publish zero-shot and fine-tuned results; evaluation code was not found.
    source_ids: [fl2-large-card, florence2-paper]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The model card documents loading the model with Hugging Face Transformers
      (AutoModelForCausalLM with trust_remote_code) and states that all models were trained with
      float16; its examples use float16 on CUDA and float32 on CPU.
    source_ids: [fl2-large-card]
    reviewed_at: 2026-10-01
provenance:
  text: >-
    Trained by Microsoft. The technical report says the image encoder and the multimodal
    encoder-decoder were initialized from UniCL and BART weights, respectively. The current
    repository weights are a continued-pretrained 4k-context version uploaded in December 2024.
  derived_from:
    - name: UniCL
      artifact_slug: null
      url: null
      note: Initialization for the DaViT image encoder, per the technical report.
    - name: BART
      artifact_slug: null
      url: null
      note: Initialization for the multimodal encoder-decoder, per the technical report.
  source_ids: [florence2-paper, fl2-large-card, fl2-large-commits]
