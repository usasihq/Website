summary:
  text: >-
    Florence-2-large is the larger pretrained Florence-2 vision model, listed at 0.77B parameters
    on its model card. It takes an image and a task prompt and returns text, boxes, or polygons
    for tasks such as captioning, detection, grounding, and OCR. Since a December 2024 update,
    the Hugging Face repository holds a version continued-pretrained for a 4k context length on
    0.1B samples, which the card says might not be trained well; the same update changed OCR
    output to include line separators.
  source_ids: [fl2-large-card, fl2-large-commits]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Prompt-selected vision tasks shown on the card, including captions at several levels of
    detail, object detection, dense region captioning, region proposals, caption-to-phrase
    grounding, and OCR with or without regions; the report describes it as a base for
    fine-tuning as well as zero-shot use.
  source_ids: [fl2-large-card, florence2-paper]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The technical report lists its authors under Azure AI, Microsoft, and the checkpoint is
    published in Microsoft's Hugging Face organization with an MIT license naming Microsoft
    Corporation. Microsoft Corporation lists One Microsoft Way, Redmond, Washington as its
    principal executive offices on the cover page of its Form 10-K for fiscal year 2026.
