summary:
  text: >-
    The only published ether0 checkpoint: a 24B-parameter language model that reasons in English
    and outputs molecules as SMILES. It is fine-tuned and reinforcement-learning trained from
    Mistral-Small-24B-Instruct-2501, followed by safety post-training. It was posted to Hugging
    Face on June 4, 2025.
  reviewed_at: 2026-10-01
  source_ids: [ether0-card, hf-api-ether0]
useful_for:
  text: >-
    Chemistry tasks it was trained for, such as proposing molecules that meet a target pKa,
    solubility, scent, receptor-binding, or toxicity property, converting names or formulas to
    SMILES, one-step retrosynthesis, and reaction outcome prediction. The card says it is not a
    general-purpose chat model and cannot, for example, report the pKa of a given molecule.
  reviewed_at: 2026-10-01
  source_ids: [ether0-card]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Published by FutureHouse in its Hugging Face organization; the card states a 2025
    FutureHouse copyright. FutureHouse is a 501(c)(3) nonprofit in San Francisco per its about
    page and the IRS exempt-organization extract. The base model comes from Mistral AI and is
    recorded as provenance; it is not treated as a U.S.-developed model.
  source_ids: [ether0-card, hf-api-ether0, fh-about, irs-eo-bmf-ca]
  assessed_at: 2026-10-01
availability:
  status: public
  reviewed_at: 2026-10-01
  access_conditions: >-
    Downloadable from Hugging Face without gating. The card documents safety post-training
    (refusals for compounds on OPCW Schedules 1 and 2 and for requests such as making explosives
    or poisons) rather than any access restriction.
  source_ids: [ether0-card, hf-api-ether0]
