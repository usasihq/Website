license_notes:
  text: >-
    The model card's license field is apache-2.0, and its licensing section calls the
    repository open weights under Apache 2.0, copyright 2025 FutureHouse. The code license
    covers the GitHub repository of reward functions and data utilities, not training code. The
    benchmark test set is tagged CC BY 4.0. The base model's card, published by Mistral AI's
    Hugging Face organization, also lists Apache 2.0.
  reviewed_at: 2026-10-01
  source_ids: [ether0-card, hf-api-ether0, ether0-license, ether0-benchmark-api, mistral-base-card]
checklist:
  weights:
    status: public
    reviewed_at: 2026-10-01
    note: Safetensors weights on Hugging Face without gating.
    source_ids: [hf-api-ether0, ether0-card]
  inference_code:
    status: public
    reviewed_at: 2026-10-01
    note: >-
      The README loads the model with Hugging Face Transformers; the card lists hosted inference
      providers and community quantizations for llama.cpp, Ollama, and LM Studio.
    source_ids: [ether0-repo, ether0-card]
  training_code:
    status: unknown
    reviewed_at: 2026-10-01
    note: >-
      The GitHub README states that the repository does not contain training code and points to
      third-party frameworks (NeMo-RL, TRL) for the SFT and RL phases.
    source_ids: [ether0-repo]
  training_pipeline:
    status: unknown
    reviewed_at: 2026-10-01
    note: No complete training or preprocessing pipeline was found in the sources reviewed.
    source_ids: []
  training_recipe:
    status: partial
    reviewed_at: 2026-10-01
    note: >-
      The card and README describe the stages (SFT on DeepSeek-R1 traces, GRPO specialists,
      rejection sampling, generalist SFT, all-task GRPO, safety post-training) at a high level;
      the preprint, which the card cites for details, was not reviewed for this record.
    source_ids: [ether0-card, ether0-repo]
  training_data_information:
    status: partial
    reviewed_at: 2026-10-01
    note: >-
      The card lists the training task types, names EveBio as the source of receptor-binding
      data, and refers to the preprint for data details. This review confirms partial
      disclosure, not completeness.
    source_ids: [ether0-card]
  training_data_access:
    status: unknown
    reviewed_at: 2026-10-01
    note: >-
      Only the 325-question benchmark test set was found as a download; no training set was
      identified in the sources reviewed.
    source_ids: [ether0-benchmark-api, ether0-repo]
  evaluation_materials:
    status: public
    reviewed_at: 2026-10-01
    note: >-
      The benchmark test set is public, and the repository publishes the reward functions and an
      example script for scoring a model on it.
    source_ids: [ether0-repo, ether0-benchmark-api]
run_notes:
  - text: >-
      The card advises giving molecules as SMILES rather than common names, since the model has
      limited support for IUPAC names and synonyms.
    reviewed_at: 2026-10-01
    source_ids: [ether0-card]
  - text: >-
      The card says its published results are for the released (post-safety) weights, which
      differ from the pre-mitigation results in the preprint.
    reviewed_at: 2026-10-01
    source_ids: [ether0-card]
provenance:
  text: >-
    Derived from Mistral AI's Mistral-Small-24B-Instruct-2501. Per the model card, FutureHouse
    first fine-tuned the base model on reasoning traces from DeepSeek-R1, trained task-specific
    specialist models with GRPO and verifiable rewards, fine-tuned the base model again on
    filtered specialist reasoning traces, ran GRPO across all tasks, and then applied safety
    post-training. The base model is not a U.S.-developed model.
  derived_from:
    - name: Mistral-Small-24B-Instruct-2501 (Mistral AI)
      artifact_slug: null
      url: https://huggingface.co/mistralai/Mistral-Small-24B-Instruct-2501
      note: Base model named in the model card metadata and text; developed by Mistral AI.
  source_ids: [ether0-card, hf-api-ether0, mistral-base-card]
