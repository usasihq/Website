    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      The documentation lists Apple M1/M2/M3 Macs or Linux (tested on Fedora) with Python 3.10
      or 3.11, while the latest PyPI release declares Python 3.11 or later.
    source_ids: [ il-docs-home, il-pypi ]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      The last release is v0.26.1, published May 5, 2025. The repository has been archived
      since April 23, 2026, so no further releases are expected there.
    source_ids: [ il-release-0-26-1, il-pypi, il-repo ]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      As of the review, the instructlab/training and instructlab/eval repositories were not
      archived and had been updated in August 2026. The sdg, taxonomy, ui, and documentation
      repositories were archived.
    source_ids: [ il-org-repos ]
