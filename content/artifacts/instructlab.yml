archive_note: >-
  Historical record. The InstructLab community announced on September 2, 2025 that it would
  split the project into separate component repositories, and the main ilab repository was
  archived (read-only) on April 23, 2026, with no release since v0.26.1 in May 2025. Synthetic
  data generation and training continue in sdg_hub and training_hub in the Red Hat AI
  Innovation Team's GitHub organization. The Apache 2.0 code remains downloadable.
