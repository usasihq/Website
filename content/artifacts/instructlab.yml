summary:
  text: >-
    InstructLab was an open-source project, launched by IBM and Red Hat in 2024, for adding
    knowledge and skills to language models through a contributed taxonomy, synthetic data
    generation, and tuning based on IBM Research's LAB method, using the ilab command-line
    tool. A September 2, 2025 community announcement split its components into separate
    repositories, with synthetic data generation and training continuing as sdg_hub and
    training_hub in the Red Hat AI Innovation Team's GitHub organization. The main ilab repository was
    archived on April 23, 2026, and most other InstructLab repositories are archived as well.
  source_ids: [ rh-rhel-ai-pr-2024, ibm-research-instructlab, il-readme, il-repo, il-org-repos, rh-ai-innovation-gh ]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Historical reference for the taxonomy-guided synthetic-data approach to customizing models.
    For current work, the project points to sdg_hub and training_hub.
  source_ids: [ il-readme, il-docs-home ]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    IBM and Red Hat launched InstructLab, and its documentation site carries a Red Hat, Inc.
    copyright. Its governance document says the initial Oversight Committee was appointed by the
    project's founding sponsors. Red Hat's corporate headquarters is in Raleigh, North Carolina,
    and Red Hat, Inc. is a wholly owned subsidiary of IBM, a New York corporation with principal
    executive offices in Armonk, New York. The successor repositories named in the README sit in the
    GitHub organization of the Red Hat AI Innovation Team, which describes itself as a team
    within Red Hat.
  source_ids: [ rh-rhel-ai-pr-2024, il-docs-home, il-governance, rh-offices, ibm-10k-2025-ex21, ibm-10k-2025-cover, il-readme, rh-ai-innovation-gh ]
  assessed_at: 2026-10-01
