summary:
  text: >-
    parakeet-tdt-0.6b-v3 is a 600-million-parameter multilingual speech recognition model with a
    FastConformer encoder and a TDT decoder, which predicts tokens and their durations jointly. It
    extends
    parakeet-tdt-0.6b-v2 from English to 25 European languages, detects the spoken language
    automatically, and outputs punctuated, capitalized text with word- and segment-level
    timestamps. NVIDIA released it on Hugging Face on August 14, 2025.
  source_ids: [v3-card, v3-report]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    The card lists speech-to-text uses such as conversational AI, voice assistants,
    transcription services, subtitle generation, and voice analytics, and documents long-form
    transcription with a local-attention mode (up to three hours of audio).
  source_ids: [v3-card]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-headquarters
