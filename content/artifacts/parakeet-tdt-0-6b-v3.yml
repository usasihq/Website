    the card, and announced in NVIDIA's NeMo Speech repository. NVIDIA's principal executive
    offices are in Santa Clara, California, per its Form 10-Q for the quarter ended July 26,
    2026. Third-party models used to label training data are recorded under provenance.
  source_ids: [v3-card, nemo-speech-readme, nvidia-10q-q2fy2027]
  assessed_at: 2026-10-01
