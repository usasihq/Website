license_notes:
  text: >-
    The card's governing terms put the model under CC-BY-4.0, which grants a worldwide,
    royalty-free license to reproduce, share, and adapt the material and requires attribution and
    license notices when sharing it; the card also states the model is ready for commercial and
    non-commercial use. The NeMo toolkit used to run and train it is a separate Apache 2.0
    repository.
  source_ids: [v3-card, cc-by-4-0, nemo-speech-license]
  reviewed_at: 2026-10-01
checklist:
  weights:
    status: public
    note: The ungated repository holds safetensors and .nemo checkpoints plus a q8_0 GGUF file.
    source_ids: [v3-api]
    reviewed_at: 2026-10-01
  inference_code:
    status: public
    note: >-
      The card documents inference with NVIDIA NeMo, the NeMo-Speech.cpp C++ runtime, and
      Hugging Face Transformers, including timestamps, long-form, and streaming examples.
    source_ids: [v3-card, nemo-speech-license]
    reviewed_at: 2026-10-01
  training_code:
    status: public
    note: >-
      The card links the NeMo transducer training script and FastConformer hybrid TDT-CTC
      configuration it was trained with; both are in the Apache 2.0 NeMo Speech repository.
    source_ids: [v3-card, nemo-train-script, nemo-tdt-config, nemo-speech-license]
    reviewed_at: 2026-10-01
  training_data_information:
    status: partial
    note: >-
      The card describes about 660,000 hours of pseudo-labeled Granary data (from YTC, MOSEL, and
      YODAS) and about 10,000 hours of human-transcribed NeMo ASR Set 3.0 data, listing the
      component corpora; the Granary card and paper describe the labeling pipeline. This review
      confirms disclosure, not completeness across every provenance, labeling, and processing
      requirement.
    source_ids: [v3-card, granary-card, granary-paper]
    reviewed_at: 2026-10-01
  training_data_access:
    status: partial
    note: >-
      Granary is published as CC-BY-4.0 transcript manifests that point to separately downloaded
      source audio; NeMo ASR Set 3.0 is described as an in-house set, and access terms for its
      component corpora were not reviewed.
    source_ids: [granary-card, v3-card]
    reviewed_at: 2026-10-01
  training_recipe:
    status: partial
    note: >-
      The card gives the initialization (an NVIDIA CTC multilingual checkpoint pretrained on
      Granary), step counts and GPU counts for both stages, temperature-based data balancing, and
      the tokenizer setup; the recipe for the initial checkpoint is not described there.
    source_ids: [v3-card]
    reviewed_at: 2026-10-01
  evaluation_materials:
    status: partial
    note: The card publishes word error rates on FLEURS, MLS, CoVoST, and Open ASR Leaderboard datasets; evaluation scripts were not verified.
    source_ids: [v3-card]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The card lists NeMo 2.4 as the runtime, Linux as the supported operating system, and NVIDIA
      Volta, Ampere, Hopper, and Blackwell GPUs as compatible, and shows a local NeMo-Speech.cpp
      workflow using the q8_0-quantized GGUF file.
    source_ids: [v3-card]
    reviewed_at: 2026-10-01
provenance:
  text: >-
    Trained by NVIDIA from an NVIDIA CTC multilingual checkpoint pretrained on Granary. Granary
    was built by the NVIDIA NeMo team with CMU and FBK teams; its card says transcripts were
    pseudo-labeled with Whisper-large-v3 and that punctuation and capitalization were restored
    with Qwen-2.5-7B, both third-party models. No third-party model weights are documented as
    part of this checkpoint.
  derived_from: []
  source_ids: [v3-card, granary-card]
