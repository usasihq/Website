summary:
  text: >-
    TRL is Hugging Face's open-source library for post-training transformer language models.
    It provides trainer classes for methods including supervised fine-tuning (SFT), Group
    Relative Policy Optimization (GRPO), Direct Preference Optimization (DPO), KTO, and reward
    modeling, with further methods marked experimental, and it is built on the Transformers
    library.
  source_ids: [trl-docs, trl-readme]
useful_for:
  text: >-
    Fine-tuning and aligning language models on custom datasets, from a single GPU to multi-node
    setups, including parameter-efficient training through PEFT (LoRA/QLoRA) and a command-line
    interface for training without writing code.
  source_ids: [trl-readme]
