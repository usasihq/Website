summary:
  text: >-
    OpenVINO is Intel's open-source toolkit for converting, optimizing, and running deep
    learning models, including language and generative models. It converts models from PyTorch,
    TensorFlow, ONNX, PaddlePaddle, JAX, and other frameworks and runs inference on CPUs (x86 and
    ARM), Intel GPUs, and Intel NPUs, with APIs in C++, Python, C, and Node.js.
  source_ids: [readme, intel-page]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Running models on local Intel hardware (CPU, integrated or discrete GPU, or NPU), including
    LLM and other generative AI pipelines through the companion OpenVINO GenAI library.
  source_ids: [readme, sysreq]
  reviewed_at: 2026-10-01
