run_notes:
  - text: >-
      The system requirements say GPU and NPU use requires drivers that are not included in the
      OpenVINO package.
    source_ids: [sysreq]
    reviewed_at: 2026-10-01
  - text: >-
      OpenVINO collects performance and usage data, including through Google Analytics 4; the
      README documents opting out with `opt_in_out --opt_out`.
    source_ids: [readme]
    reviewed_at: 2026-10-01
