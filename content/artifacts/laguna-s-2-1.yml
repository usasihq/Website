summary:
  text: >-
    Laguna S 2.1 is a mixture-of-experts model with 118B total and about 8B active
    parameters per token, built for agentic coding. It has 48 layers mixing global
    and sliding-window attention, 256 routed experts plus one shared expert, and a
    1,048,576-token context window, with reasoning that can be switched on or off
    per request.
  source_ids: [hf-laguna-s-2-1]
useful_for:
  text: >-
    Poolside documents it for long-running coding and research tasks with extended
    tool use, and for running an open-weight model locally on high-memory hardware.
  source_ids: [poolside-model-release-notes]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Developed and published by Poolside, Inc., which states that it is headquartered
    in San Francisco and trains its models from scratch on its own data and
    infrastructure. See the poolside organization record for the assessment of its
    French presence.
  source_ids: [poolside-laguna-s-release, hf-laguna-s-2-1]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: Weights download from Hugging Face without an access gate. Also served through the Poolside API and OpenRouter.
  source_ids: [hf-laguna-s-2-1, poolside-laguna-s-release]
