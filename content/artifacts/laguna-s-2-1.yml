checklist:
  weights:
    status: public
    note: BF16 weights are in the ungated repository; FP8, NVFP4, INT4, and GGUF variants are published as separate repositories.
    source_ids: [hf-laguna-s-2-1]
  inference_code:
    status: public
    note: The repository includes modeling code (modeling_laguna.py), and the model card documents vLLM, SGLang, TensorRT-LLM, llama.cpp, and Ollama.
    source_ids: [hf-laguna-s-2-1, laguna-s-repo-files]
  training_code:
    status: unknown
    note: null
    source_ids: []
  training_data_information:
    status: partial
    note: >-
      The release blog says S 2.1 was pre-trained on exactly the same data as Laguna XS 2.1
      and describes post-training task sources (open-source repositories, internally
      synthesized tasks, and tasks acquired from external data vendors) at a high level. The
      pre-training data composition is not described for this release, and the data is not
      released.
    source_ids: [poolside-laguna-s-2-1-blog]
  training_recipe:
    status: partial
    note: >-
      The release blog describes the training at a high level: a scale-up of the Laguna XS
      family with training-code fixes and small recipe changes, an SFT stage partly using
      synthetic data, and reinforcement learning run in FP8 precision. The blog does not give
      hyperparameters or training configurations.
    source_ids: [poolside-laguna-s-2-1-blog]
  evaluation_materials:
    status: partial
    note: The model card publishes benchmark results, and Poolside publishes full evaluation trajectories.
    source_ids: [hf-laguna-s-2-1, laguna-s-trajectories]
run_notes:
  - text: >-
      The model card states that the BF16 checkpoint is roughly 236GB of weights and
      needs multiple GPUs, and that quantized variants reduce this. Its vLLM and
      SGLang examples use tensor parallelism of 4.
    source_ids: [hf-laguna-s-2-1]
  - text: >-
      llama.cpp support uses Poolside's llama.cpp fork (laguna branch); the model
      card notes that base support is under review upstream.
    source_ids: [hf-laguna-s-2-1]
provenance:
  text: >-
    Poolside states that it trains its models from scratch on its own data and
    infrastructure. The model card describes Laguna S 2.1 as sharing the Laguna
    family architecture recipe with Laguna XS 2.1 and Laguna M.1.
  derived_from: []
  source_ids: [poolside-laguna-s-release, hf-laguna-s-2-1]
