    response to a cease-and-desist notice.
  source_ids: [fineweb-card]
checklist:
  access:
    status: public
    note: >-
      The full dataset, per-snapshot subsets, and sample subsets are downloadable without
      gating; previous versions remain available on named branches.
    source_ids: [fineweb-card]
  provenance:
    status: public
    note: >-
      Every record keeps its Common Crawl snapshot, source URL, crawl date, and WARC file path,
      and the card lists the processing pipeline step by step.
    source_ids: [fineweb-card]
  documentation:
    status: public
    note: >-
      The dataset card, a NeurIPS 2024 Datasets and Benchmarks paper, and a runnable datatrove
      script that reproduces the processing pipeline are published; ablation models and
      evaluation results are also released.
    source_ids: [fineweb-card, fineweb-paper, datatrove-fineweb-script]
  licensing:
    status: public
    note: ODC-By 1.0 for the data, also subject to Common Crawl's Terms of Use.
    source_ids: [fineweb-card]
  stated_limitations:
    status: public
    note: >-
      The card states that despite URL filtering the data likely still contains toxic or
      harmful content and personal information, that email and public IP addresses were
      anonymized, and that code content is likely not prevalent.
    source_ids: [fineweb-card]
run_notes: []
provenance:
  text: >-
    Derived from Common Crawl web crawls. Hugging Face extracted text from the WARC files with
    Trafilatura, applied URL, English-language (fastText), and quality filters (Gopher, C4, and
    FineWeb-specific heuristics), deduplicated each snapshot separately with MinHash, and
    anonymized email and public IP addresses.
  derived_from:
    - name: Common Crawl
      artifact_slug: common-crawl-corpus
      url: https://commoncrawl.org/
      note: Source web crawls (snapshots from 2013 onward).
  source_ids: [fineweb-card, datatrove-fineweb-script]
