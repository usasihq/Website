summary:
  text: >-
    FineWeb is Hugging Face's English web-text pretraining dataset, built by extracting,
    filtering, and deduplicating pages from Common Crawl snapshots dating back to 2013. The card
    describes it as more than 18.5 trillion tokens (GPT-2 tokenizer), up from about 15 trillion
    at first release in April 2024; version 1.4.0 (July 2025) added the Common Crawl snapshots
    from January to June 2025. Hugging Face also published FineWeb-Edu, an educational subset.
  source_ids: [fineweb-card, fineweb-paper]
useful_for:
  text: >-
    The card describes it as a research artifact for pretraining large language models on
    public web data; each Common Crawl snapshot can be loaded separately, and 10B, 100B, and
    350B-token random samples are provided.
  source_ids: [fineweb-card]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    FineWeb is created and published by Hugging Face's HuggingFaceFW organization ("FineData"),
    which describes itself as part of the Hugging Face Science team, and it is processed with
    Hugging Face's datatrove library. Hugging Face's terms of service identify Hugging Face,
    Inc., a Delaware corporation, as the provider of its services, and its privacy policy states
    that the company is located in the United States; see the hugging-face organization record
    for the dual-country assessment. The underlying web data comes from the Common Crawl
    Foundation's crawls and is recorded under provenance.
  source_ids: [fineweb-card, hffw-org, hf-tos, hf-privacy]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Downloadable from the Hugging Face Hub without gating (via datasets, huggingface_hub, or
    datatrove). Use is also subject to Common Crawl's Terms of Use, per the card.
  source_ids: [fineweb-card]
