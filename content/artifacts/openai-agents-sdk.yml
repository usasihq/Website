    source_ids: [repo]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      Python 3.10 or newer. The README notes that the local Unix sandbox client supports macOS and
      Linux; on Windows it points to the Docker sandbox client or a hosted sandbox client.
    source_ids: [repo]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Reviewed Python SDK v0.22.3, marked Latest and published September 17, 2026; the
      JavaScript/TypeScript SDK's latest release at review was v0.18.0, published September 10,
      2026. This entry describes the project rather than one release.
    source_ids: [release, release-js]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The tracing documentation says tracing is enabled by default and can be turned off with the
      OPENAI_AGENTS_DISABLE_TRACING=1 environment variable, set_tracing_disabled(True), or a
      per-run setting; it is unavailable to organizations using OpenAI's APIs under a Zero Data
      Retention policy.
    source_ids: [docs-tracing]
    reviewed_at: 2026-10-01
  - text: >-
      The models documentation describes using non-OpenAI providers through an OpenAI-compatible
      base URL, a custom ModelProvider, per-agent model settings, and beta LiteLLM and any-llm
      adapters, and warns that features differ between providers. It does not document a specific
      local model runtime.
    source_ids: [docs-models]
    reviewed_at: 2026-10-01
