summary:
  text: >-
    The OpenAI Agents SDK is an open-source framework from OpenAI for building multi-agent
    workflows from agents, tools, handoffs, guardrails, and sessions, with built-in tracing. OpenAI
    describes it as a production-ready upgrade of its earlier Swarm experiment. The Python SDK has
    a separate JavaScript/TypeScript counterpart.
  source_ids: [repo, docs-home]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Building applications in which language-model agents call tools, hand tasks to other agents,
    and check inputs and outputs. The SDK is open-source client code that calls a model API:
    OpenAI's hosted models, which are not open, through the Responses or Chat Completions APIs by
    default, or other providers through OpenAI-compatible endpoints, custom model providers, and
    beta adapters. It does not include model weights.
  source_ids: [repo, docs-models]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Both SDKs are developed in OpenAI's GitHub organization, their LICENSE files assign copyright to
    OpenAI, and the documentation is published by OpenAI. OpenAI Group PBC, a Delaware public
    benefit corporation, gives a San Francisco, California address in a February 2026 agreement
    filed with the SEC. See the openai organization record.
  source_ids: [repo, repo-js, license, license-js, docs-home, sec-openai-amazon-ecl]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code is public and the Python package installs from PyPI (openai-agents). The README's
    examples require an OPENAI_API_KEY, and OpenAI's hosted models are not open. Tracing is enabled
    by default and sends traces to OpenAI's Traces dashboard unless disabled.
  source_ids: [repo, docs-tracing]
  reviewed_at: 2026-10-01
