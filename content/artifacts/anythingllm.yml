run_notes:
  - text: >-
      AnythingLLM collects anonymous usage telemetry; the README says it can be turned off by
      setting DISABLE_TELEMETRY to true or in the app's privacy settings.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  - text: >-
      The README lists a native embedder and built-in audio transcription as defaults, and
      supports any llama.cpp-compatible open model for local text generation.
    source_ids: [readme]
    reviewed_at: 2026-10-01
