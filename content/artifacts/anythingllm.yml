summary:
  text: >-
    AnythingLLM is an application for chatting with documents and building AI agents on top of
    local or hosted language models. It is available as a desktop app for macOS, Windows, and
    Linux and as a multi-user Docker version, with connectors to many model providers and
    vector databases.
  source_ids: [readme, docs-intro, download]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Private chat over local documents and no-code agent workflows, using models run on the same
    machine or served by local tools such as Ollama and LM Studio.
  source_ids: [readme, docs-intro]
  reviewed_at: 2026-10-01
