license_notes:
  text: >-
    Custom non-commercial license (headed October 17, 2023). It bars use for real-world
    vehicle operation or its development, testing real vehicles, commercial driving
    simulation, production systems, or other primarily commercial purposes; unmodified copies
    may not be redistributed, though research results and derivative work may be shared with
    a required notice that passes the terms on. The license also forbids using the Waymax
    code or documentation to train or improve AI foundation models. The license field in
    setup.py's package metadata reads Apache-2.0, but the header of setup.py itself and the
    LICENSE file apply the non-commercial agreement.
  source_ids: [waymax-license, waymax-setup]
