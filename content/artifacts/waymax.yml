summary:
  text: >-
    Waymax is a multi-agent driving simulator written in JAX that builds scenarios from the
    Waymo Open Motion Dataset and represents road users as bounding boxes rather than raw
    sensor data. It includes data loading, visualization, metrics, simulated agents, and
    adapters to reinforcement learning interfaces such as dm-env and Brax.
  source_ids: [waymax-readme, waymax-paper]
useful_for:
  text: >-
    Documented for autonomous driving behavior research, including closed-loop simulation
    for planning and simulated-agent research and open-loop behavior prediction, on GPUs or
    TPUs; a tutorial covers preparing Waymo Open Sim Agents Challenge submissions.
  source_ids: [waymax-readme]
