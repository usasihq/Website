run_notes:
  - text: >-
      On first use of an encoding, tiktoken downloads its file from the address in
      openai_public.py and caches it in the system's temporary directory; setting the
      TIKTOKEN_CACHE_DIR environment variable chooses another cache location.
    source_ids: [ tk-openai-public, tk-load ]
