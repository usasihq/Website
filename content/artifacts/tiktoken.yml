summary:
  text: >-
    tiktoken is OpenAI's open-source byte pair encoding (BPE) tokenizer for use with OpenAI's
    models. It converts text to the token numbers a model sees and back, using named encodings
    such as o200k_base and cl100k_base, and can return the encoding that corresponds to a given
    OpenAI model name. It also includes an educational submodule for training and visualizing a
    simple BPE tokenizer, and a plugin mechanism for registering other encodings.
  source_ids: [ tk-readme, tk-openai-public ]
  reviewed_at: 2026-10-08
useful_for:
  text: >-
    Counting or inspecting the tokens that a piece of text becomes for an OpenAI model, and
    learning how BPE tokenization works. The README links an OpenAI Cookbook notebook on counting
    tokens with tiktoken.
  source_ids: [ tk-readme ]
  reviewed_at: 2026-10-08
