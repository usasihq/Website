license_notes:
  text: >-
    Custom Liquid AI license (card license field "lfm1.0") modeled on Apache 2.0. It grants
    perpetual, royalty-free copyright and patent licenses, requires redistributors to include
    the license and mark modified files, and ends patent rights for anyone who files patent
    litigation over the work. Section 5 makes commercial rights conditional on the licensee's
    legal entity not exceeding a "Threshold" defined as annual revenue of US$10,000,000 or more,
    and states that commercial use by a legal entity that exceeds the Threshold is not licensed.
    The Threshold does not apply to a qualified non-profit organization's use for non-commercial
    or research purposes. Liquid's license page FAQ says fine-tuned models may be kept
    proprietary and that hosting platforms may host and distribute the models.
  source_ids: [lfm25-24b-license-file, liquid-lfm-license]
checklist:
  weights:
    status: public
    note: >-
      Ungated safetensors weights on Hugging Face; a base checkpoint and FP8, GGUF, ONNX, and
      MLX 4-bit versions are published as separate repositories.
    source_ids: [mc-lfm25-24b-a2b, lfm25-24b-blog]
  inference_code:
    status: public
    note: >-
      The model card documents inference with Hugging Face Transformers (5.0.0 or later), vLLM,
      SGLang, llama.cpp, MLX, and LM Studio, and gives setup examples for several agent harnesses;
      no custom modeling code is needed in the repository.
    source_ids: [mc-lfm25-24b-a2b]
  training_code:
    status: unknown
    note: >-
      No training code release was found in the model card or release post. Liquid documents
      fine-tuning with third-party tools (Unsloth, TRL), which is not training code for this
      release.
    source_ids: []
  legacy_training_data_information:
    status: unknown
    note: >-
      The model card and release post give token budgets (about 33T pretraining tokens plus
      mid-training phases) and broad data emphases, but do not describe data sources or
      composition.
    source_ids: []
  training_recipe:
    status: partial
    note: >-
      The model card and release post describe the stages at a high level: pretraining, two
      mid-training phases (2T tokens at 32K context, then 300B tokens at 131K context), and a
      five-stage post-training pipeline of supervised fine-tuning, teacher specialization, two
      on-policy distillation stages, and agentic reinforcement learning inside agent harnesses.
      Hyperparameters and data mixes are not given.
    source_ids: [mc-lfm25-24b-a2b, lfm25-24b-blog]
  evaluation_materials:
    status: partial
    note: >-
      The model card and release post report benchmark tables and the release post lists
      generation settings used; evaluation code or prompts are not linked.
    source_ids: [mc-lfm25-24b-a2b, lfm25-24b-blog]
run_notes:
  - text: >-
      The model card recommends temperature 0.1, top_k 50, and repetition_penalty 1.05, and
      shows Transformers loading in bfloat16. It lists a DSpark speculative-decoding drafter for
      SGLang as coming soon.
    source_ids: [mc-lfm25-24b-a2b]
