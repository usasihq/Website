summary:
  text: >-
    A text-only reasoning mixture-of-experts model with 24.0B total and 2.45B active parameters,
    built from 30 double-gated short-convolution blocks and 10 grouped-query attention blocks,
    with 64 experts per MoE block and top-4 routing. It keeps the LFM2-24B-A2B architecture but
    extends the context window to 131,072 tokens and doubles the vocabulary to 128,000 tokens;
    unlike its predecessor, it always writes a chain of thought before answering. Liquid AI
    describes it as the final model in the LFM2.5 family.
  source_ids: [mc-lfm25-24b-a2b, lfm25-24b-blog]
useful_for:
  text: >-
    The model card recommends it for on-device agents that reason and call tools, and says it is
    not recommended on its own for knowledge-heavy tasks, suggesting it be paired with retrieval
    or web search instead.
  source_ids: [mc-lfm25-24b-a2b, lfm25-24b-blog]
