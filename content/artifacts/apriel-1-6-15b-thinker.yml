summary:
  text: >-
    A multimodal reasoning model of about 15B parameters that accepts text and images and
    writes its reasoning steps before a marked final answer. ServiceNow released it in
    December 2025 as an update to Apriel-1.5-15b-Thinker, with further continual pretraining,
    supervised fine-tuning, and reinforcement learning aimed partly at shorter reasoning.
  source_ids: [apriel-1-6-card, apriel-1-6-blog, hf-api-apriel-1-6]
useful_for:
  text: >-
    The card lists code assistance and generation, logical and multi-step reasoning, question
    answering and information retrieval, function calling, complex instruction following, and
    agent use cases. It says the model is not intended for safety-critical applications
    without human oversight.
  source_ids: [apriel-1-6-card]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The model is published by ServiceNow's ServiceNow-AI organization on Hugging Face and
    described as part of ServiceNow's Apriel series. ServiceNow, Inc. is a Delaware
    corporation headquartered in Santa Clara, California, per its 2025 Form 10-K. The
    Apriel 1.5 line it builds on started from Pixtral-12B-Base-2409, published by Mistral AI;
    that base model is recorded under provenance and is not treated as U.S.-developed.
  source_ids: [apriel-1-6-card, now-10k-2025, apriel-1-5-paper]
  assessed_at: 2026-09-29
availability:
