  source_ids: [apriel-1-6-card, hf-api-apriel-1-6]
checklist:
  weights:
    status: public
    note: Safetensors weights are downloadable from Hugging Face; a GGUF conversion is published in a separate repository.
    source_ids: [apriel-1-6-card, hf-api-apriel-1-6, hf-servicenow-ai]
  inference_code:
    status: public
    note: >-
      The model card gives inference code for Hugging Face Transformers and a vLLM server
      command with Apriel tool-call and reasoning parsers.
    source_ids: [apriel-1-6-card]
  training_code:
    status: partial
    note: >-
      The card names Fast-LLM and VERL as the training stack. Fast-LLM is ServiceNow's public
      training library (Apache 2.0), but this catalog did not find the Apriel-1.6 training
      configurations published.
    source_ids: [apriel-1-6-card, fast-llm-repo]
  training_data_information:
    status: partial
    note: >-
      The card and blog describe data categories (math, code, science, logical reasoning,
      multimodal image-text data, 2.4M SFT samples, synthetic data, and a share of NVIDIA
      Nemotron datasets in the upscaling mix). The training datasets themselves are not
      documented as released.
    source_ids: [apriel-1-6-card, apriel-1-6-blog]
  training_recipe:
    status: partial
    note: >-
      The card and blog outline the stages (depth-upscaling and continual pretraining, text
      then multimodal SFT, and multi-stage RL with GSPO) at a high level.
    source_ids: [apriel-1-6-card, apriel-1-6-blog]
  evaluation_materials:
    status: partial
    note: >-
      The card publishes a results table; some text benchmark scores are taken from
      Artificial Analysis and the rest were evaluated internally. No evaluation code for this
      release was found.
    source_ids: [apriel-1-6-card]
run_notes:
  - text: >-
      The model card documents inference with Hugging Face Transformers in bfloat16 and a
      vLLM OpenAI-compatible server with a 131,072-token maximum model length, and
      recommends a temperature of 0.6. It says the vLLM parsers were not yet merged upstream
      at the time and points to a custom Docker image.
    source_ids: [apriel-1-6-card]
  - text: >-
      The card lists Together AI for hosted inference and Ollama for local use as additional
      options.
    source_ids: [apriel-1-6-card]
provenance:
  text: >-
    Apriel-1.6-15b-Thinker builds on ServiceNow's Apriel-1.5-15b-Thinker. The Apriel 1.5
    report says that model started from Mistral AI's Pixtral-12B-Base-2409 (using a copy
    hosted by Unsloth), which ServiceNow depth-upscaled from 40 to 48 decoder layers before
    continued pretraining. The base weights were therefore not developed by ServiceNow.
  derived_from:
    - name: Apriel-1.5-15b-Thinker
      artifact_slug: null
      url: https://huggingface.co/ServiceNow-AI/Apriel-1.5-15b-Thinker
      note: Direct predecessor; no separate catalog record.
    - name: Pixtral-12B-Base-2409 (Mistral AI)
      artifact_slug: null
      url: https://huggingface.co/mistralai/Pixtral-12B-Base-2409
      note: Starting checkpoint of the Apriel 1.5 line; Apache 2.0.
  source_ids: [apriel-1-6-card, apriel-1-6-blog, apriel-1-5-paper, pixtral-card]
