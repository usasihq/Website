summary:
  text: >-
    Hermes is Nous Research's series of post-trained language models, each built on a base model
    released by another developer. Releases listed by Nous include Nous-Hermes Llama 2 13B (July
    2023), Hermes 2 models on Mistral, Mixtral, Yi, and Llama 3 bases (2023 to 2024), Hermes 3 on
    Llama 3.1 (August 2024), Hermes 4 at 405B, 70B, and 14B (August 2025), and Hermes 4.3 36B
    (December 2025). Hermes 4 and 4.3 are hybrid reasoning models that can answer directly or
    reason in think tags first.
  source_ids: [nous-releases, nous-hf-models, hermes4-report-pdf, mc-hermes-4-3-36b]
useful_for:
  text: >-
    Nous describes the Hermes 4 line as general assistants with optional reasoning, function
    calling and tool use, and structured outputs that follow a given JSON schema, and says it
    trained them to be easier to steer, with reduced refusal rates.
  source_ids: [mc-hermes-4-70b, hermes4-report-pdf]
