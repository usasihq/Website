provenance:
  text: >-
    Every Hermes release is a fine-tune of another developer's base model. Hermes 4 405B and 70B
    start from Meta's Llama 3.1 405B and 70B, Hermes 4 14B from Qwen3 14B, and Hermes 4.3 36B
    from ByteDance Seed's Seed-OSS-36B-Base. Earlier generations used Llama 2, Mistral 7B,
    Mixtral 8x7B, Yi 34B, Llama 3, and Llama 3.1 bases. Nous Research's own work is the
    post-training data, the fine-tuning, and (for Hermes 4.3) decentralized training on Psyche.
  derived_from:
