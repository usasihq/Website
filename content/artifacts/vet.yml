checklist:
  source_code:
    status: public
    note: Public repository in the imbue-ai GitHub organization.
    source_ids: [ vet-repo ]
    reviewed_at: 2026-10-02
  documentation:
    status: public
    note: >-
      The README covers installation, CLI usage, the agent skill, the GitHub Action, custom model
      configuration, the model registry, and configuration profiles; Imbue's product page gives an
      overview.
    source_ids: [ vet-repo, imbue-vet-page ]
    reviewed_at: 2026-10-02
  installation:
    status: public
    note: >-
      Installable with pip, pipx, or uv from PyPI; the agent skill installs through a script or
      manual steps described in the README.
    source_ids: [ vet-repo, vet-pypi ]
    reviewed_at: 2026-10-02
  supported_platforms:
    status: partial
    note: >-
      The package requires Python 3.11 or later and is classified for Python 3.11 to 3.13; the
      README documents use with Anthropic, OpenAI, and Gemini models, OpenAI-compatible endpoints,
      and the Claude Code, Codex, and OpenCode harnesses. Supported operating systems are not
      stated.
    source_ids: [ vet-pypi, vet-repo ]
    reviewed_at: 2026-10-02
  release_status:
    status: public
    note: >-
      Versioned releases are published on GitHub and PyPI; the latest at review was v0.2.16
      (September 14, 2026). PyPI classifies the project as beta.
    source_ids: [ vet-releases, vet-pypi ]
    reviewed_at: 2026-10-02
run_notes:
  - text: >-
      The README warns that the --history-loader option runs the specified shell command as the
      current user to load conversation history, and advises reviewing such commands and shared
      configuration presets before use.
    source_ids: [ vet-repo ]
    reviewed_at: 2026-10-02
