summary:
  text: >-
    Vet is an open-source tool from Imbue that uses a language model to review code changes and
    the conversation history of coding agents, flagging likely bugs and places where an agent's
    actions diverge from what the user asked for. It runs from the terminal, as an installable
    agent skill, or as a GitHub Action on pull requests, and works with the user's own model
    provider keys.
  source_ids: [ vet-repo, imbue-vet-page ]
  reviewed_at: 2026-10-02
useful_for:
  text: >-
    Checking work produced by coding agents such as Claude Code, Codex, or OpenCode before
    merging, for example catching an agent that reports passing tests it did not run, and adding
    model-based review to pull requests in CI.
  source_ids: [ vet-repo, imbue-vet-page ]
  reviewed_at: 2026-10-02
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Vet is published in Imbue's imbue-ai GitHub organization, which GitHub shows as verified for
    the imbue.com domain, and its PyPI package (verify-everything) lists Imbue as author. Imbue,
    Inc. is a San Francisco, California company (see the Imbue record). No outside governance is
    documented.
  source_ids: [ vet-repo, vet-pypi, imbue-github, imbue-website-terms, imbue-careers ]
  assessed_at: 2026-10-02
availability:
  status: public
  access_conditions: >-
    Source code is on GitHub and the CLI is on PyPI as verify-everything. Reviews require access
    to a language model, either through the user's own API keys or through an existing Claude
    Code, Codex, or OpenCode setup; the README says Vet needs no account and collects no data.
  source_ids: [ vet-repo, vet-pypi ]
  reviewed_at: 2026-10-02
