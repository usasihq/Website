summary:
  text: >-
    Lemonade is a local AI server that runs language, speech, and image-generation models on a
    PC's CPU, GPU, or NPU and exposes them through OpenAI-, Anthropic-, and Ollama-compatible
    APIs. It is also offered as an embeddable binary for applications, and it supports several
    inference engines, including llama.cpp and engines for AMD Ryzen AI NPUs.
  source_ids: [readme]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Serving local models to existing applications through standard APIs, with backends for AMD
    Ryzen AI NPUs and Radeon GPUs as well as NVIDIA GPUs, Apple Silicon, and CPU-only systems.
  source_ids: [readme]
  reviewed_at: 2026-10-01
eligibility:
  status: pending_review
  basis: undetermined
  explanation: >-
    The README describes Lemonade as a community project with many maintainers, built with
    optimizations by AMD engineers and sponsored by AMD, and AMD's developer site calls it an
    open-source project backed by AMD. The LICENSE names "Lemonade Community" as copyright
    holder, and the maintainer list names individual GitHub accounts rather than an
    organization. No document reviewed names AMD or another entity as the project's governing
    or maintaining organization, so the U.S. basis is unresolved; sponsorship alone is not
    treated as governance. AMD's role is recorded as a relationship.
  source_ids: [readme, contribute, license, amd-article]
  assessed_at: 2026-10-01
