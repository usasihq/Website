  installation:
    status: public
    note: >-
      Install guides for Windows, Linux, macOS, Docker, and source builds; packages are built for
      Windows (.msi), macOS (.pkg), Debian and Ubuntu, Fedora, Arch Linux, and Snap.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      The README's backend matrix lists llama.cpp on CPU, Vulkan, ROCm, CUDA (NVIDIA Turing or
      newer), and Metal (Apple Silicon), and NPU engines for AMD XDNA2 NPUs on Windows and Linux,
      with each engine's supported operating systems.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Reviewed release v2026.40.0, published September 30, 2026; release candidates are also
      published. This entry describes the project rather than one release.
    source_ids: [release]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The README shows the lemonade CLI listing, pulling, and running models (for example a Gemma
      4 E2B GGUF build) and listing the backends available on the PC.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  - text: >-
      The README says the program does not transfer information to other networked systems
      unless requested, and that model downloads contact Hugging Face or ModelScope depending on
      the model source.
    source_ids: [readme]
    reviewed_at: 2026-10-01
provenance:
  text: >-
    Lemonade uses llama.cpp, whisper.cpp, stable-diffusion.cpp, ONNX Runtime GenAI, and other
    projects as inference engines, per its README.
  derived_from:
    - name: llama.cpp
      artifact_slug: llama-cpp
      url: https://github.com/ggml-org/llama.cpp
      note: Text-generation engine (llamacpp backends).
    - name: ONNX Runtime GenAI
      artifact_slug: null
      url: https://github.com/microsoft/onnxruntime-genai
      note: Listed among the tools Lemonade builds on.
  source_ids: [readme]
