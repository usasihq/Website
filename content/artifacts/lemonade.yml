run_notes:
  - text: >-
      The README shows the lemonade CLI listing, pulling, and running models (for example a Gemma
      4 E2B GGUF build) and listing the backends available on the PC.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  - text: >-
      The README says the program does not transfer information to other networked systems
      unless requested, and that model downloads contact Hugging Face or ModelScope depending on
      the model source.
    source_ids: [readme]
    reviewed_at: 2026-10-01
provenance:
  text: >-
    Lemonade uses llama.cpp, whisper.cpp, stable-diffusion.cpp, ONNX Runtime GenAI, and other
    projects as inference engines, per its README.
  derived_from:
    - name: llama.cpp
      artifact_slug: llama-cpp
      url: https://github.com/ggml-org/llama.cpp
      note: Text-generation engine (llamacpp backends).
    - name: ONNX Runtime GenAI
      artifact_slug: null
      url: https://github.com/microsoft/onnxruntime-genai
      note: Listed among the tools Lemonade builds on.
  source_ids: [readme]
