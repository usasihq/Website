summary:
  text: >-
    Lemonade is a local AI server that runs language, speech, and image-generation models on a
    PC's CPU, GPU, or NPU and exposes them through OpenAI-, Anthropic-, and Ollama-compatible
    APIs. It is also offered as an embeddable binary for applications, and it supports several
    inference engines, including llama.cpp and engines for AMD Ryzen AI NPUs.
  source_ids: [readme]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Serving local models to existing applications through standard APIs, with backends for AMD
    Ryzen AI NPUs and Radeon GPUs as well as NVIDIA GPUs, Apple Silicon, and CPU-only systems.
  source_ids: [readme]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Lemonade's README says the project is sponsored by AMD, built with optimizations by AMD engineers,
    and gives an amd.com address as its contact. AMD's developer article calls Lemonade an open-source
    project backed by AMD and points readers to "our GitHub" and "our YouTube channel", presenting the
    project as AMD's own. AMD, a U.S. company in this catalog, is therefore treated as the documented
    maintaining entity. The README also describes many community maintainers, and the LICENSE names
    "Lemonade Community" as copyright holder; both are recorded. Eligibility does not rest on any
    contributor's affiliation or nationality.
  source_ids: [readme, amd-article, contribute, license]
  assessed_at: 2026-10-01
