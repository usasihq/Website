summary:
  text: >-
    Keras is an open-source deep learning API. Keras 3 is multi-backend: models can run on
    JAX, TensorFlow, or PyTorch, and an OpenVINO backend supports inference only. The keras.io
    site also documents KerasHub, which provides Keras 3 implementations of model
    architectures paired with pretrained checkpoints.
  source_ids: [keras-readme, keras-io-home]
useful_for:
  text: >-
    The README describes Keras 3 for building and training models across domains and scaling
    from a laptop to clusters of GPUs or TPUs, and as a drop-in replacement for tf.keras when
    using the TensorFlow backend.
  source_ids: [keras-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    A November 2024 Google for Developers blog post states that the Keras team at Google will
    continue to collaborate on the project in the open-source community and describes Google's
    continued investment in Keras 3.
    The contributing guide requires contributors to pass a Google Contributor License
    Agreement check (cla/google). Google's parent Alphabet Inc. has its principal executive
    offices in Mountain View, California, per its fiscal 2025 Form 10-K.
  source_ids: [google-blog-keras-2024, keras-contributing, alphabet-10k-2025]
  assessed_at: 2026-09-29
