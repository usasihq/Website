summary:
  text: >-
    Whisper large-v3 is a 1550M-parameter multilingual speech recognition and translation model
    released by OpenAI in November 2023. It keeps the architecture of the earlier large models
    but uses 128 Mel frequency bins instead of 80 and adds a language token for Cantonese.
  source_ids: [v3-discussion, hf-whisper-large-v3, whisper-model-card]
useful_for:
  text: >-
    Multilingual transcription and translation of speech into English. The model card names AI
    researchers as the primary intended users, says the models may also serve developers as a
    speech recognition solution, and advises against non-consensual transcription, classifying
    people, and high-risk decision-making uses.
  source_ids: [whisper-model-card, hf-whisper-large-v3]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model was released by OpenAI in its openai/whisper repository and on its Hugging Face
    account. OpenAI Group PBC lists its address as 1455 3rd Street, San Francisco, California,
    in a February 2026 agreement filed with the SEC.
  source_ids: [whisper-model-card, v3-discussion, sec-openai-amazon-ecl]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Downloadable without gating from Hugging Face, and fetched automatically by the openai-whisper
    package when "large-v3" (or its alias "large") is loaded.
  source_ids: [hf-api-whisper-large-v3, whisper-init, v3-discussion]
licenses:
  - name: MIT License (openai/whisper repository)
    spdx: MIT
    url: https://github.com/openai/whisper/blob/main/LICENSE
    applies_to: weights-and-code
    source_ids: [whisper-license, whisper-repo-readme]
  - name: Apache License 2.0 (Hugging Face model card metadata)
    spdx: Apache-2.0
    url: https://huggingface.co/openai/whisper-large-v3
    applies_to: weights
    source_ids: [hf-whisper-large-v3, hf-api-whisper-large-v3]
license_notes:
  text: >-
    The sources disagree. The openai/whisper README states that Whisper's code and model weights
    are released under the MIT License, while the Hugging Face repository for large-v3 declares
    Apache-2.0 in its card metadata. Both are permissive licenses; this catalog records both
    rather than choosing one.
  source_ids: [whisper-repo-readme, hf-whisper-large-v3]
checklist:
  weights:
    status: public
    note: Published on Hugging Face without gating and downloadable through the openai-whisper package.
    source_ids: [hf-api-whisper-large-v3, whisper-init]
  inference_code:
    status: public
    note: >-
      The openai/whisper repository provides the inference code and command-line tool; the
      Hugging Face card documents inference with Transformers.
    source_ids: [whisper-repo-readme, hf-whisper-large-v3]
  training_code:
    status: unknown
    note: The repository covers inference and evaluation-data preparation; this review found no published training code.
    source_ids: [whisper-repo-readme]
  legacy_training_data_information:
    status: partial
    note: >-
      Trained on 1 million hours of weakly labeled audio and 4 million hours of audio
      pseudo-labeled with large-v2. The data is described but not released.
    source_ids: [v3-discussion, hf-whisper-large-v3]
  training_recipe:
    status: partial
    note: >-
      OpenAI states the model was trained for 2.0 epochs over this mixture and lists the
      architectural changes from large-v2; the original paper describes the general training
      approach. No training configuration is published.
    source_ids: [v3-discussion, whisper-paper]
  evaluation_materials:
    status: partial
    note: >-
      The README and release discussion report word and character error rates for large-v3 on
      Common Voice 15 and FLEURS. The repository documents how the paper's evaluation datasets
      were prepared, but no large-v3 evaluation scripts were located.
    source_ids: [whisper-repo-readme, v3-discussion, whisper-data-readme]
run_notes:
  - text: >-
      The Hugging Face card documents use through the Transformers speech-recognition pipeline,
      including chunked long-form transcription with 30-second chunks for large-v3; the
      openai-whisper package loads it by the name "large-v3".
    source_ids: [hf-whisper-large-v3, v3-discussion]
provenance:
  text: >-
    Trained by OpenAI. Part of its training data was pseudo-labeled with OpenAI's earlier Whisper
    large-v2 model.
  derived_from:
    - name: Whisper large-v2 (pseudo-labels)
      artifact_slug: null
      url: https://huggingface.co/openai/whisper-large-v2
      note: Used to pseudo-label 4 million hours of training audio; no separate catalog record.
  source_ids: [v3-discussion, hf-whisper-large-v3]
