summary:
  text: >-
    Dioptra is an open-source software test platform for assessing trustworthy characteristics
    of AI models, built by NIST's National Cybersecurity Center of Excellence and announced by
    NIST in July 2024.
    It runs as a set of containerized services with a REST API that can be used through a web
    interface or a Python client to design, run, and track experiments, and its README says it
    supports the Measure function of the NIST AI Risk Management Framework.
  source_ids: [dioptra-repo, dioptra-docs, dioptra-why, nist-dioptra-announcement]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    The README lists model testing during development, acquisition, or audits; tracking
    experiments in trustworthy-AI research; providing a common platform for evaluations and
    challenges; and red-teaming in a controlled environment. The documentation's motivating
    example is testing models against adversarial attacks and defenses.
  source_ids: [dioptra-repo, dioptra-why]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Dioptra is developed and published by NIST, a U.S. federal agency within the Department of
