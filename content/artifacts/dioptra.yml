checklist:
  source_code:
    status: public
    note: Public repository in NIST's usnistgov GitHub organization.
    source_ids: [dioptra-repo]
    reviewed_at: 2026-10-01
  documentation:
    status: public
    note: >-
      Documentation on pages.nist.gov covers the platform's motivation and architecture,
      setup, tutorials, how-to guides, and REST API and Python client references.
    source_ids: [dioptra-docs]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      Users pull versioned container images (or build them), generate a deployment folder from
      a cruft template, initialize it, and start the services with Docker Compose.
    source_ids: [dioptra-repo, dioptra-install]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: partial
    note: >-
      The installation guide recommends a Linux-based environment with Docker, Docker Compose,
      Python 3.11 or later, and Git, and the project publishes PyTorch and TensorFlow worker
      images for CPU and GPU. No detailed operating-system or processor-architecture support
      matrix was found.
    source_ids: [dioptra-install, dioptra-repo]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      The README gives the current release as 1.1.0, "with on-going improvements and
      development". Versions are published as Git tags (1.0.0 on July 26, 2024; 1.0.1 on
      October 28, 2024; 1.1.0 on February 19, 2026) rather than GitHub release entries.
    source_ids: [dioptra-repo, dioptra-tags]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The installation guide lists Docker and Docker Compose, Python 3.11 or later on the host,
      and Git as prerequisites, and recommends a Linux-based environment. GPU-enabled workers
      are an optional configuration.
    source_ids: [dioptra-install, dioptra-docs]
    reviewed_at: 2026-10-01
