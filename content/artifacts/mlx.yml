summary:
  text: >-
    MLX is an array framework for machine learning on Apple silicon from Apple machine learning
    research. It has a NumPy-like Python API plus C++, C, and Swift APIs, composable function
    transformations, lazy computation, and a unified memory model that shares arrays between the
    CPU and GPU.
  source_ids: [mlx-readme]
useful_for:
  text: >-
    Training and running machine learning models on Apple silicon, including language model
    inference and fine-tuning examples published in a companion examples repository.
  source_ids: [mlx-readme, mlx-docs]
