license_notes:
  text: >-
    The LICENSE is a three-clause BSD license naming Meta Platforms, Inc. and affiliates plus
    Arm, Qualcomm Innovation Center, Apple, MediaTek, NXP, Samsung Electronics, and Intel as
    copyright holders. The README notes that embedded toolchains, simulators, and target
    runtimes are installed separately; this entry does not cover them.
  source_ids: [license, readme]
  reviewed_at: 2026-10-01
checklist:
  source_code:
    status: public
    note: Public repository in the pytorch GitHub organization.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  documentation:
    status: public
    note: Official documentation covers getting started, edge platforms, hardware backends, and LLM export and deployment.
    source_ids: [docs]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      `pip install executorch` in Python 3.10 to 3.14, with wheels for Linux x86-64, Linux
      AArch64, macOS arm64, and Windows x86-64; an Android AAR on Maven Central, Apple frameworks
      through Swift Package Manager, and source builds are also documented.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      The README maps targets to backends: Android, iOS and iPadOS, macOS, Linux, Windows,
      browser/WebAssembly, and embedded microcontrollers, with backends including XNNPACK, Vulkan,
      Core ML, Qualcomm, MediaTek, Samsung Exynos, OpenVINO, Arm Ethos-U, NXP eIQ Neutron, and
      Cadence DSP. Several desktop and browser paths are marked experimental.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Reviewed release v1.5.1, published September 23, 2026. The README says it tracks main and
      points users to the latest release with the stable documentation.
    source_ids: [release, readme]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The README lists local LLM building blocks, including quantized text models, tool calling,
      speculative decoding, and an experimental OpenAI-compatible local server example.
    source_ids: [readme]
    reviewed_at: 2026-10-01
  - text: >-
      A .pte program exported for one hardware backend is not a universal model file; targeting
      Core ML, Qualcomm, or another accelerator requires that backend's dependencies and a
      separate export, per the README.
    source_ids: [readme]
    reviewed_at: 2026-10-01
