summary:
  text: >-
    ExecuTorch is PyTorch's open-source stack for running AI models on-device, from phones and
    laptops to embedded systems and microcontrollers. A model is captured with torch.export,
    lowered for selected hardware backends into a .pte program, and run through C++, Python,
    Swift/Objective-C, Kotlin/Java, or JavaScript APIs.
  source_ids: [readme, docs]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Deploying PyTorch models, including quantized language, speech, and vision models, to run
    locally on mobile, desktop, browser, and embedded targets using CPU, GPU, NPU, or DSP
    backends.
  source_ids: [readme]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    ExecuTorch is developed in the pytorch GitHub organization. Its LICENSE lists Meta Platforms,
    Inc. first among the copyright holders, and its contributing guide requires the contributor
    license agreement used for Meta's open-source projects. The PyTorch Foundation website lists
    ExecuTorch among its projects. Meta and the PyTorch Foundation's host, The Linux Foundation,
    are U.S.-based (see their records). Other companies named in the LICENSE contributed
    hardware-backend code; this assessment rests on Meta's documented role.
  source_ids: [license, contributing, readme, ptf-project-page]
  assessed_at: 2026-10-01
