provenance:
  text: >-
    The Zamba language models were pretrained by Zyphra on open web text and code, including
    its own Zyda dataset; the Zamba2 models use the Mistral v0.1 tokenizer. Zamba2-VL builds on the Zamba2
    language models and uses the vision encoder from Alibaba Cloud's Qwen2.5-VL.
