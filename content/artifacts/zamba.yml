summary:
  text: >-
    Zamba is Zyphra's series of hybrid models that combine Mamba state-space layers with
    shared transformer attention blocks. Releases include Zamba-7B (April 2024); Zamba2 at
    1.2B, 2.7B, and 7B parameters (July to October 2024), with instruction-tuned versions; and
    Zamba2-VL vision-language models at the same three sizes (June 2026).
  source_ids: [zyphra-research-index, zamba-blog, zamba2-7b-blog, zamba2-vl-blog]
useful_for:
  text: >-
    Zyphra presents the Zamba2 models as general-purpose models designed for fast inference
    and a small memory footprint, including on consumer hardware and on-device; Zamba2-VL adds
    image understanding, OCR, and document tasks.
  source_ids: [zamba2-7b-card, zamba2-vl-7b-card]
