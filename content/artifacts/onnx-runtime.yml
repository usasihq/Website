summary:
  text: >-
    ONNX Runtime is Microsoft's open-source, cross-platform engine for running and accelerating
    machine-learning models in the ONNX format. It runs models exported from frameworks such as
    PyTorch and TensorFlow/Keras and from classical libraries such as scikit-learn, LightGBM, and
    XGBoost, applying graph optimizations and hardware-specific execution providers; it also
    offers accelerated training for transformer models on NVIDIA GPUs.
  source_ids: [ort-readme, ort-pypi]
useful_for:
  text: >-
    Deploying trained models for inference on servers, desktops, mobile devices, and in web
    browsers, with bindings for Python, C#, C/C++, Java, JavaScript, Objective-C, and Kotlin.
  source_ids: [ort-install]
