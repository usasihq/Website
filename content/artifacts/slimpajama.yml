license_notes:
  text: >-
    The Cerebras announcement and the preprocessing README both state that SlimPajama is
    released under Apache 2.0. The Hugging Face dataset card, which may have documented further
    terms for the underlying RedPajama sources, could not be read because the repository was
    not accessible during this review.
  source_ids: [slim-blog, slim-readme, cerebras-hf-org]
checklist:
  access:
    status: not_public
    note: >-
      The official Hugging Face repository is no longer accessible and is not listed on
      Cerebras's organization page. Third-party documentation refers to a community re-upload,
      which is not maintained by Cerebras.
    source_ids: [cerebras-hf-org, hf-forum-slimpajama, oumi-pretraining-docs]
  provenance:
    status: public
    note: >-
      Derived from RedPajama (1.21T tokens): NFC normalization, removal of documents under 200
      characters after stripping punctuation and whitespace (1.86% of documents; not applied
      to Books and GitHub), and global MinHashLSH deduplication at a 0.8 Jaccard threshold on
      13-grams, within and across sources.
    source_ids: [slim-blog, slim-readme]
  documentation:
    status: public
    note: >-
      The announcement describes the pipeline and data composition; the step-by-step
      preprocessing README remains readable at the Release_2.10.0 tag of Cerebras's Model Zoo
      although it was removed from the main branch.
    source_ids: [slim-blog, slim-readme, modelzoo-removal-commit]
  licensing:
    status: partial
    note: Apache 2.0 is stated by Cerebras; the dataset card's licensing section could not be checked.
    source_ids: [slim-blog, slim-readme]
  stated_limitations:
    status: public
    note: >-
      The announcement notes possible distributional bias, as in RedPajama, and general risks
      of language models trained on such data, such as amplifying social stereotypes,
      memorizing training data, or revealing private information.
    source_ids: [slim-blog]
run_notes:
  - text: >-
      For Cerebras's own run, the preprocessing README reports that processing the 1.21T-token
      RedPajama dataset took about 2.5 days on a 64-core CPU machine, with peak RAM use of about
      1.4 TB in the duplicate-pair generation step; it notes that the single-script path is
      slower because some steps are not parallelized.
    source_ids: [slim-readme]
provenance:
  text: >-
    Built by Cerebras from Together's RedPajama dataset (1.21T tokens), with support from
    Opentensor, by filtering short documents and deduplicating across all of RedPajama's
    sources.
  derived_from:
    - name: RedPajama (RedPajama-Data-1T)
      artifact_slug: redpajama
      url: https://huggingface.co/datasets/togethercomputer/RedPajama-Data-1T
      note: Source dataset from Together; SlimPajama removed 49.6% of its bytes.
  source_ids: [slim-blog, slim-readme]
