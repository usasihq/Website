  cerebras/SlimPajama-627B Hugging Face repository returned HTTP 401 when checked on
  2026-09-29 and is not listed on Cerebras's Hugging Face organization, and on 2026-09-01 the
  SlimPajama preprocessing directory was removed from the main branch of Cerebras's Model Zoo
  repository. No official explanation was found.
