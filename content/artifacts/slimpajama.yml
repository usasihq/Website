summary:
  text: >-
    SlimPajama is a 627B-token pretraining dataset that Cerebras released in June 2023 by
    cleaning and deduplicating Together's 1.21T-token RedPajama dataset, removing 49.6% of its
    bytes. Cerebras also published validation and test sets and the preprocessing code. The
    official Hugging Face distribution is no longer available, and in September 2026 the
    preprocessing code was removed from the main branch of Cerebras's Model Zoo repository.
  source_ids: [slim-blog, slim-readme, cerebras-hf-org, modelzoo-removal-commit]
useful_for:
  text: >-
    Released for language model pretraining; the preprocessing scripts were published so that
    others could reproduce SlimPajama or apply the same normalization, filtering, and global
    deduplication to other trillion-token datasets.
  source_ids: [slim-blog, slim-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    SlimPajama was created and released by Cerebras, which published it under its own Hugging
    Face organization and Model Zoo repository; the blog credits Opentensor as a collaborator.
    Cerebras Systems Inc. is a Delaware corporation with principal executive offices in
    Sunnyvale, California, per its Form 10-Q for the quarter ended June 30, 2026.
  source_ids: [slim-blog, slim-readme, cerebras-10q-q2-2026]
  assessed_at: 2026-09-29
availability:
  status: not_public
  access_conditions: >-
    Cerebras distributed the dataset at huggingface.co/datasets/cerebras/SlimPajama-627B. That
    repository returned HTTP 401 (not found for anonymous access) when checked on 2026-09-29,
    and Cerebras's Hugging Face organization no longer lists it. A Hugging Face forum post dated
    August 1, 2026 reported the repository returning HTTP 404 (401 for anonymous API requests) on
    July 31, 2026, and third-party documentation states that it was removed from the Hub. No
    statement from Cerebras explaining the change was found.
  source_ids: [cerebras-hf-org, hf-forum-slimpajama, oumi-pretraining-docs]
