summary:
  text: >-
    A 10B-parameter text-to-video diffusion model built on Genmo's Asymmetric Diffusion
    Transformer (AsymmDiT) and released as a research preview in October 2024. It is paired
    with AsymmVAE, a 362M-parameter video autoencoder released alongside it, and encodes
    prompts with a single T5-XXL model. The initial release generates 480p video.
  source_ids: [mochi-repo, mochi-card, genmo-mochi-blog]
useful_for:
  text: >-
    Text-to-video generation for research and development. Genmo notes that the model is
    optimized for photorealistic styles and does poorly on animated content, and that minor
    warping can occur with extreme motion. The repository includes a LoRA trainer for
    fine-tuning on one's own videos.
  source_ids: [mochi-repo]
