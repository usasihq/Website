run_notes:
  - text: >-
      Genmo's README says single-GPU use of its own implementation needs about 60GB of VRAM
      and recommends at least one H100. Per the Diffusers documentation, that implementation
      runs the text encoder and VAE at float32 precision and the DiT in BF16.
    source_ids: [mochi-repo, diffusers-mochi]
  - text: >-
      The Diffusers documentation says the full-precision weights need at least 42GB of VRAM
      and the bfloat16 variant 22GB (with a slight quality drop), both with model CPU offload
      and VAE tiling enabled; it also shows 8-bit loading with bitsandbytes and splitting the
      transformer across two 24GB GPUs.
    source_ids: [diffusers-mochi]
provenance:
  text: >-
    Genmo states that Mochi 1 was trained entirely from scratch. Prompts are encoded with a
    single T5-XXL model; the Diffusers pipeline documents the google/t5-v1_1-xxl variant as
    the text encoder.
  derived_from: []
  source_ids: [mochi-repo, diffusers-mochi]
