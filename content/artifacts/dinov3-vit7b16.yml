checklist:
  weights:
    status: partial
    note: Approval-gated on Hugging Face (manual) and on Meta's download page.
    source_ids: [hf-api-dinov3-vit7b16, dinov3-readme]
  inference_code:
    status: public
    note: >-
      The repository loads backbones and heads through PyTorch Hub; the model card documents use
      with Hugging Face Transformers, which supports DINOv3 from version 4.56.0.
    source_ids: [dinov3-readme, hf-dinov3-vit7b16]
  training_code:
    status: public
    note: >-
      The repository publishes the training code with commands and configuration files for the
      exact ViT-7B/16 setup (pretraining, Gram anchoring, and high-resolution adaptation) and for
      multi-distillation.
    source_ids: [dinov3-readme]
  legacy_training_data_information:
    status: partial
    note: >-
      The model card describes LVD-1689M as 1,689 million images curated from a pool of 17
      billion web images from public Instagram posts. The README states that ViT-7B/16 was trained
      on a private dataset, which is not released.
    source_ids: [hf-dinov3-vit7b16, dinov3-readme]
  training_recipe:
    status: public
    note: >-
      Stage-by-stage configuration files for the ViT-7B/16 run are published, and the paper and
      model card describe the objectives and training procedure.
    source_ids: [dinov3-readme, hf-dinov3-vit7b16, dinov3-paper]
  evaluation_materials:
    status: public
    note: >-
      The repository publishes evaluation code and commands, including ImageNet-1k logistic
      regression, ADE20K linear segmentation, and NYUv2 linear depth probing.
    source_ids: [dinov3-readme]
run_notes:
  - text: >-
      The model card documents loading the model with Transformers' AutoModel and
      AutoImageProcessor using device_map="auto"; the README documents loading through PyTorch
      Hub from local weight files or the emailed download URLs.
    source_ids: [hf-dinov3-vit7b16, dinov3-readme]
