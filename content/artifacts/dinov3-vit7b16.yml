summary:
  text: >-
    The largest DINOv3 backbone: a 6.7-billion-parameter Vision Transformer with 16-pixel
    patches, trained by Meta with self-supervised learning (a DINO self-distillation loss and an
    iBOT masked-image-modeling loss) on LVD-1689M. Training ran in three stages: pretraining,
    Gram anchoring, and high-resolution adaptation.
  source_ids: [hf-dinov3-vit7b16, dinov3-readme, dinov3-paper]
useful_for:
  text: >-
    The model card lists use of frozen features for image classification with k-NN classifiers,
    retrieval, depth estimation and semantic segmentation with linear layers, unsupervised object
    discovery, and video segmentation tracking. It also reports performance differences across
    income levels and regions in a fairness analysis.
  source_ids: [hf-dinov3-vit7b16]
