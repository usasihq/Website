    Access requires a request and acceptance of the DINOv3 License. Through Meta's download page,
    approved users receive download URLs by email; the Hugging Face repository is gated with
    manual approval and asks users to share contact information.
  source_ids: [dinov3-readme, hf-dinov3-vit7b16, hf-api-dinov3-vit7b16]
