    The model card names Meta AI as the developer. Meta Platforms, Inc. has its principal
    executive offices in Menlo Park, California, per its Form 10-K. The DINOv3 License names Meta
    Platforms Ireland Limited as licensor for EEA and Swiss users and Meta Platforms, Inc. for
    everyone else.
  source_ids: [hf-dinov3-vit7b16, dinov3-license, meta-10k-2025]
  assessed_at: 2026-09-29
availability:
