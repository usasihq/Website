    note: null
    source_ids: []
  evaluation_materials:
    status: partial
    reviewed_at: 2026-10-11
    note: >-
      The repository includes evaluate_design.py with evaluation suites for five example
      reactions and example manifests that partially reproduce the paper's settings; the README
      says some settings were reduced relative to the paper.
    source_ids: [apn-readme]
run_notes:
  - text: >-
      The README recommends a Python 3.12 environment with JAX (CUDA 12, or CPU) and AlphaFold 3
      installed, plus an optional separate Python 3.11 PyTorch environment for LigandMPNN. The
      pipeline shards generation and folding across all visible GPUs on a single node. It
      states no GPU memory requirement.
    reviewed_at: 2026-10-11
    source_ids: [apn-readme, apn-pyproject]
