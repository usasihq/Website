summary:
  text: >-
    The pretrained AP Novo Generator weights, a single generator.bin.zst file that the
    alphaprotein-novo package (JAX) loads to co-generate protein structures and amino acid
    sequences conditioned on a catalytic motif and ligand context. The weights are not in the
    repository; the README gives a direct download from Google Cloud Storage.
  reviewed_at: 2026-10-11
  source_ids: [apn-readme, apn-pyproject, apn-weights-file]
useful_for:
  text: >-
    Generating candidate enzyme scaffolds for a specified catalytic motif in non-commercial
    research, either alone or as the first stage of the AP Novo pipeline.
  reviewed_at: 2026-10-11
  source_ids: [apn-readme, apn-weights-terms]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The repository is published in Google DeepMind's GitHub organization, its licensing section
    states copyright 2026 Google LLC, and the weights terms are an agreement with Google LLC
    (Google Ireland Limited for users in the EEA or Switzerland) under California law. See the
    google-deepmind organization record, which is assessed under U.S. control as part of Google.
  source_ids: [apn-readme, apn-weights-terms]
  assessed_at: 2026-10-11
availability:
  status: public
  reviewed_at: 2026-10-11
  access_conditions: >-
    Downloadable without sign-in from the Google Cloud Storage URL given in the README, under
    terms that allow only non-commercial use by or for non-commercial organizations and forbid
    republishing the weights. The terms also say Google may ask users to verify their name and
    organization.
  source_ids: [apn-readme, apn-weights-file, apn-weights-terms]
