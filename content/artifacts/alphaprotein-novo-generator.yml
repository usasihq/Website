license_notes:
  text: >-
    The README places the software under Apache 2.0, the generator weights under the AP Novo
    Generator Model Parameters Terms of Use (last modified 2026-10-05), generated designs under
    separate Output Terms of Use, and other materials under CC BY 4.0. The weights terms limit
    use to non-commercial work by or on behalf of non-commercial organizations, forbid
    publishing or sharing the weights outside the user's organization, forbid using outputs to
    train similar protein- or enzyme-design models, incorporate a prohibited use policy, and
    are revocable. The pipeline's AlphaFold 3 and AlphaFold 3 Leaving Atom weights are under
    the separate AlphaFold 3 model parameters terms, and LigandMPNN is under its own terms.
  reviewed_at: 2026-10-11
  source_ids: [apn-readme, apn-weights-terms, apn-output-terms]
checklist:
  weights:
    status: public
    reviewed_at: 2026-10-11
    note: >-
      A single compressed weights file downloadable from Google Cloud Storage without sign-in;
      use is restricted to non-commercial purposes by the weights terms.
    source_ids: [apn-readme, apn-weights-file, apn-weights-terms]
  inference_code:
    status: public
    reviewed_at: 2026-10-11
    note: >-
      The repository provides run_generator.py for the diffusion model and run_pipeline.py for
      the end-to-end pipeline. The README describes the repository as a port of the original
      Google-internal pipeline used for the paper.
    source_ids: [apn-readme]
  training_code:
    status: unknown
    reviewed_at: 2026-10-11
    note: The README covers generation, folding, and evaluation; no training code was found in it.
    source_ids: [apn-readme]
