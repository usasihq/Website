license_notes:
  text: >-
    Writer's card lists Apache 2.0 and does not mention the base model's license. NVIDIA's
    card for the base model, OpenReasoning-Nemotron-1.5B, says its use is governed by the
    Creative Commons Attribution 4.0 license (CC-BY-4.0) and links the Apache 2.0 license
    from a Qwen repository as additional information. The two licenses differ, and Writer's
    card does not explain how the base model's CC-BY-4.0 terms apply.
  source_ids: [palmyra-mini-thinking-b-card, nvidia-orn-card]
