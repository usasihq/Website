provenance:
  text: >-
    Fine-tuned by Writer from NVIDIA's OpenReasoning-Nemotron-1.5B. NVIDIA's card says that
    model was developed from Qwen2.5-1.5B (Alibaba Cloud's Qwen family) and post-trained on
    responses generated by DeepSeek-R1-0528.
  derived_from:
