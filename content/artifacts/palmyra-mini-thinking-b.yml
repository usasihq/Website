summary:
  text: >-
    A small reasoning model in Writer's Palmyra-mini family, released in September 2025. Writer
    built it on NVIDIA's OpenReasoning-Nemotron-1.5B and applied reinforcement-learning
    fine-tuning; the model card lists a 131,072-token context window.
  source_ids: [palmyra-mini-thinking-b-card, palmyra-mini-blog]
useful_for:
  text: >-
    Writer describes it as the Palmyra-mini variant aimed at mathematical reasoning; the card
    also highlights competitive programming problems.
  source_ids: [palmyra-mini-blog, palmyra-mini-thinking-b-card]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Published by Writer, Inc., which is headquartered in San Francisco per its company page
    and platform services agreement. Its base model is NVIDIA's OpenReasoning-Nemotron-1.5B,
    which NVIDIA's card describes as a derivative of Qwen2.5-1.5B from Alibaba Cloud's Qwen
    family; eligibility here rests on Writer as the developer of this fine-tune.
  source_ids: [palmyra-mini-thinking-b-card, writer-company, writer-psa, nvidia-orn-card, qwen-hf-org]
  assessed_at: 2026-09-29
