summary:
  text: >-
    Trinity is Arcee AI's family of sparse mixture-of-experts language models:
    Trinity Nano (6B total, about 1B active parameters), Trinity Mini (26B total, 3B
    active), and Trinity Large (about 398B total, 13B active). Trinity Large is
    published as base, pre-anneal base, preview, and reasoning-tuned Thinking
    checkpoints.
  source_ids: [arcee-trinity-page, trinity-tech-report, hf-trinity-large-thinking]
useful_for:
  text: >-
    Arcee positions Nano for edge and on-device use and Mini for cloud or on-premises
    deployment, and lists the Large models as offered through its cloud API, with
    Trinity-Large-Thinking aimed at tool-calling and multi-step agent workflows.
  source_ids: [arcee-trinity-page, hf-trinity-large-thinking]
