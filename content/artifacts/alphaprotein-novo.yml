summary:
  text: >-
    AlphaProtein Novo (AP Novo) is a Google DeepMind pipeline for designing new enzymes by
    scaffolding a structural catalytic motif. Its diffusion model, the AP Novo Generator,
    generates protein structures and sequences together, conditioned on the motif and ligand
    context; optional LigandMPNN sequence redesign, AlphaFold 3 structure prediction, and
    evaluation metrics complete the pipeline. The code and generator weights were published in
    October 2026 alongside a bioRxiv paper.
  reviewed_at: 2026-10-11
  source_ids: [apn-readme, apn-weights-terms, apn-commits]
useful_for:
  text: >-
    Non-commercial research on de novo enzyme design, starting from a 3D arrangement of
    side-chain and ligand atoms that represents a reaction's transition state or intermediate.
  reviewed_at: 2026-10-11
