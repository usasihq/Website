      Nightly wheels are also available.
    source_ids: [sglang-release, sglang-pypi, sglang-install]
run_notes:
  - text: >-
      The installation guide requires Python 3.10 or higher. It states that SGLang requires
      CUDA 13, that the CUDA 12 wheels and images are retired, and that 0.5.19 was the last
      release with CUDA 12 builds.
    source_ids: [sglang-install]
