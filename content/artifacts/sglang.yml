summary:
  text: >-
    SGLang is an open-source serving framework for large language models and multimodal models,
    designed for low-latency, high-throughput inference on anything from a single GPU to large
    distributed clusters. Its runtime features include RadixAttention prefix caching,
    prefill-decode disaggregation, speculative decoding, continuous batching, several forms of
    parallelism, structured outputs, and quantization.
  source_ids: [sglang-readme]
useful_for:
  text: >-
    Serving language, embedding, reward, and diffusion models behind an OpenAI-compatible API,
    and acting as the rollout backend in reinforcement-learning post-training frameworks.
  source_ids: [sglang-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The SGLang README states that the project is currently hosted under the non-profit
    open-source organization LMSYS. LMSYS describes itself as a 501(c)(3) nonprofit incorporated
    in September 2024. The IRS extract for California lists LMSYS Corp, in Sacramento, as a
    501(c)(3) corporation with a September 2024 ruling date. A July 2026 post on the LMSYS blog,
    credited to RadixArk and Google, also describes the company RadixArk as a maintainer; this
    assessment rests on LMSYS hosting, and RadixArk's location was not verified. SGLang joined the PyTorch Ecosystem in 2025, but the pages read
    do not describe it as a PyTorch Foundation-hosted project.
  source_ids: [sglang-readme, lmsys-about, irs-eo-bmf-ca, lmsys-tpu-blog, pytorch-sglang]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
