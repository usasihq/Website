  installation:
    status: public
    note: >-
      Documented methods include pip or uv, installing from source, Docker images, Kubernetes,
      and cloud deployment options.
    source_ids: [sglang-install]
  supported_platforms:
    status: public
    note: >-
      The install guide mainly covers NVIDIA GPUs and has separate pages for AMD GPUs, Apple
      Metal, Intel Xeon CPUs, Intel XPU, Google TPU, NVIDIA Jetson and DGX Spark, and Ascend
      NPUs.
    source_ids: [sglang-install, sglang-readme]
