summary:
  text: >-
    Molmo is Ai2's family of open vision-language models. The first release (September 2024)
    comprised MolmoE-1B, Molmo-7B-O, Molmo-7B-D, and Molmo-72B, trained with Ai2's PixMo data.
    Molmo 2 (December 2025) added video and multi-image understanding and grounding in 4B and 8B
    models built on Qwen3 and a 7B model (Molmo2-O-7B) built on Ai2's own Olmo 3. Ai2 has since
    built specialized variants on the line, including MolmoAct 2 for robot manipulation (May
    2026).
  source_ids: [ai2-molmo-blog, ai2-molmo2-blog, molmo2-paper, ai2-molmoact2-blog]
useful_for:
  text: >-
    Image, multi-image, and video question answering, captioning, counting, and pointing or
    tracking objects in images and video.
