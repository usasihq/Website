provenance:
  text: >-
    Molmo models pair a pretrained vision encoder with a pretrained language model and are
    trained on Ai2's own image and video datasets (PixMo for the first release, the Molmo2
    datasets for Molmo 2). Molmo2-4B and Molmo2-8B use the Qwen team's Qwen3 language models;
    Molmo2-O-7B uses Ai2's Olmo 3 7B Instruct; the Molmo 2 cards name SigLIP 2 (published under
    Google's Hugging Face organization) as the vision backbone.
