summary:
  text: >-
    JAX is a Python library for array computation and program transformation, including automatic
    differentiation, just-in-time compilation, and vectorization of NumPy-style code. It compiles
    programs with the XLA compiler to run on CPUs, GPUs, TPUs, and other accelerators.
  source_ids: [jax-repo, jax-pypi]
useful_for:
  text: >-
    The project describes JAX as designed for high-performance numerical computing and large-scale
    machine learning, and as a base for domain-specific libraries built on top of it.
  source_ids: [jax-repo, jax-about]
