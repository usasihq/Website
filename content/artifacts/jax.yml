  basis: us-governed-project
  explanation: >-
    JAX's documentation says the project is led by the JAX core team, that it follows Google's Open
    Source Community Guidelines, and that contributions require Google's Contributor License
    Agreement; the PyPI package lists the JAX team with a google.com contact address. The README
    calls JAX a research project rather than an official Google product. Google's parent Alphabet
    Inc. has its principal executive offices in Mountain View, California, per its fiscal 2025
    Form 10-K.
