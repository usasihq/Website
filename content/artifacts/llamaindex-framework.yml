summary:
  text: >-
    LlamaIndex is an open-source Python framework for building LLM agents, event-driven
    workflows, and retrieval-augmented generation (RAG) over private data. It is split into a
    core package and hundreds of integration packages for models, embeddings, and vector stores;
    the company also offers a TypeScript SDK. The README says the company now focuses mainly on
    its LlamaParse platform but keeps the framework available as an open toolkit.
  source_ids: [llamaindex-readme, llamaindex-docs-overview, llamaindex-oss-page]
useful_for:
  text: >-
    Building agents that use tools over a user's documents and data, multi-step workflows with
    branching, retries, and human review, and RAG pipelines that ingest data through connectors,
    index it, and query it.
  source_ids: [llamaindex-docs-overview, llamaindex-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The README attributes the framework to LlamaIndex, "the company behind LlamaParse", and the
    repository is under the company's run-llama GitHub organization. The developer docs describe
    it as built by the makers of LlamaParse. LlamaIndex, Inc. provides the company's services
    under Delaware law, and its 2025 press release boilerplate says it is based in San Francisco.
    The LICENSE file's copyright line names an individual rather than the company, and this
    assessment does not rely on it. No foundation or multi-organization governance body is
    documented.
  source_ids: [llamaindex-readme, llamaindex-docs-overview, llamaindex-tos, llamaindex-pr-2025, llamaindex-license]
