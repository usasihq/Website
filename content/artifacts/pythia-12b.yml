license_notes:
  text: >-
    The Pythia repository states its Apache 2.0 license applies to the code and to the Pythia
    models. The Pile training data has no single license; its components carry their own terms
    (see the Pile record).
  source_ids: [pythia-repo, pile-hf-card]
checklist:
  weights:
    status: public
    note: >-
      Final weights plus 154 intermediate checkpoints (step 0, ten log-spaced early steps, and
      every 1,000 steps to 143,000) are published as Hugging Face branches.
    source_ids: [mc-pythia-12b]
  inference_code:
    status: public
    note: The card documents loading the model with Hugging Face Transformers (GPTNeoXForCausalLM).
    source_ids: [mc-pythia-12b]
  training_code:
    status: public
    note: >-
      Trained with EleutherAI's GPT-NeoX library; the Pythia repository publishes the GPT-NeoX
      config files and step-by-step instructions for reproducing training.
    source_ids: [pythia-repo, mc-pythia-12b]
  training_data_information:
    status: public
    note: >-
      EleutherAI hosts the pre-tokenized training data on Hugging Face in the order the models
      saw it, with a script to reconstruct the dataloader. The Pile itself is documented in a
      paper and datasheet; its original download channel is discussed on the Pile record.
    source_ids: [pythia-repo, pythia-paper]
  training_recipe:
    status: public
    note: >-
      The card and repository give architecture, batch size (about 2M tokens), learning rate,
      step count, and precision, and the paper's appendix documents the changes from the
      earlier v0 runs.
    source_ids: [mc-pythia-12b, pythia-repo]
  evaluation_materials:
    status: public
    note: >-
      All Pythia models were evaluated with EleutherAI's LM Evaluation Harness; results by model
      and step are in the repository's results/json directory.
    source_ids: [mc-pythia-12b]
run_notes:
  - text: >-
      The card notes that Pythia uses the same tokenizer as GPT-NeoX-20B and that branch
      step143000 is identical to the main branch.
    source_ids: [mc-pythia-12b]
provenance:
  text: >-
    Trained from scratch by EleutherAI on the Pile, without deduplication, using the GPT-NeoX
    library. The current weights come from the April 2023 retraining of the suite; the earlier
    v0 models remain available separately. The repository notes that the 6.9B and 12B models
    used a different initialization than intended because the value was not set in the config.
  derived_from:
    - name: The Pile
      artifact_slug: the-pile
      url: https://pile.eleuther.ai/
      note: Pretraining data (standard, non-deduplicated version).
  source_ids: [mc-pythia-12b, pythia-repo]
