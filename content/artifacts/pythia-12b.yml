summary:
  text: >-
    The largest model in EleutherAI's Pythia suite: an English decoder-only language model with
    about 11.8 billion total parameters, trained on the Pile (not deduplicated) for about 300
    billion tokens. EleutherAI publishes 154 checkpoints from initialization to the end of
    training as Hugging Face branches.
  source_ids: [mc-pythia-12b, pythia-repo]
useful_for:
  text: >-
    Research on the behavior, functionality, and limitations of large language models, such as
    interpretability, memorization, and learning dynamics. The card states it is not intended
    for deployment or human-facing use and has not been instruction-tuned.
  source_ids: [mc-pythia-12b, pythia-repo]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    The model card states the model was developed by EleutherAI, which states it incorporated as
    a non-profit research institute in early 2023; the IRS exempt-organization extract for the
    District of Columbia lists EleutherAI Institute in Washington, D.C., as a 501(c)(3)
    organization.
  source_ids: [mc-pythia-12b, eleuther-about, irs-eo-bmf-dc]
  assessed_at: 2026-09-29
availability:
