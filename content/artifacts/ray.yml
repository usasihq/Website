summary:
  text: >-
    Ray is an open-source distributed computing framework for AI workloads, with a core
    distributed runtime and libraries for data processing, training, and serving. It was
    developed at UC Berkeley's RISELab and became a PyTorch Foundation-hosted project in
    October 2025, contributed by Anyscale.
  source_ids: [ray-repo, anyscale-about, pytorch-ray]
useful_for:
  text: >-
    Scaling Python data processing, model training, and model serving workloads from a single
    machine to a cluster.
  source_ids: [pytorch-ray]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Ray is a PyTorch Foundation-hosted project, announced in October 2025. The PyTorch
    Foundation describes itself as hosted by the Linux Foundation, whose privacy policy gives a
    contact mailing address in San Francisco, California. Anyscale (San Francisco) contributed
    the project. Anyscale's pending acquisition by Nscale Limited, a company incorporated in
    England and Wales, does not move Ray: the companies' July 2026 announcement states that Ray
    was donated to the PyTorch Foundation and remains community governed.
  source_ids: [pytorch-ray, pytorch-foundation-page, lf-privacy, anyscale-about, anyscale-nscale-press, nscale-s1]
