summary:
  text: >-
    KempnerForge is a PyTorch-native framework from Harvard's Kempner Institute for
    fault-tolerant distributed training of foundation models on AI clusters. It trains
    decoder-only Transformers and mixture-of-experts models with FSDP2, tensor, expert, and
    pipeline parallelism and FP8 mixed precision, and it includes asynchronous checkpointing
    with auto-resume, SLURM preemption handling, activation-extraction hooks for
    interpretability, and vision-language model training.
  source_ids: [kempnerforge-repo]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    The README lists scaling-law experiments, mechanistic interpretability, sparse
    (mixture-of-experts) architecture research, optimizer and learning-rate-schedule
    comparisons, long-running jobs on shared SLURM clusters, and extracting model
    representations to compare with neural recordings in NeuroAI research.
  source_ids: [kempnerforge-repo]
  reviewed_at: 2026-10-01
