summary:
  text: >-
    A 106B-parameter mixture-of-experts reasoning model with 12B active parameters, post-trained
    by Prime Intellect from Z.ai's GLM-4.5-Air-Base. Training used two supervised fine-tuning
    stages (general reasoning, then agentic) followed by large-scale reinforcement learning on
    math, code, science, logic, deep-research, and software-engineering environments, run with
    prime-rl on a 512-GPU H200 cluster over about two months.
  source_ids: [mc-intellect-3, i3-report-pdf, i3-blog]
useful_for:
  text: >-
    Prime Intellect presents it as a reasoning model for math, code, science, and agentic tasks
    with tool calling; it always reasons before answering.
  source_ids: [i3-blog, i3-report-pdf]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
