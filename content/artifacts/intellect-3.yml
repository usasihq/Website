    locations (see the prime-intellect record). Eligibility covers Prime Intellect's
    post-training only; the GLM-4.5-Air-Base model it starts from was released by Z.ai and is
    not treated as a U.S.-developed model.
  source_ids: [mc-intellect-3, sec-formd-prime-2026-07, glm-45-air-base-card]
  assessed_at: 2026-09-29
