license_notes:
  text: >-
    The MIT license for the weights is declared in the model card metadata; the repository has
    no separate LICENSE file. The card says the model, training frameworks, and environments are
    released under MIT and Apache 2.0 licenses. The base model, GLM-4.5-Air-Base, is also tagged
    MIT on its model card.
  source_ids: [mc-intellect-3, i3-repo-files, glm-45-air-base-card]
checklist:
  weights:
    status: public
    note: BF16 safetensors in an ungated Hugging Face repository; an FP8 repository is also published.
    source_ids: [mc-intellect-3]
  inference_code:
    status: public
    note: The model card gives vLLM serving commands with the qwen3_coder tool-call parser and deepseek_r1 reasoning parser.
    source_ids: [mc-intellect-3]
  training_code:
    status: partial
    note: >-
      The SFT and RL stages were run with prime-rl (Apache 2.0) using environments built with the
      verifiers library (MIT), both open source. This covers Prime Intellect's post-training only;
      the code used to pretrain the GLM-4.5-Air base is not part of this release.
    source_ids: [i3-report-pdf, prime-rl-license, verifiers-license]
  training_data_information:
    status: partial
    note: >-
      The report lists the SFT sources with sample and token counts (splits of NVIDIA's
      Nemotron-Post-Training-Dataset-v1, AM-DeepSeek-R1-0528-Distilled, SWE-Swiss, Toucan Tool,
      and synthetic data from Environments Hub environments) and the datasets behind each RL
      environment. The pretraining data of the base model is not described in this release.
    source_ids: [i3-report-pdf]
  training_recipe:
    status: partial
    note: >-
      For the post-training, the report gives SFT settings (Muon optimizer, learning rates,
      context lengths of 65K and 98K, FSDP and context parallelism) and RL settings (256 prompts
      with 16 rollouts each, 65,536-token context, learning rate 1e-6, 60 nodes split between
      training and inference, masked importance sampling). The base model's pretraining recipe is
      Z.ai's and is not part of this release.
    source_ids: [i3-report-pdf]
  evaluation_materials:
    status: partial
    note: >-
      The model card and report give benchmark results, and the report's appendix documents the
      evaluation setup and names the Environments Hub environments used. The hub pages opened
      only as a sign-in dashboard during review, so public access to the evaluation code was not
      confirmed.
    source_ids: [mc-intellect-3, i3-report-pdf]
run_notes:
  - text: >-
      The model card states that the BF16 version can be served with vLLM on 2x H200 GPUs
      (tensor parallel size 2) and the FP8 version on a single H200.
    source_ids: [mc-intellect-3]
provenance:
  text: >-
    Post-trained by Prime Intellect from GLM-4.5-Air-Base, a 106B-total, 12B-active base model
    released by Z.ai (zai-org) under the MIT License. The base model is not a catalog member and
    is not treated as U.S.-developed; Prime Intellect's contribution is the SFT and RL training,
    the environments, and the training framework.
  derived_from:
    - name: GLM-4.5-Air-Base (Z.ai)
      artifact_slug: null
      url: https://huggingface.co/zai-org/GLM-4.5-Air-Base
      note: Third-party base model; not a catalog member.
  source_ids: [mc-intellect-3, i3-report-pdf, glm-45-air-base-card]
