summary:
  text: >-
    A 671B-parameter mixture-of-experts model with 37B active parameters that Deep Cogito
    post-trained in-house from the DeepSeek-V3 base model. It is a hybrid reasoning model that can
    answer directly or reason first, supports a 128k-token context, and was trained in over 30
    languages; Deep Cogito says process supervision of reasoning chains lets it reach answers
    with shorter reasoning.
  source_ids: [mc-cogito-v2-1, cogito-v2-1-blog, cogito-github-readme]
useful_for:
  text: >-
    The model card describes it as optimized for coding, STEM, instruction following, general
    helpfulness, and tool calling.
  source_ids: [mc-cogito-v2-1]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Post-trained and published by Deep Cogito Inc., headquartered in San Francisco (see the
    deep-cogito record). Eligibility covers Deep Cogito's post-training only; the DeepSeek-V3
    base model it starts from was developed by DeepSeek and is not treated as a U.S.-developed
    model.
  source_ids: [cogito-v2-1-blog, cogito-home, sec-formd-cogito-2026-04, deepseek-v3-base-card]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Weights download from Hugging Face without an access gate; an FP8 version is published
    separately. The announcement also lists API access through third-party platforms and a free
    web chat.
  source_ids: [mc-cogito-v2-1, cogito-v2-1-api, cogito-v2-1-blog]
licenses:
