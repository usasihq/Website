    source_ids: [mc-cogito-v2-1]
license_notes:
  text: >-
    The model card states that the repository and the model weights are licensed under the MIT
    License, and the companion GitHub repository carries an MIT LICENSE file; the Hugging Face
    repository has no separate LICENSE file. Deep Cogito calls its DeepSeek starting point an
    open-licensed base model; the DeepSeek-V3-Base model card says its code is MIT-licensed and
    that use of the DeepSeek-V3 Base and Chat models is subject to DeepSeek's Model License.
  source_ids: [mc-cogito-v2-1, cogito-v2-1-repo-files, cogito-github-license, cogito-v2-1-blog, deepseek-v3-base-card]
checklist:
  weights:
    status: public
    note: BF16 safetensors in an ungated Hugging Face repository; an FP8 repository is also published.
    source_ids: [mc-cogito-v2-1, cogito-v2-1-api]
  inference_code:
    status: public
    note: The repository includes DeepSeek modeling code, and the model card gives Transformers and vLLM examples, including tool calling.
    source_ids: [mc-cogito-v2-1, cogito-v2-1-repo-files]
  training_code:
    status: unknown
    note: No training code was found in the model card, announcement, or GitHub repository, which contains usage examples.
    source_ids: []
  legacy_training_data_information:
    status: unknown
    note: The model card and announcement do not describe the post-training data; the DeepSeek-V3 base model's pretraining data is described only in DeepSeek's materials.
    source_ids: []
  training_recipe:
    status: partial
    note: >-
      The announcement describes the approach only at a high level (forking the DeepSeek base
      model, in-house post-training, process supervision of reasoning chains); the model card
      names Iterated Distillation and Amplification. No configurations are given.
    source_ids: [cogito-v2-1-blog, mc-cogito-v2-1]
  evaluation_materials:
    status: partial
    note: The model card and announcement show benchmark charts and list repeats per example for each benchmark; evaluation code is not linked.
    source_ids: [mc-cogito-v2-1, cogito-v2-1-blog]
run_notes:
  - text: >-
      The model card states that the BF16 checkpoint takes about 1.3 TB for parameters and needs
      at least 8 B200 GPUs (one node) or 16 H200 GPUs (two nodes), and points users with 8 H200
      GPUs to the FP8 checkpoint. Its vLLM example uses tensor parallel size 8.
    source_ids: [mc-cogito-v2-1]
provenance:
  text: >-
    Post-trained in-house by Deep Cogito from DeepSeek's DeepSeek-V3-Base, which Deep Cogito
    describes as the open-licensed DeepSeek base model from November 2024. The base model is not a
    catalog member and is not treated as U.S.-developed.
  derived_from:
    - name: DeepSeek-V3-Base (DeepSeek)
      artifact_slug: null
      url: https://huggingface.co/deepseek-ai/DeepSeek-V3-Base
      note: Third-party base model; not a catalog member.
  source_ids: [mc-cogito-v2-1, cogito-v2-1-blog, deepseek-v3-base-card]
