summary:
  text: >-
    Phi-4-mini-flash-reasoning is a 3.8-billion-parameter, English, text-only Microsoft model
    fine-tuned for mathematical reasoning. It uses a hybrid "SambaY" decoder-hybrid-decoder
    architecture that mixes state space model layers with attention and Differential Attention,
    and supports a 64K-token context.
  source_ids: [phi4-mfr-model-card]
useful_for:
  text: >-
    The model card lists multi-step mathematical problem solving where memory, compute, or
    latency is constrained, such as formal proof generation and advanced word problems. It says
    the model is designed and tested for math reasoning only.
  source_ids: [phi4-mfr-model-card]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Published by Microsoft on its Hugging Face account under a Microsoft Corporation copyright
    license. Microsoft Corporation lists Redmond, Washington as its address on its Form 10-K
    cover page. The reasoning fine-tuning data was generated by another developer's model (see
    provenance), but the weights were trained by Microsoft.
  source_ids: [phi4-mfr-model-card, phi4-mfr-license, msft-10k-2026]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Weights can be downloaded from Hugging Face without a gated access request. Microsoft also
    offers the model on Azure AI Foundry. Microsoft announced on July 9, 2025 that the model was
    available that day on Azure AI Foundry, the NVIDIA API Catalog, and Hugging Face; the model
    card gives June 2025 as its release date.
  source_ids: [phi4-mfr-hf-api, phi4-mfr-model-card, phi4-mfr-azure-blog]
