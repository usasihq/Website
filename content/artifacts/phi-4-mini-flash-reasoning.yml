license_notes: null
checklist:
  weights:
    status: public
    note: Published on Hugging Face without gating.
    source_ids: [phi4-mfr-hf-api]
  inference_code:
    status: public
    note: >-
      The model card documents Transformers inference with pinned package versions and links
      vLLM pull requests that add support.
    source_ids: [phi4-mfr-model-card]
  training_code:
    status: partial
    note: >-
      Microsoft's ArchScale repository (MIT) says it released code for large-scale pre-training of
      Phi-4-mini-flash. The code for the reasoning fine-tuning stage is not identified.
    source_ids: [archscale-readme, phi4-mfr-model-card]
  legacy_training_data_information:
    status: partial
    note: >-
      The model card lists 5T pre-training tokens and 150B reasoning-training tokens, with a
      February 2025 cutoff for public data. It says the reasoning data is synthetic math content
      generated by DeepSeek-R1 plus curated public math questions. The data is not released.
    source_ids: [phi4-mfr-model-card]
  training_recipe:
    status: partial
    note: >-
      The model card gives architecture, hardware, duration, and token counts for each stage, and
      includes the abstract of the accompanying architecture paper, which this review did not
      read in full. The card does not publish a complete fine-tuning recipe.
    source_ids: [phi4-mfr-model-card]
  evaluation_materials:
    status: public
    note: >-
      The model card reports results and the sampling protocol (Pass@1 averaged over 64 samples
      for AIME24/25 and 8 for Math500 and GPQA Diamond). ArchScale includes LightEval-based
      reasoning evaluation for AIME, MATH-500, and GPQA.
    source_ids: [phi4-mfr-model-card, archscale-readme]
run_notes:
  - text: >-
      The model card lists pinned packages for Transformers inference (flash_attn 2.7.4.post1,
      torch 2.6.0, mamba-ssm 2.2.4, causal-conv1d 1.5.0.post8, transformers 4.46.1). It says the
      model uses flash attention by default and has been tested on NVIDIA A100 and H100 GPUs.
    source_ids: [phi4-mfr-model-card]
provenance:
  text: >-
    Microsoft trained the model. According to the model card, its reasoning fine-tuning data is
    synthetic math content generated by DeepSeek-R1 in order to distill that model's reasoning,
    along with curated public math questions and part of the SFT data used for the base
    Phi-4-mini-flash model. No DeepSeek weights are part of this release.
  derived_from:
    - name: DeepSeek-R1
      artifact_slug: null
      url: null
      note: Teacher model whose outputs were used as synthetic fine-tuning data; not a base-weight dependency.
    - name: Phi-4-mini-flash (base)
      artifact_slug: null
      url: null
      note: Microsoft base model whose SFT data is partly reused, per the model card.
  source_ids: [phi4-mfr-model-card]
