license_notes:
  text: >-
    The model card and the repository metadata give Apache 2.0, and the card links to Google's
    Gemma 4 license page, which reproduces the Apache License 2.0 text; the Hugging Face repository has no
    separate LICENSE file. The Gemma Terms of Use (last modified April 1, 2026) list the original
    EmbeddingGemma in their appendix but not EmbeddingGemma 2. The model card's ethics section
    separately says deployments must adhere to the Gemma Prohibited Use Policy; the Apache license
    text itself does not refer to that policy.
  source_ids: [ eg2-hf-card, eg2-hf-api, eg2-license-page, gemma-terms ]
  reviewed_at: 2026-10-08
checklist:
  weights:
    status: public
    note: >-
      A single BF16 safetensors file in the ungated Hugging Face repository; the repository
      metadata counts 744,371,512 parameters.
    source_ids: [ eg2-hf-api ]
    reviewed_at: 2026-10-08
  inference_code:
    status: public
    note: >-
      The model card documents inference with the Sentence Transformers library on top of Hugging
      Face Transformers. Google's launch post also names MLX, vLLM, llama.cpp, SGLang, Ollama,
      and LM Studio for serving the model.
    source_ids: [ eg2-hf-card, eg2-blog ]
    reviewed_at: 2026-10-08
  training_code:
    status: unknown
    note: >-
      No training code was found. Google's EmbeddingGemma overview links a fine-tuning guide for
      EmbeddingGemma that uses Sentence Transformers.
    source_ids: [ eg-overview ]
    reviewed_at: 2026-10-08
  training_data_information:
    status: partial
    note: >-
      The card describes web documents in over 140 languages, code, images, video, audio, and
      paired cross-modal samples, with a January 2025 cutoff, and CSAM, sensitive-data, and
      quality and safety filtering. It gives no data sizes, the data is not released, and this
      review does not judge the description complete.
    source_ids: [ eg2-hf-card ]
    reviewed_at: 2026-10-08
  training_recipe:
    status: unknown
    note: >-
      The card gives the architecture (24 layers, mean pooling, a 512-to-768 projection) but not
      the training procedure, and no technical report for this release was found.
    source_ids: [ eg2-hf-card ]
    reviewed_at: 2026-10-08
  evaluation_materials:
    status: partial
    note: >-
      The card reports results on MTEB (multilingual and code), MIEB, MMEB v2, MSEB, and MAEB,
      including at truncated dimensions; evaluation code and settings were not reviewed.
    source_ids: [ eg2-hf-card ]
    reviewed_at: 2026-10-08
run_notes:
  - text: >-
      The model card says to run inference in bfloat16 or float32, not float16, because the
      model's activations exceed float16's range and can produce NaN or degraded embeddings
      without an error.
    source_ids: [ eg2-hf-card ]
    reviewed_at: 2026-10-08
  - text: >-
      Text inputs take short task prefixes (for example "task: search result | query:" for
      queries and "title: ... | text:" for documents); images, video, and audio take none. The
      card's default budgets are 280 tokens per image, 140 per video frame (sampled at one frame
      per second), and 25 per second of 16 kHz mono audio, all within the shared 8,192-token
      context.
    source_ids: [ eg2-hf-card ]
    reviewed_at: 2026-10-08
  - text: >-
      The vision and audio encoders can be left unloaded through Sentence Transformers'
      config_kwargs; the card lists an effective size of 270M parameters for text only and 440M
      for text and images. After truncating an embedding, the card says to L2-normalize it again,
      and queries and documents must use the same dimension.
    source_ids: [ eg2-hf-card ]
    reviewed_at: 2026-10-08
provenance:
  text: >-
    Google describes EmbeddingGemma 2 as built on the Gemma 4 architecture. Its overview compares
    it with the original 308M-parameter text-only EmbeddingGemma, which it calls EmbeddingGemma
    1. The card does not say whether EmbeddingGemma 2 was initialized from Gemma 4 weights.
  derived_from:
    - name: Gemma 4
      artifact_slug: gemma
      url: null
      note: Architecture basis named by Google; see the Gemma family record.
    - name: EmbeddingGemma (300M)
      artifact_slug: embeddinggemma-300m
      url: null
      note: Earlier text-only release that Google's overview calls EmbeddingGemma 1.
  source_ids: [ eg2-hf-card, eg2-blog, eg-overview ]
