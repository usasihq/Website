summary:
  text: >-
    EmbeddingGemma 2 is a multimodal embedding model from Google DeepMind that maps text
    (including code), images, video, and audio, alone or combined in one input, into a single
    768-dimensional vector space. The model card gives 740M parameters in total: a 270M-parameter
    text model plus a 170M vision encoder and a 300M audio encoder that can be loaded separately.
    All inputs share an 8,192-token context, and outputs can be shortened to 512, 256, or 128
    dimensions. Google's release page dates it to October 6, 2026.
  source_ids: [ eg2-hf-card, eg2-model-card, gemma-releases ]
  reviewed_at: 2026-10-08
useful_for:
  text: >-
    The model card lists retrieval, classification, clustering, semantic similarity, and fact
    verification across text, code, images, video, and audio, for example search and
    retrieval-augmented generation over documents, code, or audio archives. It describes the model
    as designed to run on consumer hardware such as mobile devices and laptops.
  source_ids: [ eg2-hf-card ]
  reviewed_at: 2026-10-08
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    The model card names Google DeepMind as the author. Google's CEO announced Google DeepMind in
    2023 as a group within Google combining DeepMind and Google Research's Brain team. Alphabet
    Inc.'s fiscal 2025 Form 10-K gives its principal executive offices in Mountain View,
    California, and Exhibit 21.01 lists Google LLC as a Delaware subsidiary.
  source_ids: [ eg2-hf-card, google-blog-gdm-2023, alphabet-10k-2025-cover, alphabet-10k-2025-ex21 ]
  assessed_at: 2026-10-08
availability:
  status: public
  access_conditions: >-
    Downloadable from Hugging Face without an access gate. Google's launch post says the weights
    are also published on Kaggle.
  source_ids: [ eg2-hf-api, eg2-blog ]
  reviewed_at: 2026-10-08
licenses:
