summary:
  text: >-
    DSPy is an open-source Python framework for building language-model programs from
    compositional Python modules instead of hand-written prompts. It includes optimizer
    algorithms that tune the prompts and weights of those programs. The project started at the
    Stanford NLP group.
  source_ids: [dspy-readme, dspy-docs]
useful_for:
  text: >-
    Building modular language-model systems, such as classifiers, retrieval-augmented
    generation pipelines, and agent loops, and optimizing their prompts and weights.
  source_ids: [dspy-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The DSPy repository sits in the Stanford NLP GitHub organization, which gives its location as
    Stanford, California. The Stanford NLP Group's website lists DSPy among the software it
    develops. The MIT license names Stanford Future Data Systems as the copyright holder, and the
    documentation says the project started at Stanford NLP. Contributors come from many
    organizations; eligibility rests on the Stanford hosting documented above.
  source_ids: [stanfordnlp-github, stanford-nlp-home, dspy-license, dspy-docs]
