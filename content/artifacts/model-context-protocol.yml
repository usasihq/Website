  documentation:
    status: public
    note: >-
      Public documentation site with the specification, architecture and security guidance, and
      guides for building servers and clients.
    source_ids: [mcp-intro, mcp-versioning]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      Each SDK documents its own installation. For example, the Python SDK documents installing
      the mcp package with pip or uv and requires Python 3.10 or later.
    source_ids: [mcp-sdks, mcp-python-sdk-docs]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      Official SDKs are listed for TypeScript, Python, C#, Go, Rust, and Ruby (Tier 1), Java (Tier
      2), and Swift, PHP, and Kotlin (Tier 3); tiers reflect feature completeness, protocol
      support, and maintenance commitment.
    source_ids: [mcp-sdks]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Protocol versions are dated identifiers marking the last backwards-incompatible change; the
      current version is 2026-07-28. This entry describes the project rather than one revision
      or SDK release.
    source_ids: [mcp-versioning]
    reviewed_at: 2026-10-01
run_notes: []
provenance:
  text: >-
    Anthropic introduced and open-sourced MCP on November 25, 2024. On December 9, 2025, Anthropic
    donated it to the newly formed Agentic AI Foundation under The Linux Foundation; the project's
    announcement said its maintainer-led governance and enhancement-proposal process would
    continue unchanged.
