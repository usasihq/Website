summary:
  text: >-
    The Model Context Protocol is an open protocol for connecting AI applications to external
    data sources, tools, and workflows through MCP servers and clients. The project publishes the
    specification, a TypeScript schema with a generated JSON Schema, documentation, and official
    SDKs in ten programming languages. Anthropic introduced it in November 2024 and donated it to
    the Agentic AI Foundation in December 2025.
  source_ids: [mcp-intro, mcp-repo, mcp-sdks, anthropic-mcp-intro, anthropic-mcp-donation]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Building servers that expose tools, resources, and prompts, and clients that let AI
    applications connect to those servers over local or remote transports.
  source_ids: [mcp-sdks, mcp-intro]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    MCP has been established as Model Context Protocol a Series of LF Projects, LLC, and its
    governance changes must also be approved by LF Projects, a Delaware series limited liability
    company. It is a project of the Agentic AI Foundation, a directed fund of The Linux
    Foundation, which describes itself as a 501(c)(6) nonprofit with a legal postal address in
    San Francisco, California. Technical governance rests with individual maintainers; seats are
    not reserved for companies. Eligibility rests on this documented governance, not on the
    original developer or on contributors' affiliations or nationality.
  source_ids: [mcp-governance, lfprojects, aaif-charter, aaif-projects, lf-about, lf-privacy]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    The specification, schema, documentation, and SDK source code are public. Connecting to a
    particular MCP server or AI application is governed by that server's or application's own
    terms.
  source_ids: [mcp-repo, mcp-sdks, mcp-intro]
  reviewed_at: 2026-10-01
