license_notes:
  text: >-
    The specification repository's LICENSE describes a transition from MIT to Apache 2.0: new
    code and specification contributions are under Apache 2.0, contributions whose authors have
    not consented to relicensing remain under MIT, and documentation other than the
    specification is under CC BY 4.0. That repository's README still states MIT. SDK
    repositories carry their own LICENSE files: the TypeScript SDK uses the same transition
    text, while the Python and Java SDK LICENSE files reviewed are MIT only. None of these
    licenses cover external MCP servers, model weights, or hosted services.
  source_ids: [mcp-license, mcp-repo, mcp-ts-sdk-license, mcp-python-sdk-license, mcp-java-sdk-license]
  reviewed_at: 2026-10-01
checklist:
  source_code:
    status: public
    note: >-
      The specification, schema, and documentation are developed in a public repository; each
      official SDK has its own public repository.
    source_ids: [mcp-repo, mcp-sdks]
