summary:
  text: >-
    Whisper is OpenAI's family of encoder-decoder transformer models for speech recognition,
    speech translation into English, and language identification. The original series of
    English-only and multilingual checkpoints from 39M to 1550M parameters appeared in September
    2022; OpenAI followed with large-v2 (December 2022), large-v3 (November 2023), and the
    faster large-v3-turbo (September 2024).
  source_ids: [whisper-model-card, whisper-repo-readme, whisper-paper]
useful_for:
  text: >-
    The model card names AI researchers studying robustness and bias in speech systems as the
    primary intended users and says the models may also be useful to developers as a speech
    recognition solution, especially for English. It advises against transcribing people without
    their consent, against use for classifying people, and against high-risk decision-making
    uses.
  source_ids: [whisper-model-card]
