summary:
  text: >-
    A 2.69B-parameter text-only hybrid model with 30 layers (22 double-gated short-convolution
    blocks and 8 grouped-query attention blocks), a 131,072-token context window, and support for
    16 languages. Liquid AI pretrained it on about 34 trillion tokens and post-trained it for
    agentic use; it always reasons before answering.
  source_ids: [mc-lfm25-2-6b, lfm25-2-6b-blog]
useful_for:
  text: >-
    The model card recommends it for agentic workloads, tool use, data extraction,
    retrieval-augmented generation, and long-context workflows, and does not recommend it for
    agentic coding or knowledge-heavy tasks.
  source_ids: [mc-lfm25-2-6b]
