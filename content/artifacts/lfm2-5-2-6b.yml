checklist:
  weights:
    status: public
    note: Ungated safetensors weights on Hugging Face; GGUF, ONNX, and MLX conversions and a base checkpoint are published as separate repositories.
    source_ids: [mc-lfm25-2-6b]
  inference_code:
    status: public
    note: >-
      The model card documents inference with Hugging Face Transformers (5.0.0 or later), vLLM,
      SGLang, llama.cpp, MLX, and LM Studio, and gives setup examples for several agent harnesses.
    source_ids: [mc-lfm25-2-6b]
  training_code:
    status: unknown
    note: No training code release was found in the model card or release post.
    source_ids: []
  legacy_training_data_information:
    status: unknown
    note: The model card and release post state the pretraining budget (about 34 trillion tokens) but do not describe data sources or composition.
    source_ids: []
  training_recipe:
    status: partial
    note: >-
      The model card and release post describe the stages at a high level: pretraining, a
      mid-training phase that extends context to 128K, two rounds of supervised fine-tuning,
      per-domain teacher specialization, multi-domain on-policy distillation, and agentic
      reinforcement learning inside agent harnesses. Hyperparameters and data mixes are not given.
    source_ids: [mc-lfm25-2-6b, lfm25-2-6b-blog]
  evaluation_materials:
    status: partial
    note: The model card reports a benchmark table against other small models; evaluation code or prompts are not linked.
    source_ids: [mc-lfm25-2-6b]
run_notes:
  - text: >-
      The model card recommends temperature 0.1, top_k 50, and repetition_penalty 1.1, and shows
      Transformers loading in bfloat16. It points to a separate 328M speculative-decoding
      drafter, LFM2.5-2.6B-DSpark, for SGLang and Apple silicon.
    source_ids: [mc-lfm25-2-6b]
provenance:
  text: >-
    Post-trained by Liquid AI from its own LFM2.5-2.6B-Base checkpoint; no third-party base model
    is involved.
