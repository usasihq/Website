summary:
  text: >-
    Sentence Transformers is a Python framework for using and training embedding and reranker
    models. It computes dense embeddings with Sentence Transformer models, scores text pairs with
    Cross-Encoder (reranker) models, and also supports sparse encoders and multi-vector models
    for ColBERT-style late-interaction retrieval, with pretrained models published on Hugging
    Face. Version
    6.1.0 was released on September 18, 2026.
  source_ids: [ stf-readme, stf-releases ]
  reviewed_at: 2026-10-08
useful_for:
  text: >-
    Semantic search, semantic textual similarity, paraphrase mining, and reranking, and training
    or fine-tuning embedding, reranker, sparse, and multi-vector models. Google's EmbeddingGemma 2
    model card documents inference through this library.
  source_ids: [ stf-readme, eg2-hf-card ]
  reviewed_at: 2026-10-08
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Two-organization history. The project was originally developed by the UKP Lab at TU
    Darmstadt in Germany, which the NOTICE file lists as copyright holder for 2019 to 2025. The
    repository is now in Hugging Face's GitHub organization, the NOTICE file lists Hugging Face,
    Inc. as copyright holder from 2025, and the README names a Hugging Face maintainer.
    Hugging Face, Inc. is a Delaware corporation per Hugging Face's terms of service; the catalog's
    hugging-face record assesses its U.S. headquarters. The catalog treats Hugging Face as the
    current maintaining entity.
  source_ids: [ stf-readme, stf-notice, hf-tos ]
  assessed_at: 2026-10-08
