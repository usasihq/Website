summary:
  text: >-
    d1-3B is a 3.12-billion-parameter multimodal decision model from Liquid AI, post-trained from
    its LFM2.5-VL-3B vision-language model. It accepts text, JSON, and images with a 32,768-token
    context and answers named questions in one forward pass without generating output tokens;
    the card says it is not a chat model.
  reviewed_at: 2026-10-11
  source_ids: [mc-d1-3b, d1-blog]
useful_for:
  text: >-
    Yes/no, multiple-choice, and rating decisions inside a pipeline: routing and triage,
    moderation, intent and topic classification, extraction checks, reranking, judge-style
    scoring, agent guardrails, and visual inspection, per the model card.
  reviewed_at: 2026-10-11
  source_ids: [mc-d1-3b]
