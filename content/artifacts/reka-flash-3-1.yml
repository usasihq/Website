checklist:
  weights:
    status: public
    note: Full weights are on Hugging Face, plus a separate 3.5-bit quantized version.
    source_ids: [ reka-flash31-card ]
    reviewed_at: 2026-10-02
  inference_code:
    status: public
    note: >-
      The card documents running the model with Hugging Face Transformers and with vLLM; it is
      released in a Llama-compatible format usable by libraries that support Llama.
    source_ids: [ reka-flash31-card ]
    reviewed_at: 2026-10-02
  training_code:
    status: unknown
    note: The card and posts reviewed do not link training code.
    source_ids: []
    reviewed_at: 2026-10-02
  training_data_information:
    status: partial
    note: >-
      The card says supervised fine-tuning used synthetic and public datasets; the reinforcement
      learning post says math prompts came from Numina-1.5 and code prompts were difficult coding
      problems with test cases. Pretraining data for the Flash 3 base is described only as
      publicly accessible and synthetic datasets.
    source_ids: [ reka-flash31-card, reka-flash31-rl-post, reka-flash3-post ]
    reviewed_at: 2026-10-02
  training_recipe:
    status: partial
    note: >-
      The reinforcement learning post describes Reka's REINFORCE-based algorithm (dynamic
      sampling, token-level loss, gradient clipping, handling of long samples, on-policy updates)
      and how RL and SFT examples were separated, but not full hyperparameters or data mixtures.
    source_ids: [ reka-flash31-rl-post ]
    reviewed_at: 2026-10-02
  evaluation_materials:
    status: partial
    note: The card shows evaluation results as a chart; no evaluation code or prompts are linked.
    source_ids: [ reka-flash31-card ]
    reviewed_at: 2026-10-02
run_notes:
  - text: >-
      The card documents the prompt format (human and assistant turns separated by <sep>), says
      generation should stop at <sep> or <|endoftext|>, notes that the model uses the cl100k_base
      tokenizer, and recommends dropping earlier reasoning traces in multi-turn conversations.
    source_ids: [ reka-flash31-card ]
    reviewed_at: 2026-10-02
  - text: >-
      The card says the model is primarily built for English and should be treated as an
      English-only model, although it can understand other languages to some degree.
    source_ids: [ reka-flash31-card ]
    reviewed_at: 2026-10-02
provenance:
  text: >-
    Reka describes Flash 3.1 as an update to its Reka Flash 3, which it says was pretrained from
    scratch. The Llama-compatible format refers to how the weights are packaged for existing
    libraries.
  derived_from:
    - name: Reka Flash 3
      artifact_slug: null
      url: https://huggingface.co/RekaAI/reka-flash-3
      note: Earlier Reka release; no separate catalog record.
