summary:
  text: >-
    A 21B-parameter language model released by Reka in July 2025 as an update to Reka Flash 3.
    Reka post-trained it with supervised fine-tuning on synthetic and public datasets followed by
    large-scale reinforcement learning with verifiable rewards, with a focus on coding and on
    serving as a base for fine-tuning on agentic tasks. It writes a reasoning trace before its
    answer.
  source_ids: [ reka-flash31-card, reka-flash31-post, reka-flash31-rl-post ]
  reviewed_at: 2026-10-02
useful_for:
  text: >-
    Reka presents it for coding tasks and as a base model to fine-tune for agentic use, including
    in resource-constrained or local deployments with the quantized version.
  source_ids: [ reka-flash31-card, reka-flash31-post ]
  reviewed_at: 2026-10-02
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model is published by Reka in its verified RekaAI organization on Hugging Face. Reka AI,
    Inc. states in its privacy policy that it is headquartered in the United States, and its June
    2026 announcement describes it as headquartered in San Francisco (see the Reka record). Reka
    says the Flash 3 base was pretrained from scratch.
  source_ids: [ reka-flash31-card, reka-hf-org, reka-privacy, reka-moonvalley, reka-flash3-post ]
  assessed_at: 2026-10-02
availability:
  status: public
  access_conditions: >-
    Downloadable from Hugging Face without gating. Reka also serves Flash 3.1 through its API and
    playground.
  source_ids: [ reka-flash31-card, reka-flash31-meta, reka-flash31-post ]
  reviewed_at: 2026-10-02
