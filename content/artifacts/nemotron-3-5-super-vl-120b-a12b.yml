summary:
  text: >-
    Nemotron 3.5 Super VL is an NVIDIA vision-language model with 120B total and 12B active
    parameters. It pairs a hybrid Mamba-2 and attention mixture-of-experts language backbone
    with a C-RADIO vision encoder, accepts text, image, and video input with text output,
    supports a context of up to 1M tokens, and includes a multi-token prediction head for
    speculative decoding. NVIDIA published BF16 and NVFP4 post-trained checkpoints and a
    text-only base checkpoint.
  source_ids: [super-vl-model-card, super35-recipe-doc, nvidia-blog-super-vl]
useful_for:
  text: >-
    The model card lists reasoning, coding, tool use, document understanding, and video
    understanding, and describes the BF16 weights as intended for customization, domain
    adaptation, quantized variants, and full-precision evaluation. It states the model is ready
    for commercial or non-commercial use.
  source_ids: [super-vl-model-card]
