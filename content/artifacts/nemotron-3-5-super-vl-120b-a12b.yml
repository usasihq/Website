checklist:
  weights:
    status: public
    reviewed_at: 2026-10-18
    note: >-
      The BF16 post-trained weights are published on Hugging Face; NVIDIA's recipe also lists
      NVFP4 and text-only base BF16 checkpoints.
    source_ids: [super-vl-model-card, super-vl-hf-metadata, super35-recipe-doc]
  inference_code:
    status: public
    reviewed_at: 2026-10-18
    note: The model card gives serving instructions for vLLM and SGLang; the repository includes custom Transformers modeling code.
    source_ids: [super-vl-model-card, super-vl-hf-metadata]
  training_code:
    status: partial
    reviewed_at: 2026-10-18
    note: >-
      The Apache-2.0 Nemotron Developer Repository provides SFT, RL, and evaluation recipes. NVIDIA
      states the text-only pretraining pipeline is not reproduced there, and that the agentic
      teacher and one vision-reasoning stage depend on NeMo Gym components that are not public.
    source_ids: [super35-recipe-doc, nemotron-repo-license]
  training_pipeline:
    status: partial
    reviewed_at: 2026-10-18
    note: >-
      Post-training stages are published as reference recipes; the base pretraining pipeline is
      not, because it depends on teacher logits and data that NVIDIA says are not public.
    source_ids: [super35-recipe-doc]
  training_recipe:
    status: partial
    reviewed_at: 2026-10-18
    note: >-
      The model card and recipe describe each training stage; NVIDIA links a technical report.
      The recipe says the SFT and RL data are not yet published and that MTP boosting is not
      included, so recipes run on the user's own data.
    source_ids: [super-vl-model-card, super35-recipe-doc]
  training_data_information:
    status: partial
    reviewed_at: 2026-10-18
    note: >-
      The model card lists pre- and post-training datasets with collection periods, sources, and
      the models used to generate synthetic data, and links a public training content summary.
      Several third-party and NVIDIA datasets are listed as private, some with undisclosed
      sizes or generation models.
    source_ids: [super-vl-model-card]
  training_data_access:
    status: partial
    reviewed_at: 2026-10-18
    note: >-
      The pretraining corpus is drawn from NVIDIA's public Nemotron pretraining dataset
      collection, while the SFT and RL data used for this release are not yet published and some
      listed datasets are private.
    source_ids: [super-vl-model-card, super35-recipe-doc]
  evaluation_materials:
    status: partial
    reviewed_at: 2026-10-18
    note: >-
      The model card publishes benchmark results collected via NeMo Gym and points to its
      reproducibility recipes; it says several vision benchmarks used official implementations or
      internal scaffolding not yet open-sourced.
    source_ids: [super-vl-model-card]
run_notes:
  - text: >-
      The model card documents serving the BF16 checkpoint with vLLM or SGLang on 4x H100 (tensor
      parallel 4) or 2x GB200 (tensor parallel 2), with native MTP speculative decoding, and
      points to the NVFP4 checkpoint for DGX Spark or more efficient data-center inference. It
      lists Linux as the operating system and NVIDIA Hopper and Blackwell as supported hardware.
    source_ids: [super-vl-model-card]
provenance:
  text: >-
    NVIDIA initialized the language backbone from its Nemotron 3 Super Base model, distilled it
    from Nemotron 3 Ultra Base, and added NVIDIA's C-RADIO vision encoder and a connector during
    supervised fine-tuning; the card does not state the encoder's version or lineage. The model
    card says synthetic training data was generated or filtered with many third-party models,
    including non-U.S. models such as Qwen, DeepSeek, Kimi, and GLM releases, alongside U.S.
    models such as gpt-oss-120b and Gemma. These were data-generation tools, not base weights.
  derived_from:
    - name: Nemotron 3 Super Base
      artifact_slug: null
      url: null
      note: NVIDIA base model used to initialize the language backbone.
    - name: C-RADIO vision encoder
      artifact_slug: null
      url: null
      note: NVIDIA vision encoder named in the model card; version not stated.
  source_ids: [super-vl-model-card, super35-recipe-doc]
