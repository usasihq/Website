provenance:
  text: >-
    The open Palmyra-mini models are fine-tunes of other developers' models: palmyra-mini
    and palmyra-mini-thinking-a are fine-tuned from Qwen2.5-1.5B (Alibaba Cloud's Qwen
    family), and palmyra-mini-thinking-b from NVIDIA's OpenReasoning-Nemotron-1.5B. The model
    card for Palmyra-Med-70B-32K says it builds on Writer's Palmyra-Med-70B.
  derived_from:
    - name: Qwen2.5-1.5B
      artifact_slug: null
      url: https://huggingface.co/Qwen/Qwen2.5-1.5B
      note: Base of palmyra-mini and palmyra-mini-thinking-a.
    - name: OpenReasoning-Nemotron-1.5B
      artifact_slug: null
      url: https://huggingface.co/nvidia/OpenReasoning-Nemotron-1.5B
      note: Base of palmyra-mini-thinking-b; NVIDIA's card says it derives from Qwen2.5-1.5B.
  source_ids: [palmyra-mini-card, palmyra-mini-thinking-a-card, palmyra-mini-thinking-b-card, nvidia-orn-card, palmyra-med-32k-card, qwen-hf-org]
