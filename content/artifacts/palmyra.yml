summary:
  text: >-
    Palmyra is Writer's family of language models. The Palmyra X models (currently X4, X5, and
    X6) are offered through Writer's platform and API. Writer has also published Palmyra
    models on Hugging Face: Palmyra-X-4.3-73B and domain models for medicine and finance under
    its non-commercial open model license, and the small Palmyra-mini models (September 2025)
    under Apache 2.0.
  source_ids: [writer-dev-models, writer-models, writer-hf, palmyra-x43-card, palmyra-med-32k-card, palmyra-fin-card, writer-oml, palmyra-mini-blog]
useful_for:
  text: >-
    Writer positions Palmyra X6 as the default model for agentic work on its enterprise
    platform. The open Palmyra-mini models are described for research and development,
    particularly on tasks that need mathematical and logical reasoning.
  source_ids: [writer-models, palmyra-mini-card]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The Palmyra models are developed by Writer, Inc., whose company page and platform
    services agreement place its headquarters at 111 Maiden Lane, San Francisco. Eligibility
    of each release is assessed on the release record.
  source_ids: [writer-company, writer-psa]
  assessed_at: 2026-09-29
availability:
  status: not_applicable
  access_conditions: >-
    Assessed per release; see the Palmyra-mini records. Palmyra-X-4.3-73B can be downloaded
    only after requesting access on Hugging Face, agreeing to the Writer Open Model License,
    and sharing contact information; the repository is set to manual approval, so Writer
    reviews each request.
  source_ids: [palmyra-x43-card, palmyra-x43-hf-api, hf-gated-docs]
