summary:
  text: >-
    Phi-4-reasoning-vision-15B is a 15-billion-parameter multimodal reasoning model from
    Microsoft. It combines the Phi-4-Reasoning language model with a SigLIP-2 vision encoder,
    takes text and images as input, produces text, and has a 16,384-token context length. It can
    either reason step by step or answer directly, depending on the task.
  source_ids: [phi4-rv-model-card]
useful_for:
  text: >-
    The model card lists scientific and mathematical reasoning over visual inputs such as
    diagrams, charts, and documents, and computer-use agent tasks such as locating interface
    elements on screens. It also covers captioning, visual question answering, and OCR, and is
    trained primarily on English.
  source_ids: [phi4-rv-model-card]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model card names Microsoft Corporation as developer, with Microsoft Ireland Operations
    Limited as authorized representative for the EU. The EU-format data card lists the Irish
    entity in its developer field, but the release is a Microsoft product published on
    Microsoft's Hugging Face and GitHub accounts. Microsoft Corporation lists Redmond,
    Washington as its address on its Form 10-K cover page.
  source_ids: [phi4-rv-model-card, phi4-rv-data-card, msft-10k-2026]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Weights can be downloaded from Hugging Face without a gated access request. Microsoft also
    offers the model as a hosted deployment on Microsoft Foundry.
  source_ids: [phi4-rv-hf-api, phi4-rv-model-card]
