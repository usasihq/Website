license_notes:
  text: >-
    The Hugging Face model card lists the MIT License, but that repository has no separate LICENSE
    file. The GitHub repository has a standard MIT LICENSE file (Copyright 2026 Microsoft). The
    model card says nothing in it restricts or modifies the license.
  source_ids: [phi4-rv-model-card, phi4-rv-hf-api, phi4-rv-github-license]
checklist:
  weights:
    status: public
    note: Published on Hugging Face without gating.
    source_ids: [phi4-rv-hf-api, phi4-rv-model-card]
  inference_code:
    status: public
    note: >-
      The GitHub repository has Transformers and vLLM directories, and the model card documents
      the required torch, transformers, and vllm versions.
    source_ids: [phi4-rv-github-license, phi4-rv-model-card]
  training_code:
    status: unknown
    note: >-
      The Microsoft Research blog says fine-tuning code was released with the model, but the
      GitHub repository contains only Transformers and vLLM inference code, and this review did
      not locate the fine-tuning code elsewhere.
    source_ids: [phi4-rv-blog, phi4-rv-github-license]
  training_data_information:
    status: partial
    note: >-
      The model card and blog describe about 200 billion tokens of multimodal data. Most of it
      comes from filtered open-source vision-language datasets, with added internal Microsoft
      domain data and targeted acquisitions. The blog says some responses were regenerated with
      GPT-4o and o4-mini. An EU-format data card is published; the training data itself is not.
    source_ids: [phi4-rv-model-card, phi4-rv-blog, phi4-rv-data-card]
  training_recipe:
    status: partial
    note: >-
      The model card describes supervised fine-tuning on a mix of reasoning and non-reasoning
      data, the mid-fusion architecture, and compute (240 NVIDIA B200 GPUs for 4 days). A
      technical report is linked but was not reviewed here.
    source_ids: [phi4-rv-model-card]
  evaluation_materials:
    status: partial
    note: >-
      The model card reports results and names the open-source evaluation frameworks used
      (Eureka ML Insights and VLMEvalKit). Microsoft says benchmark logs were released; this
      review did not locate them.
    source_ids: [phi4-rv-model-card, phi4-rv-blog]
run_notes:
  - text: >-
      The model card lists torch 2.7.1 or later and transformers 4.57.1 or later (vllm 0.15.2 or
      later for vLLM). It says the model was tested on NVIDIA A6000, A100, H100, and B200 GPUs
      under Ubuntu 22.04.5 and recommends serving it with vLLM in bf16 precision.
    source_ids: [phi4-rv-model-card]
provenance:
  text: >-
    Built on Microsoft's Phi-4-Reasoning language model and a SigLIP-2 vision encoder, according
    to the model card. The Microsoft Research blog says some training responses were regenerated
    with GPT-4o and o4-mini.
  derived_from:
