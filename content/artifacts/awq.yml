    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      Installed from source: clone the repository, create a Python 3.10 conda environment,
      pip-install the package, build the CUDA kernels, and install FlashAttention. Separate
      steps are documented for NVIDIA Jetson Orin.
    source_ids: [awq-repo]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      The README targets NVIDIA GPUs through CUDA kernels, with examples on desktop GPUs (RTX
      4090), Jetson Orin edge devices, and NVIDIA laptops. The README documents no other
      hardware backends.
    source_ids: [awq-repo]
    reviewed_at: 2026-10-01
  release_status:
    status: not_public
    note: >-
      The GitHub releases page lists no releases; the code is used from the main branch. The
      README's news entries run through April 2025.
    source_ids: [awq-releases, awq-repo]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The README documents installation with a Python 3.10 conda environment, compiling the
      W4A16 CUDA kernels, and installing FlashAttention. For Jetson Orin it says to install
      NVIDIA's precompiled PyTorch (2.0.0 or later) and adjust the Python version to the
      JetPack release.
    source_ids: [awq-repo]
    reviewed_at: 2026-10-01
  - text: >-
      The README states that AWQ has been integrated into Hugging Face Transformers, vLLM,
      TensorRT-LLM, Hugging Face TGI, LMDeploy, and other tools, and points to AutoAWQ as a
      separate third-party implementation.
    source_ids: [awq-repo]
    reviewed_at: 2026-10-01
