summary:
  text: >-
    AWQ is a post-training method and codebase for low-bit (INT3/INT4) weight-only quantization
    of large language models, including instruction-tuned and multimodal models. It uses
    activation statistics to find the most important weight channels and scales them before
    quantization, without backpropagation. The repository also includes 4-bit CUDA kernels and
    TinyChat, an inference interface for running quantized models on desktop and edge GPUs.
  source_ids: [awq-paper, awq-repo]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Quantizing language and vision-language models to 4-bit or 3-bit weights to reduce the
    memory needed to serve them, and running the quantized models with the included kernels
    and TinyChat. The README provides example scripts for model families such as Llama, Qwen,
    DeepSeek-R1-Distill, and VILA, and pre-computed AWQ search results on Hugging Face.
  source_ids: [awq-repo]
  reviewed_at: 2026-10-01
