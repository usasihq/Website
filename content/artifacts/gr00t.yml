summary:
  text: >-
    Isaac GR00T N is NVIDIA's family of open vision-language-action models for humanoid and
    other robots. The models take camera images, language instructions, and robot state and
    output continuous actions, using a vision-language backbone with a diffusion-transformer
    action head. The repository describes N1.7 as the latest version of GR00T N1 and lists
    N1.5 and N1.6 as previous releases.
  source_ids: [gr00t-readme, gr00t-n17-card]
useful_for:
  text: >-
    NVIDIA describes the models as cross-embodiment foundations that developers post-train with
    real or synthetic data for a specific robot or task.
  source_ids: [gr00t-n17-card, gr00t-readme]
