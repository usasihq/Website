license_notes:
  text: >-
    The Isaac-GR00T repository's license section states that its code is Apache 2.0 and the
    model weights are under the NVIDIA Open Model License, although its overview also calls
    N1.7 commercially licensable under Apache 2.0. Some fine-tuned GR00T checkpoints on Hugging
    Face carry other NVIDIA licenses (for example, GR00T-H lists an NVIDIA non-commercial
    license), so check each checkpoint.
