summary:
  text: >-
    TimesFM (Time Series Foundation Model) is a family of pretrained time-series forecasting
    models developed by Google Research, first described in an ICML 2024 paper. Open
    checkpoints have been released as versions 1.0, 2.0, 2.5 (September 2025), and 3.0 (August
    2026); version 3.0 adds native multivariate forecasting and native support for past-only
    and past-and-future covariates.
  source_ids: [timesfm-readme, timesfm3-blog]
useful_for:
  text: >-
    The repository describes TimesFM for zero-shot time-series forecasting, and notes that
    Google also offers it through BigQuery ML, Google Sheets, and Vertex Model Garden.
  source_ids: [timesfm-readme]
