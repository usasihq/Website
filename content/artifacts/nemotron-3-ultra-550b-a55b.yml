    recorded.
  source_ids: [openmdw-1-1-license, spdx-license-list]
checklist:
  weights:
    status: public
    note: BF16 and NVFP4 post-trained checkpoints and a BF16 base checkpoint are published on Hugging Face.
    source_ids: [ultra-model-card, ultra-hf-metadata]
  inference_code:
    status: public
    note: The model card gives deployment instructions for vLLM, SGLang, and TensorRT-LLM.
    source_ids: [ultra-model-card]
  training_code:
    status: public
    note: >-
      The Apache-2.0 Nemotron Developer Repository provides pretraining and SFT recipes built on
      Megatron-Bridge and a representative RL/distillation pass using NeMo RL.
    source_ids: [ultra-recipe-doc, nemotron-repo-license]
  training_data_information:
    status: partial
    note: >-
      The model card lists the pre- and post-training datasets. Major portions are released in
      Hugging Face collections, some requiring access approval, while several third-party and
      NVIDIA datasets are listed as private and not publicly accessible.
    source_ids: [ultra-model-card, nemotron-pretraining-collection]
  training_recipe:
    status: partial
    note: >-
      NVIDIA's recipe covers pretraining and SFT, but states that the full multi-iteration RL
      and on-policy distillation pipeline is not reproduced because the intermediate teacher
      checkpoints it depends on have not been released. It also omits the 1M-token
      long-context pretraining phase because that data is not open-source.
    source_ids: [ultra-recipe-doc]
  evaluation_materials:
    status: public
    note: >-
      The model card publishes benchmark results and points to the NeMo Evaluator SDK for
      replication; it says some benchmarks used internal scaffolding not yet open-sourced.
    source_ids: [ultra-model-card]
run_notes:
  - text: >-
      The model card documents serving with vLLM, SGLang, and TensorRT-LLM, and lists NVIDIA
      Hopper (H100, H200), Grace Blackwell (GB200, GB300), and Blackwell (B200, B300) GPUs as
      test hardware.
    source_ids: [ultra-model-card]
  - text: >-
      For the BF16 checkpoint, the model card states a minimum of 8x GB200/B200/GB300/B300,
      16x H100, or 8x H200 GPUs, and points to the separate NVFP4 checkpoint for a smaller
      footprint.
    source_ids: [ultra-model-card]
provenance:
  text: >-
    Post-trained by NVIDIA (supervised fine-tuning, reinforcement learning, and multi-domain
    on-policy distillation) from its own pre-trained Nemotron 3 Ultra base checkpoint. The
    model card says post-training synthetic data was generated with teacher models, including
    third-party open models such as GPT-OSS-120B.
  derived_from:
    - name: NVIDIA-Nemotron-3-Ultra-550B-A55B-Base-BF16
      artifact_slug: null
      url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-Base-BF16
      note: NVIDIA's pre-trained base checkpoint for this release.
  source_ids: [ultra-model-card]
