summary:
  text: >-
    Nemotron 3 Ultra is an NVIDIA language model with 550B total and 55B active parameters,
    built on a hybrid Mamba-2 and attention architecture with latent mixture-of-experts layers
    and multi-token prediction. Reasoning can be switched on or off through the chat template.
    NVIDIA released BF16 and NVFP4 checkpoints and a separate base checkpoint on Hugging Face.
  source_ids: [ultra-model-card]
useful_for:
  text: >-
    The model card lists agentic workflows, long-context analysis, tool use, multilingual
    reasoning, and retrieval-augmented generation, and states the model is ready for
    commercial and non-commercial use.
  source_ids: [ultra-model-card]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model card names NVIDIA Corporation as the model developer. NVIDIA's principal
    executive offices are in Santa Clara, California, per its Form 10-Q for the quarter ended
    July 26, 2026.
  source_ids: [ultra-model-card, nvidia-10q-q2fy2027]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Weights are downloadable from Hugging Face under the OpenMDW-1.1 license; the repository
    metadata showed no access gate when checked.
  source_ids: [ultra-model-card, ultra-hf-metadata]
