summary:
  text: >-
    ONNX is an open format for representing machine learning models, covering both deep learning
    and traditional ML. It defines an extensible computation graph model, built-in operators,
    and standard data types, with a current focus on inference. Facebook and Microsoft started
    the ONNX community in 2017, and LF AI announced it as a graduate-level project in November
    2019.
  source_ids: [onnx-repo, lfai-onnx-announcement]
useful_for:
  text: >-
    Exchanging trained models between frameworks, tools, and hardware runtimes; the repository
    also provides a Python package with shape and type inference, opset version conversion, and
    a reference implementation.
  source_ids: [onnx-repo]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    ONNX is a hosted project of the LF AI & Data Foundation, a directed fund of The Linux
    Foundation; its PyPI contact list is on the LF AI & Data mailing-list domain and its README
    points to Linux Foundation trademark rules. The Linux Foundation is a 501(c)(6) nonprofit
    whose legal postal address is in San Francisco, California. Under the project's open
    governance, a five-member Steering Committee elected by community vote sets project
    direction, governance policy, and releases, with no more than one representative from any
    single member company; Special Interest Groups are responsible for specific parts of the
    project.
  source_ids: [lfai-onnx-page, lfai-charter, onnx-pypi, onnx-repo, lf-about, lf-privacy, onnx-governance]
