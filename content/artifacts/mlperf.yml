summary:
  text: >-
    MLPerf is MLCommons' family of system performance benchmarks. Its suites cover training
    (time to train a model to a target quality), inference in datacenter, edge, mobile, and tiny
    settings, and also client PCs, storage, automotive, HPC training, and inference endpoints.
    Results are submitted in rounds, reviewed by the submitting organizations, and published
    together by MLCommons.
  source_ids: [mlc-benchmarks, mlperf-training-page, mlperf-inference-dc-page, mlperf-submission-rules]
useful_for:
  text: >-
    Comparing how quickly hardware and software systems train or run reference models under
    common rules. The closed division fixes the reference model for like-for-like comparison,
    while the open division allows different models or retraining.
  source_ids: [mlperf-training-page, mlperf-inference-dc-page]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    MLPerf is developed and published by MLCommons, which holds the MLPerf trademark and hosts
    the reference implementations and rules in its GitHub organization. MLCommons Association
    is listed by the IRS as a 501(c)(6) organization with a Dover, Delaware address.
  source_ids: [mlc-benchmarks, mlperf-inference-repo, irs-eo-bmf-de]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Reference implementations and rules are public on GitHub under Apache 2.0, and published
    results can be browsed on the MLCommons site. Submitting results requires a signed
    Contributor License Agreement, and use of results with the MLPerf trademark must follow
    MLCommons' results messaging guidelines.
  source_ids: [mlperf-inference-license, mlperf-training-license, mlperf-policies-license, mlc-benchmarks, mlperf-submission-rules]
