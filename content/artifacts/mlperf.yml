license_notes:
  text: >-
    MLPerf is a registered trademark of MLCommons. The submission rules state that, after
    publication, code and results are public and free for use under the MLPerf Terms of Use.
    Benchmark datasets come from separate sources, and their terms were not reviewed for this
    record.
  source_ids: [mlc-benchmarks, mlperf-submission-rules]
checklist:
  code:
    status: public
    note: >-
      Reference implementations for the Inference and Training suites are on GitHub under Apache
      2.0; the Training README says they are starting points and not fully optimized.
    source_ids: [mlperf-inference-repo, mlperf-training-repo, mlperf-inference-license, mlperf-training-license]
  tasks_data:
    status: public
    note: >-
      Each reference implementation includes instructions for downloading its dataset; the
      Training README points to MLCommons storage for downloads. Terms vary by dataset and were
      not reviewed individually.
    source_ids: [mlperf-training-repo, mlperf-inference-repo]
  methodology:
    status: public
    note: >-
      Rules for Inference and Training are published, along with general submission rules
      covering divisions, availability categories, peer review, and publication.
    source_ids: [mlperf-inference-dc-page, mlperf-training-page, mlperf-submission-rules]
  reproducibility_instructions:
    status: public
    note: >-
      Reference implementations include Dockerfiles and run scripts, and submissions must
      include READMEs and software information so results can be replicated.
    source_ids: [mlperf-training-repo, mlperf-submission-rules]
  limitations:
    status: partial
    note: >-
      The Training README warns that reference implementations are not intended for real
      performance measurement, and results pages note that published results are sometimes
      modified or invalidated, with a change log. No broader discussion of benchmark validity was
      reviewed.
    source_ids: [mlperf-training-repo, mlperf-inference-dc-page]
run_notes:
  - text: >-
      At review, the Inference README's most recent round is MLPerf Inference v6.1 (submission
      deadline July 31, 2026), and the Inference: Datacenter page links to v6.1 results. The
      Training README lists MLPerf Training v6.1 (submission deadline October 16, 2026), while the
      Training results page shows v6.0 results.
    source_ids: [mlperf-inference-repo, mlperf-inference-dc-page, mlperf-training-repo, mlperf-training-page]
