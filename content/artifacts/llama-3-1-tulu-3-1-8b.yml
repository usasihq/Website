summary:
  text: >-
    An 8B instruction-following model from Ai2's Tülu 3 line, post-trained from Meta's Llama 3.1
    8B base model through supervised fine-tuning and DPO, then reinforcement learning with
    verifiable rewards. Version 3.1 differs from the original Tülu 3 8B only in the final RL
    stage, which switched from PPO to GRPO (without a reward model) with further hyperparameter
    tuning.
  source_ids: [mc-tulu31-8b, mc-tulu3-8b-sft, tulu3-paper]
useful_for:
  text: >-
    The card describes the Tülu 3 models as aimed at chat as well as tasks such as math (MATH,
    GSM8K) and precise instruction following (IFEval). It notes the models have limited safety
    training and no built-in response filtering.
  source_ids: [mc-tulu31-8b]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    Post-trained and released by Ai2 (Allen Institute for AI), which describes itself as a
    Seattle-based non-profit AI research institute. The base model, Llama 3.1 8B, was developed
    by Meta and is recorded as provenance; Ai2's post-training does not make the base model an
    Ai2 model.
  source_ids: [mc-tulu31-8b, mc-tulu3-8b-sft, ai2-about]
  assessed_at: 2026-09-29
