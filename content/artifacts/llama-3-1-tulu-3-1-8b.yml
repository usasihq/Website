license_notes:
  text: >-
    The weights inherit Meta's Llama 3.1 Community License, a custom license that requires
    displaying "Built with Llama", starting derived model names with "Llama", following Meta's
    Acceptable Use Policy, and a separate license from Meta for licensees whose products had
    more than 700 million monthly active users on the Llama 3.1 release date. The Tülu 3 SFT
    mixture is ODC-BY but includes subsets under
    other licenses, some non-commercial, and outputs of third-party models.
  source_ids: [llama31-license, mc-tulu3-8b-sft, tulu3-sft-mixture]
checklist:
  weights:
    status: public
    note: Final weights and the preceding SFT and DPO checkpoints are on Hugging Face.
    source_ids: [mc-tulu31-8b, mc-tulu3-8b-sft]
  inference_code:
    status: public
    note: The card documents loading with Hugging Face Transformers and serving with vLLM.
    source_ids: [mc-tulu31-8b]
  training_code:
    status: public
    note: >-
      Training code is in allenai/open-instruct; the card gives the exact commit and command
      used for the 3.1 GRPO run.
    source_ids: [mc-tulu31-8b, open-instruct-license]
  legacy_training_data_information:
    status: partial
    note: >-
      The post-training data (SFT mixture, 8B preference mixture, and RLVR prompts) is public
      on Hugging Face, but the card states that the size and composition of the Llama 3.1
      pretraining corpus is unknown.
    source_ids: [mc-tulu31-8b, mc-tulu3-8b-sft, tulu3-sft-mixture, tulu3-paper]
  training_recipe:
    status: public
    note: >-
      The technical report documents the SFT, DPO, and RLVR recipe; the card lists the GRPO
      hyperparameters and the final checkpoint step for version 3.1.
    source_ids: [tulu3-paper, mc-tulu31-8b]
  evaluation_materials:
    status: public
    note: >-
      The card links Ai2's OLMES evaluation repository and shows evaluation scores over
      training steps; the report describes the Tülu 3 evaluation suite and decontamination.
    source_ids: [mc-tulu31-8b, tulu3-paper]
run_notes:
  - text: >-
      The card documents serving with vllm serve allenai/Llama-3.1-Tulu-3.1-8B and suggests
      --max_model_len=8192 because of the long Llama chat template.
    source_ids: [mc-tulu31-8b]
provenance:
  text: >-
    Fine-tuned by Ai2 from Meta's Llama 3.1 8B base model: first to Llama-3.1-Tulu-3-8B-SFT on
    the Tülu 3 SFT mixture, then to Llama-3.1-Tulu-3-8B-DPO on the 8B preference mixture, then
    GRPO on the RLVR-GSM-MATH-IF-Mixed-Constraints prompts. Llama 3.1 was developed by Meta, not
    by Ai2.
  derived_from:
