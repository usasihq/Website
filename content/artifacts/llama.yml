summary:
  text: >-
    Llama is Meta's family of large language models. Meta's Llama models repository lists
    generations from Llama 2 (July 2023) through Llama 4 (April 2025), each with its own license
    file and acceptable use policy. Llama 4 is distributed under the custom Llama 4 Community
    License Agreement rather than a standard open-source license.
  source_ids: [llama-models-readme, llama4-license]
useful_for:
  text: >-
    Meta documents the Llama 4 models for commercial and research use, including assistant-style
    chat and visual reasoning for the instruction-tuned models and adaptation to other language
    generation tasks for the pretrained models.
  source_ids: [llama4-model-card]
