summary:
  text: >-
    Core ML Tools (coremltools) is Apple's Python package for converting machine learning models
    from libraries such as PyTorch, TensorFlow, scikit-learn, XGBoost, and LibSVM into the Core ML
    format, and for reading, writing, and optimizing Core ML models. On macOS it can also check a
    conversion by running predictions through Core ML.
  source_ids: [coremltools-readme]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Preparing trained models to run on Apple devices through the Core ML framework, which the
    README describes as running predictions on the user's device using the CPU, GPU, and Neural
    Engine; converted models are then integrated into apps with Xcode.
  source_ids: [coremltools-readme]
  reviewed_at: 2026-10-01
