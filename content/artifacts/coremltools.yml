    status: public
    note: >-
      The installation guide covers macOS and Linux; version 9.0 wheels on PyPI target macOS
      (x86_64 and arm64) and Linux x86_64. The README notes that verifying conversions by
      running predictions requires macOS. The installation page's Python version list describes
      version 8.0 and was not current when checked.
    source_ids: [coremltools-install, coremltools-pypi, coremltools-readme]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Versioned releases are published on GitHub and PyPI. Version 9.0 (published November 10,
      2025) added Python 3.13 support and iOS 26 and macOS 26 deployment targets; a 9.1.dev1
      development release followed in August 2026. The first PyPI upload (0.3.0) dates from
