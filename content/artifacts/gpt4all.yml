    source_ids: [gpt4all-docs]
  installation:
    status: public
    note: >-
      Installers for Windows (x64 and ARM), macOS, and Ubuntu; the Python package installs
      with pip. A Flathub build is community maintained.
    source_ids: [gpt4all-readme, nomic-gpt4all]
  supported_platforms:
    status: public
    note: >-
      Builds for Windows (x64, plus an ARM build for Qualcomm Snapdragon and Microsoft SQ1/SQ2
      processors), macOS 12.6 or newer (best on Apple Silicon), and x86-64 Linux; the README
      says the Linux build does not support ARM. A system requirements page lists minimum and
      recommended hardware; it also says Windows and Linux PCs with ARM CPUs are not currently
      supported, which conflicts with the README's Windows ARM build.
    source_ids: [gpt4all-readme, gpt4all-sysreq]
  release_status:
    status: public
    note: >-
      Versioned releases are published on GitHub. The latest is v3.10.0 (February 25, 2025),
      and the most recent commit to the main branch is from May 27, 2025.
    source_ids: [gpt4all-releases, gpt4all-commits]
run_notes: []
provenance:
  text: >-
    The GPT4All Python client wraps llama.cpp implementations, and the README says Nomic
    contributes to llama.cpp. The repository's citation entry refers to a 2023 report on
    training an assistant-style chatbot with data distilled from GPT-3.5-Turbo.
  derived_from:
    - name: llama.cpp
      artifact_slug: llama-cpp
      url: https://github.com/ggml-org/llama.cpp
      note: Inference backend wrapped by the Python client.
  source_ids: [gpt4all-readme]
