summary:
  text: >-
    GPT4All is Nomic's open-source desktop application for running large language models
    locally on Windows, macOS, and Linux. It includes LocalDocs for chatting with local files,
    a Python SDK, and an API server, and its Python client wraps llama.cpp.
  source_ids: [gpt4all-readme, nomic-gpt4all, gpt4all-docs]
useful_for:
  text: >-
    Running open models privately on ordinary desktops and laptops without calling a hosted
    API; the README says no GPU is required.
  source_ids: [gpt4all-readme, nomic-gpt4all]
