summary:
  text: >-
    MLC LLM is an open-source machine learning compiler and deployment engine for large language
    models. Compiled models run on MLCEngine, which offers an OpenAI-compatible API through a
    REST server and Python, JavaScript, iOS, and Android interfaces, with GPU backends including
    CUDA, ROCm, Vulkan, Metal, WebGPU, and OpenCL.
  source_ids: [mlc-readme]
useful_for:
  text: >-
    Deploying language models natively on desktop and server GPUs, mobile devices, and in web
    browsers from a shared engine and compiler.
  source_ids: [mlc-readme]
eligibility:
  status: pending_review
  basis: undetermined
  explanation: >-
    The project credits the "MLC team", and the MLC site describes MLC as an open community;
    neither documents a legal entity or location. CMU Catalyst lists MLC LLM among its research
    projects. The MLC site lists NSF, CMU, Catalyst, Purdue, NVIDIA, Amazon, and Google as
    supporting and contributing organizations. MLC's 2023 announcement says the project was
    initiated by members of CMU Catalyst, UW SAMPL, Shanghai Jiao Tong University, OctoML, and
    the MLC community. The governing entity is therefore a multi-institution community that
    cannot be documented as U.S.-based, so eligibility is left for editorial review.
  source_ids: [mlc-readme, mlc-home, cmu-catalyst, mlc-blog-2023]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Source code on GitHub under the Apache License 2.0. The installation guide distributes
    nightly pre-release pip wheels, recommends installing them into a conda environment, and
    also documents building from source.
  source_ids: [mlc-readme, mlc-license, mlc-install]
