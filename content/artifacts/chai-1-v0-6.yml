summary:
  text: >-
    The Chai-1 weights used by the current chai_lab package (version 0.6.1, published March 18,
    2025). They are distributed as six exported PyTorch module files (feature embedding, bond
    projection, token embedder, trunk, diffusion module, and confidence head). The package
    fetches them from Chai's asset server, and the same six files are in the Hugging Face
    repository, last updated February 18, 2025. The sources reviewed do not say which earlier
    package versions used these same files.
  reviewed_at: 2026-10-01
  source_ids: [chai-init, chai-pypi, chai-paths, chai1-py, hf-chai1-api]
useful_for:
  text: >-
    Folding complexes of proteins, small molecules, DNA, RNA, and glycosylations from FASTA
    input, optionally with MSAs, templates, inter-chain contact or covalent-bond restraints, and
    custom embeddings.
  reviewed_at: 2026-10-01
  source_ids: [chai-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Developed and published by Chai Discovery in its GitHub and Hugging Face organizations;
    the LICENSE and package source name Chai Discovery as copyright holder. Chai Discovery's
    careers page places its team in San Francisco, California, and its website terms choose
    California law with San Francisco courts.
  source_ids: [chai-license, chai-init, hf-chai1-card, chai-careers, chai-terms]
  assessed_at: 2026-10-01
availability:
  status: public
  reviewed_at: 2026-10-01
  access_conditions: >-
    The chai_lab package downloads the weights automatically from Chai's asset server, and the
    same component files are in an ungated Hugging Face repository. The current LICENSE and
    README do not reference an acceptable use policy; the original 2024 community license did.
  source_ids: [chai-paths, hf-chai1-api, chai-readme, chai-license, chai-license-2024-09]
licenses:
  - name: Apache License 2.0
    spdx: Apache-2.0
    url: https://raw.githubusercontent.com/chaidiscovery/chai-lab/main/LICENSE
    applies_to: weights-and-code
    reviewed_at: 2026-10-01
    effective_at: 2024-11-27
    source_ids: [chai-license, chai-readme, hf-chai1-api, chai-license-2024-11-27]
license_notes:
  text: >-
    Current terms: the repository LICENSE is Apache License 2.0 (copyright 2024 Chai Discovery),
    the README states that code and model weights are both under Apache 2.0 for academic and
    commercial use including drug discovery, and the Hugging Face repository is tagged
    apache-2.0. Earlier terms: at the September 2024 release, LICENSE.md was the Chai Discovery
    Community License Agreement from Chai Discovery, Inc., which granted rights to the code,
    weights, and outputs only for non-commercial purposes, excluded commercial entities, and
    incorporated an acceptable use policy. That file was replaced with the Apache 2.0 text in a
    commit dated November 27, 2024, and package version 0.4.2 was released the same day. This
    release record covers the weights fetched by version 0.6.1, which postdate the change.
  reviewed_at: 2026-10-01
  effective_at: 2024-11-27
  source_ids: [chai-license, chai-readme, hf-chai1-api, chai-license-2024-09, chai-license-history, chai-license-2024-11-27, chai-license-change-commit, chai-pypi]
