run_notes:
  - text: >-
      The README says the package requires Linux, Python 3.10 or later, and a CUDA GPU with
      bfloat16 (bf16) support. It recommends A100 80GB, H100 80GB, or L40S 48GB GPUs, with A10
      and A30 usable for smaller complexes; it states no further memory assumptions, such as
      complex size.
    reviewed_at: 2026-10-01
    source_ids: [chai-readme]
  - text: >-
      By default the model generates five samples without MSAs or templates; the README
      recommends MSAs and documents an option to query the public ColabFold MMseqs2 server.
    reviewed_at: 2026-10-01
    source_ids: [chai-readme]
