license_notes:
  text: >-
    OpenMDW-1.1 grants broad use rights and places no restrictions on outputs. It
    requires keeping the license and notices when redistributing, and ends the rights
    of anyone who sues claiming the materials infringe a patent or copyright. The
    predecessor, Laguna XS.2, is published under Apache 2.0. The model card asks
    users to follow Poolside's Acceptable Use Policy.
  source_ids: [laguna-xs-license-file, hf-laguna-xs-2-1, hf-laguna-xs2]
checklist:
  weights:
    status: public
    note: BF16 weights are in the ungated repository; FP8, NVFP4, and INT4 variants are published as a collection.
    source_ids: [hf-laguna-xs-2-1, poolside-laguna-xs-2-1-blog]
  inference_code:
    status: public
    note: The repository includes modeling code (modeling_laguna.py), and the model card documents vLLM, SGLang, Transformers, TensorRT-LLM, llama.cpp, and Ollama.
    source_ids: [hf-laguna-xs-2-1, laguna-xs-repo-files]
  training_code:
    status: unknown
    note: null
    source_ids: []
  legacy_training_data_information:
    status: partial
    note: >-
      The model card points to the Laguna M.1/XS.2 technical report, which describes
      the XS.2 pre-training mix (web, code, curated educational and academic text, and
      synthetic data). Any data changes for XS 2.1 are not described, and no public data release was found.
    source_ids: [hf-laguna-xs-2-1, laguna-tech-report]
  training_recipe:
    status: partial
    note: >-
      The technical report documents XS.2 pre-training, supervised fine-tuning, and
      agentic reinforcement learning. The changes made for XS 2.1 are summarized, not
      specified.
    source_ids: [laguna-tech-report, hf-laguna-xs-2-1]
  evaluation_materials:
    status: partial
    note: The model card publishes benchmark results with the harness, sampling settings, and sandbox resources used.
    source_ids: [hf-laguna-xs-2-1]
run_notes:
  - text: >-
      The model card documents support in vLLM, SGLang, Transformers, TensorRT-LLM,
      and llama.cpp, plus Ollama (with MLX) and mlx-lm for local use on a Mac. It
      notes a pending llama.cpp fix for empty output with Ollama on Apple Silicon.
    source_ids: [hf-laguna-xs-2-1]
provenance:
  text: >-
    The model card describes Laguna XS 2.1 as an upgraded version of Laguna XS.2.
    The technical report states that XS.2 was trained from scratch by Poolside.
  derived_from:
