summary:
  text: >-
    Laguna XS 2.1 is a mixture-of-experts model with 33B total and 3B active
    parameters per token, built for agentic coding on a local machine. Poolside
    describes it as an upgraded version of Laguna XS.2 with the same architecture. It
    supports interleaved reasoning between tool calls and has a 262,144-token context
    window.
  source_ids: [hf-laguna-xs-2-1, poolside-laguna-xs-2-1-blog]
useful_for:
  text: >-
    Poolside documents it for agentic coding and long-horizon work on local machines,
    used through its agent CLI, OpenAI-compatible API integrations, or local runtimes
    such as Ollama and MLX.
  source_ids: [hf-laguna-xs-2-1, poolside-model-release-notes]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Developed and published by Poolside, Inc., which states that it is headquartered
    in San Francisco. See the poolside organization record for the assessment of its
    French presence. It updates Laguna XS.2, which Poolside's technical report says
    it trained from scratch.
  source_ids: [poolside-laguna-s-release, hf-laguna-xs-2-1, laguna-tech-report]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: Weights download from Hugging Face without an access gate. Also served through the Poolside API and OpenRouter.
  source_ids: [hf-laguna-xs-2-1, poolside-laguna-xs-2-1-blog]
