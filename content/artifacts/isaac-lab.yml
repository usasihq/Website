license_notes:
  text: >-
    The framework is BSD-3-Clause, while the isaaclab_mimic extension and its standalone scripts
    are Apache 2.0. The README notes that Isaac Sim includes components under proprietary terms
    and that isaaclab_mimic requires cuRobo, which also has proprietary terms; license files for
    dependencies and assets are kept in the repository's docs/licenses directory.
  source_ids: [isaaclab-readme, isaaclab-license, isaaclab-license-mimic]
  reviewed_at: 2026-10-01
checklist:
  source_code:
    status: public
    note: Developed in the public isaac-sim/IsaacLab GitHub repository.
    source_ids: [isaaclab-readme]
    reviewed_at: 2026-10-01
  documentation:
    status: public
    note: Versioned documentation covers installation, tutorials, how-to guides, environments, and API reference.
    source_ids: [isaaclab-docs-home]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      The installation guide documents pip, binary-plus-source, full source, pip-only, and Docker
      methods; Isaac Sim must be installed first for workflows that depend on it.
    source_ids: [isaaclab-install]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      The main-branch guide lists Ubuntu 22.04 (Linux x64) or Windows 11 (x64), at least 32 GB RAM
      and 16 GB GPU VRAM, and describes limitations on aarch64 DGX Spark. Isaac Lab 3.0 targets
      Isaac Sim 6.1 and Python 3.12.
    source_ids: [isaaclab-install, isaaclab-readme]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      The Orbit project page dates the official Isaac Lab release to June 2024 (an update marked 03.06.2024). Versioned
      releases are tagged on GitHub. Isaac Lab 3.0 Early Access (v3.0.0-EA) was
      published on September 16, 2026; the 2.3.x line (isaaclab 2.3.2.post1 on PyPI) supports
      Isaac Sim 4.5 to 5.1.
    source_ids: [isaaclab-release-3-0-0-ea, isaaclab-pypi, isaaclab-readme, orbit-page]
    reviewed_at: 2026-10-01
run_notes: []
provenance:
  text: >-
    Isaac Lab development started from the Orbit framework, whose project page lists authors
    affiliated with ETH Zurich, NVIDIA, and the University of Toronto and says Orbit continued as
    Isaac Lab. NVIDIA's technical report presents Isaac Lab as the successor to NVIDIA Isaac Gym.
    Full-featured workflows depend on NVIDIA Isaac Sim, which includes proprietary components.
  derived_from:
    - name: Orbit
      artifact_slug: null
      url: https://isaac-orbit.github.io/
      note: Framework from which Isaac Lab development started, per the README and the Orbit project page.
  source_ids: [isaaclab-readme, isaaclab-paper, orbit-page]
