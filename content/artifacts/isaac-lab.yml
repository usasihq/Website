summary:
  text: >-
    Isaac Lab is an open-source, GPU-accelerated framework for robot learning built on NVIDIA
    Isaac Sim. It provides robot models, ready-to-train environments, sensor simulation, and
    workflows for reinforcement learning, imitation learning, and motion planning. Its technical
    report describes it as the successor to Isaac Gym; its development started from the Orbit
    framework.
  source_ids: [isaaclab-readme, isaaclab-paper, isaaclab-docs-home]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Training robot policies in simulation, including humanoids, manipulators, and quadrupeds,
    with reinforcement learning libraries such as RSL RL, SKRL, RL Games, and Stable Baselines;
    NVIDIA describes it as the robot learning framework of its Isaac GR00T platform.
  source_ids: [isaaclab-readme, isaaclab-dev-page]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Multi-organization assessment. The CONTRIBUTORS file lists four developer organizations:
    NVIDIA Corporation & Affiliates, Boston Dynamics AI Institute, ETH Zurich, and the University
    of Toronto, and the copyright is held by "The Isaac Lab Project Developers". Direction and
    distribution are documented as NVIDIA's: the repository is hosted in the NVIDIA Isaac Sim
    GitHub organization, NVIDIA distributes it as "NVIDIA Isaac Lab" on its developer site, and
    the technical report is published under NVIDIA's name, with all three members of its "core
    leadership" (defined as having primary responsibility for organizational and technical
    direction) listed with NVIDIA affiliations. NVIDIA's principal executive offices are in Santa
    Clara, California, per its Form 10-Q for the quarter ended July 26, 2026. No separate
    governance charter was found.
  source_ids: [isaaclab-contributors, isaaclab-license, isaac-sim-github-org, isaaclab-dev-page, isaaclab-paper, nvidia-10q-q2fy2027]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code is public on GitHub. Full-featured workflows (PhysX, RTX rendering, ROS, URDF and
    MJCF importers) require NVIDIA Isaac Sim, which includes components under proprietary terms;
    the README says Kit-less Newton workflows do not require Isaac Sim.
  source_ids: [isaaclab-readme]
  reviewed_at: 2026-10-01
