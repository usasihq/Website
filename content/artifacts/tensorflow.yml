summary:
  text: >-
    TensorFlow is an open-source, end-to-end machine learning platform with stable Python and
    C++ APIs, originally developed within Google Brain. With the 2.21 release in March 2026,
    Google said it would limit TensorFlow work to security and bug fixes, dependency updates,
    and community contributions, and pointed new generative AI work to Keras 3, JAX, and
    PyTorch.
  source_ids: [tf-repo-api, tf-readme, tf-221-blog]
useful_for:
  text: >-
    The project describes TensorFlow as a platform and ecosystem of tools and libraries for
    building and deploying machine learning applications. Google's 2.21 announcement says the
    TensorFlow Lite project has been renamed LiteRT and is developed separately.
  source_ids: [tf-readme, tf-221-blog]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The PyPI package lists Google Inc. as author. TensorFlow's contributing guide requires
    Google's Contributor License Agreement and describes copying accepted pull requests into
    Google's internal codebase for testing. Google's developer blog announced, with the 2.21
    release, the work TensorFlow would focus on going forward. Google's parent Alphabet Inc. has its principal executive offices
    in Mountain View, California, per its fiscal 2025 Form 10-K.
  source_ids: [tf-pypi, tf-contributing, tf-221-blog, alphabet-10k-2025]
  assessed_at: 2026-09-29
