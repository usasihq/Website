summary:
  text: >-
    NeMo Framework is NVIDIA's open-source Python framework for pretraining, post-training,
    and reinforcement learning of generative AI models, organized as separate libraries in the
    NVIDIA-NeMo GitHub organization, including Megatron Bridge, AutoModel, NeMo RL, Curator,
    Evaluator, Export-Deploy, Run, and NeMo Speech. In 2026 the original NeMo repository was
    split and now focuses on audio, speech, and multimodal LLMs as NeMo Speech (version 3.0),
    and for the framework container from 26.02 onward NVIDIA points to Megatron Bridge's
    documentation and release notes.
  source_ids: [nemo-docs-landing, nvidia-nemo-github-org, nemo-speech-readme, nemo-fw-overview]
useful_for:
  text: >-
    NVIDIA's documentation lists data curation (Curator), training and fine-tuning of large
    language, vision-language, and speech models (Megatron Bridge, AutoModel, NeMo Speech),
    post-training with reinforcement learning (NeMo RL), evaluation (Evaluator), and export
    and deployment to inference engines (Export-Deploy).
  source_ids: [nemo-docs-landing, mbridge-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The libraries are published under the NVIDIA-NeMo GitHub organization, NVIDIA's
    documentation presents NeMo Framework as an NVIDIA software suite component, and the PyPI
    packages list NVIDIA as author. NVIDIA's principal executive offices are in Santa Clara,
    California, per its Form 10-Q for the quarter ended July 26, 2026.
  source_ids: [nvidia-nemo-github-org, nemo-docs-landing, mbridge-pypi, nemo-toolkit-pypi, nvidia-10q-q2fy2027]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Library source code is public on GitHub. The prebuilt NeMo Framework container on NVIDIA
    NGC is covered by the NVIDIA AI Product Agreement rather than Apache 2.0.
  source_ids: [nvidia-nemo-github-org, nemo-fw-overview]
