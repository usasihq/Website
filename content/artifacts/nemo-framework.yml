license_notes:
  text: >-
    The library repositories checked (Megatron Bridge, AutoModel, NeMo RL, Curator, Evaluator,
    and NeMo Speech) carry the Apache License 2.0; Curator's LICENSE file also includes an MIT
    License notice for Microsoft code. NVIDIA's user guide states that the NeMo
    Framework container is licensed under the NVIDIA AI Product Agreement, accepted by pulling
    and using it, and that it contains Llama materials governed by Meta's Llama 3 Community
    License Agreement.
  source_ids: [mbridge-license, automodel-license, nemo-rl-license, curator-license, evaluator-license, nemo-speech-license, nemo-fw-overview]
checklist:
  source_code:
    status: public
    note: Each library is developed in a public repository under github.com/NVIDIA-NeMo.
    source_ids: [nvidia-nemo-github-org]
  documentation:
    status: public
    note: Per-library documentation is published under docs.nvidia.com/nemo.
    source_ids: [nemo-docs-landing, nemo-fw-overview]
  installation:
    status: public
    note: >-
      NVIDIA recommends the NeMo Framework container from NGC for Megatron Bridge; libraries
      are also installable from PyPI (for example megatron-bridge and nemo-toolkit) or from
      source.
    source_ids: [mbridge-readme, nemo-speech-readme, mbridge-pypi, nemo-toolkit-pypi]
  supported_platforms:
    status: public
    note: >-
      Requirements are documented per library. NeMo Speech requires Python 3.12 or later and
      PyTorch 2.7 or later, and needs an NVIDIA GPU with CUDA for training. The component
      versions page lists the CUDA, PyTorch, and Megatron Core versions in each framework
      container.
    source_ids: [nemo-speech-readme, mbridge-software-versions]
  release_status:
    status: public
    note: >-
      NeMo Framework containers are versioned by year and month; the component versions page
      lists releases through 26.06. Individual libraries publish their own releases (for
      example NeMo Speech 3.0.0).
    source_ids: [mbridge-software-versions, nemo-speech-readme]
