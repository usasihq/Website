summary:
  text: >-
    A text embedding model that updates nomic-embed-text-v1 with Matryoshka representation
    learning, so its 768-dimension embeddings can be shortened to as few as 64 dimensions, or
    binarized, with a small loss in quality. Released in February 2024, it follows v1's long-context
    design, which Nomic describes as supporting 8,192 tokens.
  source_ids: [nomic-embed-v15-news, nomic-embed-v15-card, nomic-embed-v1-news]
useful_for:
  text: >-
    Embedding documents and queries for retrieval-augmented generation and search, and texts
    for clustering and classification, selected with the task prefixes search_document,
    search_query, clustering, and classification. Nomic's vision model
    nomic-embed-vision-v1.5 is aligned to its embedding space, so text and image embeddings
    can be compared.
  source_ids: [nomic-embed-v15-card]
