    note: >-
      The card documents use with Sentence Transformers, Transformers, and Transformers.js,
      and says trust_remote_code is no longer needed from Transformers 5.5.0 and Sentence
      Transformers 5.3.0.
    source_ids: [nomic-embed-v15-card]
  training_code:
    status: public
    note: Training code is in the contrastors repository.
    source_ids: [nomic-embed-v15-news, contrastors-repo]
  legacy_training_data_information:
    status: public
    note: >-
      The card says the training data is released in full. The contrastors README explains
      how to download it from Nomic's storage after creating a Nomic Atlas account.
    source_ids: [nomic-embed-v15-card, nomic-embed-v15-news, contrastors-repo]
  training_recipe:
    status: partial
    note: >-
      The card describes the stages: start from nomic-bert-2048, contrastive training on
      weakly related text pairs (for example forum question-answer pairs and review
      title-body pairs), then fine-tuning on labeled data with hard-example mining; the
      technical report gives details.
    source_ids: [nomic-embed-v15-card]
  evaluation_materials:
    status: unknown
    note: null
    source_ids: []
run_notes:
  - text: >-
      The card shows applying layer normalization before truncating to a smaller Matryoshka
      dimension and then normalizing, and explains how to extend the sequence length past
      2,048 tokens with dynamic RoPE scaling.
    source_ids: [nomic-embed-v15-card]
provenance:
