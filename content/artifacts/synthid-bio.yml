license_notes:
  text: >-
    The README states that all software is under Apache 2.0, that the ProteinMPNN model
    parameters are redistributed under their original MIT License, and that the data directory
    is under CC-BY 4.0. AlphaFold 3 model parameters are covered by the separate AlphaFold 3
    Model Parameters Terms of Use, which the repository references rather than reproduces. The
    README also states that software, parameters, and outputs are for theoretical modeling only
    and not for clinical use.
  source_ids: [ synthidbio-repo, synthidbio-weights-terms ]
  reviewed_at: 2026-10-04
