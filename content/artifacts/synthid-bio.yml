summary:
  text: >-
    SynthID Bio is a set of methods from Google DeepMind for watermarking AI-generated protein
    sequences and biomolecular structures so that their AI origin can later be detected.
    SynthID Bio-sequence adds watermarked sampling to the ProteinMPNN inverse-folding model, and
    SynthID Bio-structure is a fine-tuned AlphaFold 3 model that embeds a watermark in generated
    structures. The public repository contains the sequence watermarking code, a standalone
    detection script, and data supporting the paper.
  source_ids: [ synthidbio-repo, synthidbio-paper ]
  reviewed_at: 2026-10-04
useful_for:
  text: >-
    Generating watermarked protein sequences with ProteinMPNN and computing detection scores for
    existing sequences in FASTA files, for research on the provenance of AI-designed proteins.
    The paper describes the work as a proof of concept.
  source_ids: [ synthidbio-repo, synthidbio-paper ]
  reviewed_at: 2026-10-04
