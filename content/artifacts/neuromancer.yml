summary:
  text: >-
    NeuroMANCER (Neural Modules with Adaptive Nonlinear Constraints and Efficient
    Regularizations) is an open-source differentiable programming library written in PyTorch
    and published by Pacific Northwest National Laboratory. It is built for learning to solve
    parametric constrained optimization problems, physics-informed system identification, and
    model-based optimal control, and it provides a symbolic interface for adding physics
    equations, domain knowledge, and constraints to learned models.
  source_ids: [neuromancer-repo]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    The README lists learning to optimize, learning to model dynamical systems (for example
    with neural ODEs, Koopman operators, or SINDy), and learning to control with differentiable
    predictive control. Its tutorials include examples for building control, HVAC load
    forecasting, and grid-responsive building energy systems.
  source_ids: [neuromancer-repo]
  reviewed_at: 2026-10-01
