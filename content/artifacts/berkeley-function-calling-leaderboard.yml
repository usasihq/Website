summary:
  text: >-
    The Berkeley Function Calling Leaderboard (BFCL) is a benchmark and live leaderboard from UC
    Berkeley's Gorilla project for evaluating how well language models call functions and tools.
    It checks serial and parallel function calls in several programming languages using
    abstract syntax tree (AST) evaluation. Later versions add multi-turn and multi-step
    scenarios and, in V4, agentic tasks such as web search, memory management, and format
    sensitivity.
  source_ids: [bfcl-paper, bfcl-readme, bfcl-leaderboard, bfcl-hf]
useful_for:
  text: >-
    Evaluating function calling in API-hosted models and in locally hosted open models served
    through vLLM or SGLang, and comparing models on the public leaderboard, which also reports
    cost and latency.
  source_ids: [bfcl-readme, bfcl-leaderboard]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The ICML 2025 paper describing BFCL lists the University of California, Berkeley as the
    affiliation of all its authors. The leaderboard is hosted at gorilla.cs.berkeley.edu, and the
    dataset is published by the Hugging Face organization "Gorilla LLM (UC Berkeley)". The code
    sits in the Gorilla repository, hosted under an individual GitHub account, and no separate
    legal entity for the project was found. Eligibility rests on this documented UC Berkeley
    maintenance. UC Berkeley is a campus of the University of California, which is governed by
    The Regents under the California Constitution.
  source_ids: [bfcl-paper, bfcl-leaderboard, bfcl-hf, bfcl-readme, uc-regents-about]
  assessed_at: 2026-09-29
