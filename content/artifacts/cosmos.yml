  explanation: >-
    The Cosmos models are developed and published by NVIDIA Corporation, which has its
    principal executive offices in Santa Clara, California, per its Form 10-Q for the quarter
    ended July 26, 2026. Cosmos 3 Nano and Super are initialized from Qwen3-VL weights
    developed by the Qwen team at Alibaba Cloud; that provenance is recorded on the release
    records.
