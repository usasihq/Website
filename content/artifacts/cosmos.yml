summary:
  text: >-
    Cosmos is NVIDIA's family of world foundation models, datasets, and tools for physical AI
    such as robots, autonomous vehicles, and smart infrastructure. Earlier generations were
    released as separate Predict, Transfer, and Reason models (for example Cosmos-Predict2.5
    and Cosmos-Reason2). Cosmos 3 merges understanding and generation of text, images, video,
    audio, and actions in one mixture-of-transformers model family; its Super (64B) and Nano
    (16B) models were released on May 31, 2026, and the Edge (4B) model followed in July 2026.
  source_ids: [cosmos-github, cosmos3-press, cosmos3-report, predict25-hf-api, transfer25-hf-api, reason2-8b-hf-api]
useful_for:
  text: >-
    NVIDIA describes Cosmos 3 for world understanding and generation, simulation, synthetic
    data generation, and robot policy learning in robotics, autonomous driving, and
    industrial settings.
  source_ids: [cosmos3-press, cosmos-github]
eligibility:
