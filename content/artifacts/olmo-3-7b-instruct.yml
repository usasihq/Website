summary:
  text: >-
    A 7B chat model in Ai2's Olmo 3 release, post-trained from the Olmo 3 7B base model with
    supervised fine-tuning, direct preference optimization, and reinforcement learning with
    verifiable rewards on the Dolci datasets. It responds without a separate reasoning trace,
    unlike the Olmo 3 Think models.
  source_ids: [mc-olmo3-7b-instruct, olmo3-report, ai2-olmo3-blog]
useful_for:
  text: >-
    Ai2 documents the Instruct models for general chat, instruction following, and function
    calling, including tool use through vLLM's olmo3 tool-call parser and use with MCP
    servers.
  source_ids: [ai2-docs-olmo, mc-olmo3-7b-instruct]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    The model card states the model was developed by the Allen Institute for AI (Ai2), which
    describes itself as a Seattle-based non-profit AI research institute.
  source_ids: [mc-olmo3-7b-instruct, ai2-about]
  assessed_at: 2026-09-29
availability:
