checklist:
  weights:
    status: public
    note: Final weights and post-training checkpoints (step revisions) are published on Hugging Face.
    source_ids: [mc-olmo3-7b-instruct]
  inference_code:
    status: public
    note: >-
      The model card documents inference with Hugging Face Transformers and vLLM; Ai2's
      documentation adds a vLLM function-calling example.
    source_ids: [mc-olmo3-7b-instruct, ai2-docs-olmo]
  training_code:
    status: public
    note: >-
      open-instruct publishes the Olmo 3 7B Instruct SFT, DPO, and RL scripts; its README
      states that SFT runs on OLMo-core and DPO and RL on open-instruct. Base-model training
      scripts are in OLMo-core.
    source_ids: [open-instruct-olmo3, olmo-core-olmo3]
  training_data_information:
    status: partial
    note: >-
      The Dolci post-training datasets are downloadable under ODC-BY, but the Dolma 3 Mix used
      to pretrain the underlying base model has some olmOCR science PDFs redacted after
      training, which its dataset card says affects reproducibility.
    source_ids: [dolci-instruct-sft, dolma3-mix-7b, mc-olmo3-7b-instruct]
  training_recipe:
    status: public
    note: >-
      The technical report describes the Instruct post-training pipeline, and the open-instruct
      README lists the scripts, commits, and experiment logs used for each stage.
    source_ids: [olmo3-report, open-instruct-olmo3]
  evaluation_materials:
    status: public
    note: >-
      The model card publishes post-training evaluation results; OLMES documents commands for
      running the Olmo 3 evaluation suites.
    source_ids: [mc-olmo3-7b-instruct, olmes-repo]
run_notes:
  - text: >-
      The model card documents inference with Hugging Face Transformers 4.57.0 or later and
      with vLLM, and recommends temperature 0.6 and top_p 0.95.
    source_ids: [mc-olmo3-7b-instruct]
  - text: >-
      Ai2's documentation gives a vLLM (0.11.1 or later) serving command with automatic tool
      choice and the olmo3 tool-call parser, which exposes an OpenAI-compatible endpoint.
    source_ids: [ai2-docs-olmo]
provenance:
  text: >-
    Fine-tuned by Ai2 from its own Olmo 3 7B base model (Olmo-3-1025-7B) through the
    Olmo-3-7B-Instruct-SFT and Olmo-3-7B-Instruct-DPO checkpoints, followed by RLVR on the
    Dolci Instruct RL data.
  derived_from:
    - name: Olmo 3 7B (base)
      artifact_slug: olmo-3-1025-7b
      url: https://huggingface.co/allenai/Olmo-3-1025-7B
      note: Base model.
    - name: Dolci Instruct SFT
      artifact_slug: null
      url: https://huggingface.co/datasets/allenai/Dolci-Instruct-SFT
      note: Supervised fine-tuning mixture.
  source_ids: [mc-olmo3-7b-instruct, dolci-instruct-sft]
