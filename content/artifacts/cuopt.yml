license_notes:
  text: >-
    The Apache 2.0 license covers the open-source repository. The NVIDIA AI Enterprise offering
    is subject to its own licensing; the documentation says NVIDIA AI Enterprise support extends
    only to the cuOpt routing service API. Contributions require a Developer Certificate of
    Origin sign-off.
  source_ids: [cuopt-license, cuopt-docs-intro, cuopt-contributing]
  reviewed_at: 2026-10-01
