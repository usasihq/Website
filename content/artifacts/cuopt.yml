summary:
  text: >-
    cuOpt is NVIDIA's GPU-accelerated optimization engine for linear programming, quadratic
    programming, and vehicle routing, with beta support for mixed integer, quadratically
    constrained quadratic, and second-order cone programming. Its core is written in C++ with C,
    Python, and server APIs. NVIDIA announced in March 2025 that it would open-source cuOpt, and
    an NVIDIA post in June 2025 said it was available under Apache 2.0.
  source_ids: [cuopt-readme, cuopt-docs-intro, cuopt-blog-announce, cuopt-devblog-open-source]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Solving large linear and mixed integer programs and routing problems such as traveling
    salesperson, vehicle routing, and pickup-and-delivery problems, either as a library or as a
    self-hosted optimization service; the README notes the MIP solver is in beta.
  source_ids: [cuopt-readme, cuopt-docs-intro]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The repository is in NVIDIA's GitHub organization, source files carry NVIDIA Corporation &
    Affiliates copyright notices, and the contribution guide says the NVIDIA cuOpt team triages
    issues and schedules them for releases. The README says the repository is also hosted as a
    COIN-OR project, and NVIDIA's posts describe working with the COIN-OR Foundation to make and
    distribute cuOpt as open source; no governing role for COIN-OR is documented in the sources
    reviewed. NVIDIA's principal executive offices are in Santa Clara, California, per its Form
    10-Q for the quarter ended July 26, 2026.
  source_ids: [cuopt-contributing, cuopt-init-header, cuopt-readme, cuopt-blog-announce, cuopt-devblog-open-source, nvidia-10q-q2fy2027]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code is public on GitHub, with pip packages from the NVIDIA Python Package Index, conda
    packages, and Docker Hub container images. Separately, the documentation says the cuOpt
    microservice offered through NVIDIA AI Enterprise requires an NVIDIA AI Enterprise license or
    NVIDIA Developer Program membership.
  source_ids: [cuopt-readme, cuopt-docs-intro]
  reviewed_at: 2026-10-01
licenses:
