      NVIDIA publishes a user guide covering the routing, LP, QP, and MIP features and the C,
      Python, and server APIs; the README says the C++ API is not documented.
    source_ids: [cuopt-docs-intro, cuopt-readme]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: The README documents pip, conda, Docker Hub containers (Ubuntu and FIPS-oriented UBI10 images), and building from source.
    source_ids: [cuopt-readme]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      Linux on x86_64 and aarch64, and Windows through WSL2; NVIDIA Volta or newer GPUs
      (compute capability 7.0+), CUDA 12.0+ or 13.0+, and Python 3.11 to 3.14.
    source_ids: [cuopt-readme, cuopt-docs-sysreq]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Versioned releases follow the RAPIDS release schedule; v26.08.00, published on GitHub on
      August 6, 2026, was the latest non-prerelease when checked.
    source_ids: [cuopt-release-26-08, cuopt-readme]
    reviewed_at: 2026-10-01
