summary:
  text: >-
    Unsloth is an open-source Python library for fine-tuning and reinforcement learning of
    language, diffusion, text-to-speech, and embedding models, supporting LoRA, QLoRA,
    full fine-tuning, pretraining, GRPO, and DPO, and exporting to formats such as GGUF. The same
    repository contains Unsloth Studio, a web interface, and the Unsloth Desktop app.
  source_ids: [unsloth-readme]
useful_for:
  text: >-
    Fine-tuning and post-training open-weight models on a single machine or multi-GPU setup, and
    exporting the results for local inference.
  source_ids: [unsloth-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The maintaining entity is Unsloth AI Inc.: the library is developed in the unslothai GitHub
    organization, and the repository's license and source-file copyright notices name the Unsloth
    AI Inc. team. The company's U.S. principal place of business is documented in an official
    registry: the USPTO registration of the UNSLOTH mark (No. 7973599), for downloadable software
    for training and fine-tuning large language models, names Unsloth AI Inc., a Delaware
    corporation, as owner with a San Francisco address; the Unsloth organization record explains
    why the trademark file supports reading this as the company's principal place of business. No
    foundation or multi-organization governance is documented.
  source_ids: [unsloth-license, unsloth-studio-header, unsloth-github-org, uspto-tsdr-unsloth]
  assessed_at: 2026-10-01
