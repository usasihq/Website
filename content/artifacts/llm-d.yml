checklist:
  source_code:
    status: public
    note: >-
      Code is in the llm-d GitHub organization, with experimental components in a separate
      llm-d-incubation organization.
    source_ids: [ llmd-readme, llmd-project ]
    reviewed_at: 2026-10-01
  documentation:
    status: public
    note: Documentation and deployment guides are published at llm-d.ai and in the repository.
    source_ids: [ llmd-readme, llmd-quickstart ]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      The quickstart installs the router with Helm and the model server with Kustomize. It
      needs kubectl, Helm, a Hugging Face token, and the Gateway API Inference Extension CRDs.
    source_ids: [ llmd-quickstart ]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      The accelerator guide names NVIDIA GPUs as the default and also covers AMD ROCm GPUs,
      Intel XPU, Google Cloud TPUs on GKE, x86_64 CPUs, and several other vendors' accelerators,
      each with named maintainers. Current images are built on the CUDA 12.9.1 runtime.
    source_ids: [ llmd-accelerators ]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Versioned releases are published on GitHub. The latest at review was v0.10.0, published
      September 29, 2026; the project has not yet reached version 1.0.
    source_ids: [ llmd-release-0-10-0 ]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      PROJECT.md describes the project as building on vLLM and the Kubernetes Gateway API
      Inference Extension, with code changes made upstream there rather than in forks.
    source_ids: [ llmd-project ]
    reviewed_at: 2026-10-01
