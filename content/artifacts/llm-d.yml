summary:
  text: >-
    llm-d is an open-source distributed inference serving stack for running large language
    models on Kubernetes. It sits above model servers such as vLLM and adds request routing
    that is aware of prefix caches and load, KV-cache offloading, prefill/decode
    disaggregation, expert parallelism for large models, autoscaling, and batch processing.
    Red Hat launched it in May 2025, and it became a Cloud Native Computing Foundation Sandbox
    project in March 2026.
  source_ids: [ llmd-readme, cncf-llmd-project, rh-llmd-launch, cncf-llmd-blog ]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Serving open models at scale on Kubernetes clusters, using tested deployment guides
    ("well-lit paths") with Helm charts for common serving patterns across several accelerator
    types.
  source_ids: [ llmd-readme, llmd-accelerators ]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    llm-d is a Cloud Native Computing Foundation Sandbox project, accepted on March 12, 2026.
    The CNCF says it is part of the nonprofit Linux Foundation, whose privacy policy gives a
    legal postal address in San Francisco, California. Before joining the CNCF, the project was
    launched by Red Hat, which has its corporate headquarters in Raleigh, North Carolina. Its
    MAINTAINERS.md lists project leadership employed by Google, IBM, and Red Hat. Day-to-day
    decisions follow the process in PROJECT.md: lazy consensus, with project maintainers
    approving process changes. This multi-company project is assessed through its U.S.-based
    foundation host, not through contributors' nationalities.
  source_ids: [ cncf-llmd-project, cncf-about, lf-privacy, rh-llmd-launch, rh-offices, llmd-maintainers, llmd-project ]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code, container images, and Helm-based guides are public. Deploying a model requires
    a Kubernetes cluster with accelerators, and the quickstart uses a Hugging Face token stored
    as a Kubernetes secret.
  source_ids: [ llmd-readme, llmd-project, llmd-quickstart ]
  reviewed_at: 2026-10-01
