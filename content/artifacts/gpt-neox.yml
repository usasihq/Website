summary:
  text: >-
    GPT-NeoX is EleutherAI's library for training large autoregressive language models on GPUs.
    It builds on NVIDIA's Megatron-LM and on DeepSpeed, and supports distributed training with
    ZeRO and 3D parallelism, several positional-embedding and attention options, mixture of
    experts, and predefined configurations for architectures such as Pythia and Llama. EleutherAI
    used it to train GPT-NeoX-20B and the Pythia suite.
  source_ids: [gpt-neox-readme]
useful_for:
  text: >-
    Training models with billions of parameters from scratch on GPU clusters, including
    preparing tokenized datasets, launching on Slurm or MPI, and evaluating with the LM
    Evaluation Harness. The README recommends Hugging Face Transformers instead for general
    inference.
  source_ids: [gpt-neox-readme]
