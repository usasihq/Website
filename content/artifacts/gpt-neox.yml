checklist:
  source_code:
    status: public
    note: null
    source_ids: [gpt-neox-repo]
  documentation:
    status: public
    note: >-
      The README covers environment setup, configuration, datasets, training, inference,
      evaluation, exporting to Hugging Face format, monitoring, and multi-node launching.
    source_ids: [gpt-neox-readme]
  training_code:
    status: public
    note: The library is itself training code for large-scale language model pretraining and fine-tuning, including DPO, KTO, and reward modeling.
    source_ids: [gpt-neox-readme]
  data_information:
    status: public
    note: >-
      The README documents preconfigured datasets (most components of the Pile, and the Pile
      train set) and how to tokenize custom data into the library's .bin/.idx format.
    source_ids: [gpt-neox-readme]
  reproducibility_instructions:
    status: public
    note: >-
      Versioned releases pin earlier states: v1.0 keeps the stack used for GPT-NeoX-20B and
      Pythia, and v2.0 moved to upstream DeepSpeed. The Pythia repository gives step-by-step
      instructions for reproducing Pythia training with GPT-NeoX.
    source_ids: [gpt-neox-readme, pythia-repo]
run_notes:
  - text: >-
      The README states the codebase was primarily developed and tested with Python 3.8 to 3.10
      and PyTorch 1.8 to 2.0, relies on EleutherAI's DeeperSpeed fork of DeepSpeed, and supports
      AMD MI100 and MI250X GPUs through JIT-compiled fused kernels.
    source_ids: [gpt-neox-readme]
provenance:
