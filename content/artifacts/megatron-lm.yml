summary:
  text: >-
    NVIDIA's Megatron-LM repository contains two components: Megatron Core, a library of
    GPU-optimized building blocks for training transformer models at scale (tensor, pipeline,
    data, expert, and context parallelism; FP16, BF16, FP8, and FP4 mixed precision), and
    Megatron-LM, a reference training setup with pre-configured scripts built on Megatron
    Core. The README says Megatron Core development moved to GitHub in December 2025, with all
    development and CI now happening in the open.
  source_ids: [mlm-readme]
useful_for:
  text: >-
    The README presents Megatron-LM for research teams, learning distributed training, and
    experimentation, and Megatron Core for developers building custom training frameworks.
    NVIDIA's Megatron Bridge library builds on Megatron Core for Hugging Face checkpoint
    conversion and training recipes.
  source_ids: [mlm-readme]
