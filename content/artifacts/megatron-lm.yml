    source_ids: [mlm-readme]
  documentation:
    status: public
    note: The Megatron Core developer guide covers installation, a first training run, data preparation, and parallelism.
    source_ids: [mcore-install, mcore-quickstart]
  training_code:
    status: public
    note: >-
      Includes training scripts and examples, such as a Llama 3 8B FP8 training script, plus
      post-training (quantization, distillation, pruning) and reinforcement learning code.
    source_ids: [mlm-readme, mcore-quickstart]
  data_information:
    status: public
    note: >-
      The quickstart documents the expected JSONL input and the preprocessing script that
      tokenizes it into binary .bin/.idx files.
    source_ids: [mcore-quickstart]
  reproducibility_instructions:
    status: unknown
    note: >-
      The README describes its scaling benchmark configurations and points to the Megatron
      Bridge performance summary; whether published instructions reproduce those results was
      not assessed.
    source_ids: [mlm-readme]
run_notes:
  - text: >-
      The installation guide lists PyPI (megatron-core), source, and NGC PyTorch container
      installs; it recommends NVIDIA Turing or later GPUs, requires Hopper, Ada, or Blackwell
      GPUs for FP8, and lists PyTorch 2.6 or later. The guide lists Python 3.10 or later (3.12
      recommended), while the README says the 0.17.0 release drops Python 3.10 support and
      the current PyPI package (0.19.2) requires Python 3.12 or later.
    source_ids: [mcore-install, mlm-readme, mcore-pypi]
