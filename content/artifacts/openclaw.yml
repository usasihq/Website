summary:
  text: OpenClaw is a self-hosted AI assistant with a gateway connecting model providers, tools, and
    messaging channels. It provides command-line and browser interfaces and supports both hosted and
    local model providers.
  source_ids:
    - repo
    - docs
  reviewed_at: 2026-10-01
useful_for:
  text: Running a personal or shared assistant with configurable tools and messaging integrations on
    infrastructure you control.
  source_ids:
    - docs
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: The OpenClaw Foundation announcement identifies the steward as an American 501(c)(3)
    nonprofit. The project README states that the independent foundation employs the core team and
    signs releases; the foundation says no single company controls OpenClaw. Eligibility rests on
    this documented U.S. governance, not contributor nationality or a headquarters-city inference.
  source_ids:
    - foundation-announcement
    - repo
    - foundation
  assessed_at: 2026-10-01
