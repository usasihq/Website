license_notes:
  text: >-
    The MIT license lists two copyright holders: an individual contributor (2025) and Meridian
    Labs (2026). It does not cover the models used as auditor, target, or judge, which are
    accessed under their providers' terms.
  source_ids: [ petri-license, petri-docs ]
  reviewed_at: 2026-10-01
checklist:
  code:
    status: public
    note: Published on GitHub under the MIT License and on PyPI.
    source_ids: [ petri-repo, petri-license, petri-pypi ]
    reviewed_at: 2026-10-01
  tasks_data:
    status: public
    note: >-
      The package ships more than 170 built-in seed instructions and 38 built-in judging
      dimensions; users can also supply their own.
    source_ids: [ petri-docs ]
    reviewed_at: 2026-10-01
  methodology:
    status: public
    note: >-
      The documentation describes the auditor, target, and judge roles, the audit options, and
      the scoring: each dimension gets a 1-10 score with a written justification that cites
      specific messages.
    source_ids: [ petri-docs ]
    reviewed_at: 2026-10-01
  reproducibility_instructions:
    status: public
    note: >-
      The documentation gives install steps and inspect eval commands that select seeds and
      assign a model to each role. Results also depend on which auditor, target, and judge
      models are chosen.
    source_ids: [ petri-docs ]
    reviewed_at: 2026-10-01
  limitations:
    status: partial
    note: >-
      Anthropic's October 2025 release posts discuss limits of the original version: scenarios
      that may reveal they are tests, inconsistent judge scores, a small pilot set of scenarios,
      and metrics that cannot capture everything that matters. The current documentation adds a
      responsible-use note on provider policies but no updated limitations section was found.
    source_ids: [ anthropic-petri-release, anthropic-petri-alignment-blog, petri-docs ]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      Petri is built on the Inspect AI evaluation framework and requires Python 3.12 or later.
      The latest PyPI release at review was 3.1.1; Petri 2.0 remains available on a separate
      branch.
    source_ids: [ petri-docs, petri-pypi, petri-repo ]
    reviewed_at: 2026-10-01
  - text: >-
      The documentation warns that the full default audit (all built-in seeds, up to 30 turns
      each, scored by a frontier judge model) typically takes a few hours and incurs
      substantial API costs, and suggests starting with one tag or a small sample limit.
    source_ids: [ petri-docs ]
    reviewed_at: 2026-10-01
provenance:
  text: >-
    Petri was developed by Anthropic's alignment team and released in October 2025; Petri 2.0
    followed on January 22, 2026. In May 2026 Anthropic handed development to Meridian Labs, which
    released Petri 3.0 with a restructured auditor/target design. Meridian Labs states that
    Anthropic will continue to support Petri.
  derived_from: []
  source_ids: [ anthropic-petri-release, anthropic-petri-v2, anthropic-petri-donation, meridian-petri-3 ]
