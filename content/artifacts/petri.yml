summary:
  text: >-
    Petri (Parallel Exploration Tool for Risky Interactions) is an open-source tool for automated
    alignment audits of language models. An auditor model drives multi-turn conversations with a
    target model from seed instructions, simulating tools and rolling back turns, and a judge
    model scores the transcripts. Anthropic released it in October 2025 and handed its
    development to Meridian Labs, an AI evaluation nonprofit, in May 2026 with the release of
    Petri 3.0. The repository moved from safety-research/petri to meridianlabs-ai/inspect_petri.
  source_ids: [ anthropic-petri-release, anthropic-petri-donation, meridian-petri-3, petri-docs, petri-repo ]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Testing hypotheses about model behavior such as sycophancy, deception, or evaluation
    awareness by running audits from built-in or custom seed instructions and reviewing
    judge-scored transcripts.
  source_ids: [ petri-docs, anthropic-petri-release ]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Meridian Labs maintains Petri: Anthropic's May 2026 post says it handed development to
    Meridian Labs, the 2026 copyright in the MIT license is held by Meridian Labs, and Meridian
    Labs is the PyPI author. Meridian Labs describes itself as a 501(c)(3) nonprofit and gives a
    Boston, Massachusetts address. The documentation describes Petri as a collaboration between
    Meridian Labs and the UK AI Security Institute's Red Team; this catalog treats Meridian Labs,
    which holds the repository and publishes releases, as the maintaining entity. Anthropic
    originated the project. This catalog did not check Meridian Labs' tax status in an IRS
    listing.
  source_ids: [ anthropic-petri-donation, petri-license, petri-pypi, meridian-home, meridian-about, petri-docs ]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code is on GitHub and the package is on PyPI as inspect-petri. Running audits
    requires API access to the auditor, target, and judge models, for example Anthropic or
    OpenAI API keys.
  source_ids: [ petri-repo, petri-pypi, petri-docs ]
  reviewed_at: 2026-10-01
