    model card states a 2025 FutureHouse copyright. FutureHouse is a 501(c)(3) nonprofit in San
    Francisco per its about page and the IRS exempt-organization extract. The base model,
    Mistral-Small-24B-Instruct-2501, comes from Mistral AI and is recorded as provenance on the
    release record, not as a U.S. model.
