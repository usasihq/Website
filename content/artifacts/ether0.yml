summary:
  text: >-
    ether0 is a 24B-parameter chemistry reasoning model from FutureHouse, released in June 2025.
    It reasons in English and answers with molecular structures written as SMILES. It was
    fine-tuned and trained with reinforcement learning from Mistral AI's
    Mistral-Small-24B-Instruct-2501.
  reviewed_at: 2026-10-01
  source_ids: [ether0-card, fh-ether0-announcement, hf-api-ether0]
useful_for:
  text: >-
    The model card lists molecule-design and prediction tasks it was trained for, including
    IUPAC name or formula to SMILES, adjusting solubility, pKa, or scent, ADME and toxicity
    properties, one-step retrosynthesis, reaction outcome prediction, and molecule captioning
    in reverse. The card says it is not a general-purpose chat model.
  reviewed_at: 2026-10-01
  source_ids: [ether0-card]
