summary:
  text: >-
    CLIP (Contrastive Language-Image Pre-Training) is an OpenAI family of paired image and text
    encoders trained with a contrastive objective on 400 million image-text pairs, which lets the
    model classify images zero-shot from natural-language labels. OpenAI released the models in
    stages from January 2021 to April 2022, from ResNet-50 and ViT-B/32 up to ViT-L/14 and
    ViT-L/14 at 336-pixel resolution.
  source_ids: [clip-model-card, clip-readme, clip-paper]
useful_for:
  text: >-
    The model card describes CLIP as a research output for studying zero-shot image
    classification, robustness, and bias. It states that any deployed use, commercial or not, is
    currently out of scope, that surveillance and facial recognition uses are always out of
    scope, and that use should be limited to English.
  source_ids: [clip-model-card]
