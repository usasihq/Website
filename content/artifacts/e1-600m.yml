summary:
  text: >-
    The 600M-parameter member of the Profluent-E1 family of retrieval-augmented protein
    encoder models, released in November 2025 alongside E1-300m and E1-150m. The
    Hugging Face safetensors metadata counts 641,438,754 parameters stored in BF16. It can encode a
    single protein sequence or a query preceded by homologous sequences.
  reviewed_at: 2026-10-01
  source_ids: [hf-card, hf-api, e1-readme, profluent-e1-showcase]
useful_for:
  text: >-
    Protein embeddings and masked-token predictions for tasks such as zero-shot fitness
    prediction of substitution mutants, contact or structure analysis, and in-silico
    site-saturation mutagenesis; Profluent presents E1 as a drop-in replacement for ESM-family
    encoders.
  reviewed_at: 2026-10-01
  source_ids: [e1-readme, profluent-e1-showcase]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Published by Profluent in its Hugging Face and GitHub organizations; the license and notice
    name Profluent Bio Inc. as licensor and copyright holder. Profluent's website terms give an
    Emeryville, California notice address.
  source_ids: [hf-card, e1-license, e1-notice, profluent-terms]
  assessed_at: 2026-10-01
availability:
