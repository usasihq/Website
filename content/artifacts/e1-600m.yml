license_notes:
  text: >-
    The clickthrough agreement, offered by Profluent Bio Inc., grants a perpetual, worldwide,
    royalty-free copyright and patent license to use, modify, and redistribute Profluent-E1, with
    Apache-style redistribution conditions. It defines Profluent-E1 to include both the weights
    and the code, and says model code used separately from the weights is under Apache 2.0. The
    Attribution Guidelines require commercial entities to display "Profluent-E1" attribution and
    require any drug, target, hit, or lead created or identified using it to be identified as
    "Built with Profluent-E1", including in regulatory disclosures. Profluent may amend the
    agreement and may terminate it on breach; it is governed by California law with arbitration
    in Alameda County. The Hugging Face card lists the license as other
    (profluent-e1-clickthrough-license). One source file is adapted from flash-attention under
    BSD-3-Clause.
  reviewed_at: 2026-10-01
  source_ids: [e1-license, e1-attribution, e1-notice, e1-readme, hf-card]
checklist:
  weights:
    status: public
    reviewed_at: 2026-10-01
    note: Safetensors weights and config on Hugging Face without gating; use is subject to the clickthrough license.
    source_ids: [hf-api, hf-card]
  inference_code:
    status: public
    reviewed_at: 2026-10-01
    note: The E1 GitHub repository provides the model code, batch preparation, and example notebooks.
    source_ids: [e1-readme]
  training_code:
    status: unknown
    reviewed_at: 2026-10-01
    note: The README describes installation and inference only; no training code was found in the sources reviewed.
    source_ids: []
  training_pipeline:
    status: unknown
    reviewed_at: 2026-10-01
    note: null
    source_ids: []
  training_recipe:
    status: unknown
    reviewed_at: 2026-10-01
    note: >-
      The announcement describes the architecture at a high level; the preprint was not reviewed
      for this record.
    source_ids: []
  training_data_information:
    status: partial
    reviewed_at: 2026-10-01
    note: >-
      The announcement says the models were trained on Profluent's Protein Atlas, described as
      billions of proteins, with homologous sequences supplied during training. This confirms
      partial disclosure, not completeness.
    source_ids: [profluent-e1-showcase]
  training_data_access:
    status: unknown
    reviewed_at: 2026-10-01
    note: No download of the Profluent Protein Atlas was found in the sources reviewed.
    source_ids: []
  evaluation_materials:
    status: partial
    reviewed_at: 2026-10-01
    note: >-
      The README and announcement report ProteinGym and CAMEO results as charts, and the
      repository includes a zero-shot fitness prediction notebook; full evaluation scripts were
      not identified.
    source_ids: [e1-readme, profluent-e1-showcase]
run_notes:
  - text: >-
      The README installs the code from the GitHub repository with pip. The models run on CPU or
      GPU; because they were trained in BF16 precision, the README recommends a GPU with BF16
      support (CUDA capability 8.0 or higher) and optionally the flash-attn package.
    reviewed_at: 2026-10-01
    source_ids: [e1-readme]
provenance:
  text: >-
    Trained by Profluent on its Profluent Protein Atlas, which Profluent describes as a curated
    protein dataset; the dataset itself is not published in the sources reviewed.
