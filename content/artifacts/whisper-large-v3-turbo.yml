    applies_to: weights-and-code
    source_ids: [whisper-license, whisper-repo-readme, hf-whisper-large-v3-turbo]
license_notes:
  text: >-
    The README states that Whisper's code and model weights are released under the MIT License,
    and the Hugging Face card for this model also lists MIT.
  source_ids: [whisper-repo-readme, hf-whisper-large-v3-turbo]
checklist:
  weights:
    status: public
    note: Published on Hugging Face without gating and downloadable through the openai-whisper package.
    source_ids: [hf-api-whisper-large-v3-turbo, whisper-init]
  inference_code:
    status: public
    note: >-
      The openai/whisper repository provides the inference code and command-line tool; the
      Hugging Face card documents inference with Transformers.
    source_ids: [whisper-repo-readme, hf-whisper-large-v3-turbo]
  training_code:
    status: unknown
    note: The repository covers inference and evaluation-data preparation; this review found no published training code.
    source_ids: [whisper-repo-readme]
  training_data_information:
    status: partial
    note: >-
      OpenAI says turbo was fine-tuned on the same amount of multilingual transcription data used
      to train large-v3, excluding translation data. The large-v3 training mixture (1 million
      hours of weakly labeled audio and 4 million hours pseudo-labeled with large-v2) is described
      but not released.
    source_ids: [turbo-discussion, hf-whisper-large-v3]
  training_recipe:
    status: partial
    note: >-
      The release discussion describes the procedure at a high level (decoder reduced to 4 layers,
      two further epochs of fine-tuning); no training configuration is published.
    source_ids: [turbo-discussion]
  evaluation_materials:
    status: partial
    note: >-
      The release discussion reports comparisons with other Whisper models. The repository's data
      README documents how the paper's evaluation datasets were prepared, but no turbo-specific
      evaluation scripts were located.
    source_ids: [turbo-discussion, whisper-data-readme]
run_notes:
  - text: >-
      The README documents running the model from the command line or Python with the
      openai-whisper package (which requires ffmpeg) using the model name "turbo"; the Hugging
      Face card documents use through the Transformers speech-recognition pipeline.
    source_ids: [whisper-repo-readme, hf-whisper-large-v3-turbo]
provenance:
  text: >-
    Derived by OpenAI from its own Whisper large-v3: the decoder was pruned from 32 to 4 layers
    and the model was fine-tuned for two more epochs on large-v3's multilingual transcription
    data.
  derived_from:
    - name: Whisper large-v3
      artifact_slug: whisper-large-v3
      url: https://huggingface.co/openai/whisper-large-v3
      note: Base model; same developer.
  source_ids: [turbo-discussion, hf-whisper-large-v3-turbo]
