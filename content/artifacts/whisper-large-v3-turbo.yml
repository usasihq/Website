summary:
  text: >-
    Whisper large-v3-turbo is a multilingual speech recognition model that OpenAI derived from
    Whisper large-v3 by cutting the decoder from 32 layers to 4 and fine-tuning for two more
    epochs. It has about 0.8 billion parameters (809M in the README and Hugging Face card; the
    repository model card lists 798M) and is the default model in the openai-whisper package.
  source_ids: [turbo-discussion, whisper-repo-readme, hf-whisper-large-v3-turbo, whisper-model-card]
useful_for:
  text: >-
    The README presents turbo as a faster version of large-v3 for transcription with a small
    loss of accuracy. It is not trained for translation: it returns the source language even
    when the translate task is requested, and the README directs users to the other multilingual
    models, such as medium or large, for translation into English.
  source_ids: [whisper-repo-readme, turbo-discussion]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model was released by OpenAI in its openai/whisper repository and on its Hugging Face
    account. OpenAI Group PBC lists its address as 1455 3rd Street, San Francisco, California,
    in a February 2026 agreement filed with the SEC.
  source_ids: [whisper-model-card, turbo-discussion, sec-openai-amazon-ecl]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Downloadable without gating from Hugging Face, and fetched automatically by the openai-whisper
    package when the "turbo" or "large-v3-turbo" model is loaded.
  source_ids: [hf-api-whisper-large-v3-turbo, whisper-init]
