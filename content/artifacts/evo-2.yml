summary:
  text: >-
    Evo 2 is a family of DNA language models from Arc Institute, developed with NVIDIA and
    collaborators at institutions including Stanford University, UCSF, UC Berkeley, Goodfire,
    and the University of Washington. The models use the StripedHyena 2 architecture, work at
    single-nucleotide resolution with context of up to 1 million base pairs, and were trained on
    the OpenGenome2 dataset. Checkpoints range from 1B to 40B parameters; a 20B checkpoint
    derived from the 40B model was added in February 2026.
  source_ids: [evo2-repo, arc-evo2-one-year, evo2-v050-release]
useful_for:
  text: >-
    The repository documents scoring the likelihood of DNA sequences (for example zero-shot
    BRCA1 variant effect prediction), extracting embeddings for downstream classifiers, and
    generating DNA sequences from prompts.
  source_ids: [evo2-repo]
