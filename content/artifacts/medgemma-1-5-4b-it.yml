summary:
  text: >-
    MedGemma 1.5 4B is a multimodal, instruction-tuned update to MedGemma 1 4B, released by
    Google on January 13, 2026. It accepts text and images and produces text, adding support
    for CT and MRI volumes, whole-slide histopathology, longitudinal chest X-rays, anatomical
    localization, lab-report extraction, and text-based EHR interpretation.
  source_ids: [mg15-model-card, gemma-releases, mg15-blog]
useful_for:
  text: >-
    The card positions the model as a foundation for healthcare and life-sciences developers,
    who are expected to validate and adapt it; it states the outputs are not intended to
    directly inform clinical diagnosis or treatment decisions.
  source_ids: [mg15-hf-page, mg15-model-card]
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    The model card lists Google as author, and the governing terms are issued by Google LLC.
    Alphabet Inc.'s fiscal 2025 Form 10-K lists its principal executive offices in Mountain
    View, California, and Exhibit 21.01 lists Google LLC as a Delaware subsidiary of Alphabet.
  source_ids: [mg15-model-card, haidef-terms, alphabet-10k-2025, alphabet-10k-2025-ex21]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Downloadable from Hugging Face after logging in and acknowledging the Health AI Developer
    Foundations terms of use; the gate states that requests are processed immediately. Also
    offered through Google Cloud Model Garden.
  source_ids: [mg15-hf-api, mg15-hf-page, mg15-model-card]
licenses:
  - name: Health AI Developer Foundations Terms of Use
    spdx: null
    url: https://developers.google.com/health-ai-developer-foundations/terms
    applies_to: weights
    source_ids: [mg15-hf-api, mg15-model-card, haidef-terms]
  - name: Apache License 2.0 (google-health/medgemma notebooks and serving code)
    spdx: Apache-2.0
    url: https://raw.githubusercontent.com/google-health/medgemma/main/LICENSE
    applies_to: code
    source_ids: [medgemma-repo-readme, medgemma-repo-license]
license_notes:
  text: >-
    The HAI-DEF terms (licensor Google LLC) permit use, modification, and distribution,
    including hosted services, subject to use restrictions: no uses listed in the HAI-DEF
    Prohibited Use Policy, no use that could lead a health regulator to deem Google a medical
    device manufacturer, and compliance with law. Redistributors must pass on the terms and
    the use restrictions, include a specified notice file, and seek health regulatory
    authorization where applicable. The terms define Model Derivatives to include models
    distilled from outputs, require indemnification of Google, allow Google to terminate for
    breach or regulatory risk, and are governed by California law.
  source_ids: [haidef-terms]
checklist:
  weights:
    status: public
    note: Weights are on Hugging Face behind a click-through acknowledgment of the HAI-DEF terms that is processed automatically.
    source_ids: [mg15-hf-api, mg15-hf-page]
  inference_code:
    status: public
    note: >-
      The card documents inference with Hugging Face Transformers (4.50.0 or later); the
      Hugging Face page also shows vLLM and SGLang serving. The google-health/medgemma
      repository publishes notebooks and serving-container code under Apache 2.0.
    source_ids: [mg15-model-card, mg15-hf-page, medgemma-repo-readme]
  training_code:
    status: unknown
    note: >-
      The card states training was done with JAX; fine-tuning notebooks are published, but
      the code used to train the model was not found.
    source_ids: [mg15-model-card, medgemma-repo-readme]
  legacy_training_data_information:
    status: partial
    note: >-
      The card lists public datasets used (for example MIMIC-CXR, SLAKE, PAD-UFES-20, TCGA,
      CAMELYON, and PMC-OA) along with licensed or internally collected de-identified
      datasets that are not public.
    source_ids: [mg15-model-card]
  training_recipe:
    status: partial
    note: >-
      The MedGemma 1.5 technical report describes the new training data, 3D volume slicing,
      and whole-slide sampling approaches at a summary level.
    source_ids: [mg15-report]
  evaluation_materials:
    status: partial
    note: >-
      The card publishes evaluation results on public and internal benchmarks; several
      evaluation datasets are internal.
    source_ids: [mg15-model-card]
run_notes:
  - text: >-
      The card documents a context of at least 128K input tokens and up to 8,192 output
      tokens, with images normalized to 896 x 896 and encoded to 256 tokens each; CT, MRI,
      and whole-slide images need pre-processing shown in the repository notebooks.
    source_ids: [mg15-model-card, mg15-hf-page]
provenance:
  text: >-
    An updated version of MedGemma 1 4B, built on Gemma 3 and its decoder-only architecture,
    with a SigLIP image encoder pre-trained on de-identified medical data.
  derived_from:
    - name: MedGemma 1 4B
      artifact_slug: null
      url: null
      note: Previous MedGemma 4B release; no separate catalog record.
    - name: Gemma 3
      artifact_slug: gemma
      url: null
      note: Base model family; see the Gemma family record.
  source_ids: [mg15-model-card]
