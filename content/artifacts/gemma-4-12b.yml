summary:
  text: >-
    Gemma 4 12B Unified is an 11.95-billion-parameter Gemma 4 model with an encoder-free design:
    image patches and audio waveforms are projected directly into the language model instead of
    passing through separate encoders. It accepts text, image, audio, and video (as frames) input
    and generates text, with a 256K-token context window. Google's release page dates its release
    to June 3, 2026, after the other Gemma 4 sizes.
  source_ids: [hf-card-12b-it, gemma-4-model-card, gemma-releases, gemma-4-12b-blog]
useful_for:
  text: >-
    The model card lists text generation, chatbots, summarization, image data extraction, NLP and
    vision-language research, and language-learning tools among intended uses, and documents a
    configurable thinking mode and native function calling. It also lists audio processing, such
    as speech recognition and speech translation, for this size.
  source_ids: [hf-card-12b-it]
