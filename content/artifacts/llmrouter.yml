summary:
  text: >-
    LLMRouter is an open-source Python library for routing each query to a suitable large
    language model, balancing response quality against inference cost. It implements more than
    16 routing methods across single-round, multi-round, multimodal, agentic, and personalized
    routers, and adds a command-line interface, a Gradio chat interface, and a pipeline for
    generating routing training data. The accompanying paper introduces xRouteBench, a routing
    benchmark.
  source_ids: [llmrouter-repo, llmrouter-paper]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Training, evaluating, and deploying LLM routers that choose among candidate models from one
    or more API providers, and comparing routing methods under a shared quality and cost
    objective. The README also describes an OpenAI-compatible router server.
  source_ids: [llmrouter-repo, llmrouter-docs]
  reviewed_at: 2026-10-01
