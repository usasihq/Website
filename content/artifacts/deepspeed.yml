license_notes:
  text: >-
    The project charter requires inbound and outbound code under Apache 2.0 with a Developer
    Certificate of Origin sign-off, and makes documentation available under CC BY 4.0. The
    charter still names LF AI & Data as the directed fund the Technical Steering Committee
    communicates with, although the project is now listed by the PyTorch Foundation.
  source_ids: [deepspeed-governance, ptf-foundation-page]
