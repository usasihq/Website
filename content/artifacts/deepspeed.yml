summary:
  text: >-
    DeepSpeed is an open-source PyTorch library for distributed training and inference of large
    models; its features include the ZeRO memory optimizations, 3D parallelism, Ulysses sequence
    parallelism, and mixture-of-experts support. Microsoft contributed it to LF AI & Data as an incubation project
    in February 2025, and in May 2025 it became a hosted project of the PyTorch Foundation, which
    names Microsoft as the contributor.
  source_ids: [deepspeed-readme, lfaidata-deepspeed, ptf-deepspeed, ptf-expansion]
useful_for:
  text: >-
    Scaling training of dense and sparse mixture-of-experts models across many GPUs, training and
    inference on systems with limited GPU memory, and compressing models; it integrates with
    Hugging Face Transformers, Accelerate, and PyTorch Lightning.
  source_ids: [ptf-deepspeed, deepspeed-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    DeepSpeed is a PyTorch Foundation-hosted project; per the Foundation, hosted projects are
    governed and administered under its governance model. The PyTorch Foundation is hosted by the
    Linux Foundation, whose privacy policy gives a legal mailing address in San Francisco,
    California. The project was contributed by Microsoft, whose Form 10-K lists Redmond,
    Washington. The project's charter places technical oversight with a Technical Steering
    Committee of committers under LF Projects policies.
  source_ids: [ptf-deepspeed, ptf-foundation-page, lf-privacy, deepspeed-governance, msft-10k-2026]
  assessed_at: 2026-09-29
