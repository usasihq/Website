provenance:
  text: >-
    The v1 text models start from nomic-bert-2048, a long-context BERT model Nomic trained;
    v2 starts from nomic-xlm-2048, Nomic's rotary-embedding variant of XLM-RoBERTa Base. Nomic
    Embed Code is built on Qwen2.5-Coder-7B-Instruct and Nomic Embed Multimodal on
    Qwen2.5-VL, both from Alibaba Cloud's Qwen family.
  derived_from:
