summary:
  text: >-
    Nomic Embed is Nomic's series of open embedding models. It began with
    nomic-embed-text-v1 (February 2024), a text embedder with an 8,192-token context, and
    continued with v1.5 and its resizable Matryoshka embeddings (February 2024), vision models
    aligned to the v1.5 space (June 2024), the multilingual mixture-of-experts
    nomic-embed-text-v2-moe (February 2025), Nomic Embed Code (March 2025), and Nomic Embed
    Multimodal (April 2025).
  source_ids: [nomic-embed-v1-news, nomic-embed-v15-news, nomic-embed-v15-card, nomic-news, nomic-embed-v2-card, nomic-embed-v2-paper, nomic-embed-code-news, nomic-embed-multimodal-news]
useful_for:
  text: >-
    Producing embeddings for semantic search, retrieval-augmented generation, clustering, and
    classification; the models use task prefixes such as search_query and search_document.
    Later releases add multilingual text, code retrieval, and images, PDFs, and charts.
  source_ids: [nomic-embed-v15-card, nomic-embed-v2-card, nomic-embed-code-news, nomic-embed-multimodal-news]
