checklist:
  source_code:
    status: public
    note: Public GitHub repository under the Apache License 2.0.
    source_ids: [lbann-repo, lbann-license]
    reviewed_at: 2026-10-01
  documentation:
    status: public
    note: >-
      Read the Docs pages cover building and installing, running LBANN, examples, and a list
      of publications. These pages describe the v1.x toolkit; the main-branch README for
      LBANNv2 gives only brief build steps.
    source_ids: [lbann-docs, lbann-readme-main]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      The v1.x README names Spack ("spack install lbann") as the preferred install method. The
      LBANNv2 README says to install PyTorch first and then install the package with pip from
      a clone.
    source_ids: [lbann-readme-v1, lbann-readme-main]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: partial
    note: >-
      The v1.x README says LBANN is optimized for one GPU per MPI rank, and the documentation
      has build guides for known HPC centers and Livermore Computing systems. The LBANNv2
      package metadata lists Python 3.9 through 3.13. No full hardware or operating-system
      support matrix was found.
    source_ids: [lbann-readme-v1, lbann-docs, lbann-pyproject]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Versioned GitHub releases run through v0.104, published November 8, 2023. The LBANNv2
      package on the main branch is versioned 0.0.1 and marked "Pre-Alpha" in its metadata.
    source_ids: [lbann-releases, lbann-pyproject]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The v1.x README documents running LBANN through an MPI launcher with model, optimizer,
      and data-reader configuration files in prototext format, and recommends assigning one GPU
      per MPI rank.
    source_ids: [lbann-readme-v1]
    reviewed_at: 2026-10-01
