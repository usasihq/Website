summary:
  text: >-
    LBANN is an open-source deep learning training framework from Lawrence Livermore National
    Laboratory, built for high-performance computing systems. Its documentation describes
    combining model parallelism through domain decomposition with data parallelism and ensemble
    training, and support for supervised, self-supervised, unsupervised, and adversarial (GAN)
    training. The repository's main branch now holds LBANNv2, a pre-alpha Python package
    described as LBANN's core integration with PyTorch; the earlier toolkit remains on the v1.x
    branches.
  source_ids: [lbann-docs, lbann-readme-v1, lbann-readme-main, lbann-pyproject]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Training large neural networks on GPU-accelerated HPC clusters with MPI, including
    model-parallel training to improve strong scaling and ensemble or multi-model training. The
    documentation includes build guides for users at known HPC centers and for Livermore
    Computing systems.
  source_ids: [lbann-docs, lbann-readme-v1]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    LBANN's license file assigns copyright to Lawrence Livermore National Security, LLC and
    other LBANN project developers, states that the code was produced at Lawrence Livermore
    National Laboratory, and carries the LLNL code identifier LLNL-CODE-697807. LLNS operates
    LLNL, a U.S. Department of Energy national laboratory in Livermore, California, for DOE's
    National Nuclear Security Administration. The repository now sits in the LBANN GitHub
    organization; the license names both that organization and the LLNL organization as project
    locations.
  source_ids: [lbann-license, lbann-repo, llnl-mgmt]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code is public on GitHub. The v1.x toolkit is built with Spack; LBANNv2 on the main
    branch is installed from source with pip after installing PyTorch.
  source_ids: [lbann-repo, lbann-readme-v1, lbann-readme-main]
  reviewed_at: 2026-10-01
