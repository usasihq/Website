summary:
  text: >-
    Trinity Mini is a 26B-parameter mixture-of-experts model with 3B active
    parameters, 128 experts (8 active plus 1 shared), and a 128k-token context
    window. It was trained on 10 trillion tokens and tuned for reasoning.
  source_ids: [hf-trinity-mini]
useful_for:
  text: >-
    Arcee presents Trinity Mini as the mid-sized model in the family, for cloud or
    on-premises deployment.
  source_ids: [arcee-trinity-page]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Developed and published by Arcee AI, Inc., a U.S. company with a documented San
    Francisco base (see the arcee-ai record). Arcee describes the Trinity models as
    trained end to end in the United States.
  source_ids: [hf-trinity-mini, arcee-trinity-manifesto]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: Weights download from Hugging Face without an access gate. Also served through Arcee's API and OpenRouter.
  source_ids: [hf-trinity-mini, arcee-trinity-manifesto]
licenses:
  - name: OpenMDW License Agreement, version 1.1
    spdx: null
    url: https://huggingface.co/arcee-ai/Trinity-Mini/blob/main/LICENSE
    applies_to: weights-and-code
    source_ids: [trinity-mini-license-file, hf-trinity-mini]
license_notes:
  text: >-
    Arcee released Trinity Mini on 2025-12-01 under Apache 2.0. On 2026-05-28 the
    Hugging Face repository changed its license to OpenMDW-1.1 as part of Arcee's
    move of all Trinity releases to that license. OpenMDW-1.1 requires keeping the
    license and notices when redistributing, and ends the rights of anyone who sues
    claiming the materials infringe a patent or copyright.
  source_ids: [arcee-trinity-manifesto, trinity-mini-commit-history, arcee-openmdw-blog, trinity-mini-license-file]
checklist:
  weights:
    status: public
    note: Weights are in the ungated Hugging Face repository; a GGUF conversion is published as a separate repository.
    source_ids: [hf-trinity-mini]
  inference_code:
    status: public
    note: The repository includes modeling code (modeling_afmoe.py), and the model card documents Transformers, vLLM, llama.cpp, and LM Studio.
    source_ids: [hf-trinity-mini, trinity-mini-repo-files]
  training_code:
    status: unknown
    note: The technical report says training used a modified version of TorchTitan but does not link a release.
    source_ids: [trinity-tech-report]
  legacy_training_data_information:
    status: partial
    note: The technical report describes the 10-trillion-token, three-phase pretraining mix for Trinity Nano and Mini. No public release of the data itself was found.
    source_ids: [trinity-tech-report]
  training_recipe:
    status: partial
    note: The technical report documents architecture and optimizer choices for the family; post-training details for Mini are limited.
    source_ids: [trinity-tech-report]
  evaluation_materials:
    status: partial
    note: The model card shows a benchmark chart and the technical report includes results; evaluation code is not linked.
    source_ids: [hf-trinity-mini, trinity-tech-report]
run_notes:
  - text: >-
      The model card documents support in vLLM 0.11.1, llama.cpp release b7061, LM
      Studio, and Transformers (main branch, or a released version with
      trust_remote_code enabled).
    source_ids: [hf-trinity-mini]
provenance:
  text: >-
    Post-trained from Arcee's Trinity-Mini-Base checkpoint. The model card says the
    training data was gathered and curated with Datology and training ran on a
    cluster provided by Prime Intellect.
  derived_from:
    - name: Trinity-Mini-Base
      artifact_slug: null
      url: https://huggingface.co/arcee-ai/Trinity-Mini-Base
      note: Same organization; pretrained base checkpoint.
  source_ids: [hf-trinity-mini]
