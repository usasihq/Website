summary:
  text: >-
    vLLM is an open-source inference and serving engine for large language models, originally
    built around the PagedAttention memory-management technique. It was developed in UC
    Berkeley's Sky Computing Lab, and UC Berkeley contributed it to the PyTorch Foundation in 2025.
  source_ids: [vllm-readme, pytorch-vllm]
useful_for:
  text: >-
    Serving language and multimodal models through an OpenAI-compatible API server, including
    distributed inference across multiple accelerators.
  source_ids: [vllm-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    vLLM is a PyTorch Foundation-hosted project, contributed by the University of California,
    Berkeley. Per the Foundation, hosted projects are governed and administered under its
    governance model. The PyTorch Foundation is hosted by the Linux Foundation, whose privacy
    policy gives a contact mailing address in San Francisco, California. vLLM's governance document says its core
    maintainers serve as the Technical Steering Committee under Linux Foundation project
    governance, and that committer status belongs to individuals, not companies.
  source_ids: [pytorch-vllm, pytorch-foundation-page, lf-privacy, vllm-governance]
