summary:
  text: >-
    FastVLM is a family of vision-language models from Apple, described in a CVPR 2025 paper,
    built around FastViTHD, a hybrid convolutional-transformer vision encoder that outputs
    fewer visual tokens to reduce encoding time for high-resolution images. Apple released
    0.5B, 1.5B, and 7B variants that pair the encoder with Qwen2 language models, with
    PyTorch checkpoints and versions exported for Apple silicon.
  source_ids: [fastvlm-readme, fastvlm-paper, apple-ml-fastvlm]
useful_for:
  text: >-
    Apple describes the models for image understanding with low time-to-first-token and for
    on-device use; the repository includes an iOS and macOS demo app.
  source_ids: [apple-ml-fastvlm, fastvlm-readme]
