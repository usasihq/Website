summary:
  text: >-
    Laguna is Poolside's family of mixture-of-experts language models for agentic
    coding. Poolside's release notes and announcements list Laguna XS.2 and Laguna
    M.1 (April 2026), Laguna XS 2.1 (announced 2 July 2026), and Laguna S 2.1 (21
    July 2026), with sizes from 33B total (3B active) to 225B total (23B active)
    parameters.
  source_ids: [poolside-model-release-notes, poolside-laguna-xs-2-1-blog, hf-laguna-m1, hf-laguna-s-2-1]
useful_for:
  text: >-
    Poolside documents the models for multi-step coding work that uses tools and
    checks, such as exploring a codebase, editing files, running tests, and fixing
    failures, mainly through its agent CLI or an OpenAI-compatible API.
  source_ids: [poolside-model-release-notes]
