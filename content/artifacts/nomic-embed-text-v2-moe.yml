summary:
  text: >-
    A multilingual text embedding model that uses a mixture-of-experts design (8 experts,
    top-2 routing), with 475M total and 305M active parameters. It covers about 100 languages,
    produces 768-dimensional embeddings that can be truncated to 256 through Matryoshka
    training, and accepts inputs of up to 512 tokens. Nomic released it in February 2025.
  source_ids: [nomic-embed-v2-card, nomic-embed-v2-paper, willison-v2]
useful_for:
  text: >-
    Multilingual retrieval, including retrieval-augmented generation. Queries and documents
    must carry the task prefixes search_query and search_document.
  source_ids: [nomic-embed-v2-card]
