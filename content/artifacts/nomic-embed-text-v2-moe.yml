checklist:
  weights:
    status: public
    note: null
    source_ids: [nomic-embed-v2-card]
  inference_code:
    status: public
    note: >-
      The card documents use with Sentence Transformers and Transformers (with
      trust_remote_code for the custom architecture) and recommends Nomic's megablocks fork
      for GPU performance.
    source_ids: [nomic-embed-v2-card]
  training_code:
    status: public
    note: The card and technical report point to the contrastors repository.
    source_ids: [nomic-embed-v2-card, nomic-embed-v2-paper, contrastors-repo]
  legacy_training_data_information:
    status: partial
    note: >-
      The card says training used 1.6 billion multilingual pairs and that the training data
      is released, pointing to the contrastors repository. That README documents access (with
      a Nomic Atlas account) to the nomic-embed-text-v1 dataset but does not separately
      describe the v2 multilingual data.
    source_ids: [nomic-embed-v2-card, contrastors-repo]
  training_recipe:
    status: partial
    note: >-
      The card summarizes the recipe: weakly supervised contrastive pretraining, then
      supervised fine-tuning, with consistency filtering and Matryoshka representation
      learning; the technical report gives details.
    source_ids: [nomic-embed-v2-card, nomic-embed-v2-paper]
  evaluation_materials:
    status: public
    note: >-
      The technical report's abstract says code, models, and evaluation data are open
      sourced; the card shows BEIR and MIRACL results.
    source_ids: [nomic-embed-v2-paper, nomic-embed-v2-card]
run_notes:
  - text: >-
      The card recommends the 256-dimension embeddings when storage or compute is a concern
      and notes that the mixture-of-experts architecture may need more resources than
      comparable dense models.
    source_ids: [nomic-embed-v2-card]
provenance:
  text: >-
    Trained by Nomic from nomic-xlm-2048, which Nomic made by swapping XLM-RoBERTa Base's
    learned position embeddings for rotary embeddings and training further on CC100. The
    released model is fine-tuned from the contrastively pretrained checkpoint
    nomic-embed-text-v2-moe-unsupervised.
  derived_from:
    - name: nomic-embed-text-v2-moe-unsupervised
      artifact_slug: null
      url: https://huggingface.co/nomic-ai/nomic-embed-text-v2-moe-unsupervised
      note: Contrastive-pretraining checkpoint from Nomic.
    - name: nomic-xlm-2048
      artifact_slug: null
      url: https://huggingface.co/nomic-ai/nomic-xlm-2048
      note: Nomic's RoPE variant of FacebookAI/xlm-roberta-base.
  source_ids: [nomic-embed-v2-card, nomic-embed-v2-unsup-card, nomic-xlm-2048-card]
