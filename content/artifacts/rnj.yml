summary:
  text: >-
    Rnj is Essential AI's line of 8B-parameter dense language models trained from scratch and
    aimed at code and STEM work. Rnj-1 (a base model and an instruction-tuned model) was
    released in December 2025, followed in 2026 by Rnj-1.5 Instruct, which extends the
    context window from 32K to 160K tokens.
  source_ids: [rnj-1-card, eai-rnj1-blog, rnj-1-5-card]
useful_for:
  text: >-
    The model cards describe the models for code generation, agentic software-engineering
    tasks, tool calling, math, and science questions. Essential AI says it kept Rnj-1
    post-training limited so that others can specialize the models further.
  source_ids: [rnj-1-card, rnj-1-5-card]
