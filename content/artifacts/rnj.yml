provenance:
  text: >-
    Trained from scratch by Essential AI. The model card says the architecture is similar to
    Gemma 3 but uses only global attention, with YaRN for long-context extension; Rnj-1.5
    instead interleaves block-local and global attention layers. The cards do not name the
    pretraining datasets.
