license_notes:
  text: >-
    The model card calls it the "Grok 2 Community License Agreement", but the LICENSE
    file is titled xAI Community License Agreement (last updated November 4, 2025). It
    grants a revocable license for non-commercial and research use, and allows commercial
    use only if users follow xAI's Acceptable Use Policy. It forbids using the materials or
    their outputs to train or improve other foundation, large language, or general-purpose
    models (fine-tuning Grok 2 itself is allowed), requires "Powered by xAI" attribution
    when distributing, ends if the licensee brings certain IP lawsuits, and is governed by
    Texas law.
  source_ids: [grok-2-license, hf-grok-2]
