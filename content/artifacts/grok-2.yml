run_notes:
  - text: >-
      The model card documents serving with SGLang using tensor parallelism across 8 GPUs,
      each with more than 40GB of memory; the documented launch command uses fp8
      quantization and the Triton attention backend.
    source_ids: [hf-grok-2]
  - text: >-
      The model card says this is a post-trained model and that requests need the correct
      chat template.
    source_ids: [hf-grok-2]
