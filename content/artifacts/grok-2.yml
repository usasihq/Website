summary:
  text: >-
    Grok 2 is a post-trained language model that xAI trained and used in 2024; its
    weights, about 500 GB in 42 files, were published on Hugging Face in August 2025.
    Press coverage at the time reported the release as Grok 2.5.
  source_ids: [hf-grok-2, techcrunch-grok-2-5]
