summary:
  text: >-
    The instruction-tuned version of Essential AI's Rnj-1, an 8.3B-parameter dense model
    trained from scratch. The base model was pretrained on 8.4T tokens at an 8K context,
    extended to a 32K context in a 380B-token mid-training stage, and then given a 150B-token
    supervised fine-tuning stage to produce this model.
  source_ids: [rnj-1-instruct-card]
useful_for:
  text: >-
    The model card describes it for code generation across programming languages, agentic
    coding in frameworks such as mini-SWE-agent and Cline, tool calling, fill-in-the-middle
    code infilling, and math and science questions. It notes the model is mainly a coding and
    STEM model rather than one tuned for factual recall.
  source_ids: [rnj-1-instruct-card]
