    source_ids: [rnj-1-instruct-card]
  inference_code:
    status: public
    note: >-
      The card documents use with Transformers 4.51.2 or later, vLLM (with the hermes
      tool-call parser), SGLang, and llama.cpp via the GGUF build.
    source_ids: [rnj-1-instruct-card]
  training_code:
    status: unknown
    note: null
    source_ids: []
  training_data_information:
    status: unknown
    note: >-
      The card says the model was trained on online web data and gives token counts per
      stage, but does not name the datasets.
    source_ids: [rnj-1-instruct-card]
  training_recipe:
    status: partial
    note: >-
      The card lists the stage token budgets, context lengths, the Muon optimizer, the
      learning-rate schedule, and batch sizes; the fine-tuning data is not described.
    source_ids: [rnj-1-instruct-card]
  evaluation_materials:
    status: public
    note: >-
      The card reports evaluation results, and Essential AI publishes the model's generations
      for its evaluations as Hugging Face datasets (for example rnj-1-instruct-evals).
    source_ids: [rnj-1-instruct-card, rnj-1-instruct-evals]
run_notes:
  - text: >-
      The card recommends always using a system prompt and temperatures from 0 to 0.2, and
      warns that without them the model can truncate outputs or write code for non-code
      tasks. It documents extending the context to 128K with YaRN RoPE scaling by editing
      config.json and reports some regressions at that length, particularly on some science
      and performance evaluations.
    source_ids: [rnj-1-instruct-card]
provenance:
  text: >-
    Fine-tuned by Essential AI from its own Rnj-1 base model, which it trained from scratch.
    The card says the architecture is similar to Gemma 3 but uses only global attention, with
    YaRN for long-context extension.
