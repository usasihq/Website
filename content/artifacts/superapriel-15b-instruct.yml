checklist:
  weights:
    status: public
    note: One supernet checkpoint with preset configurations is downloadable from Hugging Face.
    source_ids: [superapriel-card, hf-api-superapriel]
  inference_code:
    status: public
    note: >-
      The card documents inference with Hugging Face Transformers (custom modeling code in the
      repository) and with vLLM through a Fast-LLM plugin published on a feature branch.
    source_ids: [superapriel-card]
  training_code:
    status: public
    note: >-
      The paper states that the Fast-LLM training code is released; Fast-LLM's main branch
      contains an apriel2 model implementation.
    source_ids: [superapriel-paper, fast-llm-apriel2]
  training_data_information:
    status: partial
    note: >-
      The paper says distillation used the Apriel pretraining corpus and SFT data, and that
      the SFT stage used instruction-tuning data; the datasets are not documented as released.
    source_ids: [superapriel-paper-html]
  training_recipe:
    status: partial
    note: >-
      The card and paper describe two-stage stochastic distillation from a frozen Apriel 1.6
      teacher followed by targeted SFT, with token counts, batch shape, and GPU counts, and
      link training logs. This catalog did not confirm that complete configurations are
      published.
    source_ids: [superapriel-card, superapriel-paper-html]
  evaluation_materials:
    status: partial
    note: >-
      The card and paper report benchmark results for each preset; the paper says it uses
      LM Evaluation Harness task formulations, but no evaluation configuration for this
      release was found.
    source_ids: [superapriel-card, superapriel-paper-html]
run_notes:
  - text: >-
      The model card recommends vLLM with the Fast-LLM plugin. It states that single-preset
      mode loads approximately 27 GiB of weights in bf16 and supernet mode (all four mixers
      per layer, allowing runtime preset switching) approximately 46 GiB in bf16, excluding
      KV cache.
    source_ids: [superapriel-card]
  - text: >-
      Presets that use Gated DeltaNet or Kimi Delta Attention layers need the causal-conv1d
      and mamba-ssm packages when run with Transformers; attention-only presets do not.
    source_ids: [superapriel-card]
provenance:
  text: >-
    Derived from ServiceNow's Apriel-1.6-15b-Thinker: shared parameters (feed-forward layers,
    embeddings, and norms) are inherited from Apriel 1.6, and the new mixer weights were
    trained by distillation from a frozen Apriel 1.6 teacher, then supervised fine-tuning.
    The Apriel 1.x line began from Mistral AI's Pixtral-12B-Base-2409, and the model keeps a
    Pixtral vision encoder.
  derived_from:
    - name: Apriel-1.6-15b-Thinker
      artifact_slug: apriel-1-6-15b-thinker
      url: https://huggingface.co/ServiceNow-AI/Apriel-1.6-15b-Thinker
      note: Teacher model and source of the shared weights.
    - name: SuperApriel-15b-Base
      artifact_slug: null
      url: https://huggingface.co/ServiceNow-AI/SuperApriel-15b-Base
      note: Stage 1 distilled supernet; no separate catalog record.
    - name: Pixtral-12B-Base-2409 (Mistral AI)
      artifact_slug: null
      url: https://huggingface.co/mistralai/Pixtral-12B-Base-2409
      note: Starting checkpoint of the Apriel 1.5 line.
  source_ids: [superapriel-card, superapriel-paper-html, apriel-1-5-paper]
