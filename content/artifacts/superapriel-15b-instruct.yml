summary:
  text: >-
    A 15B-parameter instruction-tuned "supernet" in which each of 48 decoder layers carries
    four token-mixer variants: full attention, sliding-window attention, Gated DeltaNet, and
    Kimi Delta Attention. Choosing one mixer per layer gives deployment presets that trade
    output quality for decoding speed from a single checkpoint. It was derived from
    Apriel-1.6-15b-Thinker by distillation followed by supervised fine-tuning.
  source_ids: [superapriel-card, superapriel-paper]
useful_for:
  text: >-
    The card lists code assistance, multi-step reasoning, question answering, function
    calling, instruction following, and agent use cases, and describes serving one preset for
    a fixed deployment or switching presets at runtime. It says the model is not intended
    for safety-critical use without human oversight.
  source_ids: [superapriel-card]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The model is published by ServiceNow's ServiceNow-AI organization on Hugging Face, and
    the accompanying report is credited to ServiceNow's SLAM Labs. ServiceNow, Inc. is a
    Delaware corporation headquartered in Santa Clara, California, per its 2025 Form 10-K.
    Its lineage traces through Apriel 1.6 and 1.5 to Pixtral-12B-Base-2409, published by
    Mistral AI; that base is recorded under provenance and is not treated as U.S.-developed.
  source_ids: [superapriel-card, superapriel-paper, now-10k-2025, apriel-1-5-paper]
  assessed_at: 2026-09-29
availability:
