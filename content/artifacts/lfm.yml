summary:
  text: >-
    LFM is Liquid AI's series of hybrid language and multimodal models for on-device use, built
    from gated short-convolution blocks and a small number of grouped-query attention blocks.
    LFM2 (from July 2025) introduced open-weight dense models from 350M parameters upward and
    later an 8.3B mixture-of-experts model. LFM2.5 (from January 2026) extended pretraining and
    scaled up reinforcement-learning post-training; 2026 releases include LFM2.5-8B-A1B (May), LFM2.5-2.6B
    (August), and LFM2.5-VL-3B (August), alongside vision, audio, and encoder variants.
  source_ids: [lfm2-blog, lfm2-tech-report, lfm25-blog, liquid-models, lfm25-8b-blog, lfm25-2-6b-blog, lfm25-vl-3b-blog]
useful_for:
  text: >-
    Liquid AI positions the models for on-device and other resource-constrained deployment, and
    its model cards recommend the current text models for agentic workflows, tool use, data
    extraction, retrieval-augmented generation, and structured outputs rather than
    knowledge-heavy or heavy coding tasks.
  source_ids: [liquid-docs-welcome, mc-lfm25-2-6b, mc-lfm25-8b-a1b]
