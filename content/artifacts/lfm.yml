provenance:
  text: >-
    The LFM language models are pretrained by Liquid AI itself; the current text instruction and
    reasoning models are post-trained from Liquid's own base checkpoints (for example
    LFM2.5-2.6B-Base and LFM2.5-8B-A1B-Base). The vision-language models are not text-only LFMs:
    the LFM2.5-VL-3B model card says it combines the LFM2.5-2.6B language backbone with a SigLIP2
    NaFlex vision encoder. Liquid's LFM2 announcement says an earlier Liquid model, LFM1-7B, was
    used as a teacher for knowledge distillation during LFM2 training.
