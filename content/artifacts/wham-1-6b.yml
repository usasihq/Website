summary:
  text: >-
    WHAM 1.6B is the larger of the two World and Human Action Model checkpoints Microsoft
    Research released for Muse. It pairs a VQ-GAN image tokenizer with a transformer trained
    from scratch to predict game visuals and controller actions. The same repository includes a
    200M-parameter checkpoint for lighter experiments.
  source_ids: [wham-model-card]
useful_for:
  text: >-
    The model card describes academic research use, such as generating plausible gameplay
    sequences for the game Bleeding Edge in world-modelling, behavior-policy, or combined modes.
    It is not intended to generate imagery outside that game.
  source_ids: [wham-model-card]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model card says WHAM was developed by the Game Intelligence group at Microsoft Research,
    and the license is an agreement with Microsoft Corporation. Microsoft lists Redmond,
    Washington as its address on its Form 10-K cover page.
  source_ids: [wham-model-card, wham-license, msft-10k-2026]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Checkpoints can be downloaded from Hugging Face without a gated access request, but the
    license allows only non-commercial research use and forbids redistributing the models.
    Microsoft released the weights in February 2025 along with the WHAM Demonstrator and sample
    data.
  source_ids: [wham-hf-api, wham-license, msr-muse-blog]
licenses:
  - name: Microsoft Research License Terms
    spdx: null
    url: https://huggingface.co/microsoft/wham/blob/main/LICENSE.md
    applies_to: all
    source_ids: [wham-license, wham-model-card]
license_notes:
  text: >-
    The Microsoft Research License covers the source code, object code, models, and data in the
    release. It allows use only for non-commercial, non-revenue-generating research. Licensees
    may modify the source code but may not distribute the code, models, or data. They may not
    host the materials as a stand-alone service for others or reverse engineer them. Published
    results may not include substantial portions of the materials. U.S. users are bound to
    individual arbitration. The model card asks users not to remove watermark and provenance
    metadata from generated images.
  source_ids: [wham-license, wham-model-card]
checklist:
  weights:
    status: public
    note: >-
      WHAM 1.6B and 200M checkpoints are published without gating, under a research-only,
      non-commercial license.
    source_ids: [wham-hf-api, wham-model-card, wham-license]
  inference_code:
    status: public
    note: >-
      The repository includes setup scripts and a run_dreaming.py script for local inference,
      plus the WHAM Demonstrator application.
    source_ids: [wham-model-card]
  training_code:
    status: unknown
    note: null
    source_ids: []
  training_data_information:
    status: partial
    note: >-
      The model card describes about 500,000 Bleeding Edge games (more than 1 billion
      observation-action pairs at 10 Hz) from anonymized gameplay by 27,990 players. Only a
      sample, the evaluation test data, is published.
    source_ids: [wham-model-card]
  training_recipe:
    status: unknown
    note: null
    source_ids: []
  evaluation_materials:
    status: partial
    note: >-
      The model card describes the evaluation measures (FVD for consistency, Wasserstein distance
      for diversity, and persistency tests) and publishes the test data sample. Detailed results
      are in the Nature paper.
    source_ids: [wham-model-card]
run_notes:
  - text: >-
      The model card documents a setup script that creates a Python 3.9 environment. It says
      testing was done on Ubuntu 20.04 (natively and under WSL2 on Windows 11) with NVIDIA RTX
      A6000 and A100 GPUs, and that a CUDA-capable GPU is assumed for inference.
    source_ids: [wham-model-card]
provenance:
  text: >-
    The model card says both components were trained from scratch by Microsoft Research on
    gameplay data from Ninja Theory's Bleeding Edge.
  derived_from: []
  source_ids: [wham-model-card]
