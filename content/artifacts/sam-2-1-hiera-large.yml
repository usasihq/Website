summary:
  text: >-
    SAM 2.1 Hiera-Large is the largest checkpoint (224.4M parameters, per the README) in Meta's SAM 2.1 suite, an
    improved set of SAM 2 checkpoints released in September 2024. SAM 2 is a transformer with
    streaming memory that segments objects in images and tracks them through video from point,
    box, or mask prompts.
  source_ids: [sam2-readme, sam2-release-notes]
useful_for:
  text: >-
    Promptable segmentation of objects in images, automatic mask generation, and segmenting and
    tracking objects across video frames.
  source_ids: [sam2-readme]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Developed by Meta's FAIR research group and published in the facebookresearch GitHub
    organization and the facebook Hugging Face account. Meta Platforms, Inc. has its principal
    executive offices in Menlo Park, California, per its Form 10-K.
  source_ids: [sam2-readme, hf-sam21-large, meta-10k-2025]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    The checkpoint downloads directly from Meta's servers or from Hugging Face without gating.
  source_ids: [sam2-readme, hf-api-sam21-large]
licenses:
  - name: Apache License 2.0
    spdx: Apache-2.0
    url: https://github.com/facebookresearch/sam2/blob/main/LICENSE
    applies_to: weights-and-code
    source_ids: [sam2-license, sam2-readme, hf-api-sam21-large]
license_notes:
  text: >-
    The README states that the SAM 2 model checkpoints, demo code, and training code are licensed
    under Apache 2.0. The fonts bundled with the web demo are under the SIL Open Font License
    1.1, and an optional connected-components post-processing module adapted from cc_torch
    carries its own BSD 3-Clause license.
  source_ids: [sam2-readme, sam2-license-cctorch]
checklist:
  weights:
    status: public
    note: Direct download links in the README and an ungated Hugging Face repository.
    source_ids: [sam2-readme, hf-api-sam21-large]
  inference_code:
    status: public
    note: >-
      The repository provides image and video predictors and notebooks; the Hugging Face card
      also documents use with Transformers.
    source_ids: [sam2-readme, hf-sam21-large]
  training_code:
    status: public
    note: >-
      Training and fine-tuning code was released with SAM 2.1, including the trainer, loss
      functions, dataset loaders, and launch scripts for single- and multi-node jobs.
    source_ids: [sam2-release-notes, sam2-training-readme]
  legacy_training_data_information:
    status: partial
    note: >-
      The paper lists the training mix as SA-1B, the SA-V dataset, an internal video dataset,
      and open-source video datasets. SA-V is downloadable under CC BY 4.0, but the internal
      data is not released.
    source_ids: [sam2-paper, sam2-sav-readme]
  training_recipe:
    status: partial
    note: >-
      The paper's appendix tabulates pre-training and full-training hyperparameters, and the paper
      states its results use SAM 2.1, but it gives few details of what changed from the July 2024
      checkpoints.
    source_ids: [sam2-paper]
  evaluation_materials:
    status: public
    note: >-
      The README reports SA-V test, MOSE val, and LVOS v2 results for each SAM 2.1 checkpoint and
      a benchmarking script for speed. The repository publishes a VOS inference script documented
      with the SAM 2.1 configs and checkpoints (with a flag for LVOS-style datasets) and an SA-V
      evaluator for the released val and test sets; MOSE and LVOS scores come from those datasets'
      own evaluation tools or servers.
    source_ids: [sam2-readme, sam2-tools-readme, sam2-sav-readme]
run_notes:
  - text: >-
      The README requires Python 3.10 or later with PyTorch 2.5.1 and torchvision 0.20.1 or later
      and notes that installation compiles an optional CUDA extension; it recommends WSL with
      Ubuntu on Windows.
    source_ids: [sam2-readme]
