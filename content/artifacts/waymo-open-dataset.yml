license_notes:
  text: >-
    The data license grants a personal, royalty-free license for research, teaching,
    scientific publication, personal experimentation, and benchmarking for academic or applied
    research publication only. It bars using the data, or models trained on it, to operate or
    assist a vehicle, in production systems, or for other primarily commercial purposes. Apart
    from small extracts used as illustrations in publications, the dataset may be
    redistributed only to others who have registered and accepted the terms; trained models
    may be published only with notices that carry the non-commercial terms downstream; users
    must include a set attribution and accept a limited non-assert toward Waymo. Code in each
    wdl_limited subfolder also carries a limited patent license that covers only the use case
    that license sets out in connection with the dataset, in compliance with the data
    license. The repository README's metadata still names an August 2019 version of the
    license, while the terms page shows the March 2025 version.
  source_ids: [wod-terms, wod-readme]
checklist:
  access:
    status: partial
    note: >-
      Downloadable at no cost after Google sign-in and registration; the download and data
      pages redirect to Google sign-in. Use is restricted to non-commercial purposes.
    source_ids: [wod-home, wod-terms]
  provenance:
    status: public
    note: >-
      Waymo states the data was collected by its vehicles, lists the sensors used for each
      dataset, and names collection locations (the Motion dataset's map locations include San
      Francisco, Phoenix, Mountain View, Los Angeles, Detroit, and Seattle). It notes the data mixes manual and
      autonomous driving without labeling which is which.
    source_ids: [wod-about, wod-faq, waymo-open-2019]
  documentation:
    status: public
    note: >-
      The dataset site describes each component and notes its latest updates; the repository
      holds the format definitions, labeling specification, metrics code, tutorials, and a
      release history, and papers describe the Perception and Motion datasets.
    source_ids: [wod-about, wod-faq, wod-readme, wod-paper-perception, wod-paper-motion]
  licensing:
    status: public
    note: Custom non-commercial data license published on the dataset site; repository code mainly Apache 2.0.
    source_ids: [wod-terms, wod-license-file]
  stated_limitations:
    status: public
    note: >-
      Waymo states the data should be used only for research and not to evaluate the
      real-world performance of any vehicle, because manual and autonomous driving data are
      mixed, and that it is only a fraction of the data used to train the Waymo Driver.
      Images blur faces and license plates.
    source_ids: [wod-about, wod-faq]
run_notes: []
provenance:
  text: >-
    Collected by Waymo's own vehicles. The August 2019 first release covered 1,000 driving
    segments recorded in Phoenix, Kirkland, Mountain View, and San Francisco; later versions
    added the Motion and End-to-End Driving datasets. Motion dataset 3D boxes were produced
    by a model trained on the Perception dataset.
  derived_from: []
  source_ids: [waymo-open-2019, wod-about]
