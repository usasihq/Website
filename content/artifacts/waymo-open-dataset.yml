  assessed_at: 2026-09-29
availability:
  status: partial
  access_conditions: >-
    Free of charge, but downloads require signing in with a Google account and registering at
    waymo.com/open, and use is limited to non-commercial purposes under Waymo's custom
    license. Waymo's FAQ states that the license should not be considered an open source
    license.
  source_ids: [wod-home, wod-terms, wod-faq]
