summary:
  text: >-
    Autonomous driving data collected by Waymo vehicles, released for research in August 2019
    and since expanded into three datasets: Perception (lidar and camera data with labels for
    2,030 segments), Motion (object trajectories and 3D maps for 103,354 segments), and
    End-to-End Driving (360-degree camera images and routing instructions for 5,000
    segments). A companion repository provides the data format definitions, evaluation
    metrics, and TensorFlow helper code.
  source_ids: [wod-about, wod-readme, waymo-open-2019]
useful_for:
  text: >-
    Documented for research on perception (such as 3D detection, tracking, and segmentation),
    behavior and motion prediction, simulated agents, and vision-based end-to-end driving, and
    for benchmarking in Waymo's open challenges and in academic or applied research
    publications.
  source_ids: [wod-about, wod-home, wod-terms]
