summary:
  text: >-
    OpenELM is a family of small language models released by Apple in April 2024 in 270M,
    450M, 1.1B, and 3B parameter sizes, each as a pretrained and an instruction-tuned model.
    The models use layer-wise scaling to allocate parameters across transformer layers, and
    Apple published them together with its CoreNet training library, pre-training
    configurations, training logs, and evaluation instructions.
  source_ids: [openelm-card, openelm-arxiv, corenet-openelm-readme]
useful_for:
  text: >-
    The model card presents the release as a resource for open research on language models and
    notes that the models are provided without safety guarantees.
  source_ids: [openelm-card]
