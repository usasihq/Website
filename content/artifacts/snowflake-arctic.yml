summary:
  text: >-
    Arctic is a text-in, text-and-code-out language model pretrained from scratch by the Snowflake AI Research Team.
    It uses a dense-MoE hybrid transformer that combines a 10B dense model with a residual 128x3.66B mixture-of-experts
    MLP, for 480B total and 17B active parameters with top-2 gating. Base and instruct-tuned checkpoints were released
    on April 24, 2024 with weights and code under Apache-2.0.
  source_ids: [arctic-base-card, arctic-instruct-card, arctic-blog]
useful_for:
  text: Snowflake presents Arctic as aimed at enterprise tasks such as SQL generation, coding, and instruction following.
  source_ids: [arctic-github]
