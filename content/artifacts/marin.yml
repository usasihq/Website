summary:
  text: >-
    Marin is an open lab and software platform for developing foundation models, covering data
    curation, filtering, tokenization, pretraining, post-training, and evaluation, with
    experiments, code, and training logs published as the work happens. It began at Stanford in
    2024, originating in Stanford CRFM and HAI, and is now primarily developed by the nonprofit
    Open Athena with Stanford CRFM as a core collaborator. Models trained with it include Marin
    8B and Marin 32B.
  source_ids: [marin-repo, marin-home, marin-announcement, marin-hf-org]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Running and studying language-model training experiments with a documented pipeline. The
    documentation includes tutorials from installation and training a tiny model to a DCLM 1B
    experiment, and the README says the same code scales to large GPU or TPU clusters.
  source_ids: [marin-repo, marin-docs]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The Marin site says the project is primarily developed by Open Athena, and the README names
    Stanford CRFM and Open Athena as its core collaborators. Open Athena's terms of use name
    Open Athena AI Foundation Inc., at 1245 Broadway in New York, under New York law; the IRS
    extract for New York lists Open Athena Foundation Inc. at the same address as a 501(c)(3)
    corporation. The Marin 8B model card says the model was developed by the Marin team at
    Stanford CRFM. Both documented stewards are U.S.-based; the slight difference between the
    two Open Athena entity names is resolved here only by the matching address.
  source_ids: [marin-home, marin-repo, oa-terms, irs-eo-bmf-ny, irs-eo-info, marin-8b-base-card]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code and documentation are public. Model checkpoints are published separately on
    Hugging Face; the Marin 8B Base repository is not gated.
  source_ids: [marin-repo, marin-docs, marin-8b-base-card, marin-8b-hf-api]
  reviewed_at: 2026-10-01
licenses:
  - name: Apache License 2.0
    spdx: Apache-2.0
