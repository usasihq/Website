    applies_to: code
    source_ids: [marin-license]
    reviewed_at: 2026-10-01
license_notes:
  text: >-
    The Apache 2.0 entry covers the Marin repository's code. Model releases carry their own
    terms: the Marin 8B Base model card states that its code and model are released under
    Apache 2.0, and that three of the Markdown-converted datasets Marin made for training
    (StackExchange, Wikipedia, and one Ar5iv set) keep the licenses of their original sources.
    This project record does not assess individual model releases.
  source_ids: [marin-license, marin-8b-base-card]
  reviewed_at: 2026-10-01
checklist:
  source_code:
    status: public
    note: Public GitHub repository under Apache 2.0.
    source_ids: [marin-repo, marin-license]
    reviewed_at: 2026-10-01
  documentation:
    status: public
    note: >-
      Documentation on Read the Docs and in the repository's docs folder includes tutorials,
      explanations, experiment reports, a developer guide, and technical reference.
    source_ids: [marin-docs, marin-repo]
    reviewed_at: 2026-10-01
  training_code:
    status: public
    note: >-
      The repository contains the pretraining and post-training pipeline, and the README links
      the training script used for Marin 8B. The Marin 8B model card points to the Levanter
      training library.
    source_ids: [marin-repo, marin-8b-base-card]
    reviewed_at: 2026-10-01
  data_information:
    status: public
    note: >-
      The Marin 8B retrospective documents the data mixture in each training phase (for
      example DCLM Baseline, StarCoder, Proofpile 2, Nemotron-CC, and Marin-made Markdown
      corpora), and the README links pipelines that reproduce the Delphi training mixture from
      public datasets.
    source_ids: [marin-8b-retro, marin-repo]
    reviewed_at: 2026-10-01
  reproducibility_instructions:
    status: public
    note: >-
      Experiments are declared in code as dependent steps, and the documentation walks through
      installation and example training runs. The 8B retrospective records hardware, phases,
      and hyperparameters and links its experiment script and Weights & Biases report.
      Reproducing the large runs requires TPU or GPU clusters.
    source_ids: [marin-repo, marin-docs, marin-8b-retro]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The Marin 8B retrospective reports training on two TPU v5e-256 slices for the first
      phase and on a TPU v4-2048 slice for later phases, with parameters and optimizer states
      in float32 and computation in bfloat16.
    source_ids: [marin-8b-retro]
    reviewed_at: 2026-10-01
