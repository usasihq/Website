    source_ids: [ faiss-readme, faiss-docs, faiss-wiki-start ]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      INSTALL.md names conda as the supported install path (faiss-cpu, faiss-gpu, and
      faiss-gpu-cuvs packages, plus nightly builds) and also documents Pixi and building from
      source with CMake.
    source_ids: [ faiss-install ]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      faiss-cpu conda packages cover Linux (x86-64 and aarch64), macOS (arm64), and Windows
      (x86-64); faiss-gpu covers Linux x86-64 with CUDA 11.4 and 12.1, and faiss-gpu-cuvs covers
      Linux x86-64 with CUDA 13.2. The README describes optional GPU support through CUDA or AMD
      ROCm; INSTALL.md says ROCm conda packages are not yet available.
    source_ids: [ faiss-install, faiss-readme ]
    reviewed_at: 2026-10-01
