summary:
  text: >-
    Faiss is a library for similarity search and clustering of dense vectors, written in C++
    with Python wrappers. It includes exact and approximate nearest-neighbor indexes, among them
    compressed (quantization-based) and graph-based (HNSW, NSG) indexes, and GPU
    implementations of several algorithms. It is developed mainly at Meta's Fundamental AI
    Research (FAIR) group, which released it in March 2017.
  source_ids: [ faiss-readme, faiss-docs, faiss-announcement-2017 ]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Searching large collections of vectors by L2 distance, dot product, or cosine similarity,
    for example the embeddings used in retrieval systems, including collections that do not fit
    in RAM; also k-means clustering and tools for tuning index parameters.
  source_ids: [ faiss-readme, faiss-docs ]
  reviewed_at: 2026-10-01
