summary:
  text: >-
    MarkItDown is a Microsoft Python library and command-line tool that converts files such as
    PDF, Word, PowerPoint, Excel, HTML, images, audio, EPUB, and ZIP archives into Markdown. It
    aims to keep document structure (headings, lists, tables, links) for use by language models
    and text analysis pipelines rather than for high-fidelity human-readable conversion.
  source_ids: [markitdown-readme]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Preparing documents as Markdown input for language-model and text-analysis pipelines. The
    README documents optional per-format dependencies, third-party plugins, an MCP server package
    (markitdown-mcp), optional image descriptions through an OpenAI-compatible client, and
    optional conversion through Azure Document Intelligence or Azure Content Understanding, which
    are billable Azure services.
  source_ids: [markitdown-readme]
  reviewed_at: 2026-10-01
