summary:
  text: >-
    Mochi is Genmo's line of text-to-video diffusion models. Its only open-weight release so
    far is Mochi 1 preview (October 2024), a 10B-parameter model published with its video VAE
    under Apache 2.0. Genmo's hosted playground refers to a Mochi 1.1 model, for which this
    catalog found no open-weight release.
  source_ids: [genmo-mochi-blog, mochi-card, genmo-hf, genmo-play]
useful_for:
  text: >-
    Generating short videos from text prompts. Genmo notes that the preview is tuned for
    photorealistic styles and generates 480p video.
  source_ids: [mochi-repo, genmo-mochi-blog]
