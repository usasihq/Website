summary:
  text: >-
    Cogito is Deep Cogito's series of open-weight language models; the v2 and v2.1 models are
    hybrid reasoning models that can answer directly or reason first. Cogito v1 Preview (April 2025) covered 3B to 70B models on Llama and
    Qwen bases; Cogito v2 Preview (July 2025) added 70B dense, 109B MoE, 405B dense, and 671B MoE
    models on Llama and DeepSeek bases; and Cogito v2.1 (November 2025) is a 671B MoE model with
    37B active parameters on a DeepSeek base.
  source_ids: [cogito-research-index, cogito-v1-blog, cogito-v2-blog, cogito-v2-1-blog, cogito-github-readme]
useful_for:
  text: >-
    Deep Cogito describes the models as general-purpose instruction-tuned models optimized for
    coding, STEM, instruction following, general helpfulness, and tool calling, trained in over
    30 languages with 128k-token context, and says its approach aims for shorter reasoning
    chains.
  source_ids: [mc-cogito-v2-1, cogito-github-readme, cogito-v2-1-blog]
