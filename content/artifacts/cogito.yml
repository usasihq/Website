provenance:
  text: >-
    All Cogito releases are post-trained from base models released by other developers: Llama
    and Qwen checkpoints for v1; Llama 3.1 70B and 405B, Llama 4 Scout, and DeepSeek-V3-Base for
    v2; and DeepSeek-V3-Base for v2.1. Deep Cogito describes its own contribution as in-house
    post-training using Iterated Distillation and Amplification and process supervision of
    reasoning chains.
