summary:
  text: >-
    SAM 3.1 is a March 2026 update of Meta's SAM 3, a model that detects, segments, and tracks
    objects in images and video from text phrases, image exemplars, or visual prompts such as
    points, boxes, and masks. The update adds Object Multiplex, which groups tracked objects into
    shared-memory buckets and processes them jointly instead of one at a time, together with new
    checkpoints and inference optimizations.
  source_ids: [sam3p1-release-notes, sam3-readme, hf-sam3p1]
useful_for:
  text: >-
    Open-vocabulary segmentation and multi-object tracking in images and video; the release notes
    focus on faster tracking when many objects are followed at once.
  source_ids: [sam3p1-release-notes, hf-sam3p1]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Released by Meta (the SAM 3 repository credits Meta Superintelligence Labs) in the
    facebookresearch GitHub organization and the facebook Hugging Face account. Meta Platforms,
    Inc. has its principal executive offices in Menlo Park, California, per its Form 10-K. The
    SAM License names Meta Platforms Ireland Limited as licensor for EEA and Swiss users and Meta
    Platforms, Inc. for everyone else.
  source_ids: [sam3-readme, sam3-license, meta-10k-2025]
  assessed_at: 2026-09-29
availability:
  status: partial
  access_conditions: >-
    Checkpoints are gated on Hugging Face: users must submit contact information and request
    access, and downloads work only after the request is accepted. The Hugging Face repository
    holds checkpoints only and has no Transformers integration; the code is in the SAM 3 GitHub
    repository.
  source_ids: [hf-sam3p1, hf-api-sam3p1, sam3-readme]
licenses:
  - name: SAM License
    spdx: null
    url: https://github.com/facebookresearch/sam3/blob/main/LICENSE
    applies_to: weights-and-code
    source_ids: [sam3-license, sam3-readme, hf-api-sam3p1]
license_notes:
  text: >-
    Custom Meta license (last updated November 19, 2025) covering code, weights, and
    documentation. It grants a non-exclusive, worldwide, non-transferable, royalty-free license to
    use, reproduce, modify, and distribute; redistributions must carry the agreement, and
    published research must acknowledge use of the SAM Materials. Users must comply with trade
    controls, may not be targets of sanctions, and may not use the materials for ITAR-regulated
    activities or prohibited end uses including military or warfare, nuclear, espionage, or
    weapons applications. It forbids reverse engineering, ends for anyone who brings IP
    litigation against Meta over the materials, is governed by California law, and may be
    modified by Meta. This differs from the Apache 2.0 license used for SAM 2.
  source_ids: [sam3-license, sam2-readme]
checklist:
  weights:
    status: partial
    note: Hugging Face access is approval-gated (manual review of access requests).
    source_ids: [hf-api-sam3p1, sam3-readme]
  inference_code:
    status: public
    note: >-
      The SAM 3 repository provides image and video predictors and example notebooks; SAM 3.1
      checkpoints require the latest repository code.
    source_ids: [sam3-readme]
  training_code:
    status: unknown
    note: >-
      The repository publishes only fine-tuning code (train.py with Hydra configs) for custom
      datasets, and Meta's announcement describes it as fine-tuning code. Under the rubric,
      fine-tuning code does not count as training code for the base model, and this review did
      not find the pretraining pipeline released.
    source_ids: [sam3-train-readme, meta-sam3-blog]
  legacy_training_data_information:
    status: partial
    note: >-
      The SAM 3 paper describes a training set with 4 million unique concept labels built by a
      data engine. The SA-Co evaluation benchmarks are released; this review did not find the
      training set itself released.
    source_ids: [sam3-paper, sam3-readme]
  training_recipe:
    status: partial
    note: >-
      The paper and release notes describe the architecture and the Object Multiplex approach
      (paper Appendix H); no complete SAM 3.1 training configuration was located.
    source_ids: [sam3-paper, sam3p1-release-notes]
  evaluation_materials:
    status: partial
    note: >-
      The release notes report SAM 3.1 results. The SA-Co benchmarks and evaluation code with
      configurations for reproducing SAM 3 results are published, but SAM 3.1-specific
      evaluation configurations were not located.
    source_ids: [sam3p1-release-notes, sam3-eval-gold]
run_notes:
  - text: >-
      The README lists Python 3.12 or higher, PyTorch 2.7 or higher, and a CUDA-compatible GPU
      with CUDA 12.6 or higher as prerequisites, and requires authenticating to Hugging Face to
      download approved checkpoints.
    source_ids: [sam3-readme]
provenance:
  text: >-
    An updated checkpoint of Meta's SAM 3 model with new multi-object tracking; SAM 3's tracker
    inherits the SAM 2 transformer encoder-decoder architecture.
  derived_from:
    - name: SAM 3 (November 2025 release)
      artifact_slug: null
      url: https://huggingface.co/facebook/sam3
      note: Predecessor checkpoint from the same developer; no separate catalog record.
  source_ids: [sam3p1-release-notes, sam3-readme]
