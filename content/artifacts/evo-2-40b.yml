summary:
  text: >-
    The 40-billion-parameter Evo 2 checkpoint, with 50 layers and a context length of up to 1
    million base pairs. It was trained autoregressively on OpenGenome2 on 2,048 GPUs, per the
    Savanna README; a separate evo2_40b_base checkpoint trained at 8,192-token context is also
    published.
  source_ids: [mc-evo2-40b, evo2-repo, savanna-readme]
useful_for:
  text: >-
    Likelihood scoring of DNA sequences (such as zero-shot variant effect prediction),
    embeddings for downstream models, and DNA sequence generation.
  source_ids: [evo2-repo]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The checkpoint is published in Arc Institute's Hugging Face organization and documented in
    Arc's GitHub repository. Arc Institute is a Palo Alto, California nonprofit research
    organization listed by the IRS as a 501(c)(3). Arc describes Evo 2 as developed by Arc and
    NVIDIA scientists with collaborators at several universities and at Goodfire.
  source_ids: [mc-evo2-40b, evo2-repo, arc-about, irs-eo-bmf-ca, arc-evo2-one-year]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: Downloadable from Hugging Face without gating.
  source_ids: [mc-evo2-40b, hf-api-evo2-40b]
