    applies_to: code
    source_ids: [savanna-license]
license_notes:
  text: >-
    The OpenGenome2 training dataset is also published under Apache 2.0 on Hugging Face. The
    evo2 and Savanna LICENSE files also carry the notices for bundled third-party code, including
    a BSD-style NVIDIA license and the MIT license for Fairseq code. The Savanna training
    framework is hosted in a personal GitHub account and describes itself as maintained by a
    small team and not production-ready.
  source_ids: [opengenome2-card, evo2-license, savanna-license, savanna-readme]
checklist:
  weights:
    status: public
    note: >-
      Weights are on Hugging Face without gating; Savanna-format checkpoints
      (savanna_evo2_40b) are also published.
    source_ids: [mc-evo2-40b, hf-api-evo2-40b, hf-api-arc-models]
  inference_code:
    status: public
    note: >-
      The evo2 package (built on the Vortex inference code) is on GitHub and PyPI under Apache
      2.0.
    source_ids: [evo2-repo, evo2-license]
  training_code:
    status: public
    note: >-
      The README states Evo 2 was trained with Savanna, an Apache-2.0 pretraining framework
      whose README lists Evo 2 40B among the models trained with it.
    source_ids: [evo2-repo, savanna-readme, savanna-license]
  legacy_training_data_information:
    status: public
    note: >-
      OpenGenome2 is downloadable from Hugging Face, both as raw FASTA files and as the
      preprocessed JSONL sequences used for pretraining.
    source_ids: [opengenome2-card, evo2-repo]
  training_recipe:
    status: public
    note: >-
      The Nature paper's Supplementary Information documents the two training phases
      (pretraining at 1,024 and then 8,192 tokens, then multi-stage context extension to 1
      million tokens) with learning rates, batch sizes, iteration and token counts, optimizer
      settings, and the context-extension schedule. Savanna publishes 40B pretraining,
      context-extension, and data configuration files, and the OpenGenome2 card lists per-source
      data weights for each phase.
    source_ids: [nature-evo2, nature-evo2-si, savanna-configs-40b, opengenome2-card]
  evaluation_materials:
    status: partial
    note: >-
      The repository includes notebooks for zero-shot BRCA1 variant effect prediction and an
      exon classifier, but it was not confirmed that all reported evaluations can be re-run.
    source_ids: [evo2-repo]
run_notes:
  - text: >-
      The README states that the 40B model needs FP8 through NVIDIA Transformer Engine and an
      NVIDIA Hopper GPU for numerical accuracy, and that it needs multiple H100 GPUs; Vortex
      splits the model across the available CUDA devices.
    source_ids: [evo2-repo]
  - text: >-
      Documented requirements are Linux (WSL2 with limited support), CUDA 12.1 or later, cuDNN
      9.3 or later, and Python 3.11 or 3.12.
    source_ids: [evo2-repo]
provenance:
  text: >-
    Trained from scratch by Arc Institute and collaborators on OpenGenome2 using Savanna.
    OpenGenome2 draws on public sources including GTDB, IMG/PR, IMG/VR, metagenomic data, NCBI,
    Ensembl, EPDnew, RNAcentral, and Rfam.
  derived_from:
    - name: OpenGenome2
      artifact_slug: null
      url: https://huggingface.co/datasets/arcinstitute/opengenome2
      note: Pretraining dataset published by Arc Institute.
  source_ids: [evo2-repo, opengenome2-card]
