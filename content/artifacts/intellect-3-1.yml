summary:
  text: >-
    A 106B-parameter mixture-of-experts reasoning model (12B active) that continues the training
    of INTELLECT-3 with additional reinforcement learning on math, coding, software-engineering,
    and agentic tasks, using prime-rl and environments built with the verifiers library.
  source_ids: [mc-intellect-3-1]
useful_for:
  text: >-
    The model card presents it as an update of INTELLECT-3 aimed at math, coding,
    software-engineering, and agentic tasks.
  source_ids: [mc-intellect-3-1]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Trained and published by Prime Intellect, Inc., a Delaware corporation with U.S. locations
    (see the prime-intellect record). Eligibility covers Prime Intellect's training only; the
    underlying GLM-4.5-Air-Base model was released by Z.ai and is not treated as a
    U.S.-developed model.
  source_ids: [mc-intellect-3-1, sec-formd-prime-2026-07, glm-45-air-base-card]
  assessed_at: 2026-09-29
