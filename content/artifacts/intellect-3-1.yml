license_notes:
  text: >-
    The MIT license for the weights is declared in the model card metadata; the repository has
    no separate LICENSE file. The card says the model, training frameworks, and environments are
    released under MIT and Apache 2.0 licenses.
  source_ids: [mc-intellect-3-1, i31-repo-files]
checklist:
  weights:
    status: public
    note: BF16 safetensors in an ungated Hugging Face repository.
    source_ids: [mc-intellect-3-1, i31-api]
  inference_code:
    status: public
    note: The model card gives a vLLM serving command with the qwen3_coder tool-call parser and deepseek_r1 reasoning parser.
    source_ids: [mc-intellect-3-1]
  training_code:
    status: partial
    note: >-
      The card says training was done with prime-rl (Apache 2.0) and verifiers environments
      (MIT), both open source. This covers Prime Intellect's training only, not the pretraining
      of the GLM-4.5-Air base.
    source_ids: [mc-intellect-3-1, prime-rl-license, verifiers-license]
  legacy_training_data_information:
    status: partial
    note: >-
      The card names the task areas of the added RL (math, coding, software engineering, agentic
      tasks) and says all training and evaluation environments are on the Environments Hub, but
      does not list which environments or datasets were used for 3.1. The INTELLECT-3 data it
      builds on is described in the INTELLECT-3 report.
    source_ids: [mc-intellect-3-1, i3-report-pdf]
  training_recipe:
    status: partial
    note: >-
      The card describes 3.1 only as continued RL from INTELLECT-3 and refers to the INTELLECT-3
      technical report, which documents the INTELLECT-3 post-training; settings for the
      additional 3.1 RL are not given.
    source_ids: [mc-intellect-3-1, i3-report-pdf]
  evaluation_materials:
    status: unknown
    note: The INTELLECT-3.1 model card does not report evaluation results, and no separate 3.1 evaluation report was found.
    source_ids: []
run_notes:
  - text: >-
      The model card states that the model can be served with vLLM on 2x H200 GPUs with tensor
      parallel size 2; Hugging Face metadata shows the published weights are stored in BF16.
    source_ids: [mc-intellect-3-1, i31-api]
provenance:
  text: >-
    Continued training of Prime Intellect's INTELLECT-3, which was itself post-trained from
    GLM-4.5-Air-Base, a base model released by Z.ai (zai-org). The base model is not a catalog
    member and is not treated as U.S.-developed.
  derived_from:
    - name: INTELLECT-3
      artifact_slug: intellect-3
      url: https://huggingface.co/PrimeIntellect/INTELLECT-3
      note: Same organization; starting checkpoint.
    - name: GLM-4.5-Air-Base (Z.ai)
      artifact_slug: null
      url: https://huggingface.co/zai-org/GLM-4.5-Air-Base
      note: Third-party base model underlying INTELLECT-3; not a catalog member.
  source_ids: [mc-intellect-3-1, glm-45-air-base-card]
