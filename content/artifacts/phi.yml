summary:
  text: >-
    Phi is Microsoft's family of small language models. Generations have included Phi-3, Phi-3.5,
    and Phi-4, with instruction, reasoning, multimodal, and vision-language variants published on
    Hugging Face and Microsoft Foundry. Recent Phi-4 releases include Phi-4-mini-flash-reasoning
    (July 2025) and Phi-4-reasoning-vision-15B (March 2026).
  source_ids: [phi-portal, phi4-rv-model-card, phi4-mfr-model-card, phi4-mfr-azure-blog]
useful_for:
  text: >-
    Microsoft positions Phi models for cost-constrained and low-latency tasks, and for local,
    on-device, or edge deployment as well as the cloud.
  source_ids: [phi-portal]
