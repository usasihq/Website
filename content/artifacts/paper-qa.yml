summary:
  text: >-
    PaperQA is a Python package and command-line tool (pqa) from FutureHouse for
    retrieval-augmented question answering over PDFs, text, Office documents, and source code,
    focused on scientific literature. Versions 5 and later, called PaperQA2, add an agent that
    searches papers, gathers evidence, and writes answers with in-text citations; the package
    moved to calendar versioning in December 2025.
  reviewed_at: 2026-10-01
  source_ids: [paperqa-readme]
useful_for:
  text: >-
    Answering questions over a local collection of research papers with cited answers, building
    a full-text index of papers, and fetching paper metadata such as citation counts and
    retraction checks. It works with any LiteLLM-compatible model, including locally hosted
    models.
  reviewed_at: 2026-10-01
  source_ids: [paperqa-readme]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    The repository is published under FutureHouse's GitHub organization, the LICENSE names
    FutureHouse as copyright holder, and the PyPI package lists FutureHouse technical staff as
    author. FutureHouse is a 501(c)(3) nonprofit in San Francisco, per its about page and the IRS
    exempt-organization extract. Edison Scientific, a spinout of FutureHouse, hosts PaperQA2
    documentation; the sources reviewed do not say that maintenance moved to Edison.
  source_ids: [paperqa-repo, paperqa-license, paperqa-pypi, fh-about, irs-eo-bmf-ca, edison-paperqa-docs]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code is public and the package installs from PyPI. Running it requires access to an
    LLM and embedding model (an API key for a hosted provider, or a local model server); indexing
    many papers may also call for Crossref and Semantic Scholar API keys. Users supply their own
    PDFs.
  reviewed_at: 2026-10-01
  source_ids: [paperqa-readme, paperqa-pypi]
licenses:
  - name: Apache License 2.0
    spdx: Apache-2.0
    url: https://raw.githubusercontent.com/Future-House/paper-qa/main/LICENSE
    applies_to: code
    reviewed_at: 2026-10-01
    source_ids: [paperqa-license, paperqa-pypi]
license_notes:
  text: >-
    The LICENSE file is Apache 2.0 with a 2024 FutureHouse copyright notice. It covers this
    package only; the LLM providers, metadata services, and papers it works with have their own
    terms. The README notes that FutureHouse's internal version uses paper-access licenses it
    cannot share, so published results may differ from what the open package produces.
  reviewed_at: 2026-10-01
  source_ids: [paperqa-license, paperqa-readme]
