      hardware or operating-system support matrix was found in the pages reviewed.
    reviewed_at: 2026-10-01
    source_ids: [paperqa-pypi]
  release_status:
    status: public
    note: >-
      Versioned releases are published on PyPI; the latest at review was 2026.8.12, uploaded on
      August 12, 2026.
    reviewed_at: 2026-10-01
    source_ids: [paperqa-pypi]
run_notes:
  - text: >-
      By default PaperQA2 uses OpenAI embeddings and models with a NumPy vector store; the README
      documents switching to other LiteLLM providers, locally hosted models, and Sentence
      Transformers embeddings.
    reviewed_at: 2026-10-01
    source_ids: [paperqa-readme]
  - text: >-
      The README lists the LitQA2 question IDs and paper DOIs used for its train, evaluation, and
      test splits so published PaperQA2 evaluations can be reproduced.
    reviewed_at: 2026-10-01
    source_ids: [paperqa-readme]
  - text: >-
      Edison Scientific's PaperQA3, announced in February 2026, runs in Edison's hosted agents and
      is not part of this open-source package; repository maintainers stated in July 2026 that
      there were no plans to open-source it.
    reviewed_at: 2026-10-01
    source_ids: [edison-paperqa3, paperqa-discussion-1211]
