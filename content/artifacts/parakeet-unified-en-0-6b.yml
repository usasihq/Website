summary:
  text: >-
    parakeet-unified-en-0.6b is a 600M-parameter English speech recognition model that serves
    both offline and streaming transcription from one checkpoint. It pairs a 24-layer
    FastConformer encoder, trained jointly in offline and streaming modes with a
    mode-consistency regularization loss, with an RNN-T decoder; streaming latency can be set
    from 2,080 ms down to 160 ms. Output includes punctuation and capitalization. NVIDIA released
    it on Hugging Face on April 7, 2026.
  source_ids: [unified-card, unified-paper]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Transcribing English audio in batch or streaming mode, for example in voice assistants, live
    captioning, and conversational AI. For 80 ms latency the card recommends a different model,
    nemotron-speech-streaming-en-0.6b.
  source_ids: [unified-card]
  reviewed_at: 2026-10-01
