license_notes:
  text: >-
    The NVIDIA Open Model License Agreement (last modified October 24, 2025) is NVIDIA's own
    license. It grants a perpetual, worldwide, royalty-free license, revocable on the conditions
    it states, to use, modify, and distribute the model; it states that models are commercially usable and that NVIDIA claims no
    ownership of outputs, and lets licensees own their derivative models. Redistributors must
    include a copy of the agreement and a "Licensed by NVIDIA Corporation under the NVIDIA Open
    Model License" notice. Rights end for anyone who brings copyright or patent litigation over
    the model, or who bypasses its safety guardrails without a substitute. Use must follow
    NVIDIA's Trustworthy AI terms, users indemnify NVIDIA against third-party claims, and NVIDIA
    may update the agreement. This differs from the CC-BY-4.0 terms of parakeet-tdt-0.6b-v3.
  source_ids: [nvidia-open-model-license, unified-card]
  reviewed_at: 2026-10-01
checklist:
  weights:
    status: public
    note: The ungated repository holds the .nemo checkpoint.
    source_ids: [unified-api]
    reviewed_at: 2026-10-01
  inference_code:
    status: public
    note: >-
      The card documents offline and streaming inference with NVIDIA NeMo, including a chunked
      RNN-T streaming script and a pipeline configuration in the Apache 2.0 NeMo Speech repository.
    source_ids: [unified-card, nemo-speech-license]
    reviewed_at: 2026-10-01
  training_code:
    status: unknown
    note: >-
      Sources disagree. The card says only inference is supported for now and that the unified
      training pipeline will be released later, while the accompanying paper's abstract says the
      Unified ASR framework is open-sourced. NeMo Speech 3.0 release notes mention Unified RNN-T
      streaming inference. Training-code availability was not confirmed.
    source_ids: [unified-card, unified-paper, nemo-speech-3-0-release]
    reviewed_at: 2026-10-01
  training_data_information:
    status: partial
    note: >-
      The card states about 250,000 hours of audio, mostly from the English portion of Granary
      (YouTube-Commons, YODAS2, MOSEL, and LibriLight, with hours per source), plus a list of other
      corpora, and gives collection and labeling methods (human-recorded audio; a mix of human and
      ASR-generated transcripts). This review confirms disclosure, not completeness.
    source_ids: [unified-card, granary-card]
    reviewed_at: 2026-10-01
  training_data_access:
    status: partial
    note: >-
      Granary is published as CC-BY-4.0 transcript manifests that point to separately downloaded
      source audio; access terms for the other listed corpora were not reviewed.
    source_ids: [granary-card, unified-card]
    reviewed_at: 2026-10-01
  training_recipe:
    status: partial
    note: >-
      The card describes the architecture, joint offline and streaming training with chunked
      attention masks, dynamic chunked convolutions, and the consistency loss; hyperparameters and
      schedules are not given on the card.
    source_ids: [unified-card, unified-paper]
    reviewed_at: 2026-10-01
  evaluation_materials:
    status: partial
    note: >-
      The card publishes offline and streaming word error rates on Open ASR Leaderboard datasets
      and names the text normalizer version used; evaluation scripts were not verified.
    source_ids: [unified-card]
    reviewed_at: 2026-10-01
run_notes:
  - text: >-
      The card lists NeMo 2.7.3 as the runtime, Linux as the supported operating system, NVIDIA
      Volta, Ampere, Hopper, and Blackwell GPUs as compatible (tested on V100, A100, A6000, and DGX
      Spark), and recommended left, chunk, and right context settings for each streaming latency.
    source_ids: [unified-card]
    reviewed_at: 2026-10-01
provenance:
  text: >-
    Trained by NVIDIA. Most training data comes from the English portion of Granary, whose card
    says transcripts were pseudo-labeled with Whisper-large-v3 and that punctuation and
    capitalization were restored with Qwen-2.5-7B, both third-party models. No third-party model
    weights are documented as part of this checkpoint.
  derived_from: []
  source_ids: [unified-card, granary-card]
