license_notes:
  text: >-
    BigCode OpenRAIL-M v1 is a custom responsible-AI license. It grants royalty-free rights to
    use, modify, and share the model, including commercially, but makes compliance with the
    use restrictions in its Attachment A a condition of the grant and requires those
    restrictions to be carried into any shared copies or modifications. It does not cover
    source code or training data. The card adds that the model can reproduce training code
    verbatim, which may carry its own license and attribution requirements, and points to a
    search index for tracing outputs.
  source_ids: [bigcode-openrail-m, starcoder2-15b-card]
checklist:
  weights:
    status: public
    note: null
    source_ids: [starcoder2-15b-card, hf-api-starcoder2-15b]
  inference_code:
    status: public
    note: >-
      The card and repository document inference with Hugging Face Transformers (full
      precision, bfloat16, and 8-bit or 4-bit bitsandbytes) and serving with
      text-generation-inference.
    source_ids: [starcoder2-15b-card, starcoder2-repo]
  training_code:
    status: partial
    note: >-
      The card names NVIDIA NeMo as the training framework. NeMo's code is public under Apache
      2.0 (its repository is now NeMo Speech, which keeps the final pre-split NeMo release), but
      this catalog did not find the pretraining configuration for this model published. The
      StarCoder2 repository's LoRA script is fine-tuning code and is not counted here.
    source_ids: [starcoder2-15b-card, nemo-speech-repo, starcoder2-repo]
  legacy_training_data_information:
    status: partial
    note: >-
      The Stack v2 is on Hugging Face behind a terms-of-use acceptance, with Software Heritage
      identifiers for each file, but its terms say bulk download of the file contents requires
      an agreement with Software Heritage and Inria.
    source_ids: [stack-v2-card, starcoder2-paper-html]
  training_recipe:
    status: partial
    note: >-
      The card documents architecture, objective, token count, step count, precision, and
      hardware (1,024 H100 GPUs); the report describes base training at a 4k context window
      followed by 16k long-context training.
    source_ids: [starcoder2-15b-card, starcoder2-paper-html]
  evaluation_materials:
    status: public
    note: >-
      The card and report give benchmark results. The StarCoder2 repository directs users to the
      public BigCode Evaluation Harness to evaluate StarCoder2 models, and the report documents
      its prompts and says evaluation code is available through that harness. This catalog did
      not confirm that the harness covers every reported evaluation.
    source_ids: [starcoder2-15b-card, starcoder2-repo, starcoder2-paper-html]
run_notes:
  - text: >-
      The model card reports memory footprints, measured with Transformers'
      get_memory_footprint (model weights only), of 16,900.18 MB when loaded with 8-bit
      bitsandbytes quantization and 9,224.60 MB with 4-bit quantization.
    source_ids: [starcoder2-15b-card]
provenance:
  text: >-
    Trained by NVIDIA for the BigCode project on The Stack v2 (built from the Software
    Heritage archive, with opt-out requests excluded) and additional sources such as arXiv
    and Wikipedia.
  derived_from:
    - name: The Stack v2 (train split)
      artifact_slug: null
      url: https://huggingface.co/datasets/bigcode/the-stack-v2-train
      note: Pretraining data; no separate catalog record.
  source_ids: [starcoder2-15b-card, hf-starcoder2-blog, stack-v2-card]
