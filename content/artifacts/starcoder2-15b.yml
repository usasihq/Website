summary:
  text: >-
    The largest StarCoder2 base model, with 15B parameters, trained on more than 4 trillion
    tokens covering 600+ programming languages from The Stack v2. It uses grouped-query
    attention, a 16,384-token context window with 4,096-token sliding-window attention, and a
    fill-in-the-middle training objective. NVIDIA trained it with the NeMo framework on its
    Eos supercomputer.
  source_ids: [starcoder2-15b-card, hf-starcoder2-blog]
useful_for:
  text: >-
    Code completion. The card notes it is not an instruction model, so commands such as
    "write a function that..." do not work well.
  source_ids: [starcoder2-15b-card]
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Published in the BigCode organization on Hugging Face. The StarCoder2 report says BigCode
    is stewarded by ServiceNow (Santa Clara, California, per its 2025 Form 10-K) and Hugging
    Face (whose privacy policy names Hugging Face, Inc. as its service provider and says the
    company is located in the United States). Hugging Face's announcement says NVIDIA trained
    this model. Eligibility rests on the documented stewards, not on individual
    contributors.
  source_ids: [starcoder2-15b-card, starcoder2-paper-html, hf-starcoder2-blog, now-10k-2025, hf-privacy]
  assessed_at: 2026-09-29
availability:
