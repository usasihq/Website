summary:
  text: >-
    CLIP ViT-L/14 pairs a ViT-L/14 Vision Transformer image encoder with a masked self-attention
    Transformer text encoder, trained contrastively to match images with their captions. OpenAI
    released it in January 2022; a variant further trained at 336-pixel resolution
    (ViT-L/14@336px) followed in April 2022.
  source_ids: [hf-clip-vit-large-patch14, clip-model-card, clip-paper-pdf]
useful_for:
  text: >-
    Zero-shot image classification and image-text similarity for research. The model card says
    any deployed use case, commercial or not, is currently out of scope, surveillance and facial
    recognition are always out of scope, and use should be limited to English.
  source_ids: [hf-clip-vit-large-patch14, clip-model-card]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The model card states that CLIP was developed by researchers at OpenAI, and the checkpoint is
    published by OpenAI in its openai/CLIP repository and Hugging Face account. OpenAI Group PBC
    lists its address as 1455 3rd Street, San Francisco, California, in a February 2026
    agreement filed with the SEC.
  source_ids: [clip-model-card, clip-code, sec-openai-amazon-ecl]
  assessed_at: 2026-09-29
availability:
  status: public
  access_conditions: >-
    Downloadable without gating from Hugging Face, and fetched by the openai/CLIP package's
    clip.load("ViT-L/14"). No license for the weights is stated (see license notes).
  source_ids: [hf-api-clip-vit-large-patch14, clip-code]
licenses:
  - name: MIT License (openai/CLIP code)
    spdx: MIT
    url: https://github.com/openai/CLIP/blob/main/LICENSE
    applies_to: code
    source_ids: [clip-license]
license_notes:
  text: >-
    The repository's MIT license covers "the Software" (the code). This review found no license
    statement for the model weights in the repository README, the model card, or the Hugging
    Face card, whose metadata carries no license field. Separately from licensing, the model card
    places all deployed uses out of scope.
  source_ids: [clip-license, clip-readme, clip-model-card, hf-api-clip-vit-large-patch14]
checklist:
  weights:
    status: public
    note: Published on Hugging Face without gating and downloadable through clip.load().
    source_ids: [hf-api-clip-vit-large-patch14, clip-code]
  inference_code:
    status: public
    note: >-
      The openai/CLIP package loads the model and encodes images and text; the Hugging Face card
      documents use with Transformers.
    source_ids: [clip-readme, hf-clip-vit-large-patch14]
  training_code:
    status: unknown
    note: The repository provides loading, inference, and evaluation examples; this review found no published training code.
    source_ids: [clip-readme]
  legacy_training_data_information:
    status: partial
    note: >-
      The paper describes a dataset of 400 million image-text pairs gathered from public internet
      sources using 500,000 search queries. The model card says OpenAI will not release the
      dataset; only a list identifying a YFCC100M subset used in an ablation is published.
    source_ids: [clip-paper-pdf, clip-model-card, clip-yfcc-subset]
  training_recipe:
    status: partial
    note: >-
      The paper describes training for 32 epochs with Adam, decoupled weight decay, a cosine
      schedule, and a 32,768 minibatch, and says the largest Vision Transformer took 12 days on
      256 V100 GPUs. No training configuration files are published.
    source_ids: [clip-paper-pdf]
  evaluation_materials:
    status: public
    note: >-
      The repository publishes the class names and prompt templates used for the paper's
      zero-shot results, an ImageNet prompt-engineering notebook, and a linear-probe example.
    source_ids: [clip-prompts, clip-readme]
run_notes:
  - text: >-
      The README documents installation with PyTorch 1.7.1 or later and torchvision, then loading
      a model by name with clip.load(); the Hugging Face card documents use through Transformers'
      CLIPModel and CLIPProcessor.
    source_ids: [clip-readme, hf-clip-vit-large-patch14]
