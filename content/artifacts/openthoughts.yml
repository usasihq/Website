summary:
  text: >-
    OpenThoughts is a collaboration that curates open post-training datasets for reasoning and,
    more recently, agent models. Its OpenThoughts3-1.2M dataset contains about 850,000 math,
    250,000 code, and 100,000 science questions with reasoning traces, built through a pipeline
    of question sourcing, filtering, deduplication, and sampling chosen through more than 1,000
    ablation experiments.
  source_ids: [openthoughts-site, ot3-card, openthoughts-paper]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Supervised fine-tuning of reasoning models on math, code, and science problems; the
    collaboration used OpenThoughts3-1.2M to train its OpenThinker3-7B model.
  source_ids: [ot3-card]
  reviewed_at: 2026-10-01
eligibility:
  status: pending_review
  basis: undetermined
  explanation: >-
    No single U.S. governing or maintaining entity is documented. The repository README calls
    the project a collaboration led by Bespoke Labs (whose terms name BespokeLabs.AI, Inc. under
    California law) and the DataComp community, and lists researchers from U.S. and non-U.S.
    institutions, including the Juelich Supercomputing Center and LAION. The current website
    instead says the effort is led by researchers from a list of universities and partners that
    includes TUM and LAION, without naming Bespoke Labs or a lead institution. The code and data
    sit in open-thoughts GitHub and Hugging Face organizations not tied to a legal entity.
    Eligibility needs an editor's decision on multi-organization governance.
  source_ids: [openthoughts-readme, openthoughts-site, bespoke-terms, openthoughts-paper]
  assessed_at: 2026-10-01
