provenance:
  text: >-
    The reasoning traces in OpenThoughts3-1.2M were generated with QwQ-32B as the teacher
    model, and its questions come from human-written sources (such as StackExchange Physics)
    and synthetic datasets. The teacher model was not developed by the OpenThoughts
    collaboration.
  derived_from:
