summary:
  text: >-
    MaxText is an open-source LLM library and reference implementation written in Python and JAX
    for training on Google Cloud TPUs and GPUs. It provides implementations of Gemma, Llama,
    DeepSeek, Qwen, Mistral, and other open model architectures, with support for pre-training and
    for post-training methods such as supervised fine-tuning and reinforcement learning.
  source_ids: [maxtext-repo, maxtext-readme-raw]
useful_for:
  text: >-
    The README presents MaxText as a starting point to fork for pre-training experiments on TPU or
    GPU and as a framework for post-training existing models.
  source_ids: [maxtext-readme-raw]
