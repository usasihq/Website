      The Apache-2.0 chronos-forecasting package (version 2.0 or later) provides the
      Chronos2Pipeline used in the card's examples.
    source_ids: [chronos2-card, chronos-readme, chronos-pypi]
  training_code:
    status: unknown
    note: >-
      The repository's training scripts are documented for the original Chronos models of
      March 2024; training code for Chronos-2 was not found.
    source_ids: [chronos-scripts]
  legacy_training_data_information:
    status: partial
    note: >-
      The card lists subsets of the public Chronos Datasets and GIFT-Eval Pretrain collections
      plus synthetic univariate and multivariate data; the report describes how the synthetic
      data was generated, but the synthetic data itself is not documented as released.
    source_ids: [chronos2-card, chronos2-report-html]
  training_recipe:
    status: partial
    note: The technical report describes the architecture, training, and training data at a summary level.
    source_ids: [chronos2-report-html]
  evaluation_materials:
    status: partial
    note: >-
      The report and card give results on fev-bench, GIFT-Eval, and Chronos Benchmark II;
      the repository announces the separately released fev benchmarking package, but
      instructions to re-run all reported Chronos-2 evaluations were not verified.
    source_ids: [chronos2-report-html, chronos2-card, chronos-readme]
run_notes:
  - text: >-
      The card documents local installation with pip ("chronos-forecasting>=2.0") and a
      pandas-based prediction API, and deployment to SageMaker with AutoGluon-Cloud or
      SageMaker JumpStart.
    source_ids: [chronos2-card]
provenance:
  text: >-
    Trained by Amazon Web Services on subsets of the Chronos Datasets and GIFT-Eval Pretrain
    collections and on synthetic data. The architecture is described as inspired by the T5
    encoder; no pretrained base model is named.
  derived_from: []
