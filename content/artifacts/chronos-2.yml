summary:
  text: >-
    Chronos-2 is a 120M-parameter, encoder-only time-series foundation model from Amazon,
    released on October 20, 2025. Inspired by the T5 encoder, it produces multi-step quantile
    forecasts and uses group attention to learn in context across related series and
    covariates, supporting univariate, multivariate, and covariate-informed forecasting with
    contexts up to 8,192 steps and horizons up to 1,024 steps.
  source_ids: [chronos2-card, chronos-readme]
useful_for:
  text: >-
    Amazon describes Chronos-2 for zero-shot forecasting without task-specific training, with
    local inference through the chronos-forecasting package and production deployment through
    Amazon SageMaker (AutoGluon-Cloud or SageMaker JumpStart); the card states it supports
    both GPU and CPU inference.
  source_ids: [chronos2-card, amazon-science-chronos2]
