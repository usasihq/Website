summary:
  text: >-
    Spec Kit is an open-source toolkit from GitHub that gives AI coding agents structured
    processes and reusable templates. Its core process, spec-driven development, turns
    requirements into a specification, a technical plan, and a task list before implementation;
    bug-fixing and idea-assessment processes are available as bundled extensions.
  source_ids: [repo, announcement]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    Working with an AI coding agent from a written specification, plan, and task list; keeping
    bug diagnosis, fixes, and verification separate; and assessing whether an idea is worth
    building before writing code.
  source_ids: [repo]
  reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-governed-project
  explanation: >-
    Spec Kit is published in GitHub's own github organization on GitHub, its LICENSE assigns
    copyright to GitHub, Inc., and its SUPPORT file says it is maintained by GitHub staff and
    the community. GitHub, Inc.'s privacy statement gives its postal address in San Francisco,
    California, and Microsoft announced that it completed its acquisition of GitHub in 2018. No
    foundation or multi-organization governance is documented. Eligibility rests on this
    maintaining entity, not on contributors.
  source_ids: [repo, license, support, gh-privacy, msft-gh-acquisition]
  assessed_at: 2026-10-01
availability:
  status: public
  access_conditions: >-
    Source code, templates, and documentation are public. Using the processes requires a
    supported AI coding agent, which is configured and licensed separately.
  source_ids: [repo, install-docs]
  reviewed_at: 2026-10-01
licenses:
  - name: MIT License
    spdx: MIT
    url: https://github.com/github/spec-kit/blob/main/LICENSE
    applies_to: code
    source_ids: [license]
    reviewed_at: 2026-10-01
license_notes:
  text: >-
    The MIT license covers Spec Kit's code and templates. It does not cover the AI coding
    agents or model services that Spec Kit integrates with, or community extensions published
    elsewhere; those have their own terms.
  source_ids: [license, integrations-docs]
  reviewed_at: 2026-10-01
checklist:
  source_code:
    status: public
    note: Public repository in the github organization.
    source_ids: [repo]
    reviewed_at: 2026-10-01
  documentation:
    status: public
    note: >-
      Public documentation site with quickstarts, guides, a CLI reference, and the
      spec-driven development methodology.
    source_ids: [repo, install-docs]
    reviewed_at: 2026-10-01
  installation:
    status: public
    note: >-
      The README installs the specify-cli command-line tool with uv (Python 3.11+ required) and
      runs specify init with an agent integration key. The installation guide also documents
      pipx and PyPI installs, installs pinned to a release tag from the repository, and
      one-time use with uvx.
    source_ids: [repo, install-docs]
    reviewed_at: 2026-10-01
  supported_platforms:
    status: public
    note: >-
      The README states Linux, macOS, or Windows. The integrations reference lists many
      supported coding agents by integration key, including GitHub Copilot, Claude Code, Gemini
      CLI, and Cursor, plus a generic option for unlisted agents.
    source_ids: [repo, integrations-docs]
    reviewed_at: 2026-10-01
  release_status:
    status: public
    note: >-
      Reviewed tagged release v1.0.13, published September 29, 2026. This entry describes the
      project rather than one release.
    source_ids: [release]
    reviewed_at: 2026-10-01
