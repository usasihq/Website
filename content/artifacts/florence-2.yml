summary:
  text: >-
    Florence-2 is a family of vision foundation models from Microsoft's Azure AI group that
    handle captioning, object detection, visual grounding, segmentation, and OCR through text
    prompts, using a sequence-to-sequence design with a DaViT vision encoder. The models were
    trained on FLD-5B, a set of 5.4 billion visual annotations on 126 million images that the
    team built with an iterative automated annotation process. Microsoft published four
    checkpoints on Hugging Face in June 2024: Florence-2-base (0.23B parameters) and
    Florence-2-large (0.77B), plus versions of each fine-tuned on a collection of downstream
    tasks (base-ft and large-ft).
  source_ids: [florence2-paper, fl2-large-card, msr-florence2-pub, hf-florence2-listing]
  reviewed_at: 2026-10-01
useful_for:
  text: >-
    The model card shows prompt-selected tasks including captioning at several levels of detail,
    object detection, dense region captioning, region proposals, caption-to-phrase grounding,
    OCR, and OCR with regions.
  source_ids: [fl2-large-card]
