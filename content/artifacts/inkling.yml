summary:
  text: >-
    Inkling is Thinking Machines Lab's family of open-weight multimodal mixture-of-experts
    models that accept text, image, and audio input and produce text. The first release,
    Inkling (975B total and 41B active parameters), was published on July 15, 2026,
    followed by Inkling-Small (276B total and 12B active) on July 30, 2026.
  source_ids: [tml-inkling-news, tml-inkling-card, tml-inkling-small-card]
useful_for:
  text: >-
    The developer presents the family as a general base for customization and
    fine-tuning, including through its Tinker platform.
  source_ids: [tml-inkling-news]
