date: "2026-09-30"
title: Separate component rights, data disclosure, and access
summary: >-
  Rubric v0.2 separates training-data information completeness from access and requires an explicit sourced system-rights review for the highest tier.
  Legacy data assessments remain visible but do not establish the new completeness checks. Added component-specific license filters, clearer hosted-product labels,
  fact-level review fields, deeper representative company profiles, email corrections, and a manual source-change proposal queue. Existing review dates are not refreshed by migration.
