date: '2026-10-18'
title: 'AI on GitHub: the most-starred open-source AI projects, each with its own page'
summary: 'A new section, AI on GitHub, ranks 9,507 open-source AI projects on GitHub by stars, from the public GitHub
  API. Each project has its own page with its description, stars, forks, language, license, topics, last push, related
  projects, a link to its USASI catalog record where there is one, and a generated hero image. The list can be searched
  and filtered by topic, language, license, and owner type. Link lists, courses and books, collected prompts and
  jailbreaks, and deepfake tools are left out by published rules; the methodology explains them. Stars measure
  popularity, not quality or safety.'
