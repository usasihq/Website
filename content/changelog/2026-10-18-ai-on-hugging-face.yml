date: '2026-10-18'
title: 'AI on Hugging Face: the most-liked open models and datasets, each with its own page'
summary: 'A new section, AI on Hugging Face, ranks 4,320 models and 836 datasets on the Hugging Face Hub by likes,
  from the public Hub API. Each has its own page with likes, downloads in the last 30 days, task, library, license,
  parameter count where the Hub reports one, gated access, base-model links for quantized versions and fine-tunes, links
  to its USASI catalog record and AI on GitHub page where there are ones, and a generated hero image. The lists can be
  searched and filtered by task, library, license, author type, gated access, and quantized versions. Items tagged not
  for all audiences, deepfake and undressing tools, "uncensored" or "abliterated" fine-tunes, and jailbreak collections
  are left out by published rules; the methodology explains them. Likes measure popularity, not quality or safety.'
