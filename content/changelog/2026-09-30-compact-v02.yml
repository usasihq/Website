date: "2026-09-30"
title: Compact v0.2 and an optional homepage sponsor panel
summary: >-
  Revised the sponsorship policy, Privacy page, and USASI Compact to permit one clearly labeled homepage advertisement
  below the directory previews and before news, in addition to weekly-email sponsorships. The panel stays hidden without
  a configured sponsor. Free access, editorial independence, and the ban on paid listings, rankings, badges, and reader-data
  sharing remain. This revision does not change eligibility criteria or openness rubric v0.1.
