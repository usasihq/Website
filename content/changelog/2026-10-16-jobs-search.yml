date: '2026-10-16'
title: 'Jobs: search first, filters by category, level, and pay, 15 role pages, and five more employers'
summary: 'The Jobs page now opens with a search for what and where (a city, a state, or "Remote"), one-tap filters for
  remote U.S. work, entry-level roles, internships, and disclosed pay, and a filter panel with job category and
  experience level (read from the job title), pay range, and date posted, each with live counts. Results show pay,
  how long ago the job was posted, and an Apply link, and can be sorted by newest or highest pay. Role pages now cover
  software, machine learning, research, data, product, program management, solutions, sales, security,
  infrastructure, hardware, data center, design, and recruiting. Every job page lists similar jobs. Listings from
  Block, Palantir, Replit, METR, and Epoch AI are now collected, including Lever job boards.'
