date: '2026-10-14'
title: 'A Jobs page for every employer and for every current listing'
summary: 'Each employer with an automated job feed now has a shareable page at /jobs/at/<employer>/, and every current
  listing has its own page with the employer''s description as published on its job board, the key facts, and a link to
  apply on the employer''s site. Job search understands common abbreviations such as ML, SWE, and PM, ranks title
  matches first, and gained popular searches and a city filter. Listings are now refreshed twice a day.'
