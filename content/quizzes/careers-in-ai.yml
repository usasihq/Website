explainer: careers-in-ai
updated_at: 2026-10-08
questions:
  - prompt: Why does the page suggest reading a posting's duties instead of relying on its AI job title?
    choices:
      - One title often maps to several official occupations
      - Every AI title matches exactly one official occupation, so the title says it all
      - Job titles must by law use the names of federal occupations
    answer: 0
    explanation: >-
      The page says "one AI job title often maps to several official occupations, so the duties matter more than the name." O*NET's search for "machine learning engineer" returns several occupations, so "read a posting's duties, then find the occupation that fits them."
  - prompt: According to the Occupational Outlook Handbook pages the explainer cites, what preparation do research scientists typically need?
    choices:
      - A 4- or 5-year paid apprenticeship followed by a state license to practice
      - A law degree and a state license, usually earned by passing a bar exam
      - A master's degree or higher, though some federal jobs accept a bachelor's
    answer: 2
    explanation: >-
      The page says "research scientists typically need a master's degree or higher, though some federal jobs accept a bachelor's." Apprenticeships and state licenses describe most electricians, and the bar exam describes lawyers.
  - prompt: You find a position on USASI's Jobs page. How do you apply?
    choices:
      - Through a USASI form, which forwards your application to the employer
      - On the employer's own site; USASI collects no applications
      - By contacting USASI, which recruits and hires on the organizations' behalf
    answer: 1
    explanation: >-
      The Jobs page "links to the employer to apply," and "USASI does not employ or recruit for these organizations and collects no applications." The page's advice is to "apply on the employer's own site."
