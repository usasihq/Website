explainer: ai-history
updated_at: 2026-10-08
questions:
  - prompt: A handout says the term "artificial intelligence" was invented at a 1956 Dartmouth conference. What does the original proposal show?
    choices:
      - Its title used the phrase in a document dated August 31, 1955, before the meeting
      - It shows the phrase first appeared decades later, in the 2021 federal AI law
      - It proves that nobody anywhere had used the phrase before the proposal was written
    answer: 0
    explanation: >-
      The page says the proposal "is dated August 31, 1955, and uses the phrase in its title, so the phrase was in writing before the 1956 meeting." It also notes that "the proposal does not say whether anyone used the phrase earlier."
  - prompt: According to the page, what does Executive Order 14434 of September 29, 2026 do?
    choices:
      - It requires agencies to rewrite earlier regulations, contracts, and historical documents
      - It revokes Executive Order 14110 on safe, secure, and trustworthy AI
      - It directs agencies to use "Super Intelligence" and "SI" in place of "Artificial Intelligence" and "AI" in non-statutory documents
      - It replaces the 2020 Act's definition of AI with a new legal definition
    answer: 2
    explanation: >-
      The order directs agencies to use "Super Intelligence" and "SI" in websites, reports, and other non-statutory documents. The page says it "does not require changing earlier regulations, contracts, or historical documents" and defines the new terms by pointing to the 2020 Act's definition; Executive Order 14148 revoked 14110.
  - prompt: What did the 2017 paper "Attention Is All You Need" propose?
    choices:
      - An image database of millions of pictures, organized by WordNet synonym sets
      - The Transformer, a network built only on attention
      - A learning machine that taught itself to sort punch cards marked left or right
    answer: 1
    explanation: >-
      The page says the paper "proposed the Transformer, a network built only on attention," rather than the recurrent or convolutional networks then used. The image database is ImageNet (2009), and the punch-card machine is the 1958 perceptron.
