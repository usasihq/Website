notable_facts:
  - text: >-
      The SWE-bench paper (ICLR 2024) lists Princeton University and Princeton Language and
      Intelligence as the affiliations of its authors, with one co-author at the University of
      Chicago.
    source_ids: [swe-bench-paper]
  - text: >-
      The Princeton NLP group's Hugging Face account (princeton-nlp) hosts the original SWE-bench
      datasets, including SWE-bench, SWE-bench Lite, and SWE-bench Verified. The SWE-bench
      repository, now in a standalone SWE-bench GitHub organization, links current copies under a
      separate SWE-bench Hugging Face organization.
    source_ids: [princeton-nlp-hf, swe-bench-hf, swe-bench-readme]
