summary:
  text: >-
    Princeton University is a university in Princeton, New Jersey. Researchers at Princeton
    University and Princeton Language and Intelligence created SWE-bench, a benchmark of
    real-world GitHub issues for evaluating language models on software engineering tasks.
  source_ids: [irs-eo-bmf-nj, swe-bench-paper]
