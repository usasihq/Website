products:
  - id: etherlink
    name: Arista Etherlink AI networking platforms
    kind: hardware
    access: >-
      Family of standards-based Ethernet switch systems that Arista positions for AI networks,
      at 400G, 800G, and 1600G port speeds, including the 7060X-series leaf switches and
      7800R4 spine systems; sold as switch hardware running Arista EOS.
    url: https://www.arista.com/en/solutions/ai-networking
    source_ids: [arista-ai-networking, anet-10k-2025]
    last_reviewed: 2026-10-01
  - id: 7800r4
    name: Arista 7800R4 Series (AI Spine)
    kind: hardware
    access: >-
      Modular 800G switch systems that Arista describes as an AI spine, with 7800R4C line cards
      intended for cluster computing; also marketed for data center and service provider
      networks.
    url: https://www.arista.com/en/products/7800r4-series
    source_ids: [arista-7800r4, anet-10k-2025]
    last_reviewed: 2026-10-01
  - id: 7700r4-des
    name: Arista 7700R4 Distributed Etherlink Switch
    kind: hardware
    access: >-
      Distributed switching system whose separate leaf and spine units operate as one logical
      switch, intended for the back-end networks of large GPU and accelerator clusters.
    url: https://www.arista.com/en/products/7700r4-series
    source_ids: [arista-7700r4, anet-10k-2025]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      Arista's fiscal 2025 Form 10-K describes a "Centers of Data" strategy in which its network
      connects four domains: AI centers, data centers, campus centers, and WAN centers.
    source_ids: [anet-10k-2025]
    reviewed_at: 2026-10-01
  - text: >-
      Arista completed its acquisition of the VeloCloud SD-WAN business from Broadcom on June 30,
      2025, according to its Form 10-Q for the quarter ended June 30, 2026.
    source_ids: [anet-10q-q2-2026]
    reviewed_at: 2026-10-01
