summary:
  text: >-
    Arista Networks makes network systems for data center, campus, and wide-area networks,
    built around its EOS network operating system. For AI workloads it sells the Etherlink
    family of Ethernet switches, including the 7800R AI spine, the 7060 AI leaf, and the 7700R4
    Distributed Etherlink Switch, for networks that connect GPU and other accelerator clusters.
  source_ids: [anet-10k-2025, arista-ai-networking]
  reviewed_at: 2026-10-01
