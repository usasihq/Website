  explanation: >-
    The IRS exempt-organization extract for New York lists New York University, in New York,
    New York, as a 501(c)(3) organization with school status. NYU describes itself as a private
    research university anchored in New York City; its degree-granting campuses in Abu Dhabi and
    Shanghai do not change the location of the U.S. institution.
  source_ids: [irs-eo-bmf-ny, irs-eo-info, nyu-bulletin]
