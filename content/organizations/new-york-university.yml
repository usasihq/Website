notable_facts:
  - text: >-
      The GPQA benchmark paper (2023) lists New York University as the affiliation of its authors,
      two of whom also list Cohere or Anthropic. The benchmark's code and dataset are published
      from individual researcher accounts on GitHub and Hugging Face rather than from an NYU
      organization account.
    source_ids: [gpqa-paper, gpqa-repo, gpqa-hf]
  - text: >-
      The NYU Alignment Research Group does empirical work with language models aimed at
      longer-term concerns about deploying highly capable AI systems. It lists Machine Learning
      for Language (ML2), CILVR, the Center for Data Science, and the Department of Linguistics
      among related NYU groups.
    source_ids: [nyu-arg]
