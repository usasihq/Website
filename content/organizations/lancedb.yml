notable_facts:
  - text: >-
      LanceDB's November 2025 governance announcement separated the Lance format from its own
      products: Lance now has its own website (lance.org), GitHub organization (lance-format), and
      a project management committee drawn from several companies, while LanceDB keeps its own
      website and lancedb GitHub organization. The post says most contributions to the LanceDB
      open-source project still come from LanceDB Inc.
    source_ids: [lance-governance-blog, lance-community]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    LanceDB's Y Combinator directory listing gives its location as San Francisco, an undated
    internship post on LanceDB's own blog describes the company as an early-stage startup based in
    San Francisco, its customer terms are
    governed by California law, and its GitHub organization lists the United States as its
    location. No address-bearing legal page or regulatory filing was found, and the entity name
    differs between the website footer (LanceDB Inc.) and the privacy policy (LanceDB Systems,
    Inc.), so no legal name is recorded.
  source_ids: [yc-lancedb, lancedb-intern-blog, lancedb-terms, lancedb-github, lancedb-home, lancedb-privacy]
  assessed_at: 2026-09-29
openness_summary:
