summary:
  text: >-
    LanceDB builds data infrastructure for multimodal AI on the Lance columnar format: the
    open-source LanceDB embedded retrieval library and LanceDB Enterprise, a distributed
    multimodal lakehouse platform. In November 2025 LanceDB moved the Lance projects into a
    separate, community-governed lance-format GitHub organization.
  source_ids: [lancedb-docs, lancedb-home, lance-governance-blog]
