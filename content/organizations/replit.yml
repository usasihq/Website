summary:
  text: >-
    Replit offers a hosted platform, available on the web, desktop, and mobile, where people
    describe software in natural language and create, publish, and run apps with the help of
    Replit Agent. It has also published two small code-completion models on Hugging Face.
  source_ids: [replit-about, replit-docs, replit-agent-docs, hf-replit-code-v1-5]
  reviewed_at: 2026-10-01
