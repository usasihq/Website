products:
  - id: serverless-inference
    name: Together Serverless Inference
    kind: hosted-model-api
    access: >-
      Pay-per-token API for hundreds of open-source models across text, image, video, code,
      and voice, with an OpenAI-compatible interface.
    url: https://www.together.ai/serverless-inference
    source_ids: [together-serverless]
    last_reviewed: 2026-09-29
  - id: fine-tuning
    name: Together Fine-Tuning
    kind: developer-tool
    access: >-
      Managed LoRA and full fine-tuning of open-source models, launched from a web UI, API, or
      CLI, with cost estimates shown before a job starts.
    url: https://www.together.ai/fine-tuning
    source_ids: [together-fine-tuning]
    last_reviewed: 2026-09-29
  - id: gpu-clusters
    name: Together GPU Clusters
    kind: compute-service
    access: >-
      Self-serve NVIDIA GPU clusters provisioned through a console, CLI, SDK, API, or Terraform,
      with managed Kubernetes or Slurm; on-demand hourly or reserved pricing.
    url: https://www.together.ai/gpu-clusters
    source_ids: [together-gpu-clusters]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      In April 2026 Together AI announced that it had joined the U.S. Department of Energy's
      Genesis Mission.
    source_ids: [together-pr-genesis]
eligibility:
