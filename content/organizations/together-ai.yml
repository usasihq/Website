summary:
  text: >-
    Together AI runs a cloud platform for inference, fine-tuning, and training on open-weight
    models from many developers, and rents GPU clusters. Its website and APIs are operated by
    Together Computer, Inc.
  source_ids: [together-tos, together-serverless, together-gpu-clusters]
