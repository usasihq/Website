  explanation: >-
    Shield AI's 2021-2022 press releases state that the company is headquartered in San Diego,
    California. Its 2025 releases list offices in San Diego, Dallas, Washington, D.C., Boston, Abu
    Dhabi, Kyiv, Melbourne, and Oslo without naming a headquarters, and its September 2026
    boilerplate says only that it has facilities across the U.S., Europe, the Middle East, and
    Asia-Pacific. Its privacy and contact pages give no entity name or address, and its job board
    lists most roles in U.S. cities (led by Seattle and Dallas). No current official statement of
    the headquarters or principal place of business was found, so the record is held as a draft
    pending a current source such as a terms page, filing, or state registry entry.
  source_ids: [ shield-uae-2022, shield-oslo-2025, shield-kraken-release, shield-privacy, shield-jobs ]
