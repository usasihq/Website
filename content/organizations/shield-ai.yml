products:
  - id: hivemind
    name: Hivemind
    kind: enterprise-software
    access: >-
      Autonomy software for building, testing, and deploying AI pilots for uncrewed systems,
      offered either as turnkey AI pilots built by Shield AI engineers (Hivemind Solutions) or as
      a development toolkit for customers (Hivemind Enterprise); Shield AI says customers retain
      rights to the intellectual property they build. It has been integrated on aircraft
      including the X-62, F-16, MQ-20, and V-BAT, among other platforms.
    url: https://shield.ai/hivemind/
    source_ids: [ shield-hivemind ]
