eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Assessment of a company with a significant presence in France. Poolside's
    July 2026 press release states that it is headquartered in San Francisco. Its
    current Terms of Use name the contracting entity as Poolside, Inc., a Delaware
    corporation with a San Francisco address, governed by California law. Earlier
    reporting described the company as having moved its headquarters to Paris (French
    Tech Journal, November 2023) and as Paris-based after relocating to France (Fortune,
    September 2024), and the French business
    registry lists an active Paris-registered company, POOLSIDE AI (SAS), created in
    July 2023. The most recent official statements place the headquarters in San
    Francisco, so the U.S.-headquarters basis applies. Two points are not documented:
    how the U.S. and French entities are related, and whether the San Francisco
    address in the legal documents, a private mailbox, is also a staffed office.
    Re-check if Poolside's stated headquarters changes.
  source_ids: [poolside-laguna-s-release, poolside-terms, poolside-dpa, frenchtech-poolside-2023, fortune-poolside-2024, fr-registry-poolside-ai]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Poolside publishes Laguna model weights on Hugging Face. Laguna XS.2 and M.1 carry
    Apache 2.0, and Laguna XS 2.1 and S 2.1 carry OpenMDW-1.1. A technical report
    describes the training data and process for XS.2 and M.1; this catalog found no
    public release of the training data or training code.
  source_ids: [poolside-docs-overview, laguna-tech-report, hf-laguna-xs2, hf-laguna-m1, hf-laguna-xs-2-1, hf-laguna-s-2-1, poolside-laguna-s-release]
