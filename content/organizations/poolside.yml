summary:
  text: >-
    Poolside trains foundation models for software engineering and publishes the
    Laguna family of open-weight agentic coding models. It offers the models through
    an OpenAI-compatible API, a terminal coding agent, and self-managed inference
    deployments.
  source_ids: [poolside-docs-overview, poolside-laguna-s-release]
