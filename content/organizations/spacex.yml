openness_summary:
  text: >-
    SpaceX's AI work is carried out mainly through its xAI subsidiary. The Grok models are
    offered as hosted services, and xAI has published weights for two earlier models (Grok-1
    and Grok 2); see the xAI record. This catalog has no record of model weights published
    under SpaceX's own name.
