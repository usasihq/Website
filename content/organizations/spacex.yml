status_note:
  text: >-
    SpaceX completed its initial public offering in June 2026, and its Class A common stock
    trades on Nasdaq under the symbol SPCX. It completed its acquisition of X.AI Holdings
    Corp. (xAI) on February 2, 2026, and of Anysphere, Inc. (Cursor) on August 14, 2026;
    both became wholly owned subsidiaries.
  source_ids: [spacex-10q-2026q2, spacex-8k-2026-08-14]
products: []
notable_facts:
  - text: >-
      Grok, the xAI API, and other Grok products are recorded on the xAI (SpaceXAI) record,
      which is a subsidiary of SpaceX.
    source_ids: [spacex-10q-2026q2]
  - text: >-
      SpaceX's second-quarter 2026 results release says that in that quarter it entered into
      cloud services agreements to give customers access to compute capacity, and that it was
      continuing to build out its Colossus II compute capacity.
    source_ids: [spacex-q2-2026-release]
