summary:
  text: >-
    SpaceX reports three business segments: Space (reusable launch vehicles), Connectivity
    (the Starlink satellite network), and AI. SpaceX acquired xAI in February 2026, and its AI
    segment covers the Grok models, AI products for consumers and businesses, the X platform,
    and AI computing infrastructure.
