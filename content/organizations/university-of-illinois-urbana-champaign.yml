summary:
  text: >-
    The University of Illinois Urbana-Champaign is a public research university with a
    land-grant mission, founded in 1867 and governed by the Board of Trustees of the University
    of Illinois. Its AI research groups include U Lab, which maintains LLMRouter, an open-source
    library for routing requests among large language models.
  source_ids: [uiuc-about, uiuc-trustees, ulab-github, llmrouter-license]
