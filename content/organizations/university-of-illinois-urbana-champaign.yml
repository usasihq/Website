notable_facts:
  - text: >-
      U Lab, a research group at the University of Illinois Urbana-Champaign, publishes its code
      in the ulab-uiuc GitHub organization. Its repositories include LLMRouter, ResearchTown, and
      MultiAgentBench (MARBLE), which address LLM routing and multi-agent LLM systems.
    source_ids: [ulab-github, llmrouter-docs]
    reviewed_at: 2026-10-01
  - text: >-
      LLMRouter is a library that selects which large language model should answer each query,
      with more than 16 routing methods, a command-line interface, and a data-generation
      pipeline. It is released under the MIT License with copyright held by U Lab @UIUC. Its
      project page lists authors from the University of Illinois Urbana-Champaign together with
      collaborators from the University of Maryland, Nanyang Technological University, Purdue
      University, and the University of Illinois Chicago.
    source_ids: [llmrouter-repo, llmrouter-license, llmrouter-docs]
    reviewed_at: 2026-10-01
