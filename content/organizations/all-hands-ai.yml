slug: all-hands-ai
name: All Hands AI (OpenHands)
legal_name: null
website: https://www.openhands.dev
logo_text: OH
summary:
  text: >-
    All Hands AI develops OpenHands, an open-source platform for building and running AI coding
    agents. It also offers a hosted service (OpenHands Cloud) and a commercial enterprise edition.
    The company now presents itself and its products under the OpenHands name.
  source_ids: [oh-tos, oh-about, oh-docs-home]
organization_roles: [developer-platform, enterprise-software]
ownership_category: privately-held
legal_form: null
parent_org_slug: null
parent_relationship: null
