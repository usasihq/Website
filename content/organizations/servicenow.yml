summary:
  text: >-
    ServiceNow sells the ServiceNow AI Platform, enterprise software for running business
    workflows, with generative AI tools (Now Assist), AI agents, and AI governance features
    built in. Its research teams publish the open-weight Apriel language
    models, and ServiceNow co-stewards the BigCode project with Hugging Face.
  source_ids: [now-10k-2025, now-pr-2026-04-09, hf-servicenow-ai, starcoder2-paper]
