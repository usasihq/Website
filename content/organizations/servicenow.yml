products:
  - id: servicenow-ai-platform
    name: ServiceNow AI Platform
    kind: enterprise-software
    access: >-
      Enterprise workflow platform sold to organizations. Since April 2026 ServiceNow says AI,
      data, security, and governance features are included in every offering rather than sold
      separately, and that the platform works with the customer's preferred model provider.
    url: https://newsroom.servicenow.com/press-releases/details/2026/ServiceNow-moves-beyond-the-sidecar-AI-era-giving-customers-a-complete-AI-native-experience-across-all-products-and-packages/default.aspx
    source_ids: [now-pr-2026-04-09, now-10k-2025]
    last_reviewed: 2026-09-29
  - id: ai-control-tower
    name: AI Control Tower
    kind: enterprise-software
    access: >-
      Governance dashboard on the ServiceNow AI Platform for discovering, observing, governing,
      securing, and measuring AI, including AI agents, deployed across an enterprise's
      systems.
    url: https://newsroom.servicenow.com/press-releases/details/2026/ServiceNow-turns-enterprise-AI-chaos-into-control-with-the-platform-for-governed-autonomous-work/default.aspx
    source_ids: [now-pr-2026-05-05, now-10k-2025]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      ServiceNow's 2025 Form 10-K says Now Assist customers can use ServiceNow's own language
      models or integrate third-party or proprietary models.
    source_ids: [now-10k-2025]
  - text: >-
      The 2025 Form 10-K says ServiceNow acquired Moveworks, Inc., adding enterprise search and
      front-end virtual agent technology to its platform.
    source_ids: [now-10k-2025]
  - text: >-
      ServiceNow's SLAM (ServiceNow Language Models) lab publishes the Apriel models on
      Hugging Face under the ServiceNow-AI organization. ServiceNow AI Research also maintains
      Fast-LLM, an Apache 2.0 open-source library for training large language models, which
      the Apriel-1.6 model card names as part of its training stack.
    source_ids: [hf-servicenow-ai, apriel-1-6-card, fast-llm-repo]
  - text: >-
      The StarCoder2 technical report says the BigCode project, an open scientific
      collaboration on code language models, is stewarded by ServiceNow and Hugging Face.
      Hugging Face's StarCoder2 announcement says ServiceNow trained the StarCoder2-3B model.
    source_ids: [starcoder2-paper, hf-starcoder2-blog]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    ServiceNow, Inc. is a Delaware corporation whose Form 10-K for fiscal 2025 lists its
    principal executive offices at 2225 Lawson Lane, Santa Clara, California. Its April 2026
    press release also describes the company as based in Santa Clara.
  source_ids: [now-10k-2025, now-pr-2026-04-09]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    ServiceNow's platform products are hosted enterprise software. Separately, it publishes
    Apriel model weights on Hugging Face under the MIT license and co-stewards BigCode, whose
    StarCoder2 models use the custom BigCode OpenRAIL-M license. This catalog assesses those
    models release by release.
  source_ids: [now-pr-2026-04-09, hf-servicenow-ai, apriel-1-6-card, starcoder2-paper]
