slug: github
name: GitHub
legal_name:
  text: GitHub, Inc.
  source_ids: [gh-terms, gh-privacy]
  reviewed_at: 2026-10-01
website: https://github.com
logo_text: GH
summary:
  text: >-
    GitHub runs a platform for hosting and collaborating on code, with cloud and on-premises
    offerings, and develops the GitHub Copilot AI coding assistant. It is owned by Microsoft,
    which reports GitHub within its Intelligent Cloud segment.
  source_ids: [msft-10k-2026, copilot-what-is, msft-gh-acquisition]
  reviewed_at: 2026-10-01
organization_roles: [developer-platform]
ownership_category: unit-of-another-organization
parent_evidence:
  text: >-
    Microsoft announced on October 26, 2018 that it had completed its acquisition of GitHub.
    Microsoft's Form 10-K for fiscal 2026 describes GitHub among the server products and cloud
    services in its Intelligent Cloud segment, and GitHub's privacy statement names Microsoft as
    a GitHub affiliate. Exhibit 21 to that 10-K lists only selected subsidiaries and does not
    name GitHub, Inc.
  source_ids: [msft-gh-acquisition, msft-10k-2026, gh-privacy, msft-ex21-2026]
  reviewed_at: 2026-10-01
legal_form: null
parent_org_slug: microsoft
parent_relationship: subsidiary
headquarters:
  label: San Francisco, California
  country: US
  source_ids: [gh-privacy, gh-terms]
other_locations: []
founded: null
sectors: [agents]
status_note: null
products:
  - id: github-copilot
    name: GitHub Copilot
    kind: developer-tool
    access: >-
      AI coding assistant with a free tier (Copilot Free) that has limited features, paid
      individual plans (Pro, Pro+, Max), and per-seat Copilot Business and Copilot Enterprise
      plans for organizations, per GitHub's plan documentation.
    url: https://docs.github.com/en/copilot/get-started/what-is-github-copilot
    source_ids: [copilot-what-is, copilot-plans]
    last_reviewed: 2026-10-01
  - id: copilot-cli
    name: GitHub Copilot CLI
    kind: developer-tool
    access: >-
      Terminal interface for Copilot that answers questions, writes and debugs code, and works
      with GitHub.com; GitHub's plan documentation lists it as included in all Copilot plans. It
      runs on Linux, macOS, and Windows (PowerShell or WSL).
    url: https://docs.github.com/copilot/concepts/agents/about-copilot-cli
    source_ids: [copilot-cli-docs, copilot-plans]
    last_reviewed: 2026-10-01
  - id: spec-kit
    name: Spec Kit
    kind: developer-tool
    access: >-
      Open-source (MIT) toolkit installed as a Python command-line tool that sets up
      spec-driven development and other structured processes for AI coding agents.
    url: https://github.com/github/spec-kit
    source_ids: [spec-kit-repo, spec-kit-license]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      GitHub's documentation states that GitHub Models, a separate service that offered a model
      playground, model catalog, and inference API, was fully retired as of July 30, 2026, and
      points users to Azure AI Foundry or GitHub Copilot instead.
    source_ids: [gh-models-retired]
    reviewed_at: 2026-10-01
  - text: >-
      GitHub announced Spec Kit on its blog in September 2025 as an open-source toolkit for
      spec-driven development with coding agents such as GitHub Copilot, Claude Code, and
      Gemini CLI.
    source_ids: [gh-spec-kit-blog]
    reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    Microsoft announced that it completed its acquisition of GitHub on October 26, 2018, and
    its Form 10-K for fiscal 2026 reports GitHub within its Intelligent Cloud segment; that
    filing gives Microsoft's address as Redmond, Washington and its state of incorporation as
    Washington. GitHub's terms of service name GitHub, Inc. as the contracting party under
    California law, and its privacy statement gives GitHub, Inc.'s postal address in San
    Francisco and names Microsoft as an affiliate. The privacy statement also lists GitHub B.V.
    in Amsterdam for some users; that does not change the U.S. control assessment.
  source_ids: [msft-gh-acquisition, msft-10k-2026, gh-terms, gh-privacy]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    GitHub's platform and Copilot are hosted commercial services. GitHub publishes some
    AI developer tools as open source, including Spec Kit and the GitHub MCP Server, both under
    the MIT License. This catalog has no record of model weights published by GitHub.
  source_ids: [spec-kit-license, gh-mcp-server-repo, gh-mcp-server-license, copilot-plans]
  reviewed_at: 2026-10-01
