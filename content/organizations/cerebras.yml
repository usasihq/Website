products:
  - id: cerebras-inference
    name: Cerebras Inference
    kind: inference-service
    access: >-
      Cloud inference API for models hosted on Cerebras hardware; developers obtain an API key
      through cloud.cerebras.ai and call it with Cerebras Python or JavaScript SDKs or with
      OpenAI-compatible clients.
    url: https://inference-docs.cerebras.ai/introduction
    source_ids: [cerebras-inference-docs]
    last_reviewed: 2026-09-29
  - id: cs-4
    name: Cerebras CS-4 system
    kind: hardware
    access: >-
      Rack-scale inference system with three WSE-3 Turbo processors per system, built on a
      modular rack design intended for deployment in hyperscale data centers.
    url: https://www.cerebras.ai/cs4
    source_ids: [cerebras-cs4-page]
    last_reviewed: 2026-09-29
  - id: cerebras-training-cloud
    name: Cerebras Training Cloud
    kind: compute-service
    access: >-
      Cloud service for training and fine-tuning models on Cerebras hardware, billed per hour of
      training or offered as a service in which Cerebras designs and trains a custom model.
    url: https://www.cerebras.ai/cloud
    source_ids: [cerebras-cloud-page]
    last_reviewed: 2026-09-29
