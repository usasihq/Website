summary:
  text: >-
    Cerebras designs the Wafer-Scale Engine, a processor built from an entire silicon wafer,
    and rack-scale systems based on it for deployment in its own and customers' data centers.
    It also offers cloud inference and training services that run on its hardware.
  source_ids: [cerebras-10q-q2-2026, cerebras-inference-docs, cerebras-cloud-page]
