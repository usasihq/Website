  explanation: >-
    Thinking Machines Lab, Inc. states in its privacy notice that it is based in the
    United States. Its service terms apply California law with arbitration in San
    Francisco, and nearly all roles on its job board are listed in San Francisco. No
    official page names a street address.
  source_ids: [tml-privacy, tml-terms, tml-job-board]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Thinking Machines Lab has published weights for Inkling and Inkling-Small on Hugging
    Face under Apache 2.0, together with a Model Acceptable Use Policy that it says binds
    users of its model materials. Tinker is a hosted, paid service.
  source_ids: [hf-thinkingmachines, tml-model-aup, tml-tinker]
