summary:
  text: >-
    Databricks sells a data and AI platform built on a lakehouse architecture that runs on AWS, Azure, and Google
    Cloud. The platform includes tools for building and serving AI agents and models, and Databricks-hosted access to
    open models through its Foundation Model APIs.
  source_ids: [databricks-platform, databricks-ai-product, databricks-fmapi-docs]
