notable_facts:
  - text: >-
      Databricks states it was founded by the original creators of the lakehouse architecture and of the open source
      projects Apache Spark, Delta Lake, MLflow, and Unity Catalog.
    source_ids: [databricks-about]
  - text: >-
      Databricks retired its DBRX models from Foundation Model APIs pay-per-token and from fine-tuning on April 30,
      2025, and from provisioned throughput on December 19, 2025.
    source_ids: [databricks-retired-models]
