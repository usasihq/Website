openness_summary:
  text: >-
    Databricks released DBRX Base and DBRX Instruct weights in March 2024 under its custom Databricks Open Model
    License; as of this review its Hugging Face organization lists no public models, and DBRX is kept here as an
    archived record. The same organization lists public datasets such as databricks-dolly-15k.
  source_ids: [databricks-dbrx-blog, databricks-open-model-license, databricks-hf-org]
