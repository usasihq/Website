summary:
  text: >-
    Nous Research is an AI research company that trains and releases open-weight language
    models, most prominently the Hermes series of post-trained models, and builds open-source
    agent and training software such as Hermes Agent and the Atropos reinforcement-learning
    environment framework.
  source_ids: [nous-home, nous-releases, hermes-agent-license, atropos-license]
