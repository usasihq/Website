products:
  - id: nous-portal
    name: Nous Portal
    kind: hosted-model-api
    access: >-
      Account and credits-based subscription service that provides model inference (including
      the Nous Inference API), hosted tools, and cloud hosting for Hermes Agent; its catalog
      includes Nous models and many third-party models.
    url: https://portal.nousresearch.com
    source_ids: [nous-portal, nous-portal-terms, mc-hermes-4-3-36b]
    last_reviewed: 2026-09-29
  - id: hermes-agent
    name: Hermes Agent
    kind: developer-tool
    access: >-
      Open-source (MIT) autonomous agent that runs from a terminal install, desktop apps, or
      cloud hosting through Nous Portal, connects to messaging platforms, and can use Nous Portal
      or another model provider.
    url: https://hermes-agent.nousresearch.com
    source_ids: [hermes-agent-site, hermes-agent-license]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Nous Research says Hermes 4.3 36B was its first Hermes model trained over the internet on
      Psyche, a decentralized training network, and that it also released a centrally trained
      version for comparison.
    source_ids: [hermes-4-3-blog, mc-hermes-4-3-36b]
  - text: >-
      For Hermes 4, Nous Research published the evaluation samples generated during
      benchmarking on Hugging Face alongside the models, as described in the Hermes 4 technical
      report.
    source_ids: [hermes4-report-pdf]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The Nous Portal terms of service identify the operator as Nous Research, Inc., a Delaware
    corporation. The only postal address found in Nous Research's own documents is 600 Congress
    Avenue, Austin, Texas, listed as a contact address for Nous Research, Inc. in its store
    privacy policy; the careers page refers to a New York office and lists other roles as
    remote. No official page reviewed names a headquarters city, so only the country is
    recorded; no non-U.S. office was found, and the U.S. headquarters basis rests on these
    documents.
  source_ids: [nous-portal-terms, nous-shop-privacy, nous-careers]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Nous Research publishes Hermes model weights on Hugging Face. These are post-trained from
    other organizations' base models; the model cards declare, for example, Apache 2.0 for the
    Seed-OSS-based Hermes 4.3 36B and a Llama license ("llama3") for the Llama-based Hermes 4
    70B. It also publishes evaluation samples and open-source tools such as Atropos and
    Hermes Agent. The Hermes 4 technical report describes the post-training data but does not
    link a release of it. This catalog assesses openness per release.
  source_ids: [mc-hermes-4-3-36b, mc-hermes-4-70b, hermes4-report-pdf, atropos-license, hermes-agent-license]
