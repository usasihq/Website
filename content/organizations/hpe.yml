summary:
  text: >-
    HPE sells enterprise infrastructure and services spanning servers, hybrid cloud, and
    networking. Since November 2025 it has reported Cloud & AI and Networking as its main
    segments. Its AI
    offerings include HPE Private Cloud AI and other HPE AI Factory solutions, and HPE Cray
    supercomputers for HPC and AI workloads.
  source_ids: [hpe-10q-q3-fy2026, hpe-juniper-release, hpe-ai-factory-page, hpe-cray-page]
