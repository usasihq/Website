notable_facts:
  - text: >-
      HPE completed its acquisition of Juniper Networks, Inc. on July 2, 2025, adding Juniper's
      networking portfolio to HPE's networking business.
    source_ids: [hpe-10k-fy2025, hpe-juniper-release]
  - text: >-
      Effective November 1, 2025, HPE merged its Server, Hybrid Cloud, and Financial Services
      segments into a new Cloud & AI segment; it now reports Cloud & AI, Networking, and
      Corporate Investments and Other.
    source_ids: [hpe-10q-q3-fy2026]
