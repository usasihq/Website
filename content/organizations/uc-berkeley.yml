summary:
  text: >-
    UC Berkeley is a public university and a campus of the University of California, which was
    founded in 1868 and moved to its Berkeley campus in 1873. Its AI-related research includes
    the Sky Computing Lab and the Gorilla project, which runs the Berkeley Function Calling
    Leaderboard.
  source_ids: [berkeley-about, berkeley-history, sky-lab, bfcl-hf, bfcl-leaderboard]
