notable_facts:
  - text: >-
      In May 2025 the PyTorch Foundation accepted vLLM, an inference and serving engine for
      large language models contributed by the University of California, Berkeley, as a
      foundation-hosted project.
    source_ids: [pytorch-vllm]
  - text: >-
      The Sky Computing Lab presents itself as the next Berkeley lab for data-intensive systems
      research after AMPLab and RISELab; its stated aim is to let applications run on any cloud
      or on several clouds at once.
    source_ids: [sky-lab]
  - text: >-
      The Berkeley Function Calling Leaderboard (BFCL) is described in an ICML 2025 paper whose
      authors are all affiliated with the University of California, Berkeley. The leaderboard is
      hosted at gorilla.cs.berkeley.edu, and its dataset is published by the Hugging Face
      organization "Gorilla LLM (UC Berkeley)".
    source_ids: [bfcl-paper, bfcl-leaderboard, bfcl-hf]
  - text: >-
      LMSYS states that it originated in 2023 from a multi-university collaboration that included
      UC Berkeley. Chatbot Arena, which began as a research project under UC Berkeley and LMSYS,
      is now operated by Arena Intelligence Inc., a company formed in 2025 that describes Arena
      as created by researchers from UC Berkeley.
    source_ids: [lmsys-about, arena-new-lmarena, arena-about]
