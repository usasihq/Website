  explanation: >-
    Arcee's September 2026 press release describes Arcee AI as a U.S. artificial
    intelligence company and carries a San Francisco dateline, its about page calls
    it a U.S. model lab, and SiliconANGLE reports it as San Francisco-based. Its site terms name Arcee AI, Inc., apply
    Delaware law, and set venue in courts in Miami, Florida. All documented
    locations are in the United States.
  source_ids: [arcee-series-b-release, siliconangle-arcee-series-b, arcee-terms, arcee-about]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Arcee publishes Trinity model weights on Hugging Face. Trinity Nano Preview and
    Trinity Mini were announced under Apache 2.0; in May 2026 Arcee moved the family,
    including earlier releases, to the OpenMDW-1.1 license, which the Hugging Face model
    cards now list. A technical report describes the pretraining data; this catalog found
    no public release of the data itself. The hosted API is a paid service.
  source_ids: [arcee-trinity-page, arcee-openmdw-blog, arcee-trinity-manifesto, trinity-mini-card, trinity-large-thinking-card, trinity-tech-report, arcee-pricing]
