summary:
  text: >-
    Arcee AI trains and publishes the Trinity family of open-weight language models,
    ranging from an on-device Nano model to a roughly 400-billion-parameter
    mixture-of-experts model. It also runs a hosted, OpenAI-compatible API.
  source_ids: [arcee-trinity-page, arcee-quickstart]
