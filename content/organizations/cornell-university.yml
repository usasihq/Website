notable_facts:
  - text: >-
      Cornell describes itself as a privately endowed research university, a partner of the
      State University of New York, and the federal land-grant institution in New York State.
    source_ids: [cornell-about]
    reviewed_at: 2026-10-01
  - text: >-
      The Kuleshov Group at Cornell Tech describes itself as a research group focused on machine
      learning, generative models, and AI for science. Its GitHub organization hosts the code for
      MDLM, a masked diffusion language model presented at NeurIPS 2024, under the Apache License
      2.0.
    source_ids: [kuleshov-github, mdlm-repo, mdlm-license]
    reviewed_at: 2026-10-01
  - text: >-
      The Zhang Research Group, headed by a professor in Cornell's School of Electrical and
      Computer Engineering, publishes on high-level synthesis, hardware specialization for
      machine learning, and programming models for software-defined FPGAs. Its GitHub organization publishes HeuriGym, a benchmark for
      evaluating how well large language models generate and refine heuristics for combinatorial
      optimization problems, under the Apache License 2.0.
    source_ids: [zhang-group, heurigym-repo, heurigym-license]
    reviewed_at: 2026-10-01
