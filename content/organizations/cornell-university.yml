summary:
  text: >-
    Cornell University is a privately endowed research university whose main campus is in
    Ithaca, New York; its charter was signed into law in 1865. Its
    AI-related research groups include the Kuleshov Group at Cornell Tech, which works on
    machine learning and generative models, and the Zhang Research Group in electrical and
    computer engineering, which studies hardware specialization for machine learning.
  source_ids: [cornell-about, kuleshov-github, zhang-group]
  reviewed_at: 2026-10-01
