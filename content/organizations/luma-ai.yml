eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Luma's careers page and its company information page list its headquarters in Redwood
    City, California. Its terms of service (updated May 2026) give a legal address at 715 Alma
    Street, Palo Alto, California, and its 2023 SEC Form D lists Luma AI, Inc. as a Delaware
    corporation with its principal place of business in Palo Alto. Both cities are in
    California; the record uses the headquarters named on the current careers page.
  source_ids: [luma-careers, luma-llm-info, luma-terms, luma-form-d-2023]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Luma's Ray and Uni models are offered through its hosted app and API; the Ray3.2 page does
    not mention a weights release. Luma publishes Apache-2.0 client SDKs on GitHub. Its
    research repository for Inductive Moment Matching includes code under a CC BY-NC-SA 4.0
    (non-commercial) license file and links to research checkpoints trained on CIFAR-10 and
    ImageNet 256x256 on Hugging Face, where the model card metadata says Apache-2.0 but the
    repository's license file is CC BY-NC-SA 4.0.
  source_ids: [luma-ray, luma-api, luma-python-sdk, luma-python-sdk-license, luma-imm-repo, luma-imm-license, luma-imm-hf]
