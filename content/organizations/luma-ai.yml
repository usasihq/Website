  - id: luma-api
    name: Luma API
    kind: hosted-model-api
    access: >-
      Paid developer API for the Ray3.2 video model and the Uni-1.1 image model, authenticated
      with API keys, with pay-as-you-go and dedicated-capacity plans and official SDKs for
      Python, TypeScript, and Go.
    url: https://lumalabs.ai/api
    source_ids: [luma-api, luma-llm-info, luma-agents-docs]
    last_reviewed: 2026-09-29
