openness_summary:
  text: >-
    Perplexity's main products are a hosted assistant and hosted APIs. It also publishes some model weights on
    Hugging Face, such as the pplx-embed text embedding models, which the model card lists under the MIT license
    and describes as derived from Qwen3 through continued pretraining by Perplexity.
