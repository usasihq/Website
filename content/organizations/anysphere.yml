  label: San Francisco, California
  country: US
  source_ids: [cursor-terms, cursor-msa]
other_locations: []
founded: null
sectors: [agents]
status_note:
  text: >-
    On August 14, 2026 SpaceX completed its acquisition of Anysphere, Inc. through a merger in
    which a SpaceX subsidiary merged into Anysphere and Anysphere survived as a wholly owned
    subsidiary of Space Exploration Technologies Corp., per SpaceX's Form 8-K. Cursor announced
    the same day that it is now part of SpaceX. SpaceX is a Texas corporation with principal
    executive offices in Starbase, Texas.
  source_ids: [spacex-8k-2026-08-14, cursor-joining-spacex]
