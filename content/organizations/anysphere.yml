slug: anysphere
name: Anysphere (Cursor)
legal_name:
  text: Anysphere, Inc.
  source_ids: [cursor-terms, spacex-8k-2026-08-14]
website: https://cursor.com
logo_text: A
summary:
  text: >-
    Anysphere makes Cursor, an AI coding product with a desktop editor, coding agents, a
    command-line tool, and an automated code reviewer. Cursor offers models from several
    providers alongside its own Composer models. Since August 2026 Anysphere has been a wholly
    owned subsidiary of SpaceX.
  source_ids: [cursor-terms, cursor-home, cursor-models, spacex-8k-2026-08-14]
