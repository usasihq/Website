      Command-line tool, installed with a shell script, for running Cursor's coding agents in a
      terminal, in scripts, and in GitHub Actions.
    url: https://cursor.com/cli
    source_ids: [cursor-cli]
    last_reviewed: 2026-09-29
  - id: bugbot
    name: Bugbot
    kind: developer-tool
    access: >-
      AI code review tool that reviews pull requests through a GitHub integration; the product
      page offers a 14-day free trial on all plans and does not list prices.
    url: https://cursor.com/bugbot
    source_ids: [cursor-bugbot]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Cursor's models page lists Composer as Cursor's own model line and lists Grok models
      that it describes as jointly trained by Cursor and SpaceXAI. It says models are hosted
      by the model provider, a trusted partner, or Cursor.
    source_ids: [cursor-models]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Cursor's terms of service and master services agreement (both updated in 2026) name
    Anysphere, Inc. with an address at 2261 Market Street, San Francisco, California, and
    Cursor's careers page lists many roles in San Francisco and New York. Since August 14,
    2026 Anysphere has been a wholly owned subsidiary of Space Exploration Technologies Corp.,
    a Texas corporation with principal executive offices in Starbase, Texas, per SpaceX's
    Form 8-K, so both the company and its parent are U.S.-based.
  source_ids: [cursor-terms, cursor-msa, cursor-careers, spacex-8k-2026-08-14]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Cursor and its related tools are commercial products, and Cursor's own models are offered
    inside Cursor. The pages reviewed do not describe public weights for these models, and
    this catalog has no record of an open model release from Anysphere.
  source_ids: [cursor-home, cursor-models]
