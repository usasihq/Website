slug: langchain
name: LangChain
legal_name:
  text: LangChain Inc.
  source_ids: [langchain-tos]
website: https://www.langchain.com
logo_text: LC
summary:
  text: >-
    LangChain develops the open-source LangChain, LangGraph, and Deep Agents frameworks for
    building LLM agents. It also sells LangSmith, a commercial platform for tracing, evaluating,
    and deploying agents.
  source_ids: [langchain-about, langsmith-page]
