products:
  - id: langsmith
    name: LangSmith
    kind: developer-tool
    access: >-
      Platform for tracing, monitoring, and evaluating agents and LLM applications. The Developer
      tier is free and the Plus and Enterprise plans are paid; all plans can use LangChain's cloud,
      and the Enterprise plan adds hybrid and self-hosted deployment.
    url: https://www.langchain.com/langsmith
    source_ids: [langsmith-page, langchain-pricing]
    last_reviewed: 2026-09-29
  - id: langsmith-deployment
    name: LangSmith Deployment
    kind: developer-tool
    access: >-
      Managed runtime for running agents in production. The docs say it works with agents built on
      LangGraph and other frameworks, and that it runs in LangChain's cloud, as a hybrid
      deployment, self-hosted on Kubernetes (Enterprise plan), or as a standalone Agent Server.
    url: https://docs.langchain.com/langsmith/deployments
    source_ids: [langsmith-deployment-docs]
    last_reviewed: 2026-09-29
  - id: langsmith-fleet
    name: LangSmith Fleet
    kind: enterprise-software
    access: >-
      No-code agent builder in the LangSmith web app. Agents built with it can run inside tools
      such as Slack, Teams, and Gmail, and sensitive actions can require human approval.
    url: https://www.langchain.com/langsmith/fleet
    source_ids: [langsmith-fleet]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      According to the company, LangChain began as an open-source side project in late 2022, and
      the company was formed in early 2023.
    source_ids: [langchain-about]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    LangChain's about page says the company is headquartered in San Francisco, with other offices
    in New York, Boston, and Amsterdam. Its terms of service (updated June 2, 2026) name LangChain
    Inc., a Delaware corporation, as the provider, with Delaware law and Delaware courts. No
    foreign parent or headquarters was found.
  source_ids: [langchain-about, langchain-tos]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    LangChain says it builds open-source frameworks (LangChain, LangGraph, and Deep Agents) and
    sells LangSmith, its commercial platform, alongside them. This catalog assesses openness
    project by project (see the LangChain framework and LangGraph records), not for the company
    as a whole.
  source_ids: [langchain-about, langchain-pricing]
