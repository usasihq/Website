founded: null
sectors: [robotics]
status_note:
  text: >-
    In June 2026 Agility Robotics agreed to a proposed business combination with Churchill
    Capital Corp XI, a Nasdaq-listed blank check company, under which the combined company
    would trade as "AGLT". A Form S-4 registration statement was filed with the SEC on
    September 4, 2026. As of Agility's September 15, 2026 release the transaction was still
    pending, subject to shareholder, SEC, regulatory, and exchange approvals.
  source_ids: [agility-churchill-pr, sec-agility-s4-index, agility-digit5-pr, agility-investors]
products:
  - id: digit
    name: Digit
    kind: robot
    access: >-
      Humanoid robot deployed at customer sites for tasks such as tote handling,
      palletizing, machine tending, and kitting; deployments are arranged through Agility's sales team. Digit 5
      was announced in September 2026, with early access expected in the first half of 2027
      and general availability by the end of 2027.
    url: https://www.agilityrobotics.com/solutions
    source_ids: [agility-solutions, agility-digit5-pr, agility-digit5-page]
    last_reviewed: 2026-09-29
  - id: agility-arc
    name: Agility Arc
    kind: enterprise-software
    access: >-
      Cloud platform for deploying and managing Digit fleets, reporting fleet metrics and
      connecting Digit to customers' warehouse and manufacturing execution systems.
    url: https://www.agilityrobotics.com/solutions
    source_ids: [agility-solutions, agility-digit5-pr]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Agility assembles Digit at RoboFab, a 70,000-square-foot facility in Salem, Oregon. Its
      Pittsburgh office handles engineering testing, validation, and skills development, and a
      Fremont, California facility opened in July 2026 for hardware and physical AI
      development.
    source_ids: [agility-digit5-pr]
  - text: >-
      Agility says Digit 5 uses AI-based human detection and an independent safety controller
      so that it can stop, avoid people, or sit down when someone comes too close.
    source_ids: [agility-digit5-pr]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Agility's September 2026 press release states that it is headquartered in Salem, Oregon,
    and its SEC filer record and September 2026 Form S-4 filing list Agility Robotics, Inc.,
    a Delaware corporation, at 4698 Truax Drive SE, Salem, Oregon. The pending merger with
    Churchill Capital Corp XI does not change this assessment.
  source_ids: [agility-digit5-pr, sec-agility-company, sec-agility-s4-index]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Agility offers Digit and the Agility Arc platform as commercial products. Its public
    GitHub organization mainly holds infrastructure and build-tooling repositories, plus a
    documentation and software repository for its earlier Cassie robot. This catalog has no record of public AI model
    weights from Agility Robotics.
  source_ids: [agility-solutions, agility-github]
