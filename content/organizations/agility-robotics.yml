slug: agility-robotics
name: Agility Robotics
legal_name:
  text: Agility Robotics, Inc.
  source_ids: [sec-agility-company, agility-home]
website: https://www.agilityrobotics.com
logo_text: AR
summary:
  text: >-
    Agility Robotics builds Digit, a humanoid robot deployed commercially for warehouse,
    manufacturing, and distribution tasks such as tote handling, and Agility Arc, a cloud
    platform for managing Digit fleets. In September 2026 it announced Digit 5, a version
    designed to work close to people with less reliance on protective barriers.
  source_ids: [agility-solutions, agility-digit5-pr]
organization_roles: [robotics, hardware-manufacturer]
ownership_category: privately-held
