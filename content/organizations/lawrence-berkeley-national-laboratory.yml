summary:
  text: >-
    Lawrence Berkeley National Laboratory (Berkeley Lab) is a multiprogram national laboratory in
    Berkeley, California, managed by the University of California for the U.S. Department of
    Energy's Office of Science. It traces its founding to 1931. Berkeley Lab describes work on
    AI models and applications for science, AI-ready scientific datasets such as the Materials
    Project, and the computing and networking infrastructure used to train them.
  source_ids: [lbl-genesis, lbl-uc, lbl-ai, lbl-mp]
  reviewed_at: 2026-10-01
