notable_facts:
  - text: >-
      Berkeley Lab dates its relationship with the University of California to 1931, when Ernest
      O. Lawrence founded the "Rad Lab" on the UC Berkeley campus.
    source_ids: [lbl-uc]
    reviewed_at: 2026-10-01
  - text: >-
      Berkeley Lab's AI page groups its work into AI models, AI applications for scientific
      fields, curated data repositories, and high-performance computing and networking
      infrastructure, with roles for NERSC, ESnet, the Center for Advanced Mathematics for Energy
      Research Applications (CAMERA), and the Joint Genome Institute. It states that a project
      called FORUM-AI will develop an open-source, general-purpose AI platform for materials and
      physical sciences research.
    source_ids: [lbl-ai]
    reviewed_at: 2026-10-01
  - text: >-
      Berkeley Lab launched the Materials Project in 2011 as a public database of computed
      materials properties. The laboratory states that the platform provides standardized
      datasets formatted for training machine-learning models, and the project's documentation
      describes it as a DOE effort to pre-compute properties of inorganic crystals and molecules
      and make the data publicly available.
    source_ids: [lbl-mp, mp-docs]
    reviewed_at: 2026-10-01
  - text: >-
      Berkeley Lab leads Phase 1 projects under DOE's Genesis Mission that apply AI to areas
      including precipitation and water forecasting, autonomous materials discovery, critical
      minerals, and fusion magnet operation.
    source_ids: [lbl-genesis]
    reviewed_at: 2026-10-01
