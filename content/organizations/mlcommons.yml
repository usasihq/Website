notable_facts:
  - text: >-
      MLPerf is a registered trademark of MLCommons, and submitting benchmark results requires a
      signed Contributor License Agreement.
    source_ids: [mlc-benchmarks]
  - text: >-
      Under the MLPerf submission rules, submitting organizations review one another's results
      during a confidential review period before MLCommons publishes all results at once; after
      publication, code and results are free to use under the MLPerf Terms of Use.
    source_ids: [mlperf-submission-rules]
  - text: >-
      The AILuminate benchmarks are developed by the MLCommons AI Risk & Reliability working
      group, which at the v1.0 release included researchers from universities, civil society
      representatives, and engineers from technology companies.
    source_ids: [ailuminate-v1-release]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    MLCommons Association lists a Dover, Delaware address on its About page, and the IRS
    exempt-organization extract for Delaware lists MLCommons Association at that address as a
    501(c)(6) organization. Its members come from many countries; this assessment concerns the
    association itself.
  source_ids: [mlc-about, irs-eo-bmf-de]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Publishes MLPerf reference implementations and the ModelBench benchmarking framework in
    public GitHub repositories under Apache 2.0, plus 1,200-prompt AILuminate demo sets in
    English and French under CC BY 4.0. AILuminate's official test prompts are kept hidden, and
    its full practice prompt sets are offered to MLCommons members.
  source_ids: [mlperf-inference-repo, mlperf-inference-license, modelbench-repo, ailuminate-repo]
