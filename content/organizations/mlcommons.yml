  text: MLCommons Association
  source_ids: [mlc-about, irs-eo-bmf-de]
website: https://mlcommons.org
logo_text: MLC
summary:
  text: >-
    MLCommons is an AI engineering consortium whose members include companies, academics, and
    nonprofits. It develops benchmarks, including the MLPerf performance suites and the
    AILuminate safety and security benchmarks, as well as open datasets and tools such as
    Croissant and MLCube. It launched in December 2020.
  source_ids: [mlc-about, mlc-benchmarks]
