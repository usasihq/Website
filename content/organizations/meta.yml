profile:
  intended_users:
    text: >-
      Meta presents the Meta Model API as self-serve, usage-priced access to
      Muse Spark for developers building agent and multimodal workflows. The
      Muse Glimmer model card targets commercial and research use, including
      agents that run on consumer devices.
    source_ids: [review-model-api, review-glimmer-card]
    reviewed_at: 2026-10-01
  access_overview:
    text: >-
      Muse Spark versions are offered through the Meta Model API, which is in
      public preview; Meta's meta-models Hugging Face organization lists Muse
      Glimmer weights but no Muse Spark weights. Muse Glimmer downloads are not
      gated, while Llama weights are provided after users accept the license
      and their access request is approved.
    source_ids: [review-model-api, review-model-api-docs, review-hf-meta-models, review-glimmer-card, review-llama-models]
    reviewed_at: 2026-10-01
  limitations:
    text: >-
      Licenses differ by release: Muse Glimmer uses Apache 2.0, while Llama
      models use custom Llama licenses with acceptable use policies. The Llama
      4 license requires "Built with Llama" attribution and a separate license
      from Meta for licensees above 700 million monthly active users. This
      profile is not a complete product or rights audit.
    source_ids: [review-glimmer-card, review-llama-models, review-llama4-license]
    reviewed_at: 2026-10-01
  resources:
    - label: Meta Model API overview and pricing
      url: https://dev.meta.ai/products/meta-model-api/
      kind: pricing
      source_ids: [review-model-api]
      reviewed_at: 2026-10-01
    - label: Meta Model API documentation
      url: https://dev.meta.ai/docs/
      kind: documentation
      source_ids: [review-model-api-docs]
      reviewed_at: 2026-10-01
    - label: Muse Glimmer weights on Hugging Face
      url: https://huggingface.co/meta-models/Muse-Glimmer-30B
      kind: model-hub
      source_ids: [review-glimmer-card]
      reviewed_at: 2026-10-01
    - label: Llama models repository
      url: https://github.com/meta-llama/llama-models
      kind: repository
      source_ids: [review-llama-models]
      reviewed_at: 2026-10-01
deep_dive:
  reviewed_at: 2026-10-11
  overview:
    - text: "Meta Platforms, Inc. is a Delaware corporation based in Menlo Park, California. Its Form 10-K
        reports two segments: Family of Apps, which includes Facebook, Instagram, Messenger, Meta
        AI, Threads, and WhatsApp, and Reality Labs, which includes Meta Quest VR devices and AI
        glasses such as Ray-Ban Meta, Oakley Meta, and Meta Ray-Ban Display."
      source_ids:
        - meta-10k-2025
    - text: Meta says its vision is to bring "personal superintelligence" to everyone. In July 2025 it
        said it had set up Meta Superintelligence Labs (MSL), which brings together its foundations,
        product, and FAIR research teams with a new lab building its next models. Meta's leadership
        page says Chief AI Officer Alexandr Wang leads MSL.
      source_ids:
        - personal-superintelligence-letter
        - q2-2025-call-transcript
        - alexandr-wang-bio
    - text: Meta released downloadable Llama models from 2023 to 2025, ending with Llama 4 Scout and Llama
        4 Maverick in April 2025. Since April 2026 its main models come from the Muse family built
        by MSL. Muse Spark versions are offered without public weights, while Muse Glimmer was
        released with open weights under Apache 2.0. Meta says it plans a mix of open and closed
        models.
      source_ids:
        - llama-models-readme
        - muse-spark-announcement
        - muse-glimmer-research-blog
        - meta-10k-2025
        - q2-2026-call-transcript
    - text: People reach Meta's AI through the Meta AI assistant in Meta's apps, a stand-alone app, the
        web, and AI glasses; through Muse, a personal agent launched in September 2026; and, for
        developers, through the Meta Model API, which is in public preview.
      source_ids:
        - meta-10k-2025
        - muse-agent-announcement
        - meta-model-api
    - text: Meta publishes a frontier-risk policy, the Meta Superintelligence Scaling Framework (previously
        titled the Frontier AI Framework; version 2.1, October 2026), and documents gigawatt-scale AI data centers such as Prometheus in Ohio and
        Hyperion in Louisiana, along with its own MTIA chips.
      source_ids:
        - msl-scaling-framework-v2-1
        - new-albany-fact-sheet
        - richland-parish-expansion
        - mtia-four-chips-blog
  sections:
    - id: business-overview
      title: What Meta does
      intro:
        text: Meta builds social and messaging apps, VR devices, and AI glasses, and its 10-K describes AI
          as central to its plan "to deliver personal superintelligence for everyone."
        source_ids:
          - meta-10k-2025
      items:
        - text: The Family of Apps segment covers Facebook, Instagram, Messenger, Meta AI, Threads, and
            WhatsApp. Reality Labs covers Meta Quest VR devices, AI glasses, Meta Ray-Ban Display
            with the Meta Neural Band, and the Orion augmented reality glasses prototype.
          source_ids:
            - meta-10k-2025
        - text: In its 10-K, Meta says it will train "a combination of open and closed models going forward."
            It describes Meta AI as an assistant available across its apps, as a stand-alone app, on
            AI glasses, and on the web.
          source_ids:
            - meta-10k-2025
        - text: "On its July 29, 2026 earnings call, Meta named three areas for AI: improving its core apps
            and ads, building personal agents, and selling to businesses through APIs, business
            agents, and possibly compute."
          source_ids:
            - q2-2026-call-transcript
        - text: On September 28, 2026, Meta announced Meta Enterprise Platform, which it calls the next major pillar of its business,
            and which will offer the Muse agent, Meta Business Agent, the Muse API, and Muse Code to
            companies.
          source_ids:
            - meta-enterprise-platform
        - text: Meta One, announced September 15, 2026, is a subscription service across Instagram, Facebook,
            WhatsApp, and Meta AI that adds more AI image and video creation and other features.
            Meta says Meta AI stays free for everyday use.
          source_ids:
            - meta-one
    - id: ai-organization
      title: How Meta organizes its AI work
      intro:
        text: Meta's safety framework says it has built and shared AI research "through Meta
          Superintelligence Labs, our Fundamental AI Research (FAIR) Lab, and our product teams."
        source_ids:
          - msl-scaling-framework-v2-1
      items:
        - text: Alexandr Wang joined Meta in June 2025 as Chief AI Officer and leads Meta Superintelligence
            Labs, according to Meta's leadership page.
          source_ids:
            - alexandr-wang-bio
            - meta-leadership
        - text: On July 30, 2025, Meta said MSL includes its foundations, product, and FAIR teams plus a new
            lab focused on its next generation of models. At that time Meta said Nat Friedman led AI
            products and applied research and Shengjia Zhao was Chief Scientist for the new effort.
          source_ids:
            - q2-2025-call-transcript
        - text: FAIR, Meta's Fundamental AI Research lab, marked ten years of open research in November 2023.
            Meta credits it with work such as Segment Anything, No Language Left Behind, and the
            Seamless translation models.
          source_ids:
            - fair-decade
        - text: Under Meta's framework, the Chief AI Officer oversees risk evaluation and mitigation,
            supported by a Director of Alignment and Risk who runs risk assessments, preparedness
            reports, and framework updates.
          source_ids:
            - msl-scaling-framework-v2-1
        - text: Meta's leadership page lists Daniel Gross as Co-Lead of Meta Compute, Meta's effort to build
            AI infrastructure, and Santosh Janardhan as Head of Infrastructure.
          source_ids:
            - meta-leadership
            - q2-2026-call-transcript
        - text: Muse Spark's safety report was written by MSL's Preparedness, Red Teaming and Alignment team
            together with Meta's AI Security team.
          source_ids:
            - muse-spark-safety-report
    - id: models
      title: "Models: Muse and Llama"
      intro:
        text: Meta's current models are the Muse family from Meta Superintelligence Labs. Its earlier Llama
          family remains available for download under custom Llama licenses.
        source_ids:
          - muse-spark-blog
          - llama-models-readme
      items:
        - text: Muse Spark, announced April 8, 2026, is the opening model of the Muse family. Meta describes
            it as a natively multimodal reasoning model that supports tool use and multi-agent
            orchestration, with a "Contemplating" mode that runs several agents in parallel.
          source_ids:
            - muse-spark-blog
        - text: Meta followed with Muse Spark 1.1 on July 9, 2026, built for agentic tasks with a
            1-million-token context window; 1.2 on August 5, a coding-focused update; and 1.3 on
            September 2, aimed at long-running agentic and coding work.
          source_ids:
            - muse-spark-1-1-blog
            - muse-code-spark-1-2-blog
            - muse-spark-1-3-blog
        - text: Muse Image, launched July 7, 2026, generates and edits images. Muse Video, previewed the same
            day, generates video with native audio and is still in development.
          source_ids:
            - muse-image-video-blog
        - text: Muse Glimmer, released August 10, 2026, is a 30-billion-parameter model that reads text and
            images, distilled from Muse Spark and built to run agents on a Mac or a single consumer
            GPU. Its weights are published under the Apache 2.0 license.
          source_ids:
            - muse-glimmer-research-blog
            - muse-glimmer-dev-blog
        - text: Muse Voice Transcribe, released September 1, 2026, is a streaming speech recognition model
            that also separates speakers. Meta says it was trained on more than 70 languages, 25 of
            them extensively verified.
          source_ids:
            - muse-voice-transcribe-blog
        - text: The original LLaMA came out on February 24, 2023 in 7B to 65B sizes under a noncommercial
            research license. Llama 2, released July 18, 2023, was free for research and commercial
            use.
          source_ids:
            - llama-1-blog
            - llama-2-announcement
        - text: Meta's Llama repository lists Llama 3 (April 18, 2024), Llama 3.1 with a 405B size (July 23,
            2024), Llama 3.2 with small and vision models (September 25, 2024), Llama 3.3 70B
            (December 4, 2024), and Llama 4 (April 5, 2025).
          source_ids:
            - llama-models-readme
        - text: Llama 4 Scout (17B active parameters, 16 experts, 109B total, 10-million-token context) and
            Llama 4 Maverick (17B active, 128 experts, 400B total) are mixture-of-experts models.
            Meta previewed a larger Llama 4 Behemoth as "still training" and did not release it.
          source_ids:
            - llama4-blog
            - llama-models-readme
        - text: Each Llama generation has its own license and acceptable use policy. The Llama 4 license
            requires "Built with Llama" attribution, and very large services above a size threshold set
            in the license must get a separate license from Meta.
          source_ids:
            - llama-models-readme
            - review-llama4-license
    - id: how-to-use
      title: "How you can use it: apps, agents, and API"
      intro:
        text: Meta AI is offered in Meta's apps, a stand-alone app, on the web at meta.ai, and on AI
          glasses. Muse Spark has powered it since April 2026.
        source_ids:
          - meta-10k-2025
          - muse-spark-announcement
      items:
        - text: Meta launched Meta AI in beta in the US on September 27, 2023, in WhatsApp, Messenger, and
            Instagram. In April 2024 it added the meta.ai website and Meta AI in the search bars of
            Facebook, Instagram, WhatsApp, and Messenger.
          source_ids:
            - meta-ai-launch-2023
            - meta-ai-llama-3
        - text: The stand-alone Meta AI app launched April 29, 2025 on iOS and Android and also became the
            companion app for Meta's AI glasses.
          source_ids:
            - meta-ai-app-launch
        - text: Meta's Muse Spark announcement (April 8, 2026, updated May 12) says the model is coming to
            Meta AI in WhatsApp, Instagram, Facebook, Messenger, and Threads, and to Ray-Ban Meta
            and Oakley Meta glasses in the US and Canada.
          source_ids:
            - muse-spark-announcement
        - text: On July 24, 2026, Meta added agent features to Meta AI, such as connecting to email and
            calendars, daily briefings, recurring tasks, and web research with slides, starting in
            select markets in the Meta AI app and on meta.ai.
          source_ids:
            - meta-ai-acts
        - text: Muse is a personal AI agent announced September 8, 2026. It runs in a dedicated cloud virtual
            machine, can send email, book travel, and fill out forms, and asks before sensitive
            actions. It is offered on iOS, Android, the web at muse.ai, and in WhatsApp.
          source_ids:
            - muse-agent-announcement
            - muse-safety-blog
        - text: Meta's Muse for Small Business post (September 29, updated October 8, 2026) says Muse is
            available in the US and Canada, is free for most needs, and has subscription plans for
            heavier use.
          source_ids:
            - muse-small-business
        - text: The Meta Model API, in public preview, offers Muse Spark 1.1, 1.2, and 1.3, Muse Image, Muse
            Voice Transcribe, and SAM 3.1. Meta says it works with existing OpenAI SDK code.
            "Contributor" model versions let Meta use the data to improve its products.
          source_ids:
            - meta-model-api
            - meta-model-api-models-docs
        - text: Muse Code is a terminal coding agent powered by Muse Spark, released in beta on August 5,
            2026, which runs several worker agents in parallel.
          source_ids:
            - muse-code-spark-1-2-blog
            - muse-code-page
        - text: Meta Business Agent answers customer messages for businesses on WhatsApp and Messenger and is
            expanding to Instagram. Its Business Agent Platform lets larger companies build and
            deploy agents connected to their own systems.
          source_ids:
            - meta-business-agent
        - text: Llama weights are available after accepting the license, from Meta or Hugging Face. Meta's
            developer site, dev.meta.ai, keeps Llama documentation, licenses, use policies, and
            download guides in a Llama section.
          source_ids:
            - llama-models-readme
            - llama-docs-hub
            - meta-dev-site
    - id: glasses-and-wearables
      title: AI glasses and wearables
      intro:
        text: Meta makes AI glasses with EssilorLuxottica. Meta says glasses are the ideal device for
          personal superintelligence because they can stay with a person all day.
        source_ids:
          - ray-ban-meta-2023
          - q2-2026-call-transcript
      items:
        - text: Ray-Ban Stories, made with EssilorLuxottica, launched September 9, 2021. The Ray-Ban Meta
            smart glasses followed on September 27, 2023, with Meta AI built in, in beta in the US.
          source_ids:
            - ray-ban-stories-launch
            - ray-ban-meta-2023
        - text: Oakley Meta HSTN performance AI glasses were announced June 20, 2025. Oakley Meta Vanguard,
            built for high-intensity sports with Garmin and Strava links, was announced September
            17, 2025.
          source_ids:
            - oakley-meta-hstn
            - oakley-meta-vanguard
        - text: Meta Ray-Ban Display, announced September 17, 2025, has a built-in display and comes with the
            Meta Neural Band, an EMG wristband that reads muscle signals to control the glasses.
            Sales began in the US on September 30, 2025.
          source_ids:
            - meta-ray-ban-display-2025
        - text: Meta Glasses, a new line made with EssilorLuxottica, went on sale June 23, 2026 in Meta
            Adventurer, Meta Fury, and Meta Glasses by Kylie styles, with Meta AI powered by Muse
            Spark in the US and Canada.
          source_ids:
            - meta-glasses-launch
        - text: At Connect on September 23, 2026, Meta released Ray-Ban Meta (Gen 3), opened pre-orders for
            Ray-Ban Meta Audio glasses shipping October 13, and said Muse is coming to its AI
            glasses.
          source_ids:
            - ray-ban-meta-audio-announcement
        - text: Meta Ray-Ban Display went on sale in Canada and the UK on September 23, 2026, with France,
            Italy, and Germany set for October 13, and gained new navigation and video-call hologram
            features.
          source_ids:
            - meta-ray-ban-display-2026-features
        - text: Meta also announced Meta VR Glasses, a strapless VR device weighing about 100 grams with a
            Meta AI agent built into its operating system, going on sale in spring 2027, and Muse
            Charm, a pocket-sized device for talking with Muse.
          source_ids:
            - meta-vr-glasses
            - connect-2026-roundup
        - text: Meta said hearing enhancement software, which it describes as FDA-cleared, will launch in the
            US later in 2026 for supported AI glasses, for adults with perceived mild to moderate
            hearing loss.
          source_ids:
            - connect-2026-roundup
    - id: research-and-open-releases
      title: Research releases and open models
      intro:
        text: Meta's research teams publish models, code, and papers, many with downloadable weights, though
          license terms differ by release.
        source_ids:
          - fair-decade
          - msl-scaling-framework-v2-1
      items:
        - text: Segment Anything (SAM), released April 5, 2023 under Apache 2.0, finds and outlines objects in
            images. SAM 3 and SAM 3D followed on November 19, 2025, and SAM 3.1 on March 27, 2026 as
            a more efficient drop-in replacement for video tracking.
          source_ids:
            - sam-1-blog
            - sam-3-newsroom
            - sam-3-1-blog
        - text: DINOv3, released August 14, 2025, is a self-supervised vision model with a 7-billion-parameter
            version, released with training code under a commercial license.
          source_ids:
            - dinov3-blog
        - text: V-JEPA 2, announced June 11, 2025, is a world model trained on video that helps AI agents
            understand and predict the physical world; Meta tested it on robots in its labs.
          source_ids:
            - v-jepa-2-newsroom
        - text: Code World Model (CWM), a code research model, was released with open weights after a
            preparedness report dated September 24, 2025 found it added no frontier risks beyond
            those already in the AI ecosystem.
          source_ids:
            - cwm-preparedness-report
        - text: On July 21, 2026, Meta described how Lawrence Berkeley National Laboratory's SYNAPS-I project,
            part of the US Department of Energy's Genesis Mission, uses SAM 3 and DINOv3.
          source_ids:
            - genesis-mission-blog
        - text: On October 2, 2026, Meta shared six math papers written by researchers working with Muse
            Spark, five of which present answers to previously open questions.
          source_ids:
            - open-research-problems-blog
        - text: PyTorch, which was incubated at Meta, moved to the PyTorch Foundation under the Linux
            Foundation in September 2022.
          source_ids:
            - lf-pytorch-press
        - text: On its July 29, 2026 earnings call, Meta said it expected to "get back to releasing some open
            source models at some point soon"; Muse Glimmer followed in August 2026.
          source_ids:
            - q2-2026-call-transcript
            - muse-glimmer-research-blog
    - id: safety-and-policies
      title: Safety frameworks, terms, and data use
      intro:
        text: Meta's frontier-risk policy began as the Frontier AI Framework on February 3, 2025, was
          renamed the Advanced AI Scaling Framework in April 2026, and is now titled the Meta Superintelligence Scaling Framework, whose version 2.1 is dated
          October 2026.
        source_ids:
          - frontier-ai-framework-announcement
          - advanced-ai-scaling-framework-blog
          - msl-scaling-framework-v2-1
      items:
        - text: "The framework covers catastrophic risks in three areas: chemical and biological weapons,
            cybersecurity, and loss of control. It applies to open-weight, API, and closed
            releases."
          source_ids:
            - msl-scaling-framework-v2-1
            - advanced-ai-scaling-framework-blog
        - text: Meta commits to publish a preparedness report for each frontier release and a "model spec"
            describing intended model behavior. A model counts as frontier if it shows high
            capability in the risk areas or reaches a compute threshold of at least 10^26
            operations.
          source_ids:
            - msl-scaling-framework-v2-1
        - text: Version 2.1 added rules for keeping models contained during training and testing, and more
            discussion of open-weight risks. Meta also said it will set up a new AI committee of its
            Board of Directors to review future framework changes.
          source_ids:
            - msl-scaling-framework-v2-1
            - developing-capable-models-responsibly
        - text: Muse Spark's Safety and Preparedness Report (May 26, 2026) says chemical and biological
            capabilities were likely "high risk" before safeguards, and that after mitigations the
            risk was acceptable for release in Meta AI. It also reports that outside tester Apollo
            Research saw high rates of the model noticing it was being tested.
          source_ids:
            - muse-spark-safety-report
        - text: On August 14, 2026, Meta disclosed that during a contracted cyber test of a pre-release Muse
            Spark 1.1, a setup error let the model reach the internet and alter a real website's
            database. Meta says it is adding independent checks that test environments are isolated.
          source_ids:
            - muse-spark-1-1-cyber-eval-issue
        - text: For Llama developers, Meta released protection tools on April 29, 2025, including Llama Guard
            4, LlamaFirewall, and Llama Prompt Guard 2.
          source_ids:
            - llamacon-2025-blog
        - text: The Meta AIs Terms of Service (effective May 13, 2026) bar people under 13, say Meta may
            review AI conversations by automated or human means, and warn not to rely on outputs.
            The UK, Brazil, and the European Region have separate terms.
          source_ids:
            - meta-ai-terms
        - text: Meta says it trains AI on public posts, licensed data, and people's interactions with its AI,
            but not on private messages with friends and family unless someone shares them with Meta
            AI. In the EU, it trains on adults' public content and offers an objection form.
          source_ids:
            - privacy-matters-genai
            - ai-training-data-transparency
            - eu-ai-training-notice
        - text: Meta said that from December 16, 2025 it would use people's chats with its AI features to
            personalize content and ads in most regions, but would not use chats about sensitive
            topics such as health or religion to show ads.
          source_ids:
            - ai-personalization-notice
        - text: Meta says Muse does not share conversations or virtual machine data with its ad systems, and
            that Muse Image pictures carry an invisible "Content Seal" watermark.
          source_ids:
            - muse-safety-blog
            - muse-image-video-blog
    - id: infrastructure-and-compute
      title: Infrastructure and compute
      intro:
        text: Meta designs and runs its own data centers and listed 32 owned and operated data centers in
          April 2026, with several 1-gigawatt-or-larger sites under construction.
        source_ids:
          - infrastructure-explained-data-centers
          - meta-10k-2025
      items:
        - text: Prometheus is Meta's 1-gigawatt AI cluster at its New Albany, Ohio data center, spread across
            several buildings, tents, and nearby leased facilities and linking tens of thousands of
            GPUs.
          source_ids:
            - new-albany-fact-sheet
            - meta-infra-evolution-2025
            - prometheus-backend-aggregation
        - text: Hyperion is Meta's AI training cluster at its Richland Parish, Louisiana data center, which
            broke ground in December 2024. In July 2026 Meta said it would expand the site to 5 GW;
            an earlier Meta post said Hyperion would begin coming online in 2028.
          source_ids:
            - richland-parish-expansion
            - meta-infra-evolution-2025
        - text: Meta is also building 1-gigawatt sites in El Paso, Texas, through a venture with funds managed
            by BlackRock, expected to start coming online in 2028, and in Sturgeon County, Alberta,
            an AI-optimized site that Meta lists as its 33rd data center.
          source_ids:
            - el-paso-blackrock
            - canada-data-center
        - text: MTIA is Meta's own AI chip family. MTIA 300 is in production for training ranking and
            recommendation models; MTIA 400 has finished lab tests; MTIA 450 and MTIA 500 are
            scheduled for mass deployment in 2027.
          source_ids:
            - mtia-four-chips-blog
        - text: Meta co-develops MTIA chips with Broadcom, co-developed an Arm data center CPU, and buys chips
            from NVIDIA, AMD, and AWS.
          source_ids:
            - compute-power-explained
        - text: On January 9, 2026, Meta announced nuclear energy agreements with Vistra, TerraPower, and Oklo
            that it says will support up to 6.6 GW of new and existing clean energy by 2035,
            including for the Prometheus site.
          source_ids:
            - nuclear-energy-projects
        - text: Meta says data centers are essential for building AI, and that it pays the full cost of the
            energy its sites use and of the new energy and water infrastructure they need.
          source_ids:
            - data-centers-ai-approach
            - richland-parish-expansion
            - new-albany-fact-sheet
    - id: corporate-structure
      title: Corporate structure and governance
      intro:
        text: Meta Platforms, Inc. was incorporated in Delaware in July 2004 and has its principal offices
          at 1 Meta Way, Menlo Park, California.
        source_ids:
          - meta-10k-2025
      items:
        - text: Meta has Class A and Class B common stock. Its 10-K says Class A shares have limited voting
            power relative to Class B, and that the CEO controls a majority of the voting power.
          source_ids:
            - meta-10k-2025
        - text: Mark Zuckerberg is Founder, Chairman and Chief Executive Officer. Dina Powell McCormick,
            formerly a board member, joined as President and Vice Chairman in January 2026 to help
            guide strategy, infrastructure investment, and capital partnerships.
          source_ids:
            - meta-leadership
            - dina-powell-mccormick-announcement
        - text: Meta's AI framework says its Board of Directors oversees product and regulatory compliance,
            and that Meta is building more formal board governance for AI policy.
          source_ids:
            - msl-scaling-framework-v2-1
        - text: In July 2025, Meta said it had made a minority investment in Scale AI, the company Alexandr
            Wang founded before joining Meta.
          source_ids:
            - q2-2025-call-transcript
            - alexandr-wang-bio
        - text: Meta Enterprise Platform is a new division led by Chirantan "CJ" Desai, Chief Enterprise
            Platform Officer, reporting to Mark Zuckerberg.
          source_ids:
            - meta-enterprise-platform
            - meta-leadership
        - text: Meta uses capital partnerships for some data centers; for example, the El Paso campus will be
            owned by a joint venture in which Meta holds a minority stake.
          source_ids:
            - el-paso-blackrock
    - id: recent-updates
      title: Recent updates (July to October 2026)
      items:
        - text: "July 7, 2026: Meta launched Muse Image in the Meta AI app and on meta.ai and previewed Muse
            Video."
          source_ids:
            - muse-image-video-blog
        - text: "July 9, 2026: Meta released Muse Spark 1.1 and opened the Meta Model API in public preview."
          source_ids:
            - muse-spark-1-1-blog
        - text: "July 24, 2026: Meta AI gained planning, calendar, and recurring-task features in select
            markets."
          source_ids:
            - meta-ai-acts
        - text: "July 28, 2026: Meta announced a venture with BlackRock-managed funds to develop a 1-gigawatt
            data center in El Paso, Texas."
          source_ids:
            - el-paso-blackrock
            - q2-2026-call-transcript
        - text: "August 5, 2026: Meta released Muse Code in beta along with Muse Spark 1.2."
          source_ids:
            - muse-code-spark-1-2-blog
        - text: "August 10, 2026: Meta released Muse Glimmer with open weights under Apache 2.0."
          source_ids:
            - muse-glimmer-research-blog
        - text: "August 14, 2026: Meta disclosed a misconfigured third-party cyber test of a pre-release Muse
            Spark 1.1 and the fixes it made."
          source_ids:
            - muse-spark-1-1-cyber-eval-issue
        - text: "September 1 and 2, 2026: Meta released Muse Voice Transcribe and Muse Spark 1.3."
          source_ids:
            - muse-voice-transcribe-blog
            - muse-spark-1-3-blog
        - text: "September 8, 2026: Meta announced Muse, a personal AI agent, followed by Muse for Small
            Business on September 29."
          source_ids:
            - muse-agent-announcement
            - muse-small-business
        - text: "September 23, 2026: At Connect, Meta announced Ray-Ban Meta (Gen 3), Ray-Ban Meta Audio, Meta
            VR Glasses, Muse Charm, and plans to bring Muse to its glasses."
          source_ids:
            - connect-2026-roundup
            - ray-ban-meta-audio-announcement
        - text: "September 28, 2026: Meta launched Meta Enterprise Platform, which it calls the next major pillar
            of its business, to bring its AI products to companies."
          source_ids:
            - meta-enterprise-platform
        - text: "October 2, 2026: Meta published version 2.1 of its Meta Superintelligence Scaling Framework
            (previously the Frontier AI Framework) and said it will establish an AI committee of its
            board."
          source_ids:
            - msl-scaling-framework-v2-1
            - developing-capable-models-responsibly
