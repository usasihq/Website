products:
  - id: meta-ai
    name: Meta AI
    kind: assistant-app
    access: >-
      Assistant offered in Meta's apps, as a stand-alone app, on AI glasses, and on the web at
      meta.ai; Meta states it has been powered by Muse Spark since April 2026.
    url: https://about.fb.com/news/2026/04/introducing-muse-spark-meta-superintelligence-labs/
    source_ids: [meta-10k-2025, muse-spark-announcement, meta-ai-acts]
    last_reviewed: 2026-09-29
  - id: meta-model-api
    name: Meta Model API
    kind: hosted-model-api
    access: >-
      Self-serve, paid developer API in public preview offering Muse Spark 1.1, 1.2, and 1.3 (each
      with a 1,048,576-token context window), Muse Image, Muse Voice Transcribe, and SAM 3.1;
      documented as compatible with the OpenAI SDK. Muse Glimmer is self-hosted and not served on
      the API.
    url: https://dev.meta.ai/products/meta-model-api/
    source_ids: [meta-model-api, muse-spark-1-1-blog, meta-model-api-models-docs]
    last_reviewed: 2026-10-11
  - id: muse-agent
    name: Muse (personal AI agent)
    kind: assistant-app
    access: >-
      Personal agent powered by Muse Spark, announced September 8, 2026 on iOS, Android, the web at
      muse.ai, and in WhatsApp; Meta's September 29, 2026 small-business post says Muse is
      available in the US and Canada. Free for most needs, with optional subscription plans; Meta
      says it is coming to AI glasses.
    url: https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/
    source_ids: [muse-agent-announcement, muse-small-business, ray-ban-meta-audio-announcement]
    last_reviewed: 2026-10-11
  - id: muse-code
    name: Muse Code
    kind: developer-tool
    access: >-
      Terminal coding agent powered by Muse Spark, released in beta on August 5, 2026.
    url: https://dev.meta.ai/products/muse-code/
    source_ids: [muse-code-spark-1-2-blog, muse-code-page]
    last_reviewed: 2026-10-11
notable_facts:
  - text: >-
      Meta attributes the Muse model family to Meta Superintelligence Labs (MSL), led by Chief AI
      Officer Alexandr Wang. Muse Spark, announced April 8, 2026, opened the family and was
      followed by Muse Spark 1.1 (July 9), 1.2 (August 5), and 1.3 (September 2, 2026). MSL is a
      unit within Meta and does not have a separate record in this catalog.
    source_ids: [muse-spark-announcement, muse-spark-blog, muse-spark-1-1-blog, muse-code-spark-1-2-blog, muse-spark-1-3-blog, alexandr-wang-bio]
  - text: >-
      Muse Spark was announced without public weights; Meta said it hopes to open-source future
      versions of the model.
    source_ids: [muse-spark-announcement]
  - text: >-
      Meta released Llama 4 Scout and Llama 4 Maverick on April 5, 2025. As of this review, these
      are the most recent Llama language models listed in Meta's Llama model repository.
    source_ids: [llama4-blog, llama-models-readme]
  - text: >-
      Meta released Muse Glimmer, a 30-billion-parameter open-weight model under the Apache 2.0
      license, in August 2026.
    source_ids: [muse-glimmer-dev-blog]
  - text: >-
      PyTorch, which was incubated at Meta, moved to the newly formed PyTorch Foundation under
      the Linux Foundation in September 2022.
    source_ids: [lf-pytorch-press]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Meta Platforms, Inc. is a Delaware corporation whose principal executive offices are at
    1 Meta Way, Menlo Park, California, per the cover page of its Form 10-K for fiscal year 2025.
  source_ids: [meta-10k-2025]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Meta has published downloadable weights for some models: Llama 4 under the custom Llama 4
    Community License, and Muse Glimmer under Apache 2.0. Its Muse Spark models are offered
    through Meta AI and the Meta Model API without public weights.
  source_ids: [llama4-license, muse-glimmer-model-card, muse-spark-announcement, meta-model-api]
