summary:
  text: >-
    Meta operates social and messaging apps including Facebook, Instagram, WhatsApp, and
    Messenger, along with VR devices and AI glasses. Its Meta Superintelligence Labs builds the
    Muse model family, and Meta has released open-weight Llama and Muse Glimmer models. It offers
    the Meta AI assistant across its apps, the Muse personal agent, and the Meta Model API for
    developers.
  source_ids: [meta-10k-2025, muse-spark-announcement, muse-agent-announcement, meta-model-api, muse-glimmer-research-blog]
