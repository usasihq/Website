notable_facts:
  - text: >-
      Meta attributes the Muse model family to Meta Superintelligence Labs (MSL); Muse Spark,
      announced April 8, 2026, is described as the first model in that family. MSL is a unit
      within Meta and does not have a separate record in this catalog.
    source_ids: [muse-spark-announcement, muse-spark-blog]
  - text: >-
      Muse Spark was announced without public weights; Meta said it hopes to open-source future
      versions of the model.
    source_ids: [muse-spark-announcement]
  - text: >-
      Meta released Llama 4 Scout and Llama 4 Maverick on April 5, 2025. As of this review, these
      are the most recent Llama language models listed in Meta's Llama model repository.
    source_ids: [llama4-blog, llama-models-readme]
  - text: >-
      Meta released Muse Glimmer, a 30-billion-parameter open-weight model under the Apache 2.0
      license, in August 2026.
    source_ids: [muse-glimmer-dev-blog]
  - text: >-
      PyTorch, originally developed by Meta, moved to the newly formed PyTorch Foundation under
      the Linux Foundation in September 2022.
    source_ids: [lf-pytorch-press]
