summary:
  text: >-
    Lightmatter develops silicon photonics for AI infrastructure. Its Passage family covers
    optical interconnects in co-packaged, near-packaged, and on-board form factors, plus a
    photonic interposer reference platform, and its Guide light engine is a laser source for
    co-packaged optics. It says Passage and Guide are available to early-access partners.
  source_ids: [lm-about, lm-products]
  reviewed_at: 2026-10-01
