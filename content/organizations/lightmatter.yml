products:
  - id: passage-l200
    name: Passage L200
    kind: hardware
    access: >-
      3D co-packaged optics that stack a photonic IC beneath the electronic IC so optical I/O can
      be placed across the die surface, in L200 and higher-bandwidth L200X variants; offered
      through design partnerships.
    url: https://lightmatter.co/products/l200/
    source_ids: [lm-l200]
    last_reviewed: 2026-10-01
  - id: passage-l20
    name: Passage L20
    kind: hardware
    access: >-
      Bidirectional optical interconnect modules for near-packaged optics (NPO) and on-board optics
      (OBO), placed on the host board near a switch or accelerator ASIC; specifications are
      available on request.
    url: https://lightmatter.co/products/passage-l20/
    source_ids: [lm-l20]
    last_reviewed: 2026-10-01
  - id: passage-m1000
    name: Passage M1000 evaluation kit
    kind: hardware
    access: >-
      Reference server platform built around the M1000 photonic interposer, on which I/O chiplets
      are 3D-stacked, offered as an evaluation kit on request.
    url: https://lightmatter.co/products/passage-m1000-evk/
    source_ids: [lm-m1000]
    last_reviewed: 2026-10-01
  - id: guide
    name: Guide light engine
    kind: hardware
    access: >-
      Very Large Scale Photonics (VLSP) light engine that integrates laser arrays into a module as
      an external light source for co-packaged optics, with software-defined control and
      telemetry.
    url: https://lightmatter.co/products/guide/
    source_ids: [lm-guide]
    last_reviewed: 2026-10-01
