notable_facts:
  - text: >-
      In November 2025 FutureHouse announced Edison Scientific as a commercial spinout to develop
      and deploy its AI Scientist work for commercial use, with part of the FutureHouse team
      moving to Edison. FutureHouse describes the two as independent organizations with
      separate missions, operations, and governance that share office space.
    reviewed_at: 2026-10-01
    source_ids: [fh-edison-announcement, fh-about]
  - text: >-
      Edison Scientific's February 2026 PaperQA3 announcement describes the open-source PaperQA
      repository as the underlying algorithm of its literature agent. In the repository's
      discussions, maintainers stated in July 2026 that there were no plans to open-source
      PaperQA3.
    reviewed_at: 2026-10-01
    source_ids: [edison-paperqa3, paperqa-discussion-1211]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    FutureHouse describes itself as a 501(c)(3) nonprofit research lab in San Francisco. The IRS
    exempt-organization extract for California lists Future House Inc at a San Francisco address
    with subsection code 03 (501(c)(3)). Its for-profit spinout, Edison Scientific, is a separate
    organization and is not covered by this record.
  source_ids: [fh-about, irs-eo-bmf-ca, irs-eo-info]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    FutureHouse publishes the PaperQA code under Apache 2.0 and the ether0 model weights and
    reward-function code under Apache 2.0, with the ether0 benchmark under CC BY 4.0. The ether0
    training code and full training data are not published. See the PaperQA and ether0 records;
    this catalog does not assess openness for the organization as a whole.
  reviewed_at: 2026-10-01
  source_ids: [paperqa-license, ether0-card, ether0-repo, ether0-license, ether0-benchmark-api]
