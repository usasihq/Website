summary:
  text: >-
    FutureHouse is a 501(c)(3) nonprofit research lab in San Francisco, founded in 2023, that
    builds AI systems intended to automate parts of scientific research, with a focus on
    biology. Its open releases include the PaperQA literature-agent package and the ether0
    chemistry reasoning model.
  reviewed_at: 2026-10-01
  source_ids: [fh-about, fh-edison-announcement, paperqa-repo, ether0-card]
