status_note:
  text: >-
    In November 2025 Nomic announced a new Nomic Platform for what it calls the Built World
    industries (energy, engineering, architecture, and construction). Its homepage now presents
    Nomic as "the domain-specific AI platform for architecture, engineering, and construction
    firms". Neither that announcement nor its September 2026 announcement mentions GPT4All or
    Nomic Embed. GPT4All's latest GitHub release is v3.10.0 (February 2025), and Nomic's news page
    lists no Nomic Embed release after Nomic Embed Multimodal (April 2025).
  source_ids: [nomic-new-platform, nomic-sept-2026, nomic-home, gpt4all-releases, nomic-news]
products:
  - id: nomic-platform
    name: Nomic Platform
    kind: enterprise-software
    access: >-
      Web platform with agents for AEC tasks such as drawing and submittal review, code
      compliance checks, RFI research, and project search. A free tier is available at
      app.nomic.ai, with paid plans and demos.
    url: https://www.nomic.ai/platform
    source_ids: [nomic-platform]
    last_reviewed: 2026-09-29
  - id: nomic-agent-api
    name: Nomic Agent API
    kind: developer-tool
    access: >-
      APIs for parsing drawings and PDFs, extracting structured data, creating multimodal
      embeddings, and managing datasets, for building custom AEC agents.
    url: https://www.nomic.ai/developer
    source_ids: [nomic-developer]
    last_reviewed: 2026-09-29
  - id: nomic-embedding-api
    name: Nomic text embedding API
    kind: hosted-model-api
    access: >-
      Hosted text embedding endpoint documented in the Nomic Atlas docs, serving
      nomic-embed-text-v1, nomic-embed-text-v1.5, and gte-multilingual-base with task-specific
      modes for search, classification, and clustering.
    url: https://docs.nomic.ai/atlas/embeddings-and-retrieval/text-embedding
    source_ids: [nomic-embed-api-docs]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Nomic's research page lists papers on Nomic Embed, Nomic Embed Vision, sparse
      mixture-of-experts text embeddings, the CoRNStack code-retrieval dataset, and GPT4All,
      as well as AEC-Bench, a benchmark for AI agents on architecture, engineering, and
      construction tasks.
    source_ids: [nomic-research]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Nomic's careers page states that its headquarters is in New York City. Its terms of
    service (April 2026) name Nomic, Inc., a Delaware corporation, and apply Delaware law. No
    foreign parent or headquarters was found.
  source_ids: [nomic-careers, nomic-terms]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Nomic has published Nomic Embed text model weights, including nomic-embed-text-v1.5 and
    nomic-embed-text-v2-moe, under Apache 2.0, with training code in its
    Apache-licensed contrastors repository, which also documents access to the
    nomic-embed-text-v1 training data. GPT4All is MIT-licensed. The AEC platform, Agent API,
    and embedding API are hosted services. Openness is assessed per release in this catalog.
  source_ids: [nomic-embed-v2-card, nomic-embed-v15-card, contrastors-repo, gpt4all-license, nomic-platform, nomic-developer]
