summary:
  text: >-
    Nomic is a New York City company that offers what it calls a domain-specific AI platform
    for architecture, engineering, and construction firms, including agents and an Agent API. It has
    also released open-source AI software and models, including the GPT4All desktop application
    and the Nomic Embed embedding models.
  source_ids: [nomic-home, nomic-careers, nomic-research, gpt4all-repo]
