slug: xai
name: xAI (SpaceXAI)
legal_name: null
website: https://x.ai
logo_text: xAI
summary:
  text: >-
    xAI develops the Grok family of AI models and offers them through the Grok assistant
    and a developer API. Since February 2026 it has been a wholly owned subsidiary of
    SpaceX, whose AI segment also includes the X platform and AI computing
    infrastructure.
  source_ids: [spacex-10q-2026q2, grok-home, xai-api-docs]
