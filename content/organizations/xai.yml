status_note:
  text: >-
    On February 2, 2026, SpaceX completed its acquisition of X.AI Holdings Corp. (xAI),
    which became a wholly owned subsidiary; xAI had itself acquired X Holdings Corp. in
    March 2025. SpaceX, a Texas corporation with principal executive offices in Starbase,
    Texas, completed its initial public offering in June 2026 and reports Grok, X, and AI
    infrastructure in its AI segment. In September 2026 xAI's website used the name SpaceXAI; by
    October 2026 its page titles used SpaceXSI while its footer still read SpaceXAI LLC. As of October 11, 2026, its developer
    documentation at docs.x.ai is titled "SpaceXSI Docs", describes itself as the official
    SpaceXSI API documentation, and opens with "Get started with SpaceX Super Intelligence",
    while the company's job board still carried the name SpaceXAI. xAI's model cards for Grok
    4.5, 4.6, and 4.7 (July to September 2026) state that SpaceXAI is a doing-business-as name
    of XAI LLC, and SpaceX's March 2026 draft registration statement defines xAI as X.AI
    Holdings LLC (formerly X.AI Holdings Corp.) together with its subsidiaries. USASI has found
    no official announcement of the SpaceXSI name. On October 12, 2026 USASI added xAI's
    December 22, 2025 GenAI.mil announcement to the government section of this profile.
  source_ids: [spacex-10q-2026q2, xai-joins-spacex, spacexsi-docs-overview, xai-greenhouse-board, xai-grok-4-5-model-card, xai-grok-4-6-model-card, xai-grok-4-7-model-card, spacex-drs-2026-03, xai-news-dow-genai-mil]
products:
  - id: grok
    name: Grok
    kind: assistant-app
    access: >-
      AI assistant on grok.com and in iOS and Android apps; signing in syncs conversations and
      subscriptions. Grok also answers as @grok on X.
    url: https://grok.com/
    source_ids: [grok-home, xai-docs-grok-overview, xai-grok-prompts-repo]
    last_reviewed: 2026-10-11
  - id: xai-api
    name: xAI API
    kind: hosted-model-api
    access: >-
      Developer API for Grok models (text, code, voice, image, and video) authenticated
      with API keys at api.x.ai, with published pricing.
    url: https://docs.x.ai/overview
    source_ids: [xai-api-docs]
    last_reviewed: 2026-09-29
  - id: grok-build
    name: Grok Build
    kind: developer-tool
    access: >-
      Terminal coding agent (launched in early beta on May 25, 2026) with interactive, headless, and Agent
      Client Protocol modes and prebuilt binaries for macOS, Linux, and Windows. xAI released its
      own source code under Apache 2.0 on July 15, 2026. Since August 19, 2026, xAI also uses the
      name Grok Build for in-chat app building on grok.com and the mobile apps.
    url: https://github.com/xai-org/grok-build
    source_ids: [xai-grok-build-repo, xai-news-grok-build-cli, xai-news-grok-build-open-source, xai-news-grok-build-web-mobile]
    last_reviewed: 2026-10-11
  - id: grok-bot
    name: Grok Bot
    kind: developer-tool
    access: >-
      AI "teammates" that run on their own persistent cloud computers, in beta since August 11,
      2026; included with SuperGrok and Cursor plans, with Enterprise and Team Bots versions.
    url: https://x.ai/news/introducing-grok-bot
    source_ids: [xai-news-introducing-grok-bot, xai-news-grok-bot-more-plans, xai-news-grok-bot-enterprise, xai-news-team-bots]
    last_reviewed: 2026-10-11
notable_facts: []
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    X.AI Holdings Corp.'s January 2026 SEC Form D lists its principal place of business at
    1450 Page Mill Road, Palo Alto, California. Since February 2, 2026, xAI has been a
    wholly owned subsidiary of Space Exploration Technologies Corp., a Texas corporation
    with principal executive offices in Starbase, Texas, per SpaceX's Form 10-Q, so both
    the unit and its parent are U.S.-based.
  source_ids: [xai-holdings-form-d-2026, spacex-10q-2026q2]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    xAI's current Grok models are offered as hosted services through the Grok apps and
    the xAI API. xAI has published weights for two earlier models on Hugging Face: Grok-1
    under Apache 2.0 and Grok 2 under a custom xAI Community License. It also publishes the
    Grok Build agent's own source code under Apache 2.0 and its consumer Grok system prompts
    under AGPL-3.0.
  source_ids: [xai-api-docs, hf-xai-org, xai-grok-os, hf-grok-2-license, xai-grok-build-repo, xai-grok-prompts-repo]
