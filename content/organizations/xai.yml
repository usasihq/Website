sectors: [frontier-models, open-models]
status_note:
  text: >-
    On February 2, 2026, SpaceX completed its acquisition of X.AI Holdings Corp. (xAI),
    which became a wholly owned subsidiary; xAI had itself acquired X Holdings Corp. in
    March 2025. SpaceX, a Texas corporation with principal executive offices in Starbase,
    Texas, completed its initial public offering in June 2026 and reports Grok, X, and AI
    infrastructure in its AI segment. xAI's website now uses the name SpaceXAI, and its
    footer reads SpaceXAI LLC. SpaceX has no record in this catalog, so no parent link is
    shown.
  source_ids: [spacex-10q-2026q2, xai-joins-spacex]
products:
  - id: grok
    name: Grok
    kind: assistant-app
    access: >-
      AI assistant used through the grok.com web app after signing in, with iOS and
      Android apps and a Grok account on X.
    url: https://grok.com/
    source_ids: [grok-home, xai-grok-os]
    last_reviewed: 2026-09-29
  - id: xai-api
    name: xAI API
    kind: hosted-model-api
    access: >-
      Developer API for Grok models (text, code, voice, image, and video) authenticated
      with API keys at api.x.ai, with published pricing.
    url: https://docs.x.ai/overview
    source_ids: [xai-api-docs]
    last_reviewed: 2026-09-29
  - id: grok-build
    name: Grok Build
    kind: developer-tool
    access: >-
      Terminal coding agent with prebuilt binaries for macOS, Linux, and Windows; its
      first-party code is published under Apache 2.0 and it authenticates through the
      browser on first launch.
    url: https://github.com/xai-org/grok-build
    source_ids: [xai-grok-build-repo]
    last_reviewed: 2026-09-29
