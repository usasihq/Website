  timeline:
    - date: 2023-03
      text: X.AI Corp. began operations.
      source_ids:
        - spacex-10q-2026q2
    - date: 2023-11-03
      text: xAI announced Grok, powered by Grok-1, in early access in the United States.
      source_ids:
        - xai-news-announcing-grok
    - date: 2024-03-17
      text: xAI published the Grok-1 base model weights and architecture under Apache 2.0.
      source_ids:
        - xai-grok-os
    - date: 2024-03-28
      text: xAI announced Grok-1.5 with a 128,000-token context window.
      source_ids:
        - xai-news-grok-1-5
    - date: 2024-04-12
      text: xAI previewed Grok-1.5V, which added image understanding.
      source_ids:
        - xai-news-grok-1-5v
    - date: 2024-08-13
      text: Grok-2 and Grok-2 mini were released in beta on X.
      source_ids:
        - xai-news-grok-2
    - date: 2024-11
      text: The xAI API launched in public beta.
      source_ids:
        - xai-release-notes
    - date: 2024-12-09
      text: xAI released the Aurora image generation model on X.
      source_ids:
        - xai-news-aurora
    - date: 2024-12-12
      text: xAI made an updated Grok-2 available to everyone on X and added grok-2-1212 to the API.
      source_ids:
        - xai-news-grok-1212
    - date: 2025-02-19
      text: xAI released Grok 3 and Grok 3 mini in beta, with Think mode and DeepSearch.
      source_ids:
        - xai-news-grok-3
    - date: 2025-02-20
      text: xAI published a draft Risk Management Framework.
      source_ids:
        - xai-rmf-draft-2025
    - date: 2025-03-28
      text: xAI acquired X Holdings Corp. and X.AI Corp., which became its wholly owned subsidiaries.
      source_ids:
        - spacex-10q-2026q2
    - date: 2025-07-09
      text: xAI released Grok 4 and Grok 4 Heavy.
      source_ids:
        - xai-news-grok-4
    - date: 2025-07-14
      text: xAI launched xAI for Government and announced a contract with the Department of Defense.
      source_ids:
        - xai-news-government
    - date: 2025-08-20
      text: xAI published its Risk Management Framework and the Grok 4 model card.
      source_ids:
        - xai-rmf-2025-08
        - xai-grok-4-model-card
    - date: 2025-08-22
      text: xAI published Grok 2 weights on Hugging Face.
      source_ids:
        - hf-xai-models-api
        - hf-grok-2-license
    - date: 2025-08-28
      text: xAI released grok-code-fast-1 for agentic coding.
      source_ids:
        - xai-news-grok-code-fast-1
    - date: 2025-09-19
      text: xAI released Grok 4 Fast with a 2-million-token context window.
      source_ids:
        - xai-news-grok-4-fast
    - date: 2025-09-25
      text: GSA announced a OneGov agreement making Grok 4 and Grok 4 Fast available to federal agencies.
      source_ids:
        - gsa-xai-onegov-2025
        - xai-news-onegov
    - date: 2025-11-17
      text: xAI released Grok 4.1 on grok.com, X, and the mobile apps.
      source_ids:
        - xai-news-grok-4-1
    - date: 2025-11-19
      text: xAI launched Grok 4.1 Fast and the Agent Tools API, and announced its Saudi Arabia partnership
        with HUMAIN.
      source_ids:
        - xai-news-grok-4-1-fast
        - xai-news-ksa
    - date: 2025-12-17
      text: xAI launched the Grok Voice Agent API.
      source_ids:
        - xai-news-voice-agent-api
    - date: 2025-12-30
      text: xAI launched Grok Business and Grok Enterprise and updated its Frontier Artificial
        Intelligence Framework.
      source_ids:
        - xai-news-grok-business
        - xai-faif-2025-12
    - date: 2026-01-28
      text: xAI launched the Grok Imagine API for video and image generation.
      source_ids:
        - xai-news-imagine-api
    - date: 2026-02-02
      text: SpaceX completed its acquisition of xAI, which became a wholly owned subsidiary.
      source_ids:
        - xai-joins-spacex
        - spacex-10q-2026q2
    - date: 2026-03
      text: Grok 4.20 and Grok 4.20 Multi-agent went live on the API.
      source_ids:
        - xai-release-notes
    - date: 2026-04-21
      text: Cursor announced a model-training partnership with SpaceX using Colossus.
      source_ids:
        - cursor-spacex-model-training
    - date: 2026-05-06
      text: xAI announced that Anthropic would get access to its Colossus 1 supercomputer.
      source_ids:
        - xai-news-anthropic-compute
    - date: 2026-05-15
      text: xAI retired grok-3, grok-4-0709, the Grok 4 Fast and 4.1 Fast models, and grok-code-fast-1
        from its API.
      source_ids:
        - xai-docs-may-15-retirement
    - date: 2026-05-25
      text: xAI launched Grok Build, a terminal coding agent, in early beta.
      source_ids:
        - xai-news-grok-build-cli
    - date: 2026-06-16
      text: xAI released Grok Imagine Video 1.5 on the API and in the Grok apps.
      source_ids:
        - xai-news-imagine-video-1-5
    - date: 2026-07-16
      text: xAI released Grok 4.5, trained alongside Cursor.
      source_ids:
        - xai-news-grok-4-5
    - date: 2026-08-11
      text: xAI launched Grok Bot in beta.
      source_ids:
        - xai-news-introducing-grok-bot
    - date: 2026-08-12
      text: xAI released Grok 4.6.
      source_ids:
        - xai-news-grok-4-6
    - date: 2026-08-14
      text: SpaceX completed its acquisition of Cursor (Anysphere, Inc.).
      source_ids:
        - spacex-8k-2026-08-14
        - cursor-joining-spacex
    - date: 2026-09-03
      text: xAI made Grok Bot available to enterprises.
      source_ids:
        - xai-news-grok-bot-enterprise
    - date: 2026-09-21
      text: xAI released Grok 4.7 and its model card.
      source_ids:
        - xai-news-grok-4-7
        - xai-grok-4-7-model-card
    - date: 2026-09-28
      text: xAI launched Team Bots in public beta.
      source_ids:
        - xai-news-team-bots
