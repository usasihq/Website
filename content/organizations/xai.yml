eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    X.AI Holdings Corp.'s January 2026 SEC Form D lists its principal place of business at
    1450 Page Mill Road, Palo Alto, California. Since February 2, 2026, xAI has been a
    wholly owned subsidiary of Space Exploration Technologies Corp., a Texas corporation
    with principal executive offices in Starbase, Texas, per SpaceX's Form 10-Q, so both
    the unit and its parent are U.S.-based.
  source_ids: [xai-holdings-form-d-2026, spacex-10q-2026q2]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    xAI's current Grok models are offered as hosted services through the Grok apps and
    the xAI API. xAI has published weights for two earlier models on Hugging Face: Grok-1
    under Apache 2.0 and Grok 2 under a custom xAI Community License.
  source_ids: [xai-api-docs, hf-xai-org, xai-grok-os, hf-grok-2-license]
