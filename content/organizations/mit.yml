notable_facts:
  - text: >-
      MIT records its founding in Boston in 1861 and its move to Cambridge in 1916. Its first
      students were admitted in 1865, four years after its founding charter was approved.
    source_ids: [mit-facts-home, mit-facts-origins]
    reviewed_at: 2026-10-01
  - text: >-
      The MIT HAN Lab lists model compression and quantization, LLM and multimodal models, and
      edge AI among its research areas. It maintains the llm-awq repository for AWQ
      (Activation-aware Weight Quantization) in its mit-han-lab GitHub organization; the MIT
      License in that repository names MIT HAN Lab as copyright holder.
    source_ids: [hanlab-home, awq-repo, awq-license]
    reviewed_at: 2026-10-01
  - text: >-
      The AWQ project page credits researchers from MIT, Tsinghua University, and the MIT-IBM
      Watson AI Lab with the method.
    source_ids: [awq-project]
    reviewed_at: 2026-10-01
