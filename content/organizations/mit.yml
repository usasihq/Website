summary:
  text: >-
    MIT is a university in Cambridge, Massachusetts, incorporated in 1861; its institutional
    policies describe it as independent and privately endowed. Its AI research groups include
    the MIT HAN Lab, which works on efficient AI methods such as model compression and
    quantization and maintains the AWQ code.
  source_ids: [mit-about, mit-policy-description, hanlab-home, awq-repo]
  reviewed_at: 2026-10-01
