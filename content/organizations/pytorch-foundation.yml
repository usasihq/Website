  basis: us-control
  explanation: >-
    The PyTorch Foundation is a directed fund of The Linux Foundation, which approves changes to
    its charter. The Linux Foundation is a U.S. 501(c)(6) nonprofit whose legal postal address is
    in San Francisco, California. The foundation has no separately documented headquarters.
  source_ids: [ptf-charter, lf-about, lf-privacy]
