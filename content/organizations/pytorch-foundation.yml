slug: pytorch-foundation
name: PyTorch Foundation
legal_name: null
website: https://pytorch.org/foundation/
logo_text: PTF
summary:
  text: >-
    The PyTorch Foundation is a directed fund of The Linux Foundation. It supports the PyTorch
    framework and other hosted projects, including vLLM, DeepSpeed, Ray, Helion, and Safetensors.
    It was formed in September 2022, when Meta moved PyTorch to the Linux Foundation.
  source_ids: [ptf-page, ptf-charter, lf-pytorch-press]
