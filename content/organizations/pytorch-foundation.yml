notable_facts:
  - text: >-
      The founding governing board members were AMD, Amazon Web Services, Google Cloud, Meta,
      Microsoft Azure, and NVIDIA.
    source_ids: [lf-pytorch-press]
  - text: >-
      A Governing Board oversees the foundation under its charter. Technical governance of the
      PyTorch project is defined separately by its maintainers and is open to individuals, not
      companies.
    source_ids: [ptf-page, pytorch-governance]
  - text: >-
      The PyTorch code base is established as PyTorch a Series of LF Projects, LLC, and
      foundation members must also be Linux Foundation members.
    source_ids: [ptf-charter]
eligibility:
