ownership_evidence:
  text: OpenAI states that the nonprofit OpenAI Foundation controls OpenAI Group
    PBC. A public benefit corporation is a legal form, not proof of publicly
    traded stock.
  source_ids:
    - review-structure
  reviewed_at: 2026-09-30
profile:
  intended_users:
    text: Developers can use the API; businesses can use hosted ChatGPT plans. The
      gpt-oss repository also supports developers deploying downloadable models.
    source_ids:
      - review-pricing
      - review-gpt-oss
    reviewed_at: 2026-09-30
  access_overview:
    text: Hosted ChatGPT/API offerings coexist with gpt-oss-20b and gpt-oss-120b
      downloads and local inference examples. These releases do not establish
      the terms or availability of other models.
    source_ids:
      - review-pricing
      - review-gpt-oss
    reviewed_at: 2026-09-30
  limitations:
    text: Use the release-specific model card and license. The gpt-oss repository
      requires its Harmony response format; hosted plans have separate
      commercial terms. This profile is not a complete product or rights audit.
    source_ids:
      - review-gpt-oss
      - review-pricing
    reviewed_at: 2026-09-30
  resources:
