deep_dive:
  reviewed_at: 2026-10-11
  overview:
    - text: OpenAI develops AI models and offers them through ChatGPT, the OpenAI API, and Codex, its
        coding agent. Most of its models are available only as hosted services, but it has also
        published some open-weight models, including the gpt-oss series under the Apache 2.0
        license.
      source_ids:
        - chatgpt-use
        - openai-api-docs
        - openai-codex-repo
        - gpt-oss-model-card
    - text: "ChatGPT launched in November 2022. OpenAI's documentation now describes it as \"an AI agent
        that you communicate with in natural language,\" with three modes: Chat for questions and
        drafts, Work for longer tasks that end in files to review, and Codex for software
        development. It runs on the web, in a desktop app for macOS, Windows, and Linux (Linux in
        preview), and in a mobile app, under plans named Free, Go, Plus, Pro, Business, and
        Enterprise and Edu."
      source_ids:
        - nber-how-people-use-chatgpt
        - chatgpt-use
        - chatgpt-quickstart
        - chatgpt-whats-new
        - chatgpt-pricing
    - text: OpenAI's models have moved from GPT-4 through GPT-4o, the o-series reasoning models, and the
        GPT-5 series to the GPT-6 series released in September 2026. In October 2026 its API model
        list opens with GPT-6 Astra, GPT-6.1 Sol, and GPT-6 Luna, and on October 7, 2026 OpenAI said
        it was launching GPT-6 to everyone in ChatGPT across free and paid plans.
      source_ids:
        - arxiv-gpt-4-report
        - oai-api-changelog
        - oai-api-models
        - dsh-gpt-6-october
    - text: OpenAI posts system cards for its launches on its Deployment Safety Hub and rates models under
        its Preparedness Framework, which tracks biological and chemical, cybersecurity, and AI
        self-improvement capabilities. Its GPT-6 Astra system card says the model reached the
        framework's Critical level in cybersecurity, and OpenAI offers its specialized cyber model
        only to approved defenders through a program called Daybreak.
      source_ids:
        - dsh-home
        - oai-preparedness-v2
        - dsh-gpt-6-astra
        - oai-model-gpt-5-6-cyber
    - text: OpenAI's operating company, OpenAI Group PBC, is a Delaware public benefit corporation based
        in San Francisco. After an October 2025 recapitalization that the Delaware and California
        attorneys general did not oppose, the nonprofit keeps control of the PBC and appoints its
        directors. The OpenAI Foundation, a nonprofit, says it controls OpenAI Group PBC.
      source_ids:
        - sec-openai-amazon-ecl
        - de-ag-openai-review
        - ca-ag-openai-mou
        - oaif-christiano
  sections:
    - id: what-openai-does
      title: What OpenAI does
      intro:
        text: OpenAI states its mission as ensuring that artificial general intelligence (AGI) benefits all
          of humanity.
        source_ids:
          - oai-preparedness-v2
          - oaif-home
      items:
        - text: "OpenAI builds AI models and offers them in two main ways: ChatGPT and Codex plans for people
            and organizations, and API access for developers, billed by usage at API rates."
          source_ids:
            - chatgpt-pricing
            - openai-api-docs
        - text: ChatGPT is its assistant for questions, research, writing, files, images, and voice. The same
            app can also take on longer tasks through ChatGPT Work and coding tasks through Codex.
          source_ids:
            - chatgpt-use
        - text: The OpenAI API gives developers hosted models for text, images, speech, transcription, and
            embeddings, plus tools for building AI agents such as the Responses API, the Agents SDK,
            and the Agents API.
          source_ids:
            - oai-api-models-all
            - oai-api-changelog
            - oai-agents-api
        - text: OpenAI publishes some code and model weights openly. The Codex CLI is Apache-2.0 code on
            GitHub, gpt-oss-120b and gpt-oss-20b are Apache 2.0 open-weight models, and its Hugging
            Face page also hosts the gpt-oss-safeguard models and an Apache 2.0-licensed Privacy
            Filter model.
          source_ids:
            - openai-codex-repo
            - gpt-oss-model-card
            - hf-openai
            - hf-privacy-filter
        - text: For organizations it sells Business, Enterprise, and Edu plans, and it has made public-sector
            agreements such as an August 2025 GSA OneGov deal that offered ChatGPT Enterprise to
            participating federal agencies.
          source_ids:
            - chatgpt-pricing
            - gsa-onegov-openai
        - text: OpenAI models are also offered through other clouds. OpenAI's changelog says they became
            available in Amazon Bedrock through an OpenAI-compatible Responses API endpoint on June
            1, 2026.
          source_ids:
            - oai-api-changelog
        - text: "Some models are offered only to approved organizations: GPT-Rosalind for life sciences
            research and GPT-5.6 Cyber for authorized security testing."
          source_ids:
            - oai-api-models
            - dsh-gpt-rosalind-5-5
            - oai-model-gpt-5-6-cyber
    - id: chatgpt
      title: ChatGPT in depth
      intro:
        text: OpenAI describes ChatGPT as "an AI agent that you communicate with in natural language."
          People start with a question, idea, file, or task, add context and tools, then review and
          refine the result.
        source_ids:
          - chatgpt-use
      items:
        - text: ChatGPT has three modes. Chat is for questions, brainstorming, drafting, and summarizing.
            ChatGPT Work is for bigger tasks that end in a result to review, such as a slide deck,
            report, or project plan. Codex is for software work such as debugging, running tests,
            and reviewing pull requests.
          source_ids:
            - chatgpt-use
        - text: ChatGPT can search the web and compare sources. Its deep research feature, described in a
            February 2025 system card, runs multi-step research across web pages, images, and PDFs
            and can analyze data by writing and running Python code. It ran on an early version of
            OpenAI o3 and was available to Pro subscribers at launch.
          source_ids:
            - chatgpt-use
            - dsh-deep-research
        - text: ChatGPT agent, introduced in July 2025, combined deep research with Operator, an earlier tool
            that worked in a remote web browser. It added a terminal for running code and making
            slides or spreadsheets, and could connect to services such as Google Drive.
          source_ids:
            - dsh-chatgpt-agent
        - text: ChatGPT Work, launched in July 2026, gathers context from files and plugins, works toward a
            goal in steps, and produces documents, presentations, spreadsheets, and Sites for
            review. It can run in a managed cloud environment or, from the desktop app, use local
            files, apps, and the browser. Scheduled tasks can repeat or refresh work.
          source_ids:
            - chatgpt-whats-new
            - chatgpt-work-docs
        - text: Dots, rolling out gradually since late September 2026, are always-on agents powered by GPT-6
            Astra. Each runs in the cloud with its own computer and browser, keeps track of ongoing
            responsibilities, and can be reached in ChatGPT, Slack, or Microsoft Teams. The docs
            list them for Pro, Business Premium, and Enterprise plans; on Pro they are limited to
            people over 18 outside the EEA, UK, and Switzerland.
          source_ids:
            - chatgpt-dots-docs
            - chatgpt-whats-new
        - text: Memories carry useful context from earlier chats into later ones and are managed in Settings,
            under Personalization. On macOS, an opt-in feature called Computer History turns
            activity in allowed apps and websites into a searchable timeline and memories; OpenAI
            says it does not include screenshots or audio, and it can be paused or cleared.
          source_ids:
            - chatgpt-memories-docs
            - chatgpt-personalize-docs
        - text: Projects group related chats, files, and instructions. ChatGPT Space, added in late September
            2026, holds Pages that people write and edit together with ChatGPT, along with
            spreadsheets, presentations, Sites, and files that can be shared with collaborators.
          source_ids:
            - chatgpt-projects-docs
            - chatgpt-space-docs
            - chatgpt-whats-new
        - text: ChatGPT Voice is powered by GPT-Live, a voice model that can listen and respond at the same
            time. The GPT-Live system card says GPT-Live-1 is the default voice model on paid plans
            and GPT-Live-1 mini on the free plan. In the desktop app, Voice can start, check on, and
            steer other tasks.
          source_ids:
            - chatgpt-voice-docs
            - dsh-gpt-live
        - text: OpenAI added image generation built into GPT-4o in March 2025, describing it as a different
            approach from its earlier DALL·E models. ChatGPT Images 2.0 followed in April 2026 and
            ChatGPT Images 2.5 in September 2026; OpenAI says Images 2.5 adds C2PA provenance
            metadata and an invisible SynthID watermark.
          source_ids:
            - dsh-4o-image-gen
            - dsh-images-2-0
            - dsh-images-2-5
        - text: Plugins connect ChatGPT and Codex to outside tools such as Google Drive, SharePoint, Slack,
            and GitHub. Developers build them from MCP servers, reusable skills, and optional
            on-screen interfaces, and can submit them to a ChatGPT directory.
          source_ids:
            - chatgpt-use
            - oai-plugins-docs
        - text: Sites, in public beta since June 2026, lets ChatGPT build, host, and share websites, web apps,
            and games. A new Site is visible only to its owner and workspace admins until its access
            is changed. Sites is included with Plus, Pro, Business, Enterprise, and Edu plans.
          source_ids:
            - chatgpt-sites-docs
            - chatgpt-whats-new
        - text: A ChatGPT browser extension for Chrome, Edge, Brave, Opera, and Vivaldi lets the desktop app
            work inside a person's browser. ChatGPT asks before using each new site, and browser
            history access is a separate permission it requests each time.
          source_ids:
            - chatgpt-extension-docs
    - id: plans-and-access
      title: Plans, apps, and data controls
      intro:
        text: OpenAI's pricing documentation lists ChatGPT plans named Free, Go, Plus, Pro, Business, and
          Enterprise and Edu, plus an option to use Codex with an API key.
        source_ids:
          - chatgpt-pricing
      items:
        - text: Free and Go include lighter Codex use with GPT-6 Luna in the desktop app. Plus adds Codex on
            the web, in the CLI, in the IDE extension, and on iOS, along with GPT-6.1 Sol. Pro
            includes everything in Plus with several usage tiers, and Ultrafast mode is offered on
            the highest Pro tier.
          source_ids:
            - chatgpt-pricing
        - text: Business adds a dedicated workspace with admin controls, SAML single sign-on, and multi-factor
            authentication, and the pricing page says Business data is not used for training by
            default. Enterprise and Edu add SCIM, enterprise key management, role-based access
            control, audit logs through the Compliance API, and data retention and residency
            controls.
          source_ids:
            - chatgpt-pricing
        - text: Model choice depends on the plan. In August 2026 GPT-5.6 Luna became the default on Free and
            Go, while Plus and Pro got a slider for how long GPT-5.6 Sol thinks. On October 7, 2026,
            OpenAI said GPT-6 Sol and GPT-6 Luna were launching to everyone in ChatGPT and would
            replace GPT-5.6 Sol and Luna there.
          source_ids:
            - chatgpt-whats-new
            - dsh-gpt-6-october
        - text: For ChatGPT Work and Codex, the model docs list GPT-6 Astra, GPT-6.1 Sol, GPT-6 Sol, and GPT-6
            Luna. GPT-6.1 Sol is rolling out on Plus, Pro, Business, Enterprise, and Edu, and stays
            off for Enterprise and Edu until an admin enables it. GPT-5.5 is scheduled to leave
            ChatGPT, ChatGPT Work, and Codex on October 14, 2026, while remaining in the API.
          source_ids:
            - chatgpt-models-docs
            - chatgpt-pricing
        - text: ChatGPT works on the web at chatgpt.com without installing anything, in a desktop app for
            macOS, Windows, and Linux, and in a mobile app. The Linux app entered preview on August
            11, 2026 for supported Ubuntu, Debian, and Fedora systems.
          source_ids:
            - chatgpt-quickstart
            - chatgpt-whats-new
        - text: On July 9, 2026, the Codex app merged into the ChatGPT desktop app for macOS and Windows.
            OpenAI says the desktop app is available on every plan, including Free.
          source_ids:
            - chatgpt-whats-new
        - text: ChatGPT can be brought into Slack and Microsoft Teams conversations, and app developers can
            offer "Sign in with ChatGPT" so people can use their ChatGPT plan in other apps;
            commercial use of that sign-in was in a limited trial as of DevDay 2026.
          source_ids:
            - chatgpt-whats-new
        - text: In ChatGPT's settings, people can view and revoke shared links under data controls, manage or
            turn off memories under Personalization, and pause, filter, or clear Computer History.
          source_ids:
            - chatgpt-use
            - chatgpt-memories-docs
            - chatgpt-personalize-docs
        - text: For the API, OpenAI says data sent to the API has not been used to train its models by default
            since March 1, 2023. Abuse-monitoring logs are kept for up to 30 days, and approved
            customers can get Zero Data Retention.
          source_ids:
            - oai-your-data
        - text: "OpenAI's developer docs also cover advertising and shopping in ChatGPT: an Ads API for
            advertisers to create and measure ads in ChatGPT, and the Agentic Commerce Protocol,
            which merchants and payment providers use to support checkout inside ChatGPT."
          source_ids:
            - oai-ads-docs
            - oai-commerce-docs
    - id: models-over-time
      title: Models over time
      intro:
        text: OpenAI's API changelog, model list, and deprecations page record when each model arrived and
          when older ones are switched off.
        source_ids:
          - oai-api-changelog
          - oai-api-models-all
          - oai-api-deprecations
      items:
        - text: OpenAI published its GPT-4 Technical Report on March 15, 2023. GPT-3.5 Turbo, GPT-4, and GPT-4
            Turbo are now deprecated, with an API shutdown date of October 23, 2026 and GPT-5.6
            models named as replacements.
          source_ids:
            - arxiv-gpt-4-report
            - oai-api-deprecations
        - text: GPT-4o arrived in the API on May 13, 2024 and GPT-4o mini on July 18, 2024. Both are still
            listed, but the dated gpt-4o-2024-05-13 snapshot shuts down on October 23, 2026, and the
            chatgpt-4o-latest alias was shut down on February 17, 2026.
          source_ids:
            - oai-api-changelog
            - oai-api-models-all
            - oai-api-deprecations
        - text: The o-series reasoning models, which work through a problem before answering, began with
            o1-preview and o1-mini on September 12, 2024, followed by o1 (December 17, 2024),
            o3-mini (January 31, 2025), and o3 and o4-mini (April 16, 2025). o1, o3-mini, and
            o4-mini are scheduled to leave the API on October 23, 2026.
          source_ids:
            - oai-api-changelog
            - oai-api-deprecations
        - text: GPT-4.5 Preview (February 27, 2025) was shut down on July 14, 2025, with GPT-4.1 as its
            replacement. The GPT-4.1 family arrived on April 14, 2025; GPT-4.1 and GPT-4.1 mini are
            still listed, while GPT-4.1 nano shuts down on October 23, 2026.
          source_ids:
            - oai-api-changelog
            - oai-api-deprecations
            - oai-api-models-all
        - text: GPT-5 arrived on August 7, 2025. Its system card describes it in ChatGPT as one system with a
            fast model, a deeper reasoning model, and a router that picks between them, taking over
            from GPT-4o, GPT-4o mini, o3, o4-mini, and o3 Pro.
          source_ids:
            - dsh-gpt-5
            - oai-api-changelog
        - text: "Updates followed quickly: GPT-5.1 Instant and Thinking (November 2025), GPT-5.2 (December 11,
            2025), GPT-5.3 Instant (March 2, 2026), GPT-5.4 and GPT-5.4 Pro with a 1M-token context
            window (March 5, 2026), GPT-5.5 and GPT-5.5 Pro (April 24, 2026), and GPT-5.5 Instant
            (May 5, 2026)."
          source_ids:
            - dsh-gpt-5-1
            - oai-api-changelog
            - dsh-gpt-5-3-instant
            - dsh-gpt-5-5-instant
        - text: GPT-5.6, released on July 9, 2026 after a limited preview in late June, introduced three sizes
            named Sol, Terra, and Luna. The system card describes Sol as the main model, Terra as a
            capable lower-cost option, and Luna as a quicker, more economical option.
          source_ids:
            - dsh-gpt-5-6
            - dsh-gpt-5-6-preview
            - oai-api-changelog
        - text: "The GPT-6 series followed: GPT-6 Astra on September 3, 2026, GPT-6 Sol and GPT-6 Luna on
            September 22, and GPT-6.1 Sol on September 29. The API pages list a 1,050,000-token
            context window and up to 128,000 output tokens for these models, with text and image
            input and text output."
          source_ids:
            - oai-api-changelog
            - oai-model-gpt-6-astra
            - oai-model-gpt-6-1-sol
            - oai-model-gpt-6-sol
        - text: "Two specialized lines require approval: GPT-5.6 Cyber, added on August 7, 2026 for authorized
            vulnerability research through the Daybreak program, and GPT-Rosalind for life sciences
            research, generally available through trusted access from September 8, 2026.
            GPT-Rosalind-5.5 was trained further from GPT-5.5."
          source_ids:
            - oai-model-gpt-5-6-cyber
            - oai-api-changelog
            - dsh-gpt-rosalind-5-5
        - text: Open-weight releases include the Whisper speech recognition models (from September 2022),
            gpt-oss-120b and gpt-oss-20b (August 5, 2025), gpt-oss-safeguard (October 29, 2025), and
            Privacy Filter, a model for finding and masking personal information with 1.5B total
            parameters, about 50M of them active per token.
          source_ids:
            - gh-whisper-model-card
            - gpt-oss-model-card
            - oai-api-changelog
            - hf-privacy-filter
        - text: Image models moved from DALL·E 2 and 3, removed from the API on May 12, 2026, to gpt-image-1
            (April 23, 2025), gpt-image-2 (April 21, 2026), and GPT Image 2.5 Sunburst and Flare
            (September 8, 2026). The Sora 2 video model launched in September 2025; OpenAI's
            deprecations page lists the Videos API and Sora 2 models as shut down on September 24,
            2026.
          source_ids:
            - oai-api-changelog
            - oai-api-deprecations
            - dsh-sora-2
            - oai-your-data
        - text: Audio models include the realtime voice models (including GPT-Realtime-2.1, released July 6,
            2026), GPT-Live 1, and GPT-Transcribe and GPT-Live-Transcribe (July 28, 2026). whisper-1
            and the GPT-4o transcription models are set to shut down on February 26, 2027. The
            text-embedding-3 models (January 25, 2024) and omni-moderation (September 26, 2024) are
            still listed.
          source_ids:
            - oai-api-changelog
            - oai-api-deprecations
            - oai-api-models-all
    - id: codex
      title: Codex
      intro:
        text: OpenAI's Codex README calls Codex CLI "a coding agent from OpenAI that runs locally on your
          computer," and points to Codex in code editors, a desktop app, and Codex Web, a
          cloud-based agent at chatgpt.com/codex.
        source_ids:
          - openai-codex-repo
      items:
        - text: OpenAI launched the Codex CLI on April 16, 2025, alongside o3 and o4-mini. It is open source
            under the Apache-2.0 license, installs by script, npm, or Homebrew, and signs in with a
            ChatGPT plan (Plus, Pro, Business, Edu, or Enterprise) or an API key.
          source_ids:
            - oai-api-changelog
            - openai-codex-repo
        - text: "Codex used its own Codex-specific models for a time: codex-mini-latest (May 15, 2025),
            GPT-5-Codex (September 23, 2025), GPT-5.1-Codex (November 13, 2025), GPT-5.1-Codex-Max
            (December 4, 2025), GPT-5.2-Codex (January 14, 2026), and GPT-5.3-Codex (February 24,
            2026). Most are now deprecated, and GPT-5.3-Codex is set to leave the API on April 1,
            2027."
          source_ids:
            - oai-api-changelog
            - oai-api-deprecations
        - text: Codex now runs OpenAI's general models. Codex CLI 0.161.0, published on October 7, 2026, made
            GPT-6.1 Sol the default model in its bundled catalog.
          source_ids:
            - gh-codex-v0-161-0
            - chatgpt-models-docs
        - text: The Codex desktop app arrived on macOS in early February 2026 and on Windows in early March
            2026. On July 9, 2026 it merged into the ChatGPT desktop app, adding inline diff
            editing, pull request review, and projects that span several repositories.
          source_ids:
            - chatgpt-whats-new
        - text: Through 2026 Codex added plugins (late March), generally available scheduled tasks (March 12),
            browser control and macOS computer use (April), Windows computer use (late May), and
            Remote, which lets people continue desktop work from the mobile app (May).
          source_ids:
            - chatgpt-whats-new
        - text: Codex cloud features include reusable cloud environments and integrations with GitHub, Slack,
            Linear, and GitLab (in beta since August 19, 2026), including automatic code review on
            paid plans.
          source_ids:
            - chatgpt-docs
            - chatgpt-whats-new
            - chatgpt-pricing
        - text: Codex Security reviews pull requests for security problems (research preview from August 6,
            2026), and Codex Security Cloud, announced at DevDay 2026, scans connected repositories
            and prepares patches, also as a research preview.
          source_ids:
            - chatgpt-whats-new
        - text: Codex Micro, launched on July 15, 2026 with Work Louder, is a limited-run physical control
            surface for Codex with status keys, an analog stick, and a dial for adjusting reasoning
            effort.
          source_ids:
            - chatgpt-whats-new
        - text: Codex can use OpenAI models through Amazon Bedrock with AWS-managed sign-in and billing (June
            2026), and developers can build on the Codex harness itself through the Agents API
            (public beta from September 10, 2026).
          source_ids:
            - chatgpt-whats-new
            - oai-agents-api
            - oai-api-changelog
        - text: GPT-5.3-Codex-Spark, a near-instant research-preview model for real-time coding added in
            February 2026, was retired from Codex on September 14, 2026.
          source_ids:
            - chatgpt-whats-new
            - chatgpt-models-docs
    - id: developer-platform
      title: OpenAI API and developer platform
      intro:
        text: The OpenAI API serves hosted models through endpoints such as Responses, Chat Completions,
          Batch, and Realtime. On October 6, 2026 OpenAI cut its usage tiers from five to three,
          named Build, Launch, and Grow.
        source_ids:
          - openai-api-docs
          - oai-model-gpt-6-astra
          - oai-api-changelog
      items:
        - text: The Responses API, released on March 11, 2025, is OpenAI's API "for creating and using agents
            and tools." Built-in tools added since include web search, file search, computer use,
            remote MCP servers, a code interpreter, a hosted shell, skills, and tool search.
          source_ids:
            - oai-api-changelog
            - oai-model-gpt-6-astra
        - text: The Conversations API (August 20, 2025) stores long-running conversations. The older
            Assistants API, introduced on November 6, 2023, shut down on August 26, 2026, with the
            Responses and Conversations APIs as replacements.
          source_ids:
            - oai-api-changelog
            - oai-api-deprecations
        - text: The Agents SDK, released with the Responses API in March 2025 and in TypeScript in June 2025,
            is OpenAI's open-source library for building agents. 2026 updates added sandboxes and a
            built-in open-source harness.
          source_ids:
            - oai-api-changelog
        - text: The Agents API entered public beta on September 10, 2026. It gives applications the Codex
            harness as an OpenAI-managed service with lasting sessions and hosted or self-hosted
            sandboxes; computer use was added on September 29. The docs say it supports data
            residency only in the United States and does not offer Zero Data Retention.
          source_ids:
            - oai-agents-api
            - oai-api-changelog
        - text: The Realtime API for speech-to-speech apps was introduced on October 1, 2024 and became
            generally available on August 28, 2025. GPT-Live 1, a full-duplex voice model, became
            generally available in the API on September 10, 2026.
          source_ids:
            - oai-api-changelog
        - text: The Decisions API, released in beta on October 6, 2026 with gpt-6-luna, turns text and images
            into typed answers.
          source_ids:
            - oai-api-changelog
        - text: Agent Builder and ChatKit arrived at DevDay on October 6, 2025. On June 3, 2026 OpenAI
            announced that Agent Builder, the Evals platform, and reusable prompts will shut down on
            November 30, 2026; ChatKit stays, and the Agents SDK or ChatGPT workspace agents are the
            suggested paths.
          source_ids:
            - oai-api-changelog
            - oai-api-deprecations
        - text: On January 15, 2026 OpenAI announced Open Responses, an open-source specification for building
            interfaces that work with many model providers, based on the Responses API.
          source_ids:
            - oai-api-changelog
        - text: Developers extend ChatGPT and Codex with plugins built on MCP servers. At DevDay 2026 OpenAI
            added Plugin Extensions for sidebar apps, panels, editors, and forms, and MCP Events,
            which let ChatGPT act on updates from an MCP server.
          source_ids:
            - oai-plugins-docs
            - chatgpt-whats-new
        - text: Enterprise controls added over 2025 and 2026 include customer-managed encryption keys (October
            24, 2025), hard spend limits (July 22, 2026), mutual TLS and workload identity
            federation (August 29, 2026), and an in-product flow for HIPAA business associate
            agreements (October 5, 2026).
          source_ids:
            - oai-api-changelog
    - id: safety-and-policies
      title: Research, safety, and policies
      intro:
        text: OpenAI's Deployment Safety Hub collects system cards for its launches, including GPT-5,
          GPT-5.6, GPT-6 Astra, GPT-Live, ChatGPT agent, deep research, Sora 2, and ChatGPT Images.
        source_ids:
          - dsh-home
      items:
        - text: "Version 2 of OpenAI's Preparedness Framework, dated April 15, 2025, tracks three areas:
            biological and chemical, cybersecurity, and AI self-improvement. OpenAI says it will not
            deploy a model that reaches a High capability threshold until the related risks are
            sufficiently reduced, and that reaching a Critical threshold also requires safeguards
            during development."
          source_ids:
            - oai-preparedness-v2
        - text: Under the framework, an internal Safety Advisory Group recommends safeguards, OpenAI
            leadership approves or rejects them, and the board's Safety and Security Committee
            oversees those decisions. Version 2 also lists research areas such as long-range
            autonomy, sandbagging, autonomous replication, undermining safeguards, and nuclear and
            radiological risk. The GPT-6 Astra system card links to this version.
          source_ids:
            - oai-preparedness-v2
            - dsh-gpt-6-astra
        - text: OpenAI treated ChatGPT agent (July 2025) and GPT-5's thinking model as High capability in
            biology and chemistry. It treated GPT-5.5 as High in cybersecurity but below Critical,
            and the GPT-5.6 models as High in both areas; none reached High in AI self-improvement.
          source_ids:
            - dsh-chatgpt-agent
            - dsh-gpt-5
            - dsh-gpt-5-5
            - dsh-gpt-5-6
        - text: The GPT-6 Astra system card (September 3, 2026) says Astra reaches the Critical level in
            cybersecurity and is treated as High in biology and chemistry. A September 29 addendum
            treats GPT-6.1 Sol as Critical in cybersecurity too. Listed safeguards include
            misalignment monitoring on all tool-using requests and real-time misuse monitors.
          source_ids:
            - dsh-gpt-6-astra
            - dsh-gpt-6-1-sol
        - text: "Sensitive capabilities go through approval-based programs: Trusted Access for Cyber, the
            Daybreak Blue and Daybreak Red tiers for security defenders (August 2026), and Trusted
            Access for Biology Research. GPT-Rosalind is offered only to approved customers after a
            review of their mission, governance, and access controls."
          source_ids:
            - dsh-gpt-6-astra
            - oai-api-changelog
            - dsh-gpt-rosalind-5-5
        - text: The Model Spec describes how OpenAI intends its models to behave. Its original version is
            dated May 8, 2024; it has been public-domain (CC0) source on GitHub since February 12,
            2025. Later versions added agent principles (September 12, 2025), an Under-18 Safety
            Mode (December 18, 2025), and clarifications on August 18, 2026.
          source_ids:
            - oai-model-spec-repo
            - oai-model-spec-changelog
            - oai-model-spec-md
        - text: For teens, the Model Spec marks rules for people under 18 with a "U18" badge. The GPT-6 Astra
            card describes expanded under-18 protections, and the Sora 2 card (2025) said parental
            controls were being introduced. OpenAI's API guidance for apps serving minors requires
            following child-protection laws such as COPPA.
          source_ids:
            - oai-model-spec-md
            - dsh-gpt-6-astra
            - dsh-sora-2
            - oai-under-18-api
        - text: An October 27, 2025 addendum covers how ChatGPT handles conversations about mental health,
            emotional reliance, and self-harm. It describes an October 3 update to the default model
            meant to respond with care and point people toward real-world support.
          source_ids:
            - dsh-gpt-5-sensitive
        - text: OpenAI marks generated media with C2PA provenance metadata. Sora 2 videos carried a visible
            moving watermark, and ChatGPT Images 2.5 adds an invisible SynthID watermark in ChatGPT,
            Codex, and the API.
          source_ids:
            - dsh-4o-image-gen
            - dsh-sora-2
            - dsh-images-2-5
        - text: API safety tools include moderation scores in the Responses and Chat Completions APIs (June 4,
            2026) and a Safety Usage Dashboard (June 23, 2026). The open-weight gpt-oss-safeguard
            models, released on October 29, 2025, classify text against safety policies that the
            developer provides.
          source_ids:
            - oai-api-changelog
            - hf-gpt-oss-safeguard-20b
        - text: OpenAI's usage policies and terms apply to developers. Its under-18 guidance adds that apps
            must not process data from children under 13 without Zero Data Retention, and that
            OpenAI may audit organizations and suspend access for repeated or serious noncompliance.
          source_ids:
            - oai-under-18-api
    - id: infrastructure-and-government
      title: Infrastructure, compute, and government work
      intro:
        text: A joint release from OpenAI, Oracle, and SoftBank describes Stargate as OpenAI's AI
          infrastructure platform.
        source_ids:
          - softbank-stargate-five-sites
      items:
        - text: The Stargate Project was announced in Washington, D.C. on January 21, 2025 as a new company to
            build AI infrastructure for OpenAI in the United States, starting in Texas. SoftBank
            holds financial responsibility and OpenAI operational responsibility; SoftBank, OpenAI,
            Oracle, and MGX are the initial equity funders, and Masayoshi Son chairs it.
          source_ids:
            - softbank-stargate-jan-2025
        - text: Initial technology partners named for Stargate were Arm, Microsoft, NVIDIA, Oracle, and
            OpenAI.
          source_ids:
            - softbank-stargate-jan-2025
        - text: "On September 23, 2025 the partners named five more U.S. sites: Shackelford County, Texas;
            Doña Ana County, New Mexico; and a Midwest site, developed by Oracle; and Lordstown,
            Ohio, and Milam County, Texas, developed with SoftBank, with SB Energy supplying power
            infrastructure for Milam County."
          source_ids:
            - softbank-stargate-five-sites
        - text: The same release said the main campus in Abilene, Texas, was running on Oracle Cloud
            Infrastructure with NVIDIA GB200 racks delivered from June 2025, and that the announced
            sites, Abilene, and CoreWeave projects brought Stargate to nearly 7 gigawatts of planned
            capacity.
          source_ids:
            - softbank-stargate-five-sites
        - text: For API customers, OpenAI offers data storage and processing in the United States, Europe, and
            the United Arab Emirates, and storage only in Australia, Canada, Japan, India,
            Singapore, South Korea, and the United Kingdom; regions outside the United States
            require extra approvals.
          source_ids:
            - oai-your-data
        - text: On August 6, 2025 the U.S. General Services Administration announced a OneGov agreement making
            ChatGPT Enterprise available to participating federal agencies for one year at a nominal
            cost, plus training resources; GSA said it supports OMB memoranda M-25-21 and M-25-22.
          source_ids:
            - gsa-onegov-openai
        - text: OpenAI said it previewed GPT-5.6 with the U.S. government and, at the government's request,
            started with a limited preview for a small group of trusted partners on June 26, 2026
            before a wider release.
          source_ids:
            - dsh-gpt-5-6-preview
        - text: GPT-Rosalind has a separate trusted-access path for government applicants working on
            biosecurity, public health, and biodefense.
          source_ids:
            - dsh-gpt-rosalind-5-5
        - text: On October 8, 2026 a White House fact sheet listed OpenAI among eleven industry partners
            committing AI-for-science tools and compute credits to the Genesis Mission Consortium.
          source_ids:
            - wh-genesis-fact-sheet
    - id: corporate-structure
      title: Corporate structure and governance
      intro:
        text: A February 2026 agreement filed with the SEC describes OpenAI Group PBC as "a Delaware public
          benefit corporation" at 1455 3rd Street, San Francisco; it was signed for the company by
          Sarah Friar, Chief Financial Officer.
        source_ids:
          - sec-openai-amazon-ecl
      items:
        - text: OpenAI, Inc. was incorporated in 2015 as a Delaware nonprofit.
          source_ids:
            - de-ag-openai-review
        - text: On October 28, 2025 the Delaware attorney general issued a Statement of No Objection to
            OpenAI's recapitalization. OpenAI had initially proposed ending the nonprofit's
            oversight of its for-profit work, but instead agreed to create a public benefit
            corporation that the nonprofit controls; the nonprofit alone can appoint and remove the
            PBC's directors.
          source_ids:
            - de-ag-openai-review
        - text: The PBC's mission is identical to the nonprofit's, and on safety and security matters its
            directors must consider only the mission. The nonprofit also gets access to the PBC's
            models and APIs.
          source_ids:
            - de-ag-openai-review
        - text: The Safety and Security Committee stays with the nonprofit and can require safety measures "up
            to and including halting the release of models." Its chair sits on the nonprofit board
            but not the PBC board, with rights to observe PBC board meetings.
          source_ids:
            - de-ag-openai-review
        - text: Under an October 27, 2025 memorandum of understanding with the California attorney general,
            the nonprofit and the PBC will keep their headquarters in California.
          source_ids:
            - ca-ag-openai-mou
        - text: The nonprofit now operates as the OpenAI Foundation. It describes itself as a separate
            nonprofit corporation that runs independently for its charitable mission, and says "The
            Foundation controls OpenAI Group PBC."
          source_ids:
            - oaif-come-build
            - oaif-christiano
        - text: "The Foundation lists three initial program areas: life sciences and curing diseases, AI
            resilience, and civil society and philanthropy. It also runs a community grant fund,
            whose 2026 grantees it announced on October 1, 2026."
          source_ids:
            - oaif-home
            - oaif-update-mar-2026
        - text: Bret Taylor chairs both the Foundation and OpenAI Group PBC boards. David Vélez and Robin
            Vince joined both boards on July 21, 2026, and Paul Christiano joined the Foundation
            board and its Safety and Security Committee on September 9, 2026.
          source_ids:
            - oaif-velez-vince
            - oaif-christiano
    - id: recent-updates
      title: Recent updates (July to October 2026)
      items:
        - text: "July 6-10, 2026: OpenAI launched ChatGPT Work. On July 9 it released the GPT-5.6 family (Sol,
            Terra, Luna) and merged the Codex app into the ChatGPT desktop app."
          source_ids:
            - chatgpt-whats-new
            - oai-api-changelog
        - text: "July 8, 2026: OpenAI published the GPT-Live system card. In late July it introduced ChatGPT
            Voice powered by GPT-Live in the desktop app, which can start and steer tasks."
          source_ids:
            - dsh-gpt-live
            - chatgpt-whats-new
        - text: "July 15 and 21, 2026: OpenAI released Codex Micro, a limited-run control surface, and David
            Vélez and Robin Vince joined the boards of the OpenAI Foundation and OpenAI Group PBC."
          source_ids:
            - chatgpt-whats-new
            - oaif-velez-vince
        - text: "August 7-11, 2026: OpenAI added GPT-5.6 Cyber and the Daybreak Blue and Red access tiers for
            approved security defenders, and opened a preview of the ChatGPT desktop app for Linux."
          source_ids:
            - oai-api-changelog
            - chatgpt-whats-new
        - text: "August 26, 2026: The Assistants API shut down, and OpenAI announced that whisper-1 and the
            GPT-4o transcription models will shut down on February 26, 2027."
          source_ids:
            - oai-api-changelog
            - oai-api-deprecations
        - text: "September 3, 2026: OpenAI released GPT-6 Astra and its system card, which says the model
            reaches the Critical level in cybersecurity under the Preparedness Framework."
          source_ids:
            - oai-api-changelog
            - dsh-gpt-6-astra
        - text: "September 8-10, 2026: OpenAI released GPT Image 2.5 Sunburst and Flare, made GPT-Rosalind
            generally available through trusted access, added Paul Christiano to the Foundation
            board (September 9), and opened the Agents API in public beta (September 10)."
          source_ids:
            - oai-api-changelog
            - dsh-images-2-5
            - oaif-christiano
        - text: "September 22-24, 2026: OpenAI released GPT-6 Sol and GPT-6 Luna, and September 24 was the
            listed shutdown date for the Videos API and Sora 2 models."
          source_ids:
            - oai-api-changelog
            - oai-api-deprecations
        - text: "September 29, 2026: At DevDay in San Francisco, OpenAI released GPT-6.1 Sol and announced
            dots, ChatGPT Space, ChatGPT in Slack and Teams, Team Tasks, Plugin Extensions, and
            computer use in the Agents API."
          source_ids:
            - devday-2026
            - oai-api-changelog
            - chatgpt-whats-new
        - text: "October 6-8, 2026: OpenAI released the Decisions API in beta (October 6), began launching
            GPT-6 to everyone in ChatGPT (October 7), and made GPT-6.1 Sol the default in Codex CLI
            0.161.0 (October 7); on October 8 the White House listed OpenAI as a Genesis Mission
            Consortium partner."
          source_ids:
            - oai-api-changelog
            - dsh-gpt-6-october
            - gh-codex-v0-161-0
            - wh-genesis-fact-sheet
        - text: "Scheduled: GPT-5.5 leaves ChatGPT, ChatGPT Work, and Codex on October 14, 2026, and GPT-3.5
            Turbo, GPT-4, GPT-4 Turbo, o1, o3-mini, o4-mini, and gpt-image-1 are set to leave the
            API on October 23, 2026."
          source_ids:
            - chatgpt-models-docs
            - oai-api-deprecations
