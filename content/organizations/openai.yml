  timeline:
    - date: "2015"
      text: OpenAI, Inc. is incorporated as a Delaware nonprofit.
      source_ids:
        - de-ag-openai-review
    - date: 2022-09
      text: OpenAI releases the original Whisper speech recognition models.
      source_ids:
        - gh-whisper-model-card
    - date: 2022-11
      text: OpenAI launches ChatGPT.
      source_ids:
        - nber-how-people-use-chatgpt
    - date: 2023-03-01
      text: OpenAI stops using data sent to its API for model training by default.
      source_ids:
        - oai-your-data
    - date: 2023-03-15
      text: OpenAI publishes the GPT-4 Technical Report.
      source_ids:
        - arxiv-gpt-4-report
    - date: 2023-11-06
      text: At DevDay, OpenAI introduces GPT-4 Turbo in preview, the Assistants API, and DALL·E 3 and
        text-to-speech in the API.
      source_ids:
        - oai-api-changelog
    - date: 2024-05-08
      text: OpenAI publishes the original version of its Model Spec.
      source_ids:
        - oai-model-spec-changelog
    - date: 2024-05-13
      text: GPT-4o becomes available in the API.
      source_ids:
        - oai-api-changelog
    - date: 2024-09-12
      text: OpenAI releases its o1-preview and o1-mini reasoning models.
      source_ids:
        - oai-api-changelog
    - date: 2025-01-21
      text: The Stargate Project, a new company to build AI infrastructure for OpenAI, is announced in
        Washington, D.C.
      source_ids:
        - softbank-stargate-jan-2025
    - date: 2025-03-11
      text: OpenAI releases the Responses API and the Agents SDK.
      source_ids:
        - oai-api-changelog
    - date: 2025-03-25
      text: OpenAI publishes the system card for image generation built into GPT-4o.
      source_ids:
        - dsh-4o-image-gen
    - date: 2025-04-15
      text: OpenAI updates its Preparedness Framework to version 2.
      source_ids:
        - oai-preparedness-v2
    - date: 2025-04-16
      text: OpenAI releases o3 and o4-mini and launches the Codex CLI.
      source_ids:
        - oai-api-changelog
    - date: 2025-07-17
      text: OpenAI publishes the ChatGPT agent system card for its new agent in ChatGPT.
      source_ids:
        - dsh-chatgpt-agent
    - date: 2025-08-05
      text: OpenAI releases the open-weight gpt-oss-120b and gpt-oss-20b models.
      source_ids:
        - gpt-oss-model-card
    - date: 2025-08-06
      text: GSA announces a OneGov agreement offering ChatGPT Enterprise to participating federal
        agencies.
      source_ids:
        - gsa-onegov-openai
    - date: 2025-08-07
      text: OpenAI releases GPT-5 in ChatGPT and the API.
      source_ids:
        - dsh-gpt-5
        - oai-api-changelog
    - date: 2025-09-23
      text: OpenAI, Oracle, and SoftBank name five more U.S. Stargate data center sites.
      source_ids:
        - softbank-stargate-five-sites
    - date: 2025-09-30
      text: OpenAI publishes the system card for Sora 2, its video and audio generation model.
      source_ids:
        - dsh-sora-2
    - date: 2025-10-28
      text: The Delaware attorney general issues a Statement of No Objection to OpenAI's recapitalization
        into a public benefit corporation controlled by the nonprofit.
      source_ids:
        - de-ag-openai-review
    - date: 2025-11-13
      text: GPT-5.1 becomes available in the API.
      source_ids:
        - oai-api-changelog
    - date: 2025-12-11
      text: OpenAI releases GPT-5.2.
      source_ids:
        - oai-api-changelog
    - date: 2025-12-18
      text: A Model Spec update adds an Under-18 Safety Mode.
      source_ids:
        - oai-model-spec-changelog
    - date: 2026-02
      text: OpenAI releases the Codex desktop app for macOS.
      source_ids:
        - chatgpt-whats-new
    - date: 2026-03-05
      text: OpenAI releases GPT-5.4 and GPT-5.4 Pro with a 1M-token context window.
      source_ids:
        - oai-api-changelog
        - dsh-gpt-5-4-thinking
    - date: 2026-03-24
      text: OpenAI announces the deprecation of its Videos API and Sora 2 models, and the OpenAI
        Foundation's board chair publishes an update on the Foundation's plans.
      source_ids:
        - oai-api-deprecations
        - oaif-update-mar-2026
    - date: 2026-04-24
      text: OpenAI releases GPT-5.5 and GPT-5.5 Pro in the API.
      source_ids:
        - oai-api-changelog
    - date: 2026-06-26
      text: OpenAI begins a limited preview of GPT-5.6 for trusted partners at the U.S. government's
        request.
      source_ids:
        - dsh-gpt-5-6-preview
    - date: 2026-07-09
      text: OpenAI releases GPT-5.6 and merges the Codex app into the ChatGPT desktop app, the same week
        it launches ChatGPT Work.
      source_ids:
        - oai-api-changelog
        - chatgpt-whats-new
    - date: 2026-08-26
      text: The Assistants API shuts down.
      source_ids:
        - oai-api-changelog
    - date: 2026-09-03
      text: OpenAI releases GPT-6 Astra, which its system card treats as Critical in cybersecurity.
      source_ids:
        - oai-api-changelog
        - dsh-gpt-6-astra
    - date: 2026-09-09
      text: Paul Christiano joins the OpenAI Foundation board.
      source_ids:
        - oaif-christiano
    - date: 2026-09-24
      text: The listed shutdown date for the Videos API and Sora 2 models arrives.
      source_ids:
        - oai-api-deprecations
        - oai-your-data
    - date: 2026-09-29
      text: OpenAI holds DevDay 2026 in San Francisco and releases GPT-6.1 Sol.
      source_ids:
        - devday-2026
        - oai-api-changelog
    - date: 2026-10-07
      text: OpenAI begins launching GPT-6 Sol and GPT-6 Luna to everyone in ChatGPT.
      source_ids:
        - dsh-gpt-6-october
    - date: 2026-10-08
      text: A White House fact sheet lists OpenAI as an industry partner in the Genesis Mission
        Consortium.
      source_ids:
        - wh-genesis-fact-sheet
