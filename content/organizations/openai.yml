slug: openai
name: OpenAI
legal_name:
  text: OpenAI Group PBC
  source_ids: [ sec-openai-amazon-ecl ]
website: https://openai.com
logo_text: OAI
summary:
  text: >-
    OpenAI develops AI models and offers them through ChatGPT, the OpenAI API,
    and developer tools such as Codex. It has also published open-weight models,
    including the gpt-oss series released under the Apache 2.0 license.
  source_ids: [ openai-dev-home, openai-api-docs, gpt-oss-model-card ]
organization_roles: [ model-developer, research-lab, developer-platform, consumer-products ]
ownership_category: privately-held
legal_form:
  text: >-
    Delaware public benefit corporation (OpenAI Group PBC), controlled by
    OpenAI's nonprofit, which the Delaware attorney general identified in
    October 2025 as OpenAI, Inc., a Delaware nonprofit corporation.
  source_ids: [ sec-openai-amazon-ecl, de-ag-openai-review, ca-ag-openai-mou ]
parent_org_slug: null
parent_relationship: null
headquarters:
  label: San Francisco, California
  country: US
  source_ids: [ sec-openai-amazon-ecl, ca-ag-openai-mou ]
other_locations: []
founded:
  year: 2015
  source_ids: [ de-ag-openai-review ]
sectors: [ frontier-models, open-models, agents ]
status_note:
  text: >-
    In October 2025 the Delaware and California attorneys general said they
    would not object to OpenAI's recapitalization, under which its for-profit
    company became a public benefit corporation that the nonprofit continues to
    control. A February 2026 agreement filed with the SEC identifies the company
    as OpenAI Group PBC, a Delaware public benefit corporation based in San
    Francisco. The OpenAI Foundation, a nonprofit, says it controls OpenAI Group PBC.
  source_ids: [ de-ag-openai-review, ca-ag-openai-mou, sec-openai-amazon-ecl, oaif-christiano ]
products:
  - id: chatgpt
    name: ChatGPT
    kind: assistant-app
    access: >-
      AI assistant with Chat, Work, and Codex modes, available on the web, in a
      desktop app for macOS, Windows, and Linux (Linux in preview), and in a mobile
      app, with a Free plan and paid Go, Plus, Pro, Business, and Enterprise/Edu
      plans, per OpenAI's ChatGPT documentation.
    url: https://learn.chatgpt.com/docs
    source_ids: [ chatgpt-docs, chatgpt-pricing, chatgpt-use, chatgpt-quickstart, chatgpt-whats-new ]
    last_reviewed: 2026-10-11
  - id: openai-api
    name: OpenAI API
    kind: hosted-model-api
    access: >-
      Pay-as-you-go API access to OpenAI's hosted models using API keys,
      including the Responses, Chat Completions, Realtime, and Batch APIs, with the
      Agents API and Decisions API in beta; the older Assistants API shut down on
      August 26, 2026.
    url: https://developers.openai.com/api/docs
    source_ids: [ openai-api-docs, oai-api-changelog, oai-agents-api ]
    last_reviewed: 2026-10-11
  - id: codex-cli
    name: Codex CLI
    kind: developer-tool
    access: >-
      Open-source (Apache 2.0) terminal coding agent; users sign in with a
      ChatGPT plan or use an API key.
    url: https://github.com/openai/codex
    source_ids: [ openai-codex-repo ]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Under commitments recorded by the Delaware attorney general, the nonprofit
      holds sole authority to appoint and remove the public benefit
      corporation's directors.
    source_ids: [ de-ag-openai-review ]
  - text: >-
      OpenAI's memorandum of understanding with the California attorney general
      states that the nonprofit and the public benefit corporation will keep
      their headquarters in California.
    source_ids: [ ca-ag-openai-mou ]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    OpenAI Group PBC lists its address as 1455 3rd Street, San Francisco,
    California, in a February 2026 agreement filed with the SEC, and OpenAI
    committed to the California attorney general to keep its nonprofit and PBC
    headquarters in California. The Delaware attorney general identified its
    nonprofit parent in October 2025 as OpenAI, Inc., a Delaware nonprofit
    corporation.
  source_ids: [ sec-openai-amazon-ecl, ca-ag-openai-mou, de-ag-openai-review ]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    OpenAI offers most of its models only as hosted services through ChatGPT and
    its API. It has published some model weights on Hugging Face, including
    gpt-oss-120b and gpt-oss-20b under Apache 2.0, the gpt-oss-safeguard safety
    models built on them, and the Apache 2.0-licensed Privacy Filter model; those
    releases do not make its other models open.
  source_ids: [ hf-openai, gpt-oss-model-card, openai-api-docs, oai-api-changelog, hf-privacy-filter ]
