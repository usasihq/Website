notable_facts:
  - text: >-
      Under its charter (effective October 6, 2020), a Governing Board manages the directed fund
      and a Technical Advisory Council coordinates among the technical projects; each technical
      project is governed by its own charter. Charter amendments need a two-thirds vote of the
      Governing Board and approval by The Linux Foundation.
    source_ids: [lfai-charter, lfai-governance-docs]
  - text: >-
      The charter requires trademarks relating to the fund or its technical projects to be held
      by LF Projects, LLC.
    source_ids: [lfai-charter]
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    The LF AI & Data Foundation is a directed fund of The Linux Foundation and operates under the
    guidance of its own Governing Board and The Linux Foundation; charter amendments require The
    Linux Foundation's approval. The Linux Foundation is a 501(c)(6) nonprofit whose legal postal
    address is in San Francisco, California. No separate headquarters is documented for the
    fund.
  source_ids: [lfai-charter, lf-about, lf-privacy]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Hosts open-source AI and data projects. ONNX, for example, kept its existing open-source
    license when it joined LF AI in 2019 and is published under the Apache License 2.0.
  source_ids: [lfai-about, lfai-onnx-announcement, onnx-license]
