name: LF AI & Data Foundation
legal_name: null
website: https://lfaidata.foundation
logo_text: LFA
summary:
  text: >-
    The LF AI & Data Foundation is a directed fund of The Linux Foundation that raises and spends
    funds to support open-source artificial intelligence, machine learning, and data projects.
    Its hosted projects include ONNX, which LF AI announced as a graduate-level project in
    November 2019.
  source_ids: [lfai-charter, lfai-about, lfai-onnx-page, lfai-onnx-announcement]
