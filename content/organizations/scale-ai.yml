status_note:
  text: >-
    In June 2025 Scale announced a significant investment from Meta Platforms, Inc. Scale states that Meta holds a
    minority of its outstanding equity and that Scale remains an independent company; founder Alexandr Wang joined
    Meta to work on its AI efforts while remaining a director on Scale's board.
