notable_facts:
  - text: >-
      Google DeepMind's about page says DeepMind was founded in 2010 and Google Brain was started
      in 2011 at X; the two were combined into Google DeepMind, led by CEO Demis Hassabis.
    source_ids: [gdm-about]
  - text: >-
      Alphabet's fiscal 2024 Form 10-K says Alphabet consolidated teams building general AI models
      across Google Research and Google DeepMind in 2024, reporting them within Alphabet-level
      activities, and that the Gemini app team joined Google DeepMind in October 2024.
    source_ids: [alphabet-10k-2024]
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    Google DeepMind lists offices in London and in several U.S. and non-U.S. cities, and the
    official pages reviewed do not name a headquarters. It is assessed under U.S. control because
    Google and Alphabet document it as part of Google: Google's CEO announced it in April 2023 as a
    group combining DeepMind and Google Research's Brain team, and Alphabet's fiscal 2024 Form 10-K
    describes consolidating AI model teams across Google Research and Google DeepMind, with the
    costs reported in Alphabet-level activities. Alphabet Inc. is a Delaware corporation with
    principal executive offices in Mountain View, California, per its fiscal 2025 Form 10-K. This
    catalog did not review which legal entities employ Google DeepMind staff in each country.
  source_ids: [google-blog-gdm-2023, gdm-announcement-2023, alphabet-10k-2024, alphabet-10k-2025, gdm-careers]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Google DeepMind is credited as the author of the Gemma models; the Gemma 4 generation is
    released with downloadable weights under the Apache License 2.0. This catalog has not assessed
    Google DeepMind's other models and does not describe Google DeepMind as open overall.
  source_ids: [gemma-4-model-card, gemma-4-license]
