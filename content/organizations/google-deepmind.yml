profile:
  intended_users:
    text: >-
      Google DeepMind presents Gemma as open models for developers to build on
      and customize. Its models page lists other families, such as Gemini, for
      use through Google's apps and developer tools.
    source_ids: [review-gemma-docs, review-gdm-models]
    reviewed_at: 2026-10-01
  access_overview:
    text: >-
      Gemma weights can be downloaded from Kaggle and Hugging Face and run
      locally or on Google Cloud. Gemini, Veo, Lyria, and other Google DeepMind
      model families are offered through hosted Google products, including the
      Gemini app, Google AI Studio, and Gemini Enterprise Agent Platform.
    source_ids: [review-gemma-docs, review-hf-google, review-gdm-models]
    reviewed_at: 2026-10-01
  limitations:
    text: >-
      Terms differ by Gemma generation: Gemma 4 is released under Apache 2.0,
      while earlier Gemma models and variants such as EmbeddingGemma and
      ShieldGemma fall under the Gemma Terms of Use, which incorporate a
      prohibited use policy. This profile is not a complete product or rights
      audit.
    source_ids: [review-gemma-4-license, review-gemma-4-card, review-gemma-terms]
    reviewed_at: 2026-10-01
