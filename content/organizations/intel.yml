summary:
  text: >-
    Intel designs and manufactures semiconductor products, including CPUs used in PCs and data
    centers. Its AI-related offerings include Intel Gaudi AI accelerators and the open-source
    OpenVINO inference toolkit.
  source_ids: [intel-10k-2025, intel-gaudi-page, intel-openvino-page]
