sectors: [chips]
status_note:
  text: >-
    In August 2025 Intel issued common stock and a warrant to the U.S. Department of Commerce
    under an agreement tied to accelerated CHIPS Act grant disbursements and Secure Enclave
    program funding. It also sold common stock in private placements to SoftBank Group
    (completed September 2025) and NVIDIA (completed December 2025), and in September 2025
    completed the sale of 51% of Altera.
  source_ids: [intel-10q-q3-2025, intel-8k-2025-12-26]
products:
  - id: gaudi-3
    name: Intel Gaudi 3 AI accelerator
    kind: hardware
    access: >-
      AI accelerator offered as a PCIe card, OAM mezzanine card, and baseboard, available in
      systems from server makers such as Dell, HPE, and Supermicro and through cloud providers;
      supported by Intel Gaudi software with PyTorch integration.
    url: https://www.intel.com/content/www/us/en/products/details/processors/ai-accelerators/gaudi.html
    source_ids: [intel-gaudi-page]
    last_reviewed: 2026-09-29
  - id: openvino
    name: OpenVINO toolkit
    kind: developer-tool
    access: >-
      Open-source toolkit, available as a free download and on GitHub, for converting models
      from frameworks such as PyTorch and TensorFlow and deploying inference across Intel
      hardware on-premises, on devices, and in the cloud.
    url: https://www.intel.com/content/www/us/en/developer/tools/openvino-toolkit/overview.html
    source_ids: [intel-openvino-page]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      In February 2026 SambaNova announced a planned multi-year strategic collaboration with
      Intel covering AI cloud and AI infrastructure, and said Intel plans to make a strategic
      investment in SambaNova.
    source_ids: [sambanova-intel-2026-02]
eligibility:
