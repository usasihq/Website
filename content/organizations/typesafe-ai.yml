      kind: repository
      source_ids: [ ts-github-org ]
      reviewed_at: 2026-10-01
    - label: TypeSafe datasets on Hugging Face
      url: https://huggingface.co/typesafe
      kind: model-hub
      source_ids: [ ts-hf-org ]
