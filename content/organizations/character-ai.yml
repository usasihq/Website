    kind: assistant-app
    access: >-
      Chat app for text and voice conversations with AI characters and for creating
      characters; the iPhone app is rated 18+ and is free with optional paid subscriptions.
    url: https://apps.apple.com/us/app/character-ai-chat-talk-text/id1671705818
    source_ids: [cai-app-store-us]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      In its 2024 announcement Character.AI said it would make greater use of third-party LLMs
      alongside its own models and focus its resources on post-training and product work.
    source_ids: [cai-next-phase-2024]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The headquarters label rests on the EU trader information shown on the Ireland App Store
    listing for the Character.AI app, in which Character Technologies, Inc. identifies itself
    as a trader and gives an address at 301 High St, Palo Alto, California, United States; the
    listing does not describe this address as a headquarters. The 2024 agreement with Google was a non-exclusive license and hiring
    arrangement, not a transfer of ownership, and the September 2026 Character.AI and Disney
    announcements describe team members moving to Disney without describing an acquisition, so
    eligibility rests on the company's own U.S. location. Character.AI's main website blocks
    automated access, so its terms could not be read for this review.
  source_ids: [cai-app-store-ie, cai-next-phase-2024, cai-next-chapter-2026, disney-cto-2026]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Character.AI's models are used inside its hosted app, and its September 2026 post on
    CAI-Image does not describe a weights release. Its GitHub organization publishes some code,
    including the Ovi audio-video generation project (Apache-2.0 repository, built by
    Character AI and Yale researchers, with its video branch initialized from Wan2.2).
  source_ids: [cai-image-models, cai-ovi-repo, cai-ovi-license]
