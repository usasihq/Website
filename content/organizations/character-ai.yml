website: https://character.ai
logo_text: CAI
summary:
  text: >-
    Character.AI runs a consumer chat app in which people talk by text or voice with AI
    characters created by users. It post-trains open models from other developers for its
    product, including CAI-Image, a family of image models post-trained from Qwen-Image.
  source_ids: [cai-app-store-us, cai-image-models, cai-next-phase-2024]
