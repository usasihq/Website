status_note:
  text: >-
    In August 2024 Character.AI entered into an agreement with Google under which it gave
    Google a non-exclusive license to its then-current LLM technology, and its two co-founders
    and certain members of its research team joined Google; Character.AI said most of its team
    would remain to build its product. The announcement describes a license and hiring
    arrangement, not an acquisition. In September 2026 Character.AI and Disney announced that
    members of Character.AI's technical team are expected to join Disney; neither announcement
    describes an acquisition, and Character.AI said its app remains live.
  source_ids: [cai-next-phase-2024, cai-next-chapter-2026, disney-cto-2026]
