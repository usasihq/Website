summary:
  text: >-
    Block is a publicly traded company that operates Square, a network for businesses, and
    Cash App, a consumer network, combining commerce, financial-services, software, and hardware
    products. Its Open Source Program Office created the goose AI agent, which Block contributed
    to the Agentic AI Foundation; it also describes AI features in its own products, including
    Managerbot for Square sellers and Moneybot in Cash App.
  source_ids: [block-10k-2025, block-goose-launch, block-aaif-post, block-ai]
  reviewed_at: 2026-10-01
organization_roles: [consumer-products, enterprise-software]
ownership_category: publicly-traded
