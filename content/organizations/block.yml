products:
  - id: managerbot
    name: Managerbot
    kind: enterprise-software
    access: >-
      AI business-management feature for Square sellers that monitors sales, labor, inventory,
      and other operations and proposes actions for the seller to review and approve. Use is
      subject to Square's AI terms of service.
    url: https://squareup.com/us/en/the-bottom-line/inside-square/managerbot-ai-business-manager
    source_ids: [square-managerbot, block-ai, square-ai-terms]
    last_reviewed: 2026-10-01
  - id: moneybot
    name: Moneybot
    kind: assistant-app
    access: >-
      AI assistant inside the Cash App mobile app that answers questions about a customer's
      balances, transactions, and spending. Cash App's November 2025 announcement described an
      initial pilot with selected customers.
    url: https://cash.app/press/cash-releases-see-whats-new
    source_ids: [cashapp-moneybot, block-ai]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      Block's 10-K states that the company has adopted a distributed work model and has no
      formal headquarters; the Oakland address is the principal executive office it identifies
      under SEC rules. The June 30, 2026 Form 10-Q repeats this.
    source_ids: [block-10k-2025, block-10q-2026q2]
    reviewed_at: 2026-10-01
  - text: >-
      Block's Open Source Program Office announced codename goose on January 28, 2025, releasing
      it under the Apache License 2.0. In December 2025 Block co-founded the Agentic AI
      Foundation with Anthropic and OpenAI and contributed goose to it; the goose repository
      moved from Block's GitHub organization to aaif-goose in April 2026.
    source_ids: [block-goose-launch, block-aaif-post, block-ai, goose-moves-aaif]
    reviewed_at: 2026-10-01
  - text: >-
      Block's AI page also describes Buzz and Berd as open-source workspaces for working with AI
      agents, and Builderbot as a system that coordinates software agents in Block's own
      development workflow.
    source_ids: [block-ai, block-github]
    reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Block's Form 10-K for fiscal 2025 lists its principal executive offices at 1955 Broadway,
    Suite 600, Oakland, California, and its state of incorporation as Delaware; its Form 10-Q
    for the quarter ended June 30, 2026 gives the same. The filings note that Block has no
    formal headquarters because of its distributed work model; under this catalog's policy a
    documented U.S. principal executive office satisfies the us-headquarters basis.
  source_ids: [block-10k-2025, block-10q-2026q2]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    Block publishes open-source software, including the agent workspaces Buzz and Berd; goose,
    which Block created under the Apache License 2.0, is now stewarded by the Agentic AI
    Foundation. Managerbot and Moneybot are hosted features of Square and Cash App under those
    products' terms. This catalog has no record of model weights published by Block.
  source_ids: [block-ai, block-github, goose-license, square-ai-terms, cashapp-terms]
  reviewed_at: 2026-10-01
profile:
  intended_users:
    text: >-
      Managerbot is aimed at Square sellers and Moneybot at Cash App customers; Block presents
      Buzz, Berd, and goose as tools for builders working with AI agents.
    source_ids: [block-ai]
    reviewed_at: 2026-10-01
  access_overview:
    text: >-
      Block's AI features are delivered inside the hosted Square and Cash App services. Its
      open-source agent projects are published as public repositories; goose is now maintained
      under the Agentic AI Foundation rather than by Block alone.
    source_ids: [block-ai, block-github, goose-moves-aaif]
    reviewed_at: 2026-10-01
  limitations:
    text: >-
      Square's AI terms say outputs may be inaccurate and should be validated by a person, and
      that inputs may be shared with third-party technology providers. Cash App's terms say its
      AI-powered features do not provide financial, legal, investment, or tax advice. This
      profile is not a complete product or rights audit.
    source_ids: [square-ai-terms, cashapp-terms]
    reviewed_at: 2026-10-01
  resources:
    - label: Block open-source repositories
      url: https://github.com/block
      kind: repository
      source_ids: [block-github]
      reviewed_at: 2026-10-01
    - label: Square AI Terms of Service
      url: https://squareup.com/us/en/legal/general/sq-generativeai-terms
      kind: documentation
      source_ids: [square-ai-terms]
      reviewed_at: 2026-10-01
