summary:
  text: >-
    Waymo develops the Waymo Driver, an autonomous driving system, and runs a public, fully
    autonomous ride-hailing service in U.S. cities. It began as Google's self-driving car
    project in 2009, became a separate company under Alphabet in 2016, and is reported by
    Alphabet within its Other Bets.
  source_ids: [waymo-about, waymo-faq, alphabet-ar-2025]
