notable_facts:
  - text: >-
      In December 2025 Waymo described the Waymo Foundation Model, which combines a sensor
      fusion encoder, a driving vision-language model trained using Gemini and fine-tuned on
      Waymo driving data, and a world decoder, and which underlies its Driver, simulator, and
      evaluation "Critic" models. The post does not describe a public release.
    source_ids: [waymo-safe-ai]
  - text: >-
      Waymo publishes the Waymo Open Dataset, first released in August 2019, and a research
      page listing its publications.
    source_ids: [waymo-open-2019, waymo-research]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Waymo's terms of service identify Waymo LLC as located at 1600 Amphitheater Parkway,
    Mountain View, California. Parent assessment: Alphabet's fiscal 2025 annual report (Form
    10-K) describes Waymo as "our fully autonomous driving technology company" within Other
    Bets and calls it a consolidated variable interest entity, adding that outside investments
    in Waymo's February 2026 round will be recorded as noncontrolling interests. Waymo's own
    announcement of that round calls Alphabet its majority investor, and Waymo's about page
    says it was established under Alphabet in 2016. On that basis this record treats Waymo as
    a subsidiary that Alphabet consolidates and majority-funds, with outside minority
    investors, not as a wholly owned unit. The parent record "google" covers Alphabet Inc. and
    Google together; Waymo sits under Alphabet (Other Bets), not within Google's segments.
    Waymo is not named in Alphabet's Exhibit 21, which lists only significant subsidiaries.
  source_ids: [waymo-terms, alphabet-ar-2025, waymo-2026-round, waymo-about, alphabet-10k-2025-ex21]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Waymo publishes the Waymo Open Dataset and the Waymax simulator free of charge under
    custom non-commercial licenses, with most of the dataset's tooling code under Apache 2.0.
    Its driving models, including the Waymo Foundation Model, are not described as publicly
    released, and this catalog has no record of public model weights from Waymo.
  source_ids: [wod-terms, wod-license-file, waymax-license, waymo-safe-ai]
