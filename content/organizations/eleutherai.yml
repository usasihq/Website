slug: eleutherai
name: EleutherAI
legal_name:
  text: EleutherAI Institute (listed in the IRS exempt-organization extract as "ELEUTHERAI INSTITUTE")
  source_ids: [irs-eo-bmf-dc, eleuther-year-two]
website: https://www.eleuther.ai
logo_text: EAI
summary:
  text: >-
    EleutherAI is a non-profit AI research lab that trains and releases open models,
    datasets, and tools, and studies how models learn, how to evaluate them, and how to make
    open-weight systems safer. It began in July 2020 as a Discord community and incorporated
    as a non-profit research institute in early 2023.
  source_ids: [eleuther-about]
organization_roles: [research-lab, nonprofit-research, model-developer, open-source-steward]
ownership_category: nonprofit
legal_form:
  text: >-
    Corporation recognized by the IRS as tax-exempt under Section 501(c)(3), with a ruling
    date of November 2023; the IRS extract classifies it as a publicly supported organization
    under section 170(b)(1)(A)(vi).
  source_ids: [irs-eo-bmf-dc, irs-eo-info]
