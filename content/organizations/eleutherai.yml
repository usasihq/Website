notable_facts:
  - text: >-
      EleutherAI says it works mainly through a public Discord server that does not sharply
      separate employees, volunteers, and collaborators from other institutions.
    source_ids: [eleuther-about]
  - text: >-
      EleutherAI announced in March 2023 that it was forming a non-profit research institute
      funded by charitable donations and grants.
    source_ids: [eleuther-year-two]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    EleutherAI states that it incorporated as a non-profit research institute in early 2023.
    The IRS exempt-organization extract for the District of Columbia lists EleutherAI
    Institute in Washington, D.C., as a 501(c)(3) organization with a November 2023 ruling
    date. EleutherAI's own pages do not state a location, so the Washington, D.C. location
    comes from IRS data. The executive director named in the organization's Form 990 data (as
    compiled by ProPublica) matches the executive director on EleutherAI's staff page, which
    links the IRS entity to EleutherAI.
  source_ids: [eleuther-about, irs-eo-bmf-dc, propublica-eleutherai, eleuther-staff]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    EleutherAI lists openly licensed training corpora (the Common Pile), the GPT-NeoX training
    framework, and model suites such as Pythia, released with checkpoints and data order, among
    its work. This catalog assesses openness per artifact; it currently records the LM
    Evaluation Harness.
  source_ids: [eleuther-about]
