summary:
  text: >-
    FAR.AI is a nonprofit that works on AI safety and security through in-house research,
    grantmaking, and events such as workshops and seminars. It also runs FAR.Labs, a coworking
    space in downtown Berkeley, California, for people and organizations working on trustworthy
    and secure AI.
  source_ids: [ far-about, far-home, far-programs ]
  reviewed_at: 2026-10-02
organization_roles: [ research-lab, nonprofit-research ]
ownership_category: nonprofit
ownership_evidence:
  text: >-
    FAR.AI's transparency page says it incorporated in October 2022 as a 501(c)(3) research
    nonprofit, after operating for most of 2022 as a fiscally sponsored project of Players
    Philanthropy Fund.
  source_ids: [ far-transparency ]
  reviewed_at: 2026-10-02
legal_form:
