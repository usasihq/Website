notable_facts:
  - text: >-
      FAR.AI lists research across AI alignment, model robustness, model evaluations, and AI
      safety and security, including work on adversarial attacks against layered LLM safeguard
      pipelines and on detecting deception with probes.
    source_ids: [ far-home ]
    reviewed_at: 2026-10-02
  - text: >-
      FAR.Labs offers visitors free use of its Berkeley space for up to four weeks, with longer
      memberships priced at operating cost.
    source_ids: [ far-programs ]
    reviewed_at: 2026-10-02
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    FAR.AI's privacy policy says the site is operated by FAR AI, Inc., a 501(c)(3) AI safety
    research nonprofit at 501 W Broadway, Suite 1540, San Diego, California. The IRS
    exempt-organization extract for California lists FAR AI Inc at that address as a Section
    501(c)(3) organization, under EIN 92-0692207, the EIN FAR.AI gives on its transparency page.
    FAR.AI's programs page places its FAR.Labs space in Berkeley, California. Neither page reviewed
    calls one city its headquarters; this record uses the legal address of record.
  source_ids: [ far-privacy, irs-eo-bmf-ca, far-transparency, far-programs ]
  assessed_at: 2026-10-02
openness_summary:
  text: >-
    FAR.AI publishes research on its website and maintains public research code on GitHub under
    the AlignmentResearch organization. This catalog has not assessed any FAR.AI artifact
    separately.
