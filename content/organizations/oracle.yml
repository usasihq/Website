status_note:
  text: >-
    In September 2025 Clayton M. Magouyrk and Michael D. Sicilia were promoted to Chief
    Executive Officer, succeeding Safra A. Catz, who had been CEO since September 2014 and
    became Executive Vice Chair of the Board. The announcement identified Lawrence J. Ellison
    as Chairman of the Board and Chief Technology Officer.
  source_ids: [oracle-8k-2025-09-22, oracle-ceo-release-2025-09-22, oracle-10k-fy2025]
products:
  - id: oci-ai-infrastructure
    name: OCI AI Infrastructure
    kind: compute-service
    access: >-
      GPU bare-metal and virtual machine instances with cluster networking, including OCI
      Supercluster configurations with NVIDIA GPUs and instances with AMD Instinct GPUs,
      available across Oracle's cloud regions.
    url: https://www.oracle.com/ai-infrastructure/
    source_ids: [oracle-ai-infra-page]
    last_reviewed: 2026-09-29
  - id: oci-generative-ai
    name: OCI Generative AI
    kind: inference-service
    access: >-
      Fully managed OCI service offering hosted pretrained models, custom model hosting on
      dedicated AI clusters, and agent tooling, accessed through the OCI Console, API, CLI, or
      OpenAI-compatible APIs.
    url: https://docs.oracle.com/en-us/iaas/Content/generative-ai/overview.htm
    source_ids: [oracle-genai-docs]
    last_reviewed: 2026-09-29
