summary:
  text: >-
    Oracle sells database and enterprise software and operates Oracle Cloud, made up of Oracle
    Cloud Applications and Oracle Cloud Infrastructure (OCI). OCI compute includes GPU-based
    and bare-metal offerings for AI model training and inference, and OCI Generative AI is a
    managed service for building generative AI applications.
  source_ids: [oracle-10k-fy2026, oracle-genai-docs]
