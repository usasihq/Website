logo_text: IM
summary:
  text: >-
    Imbue is a San Francisco company, founded in 2021, that builds software tools meant to keep AI
    agents under their users' control, with a focus on coding agents. Its products include
    Sculptor, a workspace for running coding agents in parallel; Vet, a tool that checks code
    changes and agent conversations for problems; and mngr, a command-line tool for managing
    coding agents. Most of its products are published as open source.
  source_ids: [ imbue-about, imbue-products, imbue-careers ]
  reviewed_at: 2026-10-02
