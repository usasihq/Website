products:
  - id: sculptor
    name: Sculptor
    kind: developer-tool
    access: >-
      Desktop application for Apple Silicon Macs and Linux that provides a workspace for running
      several coding agents in parallel, with agents pushing to a local git remote; open source
      under the MIT License.
    url: https://imbue.com/product/sculptor
    source_ids: [ imbue-sculptor-page, imbue-github ]
    last_reviewed: 2026-10-02
  - id: vet
    name: Vet
    kind: developer-tool
    access: >-
      Command-line tool, agent skill, and GitHub Action that uses a language model chosen by the
      user to review code changes and coding-agent conversations; installed from PyPI and
      licensed under the AGPL-3.0. See the Vet catalog record.
    url: https://imbue.com/product/vet
    source_ids: [ imbue-vet-page, vet-repo ]
    last_reviewed: 2026-10-02
  - id: mngr
    name: mngr
    kind: developer-tool
    access: >-
      Free, MIT-licensed command-line tool for running and managing coding agents in parallel on
      the local machine or on remote hosts, containers, and sandboxes, using SSH, git, and tmux;
      users pay their own inference and compute costs.
    url: https://imbue.com/product/mngr
    source_ids: [ imbue-mngr-page, imbue-github ]
    last_reviewed: 2026-10-02
