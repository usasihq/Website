eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Imbue's website terms (last updated July 6, 2026) and privacy notice name Imbue, Inc., choose
    California law, and place jurisdiction in the state and federal courts in San Francisco. Its
    careers page describes in-person roles at "our office in San Francisco" alongside remote
    roles, and its job postings are located in San Francisco. The pages reviewed do not give a
    street address or state of incorporation.
  source_ids: [ imbue-website-terms, imbue-website-privacy, imbue-careers, imbue-jobs ]
  assessed_at: 2026-10-02
openness_summary:
  text: >-
    Imbue publishes most of its current products as source code on GitHub, under the MIT License
    (for example Sculptor and mngr) or the AGPL-3.0 (for example Vet); licenses differ by
    repository. This
    catalog has no record of public model weights from Imbue.
  source_ids: [ imbue-products, imbue-sculptor-page, imbue-mngr-page, vet-repo ]
  reviewed_at: 2026-10-02
