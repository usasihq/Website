slug: red-hat
name: Red Hat
legal_name:
  text: Red Hat, Inc.
  source_ids: [ ibm-10k-2025-ex21 ]
  reviewed_at: 2026-10-01
website: https://www.redhat.com
logo_text: RH
summary:
  text: >-
    Red Hat is an enterprise open-source software company, owned by IBM since 2019, whose
    products include Red Hat Enterprise Linux and Red Hat OpenShift. Its Red Hat AI portfolio
    covers inference software built on vLLM and llm-d, OpenShift AI, and Red Hat Enterprise
    Linux AI. In 2025 it launched llm-d, an open-source distributed inference project.
  source_ids: [ rh-company, ibm-rh-close-2019, rh-ai, rh-llmd-launch ]
  reviewed_at: 2026-10-01
organization_roles: [ enterprise-software, open-source-steward ]
ownership_category: unit-of-another-organization
ownership_evidence:
  text: >-
    Exhibit 21 to IBM's Form 10-K for fiscal 2025 lists Red Hat, Inc. (USA, Delaware) with a
    voting percentage of 100 owned directly or indirectly by IBM.
  source_ids: [ ibm-10k-2025-ex21 ]
  reviewed_at: 2026-10-01
parent_evidence:
  text: >-
    IBM completed its acquisition of Red Hat on July 9, 2019. The closing announcement says Red
    Hat operates as a distinct unit within IBM and that IBM would keep Red Hat's headquarters in
    Raleigh, North Carolina. IBM's fiscal 2025 subsidiary list still includes Red Hat, Inc. as a
    wholly owned subsidiary.
  source_ids: [ ibm-rh-close-2019, rh-ibm-close-pr, ibm-10k-2025-ex21 ]
  reviewed_at: 2026-10-01
legal_form:
  text: Incorporated in Delaware (Red Hat, Inc.), per IBM's fiscal 2025 subsidiary list.
  source_ids: [ ibm-10k-2025-ex21 ]
  reviewed_at: 2026-10-01
parent_org_slug: ibm
parent_relationship: subsidiary
headquarters:
  label: Raleigh, North Carolina
  country: US
  source_ids: [ rh-offices, rh-company ]
other_locations: []
founded:
  year: 1993
  source_ids: [ rh-company ]
sectors: [ enterprise, cloud ]
status_note: null
products:
  - id: red-hat-ai-inference
    name: Red Hat AI Inference
    kind: enterprise-software
    access: >-
      Inference software built on vLLM and llm-d, sold on its own or as part of Red Hat AI and
      supported on Red Hat OpenShift and Red Hat Enterprise Linux. Other Linux and Kubernetes
      platforms fall under Red Hat's third-party support policy, and llm-d on third-party
      Kubernetes is offered as early access.
    url: https://www.redhat.com/en/products/ai/inference
    source_ids: [ rh-ai-inference ]
    last_reviewed: 2026-10-01
  - id: openshift-ai
    name: Red Hat OpenShift AI
    kind: enterprise-software
    access: >-
      Platform on Red Hat OpenShift for deploying open-weight models and agents across hybrid
      environments. A developer sandbox and a 60-day product trial are offered; the trial
      requires an existing OpenShift cluster.
    url: https://www.redhat.com/en/products/ai/openshift-ai
    source_ids: [ rh-openshift-ai ]
    last_reviewed: 2026-10-01
  - id: rhel-ai
    name: Red Hat Enterprise Linux AI
    kind: enterprise-software
    access: >-
      Platform for running large language models on individual servers, delivered as a bootable
      Red Hat Enterprise Linux image that packages IBM Granite models and includes Red Hat AI
      Inference.
    url: https://www.redhat.com/en/products/ai/enterprise-linux-ai
    source_ids: [ rh-rhel-ai ]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      Red Hat announced llm-d on May 20, 2025, naming CoreWeave, Google Cloud, IBM Research, and
      NVIDIA as founding contributors. In March 2026 the Cloud Native Computing Foundation
      accepted llm-d as a Sandbox project.
    source_ids: [ rh-llmd-launch, cncf-llmd-blog ]
    reviewed_at: 2026-10-01
  - text: >-
      Red Hat and IBM launched the InstructLab project in 2024. A community announcement dated
      September 2, 2025 split its components into separate repositories, including sdg_hub and
      training_hub in the Red Hat AI Innovation Team's GitHub organization. The main InstructLab repository
      was archived in April 2026.
    source_ids: [ rh-rhel-ai-pr-2024, instructlab-readme, instructlab-repo, rh-ai-innovation-gh ]
    reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Red Hat's office-locations page lists its corporate headquarters at 100 East Davie Street,
    Raleigh, North Carolina. Red Hat is also a wholly owned subsidiary of IBM: Exhibit 21 to
    IBM's fiscal 2025 Form 10-K lists Red Hat, Inc. (USA, Delaware) at 100 percent, and IBM's
    10-K cover page gives its principal executive offices in Armonk, New York. Both the
    subsidiary's own headquarters and its parent are in the United States.
  source_ids: [ rh-offices, ibm-10k-2025-ex21, ibm-10k-2025-cover ]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    Red Hat launched and contributes to the open-source llm-d project (Apache 2.0) and publishes
    model repositories under a verified RedHatAI organization on Hugging Face. Its Red Hat AI
    products are commercial software offerings. This record makes no openness claim about Red
    Hat as a whole.
  source_ids: [ rh-llmd-launch, llmd-license, rh-hf-org, rh-ai ]
  reviewed_at: 2026-10-01
