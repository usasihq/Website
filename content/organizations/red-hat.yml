profile:
  intended_users:
    text: >-
      Red Hat presents Red Hat AI to organizations building and deploying AI applications and
      agents across hybrid cloud environments. OpenShift AI also offers a developer sandbox for
      individual developers and data scientists.
    source_ids: [ rh-ai, rh-openshift-ai ]
    reviewed_at: 2026-10-01
  access_overview:
    text: >-
      Red Hat AI Inference, OpenShift AI, and Red Hat Enterprise Linux AI are sold as Red Hat
      products, with trials offered for some of them. The llm-d project that Red Hat AI Inference
      builds on is published separately under the Apache License 2.0.
    source_ids: [ rh-ai-inference, rh-openshift-ai, llmd-license ]
    reviewed_at: 2026-10-01
  limitations:
    text: >-
      This profile is not a pricing, support, or license audit. Red Hat product subscriptions
      have their own terms, and the models served through them carry their own licenses. Check
      each model's card and terms before reuse.
    source_ids: [ rh-ai-inference, rh-ai ]
    reviewed_at: 2026-10-01
