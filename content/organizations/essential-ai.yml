openness_summary:
  text: >-
    Essential AI publishes the Rnj-1 and Rnj-1.5 model weights on Hugging Face under Apache
    2.0 and the Essential-Web v1.0 dataset under ODC-By. The Rnj-1 model cards describe
    training stages and hyperparameters but do not name the pretraining datasets.
