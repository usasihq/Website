notable_facts:
  - text: >-
      The Hanford Laboratories were transferred to Battelle on January 4, 1965, to operate what
      was first called the Pacific Northwest Laboratory. Battelle then bought land at the north
      end of Richland and built the first buildings of the present Richland campus in the late
      1960s.
    source_ids: [pnnl-origins]
    reviewed_at: 2026-10-01
  - text: >-
      PNNL states that it applies AI to chemistry, materials, and biological systems; to grid
      operations and battery technologies; and to national security work such as threat analysis
      and detection. Its AI page also describes research on the safety, security, and robustness
      of AI-enabled systems, and work led by its Center for AI.
    source_ids: [pnnl-ai]
    reviewed_at: 2026-10-01
  - text: >-
      NeuroMANCER is an open-source differentiable programming library written in PyTorch for
      parametric constrained optimization, physics-informed system identification, and
      model-based optimal control. It is published in PNNL's GitHub organization under a
      BSD-style license with copyright held by Battelle Memorial Institute.
    source_ids: [neuromancer-repo, neuromancer-license]
    reviewed_at: 2026-10-01
