name: Pacific Northwest National Laboratory
legal_name: null
website: https://www.pnnl.gov
logo_text: PNL
summary:
  text: >-
    Pacific Northwest National Laboratory (PNNL) is a U.S. Department of Energy national
    laboratory in Richland, Washington, managed and operated by Battelle for DOE. It traces its
    start to January 4, 1965, when the Atomic Energy Commission awarded Battelle the contract to
    operate the Hanford Laboratories. PNNL applies AI across discovery science, applied energy,
    and national security, and it maintains the open-source NeuroMANCER library.
  source_ids: [pnnl-about, pnnl-origins, pnnl-ai, neuromancer-repo]
  reviewed_at: 2026-10-01
organization_roles: [research-lab]
ownership_category: public-institution
ownership_evidence:
  text: >-
    PNNL states that it is managed and operated by Battelle for the Department of Energy. The
    NeuroMANCER repository describes PNNL as a multi-program national laboratory operated for DOE
    by Battelle Memorial Institute under a DOE contract.
  source_ids: [pnnl-about, neuromancer-repo]
  reviewed_at: 2026-10-01
legal_form:
  text: >-
    DOE national laboratory managed and operated by Battelle Memorial Institute under contract
    with the U.S. Department of Energy. PNNL's history page describes Battelle as a
    not-for-profit research institute.
  source_ids: [pnnl-about, pnnl-origins, neuromancer-repo]
  reviewed_at: 2026-10-01
