logo_text: AP
summary:
  text: >-
    Apptronik develops the Apollo humanoid robot for manufacturing, logistics, and retail work.
    Its current model, Apollo 2, comes in bipedal and wheeled configurations; under a research
    partnership, data collected by Apollo 2 helps advance Google DeepMind's Gemini Robotics
    models.
  source_ids: [apptronik-home, apptronik-robot-park, apptronik-apollo-2]
