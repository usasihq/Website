products:
  - id: apollo-2
    name: Apollo 2
    kind: robot
    access: >-
      Humanoid robot in bipedal and wheeled-base versions for tasks such as goods-to-person
      work, packing, kitting, inspection, sorting, and machine tending. Organizations contact
      Apptronik to arrange deployment; no public price is listed.
    url: https://apptronik.com/apollo/apollo-2
    source_ids: [apptronik-apollo-2, apptronik-robot-park]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      In June 2026 Apptronik opened an expanded Robot Park in Austin, a facility of nearly
      90,000 square feet where Apollo 2 robots collect training data, and said similar
      data-collection setups run at Google DeepMind and at customer sites. It also said it is
      developing a next commercial model, Apollo 3.
    source_ids: [apptronik-robot-park]
  - text: >-
      Apptronik's press boilerplate says the company started out of the Human Centered
      Robotics Lab at the University of Texas at Austin and that its earlier work includes
      NASA's Valkyrie robot.
    source_ids: [apptronik-series-a-x, apptronik-robot-park]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Apptronik's November 2025 Form D lists Apptronik, Inc., a Delaware corporation, with its
    principal place of business at 11701 Stonehollow Dr, Austin, Texas. Its press releases
    are datelined Austin, Texas, and its website terms apply Texas law with venue in Travis
    County courts.
  source_ids: [sec-apptronik-formd-2025, apptronik-series-a-x, apptronik-terms]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Apptronik deploys Apollo robots with commercial customers. It says data its robots collect
    is used to train and refine Google DeepMind's Gemini Robotics models, and describes its
    Google DeepMind partnership as building next-generation humanoid robots powered by Gemini
    Robotics. This catalog found no public model weights or code released by Apptronik.
  source_ids: [apptronik-robot-park, apptronik-series-a-x]
