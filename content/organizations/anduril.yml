products:
  - id: lattice-command-and-control
    name: Lattice for Command & Control
    kind: enterprise-software
    access: >-
      Anduril describes it as an AI-enabled battle management platform that integrates sensors,
      effectors, networks, and mission systems into a common operating picture and lets operators
      manage fleets of crewed and uncrewed systems through machine-to-machine tasking; deployable
      on laptops, tablets, and operator-worn headsets. Offered to defense customers.
    url: https://www.anduril.com/command-and-control
    source_ids: [ anduril-c2 ]
    last_reviewed: 2026-10-02
  - id: lattice-mission-autonomy
    name: Lattice for Mission Autonomy
    kind: enterprise-software
    access: >-
      Software for planning and running missions in which teams of uncrewed systems at sea, on
      land, and in the air collaborate autonomously under the supervision of a single human
      operator, with mission parameters such as acceptable risk and rules of engagement set in
      planning. Offered to defense customers.
    url: https://www.anduril.com/mission-autonomy
    source_ids: [ anduril-mission-autonomy ]
    last_reviewed: 2026-10-02
  - id: lattice-sdk
    name: Lattice SDK
    kind: developer-tool
    access: >-
      Developer documentation, API references, sample applications, and client libraries (for
      example the anduril-lattice-sdk Python package) for building applications, data services, and hardware
      integrations on Lattice; published on GitHub under Anduril's own SDK license agreement,
      which permits use only to develop applications for Lattice.
    url: https://www.anduril.com/lattice-sdk
    source_ids: [ anduril-lattice-sdk, lattice-sdk-python-repo, lattice-sdk-license ]
    last_reviewed: 2026-10-02
notable_facts:
  - text: >-
      Anduril's careers page lists offices or facilities in more than a dozen U.S. states and in
      the United Kingdom, Australia, Ireland, Finland, South Korea, Taiwan, and Japan; it
      describes its Japan office as a locally incorporated presence.
    source_ids: [ anduril-careers ]
    reviewed_at: 2026-10-02
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Anduril's Lattice SDK license agreement identifies Anduril Industries, Inc. as organized under
    Delaware law with its principal place of business at 1400 Anduril, Costa Mesa, California, and
    its careers page describes the Costa Mesa site as Anduril HQ. Anduril has foreign
    subsidiaries and offices, including Anduril Australia Pty Limited, which are units of the U.S.
    company rather than a separate headquarters.
  source_ids: [ lattice-sdk-license, anduril-careers, anduril-privacy ]
  assessed_at: 2026-10-02
openness_summary:
  text: >-
    Anduril's Lattice software is offered to defense customers. Its Lattice SDK client libraries
    and sample applications are public on GitHub but are licensed under Anduril's own agreement,
    which restricts use to building applications for Lattice and forbids modification and
    redistribution of the SDK; they are not open-source licensed.
  source_ids: [ lattice-sdk-license, lattice-sdk-python-repo ]
  reviewed_at: 2026-10-02
