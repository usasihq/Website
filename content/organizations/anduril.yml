summary:
  text: >-
    Anduril Industries describes itself as a defense technology company specializing in
    autonomous systems; it also develops the Lattice software platform. Its documented AI
    software includes Lattice for Command & Control, which it describes as an
    AI-enabled battle management platform, and Lattice for Mission Autonomy, which coordinates
    teams of uncrewed systems under a human operator.
  source_ids: [ anduril-privacy, anduril-c2, anduril-mission-autonomy ]
  reviewed_at: 2026-10-02
organization_roles: [ robotics, hardware-manufacturer, enterprise-software ]
ownership_category: privately-held
