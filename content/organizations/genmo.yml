summary:
  text: >-
    Genmo is a San Francisco research company that builds video generation models, which it
    describes as world models. Its open release is Mochi 1, a text-to-video model published as
    a research preview in October 2024, and it runs a hosted playground for generating videos.
  source_ids: [genmo-home, genmo-about, genmo-terms, genmo-mochi-blog, genmo-play]
