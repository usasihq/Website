products:
  - id: genmo-playground
    name: Genmo Playground
    kind: other
    access: >-
      Web app for generating videos from text prompts, labeled on the page as the Mochi 1.1
      Playground. It requires logging in or signing up; the page does not state pricing.
    url: https://www.genmo.ai/play
    source_ids: [genmo-play]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Genmo's playground page refers to a Mochi 1.1 model. This catalog found no open-weight
      release of Mochi 1.1; mochi-1-preview is the only model in Genmo's Hugging Face
      organization, and the Mochi 1 announcement is the only post on Genmo's blog.
    source_ids: [genmo-play, genmo-hf, genmo-blog]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Genmo's terms of service name Genmo Inc. with a San Francisco, California address and
    apply California law, with San Francisco County courts as the venue where arbitration
    does not apply. Its job board lists every open role at
    "San Francisco HQ". No foreign parent or headquarters was found.
  source_ids: [genmo-terms, genmo-jobs]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Genmo released the Mochi 1 preview weights, its video VAE, and inference code under
    Apache 2.0, and later added a LoRA fine-tuning trainer to the repository. Its announcement
    and model card do not describe the training data. The playground is a hosted service.
  source_ids: [genmo-mochi-blog, mochi-card, mochi-repo]
