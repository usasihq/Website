products:
  - id: leap
    name: LEAP (Liquid Edge AI Platform)
    kind: developer-tool
    access: >-
      Developer platform with an on-device SDK for iOS and Android, a model library, and
      fine-tuning and bundling tools for running LFMs and other small models locally on devices.
    url: https://leap.liquid.ai
    source_ids: [liquid-leap, liquid-press-leap]
    last_reviewed: 2026-09-29
  - id: liquid-apollo
    name: Liquid Apollo
    kind: other
    access: >-
      Mobile app for iOS and Android that runs Liquid models locally on the device, presented as
      a way to try private, on-device AI without a cloud connection.
    url: https://www.liquid.ai/apollo
    source_ids: [liquid-apollo, liquid-press-leap]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Liquid AI releases LFM weights under its own LFM Open License v1.0, which it describes as
      based on Apache 2.0. The license conditions commercial-use rights on the licensee's legal
      entity not exceeding a "Threshold" that it defines as annual revenue of US$10,000,000 or
      more, and states that commercial use by a legal entity that exceeds the Threshold is not
      licensed. The Threshold does not apply to a qualified non-profit organization's use for
      non-commercial or research purposes.
    source_ids: [liquid-lfm-license, lfm25-8b-license-file]
  - text: >-
      In November 2025 Liquid AI published the LFM2 technical report, which describes the hybrid
      architecture of gated short convolutions with a small number of grouped-query attention
      blocks and the models' training pipeline.
    source_ids: [lfm2-tech-report]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Liquid AI's privacy policy gives the company's contact address as Liquid AI, Inc., 314 Main
    Street, Cambridge, Massachusetts, and its July 2025 press release carries a Cambridge, Mass.
    dateline. SEC EDGAR lists the company as incorporated in Delaware and located in
    Massachusetts. The careers page describes the team as mainly in San Francisco and Boston with
    a presence in Tokyo; the Tokyo presence does not change the U.S. headquarters.
  source_ids: [liquid-privacy, liquid-press-leap, sec-edgar-liquid, liquid-careers]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Liquid AI publishes weights for its current LFM models on Hugging Face under the custom LFM
    Open License v1.0, which conditions commercial use on the licensee's legal entity not
    exceeding a threshold defined as annual revenue of US$10,000,000 or more. The model cards and
    release posts reviewed describe training at a high level but do not link training code or
    training data. LEAP and Apollo are delivery products. This catalog assesses openness per
    release.
  source_ids: [liquid-lfm-license, lfm25-8b-license-file, liquid-models, lfm25-2-6b-blog, lfm25-8b-blog, liquid-leap]
