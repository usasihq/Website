website: https://www.liquid.ai
logo_text: LAI
summary:
  text: >-
    Liquid AI is a company spun out of MIT CSAIL in 2023 that develops Liquid Foundation Models
    (LFMs), hybrid models built for efficient deployment on phones, laptops, and other devices.
    It publishes LFM weights on Hugging Face and offers LEAP, a platform for deploying models on
    edge devices.
  source_ids: [liquid-about, liquid-docs-welcome, liquid-leap, liquid-press-leap]
