summary:
  text: >-
    Cisco designs and sells networking, security, collaboration, and observability hardware and
    software. Its AI-related offerings include Silicon One networking silicon for AI data center
    networks, the Cisco Secure AI Factory with NVIDIA reference design, and Cisco AI Defense for
    securing AI applications and models.
  source_ids: [csco-10k-fy2026, cisco-silicon-one-page, cisco-secure-ai-factory-page, cisco-ai-defense-page]
