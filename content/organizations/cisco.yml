products:
  - id: silicon-one
    name: Cisco Silicon One
    kind: hardware
    access: >-
      Programmable routing and switching silicon architecture used in Cisco routers and switches
      for AI scale-out networks in data centers and between sites, for hyperscalers, service
      providers, and enterprises.
    url: https://www.cisco.com/site/us/en/products/networking/silicon-one/index.html
    source_ids: [cisco-silicon-one-page, csco-10k-fy2026, cisco-secure-ai-factory-page]
    last_reviewed: 2026-09-29
  - id: secure-ai-factory
    name: Cisco Secure AI Factory with NVIDIA
    kind: hardware
    access: >-
      Modular reference design built from Cisco AI PODs, NVIDIA-based GPU servers, Cisco or
      NVIDIA Spectrum-X data center switching, Cisco security products, and Splunk
      Observability; offered as pre-validated PODs with Cisco Validated Designs or as
      build-your-own configurations.
    url: https://www.cisco.com/site/us/en/solutions/artificial-intelligence/secure-ai-factory/index.html
    source_ids: [cisco-secure-ai-factory-page]
    last_reviewed: 2026-09-29
  - id: ai-defense
    name: Cisco AI Defense
    kind: enterprise-software
    access: >-
      Security product for AI applications and models that discovers AI assets in use, red-teams
      AI models, manages AI supply chain risk for models and files, and applies runtime
      guardrails to production AI applications.
    url: https://www.cisco.com/site/us/en/products/security/ai-defense/index.html
    source_ids: [cisco-ai-defense-page, csco-10k-fy2026]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Foundation AI at Cisco published Foundation-Sec-8B, an open-weight language model for
      cybersecurity, on Hugging Face on April 28, 2025. The model card says it was built by
      continued pretraining of Meta's Llama-3.1-8B on cybersecurity text and lists the Apache 2.0
      license.
    source_ids: [foundation-sec-8b-card]
