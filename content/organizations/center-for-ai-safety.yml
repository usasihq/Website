notable_facts:
  - text: >-
      CAIS's research page lists benchmarks it has published, including Humanity's Last Exam,
      the WMDP benchmark for hazardous knowledge, and HarmBench for automated red teaming.
    source_ids: [cais-research]
  - text: >-
      Humanity's Last Exam was organized by a team from CAIS and Scale AI, with questions
      contributed by subject experts at institutions in many countries.
    source_ids: [hle-site]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    CAIS describes itself as a San Francisco-based nonprofit, and its donation page states that
    the Center for Artificial Intelligence Safety is a U.S. 501(c)(3) organization with EIN
    88-1751310. The IRS exempt-organization extract for California lists that EIN as Center for
    Artificial Intelligence Safety Inc at a San Francisco address, with 501(c)(3) status.
  source_ids: [cais-home, cais-donate, irs-eo-bmf-ca]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Publishes research papers and benchmarks. Humanity's Last Exam, for example, has MIT-licensed
    evaluation code on GitHub and a question set on Hugging Face that can be downloaded after an
    automatic access prompt, with a private held-out set kept back. See the Humanity's Last Exam
    record.
  source_ids: [hle-site, hle-license, hle-hf-api, cais-research]
