slug: center-for-ai-safety
name: Center for AI Safety (CAIS)
legal_name:
  text: Center for Artificial Intelligence Safety Inc
  source_ids: [cais-donate, irs-eo-bmf-ca]
website: https://safe.ai
logo_text: CAI
summary:
  text: >-
    The Center for AI Safety is a San Francisco-based research and field-building nonprofit
    whose stated mission is to reduce societal-scale risks from artificial intelligence. Its
    work covers technical safety research, including benchmarks, as well as field-building and
    advising industry and policymakers.
  source_ids: [cais-home, cais-about, cais-research]
organization_roles: [nonprofit-research, research-lab]
ownership_category: nonprofit
legal_form:
  text: >-
    Corporation recognized by the IRS as tax-exempt under Section 501(c)(3); the IRS extract
    classifies it as an organization receiving substantial support from a governmental unit or
    the general public (170(b)(1)(A)(vi)).
  source_ids: [cais-donate, irs-eo-bmf-ca, irs-eo-info]
