    name: Inception API (Mercury models)
    kind: hosted-model-api
    access: >-
      OpenAI-compatible API for Mercury 2.5, Mercury 2, and Mercury Edit 2, used with an API key
      from an Inception Platform account; Mercury Voice is listed as enterprise-only.
    url: https://docs.inceptionlabs.ai/
    source_ids: [inception-docs, inception-models]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      Inception's June 2025 technical report on arXiv describes Mercury Coder Mini and Small,
      the first Mercury models, as diffusion-based language models for code, and says they were
      released through a public API and a free playground.
    source_ids: [mercury-paper]
    reviewed_at: 2026-10-01
  - text: >-
      The Inception Platform documentation lists Mercury Edit 2 for code completion and editing
      with fill-in-the-middle support, alongside the general Mercury 2.5 and Mercury 2 models.
    source_ids: [inception-models]
    reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Inception's terms of use name Inception AI, Inc. as the contracting party and give its
    address as Redwood City, California, with arbitration in San Francisco County. Its privacy
    policy, published on the same domain, also names Inception AI, Inc. No non-U.S. parent or
    headquarters is documented on the pages reviewed.
  source_ids: [inception-terms, inception-privacy, inception-home]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    Inception offers its Mercury models as hosted services through its API. It has published a
    technical report on Mercury, but the report and the platform documentation describe API
    access only, and this catalog has no record of public Mercury weights.
  source_ids: [inception-docs, inception-models, mercury-paper]
  reviewed_at: 2026-10-01
