summary:
  text: >-
    Inception (Inception AI, Inc., at inceptionlabs.ai) develops Mercury, a family of diffusion
    language models that generate and refine many tokens in parallel rather than one at a time.
    It offers the models through an OpenAI-compatible API.
  source_ids: [inception-home, inception-docs, mercury-paper]
  reviewed_at: 2026-10-01
