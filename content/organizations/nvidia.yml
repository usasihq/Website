openness_summary:
  text: >-
    NVIDIA sells hardware and commercial software. It also publishes downloadable Nemotron
    model weights, with some training datasets and recipes, and open-source software such as
    TensorRT-LLM under Apache 2.0. Terms differ by release; see individual artifact records.
  source_ids: [nvidia-nemotron-page, tensorrt-llm-license]
