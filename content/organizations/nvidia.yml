products:
  - id: vera-rubin-platform
    name: NVIDIA Vera Rubin platform
    kind: hardware
    access: >-
      Rack-scale data center platform combining Rubin GPUs, Vera CPUs, networking, and the
      Groq 3 LPX inference accelerator; delivered as complete systems through server
      manufacturers and supply-chain partners, including the DGX Vera Rubin NVL72.
    url: https://www.nvidia.com/en-us/data-center/technologies/rubin/
    source_ids: [nvidia-rubin-page]
    last_reviewed: 2026-09-29
  - id: dgx-platform
    name: NVIDIA DGX platform
    kind: hardware
    access: >-
      DGX systems, SuperPOD and BasePOD reference architectures, and DGX Cloud with NVIDIA AI
      Enterprise software; offered for on-premises deployment, colocation, managed service
      providers, and private cloud arrangements.
    url: https://www.nvidia.com/en-us/data-center/dgx-platform/
    source_ids: [nvidia-dgx-page]
    last_reviewed: 2026-09-29
  - id: nim
    name: NVIDIA NIM
    kind: developer-tool
    access: >-
      Prebuilt inference microservices shipped as containers for self-hosting models on
      NVIDIA GPUs, with hosted API endpoints on build.nvidia.com for prototyping; production
      use is licensed through NVIDIA AI Enterprise.
    url: https://www.nvidia.com/en-us/ai-data-science/products/nim-microservices/
    source_ids: [nvidia-nim-page]
    last_reviewed: 2026-09-29
  - id: cuda-toolkit
    name: NVIDIA CUDA Toolkit
    kind: developer-tool
    access: >-
      Free downloadable development environment with a compiler, GPU-accelerated libraries,
      and debugging and optimization tools for building GPU-accelerated applications.
    url: https://developer.nvidia.com/cuda-toolkit
    source_ids: [nvidia-cuda-page]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      In fiscal year 2026 NVIDIA entered into a non-exclusive intellectual property license
      arrangement with Groq, Inc. NVIDIA's Groq 3 LPX inference accelerator, announced as in
      full production in August 2026, uses Groq technology under that license.
    source_ids: [nvidia-10k-fy2026, nvidia-10q-q2fy2027, nvidia-lpx-news]
  - text: >-
      NVIDIA publishes the Nemotron family of models on Hugging Face and, for several
      releases, training datasets and training recipes.
    source_ids: [nvidia-nemotron-page]
