profile:
  intended_users:
    text: >-
      NVIDIA presents Nemotron to developers building specialized and
      multi-agent AI applications, and NIM to developers and enterprises
      deploying prebuilt inference microservices.
    source_ids: [review-nemotron, review-nim]
    reviewed_at: 2026-10-01
  access_overview:
    text: >-
      Nemotron models are published on Hugging Face and offered as hosted
      endpoints on build.nvidia.com, and NVIDIA has released some Nemotron
      training datasets and recipes. NIM can be tried free through the NVIDIA
      Developer Program and self-hosted on a user's own infrastructure.
    source_ids: [review-nemotron, review-build, review-hf-nvidia, review-nim]
    reviewed_at: 2026-10-01
  limitations:
    text: >-
      Model licenses differ by release: the Nemotron 3 Super card names the
      NVIDIA Nemotron Open Model License, while the Nemotron 3.5 Lightning card
      names OpenMDW-1.1. Production use of self-hosted NIM requires an NVIDIA AI
      Enterprise license. This profile is not a complete product or rights
      audit.
    source_ids: [review-nemotron-super-card, review-nemotron-lightning-card, review-nim]
    reviewed_at: 2026-10-01
