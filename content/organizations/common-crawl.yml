  label: Beverly Hills, California (address given in the Terms of Use and the IRS listing)
  country: US
  source_ids: [cc-terms, irs-eo-bmf-ca]
other_locations: []
founded:
  year: 2007
  source_ids: [cc-about]
sectors: [data]
status_note: null
products: []
notable_facts:
  - text: >-
      Common Crawl's crawler, CCBot, checks robots.txt before fetching pages and honors the
      Crawl-delay parameter and nofollow attributes; site owners can block it through robots.txt,
      and Common Crawl also refers site owners to an opt-out registry.
    source_ids: [cc-ccbot, cc-faq]
  - text: >-
      The Terms of Use (last updated March 7, 2024) require users to indemnify Common Crawl against
      third-party claims arising from their use of the service or crawled content, expressly
      including use in connection with artificial intelligence and machine learning systems such
      as large language models.
    source_ids: [cc-terms]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    Common Crawl describes itself as a 501(c)(3) nonprofit. Its Terms of Use name The Common
    Crawl Foundation with a Beverly Hills, California address, and the IRS exempt-organization
    extract for California lists Commoncrawl Foundation at the same address as a 501(c)(3)
    organization.
  source_ids: [cc-about, cc-terms, irs-eo-bmf-ca]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Publishes its crawl archives (WARC, WAT, and WET files) and indexes for download over HTTPS
    without an AWS account. Use is governed by Common Crawl's Terms of Use rather than a named open data
    license, and the crawled content remains subject to the rights of its original publishers.
  source_ids: [cc-get-started, cc-terms]
