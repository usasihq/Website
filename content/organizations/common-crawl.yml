slug: common-crawl
name: Common Crawl
legal_name:
  text: The Common Crawl Foundation (listed by the IRS as Commoncrawl Foundation)
  source_ids: [cc-terms, irs-eo-bmf-ca]
website: https://commoncrawl.org
logo_text: CC
summary:
  text: >-
    Common Crawl is a nonprofit that crawls the web and makes its archives and derived datasets
    freely available. It has collected crawl data since 2008 and hosts it on Amazon Web Services
    through an AWS open data sponsorship program.
  source_ids: [cc-about, cc-get-started]
organization_roles: [data-services]
ownership_category: nonprofit
legal_form:
  text: >-
    Corporation recognized by the IRS as tax-exempt under Section 501(c)(3); the IRS extract
    classifies it as a private operating foundation.
  source_ids: [irs-eo-bmf-ca, irs-eo-info]
parent_org_slug: null
parent_relationship: null
