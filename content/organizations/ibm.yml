ownership_evidence:
  text: IBM publishes investor information for its publicly traded common stock.
    Stock ownership and model licensing are separate questions.
  source_ids:
    - review-investor
  reviewed_at: 2026-09-30
profile:
  intended_users:
    text: IBM presents Granite for enterprise workloads and watsonx.ai for
      organizations building and deploying AI applications.
    source_ids:
      - review-granite
      - review-watsonx
    reviewed_at: 2026-09-30
  access_overview:
    text: Granite offers downloadable model releases, while watsonx.ai supplies a
      hosted platform. A hosted deployment of a downloadable model does not make
      that model closed.
    source_ids:
      - review-granite
      - review-watsonx
    reviewed_at: 2026-09-30
  limitations:
    text: IBM describes Granite models as Apache 2.0 licensed; review each release
      card and license before reuse. watsonx.ai plans and third-party models
      have their own terms. No family-wide training-data rights conclusion is
      implied.
    source_ids:
      - review-granite
      - review-watsonx
    reviewed_at: 2026-09-30
