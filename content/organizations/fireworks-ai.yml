products:
  - id: fireworks-inference
    name: Fireworks Inference
    kind: hosted-model-api
    access: >-
      Serverless API billed per token, with OpenAI- and Anthropic-compatible endpoints, plus
      on-demand dedicated deployments and reserved capacity for custom or post-trained models.
    url: https://fireworks.ai/inference
    source_ids: [fireworks-inference]
    last_reviewed: 2026-09-29
  - id: fireworks-training
    name: Fireworks Training
    kind: developer-tool
    access: >-
      Training API and managed training jobs for supervised fine-tuning, preference
      optimization, and reinforcement learning, launched from the UI, the firectl CLI, or the API.
    url: https://fireworks.ai/training
    source_ids: [fireworks-training]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      The company's leadership page lists co-founders who previously worked on PyTorch and other
      infrastructure at Meta and on Vertex AI at Google.
    source_ids: [fireworks-team]
  - text: >-
      In September 2026 Fireworks announced Ember-1, which it describes as its own model built on
      Kimi K3, offered as a research preview on its serverless service.
    source_ids: [fireworks-ember-1]
eligibility:
  status: eligible
