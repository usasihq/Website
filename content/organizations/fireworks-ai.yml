summary:
  text: >-
    Fireworks AI operates a hosted platform for serving and training models, offering
    pay-per-token access to open models from other developers, dedicated deployments, and
    fine-tuning and reinforcement-learning training services.
  source_ids: [fireworks-inference, fireworks-training]
