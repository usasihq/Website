openness_summary:
  text: >-
    Physical Intelligence publishes code under Apache 2.0 and downloadable
    checkpoints for π0, π0-FAST, and π0.5 in the openpi repository. The π0 paper
    describes the internal robot data used for pre-training; this catalog found no
    public release of that data. This record does not assess whether the company's
    other models are public.
  source_ids: [openpi-repo, pi0-paper]
