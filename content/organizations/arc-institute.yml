  basis: us-nonprofit-or-lab
  explanation: >-
    Arc Institute describes itself as an independent nonprofit research organization based in
    Palo Alto, California, and its contact page gives a Palo Alto address. The IRS
    exempt-organization extract for California lists Arc Research Institute at that address as
    a 501(c)(3) organization.
  source_ids: [arc-about, arc-contact, irs-eo-bmf-ca]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Evo 2 model weights, inference code, and training data are published under Apache 2.0 (see
    the Evo 2 records). This catalog assesses openness release by release, not for Arc as a
    whole.
  source_ids: [evo2-repo, hf-api-arc-models, opengenome2-card]
