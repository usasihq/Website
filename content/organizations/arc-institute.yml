website: https://arcinstitute.org
logo_text: Arc
summary:
  text: >-
    Arc Institute is an independent nonprofit research organization in Palo Alto, California,
    founded in 2021, that works in partnership with Stanford University, UC Berkeley, and UCSF.
    Its research spans experimental biology and computational models, including the Evo 2 DNA
    language model and virtual cell models.
  source_ids: [arc-about, arc-evo-tool, arc-evo2-one-year]
organization_roles: [research-lab, nonprofit-research, model-developer]
ownership_category: nonprofit
legal_form:
  text: >-
    Corporation recognized by the IRS as tax-exempt under Section 501(c)(3); the IRS extract
    classifies it as a hospital or medical research organization (170(b)(1)(A)(iii)).
  source_ids: [irs-eo-bmf-ca, irs-eo-info]
