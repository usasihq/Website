notable_facts:
  - text: >-
      Arc describes Evo 2 as developed by Arc and NVIDIA scientists together with collaborators
      at Stanford University, UCSF, UC Berkeley, Goodfire, and the University of Washington. It
      was released as a preprint in February 2025 and published in Nature on March 4, 2026.
    source_ids: [arc-evo2-one-year]
  - text: >-
      Arc publishes Evo 2 code on GitHub and Evo 2 checkpoints and the OpenGenome2 training
      dataset on Hugging Face under the Apache License 2.0.
    source_ids: [evo2-repo, hf-api-arc-models, opengenome2-card]
eligibility:
