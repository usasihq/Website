  - label: Edinburgh, Scotland
    country: GB
    source_ids: [modular-about]
founded: null
sectors: [cloud]
status_note:
  text: >-
    Qualcomm Incorporated completed its acquisition of Modular Inc in July 2026. Qualcomm's
    quarterly report for the period ended June 28, 2026 gives July 28, 2026 as the completion date;
    the Qualcomm and Modular announcements are dated July 29, 2026. Both announcements say Mojo,
    MAX, and Modular Cloud continue as products and brands.
  source_ids: [qualcomm-10q-q3-fy2026, qualcomm-modular-release, modular-qualcomm-blog]
products:
  - id: modular-cloud
    name: Modular Cloud
    kind: inference-service
    access: >-
      Hosted inference for open and custom models, with shared endpoints billed per token,
      dedicated endpoints billed per minute, and an option to deploy in a customer's own AWS, GCP,
      or Azure account; sign-up is through the Modular console.
    url: https://www.modular.com/deploy/our-cloud
    source_ids: [modular-cloud]
    last_reviewed: 2026-09-29
  - id: max
    name: MAX
    kind: developer-tool
    access: >-
      Downloadable framework, installed with uv, pip, or pixi, for serving models through an
      OpenAI-compatible endpoint and writing model pipelines and GPU kernels. The MAX package is
      licensed under the Modular Community License.
    url: https://max.modular.com/
    source_ids: [max-home, max-get-started, modular-community-license]
    last_reviewed: 2026-09-29
  - id: mojo
    name: Mojo
    kind: developer-tool
    access: >-
      Programming language installed as a Python or conda package (for example with uv or pixi);
      its compiler, standard library, and tooling are published under the Apache License 2.0 with
      LLVM exceptions.
    url: https://mojolang.org/install/
    source_ids: [mojo-install, modular-community-license]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      At its ModCon conference on August 18, 2026, Modular announced that the full Mojo language,
      including the compiler and tooling, was open source, and that the MAX license no longer
      contained device usage restrictions. Its September 17, 2026 release post said the Mojo
      compiler had begun accepting outside contributions.
    source_ids: [modcon-2026, modular-26-6]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Modular's terms of service name Modular Inc with offices at a Los Altos, California address,
    and its about page says the company is headquartered in Silicon Valley. Since July 2026 Modular
    has been owned by Qualcomm Incorporated, which its Form 10-Q lists as a Delaware corporation
    with principal executive offices in San Diego, California. Both the company's own documented
    location and its parent are in the United States.
  source_ids: [modular-terms, modular-about, qualcomm-10q-q3-fy2026, modular-qualcomm-blog]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Mojo's compiler, standard library, and tooling, and MAX's Python API, model pipelines, and GPU
    kernels, are published in Modular's GitHub repository under the Apache License 2.0 with LLVM
    exceptions. The MAX package as a whole is licensed under the Modular Community License, and
    Modular Cloud is a paid hosted service.
  source_ids: [modular-repo-readme, modular-repo-license, modular-community-license, max-home, modular-cloud]
