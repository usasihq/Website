slug: modular
name: Modular
legal_name:
  text: Modular Inc
  source_ids: [modular-terms, qualcomm-10q-q3-fy2026]
website: https://www.modular.com
logo_text: MD
summary:
  text: >-
    Modular develops the Mojo programming language and MAX, a framework for serving and building
    AI models on CPUs, GPUs, and other accelerators, and operates Modular Cloud, a hosted inference
    service. Qualcomm completed its acquisition of Modular in July 2026.
  source_ids: [modular-about, max-home, modular-cloud, qualcomm-modular-release]
organization_roles: [developer-platform, inference-provider]
ownership_category: unit-of-another-organization
legal_form: null
