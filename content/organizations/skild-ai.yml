summary:
  text: >-
    Skild AI develops the Skild Brain, a robotics foundation model that it describes as able to
    control many kinds of robots, including quadrupeds, humanoids, tabletop arms, and mobile
    manipulators. In August 2026 it introduced S1, a manipulation model that learns tasks from
    video demonstrations.
  source_ids: [skild-series-c, skild-s1, skild-brain-blog]
