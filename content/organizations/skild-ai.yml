products:
  - id: skild-brain
    name: Skild Brain
    kind: other
    access: >-
      General-purpose robot control model. Skild's website says the company is building robot
      applications with it, such as security and inspection, mobile manipulation, and packing,
      and that mobile-manipulation skills are exposed through an API call; it does not describe
      public access to the model itself.
    url: https://www.skild.ai/
    source_ids: [skild-home, skild-brain-blog]
    last_reviewed: 2026-09-29
  - id: s1
    name: S1
    kind: other
    access: >-
      Manipulation model announced in August 2026 that takes a video demonstration of a task
      as input. Skild says S1 is in use with commercial partners and offers a sign-up form for
      early access; no public weights or code are announced.
    url: https://www.skild.ai/blogs/s1
    source_ids: [skild-s1]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      In April 2026 Skild AI acquired Zebra Technologies' Robotics Automation business,
      including the Symmetry Fulfillment orchestration platform; Zebra received cash and an
      equity stake in Skild AI.
    source_ids: [zebra-skild-pr, skild-zebra]
  - text: >-
      Skild describes training the Skild Brain on large-scale simulation and internet video
      for pre-training, followed by targeted real-world data for post-training, with a
      high-level policy feeding a low-level action policy.
    source_ids: [skild-brain-blog]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Skild AI's July 2025 press release is datelined Pittsburgh, and its boilerplate says the
    company has offices in Pittsburgh and the San Francisco Bay Area; the April 2026 Zebra
    acquisition release is datelined Pittsburgh and Lincolnshire, Illinois. Technical.ly
    describes Skild AI as Pittsburgh-based and East Liberty-based, with offices in San Mateo,
    California, and Bengaluru. No official page reviewed uses the word "headquarters", and
    many current listings on its job board are in San Mateo, California, but both main offices
    are in the United States. Skild describes its February 2026 Bengaluru office as its first
    expansion beyond the U.S.
  source_ids: [skild-bw-2025, zebra-skild-pr, technically-skild-2026, skild-jobs, skild-bengaluru]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Skild AI's announcements for the Skild Brain and S1 describe no public release of model
    weights or code, and its GitHub organization had no public repositories when reviewed.
    This catalog has no record of public model weights from Skild AI.
  source_ids: [skild-brain-blog, skild-s1, skild-github]
