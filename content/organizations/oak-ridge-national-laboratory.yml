notable_facts:
  - text: >-
      ORNL traces its history to the Manhattan Project. It operated as Clinton Laboratories (X-10)
      before it was renamed Oak Ridge National Laboratory, and it marked 80 years as a research
      institution in 2023.
    source_ids: [ornl-decades]
    reviewed_at: 2026-10-01
  - text: >-
      ORNL states that its researchers build AI into scientific workflows for areas including
      quantum materials, nuclear energy, and cybersecurity, and that it is taking part in DOE's
      Genesis Mission. It established the Center for Artificial Intelligence Security Research
      (CAISER) as an expansion of its AI Initiative to study threats and vulnerabilities in
      AI-based technologies.
    source_ids: [ornl-ai]
    reviewed_at: 2026-10-01
  - text: >-
      HydraGNN, a PyTorch implementation of multi-headed graph neural networks with distributed
      training support, is published in ORNL's GitHub organization under a BSD 3-Clause license
      with copyright held by Oak Ridge National Laboratory.
    source_ids: [hydragnn-repo, hydragnn-license]
    reviewed_at: 2026-10-01
