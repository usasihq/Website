summary:
  text: >-
    Oak Ridge National Laboratory (ORNL) is a U.S. Department of Energy Office of Science
    national laboratory in Oak Ridge, Tennessee, managed by UT-Battelle LLC for DOE. It began in
    1943 as part of the Manhattan Project. ORNL describes AI research embedded in scientific
    workflows and AI security research, and it maintains open-source AI software such as
    HydraGNN.
  source_ids: [ornl-overview, ornl-decades, ornl-ai, hydragnn-repo]
  reviewed_at: 2026-10-01
