openness_summary:
  text: >-
    Glean's platform is a commercial hosted service that its terms say supports multiple
    third-party large language models. Glean publishes developer tooling as open source, such
    as its MIT-licensed API client libraries. This catalog has no record of public model
    weights from Glean.
  source_ids: [glean-tos-2026, glean-python-sdk, glean-python-sdk-license]
