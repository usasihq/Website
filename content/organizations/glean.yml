  explanation: >-
    Glean's current terms of service (dated June 5, 2026) describe Glean Technologies, Inc. as
    a Delaware corporation headquartered at 634 2nd Street, San Francisco, California, and the
    same address appears in the footer of its about page. The about page's structured data
    still lists an address at 260 Sheridan Ave, Palo Alto, California; either way the company
    is based in California.
