summary:
  text: >-
    Broadcom designs semiconductor products and sells infrastructure software, including
    VMware Cloud Foundation. Its AI-related semiconductor offerings include custom
    accelerators (XPUs), Ethernet switching and routing silicon, Ethernet NICs, and optical
    components, as well as racks and systems based on its XPUs.
  source_ids: [broadcom-10k-fy2025]
