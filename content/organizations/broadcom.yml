products:
  - id: tomahawk-6
    name: Tomahawk 6 (BCM78910 series) Ethernet switch
    kind: hardware
    access: >-
      Ethernet switch chip series that Broadcom describes as optimized for scale-up and
      scale-out AI networks used for training and inference, with applications in data
      center switches; the product page directs inquiries to Broadcom's Contact Sales page.
    url: https://www.broadcom.com/products/ethernet-connectivity/switching/strataxgs/bcm78910-series
    source_ids: [broadcom-tomahawk6-page]
    last_reviewed: 2026-09-29
  - id: vmware-private-ai-foundation
    name: VMware Private AI Foundation with NVIDIA
    kind: enterprise-software
    access: >-
      Multi-component solution built on VMware Cloud Foundation for running generative AI
      workloads on systems with NVIDIA GPUs, including deep learning VMs, GPU-accelerated
      Kubernetes clusters, and Private AI Services for delivering generative AI applications
      in a model-as-a-service way.
    url: https://techdocs.broadcom.com/us/en/vmware-cis/private-ai/foundation-with-nvidia/9-1.html
    source_ids: [broadcom-vmware-pai-docs]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      The publicly traded parent of the Broadcom group became a Delaware corporation in April
      2018, when Broadcom Limited, a Singapore company, became a subsidiary of Broadcom Inc.
      through a court-approved scheme of arrangement.
    source_ids: [broadcom-8k12b-2018]
