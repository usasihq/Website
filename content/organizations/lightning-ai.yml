status_note:
  text: >-
    Lightning AI and Voltage Park completed a merger announced on January 21, 2026; the combined
    company operates under the Lightning AI name and pairs Lightning's software platform with
    Voltage Park's GPU data centers in the United States.
  source_ids: [lightning-merger-blog, voltage-park-merger-release, lightning-about]
products:
  - id: lightning-ai-studio
    name: Lightning AI Studio
    kind: cloud-platform
    access: >-
      Browser-based cloud workspaces (Studios) for coding, training, and deploying models on CPUs
      and GPUs; free tier with starter credits, then pay-as-you-go GPU time billed by the second,
      with Pro, Teams, and Enterprise plans.
    url: https://lightning.ai/pricing
    source_ids: [lightning-pricing, lightning-about]
    last_reviewed: 2026-09-29
  - id: lightning-gpu-cloud
    name: Lightning GPU cloud
    kind: compute-service
    access: >-
      Self-serve on-demand GPUs and GPU clusters in Lightning's own data centers, plus a
      marketplace that provisions capacity from other clouds through the same platform.
    url: https://lightning.ai/
    source_ids: [lightning-home, lightning-merger-blog, lightning-pricing]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      An SEC Form D filed on January 8, 2026 by Lightning AI, Inc. lists Voltage Park, Inc. as its
      previous name, Delaware as its jurisdiction, a San Francisco principal place of business, and
      a related business combination. Lightning AI's website privacy policy (effective August 2023)
      names Grid.ai, Inc. doing business as Lightning AI, with a New York postal address.
    source_ids: [lightning-form-d-2026, lightning-privacy]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The Form D filed in January 2026 by Lightning AI, Inc. (formerly Voltage Park, Inc.), a
    Delaware corporation, gives a principal place of business in San Francisco, California, and
    the company's privacy policy gives a New York address for Grid.ai, Inc. doing business as
    Lightning AI. The published legal material does not say how the two entities relate after the
    merger, so no legal name is recorded, but both documented entities and addresses are in the
    United States. Its terms of service are governed by New York law.
  source_ids: [lightning-form-d-2026, lightning-privacy, lightning-terms, lightning-merger-blog]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Lightning AI's cloud platform is a commercial service. The company publishes PyTorch Lightning
    under the Apache License 2.0, and its GitHub organization also hosts other open-source projects
    such as LitServe, LitGPT, TorchMetrics, and lightning-thunder.
  source_ids: [pl-license, lightning-github, lightning-about]
