slug: lightning-ai
name: Lightning AI
legal_name: null
website: https://lightning.ai
logo_text: LAI
summary:
  text: >-
    Lightning AI created and maintains the PyTorch Lightning training framework and runs a cloud
    platform for building, training, and deploying AI models, including browser-based development
    environments (Studios) and on-demand GPUs. It merged with GPU infrastructure provider Voltage
    Park in January 2026 and operates under the Lightning AI name.
  source_ids: [lightning-about, lightning-home, lightning-merger-blog]
