summary:
  text: >-
    Boston Dynamics builds mobile robots: Spot, a quadruped used for industrial inspection;
    Stretch, a box-handling robot for warehouses; and Atlas, an electric humanoid being
    introduced with a select group of early adopters. Its Orbit software manages robot
    fleets and site inspection data. The company began in 1992 as a spin-off from the MIT
    Leg Lab and is controlled by Hyundai Motor Group.
  source_ids: [bd-about, bd-waltham-2026, bd-atlas, bd-orbit, bd-hmg-2021, hmg-statement-2026]
