logo_text: CTX
summary:
  text: >-
    Contextual AI builds an enterprise platform for creating AI agents and retrieval applications
    that work over an organization's own documents and data. It also sells component APIs for
    document parsing, instruction-following reranking, grounded generation, and natural-language
    unit tests for evaluating model outputs, and it has released open-weight reranker models.
  source_ids: [ ctx-company, ctx-platform, ctx-component-apis, ctx-rerank-v2-blog ]
  reviewed_at: 2026-10-02
