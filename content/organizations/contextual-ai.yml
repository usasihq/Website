products:
  - id: contextual-ai-platform
    name: Contextual AI platform (Agent Composer)
    kind: enterprise-software
    access: >-
      Web application at app.contextual.ai with Python and TypeScript/JavaScript SDKs and APIs for
      building agents and managing datastores; deployable as multi-tenant SaaS, a dedicated cloud
      instance, or a private VPC deployment.
    url: https://contextual.ai/platform
    source_ids: [ ctx-platform ]
    last_reviewed: 2026-10-02
  - id: contextual-ai-component-apis
    name: Contextual AI component APIs (Parse, Rerank, Generate, LMUnit)
    kind: hosted-model-api
    access: >-
      Token-priced hosted APIs, used with an API key from the Contextual AI app and documented at
      docs.contextual.ai, for document parsing, instruction-following reranking, generation
      grounded in supplied sources with inline attributions, and evaluating outputs against
      natural-language unit tests.
    url: https://contextual.ai/component-apis
    source_ids: [ ctx-component-apis ]
    last_reviewed: 2026-10-02
notable_facts:
  - text: >-
      In August 2025 Contextual AI released Contextual AI Reranker v2 in 1B, 2B, and 6B sizes, with
      quantized versions, as open weights on Hugging Face under the Creative Commons
      Attribution-NonCommercial-ShareAlike 4.0 license; managed versions are offered through its
      API.
    source_ids: [ ctx-rerank-v2-blog, ctx-rerank-v2-2b-card ]
    reviewed_at: 2026-10-02
