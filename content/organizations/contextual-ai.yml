openness_summary:
  text: >-
    Contextual AI's platform and component APIs are hosted services. It publishes some model
    weights on Hugging Face, including the Reranker v2 models under a noncommercial
    (CC BY-NC-SA 4.0) license; that license does not permit commercial use of the weights.
  source_ids: [ ctx-platform, ctx-component-apis, ctx-rerank-v2-2b-card ]
  reviewed_at: 2026-10-02
