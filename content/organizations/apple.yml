openness_summary:
  text: >-
    Apple's consumer AI features and on-device model are delivered through its operating systems
    and developer frameworks. It publishes open-source machine learning software such as MLX
    under the MIT License. It has also published research model weights on Hugging Face, such
    as FastVLM and OpenELM, under the Apple Machine Learning Research Model License Agreement
    rather than an OSI-approved license; those releases have their own catalog records.
