summary:
  text: >-
    Apple makes and sells smartphones, personal computers, tablets, wearables, and accessories,
    and sells related services. Its AI features, called Apple
    Intelligence, run on-device and through Apple's Private Cloud Compute. Developers can reach
    Apple's on-device model through the Foundation Models framework, and Apple machine learning
    research publishes the open-source MLX array framework.
  source_ids: [aapl-10k-2025, apple-intelligence-page, foundation-models-docs, mlx-readme]
