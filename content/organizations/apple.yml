profile:
  intended_users:
    text: >-
      Apple presents the Foundation Models framework as a Swift API for app
      developers adding features built on Apple Foundation Models. Its MLX
      repository describes the framework as designed by and for machine
      learning researchers.
    source_ids: [review-apple-dev-intelligence, review-fm-docs, review-mlx]
    reviewed_at: 2026-10-01
  access_overview:
    text: >-
      The framework, available from iOS, iPadOS, macOS, and visionOS 26 and
      watchOS 27, documents both on-device and Private Cloud Compute models.
      Apple says App Store Small Business Program members whose app has fewer
      than 2 million total first-time downloads can use its next-generation
      Private Cloud Compute models at no cloud API cost. Apple also publishes
      some research model weights, such as FastVLM and OpenELM, on Hugging
      Face.
    source_ids: [review-fm-docs, review-apple-dev-intelligence, review-hf-apple]
    reviewed_at: 2026-10-01
  limitations:
    text: >-
      The framework requires a device that supports Apple Intelligence, whose
      availability also depends on language and region. Some Apple research
      weights, including FastVLM-7B, use the Apple Machine Learning Research
      Model License, which limits use to non-commercial research; MLX itself
      uses the MIT License. This profile is not a complete product or rights
      audit.
    source_ids: [review-fm-docs, review-apple-intelligence, review-fastvlm-license, review-mlx]
    reviewed_at: 2026-10-01
