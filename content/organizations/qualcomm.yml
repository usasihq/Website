openness_summary:
  text: >-
    Qualcomm publishes the Qualcomm AI Hub Models code on GitHub under the BSD 3-Clause
    license. The models packaged there keep the licenses of their original implementations.
    AI Hub Workbench features such as compiling and on-device profiling require a Qualcomm
    account.
  source_ids: [aihm-readme, aihm-license, aihm-qwen3-4b-readme]
