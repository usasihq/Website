products:
  - id: dragonfly-ai-accelerators
    name: Qualcomm Dragonfly AI accelerators (AI200, AI250, AI300)
    kind: hardware
    access: >-
      Rack-scale AI inference platforms sold under the Qualcomm Dragonfly data center brand,
      alongside a data center CPU, optical and electrical connectivity DSPs, custom silicon, and
      software including an AI infrastructure management suite and the Cloud AI SDK; the page
      directs buyers to Qualcomm sales.
    url: https://www.qualcomm.com/data-center
    source_ids: [qcom-data-center-page]
    last_reviewed: 2026-09-29
  - id: hexagon-npu
    name: Qualcomm Hexagon NPU
    kind: hardware
    access: >-
      Neural processing unit for on-device AI inference, part of the Qualcomm AI Engine in
      Snapdragon platforms; Qualcomm lists laptops, smartphones, and XR devices that use it.
    url: https://www.qualcomm.com/processors/hexagon
    source_ids: [qcom-hexagon-page, qcom-10k-fy2025]
    last_reviewed: 2026-09-29
  - id: qualcomm-ai-hub
    name: Qualcomm AI Hub
    kind: developer-tool
    access: >-
      Web platform for converting, quantizing, profiling, and deploying models on Qualcomm
      devices, with a library of pre-optimized models; developers sign in to AI Hub Workbench
      to compile and test models on hosted devices.
    url: https://aihub.qualcomm.com
    source_ids: [qcom-ai-hub-page, aihm-readme]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Qualcomm completed its acquisition of Alphawave IP Group plc, a developer of high-speed
      wired connectivity IP, custom silicon, and connectivity products, on December 18, 2025, as
      part of its expansion into data centers.
    source_ids: [qcom-10q-q3-fy2026]
  - text: >-
      Qualcomm completed its acquisition of Modular Inc, whose software platform is meant to run
      AI workloads across different hardware architectures, on July 28, 2026, and announced the
      closing on July 29, 2026. The announcement says Mojo, MAX, and Modular Cloud continue as
      products and brands.
    source_ids: [qcom-10q-q3-fy2026, qcom-modular-release]
  - text: >-
      Qualcomm Technologies, Inc., a subsidiary of Qualcomm Incorporated, runs substantially all
      of the company's engineering, research and development, and product businesses, including
      Snapdragon; Qualcomm Incorporated holds the licensing business and most of the patent
      portfolio.
    source_ids: [qcom-modular-release]
