summary:
  text: >-
    Qualcomm develops semiconductors and licenses its patent portfolio. Its annual report names
    on-device AI among its foundational technologies, including the Hexagon NPU in
    Snapdragon platforms. It also sells data center products, including rack-scale AI inference
    accelerators under the Qualcomm Dragonfly brand.
  source_ids: [qcom-10k-fy2025, qcom-modular-release, qcom-data-center-page]
