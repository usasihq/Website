summary:
  text: >-
    Marvell designs data infrastructure semiconductors for AI, cloud, carrier, and enterprise
    infrastructure. Its AI-related products include custom ASICs for cloud and AI data center
    customers, Teralynx Ethernet switch chips, optical interconnect DSPs, and the Photonic
    Fabric optical scale-up interconnect it gained by acquiring Celestial AI.
  source_ids: [mrvl-10k-fy2026, mrvl-ir-company-info, mrvl-ai-page, mrvl-photonic-fabric-page]
