products:
  - id: custom-asic
    name: Marvell custom ASICs
    kind: hardware
    access: >-
      Custom chip design services and IP for AI, cloud data center, and OEM customers, including
      a custom HBM compute architecture for custom AI accelerators (XPUs); each design is built
      for a specific customer.
    url: https://www.marvell.com/products/custom-asic.html
    source_ids: [mrvl-custom-asic-page]
    last_reviewed: 2026-09-29
  - id: teralynx
    name: Teralynx Ethernet switches
    kind: hardware
    access: >-
      Programmable Ethernet switch chips for cloud data center and AI cluster networks, for use
      in fixed or modular switch systems; the family supports OCP SAI and SONiC.
    url: https://www.marvell.com/products/data-center-switches.html
    source_ids: [mrvl-dc-switches-page]
    last_reviewed: 2026-09-29
  - id: pam4-optical-dsps
    name: PAM4 optical DSPs
    kind: hardware
    access: >-
      Digital signal processors for pluggable optical modules and interconnects in cloud and AI
      data centers, including the Spica, Nova, and Ara families, supporting Ethernet and, for
      select products, InfiniBand.
    url: https://www.marvell.com/products/pam-dsp.html
    source_ids: [mrvl-pam-dsp-page]
    last_reviewed: 2026-09-29
  - id: photonic-fabric
    name: Photonic Fabric technology
    kind: hardware
    access: >-
      Optical interconnect platform for scale-up networks between AI accelerators, with
      in-network memory; Marvell obtained it through the Celestial AI acquisition.
    url: https://www.marvell.com/ai/photonic-fabric-technology.html
    source_ids: [mrvl-photonic-fabric-page]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      On April 20, 2021, the Bermuda-incorporated Marvell Technology Group Ltd. became a wholly
      owned subsidiary of a new Delaware company, Marvell Technology, Inc., which acquired
      Inphi Corporation in the same transaction and became the successor issuer. The listed
      parent has been the Delaware company since then.
    source_ids: [mrvl-8k12b-2021, mrvl-group-10k-fy2021]
  - text: >-
      Marvell completed its acquisition of Celestial AI, the developer of the Photonic Fabric
      scale-up interconnect platform, on February 2, 2026, and of XConn Technologies, a maker of
      PCIe and CXL switching silicon, on February 10, 2026.
    source_ids: [mrvl-10q-q2-fy2027]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Marvell Technology, Inc. is a Delaware corporation. Its latest Form 10-Q lists principal
    executive offices in Wilmington, Delaware, and its fiscal 2026 Form 10-K gives that address
    as its corporate headquarters. Its investor relations page lists Santa Clara, California,
    as the company contact address. Both locations are in the United States. The parent company
    was incorporated in Bermuda until the April 2021 reorganization that made the Delaware
    company the listed parent.
  source_ids: [mrvl-10q-q2-fy2027, mrvl-10k-fy2026, mrvl-ir-company-info, mrvl-8k12b-2021, mrvl-group-10k-fy2021]
