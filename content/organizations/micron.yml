notable_facts:
  - text: >-
      Micron's annual report states that cloud servers supporting AI and data-centric workloads
      require increasing amounts of DRAM, including HBM, and NAND. It began volume production of
      LPDDR5 in a SOCAMM module form factor for servers in 2025.
    source_ids: [mu-10k-fy2025]
