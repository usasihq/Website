summary:
  text: >-
    Micron makes memory and storage products, including DRAM, NAND, and NOR. Its Cloud Memory
    Business Unit covers memory for large hyperscale cloud customers and high-bandwidth memory
    (HBM) for all data center customers, and the company markets HBM, low-power server memory
    modules, and data center SSDs for AI workloads.
  source_ids: [mu-10k-fy2025, mu-10q-q3-fy2026, micron-ai-page, micron-socamm-page]
