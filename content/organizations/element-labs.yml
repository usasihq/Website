products:
  - id: lm-studio
    name: LM Studio
    kind: developer-tool
    access: >-
      Proprietary desktop app, free to download, for Apple Silicon Macs (macOS 14 or newer),
      Windows (x64 and ARM), and Linux (x64 and ARM64). It runs models locally with llama.cpp
      (GGUF) and, on Apple Silicon, MLX, and serves them through OpenAI-compatible endpoints. Its
      terms license it for personal and internal business use and say some features are paid.
    url: https://lmstudio.ai/download
    source_ids: [lms-download, lms-docs-app, lms-sysreq, lms-app-terms]
    last_reviewed: 2026-10-01
  - id: llmster-and-lms
    name: llmster and the lms CLI
    kind: developer-tool
    access: >-
      llmster is LM Studio's core packaged as a daemon for servers, cloud instances, and CI,
      installed with a shell or PowerShell script. The lms command-line tool, published under the
      MIT License, starts the daemon, downloads models, and runs the local server.
    url: https://lmstudio.ai/docs/developer
    source_ids: [lms-docs-developer, lms-download, lms-cli-license]
    last_reviewed: 2026-10-01
  - id: lmstudio-sdks
    name: LM Studio SDKs (lmstudio-python and lmstudio-js)
    kind: developer-tool
    access: >-
      MIT-licensed Python (pip install lmstudio) and TypeScript (npm @lmstudio/sdk) libraries for
      building applications that use a computer running LM Studio in the foreground or in
      headless mode.
    url: https://lmstudio.ai/blog/introducing-lmstudio-sdk
    source_ids: [lms-sdk-blog, lms-docs-developer, lmstudio-js-license, lmstudio-python-license]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      LM Studio for Mac bundles mlx-engine, an MIT-licensed engine in the lmstudio-ai GitHub
      organization that runs text and vision models with Apple's MLX. Its README documents a
      standalone demo for macOS 14 or later with Python 3.11; the repository has no tagged
      releases.
    source_ids: [mlx-engine-readme, mlx-engine-license, mlx-engine-tags]
    reviewed_at: 2026-10-01
  - text: >-
      LM Studio's privacy policy says that when models are downloaded and run locally, messages,
      chat histories, and documents are saved on the user's device and are not transmitted from
      it.
    source_ids: [lms-privacy]
    reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    LM Studio's careers page says LM Studio is built by Element Labs in New York, USA. The privacy
    policy identifies Element Labs, Inc. as a Delaware corporation with a registered address in
    Wilmington, Delaware, and the app terms choose New York law, with actions brought in New York
    County or federal court in New York. No foreign parent or headquarters was found.
  source_ids: [lms-careers, lms-privacy, lms-app-terms]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    The LM Studio desktop application is proprietary: its terms describe the software and its
    source code as trade secrets. Element Labs publishes the lms CLI, the Python and TypeScript
    SDKs, and mlx-engine under the MIT License on GitHub.
  source_ids: [lms-app-terms, lms-cli-license, lmstudio-js-license, lmstudio-python-license, mlx-engine-license]
  reviewed_at: 2026-10-01
hiring_url: https://lmstudio.ai/careers
careers: null
profile:
  intended_users:
    text: >-
      LM Studio is presented for running models on one's own computer; llmster and the SDKs are
      presented for developers building applications and services on a local or headless LM
      Studio instance.
    source_ids: [lms-docs-app, lms-docs-developer]
    reviewed_at: 2026-10-01
  access_overview:
    text: >-
      The desktop app is a free download licensed for personal and internal business use, with
      some paid features; llmster installs by script; the SDKs install from PyPI and npm.
    source_ids: [lms-download, lms-app-terms, lms-docs-developer, lms-docs-python]
    reviewed_at: 2026-10-01
  limitations:
    text: >-
      The app terms treat the LM Studio software and its source code as trade secrets. The SDK
      announcement says applications built with the SDKs run on a computer where LM Studio is
      running. This profile is not a complete product or rights audit.
    source_ids: [lms-app-terms, lms-sdk-blog]
    reviewed_at: 2026-10-01
