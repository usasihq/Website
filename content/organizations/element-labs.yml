summary:
  text: >-
    Element Labs makes LM Studio, a desktop application for downloading and running language
    models on a local computer, with a chat interface and a local API server. It also publishes
    llmster, a headless version of LM Studio for servers, the lms command-line tool, and Python
    and TypeScript SDKs.
  source_ids: [lms-careers, lms-docs-app, lms-docs-developer, lms-download]
  reviewed_at: 2026-10-01
