website: https://epoch.ai
logo_text: EP
summary:
  text: >-
    Epoch AI is an independent nonprofit that collects and analyzes data on AI development. It
    publishes data explorers and downloadable datasets on AI models, data centers, hardware, and
    related topics, runs benchmarks including FrontierMath, and publishes research reports,
    newsletters, and podcasts. It started in 2021 as a group of volunteers.
  source_ids: [ epoch-about, epoch-ai-models-data ]
  reviewed_at: 2026-10-02
organization_roles: [ research-lab, nonprofit-research, data-services ]
ownership_category: nonprofit
ownership_evidence:
