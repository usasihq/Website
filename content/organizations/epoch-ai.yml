    Epoch AI describes itself as an independent nonprofit supported by donors, and its consulting
    terms describe Epoch Artificial Intelligence, Inc. as a nonprofit organization.
  source_ids: [ epoch-about, epoch-consulting-terms ]
  reviewed_at: 2026-10-02
legal_form:
  text: >-
