  basis: us-nonprofit-or-lab
  explanation: >-
    Epoch AI's privacy notice (dated January 18, 2025) names Epoch Artificial Intelligence, Inc.
    at 28 Geary St, Suite 650, San Francisco, California, United States. The IRS
    exempt-organization extract for California lists Epoch Artificial Intelligence Inc at that
    address as a Section 501(c)(3) organization, and Epoch's consulting terms describe it as a
    nonprofit governed by California law with venue in Alameda County. The San Francisco address
    is a suite with a private mailbox number; the pages reviewed do not say where staff work. No
    non-U.S. parent entity was found in the pages reviewed.
  source_ids: [ epoch-privacy, irs-eo-bmf-ca, epoch-consulting-terms, epoch-about ]
  assessed_at: 2026-10-02
openness_summary:
  text: >-
    Epoch AI publishes many of its datasets for download under the Creative Commons Attribution
    4.0 license. This catalog has assessed the Data on AI Models dataset; benchmarks such as
    FrontierMath were not assessed.
  source_ids: [ epoch-ai-models-data, epoch-about ]
