products:
  - id: llamafile
    name: llamafile
    kind: developer-tool
    access: >-
      Open-source (Apache 2.0) tool, with source and release binaries on GitHub, that packages
      model weights and a llama.cpp-based runtime into a single executable that runs locally on
      macOS, Windows, Linux, and BSD systems.
    url: https://github.com/mozilla-ai/llamafile
    source_ids: [llamafile-readme, llamafile-license, llamafile-support-docs]
    last_reviewed: 2026-10-01
  - id: any-llm
    name: any-llm
    kind: developer-tool
    access: >-
      Open-source (Apache 2.0) Python SDK, installed with pip, for calling different LLM
      providers, including OpenAI, Anthropic, Mistral, and a local Ollama server, through one
      interface.
    url: https://github.com/mozilla-ai/any-llm
    source_ids: [anyllm-readme, anyllm-license]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      In October 2025 Mozilla.ai announced that the llamafile codebase had joined its GitHub
      organization. llamafile began as a Mozilla Builders project.
    source_ids: [llamafile-returns, llamafile-readme]
    reviewed_at: 2026-10-01
  - text: >-
      Mozilla announced Mozilla.ai in March 2023 as a startup and community intended to build a
      trustworthy, independent open-source AI ecosystem.
    source_ids: [mozilla-blog-2023]
    reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    The Mozilla Foundation's audited financial statements for 2024 list MZL.AI among its wholly
    owned for-profit subsidiaries; the foundation is a California not-for-profit corporation
    headquartered in San Francisco. Mozilla.ai's website, read on 2026-10-01, names MZL.AI, PBC
    with an address in San Francisco and says the company is backed by the Mozilla Foundation.
    Its about page describes a distributed team based across nine countries; the San Francisco
    address is recorded as the headquarters because it is the only company address given. The
    financial statements describe ownership as of December 31, 2024.
  source_ids: [mozfdn-fs-2024, mzai-about]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    Mozilla.ai publishes open-source projects on GitHub, including any-llm and llamafile under
    the Apache License 2.0. This catalog has not reviewed its commercial products.
  source_ids: [anyllm-license, llamafile-license, mzai-home]
  reviewed_at: 2026-10-01
