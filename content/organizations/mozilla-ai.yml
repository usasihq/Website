website: https://www.mozilla.ai
logo_text: MAI
summary:
  text: >-
    Mozilla.ai is a company backed by the Mozilla Foundation that builds open-source AI tools and
    products. Its projects include any-llm, a Python library for calling different model
    providers through one interface, and llamafile, which packages a model and its runtime into
    a single executable that runs locally.
  source_ids: [mzai-about, mzai-home, anyllm-readme, llamafile-readme]
  reviewed_at: 2026-10-01
organization_roles: [developer-platform, open-source-steward]
ownership_category: unit-of-another-organization
ownership_evidence:
  text: >-
    The Mozilla Foundation's audited financial statements for 2024 and 2023 list MZL.AI among the
    foundation's wholly owned for-profit subsidiaries that operate independently. The Mozilla
    Foundation has no record in this catalog, so no parent link is shown.
  source_ids: [mozfdn-fs-2024]
  reviewed_at: 2026-10-01
legal_form:
  text: >-
    Public benefit corporation (MZL.AI, PBC), per the website footer; the Mozilla Foundation's
    audited financial statements describe MZL.AI as a C corporation for tax purposes. The state of
    incorporation is not stated on the pages reviewed.
  source_ids: [mzai-about, mozfdn-fs-2024]
  reviewed_at: 2026-10-01
