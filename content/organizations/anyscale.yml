    url: https://www.anyscale.com/platform
    source_ids: [anyscale-platform, anyscale-pricing]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Ray is now a PyTorch Foundation-hosted project; the Anyscale/Nscale announcement states
      that Ray remains open source and community governed.
    source_ids: [pytorch-ray, anyscale-nscale-press]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Anyscale's about page lists its headquarters in San Francisco, and its platform terms name
    Anyscale, Inc. with a San Francisco legal address. As of 2026-09-29 the acquisition by
    UK-registered Nscale is documented as pending, not completed, so Anyscale is assessed as an
    independent U.S.-headquartered company. If the deal closes, Anyscale would be a subsidiary
    of a foreign parent, and this assessment must be reviewed again.
  source_ids: [anyscale-about, anyscale-terms, anyscale-nscale-press, nscale-s1]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    The Anyscale Platform is a commercial managed service. Ray, the framework it is built on, is
    published under the Apache License 2.0 and is hosted by the PyTorch Foundation.
  source_ids: [anyscale-platform, ray-license, pytorch-ray]
