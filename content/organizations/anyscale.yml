status_note:
  text: >-
    On July 30, 2026 Anyscale and Nscale announced a definitive agreement for Nscale to acquire
    Anyscale, with closing expected in the second half of 2026. Nscale's September 18, 2026 SEC
    registration statement describes the deal as pending, with closing expected at the time of, or
    concurrent with, Nscale's initial public offering. Nscale Limited is registered in England and Wales,
    with principal executive offices in London.
  source_ids: [anyscale-nscale-press, nscale-s1]
