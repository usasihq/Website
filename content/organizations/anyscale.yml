summary:
  text: >-
    Anyscale sells a managed platform for running Ray workloads (data processing, training, and
    online inference) across clouds and Kubernetes. Ray began at UC Berkeley's RISELab, and
    Anyscale contributed it to the PyTorch Foundation in 2025.
  source_ids: [anyscale-about, anyscale-platform, pytorch-ray]
