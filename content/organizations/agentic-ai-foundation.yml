slug: agentic-ai-foundation
name: Agentic AI Foundation (AAIF)
legal_name: null
website: https://aaif.io
logo_text: AAI
summary:
  text: >-
    The Agentic AI Foundation is a directed fund of The Linux Foundation that raises and spends
    funds to support open-source agentic AI projects approved by its Governing Board. The Linux
    Foundation announced it in December 2025 with three contributed projects: the Model Context
    Protocol from Anthropic, goose from Block, and AGENTS.md from OpenAI.
  source_ids: [aaif-charter, lf-aaif-press]
  reviewed_at: 2026-10-01
organization_roles: [open-source-steward]
ownership_category: foundation-hosted
legal_form:
  text: Directed fund of The Linux Foundation
  source_ids: [aaif-charter, agentsmd-charter]
  reviewed_at: 2026-10-01
