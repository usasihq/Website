status_note: null
products: []
notable_facts:
  - text: >-
      The foundation's projects page lists six hosted projects: Model Context Protocol, goose,
      AGENTS.md, agentgateway, Agent2Agent (A2A), and Agent Router. The Technical Committee
      repository places the first three at the Impact Stage and the other three at the Growth
      Stage.
    source_ids: [aaif-projects, aaif-tc]
    reviewed_at: 2026-10-01
  - text: >-
      Agent2Agent, which Google contributed to The Linux Foundation in June 2025, was accepted as
      a Growth Stage project of the foundation in August 2026.
    source_ids: [lf-a2a-press, a2a-joins-aaif, a2a-blog-aaif]
    reviewed_at: 2026-10-01
  - text: >-
      Under its charter (amended July 29, 2026), a Governing Board manages the directed fund,
      approves new projects, and sets its budget, while each technical project is governed by its
      own charter and has a technical steering committee responsible for its technical
      direction. Charter amendments need a two-thirds vote of the Governing Board and approval by
      The Linux Foundation; during a three-year startup period, charter amendments and new
      top-level projects also need the approval of every Platinum member that contributed a
      top-level project.
    source_ids: [aaif-charter]
    reviewed_at: 2026-10-01
  - text: >-
      The charter requires trademarks relating to the fund or its technical projects to be held
      by LF Projects, LLC or The Linux Foundation. The Model Context Protocol, goose, and
      AGENTS.md are each established as a series of LF Projects, LLC, a Delaware series limited
      liability company.
    source_ids: [aaif-charter, mcp-governance, goose-governance, agentsmd-charter, lfprojects]
    reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    The Agentic AI Foundation is a directed fund of The Linux Foundation; its charter places it
    under the guidance of its Governing Board and The Linux Foundation, gives The Linux
    Foundation custody of and final authority over its funds, and requires Linux Foundation
    approval for charter amendments. The Linux Foundation describes itself as a 501(c)(6)
    nonprofit and gives its legal postal address in San Francisco, California. No separate
    headquarters or legal entity is documented for the fund itself. Eligibility rests on this
    documented control, not on the nationality of member companies.
  source_ids: [aaif-charter, aaif-about, lf-about, lf-privacy]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    Hosts open-source projects. The goose repository is licensed under Apache 2.0, the
    AGENTS.md repository under MIT, and the Agent2Agent repository under Apache 2.0; the Model
    Context Protocol specification repository is in a documented transition from MIT to
    Apache 2.0. Licenses are recorded on each project's own record.
  source_ids: [goose-license, agentsmd-license, a2a-license, mcp-license]
  reviewed_at: 2026-10-01
