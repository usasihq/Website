sectors: [agents, enterprise]
status_note:
  text: >-
    CoreWeave completed its acquisition of Weights & Biases on May 5, 2025. On September 30, 2026
    CoreWeave launched CoreWeave Forge, which includes Weights & Biases Models; from that date
    W&B Free, Pro, and Enterprise SaaS accounts sign in through CoreWeave Forge, and wandb.ai
    pages are moving to coreweave.com in phases. Self-hosted and dedicated-instance deployments
    are unchanged, according to W&B and CoreWeave.
  source_ids: [cw-10k-2025, cw-wb-completion, cw-forge-launch, cw-wb-page, wb-domain-faq]
  reviewed_at: 2026-10-01
products:
  - id: wandb-models
    name: Weights & Biases Models
    kind: developer-tool
    access: >-
      Experiment tracking, hyperparameter search, evaluation tables, reports, and model and
      dataset versioning; offered in CoreWeave Forge Free, Pro, and Enterprise editions, with
      managed cloud, private cloud, on-premises, and hybrid deployment options.
    url: https://www.coreweave.com/products/coreweave-forge/weights-and-biases-models
    source_ids: [cw-wb-models, cw-forge-launch]
    last_reviewed: 2026-10-01
  - id: wandb-weave
    name: W&B Weave
    kind: developer-tool
    access: >-
      Tools for tracing, evaluating, and monitoring LLM applications and agents, including prompt
      management and cost tracking; documented alongside W&B Models in CoreWeave's Weights &
      Biases documentation.
    url: https://wandb.ai/site/traces/
    source_ids: [wb-traces, cw-docs-wandb]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      CoreWeave's Weights & Biases FAQ says W&B remains usable with other infrastructure providers,
      while some other CoreWeave Forge products, such as training, inference, and sandboxes, run on
      CoreWeave compute.
    source_ids: [cw-wb-page]
    reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    CoreWeave's Form 10-K for fiscal 2025 reports that on May 5, 2025 CoreWeave acquired all of the
    outstanding equity interests of Weights and Biases, Inc. CoreWeave, Inc. is a Delaware
    corporation with principal executive offices in Livingston, New Jersey, per the same filing's
    cover page. W&B's current Master Service Agreement (updated September 30, 2026) names
    Weights and Biases, LLC, a Delaware limited liability company with its principal place of
    business at 400 Alabama Street, San Francisco, California. The record keeps the W&B name
    because the entity, the brand, and the wandb repository continue under CoreWeave.
  source_ids: [cw-10k-2025, cw-wb-completion, wb-msa, cw-wb-page]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    W&B publishes its wandb Python client library on GitHub under the MIT License. The hosted
    W&B platform is provided under W&B's Master Service Agreement; the MIT license does not cover
    it.
  source_ids: [wandb-license, wandb-repo, wb-msa]
  reviewed_at: 2026-10-01
