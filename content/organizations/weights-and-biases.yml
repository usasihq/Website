summary:
  text: >-
    Weights & Biases develops an AI developer platform for tracking and comparing machine
    learning experiments (W&B Models) and for tracing and evaluating LLM applications and agents
    (W&B Weave), and maintains the open-source wandb Python library. CoreWeave acquired it in
    May 2025, and its products are now offered within CoreWeave Forge.
  source_ids: [cw-10k-2025, cw-docs-wandb, cw-wb-page, wandb-repo]
  reviewed_at: 2026-10-01
organization_roles: [developer-platform]
ownership_category: unit-of-another-organization
parent_evidence:
  text: >-
    CoreWeave's Form 10-K for fiscal 2025 states that on May 5, 2025 CoreWeave acquired all of the
    outstanding equity interests of Weights and Biases, Inc. CoreWeave's Weights & Biases page
    says W&B now operates as part of CoreWeave and is a product within CoreWeave Forge.
  source_ids: [cw-10k-2025, cw-wb-completion, cw-wb-page]
  reviewed_at: 2026-10-01
