    Figure's careers page refers to its headquarters in San Jose, California, and
    its privacy policy gives a contact address at 3960 N First St, San Jose, CA.
    The site terms name Figure AI Inc. and apply California law.
  source_ids: [figure-careers, figure-privacy, figure-terms]
