openness_summary:
  text: >-
    Figure's Helix, Helix 02, and Helix 2.5 announcements describe no public
    release of model weights or code. Figure describes Index, its app-based pipeline for
    collecting robot-training data, as a Figure-exclusive system. This catalog has no
    record of public model weights from Figure.
  source_ids: [figure-helix, figure-helix-02, figure-helix-2-5, figure-index]
