eligibility:
  status: pending_review
  basis: undetermined
  explanation: >-
    CrewAI's terms of use name CrewAI, Inc., a Delaware corporation, and choose New York law, but
    they give no address; notices go to the address on each customer's order form. The privacy
    policy gives no address either. The company's Business Wire releases of November 2025 and
    February 2026 are datelined San Francisco, while its October 2024 GlobeNewswire release is
    datelined "San Francisco and São Paulo". Its job board, linked from crewai.com, lists on-site
    roles in San Francisco, remote U.S. roles, and one role in São Paulo, Brazil. The November
    2025 release reports new offices in Seoul and Madrid. No official page, terms document, or
    regulatory filing found states a headquarters or principal office, and no SEC filing under the
    CrewAI name was found. Incorporation in Delaware, press-release datelines, and job listings do
    not document a headquarters under this catalog's policy, so the basis is left undetermined
    pending an address-bearing source.
  source_ids: [crewai-tos, crewai-privacy, crewai-pr-2025-11, crewai-pr-2026-02, crewai-pr-2024-10, crewai-jobs]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    The CrewAI framework is published as open source (see its record). CrewAI AMP is a commercial
    platform. This catalog assesses openness project by project, not for the company as a whole.
  source_ids: [crewai-readme, crewai-pricing]
