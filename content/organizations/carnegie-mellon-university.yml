notable_facts:
  - text: >-
      Catalyst is an interdisciplinary machine learning and systems research group spanning
      Carnegie Mellon's Machine Learning, Computer Science, and Electrical and Computer
      Engineering departments. Its homepage lists research projects including machine learning
      compilation for large language models (MLC LLM), XGrammar, FlexFlow, Mirage, and Apache
      TVM.
    source_ids: [cmu-catalyst]
  - text: >-
      MLC's 2023 announcement states that the MLC LLM project was initiated by members of CMU
      Catalyst, UW SAMPL, Shanghai Jiao Tong University (SJTU), OctoML, and the MLC community.
      The MLC community site lists CMU and Catalyst among the organizations supporting and
      contributing to the community.
    source_ids: [mlc-blog-2023, mlc-home]
  - text: >-
      LMSYS states that it originated in 2023 from a multi-university collaboration that included
      Carnegie Mellon.
    source_ids: [lmsys-about]
