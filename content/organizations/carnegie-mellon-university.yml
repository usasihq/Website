summary:
  text: >-
    Carnegie Mellon University is a university in Pittsburgh, Pennsylvania. It traces its origin
    to 1900, when Andrew Carnegie funded the Carnegie Technical Schools, and took its current
    form in 1967, when the Carnegie Institute of Technology merged with the Mellon Institute.
  source_ids: [cmu-about, cmu-history]
