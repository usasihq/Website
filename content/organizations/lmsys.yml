sectors: [research, open-models]
status_note:
  text: >-
    Chatbot Arena, formerly an LMSYS project, moved to its own site in September 2024, and LMSYS
    now lists it as graduated. Arena Intelligence Inc., a separate company formed in 2025,
    operates the platform, now called Arena. LMSYS says it continues as an incubator for new
    projects.
  source_ids: [lmsys-arena-new-site, lmsys-about, arena-about]
products: []
notable_facts:
  - text: >-
      The SGLang repository states that the project is currently hosted under LMSYS.
    source_ids: [sglang-readme]
  - text: >-
      A July 2026 post on the LMSYS blog, credited to RadixArk and Google, states that RadixArk, a
      company, is a maintainer of the SGLang project. RadixArk's website says the company builds on
      SGLang for inference and will keep investing in it.
    source_ids: [lmsys-tpu-blog, radixark-home]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    LMSYS's about page names the organization Large Model Systems (LMSYS Corp.) and states that
    it is a 501(c)(3) nonprofit, incorporated as a nonprofit in September 2024. The IRS
    exempt-organization extract for California lists LMSYS Corp, with a Sacramento, California
    address, as a 501(c)(3) corporation with a September 2024 ruling date. No LMSYS page states a
    headquarters address, so the headquarters field is left empty.
  source_ids: [lmsys-about, irs-eo-bmf-ca, irs-eo-info]
  assessed_at: 2026-09-29
