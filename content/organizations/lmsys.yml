slug: lmsys
name: LMSYS (Large Model Systems Organization)
legal_name:
  text: LMSYS Corp
  source_ids: [lmsys-about, irs-eo-bmf-ca]
website: https://lmsys.org
logo_text: LM
summary:
  text: >-
    LMSYS is a 501(c)(3) nonprofit that incubates open-source AI projects and research. It began
    in 2023 as a collaboration among UC Berkeley, Stanford, UC San Diego, Carnegie Mellon, and
    MBZUAI, and was incorporated as a nonprofit in September 2024. Its projects include the
    SGLang serving engine, FastChat, RouteLLM, and the Vicuna models.
  source_ids: [lmsys-about, lmsys-home]
organization_roles: [research-lab, nonprofit-research, open-source-steward]
ownership_category: nonprofit
legal_form:
  text: >-
    Corporation recognized by the IRS as tax-exempt under Section 501(c)(3); LMSYS describes
    itself as a 501(c)(3) nonprofit incorporated in September 2024.
  source_ids: [irs-eo-bmf-ca, irs-eo-info, lmsys-about]
