products:
  - id: boltz-api
    name: Boltz API
    kind: hosted-model-api
    access: >-
      Usage-based API, with Python and JavaScript SDKs, that serves BoltzMol-1, BoltzProt-1, and
      Boltz-2 through hosted endpoints.
    url: https://boltz.com/api
    source_ids: [boltz-api-page, boltz-api-announcement]
    last_reviewed: 2026-10-01
  - id: boltz-lab
    name: Boltz Lab
    kind: other
    access: >-
      Hosted molecular-design platform with a free monthly prediction allowance on its
      Professional tier and custom Enterprise plans that include fine-tuning and private
      deployment options.
    url: https://boltz.com/platform
    source_ids: [boltz-platform-page, boltz-pricing]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      Boltz's founding post says the effort began at MIT and that the founders formed a company
      to build, maintain, and support products in addition to releasing models. Boltz-2 was
      released in June 2025 by the Boltz team at MIT Jameel Clinic with Recursion, before the
      company launch.
    reviewed_at: 2026-10-01
    source_ids: [boltz-manifesto, boltz-boltz2-post]
  - text: >-
      The open-source Boltz repository that Boltz links from its website is hosted under an
      individual developer's GitHub account (jwohlwend/boltz), and its MIT LICENSE names three
      individual developers as copyright holders. Checkpoints are served from a boltz.bio
      download gateway, with copies on the boltz-community Hugging Face organization.
    reviewed_at: 2026-10-01
    source_ids: [boltz-home, boltz-license, boltz-main-py]
  - text: >-
      Boltz's newer BoltzMol-1 and BoltzProt-1 models are offered through Boltz Lab and the Boltz
      API; the homepage labels only Boltz-2 and BoltzGen as open-source. Its 2026 pharmaceutical
      collaborations describe access to proprietary Boltz models.
    reviewed_at: 2026-10-01
    source_ids: [boltz-home, boltz-api-announcement, boltz-gsk-release]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Boltz PBC's product and website terms (last updated May 6, 2026) give a Boston,
    Massachusetts notice address and choose Delaware law, and its 2026 press releases are
    datelined Cambridge, Massachusetts. The street address in the terms is not reproduced here.
    No regulatory filing was reviewed.
  source_ids: [boltz-terms, boltz-website-terms, boltz-gsk-release]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    Boltz-2 code and weights are published under the MIT license (see the Boltz-2 record).
    Boltz's newer BoltzMol-1 and BoltzProt-1 models are available only through its hosted
    platform and API in the pages reviewed, so the company's offerings are not uniformly open.
  reviewed_at: 2026-10-01
  source_ids: [boltz-license, boltz-readme, boltz-home, boltz-api-announcement]
