summary:
  text: >-
    Boltz is a public benefit corporation that develops AI models for biomolecular structure
    prediction, binding-affinity estimation, and protein and small-molecule design. Its team
    started the Boltz models at MIT and founded Boltz PBC, announced in January 2026, which now
    presents Boltz-1, Boltz-2, and BoltzGen as its open-source models alongside a hosted
    platform and API.
  reviewed_at: 2026-10-01
  source_ids: [boltz-launch, boltz-manifesto, boltz-home]
