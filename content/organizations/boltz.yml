profile:
  intended_users:
    text: >-
      Drug-discovery scientists and teams in academia and industry; the API is also aimed at
      developers integrating Boltz models into agents and pipelines.
    reviewed_at: 2026-10-01
    source_ids: [boltz-launch, boltz-api-page]
  access_overview:
    text: >-
      Boltz-2 can be installed from PyPI and run locally with downloadable checkpoints. Newer
      models are reached through Boltz Lab or the usage-based Boltz API.
    reviewed_at: 2026-10-01
    source_ids: [boltz-readme, boltz-api-page, boltz-pricing]
  limitations:
    text: >-
      The Boltz-2 README marks updated Boltz-2 training and evaluation materials as coming soon.
      Hosted services carry their own commercial terms, including restrictions on using outputs
      to build competing models. This profile is not a full product or rights audit.
    reviewed_at: 2026-10-01
    source_ids: [boltz-readme, boltz-terms]
