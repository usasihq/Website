eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Explicit assessment, because SSI has offices in two countries. SSI's own site describes it as
    an American company with offices in Palo Alto and Tel Aviv, without naming either as
    the headquarters. The July 2026 joint announcement with NVIDIA carries a dual Santa
    Clara and Palo Alto, California dateline, Palo Alto being SSI's only U.S. office named
    on its site, and no source reviewed places SSI's headquarters or control outside the
    United States. On that basis this catalog treats Palo Alto as
    SSI's U.S. headquarters and the Tel Aviv office as a second location. If a filing or
    SSI statement later places the principal office elsewhere, this should be reassessed.
  source_ids: [ssi-home, nvidia-ssi-release]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    SSI describes safe superintelligence as its only product, and its updates page
    announces no model releases. This catalog has no record of public models, weights,
    or products from SSI.
  source_ids: [ssi-home, ssi-updates]
