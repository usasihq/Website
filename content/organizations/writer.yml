summary:
  text: >-
    Writer is a San Francisco enterprise AI company, founded in 2020, whose platform includes
    the WRITER Agent, AI Studio, and related tools for business teams. The platform uses
    Writer's own Palmyra X models by default, and Writer has also published some Palmyra
    models as downloadable weights on Hugging Face.
  source_ids: [writer-company, writer-home, writer-models, writer-hf]
