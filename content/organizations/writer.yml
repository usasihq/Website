products:
  - id: palmyra-api
    name: Palmyra models via the Writer API
    kind: hosted-model-api
    access: >-
      API access to Writer's Palmyra X6, X5, and X4 models, authenticated with a Writer API
      key; the developer documentation suggests signing up for a free account to start.
    url: https://dev.writer.com/home/models
    source_ids: [writer-dev-models]
    last_reviewed: 2026-09-29
  - id: writer-agent
    name: WRITER Agent
    kind: enterprise-software
    access: >-
      Enterprise agent that plans and carries out multi-step work across a company's data and
      tools. Offered with a free trial sign-up, subscription plans, and demos through
      Writer's sales team.
    url: https://writer.com/product/writer-agent/
    source_ids: [writer-agent]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Writer's models page lists Palmyra X6 as the default model on its platform and says
      administrators can also enable models from other providers, such as Anthropic and
      Google.
    source_ids: [writer-models]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Writer's company page lists its headquarters at 111 Maiden Lane in San Francisco, with
    other offices in New York, Chicago, Austin, and London. Its platform services agreement
    (August 2026) names Writer, Inc. at the same San Francisco address and applies California
    law. The London office is one of several; no foreign parent or headquarters was found.
  source_ids: [writer-company, writer-psa]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Writer's newest Palmyra X5 and X6 models are offered through its platform and API; this
    catalog found no downloadable weights for them. On Hugging Face, Writer has published
    Palmyra-X-4.3-73B and domain models such as Palmyra-Med-70B-32K under the Writer Open
    Model License, which permits only non-commercial use unless a separate license is
    obtained, and the Palmyra-mini models (September 2025) under Apache 2.0.
  source_ids: [writer-dev-models, writer-models, writer-hf, palmyra-x43-card, palmyra-med-32k-card, writer-oml, palmyra-mini-card]
