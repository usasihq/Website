status_note:
  text: >-
    In December 2025 Groq entered into a non-exclusive licensing agreement with NVIDIA for its
    inference technology; Groq said founder Jonathan Ross, president Sunny Madra, and other team
    members would join NVIDIA, while Groq would continue as an independent company and GroqCloud
    would continue without interruption. The announcement named Simon Edwards CEO; Groq's June 2026
    announcement identifies Adam Winter as CEO and describes Groq as an independent, U.S.-based
    inference cloud operator. In August 2026 Groq said it had become an NVIDIA Cloud Partner.
  source_ids: [groq-nvidia-license-2025-12, nvidia-10k-fy2026, groq-650m-2026-06, groq-ncp-2026-08]
