summary:
  text: >-
    Groq operates an inference cloud that runs AI models on LPU (Language Processing Unit)
    accelerators in data centers it deploys with partners. It developed the LPU and launched
    GroqCloud, and it offers developer access through its console as well as dedicated
    capacity tiers.
