products:
  - id: llamaparse
    name: LlamaParse
    kind: developer-tool
    access: >-
      Hosted document-processing platform for agentic OCR, parsing, extraction, and indexing. It
      is used through a web UI, an API, and Python and TypeScript SDKs. The product page offers
      Global and EU sign-in regions and free sign-up, and larger customers can arrange enterprise
      deployments through sales.
    url: https://www.llamaindex.ai/llamaparse
    source_ids: [llamaparse-page, llamaindex-readme]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      The LlamaIndex framework README says the company's main focus has moved to LlamaParse, the
      free LiteParse text parser, and parsing and extraction benchmarks (ParseBench and
      ExtractBench). It adds that the open-source framework is still available.
    source_ids: [llamaindex-readme]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    LlamaIndex's terms of service name LlamaIndex, Inc. as the provider, under Delaware law. The
    company's March 2025 press release is datelined San Francisco,
    and its boilerplate says LlamaIndex is based there. The careers page lists open roles in San
    Francisco and mentions an office there. The privacy notice appoints a representative for the
    European Union, which suggests the controlling entity is outside the EU. No foreign parent or
    headquarters was found. Gap: no current official page uses the word "headquarters"; the
    clearest location statement is the 2025 press release.
  source_ids: [llamaindex-tos, llamaindex-pr-2025, llamaindex-careers, llamaindex-privacy]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    The LlamaIndex framework is published as open source (see its record). LlamaParse is a
    commercial hosted service. This catalog assesses openness project by project, not for the
    company as a whole.
  source_ids: [llamaindex-oss-page, llamaparse-page]
