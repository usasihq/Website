summary:
  text: >-
    LlamaIndex develops the open-source LlamaIndex framework for building LLM agents and workflows
    over private data. It also sells LlamaParse, a hosted platform for document parsing,
    extraction, and indexing, which the company now describes as its main focus.
  source_ids: [llamaindex-readme, llamaparse-page]
