notable_facts:
  - text: >-
      After shareholder approval at its 2026 annual meeting, Dell Technologies Inc. changed its
      jurisdiction of incorporation from Delaware to Texas effective July 1, 2026, under a plan
      of conversion.
    source_ids: [dell-10q-q2-fy2027]
  - text: >-
      Dell reports two main segments: the Infrastructure Solutions Group (servers, storage, and
      networking, including AI-optimized servers) and the Client Solutions Group (PCs,
      workstations, and peripherals).
    source_ids: [dell-10k-fy2026]
eligibility:
