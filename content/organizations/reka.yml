products:
  - id: reka-api
    name: Reka API
    kind: hosted-model-api
    access: >-
      Hosted API for Reka's own models, authenticated with an API key, covering multimodal chat,
      video understanding, and generation of short clips from long videos.
    url: https://docs.reka.ai/
    source_ids: [ reka-docs, reka-home ]
    last_reviewed: 2026-10-02
  - id: reka-cloud
    name: Reka Cloud
    kind: cloud-platform
    access: >-
      Platform with an OpenAI-compatible endpoint for serverless inference on open models from
      several developers, dedicated NVIDIA GPU capacity, and fine-tuning and reinforcement
      learning services; self-serve signup at developer.reka.ai or through Reka's sales team.
    url: https://reka.ai/cloud
    source_ids: [ reka-cloud ]
    last_reviewed: 2026-10-02
notable_facts:
  - text: >-
      In June 2026 Reka announced that it had joined forces with Moonvalley, adding a team of
      Moonvalley researchers and engineers to Reka; the announcement calls this a merger and
      describes Reka as headquartered in San Francisco.
    source_ids: [ reka-moonvalley ]
    reviewed_at: 2026-10-02
  - text: >-
      Reka released Reka Flash 3, a 21B-parameter model it says was pretrained from scratch, as
      open weights under the Apache License 2.0 in March 2025, followed by Reka Flash 3.1 in July
      2025 (see the Reka Flash records).
    source_ids: [ reka-flash3-post, reka-flash31-post ]
    reviewed_at: 2026-10-02
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Reka's privacy policy (effective June 2026) covers Reka AI, Inc. and its subsidiaries, states
    "We are headquartered in the United States," and gives a Sunnyvale, California mailing
    address; its terms of use (updated September 2026) name Reka AI, Inc. at the same address
    and choose California law. Reka's June 2026 announcement describes it as headquartered in San
    Francisco. The privacy policy's list of data recipients mentions a "corporate parent" without
    naming one; no parent company was identified in the pages reviewed, and Reka's own pages
    present Reka AI, Inc. as the operating company. Reka's open roles are listed in the U.S., the
    U.K., Singapore, and remote; that does not change the documented U.S. headquarters.
  source_ids: [ reka-privacy, reka-terms, reka-moonvalley, reka-jobs ]
  assessed_at: 2026-10-02
openness_summary:
  text: >-
    Reka offers most of its models through its hosted API. It has published some models as open
    weights on Hugging Face, including Reka Flash 3 and 3.1 under the Apache License 2.0; Reka
    Edge 2603 is published under a separate Reka license file rather than a standard open
    license. Openness is assessed per release in this catalog.
  source_ids: [ reka-docs, reka-flash31-card, reka-hf-org, reka-edge-meta ]
  reviewed_at: 2026-10-02
