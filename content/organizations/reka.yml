summary:
  text: >-
    Reka is an AI research lab that develops multimodal models (the Spark, Edge, Flash, and Core
    lines) that process video, images, audio, and text, and offers them through an API. It also
    runs Reka Cloud, a platform for serverless inference, dedicated GPU capacity, and model
    fine-tuning, and it has released some models, including Reka Flash 3 and 3.1, as open
    weights.
  source_ids: [ reka-home, reka-docs, reka-cloud, reka-moonvalley ]
  reviewed_at: 2026-10-02
