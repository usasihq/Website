products:
  - id: fsd-supervised
    name: Full Self-Driving (Supervised)
    kind: other
    access: >-
      Driver-assistance software for Tesla vehicles, offered by monthly subscription in select
      markets in North America, Europe, and Asia Pacific. Tesla's page states that the
      currently enabled features require active driver supervision and do not make the vehicle
      autonomous.
    url: https://www.tesla.com/fsd
    source_ids: [tesla-fsd-page]
    last_reviewed: 2026-09-29
  - id: robotaxi
    name: Robotaxi
    kind: other
    access: >-
      Autonomous ride-hailing service booked through the Robotaxi app for iOS and Android. On
      the date reviewed, the page listed rides in Austin, Dallas, Houston, Miami, Orlando, and
      Tampa, using Model Y vehicles, and showed Cybercab as a vehicle designed without a steering
      wheel or pedals.
    url: https://www.tesla.com/robotaxi
    source_ids: [tesla-robotaxi-page, tesla-10k-2025]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Tesla launched its Robotaxi service in June 2025. Its annual report says the service
      operates with Model Y vehicles and is planned to include Cybercab, a purpose-built
      autonomous vehicle.
    source_ids: [tesla-10k-2025]
  - text: >-
      Tesla's annual report describes Cortex as its AI training cluster at Gigafactory Texas; the
      company expanded it in 2025 and is building Cortex 2 there to add training compute. In 2025
      Tesla also announced a collaboration with Samsung to manufacture semiconductors for AI
      inference and training in the United States.
    source_ids: [tesla-10k-2025]
