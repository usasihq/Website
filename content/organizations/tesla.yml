summary:
  text: >-
    Tesla makes electric vehicles and energy generation and storage products. Its annual report
    says the company is focused on bringing AI into the real world through products and
    services such as Full Self-Driving (Supervised) and Robotaxi, and on developing AI robots,
    including Optimus, which it describes as a general-purpose autonomous humanoid robot.
  source_ids: [tesla-10k-2025, tesla-10q-q2-2026]
