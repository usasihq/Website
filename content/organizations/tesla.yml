  timeline:
    - date: "2003"
      text: Tesla was incorporated in Delaware.
      source_ids:
        - tesla-10q-q2-2026
        - tesla-10k-2025
    - date: 2014-10
      text: Tesla began equipping all Model S vehicles with hardware designed to support Autopilot
        features over time.
      source_ids:
        - tesla-10k-2016
    - date: 2016-10
      text: Tesla began equipping all its vehicles with cameras, sensors, radar and an onboard computer it
        described as hardware for full self-driving capability.
      source_ids:
        - tesla-10k-2016
    - date: "2019"
      text: Tesla introduced a new proprietary onboard computer for self-driving.
      source_ids:
        - tesla-10k-2019
    - date: 2020-10
      text: Tesla began rolling out the FSD beta for city streets to a limited group of Early Access
        Program participants.
      source_ids:
        - tesla-q3-2020-update
    - date: "2021"
      text: According to NHTSA, Tesla began moving from cameras plus radar to a camera-only approach
        called Tesla Vision in mid-2021.
      source_ids:
        - nhtsa-ea26002-open
    - date: "2022"
      text: Tesla showed a preview of its Optimus humanoid robot.
      source_ids:
        - tesla-10k-2022
    - date: 2022-06-08
      text: NHTSA upgraded its review of Autopilot to an engineering analysis (EA22002).
      source_ids:
        - nhtsa-ea22002-close
    - date: 2023-02-15
      text: Tesla filed recall 23V-085, an over-the-air update to how FSD Beta handles certain
        intersections and speed zones.
      source_ids:
        - nhtsa-recall-23v085
    - date: 2023-07
      text: Tesla started production of its Dojo training computer.
      source_ids:
        - tesla-q2-2023-update
    - date: 2023-11
      text: The California DMV filed accusations against Tesla's manufacturer and dealer licenses over its
        driver-assistance marketing.
      source_ids:
        - cadmv-tesla-decision-2025
    - date: 2023-12-12
      text: Tesla filed recall 23V-838 to add stronger Autosteer controls and alerts by over-the-air
        update.
      source_ids:
        - nhtsa-recall-23v838
    - date: 2024-04-25
      text: NHTSA closed its Autopilot engineering analysis and opened a recall query to assess the
        23V-838 fix.
      source_ids:
        - nhtsa-ea22002-close
        - nhtsa-rq24009-open
    - date: 2024-06-13
      text: Tesla converted from a Delaware corporation to a Texas corporation.
      source_ids:
        - tesla-10q-q2-2026
    - date: 2024-10-10
      text: Tesla unveiled Cybercab and Robovan, designed without a steering wheel or pedals, at its "We,
        Robot" event.
      source_ids:
        - tesla-q3-2024-update
    - date: 2024-10-17
      text: NHTSA opened a preliminary evaluation of FSD crashes in reduced roadway visibility (PE24031).
      source_ids:
        - nhtsa-pe24031-open
    - date: 2025-01-06
      text: NHTSA opened a preliminary evaluation of crashes during Actually Smart Summon sessions
        (PE24033).
      source_ids:
        - nhtsa-pe24033-open
    - date: 2025-01-29
      text: Tesla reported that it had finished deploying its Cortex training cluster at Gigafactory Texas
        in Q4 2024.
      source_ids:
        - tesla-q4-2024-update
    - date: 2025-06
      text: Tesla launched its Robotaxi service in Austin with Model Y vehicles and a safety rider on
        board.
      source_ids:
        - tesla-10k-2025
        - tesla-q2-2025-update
    - date: 2025-08-19
      text: NHTSA opened an audit query into the timeliness of Tesla's crash reports (AQ25002).
      source_ids:
        - nhtsa-aq25002-open
    - date: 2025-10
      text: Tesla began deploying FSD (Supervised) v14 and its Bay Area ride-hailing service began serving
        San Jose Airport.
      source_ids:
        - tesla-q3-2025-update
        - tesla-q4-2025-update
    - date: 2025-10-07
      text: NHTSA opened a preliminary evaluation of traffic-law violations with FSD engaged (PE25012).
      source_ids:
        - nhtsa-pe25012-open
    - date: 2025-11-06
      text: At Tesla's annual meeting, an advisory shareholder proposal on investing in xAI did not pass.
      source_ids:
        - tesla-8k-2025-11-07
    - date: 2025-12
      text: Tesla began testing driverless Robotaxis in Austin.
      source_ids:
        - tesla-q4-2025-update
    - date: 2025-12-16
      text: The California DMV found Tesla's "Autopilot" and "Full Self-Driving Capability" marketing
        misleading and gave Tesla 60 days to act.
      source_ids:
        - cadmv-tesla-decision-2025
    - date: 2026-01
      text: Tesla began removing the safety monitor from some customer Robotaxi rides in Austin and agreed
        to make a minority investment in xAI preferred stock.
      source_ids:
        - tesla-q4-2025-update
        - tesla-10k-2025
    - date: 2026-02-17
      text: The California DMV said Tesla had stopped using "Autopilot" in California marketing and would
        avoid a license suspension.
      source_ids:
        - cadmv-tesla-corrective-2026
    - date: 2026-03
      text: Tesla's xAI preferred shares became SpaceX common stock after regulatory approvals.
      source_ids:
        - tesla-10q-q2-2026
    - date: 2026-03-18
      text: NHTSA upgraded its FSD reduced-visibility review to an engineering analysis (EA26002).
      source_ids:
        - nhtsa-ea26002-open
    - date: 2026-04
      text: Tesla completed AI5's chip design, released FSD (Supervised) v14.3, received approval for FSD
        (Supervised) in the Netherlands, and launched unsupervised Robotaxi rides in Dallas and
        Houston.
      source_ids:
        - tesla-q1-2026-update
    - date: 2026-04-03
      text: NHTSA closed its Actually Smart Summon review, citing Tesla's over-the-air updates.
      source_ids:
        - nhtsa-pe24033-close
    - date: 2026-07
      text: Tesla launched unsupervised Robotaxi rides in Miami, Orlando and Tampa and began Cybercab
        rides for staff at Gigafactory Texas.
      source_ids:
        - tesla-q2-2026-update
    - date: 2026-07-02
      text: NHTSA sent Tesla an information request under EA26002 about FSD in reduced visibility.
      source_ids:
        - nhtsa-ea26002-ir
    - date: 2026-07-22
      text: Tesla's Q2 2026 update listed Cortex 1 and Cortex 2 in production and described Optimus lines
        being installed in Fremont.
      source_ids:
        - tesla-q2-2026-update
    - date: 2026-09-03
      text: Tesla began commercial deployment of a small number of Cybercabs in Austin, and NHTSA opened
        an audit query into the vehicle's certification.
      source_ids:
        - nhtsa-aq26002-open
