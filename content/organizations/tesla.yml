products:
  - id: fsd-supervised
    name: Full Self-Driving (Supervised)
    kind: other
    access: >-
      Driver-assistance software for Tesla vehicles, offered by monthly subscription in select
      markets in North America, Europe, and Asia Pacific. Tesla's page states that the
      currently enabled features require active driver supervision and do not make the vehicle
      autonomous.
    url: https://www.tesla.com/fsd
    source_ids: [tesla-fsd-page]
    last_reviewed: 2026-09-29
  - id: robotaxi
    name: Robotaxi
    kind: other
    access: >-
      Ride-hailing service booked through the Robotaxi app for iOS and Android. Tesla's Q2 2026
      update listed Austin, Dallas, Houston, Miami, Orlando, and Tampa as ramping unsupervised
      operation with Model Y vehicles, and the San Francisco Bay Area as operating with a safety
      driver. NHTSA records that Tesla began commercial deployment of a small number of Cybercab
      vehicles, which have no steering wheel or pedals, in Austin on September 3, 2026.
    url: https://www.tesla.com/robotaxi
    source_ids: [tesla-robotaxi-page, tesla-10k-2025, tesla-q2-2026-update, nhtsa-aq26002-open]
    last_reviewed: 2026-10-11
notable_facts:
  - text: >-
      Tesla launched its Robotaxi service in Austin in June 2025 with Model Y vehicles. NHTSA
      records that Tesla began commercial deployment of a small number of Cybercab vehicles, its
      purpose-built autonomous vehicle, in Austin on September 3, 2026, and opened an audit query
      into how Tesla certified the vehicle.
    source_ids: [tesla-10k-2025, nhtsa-aq26002-open, tesla-q2-2025-update]
  - text: >-
      Tesla's annual report describes Cortex as its AI training cluster at Gigafactory Texas. By
      July 2026 Tesla listed both Cortex 1 and Cortex 2 as in production in Texas. In 2025 Tesla
      also announced a collaboration with Samsung to manufacture semiconductors for AI inference
      and training in the United States.
    source_ids: [tesla-10k-2025, tesla-q2-2026-update]
