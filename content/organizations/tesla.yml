deep_dive:
  reviewed_at: 2026-10-11
  overview:
    - text: Tesla, Inc. designs, makes, sells and leases electric vehicles and energy generation and
        storage systems. Its annual report for 2025 says the company is focused on bringing
        artificial intelligence (AI) into the real world through products and services such as Full
        Self-Driving (Supervised) and Robotaxi, and through AI robots, including the Optimus
        humanoid robot.
      source_ids:
        - tesla-10k-2025
    - text: Tesla's driving software learns from camera video. The company says it uses vision-based
        systems to train artificial neural networks (computer programs that learn patterns from
        examples), runs them in its products on inference chips it designs itself, and trains them
        on its own computing clusters, Cortex and Cortex 2, at Gigafactory Texas.
      source_ids:
        - tesla-10k-2025
        - tesla-q2-2026-update
        - tesla-q1-2026-update

    - text: Full Self-Driving (Supervised) is driver assistance, not a self-driving car. Tesla's own
        materials say it requires active driver supervision and does not make the vehicle
        autonomous. NHTSA notes that Tesla describes FSD as an SAE Level 2 system, which means a
        person must watch the road and stay responsible for driving at all times.
      source_ids:
        - tesla-fsd-page
        - tesla-q2-2026-update
        - nhtsa-pe25012-open
    - text: Tesla launched its Robotaxi ride-hailing service in Austin in June 2025. By July 2026 it
        described unsupervised operation as ramping in six Texas and Florida metro areas, while its
        San Francisco Bay Area service used a safety driver. NHTSA records that Tesla began commercial
        deployment of a small number of Cybercab vehicles, which have no steering wheel or pedals, in
        Austin on September 3, 2026.
      source_ids:
        - tesla-10k-2025
        - tesla-q2-2025-update

        - tesla-q2-2026-update
        - nhtsa-aq26002-open
    - text: Regulators are actively reviewing Tesla's driver-assistance and autonomy work. NHTSA has
        opened reviews of how FSD handles reduced visibility and traffic signals and of how Tesla
        certified the Cybercab. In California, the DMV decided in December 2025 that Tesla's
        "Autopilot" marketing was misleading, and said in February 2026 that Tesla had taken
        corrective action.
      source_ids:
        - nhtsa-ea26002-open
        - nhtsa-pe25012-open
        - nhtsa-aq26002-open
        - cadmv-tesla-decision-2025
        - cadmv-tesla-corrective-2026
  sections:
    - id: business-overview
      title: What Tesla does
      intro:
        text: "Tesla reports two business segments: automotive, and energy generation and storage. It says
          these products increasingly deliver AI-related software and services."
        source_ids:
          - tesla-10k-2025
      items:
        - text: Tesla's 2025 annual report lists five consumer vehicles (Model 3, Model Y, Model S, Model X
            and Cybertruck) and says early production and deliveries of the Tesla Semi truck began
            in 2022.
          source_ids:
            - tesla-10k-2025
        - text: In its Q2 2026 update, Tesla said it had decommissioned the Model S and Model X production
            lines at its Fremont, California factory and was installing Optimus robot production
            lines in their place.
          source_ids:
            - tesla-q2-2026-update
        - text: Tesla's energy products include Powerwall (a home battery), Megapack (a utility-scale battery)
            and solar products including Solar Roof. Its Powerhub and Autobidder software platforms
            manage networks of Powerwalls and Megapack systems.
          source_ids:
            - tesla-10k-2025
        - text: Tesla develops almost all of its vehicle control and infotainment software in-house and
            updates it "over the air", meaning through wireless software downloads to cars already
            on the road.
          source_ids:
            - tesla-10k-2025
        - text: Tesla states its mission as "building a world of amazing abundance." It says every vehicle it
            delivers is designed for autonomy, while today's customer vehicles still require the
            driver to stay fully engaged.
          source_ids:
            - tesla-10k-2025
        - text: In July 2026 Tesla said it expects profits from selling hardware to be followed, over time, by
            growth in AI, software and fleet-based profits.
          source_ids:
            - tesla-q2-2026-update
    - id: fsd-and-autopilot
      title: Full Self-Driving (Supervised) and Autopilot
      intro:
        text: Tesla's driver-assistance systems can steer, brake and accelerate, but a person must stay in
          charge. Tesla's quarterly updates footnote FSD (Supervised) with the words "Active driver
          supervision required; does not make the vehicle autonomous."
        source_ids:
          - tesla-q2-2026-update
          - tesla-fsd-page
      items:
        - text: "NHTSA describes Autopilot as the combined use of two Tesla features: Traffic-Aware Cruise
            Control, which keeps a set speed and following distance, and Autosteer, which keeps the
            car in its lane. Tesla characterizes Autopilot as an SAE Level 2 partial driving
            automation system."
          source_ids:
            - nhtsa-ea22002-close
        - text: FSD (Supervised) is Tesla's more capable driver-assistance package, which can drive on city
            streets as well as highways under supervision. NHTSA notes that Tesla describes it as
            requiring a fully attentive driver, and that the driver remains fully responsible for
            driving, including obeying traffic laws.
          source_ids:
            - nhtsa-pe25012-open
            - tesla-fsd-page
            - tesla-q3-2020-update
        - text: Tesla began its FSD beta in October 2020, sending city-street driving software built on a
            ground-up rewrite of its Autopilot neural networks to a limited group of Early Access
            Program participants.
          source_ids:
            - tesla-q3-2020-update
        - text: According to NHTSA, Tesla moved in mid-2021 from using both cameras and radar to a camera-only
            approach it calls Tesla Vision, and added a system meant to detect when camera
            visibility is degraded.
          source_ids:
            - nhtsa-ea26002-open
        - text: Tesla describes FSD (Supervised) v14 as an end-to-end foundation model, a single large AI
            model trained on driving data from customer vehicles and the Robotaxi fleet. Deployment
            of v14 began in October 2025. Tesla released v14.3 in April 2026, saying it improved
            training for rare situations, vision in low visibility, and reaction time.
          source_ids:
            - tesla-q3-2025-update
            - tesla-q4-2025-update
            - tesla-q1-2026-update
        - text: FSD v14 lite brings v14-style driving to cars with Tesla's older AI3 computer by distilling
            driving behavior learned on AI4 cars. Tesla began delivering it in the U.S. and, in July
            2026, in South Korea.
          source_ids:
            - tesla-q2-2026-update
        - text: FSD (Supervised) is called "FSD (Capability)" in Europe, the Middle East and Asia Pacific.
            Tesla reported launches in Australia and New Zealand in 2025 and in South Korea by
            January 2026, approval in the Netherlands in April 2026, and approvals in Lithuania,
            Estonia, Denmark and Belgium by July 2026. Tesla says approval in China is still being
            pursued.
          source_ids:
            - tesla-10k-2025
            - tesla-q3-2025-update
            - tesla-q4-2025-update
            - tesla-q1-2026-update
            - tesla-q2-2026-update
        - text: Actually Smart Summon, released in 2024, lets an owner use the phone app to have the car drive
            itself a short distance in a parking lot. Tesla describes Summon to NHTSA as a
            short-distance SAE Level 2 system for parking lots and private property.
          source_ids:
            - tesla-q3-2024-update
            - nhtsa-pe24033-close
        - text: Starting in early 2026, Tesla began moving FSD (Supervised) to monthly subscriptions only and
            phasing out the up-front purchase option.
          source_ids:
            - tesla-q4-2025-update
            - tesla-q1-2026-update
    - id: robotaxi-and-cybercab
      title: Robotaxi and Cybercab
      intro:
        text: Robotaxi is Tesla's ride-hailing service built on its self-driving software. Riders book
          through the Robotaxi app for iOS and Android.
        source_ids:
          - tesla-robotaxi-page
          - tesla-10k-2025
      items:
        - text: Tesla launched Robotaxi in Austin, Texas, in June 2025 using Model Y vehicles, with a safety
            rider on board. Tesla said it planned to expand the service and eventually run it
            without the safety rider.
          source_ids:
            - tesla-10k-2025
            - tesla-q2-2025-update
        - text: On May 8, 2025, before the launch, NHTSA asked Tesla how it planned to evaluate its robotaxi
            technology for use on public roads, including its ability to handle reduced visibility
            such as sun glare, fog or snow.
          source_ids:
            - nhtsa-pe24031-robotaxi-ir
        - text: Tesla began testing driverless Robotaxis in Austin in December 2025 and began removing the
            safety monitor from some customer rides there in January 2026.
          source_ids:
            - tesla-q4-2025-update
        - text: Tesla launched unsupervised rides in Dallas and Houston in April 2026, and in Miami, Orlando
            and Tampa in July 2026, when it also expanded the unsupervised area in Austin. Tesla
            describes service in these six metro areas as "ramping unsupervised."
          source_ids:
            - tesla-q1-2026-update
            - tesla-q2-2026-update
        - text: In the San Francisco Bay Area, Tesla runs ride-hailing with a safety driver under a California
            charter-party carrier permit. Tesla began serving San Jose Airport in October 2025. In
            January 2026 Tesla told the California Public Utilities Commission that it does not hold
            the permits needed to run autonomous rideshare vehicles in California, and that all
            rides there use a safety driver with FSD (Supervised).
          source_ids:
            - tesla-q1-2026-update
            - tesla-q4-2025-update
            - cpuc-tesla-comments-2026
        - text: In July 2026 Tesla said preparations were underway in Phoenix, Arizona, and Las Vegas, Nevada,
            and that it was testing, seeking permits and training emergency responders for more U.S.
            metro areas.
          source_ids:
            - tesla-q2-2026-update
        - text: Tesla unveiled Cybercab, its purpose-built autonomous vehicle, together with the Robovan at
            its "We, Robot" event on October 10, 2024. Tesla said both were designed for autonomy
            without a steering wheel or pedals.
          source_ids:
            - tesla-q3-2024-update
            - tesla-10k-2025
        - text: Cybercab production started at Gigafactory Texas in 2026. In July 2026 Tesla said production
            units had begun engineering test drives on public roads and that rides for Tesla staff
            had started on the Gigafactory Texas campus.
          source_ids:
            - tesla-q1-2026-update
            - tesla-q2-2026-update
        - text: NHTSA records that Tesla began commercial deployment with a small number of Cybercab vehicles
            in Austin on September 3, 2026. Tesla told the agency it had certified them as meeting
            all applicable Federal Motor Vehicle Safety Standards and planned to expand to more
            vehicles and locations gradually.
          source_ids:
            - nhtsa-aq26002-open
        - text: Tesla says that once Cybercab is in production it is expected to begin replacing the Model Y
            vehicles in the Robotaxi fleet.
          source_ids:
            - tesla-q1-2026-update
    - id: optimus
      title: Optimus humanoid robot
      intro:
        text: Tesla describes Optimus as a general-purpose, autonomous humanoid robot in development, and
          says it applies what it learned from self-driving to robots.
        source_ids:
          - tesla-10k-2025
      items:
        - text: Tesla showed a preview of Optimus in 2022. Its annual reports say the robot is controlled by
            the same AI system that Tesla develops for self-driving.
          source_ids:
            - tesla-10k-2022
            - tesla-10k-2023
        - text: At its October 10, 2024 "We, Robot" event, Tesla showed Optimus and a newer Optimus hand with
            twice the degrees of freedom (ways the hand can move).
          source_ids:
            - tesla-q3-2024-update
        - text: In January 2026 Tesla said it planned to unveil a Gen 3 version of Optimus in Q1 2026, with a
            new hand design, describing Gen 3 as the design intended for mass production and saying
            production was planned to start before the end of 2026.
          source_ids:
            - tesla-q4-2025-update
        - text: Tesla is installing Optimus production lines at its Fremont factory in place of the Model S
            and Model X lines, and is preparing a later-generation, higher-volume Optimus line at
            Gigafactory Texas.
          source_ids:
            - tesla-q1-2026-update
            - tesla-q2-2026-update
        - text: Tesla says early Optimus units will support an "Optimus Academy" for collecting training data
            and developing the robot's skills, and that its Cortex 2 cluster trains both vehicle and
            humanoid-robot autonomy software.
          source_ids:
            - tesla-q2-2026-update
        - text: Tesla's annual report calls robotics a nascent industry and says its robots have not yet been
            commercialized; it says success depends on applying its neural-network training
            experience to robots and making them cost-effective.
          source_ids:
            - tesla-10k-2025
    - id: chips-and-compute
      title: AI chips, computers and training clusters
      intro:
        text: Tesla designs its own inference chips, the chips inside a car or robot that run trained AI
          models, and trains those models on computing clusters it operates.
        source_ids:
          - tesla-10k-2025
      items:
        - text: "In October 2016 Tesla began fitting all its vehicles with hardware it described as intended
            for full self-driving capability: cameras with 360-degree visibility, ultrasonic
            sensors, a forward radar and a more powerful onboard computer."
          source_ids:
            - tesla-10k-2016
        - text: Tesla introduced a new proprietary onboard computer for self-driving in 2019. Its later annual
            reports call the in-car computer that runs its neural networks the FSD Computer, and its
            2026 updates refer to AI3 and AI4 hardware generations.
          source_ids:
            - tesla-10k-2019
            - tesla-10k-2023
            - tesla-q2-2026-update
        - text: AI5 is Tesla's next in-house inference chip. In January 2026 Tesla said AI5 production was
            planned for 2027 and AI6 for 2028, and that AI5 was designed with roughly 10 times the
            raw compute and 9 times the memory of AI4. Tesla completed AI5's final chip design
            (tape-out) in April 2026.
          source_ids:
            - tesla-q4-2025-update
            - tesla-q1-2026-update
        - text: Tesla started production of Dojo, an in-house computer for training neural networks, in July
            2023. Its 2025 annual report describes a third-quarter 2025 restructuring tied to the
            "convergence of AI chip design efforts," with charges for supercomputer assets. In April
            2026 Tesla said it continues custom silicon work with Dojo 3 to lower training costs
            over time.
          source_ids:
            - tesla-q2-2023-update
            - tesla-10k-2025
            - tesla-q1-2026-update
        - text: Cortex is Tesla's AI training cluster at Gigafactory Texas. Tesla finished deploying it in Q4
            2024 with about 50,000 H100-class GPUs, expanded it in 2025, and in April 2026 listed
            Cortex 1 at more than 100,000 H100-equivalent GPUs.
          source_ids:
            - tesla-q4-2024-update
            - tesla-10k-2025
            - tesla-q1-2026-update
        - text: Cortex 2, also at Gigafactory Texas, came online and began running training workloads in early
            2026. In July 2026 Tesla listed Cortex 1 at more than 90 megawatts and Cortex 2 at more
            than 115 megawatts, and said its onsite compute in Texas more than doubled between
            January and June 2026.
          source_ids:
            - tesla-q1-2026-update
            - tesla-q2-2026-update
        - text: In 2025 Tesla announced a collaboration with Samsung to manufacture advanced semiconductors
            for AI inference and training in the United States.
          source_ids:
            - tesla-10k-2025
            - tesla-q3-2025-update
        - text: Tesla says it is adding chip manufacturing to secure enough chips as Robotaxi and Optimus
            grow. In April 2026 it described a partnership with SpaceX to build a chip fab combining
            logic, memory and advanced packaging, starting with a Tesla-owned Research Fab on the
            Gigafactory Texas campus. In July 2026 it said construction and equipment purchasing for
            a semiconductor fab in Austin were progressing.
          source_ids:
            - tesla-q1-2026-update
            - tesla-q2-2026-update
        - text: In the second quarter of 2026 Tesla acquired an AI hardware company, which its filing does not
            name, in an asset acquisition; part of the payment depends on the successful deployment
            of that company's technology.
          source_ids:
            - tesla-10q-q2-2026
    - id: how-to-use
      title: How people can use Tesla's AI
      intro:
        text: People mainly meet Tesla's AI through software in Tesla vehicles and through the Robotaxi app.
        source_ids:
          - tesla-fsd-page
          - tesla-robotaxi-page
      items:
        - text: FSD (Supervised) is offered by monthly subscription in select markets in North America, Europe
            and Asia Pacific.
          source_ids:
            - tesla-fsd-page
            - tesla-q1-2026-update
        - text: The Robotaxi app lets riders request a ride, track the vehicle, preset the cabin temperature,
            unlock the car with their phone and pay through their Tesla payment profile. Tesla said
            in January 2026 that the iOS app no longer had a waitlist in the areas it serves.
          source_ids:
            - tesla-q2-2025-update
            - tesla-q4-2025-update
            - tesla-robotaxi-page
        - text: Grok, the AI assistant made by xAI, began rolling out to Tesla vehicles in North America by
            over-the-air update in 2025. Later Tesla updates added hands-free navigation commands, a
            "Hey Grok" wake phrase and location-based reminders, and, in July 2026, phone calls,
            search, music playback and climate control.
          source_ids:
            - tesla-q3-2025-update
            - tesla-q4-2025-update
            - tesla-q1-2026-update
            - tesla-q2-2026-update
        - text: Tesla's 2026 Summer Release lets customers view and share Self-Driving Stats and lets
            Automatic Navigation work with destinations based on habits and schedules, such as
            school drop-offs.
          source_ids:
            - tesla-q2-2026-update
        - text: Tesla says its latest Safety Score version gives every mile driven with FSD (Supervised) a
            score of 100, which can help eligible customers with Tesla's insurance; it also offers
            insurance discounts for FSD use in certain states.
          source_ids:
            - tesla-q1-2026-update
            - tesla-q4-2025-update
        - text: Actually Smart Summon is controlled from the Tesla phone app within a set distance of the car
            and is intended for parking lots and private property.
          source_ids:
            - nhtsa-pe24033-close
    - id: safety-and-regulators
      title: Safety, regulators and policies
      intro:
        text: Under an NHTSA Standing General Order, Tesla must report certain crashes involving its
          driver-assistance systems, and NHTSA can investigate any vehicle or feature used on public
          roads.
        source_ids:
          - tesla-10k-2025
      items:
        - text: On February 15, 2023, Tesla filed recall 23V-085 for FSD Beta after NHTSA identified concerns
            that it could break local traffic laws at certain intersections and speed zones. The fix
            was an over-the-air software update.
          source_ids:
            - nhtsa-recall-23v085
        - text: On December 12, 2023, Tesla filed recall 23V-838 for vehicles with Autosteer, saying the
            system's controls might not be enough to prevent driver misuse, and added stronger
            alerts and checks by over-the-air update. On April 25, 2024, NHTSA closed its Autopilot
            engineering analysis (EA22002) and opened a recall query (RQ24009) to assess whether the
            fix is adequate.
          source_ids:
            - nhtsa-recall-23v838
            - nhtsa-ea22002-close
            - nhtsa-rq24009-open
        - text: NHTSA opened a preliminary evaluation (PE24031) on October 17, 2024, into FSD crashes in
            reduced visibility such as sun glare, fog or airborne dust. On March 18, 2026, it
            upgraded the review to an engineering analysis (EA26002) to examine whether FSD detects
            degraded camera visibility and warns the driver in time.
          source_ids:
            - nhtsa-pe24031-open
            - nhtsa-ea26002-open
        - text: On October 7, 2025, NHTSA opened a preliminary evaluation (PE25012) into reports of vehicles
            running red lights or entering opposing lanes with FSD engaged, focusing on whether
            drivers get enough warning and time to intervene.
          source_ids:
            - nhtsa-pe25012-open
        - text: On August 19, 2025, NHTSA opened an audit query (AQ25002) into whether Tesla submitted crash
            reports under the Standing General Order on time. Tesla attributed the delays to a
            data-collection issue that it says has been fixed.
          source_ids:
            - nhtsa-aq25002-open
        - text: NHTSA opened a review of Actually Smart Summon crashes (PE24033) on January 6, 2025, and
            closed it on April 3, 2026, citing Tesla's over-the-air updates that improved detection
            of blocked cameras.
          source_ids:
            - nhtsa-pe24033-open
            - nhtsa-pe24033-close
        - text: On September 3, 2026, NHTSA opened an audit query (AQ26002) into how Tesla certified the
            Cybercab, which lacks conventional controls such as a steering wheel, pedals and
            mirrors, including how far the certification relied on finding some safety standards
            inapplicable.
          source_ids:
            - nhtsa-aq26002-open
        - text: On December 16, 2025, the California DMV decided that Tesla's use of "Autopilot" and "Full
            Self-Driving Capability" in marketing was misleading under state law. It permanently
            stayed a suspension of Tesla's manufacturer license and gave Tesla 60 days to address
            "Autopilot." On February 17, 2026, the DMV said Tesla had stopped using "Autopilot" in
            its California marketing and would avoid suspension.
          source_ids:
            - cadmv-tesla-decision-2025
            - cadmv-tesla-corrective-2026
        - text: As of September 17, 2026, the California DMV list of permit holders for autonomous vehicle
            testing with a driver included Tesla Robotaxi LLC. When reviewed on October 11, 2026, no
            Tesla entity appeared on the DMV lists of driverless testing or deployment permit
            holders.
          source_ids:
            - cadmv-av-permit-holders
    - id: governance-and-filings
      title: Corporate structure, governance and links to xAI and SpaceX
      intro:
        text: Tesla, Inc. was incorporated in Delaware in 2003 and became a Texas corporation on June 13,
          2024. Its principal executive offices are at 1 Tesla Road, Austin, Texas.
        source_ids:
          - tesla-10q-q2-2026
          - tesla-10k-2025
      items:
        - text: Robyn Denholm has been Chair of the Board since November 2018. At the November 6, 2025 annual
            meeting, shareholders re-elected three directors and approved a shareholder proposal to
            elect each director annually.
          source_ids:
            - tesla-proxy-2025
            - tesla-8k-2025-11-07
        - text: Tesla's annual report lists as a risk factor that its chief executive officer does not devote
            full time to Tesla and also holds management roles at SpaceX, xAI, Neuralink and The
            Boring Company.
          source_ids:
            - tesla-10k-2025
        - text: At the November 6, 2025 meeting, an advisory shareholder proposal on board authorization of an
            investment in xAI did not pass, because Tesla's bylaws generally count abstentions as
            votes against. The board had made no voting recommendation on it.
          source_ids:
            - tesla-8k-2025-11-07
            - tesla-proxy-2025
        - text: In January 2026 Tesla agreed to make a minority investment in xAI preferred stock, on the same
            terms as other investors in that financing, and Tesla and xAI signed a framework
            agreement for evaluating possible AI collaborations.
          source_ids:
            - tesla-10k-2025
            - tesla-q4-2025-update
        - text: In March 2026, after regulatory approvals, Tesla's xAI preferred shares became SpaceX common
            stock. Tesla says it has significant influence over this holding because its CEO is also
            CEO of SpaceX, and it accounts for the holding at fair value.
          source_ids:
            - tesla-10q-q2-2026
        - text: Tesla reports related-party dealings with SpaceX, The Boring Company and Redwood Materials. In
            2026 SpaceX bought Megapack products from Tesla in the ordinary course of business.
          source_ids:
            - tesla-10q-q2-2026
        - text: Derivative lawsuits filed on Tesla's behalf in the Delaware Court of Chancery in 2024,
            relating to X Corp. and xAI, were dismissed on April 13, 2026; the plaintiffs appealed
            to the Delaware Supreme Court in May 2026.
          source_ids:
            - tesla-10q-q2-2026
        - text: "Tesla's filings describe other cases about its driver-assistance technology: a consumer class
            action in federal court in Northern California filed in 2022 (the Ninth Circuit agreed
            in December 2025 to hear Tesla's appeal of class certification); a securities class
            action in the Western District of Texas filed August 4, 2025 over statements about
            Autopilot, FSD (Supervised) and Robotaxi; and Tesla's appeal to the Eleventh Circuit of
            an August 2025 Florida jury verdict in an Autopilot crash case."
          source_ids:
            - tesla-10q-q2-2026
        - text: Tesla says it regularly receives information requests and subpoenas from agencies including
            NHTSA, the NTSB, the SEC and the Department of Justice on topics including Autopilot,
            FSD and Robotaxi, and that to its knowledge no agency in any ongoing investigation has
            concluded that wrongdoing occurred.
          source_ids:
            - tesla-10q-q2-2026
    - id: recent-updates
      title: Recent updates (July to October 2026)
      items:
        - text: "July 2, 2026: NHTSA sent Tesla an information request under engineering analysis EA26002
            about FSD's ability to detect reduced visibility and alert drivers, tied to nine crashes
            under review."
          source_ids:
            - nhtsa-ea26002-ir
        - text: "July 2026: Tesla launched unsupervised Robotaxi rides in Miami, Orlando and Tampa, expanded
            the unsupervised area in Austin, began Cybercab rides for staff at Gigafactory Texas,
            and started delivering FSD v14 lite in South Korea."
          source_ids:
            - tesla-q2-2026-update
        - text: "July 22, 2026: Tesla's Q2 2026 update listed Cortex 1 and Cortex 2 as in production in Texas,
            described Optimus lines being installed in Fremont and progress on an Austin
            semiconductor fab, and reported FSD (Supervised) approvals in Lithuania, Estonia,
            Denmark and Belgium."
          source_ids:
            - tesla-q2-2026-update
        - text: "July 22, 2026: Tesla said Tesla Semi, Megapack 3 and Optimus production remained planned to
            start in 2026."
          source_ids:
            - tesla-q2-2026-update
        - text: "July 23, 2026: Tesla's quarterly report disclosed the Q2 2026 acquisition of an AI hardware
            company and its equity investment in SpaceX."
          source_ids:
            - tesla-10q-q2-2026
        - text: "September 3, 2026: Tesla began commercial deployment of a small number of Cybercabs in
            Austin, and NHTSA opened audit query AQ26002 into how Tesla certified the vehicle."
          source_ids:
            - nhtsa-aq26002-open
        - text: "September 17, 2026: the California DMV list of permit holders for autonomous testing with a
            driver, dated as of that day, included Tesla Robotaxi LLC."
          source_ids:
            - cadmv-av-permit-holders
        - text: "October 2, 2026: Tesla reported Q3 2026 production and deliveries and said it would post Q3
            financial results on October 21, 2026."
          source_ids:
            - tesla-8k-2026-10-02
