  label: San Francisco, California
  country: US
  source_ids: [cf-10q-2026q2, cf-10k-2025]
other_locations: []
founded:
  year: 2009
  source_ids: [cf-10k-2025]
sectors: [cloud]
status_note: null
products:
  - id: workers-ai
    name: Workers AI
    kind: inference-service
    access: >-
      Serverless inference on GPUs in Cloudflare's network, called from Workers, Pages, or the
      Cloudflare REST API against a catalog of open-source models; usage-based pricing on
      Free and Paid plans.
    url: https://developers.cloudflare.com/workers-ai/
    source_ids: [cf-workers-ai-docs]
    last_reviewed: 2026-09-29
  - id: ai-gateway
    name: AI Gateway
    kind: developer-tool
    access: >-
      Proxy placed between an application and AI providers such as Workers AI, OpenAI,
      Anthropic, Google, and Replicate, adding analytics, logging, caching, rate limiting,
      retries, and model fallback; available on all plans.
    url: https://developers.cloudflare.com/ai-gateway/
    source_ids: [cf-ai-gateway-docs]
    last_reviewed: 2026-09-29
  - id: replicate
    name: Replicate
    kind: inference-service
    access: >-
      Cloud API for running, fine-tuning, and deploying machine learning models, including
      community-contributed models packaged with the open-source Cog tool; billed by compute
      time.
    url: https://replicate.com/
    source_ids: [replicate-home, cf-10k-2025-bc-note]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Cloudflare announced its agreement to acquire Replicate on November 17, 2025. Its 2025
      Form 10-K states that it acquired all outstanding shares of Replicate on December 1,
      2025. Replicate's announcement said its API would continue unchanged.
    source_ids: [cf-replicate-press, cf-10k-2025-bc-note, replicate-blog-joining]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Cloudflare, Inc. is a Delaware corporation. The cover pages of its Form 10-K for fiscal
    2025 and its Form 10-Q for the quarter ended June 30, 2026 list its principal executive
    offices at 101 Townsend Street, San Francisco, California.
  source_ids: [cf-10k-2025, cf-10q-2026q2]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    The AI offerings reviewed here are hosted services. Workers AI serves models from a catalog
    that Cloudflare describes as open-source models, Replicate hosts community-contributed
    models, and AI Gateway routes requests to model providers. This catalog has not assessed
    any model weights published by Cloudflare.
  source_ids: [cf-workers-ai-docs, cf-ai-gateway-docs, replicate-home]
