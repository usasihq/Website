slug: cloudflare
name: Cloudflare
legal_name:
  text: Cloudflare, Inc.
  source_ids: [cf-10k-2025, cf-10q-2026q2]
website: https://www.cloudflare.com
logo_text: CF
summary:
  text: >-
    Cloudflare describes itself as a connectivity cloud company. Its AI offerings include
    Workers AI, which runs machine learning models on serverless GPUs across Cloudflare's
    global network, and AI Gateway, for monitoring and controlling an application's requests
    to AI model providers. It acquired the model-hosting platform Replicate in December 2025.
  source_ids: [cf-replicate-press, cf-10k-2025, cf-workers-ai-docs, cf-ai-gateway-docs, cf-10k-2025-bc-note]
organization_roles: [cloud-provider, inference-provider, developer-platform]
ownership_category: publicly-traded
