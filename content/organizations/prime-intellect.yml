    source_ids: [prime-careers]
founded: null
sectors: [open-models, cloud, research]
status_note: null
products:
  - id: prime-compute
    name: Prime Intellect Compute
    kind: compute-service
    access: >-
      On-demand GPU instances, multi-node clusters, and reserved clusters; the CLI reference
      documents provisioning instances with the prime CLI and an account API key.
    url: https://docs.primeintellect.ai/cli-reference/provision-gpu
    source_ids: [prime-home, prime-docs, prime-docs-gpu]
    last_reviewed: 2026-09-29
  - id: prime-lab
    name: Lab (hosted training and Environments Hub)
    kind: developer-tool
    access: >-
      Hosted platform for running reinforcement-learning training on Prime Intellect's
      infrastructure, launched from the prime CLI with a dashboard for monitoring runs; it
      includes the Environments Hub and hosted evaluations.
    url: https://docs.primeintellect.ai/hosted-training/getting-started
    source_ids: [prime-docs-lab, prime-docs]
    last_reviewed: 2026-09-29
  - id: prime-inference
    name: Prime Intellect Inference
    kind: hosted-model-api
    access: >-
      OpenAI-compatible inference API billed per input and output token from a Prime Intellect
      account balance; API keys are created on the Prime Intellect platform.
    url: https://docs.primeintellect.ai/inference/overview
    source_ids: [prime-docs-inference]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      INTELLECT-1, a 10B-parameter model trained from scratch on 1 trillion tokens, was trained on
      up to 14 concurrent nodes across three continents, with compute contributed by 30
      independent community contributors, according to its model card.
    source_ids: [mc-intellect-1]
  - text: >-
      prime-rl is released under Apache 2.0 and verifiers under the MIT License.
    source_ids: [prime-rl-license, verifiers-license]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Prime Intellect, Inc. is a Delaware corporation; its July 2026 SEC Form D filing lists its
    principal place of business in Dover, Delaware, and its terms of service and privacy policy
    use the same Dover address. Its careers page lists roles in San Francisco and New York City,
    and its homepage invites applicants to work in San Francisco or remotely. All documented
    locations are in the United States.
  source_ids: [sec-formd-prime-2026-07, sec-edgar-prime, prime-terms, prime-privacy, prime-careers, prime-home]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Prime Intellect publishes INTELLECT model weights on Hugging Face (INTELLECT-3 under the MIT
    License) and open-sources its prime-rl training framework and verifiers library.
    INTELLECT-3 is post-trained from a third-party base model (GLM-4.5-Air-Base). Its compute,
    Lab, and inference offerings are hosted services. This catalog assesses openness per release.
  source_ids: [mc-intellect-3, prime-rl-license, verifiers-license, prime-docs]
