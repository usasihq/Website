slug: prime-intellect
name: Prime Intellect
legal_name:
  text: Prime Intellect, Inc.
  source_ids: [sec-formd-prime-2026-07, prime-terms]
website: https://www.primeintellect.ai
logo_text: PI
summary:
  text: >-
    Prime Intellect provides GPU compute, a hosted post-training platform (Lab) with an
    Environments Hub for reinforcement-learning environments, inference, and code sandboxes,
    and trains open-weight models such as the INTELLECT series. It maintains the open-source
    prime-rl training framework and the verifiers environment library.
  source_ids: [prime-home, prime-docs, prime-rl-readme]
organization_roles: [model-developer, research-lab, compute-infrastructure, developer-platform]
ownership_category: privately-held
legal_form:
  text: Corporation incorporated in Delaware in 2024, per its SEC Form D filing.
  source_ids: [sec-formd-prime-2026-07]
parent_org_slug: null
parent_relationship: null
headquarters:
  label: Dover, Delaware (principal place of business listed in its SEC Form D)
  country: US
  source_ids: [sec-formd-prime-2026-07, sec-edgar-prime]
other_locations:
  - label: San Francisco, California
    country: US
    source_ids: [prime-careers, prime-home]
  - label: New York, New York
