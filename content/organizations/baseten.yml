logo_text: BT
summary:
  text: >-
    Baseten runs an inference platform for deploying open-source, custom, and fine-tuned models,
    offering per-token APIs for hosted open models, dedicated deployments in its cloud, a
    customer's cloud, or both, and managed training jobs. The company was started in 2019.
  source_ids: [baseten-about, baseten-model-apis, baseten-dedicated, baseten-training]
