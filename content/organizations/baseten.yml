openness_summary:
  text: >-
    Baseten's inference and training services are commercial hosted products. It publishes Truss,
    its command-line tool for packaging and deploying models to Baseten, under the MIT License.
  source_ids: [baseten-model-apis, baseten-dedicated, truss-license, truss-readme]
