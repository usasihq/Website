products:
  - id: baseten-model-apis
    name: Baseten Model APIs
    kind: inference-service
    access: >-
      OpenAI-compatible APIs for open models from other developers (such as DeepSeek, GLM, Kimi,
      Nemotron, and gpt-oss), billed per input, cached-input, and output token.
    url: https://www.baseten.co/products/model-apis/
    source_ids: [baseten-model-apis]
    last_reviewed: 2026-09-29
  - id: baseten-dedicated-inference
    name: Baseten Dedicated Inference
    kind: inference-service
    access: >-
      Dedicated serving of open-source, custom, or fine-tuned models on Baseten Cloud, on
      self-hosted infrastructure, or in a hybrid setup; pricing is listed on a separate page.
    url: https://www.baseten.co/products/dedicated-inference/
    source_ids: [baseten-dedicated]
    last_reviewed: 2026-09-29
  - id: baseten-training
    name: Baseten Training
    kind: compute-service
    access: >-
      Managed training jobs on on-demand GPUs (generally available) and the Loops SDK for
      reinforcement learning and fine-tuning (early access), with trained models promoted to
      Dedicated Inference.
    url: https://www.baseten.co/products/training/
    source_ids: [baseten-training]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      In September 2026 Baseten announced the acquisition of Blaxel, a company that built
      sandboxes and distributed storage for running AI agents.
    source_ids: [baseten-blaxel]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Baseten Labs, Inc.'s Form D filed with the SEC on June 30, 2026 lists Delaware as its
    jurisdiction of incorporation and a principal place of business in San Francisco, California.
    Its privacy policy and terms give the same San Francisco address, and the terms are governed by
    California law.
  source_ids: [baseten-form-d-2026, baseten-privacy, baseten-terms]
