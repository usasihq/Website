website: https://lambda.ai
logo_text: L
summary:
  text: >-
    Lambda is an AI cloud company that provides NVIDIA GPU infrastructure for training and
    inference, from on-demand instances and self-serve clusters to single-tenant
    superclusters. It was founded in 2012 by machine learning engineers.
  source_ids: [lambda-about, lambda-instances-page, lambda-superclusters-page]
organization_roles: [cloud-provider, compute-infrastructure]
ownership_category: privately-held
legal_form:
  text: Delaware corporation
  source_ids: [lambda-form-d-2024]
parent_org_slug: null
parent_relationship: null
headquarters:
  label: San Jose, California
  country: US
  source_ids: [lambda-contact, lambda-privacy-policy]
other_locations: []
founded:
  year: 2012
  source_ids: [lambda-about]
sectors: [cloud]
status_note:
  text: >-
    In May 2026 Lambda announced an expanded leadership structure in which Michel Combes became
    CEO, co-founder Stephen Balaban became CTO, and John Donovan became Chairman of the Board.
  source_ids: [lambda-leadership-2026-05]
products:
  - id: instances
    name: Lambda Instances
    kind: compute-service
    access: >-
      On-demand NVIDIA GPU instances with 1, 2, 4, or 8 GPUs, launched from a self-serve
      console, the Lambda Cloud API, or a CLI and billed per GPU per hour.
    url: https://lambda.ai/instances
    source_ids: [lambda-instances-page]
    last_reviewed: 2026-09-29
  - id: one-click-clusters
    name: 1-Click Clusters
    kind: compute-service
    access: >-
      Self-serve multi-node NVIDIA HGX B200 or H100 clusters reserved from the Lambda Cloud
      dashboard, with managed Kubernetes or Slurm and S3-compatible storage; short- and
      long-term contracts are available on request.
    url: https://lambda.ai/1-click-clusters
    source_ids: [lambda-1cc-page]
    last_reviewed: 2026-09-29
  - id: superclusters
    name: Lambda Superclusters
    kind: compute-service
    access: >-
      Single-tenant, physically isolated NVIDIA GPU clusters for large-scale training and
      inference, co-engineered with each customer.
    url: https://lambda.ai/superclusters
    source_ids: [lambda-superclusters-page]
    last_reviewed: 2026-09-29
