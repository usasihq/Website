products:
  - id: harvey-agents
    name: Harvey agents
    kind: enterprise-software
    access: >-
      Agents in the Harvey web platform that run multi-step legal work, can be scheduled, return
      cited outputs with step logs, and ask for human review at set points; available to
      enterprise customers, with a mobile app and connectors to Microsoft and document management
      systems.
    url: https://www.harvey.ai/platform/agents
    source_ids: [ harvey-agents ]
    last_reviewed: 2026-10-02
  - id: harvey-vault
    name: Vault
    kind: enterprise-software
    access: >-
      Document store in the Harvey web platform for organizing and bulk-analyzing collections of
      legal documents, with review tables that extract data points across files and integrations
      with iManage, SharePoint, and Google Drive.
    url: https://www.harvey.ai/platform/vault
    source_ids: [ harvey-vault ]
    last_reviewed: 2026-10-02
  - id: harvey-knowledge
    name: Knowledge
    kind: enterprise-software
    access: >-
      Research tool in the Harvey platform that answers legal, regulatory, and tax questions using
      licensed legal databases (for example LexisNexis and Wolters Kluwer), web sources, SEC
      EDGAR filings, EUR-Lex, and a firm's own curated knowledge bases.
    url: https://www.harvey.ai/platform/knowledge
    source_ids: [ harvey-knowledge ]
    last_reviewed: 2026-10-02
notable_facts:
  - text: >-
      In May 2026 Harvey released the Legal Agent Benchmark (LAB), an open-source benchmark of
      legal agent tasks with expert-written rubrics and an evaluation harness, under the MIT
      License (see the Harvey LAB record).
    source_ids: [ harvey-lab-blog, harvey-lab-license ]
    reviewed_at: 2026-10-02
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Harvey's privacy policy (last updated July 13, 2026) names Harvey AI Corporation at 201 3rd
    St, Suite 500, San Francisco, California, USA, as its primary entity, and separately lists
    Harvey AI Ireland Limited in Dublin as its EU subsidiary. The Irish entity is a subsidiary of
    the San Francisco company, not the reverse. The pages reviewed do not state the parent
    company's state of incorporation.
  source_ids: [ harvey-privacy ]
  assessed_at: 2026-10-02
openness_summary:
  text: >-
    Harvey's platform is offered as hosted enterprise software. Harvey publishes the Legal Agent
    Benchmark task set and harness on GitHub under the MIT License; this catalog has no record of
    public model weights from Harvey.
  source_ids: [ harvey-company, harvey-lab-repo, harvey-lab-license ]
