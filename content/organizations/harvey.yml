summary:
  text: >-
    Harvey develops AI software for legal and professional services firms and in-house legal
    teams. Its platform includes agents that carry out multi-step legal tasks, Vault for storing
    and bulk-analyzing document collections, and Knowledge for legal, regulatory, and tax research
    across licensed and public sources.
  source_ids: [ harvey-company, harvey-agents, harvey-vault, harvey-knowledge ]
  reviewed_at: 2026-10-02
