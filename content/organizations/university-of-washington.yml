notable_facts:
  - text: >-
      OpenThoughts, a collaboration that publishes open post-training datasets for reasoning
      and agent models (including OpenThoughts3-1.2M), lists the University of Washington among
      the institutions whose researchers lead it. The University of Washington is also among
      the affiliations on the OpenThoughts paper (arXiv 2506.04178).
    source_ids: [openthoughts-site, openthoughts-readme, openthoughts-paper]
    reviewed_at: 2026-10-01
