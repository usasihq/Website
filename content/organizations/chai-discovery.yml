  label: San Francisco, California
  country: US
  source_ids: [chai-careers, chai-terms]
other_locations: []
founded: null
sectors: [science, open-models, research]
status_note: null
products:
  - id: chai-lab-web
    name: Chai Lab web server
    kind: other
    access: >-
      Browser-based service for running Chai-1 without local setup; it requires signing in with
      an email link.
    url: https://lab.chaidiscovery.com
    source_ids: [chai-readme, chai-lab-login]
    last_reviewed: 2026-10-01
  - id: chai-2-access
    name: Chai-2 access program
    kind: other
    access: >-
      Commercial organizations request access to Chai-2 through a form; Chai says it will offer
      limited non-commercial access for academics through an early-access form.
    url: https://www.chaidiscovery.com/product
    source_ids: [chai-product]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      Chai-1 was first released in September 2024 under the Chai Discovery Community License
      Agreement, which limited use of the code, weights, and outputs to non-commercial purposes
      and incorporated an acceptable use policy. On November 27, 2024 the repository license was
      replaced with Apache License 2.0, and the README now states that code and weights are both
      under Apache 2.0.
    reviewed_at: 2026-10-01
    source_ids: [chai-license-2024-09, chai-license-history, chai-readme, chai-license]
  - text: >-
      Chai's news page describes a 2026 Pfizer license agreement giving access to its platform,
      including a model called Chai-3; no public weights for Chai-2 or Chai-3 were found in the
      pages reviewed.
    reviewed_at: 2026-10-01
    source_ids: [chai-news, chai-product, hf-chai-models]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Chai Discovery's careers page says its team works in person in San Francisco, California,
    and its website terms are governed by California law with disputes resolved in San
    Francisco courts. Its original Chai-1 license names the company as Chai Discovery, Inc. No
    regulatory filing listing a principal office was reviewed.
  source_ids: [chai-careers, chai-terms, chai-license-2024-09]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    Chai-1 code and weights are published under Apache 2.0 (see the Chai-1 record). Chai-2 is
    offered through an access program, and no public weights for later models were found, so
    Chai's offerings are not uniformly open.
  reviewed_at: 2026-10-01
  source_ids: [chai-readme, chai-license, chai-product, hf-chai-models]
hiring_url: https://www.chaidiscovery.com/careers
