slug: chai-discovery
name: Chai Discovery
legal_name:
  text: Chai Discovery, Inc. (as named in the original Chai-1 community license)
  reviewed_at: 2026-10-01
  source_ids: [chai-license-2024-09]
website: https://www.chaidiscovery.com
logo_text: CD
summary:
  text: >-
    Chai Discovery develops AI models for predicting and designing molecular structures and
    interactions for drug discovery. It released Chai-1, a structure prediction model whose code
    and weights are now under Apache 2.0, and offers its later Chai-2 design models through an
    access program rather than as downloads.
  reviewed_at: 2026-10-01
  source_ids: [chai-home, chai-readme, chai-product]
organization_roles: [model-developer, research-lab]
ownership_category: privately-held
legal_form: null
parent_org_slug: null
parent_relationship: null
