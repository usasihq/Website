profile:
  intended_users:
    text: >-
      Researchers who run Chai-1 locally or in the web server, and life-science organizations
      seeking access to Chai-2 for antibody and protein design.
    reviewed_at: 2026-10-01
    source_ids: [chai-readme, chai-product]
  access_overview:
    text: >-
      Chai-1 is installed from PyPI and downloads its weights automatically; a hosted web server
      is also offered. Chai-2 access is requested through a form.
    reviewed_at: 2026-10-01
    source_ids: [chai-readme, chai-product]
  limitations:
    text: >-
      The chai_lab package requires Linux and a CUDA GPU with bfloat16 support, and its README
      covers inference only, not training. The terms for Chai-2 access were not reviewed. This
      profile is not a full product or rights audit.
    reviewed_at: 2026-10-01
    source_ids: [chai-readme]
  resources:
