summary:
  text: >-
    Profluent is a company in Emeryville, California that trains protein language models and
    uses them to design proteins, starting with gene editors. Its public releases include the
    ProGen3 generative models under a non-commercial weights license, the Profluent-E1 encoder
    models under a permissive license with attribution requirements, and the AI-designed
    OpenCRISPR-1 gene editor.
  reviewed_at: 2026-10-01
  source_ids: [profluent-terms, profluent-opencrispr, profluent-e1-showcase, progen3-readme, e1-readme]
