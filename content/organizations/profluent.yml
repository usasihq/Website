  explanation: >-
    Profluent's website terms identify Profluent Bio Inc. as the website operator with a notice
    address in Emeryville, California, and choose California law with venue in Alameda County.
    The Profluent-E1 license also names Profluent Bio Inc. and California law. No regulatory
    filing was reviewed.
  source_ids: [profluent-terms, e1-license]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    Profluent's public model weights carry different terms: Profluent-E1 weights are under a
    custom clickthrough license that permits commercial use with attribution requirements, while
    ProGen3 and protein2pam weights are under non-commercial Creative Commons licenses. Its
    partnered work and API are not public releases. See the Profluent-E1 record.
  reviewed_at: 2026-10-01
