notable_facts:
  - text: >-
      Profluent released OpenCRISPR-1, an AI-generated Cas9-like gene editor, as an
      open-source initiative that is freely available to license for ethical research and
      commercial uses; access is requested through a form. OpenCRISPR-1 is a protein design, not
      a model release.
    reviewed_at: 2026-10-01
    source_ids: [profluent-opencrispr]
  - text: >-
      ProGen3 code is released under Apache 2.0 and its six model checkpoints (112M to 3B
      parameters) under CC BY-NC-SA 4.0, a non-commercial license. Profluent's ProGen3
      announcement directs partners to license its molecule assets or join early API access.
    reviewed_at: 2026-10-01
    source_ids: [progen3-readme, hf-profluent-models, profluent-progen3]
  - text: >-
      In September 2025 Profluent published protein2pam checkpoints on Hugging Face under CC
      BY-NC 4.0.
    reviewed_at: 2026-10-01
    source_ids: [hf-profluent-models]
eligibility:
