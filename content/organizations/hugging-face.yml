summary:
  text: >-
    Hugging Face runs the Hugging Face Hub, which hosts Git-based repositories of models,
    datasets, and demo apps (Spaces), and sells hosted inference and enterprise services. It
    also maintains open-source machine-learning libraries such as Transformers.
