status_note:
  text: >-
    On September 3, 2026 NVIDIA announced that it has agreed to acquire Hugging Face. NVIDIA's
    Form 8-K states that it entered into a definitive agreement to acquire Hugging Face, Inc. on
    September 2, 2026, and that the transaction is expected to close in the first half of 2027,
    subject to customary closing conditions including required regulatory approvals. As of
    2026-09-29 the acquisition is pending; this catalog has no source documenting that it has closed.
  source_ids: [nvidia-hf-blog, nvidia-8k-hf-2026]
products:
  - id: hugging-face-hub
    name: Hugging Face Hub
    kind: developer-tool
    access: >-
      Web platform and API hosting public and private Git-based repositories for models,
      datasets, and Spaces apps; PRO, Team, and Enterprise subscription plans are documented.
    url: https://huggingface.co/docs/hub/index
    source_ids: [hf-hub-docs]
    last_reviewed: 2026-09-29
  - id: inference-providers
    name: Inference Providers
    kind: hosted-model-api
    access: >-
      Single API, including an OpenAI-compatible chat endpoint, that routes requests to
      partner inference providers and Hugging Face's own HF Inference; includes a free tier.
    url: https://huggingface.co/docs/inference-providers/index
    source_ids: [hf-inference-providers]
    last_reviewed: 2026-09-29
  - id: inference-endpoints
    name: Inference Endpoints
    kind: inference-service
    access: >-
      Managed service for deploying a model from the Hub to production on fully managed,
      autoscaling infrastructure using engines such as vLLM, TGI, or a custom container.
    url: https://huggingface.co/docs/inference-endpoints/index
    source_ids: [hf-inference-endpoints]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      In February 2026 the ggml team, which maintains llama.cpp and the ggml library, joined
      Hugging Face; the ggml.ai site states that the company was acquired by Hugging Face in 2026.
    source_ids: [hf-ggml-blog, ggml-ai-site]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Dual-country assessment. Hugging Face has entities in both the United States and France.
    The contracting entity for its services is Hugging Face, Inc., a Delaware corporation, and
    its terms use New York law and New York courts. The privacy policy states that the company
    and its servers are located in the United States. It names Hugging Face SAS in Paris only as
    the company's "main establishment in the European Union" for GDPR purposes. Hugging Face's
    2024 submission to NIST uses a Hugging Face, Inc. letterhead with a Brooklyn, New York
    address while describing the company as "based in the U.S. and France"; its 2025 submission
    to OSTP describes it as a U.S. company. AFP reporting from September 2026 describes its
    headquarters as American. No source documents the French entity as the parent or the
    principal place of business. On that basis the U.S. entity is treated as the headquarters.
    NVIDIA's pending acquisition (a U.S. company) is noted but not relied on.
  source_ids: [hf-tos, hf-privacy, hf-nist-2024, hf-ostp-2025, afp-hf-2026, nvidia-hf-blog, nvidia-8k-hf-2026]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Hugging Face hosts public and private repositories for other developers' models and datasets
    and publishes open-source libraries, including Transformers under the Apache License 2.0.
    Hosted inference and enterprise plans are commercial services. This record does not assess
    any Hugging Face model release.
  source_ids: [hf-hub-docs, transformers-license]
