profile:
  intended_users:
    text: >-
      Hugging Face offers a free Hub account for individuals, a PRO plan for
      individual users, and Team and Enterprise plans for organizations, along
      with paid compute such as Spaces hardware and Inference Endpoints.
    source_ids: [review-hf-pricing]
    reviewed_at: 2026-10-01
  access_overview:
    text: >-
      The Hub hosts Git-based model, dataset, and Spaces repositories that users
      can download from or upload to. Inference Providers routes hosted
      inference requests to partner providers at the providers' rates, with
      monthly credits that vary by plan. Hugging Face also maintains the
      Apache 2.0-licensed Transformers library.
    source_ids: [review-hub-docs, review-ip-pricing, review-transformers]
    reviewed_at: 2026-10-01
  limitations:
    text: >-
      Repository owners set licenses in each card's metadata, and the Hub
      documentation asks users to seek out and respect each project's license;
      a repository hosted on the Hub is not thereby a Hugging Face release. This
      profile is not a complete product or rights audit.
    source_ids: [review-hub-licenses, review-hub-docs]
    reviewed_at: 2026-10-01
