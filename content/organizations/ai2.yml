ownership_evidence:
  text: Ai2 describes itself as a nonprofit AI research institute. This
    organizational status is independent of the terms of each released artifact.
  source_ids:
    - review-about
  reviewed_at: 2026-09-30
profile:
  intended_users:
    text: Olmo is presented for research and development, with model-flow resources
      for studying and building language models.
    source_ids:
      - review-olmo
    reviewed_at: 2026-09-30
  access_overview:
    text: The Olmo page links model and training-data downloads, OlmoCore training
      tools, preprocessing tools and evaluation resources. Inspect the specific
      version linked in the catalog for its actual coverage.
    source_ids:
      - review-olmo
    reviewed_at: 2026-09-30
  limitations:
    text: Availability across the project is not proof that every release has
      complete information or the same license. This profile links primary
      resources; a release-level rights and completeness audit remains separate.
    source_ids:
      - review-olmo
    reviewed_at: 2026-09-30
