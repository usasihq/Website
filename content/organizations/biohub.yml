slug: biohub
name: Biohub (Chan Zuckerberg Biohub)
legal_name:
  text: Chan Zuckerberg Biohub, Inc.
  source_ids: [biohub-terms, irs-eo-bmf-ca]
website: https://biohub.org
logo_text: BH
summary:
  text: >-
    Biohub is a biomedical research organization, founded in 2016 and supported by the Chan
    Zuckerberg Initiative, that builds AI models of biology alongside data-generation, imaging,
    and laboratory technologies. After announcing in November 2025 that the EvolutionaryScale
    team would join it, Biohub now publishes the ESM protein models and runs the Biohub
    Platform for using them.
  source_ids: [biohub-announcement, biohub-ai-models, biohub-world-model, biohub-esm-repo]
organization_roles: [research-lab, nonprofit-research]
ownership_category: nonprofit
legal_form:
  text: >-
    Corporation recognized by the IRS as tax-exempt under Section 501(c)(3); the IRS extract
    classifies it as a hospital or medical research organization under section
    170(b)(1)(A)(iii).
  source_ids: [irs-eo-bmf-ca, irs-eo-info]
