products:
  - id: biohub-platform
    name: Biohub Platform
    kind: hosted-model-api
    access: >-
      Web tools and an API at biohub.ai for running ESMC, ESMFold2, and ESM3 and for browsing
      the ESM Atlas; API tokens are created in a developer console. Biohub describes the
      platform as freely accessible, with guardrails that restrict keywords and sequences
      associated with controlled pathogens and toxins.
    url: https://biohub.ai
    source_ids: [biohub-ai, biohub-esm-repo, biohub-world-model]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      On November 6, 2025, Biohub announced that the team at EvolutionaryScale, a public benefit
      company that developed the ESM3 and ESM C protein models, would join Biohub.
      EvolutionaryScale's website now states that it is part of Biohub, and the ESM GitHub
      repository and model repositories are published under Biohub accounts.
    source_ids: [biohub-announcement, es-home, biohub-esm-repo]
  - text: >-
      In the same November 2025 announcement, Biohub said it was making three models
      (VariantFormer, CryoLens, and scLDM) freely available on its virtual cells platform.
    source_ids: [biohub-announcement]
eligibility:
  status: eligible
  basis: us-nonprofit-or-lab
  explanation: >-
    Biohub describes itself as a 501(c)(3) biomedical research organization, and its terms of
    use give a mailing address for Chan Zuckerberg Biohub, Inc. in Redwood City, California.
    The IRS exempt-organization extract for California lists Chan Zuckerberg Biohub Inc in
    Redwood City as a 501(c)(3) organization.
  source_ids: [biohub-world-model, biohub-terms, irs-eo-bmf-ca]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Biohub publishes the esm code and the weights of ESMC, ESMFold2, and the ESM3 open small
    model under the MIT license, and also offers models through the hosted Biohub Platform.
    This catalog assesses openness release by release (see the ESM release records), not for
    the organization as a whole.
  source_ids: [biohub-esm-repo, biohub-esm-license, biohub-ai]
