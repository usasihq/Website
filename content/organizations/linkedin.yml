notable_facts:
  - text: >-
      Microsoft's Form 10-K for fiscal 2026 describes LinkedIn's paid offerings as Talent
      Solutions, Marketing Solutions, Premium Subscriptions, and Sales Solutions. This catalog
      has not reviewed the AI features within those products.
    source_ids: [msft-10k-2026]
  - text: >-
      LinkedIn Engineering's December 2024 post on Liger Kernel says LinkedIn uses the kernels
      in its own LLM training infrastructure alongside FlashAttention, with Flyte scheduling
      jobs on Kubernetes.
    source_ids: [li-liger-blog]
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    Microsoft completed its acquisition of LinkedIn on December 8, 2016, and Exhibit 21 to
    Microsoft's Form 10-K for fiscal 2026 lists LinkedIn Corporation (United States) as a
    subsidiary. Microsoft Corporation is a Washington corporation headquartered in Redmond,
    Washington. LinkedIn's careers site describes its global headquarters campus as being in
    Sunnyvale, California, and LinkedIn Corporation's legal-notice mailing address is there;
    its privacy policy names LinkedIn Ireland Unlimited Company as the controller for members
    in the EU, EEA, and Switzerland.
  source_ids: [li-acquisition-2016, msft-ex21-2026, msft-10k-2026, li-careers-sunnyvale-hq, li-mailing-address, li-privacy]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    This catalog records LinkedIn's open-source Liger Kernel library, published by LinkedIn
    on GitHub under the BSD 2-Clause license. LinkedIn's consumer and business products are
    hosted services and are not assessed here.
  source_ids: [liger-repo, liger-license]
