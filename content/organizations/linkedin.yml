summary:
  text: >-
    LinkedIn is a professional networking service owned by Microsoft, which reports it within
    its Productivity and Business Processes segment. Its engineering team develops and
    maintains Liger Kernel, an open-source library of Triton GPU kernels for training large
    language models.
  source_ids: [msft-10k-2026, li-acquisition-2016, liger-repo, li-liger-blog]
