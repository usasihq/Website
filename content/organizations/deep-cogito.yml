website: https://www.deepcogito.com
logo_text: DC
summary:
  text: >-
    Deep Cogito is a San Francisco AI company that post-trains open-weight language
    models, the Cogito series, on base models from other developers. It describes its training
    approach as Iterated Distillation and Amplification (IDA), a form of iterative
    self-improvement.
  source_ids: [cogito-home, cogito-v2-blog, cogito-v2-1-blog]
