notable_facts:
  - text: >-
      The Cogito v2.1 announcement lists API access through third-party platforms (OpenRouter,
      Fireworks AI, Together AI, Ollama cloud, Baseten, RunPod), local use through Ollama or
      Unsloth, and a free web chat at chat.deepcogito.com that Deep Cogito says does not store
      chats.
    source_ids: [cogito-v2-1-blog]
  - text: >-
      Cogito releases have been built from Llama, Qwen, and DeepSeek base checkpoints released by
      other developers; Deep Cogito describes running the post-training in-house.
    source_ids: [cogito-v1-blog, cogito-v2-blog, cogito-v2-1-blog, cogito-github-readme]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Deep Cogito's homepage says it is headquartered in San Francisco, and its April 2026 SEC Form
    D filing lists Deep Cogito Inc., a Delaware corporation, with its principal place of business
    in San Francisco, California.
  source_ids: [cogito-home, sec-formd-cogito-2026-04]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Deep Cogito publishes Cogito model weights on Hugging Face without access gating, under the
    MIT License for DeepSeek-based releases and under Meta's Llama community licenses for
    Llama-based releases. Its announcements describe training at a high level; training code
    and training data were not found as public releases. This catalog assesses openness per
    release.
  source_ids: [mc-cogito-v2-1, mc-cogito-v2-405b, cogito-v2-1-blog]
