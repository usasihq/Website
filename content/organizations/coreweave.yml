products:
  - id: gpu-compute
    name: CoreWeave GPU Compute
    kind: compute-service
    access: >-
      Cloud GPU capacity on NVIDIA Blackwell, Hopper, Ampere, and Ada generation GPUs,
      provided as bare-metal servers and through CoreWeave Kubernetes Service, with reserved,
      on-demand, and spot capacity plans.
    url: https://www.coreweave.com/products/gpu-compute
    source_ids: [coreweave-gpu-compute-page, coreweave-docs]
    last_reviewed: 2026-09-29
  - id: coreweave-kubernetes-service
    name: CoreWeave Kubernetes Service (CKS)
    kind: cloud-platform
    access: >-
      Managed Kubernetes running on bare-metal nodes, preconfigured with GPU drivers, storage,
      networking, Slurm on Kubernetes (SUNK), and observability tooling.
    url: https://www.coreweave.com/products/coreweave-kubernetes-service
    source_ids: [coreweave-cks-page]
    last_reviewed: 2026-09-29
  - id: weights-and-biases
    name: Weights & Biases
    kind: developer-tool
    access: >-
      Platform for experiment tracking and model management (Models), tracing and evaluation of
      AI applications (Weave), and hosted model inference; offered as SaaS, dedicated, or
      customer-managed deployments.
    url: https://wandb.ai/site/
    source_ids: [wandb-site, coreweave-10k-2025]
    last_reviewed: 2026-09-29
