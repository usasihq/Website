summary:
  text: >-
    CoreWeave operates a cloud platform for AI workloads that combines GPU compute, managed
    Kubernetes on bare metal, storage, and networking for model training and inference. Its
    software offerings include the Weights & Biases developer platform.
  source_ids: [coreweave-10k-2025, coreweave-docs]
