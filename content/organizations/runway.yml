eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Runway AI Inc.'s 2022 SEC Form D notice lists it as a Delaware corporation with its
    principal place of business in New York, New York. Its current about page lists offices in
    New York, San Francisco, Seattle, London, Paris, Tel Aviv, and Tokyo without naming a
    headquarters, and its terms of use (updated September 2026) apply New York law and name
    state or federal courts in New York County as the exclusive venue for claims litigated in
    court.
  source_ids: [runway-form-d-2022, runway-about, runway-terms]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Runway's models are offered through its hosted app and API. The Gen-4.5 announcement does
    not mention a weights release, and this catalog has no record of current public model
    weights from Runway.
  source_ids: [runway-product, runway-api-docs, runway-gen45]
