summary:
  text: >-
    Sandia National Laboratories is a multimission U.S. Department of Energy laboratory with its
    headquarters in Albuquerque, New Mexico, and a second principal laboratory in Livermore,
    California. It is managed and operated for DOE's National Nuclear Security Administration by
    National Technology and Engineering Solutions of Sandia, LLC, a wholly owned subsidiary of
    Honeywell International Inc. Sandia lists secure AI, computing co-design, and scientific
    machine learning among its AI research areas.
  source_ids: [sandia-about, sandia-ai]
  reviewed_at: 2026-10-01
organization_roles: [research-lab]
ownership_category: public-institution
ownership_evidence:
  text: >-
    Sandia states that it is operated as a Federally Funded Research and Development Center for
    DOE's National Nuclear Security Administration under a management and operating contract
    with DOE/NNSA. Congress made Sandia a Department of Energy national laboratory in 1979.
  source_ids: [sandia-about, sandia-history]
  reviewed_at: 2026-10-01
legal_form:
  text: >-
    Federally Funded Research and Development Center managed and operated by National
    Technology and Engineering Solutions of Sandia, LLC (NTESS), a wholly owned subsidiary of
    Honeywell International Inc., for DOE's National Nuclear Security Administration under
    contract DE-NA-0003525. NTESS assumed management of Sandia on May 1, 2017.
  source_ids: [sandia-about, sandia-history]
  reviewed_at: 2026-10-01
