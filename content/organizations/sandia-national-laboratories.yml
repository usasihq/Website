notable_facts:
  - text: >-
      Sandia began in 1945 as Z Division, the ordnance design, testing, and assembly arm of Los
      Alamos National Laboratory. It became Sandia Laboratory in 1948; Sandia Corporation was
      set up in 1949 as a Western Electric company to manage it, and a second site opened in
      California's Livermore Valley in 1956. Sandia Corporation became a wholly owned subsidiary
      of Martin Marietta (later Lockheed Martin) in 1993, before NTESS took over in 2017.
    source_ids: [sandia-history]
    reviewed_at: 2026-10-01
  - text: >-
      Sandia's AI research page describes work in secure AI, computing co-design, and scientific
      machine learning, along with partnerships with industry, government, and academia that
      support DOE AI initiatives. The page also links to Sandia news on analog in-memory and
      neuromorphic computing hardware for AI.
    source_ids: [sandia-ai]
    reviewed_at: 2026-10-01
  - text: >-
      Sandia's GitHub organization publishes PyApprox, a Python library for surrogate modeling,
      uncertainty quantification, and decision-making under uncertainty with NumPy and PyTorch
      backends, under the MIT License with copyright held by NTESS.
    source_ids: [pyapprox-repo, pyapprox-license]
    reviewed_at: 2026-10-01
