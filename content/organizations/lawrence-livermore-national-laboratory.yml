notable_facts:
  - text: >-
      LLNL describes its defining responsibility as ensuring the safety, security, and
      effectiveness of the U.S. nuclear deterrent. It is one of three national laboratories
      within the National Nuclear Security Administration.
    source_ids: [llnl-about, llnl-mgmt]
    reviewed_at: 2026-10-01
  - text: >-
      LLNL states that it applies AI to strategic deterrence, stockpile modernization, materials
      discovery, fusion research, advanced manufacturing, and energy resilience, with an emphasis
      on trust, validation, and responsible use. It says its AI efforts are coordinated through
      its Data Science Institute and AI Innovation Incubator, and it describes contributions to
      DOE's Genesis Mission.
    source_ids: [llnl-ai]
    reviewed_at: 2026-10-01
  - text: >-
      LBANN (Livermore Big Artificial Neural Network toolkit) is an open-source deep learning
      training framework for high-performance computing systems. Its repository is published
      under the Apache License 2.0, with copyright held by Lawrence Livermore National Security,
      LLC and other LBANN project developers.
    source_ids: [lbann-docs, lbann-license, lbann-repo]
    reviewed_at: 2026-10-01
