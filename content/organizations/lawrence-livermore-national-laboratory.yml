slug: lawrence-livermore-national-laboratory
name: Lawrence Livermore National Laboratory
legal_name: null
website: https://www.llnl.gov
logo_text: LL
summary:
  text: >-
    Lawrence Livermore National Laboratory (LLNL) is a U.S. Department of Energy national
    laboratory in Livermore, California, that began operations in 1952. It is operated by
    Lawrence Livermore National Security, LLC for DOE's National Nuclear Security Administration.
    LLNL describes AI as a core capability that it applies alongside experimental data,
    physics-based modeling, and high-performance computing, and it publishes the LBANN deep
    learning training toolkit as open-source software.
  source_ids: [llnl-about, llnl-history, llnl-mgmt, llnl-ai, lbann-license]
  reviewed_at: 2026-10-01
organization_roles: [research-lab]
ownership_category: public-institution
ownership_evidence:
  text: >-
    LLNL describes itself as a government-owned, contractor-operated (GOCO) facility and as one
    of the 17 national laboratories overseen by the U.S. Department of Energy, which determines
    the laboratory's mission.
  source_ids: [llnl-mgmt]
  reviewed_at: 2026-10-01
legal_form:
  text: >-
    Federally Funded Research and Development Center (FFRDC) operated by Lawrence Livermore
    National Security, LLC (LLNS) under a contract with DOE's National Nuclear Security
    Administration. LLNS is a limited liability company formed to manage and operate the
    laboratory and took over its management on October 1, 2007; LLNL lists Bechtel National,
    the University of California, BWX Technologies, and Amentum on the LLNS management team.
  source_ids: [llnl-mgmt]
  reviewed_at: 2026-10-01
