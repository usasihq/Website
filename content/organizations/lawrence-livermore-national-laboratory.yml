  explanation: >-
    LLNL is a U.S. Department of Energy national laboratory at 7000 East Avenue in Livermore,
    California. It operates as a government-owned, contractor-operated FFRDC, run by Lawrence
    Livermore National Security, LLC under a contract with DOE's National Nuclear Security
    Administration. As with other government research laboratories in this catalog, the basis
    is a U.S. research laboratory.
