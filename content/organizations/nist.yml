notable_facts:
  - text: >-
      NIST released the AI Risk Management Framework (AI RMF 1.0, NIST AI 100-1) on January 26,
      2023. It is intended for voluntary use in managing risks associated with AI and is
      accompanied by an AI RMF Playbook, Roadmap, and Crosswalk. NIST added a Generative AI
      Profile (NIST-AI-600-1) on July 26, 2024, and released a concept note for an AI RMF
      profile on critical infrastructure on April 7, 2026. NIST's framework page states that
      AI RMF 1.0 is being revised as part of the White House AI Action Plan.
    source_ids: [nist-ai-rmf]
    reviewed_at: 2026-10-01
  - text: >-
      NIST's National Cybersecurity Center of Excellence (NCCoE) built Dioptra, an open-source
      test platform for assessing trustworthy characteristics of AI models. NIST announced it
      in July 2024, and its README says it supports the Measure function of the AI RMF.
    source_ids: [dioptra-why, nist-dioptra-announcement, dioptra-repo]
    reviewed_at: 2026-10-01
  - text: >-
      NIST describes its center for AI evaluation as industry's main point of contact in the
      U.S. government for testing and collaborative research on commercial systems. The center
      develops voluntary guidelines, makes voluntary agreements with private-sector developers
      and evaluators, and leads unclassified capability evaluations that focus on risks such as
      cybersecurity, biosecurity, and chemical weapons.
    source_ids: [nist-caissi, nist-caissi-guidelines]
    reviewed_at: 2026-10-01
  - text: >-
      NIST news items through September 2026 call this center the Center for AI Standards and
      Innovation (CAISI). As of October 1, 2026, nist.gov/caisi leads to a page for the Center
      for Advancing Innovation and Standards for Super Intelligence (CAISSI). A NIST topic page
      states that NIST is updating its communications to use the term "super intelligence," as
      directed by a September 29, 2026 executive order.
    source_ids: [nist-caissi, nist-caisi-news, nist-super-intelligence]
    reviewed_at: 2026-10-01
