    NIST is a U.S. federal agency within the Department of Commerce and describes itself as one
    of the country's oldest physical science laboratories. Its headquarters is at 100 Bureau
    Drive, Gaithersburg, Maryland, and its two primary campuses are in Gaithersburg and Boulder,
    Colorado.
  source_ids: [nist-about, nist-visit]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    This catalog assesses openness per artifact. Dioptra's source code is public on GitHub; its
    license file says that work by NIST employees is not subject to U.S. copyright and that
    copyright held by NIST is licensed under CC BY 4.0. The AI RMF 1.0 can be downloaded from
    NIST's website.
  source_ids: [dioptra-license, dioptra-repo, nist-ai-rmf]
  reviewed_at: 2026-10-01
