summary:
  text: >-
    The National Institute of Standards and Technology (NIST) is a U.S. federal agency founded
    in 1901 and now part of the Department of Commerce. It works on measurement science,
    standards, and technology; its AI work includes the AI Risk Management Framework, the
    Dioptra test platform, and a center for AI evaluation and voluntary guidelines.
  source_ids: [nist-about, nist-ai-rmf, dioptra-docs, nist-caissi]
  reviewed_at: 2026-10-01
