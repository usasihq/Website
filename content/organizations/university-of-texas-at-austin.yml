notable_facts:
  - text: >-
      The Robot Perception and Learning Lab at UT Austin studies methods that let robots perceive,
      reason about, and learn tasks in unstructured environments, and builds computational
      frameworks for embodied AI, drawing on robotics, machine learning, and computer vision.
    source_ids: [rpl-site]
    reviewed_at: 2026-10-01
  - text: >-
      The lab's GitHub organization publishes code for its research, including AMAGO, a
      framework for off-policy reinforcement learning with long-term memory that is released
      under the MIT License, and deoxys_control, a real-time controller library for Franka Emika
      Panda robots.
    source_ids: [rpl-github, amago-repo, amago-license]
    reviewed_at: 2026-10-01
