summary:
  text: >-
    The University of Texas at Austin is a public university in Austin, Texas, founded in 1883
    and one of the institutions of The University of Texas System. Its AI research groups
    include the Robot Perception and Learning (RPL) Lab, which works on robot learning and
    embodied AI and publishes research code in its GitHub organization.
