eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The headquarters label rests on the EU trader information shown on the Ireland App Store
    listing for Midjourney's niji・journey app, in which Midjourney, Inc. identifies itself as a
    trader and gives an address at 611 Gateway Blvd Ste 120, South San Francisco, California,
    United States; the listing does not describe this address as a headquarters. Separately,
    a June 2025 federal copyright complaint filed against the company by Disney and Universal
    alleges that Midjourney, Inc. is a Delaware corporation with its principal place of
    business in San Francisco, California. Midjourney's main website and documentation block
    automated access, so its own terms and help pages could not be read for this review.
  source_ids: [niji-app-store-ie, disney-v-midjourney-complaint]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Midjourney's models are offered through its hosted service and app. Its GitHub
    organization holds forks of third-party libraries and a deprecated documentation repository
    rather than its own model or code releases, and this catalog has no record of public
    Midjourney model weights.
  source_ids: [mj-updates, mj-github]
