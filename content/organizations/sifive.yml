products:
  - id: sifive-intelligence
    name: SiFive Intelligence family (X100, X200, X300 series)
    kind: hardware
    access: >-
      Licensable RISC-V processor IP cores with vector units of different widths, for use as
      standalone vector CPUs or as control units for a customer's own accelerator through SiFive's
      coprocessor interfaces; SiFive pairs them with an AI/ML software stack based on IREE.
    url: https://www.sifive.com/cores/intelligence
    source_ids: [sf-intelligence, sf-gen2-release]
    last_reviewed: 2026-10-01
  - id: sifive-intelligence-xm
    name: SiFive Intelligence XM Series
    kind: hardware
    access: >-
      Licensable cluster IP that combines four X300-series cores with a matrix engine for AI
      workloads; the cluster can work alongside a RISC-V, x86, or Arm host CPU or without one.
    url: https://www.sifive.com/cores/intelligence-xm-series
    source_ids: [sf-xm, sf-gen2-release]
    last_reviewed: 2026-10-01
  - id: bigsky-sf-2u870
    name: BigSky SF-2U870 datacenter development platform
    kind: hardware
    access: >-
      Integrated RISC-V development platform in a rackable 2U server form factor, intended for
      porting, tuning, and testing data center software on RISC-V.
    url: https://www.sifive.com/solutions/data-center
    source_ids: [sf-datacenter]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      In September 2025 SiFive launched its second-generation Intelligence family: two new cores
      (X160 Gen 2 and X180 Gen 2) and updated X280, X390, and XM cores.
    source_ids: [sf-gen2-release]
    reviewed_at: 2026-10-01
  - text: >-
      Besides its U.S. offices, SiFive's locations page lists offices or subsidiaries in China,
      France, India, Japan, South Korea, Taiwan, and the United Kingdom.
    source_ids: [sf-locations]
    reviewed_at: 2026-10-01
