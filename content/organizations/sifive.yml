summary:
  text: >-
    SiFive designs and licenses processor IP based on the open RISC-V instruction set. Its
    AI-related products include the SiFive Intelligence family of cores with vector processing
    and, in the XM series, matrix processing, and it offers the BigSky development server for
    porting data center software to RISC-V.
  source_ids: [sf-about, sf-intelligence, sf-xm, sf-datacenter]
  reviewed_at: 2026-10-01
