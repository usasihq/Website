summary:
  text: >-
    Crusoe builds and operates data centers for AI workloads and runs Crusoe Cloud, a GPU cloud
    platform with managed Kubernetes, Slurm, storage, and networking. It also offers managed
    inference and fine-tuning services for open models through Crusoe Intelligence Foundry.
  source_ids: [crusoe-about, crusoe-cloud, crusoe-managed-inference, crusoe-data-centers]
