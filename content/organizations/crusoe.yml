products:
  - id: crusoe-cloud
    name: Crusoe Cloud
    kind: cloud-platform
    access: >-
      Cloud platform offering NVIDIA and AMD GPUs with on-demand, spot, and reserved capacity,
      Crusoe Managed Kubernetes, managed Slurm, S3-compatible storage, and InfiniBand and
      Ethernet networking; resources are managed through a console, CLI, APIs, Terraform, or SDKs.
    url: https://www.crusoe.ai/cloud
    source_ids: [crusoe-cloud]
    last_reviewed: 2026-10-01
  - id: crusoe-managed-inference
    name: Crusoe Managed Inference (Crusoe Intelligence Foundry)
    kind: inference-service
    access: >-
      Hosted inference for open models from several developers: a usage-billed serverless API,
      self-serve deployments on dedicated GPUs billed by the hour with an OpenAI-compatible API,
      and tailored deployments arranged with Crusoe; self-serve deployments can also serve models
      customized with Crusoe's Serverless Fine-Tuning.
    url: https://www.crusoe.ai/cloud/managed-inference
    source_ids: [crusoe-managed-inference, crusoe-sft-release]
    last_reviewed: 2026-10-01
  - id: crusoe-ai-data-centers
    name: Crusoe AI data centers
    kind: other
    access: >-
      Crusoe designs, builds, and operates data centers for AI workloads, including direct
      liquid-to-chip cooling, and makes some components in-house; partners engage through a
      contact request.
    url: https://www.crusoe.ai/data-centers
    source_ids: [crusoe-data-centers]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      Crusoe's company timeline says that in 2025 it divested its bitcoin mining business to NYDIG
      to focus on AI infrastructure, and acquired the GPU memory optimization startup Atero,
      opening an office in Tel Aviv.
    source_ids: [crusoe-about]
    reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Crusoe's current recruiting privacy notice (version 1.4, effective March 12, 2026) describes
    the company as headquartered in Denver, Colorado, and gives a Denver postal address for
    Crusoe Technologies LLC. Its website privacy notice names Crusoe Energy Systems LLC, a Delaware
    limited liability company at the same Denver address. Crusoe also lists a San Francisco office,
    and recent press releases carry a San Francisco dateline; both cities are in the United States.
    The same notice says the Denver-headquartered company has offices, affiliates, and subsidiaries
    elsewhere; these include a European headquarters in Dublin and an office in Tel Aviv.
  source_ids: [crusoe-legal, crusoe-careers-culture, crusoe-sft-release, crusoe-dublin, crusoe-about]
