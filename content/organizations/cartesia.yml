website: https://cartesia.ai
logo_text: C
summary:
  text: >-
    Cartesia develops speech models and offers them through an API, including the Sonic
    text-to-speech and Ink speech-to-text models, along with a platform for building and
    hosting voice agents. Its research centers on state space model (SSM) architectures, and it
    publishes some SSM language models on Hugging Face.
  source_ids: [cartesia-docs-overview, cartesia-home, hf-cartesia, llamba-8b-card]
  reviewed_at: 2026-10-01
organization_roles: [model-developer, developer-platform]
