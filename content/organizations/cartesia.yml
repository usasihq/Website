products:
  - id: sonic
    name: Sonic
    kind: hosted-model-api
    access: >-
      Text-to-speech model family available through the Cartesia API and browser Playground;
      the current documented model ID is sonic-3.6. Cartesia lists a Free plan with monthly
      credits, paid Pro, Startup, and Scale plans, and custom Enterprise pricing.
    url: https://docs.cartesia.ai/build-with-cartesia/tts-models/latest
    source_ids: [cartesia-sonic-docs, cartesia-pricing]
    last_reviewed: 2026-10-01
  - id: ink
    name: Ink
    kind: hosted-model-api
    access: >-
      Streaming speech-to-text model (Ink 2) with turn detection, available through the same
      Cartesia API and API keys as Sonic.
    url: https://docs.cartesia.ai/get-started/overview
    source_ids: [cartesia-docs-overview]
    last_reviewed: 2026-10-01
  - id: line
    name: Line
    kind: developer-tool
    access: >-
      Voice-agent platform that runs agent code in Cartesia's managed runtime with Ink and Sonic
      by default; its Python SDK is published on GitHub under Apache 2.0.
    url: https://docs.cartesia.ai/line/introduction
    source_ids: [cartesia-line-docs, line-repo, line-license]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      Cartesia's Edge repository, licensed under Apache 2.0, provides SSM language models for
      on-device use, including Rene and the Llamba family, with PyTorch, Apple silicon (Metal),
      and MLX packages.
    source_ids: [edge-repo, edge-license]
    reviewed_at: 2026-10-01
  - text: >-
      The Llamba paper describes the models as distillations of Llama-3.x into the Mamba
      architecture. The Llamba-8B model card on Hugging Face gives an Apache 2.0 license.
    source_ids: [llamba-paper, llamba-8b-card]
    reviewed_at: 2026-10-01
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Cartesia's terms of service identify Cartesia AI, Inc. as the operator of its services, give
    a postal address in San Francisco, California, and apply California law. No non-U.S.
    parent or headquarters is documented on the pages reviewed.
  source_ids: [cartesia-terms]
  assessed_at: 2026-10-01
openness_summary:
  text: >-
    Cartesia's Sonic and Ink speech models are offered as hosted services through its API; the
    pages reviewed do not describe public weights for them. Cartesia publishes Apache 2.0 client
    SDKs, the Line voice-agent SDK, and the Edge library, and has posted Llamba language-model
    weights on Hugging Face under Apache 2.0. Llamba is distilled from Meta's Llama-3.x models.
  source_ids: [cartesia-docs-overview, line-license, edge-license, cartesia-python-license, llamba-8b-card, llamba-paper]
  reviewed_at: 2026-10-01
