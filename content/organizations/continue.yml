eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Continue's terms of service (last modified October 13, 2025) name Continue Dev, Inc. as the
    provider, give a San Francisco, California street address for its copyright agent, deem the
    service based in California, and set San Francisco as the venue for disputes. Y Combinator's
    directory (Summer 2023 batch) also lists the company in San Francisco, and the privacy notice
    (February 2026) names Continue Dev, Inc. as the operator. The acquirer's service is provided by
    Anysphere, Inc. under Cursor's terms, but this record does not assess Anysphere's location.
    The terms do not use the word "headquarters"; the San Francisco address is the only company
    address found.
  source_ids: [continue-tos, yc-continue, continue-privacy, cursor-tos]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Continue's coding agent (VS Code extension, JetBrains plugin, and CLI) remains available under
    the Apache 2.0 license in a read-only repository; see the Continue extension record. The
    company no longer offers the product as an active service.
  source_ids: [continue-readme, continue-license, continue-home]
