status_note:
  text: >-
    Acquired by Cursor in 2026; the continue.dev homepage now states this. Cursor's terms of
    service name Anysphere, Inc. as its provider. The New Stack reported on June 22, 2026 that the
    homepage changed around June 16, that users had until July 15 to export data, that recurring
    billing was turned off, and that the product appeared to be discontinued. Continue's
    repository says it is no longer actively maintained and is read-only after a final 2.0.0
    release.
  source_ids: [continue-home, cursor-tos, tns-continue, continue-readme]
