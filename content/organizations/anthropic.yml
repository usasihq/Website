deep_dive:
  reviewed_at: 2026-10-11
  overview:
    - text: Anthropic PBC describes itself as an AI safety and research company that builds AI systems
        people can rely on and studies the opportunities and risks of AI. It is a public benefit
        corporation whose stated purpose is "the responsible development and maintenance of advanced
        AI for the long-term benefit of humanity." Its privacy policy lists Anthropic PBC at a San
        Francisco, California address.
      source_ids:
        - anthropic-company
        - anthropic-privacy
    - text: Anthropic develops the Claude family of AI models and offers them as hosted services; its
        Hugging Face organization lists no model repositories. As of October 2026 its model
        documentation lists four current models (Claude Fable 5.1, Claude Opus 5.5, Claude Sonnet
        5.5, and Claude Haiku 5.5), each with a 1M-token context window. A separate model, Claude
        Mythos 5.1, has the same capabilities as Claude Fable 5.1 but is offered only to
        organizations that pass Anthropic's verification programs.
      source_ids:
        - review-models-overview
        - claude-mythos-5-1-docs
        - review-hf-anthropic
    - text: People can use Claude through the Claude app on the web, desktop, and mobile, through the
        Claude Code coding agent, and through the Claude Platform API. Developers can also reach
        Claude models on Amazon Bedrock, Google Cloud, Microsoft Foundry, and Claude Platform on
        AWS. Subscription plans range from Free to Enterprise; this profile does not list prices.
      source_ids:
        - claude-download
        - claude-code-docs-overview
        - claude-platform-features
        - review-claude-pricing
    - text: Anthropic publishes a Responsible Scaling Policy (version 3.4 took effect on July 8, 2026),
        system cards for its models, periodic risk reports, a Transparency Hub, a Usage Policy, and
        a public constitution that describes the values it intends Claude to hold. A Long-Term
        Benefit Trust, which holds a special class of stock, takes part in electing the company's
        board.
      source_ids:
        - anthropic-rsp
        - anthropic-transparency-hub
        - anthropic-constitution-2026
        - review-usage-policy
        - anthropic-ltbt
        - anthropic-company
    - text: Anthropic has offered Claude to U.S. government agencies, including custom Claude Gov models
        for national security customers. In 2026 the Department of War excluded Claude from its
        supply chain after a contract dispute over use restrictions; court records show that a
        federal district court set aside one designation in August 2026, while the D.C. Circuit
        denied Anthropic's challenge to a separate exclusion on September 25, 2026.
      source_ids:
        - anthropic-claude-gov
        - dccir-anthropic-v-dow
  sections:
    - id: business-overview
      title: What Anthropic does
      intro:
        text: Anthropic says it is dedicated to building AI systems that people can rely on and to producing
          research about the opportunities and risks of AI.
        source_ids:
          - anthropic-company
      items:
        - text: Its main product line is Claude, a family of large language models that take text and images
            as input and produce text. Anthropic offers the models as hosted services; its Hugging
            Face organization lists datasets but no model repositories.
          source_ids:
            - review-models-overview
            - review-hf-anthropic
        - text: Anthropic sells Claude plans for individuals (Free, Pro, and Max), for organizations (Team and
            Enterprise), and for schools (Education), and it offers pay-as-you-go API access on the
            Claude Platform.
          source_ids:
            - review-claude-pricing
        - text: "Its research page names five research teams: Alignment, Economics, Frontier Red Team (which
            studies what new models mean for cybersecurity, biosecurity, and autonomous systems),
            Interpretability (which studies how models work inside), and Societal Impacts."
          source_ids:
            - anthropic-research
        - text: Anthropic introduced the Model Context Protocol (MCP) in November 2024 as an open standard for
            connecting AI applications to outside data and tools, and in December 2025 donated it to
            the Agentic AI Foundation, a directed fund under the Linux Foundation.
          source_ids:
            - anthropic-mcp-intro
            - anthropic-mcp-donation
        - text: Since September 2026 Anthropic has run verification programs for cybersecurity and life
            sciences work. Vetted organizations in these programs get access to models with
            safeguards adjusted for their field, including Claude Mythos 5.1.
          source_ids:
            - anthropic-cvp
            - anthropic-lsvp
        - text: Anthropic also works with governments, including Claude Gov models for U.S. national security
            customers and commitments announced in October 2026 to support the federal Genesis
            Mission for AI-driven science.
          source_ids:
            - anthropic-claude-gov
            - anthropic-genesis-commitment
    - id: models
      title: Claude models
      intro:
        text: Anthropic's models overview lists Claude Fable 5.1, Claude Opus 5.5, Claude Sonnet 5.5, and
          Claude Haiku 5.5 as the current models. All support text and image input, text output,
          vision, tool use, and a 1M-token context window, with a maximum output of 128K tokens.
        source_ids:
          - review-models-overview
      items:
        - text: The documentation suggests Claude Opus 5.5 as the default starting point and Claude Fable 5.1
            for demanding reasoning and long-horizon agentic work. Claude Haiku 5.5 is aimed at
            high-volume tasks such as classification, extraction, and routing.
          source_ids:
            - review-models-overview
        - text: Anthropic added the Fable and Mythos lines in June 2026. It describes Mythos-class models as a
            tier above its Opus class. Claude Fable 5 was the general-release version. Claude Mythos
            5 was the same underlying model with some safeguards lifted, for vetted partners.
          source_ids:
            - anthropic-fable-mythos-5
        - text: Claude Fable 5.1 and Claude Mythos 5.1, released September 1, 2026, are the same model with
            different safeguard levels. Mythos 5.1's safeguards are tuned for cybersecurity and life
            sciences work, and only verified organizations can use it.
          source_ids:
            - anthropic-fable-mythos-5-1
            - claude-mythos-5-1-docs
        - text: 'Current models use "adaptive thinking": the model decides how much to reason before
            answering, guided by an effort setting. On Claude Fable 5.1 and Claude Opus 5.5 this
            thinking is always on.'
          source_ids:
            - review-models-overview
        - text: "Anthropic sorts models into four lifecycle stages: Active, Legacy, Deprecated, and Retired.
            It gives at least 60 days' notice before retiring a publicly released model. Its
            retirement dates apply to the platforms Anthropic operates; Amazon Bedrock and Google
            Cloud set their own."
          source_ids:
            - claude-model-deprecations
        - text: Legacy models that are still available include Claude Fable 5, Claude Opus 5, Claude Opus 4.8,
            4.7, 4.6, and 4.5, Claude Sonnet 5, Claude Sonnet 4.6, and Claude Haiku 4.5.
          source_ids:
            - review-models-overview
        - text: Recent retirements include Claude Haiku 3.5 and Claude Sonnet 3.7 (February 19, 2026), Claude
            Haiku 3 (April 20, 2026), Claude Opus 4 and Claude Sonnet 4 (June 15, 2026), and Claude
            Opus 4.1 (August 5, 2026). Claude Sonnet 4.5 was deprecated on September 30, 2026 and is
            due to retire on November 30, 2026.
          source_ids:
            - claude-model-deprecations
        - text: Claude Mythos Preview was offered from April 2026 through Project Glasswing, an effort to find
            and fix flaws in critical software. Anthropic said it did not plan to make the model
            generally available, and it was deprecated on June 9, 2026.
          source_ids:
            - anthropic-glasswing
            - claude-model-deprecations
        - text: Earlier generations were Claude and Claude Instant (March 2023), Claude 2 (July 2023), Claude
            2.1 (November 2023), the Claude 3 family (March 2024), Claude 3.5 Sonnet (June 2024),
            Claude 3.7 Sonnet (February 2025), and Claude Opus 4 and Claude Sonnet 4 (May 2025). All
            of these have since been retired.
          source_ids:
            - anthropic-introducing-claude
            - anthropic-claude-2
            - anthropic-claude-2-1
            - anthropic-claude-3-family
            - anthropic-claude-3-5-sonnet
            - anthropic-claude-3-7-sonnet
            - anthropic-claude-4
            - claude-model-deprecations
        - text: In November 2025 Anthropic committed to keep the weights of all publicly released models, and
            of models used significantly inside the company, for at least as long as the company
            exists. It also said it would interview models about their development before
            deprecating them.
          source_ids:
            - anthropic-deprecation-commitments
    - id: apps-and-plans
      title: Claude apps, plans, and features
      intro:
        text: The Claude app runs on the web, on desktop (macOS, Windows, and a Linux beta for Ubuntu and
          Debian), and on iOS and Android.
        source_ids:
          - claude-download
          - claude-product-overview

          - claude-code-docs-overview
      items:
        - text: Plans are Free, Pro, Max (with two usage tiers), Team (Standard and Premium seats),
            Enterprise, and Education. Team and Enterprise add admin tools such as single sign-on,
            and Enterprise adds features such as audit logs, SCIM, and a Compliance API.
          source_ids:
            - review-claude-pricing
        - text: App features include Projects, Artifacts, memory, connectors (including custom MCP
            connectors), skills, plugins, web search, voice, scheduled tasks, and file creation.
          source_ids:
            - claude-product-overview
            - review-claude-pricing
        - text: Research is a mode on paid plans in which Claude runs a series of searches and returns an
            answer with citations. It can search the web and connected Google Workspace apps such as
            Gmail, Google Calendar, and Google Docs.
          source_ids:
            - claude-research-support
        - text: On July 10, 2026 memory changed from a daily summary to separate, labeled entries that Claude
            updates during conversations.
          source_ids:
            - claude-apps-release-notes
        - text: Claude Cowork brings Claude Code's agentic abilities to non-coding work, such as organizing
            files and producing spreadsheets and slides. Anthropic's January 13, 2026 post introducing
            Labs says Cowork launched as a research preview the previous day. On September 16, 2026
            Anthropic began merging Cowork and chat into one Claude experience, starting with Pro and Max.
          source_ids:
            - claude-cowork-support
            - claude-cowork-merge
            - anthropic-news-introducing-labs
        - text: Claude Design, a product for creating designs, prototypes, and slides, launched as an
            Anthropic Labs research preview on April 17, 2026. Since September 16, 2026, Claude
            Design, Claude Slides, and Claude Docs work inside any conversation as Artifacts.
          source_ids:
            - claude-design-news
            - claude-cowork-merge
            - claude-apps-release-notes
        - text: Claude in Chrome is a browser extension that lets Claude read pages, click, and fill in forms.
            It began as a pilot in August 2025 and became generally available on every paid plan on
            August 26, 2026. It does not yet run on mobile or on other Chromium browsers.
          source_ids:
            - claude-for-chrome-pilot
            - claude-in-chrome-ga
        - text: Claude for Microsoft 365 puts Claude inside Office apps. The Excel, PowerPoint, and Word
            add-ins are generally available on all paid plans, and the Outlook add-in is in beta.
          source_ids:
            - claude-m365
        - text: Claude Science, launched in beta on June 30, 2026, is described by Anthropic as "an AI
            workbench for scientists." It bundles common research tools and keeps the code behind
            each figure.
          source_ids:
            - claude-science-news
        - text: Claude Tag, a beta for Team and Enterprise plans launched June 23, 2026, lets anyone in a
            Slack channel hand tasks to Claude by tagging @Claude. It replaces the earlier Claude in
            Slack app.
          source_ids:
            - claude-tag-news
        - text: Claude Security, formerly a research preview called Claude Code Security, entered public beta
            for Enterprise customers on April 30, 2026. It scans codebases for security flaws and
            suggests patches.
          source_ids:
            - claude-security-beta
    - id: developers
      title: Claude Code, Agent SDK, and the Claude Platform
      intro:
        text: Claude Code is an agentic coding tool. It reads a codebase, edits files, runs commands, and
          works with developer tools from the terminal, IDEs, a desktop app, and the browser.
        source_ids:
          - claude-code-docs-overview
      items:
        - text: Claude Code launched as a limited research preview on February 24, 2025 and became generally
            available on May 22, 2025. It now also runs in VS Code, JetBrains IDEs, Slack, GitHub
            Actions, and GitLab CI/CD.
          source_ids:
            - anthropic-claude-3-7-sonnet
            - anthropic-claude-4
            - claude-code-docs-overview
        - text: Claude Code surfaces generally require a Claude subscription or a Claude Console account. The
            terminal tool, VS Code, and JetBrains can also use third-party cloud providers.
          source_ids:
            - claude-code-docs-overview
        - text: The Claude Agent SDK, released with Claude Sonnet 4.5 on September 29, 2025, offers the same
            tools, agent loop, and context management that power Claude Code, for Python and
            TypeScript. Its use is governed by Anthropic's Commercial Terms of Service.
          source_ids:
            - anthropic-sonnet-4-5
            - claude-agent-sdk-docs
        - text: Claude Managed Agents, in beta, is a hosted agent harness. Sessions run in an
            Anthropic-managed cloud sandbox or in a self-hosted sandbox on the customer's own
            infrastructure.
          source_ids:
            - claude-managed-agents-docs
        - text: The Claude Platform API groups its features into model capabilities, tools, tool
            infrastructure, context management, and files. Examples include batch processing,
            citations, prompt caching, token counting, structured outputs, and the Files API.
          source_ids:
            - claude-platform-features
        - text: Built-in tools include web search, web fetch, and code execution, which run on Anthropic's
            servers, and bash, text editor, memory, computer use, and browser use, which run in the
            developer's environment. Computer use left beta and a browser use tool launched on
            August 19, 2026.
          source_ids:
            - claude-platform-features
            - claude-platform-release-notes
        - text: Agent Skills package instructions and scripts, with pre-built skills for PowerPoint, Excel,
            Word, and PDF. A beta MCP connector lets the Messages API call remote MCP servers
            directly.
          source_ids:
            - claude-platform-features
        - text: Besides Anthropic's own API, Claude models are on Amazon Bedrock (run by AWS), Google Cloud
            (run by Google), Microsoft Foundry (run by Anthropic on Azure), and Claude Platform on
            AWS (run by Anthropic, with AWS sign-in and billing). Feature availability differs by
            platform.
          source_ids:
            - claude-platform-features
            - claude-platform-on-aws-docs
            - claude-foundry-docs
        - text: On Microsoft Foundry, customers choose between "Hosted on Azure," where inference runs on
            Azure infrastructure, and "Hosted on Anthropic," which offers all Claude models
            available on Foundry.
          source_ids:
            - claude-foundry-docs
    - id: research-safety-policies
      title: Research, safety, and policies
      intro:
        text: Anthropic's Responsible Scaling Policy (RSP) sets capability thresholds and the safeguards
          required when models reach them. Version 3.4 took effect on July 8, 2026.
        source_ids:
          - anthropic-rsp
      items:
        - text: "RSP versions and effective dates: 1.0 (September 19, 2023), 2.0 (October 15, 2024), 2.1
            (March 31, 2025), 2.2 (May 14, 2025), 3.0 (February 24, 2026), 3.1 (April 2, 2026), 3.2
            (April 29, 2026), 3.3 (May 26, 2026), and 3.4 (July 8, 2026). Version 3.0 was a full
            rewrite that added Frontier Safety Roadmaps and Risk Reports."
          source_ids:
            - anthropic-rsp
        - text: On May 22, 2025 Anthropic turned on AI Safety Level 3 (ASL-3) protections for Claude Opus 4.
            These included classifiers that screen inputs and outputs for chemical, biological,
            radiological, and nuclear weapons content, plus security controls meant to prevent theft
            of model weights.
          source_ids:
            - anthropic-asl3
        - text: The Transparency Hub's Model Report summarizes each model's capabilities, safety evaluations,
            and safeguards, and links to its system card. It states that Claude Opus 5, Claude Opus
            5.5, Claude Fable 5.1, and Claude Mythos 5.1 were deployed with ASL-3 protections.
          source_ids:
            - anthropic-transparency-hub
        - text: Under RSP 3.0, Anthropic publishes Risk Reports covering all of its deployed models. Redacted
            reports are dated February 2026 and August 2026; the August report covers the period up
            to July 15, 2026.
          source_ids:
            - anthropic-rsp
        - text: On Claude Fable models, classifiers detect certain cybersecurity, biology, chemistry, and
            model-distillation requests and hand them to another Claude model. Anthropic requires
            30-day data retention for traffic on Mythos-class models and says this data is used for
            safety, not training.
          source_ids:
            - anthropic-fable-mythos-5
        - text: Since September 1, 2026, text generated by Claude Fable 5.1 and Claude Mythos 5.1 carries an
            Anthropic watermark, and media files from code execution carry C2PA Content Credentials.
            Anthropic ties the watermark to EU AI Act compliance and is previewing a detection API
            privately.
          source_ids:
            - claude-platform-release-notes
            - anthropic-fable-mythos-5-1
        - text: On October 8, 2026 Anthropic announced Usage Policy changes taking effect November 12, 2026.
            They include a new section on deceptive campaigns, wider weapons rules that cover arming
            drones, and requirements for models that control hardware able to act physically.
          source_ids:
            - anthropic-usage-policy-2026-update
            - review-usage-policy
        - text: On January 22, 2026 Anthropic published a new constitution for Claude, describing the values
            and behavior it intends for Claude. It is released under a CC0 1.0 public domain
            dedication.
          source_ids:
            - anthropic-constitution-2026
        - text: The Anthropic Economic Index, launched February 10, 2025, studies how AI use affects work and
            the economy, and its initial dataset was published on Hugging Face. 2026 reports include
            "Learning curves" (March 24) and "Cadences" (June 26).
          source_ids:
            - anthropic-economic-index-launch
            - anthropic-economics-team
        - text: Anthropic released Petri, an open-source tool for testing models for behaviors such as
            deception and sycophancy. On May 7, 2026 it handed development to Meridian Labs, an AI
            evaluation nonprofit.
          source_ids:
            - anthropic-petri-donation
        - text: Anthropic's privacy policy names Anthropic PBC as the company behind its services and
            Anthropic Ireland, Limited as data controller for people in the EEA, the UK, and
            Switzerland.
          source_ids:
            - anthropic-privacy
    - id: infrastructure-and-compute
      title: Infrastructure and compute
      intro:
        text: Anthropic says it trains and runs Claude on AWS Trainium, Google TPUs, and NVIDIA GPUs, and
          picks the chip that suits each workload.
        source_ids:
          - anthropic-google-broadcom-compute
      items:
        - text: On April 20, 2026 Anthropic and Amazon agreed on up to 5 gigawatts of capacity for training
            and running Claude, built on Amazon's Trainium and Graviton chips. Anthropic calls AWS
            its primary training and cloud provider for mission-critical workloads. The two
            companies built the Project Rainier compute cluster together.
          source_ids:
            - anthropic-amazon-compute
        - text: The same Amazon agreement covered more inference capacity in Asia and Europe and bringing the
            full Claude Platform into AWS.
          source_ids:
            - anthropic-amazon-compute
        - text: On April 6, 2026 Anthropic signed an agreement with Google and Broadcom for multiple gigawatts
            of next-generation TPU capacity, expected to come online from 2027. The bulk of it will
            be in the United States.
          source_ids:
            - anthropic-google-broadcom-compute
        - text: On May 6, 2026 Anthropic agreed to use all of the compute capacity at SpaceX's Colossus 1 data
            center, over 300 megawatts. The same post doubled Claude Code's five-hour usage limits
            on Pro, Max, Team, and seat-based Enterprise plans.
          source_ids:
            - anthropic-spacex-compute
        - text: Claude Platform on AWS runs on infrastructure that Anthropic manages. For workspaces created
            from September 18, 2026 on, requests, model inference, and stored workspace content are
            processed on AWS infrastructure.
          source_ids:
            - claude-platform-on-aws-docs
        - text: Developers can use the inference_geo setting to choose where inference runs, either "global"
            or "us."
          source_ids:
            - claude-platform-features
        - text: When it announced its Sydney office in March 2026, Anthropic said it was exploring local
            compute capacity in Australia through third-party partners.
          source_ids:
            - anthropic-sydney-office
    - id: corporate-structure-and-governance
      title: Corporate structure and governance
      intro:
        text: Anthropic PBC is a Delaware public benefit corporation. The Long-Term Benefit Trust works
          alongside that status to tie the company's governance to its mission.
        source_ids:
          - anthropic-ltbt
          - anthropic-company
      items:
        - text: The board of directors is elected by stockholders and by the Long-Term Benefit Trust. The
            company page lists Dario Amodei, Daniela Amodei, Yasmin Razavi, Reed Hastings, Chris
            Liddell, and Vas Narasimhan as directors.
          source_ids:
            - anthropic-company
        - text: When it was announced in 2023, the Trust was set up as an independent body of trustees with no
            financial interest in Anthropic. It holds Class T stock, which lets it elect and remove
            some directors, a share planned to grow to a board majority.
          source_ids:
            - anthropic-ltbt
        - text: The company page lists the current trustees of the Long-Term Benefit Trust as Neil Buddy Shah,
            Richard Fontaine, and Ben Bernanke.
          source_ids:
            - anthropic-company
        - text: Anthropic Ireland, Limited acts as data controller for the EEA, the UK, and Switzerland.
          source_ids:
            - anthropic-privacy
        - text: Country leaders named in Anthropic announcements include Hidetoshi Tojo (Representative
            Director and President of Anthropic in Japan), KiYoung Choi (Representative Director of
            Korea), Irina Ghose (Managing Director of India), and Chris Ciauri (Managing Director of
            International).
          source_ids:
            - anthropic-tokyo-office
            - anthropic-seoul-office
            - anthropic-bengaluru-office
            - anthropic-paris-munich
        - text: "Anthropic has handed some projects to outside stewards: the Model Context Protocol to the
            Agentic AI Foundation in December 2025, and the Petri auditing tool to Meridian Labs in
            May 2026."
          source_ids:
            - anthropic-mcp-donation
            - anthropic-petri-donation
    - id: government-and-public-sector
      title: Government and national security
      intro:
        text: Anthropic makes custom Claude Gov models for U.S. national security customers. Access is
          limited to those who work in classified environments.
        source_ids:
          - anthropic-claude-gov
      items:
        - text: On August 12, 2025 Anthropic offered Claude for Enterprise and Claude for Government to all
            three branches of the U.S. government for one year through the GSA OneGov program. It
            said models offered through Claude for Government are certified for FedRAMP High.
          source_ids:
            - anthropic-three-branches
        - text: On February 27, 2026 the General Services Administration (GSA) removed Anthropic from USAi.gov
            and its Multiple Award Schedule, citing a presidential directive to stop using
            Anthropic's technology.
          source_ids:
            - gsa-feb-2026-directive
        - text: On March 3, 2026 the Secretary of War made a determination under the Federal Acquisition
            Supply Chain Security Act to exclude Claude from the Department of War's supply chain.
            According to the D.C. Circuit, this followed Anthropic's refusal to relax contract terms
            that barred using Claude for lethal autonomous warfare or domestic surveillance.
          source_ids:
            - dccir-anthropic-v-dow
        - text: On March 26, 2026 the U.S. District Court for the Northern District of California (Case No.
            26-cv-01996-RFL) issued a preliminary injunction blocking the government from carrying
            out the directive. On April 3 GSA said it would restore Anthropic's earlier status.
          source_ids:
            - gsa-injunction-statement
        - text: According to the D.C. Circuit's opinion, the Northern District of California decided its case
            on August 27, 2026 and set aside the department's designation of Anthropic as a "supply
            chain risk" under 10 U.S.C. § 3252.
          source_ids:
            - dccir-anthropic-v-dow
        - text: On September 25, 2026 the U.S. Court of Appeals for the D.C. Circuit (No. 26-1049) denied
            Anthropic's petitions for review of the separate exclusion under 41 U.S.C. § 4713. One
            judge dissented.
          source_ids:
            - dccir-anthropic-v-dow
        - text: As of October 11, 2026, GSA's artificial intelligence page carried an alert that GSA will
            remove any system integrations with Anthropic by August 27, 2026. The page did not give
            a reason.
          source_ids:
            - gsa-ai-page
        - text: On October 8, 2026 Anthropic announced commitments to the federal Genesis Mission. Over three
            years it plans to provide Claude, Claude Code, and API credits to research projects and
            to work with agencies and national laboratories.
          source_ids:
            - anthropic-genesis-commitment
        - text: Anthropic says it developed the Life Sciences Verification Program with the U.S. government.
            Organizations seeking the Cyber Verification Program's Specialized Access tier are
            reviewed in depth with the U.S. government.
          source_ids:
            - anthropic-fable-mythos-5-1
            - anthropic-cvp
        - text: Outside the U.S., Anthropic signed a Memorandum of Cooperation on AI evaluation methods with
            the Japan AI Safety Institute (October 2025). It also signed a Memorandum of
            Understanding on AI safety and cybersecurity with Korea's Ministry of Science and ICT
            (June 2026).
          source_ids:
            - anthropic-tokyo-office
            - anthropic-seoul-office
    - id: offices
      title: Offices and international presence
      intro:
        text: Anthropic is headquartered in San Francisco, California, and has announced offices across
          North America, Europe, and Asia-Pacific.
        source_ids:
          - anthropic-privacy
          - anthropic-paris-munich
      items:
        - text: A November 7, 2025 announcement named offices in San Francisco, Seattle, New York, Washington
            D.C., London, Dublin, Zurich, Tokyo, Seoul, and Bengaluru, and announced new offices in
            Paris and Munich.
          source_ids:
            - anthropic-paris-munich
        - text: Anthropic opened a Tokyo office in October 2025.
          source_ids:
            - anthropic-tokyo-office
        - text: Anthropic opened a Bengaluru office on February 16, 2026, led by Irina Ghose. The announcement
            described partnerships, including a government MCP server from India's Ministry of
            Statistics.
          source_ids:
            - anthropic-bengaluru-office
        - text: Anthropic opened a Seoul office in June 2026, led by KiYoung Choi.
          source_ids:
            - anthropic-seoul-office
        - text: On March 10, 2026 Anthropic announced a Sydney office, its fourth in Asia-Pacific, focused at
            the start on enterprise, startup, and research customers.
          source_ids:
            - anthropic-sydney-office
    - id: recent-updates
      title: Recent updates (July to October 2026)
      items:
        - text: "July 1, 2026: Access to Claude Fable 5 and Claude Mythos 5 was restored after being suspended
            on June 12. On July 8, version 3.4 of the Responsible Scaling Policy took effect."
          source_ids:
            - anthropic-fable-mythos-5
            - claude-platform-release-notes
            - anthropic-rsp
        - text: "July 24, 2026: Anthropic released Claude Opus 5. With it, the API gained beta support for
            changing tools in the middle of a conversation and for automatic fallback to another
            model when a request is flagged."
          source_ids:
            - anthropic-opus-5
        - text: "August 2026: Anthropic published a redacted Risk Report covering the period up to July 15. On
            August 19, computer use left beta, a browser use tool launched, and the Files API and
            Agent Skills left beta."
          source_ids:
            - anthropic-rsp
            - claude-platform-release-notes
        - text: "August 26, 2026: Claude in Chrome became generally available on every paid plan."
          source_ids:
            - claude-in-chrome-ga
        - text: "August 27, 2026: Anthropic opened a research preview of the Model Hardware Standard, a shared
            specification for AI agents to safely operate lab instruments and other physical
            devices. Anthropic says it plans to make the standard open source later."
          source_ids:
            - anthropic-mhs
        - text: "September 1, 2026: Anthropic released Claude Fable 5.1 and Claude Mythos 5.1. It also
            announced Enterprise Frontier Safeguards, which pair zero data retention with misuse
            detection on cloud infrastructure the customer controls. Rollout is in phases starting
            in fall 2026."
          source_ids:
            - anthropic-fable-mythos-5-1
            - anthropic-efs
        - text: "September 16, 2026: Anthropic began merging Claude Cowork and chat into one Claude, and made
            Claude Design, Claude Slides, and Claude Docs available inside conversations."
          source_ids:
            - claude-cowork-merge
        - text: "September 17, 2026: Anthropic launched the Life Sciences Verification Program in beta. On
            October 6 it expanded the Cyber Verification Program into three tiers (Defense, Red
            Team, and Specialized Access)."
          source_ids:
            - anthropic-lsvp
            - anthropic-cvp
        - text: "September 22 to October 7, 2026: Anthropic released Claude Opus 5.5 (September 22), Claude
            Sonnet 5.5 (September 28), and Claude Haiku 5.5 (October 7). On September 30 it
            announced the deprecation of Claude Sonnet 4.5."
          source_ids:
            - anthropic-opus-5-5
            - anthropic-sonnet-5-5
            - anthropic-haiku-5-5
            - claude-model-deprecations
        - text: "September 25, 2026: The D.C. Circuit denied Anthropic's petitions for review of the
            Department of War's supply chain exclusion."
          source_ids:
            - dccir-anthropic-v-dow
        - text: "October 7, 2026: Python and TypeScript SDKs added beta tool classes for computer use and
            browser use, and Max and Team plans began to include monthly API credits."
          source_ids:
            - claude-platform-release-notes
        - text: "October 8, 2026: Anthropic announced Usage Policy updates (effective November 12), the
            Anthropic Cyber Mission, and commitments to the Genesis Mission. The Cyber Mission
            includes a defense program for critical infrastructure and an opt-in security scanner
            for open-source projects."
          source_ids:
            - anthropic-usage-policy-2026-update
            - anthropic-cyber-mission
            - anthropic-genesis-commitment
