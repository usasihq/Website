founded: null
sectors: [frontier-models, agents, research]
status_note:
  text: >-
    On October 12, 2026 USASI added the Claude Cowork research-preview launch date, from
    Anthropic's January 13, 2026 post introducing Labs, to this profile.
  source_ids: [anthropic-news-introducing-labs]
products:
  - id: claude-apps
    name: Claude
    kind: assistant-app
    access: >-
      AI assistant on the web and in desktop (macOS, Windows, and a Linux beta) and mobile apps,
      with Free, Pro, Max, Team, Enterprise, and Education plans; Claude Cowork is being merged
      into the main app from September 2026.
    url: https://claude.com/product/overview
    source_ids: [claude-product-overview, claude-pricing, claude-download, claude-cowork-merge]
    last_reviewed: 2026-10-11
  - id: claude-developer-platform
    name: Claude Platform (Claude API)
    kind: hosted-model-api
    access: >-
      API access to Claude models with API keys through the Claude Console; Claude is also
      offered on Amazon Bedrock, Google Cloud, Microsoft Foundry, and Claude Platform on AWS
      (operated by Anthropic, with AWS sign-in and billing).
    url: https://platform.claude.com/docs/en/home
    source_ids: [claude-platform-docs, claude-platform-features, claude-platform-on-aws-docs]
    last_reviewed: 2026-10-11
  - id: claude-code
    name: Claude Code
    kind: developer-tool
    access: >-
      Agentic coding tool for the terminal, IDEs, desktop, web, and mobile; included in
      Claude subscription plans or billed through a Claude Console account.
    url: https://claude.com/product/claude-code
    source_ids: [claude-code-product]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Anthropic's governance includes a Long-Term Benefit Trust, which holds a special
      class of stock and takes part in electing the company's board of directors.
    source_ids: [anthropic-ltbt, anthropic-company]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Anthropic's transparency hub describes it as a public benefit corporation headquartered
    in San Francisco, California. Its privacy policy describes the company as based and
    headquartered in the United States and lists Anthropic PBC at a San Francisco,
    California address. A separate Irish entity serves as data controller for the EEA, UK,
    and Switzerland.
  source_ids: [anthropic-transparency, anthropic-privacy]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Anthropic offers its Claude models as hosted services through its apps and API.
    Its Hugging Face organization lists datasets but no model repositories; this catalog
    has no record of public Claude model weights.
