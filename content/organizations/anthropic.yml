      kind: api
      status: current
      released: 2025-09-29
      description: Python and TypeScript libraries that give developers the tools, agent loop, and context
        management behind Claude Code, for building their own agents.
      url: https://code.claude.com/docs/en/agent-sdk/overview
      source_ids:
        - claude-agent-sdk-docs
        - anthropic-sonnet-4-5
    - name: Claude Platform (Claude API)
      kind: api
      status: current
      released: 2023-03
      description: Anthropic's API for Claude models, with keys issued in the Claude Console. Anthropic
        has offered Claude through an API since March 2023.
      url: https://platform.claude.com/docs/en/home
      source_ids:
        - claude-platform-docs
        - claude-platform-features
        - anthropic-introducing-claude
    - name: Claude Managed Agents
      kind: service
      status: preview
      released: null
      description: Beta hosted agent harness on the Claude Platform. Claude sessions run in an
        Anthropic-managed cloud sandbox or a self-hosted sandbox, with built-in tools and MCP
        servers.
      url: https://platform.claude.com/docs/en/managed-agents/overview
      source_ids:
        - claude-managed-agents-docs
    - name: Claude Cowork
      kind: agent
      status: current
      released: null
      description: Brings Claude Code's agentic abilities to knowledge work beyond coding, on paid plans.
        Since September 16, 2026 it has been merging into the main Claude app.
      url: https://claude.com/product/cowork
      source_ids:
        - claude-cowork-support
        - claude-cowork-merge
    - name: Claude in Chrome
      kind: app
      status: current
      released: 2025-08-25
      description: Chrome extension that lets Claude read, click, and fill in forms on web pages. It began
        as a pilot in August 2025 and became generally available on every paid plan on August 26,
        2026.
      url: https://claude.com/resources/articles/claude-in-chrome-generally-available
      source_ids:
        - claude-for-chrome-pilot
        - claude-in-chrome-ga
    - name: Claude for Microsoft 365
      kind: app
      status: current
      released: null
      description: Add-ins that put Claude inside Excel, PowerPoint, and Word (generally available on paid
        plans) and Outlook (beta).
      url: https://claude.com/claude-for-microsoft-365
      source_ids:
        - claude-m365
    - name: Claude Science
      kind: app
      status: preview
      released: 2026-06-30
      description: Beta app for macOS and Linux that Anthropic calls "an AI workbench for scientists." It is offered
        on Pro, Max, Team, and Enterprise plans.
      url: https://www.anthropic.com/news/claude-science-ai-workbench
      source_ids:
        - claude-science-news
    - name: Claude Security
      kind: service
      status: preview
      released: 2026-04-30
      description: Scans codebases for vulnerabilities and generates targeted patches. Public beta for
        Enterprise customers; formerly the Claude Code Security research preview.
      url: https://claude.com/blog/claude-security-public-beta
      source_ids:
        - claude-security-beta
    - name: Model Context Protocol (MCP)
      kind: platform
      status: current
      released: 2024-11-25
      description: Open standard Anthropic introduced for connecting AI applications to external data
        sources and tools. Anthropic donated it to the Agentic AI Foundation in December 2025.
      url: https://modelcontextprotocol.io
      source_ids:
        - anthropic-mcp-intro
        - anthropic-mcp-donation
  timeline:
    - date: 2023-03-14
      text: Anthropic introduced Claude and Claude Instant through a chat interface and an API.
      source_ids:
        - anthropic-introducing-claude
    - date: 2023-07-11
      text: Anthropic released Claude 2 and opened the claude.ai beta website in the US and UK.
      source_ids:
        - anthropic-claude-2
    - date: 2023-09-19
      text: Anthropic announced the Long-Term Benefit Trust, and version 1.0 of its Responsible Scaling
        Policy took effect.
      source_ids:
        - anthropic-ltbt
        - anthropic-rsp
    - date: 2023-11-21
      text: Claude 2.1 added a 200K-token context window, system prompts, and beta tool use.
      source_ids:
        - anthropic-claude-2-1
    - date: 2024-03-04
      text: Anthropic introduced the Claude 3 family (Claude 3 Opus, Claude 3 Sonnet, and Claude 3 Haiku).
      source_ids:
        - anthropic-claude-3-family
    - date: 2024-06
      text: Anthropic released Claude 3.5 Sonnet and a preview of Artifacts on Claude.ai.
      source_ids:
        - anthropic-claude-3-5-sonnet
    - date: 2024-10-15
      text: Version 2.0 of the Responsible Scaling Policy took effect.
      source_ids:
        - anthropic-rsp
    - date: 2024-10-22
      text: Anthropic released an upgraded Claude 3.5 Sonnet and Claude 3.5 Haiku, and opened a public
        beta of computer use.
      source_ids:
        - anthropic-computer-use
    - date: 2024-11-25
      text: Anthropic introduced the Model Context Protocol as an open standard.
      source_ids:
        - anthropic-mcp-intro
    - date: 2025-02-10
      text: Anthropic launched the Anthropic Economic Index and published its dataset on Hugging Face.
      source_ids:
        - anthropic-economic-index-launch
    - date: 2025-02-24
      text: Anthropic released Claude 3.7 Sonnet and a limited research preview of Claude Code.
      source_ids:
        - anthropic-claude-3-7-sonnet
    - date: 2025-05-22
      text: Anthropic released Claude Opus 4 and Claude Sonnet 4, made Claude Code generally available,
        and turned on ASL-3 protections for Claude Opus 4.
      source_ids:
        - anthropic-claude-4
        - anthropic-asl3
    - date: 2025-06-06
      text: Anthropic announced Claude Gov models for U.S. national security customers.
      source_ids:
        - anthropic-claude-gov
    - date: 2025-08-12
      text: Anthropic offered Claude for Enterprise and Claude for Government to all three branches of the
        U.S. government through GSA's OneGov program.
      source_ids:
        - anthropic-three-branches
    - date: 2025-08-25
      text: Anthropic began a pilot of Claude for Chrome, a browser extension.
      source_ids:
        - claude-for-chrome-pilot
    - date: 2025-09-29
      text: Anthropic released Claude Sonnet 4.5 and the Claude Agent SDK.
      source_ids:
        - anthropic-sonnet-4-5
    - date: 2025-11-04
      text: Anthropic published commitments to preserve the weights of publicly released models.
      source_ids:
        - anthropic-deprecation-commitments
    - date: 2025-11-24
      text: Anthropic released Claude Opus 4.5.
      source_ids:
        - claude-opus-4-5-docs
    - date: 2025-12-09
      text: Anthropic donated the Model Context Protocol to the Agentic AI Foundation under the Linux
        Foundation.
      source_ids:
        - anthropic-mcp-donation
    - date: 2026-01-22
      text: Anthropic published a new constitution for Claude under a CC0 public domain dedication.
      source_ids:
        - anthropic-constitution-2026
    - date: 2026-02
      text: Anthropic released Claude Opus 4.6 (February 5) and Claude Sonnet 4.6 (February 17).
      source_ids:
        - claude-opus-4-6-docs
        - claude-sonnet-4-6-docs
    - date: 2026-02-24
      text: Version 3.0 of the Responsible Scaling Policy, a full rewrite, took effect.
      source_ids:
        - anthropic-rsp
    - date: 2026-02-27
      text: GSA removed Anthropic from USAi.gov and its Multiple Award Schedule, citing a presidential
        directive.
      source_ids:
        - gsa-feb-2026-directive
    - date: 2026-03-03
      text: The Secretary of War made a determination to exclude Claude from the Department of War's
        supply chain.
      source_ids:
        - dccir-anthropic-v-dow
    - date: 2026-03-26
      text: A federal district court in Northern California issued a preliminary injunction against the
        directive, and GSA later restored Anthropic's earlier status.
      source_ids:
        - gsa-injunction-statement
    - date: 2026-04-07
      text: Anthropic announced Project Glasswing and gave partners access to Claude Mythos Preview.
      source_ids:
        - anthropic-glasswing
    - date: 2026-04-16
      text: Anthropic released Claude Opus 4.7.
      source_ids:
        - claude-opus-4-7-docs
    - date: 2026-05-28
      text: Anthropic released Claude Opus 4.8.
      source_ids:
        - claude-opus-4-8-docs
    - date: 2026-06-09
      text: Anthropic released Claude Fable 5 and Claude Mythos 5.
      source_ids:
        - anthropic-fable-mythos-5
    - date: 2026-06-30
      text: Anthropic released Claude Sonnet 5 and a beta of Claude Science.
      source_ids:
        - anthropic-sonnet-5
        - claude-science-news
    - date: 2026-07-24
      text: Anthropic released Claude Opus 5.
      source_ids:
        - anthropic-opus-5
    - date: 2026-08-26
      text: Claude in Chrome became generally available on every paid plan.
      source_ids:
        - claude-in-chrome-ga
    - date: 2026-08-27
      text: The Northern District of California set aside the Department of War's designation of Anthropic
        as a supply chain risk under 10 U.S.C. § 3252.
      source_ids:
        - dccir-anthropic-v-dow
    - date: 2026-09-01
      text: Anthropic released Claude Fable 5.1 and Claude Mythos 5.1.
      source_ids:
        - anthropic-fable-mythos-5-1
        - claude-fable-5-1-docs
    - date: 2026-09-16
      text: Anthropic began merging Claude Cowork and chat into one Claude experience.
      source_ids:
        - claude-cowork-merge
    - date: 2026-09-22
      text: Anthropic released Claude Opus 5.5.
      source_ids:
        - anthropic-opus-5-5
    - date: 2026-09-25
      text: The D.C. Circuit denied Anthropic's petitions for review of its exclusion under 41 U.S.C. §
        4713.
      source_ids:
        - dccir-anthropic-v-dow
    - date: 2026-09-28
      text: Anthropic released Claude Sonnet 5.5.
      source_ids:
        - anthropic-sonnet-5-5
    - date: 2026-10-07
      text: Anthropic released Claude Haiku 5.5.
      source_ids:
        - anthropic-haiku-5-5
    - date: 2026-10-08
      text: Anthropic announced Usage Policy updates, the Anthropic Cyber Mission, and commitments to the
        Genesis Mission.
      source_ids:
        - anthropic-usage-policy-2026-update
        - anthropic-cyber-mission
        - anthropic-genesis-commitment
