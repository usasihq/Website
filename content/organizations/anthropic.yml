summary:
  text: >-
    Anthropic, which describes itself as an AI safety and research company, develops the
    Claude family of models. It offers Claude through web, desktop, and mobile apps,
    through the Claude Platform API, and through the Claude Code coding agent.
  source_ids: [anthropic-company, claude-product-overview, claude-platform-docs, claude-code-product]
organization_roles: [model-developer, research-lab, developer-platform, consumer-products]
ownership_category: privately-held
