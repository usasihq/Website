eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Anthropic's transparency hub describes it as a public benefit corporation headquartered
    in San Francisco, California. Its privacy policy describes the company as based and
    headquartered in the United States and lists Anthropic PBC at a San Francisco,
    California address. A separate Irish entity serves as data controller for the EEA, UK,
    and Switzerland.
  source_ids: [anthropic-transparency, anthropic-privacy]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Anthropic offers its Claude models as hosted services through its apps and API.
    Its Hugging Face organization lists datasets but no model repositories; this catalog
    has no record of public Claude model weights.
  source_ids: [hf-anthropic, claude-platform-docs]
