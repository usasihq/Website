profile:
  intended_users:
    text: >-
      Anthropic sells Claude plans for individuals (Free, Pro, and Max) and for
      teams and enterprises, and documents the Claude API for developers
      building Claude into applications and agents.
    source_ids: [review-claude-pricing, review-platform-docs]
    reviewed_at: 2026-10-01
  access_overview:
    text: >-
      Claude models are offered as hosted services: in the Claude apps, through
      the Claude API with keys issued in the Claude Console, and on cloud
      platforms including Amazon Bedrock, Google Cloud, and Microsoft Foundry.
    source_ids: [review-platform-docs, review-models-overview, review-claude-pricing]
    reviewed_at: 2026-10-01
  limitations:
    text: >-
      Anthropic's Hugging Face organization lists datasets but no public models.
      Use is governed by Anthropic's Usage Policy; Claude Mythos models are
      offered by invitation only, and Amazon Bedrock and Google Cloud set their
      own pricing and retirement dates for Claude models. This profile is not a
      complete product or rights audit.
    source_ids: [review-hf-anthropic, review-usage-policy, review-api-pricing, review-models-overview]
    reviewed_at: 2026-10-01
