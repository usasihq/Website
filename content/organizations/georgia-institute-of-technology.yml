summary:
  text: >-
    The Georgia Institute of Technology (Georgia Tech) is a public research university in
    Atlanta, Georgia, founded in 1885 and part of the University System of Georgia. Its AI
    research groups include the Polo Club of Data Science, which builds interactive tools for
    understanding machine learning models, among them Transformer Explainer.
  source_ids: [gt-about, usg-institutions, polo-site, te-readme]
