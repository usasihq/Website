notable_facts:
  - text: >-
      The University System of Georgia lists Georgia Tech as one of its four research
      universities, together with the University of Georgia, Georgia State University, and
      Augusta University.
    source_ids: [usg-institutions]
    reviewed_at: 2026-10-01
  - text: >-
      The Polo Club of Data Science at Georgia Tech lists human-centered AI (including
      interpretable, fair, and safe AI and adversarial machine learning), large graph
      visualization and mining, and cybersecurity among its research areas. It publishes its
      code in the poloclub GitHub organization.
    source_ids: [polo-site, polo-github]
    reviewed_at: 2026-10-01
  - text: >-
      Transformer Explainer is an interactive, browser-based visualization that runs a GPT-2
      model so learners can see how a Transformer predicts the next token. Its README says it was
      created at the Georgia Institute of Technology; the code is released under the MIT License
      with copyright held by the Polo Club of Data Science, and the accompanying paper appears in
      the proceedings of CHI 2026.
    source_ids: [te-readme, te-license, te-paper]
    reviewed_at: 2026-10-01
