summary:
  text: >-
    Zyphra is a San Francisco AI company that trains open foundation models, including the
    Zamba hybrid state-space language models and the ZAYA1 mixture-of-experts models. It also
    runs Zyphra Cloud, a hosted platform for model inference and GPU compute.
  source_ids: [zyphra-home, zyphra-research-index, zyphra-cloud, zyphra-zaya1-8b-post]
