products:
  - id: zyphra-cloud
    name: Zyphra Cloud
    kind: inference-service
    access: >-
      Hosted platform with serverless inference for open-weight models (including a ZAYA1-8B
      endpoint), reserved capacity for production deployments, and GPU compute. Users sign up
      and log in at cloud.zyphra.com.
    url: https://www.zyphra.com/cloud
    source_ids: [zyphra-cloud, zyphra-zaya1-8b-post]
    last_reviewed: 2026-09-29
  - id: maia
    name: Maia
    kind: assistant-app
    access: >-
      Agent for teams that works across language, audio, and images and connects to tools such
      as Gmail, Google Calendar, and Google Drive. The product page links to the Zyphra Cloud
      login and does not state availability or pricing terms.
    url: https://www.zyphra.com/agent
    source_ids: [zyphra-agent]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Zyphra's research index lists the Zamba line (April 2024 to June 2026) and the ZAYA1 line
      (from November 2025), which Zyphra says was trained end to end on AMD hardware. Its
      Hugging Face organization also hosts the Zonos text-to-speech models, the ZUNA models,
      and the Zyda pretraining datasets.
    source_ids: [zyphra-research-index, zyphra-hf]
eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    Zyphra's terms of use (May 2026) and privacy policy (August 2026) name Zyphra
    Technologies, Inc. at 415 Mission Street, San Francisco, and apply California law with
    San Francisco venue. Its May 2026 release announcement describes the company as
    headquartered in San Francisco. The about page describes the company as based in San
    Francisco and London; no foreign parent or headquarters was found.
  source_ids: [zyphra-terms, zyphra-privacy, zyphra-zaya1-8b-post, zyphra-about]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    Zyphra publishes model weights on Hugging Face, including the Zamba, ZAYA1, and Zonos
    models, as well as the Zyda pretraining datasets. Its Zamba2-VL and ZAYA1-8B
    announcements state Apache 2.0 licensing. Zyphra Cloud and Maia are hosted services. This
    catalog assesses openness release by release (see the Zamba release records).
  source_ids: [zyphra-hf, zyphra-zamba2-vl-blog, zyphra-zaya1-8b-post, zyphra-cloud]
