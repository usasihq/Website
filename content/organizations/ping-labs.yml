name: Ping Labs
legal_name:
  text: >-
    T3 Tools, Inc. The ping.gg site presents T3 Code and T3 Chat as Ping Labs products, and the
    terms and privacy policies of both products name T3 Tools, Inc. as the operator.
  source_ids: [ping-home, t3code-terms, t3code-privacy, t3chat-terms, t3code-license]
