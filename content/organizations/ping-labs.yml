eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The T3 Code terms of service (effective July 15, 2026) are an agreement with T3 Tools, Inc.,
    apply California law, and name courts in San Francisco County, California when arbitration does
    not apply; their contact section gives a San Francisco, California address in the United
    States. The T3 Code privacy policy (effective October 6, 2026) gives the same address and says
    the site and services are provided from the United States. The T3 Chat terms and privacy policy
    name the same company and address, and the Ping.gg GitHub organization lists its location as
    the United States. No page reviewed calls the address a headquarters or states where the
    company is incorporated, so only the country is recorded as the headquarters; no non-U.S.
    office or parent entity was found.
  source_ids: [t3code-terms, t3code-privacy, t3chat-terms, t3chat-privacy, github-org]
  assessed_at: 2026-10-18
openness_summary:
  text: >-
    T3 Code's source code, including the desktop, web, server, and mobile apps, is published under
    the MIT license. The hosted app, T3 Connect, and T3 Chat are hosted services under T3 Tools'
    terms. This catalog has no record of Ping Labs releasing model weights; T3 Code works with
    coding agents and model providers that users install and pay for separately.
  source_ids: [t3code-license, t3code-readme, t3code-repo-api, t3code-terms, t3chat-terms]
  reviewed_at: 2026-10-18
