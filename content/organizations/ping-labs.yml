summary:
  text: >-
    Ping Labs, operated by T3 Tools, Inc., makes software for developers and creators. Its products
    include T3 Code, an open-source desktop, web, and mobile app for running and controlling coding
    agents; T3 Chat, a hosted AI chat app; UploadThing, a file-upload service for full-stack
    developers; and Ping, a live video collaboration tool for creators.
  source_ids: [ping-home, t3code-readme, t3code-terms, t3chat-terms]
  reviewed_at: 2026-10-18
