summary:
  text: >-
    d-Matrix designs hardware and software for AI inference in data centers. Its products are the
    Corsair inference accelerator, the JetStream I/O accelerator for card-to-card communication,
    the Aviator software stack, and SquadRack rack-scale configurations that combine them.
  source_ids: [dm-about, dm-full-production, dm-product]
