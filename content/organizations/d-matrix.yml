products:
  - id: corsair
    name: d-Matrix Corsair
    kind: hardware
    access: >-
      PCIe accelerator cards for data center inference, built on a chiplet design with on-chip
      SRAM; they fit existing PCIe servers and can be paired with GPUs in disaggregated inference
      pipelines. Sold through d-Matrix sales.
    url: https://www.d-matrix.ai/product/
    source_ids: [dm-product, dm-full-production]
    last_reviewed: 2026-10-01
  - id: jetstream
    name: d-Matrix JetStream
    kind: hardware
    access: >-
      I/O accelerator card that d-Matrix describes as a transparent NIC for accelerator-to-
      accelerator communication between Corsair cards, using PCIe Gen5 and standard Ethernet.
    url: https://www.d-matrix.ai/jetstream-accelerator/
    source_ids: [dm-jetstream]
    last_reviewed: 2026-10-01
  - id: aviator
    name: d-Matrix Aviator
    kind: developer-tool
    access: >-
      Software stack for Corsair, from compiler to runtime, that d-Matrix says is co-designed with
      its hardware.
    url: https://www.d-matrix.ai/product/aviator/
    source_ids: [dm-aviator, dm-product]
    last_reviewed: 2026-10-01
  - id: squadrack
    name: d-Matrix SquadRack
    kind: hardware
    access: >-
      Rack-scale reference configurations for inference that combine Corsair and JetStream in
      air-cooled PCIe servers with standard Ethernet leaf switches, offered in single-server to
      half-rack sizes.
    url: https://www.d-matrix.ai/corsair-at-rack-scale/
    source_ids: [dm-squadrack]
    last_reviewed: 2026-10-01
notable_facts:
  - text: >-
      d-Matrix announced on June 9, 2026 that its Corsair inference accelerator platform had
      entered full production.
    source_ids: [dm-full-production]
    reviewed_at: 2026-10-01
  - text: >-
      d-Matrix says it is a member of the UALink and Ultra Ethernet (UEC) industry consortiums.
    source_ids: [dm-squadrack]
    reviewed_at: 2026-10-01
