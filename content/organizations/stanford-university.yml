summary:
  text: >-
    Stanford University is a university in Stanford, California, founded in 1885 by Leland and
    Jane Stanford; it admitted its first students in 1891. Its AI research groups include the
    Center for Research on Foundation Models (CRFM) and the Stanford NLP Group.
  source_ids: [stanford-about, stanford-facts, crfm-home, stanford-nlp-home]
