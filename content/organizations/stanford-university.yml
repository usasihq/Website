notable_facts:
  - text: >-
      The Center for Research on Foundation Models (CRFM) is an interdisciplinary initiative at
      the Stanford Institute for Human-Centered Artificial Intelligence (HAI). CRFM created HELM,
      an open-source framework for evaluating foundation models, which entered maintenance mode
      on June 1, 2026.
    source_ids: [crfm-home, helm-repo, helm-maintenance]
  - text: >-
      The Stanford NLP Group, whose members come from the Linguistics, Computer Science, and
      other departments, lists DSPy among the software it develops. The DSPy repository sits in
      the Stanford NLP GitHub organization, and its MIT license names Stanford Future Data
      Systems as the copyright holder.
    source_ids: [stanford-nlp-home, stanfordnlp-github, dspy-license]
  - text: >-
      LMSYS, the nonprofit that hosts the SGLang project, states that it originated in 2023 from
      a multi-university collaboration that included Stanford.
    source_ids: [lmsys-about]
