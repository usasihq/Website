summary:
  text: >-
    Palantir builds software platforms for data integration, analytics, and operational decision-making used by
    government and commercial customers. Its Artificial Intelligence Platform (AIP) connects large language models
    with customer data and workflows inside its Foundry and Gotham platforms.
  source_ids: [pltr-10k-2025]
organization_roles: [enterprise-software, data-platform]
ownership_category: publicly-traded
