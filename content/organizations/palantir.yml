status_note:
  text: >-
    Palantir's Form 10-K for fiscal 2025 (filed February 2026) lists its principal executive offices in Aventura,
    Florida, and gives its former address in Denver, Colorado, which the filing describes as the previous location of
    its corporate headquarters. The Form 10-Q for the quarter ended June 30, 2026 lists the same Aventura address.
  source_ids: [pltr-10k-2025, pltr-10q-2026q2]
products:
  - id: aip
    name: Palantir AIP (Artificial Intelligence Platform)
    kind: enterprise-software
    access: >-
      Software platform, bundled with Foundry, Gotham, and Apollo, that gives organizations access to open-source,
      self-hosted, and commercial large language models for building AI workflows and agents on their own data;
      documented builder tools include AIP Logic and AIP Evals.
    url: https://www.palantir.com/platforms/aip/
    source_ids: [pltr-10k-2025, pltr-aip-docs]
    last_reviewed: 2026-09-29
  - id: foundry
    name: Palantir Foundry
    kind: data-platform
    access: >-
      Data operations platform for integrating data, building pipelines and analytics, and developing applications on
      a shared data model (the Ontology); the company reports that all of its commercial customers and many
      government customers use it.
    url: https://www.palantir.com/platforms/foundry/
    source_ids: [pltr-10k-2025]
    last_reviewed: 2026-09-29
  - id: gotham
    name: Palantir Gotham
    kind: enterprise-software
    access: >-
      Software platform for integrating multi-domain and sensor data for operational decision-making; the company
      describes it as used broadly across government functions, including defense and intelligence operations.
    url: https://www.palantir.com/platforms/gotham/
    source_ids: [pltr-10k-2025]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      The company states it began by building software for the U.S. intelligence community to assist in
      counterterrorism investigations and later began working with commercial enterprises.
    source_ids: [pltr-10k-2025]
