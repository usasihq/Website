products:
  - id: firefly
    name: Adobe Firefly
    kind: other
    access: >-
      Generative AI app for creating and editing images, video, audio, and designs from prompts, available on the web
      and on iOS and Android with a free tier and paid plans; it offers Adobe's Firefly models alongside models from
      other providers.
    url: https://www.adobe.com/products/firefly.html
    source_ids: [adobe-firefly]
    last_reviewed: 2026-09-29
  - id: firefly-services
    name: Adobe Firefly Services
    kind: hosted-model-api
    access: >-
      Set of APIs, including the Firefly API, for generating, editing, and assembling content with generative AI in
      automated production workflows; documented for developers and enterprises.
    url: https://developer.adobe.com/firefly-services/docs/guides/
    source_ids: [adobe-firefly-services, adbe-10k-fy2025]
    last_reviewed: 2026-09-29
  - id: acrobat-ai-assistant
    name: Acrobat AI Assistant
    kind: assistant-app
    access: >-
      Generative AI assistant in Acrobat that summarizes and answers questions about documents; sold as an add-on
      subscription or included in some Acrobat plans, on desktop, web, and mobile.
    url: https://www.adobe.com/acrobat/generative-ai-pdf.html
    source_ids: [adobe-acrobat-ai-assistant]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Adobe states that its Firefly models are trained on licensed content, such as Adobe Stock, and on public domain
      content, and that it does not train them on users' personal or generated content.
    source_ids: [adobe-firefly, adbe-10k-fy2025]
