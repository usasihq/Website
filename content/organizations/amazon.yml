profile:
  intended_users:
    text: >-
      AWS presents Amazon Bedrock for teams, from startups to large
      enterprises, building generative AI applications and agents, and Amazon
      Nova models for organizations of all sizes.
    source_ids: [review-bedrock, review-nova]
    reviewed_at: 2026-10-01
  access_overview:
    text: >-
      Bedrock is a fully managed AWS service that offers foundation models from
      Amazon and other providers, including Anthropic, DeepSeek, OpenAI, and
      xAI, through AWS APIs. Amazon's Nova 2 models are accessed through
      Bedrock and can be customized through fine-tuning.
    source_ids: [review-bedrock-docs, review-nova2-guide]
    reviewed_at: 2026-10-01
  limitations:
    text: >-
      Bedrock prices depend on modality, provider, and model and vary by AWS
      Region. AWS documents Nova access through Bedrock, and Amazon's Hugging
      Face organization lists other models, such as Chronos, but no Nova
      weights. This profile is not a complete product or rights audit.
    source_ids: [review-bedrock-pricing, review-nova2-guide, review-hf-amazon]
    reviewed_at: 2026-10-01
