sectors: [science, open-models]
status_note:
  text: >-
    On November 6, 2025, Biohub announced that the EvolutionaryScale team would join Biohub, a
    501(c)(3) medical research organization supported by the Chan Zuckerberg Initiative.
    EvolutionaryScale's website now states that it is part of Biohub and that current ESM
    models, APIs, and related services are provided at biohub.ai under Biohub's terms. The ESM
    GitHub repository and the ESM model repositories on Hugging Face are now published under
    Biohub accounts. Its former terms of use are marked as no longer in effect and refer to the
    period before EvolutionaryScale joined Biohub. The sources reviewed describe the team
    joining Biohub (a law firm's client note calls it a strategic transaction with the Chan
    Zuckerberg Initiative) but do not document an acquisition of, or merger with,
    EvolutionaryScale, PBC, so no parent organization is linked.
  source_ids: [biohub-announcement, es-home, es-terms-legacy, biohub-esm-repo, hf-biohub-esm3, gunderson-note]
products: []
notable_facts:
  - text: >-
      The EvolutionaryScale site hosts an EvolutionaryScale, PBC Community License Agreement
      covering the ESM-3 open model code and weights that limits use to non-commercial
      purposes. The current Biohub repository license and model card state the MIT license;
      the sources reviewed do not say when the terms changed.
    source_ids: [es-community-license, biohub-esm-license, hf-biohub-esm3]
  - text: >-
      EvolutionaryScale's hosted Forge API has moved from forge.evolutionaryscale.ai to the
      Biohub Platform at biohub.ai; the esm SDK still uses Forge class names.
    source_ids: [biohub-esm-repo]
  - text: >-
      EvolutionaryScale's former terms of use (effective January 15, 2025) gave a New York, New
      York address and New York governing law; the site marks those terms as no longer in
      effect.
    source_ids: [es-terms-legacy]
eligibility:
  status: eligible
  basis: us-control
  explanation: >-
    EvolutionaryScale's website states that it is now part of Biohub, and Biohub's announcement
    describes the EvolutionaryScale team joining Biohub. Chan Zuckerberg Biohub Inc is listed by
    the IRS as a 501(c)(3) organization in Redwood City, California. EvolutionaryScale, PBC's
    former terms of use (effective January 15, 2025) gave a New York address. The sources reviewed do not
    document the legal structure of the combination (for example, whether the PBC continues as a
    subsidiary); either way, the documented controlling and prior locations are in the United
    States.
  source_ids: [es-home, biohub-announcement, irs-eo-bmf-ca, es-terms-legacy]
  assessed_at: 2026-09-29
openness_summary:
  text: >-
    The ESM3 open small model, the ESM C models, and the esm code are now published by Biohub
    under the MIT license; the ESM3 README lists the larger ESM3 models as accessed through
    Biohub, with only the small open model's weights on Hugging Face. See the ESM release
    records.
  source_ids: [biohub-esm-repo, esm3-readme, biohub-esm-license]
