summary:
  text: >-
    EvolutionaryScale is a public benefit company that developed the ESM3 and ESM C (ESM
    Cambrian) protein language models. In November 2025 Biohub announced that the
    EvolutionaryScale team would join Biohub, and EvolutionaryScale's website now states that
    it is part of Biohub.
  source_ids: [es-esm3-blog, es-esmc-blog, es-home, biohub-announcement]
