profile:
  intended_users:
    text: >-
      Microsoft describes Foundry as serving organizations that build AI
      solutions, from start-ups and software vendors to data science, IT, and
      security teams. It presents Phi as small models that let developers run
      AI on devices without cloud connectivity.
    source_ids: [review-foundry, review-phi]
    reviewed_at: 2026-10-01
  access_overview:
    text: >-
      Foundry can be explored without an Azure account, but building agents
      requires an Azure subscription, and each model or service is billed at
      its own rate. MAI models such as MAI-Thinking-1 are listed as preview
      models sold by Azure, while Phi models are also published on Hugging Face
      and Ollama.
    source_ids: [review-foundry, review-foundry-pricing, review-foundry-models-azure, review-phi]
    reviewed_at: 2026-10-01
  limitations:
    text: >-
      Foundry separates models sold by Azure, which Microsoft supports under
      Azure service-level agreements, from partner and community models. Phi
      model cards such as Phi-4 state the MIT License and advise evaluation
      before high-risk uses. This profile is not a complete product or rights
      audit.
    source_ids: [review-foundry-models-azure, review-phi-4-card, review-phi]
    reviewed_at: 2026-10-01
