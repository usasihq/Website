notable_facts:
  - text: >-
      Microsoft publishes Phi models on Hugging Face and Microsoft Foundry, and its Phi product
      page states that Phi models are available under the MIT License.
    source_ids: [phi-portal]
  - text: >-
      Microsoft AI announced two in-house models, MAI-Voice-1 and MAI-1-preview, in August 2025,
      describing MAI-1-preview as its first foundation model trained end-to-end. They were made
      available through Copilot features, Copilot Labs, public testing, and API access for
      trusted testers; the announcement did not include downloadable weights.
    source_ids: [mai-two-models]
  - text: >-
      Microsoft Research released Muse, a World and Human Action Model (WHAM) for gameplay
      ideation, with weights and sample data in February 2025.
    source_ids: [msr-muse-blog]
