openness_summary:
  text: >-
    Microsoft publishes downloadable weights for Phi models under the MIT License and released
    the Muse (WHAM) research model under a non-commercial research license. The MAI models
    announced in August 2025 and its Copilot services are offered as hosted products without
    public weights.
