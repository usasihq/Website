products:
  - id: gemini-api
    name: Gemini API
    kind: hosted-model-api
    access: >-
      Developer API for Google's Gemini and other generative models. API keys are created in
      Google AI Studio, and the documentation shows client code for Python, JavaScript, Java, Go,
      and REST.
    url: https://ai.google.dev/gemini-api/docs
    source_ids: [gemini-api-docs]
    last_reviewed: 2026-09-29
  - id: gemini-app
    name: Gemini app
    kind: assistant-app
    access: >-
      Consumer AI assistant on the web, Android, and iOS, with a free plan and paid Google AI
      subscription plans that raise usage limits.
    url: https://gemini.google/about/
    source_ids: [gemini-app-about]
    last_reviewed: 2026-09-29
  - id: gemini-enterprise-agent-platform
    name: Gemini Enterprise Agent Platform (formerly Vertex AI)
    kind: cloud-platform
    access: >-
      Google Cloud platform, previously named Vertex AI, for building, deploying, and governing AI
      agents and applications. Its Model Garden offers Google models such as Gemini, third-party
      models, and open models such as Gemma.
    url: https://cloud.google.com/products/gemini-enterprise-agent-platform
    source_ids: [gemini-enterprise-agent-platform]
    last_reviewed: 2026-09-29
notable_facts:
  - text: >-
      Google was incorporated in California in September 1998. A 2015 holding company
      reorganization made Alphabet Inc. the successor issuer to Google.
    source_ids: [alphabet-10k-2025]
  - text: >-
      Alphabet's fiscal 2025 annual report says Google Cloud customers can use GPUs as well as
      Google's own custom-built Tensor Processing Units (TPUs), including the seventh-generation
      Ironwood TPU.
    source_ids: [alphabet-10k-2025]
  - text: >-
      The Google Cloud AI development platform formerly named Vertex AI is now presented as
      Gemini Enterprise Agent Platform.
    source_ids: [gemini-enterprise-agent-platform]
