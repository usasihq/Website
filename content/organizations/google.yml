profile:
  intended_users:
    text: >-
      Google documents the Gemini API for developers building with its models
      and points enterprise deployments to Gemini Enterprise Agent Platform. The
      Gemini API terms require users to be 18 or older and limit Google AI
      Studio and the Gemini API to professional or business use, not consumer
      use.
    source_ids: [review-gemini-docs, review-gemini-pricing, review-gemini-terms]
    reviewed_at: 2026-10-01
  access_overview:
    text: >-
      Gemini models are offered as hosted services through the Gemini app,
      Google AI Studio, the Gemini API (free and paid tiers), and Gemini
      Enterprise Agent Platform. Downloadable Gemma models are covered in the
      Google DeepMind record.
    source_ids: [review-gdm-models, review-gemini-pricing, review-gemini-docs]
    reviewed_at: 2026-10-01
  limitations:
    text: >-
      Google states that free-tier Gemini API content is used to improve its
      products and may be read by human reviewers, while paid-tier content is
      not used for product improvement. The terms require paid services for
      apps offered in the EEA, Switzerland, and the UK, and apply Google's
      Prohibited Use Policy. This profile is not a complete product or rights
      audit.
    source_ids: [review-gemini-pricing, review-gemini-terms]
    reviewed_at: 2026-10-01
