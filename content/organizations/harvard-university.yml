ownership_category: nonprofit
legal_form:
  text: >-
    Organization recognized by the IRS as tax-exempt under Section 501(c)(3); the IRS extract
    lists it under the name President and Fellows of Harvard College and classifies it as a
    corporation with school public-charity status (170(b)(1)(A)(ii)).
  source_ids: [irs-eo-bmf-ma, irs-eo-info]
  reviewed_at: 2026-10-01
