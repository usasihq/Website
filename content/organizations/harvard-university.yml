notable_facts:
  - text: >-
      Harvard dates its founding to October 28, 1636, and describes itself as the first college
      in the American colonies.
    source_ids: [harvard-about, harvard-history]
    reviewed_at: 2026-10-01
  - text: >-
      The Kempner Institute for the Study of Natural and Artificial Intelligence at Harvard
      University states that it seeks to understand the basis of intelligence in natural and
      artificial systems. It publishes code in the KempnerInstitute GitHub organization.
    source_ids: [kempner-home, kempner-github]
    reviewed_at: 2026-10-01
  - text: >-
      KempnerForge is a PyTorch-native framework for fault-tolerant distributed training of
      foundation models on AI clusters, with tooling for interpretability and NeuroAI
      representation analysis. It is released under the MIT License with copyright held by the
      Kempner Institute for the Study of Natural and Artificial Intelligence, Harvard University.
    source_ids: [kempnerforge-repo, kempnerforge-license]
    reviewed_at: 2026-10-01
