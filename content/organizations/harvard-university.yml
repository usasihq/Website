logo_text: HU
summary:
  text: >-
    Harvard University is a university in Cambridge, Massachusetts, founded in 1636 by a vote of
    the Great and General Court of the Massachusetts Bay Colony. Its AI research includes the
    Kempner Institute for the Study of Natural and Artificial Intelligence, which studies the
    basis of intelligence in natural and artificial systems and publishes open-source software
    such as KempnerForge.
  source_ids: [harvard-about, harvard-history, kempner-home, kempnerforge-repo]
  reviewed_at: 2026-10-01
