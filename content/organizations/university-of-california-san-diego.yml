notable_facts:
  - text: >-
      UC San Diego enrolled its first undergraduates in 1964. The campus grew around the Scripps
      Institution of Oceanography, a marine station in La Jolla that joined the University of
      California in 1912.
    source_ids: [ucsd-catalog]
    reviewed_at: 2026-10-01
  - text: >-
      The Hao AI Lab at UC San Diego works on efficient machine learning models and algorithms
      and on distributed systems for machine learning workloads. It states that it develops and
      maintains open-source models, evaluations, and systems, and that it is affiliated with the
      UCSD ML System Group and the UCSD NLP Group.
    source_ids: [haolab-home]
    reviewed_at: 2026-10-01
  - text: >-
      FastVideo, a post-training and inference framework for accelerated video generation, is
      maintained in the Hao AI Lab's GitHub organization and released under the Apache License
      2.0. Its README credits code and design ideas from other open projects, including
      Wan-Video, diffusers, vLLM, and SGLang.
    source_ids: [fastvideo-repo, fastvideo-license]
    reviewed_at: 2026-10-01
