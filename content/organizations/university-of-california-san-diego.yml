summary:
  text: >-
    UC San Diego is a public university campus of the University of California, located in La
    Jolla, California, and founded in 1960. Its AI research groups include the Hao AI Lab, which
    develops and maintains open-source models, evaluations, and systems, including the FastVideo
    framework for video generation.
  source_ids: [ucsd-catalog, ucsd-about, haolab-home, fastvideo-repo]
