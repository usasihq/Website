eligibility:
  status: pending_review
  basis: undetermined
  explanation: >-
    The maintaining company appears as Unsloth AI Inc. in the repository's license and source-file
    copyright notices, but no company page, legal page, or regulatory filing found states where it
    is incorporated or headquartered; the website's terms and privacy pages returned not-found
    errors, and no SEC filing under the Unsloth name was found. Y Combinator's directory lists
    Unsloth AI in San Francisco, and the unslothai GitHub organization profile gives the United
    States as its location, but both are self-reported directory fields rather than documentation
    of incorporation or a principal office. A U.S. basis is therefore not documented.
  source_ids: [unsloth-license, unsloth-studio-header, yc-unsloth, unsloth-github-org]
  assessed_at: 2026-09-29
openness_summary:
