eligibility:
  status: eligible
  basis: us-headquarters
  explanation: >-
    The deciding evidence is an official registry. The USPTO record for the UNSLOTH trademark
    (Registration No. 7973599, registered October 7, 2025, for downloadable software for training
    and fine-tuning large language models) names Unsloth AI Inc., a Delaware corporation, as owner
    with an address in San Francisco, California. The application first gave a Delaware address;
    the USPTO's May 2025 office action rejected it as a domicile and required the company's
    headquarters address, defined as the place where its senior executives direct and control its
    activities. The company's June 2025 response replaced it with the San Francisco address, the
    only owner address in that response, and the USPTO's June 2025 action states that an acceptable
    domicile address was submitted. This is read as a documented U.S. principal place of business.
    The company's website, re-checked on 2026-10-01, gives no address, and its terms and privacy
    URLs return not-found errors. The company is named in the copyright notices of the Unsloth
    repository's license and source files. Y Combinator's directory (San Francisco) and the unslothai GitHub
    profile (United States) agree but are self-reported and were not relied on.
  source_ids: [uspto-tsdr-unsloth, uspto-unsloth-oa-2025-05, uspto-unsloth-roa-2025-06, uspto-unsloth-oa-2025-06, unsloth-about, unsloth-contact, unsloth-license, unsloth-studio-header, yc-unsloth, unsloth-github-org]
  assessed_at: 2026-10-01
openness_summary:
