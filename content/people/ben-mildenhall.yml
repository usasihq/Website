sections:
  - heading: Career
    paragraphs:
      - text: >-
          Mildenhall received a PhD from UC Berkeley in 2020, advised by Ren Ng and supported by a Hertz
          fellowship, and had earlier internships in Marc Levoy's group at Google Research in 2017 and at Fyusion
          in 2018. From 2021 to 2023 Mildenhall was a research scientist at Google Research.
        source_ids: [mildenhall-site]
      - text: >-
          World Labs names Mildenhall as one of its founders, alongside Fei-Fei Li, Justin Johnson and Christoph
          Lassner. Mildenhall's own site describes current work on graphics and 3D computer vision at World Labs.
        source_ids: [worldlabs-about, mildenhall-site]
  - heading: Research
    paragraphs:
      - text: >-
          Mildenhall was first author of the 2020 NeRF paper on neural radiance fields. Later papers with Jonathan
          Barron and colleagues extended the approach: Mip-NeRF 360 (2021) handled unbounded scenes, and Zip-NeRF
          (2023) combined anti-aliasing with grid-based representations.
        source_ids: [nerf-paper, mipnerf360-paper, zipnerf-paper]
      - text: >-
          Mildenhall also co-authored DreamFusion (2022), which generates 3D content from text prompts using a 2D
          diffusion model, and ReconFusion (2024), which uses diffusion priors for 3D reconstruction from few
          images.
        source_ids: [dreamfusion-paper, mildenhall-site]
