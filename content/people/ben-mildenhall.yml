headline: Co-founder of World Labs and first author of the NeRF paper on neural radiance fields for view synthesis
bio:
  text: >-
    Ben Mildenhall is one of the co-founders of World Labs, where Mildenhall works on problems in graphics and
    3D computer vision. Mildenhall was a research scientist at Google Research from 2021 to 2023, and is the
    first author of the 2020 NeRF paper, which represents scenes as neural radiance fields for view synthesis.
  source_ids: [worldlabs-about, mildenhall-site, nerf-paper]
  reviewed_at: 2026-10-22
