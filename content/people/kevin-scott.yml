headline: Chief Technology Officer of Microsoft; earlier led engineering and operations at LinkedIn
bio:
  text: >-
    Kevin Scott is Microsoft's chief technology officer, driving the company's technical vision and
    working to make Microsoft a good place for engineers, developers, and researchers to work and learn.
    Before Microsoft, Scott was senior vice president of engineering and operations at LinkedIn, and
    earlier held leadership positions at Google in search and ads engineering and oversaw mobile ads
    engineering there. Scott hosts the podcast Behind the Tech, wrote the book "Reprogramming the
    American Dream" about how AI can serve everyone, and has published research on dynamic binary
    rewriting.
