sections:
  - heading: Career
    paragraphs:
      - text: >-
          Scott's career has spanned academic research and industry engineering. At Google, Scott held leadership
          positions in search and ads engineering, helped establish the company's early remote engineering
          centers, and later oversaw mobile ads engineering, including the integration of AdMob, where Scott was
          responsible for engineering and operations.
        source_ids: [ms-exec-bio]
      - text: >-
          Scott then became senior vice president of engineering and operations at LinkedIn, helping build its
          technology and engineering teams. As Microsoft's chief technology officer, Scott drives the company's
          technical vision and works to make Microsoft a good place for engineers, developers and researchers.
          Microsoft's biography also lists Scott as a member of Shopify's board of directors and as founder of
          the nonprofit Behind the Tech.
        source_ids: [ms-exec-bio]
  - heading: Writing and research
    paragraphs:
      - text: >-
          Scott wrote "Reprogramming the American Dream", which Microsoft's AI Blog announced in April 2020 ahead of
          its release on April 7; the book explores how artificial intelligence can serve the interests of
          everyone. Scott also hosts the Behind the Tech podcast, which features conversations with people who
          helped build the technology industry.
        source_ids: [ms-exec-bio, book-post]
      - text: >-
          Microsoft's biography notes that Scott has published research on dynamic binary rewriting. Scott is
          also a co-inventor on patents related to search and information extraction.
        source_ids: [ms-exec-bio]
