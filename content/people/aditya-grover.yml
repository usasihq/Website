headline: Co-founder and CTO of Inception; Assistant Professor of Computer Science at UCLA leading the MINT group
bio:
  text: >-
    Aditya Grover is a co-founder and the CTO of Inception, a company developing fast, parallel
    large language models based on diffusion, and an Assistant Professor of Computer Science at
    UCLA, where Grover leads the Machine Intelligence (MINT) group. Grover's research sits at the
    intersection of generative models, reinforcement learning and applications to scientific
    discovery.
  source_ids: [grover-site]
  reviewed_at: 2026-10-21
