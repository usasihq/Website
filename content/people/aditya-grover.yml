sections:
  - heading: Career
    paragraphs:
      - text: >-
          Grover's site lists earlier research work at Google DeepMind, Microsoft Research and
          OpenAI, and a gap year as a research scientist at Meta's Fundamental AI Research group.
        source_ids: [grover-site]
      - text: >-
          Grover now leads the MINT group at UCLA and is co-founder and CTO of Inception, whose team
          launched Mercury, a family of commercial-scale diffusion language models.
        source_ids: [grover-site, mercury-paper]
  - heading: Research
    paragraphs:
      - text: >-
          With Jure Leskovec, Grover co-authored node2vec, a method for learning feature
          representations of nodes in networks. Later work includes the Decision Transformer, which
          treats reinforcement learning as sequence modeling, and ClimaX and Stormer for
          machine-learning weather forecasting.
        source_ids: [node2vec-paper, dt-paper, climax-paper, grover-site]
      - text: >-
          Grover is also the senior author of d1, a paper on scaling reasoning in diffusion
          language models through reinforcement learning.
        source_ids: [d1-paper]
