    artifact_slug: null
    type: open-source
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/
    contribution: >-
      Announced the Linux kernel in August 1991, according to the Linux Foundation, and is listed
      in the kernel's MAINTAINERS file as the maintainer of "THE REST", the catch-all entry for
      files without another maintainer. The kernel's COPYING file licenses it under GPL-2.0 with
      the Linux syscall note.
    source_ids: [lf-leadership, linux-maintainers, linux-copying]
  - name: Git
    artifact_slug: null
    type: open-source
    url: https://github.com/git/git
    contribution: >-
      Wrote the first version of Git in 2005, according to the Linux Foundation. Git's README says
      the project was originally written by Torvalds, who also gave it its name, and that it is
      covered by the GNU General Public License version 2.
    source_ids: [git-readme, lf-leadership]
