headline: Creator and maintainer of the Linux kernel and creator of Git; Fellow at the Linux Foundation
bio:
  text: >-
    Linus Torvalds is a Fellow of the Linux Foundation, which describes Torvalds as having
    announced the Linux kernel in August 1991 and as still having the final say on new code
    accepted into the standard kernel. The kernel's MAINTAINERS file lists Torvalds for "THE
    REST", the entry covering every file that has no other maintainer, and the main kernel tree on
    kernel.org is published under Torvalds's name. In 2005 Torvalds wrote the first version of
    Git, the distributed version-control system; Git's README credits Torvalds with the original
    code and the name. The IEEE Computer Society gave Torvalds its 2014 Computer Pioneer Award, and
    the Computer History Museum named Torvalds a Fellow in 2008, both for work on the Linux kernel.
  source_ids: [lf-leadership, linux-maintainers, git-readme, ieee-profile, chm-fellow]
  reviewed_at: 2026-10-21
