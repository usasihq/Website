sections:
  - heading: Linux kernel
    paragraphs:
      - text: >-
          Torvalds began work on a new operating system kernel, later named Linux, in 1991, and announced the
          project in August of that year. Torvalds's master's thesis was titled "Linux: A Portable Operating
          System". Working with a growing team of volunteers, Torvalds released version 1.0 of the kernel in the
          spring of 1994.
        source_ids: [ieee-profile, chm-fellow, lf-leadership]
      - text: >-
          Torvalds later joined Transmeta, a start-up designing an energy-saving processor, while continuing to
          oversee kernel development. In 2003 Torvalds left Transmeta to work on the kernel full time with the
          backing of the Open Source Development Labs, which merged with the Free Standards Group in 2007 to form
          the Linux Foundation, where Torvalds is a Fellow.
        source_ids: [ieee-profile, lf-leadership]
      - text: >-
          Torvalds remains the final authority on new code accepted into the standard kernel. The kernel's
          MAINTAINERS file lists Torvalds for "THE REST", the catch-all entry for files without another maintainer,
          and major releases such as Linux 3.0 and 6.0 were tagged by Torvalds in the mainline tree. The kernel is distributed under the GPL-2.0 license with a syscall exception described in
          its COPYING file.
        source_ids: [lf-leadership, linux-maintainers, linux-v3-tag, linux-v6-tag, linux-copying]
  - heading: Git
    paragraphs:
      - text: >-
          In 2005 Torvalds created Git, a distributed version-control system, after finding that existing free
          and open-source tools did not meet Torvalds's needs for performance and scale. Git's README
          credits Torvalds with the original code and the name, and the project's first commit, "Initial revision
          of git, the information manager from hell", is authored by Torvalds.
        source_ids: [lf-leadership, git-readme, git-initial-commit]
