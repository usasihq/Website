headline: Harvard Kennedy School assistant professor working on AI safeguards, incidents, and governance
bio:
  text: >-
    Stephen Casper is a computer scientist and an Assistant Professor at the Harvard
    Kennedy School, as well as a Faculty Affiliate with the Harvard School of Engineering and Applied
    Sciences. Casper works on AI safeguards, incidents, and governance, and completed a PhD at MIT.
    Casper is first author of a survey of open problems and fundamental limitations of reinforcement
    learning from human feedback (RLHF), and of a paper examining the limitations of black-box AI
    audits and the advantages of white-box and outside-the-box access.
