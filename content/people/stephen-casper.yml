sections:
  - heading: Career
    paragraphs:
      - text: >-
          Stephen Casper, who goes by Cas, completed a PhD at MIT and worked at the UK AI Security
          Institute before joining the Harvard Kennedy School as an Assistant Professor. Casper is
          also a Faculty Affiliate with the Harvard School of Engineering and Applied Sciences and a
          Faculty Associate with Harvard's Berkman Klein Center.
        source_ids: [casper-site]
      - text: >-
          Casper's homepage lists a research stream led for the MATS program and mentoring for ERA and
          GovAI. Casper is a writer for the International AI Safety Report and a lead writer for the
          Singapore Consensus on global AI safety research priorities.
        source_ids: [casper-site, singapore-consensus-2026]
  - heading: Research
    paragraphs:
      - text: >-
          Casper's research covers technical safeguards for AI systems, how AI incidents unfold, and
          governance. The 2023 RLHF survey that Casper co-led catalogues open problems with
          reinforcement learning from human feedback, and the 2024 audits paper argues that auditors
          need more than query-only access to models to evaluate them rigorously.
        source_ids: [casper-site, rlhf-open-problems-paper, black-box-audits-paper]
      - text: >-
          Casper is a co-author of a 2024 paper showing that latent adversarial training can make
          language models more robust to persistent harmful behaviors, and a co-first author of Deep
          Ignorance (2025), which studies filtering pretraining data to build tamper-resistant
          safeguards into open-weight models. Casper also led The AI Agent Index (2025), a public
          database documenting the components, intended uses and safety features of deployed agentic
          AI systems.
        source_ids: [lat-paper, deep-ignorance-paper, agent-index-paper, casper-site]
