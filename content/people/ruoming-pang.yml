headline: Overall lead of Apple's 2024 foundation language models and corresponding author of AXLearn; now at Meta
bio:
  text: >-
    Ruoming Pang's GitHub profile lists Meta as Pang's organization, and Pang is listed with Meta Platforms
    on a May 2026 paper about communication optimization for large-scale model training across data
    centers. At Apple, Pang was the overall lead of the foundation models contributors on the 2024 Apple
    Intelligence Foundation Language Models report, which describes an on-device model of about 3 billion
    parameters and a larger server model, and is the corresponding author of the paper on AXLearn, Apple's
    open-source system for modular, hardware-agnostic training of large models. Earlier, Pang was listed
    with Google Inc. as an author of the 2020 Conformer paper on convolution-augmented Transformers for
    speech recognition.
  source_ids: [github-profile, scaleacross-paper, apple-fm-paper, axlearn-paper, conformer-paper]
  reviewed_at: 2026-10-13
