sections:
  - heading: Research at Google
    paragraphs:
      - text: >-
          Ruoming Pang's earlier papers, written at Google, centre on speech recognition and sequence-model
          infrastructure. Pang is among the authors of the 2019 paper describing Lingvo, a modular and scalable
          TensorFlow framework for sequence-to-sequence modeling, and co-authored the 2020 ContextNet and
          Conformer papers, which improve speech recognition with global context in convolutional networks and
          by combining convolution with Transformer self-attention.
        source_ids: [lingvo-paper, contextnet-paper, conformer-paper]
  - heading: Foundation models and training systems
    paragraphs:
      - text: >-
          At Apple, Pang was the overall lead of the foundation models contributors on the July 2024 Apple
          Intelligence Foundation Language Models report, which describes an on-device model of about 3
          billion parameters and a larger server model. Pang is also the corresponding author of the 2025
          paper on AXLearn, Apple's open-source library for modular, hardware-agnostic training of large
          models.
        source_ids: [apple-fm-paper, axlearn-paper, axlearn-license]
      - text: >-
          Pang's recent papers address the systems cost of large models. Parallel Track Transformers (2026)
          reduces synchronization in multi-GPU inference, and ScaleAcross Explorer (May 2026), on which Pang is
          listed with Meta Platforms, studies communication optimization for training spread across data
          center buildings and regions.
        source_ids: [parallel-track-paper, scaleacross-paper, github-profile]
