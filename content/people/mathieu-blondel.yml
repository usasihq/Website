sections:
  - heading: Career
    paragraphs:
      - text: >-
          Blondel obtained a PhD in machine learning from Kobe University in 2013. From 2013 to 2019 Blondel
          was a research scientist at NTT's Communication Science Laboratories, and since 2019 has been a
          research scientist at Google DeepMind.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Much of Blondel's research is on differentiable programming: making operations such as sorting,
          ranking, dynamic programming and optimization usable inside gradient-based learning. Examples
          include Soft-DTW, a differentiable loss for time series (ICML 2017, with Marco Cuturi), "Fast
          Differentiable Sorting and Ranking" (ICML 2020) and "Efficient and Modular Implicit
          Differentiation" (NeurIPS 2022).
        source_ids: [publications, soft-dtw-paper, sorting-paper, jaxopt-paper]
      - text: >-
          Blondel's more recent papers concern language models, including decoding-time realignment (ICML
          2024), teacher hacking in distillation (ICML 2025) and a 2025 preprint arguing that autoregressive
          language models can be read as energy-based models; Blondel is also listed with the Gemini 2.5 and
          Gemma 4 team reports. With Vincent Roulet, Blondel wrote The Elements of Differentiable Programming
          (2024).
        source_ids: [publications, ebm-paper, edp-book]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Blondel was a core developer of scikit-learn and co-author of its 2011 JMLR paper, and led the
          lightning library for large-scale linear classification, regression and ranking. In JAX, Blondel was
          lead developer of JAXopt and a contributor to Optax, and now contributes to gemma, a library for
          using and fine-tuning Gemma models.
        source_ids: [code-page, sklearn-jmlr, sklearn-about, jaxopt-repo, gemma-repo]
