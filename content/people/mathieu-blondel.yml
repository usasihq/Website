headline: Research scientist at Google DeepMind; former lead developer of JAXopt and former scikit-learn core developer
bio:
  text: >-
    Mathieu Blondel has been a research scientist at Google DeepMind since 2019, and from 2013 to
    2019 was a research scientist at NTT's Communication Science Laboratories. Blondel was the lead
    developer of JAXopt, a library of hardware-accelerated, batchable and differentiable
    optimizers in JAX, and is first author of the paper on efficient and modular implicit
    differentiation that the JAXopt README cites for its implicit differentiation framework;
    Blondel also contributed to Optax and now contributes to gemma, a JAX library for using and
    fine-tuning Gemma models. With Vincent Roulet, Blondel wrote The Elements of Differentiable
    Programming, a book reviewing the fundamental concepts of differentiable programming, and
    Blondel is a co-author of the 2011 scikit-learn paper and an emeritus scikit-learn maintainer.
  source_ids: [homepage, code-page, jaxopt-paper, jaxopt-repo, edp-book, sklearn-jmlr, sklearn-about]
