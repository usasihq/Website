sections:
  - heading: Career
    paragraphs:
      - text: >-
          From 2005 to 2015 Douze worked in the LEAR team at INRIA on image indexing, large-scale vector
          indexing, event recognition in videos and similar-video search. Between 2010 and 2015 Douze also
          managed Kinovis, a 3D motion capture studio at INRIA, and developed geometric algorithms for
          constructive solid geometry.
        source_ids: [meta-douze]
      - text: >-
          Douze joined Facebook AI Research (FAIR) as a research scientist in November 2015, working on
          large-scale indexing, machine learning with graphs, and similarity search on images and videos.
        source_ids: [meta-douze]
  - heading: Faiss and research
    paragraphs:
      - text: >-
          The Faiss repository, created in February 2017 under the MIT license, credits Hervé Jégou with
          initiating the project, Douze with implementing most of the CPU Faiss, and Jeff Johnson with the
          GPU Faiss. Douze co-authored "Billion-scale similarity search with GPUs" (2017) and was first
          author of "The Faiss library" (2024).
        source_ids: [faiss-readme, faiss-gpu-paper, faiss-library-paper]
      - text: >-
          Douze's other FAIR publications include work on deep clustering for unsupervised visual features
          (2018), the Stable Signature method for watermarking latent diffusion models (2023), and research
          showing that watermarking can make language models "radioactive" (2024).
        source_ids: [meta-douze]
