headline: Research scientist at Meta FAIR; implemented most of the CPU side of the Faiss similarity search library
bio:
  text: >-
    Matthijs Douze is a research scientist at Meta's Fundamental AI Research (FAIR) lab, where Douze has
    worked since November 2015 on large-scale indexing, machine learning with graphs, and similarity
    search for images and videos. The Faiss README lists Douze among the library's main authors as the
    person who implemented most of the CPU version, and Douze is first author of the 2024 paper "The Faiss
    library". From 2005 to 2015 Douze worked in the LEAR team at INRIA on image and vector indexing and
    video search.
  source_ids: [meta-douze, faiss-readme, faiss-library-paper]
  reviewed_at: 2026-10-22
