headline: Laboratories Director of Sandia National Laboratories since May 2025; systems engineer and NAE member
bio:
  text: >-
    Laura J. McGill is the Director of Sandia National Laboratories, a role Sandia's leadership page
    describes as providing leadership and management direction for all of the laboratory's missions.
    McGill became Sandia's 17th Laboratories Director on May 1, 2025, after serving since January 2021
    as Deputy Laboratories Director for Nuclear Deterrence and Chief Technology Officer, and before
    that spent more than 30 years in the defense industry, including engineering leadership roles
    at Raytheon.
  source_ids: [sandia-mcgill, sandia-mcgill-release]
  reviewed_at: 2026-10-21
