sections:
  - heading: Career
    paragraphs:
      - text: >-
          McGill's career before Sandia was in defense systems engineering at Raytheon, where McGill
          served as chief engineer for the Air Warfare Systems program portfolio, then as vice
          president of engineering for Raytheon Missile Systems, and later as deputy vice president of
          engineering at Raytheon Missiles & Defense. In those roles McGill oversaw systems
          performance, technical execution, test and flight operations, and technology investment.
        source_ids: [sandia-mcgill]
      - text: >-
          McGill joined Sandia in January 2021 as Deputy Laboratories Director for Nuclear Deterrence
          and Chief Technology Officer, guiding the laboratory's contributions to weapon systems
          engineering, development and surveillance. Sandia announced in 2025 that McGill would
          succeed James S. Peery as Laboratories Director, effective May 1, 2025.
        source_ids: [sandia-mcgill, sandia-mcgill-release]
  - heading: Professional service and teaching
    paragraphs:
      - text: >-
          McGill is a Lifetime Fellow of the American Institute of Aeronautics and Astronautics and
          served as its president from 2022 to 2024. McGill has also taught graduate systems
          engineering courses as an adjunct faculty member at the Johns Hopkins University Whiting
          School of Engineering.
        source_ids: [sandia-mcgill, sandia-mcgill-release]
