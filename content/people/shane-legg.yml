headline: Co-founder and Chief AGI Scientist of Google DeepMind; leads its AGI Safety Council
bio:
  text: >-
    Shane Legg is a co-founder of DeepMind, which Demis Hassabis wrote was founded in 2010 along with Legg
    and Mustafa Suleyman, and is Co-Founder and Chief AGI Scientist at Google DeepMind. Google DeepMind's
    responsibility page says Legg leads the AGI Safety Council, which works with the Responsibility and Safety
    Council to safeguard the lab's processes, systems and research against extreme risks from future AGI
    systems. Legg is a co-author of Universal Intelligence: A Definition of Machine Intelligence (2007),
    of Levels of AGI for Operationalizing Progress on the Path to AGI (ICML 2024), of the April 2025 post
    Taking a responsible path to AGI, and of the 2026 report From AGI to ASI.
  source_ids: [gdm-tenth-year, gdm-responsibility, gdm-agi-path, universal-intelligence, levels-of-agi, agi-to-asi]
  reviewed_at: 2026-10-21
