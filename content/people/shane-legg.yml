sections:
  - heading: Career
    paragraphs:
      - text: >-
          Shane Legg co-founded DeepMind in 2010 with Demis Hassabis and Mustafa Suleyman, and Hassabis's
          2019 post describes Legg as the company's Chief Scientist. Google DeepMind now lists Legg as
          Co-Founder and Chief AGI Scientist.
        source_ids: [gdm-tenth-year, gdm-responsibility]
      - text: >-
          At Google DeepMind, Legg leads the AGI Safety Council, which analyzes AGI risk and best practices
          and recommends safety measures. The council works closely with the Responsibility and Safety
          Council to guard the lab's processes, systems and research against extreme risks from future AGI
          systems.
        source_ids: [gdm-responsibility, gdm-agi-path]
  - heading: Research
    paragraphs:
      - text: >-
          With Marcus Hutter, Legg published two 2007 papers on what intelligence means: a survey of
          about seventy informal definitions, and Universal Intelligence, which starts from well-known
          informal definitions and works toward a formal measure for machines. Legg is also among the
          authors of DeepMind's 2015 Nature paper on human-level control through deep reinforcement learning.
        source_ids: [definitions-paper, universal-intelligence, dqn-nature]
      - text: >-
          Legg co-authored several safety papers from DeepMind, including Deep reinforcement learning from
          human preferences (2017), AI Safety Gridworlds (2017), a suite of environments for testing safety
          properties of agents, and Scalable agent alignment via reward modeling (2018), which outlines a
          research direction for the agent alignment problem.
        source_ids: [human-preferences-paper, safety-gridworlds-paper, reward-modeling-paper]
  - heading: AGI frameworks
    paragraphs:
      - text: >-
          Legg is a co-author of Levels of AGI (ICML 2024), which proposes levels of performance, generality
          and autonomy for comparing systems and measuring progress. Legg also co-wrote Google DeepMind's
          April 2025 post Taking a responsible path to AGI and the June 2026 report From AGI to ASI, which
          looks at how AI might keep developing after human-level AGI.
        source_ids: [levels-of-agi, gdm-agi-path, agi-to-asi]
