headline: Bren Professor at Caltech; Fourier Neural Operator co-author; former NVIDIA senior director of AI research
bio:
  text: >-
    Anima Anandkumar is the Bren Professor of Computing and Mathematical Sciences at Caltech.
    Caltech's profile credits Anandkumar with introducing neural operators, which learn mappings
    between function spaces to model phenomena such as fluid dynamics, material behavior and wave
    propagation, and with using them to train an AI-based high-resolution weather model.
    Anandkumar co-authored the 2020 Fourier Neural Operator paper, whose official implementation is
    part of the MIT-licensed NeuralOperator library for PyTorch. Anandkumar joined NVIDIA as
    director of machine learning research in 2018 and later served as senior director of AI
    research there, after an earlier role as principal scientist at Amazon Web Services; Caltech
    lists Anandkumar as a Fellow of the IEEE, ACM and AAAI.
  source_ids: [caltech-profile, nvidia-blog-author, fno-paper, neuraloperator-repo]
  reviewed_at: 2026-10-13
