sections:
  - heading: Career
    paragraphs:
      - text: >-
          NVIDIA's author biography records that Anandkumar was a postdoctoral researcher at MIT, then
          held a visiting researcher role at Microsoft Research New England, and
          assistant and associate professorships at UC Irvine, followed by a role as principal scientist at
          Amazon Web Services. Anandkumar has been Bren Professor in Caltech's Computing and Mathematical
          Sciences department since 2017 and joined NVIDIA in 2018 as director of machine learning research,
          later serving as senior director of AI research.
        source_ids: [nvidia-blog-author, caltech-profile]
      - text: >-
          Anandkumar's Caltech profile lists the course Foundations of Machine Learning and Statistical Inference
          (CS/CNS/EE/IDS 165) for the 2025–26 and 2026–27 academic years.
        source_ids: [caltech-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Anandkumar's earlier research developed tensor methods, probabilistic latent variable models and the
          analysis of non-convex optimization. The 2012 paper "Tensor decompositions for learning latent variable
          models", with Rong Ge, Daniel Hsu, Sham Kakade and Matus Telgarsky, shows how tensor decompositions can
          estimate the parameters of a range of latent variable models.
        source_ids: [caltech-profile, tensor-paper]
      - text: >-
          Caltech credits Anandkumar with introducing neural operators for learning multiscale phenomena such as
          fluid dynamics and wave propagation. The Fourier Neural Operator paper (2020) parameterizes an integral
          kernel in Fourier space, and FourCastNet (2022), on which Anandkumar is a co-author, applies adaptive
          Fourier neural operators to global high-resolution weather forecasting.
        source_ids: [caltech-profile, fno-paper, fourcastnet-paper, neuraloperator-repo]
      - text: >-
          Anandkumar also co-authored work on agents and robotics built on large language models, including
          Voyager, a lifelong-learning agent in Minecraft, and Eureka, which writes reward functions in code for
          reinforcement learning.
        source_ids: [voyager-paper, eureka-paper]
