headline: Vice President of Engineering at Waymo, heading the hardware organization for the Waymo Driver
bio:
  text: >-
    Satish Jeyachandran is Vice President of Engineering at Waymo, where Jeyachandran leads the hardware
    organization that designs and scales the autonomous driving system's lidar, radar, cameras and compute.
    Before Waymo, Jeyachandran spent seven years at Tesla heading the hardware team for the company's
    infotainment and Autopilot systems.
