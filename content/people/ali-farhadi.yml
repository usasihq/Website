sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ali Farhadi completed a PhD at the University of Illinois at Urbana-Champaign under the supervision
          of David Forsyth, then spent a year as a postdoctoral fellow at the Robotics Institute at Carnegie
          Mellon University working with Martial Hebert and Alyosha Efros before joining the University of
          Washington faculty. Farhadi is a Professor in the Allen School and directs the RAIVN Lab together
          with Ranjay Krishna.
        source_ids: [uw-profile, raivn-lab]
      - text: >-
          Farhadi also served as chief executive of the Allen Institute for AI (Ai2), and was quoted in that
          role in Ai2's March 2026 announcement of an open, simulation-first stack for robotics research. By
          May 2026 Ai2 was led by Interim CEO Peter Clark.
        source_ids: [ai2-molmobot, ai2-clark-qa]
  - heading: Research
    paragraphs:
      - text: >-
          Farhadi's research covers computer vision, machine learning, the meeting point of natural language
          and vision, the role of semantics in visual understanding, and visual reasoning. With Joseph Redmon,
          Santosh Divvala and Ross Girshick, Farhadi co-authored the CVPR 2016 paper "You Only Look Once:
          Unified, Real-Time Object Detection", followed by "YOLO9000: Better, Faster, Stronger" with Redmon
          at CVPR 2017.
        source_ids: [af-home, af-pubs]
      - text: >-
          Other work listed on Farhadi's publication page includes XNOR-Net, a 2016 method for ImageNet
          classification with binary convolutional networks, the AI2-THOR interactive 3D environment for
          visual AI, and the HellaSwag and Visual Commonsense Reasoning benchmarks with Rowan Zellers and
          Yejin Choi.
        source_ids: [af-pubs]
  - heading: Open language models
    paragraphs:
      - text: >-
          At Ai2, Farhadi advised the open OLMo language-model effort. The OLMoE paper credits Farhadi with
          advising on pretraining and framing, and the OLMo 2 paper lists Farhadi among those providing
          mentorship and advising.
        source_ids: [olmoe-pdf, olmo2-pdf]
