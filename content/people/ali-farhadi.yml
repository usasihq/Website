headline: University of Washington professor co-directing the RAIVN Lab; former Ai2 CEO who advised on OLMo
bio:
  text: >-
    Ali Farhadi is a Professor in the Paul G. Allen School of Computer Science & Engineering at the
    University of Washington, where Farhadi co-directs the Reasoning, AI, and VisioN (RAIVN) Lab with
    Ranjay Krishna. Farhadi's research spans computer vision, machine learning, the intersection of
    language and vision, and visual reasoning. Farhadi previously served as CEO of the Allen
    Institute for AI (Ai2), and is credited in the OLMo 2 paper with mentorship and advising and in
    the OLMoE paper with advising on pretraining and framing.
  source_ids: [uw-profile, raivn-lab, ai2-molmobot, ai2-clark-qa, olmo2-pdf, olmoe-pdf]
