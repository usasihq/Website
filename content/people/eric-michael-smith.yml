headline: Research scientist at Meta; first author of HolisticBias and a core contributor to Llama 3
bio:
  text: >-
    Eric Michael Smith is a research scientist at Meta; Meta's people page describes Smith as a
    research engineer at Facebook AI Research (FAIR). Smith is first author of the HolisticBias paper
    (2022), which presents a bias-measurement dataset of nearly 600 descriptor terms across 13
    demographic axes, and co-authored Llama 2 (2023), Llama Guard 3 Vision (2024), and the open-domain
    chatbot papers Recipes for Building an Open-Domain Chatbot (2020) and BlenderBot 3 (2022). Smith
    is listed among the core contributors of The Llama 3 Herd of Models (2024) and among the authors of
    Meta's Muse Spark Safety & Preparedness Report (2026).
  source_ids: [meta-profile, holisticbias-paper, llama2-paper, llamaguard3v-paper, blender-paper, bb3-paper, llama3-paper, muse-report]
  reviewed_at: 2026-10-21
