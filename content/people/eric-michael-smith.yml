sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before joining Facebook AI Research, Smith was a machine learning engineer at Blue Apron, where
          Smith built and maintained the company's forecast of relative order volume for upcoming product
          offerings, and was a fellow of Insight Data Science. Meta's people page now lists Smith as a
          research scientist, with research areas including conversational AI, natural language processing and
          core machine learning.
        source_ids: [meta-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Smith's early FAIR work was on dialogue and text style. Smith was first author of
          "Can You Put it All Together", an ACL 2020 paper on evaluating how conversational agents blend
          skills, and of a paper on controlling style in generated dialogue, and co-authored "Recipes for
          Building an Open-Domain Chatbot" and BlenderBot 3.
        source_ids: [bst-paper, style-paper, blender-paper, bb3-paper]
      - text: >-
          From 2021 Smith's work turned to measuring and reducing bias and harm in language models,
          beginning with a study of how names affect generative dialogue models and continuing with the
          HolisticBias dataset in 2022. Smith later co-authored safety work on Llama models, including Llama
          Guard 3 Vision, and alignment research such as "The Alignment Waltz" (ICLR 2026).
        source_ids: [names-paper, holisticbias-paper, llamaguard3v-paper, waltz-paper]
  - heading: Llama and Muse models
    paragraphs:
      - text: >-
          Smith is a co-author of Llama 2 (2023) and a core contributor to The Llama 3 Herd of Models (2024).
          In 2026 Smith was listed among the authors of the Muse Spark Safety & Preparedness Report and of the
          technical report for Muse Glimmer 30B, an on-device agentic model.
        source_ids: [llama2-paper, llama3-paper, muse-report, glimmer-paper]
