sections:
  - heading: Career
    paragraphs:
      - text: >-
          At Princeton University, Lieret researched graph neural networks for particle tracking in high
          energy physics experiments, giving talks on object condensation pipelines in 2023, and then agentic
          AI for software engineering. Lieret joined Meta FAIR as an AI Research Scientist in February 2026,
          and Lieret's site now gives the role as AI Research Scientist at Meta Superintelligence Labs.
        source_ids: [lieret-site]
  - heading: Software engineering agents
    paragraphs:
      - text: >-
          Lieret co-authored SWE-agent (2024) with John Yang, Carlos E. Jimenez, Ofir Press and others, and
          SWE-smith (2025), which was accepted as a NeurIPS 2025 spotlight. Lieret's site also lists
          mini-swe-agent (July 2025), the CodeClash benchmark (November 2025) and ProgramBench (May 2026).
        source_ids: [swe-agent-paper, swe-smith-paper, lieret-site]
      - text: >-
          SWE-sweep, released by Meta with Lieret as first author and John Yang as last author, asks agents
          to discover and repair bugs in real repositories without hints. Its scoring runs hidden tests per
          bug and scores a task as zero if the agent's patch breaks previously passing tests.
        source_ids: [swesweep-site, swesweep-readme]
