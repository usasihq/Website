headline: AI research scientist at Meta Superintelligence Labs; lead author of the SWE-sweep bug-fixing benchmark
bio:
  text: >-
    Kilian Lieret is an AI Research Scientist at Meta Superintelligence Labs, which Lieret joined in
    February 2026. Lieret is the first author of SWE-sweep, a Meta benchmark that asks agents to discover
    and repair as many bugs as they can in a real repository. Before Meta, Lieret was at Princeton
    University researching agentic AI for software engineering and graph neural networks for high energy
    physics, and co-authored SWE-agent and SWE-smith.
  source_ids: [lieret-site, swesweep-site, swesweep-readme, swe-agent-paper, swe-smith-paper]
  reviewed_at: 2026-10-22
