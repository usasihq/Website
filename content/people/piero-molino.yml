headline: Creator of the Ludwig declarative deep learning framework; CEO and co-founder of Studio Atelico
bio:
  text: >-
    Piero Molino is the CEO and co-founder of Studio Atelico, an AI-first games studio building
    on-device AI engines for video games. Molino created Ludwig, a declarative deep learning framework
    now hosted by the Linux Foundation AI & Data, while working at Uber AI Labs, and from 2020 to 2025
    was CEO, CSO and co-founder of Predibase, a platform for fine-tuning and serving large language
    models through Ludwig and LoRAX. Molino's CV also lists a 2020–2021 role as Staff Research
    Scientist at Stanford University in Chris Ré's Hazy Research group, working on ML systems, and an
    earlier researcher role at IBM Watson on natural language processing and question answering.
  source_ids: [molino-about, ludwig-repo]
  reviewed_at: 2026-10-21
