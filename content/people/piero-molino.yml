sections:
  - heading: Career
    paragraphs:
      - text: >-
          Piero Molino co-founded QuestionCube, a startup working on question answering, and served
          as its CTO from 2011 to 2015; Molino's PhD thesis, completed in 2015, was on semantics and
          question answering. Molino then worked as a researcher at IBM
          Watson on question understanding, cognitive search and text classification, and in 2016
          as a machine learning scientist at Geometric Intelligence.
        source_ids: [molino-about]
      - text: >-
          After Uber acquired Geometric Intelligence and created Uber AI Labs, Molino worked there
          from 2017 to 2020 on natural language processing, dialogue systems and graph learning,
          rising to Senior Research Scientist II. Molino spent 2020 to 2021 as a Staff Research
          Scientist in Chris Ré's Hazy Research group at Stanford, co-founded Predibase in 2020 with
          Travis Addair, Dev Rishi and Chris Ré, and in 2025 co-founded Studio Atelico, which
          Molino leads as CEO.
        source_ids: [molino-about]
  - heading: Open-source work
    paragraphs:
      - text: >-
          At Uber AI Labs Molino created Ludwig, a declarative deep learning framework described in
          a 2019 paper with Yaroslav Dudin and Sai Sumanth Miryala. The Apache-2.0 project is now
          hosted by the Linux Foundation AI & Data. At Predibase, Ludwig and the LoRAX multi-LoRA
          inference server formed the basis for fine-tuning and serving language models.
        source_ids: [molino-about, ludwig-paper, ludwig-repo, lorax-repo]
  - heading: Research
    paragraphs:
      - text: >-
          Molino's publications include the CoordConv paper on a failing of convolutional networks
          (NeurIPS 2018), Plug and Play Language Models for controlled text generation (ICLR 2020),
          and a 2021 NeurIPS paper on personalized benchmarking with the Ludwig Benchmarking
          Toolkit. Other projects listed on Molino's site include the Plato conversational AI
          platform, the COTA customer support assistant and the Manifold model visualization tool.
        source_ids: [molino-pubs, coordconv-paper, pplm-paper, molino-projects]
