sections:
  - heading: Research
    paragraphs:
      - text: >-
          Shapourian's Zamba2-VL report, posted in May 2026 with Kasra Hejazi, Olabode M. Sule and Beren
          Millidge, adapts Zyphra's Zamba2 hybrid state-space language models to image understanding. Zyphra's
          release post describes the family as competitive with transformer-based open vision-language models
          of similar size while having lower time-to-first-token.
        source_ids: [zamba2-vl-paper, zyphra-zamba2-vl]
      - text: >-
          The same author group is credited on Zyphra's ZAYA1-VL-8B release from May 2026. Earlier, in March
          2024, Shapourian was listed with a Cisco affiliation among the co-authors of Zyphra's post "The
          Unreasonable Ineffectiveness of the Deeper Layers".
        source_ids: [zyphra-zaya1-vl, zyphra-deeper-layers]
