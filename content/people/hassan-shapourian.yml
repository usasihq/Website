headline: First author of Zyphra's Zamba2-VL technical report and ZAYA1-VL-8B release on open vision-language models
bio:
  text: >-
    Hassan Shapourian is the first author of the Zamba2-VL technical report (2026), which describes
    Zyphra's open vision-language models built on the Zamba2 hybrid SSM-transformer backbone at 1.2B,
    2.7B and 7B parameters and released under Apache 2.0. Shapourian is also the first-listed author
    of Zyphra's May 2026 ZAYA1-VL-8B release, and in 2024 was credited, with a Cisco affiliation, as a
    co-author of Zyphra's post on pruning the deeper layers of language models.
  source_ids: [zamba2-vl-paper, zyphra-zamba2-vl, zyphra-zaya1-vl, zyphra-deeper-layers]
