sections:
  - heading: Career
    paragraphs:
      - text: >-
          Yang Song completed a PhD in computer science at Stanford University advised by Stefano Ermon,
          with a dissertation titled "Learning to Generate Data by Estimating Gradients of the Data
          Distribution". Song later led the strategic explorations team at OpenAI, and is now the Research
          Principal at Meta Superintelligence Labs, working with Chief Scientist Shengjia Zhao on the
          lab's research direction.
        source_ids: [song-site]
  - heading: Research
    paragraphs:
      - text: >-
          Song's doctoral work developed score-based generative modeling, which learns the gradients of
          log data densities rather than normalized probabilities. With Stefano Ermon, Song presented
          "Generative Modeling by Estimating Gradients of the Data Distribution" as an oral at NeurIPS
          2019, and the 2020 paper on score-based modeling through stochastic differential equations
          unified score-based and diffusion probabilistic approaches; it received an ICLR 2021 Outstanding
          Paper Award.
        source_ids: [song-site, ncsn-paper, sde-paper]
      - text: >-
          Later work focused on faster sampling. Consistency Models (ICML 2023) support one-step
          generation, the follow-up on improved consistency training was an ICLR 2024 oral, and the
          continuous-time consistency models paper with Cheng Lu, an ICLR 2025 oral, trained such models
          at a scale of 1.5 billion parameters on ImageNet 512x512.
        source_ids: [song-site, cm-paper, ict-paper, scm-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Song published the official implementation of the score SDE paper in the yang-song/score_sde
          repository under the Apache 2.0 license. OpenAI's consistency_models repository releases code
          and checkpoints for the consistency models work under the MIT License.
        source_ids: [sde-repo, cm-readme]
