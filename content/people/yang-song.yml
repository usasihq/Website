headline: Research Principal at Meta Superintelligence Labs; first author of the score SDE and consistency models papers
bio:
  text: >-
    Yang Song is the Research Principal at Meta Superintelligence Labs (MSL), working with the lab's
    Chief Scientist to help shape its research direction. Before joining Meta, Song led the strategic
    explorations team at OpenAI. During a PhD in computer science at Stanford University advised by
    Stefano Ermon, Song developed core concepts and techniques behind score-based diffusion models,
    including "Score-Based Generative Modeling through Stochastic Differential Equations", whose
    official implementation is released under the Apache 2.0 license. Song is also first author of
    "Consistency Models" and "Improved Techniques for Training Consistency Models", whose code OpenAI
    publishes under the MIT License, and co-authored work on continuous-time consistency models with
    Cheng Lu.
  source_ids: [song-site, sde-paper, sde-repo, cm-paper, ict-paper, scm-paper, cm-readme]
