sections:
  - heading: Career
    paragraphs:
      - text: >-
          Bourke began learning to code independently in 2017, focusing on machine learning and artificial
          intelligence through a self-designed curriculum Bourke calls an Artificial Intelligence Masters
          Degree. Bourke then worked as a machine learning engineer at Max Kelsen before becoming self-employed
          in 2019. Bourke's site describes current work evaluating AI models as a Member of Technical Staff at
          Artificial Analysis, alongside building custom on-device, low-latency models for companies.
        source_ids: [about]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Bourke teaches four video courses through the Zero to Mastery Academy, taught with partner Andrei in an
          apprenticeship style where students write code along with the instructor. The courses cover data science
          and machine learning for beginners, the Hugging Face ecosystem, deep learning with PyTorch, and deep
          learning with TensorFlow, and several have companion sites such as learnpytorch.io and
          learntensorflow.io.
        source_ids: [ml-courses]
      - text: >-
          Learn Hugging Face, Bourke's tutorial site, works through end-to-end projects such as fine-tuning a
          small language model for structured data extraction, building custom text classification and object
          detection models with demos, and building a multimodal retrieval-augmented generation pipeline. Bourke
          has also published a novel, Charlie Walks, about a machine learning engineer who wants to be a writer.
        source_ids: [learn-hf, charlie-walks]
  - heading: Channel and projects
    paragraphs:
      - text: >-
          Bourke's YouTube channel, which joined the platform in August 2016, introduces Bourke as a machine
          learning engineer working at the intersection of technology and health. Current projects listed on
          Bourke's site include Nutrify, an app that identifies food from a photo, KeepTrack, an app for keeping
          track of belongings for insurance purposes, and learnml.io, a site of technical machine learning posts.
        source_ids: [channel, about]
