headline: Machine learning teacher and YouTube creator; Member of Technical Staff at Artificial Analysis
bio:
  text: >-
    Daniel Bourke is a writer and machine learning engineer who makes YouTube videos about technology
    and health, and teaches machine learning and deep learning at the Zero to Mastery Academy. Daniel
    runs learnhuggingface.com, a tutorial site for the Hugging Face ecosystem, and learnml.io, a site of
    more technical machine learning posts, and builds Nutrify, an app that identifies food from a photo.
    Daniel also helps evaluate AI models as a Member of Technical Staff at Artificial Analysis.
  source_ids: [about, channel]
  reviewed_at: 2026-10-21
