headline: llama.cpp code owner for model conversion, gguf-py and core model code; Hugging Face
bio:
  text: >-
    Sigbjørn Skjæret, who publishes on GitHub as CISC, contributes to llama.cpp, the C/C++ runtime
    for running language models on local hardware; Skjæret's GitHub profile lists Hugging Face as
    company and shows membership in the huggingface and ggml-org organizations. In llama.cpp's
    CODEOWNERS file, Skjæret owns the model conversion scripts, the gguf-py Python package, the
    core model, architecture, graph and vocabulary code, and the Jinja template code in common, and
    is a member of the CI team. Skjæret's recent commits cover the project's CI and release
    workflows, Jinja template support, GGUF tokenizer handling, and model fixes.
  source_ids: [github-profile, llama-cpp-codeowners, llama-cpp-commits]
  reviewed_at: 2026-10-13
