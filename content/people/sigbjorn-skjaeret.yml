    text: Added detection of NFC normalization to the gguf-py package.
    source_ids: [llama-cpp-commits]
  - date: "2026-10-17"
    text: Added a grouped experts top-k fusion to llama.cpp's CUDA backend.
    source_ids: [llama-cpp-commits]
