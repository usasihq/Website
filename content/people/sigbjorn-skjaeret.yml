sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Skjæret, who works on GitHub as CISC, is a code owner in llama.cpp, the MIT-licensed C/C++ project for
          running language models on local hardware. The project's CODEOWNERS file assigns Skjæret ownership of the
          Python model conversion scripts and the gguf-py package, of core model code including the architecture,
          graph, vocabulary, adapter and per-model source files, of the Jinja template code in common, and of the
          Python requirements files. Skjæret is also listed in the project's CI team.
        source_ids: [llama-cpp-codeowners, llama-cpp-license, github-profile]
      - text: >-
          Skjæret's commits from September and October 2026 show much of this work. They include refactoring the
          continuous integration and release workflows, adding a Windows Arm64 Vulkan release build, extending the
          built-in Jinja template engine with features such as dict support and new test statements, refining how
          gguf-py handles tokenizer special tokens and normalization, adding fill-in-the-middle tokens for PLaMo
          models, and a CUDA fusion for grouped experts top-k selection.
        source_ids: [llama-cpp-commits]
timeline:
