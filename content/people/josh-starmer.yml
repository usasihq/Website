sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Josh Starmer started StatQuest to explain statistics to former co-workers, genetics
          researchers who generated data but did not always know how to analyze it, and has since made
          it a YouTube channel. The channel's description says each method in
          statistics, machine learning, data science and AI is a combination of small and simple steps,
          and that the goal is to break the major methods into easy-to-understand pieces without
          dumbing them down.
        source_ids: [about, channel]
      - text: >-
          Recent videos on the StatQuest site cover topics such as the essence of linear regression
          and optimization with linear programming and the simplex algorithm, presented in both
          main-ideas and mathematical-details versions.
        source_ids: [homepage]
  - heading: Books
    paragraphs:
      - text: >-
          Starmer wrote The StatQuest Illustrated Guide to Machine Learning, a fully illustrated book
          that runs from basic concepts such as cross validation and gradient descent through decision
          trees, support vector machines and neural networks, and which has been translated into
          Chinese, German, Korean and Spanish. A second book, The StatQuest Illustrated Guide to Neural
          Networks and AI, covers backpropagation, convolutional and recurrent networks, word embeddings,
          attention and decoder-only and encoder-only transformers, with hands-on PyTorch tutorials.
        source_ids: [store]
