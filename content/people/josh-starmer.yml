headline: Creator of StatQuest, videos and illustrated books explaining statistics, machine learning, and AI
bio:
  text: >-
    Josh Starmer makes StatQuest, a YouTube channel and website that break statistics, machine learning,
    data science, and AI methods into small, simple steps explained with pictures. StatQuest's about page
    says it began as a way to explain statistics to Josh's former co-workers, genetics researchers at
    UNC-Chapel Hill. Josh is the author of The StatQuest Illustrated Guide to Machine Learning and The
    StatQuest Illustrated Guide to Neural Networks and AI, which runs from backpropagation to transformers
    and includes PyTorch tutorials.
