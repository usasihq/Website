sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hamel Husain did applied machine learning at Airbnb and at GitHub, where Husain's homepage says
          early LLM research on code understanding was carried out; Husain is first author of the 2019
          CodeSearchNet Challenge paper from that period. Husain now works as a machine learning engineer
          and independent consultant at Parlance Labs, helping teams build AI products.
        source_ids: [husain-site, github-profile, codesearchnet-paper]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Husain's writing focuses on what Husain calls evals: debugging, analyzing and measuring AI
          systems. Long-form posts on Husain's blog include "Your AI Product Needs Evals" (March 2024),
          a guide to using LLM-as-a-judge validated against human labels (October 2024), and "A Field
          Guide to Rapidly Improving AI Products" (March 2025).
        source_ids: [husain-site, post-evals, post-llm-judge, post-field-guide]
      - text: >-
          With Shreya Shankar, Husain co-teaches the Maven course AI Evals for Engineers and PMs. In July
          2024 Husain released Mastering LLMs, a free survey course of workshops and talks by practitioners
          on evals, retrieval-augmented generation, fine-tuning and prompt engineering. Husain also
          co-wrote the 2024 essay "What We've Learned From A Year of Building with LLMs".
        source_ids: [maven-course, post-course, applied-llms]
  - heading: Open-source work
    paragraphs:
      - text: >-
          While at GitHub, Husain wrote the November 2020 GitHub blog post introducing nbdev, a literate
          programming environment built on Jupyter notebooks that GitHub helped fast.ai develop; nbdev is
          published under the Apache 2.0 license. Husain's blog later includes a January 2026 post on why
          Husain stopped using nbdev.
        source_ids: [github-blog-nbdev, nbdev-license, husain-site]
