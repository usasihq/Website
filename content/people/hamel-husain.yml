headline: ML engineer and consultant at Parlance Labs; earlier applied ML at GitHub and first author of CodeSearchNet
bio:
  text: >-
    Hamel Husain is a machine learning engineer and independent consultant at Parlance Labs who
    helps teams debug, analyze, and measure their AI systems, work Husain calls evals, and co-teaches
    a course on AI evals for engineers and product managers. Husain previously did applied machine
    learning at GitHub and Airbnb; Husain's homepage links early LLM research from that time, the
    CodeSearchNet Challenge paper (2019), of which Husain is first author. At GitHub, Husain also
    wrote the 2020 GitHub blog post introducing nbdev, a literate programming environment for
    Python that GitHub helped fast.ai develop. Husain is a co-author, with Eugene Yan, Shreya
    Shankar, and others, of "What We've Learned From A Year of Building with LLMs" (2024).
  source_ids: [github-profile, husain-site, codesearchnet-paper, github-blog-nbdev, applied-llms]
  reviewed_at: 2026-10-13
