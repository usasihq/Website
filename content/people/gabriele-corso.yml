sections:
  - heading: Research
    paragraphs:
      - text: >-
          Corso's research applies generative models to molecular structure. DiffDock, posted in
          October 2022 with Hannes Stärk, Bowen Jing, Regina Barzilay and Tommi Jaakkola, treats
          docking a small molecule to a protein as a diffusion process over the molecule's position,
          orientation and torsion angles.
        source_ids: [diffdock-paper]
  - heading: Boltz models
    paragraphs:
      - text: >-
          Boltz is a family of open models for predicting biomolecular interactions, released with
          code and weights under the MIT license. The Boltz-1 technical report appeared in November
          2024, and Boltz-2, which jointly models complex structures and binding affinities,
          followed in June 2025.
        source_ids: [boltz-readme, boltz1-report, boltz2-report]
  - heading: Boltz PBC
    paragraphs:
      - text: >-
          The Boltz models began as research at MIT. In January 2026, Gabriele Corso, Jeremy
          Wohlwend and Saro Passaro announced that they had founded Boltz as a public benefit
          corporation to keep releasing open models while building products for drug discovery.
        source_ids: [boltz-manifesto]
      - text: >-
          The launch introduced a preview of Boltz Lab, a platform for running the models and new
          small-molecule and protein design agents, along with a partnership with Pfizer.
        source_ids: [boltz-launch]
