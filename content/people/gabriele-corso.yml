headline: Co-founder of Boltz and co-author of the open Boltz models and DiffDock for molecular modeling
bio:
  text: >-
    Gabriele Corso is a co-founder of Boltz, a public benefit corporation that develops open models
    and agents for AI-driven drug discovery. Corso co-authored the Boltz-1 and Boltz-2 biomolecular
    models, which began as research at MIT, and is first author of DiffDock, a diffusion model for
    molecular docking.
  source_ids: [boltz-manifesto, boltz-readme, diffdock-paper]
  reviewed_at: 2026-10-21
