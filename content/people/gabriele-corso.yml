      weights are released under the MIT license.
    source_ids: [boltz-readme, boltz1-report, boltz2-report]
  - name: DiffDock
    artifact_slug: null
    url: https://arxiv.org/abs/2210.01776
    contribution: >-
      First author of DiffDock (2022), which frames molecular docking as a generative modeling
      problem solved with a diffusion process over ligand poses.
    source_ids: [diffdock-paper]
