headline: PyTorch module maintainer for torch.optim and for the C++ API (libtorch and the stable ABI)
bio:
  text: >-
    Jane Xu is listed on PyTorch's maintainers page as a module maintainer for the optimizers
    package (torch.optim) and for the C++ API (libtorch and StableABI). The PyTorch CODEOWNERS file
    names Xu, under the GitHub handle janeyx99, as an owner of torch/optim and its tests, of the
    foreach and fused kernel sources, and of the stable C++ shim and header-only API directories.
  source_ids: [pytorch-maintainers, pytorch-codeowners]
  reviewed_at: 2026-10-13
