sections:
  - heading: Career
    paragraphs:
      - text: >-
          Peter Sarlin's CV lists a PhD in information systems specializing in machine learning (2009–2013), followed by a professorship in the Department of
          Economics at Hanken School of Economics from 2014 to 2022. Since 2022 Sarlin has been Professor
          of Practice in applied machine learning and AI at Aalto University.
        source_ids: [zalando-cv]
      - text: >-
          Sarlin co-founded Silo AI in 2017 and served as its CEO and a board member until 2026. When AMD
          announced in July 2024 that it would acquire Silo AI, the company said Sarlin would continue to
          lead the Silo AI team within the AMD Artificial Intelligence Group; AMD completed the deal in
          August 2024. Since 2025 Sarlin has been founder and chairperson of the board of Qutwo Oy and
          NestAI Oy.
        source_ids: [zalando-cv, amd-silo-announce, amd-silo-complete]
  - heading: Open models
    paragraphs:
      - text: >-
          AMD's acquisition announcement describes Silo AI as building open-source multilingual language
          models such as Poro and Viking on AMD platforms, alongside its SiloGen model platform. Sarlin is
          a co-author of the April 2024 paper Poro 34B and the Blessing of Multilinguality, which argues
          that training on more than one language can help models for languages with limited text.
        source_ids: [amd-silo-announce, poro-paper]
      - text: >-
          The Poro 34B model card credits SiloGen from Silo AI, the TurkuNLP group at the University of
          Turku, and HPLT as the model's creators and lists the Apache 2.0 license.
        source_ids: [poro-card]
