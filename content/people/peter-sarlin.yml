headline: Co-founder and former CEO of Silo AI, acquired by AMD in 2024; co-author of the Poro 34B open model paper
bio:
  text: >-
    Peter Sarlin co-founded Silo AI and was its CEO when AMD announced in July 2024 that it would
    acquire the company, saying Sarlin would continue to lead the Silo AI team within the AMD
    Artificial Intelligence Group; AMD completed the acquisition in August 2024. A CV published by
    Zalando for its 2026 annual general meeting lists Sarlin as Silo AI's co-founder, CEO and board
    member from 2017 to 2026, as founder and chairperson of the board of Qutwo Oy and NestAI Oy
    since 2025, and as Professor of Practice in applied machine learning and AI at Aalto University
    since 2022. Sarlin is a co-author of Poro 34B and the Blessing of Multilinguality (2024), which
    lists Sarlin with Silo AI and Aalto University; the Poro 34B model card says the model was
    created by SiloGen from Silo AI with the TurkuNLP group at the University of Turku and HPLT,
    under the Apache 2.0 license.
