sections:
  - heading: Career
    paragraphs:
      - text: >-
          David Grangier completed a PhD in machine learning at EPFL from 2003 to 2008, advised by
          Samy Bengio, with a thesis on machine learning for information retrieval and learning to
          rank. Grangier then worked on deep supervised learning, text representations and ranking at
          NEC Labs from 2008 to 2011, after an earlier research internship at Google in 2007.
        source_ids: [vitae]
      - text: >-
          Grangier's vitae lists research roles at Microsoft Research from 2012 to 2014, working on
          interactive machine learning and machine teaching, and at Facebook AI Research from 2014 to
          2018 on language modeling and machine translation. Grangier joined Google Brain in 2018,
          working on language modeling, translation and speech separation, and is now with the
          Machine Learning Group at Apple Research.
        source_ids: [vitae, homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Grangier's homepage describes research on learning to generate text, learning to rank,
          distance and similarity learning, and learning with structured data. At Facebook AI
          Research, Grangier was part of the team whose machine translation systems won the
          English–German and English–Russian tasks of the 2018 WMT benchmark.
        source_ids: [homepage, vitae]
      - text: >-
          Recent papers listed on the homepage focus on efficient pretraining of language
          models, including task-adaptive pretraining through clustered importance sampling and the
          AdEMAMix optimizer (both ICLR 2025), and hierarchical parametric memories for small models
          (ICLR 2026).
        source_ids: [homepage, memories-paper]
  - heading: Open-source work and teaching
    paragraphs:
      - text: >-
          Grangier's vitae lists fairseq, built from 2016 to 2018 with Myle Ott, Sergey Edunov and
          others, the WikiBio dataset for generating text from structured data (2016), and PAMIR, a
          C++ image retrieval library written with Samy Bengio (2008). Grangier co-organized workshops
          at NIPS 2006, NIPS 2014 and ICML 2016, and taught a graduate session on machine learning for
          rankings at the UC Berkeley School of Information in 2011.
        source_ids: [vitae, fairseq-paper]
