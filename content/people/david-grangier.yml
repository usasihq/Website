headline: Machine learning researcher at Apple; co-author of the fairseq sequence modeling toolkit
bio:
  text: >-
    David Grangier is a researcher with the Machine Learning Group at Apple, with interests in large-scale
    machine learning for text generation, information retrieval, and speech recognition. Grangier's vitae
    lists earlier research roles at Google Brain from 2018, Facebook AI Research from 2014 to 2018, and
    Microsoft Research from 2012 to 2014, along with work on fairseq, a sequence-to-sequence toolkit built
    with Myle Ott, Sergey Edunov, Michael Auli, and others. Recent Apple work listed on Grangier's homepage
    includes an ICLR 2026 paper on pretraining small language models with hierarchical parametric memory
    banks, motivated by the limits of storing world knowledge in the parameters of models for edge devices.
  source_ids: [homepage, vitae, fairseq-paper, memories-paper]
  reviewed_at: 2026-10-13
