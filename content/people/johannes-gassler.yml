headline: Member of llama.cpp's CUDA backend code-owner team; experimental particle physicist at KIT
bio:
  text: >-
    Johannes Gäßler contributes to llama.cpp, the C/C++ runtime for running language models on
    local hardware, and the project's CODEOWNERS file lists Gäßler in the team that owns its CUDA
    backend. The same file names Gäßler as co-owner of the GGUF file code (gguf.cpp) and owner of
    the ggml optimizer code (ggml-opt.cpp) and the lookup example. Gäßler's 2026 commits to the repository
    cover CUDA matrix-multiplication and FlashAttention kernels, HIP tuning for AMD GPUs, and
    tensor-parallel fixes. Gäßler's GitHub profile gives the Karlsruhe Institute of Technology as
    company and describes Gäßler as an experimental particle physicist.
  source_ids: [llama-cpp-codeowners, llama-cpp-commits, github-profile]
  reviewed_at: 2026-10-13
