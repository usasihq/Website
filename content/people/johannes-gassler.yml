    contribution: >-
      CODEOWNERS lists Gäßler in the ggml-org/ggml-cuda team that owns the CUDA backend, as
      co-owner of gguf.cpp, and as owner of ggml-opt.cpp, ggml-backend-meta.cpp, the lookup
      example, and common/fit.
      Commits authored in 2026 cover CUDA MMQ and FlashAttention kernels, HIP tuning for AMD GPUs,
      and tensor parallelism. The repository is MIT-licensed.
    source_ids: [llama-cpp-codeowners, llama-cpp-commits, llama-cpp-license]
