sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Gäßler's first contributions to llama.cpp, in April and May 2023, concerned CUDA builds and
          reproducibility. In July 2023 Gäßler added quantized matrix-matrix multiplication (MMQ) for the
          CUDA backend, and in June 2024 added quantized KV-cache support to the vector FlashAttention
          kernels.
        source_ids: [commit-first, commit-repro, commit-mmq, commit-fa-kv]
      - text: >-
          In September 2024 Gäßler added backend support for numerical optimization to ggml, followed in
          May 2025 by LLM training support in llama.cpp and ggml, and in December 2024 added tests for the
          GGUF file format code. In December 2025 Gäßler added code that automatically sets parameters the
          user has not chosen so as to maximize GPU utilization. The CODEOWNERS file now lists
          Gäßler in the CUDA backend team, as owner of ggml-opt.cpp, the lookup example and common/fit, and as
          co-owner of gguf.cpp.
        source_ids: [commit-opt, commit-training, commit-gguf-tests, commit-fit, llama-cpp-codeowners]
  - heading: Research interests
    paragraphs:
      - text: >-
          Gäßler's GitHub profile describes an experimental particle physicist at the Karlsruhe Institute of
          Technology with further interests in statistics, generative neural networks and hardware
          acceleration.
        source_ids: [github-profile]
