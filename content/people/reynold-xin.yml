headline: Co-founder and Chief Architect of Databricks; Apache Spark committer and first author of Shark and GraphX
bio:
  text: >-
    Reynold Xin is a co-founder of Databricks and its Chief Architect, according to Databricks' Data +
    AI Summit 2026 speaker page. Xin is listed on the Apache Spark project's committers page and is a
    bylined author of Databricks' July 2026 post introducing Apache Spark 4.2. Earlier, Xin was first
    author of the papers on Shark, a system for SQL and rich analytics at scale (2012), and GraphX,
    which unifies data-parallel and graph-parallel analytics (2014). Xin is also one of the bylined
    authors of Databricks' June 2024 post on open-sourcing Unity Catalog.
  source_ids: [dais-xin, spark-committers, spark-42-post, shark-paper, graphx-paper, uc-post]
  reviewed_at: 2026-10-21
