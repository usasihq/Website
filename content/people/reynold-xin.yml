sections:
  - heading: Research
    paragraphs:
      - text: >-
          Xin's early research was on systems for large-scale analytics. In 2012 Xin posted a single-author essay
          arguing that the next generation of data warehouse systems should be modular and support both SQL
          and machine learning, and was
          first author of the Shark paper on running SQL and rich analytics at scale. Xin was also first author of
          GraphX (2014), which unifies data-parallel and graph-parallel analytics.
        source_ids: [end-of-era-paper, shark-paper, graphx-paper]
      - text: >-
          Xin co-authored the 2015 paper describing MLlib, the machine learning library in Apache Spark. With
          Databricks colleagues, Xin co-authored the VLDB 2020 paper on Delta Lake, a storage layer for ACID tables
          on cloud object stores, and the CIDR 2021 paper "Lakehouse", which argues for data platforms built on open
          direct-access formats with built-in support for machine learning.
        source_ids: [mllib-paper, delta-lake-paper, lakehouse-paper]
  - heading: Databricks and Apache Spark
    paragraphs:
      - text: >-
          Xin is a co-founder of Databricks and serves as its Chief Architect, and is listed among the committers
          of the Apache Spark project, which is developed under the Apache-2.0 license. Xin is a bylined author of
          Databricks' June 2024 post on open-sourcing Unity Catalog and of the July 2026 post introducing Apache
          Spark 4.2.
        source_ids: [dais-xin, spark-committers, spark-repo, uc-post, uc-repo, spark-42-post]
