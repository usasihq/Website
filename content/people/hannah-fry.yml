sections:
  - heading: Career
    paragraphs:
      - text: >-
          When Cambridge announced the appointment, Hannah Fry was Professor of the Mathematics of Cities at UCL, working with
          physicists, computer scientists, architects and geographers on patterns in human behaviour,
          particularly in urban settings. The University of Cambridge announced in November 2024 that Fry
          would become its first Professor of the Public Understanding of Mathematics, a post in the
          Department of Applied Mathematics and Theoretical Physics.
        source_ids: [cam-appointment]
      - text: >-
          Fry joined Cambridge in January 2025. The university's announcement also notes that Fry was then
          President of the Institute of Mathematics and its Applications, and the Faculty of Mathematics
          records that Fry has given the annual Rouse Ball lecture and run mathematics communication
          workshops for undergraduates.
        source_ids: [cam-leelavati, cam-appointment]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Fry presents Google DeepMind: The Podcast, whose credits list Fry as presenter for its 2019,
          2023, 2024 and 2025 series. Episodes feature conversations with Google DeepMind researchers and
          leaders on subjects including Gemini, Project Astra, robotics, AI in healthcare, the Genie 3
          world model and cybersecurity.
        source_ids: [podcast]
      - text: >-
          Cambridge's Faculty of Mathematics lists further broadcasting work: the 2019 Royal Institution
          Christmas Lectures, the television series The Future with Hannah Fry, and the podcast The Rest
          is Science, co-presented with Michael Stevens.
        source_ids: [cam-leelavati]
