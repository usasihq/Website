headline: Mathematician and science presenter who hosts Google DeepMind's podcast about AI
bio:
  text: >-
    Hannah Fry is Professor of the Public Understanding of Mathematics at the University of Cambridge,
    a mathematician, author, and science presenter who hosts podcasts and television shows. Hannah hosts
    Google DeepMind: The Podcast, which explores how AI is changing the world through conversations with
    researchers on topics such as Gemini, AlphaFold, robotics, AI in health, and cybersecurity. Hannah's
    recent book is No One Knows What They're Doing, about uncertainty and decision-making.
