headline: Anthropic co-founder; co-author of the GPT-3 paper and of Anthropic's RLHF and Constitutional AI papers
bio:
  text: >-
    Ben Mann is a co-founder of Anthropic. Mann's own site says Mann spent six years as a software
    engineer at Google, then worked at OpenAI and MIRI before co-founding Anthropic, and that as of
    2023 Mann was leading product engineering there. Anthropic's January 2026 announcement of its
    expanded Labs team, which incubates experimental products at the frontier of
    Claude's capabilities, said Mike Krieger
    would join Labs to build alongside Mann, and in October 2026 Anthropic named Mann as the
    co-founder who signed its memorandum of understanding with Singapore's Ministry of Digital
    Development and Information. Mann is the second-listed author of "Language Models are Few-Shot
    Learners" (2020), the GPT-3 paper, and a co-author of Anthropic's 2022 papers on training a
    helpful and harmless assistant with RLHF and on Constitutional AI.
