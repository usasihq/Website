sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ben Mann's personal site describes six years as a software engineer at Google, followed by
          starting a company and then turning to AI safety through work at OpenAI and MIRI. Mann then
          co-founded Anthropic and, as of 2023, was leading product engineering there.
        source_ids: [mann-site]
      - text: >-
          Anthropic's January 2026 announcement of an expanded Labs team, focused on incubating
          experimental products at the edge of Claude's capabilities, said Mike Krieger would join
          Labs to build alongside Mann. Mann has also represented Anthropic as a co-founder at public
          events, sharing the opening keynote with Dario Amodei at the Tokyo Builder Summit in October
          2025.
        source_ids: [anthropic-labs, anthropic-tokyo-summit]
      - text: >-
          In October 2026 Mann signed a memorandum of understanding between Anthropic and Singapore's
          Ministry of Digital Development and Information, covering technical exchanges on model
          evaluation, testing standards and incident response, as Anthropic opened an office in
          Singapore.
        source_ids: [anthropic-singapore]
  - heading: Research
    paragraphs:
      - text: >-
          Mann is the second-listed author, after Tom B. Brown, of "Language Models are Few-Shot
          Learners" (2020), the paper that introduced GPT-3. At Anthropic, Mann co-authored the 2022
          paper on training a helpful and harmless assistant with reinforcement learning from human
          feedback, and the December 2022 Constitutional AI paper on training harmless assistants from
          AI feedback guided by a set of principles.
        source_ids: [gpt3-paper, hh-rlhf-paper, cai-paper]
