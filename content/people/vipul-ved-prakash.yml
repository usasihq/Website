sections:
  - heading: Career
    paragraphs:
      - text: >-
          Prakash co-founded the anti-spam company Cloudmark in 2001 with Jordan Ritter, and Cloudmark was later
          acquired by Proofpoint. In 2007 Prakash founded Topsy, a search system for social media, which Apple
          acquired in 2013; at Apple, Prakash served as a senior director leading search and AI efforts in Siri.
        source_ids: [vp-milken, vp-humanx]
      - text: >-
          Prakash co-founded Together AI with Chris Ré, Percy Liang and Ce Zhang and leads it as CEO. Together's
          about page lists Prakash as Founder & CEO, and a 2026 conference biography describes the company as a
          research-driven AI company building cloud services and open-source models.
        source_ids: [together-about, seed-post, vp-humanx]
  - heading: Together AI
    paragraphs:
      - text: >-
          In a May 2023 post, Prakash wrote that Together was founded on the belief that open and decentralized
          alternatives to closed AI systems would matter for business and society, and listed GPT-JT, OpenChatKit
          and RedPajama among its early open releases. The RedPajama-Data repository, published under the
          Apache-2.0 license, includes RedPajama-Data-v2, an open dataset of 30 trillion tokens for training
          large language models.
        source_ids: [seed-post, redpajama-repo]
