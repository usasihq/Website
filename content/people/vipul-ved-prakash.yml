headline: Founder and CEO of Together AI, which builds a cloud platform for training and running large models
bio:
  text: >-
    Vipul Ved Prakash is the founder and CEO of Together AI, as listed on the company's About page. In
    a May 2023 post written as Together's co-founder and CEO, Prakash said Together was founded with
    Chris Ré, Percy Liang and Ce Zhang around the belief that open and decentralized alternatives to
    closed AI systems would be important for business and society. The same post lists GPT-JT,
    OpenChatKit and RedPajama among the open projects Together had released, alongside a cloud
    platform built for training and running large models.
  source_ids: [together-about, seed-post]
  reviewed_at: 2026-10-21
