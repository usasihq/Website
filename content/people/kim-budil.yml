sections:
  - heading: Career
    paragraphs:
      - text: >-
          Budil came to Livermore in 1987 as a graduate student in Laser Programs and became a
          postdoc in the weapons program in 1994. Over the following decades Budil held management roles
          across Weapons and Complex Integration, Global Security, the National Ignition Facility,
          and Physical and Life Sciences.
        source_ids: [llnl-budil-news, llnl-leadership]
      - text: >-
          Budil twice served as a detailee in Washington, D.C., first in the NNSA Office of Defense
          Science and then as a senior adviser to the Department of Energy's undersecretary for
          science. As vice president for national laboratories at the University of California
          Office of the President, Budil was responsible for governance and oversight of the
          Livermore, Berkeley and Los Alamos laboratories.
        source_ids: [llnl-budil-news]
  - heading: Director of LLNL
    paragraphs:
      - text: >-
          The LLNS board announced Budil's appointment as director on January 28, 2021, and Budil
          took up the role on March 2, 2021, succeeding Bill Goldstein. Before that appointment
          Budil was the laboratory's principal associate director for Weapons and Complex
          Integration.
        source_ids: [llnl-budil-news]
      - text: >-
          LLNL's leadership page describes the director's work with senior leaders at the
          Department of Energy, the NNSA, other national laboratories and private and academic
          partners. The page also lists Budil as a member of the National Academy of Engineering.
        source_ids: [llnl-leadership]
