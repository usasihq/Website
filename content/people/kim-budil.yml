headline: Director of Lawrence Livermore National Laboratory and president of Lawrence Livermore National Security
bio:
  text: >-
    Kimberly S. (Kim) Budil is the 13th director of Lawrence Livermore National Laboratory (LLNL) and
    president of Lawrence Livermore National Security, LLC, which manages the laboratory for the
    Department of Energy's National Nuclear Security Administration. As director, Budil sets the
    laboratory's strategic vision and leads its programs and operations.
  source_ids: [llnl-leadership, llnl-budil-news]
  reviewed_at: 2026-10-21
