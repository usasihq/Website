sections:
  - heading: Research
    paragraphs:
      - text: >-
          Gross co-authored papers across vision, language and games. These include a
          study of learning physical intuition from block towers (2016), the MultiPath network for object
          detection (2016), "Hard Mixtures of Experts for Large Scale Weakly Supervised Vision" (2017, as first
          author), Deep Counterfactual Regret Minimization (2018) and the fairseq sequence-modelling toolkit
          (2019).
        source_ids: [block-towers-paper, multipath-paper, hard-moe-paper, deep-cfr-paper, fairseq-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Gross is the second author of the 2019 PyTorch paper, which describes the library's imperative,
          Pythonic design and its implementation, and is listed on PyTorch's maintainers page as an emeritus
          maintainer of torch.nn and of the MKLDNN integration.
        source_ids: [pytorch-paper, pytorch-paper-pdf, pytorch-maintainers]
      - text: >-
          Gross wrote PEP 703, created in January 2023, which proposed a build configuration (--disable-gil)
          that lets CPython run Python code without the global interpreter lock, along with the changes needed
          to make the interpreter thread-safe. The PEP targets Python 3.13, was resolved in October 2023 and now
          has Final status.
        source_ids: [pep-703]
