headline: Co-author of the PyTorch paper and author of PEP 703, which makes CPython's GIL optional
bio:
  text: >-
    Sam Gross is the second author of the 2019 PyTorch paper, listed there with Facebook AI
    Research, and PyTorch's maintainers page lists Gross as an emeritus maintainer of torch.nn and
    of the MKLDNN integration. Gross is the author of PEP 703, "Making the Global Interpreter Lock
    Optional in CPython," whose status is Final. Gross's GitHub profile lists Thinking Machines as
    their company.
  source_ids: [pytorch-paper, pytorch-paper-pdf, pytorch-maintainers, pep-703, github-profile]
  reviewed_at: 2026-10-13
