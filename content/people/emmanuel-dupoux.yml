headline: EHESS professor in the Cognitive Machine Learning team; co-author of FAIR's generative spoken language work
bio:
  text: >-
    Emmanuel Dupoux is a professor at EHESS and a member of the Laboratoire de Sciences Cognitives
    et Psycholinguistique at the École normale supérieure, in the Cognitive Machine Learning (CoML)
    team. CoML describes its work as reverse engineering early language acquisition with
    unsupervised algorithms that discover speech and language units from raw sensory data, and
    building open-source cognitive tests that compare artificial systems with human performance.
    Dupoux is a co-author of On Generative Spoken Language Modeling from Raw Audio, a paper whose
    authors are listed at Facebook AI Research, with Dupoux also at EHESS.
