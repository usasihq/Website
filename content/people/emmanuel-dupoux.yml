sections:
  - heading: Research
    paragraphs:
      - text: >-
          Dupoux leads the Cognitive Machine Learning (CoML) team, whose members page lists Dupoux as an EHESS
          professor and team leader working on psycholinguistics, cognitive development, speech perception and
          modeling. The team's main project takes a reverse-engineering approach to infant language learning,
          building artificial learners trained on recordings of child-adult interaction and testing the
          resulting algorithms against infant behavior and brain measurements.
        source_ids: [coml-people, coml-projects]
      - text: >-
          Dupoux described this approach in a 2016 single-author paper proposing a roadmap for reverse-engineering
          the infant language learner. The same year Dupoux co-authored, with Tal Linzen and Yoav Goldberg, a
          study of whether LSTM networks learn syntax-sensitive agreement dependencies. In 2026 Dupoux, Yann
          LeCun and Jitendra Malik proposed a learning architecture inspired by human and animal cognition to
          address limits on autonomous learning in current AI systems.
        source_ids: [roadmap-paper, lstm-syntax-paper, autonomous-learning-paper]
  - heading: Benchmarks and spoken language models
    paragraphs:
      - text: >-
          Dupoux co-authored the papers describing the 2017 and 2020 editions of the Zero Resource Speech
          Challenge, which asks systems to discover subword and word units from raw speech without labels. The CoML team also
          maintains a list of open-source tools for unsupervised speech learning, and Dupoux co-authored
          Libri-Light, a benchmark for speech recognition with limited or no supervision.
        source_ids: [zerospeech-2017, zerospeech-2020, coml-resources, librilight-paper]
      - text: >-
          Working with researchers at Facebook AI Research, Dupoux co-authored the 2021 paper on generative
          spoken language modeling from raw audio, and the 2023 TWIST paper, which warm-starts speech language
          models from pretrained text language models.
        source_ids: [gslm-paper, gslm-pdf, twist-paper]
