sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          The Cognitive Revolution is a weekly podcast in which Nathan Labenz interviews people building
          and studying AI, alongside "AI Scouting Report" episodes of analysis on selected topics. The
          show is distributed on YouTube, Spotify, Apple Podcasts, and RSS, and its site also hosts a job
          board and an episode archive.
        source_ids: [cr-home, cr-about]
      - text: >-
          The show's About page presents Labenz as an AI scout, technology entrepreneur, and AI analyst.
          Its stated aim is to help people in business, policy, and
          academia keep up with AI developments through conversations with builders, researchers, and
          investors.
        source_ids: [cr-about]
  - heading: Career
    paragraphs:
      - text: >-
          Labenz is the founder and former CEO of Waymark and led the company from its inception. The About
          page describes Waymark's work as content creation powered by generative AI.
        source_ids: [cr-about]
