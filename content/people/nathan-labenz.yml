headline: Host of The Cognitive Revolution, a podcast of interviews and analysis about AI
bio:
  text: >-
    Nathan Labenz hosts The Cognitive Revolution, a podcast that covers the impact of artificial
    intelligence on work, society, and culture through interviews with builders, researchers, and
    investors, along with "AI Scouting Report" analysis episodes. The show's About page describes
    Nathan Labenz as an AI scout and podcast host, and as the founder and former CEO of Waymark, a
    company that makes generative AI-powered content creation tools.
