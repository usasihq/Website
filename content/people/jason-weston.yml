sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jason Weston earned a PhD in machine learning at Royal Holloway, University of London and at AT&T
          Research, according to Meta's people page. Weston was then a researcher at Biowulf Technologies,
          a research scientist at the Max Planck Institute for Biological Cybernetics, a research staff
          member at NEC Labs America, and a research scientist at Google.
        source_ids: [meta-profile]
      - text: >-
          Weston is now a research scientist at Meta, and Meta's page also lists a visiting research
          professorship at NYU. Meta's page notes that Weston was part of the YouTube team recognized with
          a Technology and Engineering Emmy Award for personalized recommendation engines for video discovery.
        source_ids: [meta-profile]
  - heading: Research
    paragraphs:
      - text: >-
          With Ronan Collobert, Weston wrote "A Unified Architecture for Natural Language Processing: Deep
          Neural Networks with Multitask Learning" (ICML 2008), which later received the ICML Test of Time
          Award. In 2014 Weston, Sumit Chopra and Antoine Bordes introduced Memory Networks, models that
          pair inference components with a long-term memory that can be read and written.
        source_ids: [icml-2018-awards, memnn-paper]
      - text: >-
          Much of Weston's later work concerns dialogue: the open-source ParlAI platform (2017), the
          open-domain chatbot recipes paper (2020) and the deployed BlenderBot 3 agent (2022), alongside
          the Adversarial NLI benchmark (2019). Recent co-authored papers study language models that judge
          and reward their own outputs (2024), the Byte Latent Transformer, which works with patches rather than tokens
          (2024), and meta-reasoning controllers for long-running agents (2026).
        source_ids: [parlai-paper, blender-paper, bb3-paper, anli-paper, selfreward-paper, meta-profile, metareasoning-paper]
