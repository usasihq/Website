headline: Research scientist at Meta; first author of Memory Networks and co-author of ParlAI and Self-Rewarding LMs
bio:
  text: >-
    Jason Weston is a research scientist at Meta. Meta's people page describes interests in
    statistical machine learning with a focus on reasoning, memory, perception, interaction, and
    communication, and lists earlier research roles at NEC Labs America, the Max Planck Institute for
    Biological Cybernetics, and Google. Weston is first author of Memory Networks (2014) and a
    co-author of the open-source ParlAI dialog research platform (2017), Adversarial NLI (2019), the
    open-domain chatbot papers Recipes for Building an Open-Domain Chatbot (2020) and BlenderBot 3
    (2022), and Self-Rewarding Language Models (2024). Meta's page also notes a Test of Time Award for
    A Unified Architecture for Natural Language Processing, written with Ronan Collobert.
  source_ids: [meta-profile, memnn-paper, parlai-paper, anli-paper, blender-paper, bb3-paper, selfreward-paper]
  reviewed_at: 2026-10-21
