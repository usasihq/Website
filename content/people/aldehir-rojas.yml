    artifact_slug: llama-cpp
    type: open-source
    url: https://github.com/ggml-org/llama.cpp
    contribution: >-
      CODEOWNERS lists Rojas in the ggml-org/llama-common team, which owns common/. Commits
      authored from June to October 2026 add specialized chat parsers (Qwen3, MiniMax M3, MiniCPM5),
      fix tool-call grammars, implement an internal representation for JSON schemas, extend the
      reasoning-budget sampler, refactor the chat API, and change llama-server checkpoint and batch
      handling. The repository is MIT-licensed.
    source_ids: [llama-cpp-codeowners, llama-cpp-commits, llama-cpp-license]
