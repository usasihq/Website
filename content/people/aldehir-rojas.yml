sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Aldehir Rojas is listed in the ggml-org/llama-common team in llama.cpp's CODEOWNERS file, the
          group that owns the project's shared common code. llama.cpp is distributed under the MIT
          license.
        source_ids: [llama-cpp-codeowners, llama-cpp-license]
      - text: >-
          Much of Rojas's recent work on llama.cpp concerns chat templates and tool calling. Commits from
          mid-2026 add specialized parsers for Qwen3 and MiniCPM5, tighten function-call parsing for Qwen
          models, fix tool-call handling for LFM2 and
          Gemma 4, and refactor the chat API; an October 2026
          commit implements a unique filter in the project's Jinja template engine.
        source_ids: [llama-cpp-commits]
      - text: >-
          Rojas has also worked on grammar generation and sampling, including an internal representation
          for JSON schemas, spacing rules aligned between JSON-schema grammars and parsers, limits on
          repetition in grammars, and support for multiple end sequences in the reasoning-budget sampler.
          Other commits change how llama-server splits prompt batches and handles checkpoints.
        source_ids: [llama-cpp-commits]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Rojas publishes gpt-oss-adapter, an MIT-licensed middleware proxy written in Go that sits
          between client applications and inference servers such as LM Studio and llama.cpp. It caches
          reasoning content from tool-call responses for gpt-oss models and injects it into later
          requests, because, as the README explains, most clients do not send that context back.
        source_ids: [gpt-oss-adapter]
