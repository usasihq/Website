headline: llama.cpp shared-code owner working on chat parsing, tool calls and JSON-schema grammars
bio:
  text: >-
    Aldehir Rojas is a member of the team that owns llama.cpp's shared common code, according to
    the project's CODEOWNERS file. Rojas's commits to llama.cpp add model-specific chat parsers
    and tool-call fixes for model families including Qwen, MiniMax, Gemma and LFM2, along with
    JSON-schema grammar handling, changes to the reasoning-budget sampler, and llama-server
    checkpoint and batching changes. Rojas also publishes gpt-oss-adapter, an MIT-licensed proxy that sits between
    client applications and the LM Studio or llama.cpp servers to manage chain-of-thought reasoning
    for gpt-oss models.
  source_ids: [llama-cpp-codeowners, llama-cpp-commits, gpt-oss-adapter]
  reviewed_at: 2026-10-13
