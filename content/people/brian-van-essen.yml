sections:
  - heading: LBANN
    paragraphs:
      - text: >-
          Van Essen is first author of "LBANN: Livermore big artificial neural network HPC toolkit",
          presented at a 2015 workshop on machine learning in high-performance computing environments. A
          2016 LLNL article said Van Essen's group was working to improve LBANN's speed and efficiency by maximizing node utilization
          while reducing communication between nodes.
        source_ids: [ldrd-2016, str-2016]
      - text: >-
          LBANN is an open-source deep learning training framework built to compose model, data and
          ensemble parallelism on supercomputers. A 2025 LLNL newsletter reported that the LBANN group,
          including Van Essen, had released a parallel LLaMA model in PyTorch optimized for AMD chips and
          demonstrated it on Tenaya, an early-access system for El Capitan.
        source_ids: [lbann-readme, ds-newsletter-2025]
  - heading: Scientific applications
    paragraphs:
      - text: >-
          As principal investigator, Van Essen led a 2020 LBANN-based generative model for COVID-19 drug
          discovery, trained on more than a billion molecules on the Sierra supercomputer, which was a
          finalist for the Gordon Bell Special Prize and was presented at SC20. Van Essen was also part of
          the cognitive simulation team that applied machine learning to inertial confinement fusion
          experiments.
        source_ids: [gordon-bell-2020, hpcwire-2022]
      - text: >-
          With Fred Streitz, Van Essen led LLNL's part of the ECP-CANDLE project, a collaboration of national
          laboratories and the National Cancer Institute applying deep learning to cancer research, whose
          LLNL work centered on scalable distributed training within LBANN.
        source_ids: [rd100-2023]
timeline:
