headline: LLNL senior computer scientist and project leader of the LBANN deep learning toolkit for supercomputers
bio:
  text: >-
    Brian Van Essen is a senior computer scientist in the Center for Applied Scientific Computing at
    Lawrence Livermore National Laboratory and the project leader for LBANN, the Livermore Big Artificial
    Neural Network open-source deep learning toolkit. Van Essen is the first member of the LLNL team
    listed in the LBANN contributors file. In 2015 a Livermore team led by Barry
    Chen and Van Essen developed LBANN, the Livermore Big Artificial Neural Network toolkit for training
    large neural networks on high-performance computing systems.
  source_ids: [llnl-people, lbann-contributors, str-2021, ldrd-2016]
  reviewed_at: 2026-10-22
