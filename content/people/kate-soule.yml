sections:
  - heading: Career
    paragraphs:
      - text: >-
          Soule's IBM Research biography describes a career at the intersection of business and AI. Soule
          previously worked as a senior consultant in Deloitte Consulting's Strategy and Analytics practice, and
          before the current role was a leader at the MIT-IBM Watson AI Lab, where Soule ran the lab's corporate
          membership program.
        source_ids: [ibm-research-profile]
      - text: >-
          As a Director at IBM Research, Soule now leads Technical Product Management for Granite, IBM's family
          of large language models. Soule also explains generative AI through IBM videos such as "What are
          Generative AI Models?", courses on IBM's AI Academy and regular appearances on IBM's "Mixture of
          Experts" podcast.
        source_ids: [ibm-research-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Soule's papers concern evaluating and choosing language models. A 2023 study repurposed benchmark
          datasets to learn a router model that selects an LLM for a new task, and a 2024 paper proposed enterprise
          benchmarks for evaluating LLMs on domain tasks.
        source_ids: [routing-paper, enterprise-benchmarks-paper]
      - text: >-
          Soule is also listed on technical reports for IBM's open Granite models, including Granite Vision,
          Granite Embedding and Granite-speech (all 2025), and co-authored "Granite.Trust Policy Tools" (2026),
          which describes a YAML-based schema for specifying safety policies for generative AI applications.
        source_ids: [granite-vision-paper, granite-embedding-paper, granite-speech-paper, trust-policy-paper]
