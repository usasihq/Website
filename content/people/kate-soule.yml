headline: Director of Technical Product Management for Granite at IBM Research; co-author of Granite Embedding
bio:
  text: >-
    Kate Soule is a Director at IBM Research who leads Technical Product Management for Granite, IBM's
    family of large language models, according to the IBM Research profile. Before this role, Soule was
    a leader at the MIT-IBM Watson AI Lab, where Soule ran the lab's corporate membership program. Soule
    is a co-author of the Granite Embedding Models report (2025), whose English and multilingual
    retrieval models are released under the Apache 2.0 license, and of papers on enterprise benchmarks
    for LLM evaluation and on routing among LLMs using benchmark datasets.
