sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ken Jee's about page describes work as Head of Data Science at Scouts Consulting Group,
          analyzing data collected on athletes and teams to improve their performance, alongside
          entrepreneurship and content creation. Jee has focused on project-based learning, sharing how
          data scientists approach Kaggle competitions and new datasets.
        source_ids: [about]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Jee's about page describes the YouTube channel as helping viewers navigate the data science landscape. Jee started the
          #66DaysOfData challenge, which asks learners to study data science for at least five minutes
          a day for 66 days and share what they learn, and launched the podcast Ken's Nearest Neighbors
          to share real-life case studies from people in the field.
        source_ids: [about, channel, challenge]
      - text: >-
          Jee's more recent videos and the weekly newsletter The AI Survival Guide focus on adapting to
          AI-driven changes in work. Each issue has sections on a signal of the week, what Jee is
          building, what Jee is learning, a survival skill and a closing thought. A November 2025 video
          describes building an AI newsletter software product, Newsletter Hero, in 43 days.
        source_ids: [newsletter, homepage]
