headline: Data scientist and creator of videos, a podcast, and a newsletter about data science and AI
bio:
  text: >-
    Ken Jee is a data scientist who makes YouTube videos about data science and AI. Ken Jee started
    the #66DaysOfData learning challenge and the podcast Ken's Nearest Neighbors, which shares case
    studies from people working in data science. The channel and the weekly newsletter The AI
    Survival Guide now cover how to adapt to AI-driven changes in work, including Ken Jee's own
    projects and experiments.
