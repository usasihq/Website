headline: YouTube creator teaching AI-assisted coding with Claude Code and Codex; teaches Vibe Coding Academy
bio:
  text: >-
    Alex Finn makes YouTube videos teaching people to build software with AI coding tools such as
    Claude Code and Codex, alongside AI news, tutorials, and guides. Alex teaches Vibe Coding Academy,
    a course and community on shipping products with Claude Code and setting up Hermes Agent for
    automation, and is the solo builder of Creator Buddy, an AI tool for writing posts on X. Alex also
    writes Ship/It Weekly, a Substack newsletter of beginner-friendly AI guides.
