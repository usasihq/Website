sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Alex Finn's YouTube channel, whose feed dates it to January 2023, teaches viewers to build with
          AI coding tools such as Claude Code and Codex and adds AI news, tutorials and master classes. In
          autumn 2026 its videos covered AI agents and assistants, running local AI models on personal
          computers, and new model releases.
        source_ids: [channel, channel-feed]
      - text: >-
          Finn writes Ship/It Weekly, a Substack newsletter of beginner-friendly guides on using AI. Posts
          include a January 2026 guide to building a first app with Claude Code without prior coding
          experience and a February 2026 post on connecting an OpenClaw agent to a local model.
        source_ids: [newsletter, post-first-app, post-local-openclaw]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Finn teaches Vibe Coding Academy, which pairs a Claude Code masterclass on taking an idea to a
          live product with a bootcamp on setting up Hermes Agent for memory, skills, scheduled automations
          and delegation to subagents, supported by weekly live calls. Finn is also the solo builder of
          Creator Buddy, an AI tool for planning and writing posts on X, which Finn built with Claude Code.
        source_ids: [academy, creatorbuddy, post-first-app]
