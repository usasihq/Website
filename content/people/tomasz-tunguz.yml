headline: General Partner at Theory Ventures who writes a daily blog on AI, SaaS metrics, and venture capital
bio:
  text: >-
    Tomasz Tunguz writes a daily blog of data-driven analysis on AI, SaaS metrics, go-to-market
    strategy, and the venture capital market, covering topics such as AI market structure and model
    economics. Tomasz is a General Partner at Theory Ventures, a venture capital firm Tomasz founded
    to invest in AI-first software companies. Earlier, Tomasz was a partner at Redpoint Ventures and
    a product manager on Google's AdWords team.
