sections:
  - heading: Career
    paragraphs:
      - text: >-
          Tomasz Tunguz started a career at Appian, a business process management company, and later
          worked as a product manager on Google's AdWords team. Tunguz then spent nine years as a partner
          at Redpoint Ventures, investing in early-stage SaaS and infrastructure companies.
        source_ids: [about]
      - text: >-
          Tunguz founded Theory Ventures, an early-stage venture capital firm founded in 2023 that invests
          in AI-first software companies, and is listed as its General Partner on the firm's team page.
        source_ids: [about, theory, theory-about]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          The blog's archive begins in February 2010 with a post on how venture capitalists analyze
          companies and has carried posts every year since 2012. Tunguz describes it as a daily blog of
          data-driven analysis on AI, SaaS metrics, go-to-market strategy, and the venture capital
          market, written to give founders and investors quantitative benchmarks.
        source_ids: [archive-page, about]
      - text: >-
          Recent posts in 2026 cover AI market structure and model economics, such as GPU pricing,
          inference markets, and AI productivity. The site also hosts evergreen startup guides on topics
          including data strategy, AI implementation, and product management.
        source_ids: [archive-page, guides]
