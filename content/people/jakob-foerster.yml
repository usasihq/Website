sections:
  - heading: Career
    paragraphs:
      - text: >-
          Foerster is an associate professor in Oxford's Department of Engineering Science and a supernumerary
          fellow of St Anne's College, and the homepage says Foerster now splits time equally between Oxford and
          FAIR at Meta. Foerster is also founding director of the British Open-ended Learning and Discovery
          (BOLD) lab, and the homepage notes regular service as a senior area chair for machine learning
          conferences.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Foerster's early papers, several written with Shimon Whiteson, focused on deep multi-agent
          reinforcement learning. "Learning to Communicate with Deep Multi-Agent Reinforcement Learning" (2016)
          showed agents learning communication protocols, COMA (2017) used a centralized critic with a
          counterfactual baseline to train decentralized policies, and QMIX (2018) factorized joint
          action-values. LOLA (2017) introduced agents that account for how their opponents learn.
        source_ids: [dial-paper, coma-paper, qmix-paper, lola-paper]
      - text: >-
          Later work turned to coordination with other agents and with people. Foerster co-authored "The Hanabi
          Challenge" (2019), which proposed the cooperative card game as a benchmark, and "Other-Play" (2020),
          a method for zero-shot coordination with unseen partners. Foerster's listed interests now include
          compute-only scaling and self-improvement, multi-agent RL in real-world settings, human-AI
          coordination, and AI for science; in 2024 Foerster co-authored "The AI Scientist", on automating
          open-ended scientific discovery with language models.
        source_ids: [hanabi-paper, other-play-paper, homepage, ai-scientist-paper]
