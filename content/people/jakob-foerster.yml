headline: Oxford associate professor and research scientist at FAIR (Meta); first author of COMA for multi-agent RL
bio:
  text: >-
    Jakob N. Foerster is an Associate Professor in the Department of Engineering Science at the
    University of Oxford and a Research Scientist at FAIR, Meta AI; Foerster is also founding director
    of the BOLD (British Open-ended Learning and Discovery) lab. Foerster's work centers on
    multi-agent reinforcement learning: Foerster is first author of "Counterfactual Multi-Agent Policy
    Gradients" (COMA, 2017) and a co-author of QMIX (2018), both with Shimon Whiteson.
  source_ids: [homepage, coma-paper, qmix-paper]
