sections:
  - heading: Career
    paragraphs:
      - text: >-
          Peter Lee was a professor at Carnegie Mellon University from 1987 to 2010 and headed its computer science
          department. Lee then established a new technology office at DARPA that built capabilities in machine
          learning, data science and computational social science, before joining Microsoft in 2010.
        source_ids: [msr-profile]
      - text: >-
          At Microsoft, Lee led the worldwide laboratories of Microsoft Research and is now President, Microsoft
          Science, responsible for using AI and other emerging technologies to speed discovery in the physical,
          biological and medical sciences. Lee also serves on the boards of institutions in AI and medicine,
          including the Board of Trustees of the Mayo Clinic and the Board of Directors of the Kaiser Permanente
          School of Medicine.
        source_ids: [msr-profile]
  - heading: AI and medicine
    paragraphs:
      - text: >-
          Lee was part of a group within Microsoft given early access to GPT-4 for evaluation and experimentation,
          and with Carey Goldberg and Isaac Kohane co-wrote The AI Revolution in Medicine: GPT-4 and Beyond. Lee is
          a member of the National Academy of Medicine.
        source_ids: [msr-profile]
