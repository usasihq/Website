headline: President of Microsoft Science; previously led Microsoft Research's worldwide laboratories
bio:
  text: >-
    Peter Lee is President, Microsoft Science, with responsibility for speeding discovery in the
    physical, biological, and medical sciences through AI and other emerging technologies. Lee
    previously led the worldwide laboratories of Microsoft Research; before joining Microsoft in 2010,
    Lee established a new technology office at DARPA. From 1987 to 2010, Lee was a professor and head of
    the computer science department at Carnegie Mellon University. Lee is a member of the National
    Academy of Medicine and co-authored, with Carey Goldberg and Isaac Kohane, the book "The AI
    Revolution in Medicine: GPT-4 and Beyond."
  source_ids: [msr-profile]
