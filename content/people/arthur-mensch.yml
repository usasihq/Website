headline: Co-founder and CEO of Mistral AI; equal-contribution author of DeepMind's Chinchilla scaling paper
bio:
  text: >-
    Arthur Mensch is a co-founder and the CEO of Mistral AI, according to the company's about page.
    Before Mistral, Mensch was one of four equal-contribution authors of Training Compute-Optimal
    Large Language Models (2022), the DeepMind paper that introduced Chinchilla and studied how model
    size and the number of training tokens should grow together under a fixed compute budget; the
    paper lists Mensch among its corresponding authors at DeepMind. Mensch was also an
    equal-contribution author of the retrieval-enhanced RETRO paper (2021), whose authors are all
    listed as from DeepMind. Mensch co-authored the
    Mistral 7B (2023) and Mixtral of Experts (2024) papers, whose abstracts say the models are
    released under the Apache 2.0 license.
  source_ids: [mistral-about, chinchilla-paper, retro-paper, mistral7b-paper, mixtral-paper]
  reviewed_at: 2026-10-21
