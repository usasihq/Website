sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before co-founding Mistral AI, Arthur Mensch worked at DeepMind, where Mensch was an
          equal-contribution author of the RETRO and Chinchilla papers and was listed among the Chinchilla
          paper's corresponding authors. Mistral AI's about page names Mensch as co-founder and CEO, alongside
          co-founder and Chief Science Officer Guillaume Lample, and dates the company's first employee to June
          2023.
        source_ids: [retro-paper, chinchilla-paper, mistral-about]
  - heading: Research
    paragraphs:
      - text: >-
          The 2021 RETRO paper, Improving language models by retrieving from trillions of tokens, describes a
          language model that conditions on document chunks retrieved from a large text database. The 2022
          Chinchilla paper trained more than 400 language models to study how parameter count and training
          tokens should grow together for a fixed compute budget, and tested the result with the
          70-billion-parameter Chinchilla model.
        source_ids: [retro-paper, chinchilla-paper]
  - heading: Mistral AI models
    paragraphs:
      - text: >-
          Mensch co-authored the Mistral 7B paper in October 2023 and the Mixtral of Experts paper in January
          2024, and both abstracts state that the models are released under the Apache 2.0 license. Mistral's
          about page lists later company milestones including Mistral Large in February 2024, Small 3 in
          January 2025, Voxtral in July 2025 and Mistral Studio in October 2025.
        source_ids: [mistral7b-paper, mixtral-paper, mistral-about]
