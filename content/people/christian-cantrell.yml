headline: Founder and CPO of Reve AI; formerly led Adobe Design Prototyping and was VP of Product at Stability AI
bio:
  text: >-
    Christian Cantrell is the founder and Chief Product/Prompt Officer of Reve AI, a foundation-model
    and creative-tooling startup, where Cantrell manages product, design and marketing. Cantrell spent
    2005 to 2022 at Adobe, most recently as Director of Experience Development and head of Adobe
    Design Prototyping, and was then VP of Product at Stability AI, helping launch the Stability
    Platform REST API, DreamStudio 1.0 and integrations for Photoshop, Blender and Google Workspace.
    Cantrell also published stable-diffusion-api-server, an Apache-2.0 local REST server that runs
    Stable Diffusion on a user's own NVIDIA GPU or, experimentally, an M1 Mac.
  source_ids: [cantrell-site, sd-api-server]
  reviewed_at: 2026-10-13
