sections:
  - heading: Career
    paragraphs:
      - text: >-
          Cantrell's résumé begins at Amazing Media, where Cantrell rose from Java developer to senior
          engineering manager of a digital advertising platform, followed by work as a technical product
          manager at Macromedia from 2002 to 2005. At Adobe from 2005 to 2022, Cantrell was a product manager
          for the Flash, desktop, and web platforms, then a senior engineering manager in the Web Platform
          group working with browser makers on new web standards.
        source_ids: [cantrell-site]
      - text: >-
          From 2015 to 2022 Cantrell was Director of Experience Development in Adobe Design and head of Adobe
          Design Prototyping, leading a multidisciplinary team that prototyped interactions such as drawing
          tools and object manipulation in AR and incubated new product ideas. Cantrell then spent October 2022
          to March 2023 as VP of Product at Stability AI before founding Reve AI in March 2023, where Cantrell
          manages product, design, and marketing and works with the research and data teams on model-product
          alignment.
        source_ids: [cantrell-site]
  - heading: Products and projects
    paragraphs:
      - text: >-
          At Stability AI, Cantrell helped launch the Stability Platform and its REST API, DreamStudio 1.0, and
          integrations for Photoshop, Blender, and Google Workspace. Cantrell also published
          stable-diffusion-api-server, a local REST server for Stable Diffusion written to back a Photoshop
          plugin, which can load fine-tuned models in the diffusers format.
        source_ids: [cantrell-site, sd-api-server]
      - text: >-
          Cantrell's site lists Cantrell as an inventor on twenty-two patents, ten of them on creativity and
          generative AI, including natural-language control of content generation models and semantic layers in
          graphic design documents.
        source_ids: [cantrell-site]
  - heading: Writing
    paragraphs:
      - text: >-
          Cantrell also writes near-future thrillers and science fiction. The novel Scorpion, expanded from the
          short story The Epoch Index, was published by Random House, and earlier novels include Containment,
          Equinox, and Kingmaker.
        source_ids: [cantrell-site]
