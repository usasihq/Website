work:
  - name: PaperQA2
    artifact_slug: paper-qa
    type: open-source
    url: https://github.com/Future-House/paper-qa
    contribution: >-
      Co-author of the 2024 paper reporting that the PaperQA2 language agent matched or exceeded
      expert performance on scientific literature tasks; the agent is published as open source in
      the Apache-2.0 paper-qa repository.
    source_ids: [paperqa2-paper, pqa-gh, fh-about]
  - name: Robin
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2505.13400
    contribution: >-
      Senior author of the 2025 paper on Robin, a multi-agent system that generated hypotheses,
      designed experiments and analyzed data, and identified ripasudil as a candidate therapy for
      dry age-related macular degeneration.
    source_ids: [robin-paper, fh-about]
  - name: ether0
    artifact_slug: ether0
    type: open-weights
    url: https://arxiv.org/abs/2506.17238
    contribution: >-
      Co-author of the 2025 paper on ether0, a chemistry reasoning model trained with reinforcement
      learning that FutureHouse released as open source.
    source_ids: [ether0-paper, fh-about]
links:
  - label: FutureHouse team
    url: https://www.futurehouse.org/team
sections:
  - heading: Career
    paragraphs:
      - text: >-
          Edison's team page describes Rodriques as a physicist and bioengineer whose inventions
          span spatial and temporal transcriptomics, brain mapping, gene therapy and
          nanofabrication. Rodriques briefly ran an academic lab at the Francis Crick Institute
          before co-founding FutureHouse with Andrew White in 2023.
        source_ids: [edison-team, fh-about]
      - text: >-
          In November 2025, Rodriques and White announced Edison Scientific, a commercial spinout to
          develop and deploy FutureHouse's AI Scientist, while FutureHouse continues nonprofit
          research in biology. Rodriques is CEO of both organizations.
        source_ids: [fh-edison, fh-team, edison-team]
  - heading: Research
    paragraphs:
      - text: >-
          At FutureHouse, Rodriques co-authored the PaperQA and PaperQA2 papers on retrieval-based
          agents for scientific literature, and the Aviary paper on training language agents on
          scientific tasks. Both PaperQA and Aviary are released as open-source repositories under
          the Apache-2.0 license.
        source_ids: [paperqa-paper, paperqa2-paper, aviary-paper, pqa-gh, aviary-gh]
      - text: >-
          Rodriques is the senior author of the Robin paper, which FutureHouse describes as an
          end-to-end AI-driven discovery that went from concept to paper in two and a half months,
          and a co-author of the ether0 chemistry reasoning model.
        source_ids: [robin-paper, ether0-paper, fh-about]
