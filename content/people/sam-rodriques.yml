slug: sam-rodriques
name: Sam Rodriques
initials: SR
groups: [leadership, engineering]
sector: nonprofit
specialties: [ai-for-science, agents]
headline: CEO and co-founder of FutureHouse and Edison Scientific, building AI agents for scientific research
bio:
  text: >-
    Sam Rodriques is the CEO and a co-founder of FutureHouse, a nonprofit research organization
    founded in 2023 with Andrew White to build and validate AI systems for scientific discovery,
    and the CEO and a co-founder of Edison Scientific, the commercial company that spun out of
    FutureHouse in 2025. Edison describes Rodriques as a physicist and bioengineer who briefly ran
    an academic lab at the Francis Crick Institute before launching FutureHouse.
  source_ids: [fh-about, fh-team, edison-team]
  reviewed_at: 2026-10-21
