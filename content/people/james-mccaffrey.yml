headline: Software engineer and longtime MSDN Magazine Test Run columnist; worked for Microsoft Research
bio:
  text: >-
    James McCaffrey is a software engineer who writes about software research, development,
    testing and education. MSDN Magazine's archive lists McCaffrey's articles from December 2002
    to August 2019, including the Test Run column, whose later installments present machine
    learning techniques such as the UCB1 algorithm for multi-armed bandit problems with complete
    C# demo programs. The August 2019 author bio says McCaffrey worked for Microsoft Research and
    had worked on Microsoft products including Azure and Bing; McCaffrey's own site does not name
    a current employer.
