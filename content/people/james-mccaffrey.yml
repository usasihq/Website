sections:
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          James McCaffrey has written a blog on software research, development, testing and education
          since 2006, focused on topics such as mathematical combinatorics, machine learning and
          algorithms based on the behavior of natural systems. McCaffrey's MSDN Magazine articles ran
          from December 2002 to August 2019, including the Test Run column, whose later installments
          walked through machine learning techniques with complete C# demo programs.
        source_ids: [mccaffrey-blog, msdn-author, msdn-ucb1]
      - text: >-
          McCaffrey's publication list shows a continuing series of Visual Studio Magazine articles
          through 2025 that implement techniques such as linear regression, kernel ridge regression,
          decision tree regression and k-means anomaly detection from scratch in C# and JavaScript.
          McCaffrey also lists speaking at events including Visual Studio Live, Microsoft's MLADS
          conference, DevIntersection and Machine Learning Week.
        source_ids: [journals-page, mccaffrey-blog]
  - heading: Books
    paragraphs:
      - text: >-
          McCaffrey's books begin with ".NET Test Automation Recipes" (Apress, 2006) and "Software
          Testing: Fundamental Principles and Essential Knowledge" (2009). A series of short Syncfusion
          Succinctly e-books followed, covering neural networks and machine learning in C# (2014 and
          2015), R programming (2017), Keras and Microsoft CNTK (2018), and neural networks with
          JavaScript (2019).
        source_ids: [books-page]
  - heading: Research
    paragraphs:
      - text: >-
          Between 2009 and 2012 McCaffrey published conference papers on software testing and on
          optimization algorithms inspired by nature. They include studies of pairwise test set
          generation using genetic and simulated bee colony algorithms, graph partitioning with a
          simulated bee colony algorithm, and a 2012 IEEE paper on simulated protozoa optimization.
        source_ids: [papers-page]
