headline: Independent journalist who writes Big Technology, a newsletter about the tech giants and how tech works
bio:
  text: >-
    Alex Kantrowitz is an independent journalist who writes Big Technology, a one-person, reader-supported
    publication about how the technology industry works, with a focus on Amazon, Apple, Facebook, Google,
    and Microsoft. Alex Kantrowitz previously worked as a beat reporter in Silicon Valley, wrote the Tech
    Giant Update at BuzzFeed, and is the author of the book Always Day One, which covers those companies.
