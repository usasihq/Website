sections:
  - heading: Career
    paragraphs:
      - text: >-
          Alex Kantrowitz worked for several years as a technology beat reporter covering Silicon Valley and
          wrote the Tech Giant Update newsletter at BuzzFeed. In May 2020 Kantrowitz announced on Big Technology
          a move to independent publishing starting that June. Big Technology's about page describes it
          as a one-person publication and makes the case for independent, reader-supported journalism.
        source_ids: [bigtech-about, bt-leaving-buzzfeed]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Big Technology focuses mainly on Amazon, Apple, Facebook, Google, and Microsoft, and its about page
          describes the aim as explaining how the technology world works rather than only what it does. The
          publication promises original reporting written without embargoes.
        source_ids: [bigtech-about]
      - text: >-
          Alongside the newsletter, Kantrowitz hosts the Big Technology Podcast, which covers the same five
          companies as the newsletter.
        source_ids: [prh-always-day-one]
  - heading: Books
    paragraphs:
      - text: >-
          Kantrowitz is the author of Always Day One: How The Tech Titans Plan To Stay On Top Forever, published
          by Portfolio, an imprint of Penguin Random House, in April 2020. The book examines how Amazon,
          Apple, Facebook, Google, and Microsoft organize their cultures to keep inventing.
        source_ids: [prh-always-day-one, bigtech-about]
