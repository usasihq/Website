sections:
  - heading: Products and projects
    paragraphs:
      - text: >-
          George Hotz's homepage points to two companies Hotz started: comma.ai and tiny corp. comma.ai develops
          openpilot, an MIT-licensed operating system for robotics that upgrades the driver assistance system on
          supported cars, and sells hardware for hands-free driving in existing cars.
        source_ids: [homepage, openpilot-repo, comma-site]
      - text: >-
          In May 2023 Hotz announced tiny corp on the blog, describing it as a computer company whose goal is "to
          commoditize the petaflop". The company sells tinybox, a configurable deep learning computer, through
          tinygrad.org.
        source_ids: [blog-tiny-corp, tinygrad-site]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Hotz started tinygrad in October 2020, with a first commit on October 17, as a small project for
          learning about neural networks. By 2023 it ran the driving model inside openpilot, and its intermediate
          representation was built from a small set of operations so that matrix multiplies and convolutions
          reduce to multiplies and sums with lazy evaluation allowing operation fusion.
        source_ids: [blog-five-years, blog-tiny-corp]
      - text: >-
          Hotz's December 2025 post "Five years of tinygrad" describes the stack as including a frontend, a graph
          compiler, runtimes and drivers, with work under way to remove the LLVM dependency so tinygrad can drive
          AMD GPUs in pure Python. The post describes tiny corp as working almost entirely in the open on GitHub
          and Discord, with contributors hired through their contributions to the repository.
        source_ids: [blog-five-years, tinygrad-repo]
