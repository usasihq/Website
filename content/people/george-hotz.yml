headline: Creator of the open-source tinygrad deep learning framework and founder of tiny corp and comma.ai
bio:
  text: >-
    George Hotz started tinygrad in October 2020 and founded tiny corp, the computer company that
    maintains it; tinygrad is an end-to-end deep learning stack released under the MIT license.
    George Hotz's blog describes tiny corp's stated goal as "to commoditize the petaflop" and
    describes tinygrad's stack as spanning a frontend, a graph compiler, runtimes, and GPU drivers.
    George Hotz's homepage also points to comma.ai as one of George Hotz's startups; comma.ai
    develops openpilot, an MIT-licensed operating system for robotics that upgrades the driver
    assistance system on supported cars.
  source_ids: [blog-tiny-corp, blog-five-years, homepage, github-profile, tinygrad-repo, openpilot-repo]
  reviewed_at: 2026-10-21
