headline: Member of NVIDIA Research; co-author of the StyleGAN3, EDM, and EDM2 generative model papers
bio:
  text: >-
    Miika Aittala joined NVIDIA Research in November 2019 after a postdoctoral position at MIT CSAIL,
    where Aittala worked with Frédo Durand on computer graphics, computer vision, and machine learning.
    Aittala's MIT page lists research interests in material appearance capture, rendering and light
    transport, image processing, and deep learning. At NVIDIA, Aittala is the second author of the StyleGAN3, EDM,
    and EDM2 papers, whose official implementations NVIDIA publishes in its NVlabs GitHub organization.
    NVIDIA Research also lists Aittala as a co-author of a NeurIPS 2025 paper on rolling diffusion
    models for probabilistic forecasting.
