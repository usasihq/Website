sections:
  - heading: Career
    paragraphs:
      - text: >-
          Aittala received M.Sc. and Ph.D. degrees from Aalto University, advised by Jaakko Lehtinen, and has
          worked at or visited Inria's GraphDeco group, the VTT Technical Research Centre of Finland, and NVIDIA
          Research as an intern. Aittala was then a postdoctoral researcher at MIT CSAIL with Frédo Durand, and
          in November 2019 joined NVIDIA Research, where NVIDIA lists Aittala's research areas as generative AI
          and machine learning with a main field of interest in computer graphics.
        source_ids: [aittala-mit, nvidia-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Aittala's early papers, many published in the proceedings of SIGGRAPH, dealt with capturing the appearance of real
          materials and with rendering. They include two-shot and frequency-domain methods for capturing
          spatially varying reflectance (SVBRDF), reflectance modeling by neural texture synthesis (2016), and
          gradient-domain path tracing and Metropolis light transport. At MIT, Aittala worked on burst image
          deblurring with permutation-invariant networks and on blind inverse light transport.
        source_ids: [aittala-mit]
      - text: >-
          With Jaakko Lehtinen, Tero Karras, Timo Aila and others, Aittala co-authored Noise2Noise (2018), which trains image restoration networks
          using only noisy examples. Since joining NVIDIA, Aittala has been second author, after Tero Karras, of
          StyleGAN3 (2021), EDM (2022), EDM2 (2023) and the 2024 autoguidance paper, and in 2025 co-authored
          elucidated rolling diffusion models for probabilistic forecasting of complex dynamics.
        source_ids: [noise2noise-paper, stylegan3-paper, edm-paper, edm2-paper, autoguidance-paper, erdm-paper]
