headline: Founder and CTO of Together AI; Neubauer Associate Professor of computer science at the University of Chicago
bio:
  text: >-
    Ce Zhang is the CTO of Together AI, which lists Zhang among its founders, and a Neubauer Associate
    Professor in the Department of Computer Science at the University of Chicago; before that, Zhang was
    an Associate Professor at ETH Zurich. Zhang's research looks at the tension between data, models,
    computation and infrastructure, with a focus on machine learning platforms and systems that are
    data-centric, human-centric and declaratively scalable. Zhang is a co-author of the RedPajama paper,
    which describes an open dataset for training large language models, and of the Holistic Evaluation
    of Language Models (HELM) paper. Zhang completed a PhD at the University of Wisconsin-Madison and a
    postdoc at Stanford, both advised by Chris Ré.
