sections:
  - heading: Career
    paragraphs:
      - text: >-
          Zhang completed a PhD at the University of Wisconsin-Madison and a year as a postdoctoral researcher
          at Stanford, both advised by Christopher Ré, before joining ETH Zurich, where Zhang became an
          Associate Professor of computer science. Zhang is now CTO of Together AI, which lists Zhang among its
          founders alongside Vipul Ved Prakash, Chris Ré, Tri Dao, and Percy Liang, and a Neubauer Associate
          Professor at the University of Chicago, where Zhang's site lists the course DATA 34100.
        source_ids: [zhang-bio, zhang-site, together-about]
      - text: >-
          Zhang's site also lists a role as a PhD mentor at INSAIT and as a co-editor-in-chief of DMLR, a
          journal in the JMLR family focused on data-centric machine learning research.
        source_ids: [zhang-site]
  - heading: Research
    paragraphs:
      - text: >-
          Zhang's group takes a systems approach to machine learning, building platforms that are data-centric,
          human-centric, and declaratively scalable, with the stated goal of making machine learning accessible,
          cost-efficient, and trustworthy. Position papers listed on Zhang's site include DataPerf, a benchmark
          suite for data-centric AI development, and the paper that framed the first MLSys conference.
        source_ids: [zhang-bio, zhang-site]
      - text: >-
          Zhang's recent papers on large language models include work on training foundation models across
          decentralized, heterogeneous hardware (2022), FlexGen for high-throughput LLM inference on a single
          GPU (2023), and RedPajama, an open dataset for training large language models (2024). Zhang is also a
          co-author of the HELM benchmark paper, whose contributions appendix credits Zhang with managing the
          Together Research Computer used to evaluate open models.
        source_ids: [decentralized-training-paper, flexgen-paper, redpajama-paper, redpajama-html, redpajama-repo, helm-paper, helm-pdf]
  - heading: Scientific service
    paragraphs:
      - text: >-
          Zhang has served as program co-chair of the SysML and MLSys demo tracks and the MLOps workshop, as an
          associate editor for SIGMOD and VLDB, and as a NeurIPS area chair for the benchmarks and datasets
          track in 2022.
        source_ids: [zhang-honors]
