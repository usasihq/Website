sections:
  - heading: Career
    paragraphs:
      - text: >-
          Staar first worked at IBM as a summer student in 2006 and, after postdoctoral work in
          theoretical physics and scientific computing at ETH Zurich, joined IBM Research as a
          postdoctoral researcher in 2014. Over the following decade Staar led IBM's
          document AI platform from the Corpus Conversion Service and Deep Search to an open-source
          document intelligence stack.
        source_ids: [lfai-people, ccs-paper]
      - text: >-
          Staar now manages IBM Research's AI for Knowledge group and chairs the LF AI & Data
          Technical Advisory Council, as well as the TAC of Docling and of Doclang, an initiative on
          structured document representation.
        source_ids: [lfai-people]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Docling parses documents into a unified representation for generative AI applications and
          is released under the MIT license as an LF AI & Data project. Staar is the senior author
          of its 2024 technical report and 2025 toolkit paper and is listed among the repository's
          maintainers.
        source_ids: [docling-gh, docling-report, docling-toolkit-paper, docling-maintainers]
      - text: >-
          Earlier datasets from Staar's group include DocLayNet, a human-annotated dataset for
          document-layout analysis, a task the paper describes as key to high-quality PDF conversion.
        source_ids: [doclaynet-paper]
