headline: IBM Research manager and Docling technical lead; chairs the LF AI & Data Technical Advisory Council
bio:
  text: >-
    Peter W. J. Staar is a Principal Research Staff Member, Master Inventor and manager of the AI
    for Knowledge group at IBM Research, and chairs the Technical Advisory Council of the LF AI &
    Data Foundation. Staar is the technical lead and TAC chair of Docling, the open-source document
    conversion toolkit hosted by LF AI & Data, and a maintainer of its repository.
  source_ids: [lfai-people, docling-gh, docling-maintainers]
  reviewed_at: 2026-10-21
