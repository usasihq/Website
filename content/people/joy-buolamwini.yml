sections:
  - heading: Research
    paragraphs:
      - text: >-
          While a graduate student at the MIT Media Lab, Joy Buolamwini found that facial analysis software
          struggled to detect Buolamwini's face, and went on to study gender and skin-type disparities in
          commercially sold facial analysis products. The Gender Shades project ran at the Media Lab from January
          2017 to August 2020.
        source_ids: [ajl-about, gender-shades-project]
      - text: >-
          The 2018 Gender Shades paper with Timnit Gebru evaluated three commercial gender classification systems
          and introduced a facial analysis benchmark balanced by gender and skin type, after the project found that
          existing benchmark datasets over-represented lighter-skinned men.
        source_ids: [gender-shades-paper, gender-shades-project]
  - heading: Algorithmic Justice League
    paragraphs:
      - text: >-
          Buolamwini founded the Algorithmic Justice League, which uses art and research to show the social
          implications and harms of AI and to push for more equitable and accountable systems. Buolamwini's
          research is featured in the documentary Coded Bias, and Buolamwini also makes art about AI's effects on
          society under the name Poet of Code.
        source_ids: [ajl-about, poet-of-code, prh-unmasking-ai]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Buolamwini's book Unmasking AI: My Mission to Protect What is Human in a World of Machines, published by
          Random House, blends memoir with an account of research into the harms and biases of AI. Buolamwini's
          writing has also appeared in publications such as Time, The New York Times, Harvard Business Review and
          The Atlantic, and Buolamwini publishes a newsletter on Substack.
        source_ids: [prh-unmasking-ai, unmasking-ai, newsletter-about]
timeline:
