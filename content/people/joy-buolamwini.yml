headline: Founder and President of the Algorithmic Justice League; author of Unmasking AI and a newsletter
bio:
  text: >-
    Joy Buolamwini is the founder and President of the Algorithmic Justice League, an organization
    that combines art and research to show the social implications and harms of artificial
    intelligence. As a researcher at the MIT Media Lab, Joy Buolamwini initiated Gender Shades, a
    study of commercial gender classification systems, and co-authored the 2018 paper with Timnit Gebru that introduced a
    facial analysis benchmark balanced by gender and skin type. Joy Buolamwini is the author of the
    book Unmasking AI: My Mission to Protect What is Human in a World of Machines and writes a
    newsletter on Substack.
  source_ids: [ajl-about, poet-of-code, mit-profile, gender-shades-project, gender-shades-paper, unmasking-ai, newsletter-about]
