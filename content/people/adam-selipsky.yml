headline: Former CEO of Amazon Web Services; member of Circle's board of directors since July 2025
bio:
  text: >-
    Adam Selipsky was one of the first vice presidents hired at Amazon Web Services, in 2005, and
    spent 11 years in charge of AWS sales, marketing and support before becoming President and CEO
    of Tableau Software, which Selipsky led through its acquisition by Salesforce. Selipsky then
    served as CEO of AWS, a period in which AWS released generative AI services
    including Amazon Bedrock and Amazon Q, until Matt Garman took over as CEO in June 2024. In July
    2025, Circle Internet Group appointed Selipsky to its board of directors, where Circle's
    governance pages list Selipsky as a committee member.
  source_ids: [aws-update-2024, circle-2025, circle-committees]
