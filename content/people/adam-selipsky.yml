sections:
  - heading: Career
    paragraphs:
      - text: >-
          Selipsky joined Amazon Web Services in 2005 as one of its first vice presidents and led AWS sales,
          marketing, and support for 11 years. Selipsky then became President and CEO of Tableau Software and
          led the company through its acquisition by Salesforce. Earlier, Selipsky held senior leadership
          roles at RealNetworks and Mercer Management Consulting.
        source_ids: [aws-update-2024, circle-2025]
      - text: >-
          Selipsky later returned to lead AWS as CEO. In a May 2024 note to employees, Amazon CEO Andy Jassy
          said the team had continued to release new services during that period, including generative AI
          services such as Amazon Bedrock and Amazon Q, and announced that Matt Garman would become AWS CEO.
          While at AWS, Selipsky was an inaugural member of the U.S. Department of Homeland Security's
          Artificial Intelligence Safety and Security Board.
        source_ids: [aws-update-2024, circle-2025]
  - heading: Board service
    paragraphs:
      - text: >-
          In July 2025 Circle Internet Group appointed Selipsky to its board of directors, citing more than
          20 years of executive experience in scaling internet platform infrastructure. Circle's committee
          composition page lists Selipsky as a member of two board committees. Selipsky has also served on
          the boards of AWS and Tableau.
        source_ids: [circle-2025, circle-committees]
