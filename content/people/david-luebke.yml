headline: Helped found NVIDIA Research in 2006; runs a research group on computer graphics and neural image synthesis
bio:
  text: >-
    David Luebke helped found NVIDIA Research in 2006 after eight years on the faculty of the
    University of Virginia, and runs a research group there focused on computer graphics and
    neural image synthesis. NVIDIA lists Luebke's principal research interests as computer
    graphics, generative neural networks and virtual reality. Luebke's recent work includes a
    framework for real-time rendering of radiance fields on light field displays, which NVIDIA lists
    under HPG 2026. NVIDIA's research profile notes that Luebke is a Fellow of the IEEE and an inductee into
    the IEEE VR Academy, with honors including the IEEE VR Technical Achievement Award and the ACM
    Symposium on Interactive 3D Graphics Test of Time Award.
  source_ids: [nvidia-research-profile, nvidia-blog-author, light-field-paper]
  reviewed_at: 2026-10-21
