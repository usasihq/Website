sections:
  - heading: Career
    paragraphs:
      - text: >-
          Luebke earned a PhD at the University of North Carolina in 1998 under Fred Brooks, then spent eight
          years on the faculty of the University of Virginia. In 2006 Luebke helped found NVIDIA Research, where
          Luebke now runs a group working on computer graphics and neural image synthesis.
        source_ids: [nvidia-research-profile, nvidia-blog-author]
      - text: >-
          NVIDIA's pages note that, with colleagues, Luebke has co-authored a book, a SIGGRAPH Electronic Theater
          piece and a museum exhibit, along with papers, chapters and patents. In November 2021 Luebke wrote an
          NVIDIA Blog post on how researchers use AI tools to help counter visual misinformation.
        source_ids: [nvidia-research-profile, nvidia-blog-author]
  - heading: Research
    paragraphs:
      - text: >-
          Luebke's earlier NVIDIA work concerned real-time rendering and GPU computing, including papers on
          scalable ambient obscurance (2012), GPU ray tracing in Communications of the ACM (2013) and the
          CloudLight system for amortizing indirect lighting (2013 report, 2015 journal version).
        source_ids: [nvidia-research-profile, nvidia-blog-author]
      - text: >-
          In the 2010s Luebke's work also turned to displays and virtual reality. Luebke co-authored "Near-Eye Light
          Field Displays" with Douglas Lanman (ACM Transactions on Graphics, 2013), "Towards Foveated Rendering
          for Gaze-Tracked Virtual Reality" (SIGGRAPH Asia 2016) and a series of varifocal and foveated
          augmented reality displays shown at SIGGRAPH between 2017 and 2019.
        source_ids: [nvidia-research-profile]
      - text: >-
          More recent work combines neural methods with 3D media, including AI-mediated 3D video conferencing
          (SIGGRAPH Emerging Technologies 2023), the QUEEN encoding for streaming free-viewpoint video (NeurIPS
          2024), and real-time rendering of radiance fields on light field displays, listed for HPG 2026.
        source_ids: [nvidia-research-profile, light-field-paper]
