headline: Technology journalist behind The New Things newsletter and videos; author of I Am Not a Robot
bio:
  text: >-
    Joanna Stern is a technology journalist who started the tech media company New Things, publishing
    The New Things newsletter and video series about consumer technology and AI. Joanna is also chief
    technology analyst and a contributing correspondent at NBC News. Over 12 years at The Wall Street
    Journal, Joanna wrote personal technology columns and made videos, and created the 2021 documentary
    E-Ternal. Joanna's book I Am Not a Robot recounts a year spent using AI in nearly every part of
    daily life.
