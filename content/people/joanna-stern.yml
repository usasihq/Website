sections:
  - heading: Career
    paragraphs:
      - text: >-
          Joanna Stern worked at ABC News and helped start The Verge before spending 12 years at The Wall Street
          Journal, where Stern wrote personal technology columns and made videos. Stern then left the Journal to
          found the tech media company New Things, and is also chief technology analyst and a contributing
          correspondent at NBC News.
        source_ids: [newthings-about, site]
      - text: >-
          At the Journal, Stern created the 2021 documentary E-Ternal, which won an Emmy for Outstanding Science,
          Technology or Environmental Coverage.
        source_ids: [site]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          New Things combines a YouTube channel, a newsletter called The New Things and other formats, with a
          small team that includes a head of video and a production assistant. Recent newsletters include a review
          of the iPhone Duo and an October 2026 interview with Microsoft chief executive Satya Nadella about the
          Surface Laptop Ultra and making Windows safer for AI agents.
        source_ids: [site, newthings-about, newthings]
      - text: >-
          Stern's book I Am Not a Robot: My Year Using AI to Do (Almost) Everything and Replace (Almost) Everyone
          recounts a year of letting AI into nearly every part of daily life.
        source_ids: [site]
