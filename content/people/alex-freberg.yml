sections:
  - heading: Career
    paragraphs:
      - text: >-
          Freberg's About page says Freberg came to data analytics in 2017 after working at a non-profit,
          learned SQL, Python and Excel independently, and took a first data analyst job that year. By 2021
          Freberg had become an Analytics Manager at a large company. Freberg now consults for start-ups and
          technology companies on data strategy, product-market fit and marketing campaigns, and speaks at
          conferences and webinars on data analytics, data consulting and entrepreneurship.
        source_ids: [about, website]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          The Alex The Analyst YouTube channel, which YouTube lists as joined in January 2020, sets out to teach
          what a data analyst needs to know and is aimed at people making a career change into the field. The
          About page says Freberg started the channel to help others trying to break into data analytics.
          Freberg's website gathers course pages on SQL, Excel, Python, Tableau and Power BI, cloud tools,
          certifications and interview preparation, and promotes a book on succeeding in a data career after
          the hiring process, covering topics such as the first 90 days and working with stakeholders.
        source_ids: [youtube-channel, about, website]
      - text: >-
          Analyst Builder, the platform Freberg runs, offers data analytics courses, practice questions,
          portfolio projects and learning roadmaps for roles such as data analyst, analytics engineer and
          business intelligence. Its course catalog includes MySQL, Excel, Tableau, Python and Pandas courses
          as well as courses on Snowflake, Databricks and soft skills for data professionals.
        source_ids: [analyst-builder, analyst-builder-courses]
