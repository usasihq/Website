headline: Host of Alex The Analyst, a YouTube channel teaching data analytics, who runs Analyst Builder
bio:
  text: >-
    Alex Freberg hosts Alex The Analyst, a YouTube channel that teaches the skills needed to work
    as a data analyst, aimed at people changing careers into data. Alex's website offers courses on
    SQL, Excel, Python and Tableau or Power BI, and a book on advancing a data career after being
    hired. Alex runs the ed-tech platform Analyst Builder, which hosts full data analytics courses,
    projects and practice questions, and consults for start-ups and tech companies on data.
  source_ids: [website, youtube-channel, analyst-builder]
  reviewed_at: 2026-10-21
