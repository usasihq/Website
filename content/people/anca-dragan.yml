headline: Heads AI Safety and Alignment at Google DeepMind; UC Berkeley associate professor who runs the InterACT Lab
bio:
  text: >-
    Anca Dragan is an Associate Professor in the EECS Department at UC Berkeley, currently on leave to
    head AI Safety and Alignment at Google DeepMind, where Dragan leads teams responsible for the safety
    of Gemini models. At Berkeley, Dragan runs the InterACT Lab, which works on algorithms for
    human-AI and human-robot interaction, including learning reward functions from human feedback.
    Dragan is a co-author of Google DeepMind's 2025 paper "An Approach to Technical AGI Safety and
    Security", which sets out technical approaches to misuse and misalignment risks.
  source_ids: [homepage, agi-safety-paper]
  reviewed_at: 2026-10-13
