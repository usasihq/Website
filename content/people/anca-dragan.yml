sections:
  - heading: Career
    paragraphs:
      - text: >-
          Anca Dragan is an Associate Professor in UC Berkeley's EECS Department and is on leave to head
          AI Safety and Alignment at Google DeepMind. There Dragan leads teams responsible for the safety
          of current Gemini models and for preparing safety work as Gemini capabilities advance, covering
          alignment with human goals, informed oversight and robustness to adversarial attacks.
        source_ids: [homepage]
      - text: >-
          Dragan helped found the Berkeley AI Research (BAIR) Lab and served on its steering committee,
          and is a co-PI of the Center for Human-Compatible AI. Dragan's homepage also notes six years of
          consulting for Waymo on deploying an increasingly learning-based, safety-critical system.
        source_ids: [homepage, cv-page]
  - heading: Research
    paragraphs:
      - text: >-
          Dragan's Berkeley research aims to let AI agents, from robots and cars to language models and
          recommender systems, work with and in support of people. A core problem for the InterACT Lab
          since its start has been AI alignment, approached through learning reward functions
          interactively from diverse forms of human feedback while maintaining uncertainty. The lab has
          also worked on human-AI collaboration and coordination, including assistance in brain-machine
          interfaces and autonomous cars sharing the road with human drivers.
        source_ids: [homepage]
      - text: >-
          Dragan's papers have been recognized at robotics and human-robot interaction venues, including
          a best paper award at HRI 2020 for "LESS is More: Rethinking Probabilistic Models of Human
          Behavior." In 2025 Dragan co-authored Google DeepMind's paper on an approach to technical AGI
          safety and security, which focuses on misuse and misalignment.
        source_ids: [cv-page, agi-safety-paper]
  - heading: Service
    paragraphs:
      - text: >-
          Dragan was Program Co-Chair of the Conference on Robot Learning (CoRL) in 2018, chaired the Bay
          Area Robotics Symposium in 2016 and 2017, and served as a Senior Area Chair for ICLR 2024.
          Dragan has also been an area chair or associate editor for venues including ICRA, IROS and HRI.
        source_ids: [cv-page]
