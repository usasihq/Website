headline: Co-founder and CEO of Inceptive; co-author of the Transformer paper during Google's language research
bio:
  text: >-
    Jakob Uszkoreit is the co-founder and CEO of Inceptive, a company that builds foundation models
    for designing biological medicines such as RNA-based therapeutics. Earlier, as a Software Engineer
    in Natural Language Understanding at Google, Uszkoreit co-authored "Attention Is All You Need"
    (2017), the paper that proposed the Transformer architecture based solely on attention, and wrote
    the Google Research blog post introducing it. Uszkoreit is also listed among the authors of
    Inceptive's post on designing mRNA sequences for in vivo CAR-T with the company's platform.
