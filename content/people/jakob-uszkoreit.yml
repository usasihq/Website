sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jakob Uszkoreit worked at Google as a software engineer in natural language understanding, where
          Uszkoreit co-authored the 2017 Transformer paper and wrote the Google Research blog post that introduced
          it. Uszkoreit later co-founded Inceptive and serves as its CEO.
        source_ids: [google-blog, attention-paper, inceptive-release]
      - text: >-
          Inceptive builds foundation models that design sequence-based medicines such as mRNA, siRNA, antisense
          oligonucleotides and peptides, pairing model training with an in-house wet lab that tests designs. In
          June 2026 Inceptive and Alnylam announced a collaboration on AI for RNAi therapeutics, and the company
          has published work on designing mRNA for in vivo CAR-T therapy.
        source_ids: [inceptive-site, inceptive-release, inceptive-cart]
  - heading: Research
    paragraphs:
      - text: >-
          Before the Transformer, Uszkoreit co-authored A Decomposable Attention Model for Natural Language
          Inference (EMNLP 2016), which used attention to split inference into subproblems that can be solved in
          parallel. "Attention Is All You Need" (2017) then proposed a translation architecture built only on
          attention, without recurrence or convolutions.
        source_ids: [decomposable-attention, attention-paper]
      - text: >-
          Uszkoreit went on to co-author follow-up work applying and extending the architecture, including the
          Image Transformer and Universal Transformers in 2018 and the Vision Transformer paper, An Image is Worth
          16x16 Words, in 2020.
        source_ids: [image-transformer, universal-transformers, vit-paper]
  - heading: Talks
    paragraphs:
      - text: >-
          At TEDAI San Francisco in October 2024, Uszkoreit gave the talk "How AI sidesteps traditional science",
          which looks at scientific results reached through deep learning and at using AI as an approach to
          studying complex phenomena.
        source_ids: [ted-talk]
