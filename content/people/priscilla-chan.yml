headline: Co-founder of Biohub and co-founder and co-CEO of the Chan Zuckerberg Initiative
bio:
  text: >-
    Priscilla Chan, M.D., is a co-founder of Biohub, the nonprofit medical research organization
    that combines AI and biology to understand and address disease, and the co-founder and co-CEO
    of the Chan Zuckerberg Initiative. Chan is a pediatrician whose leadership at the Initiative
    focuses on AI and research tools for biomedical science.
  source_ids: [biohub-team, biohub-ai-biology]
  reviewed_at: 2026-10-21
