sections:
  - heading: Career
    paragraphs:
      - text: >-
          Chan, a pediatrician, co-founded the Chan Zuckerberg Initiative, which Chan co-leads as co-CEO, and
          co-founded Biohub, which was founded in 2016.
        source_ids: [biohub-team, biohub-ai-biology]
  - heading: Biohub and AI for biology
    paragraphs:
      - text: >-
          In November 2025 Chan and Mark Zuckerberg announced an initiative to combine frontier AI
          and frontier biology at Biohub. The EvolutionaryScale team joined Biohub, its co-founder
          Alex Rives became Biohub's head of science, and Biohub launched the Virtual Immune
          System, an effort to model the human immune system.
        source_ids: [biohub-ai-biology]
      - text: >-
          In May 2026 Biohub released a world model of protein biology built around three open
          releases: the ESMC protein language model, the ESMFold2 structure and design model, and
          the ESM Atlas of protein sequences and predicted structures.
        source_ids: [biohub-world-model]
