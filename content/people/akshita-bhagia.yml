headline: Senior Research Engineer at Ai2 working on the OLMo and FlexOlmo open language models
bio:
  text: >-
    Akshita Bhagia is a Senior Research Engineer on Ai2's AllenNLP team, where Bhagia builds and
    evaluates large language models and has recently worked on the FlexOlmo and Olmo projects.
    Bhagia is a co-author of the original OLMo paper and of the Dolma pretraining corpus paper. In
    OLMo 2, Bhagia is credited with base-model development, including training and data curation,
    and in OLMoE with supporting stability investigations and DCLM evaluations.
  source_ids: [bhagia-site, ai2-team, olmo-paper, dolma-paper, olmo2-pdf, olmoe-pdf]
  reviewed_at: 2026-10-21
