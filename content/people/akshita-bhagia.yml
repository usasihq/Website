sections:
  - heading: Career
    paragraphs:
      - text: >-
          Akshita Bhagia worked at InFoCusp from 2015 to 2018, first as a Research Programmer and then as
          Lead Platform Development Engineer, building core infrastructure for a data science platform.
          During a Master's in Computer Science at the University of Massachusetts Amherst, completed in
          2020, Bhagia worked with Mohit Iyyer at the intersection of NLP and digital humanities.
        source_ids: [bhagia-cv, bhagia-site]
      - text: >-
          Bhagia joined the Allen Institute for AI as a Research Engineer in July 2020 and became a Senior
          Research Engineer in July 2021, on the AllenNLP team. Bhagia's CV lists core contributions to the
          Olmo family of models in dataset creation, pretraining, evaluation and inference, along with work
          on FlexOlmo and on language models for cancer data with the Cancer AI Alliance.
        source_ids: [bhagia-cv, bhagia-site, ai2-team]
  - heading: Research
    paragraphs:
      - text: >-
          Bhagia is a co-author of the OLMo and Dolma papers (2024) and a core contributor to OLMo 2, where
          the paper credits Bhagia with base-model development. Bhagia also worked on OLMoE, a fully open
          mixture-of-experts model, and is second-listed author of FlexOlmo (NeurIPS 2025 spotlight), which
          lets data owners train parts of a model without sharing their data.
        source_ids: [olmo-paper, dolma-paper, olmo2-pdf, olmoe-pdf, flexolmo-paper, bhagia-cv]
      - text: >-
          Much of Bhagia's work concerns evaluating language models and their data. It includes What's In
          My Big Data? (ICLR 2024 spotlight), the Paloma benchmark for measuring language-model fit across
          hundreds of domains, the Catwalk evaluation framework, and a COLM 2025 paper on predicting task
          performance with compute-efficient model ladders.
        source_ids: [wimbd-paper, paloma-paper, model-ladders-paper, bhagia-pubs, bhagia-cv]
  - heading: Teaching and service
    paragraphs:
      - text: >-
          Bhagia co-presented a NeurIPS 2024 tutorial on data preparation, model training and adaptation,
          and co-organized the 2022 WMT shared task on large-scale machine translation evaluation for
          African languages. Bhagia has reviewed for NeurIPS, COLING, LREC and ACL Rolling Review.
        source_ids: [bhagia-cv]
