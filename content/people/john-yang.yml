sections:
  - heading: Research
    paragraphs:
      - text: >-
          Yang completed an M.S.E. in computer science at Princeton University, advised by Karthik
          Narasimhan, and is now a PhD student at Stanford University advised by Ludwig Schmidt and Diyi
          Yang. Yang's research covers language model agents, language model evaluation, synthetic data and
          software engineering.
        source_ids: [yang-site]
      - text: >-
          Yang co-authored SWE-bench (October 2023), which tests whether language models can resolve real
          GitHub issues, and was first author of SWE-agent (May 2024) and SWE-smith (April 2025). Yang's site
          also lists InterCode and CodeClash among the projects Yang created and features ProgramBench.
        source_ids: [swe-bench-paper, swe-agent-paper, swe-smith-paper, yang-site]
  - heading: SWE-sweep
    paragraphs:
      - text: >-
          Yang is the final author of SWE-sweep, released with Kilian Lieret as first author. The
          benchmark gives agents a real repository and asks them to find and fix as many bugs as possible,
          scoring hidden per-bug tests and assigning zero to a task if previously passing tests break.
        source_ids: [swesweep-site, swesweep-readme]
