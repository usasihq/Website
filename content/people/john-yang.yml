headline: Stanford PhD student; creator of SWE-bench and SWE-agent and senior author of the SWE-sweep benchmark
bio:
  text: >-
    John Yang is a computer science PhD student at Stanford University, advised by Ludwig Schmidt and Diyi
    Yang, researching language model agents, evaluation, synthetic data and software engineering. Yang's
    site describes Yang as the creator of InterCode, SWE-bench, SWE-agent, SWE-smith and CodeClash,
    and also features ProgramBench. Yang is the last-listed author of SWE-sweep, a bug-finding and repair benchmark released
    by Meta, whose project page lists Meta Superintelligence Labs among Yang's affiliations.
  source_ids: [yang-site, swesweep-site, swesweep-readme]
  reviewed_at: 2026-10-22
