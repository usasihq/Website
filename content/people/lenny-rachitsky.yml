sections:
  - heading: Career
    paragraphs:
      - text: >-
          Lenny Rachitsky joined Airbnb in 2012, shortly after Airbnb acquired the startup Lenny
          worked at. Lenny started there as an engineer and then became one of the first members of
          the company's product management team, staying for about seven years.
        source_ids: [post-airbnb]
      - text: >-
          After leaving Airbnb in 2019, Lenny wrote up lessons from that period on culture, focus on
          problems, and goal setting. A few months later Lenny relaunched the newsletter as an advice
          column answering readers' questions about growth, product, and leadership.
        source_ids: [post-airbnb, post-this-week-0]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Lenny's Newsletter is an advice column on building products, driving growth, and
          advancing careers, written for product leaders, founders, and builders. The site also hosts
          a How I AI section alongside the newsletter and podcast.
        source_ids: [about, howiai]
      - text: >-
          Lenny launched Lenny's Podcast in June 2022, with first episodes featuring Julie Zhuo and
          Shreyas Doshi. Each episode interviews a product leader or growth expert, with a focus on
          practical advice for building, launching, and growing products.
        source_ids: [post-podcast-launch, podcast]
  - heading: Writing on AI
    paragraphs:
      - text: >-
          The newsletter also covers how product teams use AI. Examples include
          "How to use ChatGPT in your PM work" (2023), which gathered real prompts from product
          managers, and "An AI glossary" (2025), which explains common AI terms in plain language.
        source_ids: [post-chatgpt-pm, post-ai-glossary]
