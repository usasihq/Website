headline: Writer of Lenny's Newsletter and host of Lenny's Podcast, on building and growing tech products
bio:
  text: >-
    Lenny Rachitsky publishes Lenny's Newsletter on Substack, an advice column about building
    products, driving growth, and careers for product leaders, founders, and builders. Lenny
    Rachitsky also hosts Lenny's Podcast, which interviews product leaders and growth experts about
    building, launching, and growing products. The publication's site also carries a How I AI section.
  source_ids: [about, podcast, howiai, post-podcast-launch]
  reviewed_at: 2026-10-21
