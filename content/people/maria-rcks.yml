headline: Contributor to T3 Code, Ping.gg's open-source control app for coding agents
bio:
  text: >-
    maria, who publishes as maria-rcks on GitHub, contributes to T3 Code, the open-source
    control app for coding agents from Ping.gg. T3 Code's release notes credit maria for changes
    such as rendering Mermaid code blocks as diagrams, desktop app fixes, and server
    fixes for Claude turns and background subagents. maria's own open-source projects include
    t1code, a terminal interface for T3 Code, an AUR package of T3 Code, and miri, a
    keyboard-first window manager for macOS.
