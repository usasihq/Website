sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          maria, who publishes as maria-rcks on GitHub, contributes to T3 Code, Ping.gg's open-source
          control app for coding agents. The project's v0.1.0 release notes, published on 15 October
          2026, credit maria with several changes, including rendering Mermaid code blocks as
          diagrams, a keyboard shortcut that sends a message and opens a new thread, letting
          no-project drafts switch machines, and a server fix for starting Claude turns on Windows.
        source_ids: [t3code-v0-1-0, t3code-readme]
      - text: >-
          maria's own MIT-licensed repositories include t1code, which brings T3 Code to the terminal;
          t3code-aur, which packages T3 Code for the Arch User Repository; and miri, a keyboard-first
          window manager for macOS modeled loosely on niri.
        source_ids: [t1code, t3code-aur, miri, github-profile]
