headline: Global Head of the NVIDIA AI Technology Center and Chief Solution Architect at NVIDIA
bio:
  text: >-
    Simon See is Senior Director, Chief Solution Architect and Global Head of the NVIDIA AI
    Technology Center at NVIDIA, as listed by the PolyU–NVIDIA Joint Research Centre and the UNU
    Macau AI Conference 2025. Simon See is also a professor at Shanghai Jiao Tong University, with
    research interests spanning high-performance computing, big data, artificial intelligence,
    machine learning, computational science and simulation methodology. Before NVIDIA, Simon See
    worked for SGI, IBM, International Simulation Ltd, Sun Microsystems and Oracle. Simon See is a
    co-author of DyaPlex (2026), a full-duplex speech-and-motion model for dyadic interaction listed
    by NVIDIA's AI-Mediated Reality and Interaction Research group.
  source_ids: [polyu-profile, unu-event, dyaplex-paper, nvidia-amri]
