sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before joining NVIDIA, Simon See worked for SGI, DSO National Laboratories of Singapore,
          IBM, International Simulation Ltd, Sun Microsystems and Oracle, and has advised national research
          and supercomputing centres.
        source_ids: [polyu-profile]
      - text: >-
          At NVIDIA, See is Senior Director of Solution Architecture and Engineering, Chief Solution Architect
          and Global Head of the NVIDIA AI Technology Center. See also holds professorships at Shanghai Jiao
          Tong University, Beijing University of Posts and Telecommunications and Universitas Indonesia.
        source_ids: [polyu-profile, unu-event]
  - heading: Research and service
    paragraphs:
      - text: >-
          See's research interests span high-performance computing, big data, artificial intelligence, machine
          learning, computational science and simulation methodology. See is a co-author of DyaPlex (2026), a
          full-duplex model that generates speech and motion for two-person interaction, listed among the
          projects of NVIDIA's AI-Mediated Reality and Interaction Research group.
        source_ids: [polyu-profile, dyaplex-paper, nvidia-amri]
      - text: >-
          See is a Fellow of the IET, chairs a task force of the IEEE Computational Intelligence Society's
          Neural Networks Technical Committee, and gave a keynote titled "Is there a path to Equitable AI
          Future?" at the UNU Macau AI Conference in October 2025.
        source_ids: [polyu-profile, unu-event]
