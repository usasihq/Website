headline: Natural language processing researcher and research scientist at Google; former MIT faculty member
bio:
  text: >-
    Michael Collins works on natural language processing and machine learning; Google Research's
    profile describes a focus on statistical parsing, structured prediction, and applications such as
    machine translation, dialog systems, and speech recognition, and notes that Collins is a fellow of
    the Association for Computational Linguistics. Collins's Columbia homepage, which lists teaching
    through Spring 2020, says Collins was a researcher at AT&T Labs-Research from 1999 to 2002 and an
    assistant and then associate professor at MIT from 2003 to 2010, joined Columbia University in
    January 2011, and is also a research scientist at Google. Collins is listed with Google DeepMind on
    InfAlign, an ICML 2025 paper on inference-aware language model alignment, and is a co-author of
    Measuring Attribution in Natural Language Generation Models, which presents the Attributable to
    Identified Sources (AIS) evaluation framework. Collins also publishes lecture notes on statistical
    NLP topics on the Columbia homepage.
  source_ids: [collins-site, google-profile, infalign-paper, ais-paper]
  reviewed_at: 2026-10-13
