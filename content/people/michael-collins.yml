sections:
  - heading: Career
    paragraphs:
      - text: >-
          Michael Collins completed a PhD in computer science at the University of Pennsylvania in December
          1998. Collins was then a researcher at AT&T
          Labs-Research from January 1999 to November 2002 and an assistant and then associate professor at
          MIT from January 2003 to December 2010.
        source_ids: [collins-site]
      - text: >-
          Collins joined Columbia University in January 2011, where the homepage gives the title Vikram S.
          Pandit Professor of Computer Science, and says Collins is also a research scientist at Google. Google
          Research's profile describes Collins's research on statistical parsing, structured prediction and
          applications including machine translation, dialog systems and speech recognition.
        source_ids: [collins-site, google-profile]
  - heading: Research and teaching
    paragraphs:
      - text: >-
          Collins's papers have received best paper awards at EMNLP, UAI and CoNLL, and a test of time award
          at NAACL 2018. More recent work with Google colleagues includes the Attributable to Identified
          Sources (AIS) framework for judging whether generated text is supported by sources, and InfAlign, a
          method for aligning language models with the inference-time procedure in mind.
        source_ids: [collins-site, google-profile, ais-paper, infalign-paper]
      - text: >-
          At Columbia, Collins taught the Natural Language Processing course COMS W4705, most recently listed
          for Spring 2020. In Spring 2013 Collins taught an online course on natural language processing on
          Coursera, and the notes for that class are posted on the Columbia homepage.
        source_ids: [collins-site]
