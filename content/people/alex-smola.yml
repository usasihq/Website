sections:
  - heading: Career
    paragraphs:
      - text: >-
          Alex Smola earned a PhD in computer science at TU Berlin in 1998 with a thesis titled
          "Learning with Kernels", after thesis work on regression with support vector machines with
          Vladimir Vapnik at AT&T Bell Labs. Smola then held research positions at the Australian
          National University and NICTA from 1999 to 2008, becoming a senior principal researcher.
        source_ids: [smola-cv]
      - text: >-
          Smola was a principal research scientist at Yahoo! Research from 2008 to 2012, a visiting
          scientist at Google Research, and a full professor at Carnegie Mellon University from 2013
          to 2017, with adjunct appointments at UC Berkeley. After founding Marianas Labs, Smola
          joined Amazon Web Services in 2016 as a VP and Distinguished Scientist, and in 2023
          co-founded Boson AI, which Smola leads as CEO.
        source_ids: [smola-cv, smola-home]
  - heading: Research
    paragraphs:
      - text: >-
          Smola's research interests include kernel methods such as support vector machines and
          Gaussian processes, the scalability of algorithms across many machines, statistical
          modeling with Bayesian nonparametrics, and deep learning. Smola's homepage also lists
          applications in user modeling, document analysis and temporal models.
        source_ids: [smola-home]
  - heading: Books and teaching
    paragraphs:
      - text: >-
          With Bernhard Schölkopf, Smola wrote Learning with Kernels (MIT Press, 2002), and edited
          several volumes including Advances in Kernel Methods (1999), Advances in Large Margin
          Classifiers (2000) and Predicting Structured Data (2007). Smola is a co-author, with Aston
          Zhang, Zachary Lipton and Mu Li, of Dive into Deep Learning, an open interactive book.
        source_ids: [smola-cv, d2l-site, d2l-readme]
      - text: >-
          Smola organized the Machine Learning Summer School in several years between 2002 and 2015
          and workshops at NeurIPS and SIGIR. Smola was program chair of KDD 2016 and general chair of
          MLSys 2020.
        source_ids: [smola-cv]
