headline: Co-founder and CEO of Boson AI; co-author of Dive into Deep Learning; former VP at AWS
bio:
  text: >-
    Alex Smola co-founded Boson AI in 2023 and serves as its CEO. Smola's CV lists roles as VP and
    Distinguished Scientist at Amazon Web Services from 2016 to 2023, Full Professor at Carnegie
    Mellon University from 2013 to 2017, Visiting Scientist at Google Research from 2012 to 2014,
    and Principal Research Scientist at Yahoo! Research from 2008 to 2012. Smola is one of the
    four authors of Dive into Deep Learning, an interactive open book whose sections are
    runnable notebooks with implementations in PyTorch, NumPy/MXNet, JAX and TensorFlow, and
    co-authored the 2002 book Learning with Kernels.
  source_ids: [smola-home, smola-cv, d2l-site, d2l-readme]
  reviewed_at: 2026-10-13
