headline: PyTorch core maintainer and co-author of the original PyTorch paper and the PyTorch 2 paper
bio:
  text: >-
    Greg Chanan is listed as a core maintainer on PyTorch's maintainers page, which also lists
    Chanan as an emeritus maintainer of torch.nn and among the maintainers of the XLA module, now
    grouped with sunsetted modules. As Gregory Chanan, Chanan co-authored the 2019 PyTorch paper,
    listed there with Facebook AI Research, and the PyTorch 2 paper (ASPLOS 2024), listed with
    Meta.
  source_ids: [pytorch-maintainers, pytorch-paper-pdf, pt2-paper]
  reviewed_at: 2026-10-13
