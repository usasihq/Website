headline: Member of Profluent's machine learning team and first author of the Profluent-E1 protein encoder models
bio:
  text: >-
    Sarthak Jain is a member of the machine learning team at Profluent, which builds AI models for protein design.
    Jain is the first author of "E1: Retrieval-Augmented Protein Encoder Models", the preprint behind the
    openly released Profluent-E1 models in 150M, 300M and 600M parameter sizes, and a co-author of the
    ProGen3 scaling preprint. Profluent's team page says Jain previously worked at Amazon Research on
    foundation models for text and has published work on machine learning interpretability.
  source_ids: [profluent-team, e1-preprint, profluent-e1, progen3-preprint]
  reviewed_at: 2026-10-22
