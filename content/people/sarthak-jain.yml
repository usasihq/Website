sections:
  - heading: Profluent-E1
    paragraphs:
      - text: >-
          Jain is the first author, with Joel Beazer, Jeffrey A. Ruffolo, Aadyot Bhatnagar and Ali Madani,
          of "E1: Retrieval-Augmented Protein Encoder Models", posted to bioRxiv in November 2025. Profluent
          released E1 the same day as its first retrieval-augmented protein encoder family, in 150M, 300M and
          600M parameter variants, available for research and commercial use.
        source_ids: [e1-preprint, profluent-e1]
      - text: >-
          E1 can take homologous protein sequences as context alongside a sequence of interest, alternating
          between intra-sequence and block-causal attention. Profluent describes uses including fitness
          prediction, structure prediction and representation learning.
        source_ids: [profluent-e1]
  - heading: Other work
    paragraphs:
      - text: >-
          Jain is the second-listed author of "Scaling unlocks broader generation and deeper functional
          understanding of proteins" (April 2025), the preprint accompanying Profluent's ProGen3 protein
          generation models. Before Profluent, Jain worked at Amazon Research on foundation models for text.
        source_ids: [progen3-preprint, profluent-team]
