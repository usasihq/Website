sections:
  - heading: Career and research
    paragraphs:
      - text: >-
          Choi earned a PhD in computer science at Indiana University in 2012 and an MS in computer
          science from New York University in 2004, and works in ORNL's Discrete Algorithms Group. Choi's
          research spans data mining and machine learning algorithms, parallel and distributed systems, in
          situ and in-transit data processing, and data management for code coupling.
        source_ids: [ornl-profile]
      - text: >-
          Choi's recent ORNL publications include the HydraGNN v5.0 user manual (May 2026), a conference paper
          on multi-task parallelism for pre-training graph foundation models on multi-source atomistic data,
          and the lab's Data and AI Systems FY 2026 highlights report.
        source_ids: [ornl-profile]
