headline: Researcher at Oak Ridge National Laboratory and a developer of the HydraGNN graph neural network library
bio:
  text: >-
    Jong Youl Choi is a researcher in the Discrete Algorithms Group of the Computer Science and
    Mathematics Division at Oak Ridge National Laboratory (ORNL). Choi works on data-centric machine
    learning algorithms, high-performance data-intensive computing and data management for large-scale
    scientific workflows. Choi is listed as a developer of HydraGNN, ORNL's open-source multitask graph
    neural network library, in both its original 2021 software record and its v5.0 release, and ORNL
    lists the HydraGNN v5.0 user manual among Choi's publications.
  source_ids: [ornl-profile, osti-hydragnn, osti-hydragnn-v5, hydragnn-readme]
  reviewed_at: 2026-10-22
