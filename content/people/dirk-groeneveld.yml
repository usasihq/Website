headline: First author of Ai2's OLMo paper; contributor to OLMo 2, OLMoE, and the Dolma corpus
bio:
  text: >-
    Dirk Groeneveld is first author of the 2024 OLMo paper, which released Ai2's open language
    model together with its training data and its training and evaluation code. In the OLMo 2 paper,
    where Groeneveld is listed with an Ai2 affiliation, Groeneveld is credited with base-model
    development, including training and data curation. The OLMoE paper credits Groeneveld with
    advising on pretraining, especially stability and throughput improvements, and Groeneveld is
    also a co-author of the Dolma pretraining corpus paper.
  source_ids: [olmo-paper, olmo2-pdf, olmoe-pdf, dolma-paper]
  reviewed_at: 2026-10-21
