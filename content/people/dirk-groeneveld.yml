sections:
  - heading: Research
    paragraphs:
      - text: >-
          Groeneveld's early papers include work on scholarly search and question answering. Groeneveld co-authored the
          2018 paper describing how the literature graph behind Semantic Scholar was built, the 2019 overview of
          the Aristo science question-answering project, and was first author of "A Simple Yet Strong Pipeline
          for HotpotQA" (2020) on multi-hop question answering.
        source_ids: [s2-graph-paper, aristo-paper, hotpotqa-paper]
      - text: >-
          Later work turned to the data and evaluation behind language models. Groeneveld co-authored the 2021
          case study documenting the Colossal Clean Crawled Corpus (C4), and was first author of Catwalk (2023), a
          framework for evaluating language models across many datasets. A 2026 paper with Amanda Bertsch,
          Graham Neubig and others showed that small architectural choices in dense transformers affect how
          well models extend to long contexts.
        source_ids: [c4-paper, catwalk-paper, cracks-paper]
  - heading: OLMo models
    paragraphs:
      - text: >-
          Groeneveld was first author of the February 2024 OLMo paper, which released an open language model with
          its training data and code, and co-authored the Dolma pretraining corpus paper. On OLMo 2, Groeneveld is
          credited with base-model development, and the OLMoE paper credits Groeneveld with advice on pretraining
          stability and throughput.
        source_ids: [olmo-paper, dolma-paper, olmo2-pdf, olmoe-pdf]
      - text: >-
          Groeneveld is also an author of the December 2025 Olmo 3 report, which describes a family of fully open
          7B and 32B models and releases the full model flow. Groeneveld's GitHub profile lists Ai2 open-source
          repositories such as allenai/tango and allenai/catwalk.
        source_ids: [olmo3-paper, github-profile]
