sections:
  - heading: Career
    paragraphs:
      - text: >-
          Percy Liang's CV records a postdoctoral position at Google in 2011–2012, after a PhD in
          computer science from the University of California at Berkeley. Liang joined the Stanford
          faculty as an Assistant Professor in 2012 and became an Associate Professor in 2019; the
          current homepage lists the title Professor of Computer Science, with a courtesy appointment
          in Statistics.
        source_ids: [liang-cv, liang-site]
      - text: >-
          Stanford CRFM's people page lists Liang as the center's director. Together AI's leadership
          page lists Liang among the company's founders, alongside Vipul Ved Prakash, Ce Zhang, Chris Ré
          and Tri Dao.
        source_ids: [crfm-people, together-about]
  - heading: Research
    paragraphs:
      - text: >-
          Liang's homepage describes an interest in basic questions about learning and intelligence,
          and a commitment to efficient and reproducible research. Liang created CodaLab Worksheets, a
          platform that records the full provenance of an experiment from raw data to final results,
          and later created Marin, which practices "open development" by preregistering experiments and
          publishing them as they run.
        source_ids: [liang-site, marin-readme]
      - text: >-
          Liang is a co-author of the 2016 SQuAD paper, which introduced the Stanford Question
          Answering Dataset for reading comprehension, and of the 2021 report On the Opportunities and
          Risks of Foundation Models. Liang is first author of the 2022 HELM paper, which set out a
          taxonomy of scenarios and metrics for evaluating language models more transparently; the HELM
          framework is maintained as open source by Stanford CRFM.
        source_ids: [squad-paper, foundation-models-report, helm-paper, helm-readme]
  - heading: Teaching
    paragraphs:
      - text: >-
          Liang's homepage lists courses including CS336 (Language Models from Scratch), CS324 (Advances
          in Foundation Models) and CS221 (Artificial Intelligence). The Spring 2026 CS336 site lists
          Liang and Tatsunori Hashimoto as the course's instructors.
        source_ids: [liang-site, cs336]
