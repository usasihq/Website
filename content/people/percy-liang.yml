headline: Stanford professor and director of CRFM; creator of Marin, first author of HELM, Together AI founder
bio:
  text: >-
    Percy Liang is a Professor of Computer Science (and, by courtesy, Statistics) at Stanford
    University and the director of Stanford's Center for Research on Foundation Models (CRFM).
    Liang created Marin, an effort to build models through open development in which experiments,
    successful and failed, are recorded publicly, and co-teaches CS336, Language Modeling from
    Scratch, with Tatsunori Hashimoto. Liang is first author of the HELM paper on holistic evaluation
    of language models, and Together AI's leadership page lists Liang as a founder.
