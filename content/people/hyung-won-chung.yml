headline: Researcher on reasoning and agents, formerly at Google Brain; first author of the Flan-T5 scaling paper
bio:
  text: >-
    Hyung Won Chung's homepage describes research on reasoning and agents at OpenAI, including
    Foundational Contributor credits on o1-preview, o1, and Deep Research and leading Codex mini model
    training. Before OpenAI, Chung was at Google Brain, building the JAX-based large-scale training
    system T5X, training large models such as PaLM, and working on instruction fine-tuning for the
    Flan-PaLM and Flan-T5 model families. Chung is first author of Scaling Instruction-Finetuned
    Language Models, which publicly released Flan-T5 checkpoints; the Flan-T5 XXL model card on
    Hugging Face lists the Apache 2.0 license.
