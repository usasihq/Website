sections:
  - heading: Google Brain
    paragraphs:
      - text: >-
          Before OpenAI, Hyung Won Chung was at Google Brain, where Chung's homepage describes
          working on the bottlenecks to further scaling. Chung was the second-listed author of the 2022 paper
          describing t5x and seqio, the JAX-based libraries for training large models and handling
          data, and an author of "PaLM: Scaling Language Modeling with Pathways" (2022).
        source_ids: [chung-site, t5x-paper, palm-paper]
      - text: >-
          Chung is the first author of "Scaling Instruction-Finetuned Language Models" (2022), which
          studied instruction fine-tuning across model sizes and task counts, produced the Flan-PaLM
          and Flan-T5 model families, and released Flan-T5 checkpoints publicly; the Flan-T5 XXL model
          card lists the Apache 2.0 license. The paper later appeared in the Journal of Machine
          Learning Research in 2024.
        source_ids: [flan-paper, flant5-card, chung-site]
  - heading: OpenAI
    paragraphs:
      - text: >-
          At OpenAI, Chung's research has focused on reasoning and agents. Chung's homepage lists
          Foundational Contributor credits on o1-preview (September 2024), o1 (December 2024) and Deep
          Research (February 2025), and says Chung led model training for Codex mini as part of work
          on coding agents.
        source_ids: [chung-site]
      - text: >-
          Chung co-authored OpenAI's SimpleQA benchmark paper on measuring short-form factuality
          (2024) and BrowseComp (2025), a benchmark for web-browsing agents.
        source_ids: [simpleqa-paper, browsecomp-paper]
