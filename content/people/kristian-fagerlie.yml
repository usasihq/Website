sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Kristian Fagerlie's All About AI YouTube channel, which YouTube lists as joined in February
          2021, describes its aim as helping people use generative AI for creative and everyday tasks. Fagerlie has
          published on AI tooling since 2022, covering image models such as Midjourney and Stable
          Diffusion, prompt-engineering methods such as Chain of Thought and Tree of Thoughts, and
          multimodal experiments.
        source_ids: [channel, about]
      - text: >-
          More recent videos and posts focus on Claude Code workflows, including skills, headless
          agents, and parallel sub-agents, and on long-running autonomous agents. The All About AI
          blog was rebuilt in 2026 as a static site, and its editorial principles say that each post
          describes something Fagerlie has built and tested, with sponsors named in the resources
          section.
        source_ids: [about, site]
  - heading: Open-source work
    paragraphs:
      - text: >-
          In April 2026, Fagerlie introduced Surfagent, a weekend project for letting AI agents act on
          the web through a live Chrome session, so they inherit the user's existing sign-ins rather
          than needing separate API access. Fagerlie notes that it is not headless and needs a real
          Chrome window, and the repository is released under the MIT license.
        source_ids: [surfagent-post, surfagent-repo]
