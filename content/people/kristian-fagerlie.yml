headline: Creator of the All About AI YouTube channel and blog on AI agents and Claude Code workflows
bio:
  text: >-
    Kristian Fagerlie runs All About AI, a YouTube channel and blog of hands-on experiments with
    autonomous AI agents, Claude Code workflows, browser automation, and prompt engineering. The blog
    groups its articles into guides on agentic AI trading, Claude Code, autonomous agents, and AI
    browser automation. The about page states Kristian has published on AI tooling since 2022 and
    builds the open-source browser automation tool Surfagent.
