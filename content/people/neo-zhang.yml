headline: Code owner for llama.cpp's SYCL backend, which is designed primarily for Intel GPUs
bio:
  text: >-
    Neo Zhang, who publishes on GitHub as arthw, is the code owner for llama.cpp's SYCL backend,
    according to the project's CODEOWNERS file. The backend's documentation says it is designed
    primarily for Intel GPUs and lists supported Intel GPUs from integrated graphics to Arc and
    data center cards. Zhang's 2026 commits
    add operators, data types and FlashAttention support to the backend, improve its memory
    handling, and fix issues on specific Intel GPUs.
  source_ids: [github-profile, llama-cpp-codeowners, sycl-doc, llama-cpp-commits]
  reviewed_at: 2026-10-13
