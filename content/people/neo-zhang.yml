    contribution: >-
      CODEOWNERS lists arthw as the ggml-org/ggml-sycl team, which owns ggml/src/ggml-sycl.
      Commits authored from July to October 2026 add sparse FlashAttention, more operators and
      quantized types, host-pinned and peer-to-peer memory support, and fixes for specific Intel
      GPUs, and update the backend's setup guide. The repository is MIT-licensed.
