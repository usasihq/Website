headline: AI researcher at Meta; co-first author of Molmo and first author of ProcTHOR and Objaverse
bio:
  text: >-
    Matt Deitke is an AI researcher at Meta, where Deitke leads a data pod. Deitke was
    previously a research scientist at the Allen Institute for AI (Ai2) while studying at the University
    of Washington's Allen School, and is co-first author of the Molmo and PixMo paper on open
    vision-language models. Deitke is also first author of ProcTHOR, on procedurally generated
    environments for embodied AI, and of the Objaverse dataset of annotated 3D objects.
  source_ids: [deitke-site, molmo-paper, procthor-paper, objaverse-paper]
  reviewed_at: 2026-10-22
