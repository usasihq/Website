sections:
  - heading: Career
    paragraphs:
      - text: >-
          Deitke worked as a research scientist at Ai2 while completing undergraduate and doctoral studies at
          the University of Washington's Allen School, where Deitke's PhD work was with Ali Farhadi. Deitke
          later co-founded Vercept, a company building computer-use agents, and is now an AI researcher at
          Meta, leading a data pod.
        source_ids: [deitke-site]
  - heading: Research
    paragraphs:
      - text: >-
          Deitke's work at Ai2 included ProcTHOR (2022), which used procedural generation to scale the
          diversity of simulated environments for embodied AI, and Objaverse (2022), a dataset of annotated 3D
          objects. Deitke's site notes that ProcTHOR received an Outstanding Paper Award at NeurIPS 2022.
        source_ids: [procthor-paper, objaverse-paper, deitke-site]
      - text: >-
          With Christopher Clark, Deitke is co-first author of the Molmo and PixMo paper (2024), which released open
          vision-language models together with new caption, question-answer and pointing datasets
          collected without the use of external vision-language models; the paper received a CVPR 2025 Best Paper Honorable
          Mention.
        source_ids: [molmo-paper, deitke-site]
