headline: CEO of Boston Dynamics since October 2026; previously head scientist for Alexa and AGI at Amazon
bio:
  text: >-
    Rohit Prasad became Chief Executive Officer of Boston Dynamics on October 7, 2026, where the
    company says Prasad will drive its strategy of combining robotics with AI. Prasad spent 12
    years at Amazon, joining in 2013 during the early days of Alexa, and most recently served as
    Senior Vice President and Head Scientist for Alexa and Artificial General Intelligence. In Prasad's last two years there,
    Prasad led the creation of the Amazon Nova foundation models and Amazon's AGI organization;
    Amazon announced in December 2025 that Prasad would leave the company at the end of that
    year. Before Amazon, Prasad spent nearly 14 years at Raytheon BBN Technologies working on
    machine-learning research.
  source_ids: [bd-ceo-2026, aa-desantis-2025]
  reviewed_at: 2026-10-13
