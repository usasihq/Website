links: []
sections:
  - heading: Career
    paragraphs:
      - text: >-
          Rohit Prasad spent nearly 14 years at Raytheon BBN Technologies, leading machine-learning
          research and its application for U.S. government and commercial use. Prasad then joined
          Amazon in 2013, in the early days of Alexa, to help build a conversational AI service.
        source_ids: [bd-ceo-2026, aa-desantis-2025]
      - text: >-
          At Amazon, Prasad rose to Senior Vice President and Head Scientist for Alexa and Artificial
          General Intelligence. Amazon announced in December 2025 that Prasad would leave at the end
          of that year, and in October 2026 Boston Dynamics appointed Prasad as Chief Executive
          Officer, with Prasad also expected to join its board subject to approval.
        source_ids: [bd-ceo-2026, aa-desantis-2025]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Prasad helped grow Alexa from an early idea into a large consumer AI service. In Prasad's
          last two years at Amazon, Prasad led the creation of the Amazon Nova family of foundation
          models, which Amazon introduced at AWS re:Invent in December 2024 for use through Amazon
          Bedrock.
        source_ids: [aa-desantis-2025, bd-ceo-2026, nova-launch]
      - text: >-
          At Boston Dynamics, Prasad is charged with the company's Physical AI strategy, which
          combines its robotics work with advanced AI to bring intelligent machines into industrial,
          enterprise, and other real-world settings.
        source_ids: [bd-ceo-2026]
