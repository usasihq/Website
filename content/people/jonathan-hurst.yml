sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hurst has been on the Oregon State University faculty since 2008. Agility Robotics was founded in 2015 out of the Dynamic Robotics Lab at
          Oregon State, and Hurst is listed among its co-founders.
        source_ids: [agility-about, osu-profile]
      - text: >-
          Agility's leadership page lists Hurst as Chief Robot Officer, with a current focus on
          physical AI for locomotion and manipulation applied to Digit in logistics warehouses. At
          Oregon State, Hurst is a Professor of Robotics in Mechanical, Industrial, and Manufacturing
          Engineering and a co-founder of the Robotics Institute.
        source_ids: [agility-about, osu-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Hurst's university research looks at the science and engineering of legged locomotion,
          from numerical studies and animal data to theoretical models and physical robots for
          walking and running. More recent work merges machine learning with traditional control to
          produce highly dynamic gaits.
        source_ids: [osu-profile]
      - text: >-
          With co-authors, Hurst wrote papers on learning
          bipedal gaits through periodic reward composition and on blind stair traversal, both using
          reinforcement learning trained in simulation and transferred to a real biped.
        source_ids: [gaits-paper, stairs-paper]
