headline: Co-founder and Chief Robot Officer of Agility Robotics; Oregon State University professor of robotics
bio:
  text: >-
    Jonathan Hurst is a co-founder and the Chief Robot Officer of Agility Robotics, which builds the
    Digit humanoid robot, and a Professor of Robotics at Oregon State University, where Hurst
    co-founded the university's Robotics Institute. Hurst's research studies legged locomotion,
    combining hardware design with machine learning and traditional control.
  source_ids: [agility-about, osu-profile]
  reviewed_at: 2026-10-21
