slug: andriy-mulyar
name: Andriy Mulyar
initials: AM
headline: CEO of Nomic and co-author of the GPT4All and Nomic Embed technical reports
bio:
  text: >-
    Andriy Mulyar is the CEO of Nomic, which now focuses on domain-specific AI models and agents for
    the design and construction industries. Mulyar is a co-author of the technical report for
    GPT4All, Nomic's open-source application for running large language models privately on everyday
    desktops and laptops. The Nomic Embed technical report credits Mulyar with setting the project's
    early direction, reviewing code implementations, and contributing to model design and dataset
    curation.
  source_ids: [nomic-platform-post, nomic-funding-post, github-profile, gpt4all-paper, gpt4all-repo, nomic-embed-report]
  reviewed_at: 2026-10-01
