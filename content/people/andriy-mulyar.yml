sections:
  - heading: Research
    paragraphs:
      - text: >-
          Andriy Mulyar's earlier research includes MT-Clinical BERT (2020), written with Bridget T.
          McInnes, which uses multitask learning to scale clinical information extraction. At Nomic,
          Mulyar co-authored the GPT4All technical report (2023), describing an ecosystem of open-source
          compressed language models built with the GPT4All community.
        source_ids: [mt-clinical-bert, gpt4all-paper, gpt4all-repo]
      - text: >-
          Mulyar is also a co-author of Nomic's embedding papers: Nomic Embed (February 2024), a
          reproducible long-context text embedder for which Mulyar set early project direction, and Nomic
          Embed Vision (June 2024), which extends the embedding space to images.
        source_ids: [nomic-embed-arxiv, nomic-embed-report, nomic-embed-vision]
  - heading: Products and projects
    paragraphs:
      - text: >-
          As CEO, Mulyar wrote the November 2025 announcement of a new Nomic Platform, which applies
          domain-specific models and agentic workflows to drawing sets, specifications and project data
          in architecture, engineering and construction. A September 2026 Nomic post signed by Mulyar
          announced partnerships with the engineering firms Aurecon and Arcadis.
        source_ids: [nomic-platform-post, nomic-funding-post]
