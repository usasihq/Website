headline: Co-founder and CEO of Sakana AI; former Google research scientist and co-author of World Models
bio:
  text: >-
    David Ha is the co-founder and CEO of Sakana AI, which Ha founded in 2023 with Llion Jones and
    Ren Ito and whose work includes The AI Scientist and the Darwin Gödel Machine. Ha was previously
    a research scientist at Google, where Ha led a Google Brain research team, and
    Ha's research focuses on complex self-organizing systems and the self-evolution of AI. Ha
    co-authored "World Models" (2018) with Jürgen Schmidhuber, wrote the sketch-rnn paper with
    Douglas Eck, and is a co-author of "The AI Scientist" (2024).
  source_ids: [sakana-company, worldmodels-paper, sketchrnn-paper, aiscientist-paper]
  reviewed_at: 2026-10-21
