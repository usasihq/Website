sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before working in machine learning, David Ha was a derivatives trader at Goldman Sachs, where Ha
          became a Managing Director and head of interest rates trading, according to Sakana AI's
          leadership page. Ha then joined Google as a research scientist and led a Google Brain research
          team.
        source_ids: [sakana-company]
      - text: >-
          In 2023 Ha co-founded Sakana AI with Llion Jones, now its CTO, and Ren Ito, its chairman, and
          serves as CEO. Sakana AI's page lists its work as including The AI Scientist, multi-agent
          orchestration foundation models, the Namazu language models and the Darwin Gödel Machine.
        source_ids: [sakana-company]
  - heading: Research
    paragraphs:
      - text: >-
          Ha's research centres on complex self-organizing systems and the self-evolution of AI. Ha wrote
          HyperNetworks (2016) with Andrew Dai and Quoc V. Le, in which one network generates the
          weights of another; sketch-rnn (2017) with Douglas Eck, a recurrent network that constructs
          stroke-based drawings; and World Models (2018) with Jürgen Schmidhuber, in which an agent learns inside a
          generative model of its environment.
        source_ids: [sakana-company, hypernetworks-paper, sketchrnn-paper, worldmodels-paper]
      - text: >-
          With Yujin Tang, Ha wrote a 2021 survey of collective intelligence for deep learning. At Sakana
          AI, Ha co-authored the 2024 paper on evolutionary optimization of model merging recipes and The
          AI Scientist (2024), a framework in which language models generate ideas, run experiments and
          write papers.
        source_ids: [collective-intelligence-paper, model-merging-paper, aiscientist-paper]
