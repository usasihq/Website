sections:
  - heading: Career
    paragraphs:
      - text: >-
          Liang began a career at Hewlett-Packard and later led large processor engineering teams
          at Sun Microsystems and Oracle, where those teams built high-performance processors for
          enterprise systems.
        source_ids: [sn-team]
      - text: >-
          SambaNova grew out of the work of Stanford professors Kunle Olukotun and Christopher Ré,
          and the company describes Liang as the semiconductor executive who completed its
          founding team, bringing experience moving chips into production data centers. The
          company was founded in 2017.
        source_ids: [sn-about]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Under Liang, SambaNova's product line spans SambaCloud, SambaStack and SambaRack, built
          on the company's own AI chips. SambaNova describes its approach as rethinking AI
          infrastructure from the silicon up as models grew larger.
        source_ids: [sn-sambacloud, sn-about]
