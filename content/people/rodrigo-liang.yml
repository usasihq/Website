headline: Co-founder and CEO of SambaNova; former processor engineering leader at Sun Microsystems and Oracle
bio:
  text: >-
    Rodrigo Liang is a co-founder and the CEO of SambaNova, which builds chips, systems and cloud
    services for running AI models. Liang has more than two decades of semiconductor engineering
    experience and previously led processor teams at Sun Microsystems and Oracle that built
    high-performance processors for enterprise systems.
