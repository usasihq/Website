    contribution: >-
      First author of "Hierarchical Text-Conditional Image Generation with CLIP Latents" (2022); the
      homepage describes co-creating DALL·E 2 with inpainting, variations and blending.
    source_ids: [dalle2-paper, ramesh-site]
