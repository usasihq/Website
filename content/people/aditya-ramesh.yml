  - name: DALL·E
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2102.12092
    contribution: >-
      First author of "Zero-Shot Text-to-Image Generation" (2021), which models text and image tokens
      as a single stream with a transformer; Ramesh's homepage describes creating this first DALL·E
      model.
    source_ids: [dalle-paper, ramesh-site]
  - name: DALL·E 2
