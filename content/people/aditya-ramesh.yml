sections:
  - heading: Research
    paragraphs:
      - text: >-
          Aditya Ramesh is first author, with colleagues including Mikhail Pavlov, Gabriel Goh, Scott Gray,
          Alec Radford, Mark Chen and Ilya Sutskever, of "Zero-Shot Text-to-Image Generation" (2021), the
          paper behind the first DALL·E model, which treats text and image tokens as a single stream for a
          transformer. Ramesh also co-authored CLIP (2021), which learns visual models from natural language
          supervision.
        source_ids: [dalle-paper, clip-paper, ramesh-site]
      - text: >-
          Ramesh's 2022 paper with Prafulla Dhariwal, Alex Nichol, Casey Chu and Mark Chen, "Hierarchical
          Text-Conditional Image Generation with CLIP Latents", describes DALL·E 2. Ramesh is also a
          co-author of "Improving Image Generation with Better Captions", the DALL·E 3 paper, which reports
          that training on highly descriptive generated captions improves how well text-to-image models
          follow prompts.
        source_ids: [dalle2-paper, dalle3-paper]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Ramesh's homepage describes leading the team that created DALL·E 3 and deployed it in ChatGPT in
          September 2023, building the team behind the Sora model and the sora.com product in
          December 2024, and working on controllability and language grounding for Sora 2, released in
          the Sora app in October 2025. Ramesh now leads Worldsim as a VP of Research and is helping start
          a robotics effort that applies OpenAI's video generation models to the physical world.
        source_ids: [ramesh-site]
