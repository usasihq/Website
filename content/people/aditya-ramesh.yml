headline: VP of Research at OpenAI who leads Worldsim; first author of DALL·E and DALL·E 2, co-author of CLIP
bio:
  text: >-
    Aditya Ramesh leads Worldsim as a VP of Research at OpenAI and, according to Ramesh's homepage, is
    working on a new robotics effort that brings video-generation models to the physical world. Ramesh
    is first author of the papers behind DALL·E (2021) and DALL·E 2 (2022), led the team that created
    DALL·E 3, built the team that created the first Sora model, and worked on controllability and
    language grounding for Sora 2. Ramesh is also a co-author of the CLIP paper, written with an OpenAI
    affiliation.
  source_ids: [ramesh-site, dalle-paper, dalle2-paper, clip-paper]
  reviewed_at: 2026-10-13
