headline: YouTube creator making tech videos, formerly a senior video producer at The Verge
bio:
  text: >-
    Becca Farsace makes technology videos on a YouTube channel that describes itself as "taking tech
    outside". Becca Farsace was previously a senior video producer at The Verge, where the author
    page lists videos and stories on cameras, gadgets, and the creator economy, including the video
    series Full Frame: Creators.
  source_ids: [youtube, verge]
  reviewed_at: 2026-10-21
