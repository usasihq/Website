sections:
  - heading: Work at The Verge
    paragraphs:
      - text: >-
          Becca Farsace's author archive at The Verge runs from November 2018, when Farsace published a
          guide to choosing a camera, through 2024, and lists Farsace as a former senior video producer.
          Early videos include "How The Verge makes video reviews" (2018) and reviews of action cameras,
          gimbals and earbuds from DJI, GoPro, Insta360 and Samsung.
        source_ids: [verge-archive-early, verge]
      - text: >-
          In 2024 Farsace's Verge work included camera coverage from Nikon, Panasonic, Fujifilm and Ricoh
          and the video series Full Frame: Creators, in which Farsace spends a day with an online creator to
          see how they found success on the internet.
        source_ids: [verge]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Farsace's YouTube channel, which joined YouTube in January 2021 and describes itself as "taking
          tech outside", publishes reviews and essays on phones, cameras, earbuds and electric vehicles.
          Uploads in 2026 include camera reviews of the iPhone 18 Pro and Pixel 11 Pro and a video on the
          Rivian R2.
        source_ids: [youtube, youtube-feed]
