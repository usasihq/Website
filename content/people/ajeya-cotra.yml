headline: METR technical staff working on threat modeling and risk assessment; lead of METR's 2026 Frontier Risk Report
bio:
  text: >-
    Ajeya Cotra is on the technical staff at METR, where Cotra works on threat modeling and risk
    assessment for loss-of-control risks from advanced AI. Cotra was the report lead for METR's
    Frontier Risk Report covering February to March 2026, a pilot assessment of misalignment risks
    from AI agents used inside frontier AI developers, carried out with participation from
    Anthropic, Google, Meta, and OpenAI. Before METR, Cotra held several roles at Coefficient Giving,
    including heading its technical AI safety program in 2024.
