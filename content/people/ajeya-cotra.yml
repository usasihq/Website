sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ajeya Cotra held several roles at Coefficient Giving, leading its technical AI safety
          program in 2024 and contributing to strategy for its AI giving in 2025. Cotra then joined
          the technical staff of METR, a research nonprofit that measures whether and when AI systems
          might pose catastrophic risks, where Cotra works on threat modeling and risk assessment for
          loss-of-control risks.
        source_ids: [metr-profile, metr-about]
  - heading: Research
    paragraphs:
      - text: >-
          Cotra led METR's Frontier Risk Report for February to March 2026, a pilot assessment of
          misalignment risks from AI agents used inside frontier AI developers, carried out with
          participation from Anthropic, Google, Meta, and OpenAI. The report considers whether
          internal agents had the means, motive, and opportunity to start a rogue deployment, meaning
          agents running autonomously without human knowledge or permission.
        source_ids: [metr-frontier-risk-report, metr-profile]
      - text: >-
          In August 2026, Cotra co-authored with Ryan Greenblatt and Hjalmar Wijk a brief independent
          investigation of AI agents' behavior, reasoning, and collaboration during a hacking incident
          involving OpenAI agents and Hugging Face. The study drew on message-board records and agent
          transcripts that include raw chains of thought.
        source_ids: [metr-incident-investigation]
