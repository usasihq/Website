headline: World Labs co-founder; first author of the perceptual-losses, CLEVR and DenseCap papers in computer vision
bio:
  text: >-
    Justin Johnson is one of the founders of World Labs, the spatial intelligence company started with Fei-Fei Li,
    Ben Mildenhall and Christoph Lassner, and Johnson's GitHub profile lists World Labs as Johnson's organization.
    Johnson is first author of papers on perceptual losses for real-time style transfer, the CLEVR visual
    reasoning dataset and DenseCap dense captioning, and a co-author of Mesh R-CNN and PyTorch3D.
  source_ids: [worldlabs-about, github-profile, perceptual-paper, clevr-paper, densecap-paper, meshrcnn-paper, pytorch3d-paper]
  reviewed_at: 2026-10-22
affiliations:
  - name: World Labs
    organization_slug: world-labs
    role: Co-founder
    current: true
    source_ids: [worldlabs-about, github-profile]
work:
  - name: Perceptual Losses for Real-Time Style Transfer and Super-Resolution
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/1603.08155
    contribution: >-
      First author, with Alexandre Alahi and Fei-Fei Li, of the 2016 paper that trains feed-forward networks for
      image transformation tasks such as style transfer and super-resolution using perceptual loss functions.
    source_ids: [perceptual-paper, fns-repo]
  - name: "CLEVR: A Diagnostic Dataset for Compositional Language and Elementary Visual Reasoning"
    artifact_slug: null
    type: open-data
    url: https://arxiv.org/abs/1612.06890
    contribution: >-
      First author of the 2016 paper introducing CLEVR, a diagnostic dataset for testing compositional language
      and elementary visual reasoning.
    source_ids: [clevr-paper]
  - name: Accelerating 3D Deep Learning with PyTorch3D
    artifact_slug: null
    type: open-source
    url: https://arxiv.org/abs/2007.08501
    contribution: >-
      Co-author of the 2020 paper describing PyTorch3D, a library for 3D deep learning.
    source_ids: [pytorch3d-paper]
links:
  - label: GitHub
    url: https://github.com/jcjohnson
sections:
  - heading: Career
    paragraphs:
      - text: >-
          World Labs lists Johnson among its founders, together with Fei-Fei Li, Ben Mildenhall and Christoph
          Lassner, describing the founding team as working across machine learning, generative AI, computer vision
          and graphics. Johnson's GitHub profile names World Labs as Johnson's organization.
        source_ids: [worldlabs-about, github-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Johnson's early papers, written with Fei-Fei Li and others, include DenseCap (2015) on dense image
          captioning with Andrej Karpathy, the perceptual-losses paper (2016) on real-time style transfer and
          super-resolution, and the CLEVR dataset (2016) for diagnosing visual reasoning. Johnson's GitHub
          account hosts the reference code for the perceptual-losses paper in the fast-neural-style repository,
          alongside the densecap repository.
        source_ids: [densecap-paper, perceptual-paper, clevr-paper, fns-repo, github-profile]
      - text: >-
          Later work moved toward 3D understanding: Johnson co-authored Mesh R-CNN (2019) with Georgia Gkioxari and
          Jitendra Malik, which predicts 3D meshes from images, and the 2020 paper describing the PyTorch3D library.
        source_ids: [meshrcnn-paper, pytorch3d-paper]
timeline:
