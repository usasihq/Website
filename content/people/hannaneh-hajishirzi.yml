headline: Torode Family Professor at the University of Washington; co-led Ai2's OLMo and Tülu open models
bio:
  text: >-
    Hannaneh (Hanna) Hajishirzi is the Torode Family Professor in the Paul G. Allen School of
    Computer Science & Engineering at the University of Washington, where Hajishirzi leads the
    H2Lab. Hajishirzi is also a Senior Director at Ai2, co-leading the OLMo and Tülu
    projects. Hajishirzi's research covers large language models, reasoning and agents, open models
    and data, the science of AI and evaluation, and AI for science.
    Hajishirzi is the last-listed author of the OLMo and Tülu 3 papers and a co-author of Dolma, and
    the OLMoE paper credits Hajishirzi with direction and advising of the overall effort.
  source_ids: [hajishirzi-site, uw-profile, olmo-paper, dolma-paper, tulu3-paper, olmoe-pdf]
  reviewed_at: 2026-10-21
