sections:
  - heading: Career
    paragraphs:
      - text: >-
          The Allen School's faculty page records that Hajishirzi earned a PhD in computer science at the
          University of Illinois at Urbana-Champaign and then spent a year as a postdoctoral associate at Disney
          Research and Carnegie Mellon University. At the University of Washington, Hajishirzi holds the Torode
          Family professorship in Computer Science & Engineering, with adjunct appointments in Electrical &
          Computer Engineering and Linguistics, and leads the H2Lab.
        source_ids: [uw-profile]
      - text: >-
          Hajishirzi's homepage presents a concurrent role as Senior Director at Ai2, where Hajishirzi co-leads the
          OLMo and Tülu projects on fully open language and reasoning models. The team spans research scientists,
          engineers and young investigators at Ai2 alongside students and postdocs at H2Lab.
        source_ids: [hajishirzi-site]
  - heading: Research
    paragraphs:
      - text: >-
          Hajishirzi's research covers large language models, reasoning and agents, open AI initiatives, the
          science of AI and evaluation, and AI for science. Earlier work in machine reading includes
          Bidirectional Attention Flow (BiDAF), a question-answering model published at ICLR 2017 with Minjoon Seo,
          Aniruddha Kembhavi and Ali Farhadi.
        source_ids: [hajishirzi-site, bidaf-paper]
      - text: >-
          With students and collaborators, Hajishirzi co-authored Self-Instruct (ACL 2023), which aligns language
          models using instructions they generate themselves, and Self-RAG (2023), which trains a model to decide
          when to retrieve passages and to critique its own output.
        source_ids: [self-instruct-paper, self-rag-paper]
  - heading: Open models and data
    paragraphs:
      - text: >-
          At Ai2, Hajishirzi is a co-author of the Dolma pretraining corpus paper (accepted at ACL 2024) and the
          last-listed author of the 2024 OLMo paper, which released an open language model with its training
          data and code. The OLMoE paper (2024) credits Hajishirzi with direction and advising of the overall
          effort, and Hajishirzi is also an author of "2 OLMo 2 Furious" (2024) and the Tülu 3 post-training
          report (2024).
        source_ids: [dolma-paper, olmo-paper, olmoe-pdf, olmo2-paper, tulu3-paper]
