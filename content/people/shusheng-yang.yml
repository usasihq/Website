sections:
  - heading: Early research
    paragraphs:
      - text: >-
          Yang's earlier papers were on video and object-level vision with transformers. As first or co-first
          author, Yang worked on video instance segmentation, including "Crossover Learning for Fast Online Video Instance Segmentation" and "Instances as Queries"
          (ICCV 2021) and the Temporally Efficient Vision Transformer (CVPR 2022 oral), and on masked image
          modeling, including "Masked Visual Reconstruction in Language Semantic Space" (CVPR 2023) and work on
          plain vision transformers for object detection (ICCV 2023).
        source_ids: [homepage]
  - heading: Multimodal models and spatial intelligence
    paragraphs:
      - text: >-
          Yang was a co-first author of the 2023 Qwen-VL technical report, which introduced the Qwen-VL and
          Qwen-VL-Chat vision-language models. Since starting a PhD at NYU Courant in September 2024, advised by
          Saining Xie, Yang has focused on spatial intelligence and long-context video. Yang co-authored the
          open Cambrian-1 multimodal models (NeurIPS 2024 oral), was co-first author of Thinking in Space (CVPR
          2025 oral), which introduced the VSI-Bench benchmark, and was first author of Cambrian-S (ICLR 2026),
          on spatial supersensing in video.
        source_ids: [qwenvl-paper, homepage, cambrian1-paper, tis-paper, cambrian-s-paper]
      - text: >-
          Other recent co-authored papers include VideoNSA (ICLR 2026), which applies native sparse attention to
          video understanding, and a COLM 2026 paper arguing that benchmark designers should train on their own
          test sets to expose shortcuts that do not require vision.
        source_ids: [homepage]
