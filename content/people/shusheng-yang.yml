headline: NYU Courant PhD student; first author of Cambrian-S and co-first author of Thinking in Space and Qwen-VL
bio:
  text: >-
    Shusheng Yang is a PhD student at NYU Courant advised by Saining Xie, working where computer
    vision meets multimodal learning, with a focus on representation learning, world modeling,
    spatial intelligence and long-context modeling. Yang is first author of Cambrian-S (2025), which
    introduces the VSI-SUPER benchmark and the VSI-590K training data for spatial supersensing in
    video, and co-first author of Thinking in Space (CVPR 2025), which introduced the VSI-Bench
    visual-spatial benchmark. Yang also co-authored Cambrian-1, a vision-centric family of multimodal
    language models released with weights, code and data, and was a co-first author of the Qwen-VL
    technical report.
  source_ids: [homepage, cambrian-s-paper, tis-paper, cambrian1-paper, qwenvl-paper]
  reviewed_at: 2026-10-21
