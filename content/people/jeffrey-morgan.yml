headline: Works on Ollama, an open-source tool for running open models on your own machine
bio:
  text: >-
    Jeffrey Morgan works on Ollama, an open-source tool for running open models on your own
    machine; Morgan's GitHub profile says Morgan is building Ollama and was previously at Docker,
    Twitter and Google. Morgan writes code for the project: the repository's commit history shows
    Morgan authoring recent changes to context-window handling, model support in its MLX engine and
    support for decision models.
  source_ids: [github-profile, ollama-repo, ollama-commits]
