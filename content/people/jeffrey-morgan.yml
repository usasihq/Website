sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Morgan made the initial commit to the Ollama repository on June 22, 2023, and has continued to write
          code for the project, which is released under the MIT license. Recent commits by Morgan update the
          bundled llama.cpp, add model support to the MLX engine, extend context-window handling and add support
          for decision models to the ollama run command.
        source_ids: [ollama-first-commit, ollama-repo, ollama-commits]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Ollama's official blog traces how the tool has grown: an official Docker image in October 2023,
          OpenAI-compatible endpoints in February 2024, tool calling in July 2024, a new desktop app in July 2025
          and, in March 2026, a preview of an MLX-powered engine on Apple Silicon.
        source_ids: [ollama-blog-docker, ollama-blog-openai, ollama-blog-tools, ollama-blog-app, ollama-blog-mlx]
