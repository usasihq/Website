headline: CEO of John Snow Labs and creator of the open-source Spark NLP library; formerly at Microsoft and Amazon
bio:
  text: >-
    David Talby is the chief executive officer of John Snow Labs, which helps healthcare and life
    science companies put AI to use, according to Talby's author page on the company's site. The
    same page credits Talby as the creator of Spark NLP, the company's Apache-2.0 natural language
    processing library, whose repository citation entry lists Veysel Kocaman and David Talby. The
    page also describes Talby's experience building and running web-scale software platforms and
    teams at startups, for Microsoft's Bing, and to scale Amazon's financial systems.
  source_ids: [jsl-author, spark-nlp-repo]
  reviewed_at: 2026-10-21
