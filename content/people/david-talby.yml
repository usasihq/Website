sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before leading John Snow Labs, Talby built and ran web-scale software platforms and teams at
          startups, for Microsoft's Bing, and to scale Amazon's financial systems. At John Snow Labs, Talby is chief executive officer, helping healthcare and life
          science companies put AI to good use.
        source_ids: [jsl-author]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Talby is credited as the creator of Spark NLP, an Apache-2.0 natural language processing library
          built on Apache Spark ML. The library's citation paper, "Spark NLP - Natural language understanding
          at scale", was written by Veysel Kocaman and Talby and published in the journal Software Impacts
          in 2021, after a 2021 arXiv preprint.
        source_ids: [jsl-author, spark-nlp-repo, spark-nlp-paper]
  - heading: Research
    paragraphs:
      - text: >-
          Talby's papers, mostly with John Snow Labs colleagues such as Veysel Kocaman, apply NLP to clinical
          and biomedical text. They include "Biomedical Named Entity Recognition at Scale" (CADL 2020), work
          on automated de-identification of large clinical text datasets presented at ML4H 2023, and a 2025
          study of whether zero-shot commercial APIs meet regulatory standards for clinical de-identification.
        source_ids: [biomedical-ner-paper, deid-paper, deid-api-paper]
      - text: >-
          Recent work turns to evaluating medical large language models, including a red-teaming framework
          for safety, robustness and fairness
          prepared for the Text2Story 2026 workshop. Talby also writes
          articles and benchmarks on the John Snow Labs blog, such as 2026 comparisons of clinical
          de-identification tools.
        source_ids: [red-team-paper, jsl-author]
