sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          The Lex Fridman Podcast began with a conversation with Max Tegmark, posted in August 2018
          as part of an MIT course on artificial general intelligence. The show's episode list has
          since included conversations on AI, robotics and programming with researchers and
          engineers, and episode 501, with DHH, was released in August 2026.
        source_ids: [ep-tegmark, ep-501, podcast-page]
      - text: >-
          Episodes are released as audio and as video on YouTube, where the channel describes itself
          as hosting the Lex Fridman Podcast and other videos. The podcast page also points listeners
          to a companion Lex Clips channel.
        source_ids: [podcast-page, youtube-channel]
  - heading: Research
    paragraphs:
      - text: >-
          Lex's research page centers on human-AI interaction and robotics, with much of the work on
          driving. Papers include the MIT Advanced Vehicle Technology study of driver behavior with
          automation, Arguing Machines, a framework for human supervision of black-box AI systems
          that make life-critical decisions, and studies of driver gaze, cognitive load and
          frustration.
        source_ids: [website, avt-paper, arguing-machines-paper]
      - text: >-
          DeepTraffic, released in 2018, is a traffic-navigation simulation used to teach deep
          reinforcement learning, with hyperparameter tuning crowdsourced from participants. Earlier
          papers, from 2006 onward, dealt with ad hoc wireless networks, cognitive radio and
          behavioral biometrics for authentication.
        source_ids: [deeptraffic-paper, website]
