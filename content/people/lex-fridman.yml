headline: Host of the Lex Fridman Podcast, long-form conversations including AI, robotics and programming
bio:
  text: >-
    Lex Fridman hosts the Lex Fridman Podcast, a conversation show whose topics include
    technology, AI, robotics, programming, engineering and the sciences, along with history,
    philosophy and other subjects. Episodes are published on YouTube and podcast platforms. Lex's
    website also lists research interests in human-AI interaction and robotics, with papers on
    driver behavior and AI-assisted driving, and DeepTraffic, a deep reinforcement learning
    traffic simulation.
