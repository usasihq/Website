    contribution: >-
      A collection owned by Teo's Hugging Face account of big-endian GGUF models, including IBM
      Granite and Qwen2.5 models, whose tokenizers were verified to run on IBM z15 and later
      systems; the s390x build guide points to it for pre-converted models.
    source_ids: [hf-collection, s390x-doc]
links:
  - label: GitHub
