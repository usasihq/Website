headline: IBM technology engineer and code owner for llama.cpp's zDNN backend for IBM Z and LinuxONE
bio:
  text: >-
    Aaron Teo is a Technology Engineer in IBM Client Engineering whose GitHub profile lists AI on
    IBM Z, inference engines, and IBM Z and LinuxONE as areas of work. llama.cpp's CODEOWNERS file
    lists Teo, as the ggml-zdnn team, among the owners of the zDNN backend, which enables llama.cpp
    on IBM z17 and later systems through IBM's zDNN acceleration library, and as a member of the CI
    team. Teo last updated the
    project's build guide for IBM Z and LinuxONE in September 2026, and Teo's commits add s390x CPU
    optimizations, zDNN operations and CI coverage. Teo also publishes a Hugging Face collection of
    big-endian GGUF models, including IBM Granite models, verified to run on IBM z15 and later
    systems.
  source_ids: [github-profile, llama-cpp-codeowners, zdnn-doc, s390x-doc, llama-cpp-commits, hf-collection]
  reviewed_at: 2026-10-21
