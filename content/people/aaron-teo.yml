work:
  - name: llama.cpp support for IBM Z and LinuxONE
    artifact_slug: llama-cpp
    type: open-source
    url: https://github.com/ggml-org/llama.cpp
    contribution: >-
      CODEOWNERS lists Teo as the ggml-org/ggml-zdnn team, which co-owns ggml/src/ggml-zdnn, and in
      ggml-org/ci. The s390x build
      guide credits Teo with its September 2026 update. Commits authored from July to October 2026
      add Q8_0 matrix multiplication and memory fixes to the zDNN backend, s390x vector and repack
      optimizations, CI coverage, and Granite parameter-count fixes. The repository is
      MIT-licensed.
    source_ids: [llama-cpp-codeowners, s390x-doc, llama-cpp-commits, llama-cpp-license]
  - name: s390x Verified Models (Hugging Face collection)
    artifact_slug: null
    type: open-weights
