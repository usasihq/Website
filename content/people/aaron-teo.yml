sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Aaron Teo's work on llama.cpp brings the inference engine to IBM Z and LinuxONE mainframes.
          Teo's first merged pull request, in February 2025, added support for the s390x SIMD
          instruction set to the ggml CPU backend, followed by changes such as big-endian model
          conversion and z17 compile detection.
        source_ids: [pr-s390x-simd, teo-merged-prs, llama-cpp-commits]
      - text: >-
          In August 2025 Teo's pull request introducing an initial IBM zDNN backend was merged. The
          backend uses IBM's zDNN library to run inference on the Neural Network Processor Assist
          accelerator in IBM Telum processors, and llama.cpp's CODEOWNERS file lists Teo, as the
          ggml-zdnn team, among its owners and as a member of the CI team.
        source_ids: [pr-zdnn, zdnn-doc, llama-cpp-codeowners]
      - text: >-
          Teo's recent commits, through October 2026, add operations to the zDNN backend such as flash
          attention and Q8_0 matrix multiplication, vectorize CPU activation functions, and update the
          zDNN and s390x build documentation. Teo also maintains a Hugging Face collection of
          big-endian GGUF models verified to run on IBM z15 and later systems.
        source_ids: [llama-cpp-commits, s390x-doc, hf-collection]
timeline:
