sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hsu earned S.M. and PhD degrees in electrical engineering and computer science at MIT in 2018 and
          2020, supervised by James Glass, before joining Facebook AI Research, now part of Meta AI. Meta's
          people page lists Hsu as a research scientist whose work centers on representation learning,
          self-supervised learning, and structured generative modeling for unimodal and multimodal speech.
        source_ids: [hsu-site, meta-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Hsu's 2021 HuBERT paper introduced self-supervised speech representation learning by predicting
          hidden cluster units for masked speech. Hsu co-authored related work that year on wav2vec-U for
          unsupervised speech recognition, and in 2022 on Audio-Visual HuBERT for audio-visual speech and on
          data2vec, a single self-supervised method applied to speech, vision, and language.
        source_ids: [hubert-paper, wav2vecu-paper, avhubert-paper, data2vec-paper, hsu-site]
      - text: >-
          Hsu's later work has moved toward speech and audio generation. Hsu is the last author of Voicebox
          (2023), a text-guided multilingual speech generation model, and of later Meta papers including
          Meta Audiobox Aesthetics (2025) on automatic quality assessment for speech, music, and sound. Hsu
          also co-authored SAM Audio: Segment Anything in Audio, published in December 2025.
        source_ids: [voicebox-paper, meta-profile]
