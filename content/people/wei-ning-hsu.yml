specialties: [speech-audio, multimodal, generative-media]
headline: Research scientist at Meta AI (formerly FAIR); first author of HuBERT
bio:
  text: >-
    Wei-Ning Hsu is a research scientist at Meta AI (formerly FAIR), working on representation
    learning, self-supervised learning, and generative modeling for speech, including multimodal
    speech. Hsu is first author of HuBERT, a self-supervised speech representation model that
    predicts hidden units for masked regions, and Hsu's homepage also highlights Audio-Visual HuBERT,
    data2vec, wav2vec-U, and textless speech-to-speech translation. Meta's people page lists Hsu as
    a co-author of more recent work such as SAM Audio: Segment Anything in Audio (2025).
  source_ids: [meta-profile, hsu-site, hubert-paper, data2vec-paper]
  reviewed_at: 2026-10-21
affiliations:
  - name: Meta AI (FAIR)
    organization_slug: meta
    role: Research Scientist
    current: true
    source_ids: [meta-profile, hsu-site, github-profile]
work:
  - name: HuBERT
    artifact_slug:
    type: open-research
    url: https://arxiv.org/abs/2106.07447
    contribution: >-
      First author of HuBERT: Self-Supervised Speech Representation Learning by Masked Prediction of
      Hidden Units (2021), which uses an offline clustering step to provide target labels for a
      BERT-like prediction loss over masked speech.
    source_ids: [hubert-paper, hsu-site]
  - name: data2vec
    artifact_slug:
    type: open-research
    url: https://arxiv.org/abs/2202.03555
    contribution: >-
      Co-author of data2vec (2022), a self-supervised learning framework that uses the same method
      for speech, vision, and language; the paper says models and code are available in the fairseq
      repository.
    source_ids: [data2vec-paper, data2vec-pdf, hsu-site]
  - name: Voicebox
    artifact_slug:
    type: open-research
    url: https://arxiv.org/abs/2306.15687
    contribution: >-
      Last author of the 2023 paper on Voicebox, a text-guided multilingual universal speech generation
      model, with first author Matthew Le and colleagues at Meta.
    source_ids: [voicebox-paper]
