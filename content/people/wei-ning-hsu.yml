headline: Research scientist at Meta AI (formerly FAIR); first author of HuBERT
bio:
  text: >-
    Wei-Ning Hsu is a research scientist at Meta AI (formerly FAIR), working on representation
    learning, self-supervised learning, and generative modeling for speech, including multimodal
    speech. Hsu is first author of HuBERT, a self-supervised speech representation model that
    predicts hidden units for masked regions, and Hsu's homepage also highlights Audio-Visual HuBERT,
    data2vec, wav2vec-U, and textless speech-to-speech translation. Meta's people page lists Hsu as
    a co-author of more recent work such as SAM Audio: Segment Anything in Audio (2025).
  source_ids: [meta-profile, hsu-site, hubert-paper, data2vec-paper]
  reviewed_at: 2026-10-13
