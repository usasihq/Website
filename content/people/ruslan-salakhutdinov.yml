sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ruslan Salakhutdinov received a PhD in machine learning from the University of Toronto in
          2009 and spent two years as a postdoctoral associate at MIT, in the Department of Brain and
          Cognitive Sciences and the Computer Science and AI Laboratory. From 2011 to 2016
          Salakhutdinov was an assistant professor in the Departments of Computer Science and
          Statistics at the University of Toronto.
        source_ids: [bio-page]
      - text: >-
          In February 2016 Salakhutdinov joined the Machine Learning Department at Carnegie Mellon
          University, where Salakhutdinov is now a UPMC Professor of Computer Science. Salakhutdinov is
          an action editor of the Journal of Machine Learning Research and has served on the senior
          program committees of conferences including NeurIPS and ICML. A September 2026 paper lists
          Salakhutdinov with Meta Superintelligence Labs.
        source_ids: [bio-page, homepage, meta-reasoning-paper]
  - heading: Research
    paragraphs:
      - text: >-
          Salakhutdinov's research aims to understand the computational and statistical principles
          needed to discover structure in large amounts of data, spanning deep learning, probabilistic
          graphical models and large-scale optimization. With Geoffrey Hinton, Salakhutdinov wrote
          "Deep Boltzmann Machines" (AISTATS 2009), and Salakhutdinov co-authored the 2014 JMLR paper
          on dropout.
        source_ids: [bio-page, homepage, dbm-paper, dropout-paper]
      - text: >-
          Later work includes "Show, Attend and Tell" (2015) on image captioning with visual
          attention, and the language models Transformer-XL and XLNet (both 2019), written with
          Zihang Dai, Zhilin Yang, Quoc Le and others. More recently Salakhutdinov co-authored
          VisualWebArena (2024), a benchmark for multimodal web agents, and "Thinking Before Thinking"
          (2026), on scaling agentic inference through meta-reasoning.
        source_ids: [show-attend-tell-paper, transformer-xl-paper, xlnet-paper, visualwebarena-paper, meta-reasoning-paper]
