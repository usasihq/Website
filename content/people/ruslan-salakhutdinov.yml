headline: UPMC Professor of Computer Science in Carnegie Mellon's Machine Learning Department; co-author of dropout
bio:
  text: >-
    Ruslan Salakhutdinov is a UPMC Professor of Computer Science in the Machine Learning Department at
    Carnegie Mellon University, which Salakhutdinov joined in February 2016 after serving as an assistant
    professor at the University of Toronto. Salakhutdinov's homepage lists research interests in deep
    learning, probabilistic graphical models, and large-scale optimization. Salakhutdinov co-authored the
    2014 JMLR paper introducing dropout, a training technique that randomly drops units during training to
    reduce overfitting, and more recently co-authored VisualWebArena, a benchmark for evaluating multimodal
    agents on realistic visual web tasks. Salakhutdinov is also listed with Meta Superintelligence Labs on a
    September 2026 paper about agentic meta-reasoning at inference time.
  source_ids: [homepage, bio-page, dropout-paper, visualwebarena-paper, meta-reasoning-paper]
  reviewed_at: 2026-10-13
