headline: Research scientist at DeepMind; first author of the SynthID Bio protein watermarking paper
bio:
  text: >-
    David Stutz is a research scientist at DeepMind. Stutz is first author of "Function-preserving
    watermarking of AI-generated proteins" (Nature, 2026), the paper behind Google DeepMind's
    open-source SynthID Bio tool, and was credited with key research and engineering contributions to the
    original SynthID image watermarking project. Stutz's research also covers conformal prediction,
    uncertainty under ambiguous ground truth, and medical applications of Gemini models.
  source_ids: [ds-github, sb-readme, synthid-launch, conformal-paper, ambiguous-gt-paper, medgemini-paper]
  reviewed_at: 2026-10-22
