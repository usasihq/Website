sections:
  - heading: Watermarking
    paragraphs:
      - text: >-
          Google DeepMind's 2023 announcement of SynthID lists Stutz among the people who made key
          research and engineering contributions to the image watermarking project, and Stutz is a
          co-author of the 2025 SynthID-Image paper. Stutz is first author of the 2026 Nature paper
          behind SynthID Bio, which watermarks AI-generated protein sequences.
        source_ids: [synthid-launch, synthid-image-paper, sb-readme]
  - heading: Research
    paragraphs:
      - text: >-
          Stutz's papers on uncertainty include "Learning Optimal Conformal Classifiers" (2021) and
          "Conformal prediction under ambiguous ground truth" (2023). Stutz is also a co-author of
          "Capabilities of Gemini Models in Medicine" (2024), on medical applications of Gemini models.
        source_ids: [conformal-paper, ambiguous-gt-paper, medgemini-paper]
