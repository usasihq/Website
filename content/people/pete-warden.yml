headline: CEO of Useful Sensors, founding member of the TensorFlow team, and co-author of TinyML and Moonshine
bio:
  text: >-
    Pete Warden's about page describes Warden as an engineer, CEO of Useful Sensors Inc, a founding
    member of the TensorFlow team, and author of TinyML. Warden is a co-author of the TensorFlow white paper and the
    2016 TensorFlow system paper, and co-wrote the TinyML book with Daniel Situnayake, which covers
    TensorFlow Lite for Microcontrollers and training models small enough for microcontrollers. Warden is
    also a co-author of the Moonshine speech recognition papers; the Moonshine repository says
    everything runs on-device and publishes its code and most models under the MIT License.
  source_ids: [warden-about, tf-whitepaper, tf-osdi-paper, tinyml-book, moonshine-paper, moonshine-v2-paper, moonshine-repo]
  reviewed_at: 2026-10-13
