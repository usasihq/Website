sections:
  - heading: Career
    paragraphs:
      - text: >-
          Pete Warden describes Warden's own work as that of an engineer, CEO of Useful Sensors Inc, a
          founding member of the TensorFlow team, and author of TinyML. Warden is a co-author of both the
          2016 TensorFlow white paper on large-scale machine learning across heterogeneous distributed
          systems and the 2016 TensorFlow system paper.
        source_ids: [warden-about, tf-whitepaper, tf-osdi-paper]
  - heading: Research and open-source work
    paragraphs:
      - text: >-
          In 2018 Warden published the Speech Commands dataset paper as sole author, describing a dataset
          for training and evaluating keyword-spotting models. With Useful Sensors colleagues, Warden
          co-authored the 2024 Moonshine paper on speech recognition for live transcription and voice
          commands and the 2026 Moonshine v2 paper on a streaming encoder for latency-critical speech
          applications.
        source_ids: [speech-commands-paper, moonshine-paper, moonshine-v2-paper]
      - text: >-
          The Moonshine repository says its models run entirely on-device and publishes the code and
          most models under the MIT License. In 2026 Warden's blog announced Moonshine Micro, aimed at
          low-cost embedded chips, and described porting Moonshine to JavaScript so it can run inside a
          web page.
        source_ids: [moonshine-repo, moonshine-micro-post, moonshine-js-post]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Warden co-wrote TinyML with Daniel Situnayake, a practical book on training models small enough
          for microcontrollers. Its projects include a speech recognizer, a camera that detects people
          and a gesture-controlled magic wand, built with TensorFlow Lite for Microcontrollers, and a
          series of screencasts working through the tutorial chapters is available on YouTube.
        source_ids: [tinyml-book]
