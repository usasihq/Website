headline: Researcher at Anthropic; first author of the Variational Autoencoder and Adam optimizer papers
bio:
  text: >-
    Diederik P. (Durk) Kingma has worked on research on large-scale machine learning at Anthropic since
    2024. From 2018 to 2024 Kingma was a Research Scientist at Google Brain and Google DeepMind, where
    Kingma led research projects on generative models for text, image, and video, and from 2015 to 2018 Kingma was
    part of OpenAI's founding team and a Research Scientist there who led the Algorithms team. Kingma is
    first author of "Auto-Encoding Variational Bayes", which introduced the Variational Autoencoder, and
    of "Adam: A Method for Stochastic Optimization" with Jimmy Ba; ICLR named the two papers the winners
    of its 2024 and 2025 Test of Time awards. Kingma's other work includes Glow, with Prafulla Dhariwal,
    and Variational Diffusion Models.
