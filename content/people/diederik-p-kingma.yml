sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kingma worked as a junior research scientist in Yann LeCun's lab at New York University in 2009 and
          2012, and from 2010 to 2012 was co-founder and technical lead of the company Advanza. From 2013 to
          2017 Kingma did a PhD at the University of Amsterdam advised by Max Welling, on deep learning and
          generative models, with the thesis "Variational Inference and Deep Learning: A New Synthesis", and
          spent the summers of 2014 and 2015 collaborating at DeepMind.
        source_ids: [kingma-site]
      - text: >-
          Kingma was part of OpenAI's founding team in 2015 and led its Algorithms team, which focused on basic
          research, until 2018. From 2018 to 2024 Kingma was a research scientist at Google Brain and then
          Google DeepMind, heading projects on generative models for text, images and video, and since 2024
          Kingma has worked on large-scale machine learning research at Anthropic.
        source_ids: [kingma-site]
  - heading: Research
    paragraphs:
      - text: >-
          Several of Kingma's papers date from the doctoral years. "Auto-Encoding Variational Bayes" (2013),
          with Max Welling, introduced the Variational Autoencoder and its reparameterization approach to
          training latent-variable models, and a 2014 paper applied deep generative models to semi-supervised
          learning. "Adam: A Method for Stochastic Optimization" (2014), with Jimmy Ba, introduced an optimizer
          based on adaptive estimates of lower-order moments of the gradient.
        source_ids: [vae-paper, semi-supervised-paper, adam-paper]
      - text: >-
          Later work developed flow-based and diffusion models. With Tim Salimans, Kingma wrote the weight
          normalization paper, and as first author introduced inverse autoregressive flow (2016) and Glow (2018),
          an invertible generative flow model. Kingma co-authored the score-based stochastic differential
          equation framework for generative modeling (2020), and as first author wrote "Variational Diffusion
          Models" (2021) and a 2023 paper relating common diffusion objectives to a weighted integral of
          evidence lower bounds.
        source_ids: [weight-norm-paper, iaf-paper, glow-paper, score-sde-paper, vdm-paper, diffusion-elbo-paper]
