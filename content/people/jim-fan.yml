sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jim Fan completed a PhD at the Stanford Vision Lab advised by Fei-Fei Li. During and before doctoral study, Fan
          held research internships at OpenAI, Baidu's Silicon Valley AI Lab, Mila, Google Cloud AI,
          and NVIDIA. At OpenAI in 2016, Fan worked on World of Bits, an agent that sees a web browser
          as pixels and acts through keyboard and mouse controls.
        source_ids: [homepage, nvidia-research-profile]
      - text: >-
          Fan is a Senior Research Scientist at NVIDIA and lead of its AI Agents Initiative. With Yuke
          Zhu, Fan leads NVIDIA's GEAR group, whose research agenda covers multimodal foundation
          models, general-purpose robots, foundation agents for games and simulation, and simulation
          and synthetic data.
        source_ids: [homepage, gear-page]
  - heading: Research
    paragraphs:
      - text: >-
          Much of Fan's early agent work used Minecraft as a testbed. MineDojo (2022) built a framework
          and internet-scale knowledge base for open-ended agents in the game, and Voyager (2023) is an
          agent powered by a large language model that keeps learning new skills in Minecraft through
          in-context lifelong learning.
        source_ids: [minedojo-paper, voyager-paper, homepage]
      - text: >-
          In robotics, VIMA (2022) is a transformer that takes multimodal prompts and outputs controls
          for a robot arm, with its code, models, dataset, and benchmark released openly. Eureka (2023)
          has a coding language model write reward functions that teach a five-finger robot hand
          dexterous tasks such as pen spinning.
        source_ids: [vima-paper, eureka-paper, homepage]
      - text: >-
          More recent GEAR work centers on humanoid robots. Fan is a co-author of the GR00T N1 paper,
          which describes an open foundation model for generalist humanoids, and of the Isaac Lab
          technical report on GPU-accelerated simulation for robot learning.
        source_ids: [gr00t-paper, isaaclab-paper, gear-page]
