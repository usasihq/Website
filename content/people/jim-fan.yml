headline: Co-leads NVIDIA's GEAR embodied-agents group; co-author of GR00T N1, Voyager and Eureka
bio:
  text: >-
    Linxi "Jim" Fan co-leads NVIDIA's Generalist Embodied Agent Research (GEAR) group with Yuke Zhu;
    the group builds foundation models for embodied agents in virtual and physical worlds and lists
    GR00T, Eureka and Voyager among its projects. Fan's homepage describes a mission of building
    generally capable agents across robotics, games and simulation, and lists Voyager, MineDojo,
    Eureka and VIMA among Fan's research highlights; NVIDIA's research profile notes that MineDojo
    received an Outstanding Paper Award at NeurIPS 2022. Fan is a co-author of the GR00T N1 paper,
    which presents NVIDIA's open foundation model for generalist humanoid robots, and of the
    Isaac Lab technical report. Fan's homepage also notes a 2016 research internship at OpenAI.
  source_ids: [gear-page, homepage, nvidia-research-profile, gr00t-paper, isaaclab-paper]
  reviewed_at: 2026-10-13
