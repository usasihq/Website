sections:
  - heading: Research
    paragraphs:
      - text: >-
          While at Google Brain, Noam Shazeer first-authored the 2017 Outrageously Large Neural Networks
          paper, which introduced the sparsely-gated mixture-of-experts layer, and the same year Shazeer co-authored Attention Is All You
          Need, whose contribution note credits Shazeer with scaled dot-product attention, multi-head attention
          and the parameter-free position representation.
        source_ids: [moe-paper, attention-paper]
      - text: >-
          Later single- and first-author papers include Adafactor (2018), an optimizer with adaptive learning
          rates and sublinear memory cost; multi-query attention (2019), which shares keys and values across
          attention heads to speed up incremental decoding; and GLU Variants Improve Transformer (2020), which
          tests gated linear unit variants in Transformer feed-forward layers. Shazeer was also a co-author of
          Switch Transformers (2021), a simplified sparse mixture-of-experts design.
        source_ids: [adafactor-paper, mqa-paper, glu-paper, switch-paper]
  - heading: Open-source work and systems
    paragraphs:
      - text: >-
          Shazeer co-authored the 2018 paper describing Tensor2Tensor, a library of deep learning models and
          datasets, and first-authored Mesh-TensorFlow (2018), a language for specifying how
          tensor computations are split across processors so that very large models can be trained.
        source_ids: [t2t-paper, t2t-repo, mesh-paper]
      - text: >-
          At Google DeepMind, Shazeer is listed among the sponsors of the 2025 Gemma 3 technical report on
          lightweight open models and is credited as Vice President, Google DeepMind, on the May 2026
          Gemini 3.5 announcement.
        source_ids: [gemma3-report, gemini-35-post]
