headline: Vice President at Google DeepMind; co-author of the Transformer paper and the mixture-of-experts layer
bio:
  text: >-
    Noam Shazeer is a Vice President at Google DeepMind, credited with that title on Google's May 2026
    Gemini 3.5 announcement, and is listed among the sponsors of the Gemma 3 technical report. Shazeer
    is a co-author of Attention Is All You Need (2017), listed there with a Google Brain affiliation;
    the paper's contribution note credits Shazeer with proposing scaled dot-product attention,
    multi-head attention, and the parameter-free position representation. Shazeer is also first author
    of the 2017 Google Brain paper that introduced the sparsely-gated mixture-of-experts layer, and a
    co-author of the Tensor2Tensor library paper.
  source_ids: [gemini-35-post, gemma3-report, attention-paper, moe-paper, t2t-paper]
  reviewed_at: 2026-10-13
