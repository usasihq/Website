sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Replit, Chávez worked on making it possible to run Android applications in Chrome OS. Replit
          lists Chávez as its Chief Technology Officer on the company's leadership page and author page,
          where the accompanying bio describes Chávez as Replit's Lead Platform Engineer.
        source_ids: [chavez-replit-author, replit-about]
  - heading: Writing on Replit
    paragraphs:
      - text: >-
          Chávez's posts on the Replit blog cover the platform's infrastructure: more reliable connections to
          users' Repls (2024), tracking down memory leaks (2024), the snapshot engine Replit uses to make AI
          agents safe to run (2025), and how Replit secures each layer of its stack (2026).
        source_ids: [chavez-replit-author]
