sections:
  - heading: Career
    paragraphs:
      - text: >-
          Samuli Laine joined NVIDIA Research in 2007 after completing a PhD at Helsinki University of
          Technology. NVIDIA's profile says Laine's research has ranged from photorealistic and
          real-time rendering to voxel-based graphics, GPU ray tracing and 3D content creation, and
          that Laine now focuses on deep learning and its applications in computer graphics.
        source_ids: [nvidia-profile]
  - heading: Research
    paragraphs:
      - text: >-
          With Timo Aila, Laine wrote "Temporal Ensembling for Semi-Supervised Learning" (2016), and
          Laine was a co-author of Noise2Noise (2018), which trains image restoration networks without
          clean target images. Laine is also first author of "Modular Primitives for High-Performance
          Differentiable Rendering" (2020), the paper behind NVIDIA's nvdiffrast, a PyTorch
          library of primitive operations for rasterization-based differentiable rendering.
        source_ids: [temporal-ensembling-paper, noise2noise-paper, nvdiffrast-paper, nvdiffrast-readme]
      - text: >-
          Laine has co-authored a line of image generation papers with Tero Karras and colleagues:
          progressive growing of GANs (2017), the style-based generator StyleGAN (2018), StyleGAN2
          (2019) and the alias-free StyleGAN3 (2021). In diffusion models, Laine co-authored EDM (2022),
          which maps out the design space of diffusion-based generative models, and EDM2 (2023), which
          analyzes and improves their training dynamics; the official EDM2 implementation is published
          in NVIDIA's NVlabs GitHub organization.
        source_ids: [progan-paper, stylegan-paper, stylegan2-paper, stylegan3-paper, edm-paper, edm2-paper, edm2-readme]
