headline: Member of NVIDIA Research since 2007; first author of nvdiffrast and co-author of StyleGAN and EDM
bio:
  text: >-
    Samuli Laine joined NVIDIA Research in 2007, and NVIDIA's page says Laine's research has ranged from
    photorealistic and real-time rendering to voxel-based graphics, GPU ray tracing, and 3D content
    creation, with a current focus on deep learning and its applications in computer graphics. Laine
    is first author of "Modular Primitives for High-Performance Differentiable Rendering", the paper
    behind NVIDIA's nvdiffrast PyTorch library. Laine is also a co-author of the StyleGAN, StyleGAN3,
    EDM, and EDM2 generative model papers, whose official implementations NVIDIA publishes in its NVlabs
    GitHub organization.
  source_ids: [nvidia-profile, nvdiffrast-paper, nvdiffrast-readme, stylegan-paper, stylegan3-paper, edm-paper, edm2-paper, edm2-readme]
  reviewed_at: 2026-10-13
