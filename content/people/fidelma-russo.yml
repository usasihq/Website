headline: Executive Vice President, General Manager of Hybrid Cloud and Chief Technology Officer of HPE
bio:
  text: >-
    Fidelma M. Russo is Executive Vice President, General Manager of Hybrid Cloud and Chief
    Technology Officer of Hewlett Packard Enterprise (HPE), according to HPE's 2026 proxy statement,
    which lists the executive team as of February 1, 2026. HPE's annual report for fiscal 2025 says
    Russo has held the combined role since November 2023, after serving as Executive Vice President and
    Chief Technology Officer from 2021 to 2023. Russo's earlier roles include Senior Vice President and
    General Manager at VMware and Chief Technology Officer at Iron Mountain.
  source_ids: [hpe-proxy-2026, hpe-10k-fy2025]
  reviewed_at: 2026-10-22
