sections:
  - heading: Career
    paragraphs:
      - text: >-
          Russo's earlier roles include Chief Technology Officer at Iron Mountain and Senior Vice President and
          General Manager at VMware. At HPE, Russo served as Executive Vice President and Chief Technology
          Officer from 2021 to 2023.
        source_ids: [hpe-10k-fy2025]
      - text: >-
          In November 2023 Russo took on the combined role of Executive Vice President, General Manager of
          Hybrid Cloud and Chief Technology Officer. HPE's 2026 proxy statement lists Russo in that role among
          the members of its executive team as of February 1, 2026.
        source_ids: [hpe-10k-fy2025, hpe-proxy-2026]
