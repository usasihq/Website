headline: Anthropic co-founder and Head of Public Benefit; writes the Import AI newsletter
bio:
  text: >-
    Jack Clark co-founded Anthropic and is its Head of Public Benefit; Clark leads The Anthropic
    Institute, which produces research on the societal implications of frontier AI, and oversees
    research teams including Societal Impacts, Frontier Red Team, Economic Research and Measuring AI
    Progress. Before Anthropic,
    Clark was Policy Director at OpenAI and earlier a technical journalist. Clark writes Import AI, a
    newsletter about AI research, and was a founding member of the AI Index at Stanford University from
    2017 to 2024. Clark is also a co-author, with an OpenAI affiliation, of the GPT-3 and CLIP papers.
  source_ids: [anthropic-leadership, clark-about, gpt3-paper, clip-paper]
  reviewed_at: 2026-10-21
