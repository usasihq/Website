sections:
  - heading: Career
    paragraphs:
      - text: >-
          Clark began as a technical journalist, writing about distributed systems, quantum computers and AI
          research for publications from Bloomberg BusinessWeek to The Register. Clark then became Policy
          Director at OpenAI before co-founding Anthropic.
        source_ids: [clark-about]
      - text: >-
          At Anthropic, Clark is Head of Public Benefit and leads The Anthropic Institute, which studies the
          societal implications of frontier AI. Clark was also a founding member of the AI Index at Stanford
          University from 2017 to 2024 and an inaugural member of the U.S. National Artificial Intelligence
          Advisory Committee from 2021 to 2024.
        source_ids: [anthropic-leadership, clark-about]
  - heading: Writing and research
    paragraphs:
      - text: >-
          Clark has written the Import AI newsletter about AI research since its first issue in August 2016,
          and writes science fiction stories for it.
        source_ids: [importai-issue1, clark-about]
      - text: >-
          Clark co-authored reports on the societal effects of AI, including "The Malicious Use of
          Artificial Intelligence" (2018), a study of release strategies for language models (2019) and
          "Toward Trustworthy AI Development" (2020), which proposes mechanisms for making verifiable claims about
          AI systems. Clark is also a co-author of the GPT-3 and CLIP papers.
        source_ids: [malicious-use-paper, release-strategies-paper, trustworthy-paper, gpt3-paper, clip-paper]
