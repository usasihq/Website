headline: UCLA associate professor of computer science; co-author of the LAMB and Lion optimizer papers
bio:
  text: >-
    Cho-Jui Hsieh is an associate professor of computer science at UCLA; Hsieh's homepage says Hsieh
    was previously an assistant professor of computer science and statistics at UC Davis for three
    years and lists a visiting scholar role at Google beginning in summer 2018. Hsieh develops algorithms and
    optimization techniques for large-scale machine learning, including work on model size, training
    and prediction speed, and robustness of deep learning models. Hsieh is a co-author of Large Batch
    Optimization for Deep Learning: Training BERT in 76 minutes, which introduces the LAMB optimizer,
    and of Symbolic Discovery of Optimization Algorithms, which describes the Lion optimizer found
    through program search. With Pin-Yu Chen, Hsieh co-authored the book Adversarial Robustness for
    Machine Learning.
  source_ids: [hsieh-site, lamb-paper, lion-paper]
  reviewed_at: 2026-10-21
