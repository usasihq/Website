sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hsieh completed a PhD in computer science at the University of Texas at Austin from 2010 to 2015,
          advised by Inderjit Dhillon, after a master's degree at National Taiwan University supervised by
          Chih-Jen Lin. Hsieh then served as an assistant professor in the Departments of Computer Science and
          Statistics at UC Davis from 2015 to 2018 before joining the UCLA computer science faculty in November
          2018, where Hsieh is now an associate professor.
        source_ids: [hsieh-cv, hsieh-site]
  - heading: Research
    paragraphs:
      - text: >-
          Hsieh's research focuses on algorithms and optimization for large-scale machine learning, including
          adversarial robustness, fast and scalable training, model compression, recommender systems and
          automated machine learning. Hsieh is a co-author of the LAMB large-batch optimizer paper (ICLR 2020)
          and of Cluster-GCN (KDD 2019), an algorithm for training deep and large graph convolutional networks.
        source_ids: [hsieh-cv, lamb-paper, cluster-gcn-paper]
      - text: >-
          On robustness, Hsieh co-authored CROWN, a method for certifying the robustness of neural networks with
          general activation functions presented at NIPS 2018, and the book Adversarial Robustness for Machine
          Learning with Pin-Yu Chen. Hsieh has also presented a tutorial on neural network verification.
        source_ids: [crown-paper, hsieh-site]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Hsieh's software page lists packages Hsieh has worked on, among them LIBLINEAR for large-scale linear
          classification, QUIC for sparse inverse covariance estimation, the large-scale kernel SVM solver DCSVM,
          and LIBPMF for parallel matrix factorization.
        source_ids: [hsieh-software]
