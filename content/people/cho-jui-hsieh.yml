work:
  - name: Lion optimizer (Symbolic Discovery of Optimization Algorithms)
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2302.06675
    contribution: >-
      Co-author of the 2023 paper that formulates algorithm discovery as program search and reports the
      Lion (EvoLved Sign Momentum) optimizer, which tracks only momentum and is more memory-efficient
      than Adam.
    source_ids: [lion-paper]
  - name: LAMB optimizer (Large Batch Optimization for Deep Learning)
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/1904.00962
    contribution: >-
      Co-author of the 2019 paper that develops LAMB, a layerwise adaptive large batch optimization
      technique, and provides convergence analysis for LAMB and LARS.
    source_ids: [lamb-paper]
