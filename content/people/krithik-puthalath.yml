headline: Founder and CEO of Zyphra, the open-model research lab behind Zamba and Zyphra Cloud
bio:
  text: >-
    Krithik Puthalath is the founder and CEO of Zyphra, according to the company's May 2026
    announcement of AMD Instinct MI355X GPU capacity on Zyphra Cloud. Zyphra describes itself as an
    open superintelligence research and product company with two parts: Zyphra Research, which trains
    open multimodal models, and Zyphra Cloud, an AI platform built on AMD hardware.
  source_ids: [zyphra-amd-capacity, zyphra-about]
  reviewed_at: 2026-10-22
