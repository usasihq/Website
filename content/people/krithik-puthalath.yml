sections:
  - heading: Zyphra
    paragraphs:
      - text: >-
          Puthalath leads Zyphra as founder and CEO. The company's research arm trains open multimodal models
          on heterogeneous compute, with a focus on long-term memory, continual learning and hardware
          performance, and its cloud arm offers a full-stack AI platform built on AMD hardware.
        source_ids: [zyphra-amd-capacity, zyphra-about]
      - text: >-
          Zyphra launched Zyphra Cloud in May 2026 with Zyphra Inference, an inference service running on AMD
          MI355X GPUs. A week later the company announced bare-metal MI355X capacity on the platform, with
          Puthalath quoted on bringing Zyphra Research's systems work into production infrastructure.
        source_ids: [zyphra-inference-cloud, zyphra-amd-capacity]
