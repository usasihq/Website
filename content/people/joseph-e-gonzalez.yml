sections:
  - heading: Career
    paragraphs:
      - text: >-
          Joseph E. Gonzalez, also known as Joey Gonzalez, has been on the UC Berkeley EECS faculty since
          2016 and is a member of Berkeley AI Research (BAIR). As a PhD student in machine learning at
          Carnegie Mellon, advised by Carlos Guestrin, Gonzalez developed GraphLab and PowerGraph for
          large-scale graph computation, and co-founded Turi (formerly GraphLab), which Apple acquired in
          2016.
        source_ids: [gonzalez-bio, gonzalez-research]
      - text: >-
          As a postdoc in Berkeley's AMPLab, Gonzalez led GraphX, which became the graph library of
          Apache Spark. Gonzalez is a founding member of Berkeley's RISELab, the Sky Computing Lab and
          LMSYS, and is listed among LMSYS's advisors.
        source_ids: [gonzalez-bio, gonzalez-research, lmsys-about]
  - heading: Research
    paragraphs:
      - text: >-
          Gonzalez's group studies how new systems abstractions can enable new forms of machine learning.
          After graph computation, the group turned in 2015 to serving and tuning models, with Velox,
          Clipper for low-latency prediction serving, InferLine for serving model pipelines and Ray Tune
          for hyperparameter tuning; Simon Mo developed Ray Serve from Clipper.
        source_ids: [gonzalez-research, gonzalez-bio]
      - text: >-
          From 2021 the group worked on infrastructure for large language models, including Alpa and
          AlpaServe, the vLLM paper on PagedAttention memory management for LLM serving, SGLang, Chatbot
          Arena and the Gorilla project on connecting LLMs to APIs. Since 2023 the group's research has
          covered AI agents, post-training and continual learning, and new neural architectures, with
          projects such as MemGPT and SkyRL.
        source_ids: [gonzalez-research, vllm-paper, gorilla-paper, bfcl-page]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Several systems from Gonzalez's group are released as open-source software. The Gorilla
          repository, which hosts the Berkeley Function Calling Leaderboard, is under the Apache-2.0
          license, as is the vLLM repository. Gonzalez's biography credits former students and
          collaborators with leading these systems, among them Shishir Patil and Tianjun Zhang for
          Gorilla and Lianmin Zheng and Ying Sheng for SGLang.
        source_ids: [gorilla-repo, vllm-repo, bfcl-page, gonzalez-bio]
timeline:
  - date: "2010"
    text: Published the first GraphLab paper, at UAI 2010, as part of doctoral work at Carnegie Mellon.
    source_ids: [gonzalez-research]
  - date: "2012"
    text: Published Distributed GraphLab at VLDB 2012 and PowerGraph at OSDI 2012.
    source_ids: [gonzalez-research]
  - date: "2014"
    text: Published GraphX, graph processing inside a distributed dataflow framework, at OSDI 2014.
    source_ids: [gonzalez-research]
  - date: "2016"
    text: Joined the UC Berkeley EECS faculty; Turi, which Gonzalez co-founded, was acquired by Apple the same year.
    source_ids: [gonzalez-bio, gonzalez-research]
  - date: "2017"
    text: Published Clipper, a general-purpose, low-latency prediction serving system, at NSDI 2017.
    source_ids: [gonzalez-research]
  - date: 2023-05-24
    text: Co-authored the Gorilla paper on large language models connected with massive APIs.
    source_ids: [gorilla-paper]
  - date: 2023-09-12
    text: Co-authored the vLLM paper on PagedAttention memory management for LLM serving.
    source_ids: [vllm-paper]
  - date: "2023"
    text: Received the VLDB 2023 Test of Time Award for Distributed GraphLab.
    source_ids: [gonzalez-research]
  - date: "2024"
    text: Co-authored the Chatbot Arena paper at ICML 2024.
    source_ids: [gonzalez-research]
