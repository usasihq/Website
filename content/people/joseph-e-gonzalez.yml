headline: UC Berkeley professor whose group built Gorilla and the Berkeley Function Calling Leaderboard
bio:
  text: >-
    Joseph E. Gonzalez is an associate professor in EECS at UC Berkeley working at the intersection of machine
    learning and computer systems, and a founding member of the Sky Computing Lab, LMSYS and
    RISELab. With students and collaborators, Gonzalez has worked on systems including Gorilla and
    the Berkeley Function Calling Leaderboard (BFCL), Chatbot Arena, SGLang, MemGPT, vLLM, Ray Serve,
    Ray Tune and GraphLab. Gonzalez is a co-author of the Gorilla and vLLM papers and an advisor to
    LMSYS; current research spans AI agents, post-training and new neural architectures.
  source_ids: [gonzalez-site, gonzalez-bio, gorilla-paper, vllm-paper, lmsys-about]
  reviewed_at: 2026-10-13
