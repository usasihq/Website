headline: Anthropic co-founder and Chief Compute Officer; first author of the GPT-3 paper
bio:
  text: >-
    Tom Brown co-founded Anthropic and is its Chief Compute Officer; Brown heads the technical
    organization that secures, scales and uses the company's compute. According to Anthropic's leadership page,
    Brown previously led the engineering of GPT-3 at OpenAI and, with Dario Amodei, co-invented deep
    reinforcement learning from human feedback. Brown is first author of "Language Models are Few-Shot
    Learners" (2020), the GPT-3 paper written with an OpenAI affiliation, and a co-author of the 2017
    paper "Deep reinforcement learning from human preferences" and of Anthropic's Constitutional AI
    paper.
  source_ids: [anthropic-leadership, gpt3-paper, rlhp-paper, cai-paper]
  reviewed_at: 2026-10-13
