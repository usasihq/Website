links: []
sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Anthropic, Tom Brown led the engineering of GPT-3 at OpenAI. Anthropic's leadership
          page also credits Brown, together with Dario Amodei, with co-inventing deep reinforcement
          learning from human feedback, the technique used to turn base language models into
          conversational assistants.
        source_ids: [anthropic-leadership]
      - text: >-
          Brown co-founded Anthropic and is its Co-Founder and Chief Compute Officer, heading the
          technical organization responsible for securing, scaling and using the company's compute
          resources.
        source_ids: [anthropic-leadership]
  - heading: Research
    paragraphs:
      - text: >-
          Brown is the first author of "Adversarial Patch" (2017), which describes printable image
          patches that cause image classifiers to misclassify scenes, and a co-author of "Deep
          reinforcement learning from human preferences" (2017). In 2020 Brown co-authored "Scaling
          Laws for Neural Language Models" and was first author of "Language Models are Few-Shot
          Learners", the paper introducing GPT-3.
        source_ids: [adversarial-patch, rlhp-paper, scaling-laws, gpt3-paper]
      - text: >-
          At Anthropic, Brown is a co-author of early alignment papers including "A General Language
          Assistant as a Laboratory for Alignment" (2021), "Training a Helpful and Harmless Assistant
          with Reinforcement Learning from Human Feedback" (2022) and "Constitutional AI:
          Harmlessness from AI Feedback" (2022).
        source_ids: [hh-lab-paper, hh-rlhf-paper, cai-paper]
