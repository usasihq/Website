sections:
  - heading: Generative computing at IBM Research
    paragraphs:
      - text: >-
          In April 2025 IBM Research described Lastras, then its director of language technologies, in
          connection with its work on activated LoRA (aLoRA) adapters, which Lastras co-authored. By June
          2026 IBM Research described Lastras as its director of language and multimodal models, in a post
          introducing Granite Libraries and Project Granite Switch as part of IBM's approach to building
          LLMs with the modularity of software.
        source_ids: [ibm-alora-blog, alora-paper, ibm-switch-blog]
      - text: >-
          Granite Switch adds a switching layer to a base Granite model so that adapter functions for tasks
          such as relevance scoring, query rewriting, hallucination detection and safety decisions can be
          activated at inference time. Lastras co-wrote the October 2026 post launching Granite Switch 4.1,
          which adds a decision adapter and speech recognition to the models.
        source_ids: [ibm-switch-blog, granite-switch-blog]
  - heading: Information theory
    paragraphs:
      - text: >-
          Lastras is a co-author of a paper in the Proceedings of the National Academy of
          Sciences that extends Shannon's sender-receiver model of communication by giving the receiver a
          reasoning capability. IBM Research describes the work as a long-running research effort that
          Lastras pursued with a small team before it grew into a larger collaboration.
        source_ids: [ibm-info-blog]
