headline: IBM Research director of language and multimodal models; co-author of the Granite Switch 4.1 launch post
bio:
  text: >-
    Luis Lastras is IBM Research's director of language and multimodal models. Lastras is a co-author of
    the Granite Switch 4.1 launch post and of the Activated LoRA paper on adapters that can be switched
    in at inference time without reprocessing a conversation, an approach Granite Switch uses to combine
    a base Granite model with adapter functions.
  source_ids: [ibm-switch-blog, granite-switch-blog, alora-paper]
  reviewed_at: 2026-10-22
