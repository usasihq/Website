sections:
  - heading: Career
    paragraphs:
      - text: >-
          Parikh held leadership roles at NetGravity, Akamai Technologies and Ning before joining Facebook, where
          from 2009 to 2021 Parikh was Vice President and Global Head of Engineering and Infrastructure. In that
          role Parikh led the teams that built and operated the infrastructure behind Facebook's products.
          Parikh was later CEO of Lacework and holds more than 20 U.S. patents.
        source_ids: [github-author, ms-slt-2024]
      - text: >-
          Microsoft announced in October 2024 that Parikh would join its senior leadership team, reporting to
          Satya Nadella. The GitHub Blog describes Parikh as Executive Vice President of CoreAI at Microsoft and
          also as a board member and advisor to consumer, developer and enterprise technology companies.
        source_ids: [ms-slt-2024, github-author]
  - heading: CoreAI – Platform and Tools
    paragraphs:
      - text: >-
          In January 2025 Microsoft formed CoreAI – Platform and Tools, combining its developer division, its AI
          platform and teams from the Office of the CTO working on the AI supercomputer, agentic runtimes and
          engineering productivity. Under Parikh as EVP, the group's stated mission is to build the end-to-end
          Copilot and AI stack for building and running AI apps and agents, including GitHub Copilot and tools
          spanning Azure AI Foundry, GitHub and VS Code.
        source_ids: [ms-coreai-2025]
