headline: Executive Vice President of CoreAI at Microsoft; former global head of engineering at Facebook
bio:
  text: >-
    Jay Parikh is Executive Vice President of CoreAI at Microsoft. Parikh joined Microsoft's senior
    leadership team in October 2024, reporting to Satya Nadella, and in January 2025 Microsoft created
    the CoreAI – Platform and Tools engineering group with Parikh as its EVP, bringing together the
    developer division, the AI platform team and parts of the Office of the CTO to build the Copilot
    and AI stack, including GitHub Copilot. From 2009 to 2021 Parikh was Vice President and Global Head
    of Engineering and Infrastructure at Facebook, and Parikh later served as CEO of Lacework, with
    earlier leadership roles at Ning and Akamai Technologies.
