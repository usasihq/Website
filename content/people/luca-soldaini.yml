sections:
  - heading: Career
    paragraphs:
      - text: >-
          Luca Soldaini completed a PhD in computer science at Georgetown University in 2018, in the
          Information Retrieval Lab with Nazli Goharian, with a thesis on information retrieval
          systems for medical experts and lay health users. Soldaini then worked as a senior applied
          scientist at Alexa on efficient question answering for long-tail knowledge, including work in
          2021 to scale generative question answering in production.
        source_ids: [site]
      - text: >-
          From 2022 to early 2026 Soldaini was a lead research scientist at Ai2, co-leading the Olmo
          project. Soldaini is now a member of the technical staff at Microsoft AI, working on the
          MAI-Thinking models.
        source_ids: [site, github-profile]
  - heading: Open models and data
    paragraphs:
      - text: >-
          Soldaini is first author of Dolma (2024), a three-trillion-token open corpus for language
          model pretraining research, and a co-author of the first OLMo paper, "OLMo: Accelerating the
          Science of Language Models" (2024). During Soldaini's time at Ai2, the
          Olmo project released three generations of dense, mixture-of-experts, hybrid and multimodal
          models with their data, code, recipes and checkpoints.
        source_ids: [dolma-paper, olmo-paper, site]
      - text: >-
          Soldaini is second-listed author of OLMoE (2024), an open mixture-of-experts language model,
          and of "2 OLMo 2 Furious" (2024), the OLMo 2 report, and co-authored olmOCR (2025), which uses
          vision language models to extract text from PDF documents.
        source_ids: [olmoe-paper, olmo2-paper, olmocr-paper]
