slug: luca-soldaini
name: Luca Soldaini
initials: LS
headline: Former co-lead of Ai2's Olmo open-model project; now a member of the technical staff at Microsoft AI
bio:
  text: >-
    Luca Soldaini works on data methods for language models, from pre-training through
    post-training. From 2022 to early 2026 he was a lead research scientist at Ai2, where he
    co-led the Olmo project, which released several generations of fully open models together
    with the data, code, recipes, and checkpoints used to build them. He is first author of the
    paper introducing Dolma, Ai2's three-trillion-token open corpus for pretraining research. He
    is now a member of the technical staff at Microsoft AI.
  source_ids: [site, dolma-paper]
