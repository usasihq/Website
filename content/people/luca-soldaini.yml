headline: Former co-lead of Ai2's Olmo open-model project; now a member of the technical staff at Microsoft AI
bio:
  text: >-
    Luca Soldaini works on scalable data methods for language models, from pre-training to
    post-training. From 2022 to early 2026, Soldaini was a lead research scientist at Ai2 and co-led
    the Olmo project, which released three generations of fully open models in dense,
    mixture-of-experts, hybrid, and multimodal variants, together with the data, code, recipes, and
    checkpoints used to build them. Soldaini is first author of the paper introducing Dolma, a
    three-trillion-token open corpus for language model pretraining research, and is now a member of
    the technical staff at Microsoft AI.
  source_ids: [site, github-profile, dolma-paper]
  reviewed_at: 2026-10-01
