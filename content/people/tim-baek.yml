slug: tim-baek
name: Tim Baek
initials: TB
groups: [local, open-source, leadership]
sector: corporate
specialties: [developer-tools]
headline: Creator and founder of Open WebUI, a self-hosted AI interface for local and cloud models
bio:
  text: >-
    Tim Baek is the creator and founder of Open WebUI and, according to the project's team page,
    leads its core team. Open WebUI is a self-hosted AI platform built to run entirely offline, with
    support for Ollama and OpenAI-compatible APIs for both local and cloud models. Baek made the
    repository's initial commit in October 2023, is credited in the README as its creator under the
    name Timothy Jaeryang Baek, and continues to commit to it.
  source_ids: [owui-team, baek-site, owui-readme, owui-initial-commit, owui-commits]
  reviewed_at: 2026-10-21
affiliations:
  - name: Open WebUI
    organization_slug: null
    role: Creator and founder; leads the Open WebUI team
    current: true
    source_ids: [owui-team, baek-site, github-profile]
work:
  - name: Open WebUI
    artifact_slug: open-webui
    url: https://github.com/open-webui/open-webui
    contribution: >-
      Made the repository's initial commit on 2023-10-06 and continues to author commits. The
      README ends "Created by Timothy Jaeryang Baek", and the LICENSE notice reads
      "Open WebUI Inc. [Created by Timothy Jaeryang Baek]". The README describes a self-hosted
      platform built to run entirely offline that connects to local Ollama models or any
      OpenAI-compatible API.
    source_ids: [owui-initial-commit, owui-commits, owui-readme, owui-license]
  - name: Pipelines
    artifact_slug: null
    type: open-source
    url: https://github.com/open-webui/pipelines
    contribution: >-
      Made the initial commit on 2024-05-21 of Pipelines, an Open WebUI plugin framework for adding
      custom workflows to clients that support the OpenAI API.
    source_ids: [pipelines-initial-commit, pipelines-readme]
  - name: mcpo
    artifact_slug: null
    type: open-source
    url: https://github.com/open-webui/mcpo
    contribution: >-
      Made the initial commit on 2025-03-30 of mcpo, an Open WebUI proxy that exposes Model Context
      Protocol tools as OpenAPI-compatible HTTP servers.
    source_ids: [mcpo-initial-commit, mcpo-readme]
links:
  - label: Website
    url: https://timbaek.com
  - label: GitHub
    url: https://github.com/tjbck
sections:
  - heading: Open WebUI
    paragraphs:
      - text: >-
          Baek started the Open WebUI repository with its initial commit on 2023-10-06, and the README
          credits Timothy Jaeryang Baek as its creator. The project describes itself as a self-hosted AI
          platform that can run entirely offline and works with Ollama and OpenAI-compatible APIs, so
          the same interface can serve local and cloud models. Its license notice is held by Open WebUI
          Inc. and names Baek as the creator.
        source_ids: [owui-initial-commit, owui-readme, owui-license]
      - text: >-
          The project's documentation says its team is led by Baek as creator and founder, supported by
          company staff and community contributors. Baek's own homepage says Baek is currently building
          Open WebUI, described there as an open, local and decentralized AI interface, and Baek
          continued to author commits to the repository in October 2026.
        source_ids: [owui-team, baek-site, owui-commits]
  - heading: Releases and related projects
    paragraphs:
      - text: >-
          Open WebUI's changelog records version 0.2.0 on 2024-06-01, which added Pipelines support and
          built-in web search, and version 0.6.0 on 2025-03-31, which added connections to external tool
          servers through OpenAPI and support for MCP servers through mcpo. Later major versions
          followed, through 0.12.0 on 2026-10-10.
        source_ids: [owui-changelog]
      - text: >-
          Baek made the initial commits of two companion repositories in the open-webui organization.
          Pipelines, started in May 2024, is a plugin framework for OpenAI-API clients, and mcpo, started
          in March 2025, is a proxy that turns Model Context Protocol tools into OpenAPI HTTP servers.
        source_ids: [pipelines-initial-commit, pipelines-readme, mcpo-initial-commit, mcpo-readme]
