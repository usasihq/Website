headline: Llama 3 core contributor and Llama 2 co-author; machine translation research at Meta's FAIR, including NLLB
bio:
  text: >-
    Meta's AI people page describes Angela Fan as a research scientist at Facebook AI Research (FAIR)
    focusing on machine translation. Fan is a co-author of No Language Left Behind (2022), whose
    authors open sourced the work in the fairseq repository, and of the fairseq sequence-modeling
    toolkit paper (2019), and first author of Hierarchical Neural Story Generation (2018). Fan
    co-authored Llama 2 (2023) and is listed among the core contributors of The Llama 3 Herd of
    Models (2024).
  source_ids: [meta-profile, nllb-paper, fairseq-paper, story-paper, llama2-paper, llama3-paper]
  reviewed_at: 2026-10-13
