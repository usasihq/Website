sections:
  - heading: Career
    paragraphs:
      - text: >-
          Meta's people page describes Angela Fan as a research scientist at Facebook AI Research (FAIR)
          focusing on machine translation. Before that role, Fan completed a PhD on text generation with
          Inria and FAIR, and earlier worked as a research engineer.
        source_ids: [meta-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Fan's doctoral-era work centered on text generation. As first author of Hierarchical Neural Story
          Generation (2018), Fan and co-authors collected a dataset of human-written stories paired with
          writing prompts and trained models that first generate a premise and then expand it into a
          passage.
        source_ids: [story-paper, meta-profile]
      - text: >-
          In machine translation, Fan co-authored No Language Left Behind (2022), which set out to provide
          translation across 200 languages, including many low-resource languages, and built datasets and
          models toward that goal. Fan's later work includes contributions to Meta's large language models:
          Llama 2 in 2023, Effective Long-Context Scaling of Foundation Models in 2023, and The Llama 3 Herd of
          Models in 2024.
        source_ids: [nllb-paper, llama2-paper, meta-profile, llama3-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Fan co-authored the 2019 NAACL demonstration paper for fairseq, an open-source PyTorch toolkit for
          training translation, summarization and language models, which is published under the MIT License.
          The No Language Left Behind models and data were also released through the fairseq repository.
        source_ids: [fairseq-paper, fairseq-license, nllb-paper]
