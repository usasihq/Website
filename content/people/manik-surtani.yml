headline: CTO and co-founder of the Agentic AI Foundation; previously Head of Open Source at Block
bio:
  text: >-
    Manik Surtani is the CTO and a co-founder of the Agentic AI Foundation (AAIF), the Linux Foundation
    home for open agentic AI projects including the Model Context Protocol, goose and AGENTS.md. When the
    foundation was announced in December 2025, Surtani spoke for Block as its Head of Open Source, the
    company that contributed goose.
