sections:
  - heading: Career
    paragraphs:
      - text: >-
          At Block, Surtani was Head of Open Source when the Linux Foundation announced the Agentic AI
          Foundation on December 9, 2025. Block was one of the founding contributors, giving the
          foundation goose, an agent framework first released in early 2025 that combines language
          models, extensible tools and MCP-based integrations.
        source_ids: [lf-formation]
      - text: >-
          Surtani is now listed among the foundation's staff as CTO and co-founder. AAIF describes itself
          as a neutral, open foundation that hosts open protocols and open-source projects for agentic AI,
          including MCP, goose, AGENTS.md, Agent2Agent and agentgateway.
        source_ids: [aaif-staff, aaif-about]
