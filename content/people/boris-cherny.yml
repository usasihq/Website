headline: Creator and Head of Claude Code at Anthropic; author of O'Reilly's Programming TypeScript
bio:
  text: >-
    Boris Cherny is a software engineer at Anthropic, where Cherny created Claude Code, which the
    project's repository describes as an agentic coding tool for the terminal that understands
    a codebase and handles routine tasks and git workflows through natural language commands. Anthropic's Code w/ Claude 2026 conference page lists Cherny as Head of Claude Code.
    Before Anthropic, Cherny worked at Instagram, prototyping and scaling new product and
    infrastructure ideas, according to Cherny's own site. Cherny is also the author of O'Reilly's
    Programming TypeScript.
