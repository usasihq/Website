sections:
  - heading: Career
    paragraphs:
      - text: >-
          Boris Cherny's own site describes a role as a software engineer at Anthropic, where Cherny created
          Claude Code, after earlier work at Instagram prototyping and scaling new product and infrastructure
          ideas. Anthropic's Code w/ Claude 2026 programme lists Cherny as Head of Claude Code, presenting a
          live coding session with Jarred Sumner, the creator of Bun, on how the Claude Code team uses the tool
          in everyday work.
        source_ids: [cherny-about, cwc-session]
      - text: >-
          The Claude Code repository describes the product as an agentic coding tool that runs in the
          terminal, understands a codebase and carries out routine tasks and git workflows from
          natural-language commands.
        source_ids: [claude-code-repo]
  - heading: Open-source work and writing
    paragraphs:
      - text: >-
          Projects pinned on Cherny's GitHub profile include two MIT-licensed TypeScript libraries: json-schema-to-typescript, which
          compiles JSON Schema into TypeScript type declarations, and undux, a small state-management library
          for React with Hooks support.
        source_ids: [github-profile, jstt-repo, undux-repo]
      - text: >-
          Cherny is the author of O'Reilly's Programming TypeScript and keeps a blog on software engineering.
          Its posts include "Towards a Safer Redux" (2017), "13 Tips for Writing a Technical Book" (2019) and a
          2024 post on making ES modules easier to use in npm and Node.js.
        source_ids: [cherny-home, cherny-about]
