sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kilpatrick's early career included building lunar rover software at NASA and training machine
          learning models at Apple. Kilpatrick then led developer relations at OpenAI from 2022 through early
          2024.
        source_ids: [site]
      - text: >-
          At Google DeepMind, Kilpatrick works on Google AI Studio and the Gemini API, leading the team that
          helps developers build with Gemini, Veo, Imagen and other Google models. Google's author page gives
          the title Product Lead, Google AI Studio and the Gemini API, while the May 2026 I/O post lists
          Kilpatrick as Member of the Technical Staff, Google DeepMind.
        source_ids: [google-author, site, io-2026-post]
  - heading: Developer launches and writing
    paragraphs:
      - text: >-
          On the Google Developers Blog, Kilpatrick has written launch posts for the Gemini API, including
          Gemini 2.0 Flash and Flash-Lite in February 2025, the Gemini Embedding text model in March 2025,
          implicit caching for Gemini 2.5 models in May 2025 and the general availability of Gemini 2.5
          Flash-Lite in July 2025. In May 2026 Kilpatrick wrote Google's summary of developer announcements
          from I/O 2026, covering Google Antigravity, the Gemini API and Google AI Studio.
        source_ids: [dev-blog-posts, io-2026-post]
      - text: >-
          Kilpatrick also co-hosts the Around the Prompt podcast with Nolan Fortman, which features
          conversations with AI practitioners.
        source_ids: [site]
