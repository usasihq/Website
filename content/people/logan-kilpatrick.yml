headline: Works on helping developers build with Gemini at Google DeepMind; co-host of Around the Prompt
bio:
  text: >-
    Logan Kilpatrick works on enabling developers to build with Gemini at Google DeepMind, after leading
    developer relations at OpenAI from 2022 through early 2024. Logan co-hosts the Around the Prompt
    podcast with Nolan Fortman, which features conversations with AI practitioners. Earlier work
    included lunar rover software at NASA and training machine learning models at Apple.
