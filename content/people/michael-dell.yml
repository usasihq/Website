sections:
  - heading: Career
    paragraphs:
      - text: >-
          Michael Dell founded Dell Technologies in 1984 and leads it as chairman and CEO. The company
          went private in 2013, combined with EMC and VMware in 2016, and relisted on the public markets in
          2018.
        source_ids: [dell-bio]
      - text: >-
          Dell's company biography lists Dell as one of the first members of the President's Council of
          Advisors on Science and Technology and as a member of the Technology CEO Council and the Business
          Roundtable. Dell also served as the United Nations Foundation's first Global Advocate for
          Entrepreneurship.
        source_ids: [dell-bio]
