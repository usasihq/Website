headline: Founder, Chairman and CEO of Dell Technologies
bio:
  text: >-
    Michael Dell is the chairman and chief executive officer of Dell Technologies, which Dell founded in
    1984. The company provides infrastructure that organizations use to transform IT and protect their
    information, serving customers from global corporations and governments to small businesses.
    Dell's company biography highlights taking the company private in 2013, combining Dell, EMC and VMware
    in 2016, and returning Dell Technologies to the public markets in 2018.
  source_ids: [dell-bio, dell-leadership]
