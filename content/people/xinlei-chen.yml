sections:
  - heading: Career
    paragraphs:
      - text: >-
          Xinlei Chen received a PhD from the Language Technologies Institute at Carnegie Mellon
          University while working at the Robotics Institute, where Chen's projects included the Never Ending Image Learner, web-scale
          ConvNet training, and object and sense discovery.
        source_ids: [homepage]
      - text: >-
          Chen then became a research scientist at Meta FAIR, working on pre-training and
          understanding visual representations, and later a Member of Technical Staff at xAI working
          on multimodal understanding and generation. Chen's site says Chen is now at OpenAI,
          contributing to its multimodal work.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Chen was first author of "Microsoft COCO Captions: Data Collection and Evaluation Server"
          (2015), which describes the caption annotations and evaluation server for the COCO dataset.
          Chen's work with Kaiming He on self-supervised learning includes MoCo v2
          (2020), which improved baselines for momentum contrastive learning; SimSiam (2020), a simple
          Siamese method that learns representations without negative pairs; and a 2021 empirical
          study of training self-supervised Vision Transformers that benchmarks MoCo v3.
        source_ids: [coco-captions-paper, mocov2-paper, simsiam-paper, ssl-vit-paper]
      - text: >-
          Chen co-authored Masked Autoencoders (2021), which pre-train Vision Transformers by
          reconstructing masked image patches, and was first author of "Deconstructing Denoising
          Diffusion Models for Self-Supervised Learning" (2024), which studies the representation
          learning abilities of diffusion models.
        source_ids: [mae-paper, ddae-paper]
