headline: Contributes to multimodal work at OpenAI; formerly at xAI and Meta FAIR; first author of SimSiam
bio:
  text: >-
    Xinlei Chen's site says Chen is at OpenAI, contributing to its multimodal work, after serving as a
    Member of Technical Staff at xAI on multimodal understanding and generation and as a Research
    Scientist at Meta FAIR working on pre-training and understanding visual representations. Chen is
    first author, with Kaiming He, of the 2020 SimSiam paper on simple Siamese representation
    learning, first author of a 2021 study of training self-supervised Vision Transformers that
    benchmarks MoCo v3, and a co-author of Masked Autoencoders (MAE).
  source_ids: [homepage, simsiam-paper, ssl-vit-paper, mae-paper]
