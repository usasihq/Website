headline: MIT associate professor in EECS; first author of pix2pix and co-author of Foundations of Computer Vision
bio:
  text: >-
    Phillip Isola is an associate professor in EECS at MIT and a member of CSAIL, where Isola's group
    studies fundamental principles of intelligence, including how different models come to learn
    similar representations. Isola is first author of "Image-to-Image Translation with Conditional
    Adversarial Networks" (the pix2pix paper), whose code is released under a BSD-style license.
    Isola co-wrote the textbook Foundations of Computer Vision with Antonio Torralba and William
    Freeman, which is freely readable online, and is listed as an instructor of the Fall 2024 offering of MIT's
    grad-level deep learning course 6.7960, published on MIT OpenCourseWare. Isola's MIT bio notes earlier time at UC Berkeley, OpenAI,
    and Google Research.
