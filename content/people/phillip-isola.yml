sections:
  - heading: Career
    paragraphs:
      - text: >-
          Isola completed a PhD in Brain and Cognitive Sciences at MIT and then spent time at UC Berkeley, OpenAI
          and Google Research. Isola is now an
          associate professor in MIT's Department of Electrical Engineering and Computer Science and a member of
          CSAIL, teaching courses on deep learning, computer vision and robotics.
        source_ids: [isola-site, isola-bio]
  - heading: Research
    paragraphs:
      - text: >-
          Isola's MIT biography notes that the work has particularly shaped generative AI and self-supervised
          representation learning. With Alexei Efros and others, Isola co-authored "Colorful Image
          Colorization" (2016), was first author of the pix2pix paper on image-to-image translation with
          conditional adversarial networks, and co-authored CycleGAN (2017), which learns translations between
          image domains without paired examples. The 2018 LPIPS paper showed that deep network features work well
          as a perceptual similarity metric.
        source_ids: [isola-bio, colorization-paper, pix2pix-paper, pix2pix-license, cyclegan-paper, lpips-paper]
      - text: >-
          Isola's later work studies representation learning. Contrastive Multiview Coding (2019) learns
          representations by contrasting different views of the same scene, and a 2020 paper with Tongzhou Wang
          explained contrastive learning in terms of alignment and uniformity on the hypersphere. "The Platonic
          Representation Hypothesis" (2024) argues that representations in AI models are converging across
          architectures and modalities.
        source_ids: [cmc-paper, alignment-uniformity-paper, platonic-paper]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          With Antonio Torralba and William Freeman, Isola wrote the textbook Foundations of Computer Vision, which
          is freely available online. Isola is an instructor of MIT's graduate deep learning course 6.7960, whose
          Fall 2024 offering is published on MIT OpenCourseWare, and has received the Ruth and Joel Spira Award
          for Distinguished Teaching.
        source_ids: [visionbook, ocw-67960, isola-bio]
