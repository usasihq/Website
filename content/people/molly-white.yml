headline: Researcher and writer of Citation Needed, an independent newsletter on crypto, technology and tech policy
bio:
  text: >-
    Molly White is a researcher, software engineer, and writer who publishes Citation Needed, an
    independent newsletter with reporting and analysis on cryptocurrency, technology, and tech policy.
    The newsletter includes roundups of developments, analysis of regulatory and industry news, and
    longer essays. Molly also runs Web3 is Going Just Great, a site documenting failures in
    cryptocurrency and web3 projects, and has bylines in The New York Times, The Guardian, and Bloomberg
    Businessweek.
