sections:
  - heading: Career
    paragraphs:
      - text: >-
          White worked at HubSpot from 2014 to 2022, starting as a software engineering co-op and becoming a
          software engineer and then senior software engineer. From November 2017 to May 2022 White was a tech
          lead for several teams working on HubSpot's developer platform and tooling, mentoring engineers from
          intern to senior level.
        source_ids: [mw2-resume]
      - text: >-
          Since December 2021 White has worked independently as a researcher and writer. From November 2022 to
          October 2023 White was a fellow at the Harvard University Library Innovation Lab, continuing research on
          cryptocurrency and blockchain industries along with online governance, digital identity and the future
          of the web.
        source_ids: [mw2-resume]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          White writes Citation Needed, an independent publication covering the cryptocurrency industry and the
          wider technology world, and founded and maintains Web3 is Going Just Great, which catalogs cases where
          cryptocurrency and web3 projects fall short of their promises. White's freelance bylines include The New
          York Times, The Guardian, Rolling Stone and Bloomberg Businessweek.
        source_ids: [mw2-resume, site, citation]
      - text: >-
          White has spoken at conferences including South by Southwest and Web Summit and has given guest
          lectures at universities including Stanford, Harvard and MIT.
        source_ids: [site, mw2-resume]
