headline: NYU professor of computer science and data science; co-author of the RNN encoder-decoder and attention papers
bio:
  text: >-
    Kyunghyun Cho is the Glen de Vries Professor of Health Statistics and a professor of computer
    science and data science at New York University, where Cho co-directs the Global Frontier AI Lab
    with Yann LeCun, and is a co-founder and CEO of Ortet. Cho was a research scientist at Facebook AI
    Research from June 2017 to May 2020, co-founded Prescient Design in early 2021, and served at
    Genentech as Executive Director of Frontier Research and a Senior Fellow until January 2026. Cho is
    first author of the 2014 paper proposing the RNN Encoder-Decoder for statistical machine
    translation and a co-author, with Dzmitry Bahdanau and Yoshua Bengio, of Neural Machine
    Translation by Jointly Learning to Align and Translate. Cho was a founding Editor-in-Chief of
    Transactions on Machine Learning Research until 2024.
  source_ids: [cho-site, encdec-paper, attention-paper]
  reviewed_at: 2026-10-21
