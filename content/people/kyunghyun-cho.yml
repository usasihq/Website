sections:
  - heading: Career
    paragraphs:
      - text: >-
          Cho earned MSc and DSc degrees at Aalto University in 2011 and 2014, supervised by Juha Karhunen, Tapani
          Raiko and Alexander Ilin, with a doctoral thesis titled "Foundations and Advances in Deep Learning".
          Cho was then a postdoctoral fellow at the University of Montreal under Yoshua Bengio until summer 2015,
          before joining New York University.
        source_ids: [cho-site]
      - text: >-
          From June 2017 to May 2020 Cho was also a research scientist at Facebook AI Research. In early 2021 Cho
          co-founded Prescient Design, which Genentech acquired later that year, and served at Genentech as
          Executive Director of Frontier Research and a Senior Fellow until January 2026. Cho is now co-founder
          and CEO of Ortet and co-directs NYU's Global Frontier AI Lab with Yann LeCun.
        source_ids: [cho-site]
  - heading: Research
    paragraphs:
      - text: >-
          In 2014 Cho published several papers on neural machine translation. As first author, Cho proposed the RNN
          Encoder-Decoder for learning phrase representations, and a companion paper studied the properties of
          neural machine translation with encoder-decoder models. With Dzmitry Bahdanau and Yoshua Bengio, Cho
          co-authored the paper that introduced jointly learning to align and translate, in which the model
          learns to soft-search for the parts of a source sentence relevant to predicting each target word.
        source_ids: [encdec-paper, nmt-properties-paper, attention-paper]
      - text: >-
          Cho co-authored "Show, Attend and Tell" (2015), which applied visual attention to generating image
          captions, and in 2015 posted lecture notes for the NYU Center for Data Science course on natural language understanding with distributed representations.
        source_ids: [show-attend-tell-paper, nlu-lecture-notes]
  - heading: Service
    paragraphs:
      - text: >-
          Cho served as a program chair or co-chair of ICLR 2020, ICML 2022 and NeurIPS 2022, and on the boards of
          ICML and ICLR. Cho was one of three founding Editors-in-Chief of Transactions on Machine Learning
          Research, serving until 2024.
        source_ids: [cho-site]
