    artifact_slug: null
    url: https://arxiv.org/abs/2408.14906
    contribution: >-
      Co-author of a 2024 paper introducing Writing in the Margins, an inference pattern that
      processes long inputs in chunks and generates intermediate notes to guide a model toward the
      relevant information.
    source_ids: [wim-paper]
  - name: Palmyra model family
    artifact_slug: palmyra
