sections:
  - heading: Career
    paragraphs:
      - text: >-
          AlShikh and May Habib began working together in 2013, when they started a company to
          localize enterprise content dynamically using machine translation. Their experiments with
          transformer models led them to launch WRITER in 2020, where AlShikh is CTO.
        source_ids: [writer-company]
  - heading: Research
    paragraphs:
      - text: >-
          AlShikh is the last-listed author of Writing in the Margins, a 2024 paper
          on a chunked prefill approach for long-context retrieval. The method adds "margin" notes
          generated for each chunk and uses them to steer the final answer.
        source_ids: [wim-paper]
      - text: >-
          WRITER's flagship model today, Palmyra X6, is the default model across the WRITER
          platform and is built for long-running agentic work; the company says it can hold one
          goal for hours.
        source_ids: [writer-models]
