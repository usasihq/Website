headline: Co-founder and CTO of WRITER, developer of the Palmyra large language models
bio:
  text: >-
    Waseem AlShikh is a co-founder and the Chief Technology Officer of WRITER, an enterprise
    generative AI company that trains its own Palmyra family of large language models. AlShikh
    co-founded WRITER with May Habib in 2020 and co-authored a 2024 paper on long-context
    inference.
  source_ids: [writer-company, wim-paper]
  reviewed_at: 2026-10-21
