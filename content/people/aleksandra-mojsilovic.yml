headline: Led Trustworthy Machine Intelligence at IBM Research; co-author of AI Fairness 360, AIX360 and 
  FactSheets
bio:
  text: >-
    Aleksandra (Saška) Mojsilović joined IBM in 2000, and an IBM Research profile from February
    2023 described Mojsilović as head of Trustworthy Machine Intelligence and an IBM Fellow, named in 2014
    for work that laid the foundation for IBM's data science business. Mojsilović is a co-author of the papers introducing
    AI Fairness 360, an open-source
    Apache-2.0 toolkit for detecting and mitigating bias in machine learning, and AI Explainability 360,
    as well as the FactSheets proposal for documenting AI services. IBM Research credits these tools to
    its Science for Social Good program, which Mojsilović launched with Kush Varshney.
  source_ids: [ibm-blog-profile, ibm-aif360-blog, aif360-paper, aix360-paper, factsheets-paper, aif360-repo]
  reviewed_at: 2026-10-21
affiliations:
  - name: IBM Research
    organization_slug: ibm
    role: Head of Trustworthy Machine Intelligence and IBM Fellow (as described by IBM Research in February 
      2023)
    current: false
    source_ids: [ibm-blog-profile]
work:
  - name: AI Fairness 360
    artifact_slug:
    type: open-source
    url: https://github.com/Trusted-AI/AIF360
    contribution: >-
      Co-author of "AI Fairness 360: An Extensible Toolkit for Detecting, Understanding, and Mitigating
      Unwanted Algorithmic Bias" (2018), which introduces the toolkit released under the Apache v2.0
      license. IBM Research's 2023 profile says Mojsilović and team urged IBM in 2017 to develop
      bias-mitigation software, and the toolkit was released a year later; IBM Research's 2018 AI Fairness
      360 announcement lists Saška Mojsilović among the AIF360 team members.
    source_ids: [aif360-paper, aif360-repo, ibm-blog-profile, ibm-aif360-blog]
  - name: AI Explainability 360 and FactSheets
    artifact_slug:
    type: open-research
    url: https://arxiv.org/abs/1909.03012
    contribution: >-
      Co-author of "One Explanation Does Not Fit All: A Toolkit and Taxonomy of AI Explainability
      Techniques" (2019), which introduces the open-source AI Explainability 360 toolkit, and of
      "FactSheets: Increasing Trust in AI Services through Supplier's Declarations of Conformity" (2018).
    source_ids: [aix360-paper, factsheets-paper]
links: []
sections:
  - heading: Career
    paragraphs:
      - text: >-
          Mojsilović spent two years at Bell Labs before joining IBM Research in 2000. In what was then IBM's
          mathematics department, Mojsilović built models that combined public digital information with
          internal data to support business decisions such as sales deployment and outsourcing, work now
          described as data science.
        source_ids: [ibm-blog-profile]
      - text: >-
          That work led to Mojsilović being named an IBM Fellow in 2014. Mojsilović later joined IBM
          Research's AI team to focus on trustworthiness and fairness, and IBM Research's February 2023 profile
          described Mojsilović as head of Trustworthy Machine Intelligence, with newer work extending into AI
          for drug discovery.
        source_ids: [ibm-blog-profile]
  - heading: Trustworthy AI
    paragraphs:
      - text: >-
          With Kush Varshney, Mojsilović launched IBM's Science for Social Good program, from which IBM
          Research says its trustworthy AI tools emerged. In 2017 Mojsilović and team urged IBM to develop
          bias-mitigation software, and in September 2018 IBM Research released AI Fairness 360, an
          open-source toolkit of fairness metrics and bias-mitigation algorithms, listing Mojsilović among its
          team members.
        source_ids: [ibm-blog-profile, ibm-aif360-blog, aif360-paper]
      - text: >-
          Mojsilović also co-authored the 2018 FactSheets proposal, which calls for supplier's declarations of
          conformity to document AI services, and the 2019 paper introducing the AI Explainability 360 toolkit
          and a taxonomy of explainability techniques.
        source_ids: [factsheets-paper, aix360-paper]
