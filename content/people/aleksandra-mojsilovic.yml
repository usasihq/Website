headline: Led Trustworthy Machine Intelligence at IBM Research; co-author of AI Fairness 360, AIX360 and FactSheets
bio:
  text: >-
    Aleksandra (Saška) Mojsilović joined IBM in 2000, and an IBM Research profile from February
    2023 described Mojsilović as head of Trustworthy Machine Intelligence and an IBM Fellow, named in 2014
    for work that laid the foundation for IBM's data science business. Mojsilović is a co-author of the papers introducing AI Fairness 360, an open-source
    Apache-2.0 toolkit for detecting and mitigating bias in machine learning, and AI Explainability 360,
    as well as the FactSheets proposal for documenting AI services. IBM Research credits these tools to
    its Science for Social Good program, which Mojsilović launched with Kush Varshney.
  source_ids: [ibm-blog-profile, ibm-aif360-blog, aif360-paper, aix360-paper, factsheets-paper, aif360-repo]
  reviewed_at: 2026-10-13
