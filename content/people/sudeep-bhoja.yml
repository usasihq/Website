headline: Co-founder and CTO of d-Matrix, developer of in-memory compute and 3D DRAM inference hardware
bio:
  text: >-
    Sudeep Bhoja is a co-founder and the Chief Technology Officer of d-Matrix, which builds
    memory-centric hardware for AI inference. Bhoja has written about the company's 3D stacked
    digital in-memory compute (3DIMC) roadmap and previewed its 3D DRAM technology at the 2026 Hot
    Chips conference.
  source_ids: [dm-about, dm-3dimc, dm-nvidia]
  reviewed_at: 2026-10-21
