headline: President and board member of the ARC Prize Foundation; author of the ARC-AGI-2 and ARC-AGI-3 launch posts
bio:
  text: >-
    Greg Kamradt is the President and a board member of the ARC Prize Foundation, the non-profit that
    develops the ARC-AGI benchmarks and runs the ARC Prize competitions. Kamradt wrote the
    foundation's announcements of ARC-AGI-2 and ARC Prize 2025 (March 2025) and of ARC-AGI-3 (March
    2026), and is a co-author of the ARC Prize 2024 technical report and the ARC-AGI-2 paper. Kamradt's
    own site describes working to measure and advance progress toward AGI.
  source_ids: [arc-about, arc-agi-2-announce, arc-agi-3-launch, arc-2024-report, arc-agi-2-paper, kamradt-site]
  reviewed_at: 2026-10-22
