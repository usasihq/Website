sections:
  - heading: ARC Prize Foundation
    paragraphs:
      - text: >-
          The ARC Prize Foundation's about page lists Kamradt as President and board member, alongside
          co-founders François Chollet and Mike Knoop. Kamradt co-authored the ARC Prize 2024 technical report
          with Chollet, Knoop and Bryan Landers, and the 2025 ARC-AGI-2 paper with the same authors and Henry
          Pinkard.
        source_ids: [arc-about, arc-2024-report, arc-agi-2-paper]
      - text: >-
          Kamradt wrote the March 2025 post announcing ARC-AGI-2 and ARC Prize 2025, the August 2025 summary of
          learnings from the ARC-AGI-3 preview, the November 2025 announcement of the ARC Prize Verified program
          and the March 2026 launch of ARC-AGI-3, an interactive benchmark for agentic intelligence. Kamradt also
          wrote the foundation's September 2026 post on the results of OpenAI's GPT-6 Astra on ARC-AGI-3.
        source_ids: [arc-agi-2-announce, arc-agi-3-preview, arc-verified, arc-agi-3-launch, arc-astra]
