headline: First author of Denoising Diffusion Probabilistic Models (DDPM) and of Classifier-Free Diffusion Guidance
bio:
  text: >-
    Jonathan Ho is first author of "Denoising Diffusion Probabilistic Models" (DDPM, NeurIPS 2020),
    written with Ajay Jain and Pieter Abbeel, all three listed with UC Berkeley on the paper's project
    page. With Tim Salimans, Ho wrote "Classifier-Free Diffusion Guidance" (2022).
    Ho is a co-first author of Imagen Video, a text-to-video system of cascaded video diffusion models
    presented by Google Research's Brain Team, and a co-author of Imagen and of "Variational Diffusion
    Models" with Diederik P. Kingma, Tim Salimans, and Ben Poole.
