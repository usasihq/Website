sections:
  - heading: Research
    paragraphs:
      - text: >-
          Ho's early generative modeling papers were written with Pieter Abbeel, with DDPM listing its authors at UC Berkeley. Flow++ (2019)
          improved flow-based generative models with variational dequantization and new architecture choices,
          and "Denoising Diffusion Probabilistic Models" (2020), with Ajay Jain and Abbeel, showed
          high-quality image synthesis with diffusion models and drew connections to denoising score matching
          and Langevin dynamics.
        source_ids: [flowpp-paper, ddpm-paper, ddpm-project]
      - text: >-
          Ho's later papers, several written with Tim Salimans, extended diffusion models
          to higher resolutions and new modalities. Cascaded Diffusion Models (2021) chained diffusion models
          to generate high-fidelity images, "Video Diffusion Models" (2022) applied the approach to video, and
          "Classifier-Free Diffusion Guidance" (2022) showed that conditional and unconditional diffusion models
          can be combined to steer generation without a separate classifier.
        source_ids: [cascaded-paper, video-diffusion-paper, cfg-paper]
  - heading: Text-to-image and video systems
    paragraphs:
      - text: >-
          Ho co-authored Imagen (2022), a text-to-image diffusion model that uses a large pretrained language
          model to encode text for image synthesis, and is listed first among the equal-contribution authors of Imagen
          Video, which Google Research's Brain Team presented as a cascade of video diffusion models for
          text-conditional video generation.
        source_ids: [imagen-paper, imagen-video]
