headline: Chief Technology Officer at Anthropic; previously CTO of Stripe
bio:
  text: >-
    Rahul Patil is Chief Technology Officer at Anthropic, which announced the appointment on October 7,
    2025. Anthropic's leadership page says Patil leads the engineering organization across inference,
    product, infrastructure, and security. Before Anthropic, Patil served as CTO of Stripe, and earlier
    held senior engineering leadership roles at Oracle Cloud Infrastructure, Amazon Web Services, and
    Microsoft, according to Anthropic.
