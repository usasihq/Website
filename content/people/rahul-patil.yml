sections:
  - heading: Career
    paragraphs:
      - text: >-
          Patil has more than 20 years of experience building infrastructure for large technology platforms.
          Patil held senior engineering leadership roles at Microsoft, Amazon Web Services and Oracle Cloud
          Infrastructure, working on reliable, scalable systems, and then served as CTO of Stripe, leading its
          technical organization.
        source_ids: [anthropic-cto-news, anthropic-leadership]
  - heading: Anthropic
    paragraphs:
      - text: >-
          Anthropic announced on October 7, 2025 that Patil had joined as Chief Technology Officer, overseeing
          engineering across product, compute, infrastructure, inference, data science and security; in the
          same change, co-founder and former CTO Sam McCandlish became Chief Architect. In January 2026
          Anthropic said Ami Vora would lead its Product organization in close partnership with Patil to
          scale Claude products.
        source_ids: [anthropic-cto-news, anthropic-labs]
