sections:
  - heading: Career
    paragraphs:
      - text: >-
          Lechner received bachelor's (2016) and master's (2017) degrees in computer science from the Vienna
          University of Technology (TU Wien), and completed a PhD at the Institute of Science and Technology
          Austria (ISTA) in 2022, supervised by Tom Henzinger. Lechner became a research affiliate at MIT CSAIL,
          collaborating with Daniela Rus.
        source_ids: [lechner-site, liquid-team]
      - text: >-
          Lechner co-founded Liquid AI with Ramin Hasani, Alexander Amini and Daniela Rus, and serves as its
          CTO. Lechner's page states that the company builds and releases LFM2 language models designed to
          run efficiently on CPUs and edge devices.
        source_ids: [liquid-about, liquid-team, lechner-site]
  - heading: Research
    paragraphs:
      - text: >-
          With Hasani, Lechner co-authored the 2020 papers on liquid time-constant networks and neural circuit
          policies, and the follow-up work on closed-form continuous-time models. Lechner's publication list
          also covers safety verification of stochastic and neural control systems, robot learning and
          multi-agent reinforcement learning.
        source_ids: [ltc-paper, ncp-paper, cfc-paper, lechner-site]
