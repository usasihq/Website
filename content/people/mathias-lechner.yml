headline: Co-founder and CTO of Liquid AI; first author of the Neural Circuit Policies paper
bio:
  text: >-
    Mathias Lechner is a co-founder and the CTO of Liquid AI and a research affiliate at MIT CSAIL, where
    Lechner works with Daniela Rus. Lechner's personal page describes Liquid AI as a company founded in
    2023 to build efficient foundation models, including the LFM2 language models. Lechner's research
    covers robust and trustworthy machine learning, liquid neural networks and the verification of
    learned controllers.
  source_ids: [lechner-site, liquid-team, liquid-about]
  reviewed_at: 2026-10-22
