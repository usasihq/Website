headline: Co-founder of Character.AI; led the development of the Meena and LaMDA dialog models at Google
bio:
  text: >-
    Daniel De Freitas co-founded Character.AI with Noam Shazeer; the company's December 2022 launch
    post, signed by both, says De Freitas invented and led the development of the Meena and LaMDA
    dialog systems. De Freitas is a co-author of LaMDA: Language Models for Dialog Applications
    (2022), which presents Transformer-based language models specialized for dialog, with up to 137B
    parameters, and reports that fine-tuning with annotated data and letting the model consult
    external knowledge sources improve safety and factual grounding; a footnote on De Freitas's name
    says the work was done while at Google.
  source_ids: [character-launch, lamda-paper]
  reviewed_at: 2026-10-21
