sections:
  - heading: Research
    paragraphs:
      - text: >-
          Character.AI's launch post credits Daniel De Freitas with inventing and leading the development
          of the Meena and LaMDA dialog systems at Google. De Freitas is the second-listed author of the
          January 2022 paper LaMDA: Language Models for Dialog Applications, which describes a family of
          Transformer-based dialog models pre-trained on public dialog data and web text.
        source_ids: [character-launch, lamda-paper]
      - text: >-
          The LaMDA paper reports that scaling the model alone did less for safety and factual grounding
          than for quality, and that fine-tuning with annotated data and letting the model consult
          external knowledge sources improved both. It measures safety against an illustrative set of
          human values and uses a LaMDA classifier to filter candidate responses.
        source_ids: [lamda-paper]
  - heading: Character.AI
    paragraphs:
      - text: >-
          De Freitas co-founded Character.AI with Noam Shazeer. The December 2022 post introducing the
          company, signed by both co-founders and the Character team, describes a product for creating
          and chatting with AI characters and says the beta had launched that September.
        source_ids: [character-launch]
