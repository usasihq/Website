sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kohli was formerly Director of Research for the Cognition group at Microsoft Research. At Google
          DeepMind, Kohli is a Vice President and leads the AI for Science and Strategic Initiatives Unit, whose
          work spans biology, materials, fusion, mathematics, software and cybersecurity. Google also names Kohli
          as Chief Scientist of Google Cloud.
        source_ids: [kohli-author, india-2026]
  - heading: Research
    paragraphs:
      - text: >-
          Kohli is a co-author of the 2021 Nature paper describing AlphaFold's highly accurate protein structure
          prediction. With colleagues at Google DeepMind, Kohli also co-authored FunSearch, published in Nature in
          December 2023, which paired a large language model with an evaluator to search for programs that
          yield new mathematical results.
        source_ids: [alphafold-paper, pk-funsearch]
      - text: >-
          Google lists the 2025 AI co-scientist among Kohli's key work, a multi-agent system built on Gemini
          to help scientists generate research hypotheses, along with AlphaEvolve, an evolutionary coding agent that
          uses language models to improve algorithms for open scientific problems and computing infrastructure.
        source_ids: [kohli-author, pk-coscientist, pk-alphaevolve]
