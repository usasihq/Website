headline: Vice President at Google DeepMind and Chief Scientist of Google Cloud; AlphaFold co-author
bio:
  text: >-
    Pushmeet Kohli is Vice President at Google DeepMind and Chief Scientist of Google Cloud. Google's author
    page says Kohli leads Google DeepMind's AI for Science and Strategic Initiatives Unit, whose work spans
    biology, materials, fusion, math, software and cybersecurity, and lists AlphaFold, AlphaEvolve and AI
    co-scientist among Kohli's key work. Kohli is a co-author of the 2021 Nature paper Highly accurate protein
    structure prediction with AlphaFold. Before Google DeepMind, Kohli was Director of Research for the
    Cognition group at Microsoft Research.
  source_ids: [kohli-author, alphafold-paper]
  reviewed_at: 2026-10-21
