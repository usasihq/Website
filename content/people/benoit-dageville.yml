sections:
  - heading: Career
    paragraphs:
      - text: >-
          Dageville worked at Oracle for more than 16 years, as a lead architect for parallel execution in
          Oracle RAC and a key architect in the SQL Manageability group. Snowflake's leadership page describes
          Dageville as an expert in parallel database systems.
        source_ids: [snowflake-leadership]
      - text: >-
          Dageville co-founded Snowflake and later served as its President of Products. After retiring from
          that role, Dageville continues as a member of the board and a strategic advisor.
        source_ids: [snowflake-leadership]
  - heading: Research
    paragraphs:
      - text: >-
          Dageville is first author of "The Snowflake Elastic Data Warehouse", published in the proceedings of
          the 2016 International Conference on Management of Data (SIGMOD) with Thierry Cruanes, Marcin
          Zukowski and fifteen other co-authors.
        source_ids: [sigmod-2016]
