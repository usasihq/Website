headline: Co-founder of Snowflake, board member and strategic advisor; former President of Products
bio:
  text: >-
    Benoit Dageville is a co-founder of Snowflake, where Dageville serves as a board member and strategic
    advisor after retiring as President of Products. Before Snowflake, Dageville spent more than 16 years at
    Oracle as a lead architect for parallel execution in Oracle RAC and a key architect in the SQL
    Manageability group.
