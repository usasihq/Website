sections:
  - heading: Career
    paragraphs:
      - text: >-
          Tan's earlier roles include Vice President of Finance at Commodore International from 1992 to 1994
          and senior management positions at PepsiCo and General Motors. At Integrated Circuit Systems, a
          publicly traded timing-solutions chip company, Tan was Senior Vice President and CFO from 1995,
          Chief Operating Officer from 1996, and President and CEO from 1999 until the company was acquired in
          2005.
        source_ids: [broadcom-10k-fy2025]
      - text: >-
          Tan has been President and CEO of Broadcom since March 2006 and also serves on its board. Broadcom's
          10-K for fiscal 2025, which lists its executive officers as of December 18, 2025, also notes Tan's
          membership since 2020 of the President's National Security and Telecommunications Advisory
          Committee.
        source_ids: [broadcom-10k-fy2025]
  - heading: Broadcom and AI
    paragraphs:
      - text: >-
          In the press release for Broadcom's third quarter of fiscal 2026, published as an exhibit to a
          September 2026 SEC filing, Tan is quoted as President and CEO describing continued strong demand for
          the company's custom AI accelerators and networking.
        source_ids: [broadcom-q3-fy2026]
