headline: President and CEO of Broadcom since March 2006; previously President and CEO of Integrated Circuit Systems
bio:
  text: >-
    Hock E. Tan is the President and Chief Executive Officer of Broadcom Inc., a role Broadcom's
    annual report says Tan has held since March 2006, and is also a director of the company. In Broadcom's September
    2026 quarterly results, Tan described demand for the company's custom AI accelerators and
    networking products. Before Broadcom, Tan was President and CEO of Integrated Circuit Systems from
    1999 until its acquisition by Integrated Device Technology in 2005, and Tan has served on the
    President's National Security and Telecommunications Advisory Committee since 2020.
  source_ids: [broadcom-10k-fy2025, broadcom-q3-fy2026]
  reviewed_at: 2026-10-22
