headline: Head of Carnegie Mellon's Machine Learning Department; chairs OpenAI's Safety and Security Committee
bio:
  text: >-
    Zico Kolter is a Professor and Department Head of the Machine Learning Department at Carnegie
    Mellon University. Kolter serves on the Board of OpenAI, where Kolter chairs the Safety and
    Security Committee, and on the Board of Qualcomm, and is a co-founder and Chief Scientist of Gray
    Swan AI, an AI security company. Kolter's group works on making deep learning more robust and safer
    and on understanding how data affects how models function. Kolter is a co-author of the 2023 paper
    "Universal and Transferable Adversarial Attacks on Aligned Language Models," which generates
    adversarial prompt suffixes automatically and releases its code.
  source_ids: [kolter-bio, kolter-home, gcg-paper]
  reviewed_at: 2026-10-21
