sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kolter earned a PhD in computer science at Stanford University and completed a postdoctoral
          fellowship at MIT before joining Carnegie Mellon's School of Computer Science. Before becoming
          department head, Kolter was an associate professor in CMU's Computer Science Department with
          affiliations in Software and Societal Systems, the Robotics Institute, and Electrical and Computer
          Engineering, and also served in industry roles including chief scientist of AI research at Bosch.
        source_ids: [cmu-mld-head]
      - text: >-
          Kolter became head of CMU's Machine Learning Department effective June 15, 2024, as its sixth
          department head, succeeding Roni Rosenfeld. Kolter also sits on the boards of OpenAI, where Kolter
          chairs the Safety and Security Committee, and Qualcomm, co-founded the AI security company Gray Swan
          AI as Chief Scientist, and advises BNY.
        source_ids: [cmu-mld-head, kolter-bio]
  - heading: Research
    paragraphs:
      - text: >-
          Kolter's research spans machine learning, optimization, and control, with a focus on making deep
          learning safer, more robust, and more modular. Work from the group includes certified defenses
          against adversarial examples, such as the 2017 convex outer adversarial polytope method with Eric
          Wong and randomized smoothing with Jeremy Cohen and Elan Rosenfeld in 2019.
        source_ids: [cmu-mld-head, kolter-home, wong-paper, smoothing-paper]
      - text: >-
          The group has also built optimization solvers and other modules into deep architectures, as in
          OptNet with Brandon Amos and Deep Equilibrium Models with Shaojie Bai and Vladlen Koltun. More
          recent work covers LLM security, including automatically generated adversarial suffixes that bypass
          model safeguards, and how training data shapes model behavior, including definitions of memorization.
        source_ids: [kolter-home, optnet-paper, deq-paper, gcg-paper, cmu-mld-head]
  - heading: Teaching
    paragraphs:
      - text: >-
          At CMU, Kolter teaches Graduate Artificial Intelligence (15-780) and Deep Learning Systems:
          Algorithms and Implementation (10-714), and has taught Practical Data Science and a course on
          computational methods for the smart grid. Kolter has also given tutorials on adversarial robustness
          (NeurIPS 2018) and implicit layers (NeurIPS 2020).
        source_ids: [kolter-courses]
