sections:
  - heading: Career
    paragraphs:
      - text: >-
          Christopher Manning earned a PhD in linguistics at Stanford in 1994, then taught in the Computational
          Linguistics Program at Carnegie Mellon University from 1994 to 1996 and in the Department of
          Linguistics at the University of Sydney from 1996 to 1999. Manning returned to Stanford in 1999 as an
          assistant professor of computer science and linguistics, became associate professor in 2006 and full
          professor in 2012, and has held the Thomas M. Siebel Professorship in Machine Learning since 2017.
        source_ids: [manning-site]
      - text: >-
          Manning founded the Stanford NLP Group, is a co-founder and Senior Fellow of the Stanford Institute for
          Human-Centered Artificial Intelligence, and served as President of the Association for Computational
          Linguistics in 2015.
        source_ids: [manning-site]
  - heading: Research
    paragraphs:
      - text: >-
          Manning's earlier work built empirical, probabilistic approaches to natural language processing,
          including natural language inference, syntactic parsing, machine translation and multilingual
          processing. From 2010 the work turned to neural networks for language understanding, covering
          sentiment analysis, paraphrase detection, attention, neural machine translation, question answering,
          self-supervised pre-training and dependency parsing.
        source_ids: [manning-site]
      - text: >-
          With Jeffrey Pennington and Richard Socher, Manning introduced the GloVe word vectors at EMNLP 2014.
          In linguistics, Manning is a principal developer of Stanford Dependencies and Universal Dependencies,
          and current topics include compositionality, large pre-trained language models, knowledge and
          reasoning, and low-resource languages.
        source_ids: [glove-paper, manning-site]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Manning co-wrote the textbooks Foundations of Statistical Natural Language Processing (MIT Press, 1999)
          with Hinrich Schütze and Introduction to Information Retrieval (Cambridge University Press, 2008) with
          Prabhakar Raghavan and Schütze, along with monographs on ergativity and complex predicates. Manning
          taught CS 276, Information Retrieval and Web Search, from 2003 through 2019, and co-taught the 2012
          Coursera NLP class with Dan Jurafsky.
        source_ids: [manning-site]
      - text: >-
          Manning has long released open-source NLP software through the Stanford NLP Group, including Stanford
          CoreNLP and the Apache-2.0 licensed Python library Stanza, whose ACL 2020 system paper Manning
          co-authored.
        source_ids: [manning-site, stanza-repo]
