headline: Stanford professor of linguistics and computer science; co-author of GloVe and the Stanza NLP library
bio:
  text: >-
    Christopher Manning is the Thomas M. Siebel Professor in Machine Learning in the Departments of
    Linguistics and Computer Science at Stanford University, where Manning founded the Stanford NLP
    Group, and a co-founder and Senior Fellow of the Stanford Institute for Human-Centered Artificial
    Intelligence (HAI). Manning's homepage describes research on neural natural language
    understanding, including the GloVe word vectors, attention, neural machine translation, question
    answering, and dependency parsing, as well as work as a principal developer of Universal
    Dependencies. Manning co-authored textbooks on statistical NLP and information retrieval, taught
    CS224N, Natural Language Processing with Deep Learning, nearly every year from 2000 to 2024, and
    co-authored the Stanza paper for the Stanford NLP Group's Apache-2.0 Python library. Manning held
    faculty positions at Carnegie Mellon University and the University of Sydney before returning to
    Stanford.
  source_ids: [manning-site, glove-paper, stanza-repo]
  reviewed_at: 2026-10-13
