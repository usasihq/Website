sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Dzhulgakov was a core maintainer of PyTorch while at Meta, and PyTorch's maintainers page now lists
          Dzhulgakov with emeritus status both among the core maintainers and among the maintainers of C10
          utilities and operator dispatch.
        source_ids: [pytorch-maintainers, fireworks-team]
  - heading: Research
    paragraphs:
      - text: >-
          Dzhulgakov co-authored two papers on running deep learning at production scale. A 2018
          paper characterized deep learning inference workloads in Facebook's data centers and discussed
          performance optimizations and hardware implications, and the 2019 paper on the Deep Learning
          Recommendation Model (DLRM) described a recommendation model with implementations in
          PyTorch and Caffe2 and a parallelization scheme for its embedding tables.
        source_ids: [fb-inference-paper, dlrm-paper]
  - heading: Fireworks AI
    paragraphs:
      - text: >-
          Dzhulgakov is one of the co-founders of Fireworks AI. The company's team page lists the co-founders
          with their previous roles, describing Dzhulgakov's as PyTorch core maintainer at Meta.
        source_ids: [fireworks-team]
timeline:
