    contribution: >-
      Listed on PyTorch's maintainers page as an emeritus core maintainer and an emeritus
      maintainer of C10 utils and operator dispatch; Fireworks AI's team page describes Dzhulgakov
      as previously a PyTorch core maintainer at Meta. The repository is under a BSD-style license.
    source_ids: [pytorch-maintainers, fireworks-team, pytorch-license]
