headline: Co-founder of Fireworks AI; previously a PyTorch core maintainer at Meta
bio:
  text: >-
    Dmytro Dzhulgakov is a co-founder of Fireworks AI, whose team page notes that Dzhulgakov was
    previously a PyTorch core maintainer at Meta. PyTorch's maintainers page lists Dzhulgakov as an
    emeritus core maintainer and as an emeritus maintainer of PyTorch's C10 utilities and operator
    dispatch.
