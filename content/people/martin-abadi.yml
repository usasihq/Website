headline: At Google since 2014; first author of the TensorFlow papers; emeritus at UC Santa Cruz
bio:
  text: >-
    Martín Abadi has been at Google since November 2014, according to Google's research profile, and is
    emeritus at UC Santa Cruz. Abadi is the first author of the TensorFlow white paper, which describes
    the system built at Google and its open-source release under the Apache 2.0 license, and of the 2016
    paper TensorFlow: A system for large-scale machine learning. Abadi is also first author of Deep
    Learning with Differential Privacy (2016), which develops techniques for training deep neural
    networks under a modest privacy budget.
