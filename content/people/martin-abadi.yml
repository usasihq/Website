sections:
  - heading: Security and programming languages
    paragraphs:
      - text: >-
          Abadi's publication record goes back to 1985 and spans algorithms and theory, security, and privacy.
          With Michael Burrows and Roger Needham, Abadi wrote A Logic of Authentication (1990), which gave
          systems designers a logic-based notation for describing and reasoning about authentication
          protocols; ACM SIGOPS added it to its Hall of Fame in 2007.
        source_ids: [abadi-google, sigops-hof]
      - text: >-
          Abadi's work on programming languages for security includes the applied pi calculus, an extension of
          the pi calculus for modeling cryptographic protocols, first introduced in a 2001 conference paper and
          later presented in full with Bruno Blanchet and Cedric Fournet in the Journal of the ACM (2017).
        source_ids: [abadi-google]
  - heading: Machine learning systems and privacy
    paragraphs:
      - text: >-
          After joining Google in November 2014, Abadi was first author of the March 2016 TensorFlow white paper
          and of the May 2016 paper TensorFlow: A system for large-scale machine learning. Abadi later
          co-authored work on dynamic control flow in TensorFlow and co-wrote an introduction to a computational
          model of TensorFlow that describes an operational semantics for its programs.
        source_ids: [abadi-google, tf-whitepaper, tf-osdi-paper, control-flow-paper]
      - text: >-
          On privacy in machine learning, Abadi was first author of Deep Learning with Differential Privacy
          (2016) and co-authored the PATE approach, Semi-supervised Knowledge Transfer for Deep Learning from
          Private Training Data, at ICLR 2017.
        source_ids: [dp-paper, pate-paper, abadi-google]
