sections:
  - heading: Career
    paragraphs:
      - text: >-
          Bengio's résumé lists postdoctoral positions in the mid-1990s working on neural-network time-series
          prediction and an asynchronous input/output hidden Markov model for speech recognition. Bengio then
          worked as a researcher at CIRANO on machine learning models for financial decision problems and, from
          1997 to 1999, as research director at Microcell Labs, leading a team that applied learning algorithms
          to fraud detection, churn and traffic prediction.
        source_ids: [cv]
      - text: >-
          From 1999 to 2007 Bengio was a senior researcher in machine learning at the IDIAP Research Institute,
          supervising PhD students and postdoctoral fellows and managing research projects. Bengio joined Google
          in 2007 as a research scientist and joined Apple in 2021 as Senior Director of AI and Machine Learning
          Research; the résumé also lists an adjunct professorship at EPFL since 2024.
        source_ids: [cv]
  - heading: Research
    paragraphs:
      - text: >-
          Bengio's homepage lists research interests that include the limits of reasoning in autoregressive
          models, deep recurrent architectures for sequences such as speech and text, the training and
          generalization of deep networks, adversarial training, and image captioning. Recent invited talks listed
          there, given through 2026, address reasoning with large language models.
        source_ids: [homepage]
      - text: >-
          On the software side, the homepage describes Bengio's part in the initial development of Torch, which
          succeeded the SVMTorch support-vector-machine software, later work on the team that built TensorFlow,
          and sponsorship of Apple's MLX library for machine learning on Apple silicon.
        source_ids: [homepage]
  - heading: Scientific service
    paragraphs:
      - text: >-
          Bengio served as program chair of NIPS in 2017 and general chair of NeurIPS in 2018, and as program
          chair of ICLR in 2015 and 2016. The résumé also lists membership of the NeurIPS board from 2019 to 2025,
          the NeurIPS scientific advisory board from 2026, and work as an action editor of the Journal of Machine
          Learning Research since 2012.
        source_ids: [cv]
