headline: Senior Director of AI and Machine Learning Research at Apple; sponsor of the MLX library
bio:
  text: >-
    Samy Bengio is Senior Director of AI and Machine Learning Research at Apple, where Bengio's CV describes
    long-term, curiosity-based foundational research in machine learning, and an adjunct professor at EPFL.
    Before Apple, Bengio spent 2007 to 2021 as a research scientist in machine learning at Google, working on
    deep architectures for large-scale ranking problems across images, video, text, and voice. Bengio's
    homepage describes involvement in the initial development of the Torch library, membership in the team
    that developed TensorFlow, and sponsorship of MLX, Apple's library for machine learning on Apple silicon.
    Current research interests listed there include the limits of reasoning in autoregressive models.
  source_ids: [homepage, cv]
  reviewed_at: 2026-10-13
