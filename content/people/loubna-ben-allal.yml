sections:
  - heading: Research
    paragraphs:
      - text: >-
          Loubna Ben Allal began at Hugging Face working on code generation as part of the core BigCode team
          behind The Stack, StarCoder and StarCoder2. The SantaCoder paper, which Ben Allal first-authored in
          2023, received the best paper award at the ICLR 2023 Deep Learning for Code workshop.
        source_ids: [personal-site, santacoder-paper]
      - text: >-
          Ben Allal then turned to small language models, leading the SmolLM, SmolLM2 and SmolLM3 releases and
          building pretraining datasets such as FineWeb-Edu. The SmolLM2 paper, a spotlight at COLM 2025,
          describes overtraining a 1.7-billion-parameter model on a multi-stage mix of web, code, math and
          instruction data, and Ben Allal also wrote The Smol Training Playbook, a guide to building small
          language models.
        source_ids: [personal-site, smollm2-paper, smollm-repo]
      - text: >-
          More recently Ben Allal has worked on AI for biology. Carbon, an open generative DNA foundation
          model, was described in a May 2026 bioRxiv preprint with Ben Allal as first author.
        source_ids: [personal-site, carbon-paper]
  - heading: Talks
    paragraphs:
      - text: >-
          Ben Allal has spoken about model training at venues including Stanford's CS25 seminar in May 2024,
          the LLM4Code workshop at ICSE 2024, the NLP Summit 2024, and GPU MODE in January 2026, where the
          talk presented The Smol Training Playbook.
        source_ids: [personal-site]
