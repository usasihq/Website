slug: loubna-ben-allal
name: Loubna Ben Allal
initials: LBA
headline: Research Engineer at Hugging Face leading the SmolLM series of small open language models
bio:
  text: Loubna Ben Allal is a Research Engineer at Hugging Face, working on training open foundation models
    from data curation through pretraining recipes and evaluation. Ben Allal's site says Ben Allal leads
    SmolLM, SmolLM2, and SmolLM3, Hugging Face's small open models built to run on-device, and Ben Allal
    is first author of the SmolLM2 paper, which released the model together with its new training datasets.
    The SmolLM3 model card points to llama.cpp, ONNX, MLX, MLC, and ExecuTorch for local inference.
