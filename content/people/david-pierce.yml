sections:
  - heading: Career
    paragraphs:
      - text: >-
          The Verge's author page lists David Pierce as the publication's editor-at-large and notes
          earlier work at Protocol, The Wall Street Journal and Wired. Wired's author page describes
          David as a former senior staff writer who covered personal technology.
        source_ids: [verge-author, wired-author]
  - heading: Coverage
    paragraphs:
      - text: >-
          The Vergecast is The Verge's daily podcast about gadgets, large technology companies and
          related news. Each Friday, Nilay Patel and David talk through the week's main technology
          stories, and from Monday to Thursday David leads Verge staff in episodes on how gadgets and
          software shape everyday life. Recent episodes David introduced include a look at what AI models
          have achieved on long-standing math problems and a conversation with a creator about building
          apps with the help of AI.
        source_ids: [vergecast, verge-author]
      - text: >-
          David also writes issues of Installer, The Verge's weekly newsletter of apps, gadgets, shows
          and other things to download, watch, read, listen to and explore. David's recent stories for
          The Verge cover phones, smart-home products such as Apple's HomeView, and smart glasses.
        source_ids: [installer, verge-author]
