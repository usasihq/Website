headline: Editor-at-large at The Verge, writing about consumer tech and appearing on The Vergecast
bio:
  text: >-
    David Pierce is editor-at-large at The Verge, writing about consumer technology such as phones
    and smart-home gadgets, and appears on The Vergecast, the publication's tech podcast.
    Before The Verge, David worked at Protocol, The Wall Street Journal and Wired.
