headline: Vice President at Google DeepMind; co-author of sequence-to-sequence learning and the TensorFlow white paper
bio:
  text: >-
    Oriol Vinyals is a Vice President at Google DeepMind, credited with that title on Google's May 2026
    Gemini 3.5 announcement; in November 2025 the Universitat Politècnica de Catalunya awarded Vinyals
    an honorary doctorate and described Vinyals as vice-president of Research at Google DeepMind. With
    Ilya Sutskever and Quoc V. Le, all listed at Google, Vinyals co-authored Sequence to Sequence
    Learning with Neural Networks (2014), and Vinyals is also a co-author of the TensorFlow white paper
    and the WaveNet paper. Vinyals is listed among the executive sponsors of the first Gemma technical
    report and among the sponsors of the Gemma 2 and Gemma 3 reports.
  source_ids: [gemini-35-post, upc-honorary, seq2seq-paper, tf-whitepaper, wavenet-paper, gemma-report, gemma2-report, gemma3-report]
  reviewed_at: 2026-10-13
