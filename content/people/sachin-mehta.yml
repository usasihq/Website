headline: First author of OpenELM and MobileViT; research on efficient neural network architectures
bio:
  text: >-
    Sachin Mehta is a machine learning researcher working on efficient architectures for visual and
    textual data on resource-constrained devices, and an Affiliate Assistant Professor at the University of
    Washington. Mehta joined Apple as a Research Scientist in April 2021 and is listed with a FAIR at Meta
    affiliation on a May 2026 paper.
    Mehta is first author of OpenELM, an open language model family released with its training and
    inference framework, and of the MobileViT and ESPNetv2 papers.
  source_ids: [mehta-site, uw-ece, cot-paper, openelm-paper, openelm-readme, mobilevit-paper, espnetv2-paper]
  reviewed_at: 2026-10-22
