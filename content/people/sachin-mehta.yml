sections:
  - heading: Career
    paragraphs:
      - text: >-
          Mehta received a PhD from the University of Washington, supervised by Linda Shapiro and Hannaneh
          Hajishirzi, and defended the thesis in March 2021. Mehta's site records joining Apple as a Research
          Scientist in April 2021 and returning to the University of Washington as an Affiliate Assistant
          Professor in October 2021; the university's Electrical & Computer Engineering department lists
          Mehta as an Affiliate Assistant Professor. Mehta is listed with a FAIR at Meta affiliation on the
          2026 paper "Compute Optimal Tokenization".
        source_ids: [mehta-site, uw-ece, cot-paper]
  - heading: Research
    paragraphs:
      - text: >-
          Mehta's research focuses on efficient machine learning architectures that can run on devices such
          as smartphones. This work includes ESPNetv2 (2018), a light-weight convolutional network, DeLighT
          (2020), a deep and light-weight transformer, and MobileViT (2021), a mobile-friendly vision
          transformer. In 2021 Mehta released CVNets, a library for training computer vision networks.
        source_ids: [mehta-site, espnetv2-paper, delight-paper, mobilevit-paper]
      - text: >-
          In 2024 Mehta was first author of the OpenELM paper, which released an efficient open language model family
          together with training and inference code through Apple's CoreNet repository.
        source_ids: [openelm-paper, openelm-readme]
