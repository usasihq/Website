headline: Research scientist at Mistral AI; first author of the Mistral 7B and Mixtral of Experts papers
bio:
  text: >-
    Albert Jiang's homepage says Jiang has been a research scientist at Mistral AI since June 2023
    and that Jiang's team there works on the science and infrastructure of reasoning. Jiang is
    first author of the Mistral 7B (2023) and Mixtral of Experts (2024)
    papers, whose abstracts say the models are released under the Apache 2.0 license, and the
    homepage lists later work on Mathstral, on large-scale reinforcement learning for Magistral, and
    on the formal agentic models Leanstral 1.0 and 1.5. Jiang's CV lists a research scientist
    internship at FAIR France in 2022, and the homepage describes a PhD at the Cambridge Computer
    Laboratory on learning abstract mathematical reasoning with language models.
  source_ids: [homepage, cv, mistral7b-paper, mixtral-paper]
