sections:
  - heading: Career
    paragraphs:
      - text: >-
          Albert Jiang has been a research scientist at Mistral AI since the company's formation in June
          2023, and Jiang's team there works on the science and infrastructure of reasoning. Earlier,
          Jiang's CV lists a year as a research assistant at the University of Toronto with Jimmy Ba and
          Roger Grosse (2019–2020) and a research scientist internship at FAIR with Guillaume
          Lample in 2022.
        source_ids: [homepage, cv]
      - text: >-
          Jiang's PhD at the Cambridge Computer Laboratory, supervised by Mateja Jamnik and Wenda Li,
          studied how language models can learn abstract mathematical reasoning; the thesis was examined
          in October 2024.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          During the PhD, Jiang worked on autoformalization of theorems and proofs, premise selection
          tools for language models, and how humans and language models interact on mathematical tasks.
          Jiang is first author of Thor (2022), which integrates language models with automated theorem
          provers, and of "Draft, Sketch, and Prove" (2022), and a co-author of "Autoformalization with
          Large Language Models" (2022).
        source_ids: [homepage, cv, thor-paper, dsp-paper, autoformalization-paper]
      - text: >-
          At Mistral AI, Jiang is first author of the Mistral 7B (2023) and Mixtral of Experts (2024)
          papers, whose models are released under the Apache 2.0 license. Jiang's homepage describes
          later work on mid- and post-training data for Mathstral in 2024, large-scale reinforcement
          learning for Magistral in 2025, and the formal agentic models Leanstral 1.0 and 1.5 in 2026.
        source_ids: [mistral7b-paper, mixtral-paper, homepage]
