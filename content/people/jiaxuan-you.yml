sections:
  - heading: Career
    paragraphs:
      - text: >-
          You received a PhD in computer science from Stanford University in 2021, advised by Jure
          Leskovec. From 2021 to 2023 You was a core founding member of Kumo AI, building a graph
          learning predictive system for relational databases, and You later worked at NVIDIA as a
          Senior Research Scientist on LLM pretraining and post-training.
        source_ids: [jy-site, siebel-profile]
      - text: >-
          Since 2024 You has been an assistant professor in the Siebel School of Computing and Data
          Science at UIUC, where You leads U Lab. Courses listed on the school's profile include data
          mining principles and a topics course on LLM agents.
        source_ids: [siebel-profile, jy-site]
  - heading: Research
    paragraphs:
      - text: >-
          You describes research thrusts in self-evolving, research, social, recommender, persuasion and
          tutor agents, grounded in graph learning, reasoning and planning and in LLM systems, memory and
          retrieval. A line of the group's work studies routing among language models, from GraphRouter
          (2024) and GraphPlanner (2026) to the LLMRouter library and paper (2026).
        source_ids: [jy-site, graphrouter-paper, graphplanner-paper, llmrouter-paper]
