headline: UIUC assistant professor who leads U Lab, the group that maintains the LLMRouter routing library
bio:
  text: >-
    Jiaxuan You is an Assistant Professor in the Siebel School of Computing and Data Science at the
    University of Illinois Urbana-Champaign, where You leads U Lab. You is the senior author of the
    LLMRouter paper, which describes the open-source library for routing queries among large
    language models that U Lab maintains. You's research focuses on AI agents, building on work in
    graph learning, reasoning, planning and LLM systems.
  source_ids: [jy-site, siebel-profile, llmrouter-paper, llmrouter-readme]
  reviewed_at: 2026-10-22
