headline: Co-founder of Snowflake who oversees its technology vision; formerly led query optimization work at Oracle
bio:
  text: >-
    Thierry Cruanes is a co-founder of Snowflake, where Cruanes oversees the company's technology vision and
    takes part in key areas of product development. Before Snowflake, Cruanes spent 13 years at Oracle on the
    optimization and parallelization layers of Oracle databases, including as lead for the optimization group.
