sections:
  - heading: Career
    paragraphs:
      - text: >-
          Cruanes spent seven years at the IBM European Center of Applied Mathematics working on data mining
          technologies, then 13 years at Oracle on the optimization and parallelization layers of Oracle
          databases, including as lead for the optimization group.
        source_ids: [snowflake-leadership]
      - text: >-
          Cruanes co-founded Snowflake and oversees its technology vision while remaining involved in key
          aspects of product development. Cruanes's areas of expertise are query optimization and parallel
          execution.
        source_ids: [snowflake-leadership]
  - heading: Research
    paragraphs:
      - text: >-
          With Benoit Dageville and Marcin Zukowski, Cruanes co-authored "The Snowflake Elastic Data
          Warehouse", published in the proceedings of the 2016 International Conference on Management of Data
          (SIGMOD).
        source_ids: [sigmod-2016]
