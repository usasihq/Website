specialties: [language-models, reinforcement-learning, ml-frameworks]
headline: Works on post-training at Hugging Face; first author of Zephyr and a listed author of TRL
bio:
  text: >-
    Lewis Tunstall works on post-training at Hugging Face, according to Tunstall's GitHub profile,
    and Hugging Face's LLM Course describes Tunstall as a machine learning engineer focused on
    developing open-source tools. Tunstall is first author of the Zephyr paper (2023), which
    aligned a smaller chat model with distilled direct preference optimization on AI-feedback
    data, and is listed first in the citation for the Alignment Handbook, a set of training
    recipes for aligning language models. Tunstall is also listed among the authors of TRL,
    Hugging Face's Apache-2.0 post-training library, and co-wrote the O'Reilly book Natural
    Language Processing with Transformers.
  source_ids: [github-profile, hf-course, zephyr-paper, alignment-handbook, trl-citation]
  reviewed_at: 2026-10-13
