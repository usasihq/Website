sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Lewis Tunstall is a machine learning engineer at Hugging Face who works on post-training and
          open-source tools for the wider community. Tunstall's GitHub profile highlights work on
          TRL, Hugging Face's post-training library, the Alignment Handbook of training recipes, and
          Open-R1.
        source_ids: [hf-course, github-profile, trl-citation, alignment-handbook]
      - text: >-
          In January 2025 Tunstall co-authored the Hugging Face blog post launching Open-R1, a project
          to build an open reproduction of the DeepSeek-R1 reasoning pipeline. Tunstall is listed first
          in the Alignment Handbook's citation entry and among the authors of TRL.
        source_ids: [open-r1-blog, alignment-handbook, trl-citation]
  - heading: Research
    paragraphs:
      - text: >-
          Tunstall is first author of "Efficient Few-Shot Learning Without Prompts" (2022), which
          introduced SetFit, a method that fine-tunes Sentence Transformers contrastively on a small
          number of labeled examples. Tunstall is also first author of the Zephyr paper (2023), which
          aligned a 7B chat model with distilled direct preference optimization on AI-feedback data.
        source_ids: [setfit-paper, zephyr-paper]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Tunstall co-wrote the O'Reilly book Natural Language Processing with Transformers, whose
          co-authors include Leandro von Werra. Tunstall is also one of the authors of Hugging Face's LLM
          Course.
        source_ids: [hf-course]
timeline:
