work:
  - name: TRL (Transformers Reinforcement Learning)
    artifact_slug: trl
    type: open-source
    url: https://github.com/huggingface/trl
    contribution: >-
      Listed among the authors in TRL's citation file. TRL is an Apache-2.0 toolkit for
      post-training transformer models, with implementations of SFT, reward modeling, DPO, and
      GRPO.
    source_ids: [trl-citation]
  - name: Zephyr
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2310.16944
    contribution: >-
      First author of "Zephyr: Direct Distillation of LM Alignment" (2023), which trained a smaller
      chat model with distilled supervised fine-tuning and distilled direct preference
      optimization on preference data ranked by a teacher model.
    source_ids: [zephyr-paper]
  - name: The Alignment Handbook
    artifact_slug: null
    type: open-source
    url: https://github.com/huggingface/alignment-handbook
    contribution: >-
      Listed first in the citation entry of the repository, which provides training recipes for
      continued pretraining and for aligning language models with human and AI preferences.
    source_ids: [alignment-handbook]
  - name: Natural Language Processing with Transformers (O'Reilly)
    artifact_slug: null
    type: open-research
    url: null
    contribution: >-
      Co-author of the O'Reilly book, according to the author biographies on Hugging Face's LLM
      Course page.
    source_ids: [hf-course]
links:
