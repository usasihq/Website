headline: University of Alberta professor of computing science; co-founded Google DeepMind Alberta in 2017
bio:
  text: >-
    Richard (Rich) Sutton is a Professor of Computing Science at the University of Alberta. In 2017
    Sutton co-founded Google DeepMind Alberta, the company's first international research lab, whose
    office closed in 2023; the university's March 2025 news release also describes Sutton as
    chief scientific advisor at Amii and an Amii fellow. With Andrew Barto, Sutton co-authored the
    1998 textbook "Reinforcement Learning: An Introduction". Sutton is also first author of "The
    Alberta Plan for AI Research" (2022).
