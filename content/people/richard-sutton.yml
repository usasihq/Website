sections:
  - heading: Career
    paragraphs:
      - text: >-
          Sutton completed a PhD in computer science at the University of Massachusetts in 1984, and met
          long-time collaborator Andrew Barto there. At the University of Alberta, Sutton is a professor of
          computing science, founded the Reinforcement Learning and Artificial Intelligence (RLAI) Lab, and
          held the iCORE/AITF Chair in Reinforcement Learning and Artificial Intelligence until 2018.
        source_ids: [ualberta-directory, amii-profile, ualberta-turing-release]
      - text: >-
          In 2017, Sutton co-founded DeepMind Alberta, Google DeepMind's first international research lab, and
          continued research in Alberta after Google closed the Edmonton office in 2023. That year, Sutton
          began working with John Carmack's Keen Technologies on artificial general intelligence, and Amii lists
          Sutton as founder of the Openmind Research Institute. At Amii, Sutton is chief scientific advisor, a
          fellow and a Canada CIFAR AI Chair.
        source_ids: [ualberta-turing-release, amii-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Sutton's contributions to reinforcement learning include the theory of temporal-difference learning,
          the actor-critic (policy gradient) class of algorithms, the Dyna architecture for integrating
          learning, planning and reacting, the Horde architecture, and gradient and emphatic temporal-difference
          algorithms. Current work seeks an empirically grounded approach to knowledge representation based on
          prediction.
        source_ids: [amii-profile]
      - text: >-
          With long-time collaborator Andrew Barto, Sutton wrote the textbook "Reinforcement Learning: An
          Introduction", now in its second edition, and the two share the 2024 ACM A.M. Turing Award for
          establishing and advancing the field. "The Alberta Plan for AI Research" (2022), with Michael Bowling
          and Patrick Pilarski, sets out a research program for long-lived agents that learn to predict and
          control their sensory input.
        source_ids: [amii-profile, ualberta-turing-release, alberta-plan]
