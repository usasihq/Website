sections:
  - heading: Career
    paragraphs:
      - text: >-
          Wes Bos began teaching web development with Ladies Learning Code and went on to teach part-time and
          full-time bootcamps at HackerYou, now Juno College. Bos now makes online courses, runs workshops and
          speaks at conferences, working with HTML, CSS, JavaScript and TypeScript and, more recently, React,
          Node, Deno and Next.js.
        source_ids: [about]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Bos's course catalog mixes free and premium courses. Free courses include JavaScript30, a 30-day
          challenge of building 30 projects in plain JavaScript without frameworks or libraries, a 25-video CSS Grid
          course and What The Flexbox?!; premium courses include Beginner JavaScript, an exercise-heavy course for
          newcomers, Learn Node, React For Beginners and Fullstack Advanced React and GraphQL.
        source_ids: [wb-courses]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Bos and Scott Tolinski started the Syntax podcast in 2017. The show covers full-stack web development,
          including client and server JavaScript, frameworks, HTML, CSS, databases and deployment, and also publishes
          videos and a newsletter. Bos also posts web development
          videos on YouTube.
        source_ids: [syntax-about, syntax, about]
