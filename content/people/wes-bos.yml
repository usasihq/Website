headline: Web development educator who co-hosts the Syntax podcast and makes JavaScript courses
bio:
  text: >-
    Wes Bos is a full-stack web developer and educator who creates online web development courses
    focused on JavaScript, TypeScript, React, CSS, and Node.js, including Beginner JavaScript. Wes
    co-hosts Syntax, a web development podcast started with Scott Tolinski in 2017 that covers
    JavaScript, frameworks, HTML, CSS, databases, deployment, and, in recent episodes, AI coding agents.
    Wes also posts videos on YouTube and speaks at conferences.
  source_ids: [about, syntax-about, syntax]
