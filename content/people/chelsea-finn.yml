headline: Stanford assistant professor who runs the IRIS lab; co-founder of Physical Intelligence and co-author of π0
bio:
  text: >-
    Chelsea Finn is an Assistant Professor in Computer Science and Electrical Engineering at Stanford
    University and a co-founder of Physical Intelligence (Pi). Finn's IRIS lab studies intelligence
    through robotic interaction at scale, and Finn's homepage notes earlier time at Google with the
    Google Brain and Google DeepMind teams. Finn is first author of the Model-Agnostic Meta-Learning
    (MAML) paper and a co-author of the π0 vision-language-action model paper, whose model is
    published in Physical Intelligence's openpi repository. Finn teaches Stanford's CS224R Deep
    Reinforcement Learning.
  source_ids: [homepage, maml-paper, pi0-paper, openpi-readme]
