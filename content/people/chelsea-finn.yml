sections:
  - heading: Career
    paragraphs:
      - text: >-
          Chelsea Finn completed a PhD in computer science at UC Berkeley in 2018, with the thesis
          "Learning to Learn with Gradients". Finn's homepage notes the PhD was advised by Pieter Abbeel and Sergey Levine in
          the Berkeley AI Research Lab.
        source_ids: [finn-cv, homepage]
      - text: >-
          Finn has been an Assistant Professor of Computer Science and Electrical Engineering at Stanford
          since 2019, and is the William George and Ida Mary Hoover Faculty Fellow. From 2018 to 2024 Finn
          was a research scientist at Google on the team that began as Google Brain and became part of
          Google DeepMind, and in 2024 Finn co-founded Physical Intelligence.
        source_ids: [finn-cv, finn-bio]
  - heading: Research
    paragraphs:
      - text: >-
          Finn's research concerns how robots and other agents can develop broadly capable behavior
          through learning and interaction, including end-to-end deep learning for vision-based robotic
          manipulation, meta-learning for few-shot learning, and scaling robot learning to broad datasets.
          With Pieter Abbeel and Sergey Levine, Finn wrote the 2017 Model-Agnostic Meta-Learning paper.
        source_ids: [finn-bio, maml-paper]
      - text: >-
          Finn's CV lists co-authored papers recognized at robotics and machine learning conferences,
          including Open X-Embodiment (ICRA 2023 best conference paper), Direct Preference Optimization
          (NeurIPS 2023 outstanding paper runner-up) and OpenVLA (a CoRL 2024 outstanding paper
          finalist). At Physical Intelligence, Finn co-authored the 2024 π0 vision-language-action model,
          released in the openpi repository.
        source_ids: [finn-cv, pi0-paper, openpi-readme]
  - heading: Teaching
    paragraphs:
      - text: >-
          At Stanford, Finn teaches CS224R Deep Reinforcement Learning (Spring 2023, 2025 and 2026) and
          taught CS330 Deep Multi-Task and Meta Learning each fall from 2019 to 2023, as well as CS221
          Artificial Intelligence. Finn has given tutorials on meta-learning at ICML and CVPR and delivered
          an ICML keynote in July 2024.
        source_ids: [homepage, finn-cv]
