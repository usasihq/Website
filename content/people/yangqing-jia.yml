sections:
  - heading: Research
    paragraphs:
      - text: >-
          Jia co-authored DeCAF (2013), which showed that features
          from a deep convolutional network trained on one large image task transfer to other visual recognition
          problems. Jia was first author of the 2014 technical report on Caffe, a C++ framework with Python and MATLAB
          bindings for training and deploying deep models, which the Caffe site says Jia created during a PhD
          at UC Berkeley and which Berkeley AI Research and community contributors continued to develop.
        source_ids: [homepage, decaf-paper, caffe-paper, caffe-site, caffe-repo]
      - text: >-
          As a research scientist at Google Brain, Jia worked on computer vision and deep learning and is a
          co-author of "Going Deeper with Convolutions" (2014), the paper introducing the GoogLeNet (Inception)
          architecture, which Jia's homepage lists as a co-created work. Jia was also part of the early design and
          implementation of TensorFlow and an author of its 2016 whitepaper.
        source_ids: [homepage, googlenet-paper, tf-paper]
  - heading: Open-source frameworks
    paragraphs:
      - text: >-
          At Facebook, as a Director of Engineering, Jia initiated the company's general-purpose AI platform that
          served ranking, computer vision and language workloads. Jia's homepage credits Jia with creating Caffe2,
          co-creating ONNX, the Open Neural Network Exchange standard, and with co-leading PyTorch 1.0, which brought
          research and production uses of deep learning together; PyTorch's license retains a Caffe2 section
          that lists Jia's contributions.
        source_ids: [homepage, pytorch-license, onnx-license]
  - heading: Products and companies
    paragraphs:
      - text: >-
          Jia later served as a VP at Alibaba Group, as President of Alibaba Cloud's Computing Platform and head
          of the System AI Lab at DAMO Academy, before founding Lepton AI, an AI cloud company later acquired by
          NVIDIA, where Jia then worked as a VP on AI for system software and cloud services. In January 2024
          Lepton AI open-sourced Lepton Search, a demo conversational search engine under the Apache-2.0 license.
          Jia now leads Intent Lab as founder and CEO, a company focused on turning user intent into production
          systems.
        source_ids: [homepage, lepton-search-repo, github-profile]
timeline:
