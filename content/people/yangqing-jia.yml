headline: Creator of Caffe, co-creator of ONNX and co-lead of PyTorch 1.0; founder and CEO of Intent Lab
bio:
  text: >-
    Yangqing Jia created the Caffe deep learning framework during a PhD at UC Berkeley; Caffe's
    official site credits Jia as its creator, and the framework is released under the BSD 2-Clause
    license. As a research scientist at Google Brain, Jia worked on computer vision and on
    TensorFlow's early design and implementation, and co-authored the TensorFlow whitepaper. As a
    Director of Engineering at Facebook, Jia built the company's general-purpose AI platform, created
    Caffe2, co-created ONNX and co-led PyTorch 1.0; PyTorch's license file includes a Caffe2 section that
    credits Jia's contributions. Jia's homepage and GitHub profile list Intent Lab, which Jia founded
    and leads as CEO, and the homepage also lists roles as a VP at NVIDIA, as founder and CEO of
    Lepton AI (acquired by NVIDIA), and as a VP at Alibaba Group.
  source_ids: [homepage, github-profile, caffe-site, caffe-paper, tf-paper, pytorch-license]
  reviewed_at: 2026-10-13
