sections:
  - heading: The Transformer
    paragraphs:
      - text: >-
          Niki Parmar co-authored Attention Is All You Need (2017) while at Google Research, and the paper's
          contribution note credits Parmar with designing, implementing, tuning and evaluating many model variants
          in the original codebase and in Tensor2Tensor. Parmar also co-authored the 2018 Tensor2Tensor paper, which
          describes the Google Brain library that holds the reference Transformer implementation.
        source_ids: [attention-paper, t2t-paper, t2t-repo]
  - heading: Vision and speech
    paragraphs:
      - text: >-
          Several of Parmar's later papers carried self-attention into vision. Image Transformer (2018), with Ashish
          Vaswani as co-first author, applied local self-attention to image generation; Stand-Alone Self-Attention
          in Vision Models (2019) replaced convolutions with self-attention layers; and Bottleneck Transformers (2021)
          swapped global self-attention into the final blocks of a ResNet for classification, detection and
          segmentation.
        source_ids: [image-transformer-paper, standalone-attention-paper, botnet-paper]
      - text: >-
          In speech recognition, Parmar co-authored Conformer (2020), which combines Transformer self-attention with
          convolutions to capture both global and local structure in audio.
        source_ids: [conformer-paper]
