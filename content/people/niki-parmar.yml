headline: Co-author of the Transformer paper and first-listed author of Image Transformer, both from Google
bio:
  text: >-
    Niki Parmar is a co-author of Attention Is All You Need (2017), listed there with a Google Research
    affiliation; the paper's contribution note says Parmar designed, implemented, tuned, and evaluated
    many model variants in the original codebase and in Tensor2Tensor. Parmar is the first-listed author,
    with equal contribution from Ashish Vaswani and a Google Brain affiliation, of Image Transformer
    (2018), which extends the self-attention architecture to image generation, and is a co-author of the 2018 Tensor2Tensor paper.
  source_ids: [attention-paper, image-transformer-paper, t2t-paper]
  reviewed_at: 2026-10-13
