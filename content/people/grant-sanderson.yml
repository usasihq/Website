sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Sanderson started the 3Blue1Brown videos and the Manim animation engine as side projects while
          finishing studies in math and computer science at Stanford. After graduating, Sanderson worked at
          Khan Academy on multivariable calculus content, and since the end of 2016 3Blue1Brown has been
          Sanderson's primary focus.
        source_ids: [about]
      - text: >-
          The channel's lessons range from foundational undergraduate topics such as linear algebra to
          explorations of puzzles. Its deep learning series began in October 2017 with a chapter
          on what a neural network is, and in April 2024 added visual chapters on transformers and attention
          in large language models.
        source_ids: [about, la-lesson, nn-lesson, gpt-lesson, attention-lesson]
      - text: >-
          Beyond the channel, Sanderson has lectured for a semester at MIT and contributed visuals to the
          documentary A Trip to Infinity. 3Blue1Brown also presents the Summer of Math Exposition, an annual
          competition that encourages people to create math content online.
        source_ids: [about, some]
  - heading: Manim
    paragraphs:
      - text: >-
          Almost all of the channel's animations are made with Manim, an open-source Python library Sanderson
          wrote that is designed for longer, object-oriented animated scenes. The 3b1b/manim repository is
          released under the MIT license, and a separate community-maintained fork, Manim Community Edition,
          aims to be more stable, documented, and tested for new learners.
        source_ids: [about, manim, manim-community]
