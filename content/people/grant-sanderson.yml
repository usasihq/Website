headline: Math educator behind 3Blue1Brown, a YouTube channel explaining math visually, and the Manim engine
bio:
  text: >-
    Grant Sanderson is a math educator and the creator of 3Blue1Brown, a YouTube channel that explains
    mathematics visually, with topics including linear algebra, calculus, neural networks, and topology.
    Grant also created Manim, the animation engine behind the videos, and the 3Blue1Brown site hosts
    written and interactive versions of many lessons. Before focusing on 3Blue1Brown at the end of 2016,
    Grant produced videos, articles, and exercises for Khan Academy, primarily on multivariable calculus.
