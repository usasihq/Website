sections:
  - heading: Coverage
    paragraphs:
      - text: >-
          Isaac is a technology reporter at The New York Times. W. W. Norton's author page notes that Isaac writes
          frequently about Uber, Facebook and other large Silicon Valley companies for the Times.
        source_ids: [norton-author]
      - text: >-
          Isaac's recent Times articles, many written with colleagues, focus on the AI industry. Stories in
          Isaac's author feed from September and October 2026 cover AI developers such as Anthropic and OpenAI
          and the testing of AI agents on government websites.
        source_ids: [nyt-feed]
  - heading: Publications
    paragraphs:
      - text: >-
          Isaac is the author of "Super Pumped: The Battle for Uber", published in hardback by W. W. Norton in
          2019. The publisher describes the book as an account of Uber's rise and fall set against the changes in
          Silicon Valley during the mobile era.
        source_ids: [norton-author]
