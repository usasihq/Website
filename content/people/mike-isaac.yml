bio:
  text: >-
    Mike Isaac reports on technology for The New York Times, where recent bylines cover AI companies
    and other Silicon Valley firms. Mike's publisher describes Mike as a New York Times technology
    reporter whose coverage has included Uber and Facebook. Mike is the author of Super Pumped: The
    Battle for Uber, published by W. W. Norton, which was adapted as a television series.
