headline: OpenAI researcher; co-author of the Transformer paper and the TensorFlow white paper
bio:
  text: >-
    Łukasz Kaiser's GitHub profile lists OpenAI as Kaiser's company, and the OpenAI o1 System Card (2024)
    names Kaiser in the leadership group for reasoning research. Earlier, Kaiser was listed with a Google
    Brain affiliation as a co-author of Attention Is All You Need (2017), whose contribution note says
    Kaiser and Aidan Gomez designed parts of and implemented Tensor2Tensor; Kaiser is one of the two
    corresponding authors of the 2018 Tensor2Tensor paper. Kaiser is also a co-author of the TensorFlow
    white paper and of the 2016 paper on Google's Neural Machine Translation system.
  source_ids: [github-profile, o1-system-card, attention-paper, t2t-paper, tf-whitepaper, gnmt-paper]
  reviewed_at: 2026-10-21
