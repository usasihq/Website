sections:
  - heading: Research
    paragraphs:
      - text: >-
          Kaiser's early neural network papers took on parsing and algorithm learning. With Oriol Vinyals,
          Ilya Sutskever, Geoffrey Hinton and others, Kaiser co-wrote "Grammar as a Foreign Language" in 2014,
          which treated syntactic parsing as translation, and with Sutskever wrote "Neural GPUs Learn Algorithms"
          in 2015.
        source_ids: [lk-grammar, lk-neuralgpu]
      - text: >-
          Kaiser was a co-author of "Attention Is All You Need" in 2017, the paper that introduced the
          Transformer, and first-authored "One Model To Learn Them All," a single model trained across several
          tasks and modalities. Later Transformer work includes Universal Transformers in 2018 and Reformer, an
          efficient Transformer variant, in 2020.
        source_ids: [attention-paper, lk-onemodel, lk-universal, lk-reformer]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Kaiser co-authored the 2016 TensorFlow white paper describing Google's system for large-scale machine
          learning on heterogeneous hardware. The Transformer paper's contribution note credits Kaiser and Aidan
          Gomez with designing parts of and implementing Tensor2Tensor, and Kaiser is
          a corresponding author of the 2018 Tensor2Tensor paper.
        source_ids: [tf-whitepaper, attention-paper, t2t-paper, t2t-repo]
  - heading: Career
    paragraphs:
      - text: >-
          Kaiser's papers from 2017 and 2018 list a Google Brain affiliation, and Kaiser co-authored the 2016
          paper on Google's Neural Machine Translation system. Kaiser's GitHub profile now lists OpenAI, and the
          2024 OpenAI o1 System Card names Kaiser in its reasoning research leadership.
        source_ids: [attention-paper, t2t-paper, gnmt-paper, github-profile, o1-system-card]
