headline: Researcher at Google DeepMind; co-founder and former CEO of Contextual AI; co-author of the RAG paper
bio:
  text: >-
    Douwe Kiela is a researcher at Google DeepMind and an Adjunct Professor in Symbolic Systems at
    Stanford University. Kiela co-founded Contextual AI and was its CEO, and earlier was Head of
    Research at Hugging Face and a Research Scientist at Facebook AI Research. Kiela's site
    describes research on retrieval-augmented, grounded, and multi-agent language understanding
    and on tools for evaluation and benchmarking; Kiela is an author of the 2020 paper that
    introduced retrieval-augmented generation (RAG), first author of the Dynabench paper on
    dynamic dataset creation and benchmarking, and a co-author of the paper on the OLMoE open
    mixture-of-experts models.
  source_ids: [kiela-site, rag-paper, dynabench-paper, olmoe-paper]
  reviewed_at: 2026-10-13
