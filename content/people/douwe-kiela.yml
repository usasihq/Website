sections:
  - heading: Career
    paragraphs:
      - text: >-
          Douwe Kiela's homepage lists a research position at Google DeepMind and an adjunct
          professorship in Symbolic Systems at Stanford University. Kiela co-founded Contextual AI and
          served as its CEO; before that Kiela was Head of Research at Hugging Face and, earlier, a
          Research Scientist at Facebook AI Research.
        source_ids: [kiela-site]
  - heading: Research
    paragraphs:
      - text: >-
          Kiela's research covers machine learning and natural language processing, with a focus on
          grounded, multi-agent, and retrieval-augmented language understanding and on better tools for
          evaluation and benchmarking. Kiela co-authored the 2017 InferSent
          paper on learning general-purpose sentence representations from natural language inference
          data.
        source_ids: [kiela-site, infersent-paper]
      - text: >-
          Much of Kiela's work concerns how models are tested. Kiela was a co-author of Adversarial
          NLI (2019), a benchmark collected through an iterative human-and-model-in-the-loop process,
          first author of the Hateful Memes Challenge (2020) for multimodal classification, and first
          author of Dynabench (2021), a platform for dynamic dataset creation and benchmarking.
        source_ids: [anli-paper, hateful-memes-paper, dynabench-paper]
      - text: >-
          Kiela was also an author of the May 2020 paper that introduced retrieval-augmented generation,
          which pairs a pre-trained language model with a retrievable non-parametric memory. Later work
          includes KTO (2024), an alignment method based on prospect theory, and OLMoE (2024), a family of
          open mixture-of-experts language models.
        source_ids: [rag-paper, kto-paper, olmoe-paper]
