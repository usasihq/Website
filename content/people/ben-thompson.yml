headline: Author of Stratechery, analysis of the strategy and business of technology and media
bio:
  text: >-
    Ben Thompson writes Stratechery, which analyzes the strategy and business side of technology and
    media and the impact of technology on society. Stratechery publishes free weekly articles and
    subscriber Daily Updates, along with interviews and podcasts. Ben Thompson has written Stratechery
    since 2013 and previously worked at Apple (as an intern), Microsoft, and Automattic, focusing on
    strategy, developer relations, and marketing.
