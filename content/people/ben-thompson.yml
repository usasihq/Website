sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Stratechery, Thompson interned at Apple and worked at Microsoft and Automattic, focusing on
          strategy, developer relations and marketing for Apple University, Windows and WordPress.com.
          Thompson began writing Stratechery in 2013, and it became Thompson's full-time work in 2014.
        source_ids: [stratechery-about]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Stratechery publishes free weekly articles and three subscriber-only Daily Updates a week, which are
          also delivered as podcasts. The Stratechery Plus bundle adds Stratechery Interviews with company
          leaders and analysts, along with podcasts including Dithering with John Gruber and Sharp Tech with
          Andrew Sharp.
        source_ids: [stratechery-about, bt-plus]
      - text: >-
          In a July 2015 article, Thompson named "Aggregation Theory" as the thread running through much of
          Stratechery's analysis, building on Clay Christensen's Conservation of Attractive Profits framework.
          The site's concepts index groups its AI writing under themes such as AI chips, how large technology
          companies are approaching AI, the regulation of AI and the application of AI.
        source_ids: [bt-agg, bt-concepts]
