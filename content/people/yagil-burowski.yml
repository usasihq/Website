    url: https://github.com/lmstudio-ai/lms
    contribution: >-
      Made the repository's initial commit on 2024-04-15 and continues to author commits. The README
      describes lms as the command-line tool for LM Studio that ships with LM Studio 0.2.22 and
      newer. MIT-licensed.
    source_ids: [lms-initial-commit, lms-commits, lms-readme]
  - name: mlx-engine
    artifact_slug: null
    url: https://github.com/lmstudio-ai/mlx-engine
    contribution: >-
      Made the initial commit on 2024-10-07 to mlx-engine, LM Studio's MIT-licensed Apple MLX
      engine, and co-wrote the post announcing that LM Studio 0.3.4 shipped it for running models
      on-device on Apple silicon Macs, through the chat UI or a local OpenAI-like server.
    source_ids: [mlx-engine-initial-commit, mlx-engine-readme, blog-0-3-4]
