slug: yagil-burowski
name: Yagil Burowski
initials: YB
headline: LM Studio team member; made the first commits to LM Studio's lms CLI and MLX engine repositories
bio:
  text: >-
    Yagil Burowski is on the LM Studio team at Element Labs, which makes LM Studio, a desktop app for
    downloading and running language models locally with llama.cpp and, on Apple silicon Macs,
    Apple's MLX. Burowski made the first commits to two of LM Studio's MIT-licensed repositories:
    lms, the command-line tool that ships with the app, in April 2024, and mlx-engine, its MLX
    engine, in October 2024. Burowski co-wrote the October 2024 post announcing that LM Studio 0.3.4
    shipped the MLX engine and wrote the July 2025 post announcing that the app had become free to
    use at work.
  source_ids: [lms-hub-profile, lms-careers, lms-docs-app, lms-initial-commit, mlx-engine-initial-commit, lms-readme, mlx-engine-readme, blog-0-3-4, blog-free-for-work]
  reviewed_at: 2026-10-02
