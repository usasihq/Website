headline: IBM Distinguished Engineer and llm-d project lead for inference optimization research
bio:
  text: >-
    Carlos Costa is a member of the project leadership of llm-d, the Kubernetes-native distributed
    inference serving stack, listed with IBM as employer, and one of the project's three initial
    maintainers, representing inference optimization research. llm-d's launch and release posts list
    Costa as a Distinguished Engineer at IBM.
  source_ids: [llmd-maintainers, llmd-project, llmd-announce, llmd-v05]
  reviewed_at: 2026-10-22
