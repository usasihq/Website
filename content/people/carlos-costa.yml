sections:
  - heading: llm-d
    paragraphs:
      - text: >-
          The llm-d project document names Costa, Clayton Coleman and Robert Shaw as the initial maintainers,
          with Costa representing inference optimization research. The current maintainers file lists Costa,
          with IBM as employer, in the project leadership with Abdullah Gharaibeh and Robert Shaw.
        source_ids: [llmd-project, llmd-maintainers]
      - text: >-
          Costa co-wrote "Announcing the llm-d community!" in May 2025, which presented llm-d as a modular
          serving stack using KV-cache aware routing and disaggregated serving with Kubernetes tooling. Costa
          also co-wrote the release posts for llm-d 0.2, 0.3, 0.4 and 0.5.
        source_ids: [llmd-announce, llmd-v02, llmd-v03, llmd-v04, llmd-v05]
