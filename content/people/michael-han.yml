sections:
  - heading: Career
    paragraphs:
      - text: >-
          Michael Han's GitHub profile lists the Unsloth organization and describes building
          Unsloth. The Unsloth repository's citation entry names Daniel Han, Michael Han, and the Unsloth team
          as the software's authors, with 2023 as its year.
        source_ids: [github-profile, unsloth-readme]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Michael Han published the March 2026 GitHub release that introduced Unsloth Studio (Beta),
          an open-source web UI for training and running language models locally. The repository's
          CODEOWNERS file lists Michael Han as the area owner for the Studio UI.
        source_ids: [release-studio-beta, unsloth-codeowners]
      - text: >-
          Michael Han also published the April 2026 release that redesigned the Studio interface
          around chat and training, adding a collapsible sidebar and chat search. A later release
          published by Michael Han in October 2026 added a browser beside the chat for files and web
          pages.
        source_ids: [release-ui-redesign, release-browser]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Michael Han has published several of the repository's GitHub releases. These include the August 2025 release adding gpt-oss fine-tuning and the October 2025 release
          that introduced an official Unsloth Docker image.
        source_ids: [release-aug-2025, release-oct-2025]
