slug: michael-han
name: Michael Han
initials: MH
groups: [local, open-source]
sector: corporate
specialties: [training-systems, developer-tools]
headline: Works on Unsloth and is an area owner for the Studio UI, its web interface for running and training models
bio:
  text: >-
    Michael Han works on Unsloth, open-source software for running and training models on local
    hardware, and is listed on Unsloth's About page for design, product, and engineering. The
    repository's CODEOWNERS file names Michael Han as an area owner for the Studio UI, the web
    interface the README introduces for running and training models, and Michael Han's recent
    commits are changes to that interface. The README's citation entry lists Michael Han with
    Daniel Han and the Unsloth team as authors of Unsloth.
  source_ids: [unsloth-about, unsloth-codeowners, unsloth-readme, unsloth-commits]
  reviewed_at: 2026-10-21
affiliations:
  - name: Unsloth
    organization_slug: unsloth
    role: Listed on Unsloth's About page for design, product, and engineering
    current: true
    source_ids: [unsloth-about, github-profile, hf-org]
work:
  - name: Unsloth Studio (in the Unsloth repository)
    artifact_slug: unsloth-library
    url: https://github.com/unslothai/unsloth
    contribution: >-
      Named in the CODEOWNERS file as an area owner for the Studio UI, and authors commits to the
      Studio interface. The README describes Unsloth Studio as a web UI for running and training
      models, one of three ways to use Unsloth alongside the desktop app and the code-based Unsloth
      Core, and lists Michael Han among the authors in its citation entry.
    source_ids: [unsloth-codeowners, unsloth-commits, unsloth-readme]
  - name: Unsloth release notes
    artifact_slug: null
    type: open-source
    url: https://github.com/unslothai/unsloth/releases
    contribution: >-
      Published several of the repository's GitHub releases, including the August 2025 gpt-oss
      fine-tuning release and the March 2026 release introducing Unsloth Studio (Beta).
    source_ids: [release-aug-2025, release-studio-beta]
