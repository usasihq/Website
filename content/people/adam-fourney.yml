headline: Senior Principal Researcher at Microsoft Research; author of MarkItDown and first author of Magentic-One
bio:
  text: >-
    Adam Fourney is a Senior Principal Researcher in the Human-AI eXperiences (HAX) group at
    Microsoft Research, where Fourney builds and studies AI agents and how they collaborate with
    people. Fourney is the listed author of MarkItDown, Microsoft's open-source Python utility for
    converting files to Markdown for use with language models, and works on AutoGen, Magentic-One
    and Magentic-UI. Fourney is the first author of the Magentic-One paper (2024) and of Microsoft
    Research's January 2025 post introducing AutoGen v0.4.
  source_ids: [fourney-site, msr-fourney, markitdown-pyproject, markitdown-readme, magentic-one-paper, autogen-v04-blog]
  reviewed_at: 2026-10-22
