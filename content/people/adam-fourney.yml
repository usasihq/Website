sections:
  - heading: Career
    paragraphs:
      - text: >-
          Fourney earned master's and doctoral degrees at the University of Waterloo before joining Microsoft.
          Fourney previously worked on web search, intelligent assistants and other information systems,
          studying the roles they play in supporting people's tasks. Fourney now works in the Human-AI
          eXperiences group at Microsoft Research AI Frontiers on AI agents and how they work alongside people.
        source_ids: [fourney-site, msr-fourney]
  - heading: Agents and tools
    paragraphs:
      - text: >-
          Fourney is first author of the November 2024 Magentic-One paper, which describes a multi-agent system
          for complex tasks, and first-listed author of the January 2025 Microsoft Research post on AutoGen
          v0.4, a redesign of the AutoGen agent framework for scale, extensibility and robustness. Fourney's site
          also lists Magentic-UI, an experimental human-centered web agent.
        source_ids: [magentic-one-paper, autogen-v04-blog, fourney-site]
      - text: >-
          MarkItDown, whose package metadata names Fourney as author, was first published to PyPI in November
          2024 and continues to receive releases in 2026. Its README describes support for converting PDF,
          PowerPoint, Word, Excel and image files, among others, to Markdown.
        source_ids: [markitdown-pyproject, markitdown-pypi, markitdown-readme]
