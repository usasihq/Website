sections:
  - heading: Career
    paragraphs:
      - text: >-
          Taylor Lorenz has worked as a technology reporter for The Daily Beast, The Atlantic and the
          business section of The New York Times, and later as a technology columnist in The Washington
          Post's business section covering online culture and the content creator industry. Lorenz's
          writing has also appeared in New York magazine, Rolling Stone and Outside.
        source_ids: [site]
      - text: >-
          Lorenz was a 2019 Knight Visiting Nieman Fellow at Harvard University and is a former
          affiliate of Harvard's Berkman Klein Center for Internet and Society. In 2020 Lorenz helped
          adapt a feature written for The New York Times into the documentary "Who Gets To Be An
          Influencer?", which ran on FX and Hulu.
        source_ids: [site]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Lorenz writes User Mag, an independent publication on Substack about how people use
          technology. Its about page says it covers online phenomena, under-the-radar trends, platform
          developments, policy initiatives and the forces that shape power on the internet, arriving
          one to three times a week as short articles, deep dives and interviews. The site also hosts
          the Power User podcast.
        source_ids: [usermag-about]
      - text: >-
          Lorenz is the author of the book "Extremely Online: The Untold Story of Fame, Influence, and
          Power on the Internet", and has appeared in documentaries including Netflix's "Eat the Rich:
          The GameStop Saga" and HBO's "Fake Famous".
        source_ids: [site]
