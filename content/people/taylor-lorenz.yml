headline: Technology journalist and founder of User Mag, a publication about tech and online culture
bio:
  text: >-
    Taylor Lorenz is a technology journalist who writes User Mag, an independent Substack publication
    about how people use technology, covering online trends, platform developments, and policy
    initiatives that shape the internet. Taylor Lorenz is the author of the book Extremely Online:
    The Untold Story of Fame, Influence, and Power on the Internet. Earlier roles include technology
    columnist covering online culture and the creator industry for The Washington Post, and technology
    reporter for The New York Times, The Atlantic, and The Daily Beast.
  source_ids: [site, usermag-about]
  reviewed_at: 2026-10-17
