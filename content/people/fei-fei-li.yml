headline: Co-founder and CEO of World Labs, Stanford Sequoia Professor, and principal investigator of ImageNet
bio:
  text: >-
    Fei-Fei Li is the inaugural Sequoia Professor in Stanford's Computer Science Department, a
    founding Co-Director of Stanford's Human-Centered AI Institute (HAI), and a co-founder and the
    CEO of World Labs, which builds world models that perceive, generate, reason about and interact
    with virtual and physical worlds. Li directed the Stanford AI Lab from 2013 to 2018 and served as
    a Vice President at Google and Chief Scientist of AI/ML at Google Cloud from 2017 to 2018. Li
    created ImageNet and the ImageNet Challenge and is listed as principal investigator on the
    ImageNet project's research team; current research covers deep learning, robotic learning,
    spatial intelligence and ambient intelligence for healthcare delivery.
  source_ids: [li-stanford, worldlabs-about, imagenet-about]
  reviewed_at: 2026-10-13
