sections:
  - heading: Career
    paragraphs:
      - text: >-
          Fei-Fei Li is the inaugural Sequoia Professor in Stanford's Computer Science Department and has
          been a Co-Director of the Stanford Institute for Human-Centered AI (HAI) since 2019, after
          directing the Stanford Artificial Intelligence Lab from 2013 to 2018. From 2017 to 2018 Li was
          a Vice President at Google and Chief Scientist of AI/ML at Google Cloud.
        source_ids: [li-stanford]
      - text: >-
          Li is a co-founder and the CEO of World Labs, which Li founded with Justin Johnson, Ben
          Mildenhall and Christoph Lassner. The company builds generative 3D world models, and its first
          product, Marble, creates persistent 3D worlds from images, video, text and 3D layouts.
        source_ids: [li-stanford, worldlabs-about]
  - heading: Research
    paragraphs:
      - text: >-
          Li's research interests include AI, machine learning, computer vision, robotics, AI for
          healthcare and human vision. Li is listed as principal investigator on ImageNet's senior
          research team; the project compiles web images for WordNet synsets to serve as an object
          categorization benchmark, and its CVPR 2009 paper received the PAMI Longuet-Higgins Prize in
          2019 as a retrospective award.
        source_ids: [li-stanford, imagenet-about]
  - heading: Teaching and service
    paragraphs:
      - text: >-
          Li teaches Stanford's CS 231N, Deep Learning for Computer Vision. Li co-founded AI4ALL, a
          nonprofit for inclusive AI education, in 2015 and chairs its board, and serves on the board of
          the Computer Vision Foundation.
        source_ids: [li-stanford]
      - text: >-
          Li served on the National AI Research Resource Task Force for the White House Office of Science
          and Technology Policy and the National Science Foundation from 2021 to 2023, and has been a
          Special Advisor to the Secretary-General of the United Nations since 2023.
        source_ids: [li-stanford]
