headline: Named author of JAX, the Python library for accelerator-oriented array computation
bio:
  text: >-
    Peter Hawkins is one of the authors named in the JAX repository's citation entry. The JAX README
    describes JAX as a Python library for accelerator-oriented array computation and program
    transformation, released under the Apache License 2.0. Hawkins's GitHub profile lists Google as
    their company and sums up their work as "JAX @ Google."
  source_ids: [jax-readme, jax-license, github-profile]
  reviewed_at: 2026-10-21
