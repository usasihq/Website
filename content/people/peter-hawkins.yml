    source_ids: [jax-readme, jax-license]
links:
  - label: GitHub
    url: https://github.com/hawkinsp
sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Hawkins is one of the twelve authors, listed alphabetically, in the citation entry that the JAX README
          asks users to cite, alongside James Bradbury, Roy Frostig, Matthew James Johnson, Dougal Maclaurin and
          others. Hawkins's commits in the JAX repository date back at least to November 2018, and Hawkins's GitHub profile summarizes the work as JAX at Google.
        source_ids: [jax-readme, jax-first-commit, github-profile]
      - text: >-
          Much of Hawkins's recent JAX work concerns building and packaging the library. Pull requests from
          September and October 2026 include making the build script detect free-threaded Python builds,
          and raising the minimum x86-64 CPU requirement to Intel Haswell. Hawkins has also committed to ml_dtypes, a stand-alone implementation of NumPy dtype
          extensions used in machine learning such as bfloat16 and float8 formats.
        source_ids: [jax-pr-free-threaded, jax-pr-haswell, ml-dtypes-repo, ml-dtypes-commit]
