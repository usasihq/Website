headline: Google co-founder and Alphabet director; listed author on the Gemini and Gemini 2.5 technical reports
bio:
  text: >-
    Sergey Brin is one of Google's co-founders and has been a director since 1998, serving on the Executive
    Committee of Alphabet's board, according to Alphabet's 2026 proxy statement. The proxy lists Brin's
    earlier roles as Google's President and Chairman of the Board from 1998 to 2001, President, Technology
    from 2001 to 2011, Google's President from 2011 to 2015, and Alphabet's President from 2015 to 2019.
    Brin is listed among the authors of the 2023 report Gemini: A Family of Highly Capable Multimodal Models
    and of the 2025 Gemini 2.5 technical report.
  source_ids: [alphabet-proxy-2026, alphabet-board, gemini-report, gemini25-report]
  reviewed_at: 2026-10-21
