sections:
  - heading: Career
    paragraphs:
      - text: >-
          Sergey Brin co-founded Google and served as its President and Chairman of the Board from September 1998
          to July 2001.
        source_ids: [alphabet-proxy-2026]
      - text: >-
          Brin was Google's President, Technology from July 2001 to April 2011 and its President from May 2011 to
          October 2015, then Alphabet's President from October 2015 to December 2019. Brin has been a director since
          1998, sits on the Executive Committee of Alphabet's board, and is listed on Alphabet's board of directors
          page.
        source_ids: [alphabet-proxy-2026, alphabet-board]
  - heading: Gemini
    paragraphs:
      - text: >-
          Brin is listed among the authors of Gemini: A Family of Highly Capable Multimodal Models, the December 2023
          report introducing Google's Gemini models, and of the July 2025 Gemini 2.5 technical report on reasoning,
          multimodality, long context and agentic capabilities.
        source_ids: [gemini-report, gemini25-report]
