links: []
sections:
  - heading: Research
    paragraphs:
      - text: >-
          Much of Vaishaal Shankar's research concerns how datasets shape model behavior. In 2019 Shankar
          co-authored "Do ImageNet Classifiers Generalize to ImageNet?", which rebuilt test sets for
          CIFAR-10 and ImageNet to check for overfitting to reused benchmarks, and in 2020 co-authored a
          study of how ImageNet models hold up under distribution shifts that arise in real data.
        source_ids: [imagenet-v2-paper, robustness-paper]
      - text: >-
          Shankar is an author of DataComp (2023), a testbed for multimodal dataset experiments built
          around a candidate pool of image-text pairs from Common Crawl, and one of the shared last
          authors of its language-model counterpart DataComp-LM (2024). Shankar also contributed to the
          data, evaluation, and responsible AI work on Apple's 2024 foundation language models report and
          co-authored MobileCLIP2 (2025).
        source_ids: [datacomp-paper, dclm-paper, apple-fm-paper, mobileclip2-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Shankar is one of the original authors of OpenCLIP, an open-source implementation of CLIP whose
          citation entry dates to July 2021. The README names Shankar with Ross Wightman, Romain
          Beaumont, and Cade Gordon as the people leading current development, and the code is released
          under the MIT license.
        source_ids: [openclip-readme, openclip-license]
