headline: Machine learning researcher; shared last author of DataComp-LM at Apple and a co-lead of OpenCLIP
bio:
  text: >-
    Vaishaal Shankar is a machine learning researcher whose cited work includes dataset research and
    open-source CLIP training. At Apple, Shankar was one of the shared last authors of DataComp-LM (2024),
    a testbed for controlled dataset experiments with a standardized corpus, pretraining recipes, and a
    broad evaluation suite, and contributed to the data, evaluation, and
    responsible AI work on Apple's 2024 foundation language models report; the 2025 MobileCLIP2 paper notes
    that Shankar's contribution was done while at Apple. Shankar is an original author of OpenCLIP, an
    MIT-licensed open-source implementation of CLIP, and is named in its README among the people who lead
    current development of the repository.
