sections:
  - heading: Career
    paragraphs:
      - text: >-
          Edunov's AI at Meta profile describes earlier work on distributed graph analytics as part of the Apache
          Giraph team, followed by work on natural language processing and speech as a Research Engineering
          Manager at Facebook AI Research. Genesis Molecular AI's team page adds that Edunov was a research leader
          on Meta's FAIR team overseeing large-scale machine translation, and later Senior Director of AI Research
          in Meta's generative AI organization, leading development of the Llama 2 and Llama 3 models.
        source_ids: [meta-profile, genesis-team]
      - text: >-
          Edunov is now Chief Technology Officer of Genesis Molecular AI, which combines AI and biotechnology
          expertise.
        source_ids: [genesis-team]
  - heading: Research and open-source work
    paragraphs:
      - text: >-
          Edunov's machine translation research at FAIR includes "Classical Structured Prediction Losses for
          Sequence to Sequence Learning" (2017) and "Understanding Back-Translation at Scale" (2018), both as first
          author, and "Scaling Neural Machine Translation" (2018) on faster training of translation models.
          Edunov co-authored FAIR's WMT19 news translation submission and the 2020 paper on many-to-many
          multilingual translation beyond English-centric data.
        source_ids: [structured-losses-paper, back-translation-paper, scaling-nmt-paper, wmt19-paper, m2m-paper]
      - text: >-
          Edunov is a co-author of the 2019 paper describing fairseq, FAIR's MIT-licensed sequence modeling toolkit.
          On large language models, Edunov co-authored the Llama 2 paper and the 2023 study on effective
          long-context scaling of foundation models, and is listed among the authors of "The Llama 3 Herd of
          Models" (2024).
        source_ids: [fairseq-paper, fairseq-license, llama2-paper, long-context-paper, llama3-paper]
