headline: CTO of Genesis Molecular AI; formerly led development of Meta's Llama 2 and Llama 3 models
bio:
  text: >-
    Sergey Edunov is CTO of Genesis Molecular AI. The company's team page says Edunov most recently served
    as Senior Director of AI Research in Meta's generative AI organization, where Edunov led development of the
    Llama large language models, including Llama 2 and Llama 3, and before that was a research leader on
    Meta's Fundamental AI Research (FAIR) team overseeing large-scale machine translation work. Edunov is a
    co-author of the Llama 2 paper and of the 2019 paper on fairseq, an open-source sequence modeling
    toolkit from Facebook AI Research. Earlier, Edunov worked on distributed graph infrastructure for
    Apache Giraph.
  source_ids: [genesis-team, github-profile, llama2-paper, fairseq-paper, meta-profile]
