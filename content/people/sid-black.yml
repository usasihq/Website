headline: Lead developer of GPT-NeoX-20B; co-founder of EleutherAI and Conjecture; co-author of The Pile
bio:
  text: >-
    Sid Black co-founded EleutherAI in 2020 with Connor Leahy and co-founded Conjecture in March
    2022, according to Conjecture's history page. Black is first author of the GPT-NeoX-20B paper,
    whose contributions appendix names Black as the lead developer and overall point person for the
    project, with credits for training infrastructure, scaling experiments, positional embeddings,
    and the tokenizer. Black is also a co-author of The Pile and is listed in the citation entries
    for both the GPT-NeoX library and the LM Evaluation Harness.
  source_ids: [conjecture-about, neox20b-pdf, pile-paper, neox-readme, lmeval-readme]
  reviewed_at: 2026-10-13
