sections:
  - heading: Career
    paragraphs:
      - text: >-
          Sid Black co-founded EleutherAI with Connor Leahy in 2020, an open-source community that developed models
          including GPT-J and GPT-NeoX. In March 2022 Black, Leahy and Gabriel Alfour founded Conjecture, which grew
          out of EleutherAI.
        source_ids: [conjecture-about]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Black is listed first in the citation entry for GPT-Neo, an EleutherAI implementation of model- and
          data-parallel GPT-3-style models on the mesh-tensorflow library released in March 2021; the repository
          stopped active maintenance in August 2021 as development shifted to the GPU-focused GPT-NeoX library.
        source_ids: [gpt-neo-readme]
      - text: >-
          Black was first author of the April 2022 GPT-NeoX-20B paper, whose contributions appendix names Black as
          the lead developer and overall point person, with credit for training infrastructure, scaling
          experiments, positional embeddings and the tokenizer. Black is also listed in the citation entries of the
          Apache-2.0 GPT-NeoX library and of the LM Evaluation Harness.
        source_ids: [neox20b-pdf, neox-readme, lmeval-readme]
  - heading: Datasets
    paragraphs:
      - text: >-
          Black co-authored The Pile, an English text corpus of diverse sources assembled by EleutherAI for training
          large language models and released at the end of 2020.
        source_ids: [pile-paper]
