headline: First author of the Sliding Tile Attention and VSA papers cited by FastVideo; Hao AI Lab alumnus
bio:
  text: >-
    Peiyuan Zhang is the first author of two video-generation papers from UC San Diego's Hao AI
    Lab, Sliding Tile Attention and VSA (Video Sparse Attention), which the FastVideo README asks
    users to cite. Zhang was a PhD student in the lab who left with a master's degree, and the
    lab's alumni list shows Zhang now at ByteDance.
  source_ids: [sta-paper, vsa-paper, fv-readme, haolab-people]
  reviewed_at: 2026-10-22
