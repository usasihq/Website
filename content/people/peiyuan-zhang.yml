    source_ids: [fv-readme, sta-paper, vsa-paper]
links: []
sections:
  - heading: Research
    paragraphs:
      - text: >-
          With Hao Zhang and co-authors, Zhang posted "Fast Video Generation with Sliding Tile Attention"
          in February 2025 and "VSA: Faster Video Diffusion with Trainable Sparse Attention" in May 2025,
          both as first author. Both methods target the cost of attention in video diffusion models.
        source_ids: [sta-paper, vsa-paper]
      - text: >-
          The FastVideo README records the release of Sliding Tile Attention inference code in February
          2025 and VSA fine-tuning and inference code in June 2025, and asks users of the framework to
          cite both papers.
        source_ids: [fv-readme]
  - heading: Career
    paragraphs:
      - text: >-
          Zhang was a PhD student in the Hao AI Lab at UC San Diego and left the program with a master's
          degree. The lab's people page and Hao Zhang's site list Zhang among alumni now at ByteDance.
        source_ids: [haolab-people, hz-site]
