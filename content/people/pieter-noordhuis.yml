slug: pieter-noordhuis
name: Pieter Noordhuis
initials: PN
groups: [open-source, engineering]
sector: null
specialties: [training-systems, ml-frameworks]
headline: Emeritus maintainer of PyTorch Distributed; contributor to the Gloo collective communications library
bio:
  text: >-
    Pieter Noordhuis is listed among the emeritus maintainers of the Distributed component on
    PyTorch's persons-of-interest page. Noordhuis is a co-author of the VLDB 2020 paper on PyTorch's
    distributed data parallel module and of the 2017 paper on training ImageNet with large
    minibatches in about an hour. Noordhuis's commits to the Gloo collective communications
    library include one that created its libuv-based transport in 2019. No current organizational
    role is documented in the sources reviewed.
  source_ids: [pt-poi, ddp-paper, minibatch-paper, gloo-commits]
  reviewed_at: 2026-10-21
affiliations:
  - name: PyTorch (open-source project)
    organization_slug: null
    role: Maintainer, Distributed (now listed as emeritus)
    current: false
    source_ids: [pt-poi]
work:
  - name: PyTorch Distributed
    artifact_slug: pytorch
    type: open-source
    url: https://github.com/pytorch/pytorch
    contribution: >-
      Listed as an emeritus maintainer of PyTorch's Distributed module, and a co-author of
      "PyTorch Distributed: Experiences on Accelerating Data Parallel Training" (VLDB 2020), which
      describes the design of the distributed data parallel module. Noordhuis's GitHub profile pins
      the pytorch/pytorch repository.
    source_ids: [pt-poi, ddp-paper, pietern-github]
  - name: Gloo
    artifact_slug: null
    type: open-source
    url: https://github.com/pytorch/gloo
    contribution: >-
      Author of commits to the BSD-licensed Gloo library; those listed from May 2019 to January
      2020 include "Create libuv transport" and changes to the TCP transport.
    source_ids: [gloo-commits, gloo-readme]
  - name: "Accurate, Large Minibatch SGD: Training ImageNet in 1 Hour"
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/1706.02677
    contribution: >-
      Co-author of the 2017 paper, which trains ResNet-50 on ImageNet with minibatches of up to
      8,192 images using a learning-rate scaling rule and warmup.
    source_ids: [minibatch-paper]
links:
  - label: GitHub
    url: https://github.com/pietern
sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Noordhuis's early open-source work was on Redis: commits from March 2010 include the first
          implementation of augmented sorted sets and the ZRANK command, and from September 2010 Noordhuis
          rewrote reply parsing in the hiredis C client library to use a read buffer.
        source_ids: [redis-zrank-commit, hiredis-commit]
      - text: >-
          Noordhuis made the initial import of the Gloo collective communications library in February 2017
          and in August 2019 created its libuv-based transport. PyTorch's persons-of-interest page lists
          Noordhuis among the emeritus maintainers of PyTorch's Distributed component.
        source_ids: [gloo-import-commit, gloo-libuv-commit, gloo-readme, pt-poi]
      - text: >-
          Since September 2022 Noordhuis has contributed to the Databricks CLI repository, with commits
          continuing into October 2026.
        source_ids: [dbcli-first-commit, dbcli-recent-commit]
  - heading: Publications
    paragraphs:
      - text: >-
          Noordhuis co-authored "Accurate, Large Minibatch SGD - Training ImageNet in 1 Hour" (2017), which
          trained ResNet-50 with very large minibatches using a learning-rate scaling rule and warmup, and
          "PyTorch Distributed - Experiences on Accelerating Data Parallel Training" (VLDB 2020), which
          describes the design of PyTorch's distributed data parallel module.
        source_ids: [minibatch-paper, ddp-paper]
timeline:
  - date: "2010-03-03"
    text: Contributed the initial implementation of augmented sorted sets and the ZRANK command to Redis.
    source_ids: [redis-zrank-commit]
  - date: "2010-09-19"
    text: Rewrote reply parsing in the hiredis Redis client library to use a read buffer.
    source_ids: [hiredis-commit]
  - date: "2017-02-09"
    text: Made the initial import of the Gloo collective communications library.
    source_ids: [gloo-import-commit]
  - date: "2017-06-08"
    text: Co-authored "Accurate, Large Minibatch SGD - Training ImageNet in 1 Hour".
    source_ids: [minibatch-paper]
  - date: "2019-08-27"
    text: Created the libuv transport for Gloo.
    source_ids: [gloo-libuv-commit]
  - date: "2020-06-28"
    text: Co-authored the PyTorch Distributed data parallel paper, published at VLDB 2020.
    source_ids: [ddp-paper]
  - date: "2022-09-07"
    text: Made first commits to the Databricks CLI repository.
    source_ids: [dbcli-first-commit]
