sections:
  - heading: Career
    paragraphs:
      - text: >-
          Collin Burns did doctoral research at UC Berkeley, co-advised by Jacob Steinhardt and Dan
          Klein, and Steinhardt's page lists Burns among former students who went on to OpenAI. Burns
          has since worked at OpenAI and at Anthropic, and Burns's own site gives the current
          description of AI researcher.
        source_ids: [steinhardt-site, burns-site]
  - heading: Research
    paragraphs:
      - text: >-
          Burns is co-first author, with Haotian Ye, of "Discovering Latent Knowledge in Language
          Models Without Supervision" (ICLR 2023), written with Dan Klein and Jacob Steinhardt. The
          paper answers yes-no questions using only a model's unlabeled internal activations.
        source_ids: [latent-knowledge-paper, burns-site]
      - text: >-
          Burns is the first-listed author of "Weak-to-Strong Generalization" (ICML 2024,
          oral), which tests whether a weaker model's labels can bring out the abilities of a stronger
          pretrained model, as a stand-in for humans overseeing future systems.
        source_ids: [w2s-paper, burns-site]
      - text: >-
          Earlier, Burns co-authored two evaluation benchmarks with Dan Hendrycks and collaborators:
          MMLU, which measures a model's accuracy across 57 subjects, and MATH, a dataset of
          competition mathematics problems.
        source_ids: [mmlu-paper, math-paper, burns-site]
