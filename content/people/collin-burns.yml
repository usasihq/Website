headline: AI researcher formerly at OpenAI and Anthropic; first author of weak-to-strong generalization research
bio:
  text: >-
    Collin Burns is an AI researcher who previously worked at OpenAI and Anthropic. Burns is first
    author of "Weak-to-Strong Generalization", which studies whether supervision from a weaker model
    can elicit the full capabilities of a much stronger one, as an analogy for humans supervising
    future superhuman models. Burns was a PhD student at UC Berkeley co-advised by Jacob Steinhardt
    and Dan Klein, and is also co-first author of "Discovering Latent Knowledge in Language Models Without
    Supervision" and a co-author of the MMLU benchmark paper.
  source_ids: [burns-site, steinhardt-site, w2s-paper, latent-knowledge-paper, mmlu-paper]
