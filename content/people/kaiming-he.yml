headline: First author of ResNet, Mask R-CNN and MAE; MIT associate professor and part-time scientist at Google DeepMind
bio:
  text: >-
    Kaiming He is an Associate Professor with tenure in the Department of EECS at MIT and also works
    part-time as a Distinguished Scientist at Google DeepMind, with research in computer vision and
    deep learning. Kaiming He is first author of the 2015 ResNet paper and of the Mask R-CNN, MoCo,
    and Masked Autoencoders (MAE) papers, and Kaiming He's site also lists Faster R-CNN among this
    work on visual perception. Before joining MIT in
    2024, Kaiming He was a research scientist at Facebook AI Research (2016–2024) and a researcher
    at Microsoft Research Asia (2011–2016). Courses taught at MIT include deep learning, computer
    vision, and deep generative models.
  source_ids: [homepage, resnet-paper, maskrcnn-paper, moco-paper, mae-paper]
  reviewed_at: 2026-10-13
