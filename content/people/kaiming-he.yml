sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kaiming He worked as a researcher at Microsoft Research Asia from 2011 to 2016, then as a
          research scientist at Facebook AI Research from 2016 to 2024. In 2024 Kaiming He joined the
          Department of EECS at MIT, where the appointment is now an associate professorship with
          tenure. Kaiming He also works part-time as a Distinguished Scientist at Google DeepMind.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          The research of Kaiming He spans computer vision and deep learning. The 2015 ResNet paper,
          written with Xiangyu Zhang, Shaoqing Ren, and Jian Sun, introduced the ResNet design of
          shortcut connections; the MIT homepage notes that these are now used in Transformers, AlphaFold, and many
          generative models.
        source_ids: [homepage, resnet-paper]
      - text: >-
          In visual perception, Kaiming He co-authored Faster R-CNN and was first author of Mask R-CNN,
          which extends object detection to instance segmentation. In self-supervised learning,
          Kaiming He was first author of Momentum Contrast (MoCo) and Masked Autoencoders (MAE), two
          methods for learning visual representations.
        source_ids: [homepage, maskrcnn-paper, moco-paper, mae-paper]
      - text: >-
          More recent work at MIT turns to generative modeling, including autoregressive image
          generation without vector quantization, one-step generation with Mean Flows, and a 2025
          report titled "Back to Basics: Let Denoising Generative Models Denoise".
        source_ids: [homepage, meanflow-paper]
  - heading: Teaching
    paragraphs:
      - text: >-
          At MIT, Kaiming He has taught Advances in Computer Vision (Spring 2024), Deep Generative
          Models (Fall 2024), Deep Learning (Fall 2025 and Fall 2026), and Introduction to Computer
          Vision (Spring 2026). Kaiming He has also given tutorials on ResNets, object
          detection, and visual recognition at ICML, ICCV, CVPR, and ECCV.
        source_ids: [homepage]
