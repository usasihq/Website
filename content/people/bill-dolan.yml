sections:
  - heading: Research
    paragraphs:
      - text: >-
          Dolan's work in the mid-2000s addressed paraphrase. With Chris Brockett, Dolan described an automatic
          method for collecting candidate paraphrase pairs from news sources and the resulting Microsoft Research
          Paraphrase Corpus, whose sentence pairs were labeled by human judges.
        source_ids: [msrp-pub]
      - text: >-
          From 2015, Dolan co-authored a series of papers on neural models of conversation, with co-authors
          including Michel Galley, Chris Brockett and Jianfeng Gao. These included a context-sensitive neural approach to generating conversational
          responses, a diversity-promoting objective that reduces bland replies, and a persona-based model that
          keeps a speaker's responses consistent.
        source_ids: [context-sensitive-paper, diversity-paper, persona-paper]
      - text: >-
          DialoGPT (2019) extended this line of work by pre-training a large transformer on conversation-like
          exchanges and releasing the model and training pipeline. In 2022, Dolan was among the organizers of the
          IGLU competition at NeurIPS on interactive grounded language understanding in a collaborative
          environment.
        source_ids: [dialogpt-paper, dialogpt-repo, iglu-2022-paper]
