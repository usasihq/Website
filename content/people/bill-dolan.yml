headline: Managed Microsoft Research's NLP group; co-author of DialoGPT and the Microsoft Research Paraphrase Corpus
bio:
  text: >-
    Bill Dolan was described in 2022 as a Partner Researcher Manager at Microsoft Research managing its
    Natural Language Processing group, with work on acquiring common-sense knowledge from text,
    paraphrasing, text rewriting, and grounded approaches to dialog. With Chris Brockett, Dolan
    described the creation of the Microsoft Research Paraphrase Corpus, a released set of 5,801
    sentence pairs hand-labeled for whether they are paraphrases. Dolan is also a co-author of DialoGPT,
    a large pre-trained conversational response generation model whose code and model weights
    Microsoft released under the MIT license.
  source_ids: [iglu-2022-paper, msrp-pub, dialogpt-paper, dialogpt-repo, dialogpt-card]
  reviewed_at: 2026-10-21
