sections:
  - heading: Project Debater
    paragraphs:
      - text: >-
          Aharonov co-led, with Noam Slonim, the IBM Research team behind Project Debater, a system designed to
          take part in competitive debate with humans. According to the contributions statement of the 2021
          Nature paper "An autonomous debating system", on which Aharonov is last author, Aharonov helped design
          and build the system, designed its evaluation framework, and wrote the paper with Slonim and Yonatan
          Bilu.
        source_ids: [debater-paper]
      - text: >-
          Aharonov also co-authored related argument-mining papers with Slonim and colleagues, including work on
          corpus-wide argument mining (2019), a large dataset for ranking the quality of arguments (2019),
          and an overview of the 2021 Key Point Analysis shared
          task held at the Workshop on Argument Mining at EMNLP 2021.
        source_ids: [argument-mining-paper, argument-quality-paper, kpa-2021-paper]
  - heading: Research
    paragraphs:
      - text: >-
          Aharonov's other language-technology papers cover explainability, summarization and text
          classification. Aharonov co-authored a 2020 survey of explainable AI for natural language processing,
          TWEETSUMM (2021), a dialog summarization dataset for customer service, and Cluster & Tune (2022),
          which improves text classification when labeled data is scarce by adding an intermediate unsupervised
          clustering task. Aharonov is also among the authors of Label Sleuth (2022), an open-source, no-code
          tool for labeling text and building classifiers.
        source_ids: [xai-survey-paper, tweetsumm-paper, cluster-tune-paper, label-sleuth-paper, label-sleuth-repo]
