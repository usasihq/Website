headline: Co-led IBM Research's Project Debater team and co-wrote its 2021 Nature paper
bio:
  text: >-
    Ranit Aharonov is the last author of "An autonomous debating system," the 2021 Nature paper
    describing Project Debater, IBM Research's system for engaging in competitive debate with humans.
    The paper's contributions statement says Aharonov and Noam Slonim led the team, and that Aharonov
    helped design and build the system, design its evaluation framework, and write the paper. Aharonov is
    also listed with IBM Research among the authors of Label Sleuth (2022), an open-source, no-code
    system for labeling text and building text classifiers.
  source_ids: [debater-paper, label-sleuth-paper, label-sleuth-repo]
  reviewed_at: 2026-10-21
