slug: byron-hsu
name: Byron Hsu
initials: BH
headline: Led Liger Kernel, open-source Triton kernels for memory-efficient LLM training and fine-tuning
bio:
  text: Byron (Pin-Lun) Hsu was the project lead for Liger Kernel, an open-source collection of Triton
    kernels from LinkedIn that lowers GPU memory use and raises throughput when training and fine-tuning
    language models. The Liger Kernel paper lists Hsu as project lead and credits Hsu with leading, architecting,
    and implementing multiple kernels, the public interface, and the test suite. Hsu is currently listed
    as a merge on-call maintainer for prefill-decode disaggregation in SGLang, and Hsu's GitHub profile
    describes current work on reinforcement-learning systems at Periodic Labs.
  source_ids:
