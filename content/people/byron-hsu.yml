sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          At LinkedIn, Hsu was project lead for Liger Kernel, a set of Triton kernels for training and
          fine-tuning large language models; the paper credits Hsu with leading and architecting the project
          and implementing several kernels, the public interface, and the test suite. The project's
          documentation describes integrations with Hugging Face Transformers and TRL, Axolotl, and
          LLaMA-Factory.
        source_ids: [liger-paper, liger-docs, liger-repo]
      - text: >-
          Hsu is also a contributor to SGLang, an LLM serving framework. The SGLang team's December 2024
          release post for SGLang v0.4, which introduced a zero-overhead batch scheduler and a cache-aware load
          balancer, lists Hsu among the people who mainly contributed the work. SGLang's maintenance guide lists Hsu as a
          merge on-call for prefill-decode disaggregation, and CODEOWNERS lists Hsu for the disaggregation
          code and the model gateway's routing policies.
        source_ids: [sglang-v04-blog, sglang-maintainers, sglang-codeowners]
  - heading: Career
    paragraphs:
      - text: >-
          Hsu's GitHub profile describes current work on reinforcement-learning systems at Periodic Labs and
          earlier work at xAI, and pins repositories including SGLang, Liger Kernel, DeepSpeed, Flyte, and
          KubeRay.
        source_ids: [github-profile]
