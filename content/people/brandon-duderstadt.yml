slug: brandon-duderstadt
name: Brandon Duderstadt
initials: BD
headline: Co-founder of Nomic and co-author of the GPT4All and Nomic Embed technical reports
bio:
  text: >-
    Brandon Duderstadt co-founded Nomic and was its founding CEO. He is a
    co-author of the technical report for GPT4All, Nomic's open-source
    application for running language models privately on everyday desktops and
    laptops. The Nomic Embed technical report credits him with design
    contributions across the whole stack and the base implementation of its data
    curation pipeline. He is now building Calcifer Computing, an AI research and
    development company he founded.
  source_ids: [site-home, site-bio, gpt4all-paper, gpt4all-repo, nomic-embed-report]
