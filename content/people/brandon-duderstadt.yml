sections:
  - heading: Career
    paragraphs:
      - text: >-
          Brandon Duderstadt was an early team member at Rad AI, where Duderstadt's site says they
          trained the company's first CT and MRI models. Duderstadt then co-founded Nomic and served as
          its founding CEO.
        source_ids: [site-home, site-bio]
      - text: >-
          Duderstadt now runs Calcifer Computing, a long-term oriented AI research and development
          organization they founded to study the long-term impacts of AI on the epistemic environment.
          As a Whiting Fellow at Johns Hopkins University, Duderstadt teaches Introduction to
          Computational Semiotics and advises independent studies.
        source_ids: [site-home, site-bio]
  - heading: Research and open-source work
    paragraphs:
      - text: >-
          Duderstadt co-authored the November 2023 GPT4All technical report, which describes an
          ecosystem of open-source compressed language models and was accepted at the NLP-OSS workshop
          at EMNLP 2023. The GPT4All repository describes the project as a way to run local language
          models on everyday devices.
        source_ids: [gpt4all-paper, gpt4all-repo]
      - text: >-
          Duderstadt is a co-author of the Nomic Embed technical report (2024), which describes a
          reproducible long-context English text embedding model released with its training code,
          weights and curated training data, and whose contributions section credits Duderstadt with design work
          across the stack and the base data curation pipeline. Duderstadt also co-authored Nomic Embed
          Vision (2024), an image embedder sharing the text model's latent space, and a 2025 paper on
          training sparse mixture-of-experts text embedding models.
        source_ids: [nomic-embed-arxiv, nomic-embed-report, nomic-embed-vision-paper, moe-embed-paper]
