headline: Nomic co-founder and co-author of the GPT4All and Nomic Embed technical reports
bio:
  text: >-
    Brandon Duderstadt co-founded Nomic and was its founding CEO. Duderstadt is a co-author of the
    technical report for GPT4All, Nomic's open-source application for running large language models
    privately on everyday desktops and laptops. The Nomic Embed technical report credits Duderstadt
    with design contributions across the entire stack and the base implementation of its data
    curation pipeline. Duderstadt is now building Calcifer Computing, an AI research and development
    company that Duderstadt founded.
  source_ids: [site-home, site-bio, gpt4all-paper, gpt4all-repo, nomic-embed-report]
  reviewed_at: 2026-10-01
