sections:
  - heading: Research at Google Brain
    paragraphs:
      - text: >-
          Publishing as Nicholas Frosst, Frosst worked with Geoffrey Hinton at Google Brain on
          capsule networks and interpretability. Frosst co-authored "Dynamic Routing Between Capsules"
          (2017) with Sara Sabour and Hinton, and with Hinton wrote "Distilling a Neural Network Into a
          Soft Decision Tree" (2017), which explains a trained network's decisions with a more
          interpretable tree model.
        source_ids: [capsules-paper, soft-tree-paper]
      - text: >-
          Frosst was first author of DARCCC (2018), which detects adversarial examples by
          reconstructing inputs from class-conditional capsules, and of "Analyzing and Improving
          Representations with the Soft Nearest Neighbor Loss" (2019), written with Nicolas Papernot
          and Hinton. Frosst also co-authored Neural Additive Models (2020), an approach to
          interpretable machine learning with neural networks.
        source_ids: [darccc-paper, snnl-paper, nam-paper]
  - heading: Cohere
    paragraphs:
      - text: >-
          Frosst is a co-founder of Cohere, listed on the company's about page alongside co-founders
          Aidan Gomez and Ivan Zhang. Frosst appears among the authors of Cohere's technical reports,
          including the April 2025 report on Command A, an enterprise-focused large language model,
          and the September 2026 report on North Small Translate, a translation model.
        source_ids: [cohere-about, command-a-report, translate-report]
