headline: Co-founder of Cohere; co-author with Geoffrey Hinton of capsule-network research at Google Brain
bio:
  text: >-
    Nick Frosst is a co-founder of Cohere, according to the company's about page. Publishing as
    Nicholas Frosst, Frosst co-authored Dynamic Routing Between Capsules (2017) with Sara Sabour and
    Geoffrey Hinton and was first author of Analyzing and Improving Representations with the Soft
    Nearest Neighbor Loss (2019), both written with a Google Brain affiliation. Frosst is also a
    co-author of Neural Additive Models (2020), an approach to interpretable machine learning whose
    revised version lists Frosst with Cohere, and of Cohere's 2026 report on the North Small
    Translate model.
  source_ids: [cohere-about, capsules-paper, snnl-paper, nam-paper, translate-report]
  reviewed_at: 2026-10-13
