headline: Co-founder and CTO of Glean, overseeing integrations with enterprise data sources
bio:
  text: >-
    T.R. Vishwanath is a co-founder and the CTO of Glean, where Vishwanath is described as the
    company's Technical Infrastructure Lead and oversees the development and maintenance of
    integrations with data sources. Before Glean, Vishwanath held technical leadership roles at
    Facebook for close to a decade and earlier worked on developer tools and runtimes at
    Microsoft.
