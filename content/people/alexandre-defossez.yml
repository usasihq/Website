sections:
  - heading: Career
    paragraphs:
      - text: >-
          Alexandre Défossez was a CIFRE PhD student at FAIR and the Sierra team at INRIA,
          supervised by Léon Bottou and Nicolas Usunier of FAIR and Francis Bach of INRIA. Défossez then
          spent three years as a research scientist at FAIR, leading the music generation effort
          that produced MusicGen and co-leading development of the AudioCraft framework.
        source_ids: [defossez-site]
      - text: >-
          Défossez co-founded Kyutai, an AI lab focused on open-source and open-science work, where
          Défossez continues to lead research projects, and is listed on Kyutai's team page as Head of
          Research. Défossez's homepage now also presents Défossez as a co-founder and Chief Science
          Officer of Gradium, a company that builds voice AI models.
        source_ids: [defossez-site, kyutai-team]
  - heading: Research
    paragraphs:
      - text: >-
          Défossez's research covers generative music and speech models suited to low-latency
          interactive use across several modalities, as well as reinforcement learning for such models.
          Earlier work includes the Demucs music source separation models, real-time speech enhancement
          in the waveform domain, and theoretical papers on stochastic optimization, including a
          convergence proof for Adam and Adagrad.
        source_ids: [defossez-site]
      - text: >-
          Défossez is first author of the EnCodec neural audio compression paper (2022) and last author
          of the MusicGen paper on simple and controllable music generation (2023), both from Meta AI.
          At Kyutai, Défossez is first author of the 2024 Moshi paper, a speech-text foundation model for
          real-time, full-duplex spoken dialogue, and has co-authored follow-up work on simultaneous
          speech-to-speech translation and on retrieval for full-duplex speech models.
        source_ids: [encodec-paper, encodec-pdf, musicgen-paper, musicgen-pdf, moshi-paper, defossez-site]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Défossez's homepage lists the open-source software Défossez has worked on, including Moshi and
          its Mimi streaming audio codec, AudioCraft, EnCodec, Demucs, the Denoiser real-time speech
          enhancement tool, the Julius signal-processing library for PyTorch, and MuScriptor for
          multi-instrument music transcription. The AudioCraft repository releases its code under the
          MIT license, and the Moshi repository releases code under MIT and Apache licenses with model
          weights under CC-BY 4.0.
        source_ids: [defossez-site, audiocraft-repo, moshi-repo]
timeline:
  - date: "2015"
    text: Published a paper with Francis Bach on constant step size least-mean-square at AISTATS 2015.
    source_ids: [defossez-site]
  - date: "2018"
    text: Presented SING, a symbol-to-instrument neural generator, at NeurIPS (then NIPS) 2018.
    source_ids: [defossez-site]
  - date: "2019"
    text: Posted the Demucs preprints on separating music sources in the waveform domain.
    source_ids: [defossez-site]
  - date: "2020"
    text: Published real-time speech enhancement in the waveform domain at Interspeech 2020.
    source_ids: [defossez-site]
  - date: 2022-10-24
    text: Posted the EnCodec paper, "High Fidelity Neural Audio Compression," as first author.
    source_ids: [encodec-paper]
  - date: 2023-06-08
    text: Posted the MusicGen paper, "Simple and Controllable Music Generation," later presented at NeurIPS 2023.
    source_ids: [musicgen-paper, defossez-site]
  - date: 2024-09-17
    text: Posted the Moshi paper on a speech-text foundation model for real-time dialogue as first author.
    source_ids: [moshi-paper]
  - date: "2026"
    text: Co-authored MoshiRAG and a paper on simultaneous speech-to-speech translation without aligned data at ICML 2026.
    source_ids: [defossez-site]
