headline: Head of Research at Kyutai; former FAIR research scientist behind MusicGen, EnCodec, and AudioCraft
bio:
  text: >-
    Alexandre Défossez is Head of Research at Kyutai, an open-science AI lab, and describes a
    research focus on multimodal language models. Before Kyutai, Défossez spent three years as a
    research scientist at FAIR at Meta, where Défossez led the music generation work behind
    MusicGen and co-led development of the AudioCraft framework. Défossez is first author of the
    EnCodec neural audio codec paper and of the Moshi speech-text foundation model paper; the Moshi
    repository releases its code under MIT and Apache licenses and its model weights under CC-BY 4.0.
