headline: Co-founder and Chief Science Officer of Gradium and co-founder of Kyutai; behind MusicGen, EnCodec and Moshi
bio:
  text: >-
    Alexandre Défossez is a co-founder and the Chief Science Officer of Gradium, which builds voice AI
    models, and a co-founder of Kyutai, an open-science AI lab where Défossez continues to lead
    research projects; Kyutai's team page lists Défossez as Head of Research. Before Kyutai, Défossez
    spent three years as a research scientist at FAIR at Meta, leading the music generation work
    behind MusicGen and co-leading development of the AudioCraft framework. Défossez is first author
    of the EnCodec neural audio codec paper and of the Moshi speech-text foundation model paper; the
    Moshi repository releases its code under MIT and Apache licenses and its model weights under
    CC-BY 4.0.
  source_ids: [defossez-site, kyutai-team, encodec-paper, encodec-pdf, musicgen-paper, moshi-paper, moshi-repo, audiocraft-repo]
  reviewed_at: 2026-10-21
