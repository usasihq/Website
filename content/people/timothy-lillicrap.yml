sections:
  - heading: Career
    paragraphs:
      - text: >-
          Timothy Lillicrap earned a PhD in systems neuroscience at Queen's University. Lillicrap
          then worked as a postdoctoral research fellow at the University of Oxford from 2012.
        source_ids: [cifar-bio]
      - text: >-
          Lillicrap joined Google DeepMind as a research scientist in 2014 and is now a Director of
          Research there. Lillicrap is also a Program Co-Director of CIFAR's Learning in Machines &
          Brains program.
        source_ids: [cifar-bio]
  - heading: Research
    paragraphs:
      - text: >-
          Lillicrap's research applies machine learning to optimal control and decision-making and
          uses the same mathematical frameworks to study how the brain learns. A 2014 paper with
          Lillicrap as first author showed that random feedback weights can support learning in deep
          networks, offering an alternative to exact backpropagation.
        source_ids: [cifar-bio, feedback-alignment-paper]
      - text: >-
          In deep reinforcement learning, Lillicrap was first author of the DDPG paper on continuous
          control (2015) and a co-author of A3C (2016), AlphaZero (2017) and MuZero (2019), which
          plans with a learned model to play Atari, Go, chess and shogi. Lillicrap also co-authored
          Dreamer (2019), which learns behaviours by imagining trajectories in a learned latent model.
        source_ids: [ddpg-paper, a3c-paper, alphazero-paper, muzero-paper, dreamer-paper]
