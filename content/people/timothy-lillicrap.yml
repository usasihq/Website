headline: Director of Research at Google DeepMind and CIFAR program co-director; works on deep RL for control
bio:
  text: >-
    Timothy Lillicrap is a Director of Research at Google DeepMind, which Lillicrap joined as a
    research scientist in 2014, and a Program Co-Director of CIFAR's Learning in Machines & Brains
    program. Lillicrap's research focuses on machine learning for optimal control and decision-making
    and on using these frameworks to understand how the brain learns. Lillicrap is first author of
    "Continuous control with deep reinforcement learning" (2015), which presents an actor-critic
    algorithm based on the deterministic policy gradient for continuous action spaces, and a co-author of the AlphaZero and A3C papers.
