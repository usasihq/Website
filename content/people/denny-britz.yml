slug: denny-britz
name: Denny Britz
initials: DB
groups: [engineering, open-source]
specialties: [language-models, reinforcement-learning, education]
headline: First-listed author of a 2017 Google Brain study of NMT architectures; contributor to its TensorFlow framework
bio:
  text: >-
    Denny Britz's site says Britz published several papers as part of the Google AI team, focusing on
    NLP, machine translation, and reinforcement learning, and now applies machine learning and
    reinforcement learning techniques to financial markets. Britz is the first-listed author, with equal
    contribution from Anna Goldie, of Massive Exploration of Neural Machine Translation Architectures
    (2017), listed with a Google Brain affiliation; its official code is google/seq2seq, an Apache-2.0
    encoder-decoder framework for TensorFlow whose contributor listing includes Britz's GitHub account.
    Britz's blog also hosts tutorials such as implementing a CNN for text classification in TensorFlow.
  source_ids: [britz-site, nmt-exploration-paper, seq2seq-repo, seq2seq-contributors]
  reviewed_at: 2026-10-13
