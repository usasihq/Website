sections:
  - heading: Career
    paragraphs:
      - text: >-
          Britz's site describes a career that began in databases and distributed systems at UC Berkeley, as a
          member of the AMPLab and an early research engineer on Apache Spark. Graduate work at Stanford applied
          database techniques to fast inference in probabilistic graphical models before Britz turned to deep
          learning research around 2015.
        source_ids: [britz-site]
      - text: >-
          As part of the Google AI team, Britz published papers on natural language processing, machine
          translation, and reinforcement learning. In 2018 Britz left research for a high-frequency trading
          firm and now applies machine learning and reinforcement learning to financial markets.
        source_ids: [britz-site]
  - heading: Research
    paragraphs:
      - text: >-
          Britz's 2017 study with Anna Goldie, Minh-Thang Luong, and Quoc Le ran several hundred experiments to
          measure how architecture choices affect neural machine translation, and released its code as the
          google/seq2seq TensorFlow framework. A second 2017 paper with Melody Guan and Luong proposed an
          attention mechanism that uses a fixed-size memory representation to speed up sequence-to-sequence
          models.
        source_ids: [nmt-exploration-paper, seq2seq-repo, seq2seq-contributors, efficient-attention-paper]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Britz's blog has carried tutorials since 2015, including a four-part series on recurrent neural
          networks, guides to implementing a CNN for text classification and retrieval-based chatbots in
          TensorFlow, and essays such as "Deep Learning ideas that have stood the test of time" (2020). Recent
          posts include work on solving Path of Exile item crafting with reinforcement learning (2024) and
          thoughts on coding agents (2026).
        source_ids: [britz-site]
      - text: >-
          Britz's reinforcement-learning repository provides Python code, exercises, and solutions for standard
          reinforcement learning algorithms, organized to accompany Sutton and Barto's textbook and David
          Silver's course.
        source_ids: [rl-repo]
