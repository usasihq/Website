headline: Research scientist at FAIR (Meta) working on speech; in the technical leadership of Omnilingual ASR
bio:
  text: >-
    Yu-An Chung is a research scientist at Facebook AI Research (FAIR), with research interests in
    representation learning, self-supervised learning, and generative modeling for speech, and a current
    focus on real-time direct speech-to-speech translation. Chung completed a PhD in computer science at MIT
    under James Glass in 2022. Chung is listed in the technical leadership and project management group of
    Omnilingual ASR, FAIR at Meta's 2025 open-source speech recognition system covering more than 1,600
    languages, and appears with FAIR at Meta on the 2026 Omnilingual SONAR paper on cross-lingual and
    cross-modal sentence embeddings.
