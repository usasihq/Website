sections:
  - heading: Career
    paragraphs:
      - text: >-
          Yu-An Chung earned an SM in 2019 and a PhD in 2022 in computer science at MIT under the supervision of
          James Glass. During the PhD, Chung interned on speech synthesis with Google Perception, on text
          summarization and on speech recognition and translation at Google Brain, and on spoken language
          understanding at Microsoft Cognitive Services Research.
        source_ids: [homepage]
      - text: >-
          Chung is now a research scientist at Facebook AI Research, focusing on real-time direct speech-to-speech
          translation.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Many of Chung's papers from the MIT years study self-supervised speech representations. With Glass, Chung
          introduced Speech2Vec (2018), which learns word embeddings from speech with a sequence-to-sequence model;
          with co-authors including Glass, Chung also proposed an unsupervised autoregressive model for speech
          representation learning (2019), followed by further papers on autoregressive predictive coding.
        source_ids: [speech2vec-paper, apc-paper, yc-papers]
      - text: >-
          Chung was first author of w2v-BERT (2021), which combines contrastive learning and masked language
          modeling for speech pre-training. At FAIR, Chung is listed in the technical leadership of Omnilingual ASR
          (2025) and co-authored Omnilingual SONAR (2026), on sentence embeddings shared across text and speech in
          many languages.
        source_ids: [w2v-bert-paper, omniasr-paper, sonar-paper]
