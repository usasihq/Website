sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jiatong Shi was a PhD student in WAVLab, the Audio and Voice Lab led by Shinji Watanabe at
          Carnegie Mellon University's Language Technologies Institute, from September 2019 to
          December 2025 according to the lab's member list. Shi's GitHub profile now lists Anuttacon
          as Shi's organization.
        source_ids: [wavlab-members, wavlab-home, github-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Shi's research covers speech and music processing, with a focus on toolkits and benchmarks.
          In 2022 Shi was first author of Muskits, an open-source toolkit for end-to-end singing voice
          synthesis that allows reproducible comparison of published methods. In 2023 Shi was first author of
          ML-SUPERB, which extends the SUPERB benchmark for self-supervised speech models to 143
          languages for speech recognition and language identification.
        source_ids: [muskits-paper, mlsuperb-paper]
      - text: >-
          ML-SUPERB 2.0, accepted at Interspeech 2024, broadened that benchmark across modeling
          constraints, languages, and datasets. Shi is also a co-author of "Towards Robust Speech
          Representation Learning for Thousands of Languages" (EMNLP 2024) and of EFFUSE, a method for
          fusing self-supervised features for multilingual and low-resource speech recognition.
        source_ids: [mlsuperb2-paper, xeus-paper, interspeech-award]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Shi is first author of VERSA, a toolkit that gathers evaluation metrics for speech, audio,
          and music in one place, released in the WAVLab GitHub organization under the Apache-2.0
          license. The VERSA paper lists Shinji Watanabe as last author.
        source_ids: [versa-paper, versa-repo]
