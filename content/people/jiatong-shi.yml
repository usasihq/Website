headline: First author of the VERSA speech and audio evaluation toolkit; former PhD student in CMU's WAVLab
bio:
  text: >-
    Jiatong Shi's GitHub profile lists Anuttacon as Shi's organization. WAVLab, Shinji Watanabe's
    Audio and Voice Lab at Carnegie Mellon University's Language Technologies Institute, lists Shi
    among its PhD alumni for 2019 to 2025. Shi is first author of VERSA, a versatile evaluation
    toolkit for speech, audio, and music, whose repository is published under the Apache-2.0 license.
  source_ids: [github-profile, wavlab-home, wavlab-members, versa-paper, versa-repo]
  reviewed_at: 2026-10-21
