headline: "Writer of Don't Worry About the Vase, a Substack centered on weekly AI updates"
bio:
  text: >-
    Zvi Mowshowitz writes Don't Worry About the Vase, a Substack publication that is now
    primarily about AI. Its weekly AI update covers the practical uses of language models, their
    harms and benefits, new products, deals and initiatives, and issues of catastrophic and
    existential risk from AI and the discussion around them. The publication also runs roundups
    and posts on other topics, and is mirrored on a WordPress version.
