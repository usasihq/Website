sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Zvi Mowshowitz's publication, Don't Worry About the Vase, is published primarily on Substack, with
          a WordPress edition carrying the same posts. Its about page says the publication usually runs
          about five posts a week, anchored by a numbered weekly AI update, and sets out journalistic
          principles for handling off-the-record and background information.
        source_ids: [substack-about, wordpress-home]
      - text: >-
          The numbered AI series began with "AI #1: Sydney and Bing" in February 2023 and had reached
          "AI #190" by October 2026. Alongside the AI updates the publication runs a numbered monthly
          roundup and other roundups on topics such as childhood and education.
        source_ids: [ai-1, ai-190, monthly-roundup-47, substack-about]
      - text: >-
          The Substack archive also holds earlier writing, including a February 2017 post discussing the
          paper "Learning to learn by gradient descent by gradient descent". The weekly update covers
          practical uses of language models, new products and initiatives, and questions of catastrophic
          and existential risk from AI.
        source_ids: [post-2017, substack-about]
