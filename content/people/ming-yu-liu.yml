headline: Vice President of Cosmos Lab at NVIDIA; supervised the Cosmos3 world model family
bio:
  text: >-
    Ming-Yu Liu is Vice President of Cosmos Lab at NVIDIA and an IEEE Fellow, leading NVIDIA Cosmos, which
    builds world foundation models for physical AI. Liu is the sole person credited under "Supervision" in
    the Cosmos3 technical report, which introduced the Cosmos3-Nano and Cosmos3-Super omnimodal world
    models. Earlier generative work from Liu's group includes GauGAN, the research behind NVIDIA Canvas.
  source_ids: [liu-site, nvidia-profile, cosmos3-report]
  reviewed_at: 2026-10-22
