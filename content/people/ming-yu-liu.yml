sections:
  - heading: Career
    paragraphs:
      - text: >-
          Liu is Vice President of Cosmos Lab at NVIDIA. NVIDIA Research's profile describes Liu as a Vice
          President of Research who leads a research group on deep generative models for content creation,
          and credits NVIDIA Cosmos, NVIDIA Canvas (GauGAN) and NVIDIA Maxine (LivePortrait) as products
          enabled by the group's research.
        source_ids: [liu-site, nvidia-profile]
      - text: >-
          Liu's site lists NVIDIA Pioneer Research Awards in 2017 and 2018, an R&D 100 Award in 2014, and a
          2016 award from Mitsubishi Electric Research Labs (MERL), alongside SIGGRAPH Real-Time Live awards
          in 2019 and 2021.
        source_ids: [liu-site]
  - heading: Research
    paragraphs:
      - text: >-
          Liu's earlier work on image synthesis includes "Unsupervised Image-to-Image Translation Networks"
          (2017) with Thomas Breuel and Jan Kautz, high-resolution image synthesis with conditional GANs
          (2017), and spatially-adaptive normalization for semantic image synthesis (2019), the GauGAN paper.
        source_ids: [unit-paper, pix2pixhd-paper, spade-paper]
      - text: >-
          Liu's group now builds world foundation models for physical AI. NVIDIA published the Cosmos World
          Foundation Model Platform paper in January 2025, and the June 2026 Cosmos3 report describes a
          family of omnimodal world models that process and generate language, image, video, audio and
          action, released with code and checkpoints under the OpenMDW-1.1 license.
        source_ids: [cosmos-platform-paper, cosmos3-report, cosmos-lab]
