sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kanter founded a microprocessor and compiler startup, was an early employee at Aster Data
          Systems, and has consulted for semiconductor and computing companies including Intel,
          NVIDIA, KLA, Applied Materials, Qualcomm and Microsoft. MLCommons lists Kanter as one of
          its founders and a member of its board.
        source_ids: [mlc-leadership]
  - heading: Benchmarks
    paragraphs:
      - text: >-
          As Head of MLPerf, Kanter helps lead the MLCommons benchmark suites. Kanter is a
          co-author of the 2019 MLPerf Training Benchmark paper and of the MLPerf Inference
          Benchmark paper, which describe how the suites measure training and inference
          performance across hardware and software systems.
        source_ids: [mlc-leadership, mlperf-training, mlperf-inference]
