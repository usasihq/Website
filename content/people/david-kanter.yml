headline: Founder, board member and Head of MLPerf at MLCommons; co-author of the MLPerf benchmark papers
bio:
  text: >-
    David Kanter is a founder, board member and the Head of MLPerf at MLCommons, where Kanter helps
    lead the MLPerf benchmarks for measuring machine learning system performance. Kanter has more
    than 16 years of experience in semiconductors, computing and machine learning, and co-authored
    the original MLPerf Training and Inference benchmark papers.
