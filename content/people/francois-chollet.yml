sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Chollet created Keras in 2015 and has led the project since then; Chollet also contributed to
          TensorFlow from 2015 to 2021, has led Keras Tuner since 2019 and has contributed to AutoKeras.
          KerasHub, the Keras library of pretrained models, offers presets for open-weight models that run on
          JAX, PyTorch or TensorFlow.
        source_ids: [chollet-site, kerashub, kerashub-presets]
      - text: >-
          Earlier projects listed on Chollet's site include Wysp, a social network with drawing lessons for
          artists (2011–2014), and QuickAnswers.io (2014–2015), a question-answering engine that passed
          snippets from web search results to an LSTM language model to write its answers.
        source_ids: [chollet-site]
  - heading: Research
    paragraphs:
      - text: >-
          Chollet's papers include "Xception - Deep Learning with Depthwise Separable Convolutions" (2016,
          listed with CVPR on Chollet's site) and co-authored work on neural theorem proving and machine
          translation such as DeepMath, HolStep and Tensor2Tensor. Chollet's primary research interest is
          understanding abstraction and building algorithms that can form abstractions on their own.
        source_ids: [chollet-site, xception-paper]
      - text: >-
          In the 2019 paper "On the Measure of Intelligence", Chollet introduced the Abstraction and
          Reasoning Corpus, now known as ARC-AGI, as a benchmark for skill-acquisition efficiency.
        source_ids: [measure-intelligence-paper, arc-history]
  - heading: ARC Prize and Ndea
    paragraphs:
      - text: >-
          Chollet hosted the first ARC-AGI competition on Kaggle in 2020 and ran the ARCathon competitions
          with Lab42 in 2022 and 2023. In 2024 Chollet and Mike Knoop created ARC Prize 2024, and in 2025 ARC
          Prize became a non-profit foundation; the foundation lists Chollet as co-founder, board member and
          creator of ARC-AGI. In 2026 ARC Prize introduced ARC-AGI-3, an interactive reasoning benchmark for
          agents.
        source_ids: [arc-history, arc-about, arc-2024-report]
      - text: >-
          Chollet is also a co-founder of Ndea, which is building AI systems that combine intuitive pattern
          recognition with formal reasoning in a single architecture, aimed at scientific discovery.
        source_ids: [chollet-site, ndea-home]
