headline: Creator and project lead of Keras, whose KerasHub runs open-weight models on JAX, PyTorch, or TensorFlow
bio:
  text: >-
    François Chollet created the Keras deep learning library and has led the project since 2015.
    KerasHub, its pretrained-model library, provides checkpoints for open-weight language models such
    as Gemma, Llama, Mistral, Qwen, Phi-3, and SmolLM3 that can be used for both training and inference
    on the JAX, PyTorch, or TensorFlow backends. Chollet also co-founded Ndea and ARC Prize.
  source_ids: [chollet-site, kerashub, kerashub-presets]
