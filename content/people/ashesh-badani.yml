headline: Senior Vice President and Chief Product Officer at Red Hat; previously led its cloud platforms business
bio:
  text: >-
    Ashesh Badani is Senior Vice President and Chief Product Officer at Red Hat, responsible for the
    company's product portfolio and business unit groups, including product strategy, planning, product
    management, marketing, and operations. Red Hat's biography lists Red Hat Enterprise Linux, Red Hat
    OpenShift, Red Hat Ansible Automation, developer tools, and middleware among these responsibilities.
    Badani was previously Senior Vice President of Cloud Platforms, a period in which OpenShift grew from
    a Platform-as-a-Service product into Red Hat's enterprise Kubernetes platform, and began at Red Hat
    overseeing product line management and marketing for the JBoss Enterprise Application Platform.
