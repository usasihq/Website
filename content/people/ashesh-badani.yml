sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before joining Red Hat, Ashesh Badani was Director of Product Management and Product Marketing
          for integration and application platform products at Sun Microsystems. Badani's first role at
          Red Hat covered product line management and marketing for the JBoss Enterprise Application
          Platform middleware portfolio.
        source_ids: [redhat-bio]
      - text: >-
          As Senior Vice President of Cloud Platforms, Badani oversaw the expansion of Red Hat OpenShift
          from a Platform-as-a-Service product into an enterprise Kubernetes platform. Red Hat's
          biography also credits Badani with strategy, analysis and integration work on the company's
          acquisitions of FuseSource in 2012, CoreOS in 2018 and StackRox in 2021.
        source_ids: [redhat-bio]
      - text: >-
          In the current role of Senior Vice President and Chief Product Officer, Badani is responsible
          for Red Hat's product portfolio and business unit groups across on-premise, public cloud and
          edge, including product strategy, business planning, product management, marketing and
          operations.
        source_ids: [redhat-bio, redhat-leadership]
  - heading: Writing
    paragraphs:
      - text: >-
          Badani writes on the Red Hat blog. A May 2025 post published during Red Hat Summit discusses
          Red Hat Enterprise Linux 10, Red Hat AI Inference Server and the llm-d project for distributed
          inference, framing them around meeting present production needs while preparing platforms for
          generative AI.
        source_ids: [blog-now-next]
