headline: Lead of the Gemma 2 and Gemma 3 reports at Google DeepMind; co-author of Meta's LLaMA and the fastText papers
bio:
  text: >-
    Armand Joulin is listed as the lead in the contributor lists of the Gemma 2 (2024) and Gemma 3
    (2025) technical reports from Google DeepMind's Gemma Team, and among the leads of the first
    Gemma report (2024). The July 2026 Gemma 4 Technical Report from the same team lists Joulin
    among its core contributors and says the Gemma 4 models are released under an Apache 2.0
    license. Earlier, Joulin was first author of Bag of Tricks for Efficient Text Classification
    (2016), written at Facebook AI Research, and of FastText.zip, two of the three papers listed in
    the references of the MIT-licensed fastText repository. Joulin is also a co-author of LLaMA:
    Open and Efficient Foundation Language Models (2023), written at Meta AI.
  source_ids: [gemma-report, gemma2-report, gemma3-report, gemma4-report, fasttext-paper, fasttext-repo, llama-paper]
  reviewed_at: 2026-10-13
