sections:
  - heading: Research
    paragraphs:
      - text: >-
          Armand Joulin's work at Facebook AI Research included efficient text representation and
          classification. Joulin was first author of "Bag of Tricks for Efficient Text Classification"
          and "FastText.zip: Compressing text classification models" in 2016, and co-author with Piotr
          Bojanowski, Edouard Grave and Tomas Mikolov of "Enriching Word Vectors with Subword
          Information", the papers behind the fastText library.
        source_ids: [fasttext-paper, fasttext-zip-paper, subword-paper, fasttext-repo]
      - text: >-
          Joulin also worked on self-supervised learning for computer vision. With Mathilde Caron and
          others, Joulin co-authored SwAV (2020), which learns visual features by contrasting cluster
          assignments, and DINO (2021), which studied the properties of self-supervised Vision
          Transformers. Joulin is also a co-author of the 2023 DINOv2 paper on learning visual
          features without supervision.
        source_ids: [swav-paper, dino-paper, dinov2-paper]
  - heading: Open models
    paragraphs:
      - text: >-
          Joulin co-authored "LLaMA: Open and Efficient Foundation Language Models" (2023), written at
          Meta AI, whose abstract says the models were released to the research community. At Google
          DeepMind, Joulin appears among the leads of the first Gemma report in March 2024 and as the
          lead of the Gemma 2 (2024) and Gemma 3 (2025) technical reports.
        source_ids: [llama-paper, gemma-report, gemma2-report, gemma3-report]
      - text: >-
          The Gemma 4 Technical Report, submitted in July 2026, lists Joulin among its core
          contributors and says the Gemma 4 models are released under an Apache 2.0 license.
        source_ids: [gemma4-report]
