headline: Creator of OpenClaw, the open-source self-hosted AI assistant; works on agents at OpenAI
bio:
  text: >-
    Peter Steinberger is the creator of OpenClaw, an open-source, self-hosted AI assistant that is
    now stewarded by the independent OpenClaw Foundation, where Steinberger holds the title
    "Clawfather". Since February 2026 Steinberger has worked at OpenAI on agents, and the
    foundation describes Claw Labs as a team inside OpenAI that Steinberger leads. Steinberger
    previously founded PSPDFKit, now Nutrient.
  source_ids: [sp-about, sp-github, oc-readme, oc-foundation]
  reviewed_at: 2026-10-22
