sections:
  - heading: Career
    paragraphs:
      - text: >-
          Steinberger founded PSPDFKit, a company now known as Nutrient. Since February 2026 Steinberger has worked at OpenAI on bringing agents to
          a general audience, and Steinberger's GitHub profile describes the role as working on agents
          while keeping OpenClaw open and independent.
        source_ids: [sp-about, sp-github]
  - heading: OpenClaw
    paragraphs:
      - text: >-
          OpenClaw is a self-hosted assistant whose gateway connects model providers, tools and
          messaging channels. Its README credits Steinberger and the community with building it, and
          the project's lore page records that the project took the name OpenClaw on 30 January 2026.
        source_ids: [oc-readme, oc-lore]
      - text: >-
          In July 2026 Steinberger and Dave Morin, the foundation's chairperson, announced the OpenClaw
          Foundation, a 501(c)(3) nonprofit that employs the core team and signs releases while the code
          stays under the MIT license. The announcement says Steinberger continues to make the project's
          technical calls.
        source_ids: [oc-foundation, oc-readme]
