sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before NVIDIA, Aaron Lefohn worked in rendering R&D at Pixar Animation Studios, building
          interactive rendering tools for film artists, and at the graphics startup Neoptica, which made
          rendering software and programming models for Sony PlayStation 3. Lefohn also led real-time
          rendering research at Intel.
        source_ids: [nvidia-research-profile]
      - text: >-
          At NVIDIA, Lefohn is Vice President of Graphics Research and leads the Real-Time Rendering
          Research team. NVIDIA's blog says Lefohn has led real-time rendering and graphics programming
          model research teams for over fifteen years, and that the teams' work has helped bring ray and
          path tracing to real-time graphics and guide next-generation graphics programming languages.
        source_ids: [nvidia-blog-author, nvidia-research-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Lefohn's publications cover real-time denoising, ray tracing, antialiasing and foveated rendering.
          They include a 2017 SIGGRAPH paper on reconstructing Monte Carlo image sequences with a recurrent
          denoising autoencoder, Spatiotemporal Variance-Guided Filtering (HPG 2017), and a 2020 SIGGRAPH
          paper on spatiotemporal reservoir resampling for ray tracing with dynamic direct lighting.
        source_ids: [nvidia-research-profile]
      - text: >-
          More recent work combines neural networks with rendering. Random-Access Neural Compression of
          Material Textures (SIGGRAPH 2023) decompresses textures on demand with a small neural network,
          and Real-Time Neural Appearance Models was presented at SIGGRAPH 2024.
        source_ids: [neural-texture-paper, nvidia-research-profile]
  - heading: Writing
    paragraphs:
      - text: >-
          Lefohn has written on the NVIDIA Blog about the company's graphics research, including a May 2023
          post on new graphics research for generative AI and a July 2024 post previewing NVIDIA Research's
          work at SIGGRAPH 2024.
        source_ids: [nvidia-blog-author]
