headline: Vice President of Graphics Research at NVIDIA; leads the Real-Time Rendering Research team
bio:
  text: >-
    Aaron Lefohn is Vice President of Graphics Research at NVIDIA and leads the company's Real-Time
    Rendering Research team. NVIDIA's research profile says products derived from inventions by
    Lefohn's teams include DLSS, RTX Direct Illumination (RTXDI), NVIDIA's Real-Time Denoisers
    (NRD) and the OptiX Deep Learning Denoiser, and that the teams currently focus on real-time
    physically based light transport, AI computer graphics, image metrics and graphics systems.
    Lefohn co-authored "Random-Access Neural Compression of Material Textures", which received a
    SIGGRAPH 2023 Technical Papers honorable mention. Earlier, Lefohn worked in rendering R&D at
    Pixar Animation Studios, at the graphics startup Neoptica, and led real-time rendering
    research at Intel.
  source_ids: [nvidia-blog-author, nvidia-research-profile, neural-texture-paper]
  reviewed_at: 2026-10-21
