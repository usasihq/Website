sections:
  - heading: Career
    paragraphs:
      - text: >-
          Rossi was a professor of computer science at the University of Padova for 20 years before joining IBM,
          where Rossi works at the T.J. Watson IBM Research Lab. IBM Research lists Rossi as an IBM Fellow and as
          IBM's Global Leader for Responsible AI and AI Governance. Rossi's IBM profile also lists patents on
          topics such as constrained decision-making with explanations and an operating system based on a dual
          system paradigm.
        source_ids: [ibm-research-profile]
      - text: >-
          Rossi has served as president of both IJCAI and AAAI and as Editor in Chief of the Journal of Artificial
          Intelligence Research. Rossi chaired the AAAI conference in 2020 and the AAAI/ACM Conference on AI,
          Ethics, and Society in 2023, and sits on that conference's steering committee.
        source_ids: [ibm-research-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Rossi's research covers constraint reasoning, preferences, multi-agent systems, computational social
          choice, collective decision making and AI value alignment, along with ethical questions in how AI
          systems are built and behave. Rossi has co-authored a book and edited 17 volumes, including conference
          proceedings, special journal issues and a handbook.
        source_ids: [ibm-research-profile]
      - text: >-
          A recurring theme in Rossi's recent work is combining fast and slow modes of reasoning. "Thinking Fast and
          Slow in AI" (2020) proposed drawing on cognitive theories of human decision making, and a 2021 follow-up
          examined the role of metacognition in such systems. Later co-authored papers study the use of
          large language models in automated planning and scheduling, and Rossi's IBM profile lists an AAAI 2026
          tutorial on SOFAI-LM, an architecture for reasoning systems built with language models.
        source_ids: [fast-slow-paper, metacognition-paper, llm-planning-paper, ibm-research-profile]
  - heading: AI ethics and governance
    paragraphs:
      - text: >-
          Rossi has been a member of the European Commission's High Level Expert Group on AI. Rossi is a member
          of the scientific advisory board of the Future of Life Institute and of the board of the Partnership on
          AI, and co-chairs the Responsible AI working group of the Global Partnership on AI and the OECD Expert
          Group on AI Futures.
        source_ids: [ibm-research-profile]
