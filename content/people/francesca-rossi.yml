headline: IBM Fellow and IBM Global Leader for Responsible AI and AI Governance; past president of AAAI and IJCAI
bio:
  text: >-
    Francesca Rossi is an IBM Fellow and IBM's Global Leader for Responsible AI and AI Governance,
    according to the IBM Research profile. Before IBM, Rossi was a
    professor of computer science at the University of Padova for 20 years. Rossi's research covers
    constraint reasoning, preferences, multi-agent systems, computational social choice, and AI value
    alignment, along with ethical issues in AI systems; Rossi co-authored "Thinking Fast and Slow in AI,"
    which proposes drawing on cognitive theories of human decision making to advance AI. The profile
    notes that Rossi has served as president of IJCAI and of AAAI and is a fellow of AAAI and EurAI.
