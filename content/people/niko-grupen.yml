headline: Head of Applied Research at Harvey; lead byline on the Legal Agent Benchmark (LAB) announcement
bio:
  text: >-
    Niko Grupen is the Head of Applied Research at Harvey, which builds AI software for legal work.
    Grupen joined Harvey in early 2023 after working as a researcher at Google Brain, on reinforcement
    learning and multi-agent systems, and as a machine learning engineer at Apple. Grupen is the first
    byline author of the post that introduced LAB, Harvey's open-source Legal Agent Benchmark.
  source_ids: [harvey-author-grupen, harvey-lab-post]
  reviewed_at: 2026-10-22
