sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before joining Harvey in early 2023, Grupen was a researcher at Google Brain, working on
          reinforcement learning and multi-agent systems, and a machine learning engineer at Apple.
          Harvey's author page lists Grupen today as Head of Applied Research.
        source_ids: [harvey-author-grupen]
  - heading: Legal Agent Benchmark
    paragraphs:
      - text: >-
          Grupen, Gabe Pereyra and Julio Pereyra wrote "Introducing Harvey's Legal Agent Benchmark"
          (May 2026). LAB's repository describes two parts: a dataset of tasks with agent instructions,
          documents and rubrics, and an execution harness for running and evaluating agents against them.
        source_ids: [harvey-lab-post, harvey-labs-readme]
      - text: >-
          Grupen's later posts include "Extending Harvey's Legal Agent Bench to In-House Contracting"
          (June 2026) and "LAB: Law Firm Knowledge" (August 2026), along with posts on training legal
          agents and review-table models.
        source_ids: [harvey-author-grupen]
