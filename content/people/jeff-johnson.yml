headline: Meta FAIR research scientist; implemented the GPU version of the Faiss similarity search library
bio:
  text: >-
    Jeff Johnson is a research scientist in the SysML research group at Meta's Fundamental AI Research
    (FAIR) lab, working on GPU-based algorithms for machine learning and on ASIC and FPGA computer
    arithmetic for linear algebra. The Faiss README credits Johnson with implementing all of the GPU
    version of Faiss, and Johnson is first author of "Billion-scale similarity search with GPUs" (2017).
    Johnson's GitHub profile also says Johnson wrote the original PyTorch GPU backend.
  source_ids: [meta-johnson, faiss-readme, faiss-gpu-paper, johnson-github]
  reviewed_at: 2026-10-22
