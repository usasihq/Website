sections:
  - heading: Research
    paragraphs:
      - text: >-
          Johnson works in FAIR's SysML research group on GPU algorithms for machine learning and on ASIC
          and FPGA arithmetic for linear algebra. Johnson's papers include "Rethinking floating point for
          deep learning" (December 2018) and "Efficient, arbitrarily high precision hardware logarithmic
          arithmetic for linear algebra" (May 2020), both as sole author.
        source_ids: [meta-johnson]
  - heading: Faiss
    paragraphs:
      - text: >-
          Johnson, Matthijs Douze and Hervé Jégou wrote "Billion-scale similarity search with GPUs"
          (February 2017), and the MIT-licensed Faiss repository was opened the same month. The README
          credits Johnson with all of the GPU Faiss, and Johnson is also a co-author of "The Faiss library"
          (2024).
        source_ids: [faiss-gpu-paper, faiss-readme, faiss-library-paper]
