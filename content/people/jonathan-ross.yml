headline: Founder and former CEO of Groq, maker of the LPU inference chip and the GroqCloud platform
bio:
  text: >-
    Jonathan Ross founded Groq, whose custom-built LPU chip and cloud run AI models for inference, and
    was quoted as Groq's CEO and Founder in company announcements such as the April 2025 release on
    Groq serving fast inference for Meta's official Llama API. A November 2024 Groq blog post on the
    future stages of generative AI is adapted from an original post by Ross. In December 2025 Groq
    announced a non-exclusive inference technology licensing agreement with NVIDIA, under which Ross
    and other members of the Groq team would join NVIDIA, while Simon Edwards stepped into the role of
    Groq's CEO.
