sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jonathan Ross founded Groq and appeared as Groq CEO in company announcements from the February 2024
          release on the LPU Inference Engine's first independent benchmark to the July 2025 opening of a European
          data center in Helsinki with Equinix.
        source_ids: [groq-lpu-benchmark, groq-helsinki]
      - text: >-
          In December 2025 Groq announced a non-exclusive licensing agreement with NVIDIA for its inference
          technology. Under the agreement Ross, Groq President Sunny Madra and other team members would join
          NVIDIA to help scale the licensed technology, while Groq continued as an independent company with Simon
          Edwards as Chief Executive Officer.
        source_ids: [groq-nvidia]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Under Ross, Groq built the LPU Inference Engine, a language processing accelerator designed for
          low-latency, energy-efficient and repeatable inference, and offered it through the GroqCloud platform.
          In April 2025 Groq partnered with Meta to serve fast inference for the official Llama API.
        source_ids: [groq-lpu-benchmark, groq-meta-llama]
