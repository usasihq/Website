sections:
  - heading: Research
    paragraphs:
      - text: >-
          Polosukhin's early research papers addressed language understanding over large text collections.
          Polosukhin co-authored WikiReading (2016), a large-scale natural language understanding task built on
          Wikipedia, and a 2016 framework for answering questions over long documents. A 2017 paper on TensorFlow
          Estimators, a high-level machine learning framework, also lists Polosukhin among its authors.
        source_ids: [wikireading-paper, hierarchical-qa-paper, tf-estimators-paper]
      - text: >-
          Polosukhin is a co-author of "Attention Is All You Need" (2017), the paper that introduced the
          Transformer architecture. The paper's contribution notes say that Ashish Vaswani and Polosukhin designed
          and implemented the first Transformer models, and that Polosukhin's work was done while at Google
          Research.
        source_ids: [attention-paper]
  - heading: Program synthesis and NEAR
    paragraphs:
      - text: >-
          With Alexander Skidanov, Polosukhin wrote "Neural Program Search" (2018), an algorithm that generates
          programs from a natural language description and a few input-output examples, and co-authored NAPS, a
          dataset of human-written problem statements and solutions for program synthesis.
        source_ids: [neural-program-search-paper, naps-paper]
      - text: >-
          NEAR AI's company page describes Polosukhin as the creator of the NEAR blockchain and the founder of
          NEAR AI, which works on verified, user-owned and private AI. Polosukhin and Skidanov's 2025 paper "Proof
          of Response" presents a mechanism in which a request in a network receives either a response within a known time
          bound or a proof that a link along the way failed, and it appears among the papers listed by the NEAR ecosystem. The NEAR
          Foundation lists Polosukhin as a member of its council.
        source_ids: [nearai-company, proof-of-response-paper, near-papers, near-foundation-about]
