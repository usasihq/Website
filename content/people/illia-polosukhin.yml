headline: Founder of NEAR AI; co-author of the Transformer paper, written while at Google Research
bio:
  text: >-
    Illia Polosukhin is the founder of NEAR AI, whose company page describes Polosukhin as a co-author of
    Attention Is All You Need and the creator of the NEAR blockchain. That 2017 paper, which introduced
    the Transformer, notes that Polosukhin's work on it was performed while at Google Research, and its
    contribution note says Ashish Vaswani, with Polosukhin, designed and implemented the first
    Transformer models.
