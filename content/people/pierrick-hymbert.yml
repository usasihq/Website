work:
  - name: llama.cpp
    artifact_slug: llama-cpp
    type: open-source
    url: https://github.com/ggml-org/llama.cpp
    contribution: >-
      Commits authored from February 2024 to January 2025 include server test and benchmark CI
      workflows, server fixes such as token usage in streamed OpenAI-compatible responses, support
      for the DbrxForCausalLM and PhiMoE architectures, the eval-callback debugging example, imatrix
      and dataset metadata in quantized GGUF files, and a guide to adding a model. The repository is
      MIT-licensed.
    source_ids: [llama-cpp-commits, llama-cpp-license]
links:
  - label: GitHub
