headline: Contributor to llama.cpp's server, its test and benchmark workflows, and model support
bio:
  text: >-
    Pierrick Hymbert is a developer whose GitHub profile lists BNP Paribas as company. Hymbert's
    commits to llama.cpp, the C/C++ runtime for running language models on local hardware, cover
    the project's HTTP server, the CI workflows that test and benchmark it, and support for model
    architectures including DBRX and PhiMoE; the most recent dates from January 2025. Hymbert also
    added an eval-callback example for debugging, imatrix and dataset
    metadata in quantized GGUF files, and documentation on how to add a model.
  source_ids: [github-profile, llama-cpp-commits]
  reviewed_at: 2026-10-21
affiliations:
  - name: BNP Paribas
    organization_slug: null
    role: Developer (BNP Paribas is the company listed on Hymbert's GitHub profile)
    current: true
