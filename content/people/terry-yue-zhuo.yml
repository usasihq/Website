headline: Lead author of the BigCodeBench code-generation benchmark; former research lead at Alibaba Qwen
bio:
  text: >-
    Terry Yue Zhuo is a researcher in code intelligence and frontier AI risks. Zhuo is first author
    of the BigCodeBench paper (2024), which introduced a benchmark for code generation with diverse
    function calls and complex instructions within the BigCode project. Zhuo's site says Zhuo was
    a research lead at Alibaba Qwen, where Zhuo founded the Qwen Cyber team, and earlier worked on code
    intelligence during a PhD at Monash University.
  source_ids: [tz-site, bcb-paper]
  reviewed_at: 2026-10-22
