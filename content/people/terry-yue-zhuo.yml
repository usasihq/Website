sections:
  - heading: Career
    paragraphs:
      - text: >-
          Zhuo worked on code intelligence during a PhD at Monash University and has spent time at Amazon
          AWS AI, ByteDance, Sea AI Lab and CSIRO's Data61. Zhuo later was a research lead at Alibaba
          Qwen, founding the Qwen Cyber team and leading training of language models with cyber
          capabilities. Zhuo's site lists current interests in frontier AI risks and dual-use capabilities.
        source_ids: [tz-site]
  - heading: Research
    paragraphs:
      - text: >-
          Through the BigCode collaboration Zhuo was first author of BigCodeBench (2024), presented at
          ICLR 2025, and a co-author of StarCoder 2 (2024). Earlier single-author work includes ICE-Score
          (2023), on instructing LLMs to evaluate code, and later work includes Cyber-Zero (2025) and
          CTF-Dojo (2025), on training cybersecurity agents.
        source_ids: [bcb-paper, tz-site, starcoder2-paper, icescore-paper, cyberzero-paper, ctfdojo-paper]
