headline: MIT associate professor and NVIDIA research director; co-author of AWQ, SmoothQuant and StreamingLLM
bio:
  text: >-
    Song Han is an associate professor with tenure in MIT's Department of Electrical Engineering and
    Computer Science and a research director at NVIDIA, where Han leads the Efficient AI team. Han's
    work centers on efficient AI computing, from the Deep Compression pruning and quantization
    techniques and the Efficient Inference Engine to TinyML methods for fitting neural networks on
    microcontrollers. More recently, Han co-authored AWQ, a 4-bit weight quantization method whose
    MIT-licensed repository includes TinyChat for on-device inference on edge GPUs, along with
    SmoothQuant and StreamingLLM for more efficient language-model inference. Han also developed the
    open lecture series EfficientML.ai, home of MIT's TinyML and Efficient AI Computing course, and
    has received the NSF CAREER Award and a Sloan Research Fellowship.
  source_ids: [hanlab-bio, mit-eecs, nvidia-bio, awq-paper, awq-repo, smoothquant-paper, streamingllm-paper, efficientml-course]
  reviewed_at: 2026-10-13
