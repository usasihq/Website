sections:
  - heading: Career
    paragraphs:
      - text: >-
          Song Han received a PhD from Stanford University advised by Bill Dally. Han is now an
          associate professor with tenure in MIT's Department of Electrical Engineering and Computer
          Science, where Han leads the MIT HAN Lab.
        source_ids: [hanlab-bio, mit-eecs]
      - text: >-
          Han is also a research director at NVIDIA, where Han leads the Efficient AI team. NVIDIA's profile notes that Han's team has recently worked on language
          model quantization, sparse attention, long-context inference and efficient visual generation.
        source_ids: [nvidia-bio]
  - heading: Research
    paragraphs:
      - text: >-
          Han's research focuses on efficient AI computing. Deep Compression (2015), written with Huizi
          Mao and Bill Dally, combined pruning, trained quantization and Huffman coding to shrink neural
          networks, and the Efficient Inference Engine (EIE, 2016) brought weight sparsity to AI
          accelerator design. Han has received best paper awards at ICLR 2016, FPGA 2017 and MLSys
          2024.
        source_ids: [hanlab-bio, deep-compression-paper, eie-paper]
      - text: >-
          Han's group extended this work to hardware-aware neural architecture search with Once-for-All
          (2019) and to TinyML with MCUNet (2020), which runs deep learning on microcontrollers. For
          large language models, the lab developed SmoothQuant (2022), AWQ (2023), which received the
          MLSys 2024 best paper award, and StreamingLLM (2023), and Han's site notes that these methods
          were adopted by NVIDIA TensorRT-LLM. Han also co-authored SANA (2024), a linear diffusion
          transformer for efficient high-resolution image synthesis.
        source_ids: [ofa-paper, mcunet-paper, smoothquant-paper, awq-paper, streamingllm-paper, hanlab-bio, sana-paper]
  - heading: Teaching
    paragraphs:
      - text: >-
          Han developed EfficientML.ai, an open lecture series and the course site for MIT 6.5940,
          TinyML and Efficient AI Computing, to share advances in efficient machine learning research.
        source_ids: [hanlab-bio, efficientml-course]
