work:
  - name: AWQ (Activation-aware Weight Quantization) and TinyChat
    artifact_slug: awq
    type: open-source
    url: https://github.com/mit-han-lab/llm-awq
    contribution: >-
      Co-author of the AWQ paper (2023) with Ji Lin, Jiaming Tang and others, which also presents
      TinyChat, an inference framework for 4-bit on-device language and vision-language models. The
      MIT-licensed llm-awq repository describes TinyChat as a turn-key solution for on-device
      inference on resource-constrained edge platforms and shows it running on NVIDIA Jetson Orin,
      and Han's MIT page notes the paper's Best Paper Award at MLSys 2024.
    source_ids: [awq-paper, awq-repo, awq-license, hanlab-bio]
  - name: SmoothQuant
    artifact_slug: null
    type: open-source
    url: https://github.com/mit-han-lab/smoothquant
    contribution: >-
      Co-author of SmoothQuant (2022), a training-free 8-bit post-training quantization method for
      large language models; the code is published by MIT HAN Lab under the MIT license.
    source_ids: [smoothquant-paper, smoothquant-license, hanlab-bio]
  - name: StreamingLLM
    artifact_slug: null
    type: open-source
    url: https://github.com/mit-han-lab/streaming-llm
    contribution: >-
      Co-author with Guangxuan Xiao, Yuandong Tian, Beidi Chen and Mike Lewis of "Efficient Streaming
      Language Models with Attention Sinks" (2023), which keeps attention-sink tokens in the KV cache
      so a model can generate long text with a fixed memory budget; the code is MIT-licensed.
    source_ids: [streamingllm-paper, streamingllm-license, hanlab-bio]
  - name: TinyML and Efficient AI Computing (MIT 6.5940, EfficientML.ai)
    artifact_slug: null
    type: open-research
    url: https://efficientml.ai
    contribution: >-
      Developed the open lecture series EfficientML.ai, the course site for MIT 6.5940 TinyML and
      Efficient AI Computing, to share advances in efficient machine learning research.
    source_ids: [hanlab-bio, efficientml-course]
