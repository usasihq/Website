headline: Google DeepMind research engineer; lead author of the Inverse Scaling paper and FAR.AI's STACK study
bio:
  text: >-
    Ian R. McKenzie is a Research Engineer at Google DeepMind, a role McKenzie's own site dates to
    September 2025. McKenzie is first author of "Inverse Scaling: When Bigger Isn't Better," which reports
    tasks where language models get worse as they grow, drawn from the public Inverse Scaling Prize
    contest, and which released the winning datasets. McKenzie's papers from 2023 to 2025 list a
    FAR.AI affiliation, including "Scaling Trends in Language Model Robustness" and "STACK," a study
    that builds and red-teams an open-source safeguard pipeline for large language models.
  source_ids: [mckenzie-site, invscale-paper, invscale-pdf, robustness-paper, robustness-pdf, stack-paper, stack-pdf]
  reviewed_at: 2026-10-21
