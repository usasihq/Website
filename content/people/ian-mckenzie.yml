sections:
  - heading: Career
    paragraphs:
      - text: >-
          McKenzie was a software engineering intern at Ought and later a Research Engineer at FAR.AI, where McKenzie ran the Inverse
          Scaling Prize and, under contract with OpenAI, built evaluations of dangerous capabilities and AI
          research and development.
        source_ids: [mckenzie-site]
      - text: >-
          Since September 2025 McKenzie has been a Research Engineer at Google DeepMind.
        source_ids: [mckenzie-site]
  - heading: Research
    paragraphs:
      - text: >-
          The Inverse Scaling Prize, which opened on June 27, 2022 and ran two rounds of submissions, invited
          tasks on which larger language models perform worse than smaller ones. The organizers' first-round
          write-up, published on McKenzie's site, presented the winning tasks, such as a negation benchmark, and
          common mistakes seen while reviewing submissions, and the resulting paper, Inverse Scaling: When Bigger Isn't Better, analyzed the winning
          datasets and released them.
        source_ids: [prize-repo, round1-post, invscale-paper]
      - text: >-
          McKenzie's later work at FAR.AI studied the robustness of language models: Scaling Trends in Language
          Model Robustness (2024) examined how attack and defense compute affect robustness as models grow, and
          STACK (2025) built an open-source safeguard pipeline and attacked it with a staged procedure aimed at
          classifier-based defenses.
        source_ids: [robustness-paper, stack-paper]
