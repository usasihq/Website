headline: Co-founder and CTO of Mistral AI; co-author of Meta's LLaMA paper
bio:
  text: >-
    Timothée Lacroix is a co-founder and the CTO of Mistral AI, according to the company's about page.
    Lacroix is a co-author of LLaMA: Open and Efficient Foundation Language Models (2023), whose
    authors are listed with a Meta AI affiliation, and first author of Canonical Tensor Decomposition
    for Knowledge Base Completion (2018). Lacroix co-authored the Mistral 7B and Mixtral of Experts
    papers, which say the models are released under the Apache 2.0 license, and is listed among the
    authors of Devstral (2025), a paper from Mistral AI and All Hands AI.
  source_ids: [mistral-about, llama-paper, kbc-paper, mistral7b-paper, mixtral-paper, devstral-paper]
