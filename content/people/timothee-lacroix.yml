sections:
  - heading: Research
    paragraphs:
      - text: >-
          Lacroix's early research concerned knowledge base completion. With Nicolas Usunier and Guillaume
          Obozinski, Lacroix first-authored "Canonical Tensor Decomposition for Knowledge Base Completion" in 2018
          and a 2020 follow-up on tensor decompositions for temporal knowledge base completion.
        source_ids: [kbc-paper, tl-temporal]
      - text: >-
          Lacroix then turned to large language models and is a co-author of the February 2023 LLaMA paper,
          whose authors are listed with Meta AI. At Mistral AI, Lacroix co-authored the Mistral 7B and Mixtral of
          Experts papers, describing models released under the Apache 2.0 license, and the 2025 Devstral paper on
          fine-tuning language models for coding agents.
        source_ids: [llama-paper, mistral7b-paper, mixtral-paper, devstral-paper]
  - heading: Mistral AI
    paragraphs:
      - text: >-
          Mistral AI's about page says the company was founded in April 2023 and lists Lacroix as co-founder and
          CTO alongside Arthur Mensch, the CEO, and Guillaume Lample, the Chief Science Officer. The page's key
          dates include the release of the 7B model in September 2023, Mistral Large in February 2024, Mistral
          Small 3 and a new Le Chat in early 2025, and later products such as Mistral Code, Mistral Compute,
          Voxtral, Mistral Studio and Forge.
        source_ids: [mistral-about]
