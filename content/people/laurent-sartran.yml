sections:
  - heading: Research
    paragraphs:
      - text: >-
          Sartran's papers include work on machine translation: Sartran co-authored "Better
          Document-Level Machine Translation with Bayes' Rule" (2019, accepted by TACL) and "Enabling arbitrary
          translation objectives with Adaptive Tree Search" (2022). Sartran also co-authored "Rapid
          Task-Solving in Novel Environments" (2020), on agents that explore and solve tasks in unfamiliar
          settings.
        source_ids: [doc-mt-paper, ats-paper, rapid-task-paper]
      - text: >-
          As first author of Transformer Grammars (TACL 2022), Sartran studied adding syntactic inductive
          biases to Transformer language models by composing representations of constituents recursively.
          Later co-authored work covers continuous diffusion for categorical data (2022) and fine-grained
          vision-and-language evaluation (ACL 2023).
        source_ids: [tg-paper, tg-pdf, cdcd-paper, finegrained-vl-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Code for Transformer Grammars and for SynJax, a JAX library of vectorized inference for structured
          distributions such as alignments, segmentations and trees written with Miloš Stanojević, is
          published in the google-deepmind GitHub organization under the Apache-2.0 license.
        source_ids: [tg-repo, synjax-paper, synjax-repo]
