headline: First author of Transformer Grammars at DeepMind and co-author of the SynJax library for JAX
bio:
  text: >-
    Laurent Sartran is first author of Transformer Grammars (2022), a class of Transformer language
    models that compose representations of syntactic constituents recursively; the paper lists
    Sartran at DeepMind, and the code is published in the google-deepmind GitHub organization under
    the Apache-2.0 license. With Miloš Stanojević, Sartran co-authored SynJax, a JAX library of
    vectorized inference algorithms for structured distributions such as alignments, segmentations,
    and trees, also published by google-deepmind under Apache-2.0.
  source_ids: [tg-paper, tg-pdf, tg-repo, synjax-paper, synjax-repo]
  reviewed_at: 2026-10-21
