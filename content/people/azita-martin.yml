sections:
  - heading: Career
    paragraphs:
      - text: >-
          Azita Martin leads the retail team at NVIDIA, where Martin is responsible for global
          go-to-market strategy and advises senior executives on applying AI to operations. NVIDIA's
          event page for the National Retail Federation's 2025 show listed Martin as Vice President and
          General Manager for Retail and CPG, opening the keynote session alongside Walmart U.S.
          leadership.
        source_ids: [nvidia-blog-author, nrf-2025]
      - text: >-
          Before joining NVIDIA, Martin was chief marketing officer at Maana, an AI software platform
          that industrial companies used to build AI applications. In that work Martin collaborated with
          chief digital officers and analytics and AI leaders at large industrial companies.
        source_ids: [nvidia-blog-author]
  - heading: Writing on AI in retail
    paragraphs:
      - text: >-
          Martin has written NVIDIA Blog posts on AI in retail. A January 2022 post described NVIDIA AI
          Enterprise uses for retailers and quick-service restaurants, from intelligent stores to
          AI-driven forecasting, and a January 2023 post introduced Retail AI Workflows aimed at
          reducing shrink.
        source_ids: [post-2022-nrf, post-2023-shrink]
      - text: >-
          In January 2024 Martin wrote about generative AI in retail, including custom models built with
          NVIDIA NeMo, and about a collaboration with the Loss Prevention Research Council on a real-time
          solution against organized retail crime. A June 2025 post summarized how brands including
          L'Oréal, LVMH, and Nestlé use agentic and physical AI in operations from product design and
          marketing to logistics.
        source_ids: [post-2024-genai, post-2024-lprc, post-2025-reboot]
