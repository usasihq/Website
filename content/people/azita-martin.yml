headline: Listed by NVIDIA in 2025 as VP and general manager for retail and consumer packaged goods
bio:
  text: >-
    NVIDIA's blog author page describes Azita Martin as leading the retail team at NVIDIA, responsible
    for its global go-to-market strategy, and NVIDIA's NRF 2025 event page lists Martin as VP and GM for Retail and CPG. NVIDIA describes
    Martin as advising senior executives on using AI to improve operational efficiency and find new
    revenue streams. Martin's NVIDIA blog posts cover AI in retail and consumer packaged goods,
    including a January 2024 collaboration with the Loss Prevention Research Council on a
    real-time solution against organized retail crime and a June 2025 overview of how global brands
    use NVIDIA technology across end-to-end operations. Before NVIDIA, Martin was chief marketing
    officer at Maana, an AI software platform for industrial companies.
  source_ids: [nvidia-blog-author, nrf-2025]
