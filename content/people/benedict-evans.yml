headline: Independent technology analyst writing essays and a weekly newsletter on what matters in tech
bio:
  text: >-
    Benedict Evans is an independent analyst who writes essays, a weekly newsletter, and
    presentations about mobile, media, and technology, including recent essays on AI tools, token
    pricing, and AI job exposure. Benedict's Newsletter picks out the week's tech changes and ideas
    and gives them context and analysis, with a premium edition that adds a column and archive
    access. Before working independently, Benedict Evans worked in equity research, strategy,
    consulting, and venture capital.
  source_ids: [contact, home, newsletter]
  reviewed_at: 2026-10-21
