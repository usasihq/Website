sections:
  - heading: Career
    paragraphs:
      - text: >-
          Evans describes 25 years of analyzing mobile, media and technology, with earlier work in equity
          research, strategy, consulting and venture capital before becoming an independent analyst. Evans
          frames the work as trying to work out which questions to ask about what is happening in tech and what
          it might mean. In recent years Evans has given presentations for companies including Alphabet,
          Amazon, Deutsche Telekom, Hitachi, Nasdaq, Verizon and Vodafone.
        source_ids: [contact, presentations]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Evans's website publishes essays on questions Evans is trying to understand. Essays from 2026 include
          "Predicting AI job exposure", on attempts to score jobs and industries by their exposure to AI,
          "Ways to think about token pricing", on how supply, demand and prices for AI models may settle, and
          "AI, tools and transformation", on whether AI will turn everyone into a builder of their own software.
        source_ids: [home]
      - text: >-
          Benedict's Newsletter is a weekly email that selects the tech changes and ideas of the week and adds
          context and analysis. A premium edition arrives on Sunday evenings with an extra column and access to
          an archive of more than 600 issues, while the free edition carries the core news two days later.
        source_ids: [newsletter]
      - text: >-
          Twice a year Evans produces a long presentation on macro and strategic trends in the technology
          industry. The series began with "Mobile is Eating the World" in 2013 and, since 2024, has carried the
          title "AI eats the world"; the Spring 2026 edition was presented at the SuperAI conference.
        source_ids: [presentations]
