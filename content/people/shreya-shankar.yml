sections:
  - heading: Career
    paragraphs:
      - text: >-
          Shankar studied computer science at Stanford, completing a B.S. advised by Pat Hanrahan, and was a
          research intern at Google Brain from 2017 to 2019, working with Alex Kurakin and Ian Goodfellow on
          machine learning security and adversarial examples, and also worked as an ML engineer. Shankar began a
          PhD in EECS at UC Berkeley in 2021 with Aditya Parameswaran in the Data Systems & Foundations Group,
          with a research internship on Meta's AI Data Infrastructure team in 2022 and a visiting student
          researcher role at Google's Systems Research Group in 2025.
        source_ids: [ss-cv, shankar-site]
      - text: >-
          Shankar's CV lists a Visiting Assistant Professor appointment in Carnegie Mellon University's Computer
          Science Department from July 2026, before a tenure-track Assistant Professor position there from July
          2027, with a courtesy appointment in the Human-Computer Interaction Institute and an affiliation with
          the CMU Database Group. Shankar's group writes a blog called Full Stack Data Lab.
        source_ids: [ss-cv, shankar-site]
  - heading: Research
    paragraphs:
      - text: >-
          Shankar's research spans data management, AI-powered data systems and human-computer interaction. As
          first author of the 2024 DocETL paper, Shankar proposed agentic query rewriting and evaluation for
          complex document processing with language models, and the open-source DocETL stack grew out of that
          work at Berkeley's EPIC Data Lab.
        source_ids: [ss-cv, docetl-paper, docetl-repo]
      - text: >-
          Follow-up work includes Task Cascades and "Cut Costs, Not Accuracy" at SIGMOD 2026, the latter
          recognized as Best of SIGMOD, and "RAG Without the Lag," an interactive debugging tool for
          retrieval-augmented generation pipelines that won a CHI 2026 Best Paper award. Shankar's group also
          released Data Agent Bench, a benchmark for data agents, and Quail, a query-aware inference engine for
          AI-SQL workloads.
        source_ids: [ss-cv, shankar-site]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Since 2025 Shankar has co-taught AI Evals for Engineers and PMs, a professional course co-founded with
          Hamel Husain, and is co-writing a forthcoming O'Reilly book on the subject; the pair also publish an
          evals FAQ and other free materials. Shankar co-wrote the 2024 essay "What We've Learned From A Year of
          Building with LLMs" and has organized the DEEM workshop at SIGMOD from 2023 to 2025.
        source_ids: [ss-cv, shankar-site, applied-llms]
