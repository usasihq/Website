headline: Computer science researcher who built DocETL at UC Berkeley; incoming Assistant Professor at Carnegie Mellon
bio:
  text: >-
    Shreya Shankar is a computer science researcher who will join Carnegie Mellon University's
    Computer Science Department as an Assistant Professor in 2027, affiliated with the CMU Database
    Group. During a PhD in EECS at UC Berkeley, working with Aditya Parameswaran, Shankar built the
    DocETL stack for LLM-powered data processing; the DocETL repository says the system was created
    at Berkeley's EPIC Data Lab and Data Systems and Foundations group. Shankar is first author of
    the DocETL paper (2024), which proposed agentic query rewriting and evaluation for complex
    document processing. Shankar also co-teaches a course on AI evals with Hamel Husain and is a
    co-author of "What We've Learned From A Year of Building with LLMs" (2024).
  source_ids: [shankar-site, github-profile, docetl-repo, docetl-paper, applied-llms]
  reviewed_at: 2026-10-21
