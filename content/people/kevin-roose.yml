headline: Journalist covering AI, co-host of the Machine Gods podcast and author of The AGI Chronicles
bio:
  text: >-
    Kevin Roose is a journalist who covers AI and the technology industry and a contributing writer at
    The Atlantic. With Casey Newton, Roose co-hosts Machine Gods, a weekly podcast about AI made in
    partnership with NPR. Roose was previously a technology columnist at The New York Times, where
    Roose co-created and co-hosted the Hard Fork podcast and created the Rabbit Hole series. Roose's
    books include The AGI Chronicles (2026), about the race to build artificial general intelligence,
    and Futureproof (2021), about AI and automation.
  source_ids: [site, machine-gods]
  reviewed_at: 2026-10-21
