headline: Journalist covering AI, co-host of the Machine Gods podcast and author of The AGI Chronicles
bio:
  text: >-
    Kevin Roose is a journalist who covers AI and the technology industry and a contributing writer at
    The Atlantic. With Casey Newton, Kevin co-hosts Machine Gods, a podcast about AI made in
    partnership with NPR, which its site says starts the week of October 19, 2026. Kevin was previously a technology columnist at The New York Times, where Kevin
    co-created and co-hosted the Hard Fork podcast and created the Rabbit Hole series. Kevin's books include
    The AGI Chronicles (2026), about the race to build artificial general intelligence, and Futureproof
    (2021), about AI and automation.
  source_ids: [site, machine-gods]
  reviewed_at: 2026-10-17
