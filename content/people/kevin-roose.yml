sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before joining The New York Times, Roose was a writer at New York magazine. Roose then spent a decade as
          a technology columnist at the Times, where Roose created Rabbit Hole, an eight-part investigative audio
          series from 2020 on how the internet shapes beliefs, and co-created the tech podcast Hard Fork with
          Casey Newton, which they co-hosted from 2022 to 2026.
        source_ids: [site]
      - text: >-
          Roose is now a contributing writer at The Atlantic and co-hosts Machine Gods with Newton, a weekly
          podcast about AI produced in partnership with NPR, which began in 2026. Each week the hosts interview a
          guest and then discuss recent developments in AI.
        source_ids: [site]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Roose has written four books. The AGI Chronicles: The Inside Story of the Race to Create an Artificial
          Superintelligence (Farrar, Straus and Giroux, 2026) draws on interviews with people at OpenAI,
          Anthropic and Google DeepMind, and an excerpt appeared in The Atlantic. Earlier books include Futureproof:
          9 Rules for Humans in the Age of Automation (2021) and Young Money (2014), which followed new Wall Street
          recruits after the 2008 financial crisis.
        source_ids: [site, agi-chronicles]
      - text: >-
          Roose's reporting on AI and online life includes a 2018 investigation of deepfake videos, a 2023 account
          of a long conversation with Microsoft's Bing chatbot, and 2024 pieces on AI companions and on attempts
          to change how chatbots describe a person. Roose also gave a 2021 TED talk on the value of human skills
          in an automated future.
        source_ids: [site]
