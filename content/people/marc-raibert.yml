headline: Founder of Boston Dynamics and executive director of the Robotics and AI Institute
bio:
  text: >-
    Marc Raibert is the founder of Boston Dynamics, which Raibert spun off from the MIT Leg Laboratory
    in 1992, and is the founder and executive director of the Robotics and AI Institute, where Raibert
    is responsible for the institute's strategic roadmap for future generations of advanced robots.
    Before Boston Dynamics, Raibert was a professor of electrical engineering and computer science at
    MIT, and at Carnegie Mellon University before that; in those posts Raibert created the Leg
    Laboratory.
  source_ids: [rai-raibert, bd-about, rai-about]
