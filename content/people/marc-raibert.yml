sections:
  - heading: Career
    paragraphs:
      - text: >-
          Raibert was a faculty member at Carnegie Mellon University and then a professor of electrical
          engineering and computer science at MIT, and in those posts created the Leg Laboratory, which
          helped establish the scientific basis for highly dynamic robots. In 1992 Raibert spun Boston Dynamics off from the MIT Leg Lab,
          and Robert Playter joined soon after.
        source_ids: [rai-raibert, bd-about]
      - text: >-
          Boston Dynamics' history lists BigDog (2004) as its first quadruped robot to leave the lab, the
          first-generation Atlas humanoid (2013), the commercial release of Spot (2020) and the unveiling of Stretch (2021).
          Raibert now leads the Robotics and AI Institute as executive director, setting its roadmap for
          advanced robots and intelligent machines.
        source_ids: [bd-about, rai-raibert, rai-about]
