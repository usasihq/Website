headline: Lead Research Scientist on the Olmo team at Ai2; credited with technical leadership on Olmo 3
bio:
  text: >-
    Pradeep Dasigi is a Lead Research Scientist on the Olmo team at the Allen Institute for AI (Ai2),
    working on open language models such as OLMo and Tülu with a focus on post-training. The Olmo 3
    report lists Dasigi among the authors credited with technical leadership and cross-workstream
    contributions, and Dasigi is a co-author of the Tülu 3 post-training report. Dasigi's earlier work
    covers reading-comprehension benchmarks, training data curation and robustness of learning
    algorithms.
  source_ids: [dasigi-site, dasigi-research, olmo3-paper, tulu3-paper]
  reviewed_at: 2026-10-22
