sections:
  - heading: Career
    paragraphs:
      - text: >-
          Dasigi is a Lead Research Scientist on the Olmo team at Ai2 and is listed in Ai2's team directory.
          Dasigi's page notes past work with the AllenNLP team and describes current interest in training
          language and vision-language models for long-horizon agentic tasks such as coding, search and web
          browsing.
        source_ids: [dasigi-site, ai2-team]
  - heading: Research
    paragraphs:
      - text: >-
          Dasigi's early benchmark work includes DROP (2019), a reading-comprehension benchmark requiring
          discrete reasoning, and Quoref (2019) and Qasper (2021), both as first author. Dasigi's research
          page groups later work under efficient adaptation of language models and robustness to
          distribution shifts.
        source_ids: [drop-paper, quoref-paper, qasper-paper, dasigi-research]
      - text: >-
          On open language-model recipes, Dasigi co-authored "How Far Can Camels Go?" (2023) on instruction
          tuning with open resources, the Tülu 3 report (2024) and the Olmo 3 report (2025), where Dasigi is
          credited for technical leadership alongside work on post-training and evaluation.
        source_ids: [camels-paper, tulu3-paper, olmo3-paper, dasigi-research]
