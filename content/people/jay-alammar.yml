sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Jay Alammar's technical blog explains machine learning ideas through diagrams and
          animations. Posts include The Illustrated Transformer (June 2018) and The Illustrated BERT,
          ELMo, and co. (December 2018), which the blog's about page notes are referenced in
          university AI courses, along with The Illustrated GPT-2 (2019), a visual
          explanation of how GPT-3 works (2020) and The Illustrated Stable Diffusion (2022).
        source_ids: [blog-about, illustrated-transformer, illustrated-bert, illustrated-gpt2, gpt3-visual, illustrated-stable-diffusion]
      - text: >-
          Alammar later froze the blog and moved new writing to the Substack newsletter Language Models
          & Co., which covers large language models, their internals and applications. The blog's
          final post points readers to The Illustrated DeepSeek R-1 on the newsletter and to the course
          How Transformer LLMs Work.
        source_ids: [blog-home, newsletter-about]
  - heading: Book and courses
    paragraphs:
      - text: >-
          With Maarten Grootendorst, Alammar co-wrote Hands-On Large Language Models, an illustrated
          guide to language models with more than 275 custom figures and accompanying code. The book's
          author page describes Alammar as a co-creator of machine learning and natural language
          processing courses on DeepLearning.AI and Udacity.
        source_ids: [llm-book]
  - heading: Work at Cohere
    paragraphs:
      - text: >-
          In a March 2022 post, Alammar wrote of having joined Cohere a little under a year earlier and
          listed articles written for developers there, including an introduction to large language
          models, a visual guide to prompt engineering and tutorials on summarization and semantic
          search. The book's site now lists Alammar as Director and Engineering Fellow at Cohere.
        source_ids: [cohere-post, llm-book]
