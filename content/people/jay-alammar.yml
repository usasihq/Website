headline: Writer of illustrated machine learning guides and co-author of Hands-On Large Language Models
bio:
  text: >-
    Jay Alammar writes visual explanations of machine learning concepts, including The Illustrated
    Transformer and The Illustrated BERT, ELMo, and co., first on a technical blog and now on the
    Substack newsletter Language Models & Co., which covers large language models, their internals,
    and applications. Jay Alammar co-wrote the illustrated book Hands-On Large Language Models, and the
    book's site lists Jay as Director and Engineering Fellow at Cohere.
  source_ids: [blog-home, blog-about, newsletter-about, llm-book]
  reviewed_at: 2026-10-17
