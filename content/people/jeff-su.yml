sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jeff Su's site describes a career that began in management consulting and continued in
          product marketing at Google, before Jeff turned to online education for working
          professionals. An earlier version of the about page, dated 2022, says Jeff joined Google in
          2016 and worked as a product marketer on Google Ads, making YouTube videos about productivity,
          careers and job search on the side.
        source_ids: [site, about]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          AI Essentials is a weekly newsletter that gives one practical tip per issue. Recent issues
          cover carrying context into a new chat in ChatGPT and Claude, choosing between ChatGPT,
          Claude and Gemini models, and Gemini features inside Gmail, Docs, Drive and Calendar.
        source_ids: [newsletter]
      - text: >-
          The site's AI articles, published since June 2023, include beginner guides to ChatGPT,
          Google Gemini, NotebookLM and Perplexity, a step-by-step guide to building an AI agent in n8n,
          and 2026 tutorials on Claude Cowork, Claude Design and personal AI agents. The YouTube channel
          offers practical tips on productivity and careers.
        source_ids: [jeffsu-ai, channel]
  - heading: Courses
    paragraphs:
      - text: >-
          The Cowork Academy provides a pre-built system in Claude Cowork along with a course on
          adapting it, so that corrections, preferences and decisions carry forward between sessions.
          The Workspace Academy teaches a Google Workspace workflow for capturing tasks, ideas and notes
          and managing files, and the site also lists a Notion course called My Notion Command Center.
        source_ids: [cowork, workspace-academy, site]
