headline: Creator of videos, courses, and a weekly AI tips newsletter on AI and productivity tools
bio:
  text: >-
    Jeff Su helps professionals work with AI and productivity tools through a YouTube channel, articles, and
    AI Essentials, a weekly newsletter with one practical AI tip per issue covering tools such as ChatGPT,
    Claude, Gemini, and Google Workspace apps. Jeff also offers courses including The Cowork Academy,
    Workspace Academy, and a Notion course. Jeff previously worked as a management consultant and then as a
    product marketer at Google.
  source_ids: [site, newsletter, about]
  reviewed_at: 2026-10-21
