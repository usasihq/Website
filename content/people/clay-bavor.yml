headline: Co-founder of Sierra, which builds customer-facing AI agents; formerly led Google Labs
bio:
  text: >-
    Clay Bavor is a co-founder of Sierra, a company that builds AI agents businesses use to serve
    their customers. Before Sierra, Bavor spent 18 years at Google, most recently leading Google
    Labs, and earlier started and led Google's AR/VR effort, Project Starline and Google Lens.
