headline: Howard Friesen Professor in UC Berkeley EECS and member of BAIR; co-author of pix2pix and CycleGAN
bio:
  text: >-
    Alexei A. Efros (Alyosha) is the Howard Friesen Professor in the EECS Department at UC Berkeley
    and part of the Berkeley Artificial Intelligence Research Lab (BAIR), after a decade on the
    faculty of the Robotics Institute at Carnegie Mellon University. Efros's research uses large
    amounts of unlabeled visual data to understand, model, and recreate the visual world, mainly in
    data-driven computer vision and its links to computer graphics and computational photography,
    with interests that include self-supervised learning and world models. Efros is a co-author of
    the image-to-image translation papers known as pix2pix (2016) and CycleGAN (2017), whose public
    code repositories list Efros among the authors.
