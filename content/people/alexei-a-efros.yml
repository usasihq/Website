sections:
  - heading: Career
    paragraphs:
      - text: >-
          Efros completed a PhD in computer science at UC Berkeley in 2003 with the thesis "Data-driven
          Approaches for Texture and Motion," advised by Jitendra Malik. After a year as a visiting research
          fellow in the Robotics Research Group at the University of Oxford, Efros joined Carnegie Mellon
          University in 2004 as an assistant professor in the Robotics Institute and the Computer Science
          Department, becoming an associate professor there in 2010.
        source_ids: [cv]
      - text: >-
          Efros returned to UC Berkeley's EECS Department as an associate professor in 2013 and has been a
          professor there since 2017. The CV also lists a fall 2009 stay with the WILLOW Laboratory at École
          Normale Supérieure and INRIA as a Guggenheim Fellow, and the homepage notes close collaboration with
          that team from 2007 to 2015.
        source_ids: [cv, homepage]
  - heading: Research
    paragraphs:
      - text: >-
          The homepage dates several long-running research threads: autoregressive image generation since 1999,
          scaling visual data since 2007, self-supervised learning since 2015, work on what are now called
          world models since 2017, and continual learning since 2020. Other interests listed there include
          human vision, visual data mining, robotics, and applications of computer vision to the visual arts
          and the humanities.
        source_ids: [homepage]
      - text: >-
          Efros's journal work includes "Scene Completion Using Millions of Photographs" with James Hays and
          "What makes Paris look like Paris?" with Carl Doersch and colleagues, both later republished in
          Communications of the ACM. With students and collaborators at Berkeley, Efros co-wrote the pix2pix
          and CycleGAN papers on image-to-image translation, released with public code.
        source_ids: [cv, pix2pix-paper, cyclegan-paper, cyclegan-readme]
  - heading: Teaching and mentoring
    paragraphs:
      - text: >-
          The homepage lists Efros's current postdocs and graduate students along with former PhD students and
          their theses, among them Jun-Yan Zhu, Richard Zhang, Deepak Pathak, Tim Brooks and Bill Peebles.
          Efros received UC Berkeley's Diane S. McEntyre Award for Excellence in Teaching Computer Science in
          2019 and the Jim and Donna Gray Award for Excellence in Undergraduate Teaching of Computer Science in
          2023.
        source_ids: [homepage, cv]
