headline: UCLA assistant professor studying factuality, intent, and harm in language; former NYU and MIT fellow
bio:
  text: >-
    Saadia Gabriel is an Assistant Professor of Computer Science at the UCLA Samueli School of
    Engineering, a co-director of UCLA NLP, and runs the Misinformation, AI and Responsible Society
    (MARS) Lab. Gabriel's work focuses on measuring factuality, intent, and potential harm of
    human-written language, and on bridging the development of language technologies with the
    communities they serve. Gabriel was previously an NYU Faculty Fellow and an MIT CSAIL Postdoctoral
    Fellow. Gabriel is first author of Misinfo Reaction Frames, a formalism and crowdsourced dataset
    for modeling how readers might react to news headlines.
