sections:
  - heading: Career
    paragraphs:
      - text: >-
          Gabriel completed a PhD in computer science and engineering at the University of Washington from 2017 to
          2023, advised by Yejin Choi and Franziska Roesner, with research internships at SRI International, the
          Allen Institute for AI and Microsoft Research along the way. In 2023 Gabriel was a postdoctoral fellow at
          MIT CSAIL with Marzyeh Ghassemi and then a Faculty Fellow at NYU's Center for Data Science.
        source_ids: [sg-cv, gabriel-site]
      - text: >-
          Gabriel joined UCLA's Samueli School of Engineering as an Assistant Professor of Computer Science in
          2024, where Gabriel runs the MARS Lab and co-directs UCLA NLP. Gabriel also serves as an area chair for
          ACL conferences, ICLR, COLM, ICML and NeurIPS.
        source_ids: [sg-cv, gabriel-site]
  - heading: Research
    paragraphs:
      - text: >-
          Gabriel's research measures the factuality, intent and potential harm of human-written language. As
          first author of Misinfo Reaction Frames, Gabriel introduced a formalism and dataset for modeling how
          readers react to news headlines, and Gabriel co-authored Social Bias Frames, which won a best paper award
          at the 2020 West Coast NLP Summit.
        source_ids: [mrf-paper, sg-cv, gabriel-site]
      - text: >-
          More recent co-authored work spans language models for mental health prediction (Mental-LLM),
          multi-agent simulations of content dissemination (MOSAIC, EMNLP 2025), AI debate for assessing
          contested claims (NeurIPS 2025), and the African Languages Lab, a collaborative effort on low-resource
          African NLP presented at ACL 2026.
        source_ids: [sg-cv]
  - heading: Teaching
    paragraphs:
      - text: >-
          At UCLA, Gabriel has taught graduate courses on computational ethics and large language models, AI
          safety and mechanistic interpretability, and advanced natural language processing, along with the
          undergraduate course CS 162, Intro to Natural Language Processing. Gabriel co-taught a first course as a
          professor, the NYU Data Science Capstone, in September 2023.
        source_ids: [sg-teach, gabriel-site]
