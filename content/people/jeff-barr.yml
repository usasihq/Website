headline: VP and Chief Evangelist at AWS; started the AWS News Blog in 2004
bio:
  text: >-
    Jeff Barr is VP and Chief Evangelist at Amazon Web Services. Barr started the AWS News Blog in
    2004 and wrote posts for it nearly continuously, covering AWS launches such as Trainium2
    instances and S3 Tables, until stepping back as its lead blogger in December 2024 after 20
    years. That December 2024 post says Barr would stay at AWS to spend more time building things
    and creating developer-focused content, while continuing weekly AWS OnAir appearances and talks
    at AWS community events; a January 2026 AWS Weekly Roundup lists Barr as AWS VP and Chief
    Evangelist.
