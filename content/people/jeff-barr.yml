sections:
  - heading: Career
    paragraphs:
      - text: >-
          Barr's résumé describes a long software career before AWS. From 1997 to 2000 Barr was a program manager
          at Microsoft, responsible for the design of HTML and XML editing features in the next version of
          Visual Basic and earlier a development lead on the DHTML editing component and Visual InterDev. Barr
          also ran a consulting practice, Vertex Development, taking on interim engineering leadership and
          software projects for startups.
        source_ids: [barr-resume]
      - text: >-
          Barr joined Amazon.com in August 2002, first as a senior software developer on the Associates and Web
          Services team and then as a web services evangelist. In the early days of AWS, Barr ran much of its
          developer relations program, including the developer newsletter, weekly chats and external beta
          testing. Barr's site and AWS pages now give Barr's title as VP and Chief Evangelist at AWS.
        source_ids: [barr-resume, barr-site, aws-roundup-2026]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Barr created the AWS blog, now the AWS News Blog, in 2004 and wrote launch posts for it for twenty years,
          trying services before release and writing demos and sample code. In December 2024 Barr wrapped up the
          lead blogger role, saying the plan was to spend more time building and creating developer-focused
          content while continuing AWS OnAir appearances and community talks.
        source_ids: [aws-news-author, aws-wrap-2024, barr-resume]
      - text: >-
          Barr's other writing includes the 2010 SitePoint book "Host Your Web Site in the Cloud" and technical
          reviews of several books on Amazon's web services and RSS. Barr also hosted The AWS Report, a video
          series of interviews with AWS users and service teams, and built Syndic8, a directory of RSS feeds.
        source_ids: [barr-resume]
