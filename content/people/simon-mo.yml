sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Mo's earliest commits to vLLM date from November 2023 and include documentation for the official
          Docker image. vLLM's governance document now
          lists Mo among the lead maintainers responsible for the project's overall direction.
        source_ids: [vllm-commit-docker, vllm-commit-first, vllm-governance]
      - text: >-
          The committers list names Mo as project lead for API entrypoints and community and as a reviewer
          for the model interface and the OpenAI-compatible API server, alongside documentation, benchmarks
          and the CI, build and release process. Mo published vLLM releases including v0.10.2 in September
          2025 and v0.11.0 in October 2025.
        source_ids: [vllm-committers, vllm-v0102, vllm-v0110]
  - heading: Inferact
    paragraphs:
      - text: >-
          In January 2026 Inferact announced itself as a company founded by creators and core maintainers of
          vLLM, aiming to make AI inference cheaper and faster while keeping vLLM open source. Mo's GitHub
          profile lists Mo as a co-founder of Inferact and lead maintainer of the vLLM project.
        source_ids: [inferact-intro, github-profile]
