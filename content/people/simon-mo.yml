headline: Lead maintainer of vLLM and co-founder of Inferact, a company started by vLLM's maintainers
bio:
  text: >-
    Simon Mo is a lead maintainer of vLLM, the open-source engine for serving large language models;
    the project's governance document lists Simon Mo among the lead maintainers responsible for its
    overall direction, and the committers list names Simon Mo as a project lead for API entrypoints and
    community. Simon Mo is also listed for the project's documentation, benchmarks, and CI, build, and
    release process. Simon Mo is a co-founder of Inferact, a company founded by vLLM's maintainers to
    work on AI inference.
