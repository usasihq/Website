work:
  - name: Granite Guardian
    artifact_slug: granite
    type: open-weights
    url: https://github.com/ibm-granite/granite-guardian
    contribution: >-
      Co-author of the Granite Guardian technical report (2024), which introduces risk-detection models
      for LLM prompts and responses released as open source; the ibm-granite/granite-guardian repository
      is under the Apache-2.0 license, and the Granite Guardian 3.0 8B model card lists the apache-2.0
      license. Varshney's homepage lists the Granite Guardian model family among the work of Varshney's
      team.
    source_ids: [granite-guardian-paper, granite-guardian-repo, granite-guardian-card, homepage]
  - name: AI Fairness 360
    artifact_slug: null
    type: open-source
    url: https://github.com/Trusted-AI/AIF360
    contribution: >-
      Co-author of the 2018 paper introducing AI Fairness 360, an open-source Python toolkit for
      algorithmic fairness released under the Apache v2.0 license; the homepage lists it among the
      toolkits Varshney's team created.
    source_ids: [aif360-paper, aif360-repo, homepage]
  - name: AI Explainability 360 and FactSheets
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/1909.03012
    contribution: >-
      Co-author of the 2019 paper introducing the AI Explainability 360 toolkit and of the 2018
      FactSheets paper on documenting AI services.
