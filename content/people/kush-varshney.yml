headline: IBM Fellow directing trustworthy AI research at IBM; team behind AI Fairness 360 and Granite Guardian
bio:
  text: >-
    Kush R. Varshney is an IBM Fellow at IBM Research who directs Human-Centered Trustworthy AI research,
    and was the founding co-director of the IBM Science for Social Good initiative from 2015 to 2023.
    Varshney's homepage and IBM Research profile say Varshney and team created the open-source toolkits
    AI Fairness 360, AI Explainability 360, Uncertainty Quantification 360, and AI FactSheets 360, as
    well as the Granite Guardian model family. Varshney is a co-author of the papers introducing AI
    Fairness 360, AI Explainability 360, FactSheets, and Granite Guardian, and published the book
    "Trustworthy Machine Learning" in 2022.
  source_ids: [homepage, ibm-research-profile, aif360-paper, aix360-paper, factsheets-paper, granite-guardian-paper]
  reviewed_at: 2026-10-13
