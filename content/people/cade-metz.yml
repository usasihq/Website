headline: Technology reporter at The New York Times and author of Genius Makers, a book about AI
bio:
  text: >-
    Cade Metz is a technology reporter at The New York Times, whose official author feed carries
    Cade's recent reporting on AI, including October 2026 articles on AI in medicine and robotics.
    Cade was previously a senior staff writer at Wired. Cade is the author of Genius Makers, a 2021 book
    about the researchers who brought AI to Google, Facebook, and the wider world.
