sections:
  - heading: Coverage
    paragraphs:
      - text: >-
          Penguin Random House describes Metz as a technology correspondent at The New York Times covering
          artificial intelligence, driverless cars, robotics, virtual reality and other emerging areas, after
          earlier work as a senior staff writer at Wired. Metz's New York Times author feed in October 2026
          includes articles on a clinical trial of AI chatbots in urgent care, a start-up using AI to design
          microrobots, and an AI hacking competition.
        source_ids: [prh-book, nyt-feed]
  - heading: Books
    paragraphs:
      - text: >-
          Genius Makers, Metz's first book, was published in March 2021, with a Dutton paperback edition in
          February 2022. It tells the story of the researchers whose work on neural networks brought AI into
          Google, Facebook and the wider technology industry.
        source_ids: [prh-book]
