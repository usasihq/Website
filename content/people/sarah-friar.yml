headline: Chief Financial Officer of OpenAI; former CEO of Nextdoor and CFO at Square
bio:
  text: >-
    Sarah Friar is Chief Financial Officer of OpenAI. OpenAI announced in June 2024 that Friar was joining
    as CFO to lead a finance team supporting continued investment in OpenAI's core research and the
    scaling of the company. Before OpenAI, Friar served as CEO of Nextdoor and as CFO at Square, and
    earlier worked at Goldman Sachs, McKinsey and Salesforce. In an August 2026 OpenAI article, Friar
    describes building OpenAI's finance function around AI, with goals of a zero-day close and
    automated, continuously updated forecasting.
