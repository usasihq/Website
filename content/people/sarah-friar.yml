sections:
  - heading: Career
    paragraphs:
      - text: >-
          OpenAI announced Sarah Friar as its Chief Financial Officer in June 2024, and OpenAI's 2026 articles by
          Friar continue to identify Friar as the company's CFO.
        source_ids: [openai-rss]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          In a series of 2026 OpenAI articles, Friar has written about measuring and organizing work around AI. A
          July 2026 piece introduced an AI scorecard built on useful work, cost per successful task, dependability
          and return on compute, and an August 2026 piece explained how advances in chips, compute, models and
          products compound to deliver more useful intelligence at lower cost.
        source_ids: [openai-rss]
      - text: >-
          Friar's August 2026 article on building an AI-native finance function describes setting goals of a
          zero-day close and automated, continuously updated forecasting at OpenAI. It offers five lessons for
          finance leaders: give everyone access to AI tools, redesign whole workflows around decisions, let finance
          staff become builders, pair speed with accountability and controls, and measure value per unit of
          intelligence.
        source_ids: [openai-finance-2026]
