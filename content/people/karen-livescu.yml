sections:
  - heading: Career
    paragraphs:
      - text: >-
          Livescu completed a PhD in electrical engineering and computer science at MIT in 2005, advised by Jim
          Glass in the Spoken Language Systems group, with a dissertation on feature-based pronunciation
          modeling for speech recognition. After two years as a Clare Boothe Luce post-doctoral lecturer at MIT,
          Livescu joined TTI-Chicago in 2008, becoming an assistant professor that year, an associate professor
          in 2017 and a full professor in 2021.
        source_ids: [livescu-cv, livescu-site]
      - text: >-
          Livescu is also a courtesy faculty member in the University of Chicago's computer science department
          and an affiliated scholar at its Data Science Institute. In 2023–2024 Livescu was a visiting scholar
          in Stanford's linguistics department and a special faculty researcher at Carnegie Mellon's Language
          Technologies Institute, and Livescu was a visiting scientist at the Weizmann Institute of Science in 2008–09, 2010–11
          and 2011–12.
        source_ids: [livescu-cv, livescu-site, wavlab-members]
  - heading: Research
    paragraphs:
      - text: >-
          Livescu's research covers speech and language processing and related machine learning, with recent
          interests in spoken language models, efficiency, self-supervised representation learning,
          multimodal learning, language-universal speech processing and automatic sign language
          understanding. Earlier work includes articulatory feature-based pronunciation models, fingerspelling
          recognition from video, and "Deep Canonical Correlation Analysis" (ICML 2013), which was runner-up
          for ICML's test of time award in 2023.
        source_ids: [livescu-cv]
      - text: >-
          Recent papers study self-supervised speech models and benchmarks for spoken language. Livescu
          co-authored SLUE (2021), a set of tasks for evaluating spoken language understanding on natural
          speech, a 2024 TACL paper on what self-supervised speech models know about words, and a 2023 paper on
          joint language modeling of speech units and text with co-authors including Wei-Ning Hsu, Alexei Baevski and Michael Auli.
        source_ids: [slue-paper, livescu-cv, joint-lm-paper]
  - heading: Teaching
    paragraphs:
      - text: >-
          At TTIC, Livescu regularly teaches Speech Technologies and Unsupervised Learning and Data Analysis,
          and has taught Signals, Systems, and Random Processes. At MIT, Livescu taught Automatic Speech
          Recognition and Signals and Systems, and Livescu taught an introduction to speech recognition at the
          Weizmann Institute in 2011.
        source_ids: [livescu-site]
