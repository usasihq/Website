headline: Professor at TTI-Chicago working on speech and language processing; former MIT EECS post-doctoral lecturer
bio:
  text: >-
    Karen Livescu is a Professor at the Toyota Technological Institute at Chicago (TTIC), a
    graduate institute for computer science, and a courtesy faculty member in Computer Science at the
    University of Chicago; Livescu's research covers speech and language processing and related
    machine learning. Livescu was a post-doctoral lecturer in the MIT EECS department from 2005 to
    2007, and Carnegie Mellon University's WAVLab lists Livescu as visiting faculty from 2023 to 2024.
    Livescu co-authored SLUE, a set of benchmark tasks for spoken language understanding on natural
    speech, and Toward Joint Language Modeling for Speech Units and Text, a paper listed among Meta
    AI's publications.
