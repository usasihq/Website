sections:
  - heading: Career
    paragraphs:
      - text: >-
          Shixiang Shane Gu earned a PhD in machine learning from the University of Cambridge and the
          Max Planck Institute for Intelligent Systems, supervised by Richard E. Turner, Zoubin
          Ghahramani and Bernhard Schölkopf, after undergraduate work in engineering science at the
          University of Toronto supervised by Geoffrey Hinton. Gu was a founding member of the Google
          Brain Robotics team and has been a visiting associate professor at the University of Tokyo
          and a visiting scholar at Stanford University.
        source_ids: [homepage]
      - text: >-
          At OpenAI, Gu was a senior researcher on the ChatGPT team and led the company's entry into
          the Japanese market. At Google DeepMind, Gu led the multilinguality team for Gemini
          post-training and is now a Senior Staff Research Scientist focusing on the Gemini Thinking
          team.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Gu's research spans generative modeling, reinforcement learning and reasoning in language
          models. In 2016 Gu co-authored Gumbel-Softmax with Eric Jang and Ben Poole, a differentiable
          estimator for categorical latent variables, and was first author of Q-Prop, a
          sample-efficient policy gradient method with an off-policy critic, and of a paper on deep
          reinforcement learning for robotic manipulation with asynchronous off-policy updates.
        source_ids: [gumbel-paper, qprop-paper, robot-manipulation-paper]
      - text: >-
          In language models, Gu co-authored "Large Language Models are Zero-Shot Reasoners" (2022),
          which showed that prompting with "Let's think step by step" elicits multi-step reasoning, and
          "Large Language Models Can Self-Improve" (2022), on improving models with their own
          generated reasoning. Gu's site also lists authorship credits on the GPT-4 technical report
          and the Gemini and Gemini 1.5 reports.
        source_ids: [zero-shot-paper, self-improve-paper, homepage]
