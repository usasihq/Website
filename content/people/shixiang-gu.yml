headline: Senior staff research scientist at Google DeepMind on Gemini; co-author of Gumbel-Softmax and zero-shot CoT
bio:
  text: >-
    Shixiang Shane Gu is a Senior Staff Research Scientist at Google DeepMind, focusing on the Gemini
    Thinking team; Gu previously led the multilinguality team for Gemini post-training. Before that,
    Gu was a senior researcher on the ChatGPT team at OpenAI, and earlier a founding member of the
    Google Brain Robotics team. Gu co-authored "Categorical Reparameterization with Gumbel-Softmax"
    (2016), which introduced a differentiable gradient estimator for categorical variables, and "Large
    Language Models are Zero-Shot Reasoners" (2022), on eliciting step-by-step reasoning without
    task-specific examples.
  source_ids: [homepage, gumbel-paper, zero-shot-paper]
