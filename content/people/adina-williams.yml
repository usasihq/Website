sections:
  - heading: Career
    paragraphs:
      - text: >-
          Adina Williams joined Facebook AI Research as a research scientist in October 2018. Meta's people page notes that Williams earned a PhD in
          the Department of Linguistics at New York University, with doctoral research on the brain
          basis of syntactic and semantic processing.
        source_ids: [meta-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Williams works in both directions between linguistics and NLP, according to Meta's profile:
          bringing findings from linguistics and cognitive science to the training, evaluation and
          debiasing of NLP systems, and using statistical and corpus tools from NLP to find new
          quantitative, cross-linguistic facts about human languages.
        source_ids: [meta-profile]
      - text: >-
          Much of Williams's published work concerns datasets and benchmarks. Williams is first author
          of the MultiNLI corpus paper, accepted to NAACL 2018, and a co-author of Adversarial NLI (ACL
          2020) and of Dynabench (NAACL 2021), an open-source platform for dynamic, human-in-the-loop
          dataset creation and model benchmarking.
        source_ids: [multinli-paper, anli-paper, dynabench-paper]
      - text: >-
          Williams has also co-authored work on measuring social bias in language models, including the
          HolisticBias descriptor dataset (EMNLP 2022) and ROBBIE (2023), and on evaluation beyond
          language, such as the IntPhys 2 benchmark for intuitive physics understanding (2025). Williams
          is a co-author of Llama 2 and is listed among the authors of the 2026 Muse Spark Safety &
          Preparedness Report.
        source_ids: [holisticbias-paper, meta-profile, llama2-paper, muse-report]
