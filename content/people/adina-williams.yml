headline: Research scientist at Meta's FAIR; first author of the MultiNLI corpus and co-author of Llama 2
bio:
  text: >-
    Adina Williams is a research scientist at FAIR, Meta's Fundamental AI Research team. Meta's people
    page describes research that connects linguistics and cognitive science with natural language
    processing and AI, bringing those insights to training, evaluating, and debiasing NLP systems.
    Williams is first author of the Multi-Genre Natural Language Inference (MultiNLI) corpus paper
    (2017) and a co-author of Adversarial NLI (2019), the HolisticBias dataset paper (2022), and Llama
    2 (2023). Williams is also among the authors of Meta's Muse Spark Safety & Preparedness Report
    (2026).
  source_ids: [meta-profile, github-profile, multinli-paper, anli-paper, holisticbias-paper, llama2-paper, muse-report]
  reviewed_at: 2026-10-13
