headline: Senior writer at WIRED covering artificial intelligence and author of the AI Lab newsletter
bio:
  text: >-
    Will Knight is a senior writer at WIRED covering artificial intelligence, and writes the AI Lab
    newsletter, a weekly dispatch on AI. Will was previously a senior editor at
    MIT Technology Review, writing about fundamental advances in AI, and before that an editor and
    writer at New Scientist.
  source_ids: [wired-author]
