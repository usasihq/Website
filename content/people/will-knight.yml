sections:
  - heading: Career
    paragraphs:
      - text: >-
          Knight wrote and edited at New Scientist magazine before joining MIT Technology
          Review in 2008. At MIT Technology Review Knight served as Senior Editor for AI and Robotics,
          covering machine learning, automated driving and robotics; WIRED's author page adds that Knight
          wrote about fundamental advances in AI and China's AI boom there.
        source_ids: [mittr-author, wired-author]
      - text: >-
          Knight is now a senior writer at WIRED covering artificial intelligence. The earliest story
          in Knight's WIRED author archive, about the limits of AI tools for detecting deepfakes, is
          dated 2019-10-02.
        source_ids: [wired-author, wired-archive-2019]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Knight writes AI Lab, WIRED's weekly newsletter on artificial intelligence, and many of
          Knight's WIRED stories run under the AI Lab label. Stories from 2026 listed on the author page
          cover topics such as AI systems applied to mathematics and science, new AI models, AI
          agents, robotics and research into how models work internally.
        source_ids: [wired-author]
