headline: Founder of Exponential View, a weekly newsletter and podcast analyzing AI and other technologies
bio:
  text: >-
    Azeem Azhar founded Exponential View in 2015. In the weekly Exponential View newsletter, Azeem
    analyzes developments in artificial intelligence and other exponential technologies, including
    renewable energy, and how they are shaping the next few years; the publication also has a podcast
    and a YouTube channel. Azeem previously founded PeerIndex and was a correspondent at The Economist.
  source_ids: [expview, about]
  reviewed_at: 2026-10-21
