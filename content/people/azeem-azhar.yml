sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before starting Exponential View, Azhar was a correspondent at The Economist, held executive roles at
          Thomson Reuters and Schibsted, and founded the company PeerIndex. Azhar's About page
          also lists past advisory roles at McKinsey, Accenture and PwC, work as a venture partner at Kindred
          Capital, and a seat as a consumer board member at Ofcom.
        source_ids: [about]
      - text: >-
          Azhar founded Exponential View in 2015 and has led it since. Since 2022 Azhar has been a visiting
          fellow at Oxford University, and since 2023 an executive fellow at Harvard Business School and
          co-chair of the World Economic Forum's Global Futures Council on Complex Risk.
        source_ids: [about]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Exponential View is a weekly publication in which Azhar analyzes developments in AI and other fast-moving
          technologies, with a focus on how they will shape the next three to five years. Alongside the Sunday
          newsletter it publishes essays by Azhar, a podcast and a YouTube channel, and its recurring themes
          include AI scaling, the energy transition and falling costs of solar power and batteries.
        source_ids: [expview, site]
      - text: >-
          Azhar is the author of The Exponential Age, which looks at the gap between accelerating technologies
          such as AI, automation and big data and the ability to deal with their effects on business, politics
          and society.
          Azhar also gives keynote talks on generative AI and on the past and future of what Azhar calls the
          Exponential Age.
        source_ids: [book, site]
