headline: Anthropic co-founder and Chief Science Officer; first author of the 2020 scaling-laws paper
bio:
  text: >-
    Jared Kaplan co-founded Anthropic and is its Chief Science Officer, heading the company's technical
    research; Kaplan is also an associate professor at Johns Hopkins University. Anthropic's leadership
    page says Kaplan spent the first 15 years of their career as a theoretical physicist and, before
    Anthropic, helped build GPT-3 and Codex at OpenAI. Kaplan is first author of "Scaling Laws for
    Neural Language Models" (2020), whose contribution statement says Kaplan and Sam McCandlish led the
    research, and last author of the Constitutional AI paper (2022). Claude's constitution credits
    Kaplan with creating the Claude Character project with Amanda Askell in 2023.
  source_ids: [anthropic-leadership, scaling-laws-paper, cai-paper, claude-constitution]
  reviewed_at: 2026-10-13
