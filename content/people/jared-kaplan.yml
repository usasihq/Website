sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kaplan holds a PhD in physics from Harvard University and spent the first 15 years of their
          career as a theoretical physicist in academia. Kaplan is an associate professor at Johns Hopkins
          University, where Kaplan has taught courses on the foundations of deep learning.
        source_ids: [anthropic-leadership]
      - text: >-
          Before co-founding Anthropic, Kaplan worked at OpenAI and, according to Anthropic, helped build
          GPT-3 and Codex. Kaplan is listed among the authors of the 2020 GPT-3 paper, Language Models are
          Few-Shot Learners, and of the 2021 Codex paper. At Anthropic, Kaplan is Chief Science Officer and
          heads the company's technical research.
        source_ids: [anthropic-leadership, gpt3-paper, codex-paper]
  - heading: Research
    paragraphs:
      - text: >-
          Kaplan's 2020 paper with Sam McCandlish and colleagues, Scaling Laws for Neural Language Models,
          studied how language-model loss follows power laws in model size, dataset size, and training
          compute. Anthropic describes this line of work as a framework for understanding and predicting the
          behavior of advanced AI systems.
        source_ids: [scaling-laws-paper, anthropic-leadership]
      - text: >-
          At Anthropic, Kaplan is the last-listed author of the 2022 papers on training a helpful and harmless
          assistant with reinforcement learning from human feedback and on Constitutional AI, which trains
          models to follow a written set of principles. Claude's constitution credits Kaplan with creating
          the Claude Character project with Amanda Askell in 2023 and with setting the direction for the new
          constitution.
        source_ids: [hh-rlhf-paper, cai-paper, claude-constitution]
