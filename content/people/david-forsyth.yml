sections:
  - heading: Career and service
    paragraphs:
      - text: >-
          David Forsyth is the Fulton Watson Copp Chair in Computer Science in the Siebel School of Computing and
          Data Science at the University of Illinois Urbana-Champaign, working in computer vision, computer
          graphics and machine learning.
        source_ids: [faculty-page]
      - text: >-
          Forsyth has held a long series of organizing roles for the IEEE Conference on Computer Vision and
          Pattern Recognition: program co-chair in 2000, 2008 and 2011, general co-chair in 2006 and 2015, and
          advisor to the CVPR 2024 program committee. Forsyth has also served as Editor in Chief of IEEE
          Transactions on Pattern Analysis and Machine Intelligence.
        source_ids: [everingham-news]
  - heading: Research
    paragraphs:
      - text: >-
          Forsyth's recent work includes the co-authored paper Generative Blocks World (2025), which represents the
          scene of a generated image as an assembly of simple convex 3D primitives that an editor can move before
          the image is generated again, using texture hints meant to preserve the identity of objects.
        source_ids: [blocks-world-paper]
  - heading: Teaching
    paragraphs:
      - text: >-
          Forsyth's faculty page lists recent courses including ECE 549 / CS 543 Computer Vision, CS 544
          Optimization in Computer Vision, and CS 588 Autonomous Vehicle System Engineering.
        source_ids: [faculty-page]
