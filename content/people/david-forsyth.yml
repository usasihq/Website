headline: Fulton Watson Copp Chair in Computer Science at the University of Illinois Urbana-Champaign
bio:
  text: >-
    David Forsyth holds the Fulton Watson Copp Chair in Computer Science in the Siebel School of
    Computing and Data Science at the University of Illinois Urbana-Champaign, with research
    interests in computer vision, computer graphics, and machine learning. Forsyth's recent courses
    include Computer Vision (CS 543 / ECE 549), Optimization in Computer Vision, and autonomous
    vehicle system engineering. The school's news page notes that Forsyth received the PAMI Mark
    Everingham Prize at ECCV 2024, has served as program or general co-chair of IEEE CVPR several
    times, and has served as Editor in Chief of IEEE TPAMI. Recent research includes Generative
    Blocks World (2025), a method for editing generated images by manipulating simple 3D primitives.
  source_ids: [faculty-page, everingham-news, blocks-world-paper]
  reviewed_at: 2026-10-21
