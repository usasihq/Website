sections:
  - heading: Career
    paragraphs:
      - text: >-
          Arsalan Tavakoli-Shiraji earned a PhD in computer science at UC Berkeley in networking and
          distributed systems. Before joining Databricks, Tavakoli-Shiraji was an Associate Principal
          at McKinsey & Company, advising enterprises, vendors, and the public sector on topics
          including next-generation IT, cloud computing, and corporate strategy.
        source_ids: [db-author]
      - text: >-
          Databricks lists Tavakoli-Shiraji among its seven founders, with Ali Ghodsi, Ion Stoica,
          Matei Zaharia, Patrick Wendell, Reynold Xin, and Andy Konwinski. Tavakoli-Shiraji is now
          Databricks' SVP of Field Engineering and spoke in the Tuesday keynote of the Data + AI
          Summit 2026.
        source_ids: [db-founders, dais-tavakoli]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Tavakoli-Shiraji has co-written several Databricks announcements about opening its
          platform. A June 2022 post announced that Delta Lake 2.0 would make all Delta Lake APIs open
          source, and a June 2024 post announced the open-sourcing of Unity Catalog under the Apache
          2.0 license, hosted at LF AI & Data.
        source_ids: [delta-post, uc-post, db-author]
      - text: >-
          In June 2025, Tavakoli-Shiraji co-wrote the post introducing the lakebase, a database design
          that runs a managed Postgres engine over data kept in open formats in cloud object storage,
          and co-wrote the introduction of Lakebridge, a free tool for migrating legacy data warehouses to
          Databricks SQL.
        source_ids: [lakebase-post, lakebridge-post, db-author]
