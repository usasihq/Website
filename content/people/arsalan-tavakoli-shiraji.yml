headline: Co-founder and SVP of Field Engineering at Databricks
bio:
  text: >-
    Arsalan Tavakoli-Shiraji is a co-founder of Databricks and its SVP of Field Engineering, according
    to Databricks' Data + AI Summit 2026 speaker page, which lists Tavakoli-Shiraji among the speakers
    in the event's Tuesday keynote. Tavakoli-Shiraji is one of five bylined authors, with Matei
    Zaharia, Ali Ghodsi, Reynold Xin and Patrick Wendell, of Databricks' June 2024 post announcing that
    Unity Catalog was being open-sourced under the Apache 2.0 license and hosted at LF AI & Data.
  source_ids: [dais-tavakoli, uc-post]
  reviewed_at: 2026-10-13
