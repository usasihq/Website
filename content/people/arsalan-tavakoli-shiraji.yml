      unitycatalog/unitycatalog repository is Apache-2.0.
    source_ids: [uc-post, uc-repo]
  - name: Delta Lake 2.0 open-source release
    artifact_slug: null
    type: open-source
    url: https://www.databricks.com/blog/2022/06/30/open-sourcing-all-of-delta-lake.html
    contribution: >-
      Co-author, with Michael Armbrust, Ali Ghodsi, Reynold Xin, and Matei Zaharia, of the June 2022
      post announcing that all Delta Lake APIs, including features previously limited to Databricks,
      were being open-sourced with Delta Lake 2.0.
    source_ids: [delta-post, db-author]
links:
  - label: Databricks speaker page
