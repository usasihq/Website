headline: Leads the Alignment Science team at Anthropic; formerly co-led Superalignment at OpenAI
bio:
  text: >-
    Jan Leike is a machine learning and alignment researcher who leads the Alignment Science team at
    Anthropic, where the team works on aligning an automated alignment researcher, scalable oversight,
    weak-to-strong generalization and robustness to jailbreaks. Leike previously co-led the
    Superalignment team at OpenAI and was involved in developing InstructGPT, ChatGPT and the alignment
    of GPT-4; before that, Leike was an alignment researcher at DeepMind who prototyped reinforcement
    learning from human feedback. Leike is second author of "Deep reinforcement learning from human
    preferences" (2017) and first author of "Scalable agent alignment via reward modeling" (2018).
  source_ids: [leike-site, rlhp-paper, reward-modeling-paper]
  reviewed_at: 2026-10-21
