sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jan Leike completed a PhD in reinforcement learning theory at the Australian National
          University, with a 2016 thesis on nonparametric general reinforcement learning supervised by
          Marcus Hutter. Leike then worked as an alignment researcher at DeepMind, where Leike prototyped
          reinforcement learning from human feedback.
        source_ids: [leike-site]
      - text: >-
          At OpenAI, Leike co-led the Superalignment team, developed the company's approach to alignment
          research, co-authored the team's research roadmap, and was involved in InstructGPT, ChatGPT,
          and the alignment of GPT-4. Leike now leads the Alignment Science team at Anthropic, which works
          on aligning an automated alignment researcher, scalable oversight, weak-to-strong
          generalization, and robustness to jailbreaks.
        source_ids: [leike-site]
  - heading: Research
    paragraphs:
      - text: >-
          Leike's research asks how AI systems can be trained to follow human intent on tasks that are
          hard for people to evaluate directly. Leike was second author of the 2017 paper on
          deep reinforcement learning from human preferences and first author of AI Safety Gridworlds
          (2017) and of the 2018 research agenda on scalable agent alignment via reward modeling.
        source_ids: [leike-site, rlhp-paper, gridworlds-paper, reward-modeling-paper]
      - text: >-
          Leike co-authored the March 2022 InstructGPT paper on training language models to follow
          instructions with human feedback, the December 2023 paper on weak-to-strong generalization,
          and the June 2024 paper "LLM Critics Help Catch LLM Bugs," which trains critic models that
          help people evaluate model-written code more accurately.
        source_ids: [instructgpt-paper, w2s-paper, critics-paper]
