headline: Chair and CEO of Cisco since 2015, leading its shift toward AI infrastructure, security and software
bio:
  text: >-
    Chuck Robbins is the Chair and Chief Executive Officer of Cisco, the networking and security
    company. Robbins was named CEO in July 2015 and elected Chair of the Board in December 2017,
    after more than two decades in Cisco's sales and partner organizations, and has guided a
    renewed emphasis on artificial intelligence, software, cybersecurity and networking.
  source_ids: [cisco-robbins, cisco-execs]
