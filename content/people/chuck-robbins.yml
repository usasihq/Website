sections:
  - heading: Career
    paragraphs:
      - text: >-
          Robbins spent more than 25 years at Cisco, holding leadership roles in regional sales and
          in the partner organization, where Robbins helped build Cisco's partner program, before
          leading the global sales organization.
        source_ids: [cisco-robbins]
      - text: >-
          Cisco named Robbins CEO in July 2015, and the board elected Robbins its Chair on December
          11, 2017. Cisco's executive leadership page lists Robbins as Chair and Chief Executive
          Officer today.
        source_ids: [cisco-robbins, cisco-execs]
  - heading: Cisco in the AI era
    paragraphs:
      - text: >-
          Cisco describes its recent strategy under Robbins as a renewed emphasis on artificial
          intelligence, software and services, cloud-native applications, cybersecurity, energy
          efficiency and networking, with the aim of connecting and protecting infrastructure and
          data in the AI era.
        source_ids: [cisco-robbins]
      - text: >-
          Outside Cisco, Robbins chairs the Business Roundtable, serves on the board of BlackRock,
          and is a member of the World Economic Forum's International Business Council.
        source_ids: [cisco-robbins]
