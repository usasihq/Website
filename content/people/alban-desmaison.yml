headline: Lead Core Maintainer of PyTorch and a research engineer at Meta
bio:
  text: >-
    Alban Desmaison is a Research Engineer at Meta and the Lead Core Maintainer of PyTorch. PyTorch's
    maintainers page also lists Desmaison as a module maintainer for torch.nn, torch.optim, autograd,
    multiprocessing, and Build + CI. Desmaison co-authored the 2019 PyTorch paper and the PyTorch 2
    paper (ASPLOS 2024). PyTorch's blog announced Desmaison as the speaker for the featured NVIDIA
    GTC 2026 session "From Kernels to Clusters: How PyTorch Powers High-Performance AI," scheduled
    for March 2026.
  source_ids: [pt212-qa, pytorch-maintainers, pytorch-paper, pt2-paper, gtc26-blog]
  reviewed_at: 2026-10-21
