sections:
  - heading: Career
    paragraphs:
      - text: >-
          Alban Desmaison is listed with Oxford University among the authors of the 2019 PyTorch
          paper. Desmaison now works on PyTorch as
          a research engineer at Meta.
        source_ids: [pytorch-paper-pdf, pt212-qa]
      - text: >-
          In July 2024 the PyTorch Core Maintainers accepted Desmaison's nomination to join them, a
          group the announcement describes as the final arbiters of technical decisions for
          pytorch/pytorch. In May 2026 the core maintainers voted to pass the lead core maintainer
          role from Soumith Chintala to Desmaison.
        source_ids: [core-maintainers-2024, lead-core-change]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Besides the lead role, PyTorch's governance page lists Desmaison as a maintainer of the
          torch.nn, torch.optim and torch.autograd modules, multiprocessing, and Build + CI.
          Desmaison is a co-author of the 2019 PyTorch paper and of the ASPLOS 2024 paper on
          TorchDynamo and TorchInductor, the components behind torch.compile.
        source_ids: [pytorch-maintainers, pytorch-paper, pt2-paper]
  - heading: Talks and community
    paragraphs:
      - text: >-
          Desmaison was the listed speaker for the featured NVIDIA GTC 2026 session "From Kernels to
          Clusters: How PyTorch Powers High-Performance AI", scheduled for March 16, 2026, and served as one of the program chairs
          of PyTorch Conference Europe 2026, where Desmaison also took part in a session with PyTorch
          module maintainers. In May 2026 Desmaison joined the live Q&A panel for the PyTorch 2.12
          release.
        source_ids: [gtc26-blog, pytorch-eu-2026, pt212-qa]
