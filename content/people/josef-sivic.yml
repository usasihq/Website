sections:
  - heading: Career
    paragraphs:
      - text: >-
          Sivic completed a PhD at the University of Oxford in 2006 with Andrew Zisserman, did a postdoc at
          MIT CSAIL with William Freeman, and received a habilitation from the Ecole Normale Superieure in 2014. Sivic taught Object Recognition and Computer Vision at ENS from 2008 to 2019 and has
          taught 3D Computer Vision at Charles University since 2019.
        source_ids: [homepage]
      - text: >-
          At CIIRC CTU, Sivic leads the IMPACT group and directs the ELLIS Unit Prague, inaugurated in 2020
          and now becoming a countrywide ELLIS Unit Czechia. In 2026 Sivic was appointed full Professor of
          Computer Science and Artificial Intelligence by the President of the Czech Republic and took a
          part-time Chief Strategy Officer role at Tolion Health AI.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Sivic's group works on systems that interpret multimodal inputs with little supervision, across
          computer vision, robotics and AI for the life sciences. Vision work includes NetVLAD for place
          recognition (2015), HowTo100M for learning text-video embeddings from narrated videos (2019), and
          later work on object state changes and 6D object trajectories from internet videos.
        source_ids: [homepage, netvlad-paper, howto100m-paper]
      - text: >-
          In robotics, the group's CosyPose method won awards at the ECCV 2020 6D object pose estimation
          challenge, and the team joined the euROBIN robotics network in 2022. Life-science work covers
          protein-protein interactions (ICLR 2024), protein flexibility (ICLR 2025), the MassSpecGym benchmark
          for molecule discovery (NeurIPS 2024) and DreaMS, a mass-spectra representation model published in
          Nature Biotechnology in 2025.
        source_ids: [homepage]
