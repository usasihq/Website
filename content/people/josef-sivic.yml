headline: Professor at CIIRC, Czech Technical University, and head of the IMPACT group; consults for Adobe Research
bio:
  text: >-
    Josef Sivic is Professor of Computer Science and Artificial Intelligence at the Czech Institute
    of Informatics, Robotics and Cybernetics (CIIRC) of the Czech Technical University (CTU), where
    Sivic leads the Intelligent Machine Perception (IMPACT) group and directs an ELLIS unit. Sivic's research spans computer vision, robotics, and AI for the life sciences, including
    models for protein engineering. Sivic's site lists consulting for Adobe Research and a part-time
    Chief Strategy Officer role at Tolion Health AI, as well as an earlier postdoc at MIT CSAIL with
    William Freeman. Sivic is a co-author of NetVLAD (2015) and HowTo100M (2019).
  source_ids: [homepage, netvlad-paper, howto100m-paper]
  reviewed_at: 2026-10-21
