sections:
  - heading: Career
    paragraphs:
      - text: >-
          Liang began as a senior design engineer and project leader at Chips & Technologies and
          Suntek from 1988 to 1991, then served as President and Chief Design Engineer of Micro
          Center Computer from 1991 to 1993. Liang founded Supermicro in September 1993 and has
          led it as President, CEO and Chairman since then.
        source_ids: [smci-exec-mgmt]
  - heading: Supermicro
    paragraphs:
      - text: >-
          Supermicro's company timeline traces its products from server boards in the mid-1990s to
          rackmount systems in 2002, Server Building Block Solutions in 2010, and the opening of a
          Green Computing Park in Silicon Valley in 2015. In 2025 the company launched integrated
          Data Center Building Block Solutions and next-generation direct liquid cooling for AI data
          centers.
        source_ids: [smci-about]
