headline: Founder, President, CEO and Chairman of Supermicro, maker of AI and data center server systems
bio:
  text: >-
    Charles Liang is the founder of Super Micro Computer (Supermicro) and has served as its President,
    Chief Executive Officer and Chairman of the Board since founding the company in September 1993.
    Supermicro's investor pages describe Liang's long work developing server system architectures and
    technologies, for which Liang holds many server technology patents; the company builds
    application-optimized servers for AI, cloud, storage and edge computing on a building-block
    architecture.
  source_ids: [smci-exec-mgmt, smci-about]
  reviewed_at: 2026-10-21
