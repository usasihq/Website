sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          VanderPlas is one of the authors named in the JAX repository's citation entry and has written several
          of the project's design proposals. These cover JAX's type promotion semantics, the scope of its NumPy
          and SciPy wrappers and stateful randomness, and VanderPlas co-wrote the typed PRNG keys proposal with
          Roy Frostig.
        source_ids: [jax-readme, jep-type-promotion, jep-numpy-scope, jep-stateful-rng, jep-typed-keys]
      - text: >-
          The project list in VanderPlas's website repository describes earlier contributions to scikit-learn,
          mainly in generalized N-point problems and manifold learning, and to SciPy's sparse matrix toolkit,
          including iterative sparse decompositions and graph algorithms. It also lists Altair, a declarative
          visualization library for Python built on the Vega ecosystem, and AstroML, a machine learning package
          for astronomy written to accompany a textbook.
        source_ids: [jv-projects]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          VanderPlas, an astronomer by training, wrote the Python Data Science Handbook and the free e-book A
          Whirlwind Tour of Python, both published by O'Reilly Media in 2016 and readable online. With Željko
          Ivezić, Andrew Connolly and Alexander Gray, VanderPlas co-wrote Statistics, Data Mining, and Machine
          Learning in Astronomy, published by Princeton University Press in 2014.
        source_ids: [jv-about]
      - text: >-
          VanderPlas also writes the blog Pythonic Perambulations, whose posts include a 2018 explanation of the
          waiting time paradox, and several examples in the Python Data Science Handbook are drawn from its
          posts.
        source_ids: [jv-about, jv-blog]
