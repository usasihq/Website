headline: Named author of JAX who has written several of its design proposals
bio:
  text: >-
    Jake VanderPlas is one of the authors named in the JAX repository's citation entry. The JAX
    documentation lists VanderPlas as the author of design proposals on JAX's type promotion
    semantics (December 2021), the scope of its NumPy and SciPy wrappers (October 2023), and
    stateful randomness (November 2025), and as a co-author, with Roy Frostig, of the proposal for
    typed PRNG keys. VanderPlas's GitHub profile lists Google as their company.
  source_ids: [jax-readme, jep-type-promotion, jep-numpy-scope, jep-stateful-rng, jep-typed-keys, github-profile]
  reviewed_at: 2026-10-21
