sections:
  - heading: Chai Discovery
    paragraphs:
      - text: >-
          Boitreaud co-founded Chai Discovery in 2024 with Joshua Meier, Jack Dent and Matthew McPartlon; the company builds models that reason about biological structure and function and
          generate new molecular designs. Chai's 2026 announcements of collaborations with Novartis and argenx
          name Boitreaud among the founders.
        source_ids: [chai-argenx, chai-novartis]
  - heading: Research
    paragraphs:
      - text: >-
          Boitreaud is an author of the Chai-1 technical report, posted to bioRxiv in October 2024, which the
          open-source chai-lab repository asks users to cite when using the model. Boitreaud is also an author of
          the Chai-2 technical report on zero-shot antibody design, posted in July 2025.
        source_ids: [chai1-report, chai-lab-readme, chai2-report]
