headline: Co-founder of Chai Discovery and co-author of the Chai-1 and Chai-2 technical reports
bio:
  text: >-
    Jacques Boitreaud is one of the four co-founders of Chai Discovery, which the company's announcements describe as
    founded in 2024 by Joshua Meier, Jack Dent, Matthew McPartlon and Jacques Boitreaud to design new medicines
    with AI. Boitreaud is a named author of the Chai-1 technical report (2024), whose model predicts the
    structures of molecular complexes, and of the Chai-2 report (2025) on zero-shot antibody design.
  source_ids: [chai-argenx, chai1-report, chai2-report]
  reviewed_at: 2026-10-22
