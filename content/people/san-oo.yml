headline: Chief Technology Officer of Abridge, the clinical documentation AI company, since May 2026
bio:
  text: >-
    San Oo is the Chief Technology Officer of Abridge, which builds AI that turns clinician-patient
    conversations into draft clinical documentation. Abridge named Oo to the role in May 2026, after
    engineering leadership roles at Notion and Slack and an earlier role as CTO of ShopBack.
  source_ids: [abridge-release, abridge-about]
