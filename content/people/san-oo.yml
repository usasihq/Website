sections:
  - heading: Career
    paragraphs:
      - text: >-
          Oo was a founding member of two companies that were later acquired, Mumbo Inc. (acquired by
          LinkedIn in 2012) and Astro Technology (acquired by Slack in 2018), and served as CTO of ShopBack.
          At Slack, Oo helped build the engineering organization, and at Notion Oo set engineering goals and
          direction with a focus on reliability, developer velocity and agentic engineering.
        source_ids: [abridge-release]
      - text: >-
          On May 21, 2026, Abridge announced that it had named Oo Chief Technology Officer, and the company's
          About page lists Oo on its leadership team alongside CEO and co-founder Shiv Rao.
        source_ids: [abridge-release, abridge-about]
