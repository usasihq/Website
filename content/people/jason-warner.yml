sections:
  - heading: Poolside
    paragraphs:
      - text: >-
          Warner co-founded Poolside with Eiso Kant, and the company's announcements from 2024 to
          2026 list both as co-CEOs and co-founders. Poolside describes improving its models for software
          development through Reinforcement Learning from Code Execution Feedback (RLCEF).
        source_ids: [poolside-aws, poolside-fern-labs, poolside-laguna-launch]
      - text: >-
          In December 2024 Warner and Kant announced a partnership making Poolside's models
          available as a first-party AWS offering, and in November 2025 the acquisition of Fern Labs,
          a forward-deployed research engineering company behind the Bridge multi-agent
          orchestration layer. In April 2026 they announced Laguna M.1 and the open-weight Laguna
          XS.2.
        source_ids: [poolside-aws, poolside-fern-labs, poolside-laguna-launch]
