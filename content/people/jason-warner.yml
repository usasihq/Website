headline: Co-founder and co-CEO of Poolside, which builds open-weight foundation models for agentic coding
bio:
  text: >-
    Jason Warner is a co-founder and co-CEO of Poolside, which builds foundation models and agents for
    software development, including the open-weight Laguna family. Warner co-signs Poolside's major
    announcements with fellow co-founder and co-CEO Eiso Kant, from its 2024 partnership with AWS to
    the 2026 release of Laguna XS.2.
  source_ids: [poolside-laguna-launch, poolside-fern-labs, poolside-aws]
  reviewed_at: 2026-10-21
