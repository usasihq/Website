headline: Co-founder of Modular, makers of Mojo and MAX; SVP and GM of Modular at Qualcomm, which acquired it in 2026
bio:
  text: >-
    Tim Davis co-founded Modular with Chris Lattner and is now Senior Vice President and General
    Manager of Modular at Qualcomm, which completed its acquisition of Modular in July 2026. Modular
    develops Mojo, MAX and Modular Cloud as part of what it calls a unified AI inference stack, and
    the acquisition announcement says these continue as products and brands. Before Modular, Davis was a
    product manager at Google, where Davis's site says Davis helped create and scale AI systems inside
    Google Brain, including TensorFlow, on-device AI and large-model infrastructure.
  source_ids: [davis-site, modular-about, modular-qualcomm]
  reviewed_at: 2026-10-22
