sections:
  - heading: Career
    paragraphs:
      - text: >-
          At Google, Davis worked as a product manager on AI infrastructure in Google Brain and Core Systems.
          Modular's about page credits Davis with work spanning APIs (TensorFlow), compilers (XLA and MLIR),
          runtimes for servers and TensorFlow Lite, Android ML and NNAPI, and large-model infrastructure.
        source_ids: [davis-site, modular-about]
      - text: >-
          Davis and Chris Lattner met at Google and founded Modular to address fragmented AI infrastructure.
          Qualcomm completed its acquisition of Modular on July 29, 2026, and Modular's leadership page now lists
          Davis as SVP and GM of Modular at Qualcomm.
        source_ids: [modular-about, modular-qualcomm, davis-site]
