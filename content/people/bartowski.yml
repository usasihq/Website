    artifact_slug: llama-cpp
    type: open-source
    url: https://github.com/ggml-org/llama.cpp
    contribution: >-
      CODEOWNERS lists bartowski1182 with one other contributor for ggml/src/ggml-cpu/tiled.
      Commits authored from September 2025 to September 2026 include IQ-quant correctness fixes and
      AVX2 prompt-processing speedups, a shared imatrix loader, per-slot context for llama-server,
      and support for architectures such as GLM 4.6 and AfmoeForCausalLM. The repository is
      MIT-licensed.
    source_ids: [llama-cpp-codeowners, llama-cpp-commits, llama-cpp-license]
