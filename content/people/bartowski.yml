sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Bartowski's earliest model uploads on Hugging Face, from late October 2023, were ExLlamaV2 (exl2)
          quantizations of fine-tuned Mistral 7B models. The account now centres on GGUF quantizations for
          llama.cpp and compatible runtimes, and its model cards record the llama.cpp release used and the use of
          imatrix calibration data.
        source_ids: [hf-models-api, hf-profile, quant-card]
      - text: >-
          Bartowski's commits to llama.cpp began in May 2024, including support for the Smaug 70B model, and have
          continued with model-architecture support (an Arcee AFM model, GLM 4.6 and AfmoeForCausalLM),
          conversion-script fixes and chat-template additions. Many later commits concern quantization quality
          and speed, such as fixes for IQ quantization types, faster AVX2 prompt processing for IQ models and a
          shared imatrix loader, along with a per-slot context option for llama-server.
        source_ids: [llama-cpp-commits]
      - text: >-
          The llama.cpp CODEOWNERS file lists bartowski1182 as a co-owner of the tiled CPU code under
          ggml/src/ggml-cpu/tiled. On the Hugging Face profile, Bartowski gives a current role as Senior Machine
          Learning Engineer at Red Hat.
        source_ids: [llama-cpp-codeowners, hf-profile]
timeline:
  - date: "2023-10-28"
