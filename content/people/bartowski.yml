headline: Publishes GGUF quantizations of open models and contributes to llama.cpp; ML engineer at Red Hat
bio:
  text: >-
    Bartowski is a public handle; the Hugging Face profile under that name gives Bartowski's role
    as Senior Machine Learning Engineer at Red Hat. The profile hosts GGUF quantizations of open
    language models for llama.cpp and compatible runtimes; model cards such as the one for
    Qwen3.8-27B name the llama.cpp release used for quantization and note imatrix calibration. In llama.cpp
    itself, CODEOWNERS lists Bartowski as a co-owner of the tiled CPU code, and Bartowski's commits
    cover IQ quantization fixes and speedups, imatrix tooling, and support for new model
    architectures.
  source_ids: [hf-profile, quant-card, llama-cpp-codeowners, llama-cpp-commits]
  reviewed_at: 2026-10-21
