    text: Added Smaug 70B support to llama.cpp.
    source_ids: [llama-cpp-commits]
  - date: "2025-05-09"
    text: Added a --parse-special option to llama.cpp's imatrix tool for parsing special tokens.
    source_ids: [llama-cpp-commits]
  - date: "2025-06-15"
    text: Added llama.cpp support for Arcee AI's AFM model.
    source_ids: [llama-cpp-commits]
  - date: "2025-09-30"
    text: Added llama.cpp support for GLM 4.6.
    source_ids: [llama-cpp-commits]
  - date: "2025-11-14"
    text: Added AfmoeForCausalLM model support to llama.cpp.
    source_ids: [llama-cpp-commits]
  - date: "2026-06-04"
    text: Moved duplicated imatrix code in llama.cpp into a single shared imatrix loader.
    source_ids: [llama-cpp-commits]
  - date: "2026-08-31"
    text: Sped up large-batch prompt processing of IQ-quantized models on AVX2 CPUs in llama.cpp.
    source_ids: [llama-cpp-commits]
