headline: Co-founder of Perceptron; first author of CM3 and joint first author of Meta's Chameleon models
bio:
  text: >-
    Armen Aghajanyan is a co-founder of Perceptron, a company building multimodal models for the
    physical world. Perceptron's about page says Aghajanyan and Akshat Shrivastava previously led
    multimodal research initiatives at FAIR, Facebook's AI research team, and started Perceptron in
    November 2024. At FAIR, Aghajanyan was first author of CM3 (2022), a family of causally masked
    generative models trained on documents that contain both text and image tokens, and a joint first
    author and pre-training workstream lead of Chameleon (2024), a family of early-fusion mixed-modal
    models. Aghajanyan also co-authored the training-data papers Memorization Without Overfitting
    (2022) and D4 (2023) with Kushal Tirumala.
  source_ids: [github-profile, perceptron-about, cm3-paper, chameleon-paper, memorization-paper, d4-paper]
  reviewed_at: 2026-10-21
