sections:
  - heading: Research
    paragraphs:
      - text: >-
          Aghajanyan's research has studied how large language models are trained and adapted. With Luke
          Zettlemoyer and Sonal Gupta, Aghajanyan was first author of a 2020 paper arguing that the intrinsic
          dimension of fine-tuning helps explain why pretrained models adapt well from small labeled datasets.
          With Kushal Tirumala and others, Aghajanyan later co-wrote studies of memorization during training and
          of data de-duplication and diversification for pretraining.
        source_ids: [aa-intrinsic, memorization-paper, d4-paper]
      - text: >-
          A second thread concerns models that mix modalities in a single token stream. Aghajanyan was first
          author of CM3 in 2022 and of a 2023 paper reporting scaling laws for generative mixed-modal language
          models across seven modalities. The 2024 Chameleon paper from FAIR at Meta lists Aghajanyan as a joint
          first author and lead of its pre-training workstream.
        source_ids: [cm3-paper, aa-scaling, chameleon-paper]
  - heading: Perceptron
    paragraphs:
      - text: >-
          Perceptron describes itself as a foundation model company building physical intelligence, with models
          that process video, audio, text and sensor data in real time. Its about page says Aghajanyan and Akshat
          Shrivastava started the company in November 2024 after leading multimodal research initiatives at
          FAIR. The page lists the company's Isaac series of vision-language models, several of them released as
          open source.
        source_ids: [perceptron-about, github-profile]
