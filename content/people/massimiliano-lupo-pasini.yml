sections:
  - heading: Career
    paragraphs:
      - text: >-
          Lupo Pasini earned a PhD in applied mathematics at Emory University in May 2018, with doctoral work
          on efficient and resilient linear solvers for computing architectures approaching exascale. Lupo
          Pasini then joined ORNL as a postdoctoral research associate in the Scientific Computing Group at the
          National Center for Computational Sciences.
        source_ids: [ornl-profile]
      - text: >-
          In November 2019 Lupo Pasini became a computational scientist in the Scalable Algorithms and Coupled
          Physics Group, and in November 2020 a data scientist in the Computational Coupled Physics group. ORNL's
          profile says Lupo Pasini was technical lead of the Surrogate Models for Material Properties product
          in the lab's AI Initiative for fiscal years 2021 to 2023 and of its AI for Science and Discovery thrust
          in FY24, and leads a project on scalable generative graph foundation models for atomistic materials
          modeling in FY25.
        source_ids: [ornl-profile]
  - heading: HydraGNN
    paragraphs:
      - text: >-
          HydraGNN is a distributed PyTorch implementation of multi-headed graph neural networks, first
          registered with DOE CODE in October 2021 with Lupo Pasini as first-listed developer. ORNL describes it as
          a multitask architecture that uses atomistic-scale information to predict several material properties
          at once. Version 5.0, released in May 2026, lists Lupo Pasini and Jong Youl Choi first among its
          developers.
        source_ids: [osti-hydragnn, ornl-ieee-news, osti-hydragnn-v5, hydragnn-readme]
