headline: Data scientist at Oak Ridge National Laboratory who led development of the HydraGNN graph neural network
bio:
  text: >-
    Massimiliano (Max) Lupo Pasini is a data scientist in the Computational Coupled Physics group at
    Oak Ridge National Laboratory (ORNL), where the lab credits Lupo Pasini with leading the
    development of HydraGNN, a scalable multitask graph neural network for predicting material
    properties. Lupo Pasini is the first-listed developer of HydraGNN's original 2021 software record
    and of HydraGNN v5.0 (2026). Lupo Pasini's research covers surrogate and generative AI models for
    materials science, scalable hyperparameter optimization for deep learning, and acceleration of
    computational physics methods.
  source_ids: [ornl-profile, ornl-ieee-news, osti-hydragnn, osti-hydragnn-v5, hydragnn-readme]
  reviewed_at: 2026-10-22
