sections:
  - heading: Research
    paragraphs:
      - text: >-
          Poon's early work with Pedro Domingos introduced sum-product networks, a deep probabilistic
          architecture that grew out of asking when the partition function of a graphical model is tractable.
          The paper showed that essentially all tractable graphical models can be cast as sum-product networks.
        source_ids: [spn-paper]
      - text: >-
          Later research turned to biomedicine. Poon co-authored PubMedBERT, which showed the value
          of pretraining language models from scratch on biomedical text, and BioGPT, a generative transformer
          for biomedical text generation and mining. Multimodal follow-ups included BiomedCLIP, trained on
          image-text pairs from scientific articles, the LLaVA-Med assistant and BiomedParse for parsing
          biomedical images.
        source_ids: [pubmedbert-paper, biogpt-paper, biomedclip-paper, llava-med-paper, biomedparse-paper]
      - text: >-
          In a February 2025 Microsoft Research Forum keynote, Poon set out an agenda for precision health that
          uses generative AI to learn patient embeddings from multimodal, longitudinal patient records. The talk
          described GigaPath, a digital pathology foundation model developed with Providence Health System and
          the University of Washington.
        source_ids: [msr-forum-keynote]
