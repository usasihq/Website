headline: Introduced in 2025 as general manager of Microsoft Health Futures; co-author of LLaVA-Med and Medprompt
bio:
  text: >-
    Hoifung Poon was introduced at a February 2025 Microsoft Research Forum keynote as general manager of
    Microsoft Health Futures, in charge of biomedical AI research and incubation for precision health,
    with a focus on multimodal generative AI and population-scale real-world evidence. In that keynote, Poon
    described GigaPath, a digital pathology foundation model created with Providence Health System and
    the University of Washington and published in Nature. Poon is a co-author of LLaVA-Med, a
    vision-language assistant for biomedical images, and of the Medprompt study of prompting generalist
    foundation models on medical benchmarks.
  source_ids: [msr-forum-keynote, llava-med-paper, medprompt-paper]
  reviewed_at: 2026-10-21
