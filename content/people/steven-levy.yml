headline: WIRED editor at large who writes the Backchannel newsletter and books about technology
bio:
  text: >-
    Steven Levy is editor at large at WIRED, covering a wide range of tech subjects in print and online,
    and writes Backchannel, a weekly newsletter that puts tech stories in perspective. Steven has
    contributed to WIRED since its inception, wrote columns for Rolling Stone and Macworld, led
    technology coverage for Newsweek, and co-created the Backchannel publication on Medium, which joined
    WIRED in 2017. Steven's eight books include Hackers, Crypto, Artificial Life, Insanely Great, In the
    Plex, and Facebook: The Inside Story.
