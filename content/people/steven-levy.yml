sections:
  - heading: Career
    paragraphs:
      - text: >-
          Levy has written about technology for close to four decades. Earlier positions include chief technology
          writer and senior editor at Newsweek, and Levy's work has appeared in Rolling Stone, Harper's Magazine,
          Macworld, The New York Times Magazine, Esquire and The New Yorker.
        source_ids: [levy-about, wired]
      - text: >-
          Levy co-created Backchannel, a technology publication on Medium that was integrated into WIRED in 2017.
          At WIRED, where Levy has contributed since the magazine began, Levy is editor at large and writes the
          weekly Backchannel newsletter.
        source_ids: [levy-about, wired]
  - heading: Books
    paragraphs:
      - text: >-
          Levy's book Hackers: Heroes of the Computer Revolution (1984) chronicles three generations
          of programmers and introduced the idea of a "Hacker Ethic" that took shape at MIT in the 1950s and 1960s.
          Artificial Life (1992) follows scientists and programmers trying to create life-like systems, and Crypto (2001) tells how public cryptography moved from government secrecy into wide use.
        source_ids: [levy-about, levy-hackers, levy-artificial-life, levy-crypto]
      - text: >-
          Levy has also written company and product histories: Insanely Great on the Apple Macintosh, The Perfect
          Thing on the iPod, In the Plex on Google, and Facebook: The Inside Story, based on interviews inside and
          outside the company.
        source_ids: [levy-insanely-great, levy-perfect-thing, levy-in-the-plex, levy-home]
