sections:
  - heading: Career
    paragraphs:
      - text: >-
          Silver's research milestones page traces the work from doctoral research at the University of Alberta,
          on real-time planning in games with hidden state using partially observable Monte-Carlo planning,
          through a postdoctoral position at MIT, where Monte-Carlo search was applied to Civilization II. At
          DeepMind, Silver led the reinforcement learning team until recently.
        source_ids: [research-page, homepage]
      - text: >-
          Silver is now CEO of Ineffable Intelligence and a professor at University College London. Silver's
          biography describes the focus of the work as building superintelligent agents with reinforcement
          learning.
        source_ids: [about-page, homepage]
  - heading: Research
    paragraphs:
      - text: >-
          At DeepMind, Silver led or co-led projects that learned to play Atari games from pixels, defeated a
          professional Go player with AlphaGo, and learned chess, shogi and Go by self-play with AlphaZero.
          MuZero extended this to planning with a learned model without being given the rules, and AlphaStar
          reached grandmaster level in StarCraft II.
        source_ids: [about-page, research-page, dqn-paper, alphazero-paper, muzero-paper]
      - text: >-
          Silver also contributed to AlphaFold for protein structure prediction and AlphaProof for formal
          mathematical reasoning, and co-authored work on discovering reinforcement learning algorithms
          automatically. With Richard Sutton, Silver wrote the position papers "Reward is Enough" (2021, with
          Satinder Singh and Doina Precup) and "Welcome to the Era of Experience" (2025).
        source_ids: [about-page, publications-page, perspectives-page]
  - heading: Teaching
    paragraphs:
      - text: >-
          Silver's website hosts the materials for a 2015 Advanced Topics course on reinforcement learning
          (COMPM050/COMPGI13), including lecture slides, the Easy21 assignment and past exam questions,
          released under a CC-BY-NC 4.0 license.
        source_ids: [teaching]
timeline:
  - date: "2010"
    text: Published partially observable Monte-Carlo planning (POMCP) at NIPS 2010 from doctoral work at the University of Alberta.
    source_ids: [research-page]
  - date: "2013-12"
    text: Co-authored "Playing Atari with Deep Reinforcement Learning", which introduced deep Q-networks for Atari games.
    source_ids: [dqn-paper]
  - date: "2015"
    text: Published the materials of the Advanced Topics 2015 course on reinforcement learning (COMPM050/COMPGI13).
    source_ids: [teaching]
  - date: "2016"
    text: Published AlphaGo in Nature, the first program to defeat a human professional Go player.
    source_ids: [research-page, about-page]
  - date: "2017-12"
    text: Posted the AlphaZero paper on mastering chess and shogi by self-play as first author.
    source_ids: [alphazero-paper]
  - date: "2019"
    text: Co-authored the Nature paper on AlphaStar reaching grandmaster level in StarCraft II.
    source_ids: [publications-page]
  - date: "2019-11"
    text: Co-authored MuZero, which plans with a learned model in Atari, Go, chess and shogi.
    source_ids: [muzero-paper]
  - date: "2021"
    text: Published "Reward is Enough" with Satinder Singh, Doina Precup and Richard Sutton.
    source_ids: [publications-page]
  - date: "2025"
    text: Co-authored the Nature paper on AlphaProof's olympiad-level formal mathematical reasoning.
    source_ids: [publications-page]
  - date: "2025"
    text: Wrote the position paper "Welcome to the Era of Experience" with Richard Sutton.
    source_ids: [publications-page, perspectives-page]
