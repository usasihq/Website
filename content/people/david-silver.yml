headline: CEO of Ineffable Intelligence and UCL professor; formerly led DeepMind's reinforcement learning team
bio:
  text: >-
    David Silver is the CEO of Ineffable Intelligence and a professor at University College London;
    Silver's homepage says that until recently Silver led the reinforcement learning team at DeepMind.
    Silver is first author of the 2017 AlphaZero paper on mastering chess and shogi through self-play
    reinforcement learning, and a co-author of the 2013 deep Q-network paper on learning to play Atari
    games from raw pixels. Silver's site also publishes the lectures and Easy21 assignment of a 2015
    Advanced Topics course on reinforcement learning (COMPM050/COMPGI13) under a CC-BY-NC 4.0 license.
  source_ids: [homepage, alphazero-paper, dqn-paper, teaching]
  reviewed_at: 2026-10-13
