sections:
  - heading: Career
    paragraphs:
      - text: >-
          Zhuohan Li completed a PhD in computer science at UC Berkeley from 2019 to 2024, advised by Ion Stoica. During that time Zhuohan Li
          interned at Microsoft Research Asia, Anyscale, and Google Brain and Google DeepMind.
        source_ids: [personal-site]
      - text: >-
          From June 2024 to August 2025 Zhuohan Li was a Member of Technical Staff at OpenAI, heading
          infrastructure and inference work for the open-weight gpt-oss models and building training and
          inference systems for reasoning models such as OpenAI o1. Since August 2025 Zhuohan Li has been an AI
          Research Scientist at Meta, focusing on inference.
        source_ids: [personal-site]
  - heading: Research and open-source work
    paragraphs:
      - text: >-
          Zhuohan Li's doctoral research was on systems for training and serving large models. Alpa (2022)
          automated inter- and intra-operator parallelism for distributed deep learning, and AlpaServe (2023),
          with Zhuohan Li as first author, used model parallelism for statistical multiplexing when serving
          models. Zhuohan Li's homepage also lists the Vicuna chatbot and Chatbot Arena among
          Zhuohan Li's projects, and Zhuohan Li co-authored the 2023 paper on judging language models with
          MT-Bench and Chatbot Arena.
        source_ids: [alpa-paper, alpaserve-paper, llm-judge-paper, personal-site]
      - text: >-
          The 2023 PagedAttention paper, with Zhuohan Li as second author, introduced vLLM, a serving engine
          that manages the KV cache in pages to reduce memory waste. Zhuohan Li co-created vLLM and co-leads its
          development, and the project's governance documents list Zhuohan Li as a lead maintainer.
        source_ids: [pagedattention-paper, vllm-governance, vllm-committers, personal-site]
