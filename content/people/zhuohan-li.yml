headline: Co-creator and lead maintainer of vLLM; AI Research Scientist at Meta focusing on inference
bio:
  text: >-
    Zhuohan Li co-created vLLM, the open-source engine for serving large language models, and co-leads
    its development; the project's governance document lists Zhuohan Li among the lead maintainers
    responsible for its overall direction. Zhuohan Li is the second author of the paper that introduced
    vLLM and its PagedAttention approach to KV cache memory. Zhuohan Li is an AI Research Scientist at
    Meta focusing on inference, and was previously a Member of Technical Staff at OpenAI, where
    Zhuohan Li led infrastructure and inference work for gpt-oss.
  source_ids: [personal-site, vllm-governance, pagedattention-paper]
  reviewed_at: 2026-10-19
