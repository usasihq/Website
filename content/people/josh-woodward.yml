headline: Google VP leading Google Labs, the Gemini app and AI Studio
bio:
  text: >-
    Josh Woodward is VP, Google Labs, Gemini app & AI Studio at Google. Google's author page says Woodward
    leads Google Labs, the Gemini app and AI Studio, with teams focused on discovering and delivering new AI
    products, and that Woodward helped co-found Google's Next Billion Users effort and create Chromebooks. In
    2026 Woodward announced Personal Intelligence, a beta feature for connecting Google apps to the Gemini
    app, and the renaming of NotebookLM to Gemini Notebook.
