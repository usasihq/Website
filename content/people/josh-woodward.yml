sections:
  - heading: Career
    paragraphs:
      - text: >-
          Google's author page describes Woodward's work at Google as focused on making technology more
          accessible, including helping to co-found the company's Next Billion Users effort and helping to create
          Chromebooks. Woodward now leads Google Labs, the Gemini app and AI Studio, with teams that discover and
          deliver new AI products.
        source_ids: [woodward-author]
  - heading: Products and projects
    paragraphs:
      - text: >-
          In January 2026 Woodward introduced Personal Intelligence, a beta feature of the Gemini app that lets
          users link Gmail, Photos, YouTube and Search so Gemini can answer questions with that context. In July
          2026 Woodward announced that NotebookLM was being renamed Gemini Notebook, a standalone research tool
          that also works inside the Gemini app and gives each notebook a secure cloud computer for running code
          on a user's sources.
        source_ids: [personal-intelligence, gemini-notebook]
