sections:
  - heading: Career
    paragraphs:
      - text: >-
          Balaban is listed among Lambda's founders, alongside Michael Balaban, and serves as the company's
          Chief Technology Officer. Lambda's leadership page describes a team combining machine learning
          experience with experience building and scaling global infrastructure.
        source_ids: [lambda-leadership]
  - heading: Writing and engineering
    paragraphs:
      - text: >-
          Balaban's Lambda blog posts include a 2019 presentation on moving from single-GPU to multi-GPU and
          multi-node distributed training, and the October 2020 introduction of Lambda Echelon, a turn-key GPU
          cluster for machine learning teams.
        source_ids: [sb-multigpu, sb-echelon, sb-author]
      - text: >-
          In 2021 Balaban published a deep learning curriculum gathering free courses, books and other
          resources, and in 2022 a playbook on building cloud, on-premises and hybrid infrastructure for deep
          learning teams.
        source_ids: [sb-curriculum, sb-playbook]
