headline: University of Washington associate professor working on reliable, socially aware, and multilingual NLP
bio:
  text: >-
    Yulia Tsvetkov is an associate professor in the Paul G. Allen School of Computer Science &
    Engineering at the University of Washington and an adjunct professor at Carnegie Mellon
    University's Language Technologies Institute, where Tsvetkov was previously an assistant
    professor; before that, Tsvetkov was a postdoctoral researcher in the Stanford NLP Group.
    Tsvetkov's group studies the capabilities and limitations of large language models, including
    reasoning and personalization, AI ethics and safety, multilingual and culturally inclusive
    modeling, and high-stakes applications in health and science. Tsvetkov is a co-author of Spurious
    Rewards: Rethinking Training Signals in RLVR, which examines why reinforcement learning with
    verifiable rewards can improve math reasoning in some models even with uninformative rewards.
