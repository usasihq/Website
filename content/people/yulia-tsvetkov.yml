sections:
  - heading: Career
    paragraphs:
      - text: >-
          Tsvetkov completed a PhD at Carnegie Mellon University's Language Technologies Institute from 2011 to
          2016, advised by Chris Dyer, with a thesis titled "Linguistic Knowledge in Data-Driven Natural Language
          Processing". After a postdoctoral position in Stanford's Department of Computer Science from 2016 to 2017,
          Tsvetkov was an assistant professor at CMU's Language Technologies Institute from 2017 to 2021.
        source_ids: [tsvetkov-cv]
      - text: >-
          Tsvetkov joined the University of Washington's Paul G. Allen School as an assistant professor in 2021 and
          became an associate professor in 2023, while remaining an adjunct professor at CMU. Since 2026 Tsvetkov
          has also been a Technical Venture Partner at AI House, and is a member of the advisory board of Schmidt
          Sciences' Humanities and AI Virtual Institute.
        source_ids: [tsvetkov-cv, tsvetkov-site]
  - heading: Research
    paragraphs:
      - text: >-
          Tsvetkov's research aims at language technologies that are reliable, socially aware and linguistically
          inclusive, under the goal Tsvetkov calls "NLP for All". The work combines machine learning with insights
          from sociolinguistics and cognitive science to model how people use and interpret language in context.
        source_ids: [tsvetkov-site, tsvetkov-cv]
      - text: >-
          Recent papers from Tsvetkov's group study reasoning and personalization in large language models,
          collaboration between multiple models, reward modeling, multilingual pretraining beyond native scripts,
          accent bias in audio language models and privacy in text data. Tsvetkov co-authored "Spurious Rewards"
          (2025), which found that reinforcement learning with verifiable rewards can improve math reasoning in some
          models even with rewards unrelated to the correct answer.
        source_ids: [tsvetkov-site, spurious-paper]
