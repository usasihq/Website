sections:
  - heading: Career
    paragraphs:
      - text: >-
          Chang She worked in quantitative finance at AQR and Barclays before turning to data tooling. In spring
          2012 Chang She joined Wes McKinney to work on pandas full time, and Chang She describes being one of the
          library's original co-authors. Chang She also co-founded DataPad as its CTO and was later VP of Engineering at
          TubiTV, where Chang She designed the machine learning stack and experimentation platform.
        source_ids: [yc-lancedb, lancedb-windows-post]
      - text: >-
          Chang She founded LanceDB, part of Y Combinator's Winter 2022 batch, which Y Combinator lists with Chang She as
          an active founder. The company's launch post explains that Chang She and Lei Xu, a core HDFS
          contributor, drew on their experience building data and machine learning tooling to create a
          vector database backed by the Lance format.
        source_ids: [yc-lancedb]
  - heading: LanceDB and Lance
    paragraphs:
      - text: >-
          LanceDB stores, indexes and searches vectors together with other multimodal data, and is built on
          the Lance columnar format, which is designed for fast random access to AI datasets. Chang She is second
          author of the 2025 paper on Lance's adaptive structural encodings, written with Weston Pace, Lei Xu
          and others, and writes for the LanceDB blog, including a 2023 post on building Windows packages.
        source_ids: [lancedb-readme, lance-paper, lancedb-windows-post]
