headline: Founder of LanceDB, an open-source vector database built on the Lance format; early pandas co-author
bio:
  text: >-
    Chang She is the founder of LanceDB, which builds an open-source vector database and multimodal
    data platform on top of the Lance columnar format. Chang She was one of the original co-authors of the
    pandas library, and previously co-founded DataPad as its CTO and served as VP of Engineering at
    TubiTV. Chang She co-authored the 2025 paper describing the Lance format's approach to random access in
    columnar storage.
  source_ids: [yc-lancedb, lancedb-readme, lance-paper]
  reviewed_at: 2026-10-22
