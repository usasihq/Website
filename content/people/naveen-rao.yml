sections:
  - heading: Career
    paragraphs:
      - text: >-
          Rao's background bridges neuroscience and computing; Unconventional AI's author page notes a PhD in
          neuroscience from Brown University. Rao founded two AI startups: Nervana Systems, acquired by Intel,
          and MosaicML, which Rao co-founded and which Databricks acquired.
        source_ids: [unconv-rao, mosaic-acq]
      - text: >-
          When Databricks completed its acquisition of MosaicML in July 2023, it quoted Rao as MosaicML's
          co-founder and CEO. Rao then served as Vice President of AI at Databricks, where Rao was one of the
          bylined authors of the March 2024 announcement of DBRX, an open mixture-of-experts language model.
        source_ids: [mosaic-acq, shutterstock-release, dbrx-post]
  - heading: Unconventional AI
    paragraphs:
      - text: >-
          Rao is cofounder and CEO of Unconventional AI, which Rao introduced in December 2025. The company
          aims to build a new physical substrate for AI: silicon circuits whose own non-linear dynamics carry
          out neural-network computation, in pursuit of what it calls biology-scale energy efficiency.
        source_ids: [unconv-intro, unconv-home]
      - text: >-
          In an April 2026 essay, Rao argued for neural co-evolution, the co-design of AI hardware and software
          rather than treating them as separate disciplines, and discussed Nervana's 2014 architecture for
          distributed matrix multiplication as one earlier example. The company's research posts since then
          include Un-0, an image generator built on a simulated system of coupled oscillators.
        source_ids: [unconv-coevolution, unconv-home]
