headline: CEO and cofounder of Unconventional AI; founder of Nervana Systems and MosaicML; former Databricks VP of AI
bio:
  text: >-
    Naveen Rao is the CEO and cofounder of Unconventional AI, a company rethinking the foundations of
    computing with the aim of bringing biology-scale efficiency to AI. Unconventional AI's author page says Rao founded two
    earlier AI startups: Nervana Systems, which was acquired by Intel, and MosaicML, which was acquired
    by Databricks. Databricks' July 2023 release on completing the MosaicML acquisition quotes Rao as
    MosaicML's co-founder and CEO, and a June 2024 Databricks release names Rao as Vice President of
    AI at Databricks. Rao is one of six bylined authors of Databricks' March 2024 post announcing DBRX,
    a mixture-of-experts language model.
