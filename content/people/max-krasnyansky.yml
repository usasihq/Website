sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Krasnyansky's pull request introducing ggml-hexagon, opened on 2025-10-13 and merged on 2025-10-22,
          describes an experimental llama.cpp backend for the Hexagon NPU on Snapdragon-based Android devices.
          It supported Hexagon versions v73 through v81, the Q4_0, Q8_0, MXFP4, and FP32 data types, and core
          LLM operations such as matrix multiplication, RMS normalization, RoPE, and softmax, and was tested with
          Llama 3, Qwen3, and gpt-oss models.
        source_ids: [hexagon-pr]
      - text: >-
          Later commits by Krasnyansky add flash attention, ROPE_NEOX, and further operator support to the
          Hexagon backend, along with reworked L2-cache handling, a buffer and DMA overhaul for 64-bit mappings,
          and tensor repacking for tiled and flat weights. llama.cpp's CODEOWNERS file places Krasnyansky,
          together with another maintainer, on the teams that own the Hexagon and OpenCL backends and the
          Snapdragon documentation and scripts.
        source_ids: [llama-cpp-commits, llama-cpp-codeowners, llama-cpp-license]
  - heading: CPU and threading work
    paragraphs:
      - text: >-
          Before the Hexagon backend, Krasnyansky's llama.cpp contributions began in May 2024 with support for
          optimized Windows ARM64 builds using LLVM and MSVC. Commits from 2024 and 2025 improve the ggml
          thread pool and barrier scaling, add low scheduling-priority support, introduce chunking for
          flash attention and repacked matrix multiplications on the CPU, and fix thread-pool race conditions.
        source_ids: [llama-cpp-commits]
