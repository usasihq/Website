    artifact_slug: llama-cpp
    type: open-source
    url: https://github.com/ggml-org/llama.cpp
    contribution: >-
      Opened pull request #16547, "Add experimental ggml-hexagon backend for the Hexagon NPU,"
      merged in October 2025. CODEOWNERS lists Krasnyansky in the ggml-org/ggml-hexagon and
      ggml-org/ggml-opencl teams. Commits authored from July to October 2026 add multi-NPU and
      multi-device support, DMA and L2-cache rework, MUL_MAT and FlashAttention updates, and backend
