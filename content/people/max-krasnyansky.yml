headline: Author of llama.cpp's Hexagon NPU backend; member of its Hexagon and OpenCL code-owner teams
bio:
  text: >-
    Max Krasnyansky opened the pull request that added ggml-hexagon, an experimental llama.cpp
    backend for the Hexagon NPU, which was merged in October 2025. llama.cpp's CODEOWNERS file
    lists Krasnyansky in the teams that own the Hexagon and OpenCL backends; the Hexagon team also
    owns the project's Snapdragon documentation and scripts. Krasnyansky's 2026 commits extend the Hexagon
    backend with multi-NPU and multi-device support, reworked DMA, buffer and cache handling,
    matrix-multiplication and FlashAttention updates, and a backend sampler.
  source_ids: [hexagon-pr, llama-cpp-codeowners, llama-cpp-commits]
  reviewed_at: 2026-10-13
