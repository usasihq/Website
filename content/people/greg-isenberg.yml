sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Apple Podcasts describes The Startup Ideas Podcast as a show published twice a week with free
          startup ideas, hosted by Greg Isenberg. The show's feed opens with an episode titled Podcasts
          Are Broken, published in November 2021, and recent solo and guest episodes walk through using
          AI tools to start and grow small businesses.
        source_ids: [podcast, podcast-feed]
      - text: >-
          Greg's YouTube channel, which YouTube lists as joined in October 2021, carries the video
          episodes along with startup ideas and tutorials on using AI to build and grow a startup. On
          the personal site, Greg's Letter is presented as a weekly letter of startup ideas and
          business-building insights, with ideas shared since 2020.
        source_ids: [channel, site]
      - text: >-
          The site also offers free guides, including The Agents Skill Suite, which generates
          configurations for AI agent roles, an AI Content Automation Guide for marketing workflows, and
          an Obsidian and Claude Code codebook of commands for working with notes.
        source_ids: [site]
  - heading: Companies
    paragraphs:
      - text: >-
          Greg is the CEO of Late Checkout, which the personal site describes as a holding company
          building community-based internet businesses, and lists past work as an advisor to companies
          such as TikTok and Reddit. Late Checkout Agency (LCA), which Greg co-founded, presents itself
          as a design firm that defines, designs and builds AI-native products and organizations.
        source_ids: [site, lca]
      - text: >-
          LCA's site describes product strategy and design engagements with companies including
          Dropbox, Grammarly, Salesforce and the corporate travel company Serko, along with services
          such as a 30-day product vision sprint and an AI innovation lab.
        source_ids: [lca]
