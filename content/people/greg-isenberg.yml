headline: Host of The Startup Ideas Podcast and a YouTube channel on startup ideas and building with AI
bio:
  text: >-
    Greg Isenberg hosts The Startup Ideas Podcast, which shares startup ideas, and posts its video
    episodes on a YouTube channel with tutorials on using AI to build and grow a startup. Greg also
    writes Greg's Letter, a weekly newsletter of startup ideas and business-building insights, and
    publishes free guides on AI agents, AI content automation, and using Claude Code with Obsidian.
    Greg is the CEO of Late Checkout, a holding company building community-based internet
    businesses, and a co-founder of Late Checkout Agency (LCA), a design firm that defines, designs,
    and builds AI-native products.
  source_ids: [podcast, channel, site, lca]
  reviewed_at: 2026-10-21
