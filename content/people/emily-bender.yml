sections:
  - heading: Career
    paragraphs:
      - text: >-
          Bender's CV lists a PhD in linguistics from Stanford in 2000, followed by work as a lecturer and
          postdoctoral researcher at UC Berkeley, as a grammar engineer for Japanese at YY Technologies, and as
          an acting assistant professor and research associate at Stanford and its CSLI center, where Bender had
          joined the HPSG and LinGO projects. Bender came to the University of Washington in 2003 and became a
          full professor in 2014, holding the Howard and Frances Nostrand Endowed Professorship from 2019 to 2022
          before the Wyckoff professorship.
        source_ids: [bender-cv, bender-site]
      - text: >-
          At UW, Bender has directed the Computational Linguistics Laboratory since 2004 and the professional
          master's program in computational linguistics since 2005, and holds adjunct appointments in Computer
          Science and Engineering and the Information School. In professional service, Bender chaired the NAACL
          Executive Board in 2016–2017, served on the ICCL committee responsible for COLING from 2014 to 2018,
          and served on the ACL Executive Board from 2022 to 2025 as vice-president elect, vice-president,
          president and past president.
        source_ids: [bender-cv, bender-site]
  - heading: Research
    paragraphs:
      - text: >-
          Bender's grammar engineering work centers on the LinGO Grammar Matrix, first presented with Dan
          Flickinger and Stephan Oepen at a COLING 2002 workshop as an open-source starter kit for
          broad-coverage precision grammars. The Matrix supports grammars that map sentences to Minimal
          Recursion Semantics representations, and the related AGGREGATION project builds grammars automatically
          from interlinear glossed text to support language documentation.
        source_ids: [bender-site, bender-cv]
      - text: >-
          Since 2016 Bender has also worked on the societal impacts of language technology. This work includes
          the data statements framework for documenting NLP datasets, written with Batya Friedman, "Climbing
          towards NLU" (ACL 2020) with Alexander Koller on the difference between linguistic form and meaning,
          "On the Dangers of Stochastic Parrots" (FAccT 2021) on risks of large language models, and "Situating
          Search" (CHIIR 2022) with Chirag Shah on chatbots used for search.
        source_ids: [bender-site, data-statements, bender-cv]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Bender has written two books that present linguistics for NLP practitioners: "Linguistic Fundamentals
          for Natural Language Processing: 100 Essentials from Morphology and Syntax" (2013) and a second volume
          on semantics and pragmatics (2019) with Alex Lascarides. With Alex Hanna, Bender wrote "The AI Con"
          (2025), a book on recognizing hype about AI. Bender has taught seminars on the societal impacts of
          language technology since early 2017.
        source_ids: [bender-site, ai-con-site]
