headline: University of Washington linguistics professor; developer of the LinGO Grammar Matrix and data statements
bio:
  text: >-
    Emily M. Bender is the Thomas L. and Margo G. Wyckoff Endowed Professor in the Department of
    Linguistics at the University of Washington, where Bender has been on the faculty since 2003,
    directs the Computational Linguistics Laboratory, and is faculty director of the Professional MS in
    Computational Linguistics program. Bender's grammar engineering work centers on the LinGO Grammar
    Matrix, an open-source starter kit for building broad-coverage precision HPSG grammars, developed
    within the DELPH-IN consortium. Bender has written two books presenting linguistic fundamentals
    for NLP practitioners and, with Batya Friedman, co-authored Data Statements for Natural Language
    Processing, which proposes data statements as a documentation practice for NLP datasets. Bender is
    a past Chair of the NAACL Executive Board and has served on the ACL Executive Board, including as
    President.
  source_ids: [bender-site, matrix-site, data-statements]
  reviewed_at: 2026-10-21
