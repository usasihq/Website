sections:
  - heading: Career at OpenAI
    paragraphs:
      - text: >-
          Mira Murati worked at OpenAI before co-founding Thinking Machines Lab. Murati is listed with an
          OpenAI affiliation as a co-author of the 2021 paper "Evaluating Large Language Models Trained on
          Code," which introduced Codex and the HumanEval benchmark, and among the additional contributors to
          the 2023 GPT-4 Technical Report.
        source_ids: [codex-paper, humaneval-repo, gpt4-report]
      - text: >-
          The OpenAI o1 System Card, published in December 2024, lists Murati under executive leadership for
          the o1 models.
        source_ids: [o1-card]
  - heading: Thinking Machines Lab
    paragraphs:
      - text: >-
          Murati is co-founder and CEO of Thinking Machines Lab, an AI research and product company whose
          stated mission is to build AI that extends human will and judgment, with technical directions that
          include multimodal interaction and customizable models. In October 2025 the company announced
          Tinker, an API for training custom models, which reached general availability in December 2025.
        source_ids: [tml-nvidia, tml-home, tml-future, tml-news, tml-tinker]
      - text: >-
          In July 2026 Thinking Machines released Inkling, an open-weights mixture-of-experts transformer
          pretrained on text, images, audio and video and the first in a planned family of models. In March
          2026 Thinking Machines Lab and NVIDIA announced a long-term strategic partnership.
        source_ids: [tml-inkling, tml-news, tml-nvidia]
