headline: Co-founder and CEO of Thinking Machines Lab; previously in OpenAI's executive leadership
bio:
  text: >-
    Mira Murati is the co-founder and CEO of Thinking Machines Lab, an AI research and product company
    that has released the Inkling open-weights models and Tinker, a training API for researchers. Before
    Thinking Machines, Murati worked at OpenAI: the OpenAI o1 System Card (2024) lists Murati under
    executive leadership, the GPT-4 Technical Report lists Murati among additional contributors, and
    Murati is a co-author, with an OpenAI affiliation, of the 2021 Codex paper that introduced the
    HumanEval benchmark.
