headline: UBC professor and Recursive co-founder; former OpenAI research manager and Senior Research Advisor to DeepMind
bio:
  text: >-
    Jeff Clune is a Professor of Computer Science at the University of British Columbia, a Canada
    CIFAR AI Chair at the Vector Institute, and a co-founder of Recursive; Clune's research focuses
    on deep learning, including deep reinforcement learning. Clune was previously a Senior Research
    Advisor to DeepMind, a research manager at OpenAI, a Senior Research Manager and founding member
    of Uber AI Labs, the Harris Associate Professor in Computer Science at the University of
    Wyoming, and a Research Scientist at Cornell University. Clune co-authored the Video PreTraining
    (VPT) paper, whose openai/Video-Pre-Training repository is MIT-licensed, and "The AI Scientist"
    (2024).
  source_ids: [clune-site, clune-bio, vpt-paper, vpt-repo, aiscientist-paper]
  reviewed_at: 2026-10-21
