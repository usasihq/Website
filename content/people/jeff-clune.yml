sections:
  - heading: Career
    paragraphs:
      - text: >-
          Clune was a Research Scientist at Cornell University and then the Harris Associate Professor in Computer
          Science at the University of Wyoming. Clune became a Senior Research Manager and founding member of Uber
          AI Labs, which formed after Uber acquired a startup Clune helped lead, and later worked as a research
          manager at OpenAI and as a Senior Research Advisor to DeepMind.
        source_ids: [clune-bio]
      - text: >-
          Clune is now a Professor of Computer Science at the University of British Columbia and a Canada CIFAR AI
          Chair and faculty member at the Vector Institute, and is a co-founder of Recursive. Clune's biography
          lists papers in Nature, Science and PNAS, and best paper and test-of-time awards at machine learning
          conferences.
        source_ids: [clune-site, clune-bio]
  - heading: Research
    paragraphs:
      - text: >-
          Clune's 2014 papers with Jason Yosinski and others studied how deep networks represent images, measuring
          how transferable features are between tasks and showing that networks can make high-confidence
          predictions for unrecognizable images. With Antoine Cully and colleagues, Clune co-authored "Robots that
          can adapt like animals", on robots that recover quickly from damage.
        source_ids: [transferable-features-paper, easily-fooled-paper, robots-adapt-paper]
      - text: >-
          Much of Clune's work concerns open-ended learning and exploration. In 2019 Clune co-authored POET, which
          generates increasingly complex learning environments together with their solutions, and Go-Explore, an
          approach to hard-exploration reinforcement learning problems, and wrote "AI-GAs", which argues for
          algorithms that themselves generate general AI. At OpenAI Clune co-authored Video PreTraining (VPT), which
          learned to act in Minecraft from unlabeled online videos.
        source_ids: [poet-paper, go-explore-paper, ai-gas-paper, vpt-paper, vpt-repo]
      - text: >-
          Recent work automates parts of AI research itself. Clune co-authored "The AI Scientist" (2024), on fully
          automated scientific discovery, "Automated Design of Agentic Systems" (2024), and the Darwin Godel
          Machine (2025), a system of self-improving coding agents that evolves through open-ended search.
        source_ids: [aiscientist-paper, adas-paper, dgm-paper]
