      a 137B parameter model on over 60 NLP tasks and evaluates the resulting FLAN model on unseen task
      types; also a co-author of the 2022 follow-up on scaling instruction finetuning.
    source_ids: [flan-zeroshot-paper, flan-scaling-paper]
