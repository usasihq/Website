sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jason Wei joined Google Brain in October 2020, then worked there as a
          research engineer from December 2021 and as a research scientist from June 2022, becoming
          a senior research scientist in October 2022. In February 2023 Wei joined OpenAI as a
          research scientist.
        source_ids: [wei-cv]
      - text: >-
          Wei's homepage describes the OpenAI years, from 2023 to 2025, as work on reasoning and
          agents, and says Wei now works at Meta Superintelligence Labs. While at OpenAI, Wei appeared
          in company videos introducing o1 in ChatGPT and gave a keynote at OpenAI DevDay in 2024.
        source_ids: [wei-site, wei-cv]
  - heading: Research
    paragraphs:
      - text: >-
          At Google, Wei was first author of Finetuned Language Models Are Zero-Shot Learners (2021),
          which introduced the instruction-tuned FLAN model, and of the 2022 chain-of-thought prompting
          paper, which showed that a few worked reasoning examples in a prompt improve performance on
          arithmetic, commonsense and symbolic reasoning tasks. Wei was also first author of Emergent
          Abilities of Large Language Models (2022) and a co-author of the follow-up on scaling
          instruction finetuning.
        source_ids: [flan-zeroshot-paper, cot-paper, emergent-paper, flan-scaling-paper]
      - text: >-
          At OpenAI, Wei was co-first author of two evaluation benchmark papers: SimpleQA, introduced in a 2024 paper on
          measuring short-form factuality, and BrowseComp, a 2025 benchmark for browsing agents. Wei's
          CV also lists co-authorship of the PaLM paper and of a 2023 Nature paper on large language
          models and clinical knowledge.
        source_ids: [simpleqa-paper, browsecomp-paper, wei-cv]
  - heading: Teaching and talks
    paragraphs:
      - text: >-
          Wei has given guest lectures in university courses, including Stanford CS25 in 2023 and
          2024, Stanford CS330, Harvard CS249r and MIT MAS.S68. Wei's homepage also lists a 2025 talk
          at the Stanford AI Club and a keynote at Columbia University's DAPLab.
        source_ids: [wei-site, wei-cv]
