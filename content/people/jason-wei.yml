headline: AI researcher at Meta Superintelligence Labs; first author of the chain-of-thought prompting paper
bio:
  text: >-
    Jason Wei works at Meta Superintelligence Labs; from 2023 to 2025 Wei was at OpenAI, working on
    reasoning and agents, and before that Wei was a research scientist at Google Brain. Wei is first
    author of Chain-of-Thought Prompting Elicits Reasoning in Large
    Language Models and of Finetuned Language Models Are Zero-Shot Learners, which introduced the
    instruction-tuned FLAN model, and a co-author of Scaling Instruction-Finetuned Language Models.
    Wei's homepage also lists a 2024 paper on measuring short-form factuality in large language models
    and a 2025 benchmark for browsing agents.
  source_ids: [wei-site, cot-paper, flan-zeroshot-paper, flan-scaling-paper]
