headline: Director at Meta Superintelligence Labs who co-leads the Segment Anything team; first author of SAM 2
bio:
  text: >-
    Nikhila Ravi is a Director at Meta Superintelligence Labs (MSL), where Ravi co-leads the Segment
    Anything (SAM) team; Ravi's site says Ravi co-led the development of Segment Anything, SAM 2, and
    SAM 3. Ravi is first author of the SAM 2 paper (2024), a co-author of the original Segment
    Anything paper, and one of the project leads named in the SAM 3 repository. The SAM 2 repository
    releases model checkpoints, demo code, and training code under the Apache 2.0 license. An earlier
    Meta AI profile describes Ravi as a research engineer at FAIR and lists work on PyTorch3D.
  source_ids: [homepage, sam2-paper, sam-paper, sam3-readme, sam2-readme, meta-profile]
