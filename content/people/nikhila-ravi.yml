sections:
  - heading: Career
    paragraphs:
      - text: >-
          Nikhila Ravi's earlier Meta AI profile describes Ravi as a research engineer at Facebook AI
          Research focused on computer vision and 3D understanding, after earlier work at Facebook on
          tools and platforms for machine learning training and deployment for internal teams. Ravi is now
          a Director at Meta Superintelligence Labs and co-leads the Segment Anything (SAM) team.
        source_ids: [meta-profile, homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Ravi is first author of the 2020 PyTorch3D paper, describing a library for 3D deep learning, and
          co-authored 3D vision work including Worldsheet (ICCV 2021), Omnivore (CVPR 2022) and the Omni3D
          benchmark for 3D object detection (CVPR 2023).
        source_ids: [pytorch3d-paper, research-page]
      - text: >-
          Ravi co-led the development of Segment Anything (2023), SAM 2 (2024), which extended promptable
          segmentation from images to video, and SAM 3 (2025), which segments objects from concept
          prompts and lists Ravi as a project lead. Ravi also co-authored the 2025 Perception Encoder and
          PerceptionLM papers presented at NeurIPS 2025.
        source_ids: [homepage, sam-paper, sam2-paper, sam3-paper, sam3-readme, research-page]
  - heading: Open-source work
    paragraphs:
      - text: >-
          The SAM 2 repository releases model checkpoints, demo code and training code under the Apache
          2.0 license, and Ravi's site notes the later release of SAM 2.1 checkpoints with a developer
          suite for fine-tuning and the web demo. SAM 3 was released with a SAM Playground, followed by
          SAM 3.1, which Ravi's site describes as doubling video processing speed.
        source_ids: [sam2-readme, homepage]
