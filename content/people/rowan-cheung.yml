sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Cheung founded The Rundown, a daily newsletter that summarizes AI news, explains why it matters and
          shows how to apply it at work. The Rundown AI's site now publishes separate AI, tech and robotics
          newsletters written by a team of authors, along with news articles, guides, tool listings and courses
          through its AI University.
        source_ids: [personal-site, rundown-home]
      - text: >-
          Cheung's own writing covers AI, business and the future of work, with hands-on pieces on topics such as
          long-context testing of Gemini 1.5, early access to ChatGPT Operator, and product announcements at WWDC
          2024 and CES 2025.
        source_ids: [personal-site]
  - heading: Interviews
    paragraphs:
      - text: >-
          Cheung interviews people working in the AI industry and hosts the podcast Rowan's Notes. Cheung's first
          interview, in 2024, was with Mark Zuckerberg on Llama 3.1, open source and AI agents, and later guests
          listed on Cheung's site include Sam Altman, Satya Nadella and Demis Hassabis.
        source_ids: [personal-site, rundown-home]
