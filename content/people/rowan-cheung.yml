bio:
  text: >-
    Rowan Cheung is the founder of The Rundown, a daily AI newsletter whose publisher, The Rundown AI,
    also runs AI news articles, courses, and guides. Rowan writes about AI, business, and the future
    of work, interviews people working in the AI industry, and hosts the podcast Rowan's Notes, which
    covers AI developments and how to apply them at work.
