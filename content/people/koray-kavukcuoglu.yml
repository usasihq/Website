headline: SVP of Google DeepMind and Chief AI Architect at Google; co-author of the DQN and WaveNet papers
bio:
  text: >-
    Koray Kavukcuoglu is SVP of Google DeepMind and Chief AI Architect at Google, where Google's author
    page says Kavukcuoglu leads the development of Google DeepMind's generative AI models and their
    integration into Google products. In an earlier role as VP of Research at Google DeepMind,
    Kavukcuoglu founded the deep learning team, whose work included DQN and WaveNet. Kavukcuoglu is a
    co-author of the 2013 paper Playing Atari with Deep Reinforcement Learning and the 2016 WaveNet
    paper, and is listed among the executive sponsors or sponsors of the Gemma, Gemma 2, and Gemma 3
    technical reports.
  source_ids: [koray-author, argon-post, dqn-paper, wavenet-paper, gemma-report, gemma2-report, gemma3-report]
