sections:
  - heading: Career
    paragraphs:
      - text: >-
          As VP of Research at Google DeepMind, Kavukcuoglu founded the deep learning team, whose work
          included DQN and WaveNet. As SVP of Google DeepMind and Chief AI Architect at Google, Kavukcuoglu
          leads the development of Google DeepMind's generative AI models and their integration into Google
          products.
        source_ids: [koray-author]
      - text: >-
          Kavukcuoglu wrote Google's October 13, 2026 announcement of Gemini 4 Argon, a frontier model for
          coding, enterprise knowledge work and cyber defense offered to developers, enterprises, scientists
          and consumers. Kavukcuoglu is also listed among the authors of the Gemma, Gemma 2
          and Gemma 3 open-model reports.
        source_ids: [argon-post, gemma-report, gemma2-report, gemma3-report]
  - heading: Research
    paragraphs:
      - text: >-
          Kavukcuoglu's early papers include first-authored work on fast inference in sparse coding
          algorithms for object recognition (2010) and the co-authored "Natural Language Processing (almost)
          from Scratch" (2011).
        source_ids: [sparse-coding-paper, nlp-scratch-paper]
      - text: >-
          At DeepMind, Kavukcuoglu co-authored papers on deep reinforcement learning such as "Playing Atari
          with Deep Reinforcement Learning" (2013) and "Asynchronous Methods for Deep Reinforcement Learning"
          (2016), as well as Spatial Transformer Networks (2015), WaveNet (2016) and "Neural Discrete
          Representation Learning" (2017), which introduced the VQ-VAE.
        source_ids: [dqn-paper, a3c-paper, stn-paper, wavenet-paper, vqvae-paper]
