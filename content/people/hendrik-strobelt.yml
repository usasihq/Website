sections:
  - heading: Career
    paragraphs:
      - text: >-
          Strobelt holds a doctorate in computer science, in visualization, from the University of Konstanz,
          and held postdoctoral positions at Harvard SEAS and NYU Tandon before joining IBM in 2017. Strobelt
          is a Senior Research Scientist at IBM Research and the Explainability Lead for the MIT-IBM Watson AI
          Lab, and is a visiting researcher at MIT CSAIL. IBM Research's profile also notes temporary faculty
          positions at Carnegie Mellon University and the University of Konstanz.
        source_ids: [ibm-research-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Strobelt's research centers on visualization for, and human collaboration with, AI models, aimed at
          explainability and intuition; earlier work concerned NLP and generative models, and the methods have
          been applied in machine learning, biomedicine, and chemistry. Recent co-authored papers listed by IBM
          Research include work on multi-level explanations for generative language models (ACL 2025) and on
          interactive counterfactual analysis of large language model behavior (IEEE TVCG 2025).
        source_ids: [ibm-research-profile]
      - text: >-
          In chemistry, Strobelt co-authored a 2021 IBM Research post on RXNMapper, an open-source atom-mapping
          tool that learned the grammar of organic chemistry reactions without human supervision, developed by
          IBM Research Europe, the MIT-IBM Watson AI Lab, and the University of Bern.
        source_ids: [rxnmapper-post]
  - heading: Open-source work and tools
    paragraphs:
      - text: >-
          Strobelt is first author of LSTMVis (2016), a tool for exploring hidden-state dynamics in recurrent
          neural networks, and a co-author of GLTR (2019), an open-source tool that uses a language model's own
          statistics to help people spot generated text. In 2020 Strobelt built a NeurIPS paper visualization
          tool, built with Benjamin Hoover, that clusters accepted papers by theme using language-model
          embeddings and UMAP.
        source_ids: [lstmvis-paper, gltr-paper, gltr-repo, neurips-viz-post]
  - heading: Scientific service
    paragraphs:
      - text: >-
          Strobelt's work has appeared at venues including IEEE VIS, ICLR, ACL, NeurIPS, and ICCV, and in
          journals such as PNAS and Science Advances. Strobelt has served on organizing committees for IEEE VIS,
          VISxAI, ICLR, ICML, and NeurIPS.
        source_ids: [ibm-research-profile]
