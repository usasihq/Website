headline: Senior Research Scientist at IBM Research and MIT-IBM lab explainability lead; co-creator of GLTR
bio:
  text: >-
    Hendrik Strobelt is a Senior Research Scientist at IBM Research and the Explainability Lead at the
    MIT-IBM Watson AI Lab, working on visualization for and human collaboration with AI models. Strobelt
    joined IBM in 2017 after postdoctoral positions at Harvard SEAS and NYU Tandon. With Sebastian
    Gehrmann and Alexander M. Rush, Strobelt created GLTR (Giant Language Model Test Room), an
    Apache-2.0 open-source tool that helps people judge whether a text was generated by a language model,
    built as a collaboration of the MIT-IBM Watson AI Lab and HarvardNLP. Strobelt also co-authored
    LSTMVis, a tool for visual analysis of hidden-state dynamics in recurrent neural networks.
  source_ids: [ibm-research-profile, gltr-paper, gltr-repo, lstmvis-paper]
  reviewed_at: 2026-10-13
