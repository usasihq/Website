sections:
  - heading: Research
    paragraphs:
      - text: >-
          Olukotun's research centers on multicore and parallel processor design. Olukotun led the
          Stanford Hydra chip multiprocessor research project and, as director of the Pervasive
          Parallelism Lab, works on infrastructure for usable machine learning, including as a
          co-leader of the DAWN research program.
        source_ids: [stanford-profile, sn-team, dawn-paper]
      - text: >-
          Stanford's profile lists Olukotun as an ACM Fellow and an IEEE Fellow, the latter for
          contributions to chip multiprocessor design and its commercialization.
        source_ids: [stanford-profile]
  - heading: Companies
    paragraphs:
      - text: >-
          Olukotun founded Afara Websystems to build high-throughput, low-power multicore server
          processors; Sun Microsystems acquired the company in 2002, and its Niagara processor went
          on to power SPARC-based servers.
        source_ids: [stanford-profile, sn-team]
      - text: >-
          In 2017 Olukotun co-founded SambaNova with Stanford colleague Christopher Ré and
          semiconductor executive Rodrigo Liang. SambaNova describes Olukotun's chip
          multiprocessor work and Ré's machine learning systems work as the two starting points
          for the company, where Olukotun leads as Chief Technologist.
        source_ids: [sn-about, stanford-profile]
