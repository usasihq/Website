headline: Co-founder and Chief Technologist of SambaNova; Cadence Design Professor at Stanford University
bio:
  text: >-
    Kunle Olukotun is a co-founder and the Chief Technologist of SambaNova, which builds dataflow
    chips and systems for AI, and the Cadence Design Professor of Electrical Engineering and
    Computer Science at Stanford University. Olukotun led the Stanford Hydra chip multiprocessor
    project, founded Afara Websystems, whose Niagara multicore processor was acquired by Sun
    Microsystems, and directs Stanford's Pervasive Parallelism Lab.
  source_ids: [stanford-profile, sn-team]
  reviewed_at: 2026-10-21
