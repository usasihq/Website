sections:
  - heading: Career
    paragraphs:
      - text: >-
          Philipp Schmid worked at Hugging Face as a Technical Lead, heading collaborations with cloud
          providers such as AWS, Google Cloud, Azure and Cloudflare and serving as technical and
          engineering lead for key cloud and hardware partnerships. Schmid's about page says that
          work included creating Hugging Face Inference Endpoints and collaborating with the
          open-source and science teams on projects such as Zephyr, SmolLM and StarCoder.
        source_ids: [schmid-about]
      - text: >-
          Schmid joined Google DeepMind in 2025 to build a developer relations and developer
          experience team that brings the lab's research to developers, working across open models
          and foundation models such as Gemini and Gemma.
        source_ids: [schmid-about, github-profile]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Schmid's projects page lists Hugging Face Inference Endpoints (creator and technical lead),
          the Hugging Face LLM Inference Container (technical and engineering lead), and IGEL, an
          instruction-tuned German language model from early 2023 (creator). Schmid maintained the
          SageMaker Hugging Face Inference Toolkit and the EasyLLM library, and contributed to
          Transformers, Datasets, Optimum and TRL.
        source_ids: [schmid-projects]
      - text: >-
          Schmid is also listed among the authors in the citation entry of Hugging Face's Accelerate
          library, which runs PyTorch training in distributed and mixed-precision settings.
        source_ids: [accelerate-readme]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Schmid publishes tutorials and guides on philschmid.de. Recent posts in 2026 cover
          building with the Gemini API, including the Interactions API, Gemini Managed Agents,
          Deep Research and computer-use agents, along with essays on agent evaluation and subagent
          patterns.
        source_ids: [schmid-site]
