headline: Staff Engineer for developer experience at Google DeepMind; former Technical Lead at Hugging Face
bio:
  text: >-
    Philipp Schmid is a Staff Engineer (Developer Experience and Developer Relations) at Google
    DeepMind, where Schmid is building an AI developer relations and developer experience team to
    bring Google DeepMind's research to developers, working with models such as Gemini and Gemma.
    Before joining Google DeepMind in 2025, Schmid was a Technical Lead at Hugging Face and served
    as technical lead for its cloud and hardware partnerships, helping create Hugging Face
    Inference Endpoints for deploying models. Schmid is listed among the authors of Hugging Face's
    Accelerate library and publishes developer guides on agents and the Gemini API on
    philschmid.de.
  source_ids: [schmid-about, github-profile, accelerate-readme, schmid-site]
  reviewed_at: 2026-10-21
