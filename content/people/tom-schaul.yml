sections:
  - heading: Career
    paragraphs:
      - text: >-
          Schaul completed a PhD from TU Munich in 2011 under the supervision of Jürgen Schmidhuber at the
          Swiss AI Lab IDSIA. From 2011 to 2013 Schaul was a postdoc
          in Yann LeCun's lab at New York University's Courant Institute, and in 2013 joined DeepMind while it
          was a start-up. Schaul is now a senior staff research scientist who heads a reinforcement learning team
          at Google DeepMind.
        source_ids: [homepage]
      - text: >-
          Schaul's service to the field includes serving as program chair for the Reinforcement Learning
          Conference (RLC) 2026, keynote chair and senior area chair for RLC 2025, and area chair for ICML and
          NeurIPS 2024. Schaul has also co-organized a Dagstuhl workshop on AI for the social good and taught at the
          International Summer School on Artificial Intelligence and Games.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Schaul's research covers many aspects of deep reinforcement learning, including exploration,
          hierarchy, goal discovery, learning dynamics, generalization and credit assignment, as well as
          black-box optimization and minimal hyperparameter tuning, with games as a favorite application area.
          Papers include Universal Value Function Approximators (ICML 2015), Prioritized Experience Replay (ICLR
          2016), "Ray Interference" (RLDM 2019) on plateaus in deep RL, and "The Phenomenon of Policy Churn"
          (NeurIPS 2022).
        source_ids: [homepage, per-paper, policy-churn-paper]
      - text: >-
          Schaul also co-authored DeepMind's 2019 Nature paper on reaching grandmaster level in StarCraft II
          with multi-agent reinforcement learning, a 2020 Nature Communications perspective on AI for social
          good, a 2024 ICML position paper on open-endedness presented as an oral, and the Gemini 2.5 technical
          report in 2025.
        source_ids: [homepage]
