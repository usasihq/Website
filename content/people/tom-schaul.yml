headline: Google DeepMind senior staff research scientist and RL team lead; Prioritized Experience Replay author
bio:
  text: >-
    Tom Schaul is a senior staff research scientist at Google DeepMind and leads a reinforcement
    learning team there, having joined DeepMind in 2013 while it was a start-up. Schaul's research covers
    exploration, hierarchy, credit assignment and learning dynamics in deep reinforcement learning,
    along with black-box optimization. Schaul is first author of "Prioritized Experience Replay"
    (2015), which replays important transitions more often than uniform sampling would, and of "The
    Phenomenon of Policy Churn" (NeurIPS 2022).
