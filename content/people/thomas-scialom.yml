headline: Corresponding author of Meta's Llama 2 paper; a lead author of the ARE agent platform and Gaia2 benchmark
bio:
  text: >-
    Thomas Scialom is one of the two equal-contribution corresponding authors of Llama 2: Open
    Foundation and Fine-Tuned Chat Models (2023), from GenAI at Meta, and is listed in that paper's
    Science and Engineering Leadership group; Scialom is also among the core contributors of The
    Llama 3 Herd of Models (2024). With Meta Superintelligence Labs, Scialom is one of the lead
    authors of ARE: Scaling Up Agent Environments and Evaluations (2025), which introduces the Meta
    Agents Research Environments platform and the Gaia2 benchmark. A 2026 paper, the Gaia2 benchmark
    paper published at ICLR 2026, lists Scialom at Meta SuperIntelligence Labs. Scialom also
    co-authored the earlier GAIA benchmark for general AI assistants (2023).
  source_ids: [llama2-paper, llama3-paper, are-paper, gaia2-paper, gaia-paper]
  reviewed_at: 2026-10-13
