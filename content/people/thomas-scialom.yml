sections:
  - heading: Research
    paragraphs:
      - text: >-
          Thomas Scialom co-authored several language model papers in 2022 and 2023. These
          include Galactica, a large language model for science, and Toolformer, in which a language
          model learns to decide when and how to call external tools. Scialom is also a co-author of
          the BLOOM open-access multilingual model paper.
        source_ids: [galactica-paper, toolformer-paper, bloom-paper]
      - text: >-
          Scialom was one of the two corresponding authors of the Llama 2 paper (2023) and is listed
          in its science and engineering leadership group. Scialom also co-authored Code Llama, a
          family of Llama 2-based models for code, and is among the core contributors to The Llama 3
          Herd of Models (2024).
        source_ids: [llama2-paper, codellama-paper, llama3-paper]
  - heading: Agents and evaluation
    paragraphs:
      - text: >-
          Scialom co-authored GAIA (2023), a benchmark of real-world questions for general AI
          assistants. With Meta Superintelligence Labs, Scialom is one of the lead authors of ARE
          (2025), which introduces the Meta Agents Research Environments platform for building agent
          environments, and is an author of the Gaia2 benchmark paper (2026) on evaluating language
          model agents in dynamic, asynchronous settings.
        source_ids: [gaia-paper, are-paper, gaia2-paper]
