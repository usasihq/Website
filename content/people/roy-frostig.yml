headline: Co-author and core developer of JAX; research scientist at Google DeepMind
bio:
  text: >-
    Roy Frostig is a research scientist at Google DeepMind and a co-author and core developer of
    JAX, which Frostig's homepage says Frostig created with a few colleagues in 2017. With Matthew
    Johnson and Chris Leary, Frostig wrote the SysML 2018 paper "Compiling machine learning programs
    via high-level tracing," which reported on an early version of JAX. Frostig's homepage describes
    work on the foundations of machine learning through theory, systems, and programming languages,
    and the JAX documentation lists Frostig as an author of design proposals including typed PRNG
    keys and the jax.extend module.
  source_ids: [homepage, jax-sysml, jax-readme, jep-typed-keys, jep-jex]
