sections:
  - heading: Research
    paragraphs:
      - text: >-
          Frostig completed a PhD at Stanford, advised by Percy Liang, as part of the statistical machine
          learning group. Frostig's early papers concerned optimization and learning theory, including
          stochastic algorithms for empirical risk minimization (2015), principal component projection without
          principal component analysis (2016), and the expressivity of neural networks at initialization.
        source_ids: [homepage, unregularizing-paper]
      - text: >-
          Frostig later co-authored a study measuring the effects of data parallelism on neural network
          training (2018) and work on test-set reuse. Later papers turned to the theory of automatic
          differentiation, such as "Decomposing reverse-mode automatic differentiation" (2021) and "You Only
          Linearize Once" (2022), which shows how tangents transpose to gradients, as well as modular implicit
          differentiation. Frostig is also listed with the Gemini Team on the Gemini 1.5 and Gemini 2.5 reports.
        source_ids: [homepage, data-parallelism-paper, decomposing-ad-paper, yolo-paper, implicit-diff-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Frostig created JAX with a few colleagues in 2017 and continues to work on it as a core developer.
          With Matthew Johnson and Chris Leary, Frostig described an early version of the system in "Compiling
          machine learning programs via high-level tracing" at SysML 2018. JAX's documentation credits Frostig
          as an author of design proposals for typed PRNG keys and for the jax.extend module, and Frostig's
          homepage notes small contributions to the Rust programming language in its early stages.
        source_ids: [homepage, jax-sysml, jep-typed-keys, jep-jex, jax-readme]
