    source_ids: [jinja-pr]
  - date: "2025-01-21"
    text: Had the Jinja template support pull request merged into llama.cpp.
    source_ids: [jinja-pr]
  - date: "2025-02-18"
    text: Refactored the common chat and tool-call API in llama.cpp, with tests and fixes.
    source_ids: [llama-cpp-commits]
  - date: "2025-05-25"
    text: Added streaming of tool calls and thoughts to llama-server when Jinja templates are enabled.
    source_ids: [llama-cpp-commits]
  - date: "2025-11-03"
    text: Synced minja into llama.cpp to support GLM 4.6 and MiniMax M2 chat templates.
    source_ids: [llama-cpp-commits]
