sections:
  - heading: Career
    paragraphs:
      - text: >-
          Olivier Chafik's about page describes early work doing 3D graphics and performance
          optimization at Cimmetry Systems, followed by
          three years leading a front-office development team at Sophis. From mid-2012 Chafik worked
          as a software engineer at Google on YouTube for iOS, Swiffy and AdSense.
        source_ids: [chafik-about]
      - text: >-
          Chafik's GitHub profile now lists Anthropic as company, and the Model Context Protocol's
          maintainers file lists Chafik as one of the maintainers of the protocol's TypeScript SDK.
        source_ids: [github-profile, mcp-maintainers, mcp-ts-license]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Chafik has published open-source libraries for interoperability and performance,
          including ScalaCL, which runs Scala code on graphics cards, the Scalaxy macro experiments,
          and Java libraries such as BridJ, JavaCL and JNAerator for calling native code and OpenCL.
        source_ids: [chafik-about, chafik-site]
      - text: >-
          In llama.cpp, Chafik's pull request adding Jinja chat-template support was merged on 21
          January 2025. It relies on minja, a minimal C++ Jinja engine published in Google's GitHub
          organization, whose README notes that Chafik has since left Google. Through 2025 Chafik's
          commits extended llama-server's tool-call support, added streaming of tool calls and
          reasoning output, added options such as a reasoning budget and an offline mode, and kept the
          vendored minja in sync with new model templates.
        source_ids: [jinja-pr, minja-readme, llama-cpp-commits, llama-cpp-license]
timeline:
  - date: "2012"
    text: Joined Google as a software engineer, working on YouTube for iOS, Swiffy and AdSense.
    source_ids: [chafik-about]
