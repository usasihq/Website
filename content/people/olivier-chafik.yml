headline: MCP TypeScript SDK maintainer; added Jinja chat templates and tool calling to llama.cpp
bio:
  text: >-
    Olivier Chafik is a software engineer whose GitHub profile lists Anthropic as company, and the
    Model Context Protocol's maintainers file lists Chafik as a maintainer of the protocol's
    TypeScript SDK. In January 2025 Chafik's pull request added Jinja chat-template support to
    llama.cpp, using minja, a minimal C++ Jinja engine in Google's GitHub organization that the
    pull request says was created for this purpose; minja's README notes that Chafik has since left
    Google. Chafik's 2025 commits to llama.cpp fix and extend llama-server's tool-call support, add
    streaming of tool calls and reasoning output, and keep the vendored minja in sync. Chafik's site describes earlier software engineering at Google on
    YouTube for iOS, Swiffy and AdSense, and open-source Java and Scala libraries such as BridJ,
    JavaCL and JNAerator.
  source_ids: [github-profile, mcp-maintainers, jinja-pr, minja-readme, llama-cpp-commits, chafik-about, chafik-site]
  reviewed_at: 2026-10-13
