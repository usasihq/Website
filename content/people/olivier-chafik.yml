work:
  - name: Model Context Protocol TypeScript SDK
    artifact_slug: model-context-protocol
    type: open-source
    url: https://github.com/modelcontextprotocol/typescript-sdk
    contribution: >-
      Listed as one of the TypeScript SDK maintainers in the protocol's MAINTAINERS.md (last updated
      October 1, 2026). The SDK's license file says the project is moving from MIT to Apache-2.0:
      new contributions are licensed under Apache-2.0, and earlier contributions not yet relicensed
      remain under MIT.
    source_ids: [mcp-maintainers, mcp-ts-license]
  - name: llama.cpp chat templates and tool calling
    artifact_slug: llama-cpp
    type: open-source
    url: https://github.com/ggml-org/llama.cpp
    contribution: >-
      Opened pull request #11016, "Add Jinja template support," merged in January 2025, which copied
      minja from google/minja into llama.cpp. Commits authored in 2025 fix and extend tool-call
      support, add streaming of tool calls and thoughts with --jinja, reasoning-format options, a
      --json-schema-file flag, and syncs of the vendored minja. The repository is MIT-licensed.
    source_ids: [jinja-pr, llama-cpp-commits, llama-cpp-license]
  - name: minja
    artifact_slug: null
    type: open-source
    url: https://github.com/google/minja
    contribution: >-
      A minimal C++ reimplementation of the Jinja templating engine for LLM chat templates, in
      Google's GitHub organization under the MIT license. Chafik's llama.cpp pull request #11016
      copied minja into llama.cpp and says minja was created for that purpose; the README says it
      is used in llama.cpp and points readers to Chafik's fork after Chafik left Google.
    source_ids: [minja-readme, jinja-pr]
