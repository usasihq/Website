sections:
  - heading: Career
    paragraphs:
      - text: >-
          Liguori worked as a software engineer at Motorola Solutions on WiFi products before joining Amazon in 2014. At AWS, Liguori
          worked on AWS Proton, Amazon ECS and the AWS Code Suite, and wrote for the Amazon Builders'
          Library on automating safe, hands-off deployments (2020) and on CI/CD pipelines as release
          captains (2022).
        source_ids: [liguori-about, liguori-writing]
      - text: >-
          Liguori is now a Senior Principal Software Engineer working on developer tooling and agentic AI,
          focused on Kiro and the Strands Agents SDK. In 2026 Liguori wrote about building the Kiro agent
          harness and about steering hooks for agent accuracy on the Strands Agents blog.
        source_ids: [liguori-about, strands-launch, liguori-writing]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Liguori is a core maintainer of the Model Context Protocol specification and of Agent Plugins, and
          published a library for running stdio-based MCP servers in AWS Lambda. Earlier open-source work
          includes contributions to the AWS CDK, an authentication library and AWS Proton plugin for
          Backstage, and the Amazon ECS plugin for Spinnaker, where Liguori co-led the Spinnaker AWS SIG.
        source_ids: [liguori-projects]
