headline: AWS Senior Principal Software Engineer on Kiro and Strands Agents; core maintainer of the MCP spec
bio:
  text: >-
    Clare Liguori is a Senior Principal Software Engineer at Amazon Web Services, working on developer
    tooling and agentic AI with a focus on Kiro and the Strands Agents SDK. Liguori wrote AWS's May 2025
    post introducing Strands Agents as an open-source AI agents SDK, and is a core maintainer of the
    Model Context Protocol (MCP) specification. Liguori joined Amazon in 2014 and earlier worked on AWS
    Proton, Amazon ECS and the AWS Code Suite.
  source_ids: [liguori-about, strands-launch, liguori-projects]
  reviewed_at: 2026-10-22
