work:
  - name: "TruthfulQA: Measuring How Models Mimic Human Falsehoods"
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2109.07958
    contribution: >-
      Co-author (with Stephanie Lin and Jacob Hilton) of the 2021 benchmark paper, whose 817 questions
      across 38 categories are designed so that some humans would answer falsely because of
      misconceptions.
    source_ids: [truthfulqa-paper, evans-site]
  - name: "Emergent Misalignment: Narrow finetuning can produce broadly misaligned LLMs"
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2502.17424
    contribution: >-
      Last-listed author of the 2025 paper, which reports that finetuning a model to write
      insecure code without disclosing it leads to misaligned behavior on a broad range of unrelated
      prompts.
    source_ids: [emergent-misalignment-paper, evans-site]
  - name: "The Reversal Curse: LLMs trained on \"A is B\" fail to learn \"B is A\""
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2309.12288
    contribution: >-
      Last-listed author of the 2023 paper, presented at ICLR 2024, which shows that a model trained on a
      statement of the form "A is B" does not automatically learn the reverse direction "B is A".
    source_ids: [reversal-curse-paper, evans-site]
  - name: "Subliminal Learning: Language models transmit behavioral traits via hidden signals in data"
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2507.14805
    contribution: >-
      Last-listed author of the 2025 paper, which reports that a student model can pick up a teacher
      model's trait from data made only of number sequences, even after references to the trait are
      filtered out.
    source_ids: [subliminal-learning-paper, evans-site]
