sections:
  - heading: Career
    paragraphs:
      - text: >-
          Owain Evans earned a PhD at MIT, with a 2015 dissertation titled Bayesian Computational Models
          for Inferring Preferences, and later worked at the Future of Humanity Institute at the
          University of Oxford. Evans now directs Truthful AI, a non-profit for AI safety research, and is
          an Affiliate Researcher at CHAI, UC Berkeley. Evans also serves on the boards of directors of
          Ought and Constellation.
        source_ids: [evans-site]
  - heading: Research
    paragraphs:
      - text: >-
          Evans's early papers studied how to infer human preferences from behavior, including a 2016
          AAAI paper on learning the preferences of ignorant and inconsistent agents, and work on safe
          reinforcement learning with a human in the loop. With Andreas Stuhlmüller and others, Evans
          wrote Agentmodels.org, an online book and open-source library on modeling agents with
          probabilistic programs.
        source_ids: [evans-site]
      - text: >-
          Later work turned to the honesty and generalization of language models. TruthfulQA (2021)
          measures whether models repeat common human misconceptions, and the Reversal Curse paper (2023)
          shows that models trained on "A is B" do not automatically learn "B is A". The 2025 emergent
          misalignment paper, an ICML 2025 oral, reports that narrow finetuning on insecure code can
          produce broadly misaligned behavior, and the 2025 subliminal learning paper reports that traits
          can pass between models through data that looks unrelated.
        source_ids: [truthfulqa-paper, reversal-curse-paper, emergent-misalignment-paper, subliminal-learning-paper, evans-site]
  - heading: Teaching and mentoring
    paragraphs:
      - text: >-
          Evans mentors AI safety researchers through the Astra and MATS fellowships and keeps a public
          list of past mentees on their homepage. In 2025 Evans gave the Hinton Lectures, a series of three
          lectures on AI safety for a general audience hosted by Geoffrey Hinton.
        source_ids: [evans-site]
