headline: Director of the nonprofit Truthful AI and affiliate researcher at CHAI, UC Berkeley; TruthfulQA co-author
bio:
  text: >-
    Owain Evans is Director at Truthful AI, a non-profit for AI safety research, and an Affiliate
    Researcher at CHAI, UC Berkeley. Evans's research covers
    emergent misalignment, subliminal learning, out-of-context reasoning, personas, and introspection
    in language models. Evans co-authored TruthfulQA, a benchmark that measures whether language models
    answer questions truthfully, and is the last-listed author of the 2025 paper on emergent misalignment from
    narrow finetuning. Evans was previously at FHI at the University of Oxford.
  source_ids: [evans-site, truthfulqa-paper, emergent-misalignment-paper]
