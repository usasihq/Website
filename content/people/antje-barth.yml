sections:
  - heading: Career
    paragraphs:
      - text: >-
          A June 2021 AWS Machine Learning Blog post describes Barth as a Senior Developer Advocate for AI and
          machine learning at AWS, and Barth's author page there later gives the title Principal Developer
          Advocate for generative AI. On the AWS News Blog, Barth wrote launch posts such as the
          December 2024 introductions of the next generation of Amazon SageMaker and of multi-agent collaboration
          in Amazon Bedrock.
        source_ids: [pds-post, aws-author, aws-news-author, sagemaker-post, bedrock-multiagent-post]
      - text: >-
          Barth is now a Member of Technical Staff at Amazon AGI, where Barth's site says the role covers product
          adoption strategy for next-generation AI, working with research, product, engineering and go-to-market
          teams.
        source_ids: [antje-site, antje-github]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Barth co-wrote two O'Reilly books. Data Science on AWS covers end-to-end machine learning pipelines with
          SageMaker, TensorFlow and BERT, and Generative AI on AWS, written with Chris Fregly and Shelbee
          Eigenbrode, covers building multimodal applications with foundation models, fine-tuning methods such as
          RLHF and PEFT, and Amazon Bedrock. Both books have public companion code repositories.
        source_ids: [antje-site, genai-repo]
      - text: >-
          With DeepLearning.AI, Barth managed development of and co-taught the course Generative AI with Large
          Language Models, alongside Chris Fregly, Shelbee Eigenbrode and Mike Chambers. The course covers the
          generative AI lifecycle from data and model selection through evaluation and deployment.
        source_ids: [antje-site, dlai-course]
  - heading: Talks
    paragraphs:
      - text: >-
          Barth has given keynotes at the AI Engineer World's Fair, on moving from software
          developer to AI engineer (June 2024), on building agents at cloud scale (June 2025) and on perception
          agents from the Amazon AGI Lab (June 2026), and spoke on scaling the Model Context Protocol at the MCP
          Developer Summit in May 2025.
        source_ids: [antje-site]
