headline: Member of Technical Staff at Amazon AGI; co-author of Generative AI on AWS and Data Science on AWS
bio:
  text: >-
    Antje Barth is a Member of Technical Staff for AI product and developer experience at Amazon
    AGI, according to Barth's GitHub profile. Barth was previously Principal Developer Advocate for generative AI at AWS and is a
    co-author of the O'Reilly books Generative AI on AWS and Data Science on AWS. The companion
    repository for Generative AI on AWS, written with Chris Fregly and Shelbee Eigenbrode, is
    published under the MIT-0 license and covers prompt engineering, fine-tuning, quantization,
    RLHF, retrieval-augmented generation, agents and multimodal models.
  source_ids: [antje-github, aws-author, genai-repo]
  reviewed_at: 2026-10-13
