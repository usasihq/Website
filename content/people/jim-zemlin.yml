headline: CEO of the Linux Foundation, home of projects including Linux, Kubernetes, PyTorch and MCP
bio:
  text: >-
    Jim Zemlin is the CEO of the Linux Foundation, an organization for open-source software,
    standards and collaborative innovation that hosts projects including Linux, Kubernetes, PyTorch, the Model Context Protocol
    (MCP) and RISC-V. As the Foundation's executive director, Zemlin was quoted in the 2022 announcement
    that PyTorch would move to the newly formed PyTorch Foundation and in the 2025 announcements of the
    Agent2Agent protocol project and the Agentic AI Foundation.
  source_ids: [lf-leadership, lf-pytorch, lf-a2a, lf-aaif]
  reviewed_at: 2026-10-22
