sections:
  - heading: Linux Foundation
    paragraphs:
      - text: >-
          The Linux Foundation's leadership page lists Zemlin as CEO and describes work with technology
          companies including Microsoft, OpenAI, Anthropic, Google, IBM and NVIDIA on artificial
          intelligence, cloud computing and digital infrastructure. The page names Linux, Kubernetes,
          PyTorch, MCP and RISC-V among the projects the Foundation hosts.
        source_ids: [lf-leadership]
  - heading: AI projects
    paragraphs:
      - text: >-
          In September 2022 the Linux Foundation announced that PyTorch would move from Meta to the newly
          formed PyTorch Foundation, quoting Zemlin as executive director. In June 2025 the Foundation
          launched the Agent2Agent protocol project, which Google created, again with a statement from
          Zemlin.
        source_ids: [lf-pytorch, lf-a2a]
      - text: >-
          In December 2025 the Linux Foundation formed the Agentic AI Foundation around contributions of
          MCP, goose and AGENTS.md. Zemlin's statement in the announcement framed open governance as a
          source of transparency and stability for agent projects.
        source_ids: [lf-aaif]
