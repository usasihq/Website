sections:
  - heading: Research
    paragraphs:
      - text: >-
          Esser's early papers, with Björn Ommer and colleagues, include work on conditional image generation,
          such as "A Variational U-Net for Conditional Appearance and
          Shape Generation" (2018) as first author. With Robin Rombach, Esser then introduced VQGAN in "Taming
          Transformers for High-Resolution Image Synthesis" (CVPR 2021), which pairs a convolutional
          codebook with a Transformer to generate high-resolution images.
        source_ids: [vunet-paper, taming-paper, taming-readme]
      - text: >-
          Esser co-authored the latent diffusion paper (CVPR 2022), which runs diffusion in the latent space of
          a pretrained autoencoder, and was first author of "Structure and Content-Guided Video Synthesis with
          Diffusion Models" (2023). In 2024 Esser was first author of the rectified flow transformer scaling
          paper and co-authored latent adversarial diffusion distillation for fast image synthesis.
        source_ids: [ldm-paper, ldm-cvpr, gen1-paper, rf-paper, ladd-paper]
  - heading: Later work
    paragraphs:
      - text: >-
          Esser is listed among the authors of Black Forest Labs' 2025 FLUX.1 Kontext paper on flow matching for
          in-context image generation and editing, and co-authored "Self-Supervised Flow Matching for Scalable
          Multi-Modal Synthesis" (2026) with Robin Rombach and others. Code for Taming Transformers and latent
          diffusion is published in the CompVis GitHub organization under MIT-style licenses.
        source_ids: [kontext-paper, ssfm-paper, taming-license, ldm-repo]
