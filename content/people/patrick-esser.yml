headline: Co-first author of Taming Transformers (VQGAN) and co-author of Latent Diffusion Models
bio:
  text: >-
    Patrick Esser is co-first author, with Robin Rombach, of "Taming Transformers for High-Resolution
    Image Synthesis" (CVPR 2021), whose code Esser, Rombach, and Björn Ommer released under an MIT-style
    license. Esser is a co-author of "High-Resolution Image Synthesis with Latent Diffusion Models"
    (CVPR 2022), on which Esser is listed with Runway ML, and the latent-diffusion code is MIT-licensed.
    Esser is also first author of "Scaling Rectified Flow Transformers for High-Resolution Image
    Synthesis" (2024).
  source_ids: [taming-paper, taming-readme, taming-license, ldm-cvpr, ldm-paper, ldm-repo, rf-paper]
  reviewed_at: 2026-10-21
