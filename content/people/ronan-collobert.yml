sections:
  - heading: Research
    paragraphs:
      - text: >-
          Collobert's research covers machine learning on structured data such as language, images and speech,
          with interests in semi-supervised, weakly supervised and structured learning and in large-scale
          learning. With Jason Weston, Collobert wrote "A Unified Architecture for Natural Language Processing"
          (ICML 2008), which trained one deep network on several language tasks at once and received ICML's Test
          of Time Award in 2018, and the follow-up "Natural Language Processing (Almost) from Scratch" (2011).
        source_ids: [collobert-site, icml-2018-awards]
      - text: >-
          Collobert later worked on computer vision and speech. "Recurrent Convolutional Neural Networks for
          Scene Labeling" (ICML 2014), with Pedro Pinheiro, applied recurrent convolutional networks to image
          labeling, and Wav2Letter (2016) proposed an end-to-end speech recognizer built from convolutional
          networks. Speech papers that followed include wav2letter++ (2019), a massively multilingual speech
          recognition model covering 50 languages (2020), and work on semi-supervised pseudo-labeling such as
          slimIPL (2021).
        source_ids: [collobert-site, wav2letter-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Collobert's homepage describes a long line of machine learning software, beginning with SVMTorch, a
          support vector machine library written during doctoral work, and the Torch library through versions
          3, 4, 5 and Torch7, which pairs the Lua scripting language with a C implementation under a BSD
          license. Collobert also released SENNA, a fast natural language tagger for part-of-speech tagging,
          chunking, named entity recognition and semantic role labeling, and co-wrote Torchnet (2016).
        source_ids: [collobert-site]
      - text: >-
          More recent software includes wav2letter, a C++ toolbox for end-to-end speech recognition, and
          flashlight, a modern C++ machine learning framework into which wav2letter has been folded. Collobert is
          last author of the 2022 Flashlight paper; flashlight is published under the MIT license, and the wav2letter README describes wav2letter++ as MIT-licensed.
        source_ids: [collobert-site, flashlight-paper, flashlight-repo, wav2letter-repo]
