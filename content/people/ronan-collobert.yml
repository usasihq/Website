headline: Research scientist in Apple Machine Learning Research; developer of Torch, wav2letter, and flashlight
bio:
  text: >-
    Ronan Collobert is a research scientist in Apple's Machine Learning Research group and was
    previously a research scientist at Facebook AI Research, the Idiap Research Institute, and NEC
    Laboratories of America. Collobert's homepage lists a line of machine learning software: Torch,
    whose Torch7 release is distributed under a BSD license; SENNA, a natural language processing
    tagger; wav2letter, a toolbox for end-to-end speech recognition; and flashlight, a C++ machine
    learning framework that wav2letter is now part of. Collobert is first author of the Wav2Letter
    paper and last author of the Flashlight paper.
  source_ids: [collobert-site, github-profile, wav2letter-paper, flashlight-paper]
  reviewed_at: 2026-10-21
