sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kurian spent 22 years at Oracle, most recently as President of Product Development. In November 2018,
          Google Cloud announced that Kurian would join the company that month and take over leadership of
          Google Cloud in early 2019, and Kurian has led Google Cloud as its CEO since.
        source_ids: [kurian-2018, gemini-at-work-2026]
  - heading: Products and announcements
    paragraphs:
      - text: >-
          Kurian wrote the opening posts for Google Cloud Next '24 and Next '26. The Next '24 post announced
          the general availability of TPU v5p and Google Axion, the company's first custom Arm-based CPU
          designed for the data centre, along with a public preview of Gemini 1.5 Pro.
        source_ids: [next24-post]
      - text: >-
          Kurian introduced Gemini Enterprise in October 2025. At Next '26 in April 2026, Kurian's keynote framed
          the event around the "Agentic Enterprise", announcing the Gemini Enterprise Agent Platform for building
          and governing agents, eighth-generation TPUs, an Agentic Data Cloud and security products combining
          Google Threat Intelligence with Wiz's platform. At Gemini at Work 2026 in October, Kurian announced the
          Gemini agent, a single agent for work inside Workspace apps.
        source_ids: [gemini-enterprise, next26-post, gemini-at-work-2026]
