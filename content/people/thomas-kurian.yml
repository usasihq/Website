headline: CEO of Google Cloud, which offers Gemini Enterprise and Google's agent platform to businesses
bio:
  text: >-
    Thomas Kurian is CEO of Google Cloud. Google Cloud announced in November 2018 that Kurian would join on
    November 26 and take over the Google Cloud leadership role in early 2019, after 22 years at Oracle, most
    recently as President of Product Development. Kurian introduced Gemini Enterprise in an October 2025
    Google Cloud post, and an October 2026 post adapted from Kurian's keynote at Gemini at Work 2026 announced
    the Gemini agent, described as a single, universal agent for work.
  source_ids: [kurian-2018, gemini-enterprise, gemini-at-work-2026]
