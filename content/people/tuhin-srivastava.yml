sections:
  - heading: Baseten
    paragraphs:
      - text: >-
          Baseten's author page lists Srivastava as CEO and co-founder. The company's platform covers
          dedicated inference, model APIs and training, across transcription, image generation,
          text-to-speech, embeddings and large language models.
        source_ids: [baseten-author, baseten-home]
      - text: >-
          In August 2025 Srivastava announced that Dannie Herzberg had joined as President to lead
          go-to-market and operations. In September 2026 Srivastava co-authored, with Amir Haghighat and
          Paul Sinai, the post announcing that Blaxel, a maker of sandboxes and execution infrastructure for
          AI agents, was joining Baseten.
        source_ids: [baseten-herzberg, baseten-blaxel]
