headline: CEO and co-founder of Baseten, an inference platform for deploying and serving AI models
bio:
  text: >-
    Tuhin Srivastava is the CEO and a co-founder of Baseten, which offers an inference platform, model
    APIs and training for running AI models in production. Srivastava is the author of several of Baseten's company
    announcements, including posts on new leadership hires and on Blaxel joining Baseten.
  source_ids: [baseten-author, baseten-home, baseten-blaxel]
  reviewed_at: 2026-10-21
