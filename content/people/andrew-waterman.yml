sections:
  - heading: Research
    paragraphs:
      - text: >-
          Waterman's doctoral work at UC Berkeley, advised by David A. Patterson and Krste Asanović,
          centered on the instruction set architecture as the hardware-software interface. The 2016
          dissertation argues that a free and open ISA standard could increase innovation in
          microprocessor design, lower system costs and ease the move to more specialized computing
          devices.
        source_ids: [waterman-thesis]
      - text: >-
          Waterman is first author of the 2011 report "The RISC-V Instruction Set Manual, Volume I:
          Base User-Level ISA", written with Yunsup Lee, Patterson and Asanović. Waterman is also a
          co-author of the 2016 Rocket Chip Generator report, which describes Berkeley's generator
          for RISC-V processor systems.
        source_ids: [riscv-manual-2011, rocket-chip-report]
  - heading: SiFive
    paragraphs:
      - text: >-
          SiFive was founded in 2015 by the creators of RISC-V, and its leadership page lists
          Waterman as Co-Founder and Chief Engineer alongside Asanović as Chief Architect and Lee as
          Chief Technology Officer. SiFive develops RISC-V processor core IP, with product lines
          that include its Essential, Intelligence and Performance families.
        source_ids: [sifive-riscv-history, sifive-about]
