headline: Co-founder and Chief Engineer of SiFive; co-creator of the RISC-V instruction set architecture
bio:
  text: >-
    Andrew Waterman is a co-founder and the Chief Engineer of SiFive, the RISC-V processor IP company.
    SiFive credits its founders, Waterman, Krste Asanović and Yunsup Lee, working with David
    Patterson, with creating RISC-V at UC Berkeley starting in 2010. Waterman is first author of the
    2011 RISC-V Instruction Set Manual technical report and wrote the 2016 Berkeley dissertation
    "Design of the RISC-V Instruction Set Architecture".
  source_ids: [sifive-about, sifive-riscv-history, riscv-manual-2011, waterman-thesis]
  reviewed_at: 2026-10-21
