headline: Co-founder and CEO of Imbue, which builds open tools for running and verifying AI coding agents
bio:
  text: >-
    Kanjun Qiu is a co-founder and the CEO of Imbue, a company founded in 2021 that builds open
    software for AI agents people can understand, modify and verify, including the Sculptor, Vet
    and mngr tools for coding agents. Qiu earlier co-founded and led Sourceress, an AI recruiting
    company, and was Chief of Staff at Dropbox.
  source_ids: [imbue-about, kanjun-site]
  reviewed_at: 2026-10-21
