headline: Block Head, Chairman and co-founder of Block, the company behind Square and Cash App
bio:
  text: >-
    Jack Dorsey is Block Head, Chairman and co-founder of Block, the company behind Square and Cash App.
    A May 2026 Block post describing Dorsey as co-founder and CEO summarizes Dorsey's
    account of Block becoming an "intelligence company", with smaller teams, a flatter organization and a
    more AI-native way of building products.
