headline: Co-CEO and co-founder of Morningside AI; YouTube creator on AI automation and AI businesses
bio:
  text: >-
    Liam Ottley is Co-CEO and Co-Founder of Morningside AI, a company that identifies AI opportunities
    for organisations, builds the solutions, and trains teams to use them. On the Liam Ottley YouTube
    channel, Liam shares lessons from running an AI automation agency and AI software businesses, and
    the channel states that Liam created the AI Automation Agency (AAA) model in 2023. Liam also writes
    an AI-for-business newsletter, liam's levers, linked from the official links page.
  source_ids: [morningside-team, morningside, channel, site]
  reviewed_at: 2026-10-17
