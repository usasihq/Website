sections:
  - heading: Career
    paragraphs:
      - text: >-
          Liam Ottley co-founded Morningside AI with Josh Brown, and the two serve as Co-CEOs. According
          to the company's team page, Morningside began in late 2022 as a small studio and now works as
          an AI transformation partner that identifies AI opportunities for organisations, builds the
          solutions and trains teams to use them; Ottley shapes many of the ideas and frameworks the
          team applies.
        source_ids: [morningside-team, morningside]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          On the Liam Ottley YouTube channel, Ottley shares lessons from running an AI automation agency
          and AI software businesses. The channel states that Ottley created the AI Automation Agency
          (AAA) model in 2023, based on experience at Morningside AI.
        source_ids: [channel]
      - text: >-
          Ottley's official links page describes Ottley as an AI operator, builder and creator, and
          links to liam's levers, an AI-for-business newsletter, and to AI Makeover, a filmed project in
          which a team led by Ottley reworks a company with AI over seven days.
        source_ids: [site, ai-makeover]
