sections:
  - heading: Career
    paragraphs:
      - text: >-
          Vogels was a distributed systems researcher at Cornell University before joining Amazon in 2004. Vogels's official biography also mentions technology
          leadership roles at companies that moved academic technology into industry. As Chief Technology
          Officer of Amazon.com, Vogels is responsible for the company's customer-centric technology vision and
          is described as one of the forces behind Amazon's approach to cloud computing.
        source_ids: [atd-about]
      - text: >-
          Vogels co-authored the 2007 paper on Dynamo, a key-value store designed to keep Amazon
          services available during failures by trading off consistency, using object versioning and
          application-assisted conflict resolution.
        source_ids: [dynamo-paper]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Vogels writes All Things Distributed, a blog about building scalable and robust distributed systems.
          Posts include the original PR/FAQ for AWS Lambda, published for Lambda's tenth anniversary in November
          2024, essays on Amazon S3, Aurora DSQL, DuckDB and control-plane design, and annual technology
          predictions such as those for 2026 published in November 2025.
        source_ids: [atd-home, lambda-prfaq-post, aa-predictions-2025]
      - text: >-
          Vogels hosts Now Go Build, a video series visiting startups that work on hard human problems, which in
          2025 shifted to the Now Go Build CTO Fellows, technology leaders from social impact organizations;
          a second fellowship season followed in 2026. Vogels also introduced the Frugal Architect, a set of
          laws for cost-aware system design.
        source_ids: [now-go-build, cto-fellows-post, atd-home, frugal-architect]
