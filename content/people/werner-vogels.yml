headline: Chief Technology Officer of Amazon.com; co-author of the 2007 Dynamo paper
bio:
  text: >-
    Werner Vogels is the Chief Technology Officer of Amazon.com. Vogels joined Amazon in 2004 from
    Cornell University, where Vogels was a distributed systems researcher, and has written many
    articles on distributed systems technologies for enterprise computing. Vogels is a co-author of
    the 2007 paper on Dynamo, the highly available key-value store used by some of
    Amazon's core services, and writes the All Things Distributed blog on building scalable and
    robust distributed systems, with posts through September 2026.
  source_ids: [atd-about, atd-home, aa-predictions-2025, dynamo-paper]
  reviewed_at: 2026-10-21
