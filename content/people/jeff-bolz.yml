    contribution: >-
      Contact and first-listed contributor for the Vulkan extension that added cooperative matrix
      types to SPIR-V, and author of NVIDIA's 2019 blog post introducing it for machine learning.
    source_ids: [vk-coopmat, nv-blog-coopmat]
  - name: VK_NV_cooperative_vector
    artifact_slug: null
    type: open-research
    url: https://docs.vulkan.org/refpages/latest/refpages/source/VK_NV_cooperative_vector.html
    contribution: >-
      Contact and listed contributor for the Vulkan extension that adds cooperative vector types to
      SPIR-V.
    source_ids: [vk-coopvec]
