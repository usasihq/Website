headline: NVIDIA Distinguished Engineer and member of llama.cpp's Vulkan backend code-owner team
bio:
  text: >-
    Jeff Bolz is a Distinguished Engineer at NVIDIA; NVIDIA's developer blog describes Bolz as a
    contributor to Vulkan who designs API abstractions and shading language programming models. The
    Vulkan registry lists Bolz as the contact for the VK_NV_cooperative_matrix2 extension, which
    builds on cooperative matrix types to accelerate work beyond simple matrix-multiply kernels. In
    llama.cpp, the C/C++ runtime for running language models on local hardware, CODEOWNERS lists
    Bolz in the team that owns the Vulkan backend. Bolz's 2026 commits there optimize the backend's
    matrix multiplication, FlashAttention, and operator fusion, and add support for more operators
    and quantized formats.
  source_ids: [nvidia-author-page, github-profile, vk-coopmat2, llama-cpp-codeowners, llama-cpp-commits]
  reviewed_at: 2026-10-21
