work:
  - name: llama.cpp Vulkan backend
    artifact_slug: llama-cpp
    type: open-source
    url: https://github.com/ggml-org/llama.cpp
    contribution: >-
      CODEOWNERS lists Bolz in the ggml-org/ggml-vulkan team that owns the Vulkan backend. Commits
      authored in 2026 cover matrix multiplication and FlashAttention (including cooperative-matrix
      paths), topk_moe and rms_norm fusion, new operators such as CONV_3D, and quantized formats
      including Q2_0, MXFP4 and NVFP4. The repository is MIT-licensed.
    source_ids: [llama-cpp-codeowners, llama-cpp-commits, llama-cpp-license]
