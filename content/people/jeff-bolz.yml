sections:
  - heading: Vulkan and shading languages
    paragraphs:
      - text: >-
          NVIDIA's technical blog describes Jeff Bolz as a Distinguished Engineer who designs Vulkan
          API abstractions and shading language programming models for new hardware. The Vulkan
          registry lists Bolz as the contact for VK_EXT_descriptor_indexing, last modified in 2017, and
          for VK_KHR_buffer_device_address, last modified in 2019, which lets applications query 64-bit
          buffer device addresses.
        source_ids: [nvidia-author-page, vk-descidx, vk-bda]
      - text: >-
          Bolz is the contact and first-listed contributor for VK_NV_cooperative_matrix (last modified
          in 2019), which adds cooperative matrix types to SPIR-V, and wrote NVIDIA's April 2019 blog post on machine
          learning acceleration in Vulkan with cooperative matrices. The cross-vendor
          VK_KHR_cooperative_matrix extension (last modified in 2023) lists Bolz among its contributors.
        source_ids: [vk-coopmat, nv-blog-coopmat, vk-khr-coopmat]
      - text: >-
          Bolz is also the contact for two NVIDIA extensions last modified in 2024. VK_NV_cooperative_vector adds
          cooperative vector types, and VK_NV_cooperative_matrix2 builds on cooperative matrices with
          type conversions, reductions, per-element operations and tensor addressing.
        source_ids: [vk-coopvec, vk-coopmat2]
  - heading: Open-source work
    paragraphs:
      - text: >-
          The llama.cpp commit history attributes Vulkan backend commits to Bolz. A pull request Bolz opened in November 2024 and that was merged in December 2024 added
          VK_NV_cooperative_matrix2 support for matrix multiplication and FlashAttention2, so these
          operations can use tensor cores through NVIDIA drivers.
        source_ids: [llama-cpp-commits, llama-cpp-pr-10206]
      - text: >-
          CODEOWNERS lists Bolz, with one other maintainer, in the ggml-org/ggml-vulkan team that owns
          the backend's source directory. Commits from October 2026 extend sparse FlashAttention support
          to the coopmat2 path, handle mul_mat_id duplicates in the prepass, and optimize pool_2d for
          large pooling windows.
        source_ids: [llama-cpp-codeowners, llama-cpp-commits]
