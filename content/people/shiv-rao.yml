sections:
  - heading: Career
    paragraphs:
      - text: >-
          Rao is a cardiologist who co-founded Abridge in 2018 and leads it as CEO. Abridge's about
          page quotes Rao describing the company as a way to advocate for patients at scale, as Rao
          does in a weekly clinic.
        source_ids: [abridge-about, ab-va]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Abridge's platform works inside electronic health record workflows to support clinicians
          before, during and after patient conversations. In August 2026 the company let partner
          health systems extend its clinical intelligence agent to every clinician, including
          through a new mobile and web experience connected to the patient's chart.
        source_ids: [ab-va, ab-context-aware]
      - text: >-
          In September 2026 Abridge added a pre-bill review capability that compares coded
          diagnoses on inpatient claims with the clinical record, and it was selected to provide
          ambient AI under the U.S. Department of Veterans Affairs enterprise contract.
        source_ids: [ab-prebill, ab-va]
