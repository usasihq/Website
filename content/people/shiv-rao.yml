headline: Co-founder and CEO of Abridge, which drafts clinical documentation from clinician-patient conversations
bio:
  text: >-
    Shiv Rao, MD, is a co-founder and the CEO of Abridge, a company founded in 2018 that builds AI
    software for health systems, turning conversations between clinicians and patients into draft
    clinical documentation and clinical insights. Rao is also a practicing cardiologist.
  source_ids: [abridge-about, ab-context-aware, ab-va]
  reviewed_at: 2026-10-21
