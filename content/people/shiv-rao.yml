  - name: Abridge clinician intelligence platform
    artifact_slug: null
    url: https://www.abridge.com/about
    contribution: >-
      Leads the company whose platform drafts clinical documentation from conversations and, in
      2026, extended to a context-aware clinical intelligence agent and pre-bill review for coding
      and documentation integrity teams.
    source_ids: [abridge-about, ab-context-aware, ab-prebill]
links:
  - label: Abridge
