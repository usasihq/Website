sections:
  - heading: Research
    paragraphs:
      - text: >-
          Bubeck's early work was in learning theory and optimization. With Nicolò Cesa-Bianchi, Bubeck wrote
          "Regret Analysis of Stochastic and Nonstochastic Multi-armed Bandit Problems" (2012), a survey of
          bandit algorithms, and as sole author wrote "Convex Optimization: Algorithms and Complexity" (2014), a
          monograph on optimization methods and their complexity. "A Universal Law of Robustness via
          Isoperimetry" (2021), with Mark Sellke, offered a theoretical account of why deep networks need many
          more parameters than required to fit data smoothly, and received a NeurIPS 2021 Outstanding Paper Award.
        source_ids: [bandits-survey, convex-optimization-monograph, robustness-law-paper, neurips-2021-awards]
      - text: >-
          Bubeck's later work turned to large language models. In 2023 Bubeck was first author of "Sparks of
          Artificial General Intelligence", a study of an early version of GPT-4, and co-authored the "Textbooks
          Are All You Need" reports on phi-1 and phi-1.5 and the later Phi-3 and Phi-4 reports on Microsoft's
          small Phi models, which emphasize training on carefully selected web data and synthetic data.
        source_ids: [sparks-paper, phi15-paper, phi1-paper, phi3-paper, phi4-paper]
  - heading: Career
    paragraphs:
      - text: >-
          As a vice president in Microsoft GenAI, Bubeck co-authored the technical reports for phi-1, phi-1.5,
          Phi-3 and Phi-4 and contributed to Phi-2. With an OpenAI affiliation, Bubeck is among the authors of
          the 2025 model card for the open-weight gpt-oss models and first author of "Early science acceleration
          experiments with GPT-5" (2025), a collection of case studies in which GPT-5 contributed to research in
          mathematics, physics, astronomy, computer science, biology and materials science.
        source_ids: [phi2-blog, phi4-paper, gptoss-card-paper, gpt5-science-paper]
