headline: OpenAI author on gpt-oss and GPT-5 science work; earlier a Microsoft GenAI vice president and Phi co-author
bio:
  text: >-
    Sébastien Bubeck is first author of "Early science acceleration experiments with GPT-5" (2025),
    written with an OpenAI affiliation, and is among the authors of the 2025 model card for OpenAI's
    open-weight gpt-oss models. Earlier, as a vice president in Microsoft GenAI, Bubeck co-authored the
    technical reports for phi-1, phi-1.5, Phi-3, and Phi-4, Microsoft's small language models, and was a
    listed contributor to Phi-2; the Phi-4 model card on Hugging Face lists the MIT license. Bubeck was
    also first author of the 2023 "Sparks of Artificial General Intelligence" study of an early version
    of GPT-4.
  source_ids: [gpt5-science-paper, gptoss-card-paper, phi2-blog, phi1-paper, phi15-paper, phi3-paper, phi4-paper, phi4-card, sparks-paper]
  reviewed_at: 2026-10-13
