      and a listed contributor and author of the Microsoft Research blog post announcing Phi-2. The
      Phi-3 report describes phi-3-mini as small enough to be deployed on a phone, and the Phi-4 model
      card on Hugging Face lists the MIT license.
    source_ids: [phi1-paper, phi15-paper, phi3-paper, phi4-paper, phi2-blog, phi4-card]
