headline: NVIDIA applied research scientist; last-listed author on Parakeet speech recognition papers
bio:
  text: >-
    Boris Ginsburg is an applied research scientist at NVIDIA whose work spans fast, scalable training
    algorithms for neural networks and speech recognition. Ginsburg is the last-listed author of the
    papers behind NVIDIA's Parakeet models, including the Token-and-Duration Transducer, the FastConformer
    encoder, the Parakeet-TDT-0.6B-v3 technical report and the unified streaming transducer used by
    parakeet-unified-en-0.6b.
  source_ids: [nvidia-author-page, tdt-paper, fastconformer-paper, parakeet-v3-paper, unified-paper]
  reviewed_at: 2026-10-22
