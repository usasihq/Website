links:
  - label: NVIDIA blog author page
    url: https://developer.nvidia.com/blog/author/bginsburg/
sections:
  - heading: Training at scale
    paragraphs:
      - text: >-
          NVIDIA's author page describes Ginsburg as an applied research scientist whose primary research
          is fast and scalable algorithms for training neural networks. Ginsburg co-authored "Large Batch
          Training of Convolutional Networks" (2017), which introduced layer-wise adaptive rate scaling, and
          "Mixed Precision Training" (2017).
        source_ids: [nvidia-author-page, lars-paper, mixed-precision-paper]
      - text: >-
          Ginsburg's NVIDIA technical blog posts cover mixed precision training for NLP and speech with
          OpenSeq2Seq (2018), pretraining BERT with layer-wise adaptive learning rates (2019), and building
          smaller speech recognition models with NVIDIA NeMo (2019).
        source_ids: [nvidia-author-page]
  - heading: Speech recognition
    paragraphs:
      - text: >-
          Ginsburg co-authored the Jasper (2019) and QuartzNet (2019) convolutional acoustic models and the
          2019 paper introducing NeMo, a toolkit for building AI applications from reusable neural modules
          with collections for speech recognition and language processing.
        source_ids: [jasper-paper, quartznet-paper, nemo-paper]
      - text: >-
          Ginsburg is the last-listed author of "Efficient Sequence Transduction by Jointly Predicting Tokens
          and Durations" (2023) and "Fast Conformer with Linearly Scalable Attention" (2023), both cited by
          the Parakeet-TDT-0.6B-v3 model card, of the 2025 Canary-1B-v2 and Parakeet-TDT-0.6B-v3 technical
          report, and of the 2026 unified offline-streaming transducer paper cited by the
          parakeet-unified-en-0.6b model card.
        source_ids: [tdt-paper, fastconformer-paper, parakeet-v3-paper, unified-paper, parakeet-v3-card, unified-card]
