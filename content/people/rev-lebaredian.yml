headline: NVIDIA vice president of physical AI simulation, heading the Omniverse product, engineering and research teams
bio:
  text: >-
    Rev Lebaredian is vice president of physical AI simulation at NVIDIA, where Lebaredian leads
    the product, engineering and research teams of NVIDIA Omniverse, a software platform for
    building physical AI and robotic system simulation applications. Lebaredian joined NVIDIA in
    2002 after rendering work at Warner Brothers Digital and Disney's Dream Quest Images and after
    launching the venture Steamboat Software. An earlier NVIDIA profile describes Lebaredian as
    Senior Director of Engineering in the Content & Technology organization, responsible for
    developing NVIDIA's GameWorks real-time effects modules and the PhysX physics middleware for
    games. Lebaredian is listed as a GTC Berlin 2026 speaker on open models and physical AI.
  source_ids: [nvidia-blog-author, nvidia-blog-author-earlier, gtc-berlin-2026]
