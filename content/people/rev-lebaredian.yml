sections:
  - heading: Career
    paragraphs:
      - text: >-
          Rev Lebaredian worked in computer graphics at Warner Brothers Digital and Disney's Dream Quest Images and
          then launched Steamboat Software before joining NVIDIA in 2002. At NVIDIA, Lebaredian led the development
          of real-time, multi-GPU rendering, physics simulation and AI platforms, and as Senior Director of
          Engineering in the Content and Technology organization was responsible for the GameWorks effects modules
          and the PhysX physics middleware for games.
        source_ids: [nvidia-blog-author, nvidia-blog-author-earlier]
      - text: >-
          Lebaredian is now vice president of physical AI simulation and leads the product, engineering and
          research teams of NVIDIA Omniverse, a platform for building physical AI and robotics simulation
          applications.
        source_ids: [nvidia-blog-author]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Lebaredian's NVIDIA blog posts cover Omniverse and its industrial uses. They include a November 2021
          post on new development paths for Omniverse developers, a June 2022 post on NVIDIA joining the Metaverse
          Standards Forum, and a series on the Siemens partnership covering digital twins, synthetic data generation
          with Omniverse Replicator on AWS, and immersive visualization for industrial design.
        source_ids: [nvidia-blog-author]
      - text: >-
          In August 2026 Lebaredian wrote about the launch of a Firebird AI factory, and at GTC Berlin in October
          2026 Lebaredian was scheduled to speak on open models and physical AI for Europe's autonomous systems.
        source_ids: [nvidia-blog-author, gtc-berlin-2026]
