headline: Georgia Tech machine learning PhD student and lead author of the open-source Transformer Explainer
bio:
  text: >-
    Aeree Cho is a machine learning PhD student at Georgia Tech, advised by Polo Chau in the Polo Club of
    Data Science. Cho is first author of Transformer Explainer, an interactive, open-source visualization for
    learning how text-generative transformer models work, presented at IEEE VIS 2024 and ACM CHI 2026.
  source_ids: [chau-cv, te-paper, te-readme]
  reviewed_at: 2026-10-22
