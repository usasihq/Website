sections:
  - heading: Research
    paragraphs:
      - text: >-
          Cho joined the Polo Club of Data Science at Georgia Tech as a computer science master's student
          researcher in spring 2024 and began a machine learning PhD there in fall 2024, advised by Polo Chau.
        source_ids: [chau-cv]
      - text: >-
          Cho is first author of Transformer Explainer, which lets learners run a GPT-2 model in the browser
          and explore how a transformer generates text. The tool was presented as an IEEE VIS 2024 poster and
          as a paper at ACM CHI 2026. Cho is also a co-author of a 2025 EMNLP survey on interpretation methods
          for improving the safety of large language models.
        source_ids: [te-paper, te-readme, chau-cv]
