headline: Co-founder of EleutherAI and Conjecture; co-author of The Pile and the GPT-NeoX-20B paper
bio:
  text: >-
    Connor Leahy co-founded EleutherAI in 2020 with Sid Black and, in March 2022, co-founded
    Conjecture, a company working on AI safety and controllable AI systems, according to
    Conjecture's own history page. Leahy is a co-author of The Pile, EleutherAI's 825 GiB English
    text corpus for training language models, and of the GPT-NeoX-20B paper, where Leahy is
    credited on the section about alignment implications. Leahy is also listed among the authors in
    the citation entry for the GPT-NeoX training library.
  source_ids: [conjecture-about, pile-paper, neox20b-pdf, neox-readme]
  reviewed_at: 2026-10-21
