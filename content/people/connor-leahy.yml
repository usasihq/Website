sections:
  - heading: EleutherAI
    paragraphs:
      - text: >-
          Leahy co-founded EleutherAI with Sid Black in 2020, according to Conjecture's company history,
          which describes EleutherAI as an open-source language-model community that developed GPT-J
          and GPT-NeoX. Leahy is one of the authors of The Pile, a paper posted on 2020-12-31 that
          describes an English text corpus constructed from 22 subsets for training language
          models.
        source_ids: [conjecture-about, pile-paper]
      - text: >-
          Leahy is listed with Sid Black, Leo Gao, Phil Wang and Stella Biderman in the citation entry
          for GPT-Neo, a March 2021 software release for training GPT-style models on TPUs with
          mesh-tensorflow; the repository has since been archived in favour of GPT-NeoX. Leahy is also
          a co-author of the GPT-NeoX-20B paper (April 2022), whose individual-contributions appendix
          lists Leahy among the contributors to its "Alignment Implications" section.
        source_ids: [gpt-neo-readme, neox20b-pdf, neox-readme]
  - heading: Conjecture
    paragraphs:
      - text: >-
          In March 2022 Leahy, Sid Black and Gabriel Alfour founded Conjecture, which the company says
          grew out of EleutherAI and was set up to work on the control problem of advanced AI. The
          company's announcement post of 2022-04-08 introduced it as an alignment research startup
          founded by the three.
        source_ids: [conjecture-about, conjecture-launch]
      - text: >-
          Conjecture describes its current work as building language models and an approach it calls
          Cognitive Emulation, aimed at AI systems that are scalable, auditable and controllable. On
          2024-12-02 Leahy and Gabe Alfour published "Conjecture: A Roadmap for Cognitive Software and A
          Humanist Future of AI", setting out the company's plans for 2025 and beyond.
        source_ids: [conjecture-about, conjecture-roadmap]
