sections:
  - heading: Career
    paragraphs:
      - text: >-
          After a postdoctoral position at the University of Toronto, LeCun
          joined AT&T Bell Laboratories in 1988, became head of the Image Processing Research Department at AT&T
          Labs-Research in 1996, and was briefly a fellow of the NEC Research Institute before joining NYU in
          2003.
        source_ids: [lecun-bio]
      - text: >-
          LeCun was the founding director of the NYU Center for Data Science until 2014. In late 2013, LeCun
          became Director of AI Research at Facebook, founding FAIR while remaining on the NYU faculty part-time,
          and served as Meta's Chief AI Scientist from 2018 to 2025. LeCun is now Executive Chairman of AMI Labs
          and the Jacob T. Schwartz Professor at NYU's Courant Institute, and was a visiting professor at the
          Collège de France in 2016.
        source_ids: [lecun-bio]
  - heading: Research
    paragraphs:
      - text: >-
          LeCun's research spans machine learning and AI, with applications in computer vision, natural
          language understanding, robotics and computational neuroscience. LeCun is known for work in deep
          learning and for the convolutional network method, which is used for image, video and speech
          recognition.
        source_ids: [lecun-bio]
      - text: >-
          Recent co-authored work develops joint-embedding predictive architectures (JEPA), which learn by
          predicting representations of parts of the input instead of reconstructing it. I-JEPA (2023) applied the approach to images, V-JEPA
          (2024) to video, and V-JEPA 2 (2025) added an action-conditioned world model for robot planning.
        source_ids: [ijepa-paper, vjepa-paper, vjepa2-paper]
