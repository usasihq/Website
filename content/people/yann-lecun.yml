headline: Executive Chairman of AMI Labs and NYU professor; former Chief AI Scientist at Meta and co-author of V-JEPA 2
bio:
  text: >-
    Yann LeCun is the Executive Chairman of Advanced Machine Intelligence (AMI Labs) and the Jacob T.
    Schwartz Professor at New York University, affiliated with the Courant Institute. LeCun was the
    Chief AI Scientist at Meta from 2018 to 2025, the founding Director of Facebook AI Research
    (FAIR) from 2013 to 2017, and the founding Director of the NYU Center for Data Science from 2011
    to 2014, after research positions at AT&T Bell Laboratories, AT&T Labs and the NEC Research
    Institute. LeCun's bio credits LeCun with the convolutional network method, and LeCun is a
    co-author of V-JEPA 2, a self-supervised video model for understanding, prediction and robot
    planning.
  source_ids: [lecun-bio, vjepa2-paper]
  reviewed_at: 2026-10-21
