headline: OpenAI researcher; first author of GLIDE, Improved DDPM, and Point-E; co-author of the HumanEval paper
bio:
  text: >-
    Alex Nichol is a software developer and researcher who, per Nichol's homepage, works at OpenAI on
    deep learning research; Nichol's GitHub profile also lists OpenAI. Nichol is first author of
    "Improved Denoising Diffusion Probabilistic Models" and of GLIDE, and co-first author with Prafulla
    Dhariwal of "Diffusion Models Beat GANs on Image Synthesis", all released with MIT-licensed OpenAI
    codebases. Nichol is also first author of Point-E and co-author of Shap-E, two OpenAI systems for
    generating 3D content whose code and models are published under the MIT License. Nichol is among
    the authors of "Evaluating Large Language Models Trained on Code", the paper that describes the
    HumanEval problem set.
  source_ids: [nichol-site, nichol-github, iddpm-paper, glide-paper, adm-paper, improved-diffusion-repo, guided-diffusion-repo, glide-repo, pointe-paper, shape-paper, pointe-repo, shape-repo, codex-paper, humaneval-repo]
  reviewed_at: 2026-10-21
