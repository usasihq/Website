sections:
  - heading: Research
    paragraphs:
      - text: >-
          Nichol's early papers were on reinforcement learning and meta-learning. "On First-Order
          Meta-Learning Algorithms" (2018), written with Joshua Achiam and John Schulman, analyzes methods for
          learning a parameter initialization that adapts quickly to new tasks, and introduces the Reptile
          algorithm. The same year Nichol was first author of "Gotta Learn Fast", which presented a
          reinforcement learning benchmark for transfer and few-shot learning built on the Sonic the Hedgehog
          games.
        source_ids: [reptile-paper, sonic-paper]
      - text: >-
          In 2021 and 2022 Nichol published a series of papers on diffusion models for image generation. "Improved Denoising
          Diffusion Probabilistic Models", written with Prafulla Dhariwal, proposed changes that improve sample
          quality and likelihood, and "Diffusion Models Beat GANs on Image Synthesis" introduced classifier
          guidance. GLIDE then applied guided diffusion to text-conditional image generation and editing, and
          Nichol co-authored the 2022 paper on generating images from CLIP latents with Aditya Ramesh and
          colleagues.
        source_ids: [iddpm-paper, adm-paper, glide-paper, dalle2-paper]
  - heading: 3D generation and code evaluation
    paragraphs:
      - text: >-
          Point-E, posted in December 2022 with Nichol as first author, generates 3D point clouds from text
          prompts by first producing a synthetic image and then a point cloud. Shap-E, posted in May 2023,
          generates the parameters of implicit 3D functions that can be rendered as textured meshes or neural
          radiance fields. OpenAI published the code for both projects in MIT-licensed repositories.
        source_ids: [pointe-paper, pointe-repo, shape-paper, shape-repo]
      - text: >-
          Nichol is also a co-author of "Evaluating Large Language Models Trained on Code" (2021), which
          introduced the Codex models and the HumanEval set of hand-written programming problems. The HumanEval
          evaluation harness is published by OpenAI as an MIT-licensed repository.
        source_ids: [codex-paper, humaneval-repo]
