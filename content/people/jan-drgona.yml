sections:
  - heading: Career
    paragraphs:
      - text: >-
          Drgoňa worked as a postdoctoral researcher at KU Leuven from 2017 to 2019, then joined Pacific Northwest National Laboratory as a postdoctoral researcher in July 2019
          and became a data scientist there in 2020.
        source_ids: [drgona-cv]
      - text: >-
          As a Data Scientist 4 at PNNL from July 2023 to December 2024, Drgoňa led a team of research
          scientists working on differentiable programming methods for modeling and control of dynamical
          systems with energy applications. Drgoňa became an associate professor at Johns Hopkins University
          in January 2025 and holds a secondary appointment in electrical and computer engineering.
        source_ids: [drgona-cv, drgona-site]
  - heading: Research and software
    paragraphs:
      - text: >-
          Drgoňa's research centers on differentiable predictive control, introduced in a 2020 paper with
          Aaron Tuor and Draguna Vrabie, and on physics-informed machine learning for dynamical systems,
          including a 2023 survey of physics-informed machine learning for modeling and control written with
          collaborators from PNNL and other institutions.
        source_ids: [dpc-paper, piml-paper, drgona-site]
      - text: >-
          NeuroMANCER, developed at PNNL, is a PyTorch library for solving constrained optimization,
          physics-informed machine learning and optimal control problems. Its README lists Drgoňa and Aaron
          Tuor as lead developers and Draguna Vrabie and Panos Stinis as scientific advisors.
        source_ids: [neuromancer-readme, drgona-site]
