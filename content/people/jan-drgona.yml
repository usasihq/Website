headline: Johns Hopkins associate professor and lead developer of PNNL's NeuroMANCER scientific machine learning library
bio:
  text: >-
    Ján Drgoňa is an associate professor in the Department of Civil and Systems Engineering at Johns
    Hopkins University, whose work covers differentiable programming and scientific machine learning
    for dynamical systems, constrained optimization and control, with applications to sustainable
    energy systems. Drgoňa was previously a data scientist at Pacific Northwest National Laboratory
    and is a lead developer of NeuroMANCER, PNNL's open-source PyTorch library for constrained
    optimization, physics-informed machine learning and optimal control.
  source_ids: [drgona-site, drgona-cv, neuromancer-readme]
  reviewed_at: 2026-10-22
