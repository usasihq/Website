sections:
  - heading: Ping Labs
    paragraphs:
      - text: >-
          Florkowski co-founded Ping Labs, which went through Y Combinator's Winter 2022 batch. The company's
          products include T3 Chat, an AI chat app; UploadThing, file uploads for full-stack developers;
          PicThing, background removal for content creators; and Ping.gg, live collaboration for streamers and
          podcasters. Ping Labs also makes T3 Code, an open-source, MIT-licensed control plane for coding agents.
        source_ids: [yc-page, ping-home]
      - text: >-
          Y Combinator's company page lists Theo Browne as founder and CEO and Florkowski as founder and CTO.
          Earlier, Florkowski was a support engineer at Retool, and Florkowski's site lists contributions to
          projects including react.dev, AutoAnimate, Astro and UploadThing.
        source_ids: [yc-page, florkowski-site]
