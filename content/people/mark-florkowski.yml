headline: Co-founder and CTO of Ping Labs, the company behind T3 Chat, T3 Code and UploadThing
bio:
  text: >-
    Mark R. Florkowski is a co-founder and the chief technology officer of Ping Labs, which makes developer
    and AI tools including T3 Chat, T3 Code and UploadThing. Ping Labs' site credits its software to Theo,
    Mark and Julius, and Y Combinator's company page lists Florkowski as Founder and CTO. Before Ping Labs,
    Florkowski worked as a support engineer at Retool.
