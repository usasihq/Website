sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ott's homepage describes a path from Meta AI (FAIR), where Ott led large language model efforts, to
          the founding team at Character AI and then the founding team at Thinking Machines. Ott's GitHub
          profile lists Thinking Machines Lab as the current organization.
        source_ids: [homepage, github-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Ott's early papers focused on neural machine translation. "Scaling Neural
          Machine Translation" (2018) showed that reduced-precision arithmetic and large-batch training could
          cut training time on a single eight-GPU machine, and "Understanding Back-Translation at Scale" (2018)
          studied ways to generate synthetic source sentences from monolingual data.
        source_ids: [scaling-nmt-paper, back-translation-paper]
      - text: >-
          Ott later co-authored RoBERTa (2019), a replication study of BERT pretraining that measured the
          effect of hyperparameters and training-data size, and OPT (2022), a suite of decoder-only pretrained
          transformers released by Meta AI to make large language models available for study.
        source_ids: [roberta-paper, opt-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Ott is first author of the 2019 paper on fairseq, a PyTorch-based toolkit for training translation,
          summarization, and language models with distributed and mixed-precision training. In 2021 Ott was the
          first-listed author of the Meta engineering post introducing Fully Sharded Data Parallel (FSDP), which shards
          a model's parameters across data-parallel workers and can offload part of the computation to CPUs.
        source_ids: [fairseq-paper, fairseq-license, fsdp-post]
      - text: >-
          At Thinking Machines, Ott's homepage lists Tinker, a flexible API for fine-tuning language models that
          the company launched in October 2025 as a managed service handling distributed training on its
          own clusters.
        source_ids: [homepage, tinker-post]
