headline: Founding-team member at Thinking Machines Lab; first author of fairseq and co-author of OPT and RoBERTa
bio:
  text: >-
    Myle Ott is an AI researcher on the founding team at Thinking Machines, and earlier was part of the
    founding team at Character AI. Before that, Ott led large language model efforts at Meta AI (FAIR).
    Ott is first author of the 2019 paper on fairseq, an open-source sequence modeling toolkit from Facebook
    AI Research, and a co-author of RoBERTa and of OPT, Meta AI's 2022 paper on Open Pre-trained
    Transformer language models. Ott's homepage also lists FSDP (Fully Sharded Data Parallel) and Tinker,
    Thinking Machines' API for fine-tuning language models, among selected work.
  source_ids: [homepage, github-profile, fairseq-paper, opt-paper, roberta-paper]
  reviewed_at: 2026-10-13
