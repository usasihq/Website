sections:
  - heading: Career
    paragraphs:
      - text: >-
          Stella works as a computer scientist at AWS, which Stella's GitHub profile also lists as the
          current organization. Stella's earlier research addressed algorithms for large-scale nonsmooth
          optimization problems, their theoretical analysis and their efficient implementation.
        source_ids: [stella-site, stella-github]
  - heading: Research and software
    paragraphs:
      - text: >-
          Stella's optimization research includes papers on forward-backward quasi-Newton methods (2017),
          Douglas-Rachford splitting and ADMM for nonconvex problems (2022) and adaptive proximal
          algorithms (2024), and the Julia packages ProximalAlgorithms.jl and ProximalOperators.jl.
        source_ids: [stella-research, stella-projects]
      - text: >-
          In time series forecasting, Stella co-authored Deep State Space Models (NeurIPS 2018), the GluonTS
          toolkit paper (JMLR 2020), Chronos (2024), the fev-bench benchmark (2025) and Chronos-2 (2025).
        source_ids: [stella-research, chronos-paper, chronos2-paper, fev-paper]
