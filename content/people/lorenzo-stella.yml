headline: AWS computer scientist; second author of Chronos and a co-author of GluonTS and Chronos-2
bio:
  text: >-
    Lorenzo Stella is a computer scientist at Amazon Web Services who works on time series forecasting
    and optimization software. Stella is the second author of the Chronos paper (2024), which
    introduced Amazon's pretrained time series forecasting models, a co-author of Chronos-2 (2025),
    and a co-author of GluonTS, a Python toolkit for probabilistic time series modeling. Stella's
    earlier research covered algorithms for large-scale nonsmooth optimization.
  source_ids: [stella-site, stella-github, chronos-paper, chronos2-paper, stella-research]
  reviewed_at: 2026-10-22
