sections:
  - heading: Career
    paragraphs:
      - text: >-
          Yejin Choi was previously a Senior Research Director and Distinguished Research Scientist at
          NVIDIA, a professor at the University of Washington and a senior director at the Allen Institute
          for AI. Choi is now the Dieter Schwarz Foundation Professor of Computer Science at Stanford
          University and a Senior Fellow at the Stanford Institute for Human-Centered AI.
        source_ids: [choi-site]
  - heading: Research
    paragraphs:
      - text: >-
          Choi's research has included commonsense knowledge and reasoning in language. Choi co-authored ATOMIC (2018), an atlas of everyday if-then commonsense knowledge, and COMET (2019),
          which trains Transformers to generate commonsense knowledge graphs automatically.
        source_ids: [atomic-paper, comet-paper, choi-site]
      - text: >-
          Choi's current research interests include AI for science, such as molecular and protein reasoning
          models; pluralistic alignment, with data and algorithms for diverse norms and values; and alternative
          training and inference methods such as test-time training and reinforced pre-training. At NVIDIA,
          Choi was among the authors of the December 2025 Nemotron 3 technical report.
        source_ids: [choi-site, nemotron3-paper]
