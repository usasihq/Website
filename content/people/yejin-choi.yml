headline: Stanford professor and HAI Senior Fellow; formerly at NVIDIA, the University of Washington, and Ai2
bio:
  text: >-
    Yejin Choi is the Dieter Schwarz Foundation Professor of Computer Science at Stanford University
    and a Senior Fellow at the Stanford Institute for Human-Centered AI (HAI). Choi's research
    focuses on making generative AI more broadly accessible, including smaller but capable language
    models, alternative training recipes, pluralistic alignment, and AI for science and social good.
    Choi was previously a Senior Research Director and Distinguished Research Scientist at NVIDIA, a
    Professor at the University of Washington, and a Senior Director at Ai2, and is among the
    authors of NVIDIA's Nemotron 3 technical report.
  source_ids: [choi-site, nemotron3-paper]
  reviewed_at: 2026-10-13
