sections:
  - heading: Career
    paragraphs:
      - text: >-
          Mawakana began their career at the law firm Steptoe & Johnson LLP, working with regulated technology
          and telecom industries and on global technology transactions. Before Waymo, Mawakana led global teams
          at eBay, Yahoo, AOL and Startec, advising consumer technology companies over more than two decades.
        source_ids: [waymo-bio]
      - text: >-
          At Waymo, Mawakana served as chief operating officer. In an April 2021 message to employees,
          then-CEO John Krafcik announced that Mawakana and Dmitri Dolgov, most recently COO and CTO, would lead
          the company as co-CEOs.
        source_ids: [waymo-bio, krafcik-post]
  - heading: Other roles
    paragraphs:
      - text: >-
          Waymo's biography lists Mawakana as a member of the Board of Directors of Intuit and of the Advisory
          Council of Boom Technology, and as an advisor to the Operator Collective.
        source_ids: [waymo-bio]
