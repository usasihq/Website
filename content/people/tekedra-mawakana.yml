headline: Co-CEO of Waymo since April 2021, responsible for company strategy; previously Waymo's COO
bio:
  text: >-
    Tekedra Mawakana is co-CEO of Waymo, the autonomous driving technology company, where Mawakana is
    responsible for overall company strategy with a focus on commercializing the Waymo Driver. Mawakana
    previously served as Waymo's chief operating officer and was named co-CEO alongside Dmitri Dolgov in
    April 2021.
