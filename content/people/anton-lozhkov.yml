sections:
  - heading: Code models
    paragraphs:
      - text: >-
          Lozhkov is first author of "StarCoder 2 and The Stack v2: The Next Generation" (February 2024), a
          BigCode paper whose authors span Hugging Face, ServiceNow Research, NVIDIA and other institutions; the
          paper lists Lozhkov's affiliation as Hugging Face. StarCoder2-3B, one of the models it introduced, was
          trained on 17 programming languages from The Stack v2.
        source_ids: [starcoder2-paper, starcoder2-html, starcoder2-card]
  - heading: Data and small models
    paragraphs:
      - text: >-
          Lozhkov co-authored the FineWeb datasets paper (June 2024) on building large web-text pretraining
          datasets, and is second author of the SmolLM2 paper (February 2025), which describes data-centric
          training of a small language model.
        source_ids: [fineweb-paper, smollm2-paper]
