headline: Machine learning engineer at Hugging Face; first author of StarCoder 2 and co-author of FineWeb and SmolLM2
bio:
  text: >-
    Anton Lozhkov is a machine learning engineer at Hugging Face. Lozhkov is first author of the StarCoder 2
    and The Stack v2 paper (2024), which introduced the StarCoder2 code models including StarCoder2-3B, and a
    co-author of the FineWeb datasets paper (2024) and the SmolLM2 paper (2025).
  source_ids: [github-profile, starcoder2-paper, fineweb-paper, smollm2-paper]
  reviewed_at: 2026-10-22
