headline: PyTorch core maintainer who manages NVIDIA's PyTorch team and its work on the CUDA backend
bio:
  text: >-
    Piotr Bialecki joined the PyTorch team at NVIDIA in 2019 and, according to PyTorch's April 2025
    release Q&A page, manages that team and drives NVIDIA's work maintaining and advancing PyTorch's
    CUDA backend. PyTorch's maintainers page lists Bialecki as a core maintainer and as a maintainer
    of PyTorch's CUDA support. The same Q&A page notes that Bialecki received the PyTorch SUPERHERO
    award in 2023 for community contributions, especially on the PyTorch discussion board.
    Bialecki was also a panelist for the PyTorch 2.13 release Q&A in July 2026.
  source_ids: [pt27-qa, pytorch-maintainers, pt213-qa]
  reviewed_at: 2026-10-13
