sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Piotr Bialecki joined the PyTorch team at NVIDIA in 2019 and, according to PyTorch's April 2025 event
          page, manages that team and drives NVIDIA's work on maintaining and advancing PyTorch's CUDA backend. PyTorch's governance documentation lists
          Bialecki, who publishes on GitHub as ptrblck, among the project's core maintainers and among the
          maintainers of its CUDA support.
        source_ids: [pt27-qa, pytorch-maintainers, github-profile]
      - text: >-
          PyTorch's event pages note Bialecki's contributions to the PyTorch community, especially answers on
          the PyTorch discussion board, which earned a PyTorch SUPERHERO award in 2023. Bialecki has also
          taken part in release question-and-answer sessions, including those for PyTorch 2.7 in April 2025
          and PyTorch 2.13 in July 2026.
        source_ids: [pt27-qa, pt213-qa]
