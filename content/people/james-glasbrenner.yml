headline: MITRE Principal AI Engineer; first-listed author of NIST's Dioptra AI test platform
bio:
  text: >-
    James K. Glasbrenner is a Principal AI Engineer at The MITRE Corporation, according to Glasbrenner's
    GitHub profile. Glasbrenner is the first-listed author in the citation for the Dioptra Test Platform,
    the open-source software published by the National Institute of Standards and Technology (NIST) for
    assessing the trustworthy characteristics of AI, and a co-author of its 2021 documentation.
  source_ids: [github-glasbrenner, dioptra-readme, nist-booth]
  reviewed_at: 2026-10-22
