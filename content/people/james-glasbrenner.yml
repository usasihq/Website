sections:
  - heading: Dioptra
    paragraphs:
      - text: >-
          Glasbrenner co-authored the June 2021 Securing AI Testbed (Dioptra) documentation with Harold
          Booth, Howard Huang, Cory Miniter and Julian Sexton, describing a testbed for evaluating attacks
          on and defenses of machine learning models.
        source_ids: [nist-booth]
      - text: >-
          The Dioptra repository's citation lists Glasbrenner first among the authors of the Dioptra Test
          Platform (2024). The platform supports research tracking, evaluations and challenges, and
          red-teaming, and is distributed under CC BY 4.0 to the extent NIST holds copyright.
        source_ids: [dioptra-readme]
