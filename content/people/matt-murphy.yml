sections:
  - heading: Career
    paragraphs:
      - text: >-
          Murphy spent 22 years at Maxim Integrated with growing responsibilities in sales and
          business-unit leadership. Murphy served as Vice President, Worldwide Sales and Marketing
          from 2006 to 2011 and as Senior Vice President of the Communications and Automotive
          Solutions Group from 2011 to 2015, and was most recently Executive Vice President,
          Business Units, Sales and Marketing.
        source_ids: [mrvl-ceo-release]
      - text: >-
          Marvell announced Murphy's appointment as President, CEO and director in June 2016,
          effective July 11, 2016. In May 2023 the board appointed Murphy as Chair, succeeding Rick
          Hill, effective at the 2023 annual meeting of stockholders.
        source_ids: [mrvl-ceo-release, mrvl-chair-release]
  - heading: Marvell
    paragraphs:
      - text: >-
          Under Murphy, Marvell presents itself as a supplier of semiconductors for AI and data
          center infrastructure. Recent company announcements include a 3.2T protocol-aware retimer
          and a second-generation 1.6T AEC DSP, and an Open Compute Project working group with
          Microsoft and Oracle to standardize data center hardware security.
        source_ids: [mrvl-ir]
