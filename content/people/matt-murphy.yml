headline: Chairman and CEO of Marvell Technology; CEO since 2016 after 22 years at Maxim Integrated
bio:
  text: >-
    Matt Murphy is the Chairman and CEO of Marvell Technology, a data infrastructure semiconductor
    company. Murphy became Marvell's President and CEO and a member of its board in July 2016,
    after 22 years at Maxim Integrated in sales and business-unit leadership, and added the role
    of Chair of the Board in 2023.
  source_ids: [mrvl-ir, mrvl-ceo-release, mrvl-chair-release]
  reviewed_at: 2026-10-21
