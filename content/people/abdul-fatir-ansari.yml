sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ansari's site lists AWS AI in 2021 and from 2022 to the present, and describes Ansari as a Senior
          Applied Scientist at AWS working on time series forecasting, log analytics and generative models,
          with recent work on general-purpose pretrained models for time series.
        source_ids: [ansari-site]
  - heading: Research
    paragraphs:
      - text: >-
          Ansari's research covers time series analysis and generative models, including probabilistic
          generative modeling, unsupervised learning and representation learning. As first author of
          Chronos (2024), Ansari described a framework that scales and quantizes time series into a fixed
          vocabulary and trains T5-based models on them, and as first author of Chronos-2 (2025) extended the
          approach to multivariate and covariate-informed forecasting.
        source_ids: [ansari-site, chronos-paper, chronos2-paper]
      - text: >-
          Ansari also co-authored fev-bench (2025), a benchmark for time series forecasting with Oleksandr
          Shchur and colleagues at AWS, and in August 2025 lectured on building foundation models for time
          series at the Oxford ML School.
        source_ids: [fev-paper, ansari-site]
