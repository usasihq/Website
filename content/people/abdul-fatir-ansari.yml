headline: Senior Applied Scientist at AWS and first author of the Chronos and Chronos-2 time series forecasting models
bio:
  text: >-
    Abdul Fatir Ansari is a Senior Applied Scientist at Amazon Web Services, working on time series
    forecasting, log analytics and generative models, and in particular on general-purpose pretrained
    models for time series. Ansari is the first author of the Chronos (2024) and Chronos-2 (2025)
    papers, which introduced Amazon's open pretrained time series forecasting models, and contributes
    to AWS's open-source AutoGluon and GluonTS libraries.
  source_ids: [ansari-site, chronos-paper, chronos2-paper]
  reviewed_at: 2026-10-22
affiliations:
  - name: Amazon Web Services
    organization_slug: amazon
    role: Senior Applied Scientist, AWS AI
    current: true
    source_ids: [ansari-site]
work:
  - name: Chronos
    artifact_slug: chronos
    type: open-weights
    url: https://arxiv.org/abs/2403.07815
    contribution: >-
      First author of "Chronos: Learning the Language of Time Series" (2024), which tokenizes time series
      values and trains transformer language model architectures on them to build pretrained
      probabilistic forecasting models.
    source_ids: [chronos-paper, chronos-readme]
  - name: Chronos-2
    artifact_slug: chronos-2
    type: open-weights
    url: https://arxiv.org/abs/2510.15821
    contribution: >-
      First author of "Chronos-2: From Univariate to Universal Forecasting" (2025), describing the
      Chronos-2 model with zero-shot support for univariate, multivariate and covariate-informed
      forecasting.
    source_ids: [chronos2-paper, chronos-readme, ansari-site]
