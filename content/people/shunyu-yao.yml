headline: First author of ReAct, Tree of Thoughts and the τ-bench agent benchmark; language-agent researcher
bio:
  text: >-
    Shunyu Yao studies language agents. Yao is the first-listed author of ReAct (2022), which interleaves
    reasoning traces and actions in language models and was described on the Google Research blog
    by Yao as a Student Researcher on the Brain Team, and of Tree of Thoughts, WebShop and τ-bench, a
    benchmark of conversations between a simulated user and a tool-using agent. Yao's homepage lists
    OpenAI's Computer-Using Agent (CUA) and Deep Research among Yao's selected work, and a PhD thesis
    titled "Language Agents: From Next-Token Prediction to Digital Automation".
  source_ids: [yao-site, react-paper, react-blog, taubench-paper]
  reviewed_at: 2026-10-13
