work:
  - name: τ-bench
    artifact_slug: tau-bench
    type: open-source
    url: https://github.com/sierra-research/tau-bench
    contribution: >-
      First author, with Noah Shinn, Pedram Razavi and Karthik Narasimhan, of "τ-bench: A Benchmark
      for Tool-Agent-User Interaction in Real-World Domains" (2024), which emulates conversations
      between a language-model-simulated user and an agent with domain-specific API tools and policy
      guidelines. The sierra-research/tau-bench repository is MIT-licensed.
    source_ids: [taubench-paper, taubench-repo, yao-site]
  - name: ReAct
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2210.03629
    contribution: >-
      First author of "ReAct: Synergizing Reasoning and Acting in Language Models" (2022), which
      has language models generate reasoning traces and task-specific actions in an interleaved
      manner.
    source_ids: [react-paper, react-blog]
