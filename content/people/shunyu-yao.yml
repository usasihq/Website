sections:
  - heading: Research
    paragraphs:
      - text: >-
          Yao's research concerns language agents, systems in which language models reason and act in
          external environments. ReAct (2022), developed while Yao was a Student Researcher on Google's Brain
          Team with joint support from the Princeton NLP Group, has a model interleave reasoning traces with
          task actions. Tree of Thoughts (2023), which lists Yao with a Princeton University affiliation, lets a
          model explore and evaluate several reasoning paths before committing to one.
        source_ids: [react-paper, react-blog, tot-paper]
      - text: >-
          With Theodore Sumers, Karthik Narasimhan, and Thomas Griffiths, Yao co-wrote "Cognitive Architectures
          for Language Agents" (2023), a framework that organizes language agents around memory, action space,
          and decision-making. Yao's PhD thesis, listed on Yao's homepage, is titled "Language Agents: From
          Next-Token Prediction to Digital Automation".
        source_ids: [coala-paper, yao-site]
  - heading: Benchmarks and environments
    paragraphs:
      - text: >-
          Yao has built several environments for testing agents. WebShop (2022) is a simulated online store in
          which agents follow natural-language shopping instructions, and Yao co-authored SWE-bench (2023),
          which asks language models to resolve real GitHub issues. τ-bench (2024) emulates conversations
          between a simulated user and an agent that must use domain-specific API tools while following policy
          guidelines.
        source_ids: [webshop-paper, swebench-paper, taubench-paper, taubench-repo]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Yao's homepage lists two OpenAI agent products among Yao's selected work: the Computer-Using Agent
          (CUA), described as a universal interface for interacting with the digital world, and Deep Research,
          an agent that navigates and reasons over the internet to carry out research.
        source_ids: [yao-site]
