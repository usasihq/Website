sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Brooklyn Nicholson contributes to Hermes Agent, the open-source agent from Nous Research, under the
          GitHub handle OutThisLife. The v2026.3.12 release notes credit Nicholson with parallelizing the
          project's test suite using pytest-xdist.
        source_ids: [hermes-v2026-3-12, github-profile]
      - text: >-
          By the v0.22.0 release in October 2026, the release notes credit Nicholson with work across the
          desktop app, including the model picker, plugin settings, workspace views and connector cards. Changes
          credited to Nicholson in that release include the Simple and Advanced modes, titlebar tabs, profiles
          that open in their own windows, and an opt-in native terminal mode.
        source_ids: [hermes-v0-22-0]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Nicholson's personal site describes Nicholson as a full stack engineer. Nicholson also publishes
          brooklyn-skills, an MIT-licensed collection of portable SKILL.md packages for coding agents that covers
          tasks such as preparing pull requests, triaging issues and checking user-interface work, and that can be
          loaded directly by Hermes Agent.
        source_ids: [personal-site, brooklyn-skills]
