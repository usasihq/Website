headline: Hermes Agent contributor credited with desktop-app work, including its guided first-launch setup
bio:
  text: >-
    Brooklyn Nicholson, who publishes as OutThisLife on GitHub, is a contributor to Hermes Agent,
    Nous Research's open-source agent. Hermes Agent's release notes have credited
    Brooklyn since the v2026.3.12 release in March 2026, including for desktop-app changes. In
    v0.22.0 (October 2026) those include the guided setup chat that opens on a fresh desktop
    install and the desktop app's Simple and Advanced modes.
