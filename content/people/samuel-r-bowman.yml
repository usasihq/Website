headline: Technical AI safety researcher at Anthropic; NYU associate professor on leave; co-author of Petri
bio:
  text: >-
    Samuel R. Bowman works on technical AI safety at Anthropic and is on long-term leave from New York
    University, where Bowman is an associate professor of data science and computer science. Bowman is
    first author of the SNLI natural language inference corpus and a co-author of the GLUE and SuperGLUE
    benchmarks, and is the final listed author of Anthropic's Petri alignment auditing tool releases.
  source_ids: [bowman-site, snli-paper, glue-paper, superglue-paper, petri-2025, petri-v2]
  reviewed_at: 2026-10-22
