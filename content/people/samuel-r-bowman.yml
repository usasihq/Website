sections:
  - heading: Career
    paragraphs:
      - text: >-
          Bowman earned a PhD in 2016 at the Stanford NLP Group and Stanford Linguistics, supervised by Chris
          Potts and Chris Manning, for work on early neural network models for text. At New York University,
          Bowman became an associate professor of data science and computer science, was part of the ML²
          Group and the CILVR Lab, and led the Alignment Research Group during 2022–24.
        source_ids: [bowman-site]
      - text: >-
          Bowman now works on technical AI safety at Anthropic and is on long-term leave from NYU.
        source_ids: [bowman-site]
  - heading: Research
    paragraphs:
      - text: >-
          Bowman's early work includes the SNLI corpus for natural language inference (2015). With Alex Wang
          and colleagues, Bowman co-authored the GLUE (2018) and SuperGLUE (2019) benchmarks for evaluating
          general-purpose language understanding. In 2022 Bowman was first author of "Measuring Progress on
          Scalable Oversight for Large Language Models".
        source_ids: [snli-paper, glue-paper, superglue-paper, oversight-paper]
      - text: >-
          Bowman is the final listed author of the October 2025 Petri release, an open-source framework that
          uses AI agents to audit model behavior, and of the January 2026 Petri 2.0 update.
        source_ids: [petri-2025, petri-v2]
