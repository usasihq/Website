headline: Writer and producer of Daring Fireball and host of The Talk Show podcast
bio:
  text: >-
    John Gruber writes and produces Daring Fireball, a website of articles and links published by The
    Daring Fireball Company. John Gruber also hosts The Talk Show, a podcast in which guests discuss
    Apple's products and platforms, software design, and technology industry news.
  source_ids: [df-colophon, talk-show]
  reviewed_at: 2026-10-21
