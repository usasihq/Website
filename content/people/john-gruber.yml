sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Daring Fireball's archive runs back to August 2002, and the site's copyright line covers 2002
          to 2026 under The Daring Fireball Company LLC. The colophon credits John Gruber as the site's
          writer and producer and notes that its articles and links are still published through Movable
          Type.
        source_ids: [df-archive, df-colophon]
      - text: >-
          The Talk Show page lists recent episodes in which John Gruber and returning guests discuss
          Apple's product events, operating-system betas, and interface and icon design on Apple's
          platforms.
        source_ids: [talk-show]
  - heading: Open-source work
    paragraphs:
      - text: >-
          John Gruber wrote Markdown, which the project page describes as both a plain-text formatting
          syntax and a Perl tool that converts that syntax into structurally valid HTML. The page says
          the syntax was designed to stay readable as plain text, drew its main inspiration from the
          conventions of plain-text email, and credits Aaron Swartz for feedback on its design. Markdown
          is distributed under a BSD-style open-source license, and version 1.0.1 was released in
          December 2004.
        source_ids: [markdown, markdown-license]
      - text: >-
          John Gruber also wrote SmartyPants, a free plug-in for Movable Type, Blosxom, and BBEdit that
          converts straight quotes, dashes, and ellipses into typographic punctuation entities. Version
          1.5.1 was released in March 2004.
        source_ids: [smartypants]
timeline:
