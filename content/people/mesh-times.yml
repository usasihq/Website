sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          The meshtimes YouTube channel, which lists a join date of January 2021, is run by a creative technologist who
          describes the work as designing and sometimes coding. Its videos include design vlogs, Figma
          prototyping tutorials, app builds made with AI coding tools, and electronics projects such as a
          cyberdeck.
        source_ids: [youtube-about, youtube-videos]
      - text: >-
          The Mesh Times newsletter on Substack, subtitled "Design & Technology", began publishing in October 2024.
          Issues have covered designing a billboard, Figma's Config 2025 conference, the Apple Design Awards,
          building a language-lesson app with AI tools, and advice on portfolios and sharing unfinished work.
        source_ids: [substack-about, substack-archive, first-issue, config-2025-issue, ai-tools-issue]
