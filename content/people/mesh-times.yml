headline: Creative technologist behind meshtimes, a YouTube channel and Substack newsletter on design and technology
bio:
  text: >-
    Mesh Times (meshtimes) describes themselves as a creative technologist who designs and
    sometimes codes. On the meshtimes YouTube channel they post design vlogs, Figma prototyping
    tutorials, videos building apps with AI coding tools, and electronics builds such as a
    cyberdeck. They also write Mesh Times, a Substack newsletter on design and technology that
    covers design conferences, design tools, and AI tools.
