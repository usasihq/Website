sections:
  - heading: Model performance at Baseten
    paragraphs:
      - text: >-
          Gupta is listed on Baseten's blog as a co-founder. In January 2025, Gupta wrote a review of the
          company's 2024 model performance work, which described adopting TensorRT-LLM as the core framework,
          using NVIDIA's Hopper architecture and supporting production-ready speculative decoding.
        source_ids: [baseten-author, perf-2024-post]
      - text: >-
          With Philip Kiely, Gupta tested Llama 3.3 70B inference on a single NVIDIA GH200 in Lambda Cloud
          (February 2025). In August 2026, Gupta co-authored a post with Brian Li and Faraz Shahsavan on
          Baseten's agentic kernel optimization framework for image models such as Qwen-Image and FLUX.2.
        source_ids: [gh200-post, kernels-post]
