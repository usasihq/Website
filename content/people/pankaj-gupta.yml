headline: Co-founder of Baseten who writes on model performance optimization for LLM, image and video inference
bio:
  text: >-
    Pankaj Gupta is a co-founder of Baseten, which runs inference for open and custom AI models. Gupta's posts
    on the Baseten blog cover the company's model performance work, including its adoption of TensorRT-LLM,
    speculative decoding and inference benchmarks on NVIDIA GH200, and later work on kernel-level optimization
    for image generation models.
