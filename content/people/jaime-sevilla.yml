headline: Co-founder and CEO of Epoch AI; first author of "Compute Trends Across Three Eras of Machine Learning"
bio:
  text: >-
    Jaime Sevilla is the co-founder and Chief Executive Officer of Epoch AI, a research institute that
    studies trends in artificial intelligence. Sevilla's research focuses on technological forecasting and
    the trajectory of AI, and Sevilla is first author of "Compute Trends Across Three Eras of Machine
    Learning" (2022) and of Epoch AI reports on training compute and on whether AI scaling can continue
    through 2030. Sevilla has a background in mathematics and computer science.
  source_ids: [epoch-sevilla, epoch-team, sevilla-site, sevilla-cv, compute-trends-paper, epoch-2030]
  reviewed_at: 2026-10-22
