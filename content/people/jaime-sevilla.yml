sections:
  - heading: Career
    paragraphs:
      - text: >-
          Sevilla completed a double degree in mathematics and computer engineering at Universidad
          Complutense de Madrid in 2019 and worked as a deep learning specialist on a high-energy
          astrophysics research programme. From 2020 Sevilla pursued a PhD at the University of Aberdeen as
          an NL4XAI early-stage researcher on explainability in Bayesian networks, paused in 2022.
        source_ids: [sevilla-cv]
      - text: >-
          Sevilla co-founded Epoch AI in 2022 and leads it as Chief Executive Officer. From 2021 to 2024
          Sevilla was also interim director and co-founder of the Observatorio de Riesgos Catastróficos
          Globales, a science-policy organization, and from 2019 to 2025 a research affiliate at the Centre
          for the Study of Existential Risk at the University of Cambridge.
        source_ids: [sevilla-cv, epoch-sevilla]
  - heading: Research
    paragraphs:
      - text: >-
          Sevilla's work at Epoch AI studies what drives progress in machine learning. "Compute Trends Across
          Three Eras of Machine Learning" (2022), with Sevilla as first author, traced the growth of training
          compute, and Sevilla co-authored "Will we run out of data?" on limits of scaling based on
          human-generated text.
        source_ids: [compute-trends-paper, data-limits-paper, sevilla-site]
      - text: >-
          In 2024 Sevilla and Edu Roldán published an update on training-compute growth based on Epoch AI's
          expanded AI model database, and Sevilla led the report "Can AI Scaling Continue Through 2030?",
          which examined constraints including power, chip production and data. Sevilla also co-authored
          "Please Report Your Compute" in Communications of the ACM (2023).
        source_ids: [epoch-4x, epoch-2030, sevilla-site]
