sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Over more than ten years, Yang led products and teams at Roblox, Reddit, Amazon's Twitch, and
          Meta. Behind the Craft, Yang's newsletter, aims to keep its AI guides
          short and practical, with a learning path that runs from prompting to prototyping to building AI
          products.
        source_ids: [newsletter-about]
      - text: >-
          Yang's podcast features conversations with AI leaders and builders from companies such as
          Anthropic, Google, Cursor, and Replit, and the YouTube channel publishes free tutorials and
          interviews. In September 2026 Yang added a personal AI course of short lessons, prompts, and
          installable skills to the newsletter's paid membership.
        source_ids: [newsletter-about, youtube, course-post]
