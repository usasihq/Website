headline: Writer of Behind the Craft, a newsletter and podcast of practical AI tutorials and interviews
bio:
  text: >-
    Peter Yang writes Behind the Craft, a newsletter of practical AI tutorials for tech professionals
    covering prompting, prototyping, AI coding tools, and building AI products, and hosts a podcast of
    conversations with AI builders. Peter also publishes free tutorials and interviews on YouTube.
    Peter has led products and teams at Roblox, Reddit, Amazon (Twitch), and Meta.
