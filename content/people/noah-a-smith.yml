sections:
  - heading: Career
    paragraphs:
      - text: >-
          Smith earned a PhD in computer science at Johns Hopkins University, advised by Jason Eisner. Smith was
          previously an associate professor of language technologies and machine learning in Carnegie Mellon
          University's School of Computer Science, before joining the University of Washington's Paul G. Allen
          School.
        source_ids: [smith-site]
      - text: >-
          At UW, Smith is the inaugural Vice Provost for Artificial Intelligence and holds the Charles and Lisa
          Simonyi Endowed Chair for Artificial Intelligence and Emerging Technologies. Smith is also Senior
          Director of NLP Research at the Allen Institute for AI and principal investigator of the NSF- and
          NVIDIA-supported project "Open Multimodal AI Infrastructure to Accelerate Science". Smith was general
          chair of EMNLP 2022 and program co-chair of ACL 2016.
        source_ids: [smith-site, uw-profile, ai2-team]
  - heading: Research
    paragraphs:
      - text: >-
          Smith's research targets systems that process language and other data to augment human capabilities,
          along with research methodology such as evaluation. Recent work applies multimodal AI to music,
          including timestamped transcription of performances (Rubato) and digitization of sheet music (Legato 2).
        source_ids: [smith-site, uw-profile]
      - text: >-
          Smith directs Ai2's OLMo open language modeling effort and co-authored the 2024 papers introducing OLMo,
          the Dolma pretraining corpus, the OLMoE mixture-of-experts model and the Tülu 3 post-training recipes.
          With Sofia Serrano and Zander Brumbaugh, Smith wrote "Language Models: A Guide for the Perplexed"
          (2023), a tutorial for a general audience.
        source_ids: [olmo-paper, dolma-paper, olmoe-pdf, tulu3-paper, guide-paper, smith-site]
