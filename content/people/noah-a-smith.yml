headline: UW Vice Provost for AI and professor; Senior Director of NLP Research at Ai2, directing OLMo
bio:
  text: >-
    Noah A. Smith is the University of Washington's inaugural Vice Provost for Artificial
    Intelligence, holds the Charles and Lisa Simonyi Endowed Chair for Artificial Intelligence and
    Emerging Technologies, and is a professor in the Paul G. Allen School of Computer Science &
    Engineering. Smith is also Senior Director of NLP Research at Ai2, where Smith directs the OLMo
    open language modeling effort. Smith's research covers systems that
    process language and music data and core questions of research methodology such as evaluation,
    and Smith is a co-author of the OLMo, Dolma, and Tülu 3 papers.
  source_ids: [smith-site, uw-profile, ai2-team, olmo-paper, dolma-paper, tulu3-paper]
