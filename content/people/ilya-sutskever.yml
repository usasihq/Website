work:
  - name: Whisper
    artifact_slug: whisper
    type: open-weights
    url: https://github.com/openai/whisper
    contribution: >-
      Last-listed author of "Robust Speech Recognition via Large-Scale Weak Supervision" (2022), which
      trains speech recognition models on 680,000 hours of multilingual audio and releases the models
      and inference code; the repository is under the MIT license.
    source_ids: [whisper-paper, whisper-repo]
  - name: CLIP
    artifact_slug: clip
    type: open-weights
    url: https://github.com/openai/CLIP
    contribution: >-
      Last-listed author of "Learning Transferable Visual Models From Natural Language Supervision"
      (2021), which trains image representations by predicting which caption goes with which image and
      releases code and pre-trained weights; the repository is under the MIT license.
    source_ids: [clip-paper, clip-repo]
  - name: HumanEval
    artifact_slug: humaneval
    type: open-data
    url: https://github.com/openai/human-eval
    contribution: >-
      Co-author of "Evaluating Large Language Models Trained on Code" (2021), the Codex paper that
