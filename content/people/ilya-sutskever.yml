work:
  - name: Whisper
    artifact_slug: whisper
    type: open-weights
    url: https://github.com/openai/whisper
    contribution: >-
      Last-listed author of "Robust Speech Recognition via Large-Scale Weak Supervision" (2022), which
      trains speech recognition models on 680,000 hours of multilingual audio and releases the models
      and inference code; the repository is under the MIT license.
    source_ids: [whisper-paper, whisper-repo]
  - name: CLIP
    artifact_slug: clip
    type: open-weights
    url: https://github.com/openai/CLIP
    contribution: >-
      Last-listed author of "Learning Transferable Visual Models From Natural Language Supervision"
      (2021), which trains image representations by predicting which caption goes with which image and
      releases code and pre-trained weights; the repository is under the MIT license.
    source_ids: [clip-paper, clip-repo]
  - name: HumanEval
    artifact_slug: humaneval
    type: open-data
    url: https://github.com/openai/human-eval
    contribution: >-
      Co-author of "Evaluating Large Language Models Trained on Code" (2021), the Codex paper that
      introduced and released the HumanEval evaluation set; the repository's citation lists the full
      author list.
    source_ids: [codex-paper, humaneval-repo]
  - name: OpenAI o1 reasoning research
    artifact_slug: null
    type: proprietary
    url: https://arxiv.org/abs/2412.16720
    contribution: >-
      Listed among the foundational contributors to reasoning research in the authorship section of
      the OpenAI o1 System Card (2024).
    source_ids: [o1-card]
  - name: Sequence to Sequence Learning with Neural Networks
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/1409.3215
    contribution: >-
      First author, with Oriol Vinyals and Quoc V. Le, of the 2014 paper on mapping one sequence to
      another with neural networks; it received the NeurIPS 2024 Test of Time Paper Award.
    source_ids: [seq2seq-paper, neurips-tot-2024]
  - name: AlexNet
    artifact_slug: null
    type: open-research
    url: https://papers.nips.cc/paper_files/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html
    contribution: >-
      Co-author, with Alex Krizhevsky and Geoffrey Hinton, of "ImageNet Classification with Deep
      Convolutional Neural Networks" (NIPS 2012), which received the NeurIPS 2022 Test of Time Award.
    source_ids: [alexnet-paper, neurips-awards-2022]
links:
  - label: SSI
    url: https://ssi.inc
sections:
  - heading: Research
    paragraphs:
      - text: >-
          Ilya Sutskever co-authored the 2012 AlexNet paper with Alex Krizhevsky and Geoffrey Hinton,
          which trained a deep convolutional network on ImageNet using GPUs. In 2014 Sutskever, Oriol
          Vinyals, and Quoc V. Le published Sequence to Sequence Learning with Neural Networks, which
          the NeurIPS 2024 award announcement describes as the work that set the encoder-decoder architecture.
        source_ids: [alexnet-paper, seq2seq-paper, neurips-tot-2024]
      - text: >-
          Sutskever also co-authored the papers introducing GPT-3, the CLIP image-text models,
          Codex with the HumanEval benchmark, and the Whisper speech recognition models. NVIDIA's 2026
          release also credits Sutskever with contributions to AlphaGo and the GPT models and with
          leading the research behind reasoning models such as OpenAI o1, and the o1 System Card lists
          Sutskever among its foundational contributors.
        source_ids: [gpt3-paper, clip-paper, codex-paper, whisper-paper, nvidia-release, o1-card]
  - heading: Safe Superintelligence Inc.
    paragraphs:
      - text: >-
          Sutskever co-founded Safe Superintelligence Inc. in 2024 as a lab with one goal and one
          product, a safe superintelligence, approaching safety and capabilities together as technical
          problems. In July 2025 SSI announced that Sutskever was formally CEO, with Daniel Levy as
          President and the technical team reporting to Sutskever.
        source_ids: [ssi-home, ssi-updates, nvidia-release]
      - text: >-
          In July 2026, SSI and NVIDIA announced a long-term strategic partnership that SSI says will
          let it scale its compute by ten times.
        source_ids: [ssi-updates, nvidia-release]
