headline: Co-founder and CEO of Safe Superintelligence Inc.; co-author of the CLIP, Whisper and GPT-3 papers at OpenAI
bio:
  text: >-
    Ilya Sutskever is the co-founder and CEO of Safe Superintelligence Inc. (SSI), a lab whose stated
    goal and only product is a safe superintelligence. A July 2026 NVIDIA press release describing SSI
    credits Sutskever's work as contributing to AlexNet, AlphaGo, sequence-to-sequence learning and
    the GPT models, and as driving the research that led to reasoning models such as OpenAI o1, where the
    o1 System Card lists Sutskever among the foundational contributors. With an OpenAI affiliation,
    Sutskever co-authored the papers introducing GPT-3, CLIP, Codex with the HumanEval benchmark, and
    the Whisper speech recognition models.
  source_ids: [nvidia-release, ssi-updates, ssi-home, o1-card, gpt3-paper, clip-paper, codex-paper, whisper-paper]
  reviewed_at: 2026-10-13
