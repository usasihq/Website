headline: Stanford assistant professor; advisor on Stanford Alpaca, HELM co-author, and CS336 instructor
bio:
  text: >-
    Tatsunori (Tatsu) Hashimoto is an assistant professor in the computer science department at
    Stanford University, with research that uses tools from statistics to make machine learning
    systems, including large language models, more robust and trustworthy. Hashimoto advised the
    Stanford Alpaca project, an instruction-following model built on LLaMA, and is listed in its
    citation. Hashimoto is a co-author of the HELM paper on holistic evaluation of language models
    and co-teaches Stanford's CS336, Language Modeling from Scratch, with Percy Liang.
  source_ids: [hashimoto-site, alpaca-readme, helm-paper, cs336]
  reviewed_at: 2026-10-13
