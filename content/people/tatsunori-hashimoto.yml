sections:
  - heading: Career
    paragraphs:
      - text: >-
          Tatsunori Hashimoto was a graduate student at MIT co-advised by Tommi Jaakkola and David Gifford, and
          then a postdoctoral researcher at Stanford with John C. Duchi and Percy Liang, studying trade-offs
          between the average and worst-case performance of machine learning models. Hashimoto is now an
          assistant professor of computer science at Stanford and is affiliated with the Center for Research on
          Foundation Models.
        source_ids: [hashimoto-site, crfm-people]
  - heading: Research
    paragraphs:
      - text: >-
          Hashimoto's research uses robustness and worst-case performance as a lens on problems in machine
          learning and NLP, including long-tail behaviour, out-of-domain understanding and fairness. A 2018
          paper first-authored by Hashimoto, "Fairness Without Demographics in Repeated Loss Minimization,"
          used distributionally robust optimization to protect minority groups without knowing their
          identities.
        source_ids: [hashimoto-site, fairness-paper]
      - text: >-
          Hashimoto has also worked on language models, co-authoring Diffusion-LM (2022) for controllable
          text generation, AlpacaFarm (2023), a simulator for methods that learn from human feedback, HELM
          (2022) and s1 (2025), a simple approach to test-time scaling. The Stanford Alpaca repository lists
          its authors as graduate students advised by Hashimoto.
        source_ids: [diffusionlm-paper, alpaca-readme, alpacafarm-paper, helm-paper, s1-paper]
  - heading: Teaching
    paragraphs:
      - text: >-
          With Percy Liang, Hashimoto teaches Stanford's CS336, Language Modeling from Scratch, which has been
          offered in Spring 2024, Spring 2025 and Spring 2026 and walks students through building language
          models end to end.
        source_ids: [cs336]
