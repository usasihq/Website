headline: First author of Code Llama and co-author of LLaMA and Llama 3; later an author on Mistral AI model papers
bio:
  text: >-
    Meta's AI people page describes Baptiste Rozière as a research scientist at Meta AI in the code
    generation team, working on large language models with a special interest in code, who contributed
    to Llama and started Code Llama. Rozière is first author of Code Llama: Open Foundation Models for
    Code (2023), a family of code models based on Llama 2 released under a permissive license for
    research and commercial use, and a co-author of LLaMA (2023) and Llama 3 (2024), where Rozière is
    listed among the core contributors. Earlier work includes unsupervised translation between
    programming languages (2020). Rozière is also listed among the core contributors of Devstral
    (2025), a paper from Mistral AI and All Hands AI, and among the contributors of Mistral AI's
    Ministral 3 (2026).
  source_ids: [meta-profile, codellama-paper, llama-paper, llama3-paper, transcoder-paper, devstral-paper, ministral3-paper]
  reviewed_at: 2026-10-21
