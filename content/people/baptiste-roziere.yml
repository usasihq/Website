sections:
  - heading: Career
    paragraphs:
      - text: >-
          Meta's people page describes Baptiste Rozière as a research scientist at Meta AI in the code
          generation team, working on large language models with a focus on code. Before the Llama work,
          Rozière worked on model pre-training and on machine translation between programming languages.
        source_ids: [meta-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Rozière co-authored Unsupervised Translation of Programming Languages (2020), which trains a neural
          transcompiler between C++, Java and Python without parallel data, an alternative to transcompilers
          built from handwritten rewrite rules. The paper also released a test set of parallel functions with
          unit tests.
        source_ids: [transcoder-paper]
      - text: >-
          At Meta, Rozière co-authored the February 2023 LLaMA paper and, according to Meta's page, started
          Code Llama. Rozière was first author of the August 2023 Code Llama paper, describing code models
          built on Llama 2, and is listed among the core contributors of The Llama 3 Herd of Models (2024).
        source_ids: [llama-paper, meta-profile, codellama-paper, llama3-paper]
  - heading: Coding agents and compact models
    paragraphs:
      - text: >-
          Rozière is listed among the core contributors of the Devstral technical report, a Mistral AI and All
          Hands AI paper on a 24-billion-parameter open model for software-engineering agents. Rozière also
          appears among the contributors of Ministral 3 (2026), a family of 3B, 8B and 14B dense models released
          in base, instruction-tuned and reasoning variants.
        source_ids: [devstral-paper, ministral3-paper]
