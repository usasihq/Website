sections:
  - heading: Research
    paragraphs:
      - text: >-
          Albert Gu's research centres on state space models for long sequences. With Tri Dao,
          Christopher Ré and others, Gu was first author of HiPPO (2020), a framework for recurrent
          memory based on optimal polynomial projections, and of the 2021 paper on linear state-space
          layers that unify recurrent, convolutional and continuous-time models.
        source_ids: [hippo-paper, lssl-paper]
      - text: >-
          Gu's S4 paper (2021) made structured state space models efficient for long-range sequence
          tasks. Gu and Tri Dao were then co-first authors of Mamba (2023), which adds input-dependent
          selection to state space models, and of Mamba-2 (2024), which connects state space models and
          attention through structured state space duality.
        source_ids: [s4-paper, mamba-paper, mamba2-paper, mamba-readme]
      - text: >-
          Gu is the last-listed author of the 2025 paper on dynamic chunking for end-to-end hierarchical
          sequence modeling, the basis of the H-Net architecture, and of the March 2026 Mamba-3 paper,
          whose author list also includes Tri Dao.
        source_ids: [hnet-paper, mamba3-paper, goomba-blog]
  - heading: Teaching and lab
    paragraphs:
      - text: >-
          At Carnegie Mellon, Gu leads the Goomba Lab, a research group in the Machine Learning
          Department with PhD and master's students. The lab's blog publishes explanatory posts
          alongside its papers, including two-part series on Mamba-3 and on the Raven architecture in
          2026.
        source_ids: [goomba-lab, goomba-blog]
  - heading: Cartesia
    paragraphs:
      - text: >-
          Gu is a co-founder of Cartesia and serves as its Chief Scientist, alongside the faculty
          appointment at Carnegie Mellon.
        source_ids: [cartesia-company, github-profile]
