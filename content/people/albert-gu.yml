headline: Co-author of Mamba and first author of S4; CMU assistant professor and Cartesia co-founder
bio:
  text: >-
    Albert Gu is an Assistant Professor in the Machine Learning Department at Carnegie Mellon
    University, where Albert Gu leads the Goomba Lab research group, and the Chief Scientist and a
    co-founder of Cartesia. Albert Gu is first author of the S4 paper on structured state space
    models and, with Tri Dao, co-first author of the Mamba and Mamba-2 papers. The Apache-2.0 Mamba
    repository, whose AUTHORS file lists Albert Gu, provides the official implementation.
  source_ids: [github-profile, goomba-lab, cartesia-company, s4-paper, mamba-paper, mamba2-paper, mamba-readme, mamba-authors]
  reviewed_at: 2026-10-21
