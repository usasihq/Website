sections:
  - heading: llm-d
    paragraphs:
      - text: >-
          The llm-d project document names Carlos Costa, Clayton Coleman and Shaw as its initial maintainers,
          representing inference optimization research, the llm-d Router project and vLLM respectively. The
          current maintainers file lists Shaw, with Red Hat as employer, in the project leadership alongside
          Abdullah Gharaibeh and Carlos Costa.
        source_ids: [llmd-project, llmd-maintainers]
      - text: >-
          Shaw co-wrote "Announcing the llm-d community!" (May 2025) with Coleman and Costa, describing a
          Kubernetes-native distributed inference framework with KV-cache aware routing and disaggregated
          serving. The same three authors wrote the v0.2 through v0.5 release posts between July 2025 and
          February 2026.
        source_ids: [llmd-announce, llmd-v02, llmd-v03, llmd-v04, llmd-v05]
  - heading: vLLM and Neural Magic
    paragraphs:
      - text: >-
          A DevConf.US 2025 speaker profile describes Shaw as a core committer to vLLM and notes that, before
          joining Red Hat, Shaw was senior director of engineering at Neural Magic. In April 2025 Shaw
          co-authored a Red Hat Developer article on vLLM performance with the V1 engine in version
          0.8.1.
        source_ids: [devconf-2025, rh-vllm-v1]
