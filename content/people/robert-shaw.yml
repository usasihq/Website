headline: Red Hat engineering director and llm-d project lead; core committer to vLLM
bio:
  text: >-
    Robert Shaw is a member of the project leadership of llm-d, the Kubernetes-native distributed
    inference serving stack, listed with Red Hat as employer, and one of the project's three initial
    maintainers, representing vLLM. llm-d's release posts list Shaw as Director of Engineering at Red Hat,
    and a DevConf.US 2025 speaker profile describes Shaw as a core committer to vLLM who was previously
    senior director of engineering at Neural Magic.
  source_ids: [llmd-maintainers, llmd-project, llmd-v05, devconf-2025]
  reviewed_at: 2026-10-22
