headline: Anthropic co-founder working on reverse engineering neural networks; previously led interpretability at OpenAI
bio:
  text: >-
    Chris Olah works on reverse engineering artificial neural networks into human-understandable
    algorithms and is one of the co-founders of Anthropic. Olah previously led interpretability
    research at OpenAI, worked at Google Brain, and co-founded Distill, a scientific journal focused on
    clear communication. At Anthropic, Olah is the corresponding author of "A Mathematical Framework
    for Transformer Circuits" (2021), last-listed author of "Toy Models of Superposition" (2022), and a
    co-author of "On the Biology of a Large Language Model" (2025), which studies the internal
    mechanisms of Claude 3.5 Haiku with circuit tracing.
  source_ids: [olah-about, tc-framework, superposition-paper, tc-biology]
