sections:
  - heading: Career
    paragraphs:
      - text: >-
          Chris Olah's academic CV lists research internships at Google Brain in 2014, hosted by Jeff
          Dean, and in 2015, hosted by Greg Corrado, working on techniques for visualizing neural
          networks. Olah then joined Google Brain as a research associate in 2015 and became a
          research scientist in 2016.
        source_ids: [olah-cv]
      - text: >-
          In October 2018 Olah joined OpenAI as a member of technical staff and led a new team, called
          Clarity, working on neural network interpretability. Olah is one of the co-founders of
          Anthropic, where Olah continues to work on reverse engineering neural networks.
        source_ids: [olah-cv, olah-about]
  - heading: Distill and explanatory writing
    paragraphs:
      - text: >-
          Olah co-founded Distill, a scientific journal focused on clear communication of machine
          learning research. Olah's Distill articles include "Attention and Augmented Recurrent Neural
          Networks" (2016) with Shan Carter, "Research Debt" (2017), "Feature Visualization" (2017),
          "The Building Blocks of Interpretability" (2018) and "Activation Atlases" (2019).
        source_ids: [olah-about, olah-cv]
  - heading: Interpretability research
    paragraphs:
      - text: >-
          At Anthropic, Olah's work on the Transformer Circuits Thread includes "A Mathematical
          Framework for Transformer Circuits" (2021), which reverse engineers small attention-only
          transformers, and "Toy Models of Superposition" (2022), which studies how models store
          additional sparse features in superposition, a source of polysemantic neurons.
        source_ids: [tc-framework, superposition-paper]
      - text: >-
          Olah is also a co-author of "On the Biology of a Large Language Model" (2025), which uses
          attribution graphs to trace internal mechanisms in Claude 3.5 Haiku. Earlier, Olah was a
          co-author of "Concrete Problems in AI Safety" (2016) and of the TensorFlow systems paper
          (2015).
        source_ids: [tc-biology, olah-cv]
