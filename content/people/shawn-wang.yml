sections:
  - heading: Career
    paragraphs:
      - text: >-
          Shawn Wang, known as swyx, worked in finance as a currency options trader and then as a
          technology, media, and telecom hedge fund analyst before moving into software. swyx then
          held developer-experience roles at Netlify, Amazon Web Services, Temporal, and Airbyte,
          and helped run the React subreddit and grow the Svelte Society community.
        source_ids: [about]
      - text: >-
          Most of swyx's current work spans Latent Space, AI Engineer, and Cognition. AI Engineer
          brings together people turning new AI capabilities into working software through
          conferences, expos, and workshops.
        source_ids: [about]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Latent Space is a technical newsletter, podcast, and community for AI engineers, published
          in audio, video, and written formats, with an online Discord and in-person meetups. swyx
          writes for it and holds its conversations about AI and the people building it.
        source_ids: [latent-about, about]
      - text: >-
          swyx's 2018 essay Learn in Public argues for learning by sharing what you know, and the
          2023 essay The Rise of the AI Engineer describes the shift behind much of swyx's current
          work. swyx also collected nontechnical career advice for developers in The Coding Career
          Handbook, now free and open source, and has written technical essays such as The Third Age
          of JavaScript (2020), The Self Provisioning Runtime (2021), and The End of Localhost (2022).
        source_ids: [learn-in-public, rise-ai-engineer, about, third-age-js, self-provisioning, end-of-localhost]
