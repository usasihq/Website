headline: Writer and podcast host at Latent Space, a newsletter and podcast for AI engineers
bio:
  text: >-
    Shawn Wang, who publishes as swyx, is a developer, writer, and community builder who works on
    Latent Space, AI Engineer, and Cognition. Latent Space is a technical newsletter, podcast, and
    community for AI engineers covering how labs build agents, models, and infrastructure. swyx wrote
    The Rise of the AI Engineer and Learn in Public, and is the author of The Coding Career Handbook.
    Earlier, swyx worked on developer experience at Netlify, Amazon Web Services, Temporal, and Airbyte.
  source_ids: [about, latent-about]
  reviewed_at: 2026-10-17
