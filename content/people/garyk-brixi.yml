headline: First-listed author of Evo 2, the genome language model from Arc Institute and Stanford
bio:
  text: >-
    Garyk Brixi trains genome language models in the EvoDesign Lab at Stanford and at Arc Institute. Brixi is
    the first-listed of six authors marked as equal contributors on Evo 2 (Nature, 2026), a model of genomes across
    all domains of life whose 20B and 40B checkpoints Arc Institute publishes, and a co-author of the original
    Evo paper (Science, 2024).
  source_ids: [brixi-site, evo2-paper, hie-cv, evo-paper]
  reviewed_at: 2026-10-22
