sections:
  - heading: Research
    paragraphs:
      - text: >-
          Brixi describes building AI systems for biology and training genome models, working in the
          EvoDesign Lab at Stanford and at Arc Institute. Selected work on Brixi's site includes Evo 2 (Nature,
          2026), Categorical Jacobian (PNAS, 2024), on how protein language models implicitly learn
          coevolution, Phalanx (TMLR, 2026), on sliding-window recurrences for biological models, and Minerva
          (bioRxiv, 2026).
        source_ids: [brixi-site]
      - text: >-
          Brixi is the first-listed author on the Evo 2 paper, one of six authors marked as equal contributors,
          with Brian Hie and Patrick Hsu among the senior authors. Brixi also co-authored the original Evo
          paper (Science, 2024) and a 2026 Science paper on generative design of bacteriophages with a genome
          language model.
        source_ids: [evo2-paper, hie-cv, evo-paper]
