sections:
  - heading: Research
    paragraphs:
      - text: >-
          Michael Carbin leads MIT's Programming Systems Group, which studies the design, semantics,
          and implementation of language-driven systems that must cope with uncertainty in their
          environment, their implementation, or their execution. Its work ranges from probabilistic
          programming and programming languages for quantum computing to semantics for
          differentiable programming.
        source_ids: [carbin-site]
      - text: >-
          With Jonathan Frankle, Carbin proposed the Lottery Ticket Hypothesis in 2018, which won a
          Best Paper Award at ICLR 2019. Later papers with Frankle, Gintare Karolina Dziugaite, and
          Daniel M. Roy connected lottery tickets to linear mode connectivity and examined pruning
          at initialization.
        source_ids: [lth-paper, lmc-paper, carbin-site]
      - text: >-
          Carbin's group has also applied machine learning to computer systems, including Ithemal for
          estimating code throughput and DiffTune for tuning CPU simulator parameters with learned
          differentiable surrogates.
        source_ids: [ithemal-paper, carbin-site]
  - heading: Teaching and service
    paragraphs:
      - text: >-
          At MIT, Carbin has taught Computer Language Engineering, Dynamic Computer Language
          Engineering, and Computer Systems Engineering. Carbin served as Program Co-Chair of MLSys
          2023 and has served on program committees for POPL, PLDI, OOPSLA, ASPLOS, ICML, and NeurIPS.
        source_ids: [carbin-site]
      - text: >-
          Outside MIT, Carbin is a Senior Fellow and cofounder of Unconventional AI, whose work
          includes co-designing neural hardware and software, and was a founding advisor for
          MosaicML.
        source_ids: [unconv-carbin]
