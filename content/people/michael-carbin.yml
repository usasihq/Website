headline: MIT associate professor heading the Programming Systems Group; co-author of the lottery ticket hypothesis
bio:
  text: >-
    Michael Carbin is an Associate Professor of Electrical Engineering and Computer Science at MIT and
    heads the Programming Systems Group in CSAIL, which studies the design, semantics and
    implementation of language-driven systems, with a focus on systems that operate under
    uncertainty, such as those implemented with neural networks or run on unreliable hardware. Carbin
    is also a Senior Fellow and cofounder
    of Unconventional AI, whose author page notes that Carbin was a founding advisor for MosaicML.
    With Jonathan Frankle, Carbin co-authored "The Lottery Ticket Hypothesis: Finding Sparse,
    Trainable Neural Networks" (2018), which proposes that dense, randomly initialized networks
    contain smaller subnetworks that can be trained in isolation to comparable accuracy.
  source_ids: [carbin-site, unconv-carbin, lth-paper]
  reviewed_at: 2026-10-13
