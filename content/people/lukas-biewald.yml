headline: Co-founder and General Manager of Weights & Biases (part of CoreWeave); founder of CrowdFlower/Figure Eight
bio:
  text: >-
    Lukas Biewald is a co-founder and the General Manager of Weights & Biases, the machine learning
    developer platform that Biewald founded in 2017 with Chris Van Pelt and Shawn Lewis and that
    CoreWeave acquired in May 2025. Biewald earlier founded CrowdFlower, later Figure Eight, to
    address the problem of getting training data for machine learning.
  source_ids: [wandb-about, biewald-site-about, biewald-wandb-post]
  reviewed_at: 2026-10-21
