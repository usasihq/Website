sections:
  - heading: Career
    paragraphs:
      - text: >-
          Rush worked as a researcher at the Ethereum Foundation on consensus algorithms, then founded Mito and
          served as its CEO, building Python tooling used at large banks. Rush is now the chief technology
          officer of METR.
        source_ids: [metr-bio, metr-about]
  - heading: Research at METR
    paragraphs:
      - text: >-
          Rush is second author of METR's July 2025 randomized controlled trial on early-2025 AI tools and
          developer productivity, and a co-author of METR's 2025 study measuring AI ability to complete long
          software tasks. Later METR work with Rush includes a 2026 analysis finding that many SWE-bench
          Verified pull requests that pass tests would not be merged by maintainers, a proposed
          "expenditure horizon" measure of agents' optimization ability, and a per-action monitor for safer
          evaluations.
        source_ids: [devprod-paper, longtasks-paper, metr-bio]
