headline: CTO of METR; previously founder and CEO of the Python tooling company Mito
bio:
  text: >-
    Nate Rush is the chief technology officer of METR (Model Evaluation and Threat Research). Rush previously
    founded Mito, serving as its CEO and building Python tooling, and before that worked as a researcher at
    the Ethereum Foundation on consensus algorithms. Rush is second author of METR's 2025 randomized
    controlled trial on how early-2025 AI tools affected experienced open-source developers' productivity.
  source_ids: [metr-bio, metr-about, devprod-paper]
  reviewed_at: 2026-10-22
