headline: YouTube channel, podcast, and newsletter covering the arrival of smarter-than-human AI
bio:
  text: >-
    AI Explained is a YouTube channel covering news about the arrival of smarter-than-human AI, and
    its channel page describes its author as the author of Simple Bench, a reasoning benchmark for
    language models. AI Explained also publishes the AI Explained Official Podcast on the same
    subject and the Signal to Noise newsletter on beehiiv. The channel page also lists AI Explained
    as the solo developer of LM Council, a site for comparing frontier AI systems side by side.
  source_ids: [channel, podcast, newsletter, simple-bench, lm-council]
