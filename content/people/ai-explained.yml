sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          The AI Explained YouTube channel, which joined YouTube in January 2023, covers news about the arrival of
          smarter-than-human AI. Since 2024 AI Explained has also published the AI Explained Official
          Podcast on the same subject, whose episodes discuss recent model releases, research papers and AI security.
        source_ids: [channel, podcast]
      - text: >-
          AI Explained also writes Signal to Noise, a newsletter on beehiiv that offers free and premium updates on
          AI; its archive includes posts such as "The 3rd Era of AI Language Models" from September 2024.
        source_ids: [newsletter]
  - heading: Benchmarks and tools
    paragraphs:
      - text: >-
          The channel page names AI Explained as the author of SimpleBench, a multiple-choice text benchmark on
          which people with high-school knowledge outperform frontier language models. Its questions cover
          spatio-temporal reasoning, social intelligence and trick questions, and the SimpleBench team publishes a
          report, a leaderboard, a public dataset and MIT-licensed evaluation code.
        source_ids: [channel, simple-bench, simple-bench-repo]
      - text: >-
          AI Explained is also listed as the solo developer of LM Council, a site for comparing frontier AI systems
          side by side.
        source_ids: [channel, lm-council]
