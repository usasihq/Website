headline: First author of DSPy and ColBERT; Assistant Professor at MIT EECS, where Khattab leads the OASYS lab
bio:
  text: >-
    Omar Khattab is an Assistant Professor at MIT EECS and a member of CSAIL, where Khattab leads the
    MIT OASYS lab and studies natural language processing and AI systems. Khattab's group builds
    models, algorithms and abstractions for declarative AI programming, retrieval and reasoning, and
    much of the work is released as open-source software, including the ColBERT retrieval model, the
    DSPy framework, the GEPA learning algorithm and Recursive Language Models. Khattab is first author of the
    DSPy paper, and DSPy is published under the MIT license.
  source_ids: [khattab-site, dspy-paper, dspy-repo]
  reviewed_at: 2026-10-13
