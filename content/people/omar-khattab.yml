headline: First author of DSPy and ColBERT; Assistant Professor at MIT EECS, where Khattab leads the OASYS lab
bio:
  text: >-
    Omar Khattab is an Assistant Professor at MIT EECS and a member of CSAIL, where Khattab leads the
    MIT OASYS lab and studies natural language processing and AI systems. Khattab's group builds
    models, algorithms and abstractions for declarative AI programming, retrieval and reasoning, and
    much of the work is released as open-source software, including the ColBERT retrieval model, the
    DSPy framework, the GEPA learning algorithm and Recursive Language Models. Khattab is first author of the
    DSPy paper, and DSPy is published under the MIT license.
  source_ids: [khattab-site, dspy-paper, dspy-repo]
  reviewed_at: 2026-10-13
affiliations:
  - name: Massachusetts Institute of Technology (EECS and CSAIL)
    organization_slug: mit
    role: Assistant Professor (leads the MIT OASYS lab)
    current: true
    source_ids: [khattab-site]
work:
  - name: DSPy
    artifact_slug: dspy
    type: open-source
    url: https://dspy.ai/
    contribution: >-
      First author of "DSPy: Compiling Declarative Language Model Calls into Self-Improving Pipelines"
      (2023), the first entry in the repository's citation section. The stanfordnlp/dspy
      repository is MIT-licensed and describes DSPy as a framework for programming, rather than
      prompting, language models, with algorithms that optimize prompts and weights.
    source_ids: [dspy-paper, dspy-repo, khattab-site]
  - name: ColBERT
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2004.12832
    contribution: >-
      Co-author with Matei Zaharia of the ColBERT paper (SIGIR 2020) and co-first author of ColBERTv2
      (NAACL 2022); Khattab's site describes ColBERT as introducing the late-interaction approach to
      search.
    source_ids: [khattab-site]
  - name: "GEPA: Reflective Prompt Evolution"
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2507.19457
    contribution: >-
      Co-author of the GEPA paper (ICLR 2026, oral), a genetic learning algorithm that improves
      prompts for language model systems by reflecting on feedback in natural language.
    source_ids: [gepa-paper, khattab-site]
