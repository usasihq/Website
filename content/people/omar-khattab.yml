sections:
  - heading: Research
    paragraphs:
      - text: >-
          Omar Khattab's research asks how to program AI systems that are partly specified in natural
          language and whose quality and cost can be tuned with language models. Khattab's group
          develops models, algorithms, abstractions, and benchmarks for declarative AI programming,
          for combining and scaling retrieval and reasoning, and for learning from sparse or verbal
          feedback.
        source_ids: [khattab-site]
      - text: >-
          Khattab's early work centered on retrieval. ColBERT (SIGIR 2020), written with Matei
          Zaharia, introduced late interaction for passage search, and was followed by ColBERTv2,
          the PLAID engine, and the WARP multi-vector retrieval engine, which received a Best Paper
          Award at SIGIR 2025.
        source_ids: [colbert-paper, colbertv2-paper, khattab-site]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Khattab is first author of the Demonstrate-Search-Predict framework (2022) and of DSPy, which compiles declarative
          language model calls into self-improving pipelines and was presented as a spotlight at ICLR
          2024. DSPy is released as an MIT-licensed open-source framework.
        source_ids: [dsp-paper, dspy-paper, dspy-repo, khattab-site]
      - text: >-
          Later open-source projects from Khattab's group include GEPA, a genetic algorithm for
          improving prompts from reflective feedback, and Recursive Language Models, an inference-time
          scaling approach developed with Alex Zhang and Tim Kraska.
        source_ids: [gepa-paper, khattab-site]
  - heading: Teaching
    paragraphs:
      - text: >-
          At MIT, Khattab co-taught Deep Learning with Sara Beery and Kaiming He in Fall 2025 and
          Advanced NLP with Jacob Andreas and Chris Tanner in Spring 2026, and introduced a new subject,
          AI Engineering, for Fall 2026. Khattab leads the MIT OASYS lab, whose former mentees have
          gone on to doctoral programs at Stanford, UC Berkeley, and elsewhere.
        source_ids: [khattab-site]
