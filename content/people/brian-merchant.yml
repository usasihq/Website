headline: Tech journalist who writes the Blood in the Machine newsletter on AI, tech, and labor
bio:
  text: >-
    Brian Merchant is a tech journalist and author who writes Blood in the Machine, a Substack newsletter
    of reporting and essays on AI, technology, labor, and power, named after Brian's book Blood in the
    Machine: The Origins of the Rebellion Against Big Tech. Brian's first book is The One Device: The
    Secret History of the iPhone. Brian writes reports for the AI Now Institute, and was
    previously the technology columnist at the Los Angeles Times and a senior editor at Motherboard.
