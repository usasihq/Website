sections:
  - heading: Career
    paragraphs:
      - text: >-
          Merchant was a senior editor at Motherboard and co-founded Terraform, VICE's speculative fiction
          outlet, before becoming the technology columnist at the Los Angeles Times. The AI Now Institute also
          credits Merchant with founding Automaton, a Gizmodo investigation into AI and work. Merchant now holds a
          journalist role at the AI Now Institute, whose contributor page describes a focus on AI,
          Silicon Valley, labor and power.
        source_ids: [about, bm-site, bm-ainow]
  - heading: Books and reports
    paragraphs:
      - text: >-
          Merchant's first book, The One Device: The Secret History of the iPhone, was published by Little, Brown
          in 2017, followed in 2023 by Blood in the Machine: The Origins of the Rebellion Against Big Tech, a
          history of the Luddite uprising. Merchant and the Terraform team published the anthology Terraform:
          Watch/Worlds/Burn with MCD Books in 2022.
        source_ids: [bm-site, about]
      - text: >-
          For the AI Now Institute, Merchant wrote "AI Generated Business: The Rise of AGI and the Rush to Find a
          Working Revenue Model," published in November 2024.
        source_ids: [bm-ainow]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          The Blood in the Machine newsletter, named after the 2023 book, publishes reporting and essays on AI,
          technology, labor and power, along with interviews and reviews. Its recurring features include the AI
          Killed My Job series and a monthly Critical AI Report for paid subscribers, and the site also hosts a
          podcast.
        source_ids: [about]
