headline: Former AWS vice president for AI, machine learning and data infrastructure services
bio:
  text: >-
    Bratin Saha was Vice President and General Manager of AI, Machine Learning and Data
    Infrastructure at Amazon Web Services; Amazon Science's 2022 retrospective on Amazon
    SageMaker's first five years presents Saha as the AWS vice president for machine learning and
    AI services. Before AWS, Saha was Vice President of Software Infrastructure at NVIDIA.
    DigitalOcean appointed Saha its Chief Product and Technology Officer in June 2024, a post that
    DigitalOcean's June 2026 announcement lists as held by Vinay Kumar. No current role is
    documented in the sources reviewed.
  source_ids: [do-2024, do-2026, science-sagemaker]
