sections:
  - heading: Career
    paragraphs:
      - text: >-
          Bratin Saha was Vice President of Software Infrastructure at NVIDIA before joining Amazon Web
          Services, where Saha became Vice President and General Manager of AI, Machine Learning and Data
          Infrastructure. Amazon Science's 2022 retrospective on Amazon SageMaker's first five years
          presents Saha as the AWS vice president for machine learning and AI services and discusses
          SageMaker's development and tools such as Amazon CodeWhisperer.
        source_ids: [do-2024, science-sagemaker]
      - text: >-
          In June 2024 DigitalOcean announced Saha's appointment as its Chief Product and Technology
          Officer. A June 2026 DigitalOcean announcement names Vinay Kumar as Chief Product and Technology
          Officer, and the sources reviewed do not document a current role for Saha.
        source_ids: [do-2024, do-2026]
