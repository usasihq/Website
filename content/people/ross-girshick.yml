sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ross Girshick was a postdoctoral researcher at UC Berkeley and then worked as a research scientist at Microsoft Research from 2014 to 2015, at FAIR (Facebook,
          later Meta) from 2015 to 2023, and at the Allen Institute for AI from 2023 to 2024, and in late 2024
          co-founded Vercept, which was acquired in early 2026.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Girshick's 2013 R-CNN paper with Jeff Donahue, Trevor Darrell and Jitendra Malik brought deep
          convolutional features to object detection. Girshick followed it with Fast R-CNN in 2015 and co-authored
          Faster R-CNN, which added region proposal networks, later that year.
        source_ids: [rcnn-paper, fast-rcnn-paper, faster-rcnn-paper]
      - text: >-
          At FAIR, Girshick co-authored Mask R-CNN (2017), which extended detection to instance segmentation, and
          Focal Loss for Dense Object Detection (2017). Later work moved toward representation learning and
          segmentation, including Masked Autoencoders Are Scalable Vision Learners (2021), Segment Anything (2023)
          and SAM 2 (2024).
        source_ids: [mask-rcnn-paper, focal-loss-paper, mae-paper, sam-paper, sam2-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Girshick is listed first in the citation entry for Detectron, FAIR's Apache-2.0 object detection system
          written in Python on Caffe2, and among the authors of its successor Detectron2. The original Segment
          Anything repository also lists Girshick among its authors and releases the model under the Apache 2.0
          license.
        source_ids: [detectron-readme, detectron2-readme, sam-readme]
