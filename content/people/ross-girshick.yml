headline: First author of R-CNN and Detectron; co-author of Segment Anything; formerly at FAIR, Microsoft and Ai2
bio:
  text: >-
    Ross Girshick's research interests include algorithms for visual perception, representation
    learning, and the interaction of vision and language. Girshick's site lists research scientist roles at Microsoft Research (2014–2015),
    FAIR at Facebook/Meta (2015–2023), and the Allen Institute for AI (2023–2024), and notes that
    Girshick co-founded Vercept in late 2024, a company acquired in early 2026. Girshick is first
    author of the 2013 R-CNN object detection paper, is listed first in the citation entry for
    Detectron, FAIR's Apache-2.0 detection system, and appears among the authors of its successor
    Detectron2. Girshick is also a co-author of the original Segment Anything paper and of SAM 2.
  source_ids: [homepage, rcnn-paper, detectron-readme, detectron2-readme, sam-paper, sam2-paper]
  reviewed_at: 2026-10-21
