sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before METR, Wijk worked on understanding AI risks and strategy at the Future of Humanity Institute
          and the Centre on Long-Term Risk.
        source_ids: [metr-bio]
      - text: >-
          At METR, Wijk is Chief Scientist and works on threat modeling, aiming to identify which AI
          capabilities may pose catastrophic risk and therefore should be evaluated.
        source_ids: [metr-bio, metr-about]
  - heading: Research
    paragraphs:
      - text: >-
          Wijk is first author of RE-Bench (2024), which measures frontier language model agents' AI R&D
          capabilities against human experts, and a co-author of METR's 2025 study of AI ability to complete
          long software tasks. Recent METR publications with Wijk include MALT (2025), a dataset of behaviors
          that threaten evaluation integrity, early work on monitorability evaluations (2026), and a 2026
          independent investigation of AI agents' behavior in a hacking incident.
        source_ids: [rebench-paper, longtasks-paper, metr-bio]
