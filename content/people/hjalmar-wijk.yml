headline: Chief Scientist at METR, working on threat modeling; first author of the RE-Bench AI R&D evaluation
bio:
  text: >-
    Hjalmar Wijk is Chief Scientist at METR (Model Evaluation and Threat Research), where Wijk works on threat
    modeling to determine which AI capabilities may pose catastrophic risk and should be evaluated. Wijk is
    first author of RE-Bench (2024), which evaluates language model agents' AI research and engineering
    capabilities against human experts.
  source_ids: [metr-bio, metr-about, rebench-paper]
  reviewed_at: 2026-10-22
