sections:
  - heading: Career
    paragraphs:
      - text: >-
          Pedro Cuenca is a machine learning engineer at Hugging Face whose work, according to the author
          bio in Hands-On Generative AI with Transformers and Diffusion Models, centers on diffusion
          software, models and applications. Before Hugging Face, Cuenca was co-founder and CTO of
          LateNiteSoft, working on the technology behind the Camera+ iPhone app, which used custom
          machine learning models for photography enhancement.
        source_ids: [genaibook-readme]
      - text: >-
          The same bio notes that Cuenca created deep-learning models for photography enhancement and
          super-resolution and was involved in the development and operations of DALL·E mini, whose
          README lists Cuenca among its authors.
        source_ids: [genaibook-readme, dalle-mini-readme]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Several of Cuenca's Hugging Face projects bring models to Apple devices. Cuenca wrote the December
          2022 post on using Stable Diffusion with Core ML on Apple Silicon, co-wrote the February 2023
          post introducing the open-source Diffusers app for Mac, and in August 2023 introduced
          swift-transformers, an Apache-2.0 Swift package for running language models on device.
        source_ids: [coreml-sd-blog, mac-diffusers-blog, swift-coreml-diffusers-repo, swift-transformers-blog, swift-transformers-repo]
      - text: >-
          Cuenca is listed among the authors in the citation for Hugging Face's Diffusers library and
          co-authored the Hugging Face launch posts for open models including Llama 2, Gemma and Llama 3.
          In June 2026 Cuenca co-wrote the second part of a Hugging Face series on profiling in PyTorch,
          which walks from nn.Linear to a fused MLP.
        source_ids: [diffusers-readme, llama2-blog, gemma-blog, llama3-blog, hf-profiling-blog]
  - heading: Writing
    paragraphs:
      - text: >-
          Cuenca co-wrote the book Hands-On Generative AI with Transformers and Diffusion Models, whose
          companion repository lists Cuenca among the authors alongside Apolinario Passos and others.
        source_ids: [genaibook-readme]
