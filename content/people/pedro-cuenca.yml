headline: Machine learning engineer at Hugging Face; Diffusers co-author and builder of on-device Swift tools
bio:
  text: >-
    Pedro Cuenca is a machine learning engineer at Hugging Face, according to the author bio of the
    book Hands-On Generative AI with Transformers and Diffusion Models, which Cuenca co-wrote, and a
    co-author of a June 2026 Hugging Face blog post on profiling in PyTorch. Cuenca is listed among
    the authors in the citation for Hugging Face's open-source Diffusers library. On Hugging Face's blog, Cuenca introduced swift-transformers, a
    package for running language models on Apple devices, and co-wrote the post on the open-source
    Diffusers app for Mac, which runs Stable Diffusion locally through Core ML. Cuenca also appears in
    the author list of the DALL·E mini project.
  source_ids: [genaibook-readme, hf-profiling-blog, diffusers-readme, swift-transformers-blog, mac-diffusers-blog, dalle-mini-readme]
  reviewed_at: 2026-10-13
