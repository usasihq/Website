sections:
  - heading: Career
    paragraphs:
      - text: >-
          Assran completed a PhD in electrical and computer engineering at McGill University and Mila,
          supported by a Vanier Scholarship, with earlier work on parallelizing deep reinforcement learning
          and large-scale numerical optimization. Assran then worked as a research scientist in Meta FAIR on
          self-supervised learning from video for reasoning and planning in the physical world.
        source_ids: [meta-assran, assran-site]
      - text: >-
          Assran's site now describes Assran as a scientist and member of technical staff on the founding
          team of Advanced Machine Intelligence (AMI). At Meta, Assran was also program lead of the Meta AI
          Mentorship Program for doctoral students.
        source_ids: [assran-site]
  - heading: JEPA research
    paragraphs:
      - text: >-
          Assran was first author of I-JEPA (January 2023), which learns image representations by predicting
          in latent space, and co-authored V-JEPA (February 2024), with Adrien Bardes as first author. Assran also co-authored DINOv2 and work on learning and leveraging world models in visual
          representation learning (ICML 2024).
        source_ids: [ijepa-paper, vjepa-paper, assran-site]
      - text: >-
          Assran is first author of V-JEPA 2 (June 2025), on self-supervised video models for understanding,
          prediction and planning, and a co-author of V-JEPA 2.1 (March 2026), which targets dense features
          in video self-supervised learning.
        source_ids: [vjepa2-paper, vjepa21-paper]
