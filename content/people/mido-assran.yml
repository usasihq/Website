headline: Scientist at Advanced Machine Intelligence (AMI); first author of V-JEPA 2 and I-JEPA from Meta FAIR
bio:
  text: >-
    Mahmoud (Mido) Assran is a scientist and member of technical staff on the founding team of Advanced
    Machine Intelligence (AMI), and was previously a research scientist in Meta's Fundamental AI Research
    (FAIR) lab. Assran works on self-supervised learning and world models built on Joint-Embedding
    Predictive Architectures (JEPA), and is first author of I-JEPA (2023) and of V-JEPA 2 (2025).
  source_ids: [assran-site, meta-assran, ijepa-paper, vjepa2-paper]
  reviewed_at: 2026-10-22
