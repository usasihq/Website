sections:
  - heading: Career
    paragraphs:
      - text: >-
          Wang previously interned at Tencent (2020, distributed deep learning), ByteDance (2021, the
          lightseq library), Microsoft (2022, unit-test generation) and Google Research (2023, multimodal
          LLM pre-training).
        source_ids: [xw-site]
      - text: >-
          Wang co-founded All Hands AI to build OpenHands and serves as its Chief AI Officer, while
          completing a PhD at UIUC with Heng Ji. Wang's stated interest is AI that improves itself from
          real-world use, including turning user interactions into supervision for models.
        source_ids: [xw-site, oh-about]
  - heading: Research
    paragraphs:
      - text: >-
          Wang's CodeAct paper (2024) proposed executable code as a unified action space for LLM agents.
          Wang was then first author of the 2024 OpenHands paper, describing an open platform for AI
          software developers, and of the 2025 paper on the OpenHands Software Agent SDK.
        source_ids: [codeact-paper, oh-paper, oh-sdk-paper]
