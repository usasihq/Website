headline: Co-founder and Chief AI Officer of All Hands AI; first author of the OpenHands and CodeAct papers
bio:
  text: >-
    Xingyao Wang is a co-founder of All Hands AI, which builds the open-source software agent
    OpenHands, and is listed on the company's team page as Chief AI Officer. Wang is also a computer
    science PhD candidate at the University of Illinois Urbana-Champaign advised by Heng Ji. Wang
    is first author of the OpenHands paper, the CodeAct paper on executable code actions for LLM
    agents, and the OpenHands Software Agent SDK paper.
  source_ids: [xw-site, oh-about, oh-paper, codeact-paper, oh-sdk-paper]
  reviewed_at: 2026-10-22
