sections:
  - heading: Career
    paragraphs:
      - text: >-
          Benaich earned an MPhil and PhD in computational and experimental cancer research at the University of
          Cambridge and has published research using experimental and computational methods to study how cancer
          spreads through the body. In the State of AI Report, Benaich traces an interest in AI to that doctoral
          work in the early 2010s and writes of investing in companies that build and apply AI since 2013.
        source_ids: [site, report]
      - text: >-
          Benaich founded and is general partner of Air Street Capital, a venture firm investing in AI-first
          companies. Benaich also founded the Research and Applied AI Summit (RAAIS), a community for
          entrepreneurs and researchers, serves as managing trustee of the RAAIS Foundation, a charity that
          funds open-source projects, research and education in AI, and leads Spinout.fyi, a research initiative
          on university spinout creation.
        source_ids: [site]
  - heading: Writing
    paragraphs:
      - text: >-
          Benaich co-authors the annual State of AI Report with Air Street Capital; the 2026 edition is the ninth
          and covers frontier models, agents, AI for science, robotics and world models, and the industry around
          them. Each edition makes predictions and later grades them. Benaich also writes essays on AI progress,
          playbooks and geopolitics on Air Street Press and a monthly newsletter, the Guide to AI.
        source_ids: [report, site]
