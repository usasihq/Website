headline: Co-author of the annual State of AI Report and founder of Air Street Capital
bio:
  text: >-
    Nathan Benaich co-authors the State of AI Report, an annual report on AI research, industry, policy,
    and safety published with Air Street Capital, whose 2026 edition is the ninth. Nathan also writes
    essays on AI progress and geopolitics on Air Street Press and the monthly Guide to AI newsletter. Nathan
    is the founder and general partner of Air Street Capital, a venture firm investing in AI-first
    companies, and founded the Research and Applied AI Summit (RAAIS). Nathan holds a PhD in computational
    and experimental cancer research from the University of Cambridge.
