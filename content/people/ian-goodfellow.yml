headline: First author of the Generative Adversarial Networks paper and co-author of the Deep Learning textbook
bio:
  text: >-
    Ian Goodfellow is first author of the 2014 paper "Generative Adversarial Networks", which
    introduced training a generative model and a discriminative model in competition with each
    other, and wrote the MIT Press textbook Deep Learning with Yoshua Bengio and Aaron Courville;
    the book's online version is free to read. A 2023 Eindhoven University of Technology
    lecture page listed Goodfellow as a Principal Scientist at Google DeepMind, described work as a
    research scientist at Google and OpenAI contributing to machine learning security and privacy,
    and noted service as Director of Machine Learning in Apple's Special Project Group.
    Goodfellow is also a co-author of the 2012 paper on Theano's new features and speed
    improvements.
  source_ids: [gan-paper, dl-book, tue-bio, theano-paper]
  reviewed_at: 2026-10-21
