sections:
  - heading: Career
    paragraphs:
      - text: >-
          A 2023 Eindhoven University of Technology lecture biography says Goodfellow began AI research at the
          Stanford AI Lab as an undergraduate working with Andrew Ng and completed a PhD in machine learning at
          the Université de Montréal, co-advised by Yoshua Bengio and Aaron Courville. The same biography
          describes later work as a research scientist at Google and OpenAI, service as Director of Machine
          Learning in Apple's Special Project Group, and, at the time of the 2023 Holst Memorial Lecture, a
          position as Principal Scientist at Google DeepMind.
        source_ids: [tue-bio]
  - heading: Research
    paragraphs:
      - text: >-
          Goodfellow's early papers include "Maxout Networks" (2013) as first author, the Theano paper on the
          Python library's new features as a co-author, and, as first author, the 2014 "Generative Adversarial
          Networks" paper, which trains a generator and a discriminator against each
          other. Goodfellow was also first author of a 2013 paper on recognizing multi-digit numbers in Google
          Street View images.
        source_ids: [maxout-paper, theano-paper, gan-paper, street-view-paper]
      - text: >-
          The Eindhoven biography says that as a research scientist at Google and OpenAI, Goodfellow
          contributed to machine learning security and privacy. Goodfellow
          co-authored "Intriguing properties of neural networks" (2013), which described adversarial examples,
          and was first author of "Explaining and Harnessing Adversarial Examples" (2014). Goodfellow also
          co-authored the CleverHans adversarial examples library, the PATE approach to learning from private
          training data, and "Improved Techniques for Training GANs" (2016).
        source_ids: [intriguing-paper, adversarial-paper, cleverhans-paper, pate-paper, improved-gans-paper, tue-bio]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          With Yoshua Bengio and Aaron Courville, Goodfellow wrote Deep Learning, a 2016 MIT Press textbook
          whose full text is available to read online for free. Goodfellow's 2023 Holst Memorial Lecture at
          Eindhoven, "Generative AI: Past, Present, and Future", asked how research on generative models evolved
          into the generative AI of today.
        source_ids: [dl-book, tue-bio]
