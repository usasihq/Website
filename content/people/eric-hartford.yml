sections:
  - heading: Open models
    paragraphs:
      - text: >-
          Eric Hartford introduced Samantha, a series of fine-tuned chat models released on Hugging
          Face in several sizes, and announced Dolphin, an open dataset and series of instruction-tuned
          language models modeled on the approach of Microsoft's Orca paper. Hartford's announcement
          says each Dolphin model is released under the license of the base model it is trained on.
        source_ids: [samantha-post, dolphin-post]
      - text: >-
          The Dolphin project's Hugging Face organization, which lists Hartford as a team member,
          continues to publish Dolphin fine-tunes of open-weight base models. Dolphin X1 Trinity Nano,
          for example, is built on Arcee AI's Trinity Nano and released under the Apache 2.0 license.
        source_ids: [dphn-org, dolphin-trinity-card]
  - heading: Quixi.AI
    paragraphs:
      - text: >-
          Hartford founded Quixi.AI, which its site describes as an independent AI lab building a
          private-AI stack layer by layer. Its projects include QuixiCore, a set of native kernel
          libraries for several hardware backends; SlimServe, an inference engine for a curated set of
          open models; Hexis, a Postgres-based cognitive architecture; and With, a systems programming
          language.
        source_ids: [quixi-site]
      - text: >-
          The site says Hartford previously worked at Microsoft, AWS and eBay, and that Quixi.AI
          offers commissioned model training and data curation. Hartford is also writing a book on
          local and on-premises AI.
        source_ids: [quixi-site]
