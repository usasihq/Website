headline: Founder of Quixi.AI and creator of the Dolphin and Samantha open models; formerly at Microsoft and AWS
bio:
  text: >-
    Eric Hartford is the founder of Quixi.AI, which its site describes as an independent AI lab
    building a private-AI stack, and the site says Hartford created the Dolphin and
    Samantha open models. Dolphin's Hugging Face organization lists Hartford as a team member and
    publishes Dolphin fine-tunes of open-weight base models, such as Dolphin X1 Trinity Nano, built
    on Arcee AI's Trinity Nano and released under the Apache 2.0 license. Quixi.AI's projects also
    include SlimServe, an inference engine for a curated set of open models. The site says Hartford
    previously worked at Microsoft, AWS and eBay.
  source_ids: [quixi-site, dphn-org, dolphin-trinity-card]
