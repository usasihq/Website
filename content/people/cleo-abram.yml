sections:
  - heading: Work at Vox
    paragraphs:
      - text: >-
          Abram's Vox author page lists Abram as a video producer whose stories explain technology and
          economics and how systems work. At Vox, Abram was a producer on the Netflix series Explained, a
          host and producer of the YouTube Originals show Glad You Asked, and host of Answered, the first
          daily show at Vox.
        source_ids: [vox-author, channel]
      - text: >-
          Abram's Vox videos run from a May 2018 explainer on blockchain collectibles, made with Mallory
          Brangan, to an October 2021 video on why nuclear power plants were shutting down.
        source_ids: [vox-author-archive, vox-author]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Huge If True is an optimistic show about using science and technology to improve the future, and
          each episode looks closely at one innovation. Past episodes cover humanoid robots at Boston
          Dynamics, supersonic aircraft at NASA, quantum computers at IBM and the Large Hadron Collider at
          CERN.
        source_ids: [show-site, channel]
      - text: >-
          The YouTube channel also carries short science explainers; uploads in October 2026 cover topics
          such as clouds, the ozone layer, the age of sharks and that year's Nobel Prize in Physics.
        source_ids: [youtube-feed]
