headline: Video journalist who produces Huge If True, an optimistic show about science and technology
bio:
  text: >-
    Cleo Abram is a video journalist who produces Huge If True, a show about how science and
    technology could make the future better. Each episode looks in depth at one innovation, with
    past episodes covering humanoid robots at Boston Dynamics, supersonic planes at NASA, quantum
    computers at IBM, and the Large Hadron Collider at CERN. The show is published on YouTube. Before Huge If True, Cleo Abram was a video producer
    at Vox, hosted the Vox daily show Answered, co-hosted the Vox YouTube Originals show Glad You
    Asked, and directed for Explained on Netflix.
  source_ids: [channel, show-site]
  reviewed_at: 2026-10-21
