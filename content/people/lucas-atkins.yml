headline: Arcee AI author of the Trinity model launch posts and co-author of the Arcee Trinity Large technical report
bio:
  text: >-
    Lucas Atkins writes Arcee AI's model announcements, including the posts that introduced AFM-4.5B,
    Trinity Mini, Trinity Large and Trinity-Large-Thinking, and is the final listed author of the
    Arcee Trinity Large Technical Report (2026). Atkins co-authored Arcee's Genesis-Science-1
    announcement in 2026.
  source_ids: [arcee-afm-launch, arcee-trinity-manifesto, arcee-trinity-large, arcee-tlt, trinity-report, arcee-genesis]
  reviewed_at: 2026-10-22
