    type: open-weights
    url: https://www.arcee.ai/blog/the-trinity-manifesto
    contribution: >-
      Wrote "The Trinity Manifesto", Arcee AI's December 2025 post introducing Trinity Mini and Trinity
      Nano Preview.
    source_ids: [arcee-trinity-manifesto]
  - name: Trinity-Large-Thinking
    artifact_slug: trinity-large-thinking
    type: open-weights
    url: https://www.arcee.ai/blog/trinity-large-thinking
    contribution: >-
      Wrote Arcee AI's April 2026 post announcing Trinity-Large-Thinking, a reasoning model released on
      Arcee's API with weights on Hugging Face under the Apache 2.0 license.
    source_ids: [arcee-tlt]
links: []
sections:
  - heading: Work at Arcee AI
    paragraphs:
      - text: >-
          Atkins wrote Arcee AI's July 2025 post taking AFM-4.5B out of preview and releasing the weights of
          AFM-4.5B and AFM-4.5B-Base on Hugging Face. In December 2025, Atkins wrote "The Trinity Manifesto",
          which explained Arcee's move into pretraining its own models and introduced Trinity Mini and Trinity
          Nano Preview.
        source_ids: [arcee-afm-launch, arcee-trinity-manifesto]
      - text: >-
          Atkins's January 2026 post on Trinity Large described its architecture, sparsity and training at
          scale, and the April 2026 post announced Trinity-Large-Thinking, a reasoning checkpoint aimed at
          multi-turn tool calling and long-running agent loops. With Mark McQuade, Atkins co-authored Arcee's
          July 2026 post on Genesis-Science-1, an open model for scientific research developed with the U.S.
          Department of Energy.
        source_ids: [arcee-trinity-large, arcee-tlt, arcee-genesis]
  - heading: Research
    paragraphs:
      - text: >-
          Atkins is the final listed author of the Arcee Trinity Large Technical Report (February 2026), whose
          author list also includes Mark McQuade and contributors from DatologyAI and Prime Intellect. Earlier,
          Atkins co-authored "Spectrum: Targeted Training on Signal to Noise Ratio" (2024) and a 2024 study on
          domain adaptation of Llama-3-70B-Instruct through continual pre-training and model merging.
        source_ids: [trinity-report, spectrum-paper, domain-adaptation-paper]
