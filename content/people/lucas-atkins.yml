    artifact_slug: trinity
    type: open-weights
    url: https://arxiv.org/abs/2602.17004
    contribution: >-
      Final listed author of the Arcee Trinity Large Technical Report, which covers Trinity Large, a sparse
      Mixture-of-Experts model with 400B total parameters, along with Trinity Nano and Trinity Mini.
    source_ids: [trinity-report]
  - name: Trinity Mini
