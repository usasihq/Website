sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Patrick von Platen is a co-author of the 2019 paper introducing Hugging Face's Transformers
          library and the first listed author in the 2022 citation entry for Diffusers, Hugging Face's
          library of pretrained diffusion models. In vLLM's CODEOWNERS file, von Platen is the owner of
          the Mistral-specific files, including model code for Mistral, Mixtral, Pixtral and Voxtral.
        source_ids: [transformers-paper, diffusers-readme, diffusers-citation, vllm-codeowners]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          On the Hugging Face blog, von Platen wrote a 2020 guide to decoding methods for text
          generation with Transformers, including greedy search, beam search and sampling, and a 2021
          tutorial on fine-tuning Wav2Vec2 for English speech recognition. In August 2022 von Platen
          co-authored the blog post introducing Stable Diffusion in Diffusers.
        source_ids: [hf-blog-generate, hf-blog-wav2vec2, hf-blog-stable-diffusion]
  - heading: Research at Mistral AI
    paragraphs:
      - text: >-
          Von Platen is listed in "The Mistral AI Team" on the Mistral NeMo model card and is an
          author of Mistral AI's Voxtral speech-understanding paper (2025). Von Platen also appears
          among the contributors to the Ministral 3 technical report (2026).
        source_ids: [mistral-nemo-card, voxtral-paper, ministral3-paper]
