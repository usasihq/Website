headline: First listed author of Hugging Face Diffusers; vLLM code owner for Mistral models
bio:
  text: >-
    Patrick von Platen is the first listed author of Diffusers, Hugging Face's Apache-2.0 library
    of pretrained diffusion models for inference and training, and a co-author of the 2019 paper
    that introduced Hugging Face's Transformers library. Von Platen is listed in "The Mistral AI
    Team" on the Mistral NeMo model card and among the contributors to Mistral AI's Ministral 3
    technical report (2026). In vLLM's CODEOWNERS file, von Platen owns the Mistral-specific files,
    including the model code for Mistral, Mixtral, Pixtral, and Voxtral.
  source_ids: [diffusers-readme, diffusers-citation, transformers-paper, mistral-nemo-card, ministral3-paper, vllm-codeowners]
  reviewed_at: 2026-10-21
