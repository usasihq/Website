      As CTO, works on the technical side of the open repository of web crawl data that Common Crawl has
      collected since 2008 and publishes roughly once a month.
    source_ids: [cc-team, cc-about]
links:
  - label: Common Crawl team
    url: https://commoncrawl.org/team
sections:
  - heading: Common Crawl
    paragraphs:
      - text: >-
          Common Crawl's team page lists Lindahl as CTO, alongside Executive Director Rich Skrenta. The
          foundation's crawler, CCBot, is based on Apache Nutch, and its data is released in WARC, WAT and
          WET formats together with URL and CDXJ indexes and host- and domain-level web graphs.
        source_ids: [cc-team, cc-about]
  - heading: Datasets and writing
    paragraphs:
      - text: >-
          In April 2025 Lindahl announced a public test of the Host Index, which gathers per-host summaries
          from the crawl, its indexes, the web graph and raw crawler logs, and can be queried with SQL tools
          such as Amazon Athena or DuckDB. A July 2026 post by Lindahl explains why counting a site's pages
          in Common Crawl is harder than it looks, using CrawlDb states from the Nutch crawler.
        source_ids: [cc-host-index, cc-coverage]
      - text: >-
          Lindahl also compiled the foundation's December 2025 roundup of a dozen research papers from that
          year that use or reference Common Crawl data.
        source_ids: [cc-sampling]
