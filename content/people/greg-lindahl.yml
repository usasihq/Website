headline: Chief Technology Officer of the Common Crawl Foundation, which publishes an open web crawl archive
bio:
  text: >-
    Greg Lindahl is the Chief Technology Officer of the Common Crawl Foundation, the nonprofit that
    crawls the web and makes its archives and datasets freely available. Lindahl is the author of
    several of Common Crawl's technical posts, including the announcement of the Host Index dataset and an explainer on
    measuring how much of a website the crawl has covered.
  source_ids: [cc-team, cc-about, cc-host-index, cc-coverage]
  reviewed_at: 2026-10-21
