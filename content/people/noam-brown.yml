headline: OpenAI research scientist working on reasoning; creator of Libratus and Pluribus; CICERO co-author
bio:
  text: >-
    Noam Brown is a Research Scientist at OpenAI, working on reasoning, reinforcement learning,
    self-play and multi-agent AI, and describes being a foundational contributor to OpenAI's
    reasoning models such as o1; Brown is also an author of the OpenAI o1 System Card. Before
    OpenAI, Brown worked at FAIR (Meta) and is a corresponding author of the Science paper introducing
    CICERO, an agent that plays the negotiation game Diplomacy by combining a language model with
    strategic reasoning. With a Carnegie Mellon advisor, Brown created the poker AIs Libratus and
    Pluribus.
