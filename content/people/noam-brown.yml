sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before graduate school, Brown worked in algorithmic trading from 2006 to 2010 and was a research
          assistant at the Federal Reserve Board from 2010 to 2012, studying algorithmic trading in financial
          markets. Brown then earned an MS in robotics (2014) and a PhD in computer science (2020) at Carnegie
          Mellon University, both advised by Tuomas Sandholm.
        source_ids: [brown-cv, brown-site]
      - text: >-
          Brown was a research scientist at Facebook AI Research from 2018 to 2023, after a 2017 research
          internship at DeepMind, and joined OpenAI in 2023. At OpenAI, Brown works on reasoning,
          reinforcement learning, self-play and multi-agent AI, and is listed among the authors of the o1 and
          GPT-5 system cards.
        source_ids: [brown-cv, brown-site, o1-system-card]
  - heading: Research
    paragraphs:
      - text: >-
          Brown's graduate research with Sandholm focused on imperfect-information games. With Sandholm, Brown built
          Libratus, described in a 2017 Science paper on beating professional players at heads-up no-limit poker,
          and Pluribus, the subject of a 2019 Science cover article on multiplayer poker. "Safe and Nested
          Subgame Solving for Imperfect-Information Games" won a NeurIPS 2017 best paper award.
        source_ids: [brown-cv, brown-site]
      - text: >-
          At FAIR, Brown's work combined search and learning, including Deep Counterfactual Regret Minimization
          (ICML 2019) and "Combining Deep Reinforcement Learning and Search for Imperfect-Information Games"
          (NeurIPS 2020). Work on Diplomacy included no-press Diplomacy agents (2021–2023) and CICERO,
          which combined a language model with strategic reasoning and was published in Science in 2022.
        source_ids: [brown-cv, cicero-paper]
