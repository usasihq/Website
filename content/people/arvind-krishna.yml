sections:
  - heading: Career
    paragraphs:
      - text: >-
          IBM's executive biography describes a career of about 30 years at the company. As general
          manager of the development and manufacturing organization in IBM Systems and Technology Group,
          Arvind Krishna led the strategy for data-centric systems and for the adoption of open and
          collaborative technology standards.
        source_ids: [ibm-bio]
      - text: >-
          Krishna later headed IBM Research, where the biography credits work across artificial
          intelligence, quantum computing, blockchain, cloud platform services, and nanotechnology.
          Krishna then served as senior vice president of Cloud and Cognitive Software, building IBM's
          hybrid cloud business and reshaping its software portfolio for cloud.
        source_ids: [ibm-bio]
      - text: >-
          As Chairman, President and Chief Executive Officer, Krishna is listed first on IBM's senior
          leadership page, alongside the Director of IBM Research and the CEO of Red Hat. The biography
          says Krishna has led IBM's expansion into artificial intelligence, cloud, quantum computing,
          and blockchain.
        source_ids: [ibm-senior-leadership, ibm-bio, ibm-newsroom-leadership]
  - heading: Research
    paragraphs:
      - text: >-
          IBM's biography lists scientific contributions by Krishna in wireless networking, security,
          systems, and databases. It also credits Krishna with founding IBM's security software business
          and with helping create a commercial wireless system.
        source_ids: [ibm-bio]
