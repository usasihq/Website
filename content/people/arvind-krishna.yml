headline: Chairman, President and CEO of IBM; earlier led IBM Research and IBM's Cloud and Cognitive Software unit
bio:
  text: >-
    Arvind Krishna is the Chairman, President and Chief Executive Officer of IBM, as listed on IBM's
    senior leadership page and newsroom biography. IBM's biography describes a long career at the
    company that included heading IBM Research, serving as senior vice president of Cloud and Cognitive
    Software, and serving as general manager of the development and manufacturing organization of IBM
    Systems and Technology Group. It credits Krishna with driving IBM's acquisition of Red Hat, founding IBM's security software
    business, and scientific contributions in wireless networking, security, systems, and databases.
  source_ids: [ibm-bio, ibm-senior-leadership, ibm-newsroom-leadership]
  reviewed_at: 2026-10-21
