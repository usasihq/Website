headline: First author of SoundStream and co-author of AudioLM at Google Research; Audio Research Advisor at Kyutai
bio:
  text: >-
    Neil Zeghidour is listed as Audio Research Advisor on Kyutai's team page, and Zeghidour's GitHub
    profile describes AI research at Kyutai. As a research scientist at Google Research, Zeghidour
    was first author of SoundStream, an end-to-end neural audio codec presented on the Google
    Research blog in 2021, and a co-author of AudioLM, a language-modeling approach to audio
    generation presented there in 2022. Zeghidour is also a co-author of the Moshi speech-text
    foundation model paper from Kyutai.
