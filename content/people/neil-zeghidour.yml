sections:
  - heading: Research at Google
    paragraphs:
      - text: >-
          As a research scientist at Google Research, Zeghidour worked on learned audio representations and
          generation. Zeghidour was first author of LEAF, a learnable frontend for audio classification posted
          in January 2021, and of SoundStream, an end-to-end neural audio codec that the Google Research blog
          introduced later that year.
        source_ids: [leaf-paper, soundstream-paper, soundstream-blog]
      - text: >-
          Zeghidour was also the last author of AudioLM, which treats audio generation as a language-modeling
          task over discrete audio tokens, and co-wrote the 2022 Google Research blog post presenting it with
          Zalán Borsos.
        source_ids: [audiolm-paper, audiolm-blog]
  - heading: Kyutai
    paragraphs:
      - text: >-
          Kyutai's team page lists Zeghidour as Audio Research Advisor. Zeghidour is the last author of the
          2024 Moshi paper, which describes a speech-text foundation model for real-time spoken dialogue, and
          of the 2025 paper on Hibiki, a model for high-fidelity simultaneous speech-to-speech translation.
          Zeghidour's GitHub profile pins the kyutai-labs repositories for Moshi and Hibiki.
        source_ids: [kyutai-team, moshi-paper, hibiki-paper, github-profile]
