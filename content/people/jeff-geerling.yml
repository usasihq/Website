headline: Developer, author, and YouTube creator covering Linux, Raspberry Pi, Ansible, and open-source infrastructure
bio:
  text: >-
    Jeff Geerling is a developer, author, and maker who publishes a YouTube channel and a blog, and
    describes deep involvement in open-source communities around Linux, Ansible, Raspberry Pi, and
    Drupal. Jeff's books include Ansible for DevOps, Ansible for Kubernetes, and Kubernetes 101.
    Jeff has been owner and president of Midwestern Mac, LLC since 2009, and earlier roles include
    technical consultant at Ansible by Red Hat and senior technical architect at Acquia.
