sections:
  - heading: Career
    paragraphs:
      - text: >-
          Geerling has been owner and president of Midwestern Mac, LLC since 2009. Earlier roles listed on Geerling's site include chief technical
          officer of Flocknote (2011–2013), senior application developer at Mercy (2013–2014), senior
          technical architect at Acquia (2014–2019) and technical consultant at Ansible by Red Hat
          (2019–2021).
        source_ids: [about, ansible-devops-site]
  - heading: Books and open-source work
    paragraphs:
      - text: >-
          Geerling has used Ansible to manage infrastructure since early 2013 and wrote Ansible for DevOps,
          now in its second edition, which teaches server provisioning and configuration management from
          inventory files and ad-hoc commands through playbooks, deployments and Docker orchestration. The
          book's manuscript and example code are open source, with the text under a CC BY-SA license, and it
          is updated several times a year.
        source_ids: [ansible-devops-site, books]
      - text: >-
          Ansible for Kubernetes follows the use of Ansible to build Kubernetes clusters and deploy and
          maintain applications on them; Geerling has worked with Kubernetes since 2017. Geerling also wrote
          Kubernetes 101 and is involved in the Linux, Ansible, Raspberry Pi and Drupal communities.
        source_ids: [ansible-k8s-site, books, about]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Geerling publishes videos on the Jeff Geerling YouTube channel and long-form posts on
          jeffgeerling.com. Recent 2026 blog posts cover single-board computers such as the Raspberry Pi 5
          and Radxa Q8B, homelab networking, time servers and NTP, and a PHP security vulnerability.
        source_ids: [channel, blog]
