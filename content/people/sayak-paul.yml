headline: Works on diffusion models at Hugging Face and is a listed author of the Diffusers library
bio:
  text: >-
    Sayak Paul works on diffusion models at Hugging Face, according to Paul's homepage and GitHub
    profile. Paul is one of the listed authors of Diffusers, Hugging Face's Apache-2.0 library that
    provides pretrained diffusion models across modalities and a modular toolbox for inference and
    training. Paul's site lists recent research on probabilistic alignment in video generation
    models and an ECCV 2026 tutorial, organized by Paul, on post-training diffusion models.
  source_ids: [paul-site, github-profile, diffusers-readme, diffusers-citation]
  reviewed_at: 2026-10-21
