sections:
  - heading: Career
    paragraphs:
      - text: >-
          Paul's timeline begins with software engineering roles at Tata Consultancy Services and TCS Research
          and Innovation in 2017 and 2018, followed by work as a contract data science instructor at DataCamp
          (2018 to 2019) and as a deep learning associate at PyImageSearch (2019 to 2021). Paul was then a founding machine
          learning engineer at Carted from 2021 to 2022.
        source_ids: [paul-about]
      - text: >-
          Paul joined Hugging Face in October 2022 as a developer advocate engineer, became a machine learning
          engineer in July 2023, and has been a senior research engineer since March 2026. The work centres on
          diffusion models for image and video generation, including contributing features to and maintaining
          the Diffusers library, training diffusion models, and helping look after the Kernels project.
        source_ids: [paul-about, paul-site, diffusers-citation]
  - heading: Open-source work and research
    paragraphs:
      - text: >-
          Before Diffusers, Paul contributed to Keras, KerasCV, Hugging Face Transformers, TensorFlow Hub, Keras
          Examples, TensorFlow Addons and Neural Structured Learning, and has also contributed to Accelerate,
          Optimum Quanto and PEFT. With Pin-Yu Chen, Paul wrote "Vision Transformers are Robust Learners" (2021).
        source_ids: [paul-about, vit-robust-paper]
      - text: >-
          Paul's research interests have moved from representation learning toward diffusion models, including
          alignment, test-time scaling and controlled generation. Paul's conference tutorials cover
          adversarial robustness (CVPR 2021), robustness of foundation models (NeurIPS 2022), attention in vision
          transformers (CVPR 2023) and post-training diffusion models (ECCV 2026), and Paul has given talks on
          diffusion models at universities including Stanford's CS25 course in 2025.
        source_ids: [paul-research, paul-site]
