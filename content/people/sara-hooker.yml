headline: Co-founder and CEO of Adaption; author of The Hardware Lottery and last author of the Aya model paper
bio:
  text: >-
    Sara Hooker is the co-founder and CEO of Adaption, which builds adaptive AI systems that keep
    learning, with a platform for custom model training, data optimization and continuous learning
    at inference. Hooker wrote "The Hardware Lottery" (2020) with a Google Research, Brain Team
    affiliation; the essay describes how research ideas can succeed because they suit the available
    hardware and software. With a Cohere For AI affiliation, Hooker was the last-listed author of the
    Aya model paper (2024), which introduced an instruction-following multilingual model covering 101
    languages; the aya-101 weights are published on Hugging Face under the Apache 2.0 license.
  source_ids: [adaption-blog, adaption-site, hwl-paper, hwl-pdf, aya-paper, aya-pdf, aya-card]
  reviewed_at: 2026-10-21
