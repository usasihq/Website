sections:
  - heading: Research
    paragraphs:
      - text: >-
          Hooker's early papers examined how models are evaluated and what is lost when they are made
          smaller. "A Benchmark for Interpretability Methods in Deep Neural Networks" (2018) proposed an
          empirical measure of how accurate feature-importance estimates are and found many popular methods no
          better than a random assignment. "What Do Compressed Deep Neural Networks Forget?" (2019) and
          "Characterising Bias in Compressed Models" (2020) showed that pruning and quantization can hide
          disproportionately high errors on a small subset of examples behind unchanged top-line accuracy.
        source_ids: [roar-paper, compressed-forget-paper, compressed-bias-paper]
      - text: >-
          "The Hardware Lottery" (2020) argued that research ideas often succeed because they suit the hardware
          and software of their time rather than because they are better. In 2024 Hooker wrote "On the
          Limitations of Compute Thresholds as a Governance Strategy", which argues that compute thresholds, as used
          in recent AI governance measures, are likely to fail to mitigate risk.
        source_ids: [hwl-paper, compute-thresholds-paper]
  - heading: Multilingual models and Adaption
    paragraphs:
      - text: >-
          Hooker was the last-listed author of both Aya papers in February 2024, the model paper with a Cohere
          For AI affiliation: the Aya Dataset, an open collection for multilingual instruction tuning, and the Aya model, an
          instruction-following model covering 101 languages whose weights are released under the Apache 2.0
          license.
        source_ids: [aya-dataset-paper, aya-paper, aya-pdf, aya-card]
      - text: >-
          Hooker is now co-founder and CEO of Adaption, which builds AI systems designed to keep learning after
          deployment. Its platform covers custom model training, data optimization across many languages and
          modalities, and continuous learning at inference, and Hooker has compared the approach to the way the
          brain stores short-term and long-term memory separately.
        source_ids: [adaption-site, adaption-blog]
