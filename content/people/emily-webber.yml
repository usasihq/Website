sections:
  - heading: Career
    paragraphs:
      - text: >-
          Emily Webber is a principal machine learning specialist solutions architect on the AWS Trainium team
          within Annapurna Labs, and Webber's GitHub profile describes the role as principal solutions architect at
          Annapurna ML. The author note in Webber's 2023 book describes earlier work at AWS on distributed training
          for large language and vision models, mentoring ML solutions architects, and advising the Amazon
          SageMaker product and engineering teams.
        source_ids: [science-trainium, webber-github, pretrain-repo]
      - text: >-
          The same note records a keynote at O'Reilly AI London 2019 on a reinforcement learning approach Webber
          developed for public policy, and a YouTube video series introducing SageMaker.
        source_ids: [pretrain-repo]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Webber wrote Pretrain Vision and Large Language Models in Python, published by Packt in 2023 as an
          end-to-end guide to building and deploying foundation models on AWS. The book moves from choosing use
          cases and datasets through distributed training with several kinds of parallelism, evaluation, detecting
          and mitigating bias, and deployment, and its companion repository holds the code examples.
        source_ids: [pretrain-repo]
  - heading: Trainium Frontier competition
    paragraphs:
      - text: >-
          In August 2026 Webber co-wrote the Amazon Science announcement of the AWS Trainium Frontier competition,
          which challenges researchers to train language models from scratch on Trainium chips and to co-design
          model architectures and kernels for the hardware, with a finalist ceremony during NeurIPS 2026.
        source_ids: [science-trainium]
