headline: Principal ML specialist solutions architect on the AWS Trainium team at Annapurna Labs; author
bio:
  text: >-
    Emily Webber is a principal machine learning specialist solutions architect on the AWS Trainium
    team within Annapurna Labs. In August 2026, Webber co-wrote Amazon Science's announcement of
    the AWS Trainium Frontier competition, in which teams build language models from scratch on
    Trainium under a fixed training budget, with a finalist event at NeurIPS 2026. Webber is the
    author of the 2023 Packt book Pretrain Vision and Large Language Models in Python, whose
    MIT-licensed companion repository walks through preparing, training, fine-tuning, evaluating
    and deploying foundation models on Amazon SageMaker.
  source_ids: [science-trainium, webber-github, pretrain-repo]
  reviewed_at: 2026-10-21
