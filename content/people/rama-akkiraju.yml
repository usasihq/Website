sections:
  - heading: Career
    paragraphs:
      - text: >-
          Rama Akkiraju spent more than two decades at IBM. At the IBM Watson and Almaden research
          centers, Akkiraju led projects and research teams on agent-based decision support systems,
          business process management, electronic marketplaces and semantic Web services, including
          leading work on a World Wide Web Consortium (W3C) standard.
        source_ids: [nvidia-research-profile]
      - text: >-
          Akkiraju later led IBM Watson's work on natural, personalized conversations between
          computers and people, where the team built the Personality Insights, Tone Analyzer, Emotion
          Analysis and Sentiment Analysis services, and led the effort to scale Watson's speech
          recognition, language understanding and chatbot services to dozens of languages. Akkiraju
          then became an IBM Fellow, Master Inventor and IBM Academy member and served as CTO of IBM
          Watson AI Operations, a product applying AI to IT operations management.
        source_ids: [nvidia-research-profile]
      - text: >-
          Akkiraju is now a vice president of AI for IT at NVIDIA and was listed among the speakers for
          NVIDIA GTC 2026 as VP of AI/ML for IT.
        source_ids: [nvidia-research-profile, gtc-2026-speakers]
  - heading: Professional service
    paragraphs:
      - text: >-
          Akkiraju served as the 2018 president of ISSIP, a professional society for service science,
          and continues on its strategy committee. Akkiraju has received four best paper awards in AI
          and operations research, according to the NVIDIA biography.
        source_ids: [nvidia-research-profile]
