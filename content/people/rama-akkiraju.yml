headline: Vice president of AI for IT at NVIDIA; former IBM Fellow and CTO of IBM Watson AI Operations
bio:
  text: >-
    Rama Akkiraju is a vice president of AI for IT at NVIDIA. Akkiraju previously spent more than
    two decades at IBM, most recently as an IBM Fellow, Master Inventor and IBM Academy member, and
    as CTO of the IBM Watson AI Operations product, which applied AI to IT operations management.
    Earlier at IBM, Akkiraju led the team that built Watson services such as Personality Insights,
    Tone Analyzer, Emotion Analysis and Sentiment Analysis, and led work to scale Watson's speech
    recognition, language understanding and chatbot services to many languages. At IBM's Watson
    and Almaden research centers, Akkiraju led projects on agent-based decision support, business
    process management, electronic marketplaces and semantic Web services, including a W3C
    standard.
  source_ids: [nvidia-research-profile]
