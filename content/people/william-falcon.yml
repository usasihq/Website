headline: Creator of PyTorch Lightning and CEO of Lightning AI
bio:
  text: >-
    William Falcon is the creator of PyTorch Lightning and the CEO of Lightning AI, according to Falcon's GitHub
    profile. The PyTorch Lightning citation file lists Falcon as the framework's author together with "The PyTorch
    Lightning team", and Falcon published the 1.0.0 general availability release in October 2020. Falcon's
    profile also lists past work at Facebook AI Research and Goldman Sachs.
  source_ids: [github-profile, pl-citation, pl-release-1-0]
  reviewed_at: 2026-10-22
