sections:
  - heading: Career
    paragraphs:
      - text: >-
          Falcon's GitHub profile describes Falcon as the creator of PyTorch Lightning and CEO of Lightning AI, and
          as an AI PhD researcher at NYU. The same profile lists earlier work at Facebook AI Research, Goldman Sachs
          and Columbia, and a co-founding role at NextGenVest.
        source_ids: [github-profile]
  - heading: Open-source work
    paragraphs:
      - text: >-
          The PyTorch Lightning citation file gives a release date of 2019-03-30 and lists Falcon and "The PyTorch
          Lightning team" as authors. The framework organizes PyTorch code
          so that training infrastructure such as mixed precision and multi-GPU or multi-node training is handled
          by the library, and it is published under the Apache 2.0 license.
        source_ids: [pl-citation, pl-repo, pl-readme]
      - text: >-
          Falcon published the 1.0.0 "General availability" release of PyTorch Lightning in October 2020, and the
          repository's CODEOWNERS file lists Falcon, together with Luca Antiga, as an owner of the README and
          documentation index files.
        source_ids: [pl-release-1-0, pl-codeowners]
  - heading: Research
    paragraphs:
      - text: >-
          With Kyunghyun Cho, Falcon wrote a 2020 paper that describes contrastive self-supervised learning methods
          within a single conceptual framework and uses it to design a new approach.
        source_ids: [cssl-paper]
timeline:
