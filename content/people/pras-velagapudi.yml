headline: Chief Technology Officer of Agility Robotics, leading the Digit humanoid robot's technology roadmap
bio:
  text: >-
    Pras Velagapudi is the Chief Technology Officer of Agility Robotics, which Velagapudi joined in May
    2023 to lead the product and technology roadmap for the Digit humanoid robot. Velagapudi was
    previously VP of Engineering and Chief Architect at Berkshire Grey, worked on subterranean
    pipe-inspection robots at RedZone Robotics, and co-founded Platypus, which deploys autonomous boats to
    collect environmental data.
  source_ids: [agility-about]
