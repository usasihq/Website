sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Agility, Velagapudi was VP of Engineering and Chief Architect at Berkshire Grey, developing
          bin-picking and autonomous mobile robot systems. Velagapudi also fielded subterranean
          pipe-inspection robot platforms at RedZone Robotics and co-founded Platypus, which uses autonomous
          boats to collect environmental data on bodies of water.
        source_ids: [agility-about]
      - text: >-
          Velagapudi joined Agility Robotics in May 2023 and, as Chief Technology Officer, leads the product
          and technology roadmap, including the vision and strategy for Digit and the operation of the
          company's AI research and development. Agility's page notes Velagapudi's master's and doctoral
          training in robotics at Carnegie Mellon University.
        source_ids: [agility-about]
