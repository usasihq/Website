sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Ben Davis's personal YouTube channel, which joined YouTube in September 2022, describes its subject
          as development work and whatever topic Ben is currently exploring. Ben also co-hosts Nerd Snipe, a
          YouTube show, created in April 2026, in which Theo and Ben talk about developer topics.
        source_ids: [channel, nerd-snipe]
      - text: >-
          Ben's Substack carries longer written notes on AI and technology. The davis7.sh site gathers dated
          "State of AI" editions, with notes on the models, coding-agent harnesses and subscriptions Ben uses,
          and write-ups of a macOS setup, a home server, a Karabiner keyboard configuration and the font Ben
          uses in an editor and terminal.
        source_ids: [substack, site, state-of-ai]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Ben publishes an MIT-licensed configuration for the Pi coding agent on GitHub. Its README says it
          adds a theme, web search and scraping tools, background terminals, subagents, workflows, a tool that
          lets the model ask multiple-choice questions, and file-discovery and content-search tools.
        source_ids: [pi-setup-repo, site]
