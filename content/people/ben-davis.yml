headline: Developer and YouTuber who co-hosts the Nerd Snipe podcast with Theo and writes about AI tools
bio:
  text: >-
    Ben Davis is a developer and YouTuber who publishes software development videos on a personal
    YouTube channel and co-hosts Nerd Snipe, a YouTube show with Theo about developer topics. Ben
    also writes a Substack whose stated current focus is mostly AI. Ben's website, davis7.sh,
    publishes a dated "State of AI" page of notes and rankings on the AI models, coding-agent
    harnesses, and subscriptions Ben uses, along with write-ups of developer setups such as a
    configuration for a coding agent.
  source_ids: [site, channel, nerd-snipe, substack, state-of-ai]
  reviewed_at: 2026-10-18
