headline: Writer on AI system design; former NeMo core developer at NVIDIA and Stanford ML systems instructor
bio:
  text: >-
    Chip Huyen is a writer and computer scientist who works on bringing AI into production and
    writes about AI system design. Huyen previously worked on ML tooling at NVIDIA as a core
    developer of NeMo, also worked at Snorkel AI and Netflix, and founded and sold an AI
    infrastructure company. At Stanford, Huyen was the instructor for CS 329S, a course on machine
    learning systems design whose lecture notes became the book Designing Machine Learning Systems
    (O'Reilly, 2022); Huyen's later book is AI Engineering (2025).
  source_ids: [huyen-site, cs329s]
  reviewed_at: 2026-10-13
