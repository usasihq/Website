sections:
  - heading: Career
    paragraphs:
      - text: >-
          Chip Huyen describes the work as bringing AI into production and writing about AI system
          design. Huyen worked on ML tooling at NVIDIA as a core developer of NeMo, worked at Snorkel AI
          and Netflix, and founded an AI infrastructure company that was later sold.
        source_ids: [huyen-site]
      - text: >-
          At Stanford, Huyen was the instructor for CS 329S, a project-based course on machine
          learning systems design. The course page notes that its lecture notes were expanded into the
          book Designing Machine Learning Systems.
        source_ids: [cs329s, huyen-site]
  - heading: Books
    paragraphs:
      - text: >-
          Huyen's book Machine Learning Interviews (2021) is free and open-source
          and is being folded into a broader AI engineering curriculum. Designing Machine Learning
          Systems (O'Reilly, 2022) takes a holistic view of ML system design, treating each decision
          in terms of the system's overall objectives, and has been translated into several languages.
        source_ids: [huyen-books, mli-repo, dmls-repo]
      - text: >-
          AI Engineering (O'Reilly, 2025) covers building applications on readily available foundation
          models, with a framework for developing and deploying them and guidance on models, datasets,
          evaluation benchmarks, and application patterns. Huyen has also written four books of
          stories in Vietnamese.
        source_ids: [huyen-books, aie-repo, huyen-site]
  - heading: Open-source work and blog
    paragraphs:
      - text: >-
          Huyen builds small public tools, including GoodAIList for discovering open-source AI projects,
          KilledByGPT, and the lazynlp library for building large text datasets. Huyen's blog covers AI
          systems, with posts such as a 2024 survey of open-source AI tooling, a 2024 overview of the
          components of a generative AI platform, and a 2025 essay on agents.
        source_ids: [huyen-site, lazynlp-repo, huyen-blog]
