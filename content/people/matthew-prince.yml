sections:
  - heading: Career
    paragraphs:
      - text: >-
          Prince co-founded Cloudflare with Michelle Zatlyn, and the company launched on September
          27, 2010. Cloudflare's press releases identify Prince as co-founder and CEO, and Prince
          is a frequent author on the company blog, from founders' letters to technical incident
          and product posts.
        source_ids: [cf-letter-2026, cf-replicate, cf-author]
  - heading: AI and the web
    paragraphs:
      - text: >-
          In July 2025 Prince announced "Content Independence Day," on which Cloudflare changed its
          default to block AI crawlers from customer sites unless they compensate content
          creators. In November 2025 Prince announced Cloudflare's agreement to acquire Replicate,
          an AI platform for deploying and running models, to make Workers an end-to-end platform
          for AI applications.
        source_ids: [cf-independence, cf-replicate]
      - text: >-
          Cloudflare's 2026 founders' letter, published on the company's sixteenth anniversary,
          describes a surge of new websites since mid-2025 built by people using AI coding tools,
          most of which use Cloudflare's developer platform as their deployment target, and
          automated traffic overtaking human activity.
        source_ids: [cf-letter-2026, cf-author]
