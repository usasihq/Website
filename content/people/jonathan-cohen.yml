headline: NVIDIA AI software leader who led NeMo development; listed in the Nemotron 3 leadership credits
bio:
  text: >-
    Jonathan Cohen is an AI software leader at NVIDIA. NVIDIA's blog profile describes Cohen as a
    Senior Director for AI Software who leads development of the company's speech and language tools
    and technologies, including NeMo, and notes three years at Apple as a Director of Engineering
    after an earlier eight years at NVIDIA in engineering and research roles. Cohen is listed in
    the leadership credits of NVIDIA's Nemotron 3 white paper (December 2025) and among the
    contributors to the Nemotron 3 Super technical report (April 2026). Cohen's NVIDIA blog
    posts announced NeMo Guardrails, open-source software for keeping generative AI applications on
    track (2023), and the Granary multilingual speech dataset released with the Canary-1b-v2 and
    Parakeet-tdt-0.6b-v3 models (2025).
  source_ids: [nvidia-blog-author, nvidia-dev-author, nemotron3-paper, nemotron3-super-report, granary-post]
  reviewed_at: 2026-10-13
