sections:
  - heading: Career
    paragraphs:
      - text: >-
          NVIDIA's author pages describe Cohen as having spent eight years at NVIDIA in engineering and research
          roles, then three years at Apple as a Director of Engineering, before returning to NVIDIA. There Cohen
          became a Senior Director for AI Software, leading development of NVIDIA's speech and language tools and
          technologies, including the NeMo framework.
        source_ids: [nvidia-blog-author, nvidia-dev-author]
      - text: >-
          NVIDIA's December 2025 Nemotron 3 white paper lists Cohen among the leadership of the Nemotron 3 model
          family, and the April 2026 Nemotron 3 Super technical report lists Cohen among its contributors.
        source_ids: [nemotron3-paper, nemotron3-super-report]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Cohen's posts on NVIDIA's blogs trace the speech and language software Cohen's teams have released. A
          2019 technical post explained how to build domain-specific automatic speech recognition models on GPUs,
          and a 2023 post announced NeMo Guardrails, open-source software for keeping generative AI chatbot
          responses on track.
        source_ids: [nvidia-dev-author, nvidia-blog-author]
      - text: >-
          In August 2025 Cohen announced Granary, an open multilingual speech dataset, released together with
          the Canary-1b-v2 and Parakeet-tdt-0.6b-v3 speech models to extend speech AI to more languages.
        source_ids: [granary-post]
