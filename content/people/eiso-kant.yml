sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kant built source{d} in 2016, a company dedicated to applying AI to code, and where the idea behind RLCEF first arose. Kant later
          co-founded Poolside with Jason Warner, and Poolside's blog posts list both as co-CEO and
          co-founder.
        source_ids: [poolside-agi-post, poolside-laguna-launch, poolside-fern-labs]
  - heading: Research and products
    paragraphs:
      - text: >-
          Poolside's research centers on training models for software development with execution
          feedback: in RLCEF, models attempt tasks across many real code bases and learn from the
          result of running their solutions. The Model Factory, introduced in a 2025 post that lists
          Kant as an author, is the internal system Poolside uses to train and evaluate models.
        source_ids: [poolside-agi-post, poolside-model-factory]
      - text: >-
          In April 2026 Kant and Warner announced Laguna M.1 and Laguna XS.2, the latter released as
          open weights on Hugging Face under Apache 2.0. Poolside's site now offers the Laguna family
          for agentic coding, including the on-device XS 2.1 model.
        source_ids: [poolside-laguna-launch, poolside-home]
