headline: Co-founder and co-CEO of Poolside, which builds open-weight foundation models for agentic coding
bio:
  text: >-
    Eiso Kant is a co-founder and co-CEO of Poolside, which builds foundation models and agents for
    software development, including the open-weight Laguna models. Poolside traces its training
    approach, Reinforcement Learning from Code Execution Feedback (RLCEF), to source{d}, the company
    Kant built in 2016 to apply AI to code.
  source_ids: [poolside-laguna-launch, poolside-agi-post, poolside-home]
  reviewed_at: 2026-10-21
