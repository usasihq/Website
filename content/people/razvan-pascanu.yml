sections:
  - heading: Career
    paragraphs:
      - text: >-
          Pascanu earned an MSc at Jacobs University in 2009, supervised by Herbert Jaeger, and a PhD at the
          University of Montreal in 2014, supervised by Yoshua Bengio. Pascanu was also involved in developing the
          Theano library, helped write its deep learning tutorials and co-authored a 2012 paper on its new features. Pascanu is now a Research Scientist at DeepMind and an
          Affiliate Member of Mila, and has co-supervised students jointly with researchers at Johannes Kepler
          University, Imperial College London and University College London.
        source_ids: [homepage, theano-paper]
  - heading: Research
    paragraphs:
      - text: >-
          Pascanu's early work dealt with optimization and recurrent networks. Besides the 2012 analysis of
          exploding and vanishing gradients in RNNs, Pascanu wrote "Revisiting Natural Gradient for Deep
          Networks" (2013) with Yoshua Bengio and co-authored "On the Number of Linear Regions of Deep Neural
          Networks" (2014), on how depth affects the functions a network can represent.
        source_ids: [rnn-paper, natural-gradient-paper, linear-regions-paper, homepage]
      - text: >-
          Later research has addressed learning across many tasks, including Progressive Neural
          Networks (2016) and "Overcoming catastrophic forgetting in neural networks" (2016), as well as graph
          neural networks through the 2018 paper "Relational inductive biases, deep learning, and graph
          networks". Returning to recurrent models, Pascanu co-authored "Resurrecting Recurrent Neural Networks
          for Long Sequences" (2023).
        source_ids: [homepage, progressive-nets-paper, ewc-paper, graph-networks-paper, lru-paper]
  - heading: Teaching and community
    paragraphs:
      - text: >-
          Pascanu is one of the organizers of EEML, the Eastern European Machine Learning Summer School, and of
          the AIRomania community, through which Pascanu has organized RomanianAIDays since 2020 and helped build
          an AI course for high school students. Pascanu has also helped organize CoLLAs, a conference on
          lifelong learning, and the Learning on Graphs (LoG) conference.
        source_ids: [homepage, eeml-site, collas-site, log-site]
