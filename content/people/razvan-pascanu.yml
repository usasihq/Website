headline: Research Scientist at DeepMind; contributor to Theano and first author of a study of RNN training difficulties
bio:
  text: >-
    Razvan Pascanu is a Research Scientist at DeepMind and an Affiliate Member at Mila. Pascanu was
    involved in developing Theano, helped write some of its deep learning tutorials, and is a
    co-author of the 2012 paper on Theano's new features and speed improvements. Pascanu is first
    author of "On the difficulty of training Recurrent Neural Networks", which analyzed exploding
    and vanishing gradients and proposed norm-based gradient clipping. Pascanu also co-organizes
    EEML and has helped launch or organize conferences on lifelong learning and on learning on
    graphs.
