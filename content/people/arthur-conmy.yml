sections:
  - heading: Career
    paragraphs:
      - text: >-
          Conmy's site lists a software engineering internship at Meta in 2021 and research at Redwood Research
          in 2022–2023, followed by work as a Senior Research Engineer at Google DeepMind from 2023 to
          2026. At Google DeepMind, Conmy worked on post-training for Gemini and on interpretability tools
          closer to production use, including probes, reward-model bias discovery, sparse autoencoders, model
          diffing and steering. Conmy has since joined Anthropic as a Member of Technical Staff, focused on
          alignment while models are being trained.
        source_ids: [conmy-site, mats-conmy]
      - text: >-
          Conmy has been a mentor in the MATS research program since MATS 6.0 and describes it as the main way
          Conmy mentors new researchers. The MATS mentor page lists Conmy's interests as automating
          interpretability, finding circuits and making model-internals techniques useful for AI safety.
        source_ids: [conmy-site, mats-conmy]
  - heading: Research
    paragraphs:
      - text: >-
          Conmy's early work, in 2022–2023, was on circuits in small transformer models. Conmy co-authored the
          study of the indirect object identification circuit in GPT-2 small and was first author of ACDC,
          which automates the search for the model components behind a behavior. Related papers studied copy
          suppression in attention heads and successor heads, which increment tokens with a natural order such
          as days or months.
        source_ids: [ioi-paper, acdc-paper, copy-suppression-paper, successor-heads-paper]
      - text: >-
          At Google DeepMind, Conmy co-authored the Gated Sparse Autoencoder paper and the Gemma Scope suite of
          open sparse autoencoders for Gemma 2. Later papers with MATS scholars examined unfaithful
          chain-of-thought reasoning, which reasoning steps matter in a trace, how thinking models differ from
          their base models, and automatic discovery of reward model biases. In January 2026 Conmy was the
          last-listed author of a paper on building activation probes for Gemini that hold up under production
          distribution shifts.
        source_ids: [gated-sae-paper, gemma-scope-paper, cot-faithfulness-paper, thought-anchors-paper, base-models-paper, rm-biases-paper, production-probes-paper]
