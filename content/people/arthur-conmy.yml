headline: Anthropic Member of Technical Staff; former Google DeepMind senior research engineer; ACDC first author
bio:
  text: >-
    Arthur Conmy is a Member of Technical Staff at Anthropic; Conmy's site describes the role as
    working on aligning upcoming models as they are trained. From 2023 to 2026 Conmy was a Senior
    Research Engineer at Google DeepMind, working on post-training for Gemini and on interpretability
    tools including Gemma Scope, sparse autoencoders, probes, and model diffing. Earlier work on
    circuits includes first authorship of ACDC, a method for automated circuit discovery, and
    co-authorship of the indirect object identification circuit study in GPT-2 small.
  source_ids: [conmy-site, mats-conmy, acdc-paper, ioi-paper, gemma-scope-paper]
  reviewed_at: 2026-10-21
