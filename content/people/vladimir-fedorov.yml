headline: Chief Technology Officer of GitHub; co-founder of UserClouds and former engineering leader at Facebook
bio:
  text: >-
    Vladimir (Vlad) Fedorov is the Chief Technology Officer of GitHub, leading its engineering team. Before
    joining GitHub, Fedorov co-founded UserClouds, a startup focused on data governance and privacy, and
    spent twelve years at Facebook, now Meta, as a Senior Vice President leading engineering for privacy,
    ads and platform. Earlier, Fedorov worked at Microsoft.
  source_ids: [gh-leadership, fedorov-author]
