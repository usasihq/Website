sections:
  - heading: Career
    paragraphs:
      - text: >-
          Fedorov worked at Microsoft earlier in their career and spent twelve years at Facebook, now Meta, as
          a Senior Vice President leading engineering for privacy, ads and platform. Fedorov
          then co-founded UserClouds, a data governance and privacy startup, before joining GitHub as Chief
          Technology Officer. Fedorov also serves on the board of Codepath.org.
        source_ids: [gh-leadership]
  - heading: Work at GitHub
    paragraphs:
      - text: >-
          As CTO, Fedorov leads GitHub's engineering team. In 2026 Fedorov wrote GitHub Blog updates on the
          stabilization and reliability work GitHub was prioritizing, published in March, April and August
          2026.
        source_ids: [gh-leadership, availability-post-1, availability-post-2, availability-post-3]
