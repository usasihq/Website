sections:
  - heading: Research
    paragraphs:
      - text: >-
          Mokady's research applies machine learning to computer vision and graphics, especially image and video
          synthesis, with interests in disentanglement, temporal coherence, reduced supervision and the reuse of
          pretrained models. During PhD work at Tel Aviv University, Mokady co-authored studies of StyleGAN,
          including HyperStyle for inverting real images into StyleGAN for editing, a 2022 method for editing faces
          in real videos, and a 2022 survey of StyleGAN's architecture, methods and applications.
        source_ids: [mokady-site, rm-hyperstyle, rm-stitch, rm-stylegan-star]
      - text: >-
          As first author, Mokady introduced ClipCap in 2021, which captions images by feeding a CLIP image
          embedding as a prefix to a language model. With colleagues at Google Research, Mokady then co-authored
          Prompt-to-Prompt, which edits generated images by controlling cross-attention, and was co-first author
          of Null-text Inversion, which extends such editing to real images.
        source_ids: [rm-clipcap, p2p-paper, p2p-project, nti-paper, nti-project, p2p-repo]
  - heading: BRIA AI
    paragraphs:
      - text: >-
          At BRIA AI, Mokady leads research on and training of visual generative models built with licensed data.
          Mokady's recent co-authored papers include a 2025 study on enhancing text-to-image models with long
          structured captions, which introduced the open FIBO model, and 2026 papers on numeric bounding-box and
          color control in large text-to-image models and on generating images from contextually contradictory
          prompts.
        source_ids: [mokady-site, rm-fibo]
