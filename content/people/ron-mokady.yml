headline: VP of Research at BRIA AI; co-author of Prompt-to-Prompt and first author of Null-text Inversion
bio:
  text: >-
    Ron Mokady is the VP of Research at BRIA AI, where Mokady directs research on and training of visual
    generative AI models built with licensed data. During PhD studies in computer science at Tel Aviv
    University with Daniel Cohen-Or and Amit H. Bermano, Mokady spent the 2020 summer at FAIR and the
    2021 and 2022 summers at Google. Mokady is co-author of "Prompt-to-Prompt Image Editing with Cross
    Attention Control" and co-first author of "Null-text Inversion for Editing Real Images using Guided
    Diffusion Models", both presented by authors from Google Research and Tel Aviv University and
    released together in the Apache-2.0-licensed google/prompt-to-prompt repository.
