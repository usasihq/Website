headline: Founder and CEO of Lightmatter, which builds photonic interconnects for AI infrastructure
bio:
  text: >-
    Nicholas (Nick) Harris is the founder and CEO of Lightmatter, a photonics company founded by MIT
    researchers in 2017 that builds optical interconnects, light engines and reference systems
    for large AI computing clusters. Harris co-authored early research on running neural networks
    on programmable nanophotonic circuits.
  source_ids: [lm-about, nanophotonic-paper]
  reviewed_at: 2026-10-21
