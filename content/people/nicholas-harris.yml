sections:
  - heading: Career
    paragraphs:
      - text: >-
          In 2016 Harris co-authored, with Yichen Shen, Dirk Englund, Marin Soljačić and others, a
          paper on deep learning with coherent nanophotonic circuits. Lightmatter was founded by
          MIT researchers in 2017, and its leadership page lists Harris as founder and CEO.
        source_ids: [nanophotonic-paper, lm-about]
      - text: >-
          Lightmatter's other founders listed today are Darius Bunandar, its chief scientist, and
          Thomas Graham, its head of machine learning.
        source_ids: [lm-about]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Lightmatter describes its work as building photonic infrastructure for AI:
          interconnects, lasers and, eventually, compute itself. In March 2025
          the company announced the Passage M1000 photonic interposer and the Passage L200
          co-packaged optics product.
        source_ids: [lm-about, lm-m1000]
      - text: >-
          In January 2026 the company introduced Guide, a light engine built on what it calls Very Large
          Scale Photonics, which integrates many lasers on one platform to move laser production
          toward foundry manufacturing.
        source_ids: [lm-guide]
