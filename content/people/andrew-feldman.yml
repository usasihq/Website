sections:
  - heading: Career
    paragraphs:
      - text: >-
          Feldman's Cerebras biography traces a career in networking and server companies before Cerebras.
          Feldman was Vice President of Marketing and Corporate Development at RiverStone Networks from the
          company's inception, then Vice President of Product Management, Marketing and BD at Force10 Networks.
          Feldman then co-founded SeaMicro, a maker of energy-efficient, high-bandwidth microservers, and served
          as its CEO until AMD acquired it in 2012.
        source_ids: [cerebras-company]
      - text: >-
          In 2015 Feldman launched Cerebras Systems with Gary Lauterbach, Michael James, Sean Lie and
          Jean-Philippe Fricker, aiming to bring wafer-scale computing to market. The Cerebras team page lists
          Feldman as Chief Executive Officer and Co-Founder, and a 2024 company press release announcing new
          board members quotes Feldman in that role.
        source_ids: [cerebras-company, cerebras-board-pr]
  - heading: Cerebras products
    paragraphs:
      - text: >-
          The company timeline lists the first Wafer-Scale Engine, WSE-1, and the CS-1 system in 2019, followed
          by the WSE-2 and CS-2 in 2021 and the WSE-3 and CS-3 in 2024. In 2023 Cerebras and G42 introduced the
          Condor Galaxy network of supercomputers built on Cerebras systems.
        source_ids: [cerebras-company]
      - text: >-
          By 2025 the timeline describes Cerebras systems serving inference for Meta's Llama API, Perplexity and
          Mistral, with integrations into Hugging Face and OpenRouter. In August 2026 Cerebras launched the CS-4,
          which the company describes as powered by three WSE-3 Turbo processors.
        source_ids: [cerebras-company]
