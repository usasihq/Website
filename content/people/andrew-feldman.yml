headline: Co-founder and Chief Executive Officer of Cerebras Systems; earlier co-founder and CEO of SeaMicro
bio:
  text: >-
    Andrew Feldman is Chief Executive Officer and a co-founder of Cerebras Systems. Cerebras' company
    page says Feldman, Gary Lauterbach, Michael James, Sean Lie and Jean-Philippe Fricker launched
    Cerebras in 2015 with the aim of bringing wafer-scale computing to market. Before Cerebras, Feldman
    co-founded and was CEO of SeaMicro, a maker of energy-efficient microservers that AMD acquired in
    2012. Earlier, Feldman was Vice President of Product Management, Marketing and BD at Force10
    Networks and Vice President of Marketing and Corporate Development at RiverStone Networks.
  source_ids: [cerebras-company]
  reviewed_at: 2026-10-21
