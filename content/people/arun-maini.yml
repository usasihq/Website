sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Maini introduces the Mrwhosetheboss channel as an effort to make fun and useful technology videos and
          to build a community around technology. The channel's About page gives April 20, 2011 as the date the
          channel joined YouTube.
        source_ids: [channel]
      - text: >-
          Recent uploads listed on the channel's videos page are mostly smartphone and gadget coverage, including
          reviews, unboxings and hands-on videos of new Apple, Google, Samsung and Xiaomi phones. Other videos
          look at broader consumer-technology topics, such as Apple's WWDC 2026 announcements about Siri, the
          Android 17 update, and a comparison of Mac and Windows computers.
        source_ids: [channel-videos]
