headline: Software engineer focused on LLM training at Snowflake AI Research; author of an open ML engineering book
bio:
  text: >-
    Stas Bekman is a software engineer who specializes in training large language and multimodal
    models in the PyTorch ecosystem and currently works at Snowflake AI Research on efficient
    post-training software. Bekman's site describes earlier work on a distributed training framework
    at Contextual AI and, before that, time at Hugging Face from 2020 to 2023, where Bekman was lead
    engineer on training the BLOOM model and later helped train IDEFICS-80b. Bekman is first author of
    Arctic Long Sequence Training (2025), which the paper says is open-sourced via DeepSpeed, and
    maintains the Machine Learning Engineering Open Book under a CC BY-SA 4.0 license.
  source_ids: [stas-site, hf-profile, alst-paper, ml-eng-book, obelics-paper]
  reviewed_at: 2026-10-13
