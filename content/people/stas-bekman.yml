sections:
  - heading: Career
    paragraphs:
      - text: >-
          Stas Bekman has written software since 1994, has taught at technical conferences and user
          groups, and has published several books, including Practical mod_perl. Around 2020 Bekman
          helped develop fastai, then worked at Hugging Face from 2020 to 2023, contributing to the
          Transformers library and to projects such as DeepSpeed and PyTorch.
        source_ids: [stas-site]
      - text: >-
          After Hugging Face, Bekman worked at Contextual AI on a distributed training framework and on
          training and serving retrieval-augmented generation models. Bekman now works at Snowflake AI
          Research, developing efficient post-training software with a team that includes DeepSpeed
          creators.
        source_ids: [stas-site, hf-profile]
  - heading: Large-scale training
    paragraphs:
      - text: >-
          Bekman's site names the BLOOM training run, on 384 A100 GPUs, as a major accomplishment and
          describes Bekman as its lead engineer; Bekman is among the co-authors of the 2022 BLOOM paper
          and of a companion study on choosing what language model to train with a fixed compute budget.
          In 2023 Bekman's team trained the IDEFICS-80b multimodal model, described in the OBELICS paper.
        source_ids: [stas-site, bloom-paper, million-gpu-paper, obelics-paper]
      - text: >-
          At Snowflake, Bekman is first author of the 2025 Arctic Long Sequence Training paper, which
          describes memory optimizations for training on multi-million-token sequences and is
          open-sourced through DeepSpeed. Bekman also co-authored the 2024 Universal Checkpointing paper
          on distributed checkpoints that can be reloaded under different parallelism settings.
        source_ids: [alst-paper, ucp-paper]
  - heading: Open-source work and writing
    paragraphs:
      - text: >-
          Bekman maintains the Machine Learning Engineering Open Book, a CC BY-SA 4.0 collection of
          methods and tools for training, fine-tuning, and serving large models, and an early work in
          progress called The Art of Debugging. Bekman is also a co-author of the 2021 paper on the
          Hugging Face Datasets library.
        source_ids: [ml-eng-book, stas-site, datasets-paper]
