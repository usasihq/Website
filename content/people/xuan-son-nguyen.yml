    source_ids: [pr-mtmd-cli]
  - date: "2025-04-20"
    text: Introduced ggml-easy, a simple wrapper for working with GGML, on Nguyen's blog.
    source_ids: [ggml-easy-post]
  - date: "2025-05-22"
