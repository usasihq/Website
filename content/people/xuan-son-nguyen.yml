work:
- name: llama.cpp
  artifact_slug: llama-cpp
  url: https://github.com/ggml-org/llama.cpp
  contribution: Core maintainer, according to Nguyen's site, which also credits Nguyen with adding vision
    and audio support. CODEOWNERS names Nguyen for the multimodal library (llama-mtmd), llama-server,
    shared common code, CI, and Dockerfiles. Nguyen is also a byline author of Hugging Face's 2026 announcement
    that the ggml and llama.cpp team was joining the company.
  source_ids:
  - personal-site
  - llama-cpp-codeowners
  - hf-announcement
- name: Ollama integration on the Hugging Face Hub
  artifact_slug: null
  url: https://huggingface.co/docs/hub/en/ollama
  contribution: Listed among Nguyen's work. The Hub documentation describes running any public GGUF checkpoint
    on the Hub with a single ollama run command, with a choice of quantization type.
  source_ids:
  - personal-site
  - hf-ollama-docs
- name: wllama
  artifact_slug: null
  url: https://github.com/ngxson/wllama
  contribution: Published under Nguyen's GitHub account as an MIT-licensed WebAssembly binding for llama.cpp;
    it runs language model inference directly in a web browser.
