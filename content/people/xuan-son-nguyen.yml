headline: Software engineer at Hugging Face and core maintainer of llama.cpp
bio:
  text: Xuan-Son Nguyen is a software engineer at Hugging Face and a core maintainer of llama.cpp, the
    C/C++ runtime for running language models on local hardware. The project's CODEOWNERS file lists Nguyen
    as the owner of its multimodal library and among the owners of llama-server, and Nguyen's site credits
    this work with adding vision and audio support to llama.cpp. The site also lists the Hugging Face
    Hub integration that lets Ollama run GGUF models hosted on the Hub, and Nguyen publishes wllama, a
    WebAssembly binding for running llama.cpp in the browser.
  source_ids:
  - personal-site
  - llama-cpp-codeowners
  - hf-ollama-docs
  - wllama-repo
  reviewed_at: 2026-10-21
