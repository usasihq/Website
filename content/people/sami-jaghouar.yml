headline: Leads research at Prime Intellect; first author of the INTELLECT-1 technical report and OpenDiLoCo
bio:
  text: >-
    Sami Jaghouar leads research at Prime Intellect, according to Jaghouar's GitHub profile, and was listed on
    Prime Intellect's research team in the May 2025 INTELLECT-2 announcement. Jaghouar is first author of the
    INTELLECT-1 technical report, on a model trained across globally distributed infrastructure, and of
    OpenDiLoCo, an open-source framework for distributed training with low communication.
  source_ids: [gh-samsja, hf-samsja, hf-papers-intellect1, intellect2-blog, intellect1-paper, opendiloco-paper]
  reviewed_at: 2026-10-22
