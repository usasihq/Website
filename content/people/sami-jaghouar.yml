sections:
  - heading: Research
    paragraphs:
      - text: >-
          Jaghouar's published work centres on training models across distributed compute. OpenDiLoCo (2024)
          presented an open-source framework for globally distributed low-communication training, and the
          INTELLECT-1 technical report (2024) described a model trained on such infrastructure.
        source_ids: [opendiloco-paper, intellect1-paper]
      - text: >-
          Jaghouar is the first named individual author of the INTELLECT-2 report (2025), on a reasoning model
          trained through globally decentralized reinforcement learning, and a co-author of the INTELLECT-3
          technical report (2025). Other co-authored work includes TOPLOC (2025), on verifiable inference, and
          METAGENE-1 (2025), a metagenomic foundation model.
        source_ids: [intellect2-paper, intellect3-paper, toploc-paper, metagene-paper]
  - heading: Prime Intellect
    paragraphs:
      - text: >-
          Jaghouar's GitHub profile, linked from the Hugging Face account that Hugging Face lists as the author
          of the INTELLECT-1 technical report, describes Jaghouar's role as leading research at Prime Intellect.
          The same Hugging Face account is a member of the Prime Intellect organization and publishes models
          there, including a checkpoint released in October 2026.
        source_ids: [gh-samsja, hf-samsja, hf-papers-intellect1]
