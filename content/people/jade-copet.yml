headline: First author of MusicGen and co-first author of EnCodec, both released in Meta's AudioCraft library
bio:
  text: >-
    Jade Copet is first author of the MusicGen paper, Simple and Controllable Music Generation, and
    co-first author with Alexandre Défossez of the EnCodec neural audio compression paper. Both
    papers list their authors at Meta AI, with EnCodec naming the FAIR team, and both models are
    part of Meta's AudioCraft library, which releases code under the MIT license and model weights
    under CC-BY-NC 4.0. Copet is also a co-author of the Code Llama paper and of the Facebook AI
    Research paper on generative spoken language modeling from raw audio, and Copet's GitHub profile
    lists the facebookresearch organization.
  source_ids: [musicgen-paper, musicgen-pdf, encodec-paper, encodec-pdf, audiocraft-repo, codellama-paper, gslm-pdf, github-profile]
