sections:
  - heading: Audio and speech research
    paragraphs:
      - text: >-
          Jade Copet's work at Facebook AI Research includes spoken language modeling: Copet
          co-authored the 2021 paper introducing Generative Spoken Language Modeling, the task of
          learning the acoustic and linguistic characteristics of a language from raw audio without
          text or labels.
        source_ids: [gslm-pdf]
      - text: >-
          In 2022 Copet was co-first author, with Alexandre Défossez, of EnCodec, a neural audio codec
          written by the FAIR team at Meta AI, and co-authored AudioGen, a model for generating audio
          from text descriptions. In 2023 Copet was first author of MusicGen, "Simple and Controllable
          Music Generation", a single-stage language model that generates music conditioned on text or
          melody.
        source_ids: [encodec-paper, encodec-pdf, audiogen-paper, musicgen-paper, musicgen-pdf]
      - text: >-
          EnCodec and MusicGen are both part of Meta's AudioCraft library, whose repository releases
          code under the MIT license and model weights under CC-BY-NC 4.0.
        source_ids: [audiocraft-repo]
  - heading: Code generation
    paragraphs:
      - text: >-
          Copet is a co-author of the 2023 Code Llama paper, which describes a family of open
          foundation models for code. In September 2025 Copet was the first individual author listed,
          after the FAIR CodeGen team, on the paper introducing CWM, an open-weights language model for
          research on code generation with world models.
        source_ids: [codellama-paper, cwm-paper]
