sections:
  - heading: Career
    paragraphs:
      - text: >-
          Faghri completed a PhD in computer science at the University of Toronto, supervised by David Fleet,
          with doctoral research on fast and robust training methods. During the PhD, Faghri interned at
          Google Brain in 2017 and 2020. Faghri joined Apple in 2021 and works in Apple Machine Learning
          Research.
        source_ids: [faghri-site, faghri-toronto]
  - heading: Research
    paragraphs:
      - text: >-
          Faghri's early work includes VSE++ (2017), on visual-semantic embeddings trained with hard
          negatives. At Apple, Faghri has worked on efficient image-text models, including MobileCLIP (2023)
          and its successor MobileCLIP2, whose models, training code and data-generation code were released
          in 2025, and on continual training of CLIP models in TiC-CLIP (2023).
        source_ids: [vsepp-paper, mobileclip-paper, ticclip-paper, faghri-site]
      - text: >-
          Faghri is the second author of FastVLM (2024), presented at CVPR 2025, which targets lower
          latency in vision-language models at high image resolutions. Faghri also co-authored DataComp-LM,
          presented at NeurIPS 2024, and co-organized a NeurIPS 2025 workshop on continual and compatible
          foundation model updates.
        source_ids: [fastvlm-paper, dclm-paper, faghri-site]
