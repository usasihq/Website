headline: Machine learning researcher at Apple Machine Learning Research; co-author of FastVLM and MobileCLIP
bio:
  text: >-
    Fartash Faghri is a machine learning researcher at Apple Machine Learning Research (MLR), working on
    the efficiency of foundation model training, including training-data quality, on-device foundation
    models and large-scale continual learning. Faghri is the second author of the FastVLM paper on
    efficient vision encoding for vision-language models and a co-author of MobileCLIP. Faghri joined
    Apple in 2021 after completing a PhD at the University of Toronto.
  source_ids: [faghri-site, faghri-github, fastvlm-paper, mobileclip-paper]
  reviewed_at: 2026-10-22
