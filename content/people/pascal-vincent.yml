headline: Research scientist in Meta's FAIR team; first author of the stacked denoising autoencoders paper
bio:
  text: >-
    Pascal Vincent is a research scientist in the Fundamental AI Research (FAIR) team at Meta and a
    founding member of Mila – Quebec Artificial Intelligence Institute. Vincent's research on
    representation learning includes denoising autoencoders, described in Mila's biography as a
    precursor to self-supervised learning, and the denoising score matching principle, which the
    same biography notes is now used to train diffusion-based generative models. Vincent is first author of the 2010 JMLR paper
    on stacked denoising autoencoders and a co-author of I-JEPA, a self-supervised method that
    learns image representations by predicting the representations of target regions from a
    single context region.
