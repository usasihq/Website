sections:
  - heading: Career
    paragraphs:
      - text: >-
          Vincent has worked on artificial neural networks since 1995 and completed a PhD in computer science
          and machine learning at Université de Montréal under Yoshua Bengio in 2004. Vincent is a founding
          member of Mila – Quebec Artificial Intelligence Institute, an associate fellow in CIFAR's Learning in
          Machines & Brains program, and holds an appointment in Université de Montréal's Department of Computer
          Science and Operations Research.
        source_ids: [meta-profile, mila-profile]
      - text: >-
          Vincent is a research scientist in Meta's Fundamental AI Research (FAIR) team, where the
          work focuses on representation learning methods that are statistically and computationally efficient
          and that generalize robustly out of distribution.
        source_ids: [meta-profile, mila-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Vincent co-authored "A Neural Probabilistic Language Model" (2003) with Yoshua Bengio, Réjean Ducharme
          and Christian Jauvin, which learned distributed word representations jointly with a language model.
          Vincent's denoising autoencoders (2008 and 2010) trained networks to reconstruct inputs from corrupted
          versions, a pretext task that Mila's biography describes as a precursor of self-supervised learning;
          the 2010 JMLR paper stacked such layers to build deep networks.
        source_ids: [nplm-paper, mila-profile, sda-paper]
      - text: >-
          In a December 2010 technical report, accepted for publication in Neural Computation, Vincent connected
          score matching with denoising autoencoders, developing the denoising score matching principle that
          Mila's biography notes is now used to train diffusion-based generative models. At FAIR, Vincent co-authored I-JEPA (2023), which learns image
          representations by predicting the representations of image regions from a context block.
        source_ids: [dsm-report, mila-profile, ijepa-paper]
