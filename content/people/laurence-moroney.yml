sections:
  - heading: Career
    paragraphs:
      - text: >-
          Moroney's website gives a current role as Director of AI at Arm, with a focus on bringing AI to every
          possible device. Earlier, Moroney led AI Advocacy at Google for many years, educating developers
          through the TensorFlow YouTube channel, talks at Google I/O and the TensorFlow Dev Summit, the
          TensorFlow blog, and work with Google Developer Groups and TensorFlow user groups.
        source_ids: [moroney-site, tf-blog-toolbox]
      - text: >-
          At Google, Moroney also designed the curriculum and test for a certificate covering
          computer vision, natural language processing and sequence modelling, and helped universities create
          curricula on building AI systems.
        source_ids: [moroney-site]
  - heading: Teaching
    paragraphs:
      - text: >-
          Moroney has taught several online specializations with DeepLearning.AI and Andrew Ng, starting with
          TensorFlow in Practice and TensorFlow Data and Deployment, followed by TensorFlow Advanced Techniques.
          More recent courses include a short course on pair-programming with large language models, a
          Generative AI for Software Development certificate, and a three-course PyTorch for Deep Learning
          professional certificate.
        source_ids: [moroney-teaching]
      - text: >-
          Moroney also contributed to Google AI for Anyone on edX with HarvardX and to Harvard's Tiny ML
          specialization on edX, which teaches machine learning on mobile and embedded devices with TensorFlow
          Lite for Microcontrollers.
        source_ids: [moroney-teaching]
  - heading: Writing
    paragraphs:
      - text: >-
          Moroney's programming books run from Expert Web Services in the .NET Platform (2004) and a series of
          Microsoft Press titles on Silverlight and Windows development to The Definitive Guide to Firebase
          (2017) and two O'Reilly books on machine learning, AI and Machine Learning for Coders (2020) and AI and
          Machine Learning for On-Device Developers (2021). Moroney has also written science fiction novels,
          comic books including Stargate Universe: Icarus, and a television pilot.
        source_ids: [moroney-writing]
