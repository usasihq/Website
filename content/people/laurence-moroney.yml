headline: Author and educator who led AI Advocacy at Google and taught TensorFlow specializations with DeepLearning.AI
bio:
  text: >-
    Laurence Moroney is an AI author and educator whose site says Moroney led AI Advocacy at Google for
    many years, ran the TensorFlow YouTube channel, and designed the TensorFlow certificate curriculum
    and test. Moroney's teaching page lists the TensorFlow: In Practice, TensorFlow: Data and Deployment,
    and TensorFlow: Advanced Techniques specializations taught with DeepLearning.AI, as well as a PyTorch
    for Deep Learning professional certificate. Moroney's books include AI and Machine Learning for
    Coders (O'Reilly, 2020) and AI and Machine Learning for On-Device Developers (O'Reilly, 2021).
  source_ids: [moroney-site, moroney-teaching, moroney-writing, tf-blog-toolbox]
