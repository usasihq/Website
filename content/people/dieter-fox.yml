headline: UW Allen School professor who leads Ai2's Robotics team; started NVIDIA's robotics research lab in 2017
bio:
  text: >-
    Dieter Fox is a Professor in the Paul G. Allen School of Computer Science & Engineering at the
    University of Washington, where Fox heads the Robotics and State Estimation Lab (RSE-Lab), and
    now shares time between UW and Ai2, whose Robotics team Fox leads. Fox's research covers
    robotics, artificial intelligence and state estimation, with much of it on perception and its
    connection to control. In 2017 Fox joined NVIDIA Research to start a robotics research lab
    aimed at robots that manipulate the physical world and interact naturally with people. Fox is a
    co-author of NVIDIA's 2025 GR00T N1 and Cosmos World Foundation Model Platform papers, and is a
    Fellow of the AAAI, ACM and IEEE.
