sections:
  - heading: Career
    paragraphs:
      - text: >-
          Dieter Fox joined the University of Washington faculty in the fall of 2000, where Fox heads the
          Robotics and State Estimation Lab. Fox now divides time between UW and the Allen Institute for AI, where Fox leads the Robotics team
          and focuses on foundation models for robotics.
        source_ids: [homepage, uw-profile, ai2-robotics-job]
      - text: >-
          In 2017 Fox joined NVIDIA Research to start a robotics research lab, and led that lab for nearly eight
          years before moving to Ai2. Fox has also served as an editor of IEEE Transactions on Robotics from 2010
          to 2015, as program chair of the AAAI Conference in 2008 and of Robotics: Science and Systems in 2013,
          and on the RSS Foundation board.
        source_ids: [nvidia-lab-post, uw-profile, homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Fox's research aims to let systems interact intelligently with people and their surroundings. Much of it
          concerns perception and its link to control, extracting useful information from raw sensor data for
          human activity recognition, 3D mapping and tracking, and robot manipulation.
        source_ids: [homepage, uw-profile]
      - text: >-
          At NVIDIA, Fox was among the authors of the Cosmos World Foundation Model Platform paper, which released
          open-weight world models for physical AI, and of GR00T N1, an open foundation model for humanoid robots.
          The Ai2 Robotics team that Fox leads builds scalable simulation domains to study how robot foundation
          models scale and generalize.
        source_ids: [cosmos-paper, gr00t-paper, ai2-robotics-job]
