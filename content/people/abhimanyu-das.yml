sections:
  - heading: Career
    paragraphs:
      - text: >-
          Das obtained a PhD in computer science from the University of Southern California under David Kempe, with
          research on algorithms for subset selection and sparse approximation. Before the PhD, Das spent several
          years in industry at Cortina Systems and Mahi Networks, working on software stacks for networking and
          embedded systems.
        source_ids: [das-site]
      - text: >-
          Before Google, Das was a researcher at Microsoft Research and at Yahoo! Labs. At Google, Das is now a
          Principal Research Scientist heading work on predictive models for structured data.
        source_ids: [das-site]
  - heading: Research
    paragraphs:
      - text: >-
          Das's research spans machine learning, data mining and theoretical computer science. Early work with David
          Kempe connected submodularity and spectral analysis for subset selection (ICML 2011), and later papers
          covered display advertising, graph neural networks and bandits.
        source_ids: [das-site]
      - text: >-
          Das's recent work centers on time-series forecasting: the TiDE encoder (2023), the decoder-only TimesFM
          foundation model (posted in 2023 and presented at ICML 2024), in-context fine-tuning for time-series
          foundation models (ICML 2025), and multimodal time-series forecasting (2026). Google Research's
          TimesFM-3 announcement names Das among the collaborators.
        source_ids: [das-site, tide-paper, timesfm-paper, timesfm3-blog]
