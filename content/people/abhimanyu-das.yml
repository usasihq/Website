headline: Google Principal Research Scientist leading structured-data models such as TimesFM; TimesFM paper first author
bio:
  text: >-
    Abhimanyu Das is a Principal Research Scientist at Google, where Das leads efforts on predictive models for
    structured data, including the time-series and tabular foundation models TimesFM and TabFM. Das is first
    author of "A decoder-only foundation model for time-series forecasting", the paper behind TimesFM, and earlier
    worked as a researcher at Microsoft Research and Yahoo! Labs.
  source_ids: [das-site, timesfm-paper]
  reviewed_at: 2026-10-22
