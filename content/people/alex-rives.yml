headline: Head of Science at Biohub; founder and former chief scientist of EvolutionaryScale, developer of ESM3
bio:
  text: >-
    Alex Rives is the Head of Science at Biohub, where Rives leads work at the intersection of
    artificial intelligence and biology. Rives was a founder and the chief scientist of
    EvolutionaryScale, the developer of the ESM3 and ESM Cambrian protein language models, which
    is now part of Biohub. Biohub's biography also lists Rives as a Core Institute Member at the
    Broad Institute and an Assistant Professor in EECS at MIT.
  source_ids: [biohub-bio, evo-home]
  reviewed_at: 2026-10-21
