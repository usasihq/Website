sections:
  - heading: Career
    paragraphs:
      - text: >-
          Rives started and led the Evolutionary Scale Modeling project at Meta's fundamental AI
          research lab, which built transformer language models trained on protein sequences. Rives
          was then a founder and the chief scientist of EvolutionaryScale, a public-benefit company
          developing AI for biology.
        source_ids: [biohub-bio]
      - text: >-
          EvolutionaryScale is now part of Biohub, and its ESM models and services are offered
          through Biohub. As Head of Science, Rives leads Biohub's work combining artificial
          intelligence and biology.
        source_ids: [biohub-bio, evo-home, esm-gh]
  - heading: Research
    paragraphs:
      - text: >-
          Rives was the first author of the paper showing that biological structure and function
          emerge from unsupervised learning on 250 million protein sequences, the work behind the
          ESM-1b model. Later work led to ESM-2 and ESMFold, which predicts protein structure
          directly from a sequence using the ESM-2 language model.
        source_ids: [fb-esm]
      - text: >-
          The ESM3 preprint, with Rives as senior author, presents a model that reasons jointly over
          protein sequence, structure and function. EvolutionaryScale used ESM3 to design esmGFP, a
          new green fluorescent protein generated with chain-of-thought prompting.
        source_ids: [esm3-preprint, evo-home]
timeline:
  - date: "2020-12"
    text: The ESM repository added the ESM-1b protein language model described in Rives et al.
    source_ids: [fb-esm]
  - date: "2022-08"
    text: The ESM-2 protein language models were released through the ESM repository.
    source_ids: [fb-esm]
  - date: "2022-11"
    text: ESMFold, an end-to-end structure prediction model built on ESM-2, was released.
    source_ids: [fb-esm]
  - date: "2024-07-02"
    text: Posted the ESM3 preprint on simulating protein evolution with a language model as senior author.
    source_ids: [esm3-preprint]
  - date: "2024"
    text: EvolutionaryScale introduced the ESM Cambrian protein representation models.
    source_ids: [esmc-blog]
