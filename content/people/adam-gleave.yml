sections:
  - heading: Career
    paragraphs:
      - text: >-
          Gleave completed a PhD in artificial intelligence at UC Berkeley from 2017 to 2022, advised by Stuart Russell, with a thesis titled "Towards Trustworthy
          Machine Learning". During the PhD, Gleave was a research intern at DeepMind in 2019 and 2021,
          working with Geoffrey Irving and Jan Leike.
        source_ids: [gleave-cv, gleave-site]
      - text: >-
          Gleave co-founded FAR.AI in January 2022 and serves as its CEO. Gleave also serves on the boards
          of METR (since May 2024), the London Initiative for Safe AI (since July 2024) and the Safe AI Forum
          (since December 2024).
        source_ids: [gleave-cv, far-profile, gleave-site]
  - heading: Research
    paragraphs:
      - text: >-
          Gleave's research concerns making advanced AI systems verifiably safe, ranging from value
          learning and robustness in deep reinforcement learning to detecting hidden or deceptive behavior
          in frontier models. The 2019 paper "Adversarial Policies: Attacking Deep Reinforcement Learning"
          and the 2022 paper "Adversarial Policies Beat Superhuman Go AIs" studied how trained agents can be
          exploited by adversarial opponents.
        source_ids: [far-profile, adv-policies-paper, go-paper]
      - text: >-
          Gleave's reward-learning work includes "Quantifying Differences in Reward Functions" (ICLR 2021)
          and the imitation library of clean imitation learning implementations. Later work with FAR.AI
          colleagues covers scaling trends in language model robustness (ICML 2025) and deception probes in
          reinforcement learning from verifiable rewards (ICML 2026).
        source_ids: [gleave-cv, imitation-paper]
