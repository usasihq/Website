headline: Co-founder and CEO of FAR.AI; researcher on adversarial robustness and reward learning
bio:
  text: >-
    Adam Gleave is the co-founder and CEO of FAR.AI, an AI safety research nonprofit, where Gleave sets
    the overall research agenda and manages the technical staff. Gleave completed a PhD in artificial
    intelligence at UC Berkeley advised by Stuart Russell, and has published on adversarial policies,
    reward learning and the robustness of language models.
  source_ids: [far-profile, gleave-site, gleave-cv]
  reviewed_at: 2026-10-22
