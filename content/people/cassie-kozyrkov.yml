headline: CEO of Kozyr and author of the Decision Intelligence newsletter on AI and data-driven decisions
bio:
  text: >-
    Cassie Kozyrkov is the CEO of Kozyr, which offers AI advising, speaking, and online courses on AI,
    data, and decision-making. Cassie writes the Substack newsletter Decision Intelligence, which covers
    applied data science and the skills needed to lead AI projects responsibly. Cassie previously served
    as Google's first Chief Decision Scientist, training Googlers in AI and data-driven decision-making.
