sections:
  - heading: Career
    paragraphs:
      - text: >-
          Cassie Kozyrkov was the first person to hold the role of Chief Decision Scientist at Google,
          where Cassie trained Googlers in AI and data-driven decision-making. Duke University's
          Graduate School credits Kozyrkov with founding decision intelligence at Google, a field that
          combines data science, psychology, and managerial decision-making.
        source_ids: [about, duke-few-glasson]
      - text: >-
          In September 2024 the Duke Graduate School described Kozyrkov as leading Data Scientific, which
          provided education and consulting on using data and AI in decisions. Kozyr's official site now
          presents Kozyrkov as the company's CEO, offering AI advising, keynote speaking, and online
          courses.
        source_ids: [duke-few-glasson, about, site]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Kozyrkov's Decision Intelligence newsletter presents the field as a blend of applied data
          science, social science, and managerial science, written with a light, humorous tone. Early
          editions included an audio introduction to decision intelligence in October 2019, followed by
          a themed mini-course on statistics in 2020.
        source_ids: [substack, di-intro-post, stats-course-post]
      - text: >-
          In November 2021 the newsletter announced that Making Friends with Machine Learning, a course
          aimed at both beginners and experts, was available in full and free on YouTube. More recent
          editions cover AI and leadership, and in November 2025 Kozyrkov opened a second cohort of the
          course Decision-Making with ChatGPT.
        source_ids: [mfml-post, chatgpt-course-post]
