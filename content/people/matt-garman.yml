headline: CEO of Amazon Web Services since June 2024; first product manager for Amazon EC2
bio:
  text: >-
    Matt Garman has been CEO of Amazon Web Services since June 2024 and is a member of Amazon's
    senior leadership team, the S-team. Garman joined Amazon as an MBA intern in 2005, became one
    of the first AWS product managers in 2006, and helped launch the initial set of AWS services.
    Amazon's 2024 leadership announcement describes Garman as the first product manager for EC2,
    as the leader of the team that defined, launched and operated Amazon EBS, and as general
    manager of all AWS Compute services from 2016. From 2020, Garman led AWS worldwide sales,
    marketing, support and professional services before taking the CEO role.
  source_ids: [amzn-ir-bio, aa-author, s-team, aws-update-2024]
  reviewed_at: 2026-10-21
