sections:
  - heading: Career
    paragraphs:
      - text: >-
          Matt Garman first came to Amazon as an MBA intern in the summer of 2005 and joined full
          time in 2006 as one of the first AWS product managers. Working across AWS in those early
          years, Garman helped create the first service level agreements, define new features and
          set up new pricing plans.
        source_ids: [aws-update-2024]
      - text: >-
          Garman became the first product manager for Amazon EC2, led EC2 product management in its
          early years, and led the team that defined, launched and operated Amazon EBS. Garman became
          general manager of all AWS Compute services in 2016, and Amazon's author biography notes
          responsibility for product management, engineering and operations across AWS compute and
          storage services.
        source_ids: [aws-update-2024, aa-author]
      - text: >-
          In 2020 Garman took on leadership of AWS worldwide sales, marketing, support and professional
          services, serving as Senior Vice President of AWS Sales, Marketing, and Global Services.
          Amazon announced in May 2024 that Garman would become CEO of AWS effective June 3, and
          Amazon lists Garman as a member of its S-team.
        source_ids: [aws-update-2024, amzn-ir-bio, s-team]
  - heading: Products and projects
    paragraphs:
      - text: >-
          As AWS CEO, Garman gave the main keynote at re:Invent 2024 on December 3, 2024. Amazon's
          event coverage says the keynote introduced Trainium2-powered EC2 instances and Trn2
          UltraServers, the Trainium3 chip, Amazon Nova foundation models, new Amazon Bedrock
          capabilities and the next generation of Amazon SageMaker.
        source_ids: [reinvent-2024]
