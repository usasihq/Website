sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Harrison Kinsley started the sentdex YouTube channel in December 2012. The channel offers Python
          programming tutorials that go beyond the basics, covering machine learning, finance, data analysis,
          robotics, web development and game development.
        source_ids: [sentdex-channel]
      - text: >-
          PythonProgramming.net, the companion site, offers free tutorials on a variety of programming topics
          and describes its aim as free programming education for everyone.
        source_ids: [ppn-about]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Neural Networks from Scratch in Python teaches readers to build neural networks without libraries,
          starting with single neurons and layers and moving through activation functions, cross-entropy loss,
          backpropagation and optimizers such as SGD, AdaGrad, RMSprop and Adam. Each step is shown first in pure
          Python and then with NumPy, and the book accompanies the free sentdex videos.
        source_ids: [nnfs-book]
      - text: >-
          Kinsley publishes the book's sample code and the nnfs helper package on GitHub, along with NNfSiX, a
          repository of neural networks from scratch in various programming languages.
        source_ids: [github-profile, nnfs-package]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Kinsley's GitHub projects include pygta5, which explores using Python to play Grand Theft Auto V,
          GANTheftAuto, TermGPT, which gives language models the ability to plan and run terminal commands, and
          minion, a single-file coding agent for self-hosted models served by llama.cpp, vLLM or SGLang.
        source_ids: [github-profile]
