headline: Creator of sentdex, a YouTube channel of Python and machine-learning tutorials
bio:
  text: >-
    Harrison Kinsley publishes as sentdex, a YouTube channel of Python programming tutorials that
    covers machine learning, data analysis, finance, robotics, web development and game
    development. The companion site PythonProgramming.net offers free tutorials on a variety
    of programming topics. Harrison is also behind Neural Networks from Scratch, a book that teaches
    building neural networks in Python without libraries and accompanies the sentdex videos, and
    is the listed author of the nnfs Python package used with it.
  source_ids: [sentdex-channel, ppn-about, nnfs-book, nnfs-package, github-profile]
  reviewed_at: 2026-10-21
