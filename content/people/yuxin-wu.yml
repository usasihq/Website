sections:
  - heading: Career
    paragraphs:
      - text: >-
          Wu worked on computer vision at Facebook AI Research and on foundation models at Google
          Brain. Wu now builds foundation models at Moonshot AI, the company behind Kimi.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Wu's research at FAIR covered normalization, representation learning and segmentation. With Kaiming
          He, Wu wrote "Group Normalization" (ECCV 2018), and Wu co-authored Momentum Contrast (MoCo, CVPR 2020)
          for unsupervised visual representation learning, PointRend (CVPR 2020) for image segmentation and
          "Feature Denoising for Improving Adversarial Robustness" (CVPR 2019).
        source_ids: [homepage, groupnorm-paper, moco-paper, pointrend-paper]
      - text: >-
          Earlier work includes DoReFa-Net (2016) on training low-bitwidth networks and reinforcement learning
          agents for first-person shooter games. At Moonshot AI, Wu is listed with the Kimi Team on the 2025
          Kimi K2 report, which describes an open-weight agentic language model.
        source_ids: [homepage, dorefa-paper, kimi-k2-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Wu created Detectron2, FAIR's library for detection and segmentation, which supports training and
          deployment for Meta products and received the Mark Everingham Prize at ICCV 2021. Wu also wrote
          Tensorpack, a neural network training interface for TensorFlow focused on speed and flexibility.
        source_ids: [homepage, detectron2-readme]
