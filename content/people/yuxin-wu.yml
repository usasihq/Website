headline: Creator of Detectron2; builds foundation models at Moonshot AI; formerly at Google Brain and FAIR
bio:
  text: >-
    Yuxin Wu builds foundation models at Moonshot AI (Kimi), after working on foundation models at
    Google Brain and on computer vision at Facebook AI Research (FAIR). Wu's site says Wu created
    Detectron2, FAIR's detection and segmentation library, which is released under the Apache 2.0
    license and lists Wu first in its citation entry. Wu's research includes Group Normalization with
    Kaiming He and co-authorship of MoCo and PointRend, and Wu describes expertise in research and
    infrastructure for deep learning and computer vision.
  source_ids: [homepage, detectron2-readme, moco-paper]
  reviewed_at: 2026-10-13
