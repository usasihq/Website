sections:
  - heading: Career
    paragraphs:
      - text: >-
          From 1984 to 1990 Kevin Kelly edited the Whole Earth Review, served as acting publisher of the Whole
          Earth Catalogs, and directed the Point Foundation. In that period Kelly co-initiated the Hackers'
          Conference in 1985, served on the board of the early online service the WELL from its start until 1998,
          edited Signal, a 1988 catalog of communication tools, and organized Cyberthon, a public gathering of
          early virtual reality systems.
        source_ids: [biography]
      - text: >-
          Kelly was the founding executive editor of Wired from 1992 to 1999; the magazine's first issue appeared
          in January 1993, and it won the National Magazine Award for General Excellence in 1994 and 1997. Kelly
          is now Wired's Senior Maverick, and is a founding board member and co-chair of The Long Now Foundation,
          where Kelly also started Long Bets with Stewart Brand in 2001.
        source_ids: [biography]
  - heading: Books and writing
    paragraphs:
      - text: >-
          Kelly's books on technology include Out of Control (1994), about machines, economies and other human-made
          systems becoming more biological; New Rules for the New Economy (1998); What Technology Wants (2010),
          which offers a theory of technology; and The Inevitable (2016), on technological trends over the coming
          decades. Excellent Advice for Living, a collection of 450 short proverbs, followed in 2023.
        source_ids: [biography]
      - text: >-
          Kelly launched The Technium, a blog about the nature of technology, in 2005, and in 2009 started the
          Quantified Self with Gary Wolf. Kelly also writes a weekly Substack newsletter.
        source_ids: [biography, home]
  - heading: Cool Tools
    paragraphs:
      - text: >-
          Kelly started Cool Tools as an email list and, from 2003, as a website that reviews tools daily, and in 2013
          published a selection from the site as the book Cool Tools: A Catalog of Possibilities. Kelly also co-writes
          the Recomendo newsletter, started in 2017 with Mark Frauenfelder and Claudia Dawson, and in 2020 began a
          Cool Tools YouTube channel.
        source_ids: [biography, cool-tools]
