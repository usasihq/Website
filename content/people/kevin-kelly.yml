headline: Wired co-founder and Senior Maverick, author of books on the future of technology, Cool Tools founder
bio:
  text: >-
    Kevin Kelly co-founded Wired in 1993, served as its executive editor for its first seven years,
    and is now its Senior Maverick. Kevin writes books about technology and the future, including
    Out of Control, What Technology Wants and The Inevitable, and founded Cool Tools, a website
    that publishes reader-written reviews of tools, gadgets, software and books. Kevin is also
    co-chair of The Long Now Foundation and earlier was publisher and editor of the Whole Earth
    Review. Current writing appears on a weekly Substack and the Technium blog.
  source_ids: [biography, home, cool-tools]
  reviewed_at: 2026-10-17
