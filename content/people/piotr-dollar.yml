headline: Research director at Meta's FAIR; co-author of Segment Anything, COCO and Mask R-CNN; SAM 3 project lead
bio:
  text: >-
    Piotr Dollár is a research director at Facebook AI Research (FAIR) at Meta, working on deep
    learning and computer vision; Dollár's site says the role began in 2014, after helping co-found
    Anchovi Labs and spending some years at Microsoft Research. Dollár is a co-author of the original
    Segment Anything paper and of SAM 2, and is one of the project leads listed in the SAM 3
    repository. Earlier work includes co-authorship of the Microsoft COCO dataset paper, Mask R-CNN,
    and Focal Loss, and Dollár is listed among the authors in the citation entry for FAIR's Detectron.
  source_ids: [homepage, meta-profile, sam-paper, sam2-paper, sam3-readme, coco-paper, maskrcnn-paper, detectron-readme]
  reviewed_at: 2026-10-13
