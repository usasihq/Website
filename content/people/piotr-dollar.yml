sections:
  - heading: Career
    paragraphs:
      - text: >-
          Piotr Dollár completed a PhD in computer science at the University of California, San Diego in
          2007 with a dissertation on learning from local image regions, then held a postdoctoral
          fellowship at Caltech until 2011. From 2010 to 2011 Dollár was a cofounder of Anchovi Labs,
          which Dropbox acquired in 2012.
        source_ids: [dollar-cv, homepage]
      - text: >-
          Dollár was a researcher at Microsoft Research from November 2011 to September 2014 and has been
          a research director at Facebook AI Research since September 2014. Meta's profile lists
          research interests in recognition, grouping, network design, and self-supervised learning.
          Dollár has served as an area chair for CVPR, ICCV, ECCV, and NeurIPS.
        source_ids: [dollar-cv, meta-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Dollár co-authored the 2014 paper introducing Microsoft COCO, a dataset for object recognition
          in everyday scenes, and in 2017 co-authored Feature Pyramid Networks, Focal Loss for dense
          object detection, and Mask R-CNN. Mask R-CNN and related detection work were released in FAIR's
          Detectron codebase, whose citation entry lists Dollár among the authors.
        source_ids: [coco-paper, maskrcnn-paper, dollar-cv, detectron-readme]
      - text: >-
          Later work includes Masked Autoencoders Are Scalable Vision Learners (CVPR 2022) and the
          Segment Anything line of models. Dollár co-authored Segment Anything in 2023 and SAM 2 in 2024,
          is an author of the SAM 3 paper from November 2025, and is named among the project leads in the
          SAM 3 repository.
        source_ids: [dollar-cv, sam-paper, sam2-paper, sam3-paper, sam3-readme]
