sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hie completed a PhD in electrical engineering and computer science at MIT's Computer Science and
          Artificial Intelligence Laboratory from 2017 to 2021, working on neural language modeling of viral
          evolution and machine learning for biological discovery. Hie was then a Stanford Science Fellow at
          the Stanford University School of Medicine (2021–2023) and a visiting researcher at Meta AI FAIR
          (2022–2023), working on machine learning for protein biology.
        source_ids: [hie-cv, hie-site]
      - text: >-
          Hie is now an Assistant Professor of Chemical Engineering at Stanford and the Dieter Schwarz
          Foundation Stanford Data Science Faculty Fellow, and since 2024 an Innovation Investigator at Arc
          Institute, focused on genomic sequence modeling for biological prediction and design.
        source_ids: [hie-site, hie-cv]
  - heading: Research
    paragraphs:
      - text: >-
          Hie's laboratory works at the intersection of biology and AI. Hie was a co-corresponding author of Evo (Science,
          2024), a model for sequence modeling and design from molecular to genome scale, and co-senior author
          of Evo 2, announced by Arc Institute in February 2025 and published in Nature in 2026, which models
          and designs genomes across all domains of life.
        source_ids: [hie-site, evo-paper, arc-evo2, evo2-paper]
      - text: >-
          Later papers co-authored by Hie include semantic design of functional de novo genes with a genomic
          language model (Nature, 2025) and generative design of bacteriophages with a genome language model
          (Science, 2026).
        source_ids: [hie-cv]
