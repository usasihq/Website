headline: Stanford assistant professor and Arc Institute Innovation Investigator; co-senior author of Evo 2
bio:
  text: >-
    Brian Hie is an Assistant Professor of Chemical Engineering at Stanford University, where Hie leads the
    Laboratory of Evolutionary Design, and an Innovation Investigator at Arc Institute. Hie is a co-corresponding
    author of Evo (Science, 2024) and a co-senior and co-corresponding author of Evo 2 (Nature, 2026), genome
    language models whose Evo 2 weights Arc Institute releases in 20B and 40B sizes.
  source_ids: [hie-site, hie-cv, evo-paper, evo2-paper, arc-evo2]
  reviewed_at: 2026-10-22
