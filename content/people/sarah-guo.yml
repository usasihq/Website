headline: Co-host of No Priors, a podcast about AI, and founder of the venture firm Conviction
bio:
  text: >-
    Sarah Guo co-hosts No Priors with Elad Gil, a podcast in which the hosts talk with engineers,
    researchers, and founders about AI research, markets, and how the technology may change commerce and
    society. The show's channel describes Sarah as a startup investor and the founder of Conviction, an
    investment firm for intelligent software, or "Software 3.0", companies, and says Sarah previously spent nearly a
    decade incubating and investing at Greylock Partners. Conviction's site lists Sarah among its people.
