sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          No Priors, which Guo co-hosts with Elad Gil, has published on its own YouTube channel since April 2023.
          The show presents itself as a guide to the AI revolution, with conversations about how close general AI
          may be, which markets face disruption, how commerce and culture may change and what is new in research.
        source_ids: [channel]
  - heading: Career
    paragraphs:
      - text: >-
          According to the No Priors channel, Guo founded Conviction and earlier spent nearly a decade incubating
          and investing at Greylock Partners. Conviction describes itself as a venture firm built for AI-native,
          "Software 3.0" companies, a term it uses for software built by working with foundation models, and its
          site lists Guo among its people.
        source_ids: [channel, conviction, embed]
      - text: >-
          Conviction runs Embed, a selective program for early founding teams building AI-native startups that
          combines a shared community with company-building advice, and Commit, a fellowship program for young
          people working in AI.
        source_ids: [embed, commit]
