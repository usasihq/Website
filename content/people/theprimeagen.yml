sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          ThePrimeagen's YouTube channel, which YouTube lists as joined in May 2018, publishes videos
          on software development under the stated topics of Vim, Rust, and TypeScript. ThePrimeagen's
          teacher page describes a focus on enjoying the development experience and sharing it with
          others, with Vim as a tool that lets developers tune their setup exactly as they want.
        source_ids: [channel, masterdev]
  - heading: Teaching
    paragraphs:
      - text: >-
          ThePrimeagen teaches video courses on Master.dev. VIM Fundamentals (April
          2021) opens with an overview of the ed editor and the history of Vim, and The Last
          Algorithms Course You'll Need (September 2022) covers algorithms and data structures in
          TypeScript for technical interviews.
        source_ids: [masterdev, course-vim, course-algorithms]
      - text: >-
          Later courses include Rust for TypeScript Developers (April 2023), which begins by comparing
          the two languages, and Blazingly Fast JavaScript (January 2024) on JavaScript performance.
          The teacher page also lists courses on Git, HTMX with Go, polyglot programming in
          TypeScript, Go, and Rust, and a developer setup course.
        source_ids: [course-rust, course-fastjs, masterdev]
