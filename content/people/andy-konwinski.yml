sections:
  - heading: Career
    paragraphs:
      - text: >-
          Konwinski completed a PhD in computer science at UC Berkeley, where Konwinski contributed to Hadoop,
          co-created the Mesos cluster manager and was part of the team that created Spark. During graduate
          school Konwinski also worked at Google on the Omega cluster scheduler. Konwinski then co-founded
          Databricks, serving as VP Product AI/ML, creating the Data + AI Summit and co-writing the O'Reilly
          book Learning Spark.
        source_ids: [konwinski-about, mesos-paper]
      - text: >-
          AWS's startup profile of Perplexity names Konwinski as one of its four founding engineers in 2022,
          and Konwinski's site says Konwinski was the company's founding President. Konwinski later co-founded
          Laude Institute, which gives grants and support to computer scientists turning research into startups
          or open-source infrastructure, and Laude Ventures. Konwinski also teaches a Berkeley PhD seminar
          called Research to Startups.
        source_ids: [aws-perplexity-article, konwinski-about, laude-site, laude-ventures-post]
  - heading: Agents and benchmarks
    paragraphs:
      - text: >-
          In May 2024 Konwinski introduced Headless Terminal (ht), an open-source program built with the
          creator of asciinema that wraps a terminal so that language-model agents can send it input and read
          text screenshots of its state. In December 2024 Konwinski announced the K Prize, a competition run at
          Laude for open-source AI that can solve a contamination-free version of the SWE-bench coding
          benchmark, with a new test set collected after the submission deadline.
        source_ids: [headless-terminal-post, ht-repo, k-prize-post, konwinski-about]
      - text: >-
          At Laude, Konwinski's team co-created the Terminal-Bench benchmark and the Harbor framework with
          Ludwig Schmidt's group at Stanford. The Terminal-Bench paper, posted in January 2026 with Konwinski
          among the authors, presents Terminal-Bench 2.0, a set of hard tasks in computer terminal environments
          for evaluating AI agents.
        source_ids: [konwinski-about, tb-paper, laude-site]
