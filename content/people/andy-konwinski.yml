headline: Co-founder of Laude, Databricks and Perplexity; co-author of the Terminal-Bench and Mesos papers
bio:
  text: >-
    Andy Konwinski co-founded Laude (Institute and Ventures), Databricks and Perplexity, and teaches a
    PhD seminar called Research to Startups in UC Berkeley's computer science department. At
    Databricks, Konwinski was VP Product AI/ML, created the Data + AI Summit and co-authored the
    O'Reilly book Learning Spark; at Perplexity, Konwinski was the founding President. Konwinski's site
    says that during PhD studies at UC Berkeley Konwinski co-created Mesos and was part of the team
    that created Spark, and the Apache Spark committers page lists Konwinski as a committer. Laude
    co-created the Terminal-Bench benchmark with Ludwig Schmidt's group at Stanford, and Konwinski is
    a co-author of the Terminal-Bench paper.
  source_ids: [konwinski-about, laude-site, spark-committers, mesos-paper, tb-paper]
  reviewed_at: 2026-10-13
