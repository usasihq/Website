headline: Co-lead of OpenAI's Post-training Frontiers team; co-author of Direct Preference Optimization (DPO)
bio:
  text: >-
    Eric Mitchell co-leads the Post-training Frontiers team at OpenAI with Yann Dubois, a team that
    post-trains and deploys large models such as o1, o3, and GPT-5-Thinking. Mitchell earned a PhD
    in computer science at Stanford, advised by Chelsea Finn and Christopher D. Manning, with work on
    making language models more trustworthy and easier to use. During that time Mitchell co-authored
    the Direct Preference Optimization (DPO) paper and was first author of DetectGPT, a zero-shot
    method for detecting machine-generated text.
  source_ids: [mitchell-site, dpo-paper, detectgpt-paper]
  reviewed_at: 2026-10-13
