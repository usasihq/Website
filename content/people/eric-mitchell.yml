sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before graduate school, Eric Mitchell was a research engineer at Samsung's AI Center,
          after an undergraduate thesis supervised by H. Sebastian Seung at the Princeton Neuroscience
          Institute. Mitchell then earned a PhD in computer science at Stanford advised by Chelsea Finn and
          Christopher D. Manning, with a 2022 research internship at DeepMind.
        source_ids: [mitchell-site]
      - text: >-
          At OpenAI, Mitchell co-leads the Post-training Frontiers team with Yann Dubois. The team post-trains
          and deploys large models including o1, o3 and GPT-5-Thinking.
        source_ids: [mitchell-site]
  - heading: Research
    paragraphs:
      - text: >-
          Mitchell's doctoral research aimed to make language models more trustworthy and easier to use,
          with interests in factuality, continual learning, intent understanding and scalable oversight.
          MEND (2021), first-authored by Mitchell, edits the behaviour of large pre-trained models on specific
          inputs while leaving the rest of the model intact.
        source_ids: [mitchell-site, mend-paper]
      - text: >-
          In 2023 Mitchell was first author of DetectGPT, which detects machine-generated text from the
          curvature of a model's log-probability, and a co-author of Direct Preference Optimization, which
          fits language models to preference data with a simple classification loss instead of reinforcement
          learning. Later work with
          Katherine Tian fine-tuned language models to reduce factual errors using automatically generated
          factuality preferences.
        source_ids: [detectgpt-paper, dpo-paper, factuality-paper]
