slug: clement-delangue
name: Clément Delangue
initials: CD
headline: Co-founder and CEO of Hugging Face, whose Hub distributes open models and the libraries used to run them
bio:
  text: >-
    Clément Delangue co-founded Hugging Face with Julien Chaumond and Thomas Wolf and is its CEO. Hugging
    Face runs the Hub, where developers publish and download open models and datasets, and maintains
    open-source libraries such as Transformers; the 2019 paper introducing Transformers lists Delangue
    among its authors. Delangue's documented role is leading the company and its platform; this profile
    does not credit Delangue with writing the libraries or runtimes. NVIDIA's September 2026 announcement
    of its agreement to acquire Hugging Face describes Delangue considering the company's next chapter.
  source_ids: [hf-pollen, nvidia-open-models, nvidia-hf-acquire, transformers-paper, hf-hub-docs]
