sections:
  - heading: Career
    paragraphs:
      - text: >-
          Clément Delangue co-founded Hugging Face with Julien Chaumond and Thomas Wolf and serves as its
          chief executive. Hugging Face describes itself as a platform for AI builders that hosts open
          models, datasets, and ready-to-use applications.
        source_ids: [hf-pollen]
      - text: >-
          In April 2025 Delangue co-authored Hugging Face's announcement that it was acquiring Pollen
          Robotics, the maker of the Reachy robots, extending the company's open robotics work beyond
          the LeRobot library. In September 2026 NVIDIA announced an agreement to acquire Hugging Face,
          writing that Delangue had approached NVIDIA while considering the company's next chapter and
          that Hugging Face would remain an open platform.
        source_ids: [hf-pollen, nvidia-hf-acquire]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Delangue is a co-author of the 2019 paper introducing the Transformers library and of the 2021
          paper describing Datasets, a community library for natural language processing data. These
          author credits are the documented links between Delangue and the libraries; the code itself
          is credited to the wider Hugging Face team and community.
        source_ids: [transformers-paper, datasets-paper]
      - text: >-
          As CEO, Delangue has represented Hugging Face in partner announcements about open models,
          including NVIDIA's October 2025 announcement of new open models and data, which quotes
          Delangue as Hugging Face's CEO.
        source_ids: [nvidia-open-models]
