sections:
  - heading: Algorithms research
    paragraphs:
      - text: >-
          Pachocki's early papers were in theoretical computer science, on graph algorithms and numerical linear
          algebra. "Geometric Median in Nearly Linear Time" (2016), with Michael B. Cohen, Yin Tat Lee, Gary
          Miller and Aaron Sidford, gave faster algorithms for a classic optimization problem. The same year
          Pachocki posted the single-author "Analysis of Resparsification" on matrix sparsification and co-authored
          a paper on fast algorithms for approximating girth and roundtrip spanners in directed graphs.
        source_ids: [geometric-median-paper, resparsification-paper, girth-paper]
  - heading: Research at OpenAI
    paragraphs:
      - text: >-
          At OpenAI Pachocki worked on reinforcement learning. Pachocki co-authored "Emergent Complexity via
          Multi-Agent Competition" (2017) and the 2018 paper on learning dexterous in-hand manipulation with a
          robotic hand, and the Dota 2 paper credits Pachocki and Szymon Sidor with setting research direction
          throughout the OpenAI Five project.
        source_ids: [emergent-complexity-paper, dexterous-paper, dota-paper]
      - text: >-
          Pachocki later worked on large language models. Pachocki co-authored "Tensor Programs V" (2022) on
          transferring hyperparameters from small to large networks, and the GPT-4 Technical Report credits
          Pachocki as overall lead and optimization lead for pretraining. The OpenAI o1 System Card lists Pachocki
          in reasoning research leadership and executive leadership, and Pachocki co-authored the 2025 paper on
          competitive programming with large reasoning models.
        source_ids: [mup-paper, gpt4-report, o1-card, competitive-programming-paper]
      - text: >-
          As OpenAI's Chief Scientist, Pachocki is among the contributors to the gpt-oss-120b and gpt-oss-20b
          model card, whose models are released under the Apache License 2.0. Pachocki also co-authored the 2025
          position paper "Chain of Thought Monitorability", which discusses monitoring models' reasoning as an
          opportunity for AI safety.
        source_ids: [oai-dev-blog, gpt-oss-card, gpt-oss-repo, cot-monitorability-paper]
