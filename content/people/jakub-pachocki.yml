headline: Chief Scientist at OpenAI; overall pretraining lead for GPT-4; set research direction for OpenAI Five
bio:
  text: >-
    Jakub Pachocki is OpenAI's Chief Scientist, as named in a September 2025 OpenAI developer blog
    post, and is listed with an OpenAI affiliation on a September 2026 paper. The GPT-4 Technical Report credits
    Pachocki as overall lead and optimization lead for pretraining, and the Dota 2 paper says Pachocki
    and Szymon Sidor set research direction throughout the OpenAI Five project. The OpenAI o1 System
    Card lists Pachocki in both the reasoning research leadership and executive leadership, and
    Pachocki appears among the contributors to the gpt-oss-120b and gpt-oss-20b model card.
  source_ids: [oai-dev-blog, ie-paper, gpt4-report, dota-paper, o1-card, gpt-oss-card]
  reviewed_at: 2026-10-21
