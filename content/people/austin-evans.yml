headline: Host of the Austin Evans YouTube channel on gaming PCs, smartphones and gadgets
bio:
  text: >-
    Austin Evans hosts a YouTube channel about consumer technology, from gaming PCs to
    smartphones. Videos test new gadgets and phones, ask whether new products are worth buying,
    and look at both retro and new tech. The channel is produced with a staff of producers,
    camera operators and video editors.
