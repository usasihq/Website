headline: Building Cursor at Anysphere; former Meta visiting researcher working on 3D generation
bio:
  text: >-
    Luke Melas-Kyriazi joined Anysphere to build Cursor and is most interested in training large language
    models for coding. Melas-Kyriazi completed a PhD at Oxford in the Visual Geometry Group, advised by
    Andrea Vedaldi, with research across machine learning, computer vision, and natural language
    processing. During the PhD, Melas-Kyriazi also worked part-time as a visiting researcher at Meta
    Research, and is co-first author, with Meta and Oxford affiliations, of IM-3D (ICML 2024), which
    generates 3D objects by combining video-based multi-view generation with Gaussian-splatting
    reconstruction.
