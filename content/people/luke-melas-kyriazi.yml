sections:
  - heading: Career
    paragraphs:
      - text: >-
          Luke Melas-Kyriazi earned a DPhil at Oxford in the Visual Geometry Group, advised by Andrea Vedaldi. During the PhD,
          Melas-Kyriazi worked part-time as a visiting researcher at Meta Research, and after defending the thesis
          joined Anysphere to build Cursor, with a focus on training large language models for coding.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Melas-Kyriazi's computer-vision work centers on 3D reconstruction and generation. With Christian Rupprecht
          and Vedaldi (and Iro Laina on RealFusion), Melas-Kyriazi presented RealFusion, which reconstructs a full 360-degree object from a
          single image, and projection-conditioned point cloud diffusion for single-image 3D reconstruction, both
          at CVPR 2023; IM-3D at ICML 2024 combined multi-view video generation with Gaussian splatting.
        source_ids: [homepage, im3d-paper]
      - text: >-
          Earlier work includes Deep Spectral Methods for unsupervised semantic segmentation, an oral at CVPR 2022.
          In language research, Melas-Kyriazi co-authored a benchmark for learning to translate a new language from
          a single grammar book (ICLR 2024 spotlight) and the Harvard USPTO Patent Dataset (NeurIPS 2023 Datasets
          and Benchmarks).
        source_ids: [homepage, github-profile]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Melas-Kyriazi publishes PyTorch implementations of EfficientNet and the Vision Transformer, along with
          official code for RealFusion, projection-conditioned point cloud diffusion and Deep Spectral Methods.
        source_ids: [github-profile]
