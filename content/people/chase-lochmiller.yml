headline: Co-founder, CEO and Chairman of Crusoe, which builds AI data centers and the Crusoe Cloud platform
bio:
  text: >-
    Chase Lochmiller is a co-founder of Crusoe and its CEO and Chairman of the Board of Directors.
    Crusoe builds AI infrastructure, from data centers and manufacturing to Crusoe Cloud, a platform for
    training, fine-tuning and serving AI models.
