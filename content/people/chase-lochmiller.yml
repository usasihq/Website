      - text: >-
          Crusoe's leadership page lists Lochmiller and Cully Cavness as the company's founders, with
          Lochmiller as CEO and Chairman of the Board and Cavness as President and Chief Strategy Officer.
          The page describes Lochmiller's work at Crusoe as building a team spanning engineering,
          technology, manufacturing, operations and other functions.
        source_ids: [crusoe-leadership]
