headline: Vice President, Machine Learning at Amazon India; previously vice president at Yahoo Labs
bio:
  text: >-
    Rajeev Rastogi is Vice President, Machine Learning at Amazon India, and joined Amazon in 2012.
    A 2020 Amazon Science profile describes the India machine learning team's work on the shopping
    experience in India, catalog quality, sustainable packaging and COVID-19 response. Before
    Amazon, Rastogi was a vice president at Yahoo Labs, where the team built algorithms for
    extracting structured information from webpages, and earlier worked on scalable clustering
    algorithms at Bell Labs. Rastogi's recent research includes a paper on using uncertainty
    estimates alongside classifier scores to set decision thresholds (ICLR 2024), and Rastogi is
    quoted in Amazon India's July 2026 announcement marking five years of its free Machine Learning
    Summer School for engineering students.
  source_ids: [mlss-2026, science-2020, science-author, uncertainty-paper]
  reviewed_at: 2026-10-13
