sections:
  - heading: Career
    paragraphs:
      - text: >-
          Rajeev Rastogi began a research career at Bell Labs, where early work focused on clustering
          algorithms that could scale to large data sets. Rastogi later served as a vice president of Yahoo
          Labs, whose team built algorithms to extract structured information from webpages and present it to
          users.
        source_ids: [science-2020]
      - text: >-
          Rastogi joined Amazon in 2012, starting with algorithms for classifying products into Amazon's
          product taxonomy. As vice president of machine learning for Amazon India, Rastogi has led work on
          the shopping experience, catalog quality and product packaging, and Amazon Science's author page
          lists Rastogi with the India Machine Learning group.
        source_ids: [science-2020, science-author, mlss-2026]
  - heading: Research
    paragraphs:
      - text: >-
          Papers Rastogi has co-authored at Amazon include a latent factor model for recommending product size
          fits to customers (RecSys 2017), a scalable MinHash-based method for generating higher-order
          features for linear models (CIKM 2018), and a 2024 ICLR paper on using uncertainty estimates to
          choose classifier decision thresholds.
        source_ids: [science-author, uncertainty-paper]
