headline: Chief Open-Source Officer at Hugging Face; co-author of the Transformers library paper and DistilBERT
bio:
  text: >-
    Lysandre Debut works at Hugging Face, where their GitHub and Hugging Face profiles give the title
    Chief Open-Source Officer. Debut is the second-listed author of the paper describing the
    open-source Transformers library, written with a Hugging Face affiliation, and of DistilBERT, a
    smaller distilled version of BERT. Debut is also a co-author of the paper describing the
    community Datasets library for natural language processing.
  source_ids: [github-profile, hf-profile, transformers-paper, distilbert-paper, datasets-paper]
  reviewed_at: 2026-10-21
