sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Lysandre Debut is the second-listed author of the 2019 paper describing the Hugging Face
          Transformers library, written with Thomas Wolf, Victor Sanh, Julien Chaumond, Clement Delangue
          and colleagues. Debut published the release notes for Transformers v4.0.0 on GitHub in November
          2020.
        source_ids: [transformers-paper, transformers-v4-release]
      - text: >-
          In December 2025 Debut was the first-listed author of the Hugging Face blog post announcing
          Transformers v5, which describes a modular approach to adding model architectures and refactored
          modeling and tokenization files. Debut's Hugging Face and GitHub profiles give the title Chief
          Open-Source Officer at Hugging Face.
        source_ids: [transformers-v5-blog, hf-profile, github-profile]
  - heading: Research
    paragraphs:
      - text: >-
          With Victor Sanh, Julien Chaumond and Thomas Wolf, Debut co-authored DistilBERT (2019), which uses
          knowledge distillation during pre-training to produce a smaller general-purpose language model;
          the distilbert-base-uncased checkpoint is published under the Apache 2.0 license. Debut is also a
          co-author of the 2021 paper describing the community Datasets library for natural language
          processing.
        source_ids: [distilbert-paper, distilbert-card, datasets-paper]
