sections:
  - heading: llamafile
    paragraphs:
      - text: >-
          llamafile packages model weights and server code into a single executable built on the
          Cosmopolitan library and llama.cpp; it began as a Mozilla Builders project in 2023. In October
          2025 Nathan Brake and Eynard announced that the llamafile codebase had joined the Mozilla.ai
          GitHub organization and invited community input on its roadmap.
        source_ids: [llamafile-returns, llamafile-readme]
      - text: >-
          Eynard's March 2026 post on llamafile 0.10.0 describes rebuilding the project from the ground up
          on a polyglot build of llama.cpp, adding the full llama.cpp server feature set, multimodal support
          in the terminal chat, Metal and CUDA GPU support, and the bundled whisperfile speech-to-text tool.
        source_ids: [llamafile-010]
  - heading: Other work at Mozilla.ai
    paragraphs:
      - text: >-
          Eynard has also written Mozilla.ai posts on federated phishing detection (March 2026), the
          transcribe.cpp speech-to-text library (June 2026), benchmarking local LLM servers including
          llama.cpp, llamafile, LM Studio and Ollama (September 2026), and search backends for agents in the
          Otari gateway (October 2026).
        source_ids: [eynard-author, transcribe-cpp]
