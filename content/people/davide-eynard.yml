headline: Mozilla.ai engineer working on open-source AI; author of the llamafile 0.10.0 release post
bio:
  text: >-
    Davide Eynard works on open-source and trustworthy AI at Mozilla.ai. Eynard co-wrote the October 2025
    post announcing that Mozilla.ai had adopted the llamafile project and wrote the March 2026 post
    introducing llamafile 0.10.0, which was rebuilt on a polyglot build of llama.cpp while keeping
    llamafile's single-executable portability.
  source_ids: [eynard-author, eynard-github, llamafile-returns, llamafile-010]
  reviewed_at: 2026-10-22
