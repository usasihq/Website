slug: adrien-gallouet
name: Adrien Gallouët
initials: AG
groups: [open-source, local]
sector: corporate
specialties: [inference, developer-tools]
headline: Member of llama.cpp's llama-server and shared-code code-owner teams; Hugging Face
bio:
  text: >-
    Adrien Gallouët contributes to llama.cpp, the C/C++ runtime for running language models on local
    hardware; Gallouët's GitHub profile lists Hugging Face as company and shows membership in the
    huggingface and ggml-org organizations. llama.cpp's CODEOWNERS file includes Gallouët in the
    teams that own llama-server, the project's HTTP server, and its shared common code. Gallouët's
    recent commits add model input and output modalities to the server's model listing, rework
    file-path and cache-directory handling across platforms, clean up compiler warnings in the CUDA
    and Windows builds, and update the vendored HTTP library.
  source_ids: [github-profile, hf-profile, llama-cpp-codeowners, llama-cpp-commits]
  reviewed_at: 2026-10-21
affiliations:
  - name: Hugging Face
    organization_slug: hugging-face
    role: Hugging Face is the company listed on Gallouët's GitHub profile
    current: true
    source_ids: [github-profile, hf-profile]
  - name: llama.cpp project
    organization_slug: null
    role: Member of the llama-server and llama-common code-owner teams
    current: true
    source_ids: [llama-cpp-codeowners]
work:
  - name: llama.cpp
    artifact_slug: llama-cpp
    type: open-source
    url: https://github.com/ggml-org/llama.cpp
    contribution: >-
      CODEOWNERS lists Gallouët in the ggml-org/llama-server and ggml-org/llama-common teams.
      Commits authored in September and October 2026 report model modalities in the server's GET
      /models endpoint, move common code to fs::path for config and cache directories, clean up
      CUDA and Windows warnings, and update the vendored cpp-httplib. The repository is
      MIT-licensed.
    source_ids: [llama-cpp-codeowners, llama-cpp-commits, llama-cpp-license]
  - name: llama-install.sh (formerly installama.sh)
    artifact_slug: null
    type: open-source
    url: https://github.com/ggml-org/llama-install.sh
    contribution: >-
      Started installama.sh, a script for installing llama.cpp, which has since migrated to the
      ggml-org organization as llama-install.sh. The MIT-licensed scripts download a prebuilt llama
      binary and detect CPU and GPU acceleration such as CUDA, ROCm, Vulkan, and Metal.
    source_ids: [installama-repo, llama-install-repo]
  - name: Glorytun and MUD
    artifact_slug: null
    type: open-source
    url: https://github.com/angt/glorytun
    contribution: >-
      Wrote Glorytun, a small multipath UDP tunnel, and MUD, the secure multipath network protocol over
      UDP that provides Glorytun's core features, including AEGIS-256 or ChaCha20-Poly1305 encryption
      and link aggregation with failover.
    source_ids: [glorytun-repo, mud-repo]
links:
  - label: Website
    url: https://angt.github.io
  - label: GitHub
    url: https://github.com/angt
  - label: Hugging Face
    url: https://huggingface.co/angt
sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Adrien Gallouët's pinned GitHub projects center on networking and systems software, mostly in C. They
          include Glorytun, a multipath UDP tunnel, and MUD, the multipath UDP library behind it, along
          with a small secret store, an X11 cloud desktop tool, a minimal PID 1 for initramfs, and an
          HTTPS API for the Slurm workload manager.
        source_ids: [github-profile, glorytun-repo, mud-repo]
      - text: >-
          Glorytun's README describes encrypted, authenticated, and timestamped messages, forward secrecy
          with ECDH over Curve25519, multipath aggregation with backup paths, and traffic shaping. MUD's
          README notes that it runs on Linux and has been ported to OpenBSD and macOS.
        source_ids: [glorytun-repo, mud-repo]
  - heading: llama.cpp
    paragraphs:
      - text: >-
          A November 2024 llama.cpp commit by Gallouët replaced AArch64 NEON assembly with intrinsics
          in a quantized matrix-vector routine. Gallouët's recent commits span the CPU and CUDA backends,
          the shared common library, the HTTP server, and tools such as llama-bench.
        source_ids: [llama-cpp-first-commit, llama-cpp-commits]
      - text: >-
          In June 2026 Gallouët added a llama download subcommand, and in October 2026 made the server
          report each model's input and output modalities in GET /models. CODEOWNERS now places
          Gallouët on the teams responsible for the server and the common code.
        source_ids: [llama-cpp-download-commit, llama-cpp-modalities-commit, llama-cpp-codeowners]
      - text: >-
          Gallouët also started installama.sh as a quick way to install llama.cpp. The
          project became an official llama.cpp package in the ggml-org organization as llama-install.sh,
          which provides install scripts for Linux, macOS, FreeBSD, and Windows.
        source_ids: [installama-repo, llama-install-repo]
