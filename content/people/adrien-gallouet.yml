headline: Member of llama.cpp's llama-server and shared-code code-owner teams; Hugging Face
bio:
  text: >-
    Adrien Gallouët contributes to llama.cpp, the C/C++ runtime for running language models on local
    hardware; Gallouët's GitHub profile lists Hugging Face as company and shows membership in the
    huggingface and ggml-org organizations. llama.cpp's CODEOWNERS file includes Gallouët in the
    teams that own llama-server, the project's HTTP server, and its shared common code. Gallouët's
    recent commits add model input and output modalities to the server's model listing, rework
    file-path and cache-directory handling across platforms, clean up compiler warnings in the CUDA
    and Windows builds, and update the vendored HTTP library.
  source_ids: [github-profile, hf-profile, llama-cpp-codeowners, llama-cpp-commits]
  reviewed_at: 2026-10-13
