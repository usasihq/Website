headline: First author of Zyphra's Zamba and Zamba2 technical reports on hybrid state-space language models
bio:
  text: >-
    Paolo Glorioso is the first author of the technical reports for Zamba (2024), a 7B model that
    combines a Mamba backbone with a shared attention module, and for the Zamba2 suite (2024) of 1.2B,
    2.7B and 7.4B hybrid models, both released with open weights by Zyphra. Glorioso is also listed
    as an author of Zyphra's 2024 posts on the Zyda pretraining dataset, the Zyphra training cookbook,
    and the layer-pruning study "The Unreasonable Ineffectiveness of the Deeper Layers".
  source_ids: [zamba-paper, zamba2-paper, zyphra-zyda, zyphra-cookbook, zyphra-deeper-layers]
  reviewed_at: 2026-10-22
