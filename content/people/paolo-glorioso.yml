links: []
sections:
  - heading: Research
    paragraphs:
      - text: >-
          Glorioso is first-listed author of Zyphra's Zamba report, posted in May 2024, and the Zamba2 suite
          report, posted in November 2024. Zamba applies one shared attention block across a Mamba backbone,
          and Zamba2 replaces the Mamba1 blocks with Mamba2 blocks and uses two shared attention blocks.
        source_ids: [zamba-paper, zamba2-paper, zyphra-zamba2-7b]
      - text: >-
          Glorioso also appears as an author on Zyphra's 2024 releases of Zamba2-small and Zamba2-mini, on the
          Zyda dataset post, on the Zyphra training cookbook, and, with collaborators from Sequoia Capital,
          MIT, Meta FAIR and Cisco, on a study of pruning the deeper layers of language models.
        source_ids: [zyphra-zamba2-small, zyphra-zamba2-mini, zyphra-zyda, zyphra-cookbook, zyphra-deeper-layers]
