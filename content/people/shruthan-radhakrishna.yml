sections:
  - heading: Apriel models
    paragraphs:
      - text: >-
          Radhakrishna is first author of the Apriel-1.5-15B-Thinker paper (October 2025), which describes
          building a multimodal reasoning model from Pixtral-12B through depth upscaling, continual pretraining
          and supervised fine-tuning. The paper's contributions section lists Radhakrishna among the core
          contributors.
        source_ids: [apriel15-paper, apriel15-html]
      - text: >-
          The release post for Apriel-1.6-15B-Thinker (December 2025) lists Radhakrishna first among its
          training contributors, and Radhakrishna is a co-author of the Super Apriel paper (April 2026), which
          gives ServiceNow as the affiliation.
        source_ids: [apriel16-blog, superapriel-paper, superapriel-html]
      - text: >-
          Radhakrishna is listed among the contributors to the Apriel-H1 technical report (November 2025), on
          hybrid models obtained by distilling a 15B reasoning transformer into a mix of attention and Mamba
          layers.
        source_ids: [aprielh1-paper, aprielh1-html]
  - heading: Enterprise agents
    paragraphs:
      - text: >-
          In October 2026 Radhakrishna co-wrote a ServiceNow-AI post introducing AutoSynthData, which generates
          and verifies synthetic training tasks for agents that work in enterprise systems.
        source_ids: [autosynthdata-blog]
