headline: First author and core contributor of ServiceNow's Apriel-1.5-15B-Thinker open-weights reasoning model
bio:
  text: >-
    Shruthan Radhakrishna is the first author of the Apriel-1.5-15B-Thinker paper from ServiceNow and is
    listed as a core contributor to the model, a 15-billion-parameter open-weights multimodal reasoning model.
    Radhakrishna is also listed among the training contributors to Apriel-1.6-15B-Thinker and as an author of
    the Super Apriel paper, and co-wrote ServiceNow-AI's October 2026 post on AutoSynthData, a method for
    generating training data for enterprise agents.
  source_ids: [apriel15-paper, apriel15-html, apriel16-blog, superapriel-paper, autosynthdata-blog]
  reviewed_at: 2026-10-22
