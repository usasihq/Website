headline: President of The University of Texas at Austin; previously its Senior Vice President and COO
bio:
  text: >-
    James E. Davis is President of The University of Texas at Austin. Davis has served the university
    since 2018, previously as Senior Vice President and Chief Operating Officer and as Vice President for
    Legal Affairs and Business Strategies. Davis founded the university's Discovery to Impact research
    commercialization program and played central roles in projects including the Texas Institute for
    Electronics semiconductor consortium.
