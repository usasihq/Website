sections:
  - heading: Career
    paragraphs:
      - text: >-
          Davis practiced law as a partner at Locke Lord and later served as a Texas Deputy Attorney General,
          leading the civil litigation division and advising state agencies and boards, including the
          University of Texas System and UT.
        source_ids: [ut-president]
      - text: >-
          Davis joined UT Austin's leadership in 2018 as Senior Vice President and Chief Operating Officer
          and as Vice President for Legal Affairs and Business Strategies, and became the university's
          President.
        source_ids: [ut-president]
  - heading: University projects
    paragraphs:
      - text: >-
          The president's office credits Davis with central roles in the Texas Institute for Electronics
          semiconductor consortium, a new academic medical center for the Dell Medical School and M.D.
          Anderson Cancer Center, and Innovation Tower. Davis also founded the Discovery to Impact research
          commercialization program and established the university's proof of concept fund for faculty
          entrepreneurs.
        source_ids: [ut-president]
