sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Harrod started a YouTube channel in the summer of 2018 with the aim of making AI understandable to people outside the rooms where decisions about it are made.
          The channel's explainers and essays look at how AI works and how people experience it.
        source_ids: [about, channel]
      - text: >-
          Harrod has given a TEDx talk on AI literacy and contributed an essay on algorithmic fairness to a 2022
          anthology from St. Martin's Press. Harrod is developing a book, How It Actually Works, about the
          governance of AI through existing democratic institutions.
        source_ids: [about]
  - heading: Teaching and advising
    paragraphs:
      - text: >-
          Harrod teaches AI IRL, a seven-session live course that offers a framework for understanding AI, and
          runs standalone workshops such as "Craft Your AI Manifesto".
          Through the consulting practice Harrod & Co, Harrod reviews AI decisions before launch and advises on
          communication strategy for organizations including YouTube/Google, which brought Harrod in for 20
          months.
        source_ids: [about]
      - text: >-
          Harrod's PhD in Medical Engineering and Medical Physics, from the Harvard-MIT Health Sciences and
          Technology program, applied causal inference methods to large-scale health datasets. Harrod also
          co-owns Nebula, a creator-owned streaming platform and talent agency.
        source_ids: [about]
