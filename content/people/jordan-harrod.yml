headline: AI educator who makes YouTube explainers and essays about how AI works, and advises organizations on AI
bio:
  text: >-
    Jordan Harrod is an AI researcher and educator whose YouTube channel, started in 2018, explores how people
    interact with artificial intelligence, algorithms, and other new technologies, through explainers and
    essays about how AI works. Jordan also writes a newsletter, teaches a live course called AI IRL, runs
    workshops, and advises organizations on AI decisions and communication through the consulting practice
    Harrod & Co. Jordan co-owns Nebula, a creator-owned streaming platform, and is developing a book titled
    How It Actually Works about AI governance. Jordan holds a PhD in Medical Engineering and Medical Physics
    from the Harvard-MIT Health Sciences and Technology program.
  source_ids: [site, about, channel]
  reviewed_at: 2026-10-21
