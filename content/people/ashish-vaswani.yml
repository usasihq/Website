sections:
  - heading: Research
    paragraphs:
      - text: >-
          Ashish Vaswani is the first-listed author of "Attention Is All You Need" (2017), written with a
          Google Brain affiliation; the paper's contribution note says Vaswani, with Illia Polosukhin,
          designed and implemented the first Transformer models. In 2018 Vaswani was first author of the
          Tensor2Tensor paper, describing the Google Brain library that holds the reference Transformer
          implementation.
        source_ids: [attention-paper, t2t-paper, t2t-repo]
      - text: >-
          Vaswani also co-authored several 2018 papers extending self-attention: relative position
          representations with Peter Shaw and Jakob Uszkoreit, the Image Transformer for image generation,
          and the Music Transformer for generating music with long-term structure.
        source_ids: [relpos-paper, image-transformer-paper, music-transformer-paper]
  - heading: Essential AI
    paragraphs:
      - text: >-
          As CEO of Essential AI, Vaswani is listed among the authors of the company's 2025 research
          papers, including "Rethinking Reflection in Pre-Training" (April 2025), "Practical Efficiency of
          Muon for Pretraining" (May 2025) and the Essential-Web v1.0 dataset paper (June 2025).
        source_ids: [essential-about, reflection-paper, muon-paper, essential-web-paper]
      - text: >-
          In December 2025 Vaswani wrote the announcement of Rnj-1, an 8B base and instruction-tuned model
          pair that roughly follows the Gemma 3 architecture and uses YaRN to extend context to 32k tokens.
          The models are published on Hugging Face under the Apache 2.0 license.
        source_ids: [rnj1-post, rnj1-card]
