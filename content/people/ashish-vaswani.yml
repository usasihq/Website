headline: CEO of Essential AI, maker of the open Rnj-1 models; first-listed author of the Transformer paper
bio:
  text: >-
    Ashish Vaswani is the CEO of Essential AI, according to the company's about page, and wrote the
    December 2025 announcement of Rnj-1, Essential AI's pair of 8B base and instruction-tuned language
    models, whose model card lists the Apache 2.0 license. Vaswani is also a co-author of the Essential-Web
    v1.0 paper, which presents a 24-trillion-token web dataset annotated with a twelve-category taxonomy.
    Earlier, Vaswani was listed with a Google Brain affiliation as the first-listed author of Attention Is
    All You Need (2017), whose contribution note says Vaswani, with Illia Polosukhin, designed and
    implemented the first Transformer models, and as first author of the 2018 Tensor2Tensor paper.
  source_ids: [essential-about, rnj1-post, rnj1-card, essential-web-paper, attention-paper, t2t-paper]
  reviewed_at: 2026-10-13
