headline: President and CEO of Qualcomm since June 2021; joined the company as an engineer in 1995
bio:
  text: >-
    Cristiano Amon is the President and Chief Executive Officer of Qualcomm Incorporated, a role Amon
    took on June 30, 2021, after serving as the company's President from January 2018. Amon joined
    Qualcomm in 1995 as an engineer and held a series of technical and business leadership roles,
    including overall responsibility for Snapdragon platforms.
