sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Qualcomm, Amon was chief technical officer of Vésper, a wireless operator, and held
          leadership positions at NEC, Ericsson and Velocom. Amon joined Qualcomm as an engineer in 1995
          and went on to hold several technical and business leadership roles, including overall
          responsibility for Snapdragon platforms.
        source_ids: [amon-bio]
      - text: >-
          Amon became President of Qualcomm in January 2018, with responsibility for its semiconductor
          business (QCT), covering mobile, RF front end, automotive and IoT, along with global operations.
          On January 5, 2021, Qualcomm announced that its board had selected Amon to succeed Steve
          Mollenkopf as CEO, effective June 30, 2021.
        source_ids: [ceo-release]
  - heading: Qualcomm and AI
    paragraphs:
      - text: >-
          In June 2026, Qualcomm announced an agreement to acquire Modular, whose software platform lets
          developers write AI code once and deploy it across data center and edge hardware; the release
          quotes Amon as President and CEO of Qualcomm Incorporated.
        source_ids: [modular-release]
