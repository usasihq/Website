headline: Principal machine learning engineer at Nomic AI who leads development of the Nomic Embed models
bio:
  text: >-
    Zach Nussbaum is a principal machine learning engineer at Nomic AI, where Nussbaum leads the
    development of the Nomic Embed text and vision embedding models. Nussbaum is first author of the
    Nomic Embed technical report (2024), cited by the nomic-embed-text-v1.5 model card, and of
    "Training Sparse Mixture Of Experts Text Embedding Models" (2025), cited by the
    nomic-embed-text-v2-moe model card. Before Nomic, Nussbaum worked on machine learning for drug
    discovery at Deep Genomics.
  source_ids: [zn-site, nomic-embed-paper, moe-paper, card-v15, card-v2moe]
  reviewed_at: 2026-10-22
