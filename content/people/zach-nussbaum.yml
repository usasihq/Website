sections:
  - heading: Career
    paragraphs:
      - text: >-
          At Deep Genomics, Nussbaum worked on machine learning for drug discovery, reimplementing gene
          expression prediction from sequence and helping to train BigRNA, a model that predicts
          tissue-specific RNA expression and related properties from DNA sequence. Nussbaum has also taken
          part in the open research groups ML Collective and OpenBioML.
        source_ids: [zn-site]
      - text: >-
          At Nomic AI, Nussbaum is a principal machine learning engineer who leads the Nomic Embed family of
          text and vision embedding models.
        source_ids: [zn-site]
  - heading: Nomic Embed
    paragraphs:
      - text: >-
          Nussbaum is first author of the February 2024 technical report on Nomic Embed, a text embedding
          model with an 8192-token context length whose weights and training code Nomic released under the
          Apache-2.0 license. The v1.5 release, published later that month, trains nested representations
          so that embeddings can be truncated to smaller dimensions.
        source_ids: [nomic-embed-paper, nomic-v1-post, nomic-matryoshka, zn-site]
      - text: >-
          In 2025 Nussbaum and Brandon Duderstadt published a study of sparse mixture-of-experts text
          embedding models, which underpins nomic-embed-text-v2-moe. Nussbaum's site also lists the Nomic
          Embed Vision technical report and weights (June 2024).
        source_ids: [moe-paper, card-v2moe, zn-site]
