headline: Google vice president; former Microsoft CVP and Technical Fellow who led the Microsoft Turing group
bio:
  text: >-
    Saurabh Tiwary is a Vice President at Google. CapitalG's team page lists Tiwary's title as Vice
    President, Technical Fellow, Google DeepMind, and describes Tiwary as Vice President and General
    Manager of Cloud AI at Google, working closely with Google DeepMind on Gemini; Tiwary is also a
    Senior Advisor to CapitalG. Tiwary was previously a Corporate Vice President and Technical Fellow at
    Microsoft, where Tiwary led the Microsoft Turing group's large-scale model training, inference,
    and integration across Microsoft products and led Microsoft's technical partnership with OpenAI.
    Tiwary co-authored the 2022 paper on training Megatron-Turing NLG 530B with DeepSpeed and Megatron,
    and the MS MARCO dataset paper.
  source_ids: [capitalg-team, mtnlg-paper, msmarco-paper]
  reviewed_at: 2026-10-13
