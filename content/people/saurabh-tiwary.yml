sections:
  - heading: Career
    paragraphs:
      - text: >-
          At Microsoft, Tiwary was a Corporate Vice President and Technical Fellow who led the Microsoft Turing
          group, which handled large-scale model training and inference and brought models into products such
          as Microsoft Copilot, Office 365, Windows, Edge, and Bing. Tiwary also advised the Microsoft Ventures
          fund (M12) on AI and led Microsoft's technical partnership with OpenAI.
        source_ids: [capitalg-team, iitk-profile]
      - text: >-
          At Google, Tiwary is Vice President and General Manager of Cloud AI, overseeing enterprise AI
          platforms and products including the Gemini Enterprise Agent Platform, the Gemini Enterprise app,
          AI search, and developer tools such as Apigee, AppSheet, Colab, and Document AI. Tiwary's team works
          with Google DeepMind to improve Gemini and other models for external customers, and Tiwary is a
          Senior Advisor to CapitalG, Alphabet's independent growth fund.
        source_ids: [capitalg-team, iitk-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Tiwary is a co-author of the 2016 MS MARCO paper, which introduced a machine reading comprehension
          dataset built from real Bing search questions, and of the 2022 joint Microsoft and NVIDIA paper on
          training the Megatron-Turing NLG 530B language model with DeepSpeed and Megatron.
        source_ids: [msmarco-paper, mtnlg-paper]
