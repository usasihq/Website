headline: NVIDIA research scientist working on LLM pretraining; co-lead author of the Nemotron-CC dataset paper
bio:
  text: >-
    Dan Su is a research scientist at NVIDIA whose research focuses on large language model pretraining.
    Su is listed first among the co-first authors of the Nemotron-CC paper, which describes a
    6.3-trillion-token English pretraining dataset built from Common Crawl, and was lead byline author of
    NVIDIA's announcement of the dataset.
  source_ids: [nvidia-author-page, nemotron-cc-paper, adlr-page, nemotron-cc-blog]
  reviewed_at: 2026-10-22
