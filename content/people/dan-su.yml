sections:
  - heading: Career
    paragraphs:
      - text: >-
          Su received a PhD in natural language processing from the Hong Kong University of Science and
          Technology and is a research scientist at NVIDIA, where Su's current research focuses on large
          language model pretraining.
        source_ids: [nvidia-author-page]
  - heading: Nemotron-CC
    paragraphs:
      - text: >-
          Su, Kezhi Kong and Ying Lin are the co-first authors of "Nemotron-CC: Transforming Common Crawl
          into a Refined Long-Horizon Pretraining Dataset" (December 2024), published by NVIDIA's Applied
          Deep Learning Research group. The paper combines classifier ensembling, synthetic rephrasing of
          data and reduced reliance on heuristic filters to keep more high-quality tokens for long training
          runs.
        source_ids: [nemotron-cc-paper, adlr-page]
      - text: >-
          In January 2025 Su was the first byline author of NVIDIA's technical blog post announcing the
          dataset, which describes a curation pipeline built on NVIDIA NeMo Curator and the dataset's
          availability through Common Crawl.
        source_ids: [nemotron-cc-blog]
