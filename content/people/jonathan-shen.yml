headline: First author of the Tacotron 2 text-to-speech paper, written as a software engineer at Google
bio:
  text: >-
    Jonathan Shen is first author of Natural TTS Synthesis by Conditioning WaveNet on Mel Spectrogram
    Predictions, the Tacotron 2 paper, which pairs a recurrent sequence-to-sequence network that maps
    character embeddings to mel-scale spectrograms with a modified WaveNet vocoder that synthesizes
    waveforms from them. Shen co-wrote the December 2017 Google Research blog post introducing
    Tacotron 2, posted with Ruoming Pang as software engineers on behalf of the Google Brain and
    Machine Perception teams.
