sections:
  - heading: Speech synthesis research
    paragraphs:
      - text: >-
          Shen was first author of the December 2017 Tacotron 2 paper, which combines a sequence-to-sequence
          network predicting mel spectrograms from characters with a modified WaveNet vocoder. The Google Research
          blog post introducing the system, posted by Shen and Ruoming Pang as software engineers for the Google
          Brain and Machine Perception teams, also described open problems such as pronouncing complex words and
          controlling the style of generated speech.
        source_ids: [tacotron2-paper, tacotron2-blog]
      - text: >-
          Shen co-authored later Google text-to-speech papers, including a 2018 system that transfers knowledge
          from speaker verification to multispeaker speech synthesis and a 2018 paper on hierarchical generative
          modeling for controllable synthesis. In 2020 Shen was first author of Non-Attentive Tacotron, which
          replaces the attention mechanism of Tacotron 2 with explicit duration prediction, including an
          unsupervised duration model.
        source_ids: [sv2tts-paper, hierarchical-tts-paper, non-attentive-tacotron-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Shen was first author of the 2019 paper describing Lingvo, a TensorFlow framework for collaborative deep
          learning research with a focus on sequence-to-sequence models. Lingvo's code is published in the
          tensorflow/lingvo repository under the Apache-2.0 license.
        source_ids: [lingvo-paper, lingvo-repo]
