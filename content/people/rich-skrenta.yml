sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before leading Common Crawl, Skrenta created the blekko search engine and founded the Open
          Directory Project. In 2012 blekko donated crawl metadata gathered between February and October
          of that year to Common Crawl, to help improve its crawl.
        source_ids: [cc-about]
      - text: >-
          Skrenta became Executive Director of Common Crawl in 2023. The foundation's history says the
          organization then expanded its staff, public engagement and research collaborations, and later
          work includes the Web Languages Project and the CommonLID language-identification benchmark.
        source_ids: [cc-about, cc-team]
