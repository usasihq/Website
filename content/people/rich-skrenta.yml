headline: Executive Director of the Common Crawl Foundation; creator of the blekko search engine
bio:
  text: >-
    Rich Skrenta is the Executive Director of the Common Crawl Foundation, the nonprofit that crawls the
    web and freely provides its archives and datasets. Common Crawl's history describes Skrenta as the
    creator of the blekko search engine and the founder of the Open Directory Project.
  source_ids: [cc-team, cc-about]
  reviewed_at: 2026-10-21
