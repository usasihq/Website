sections:
  - heading: Career
    paragraphs:
      - text: >-
          Albrecht's site describes earlier work publishing machine learning papers as an academic
          researcher under Rebecca Hwa, founding an AI recruiting company and a 3D injection molding
          software company, and helping build Addepar as an early engineer. Albrecht has also
          served as a Thiel Fellowship mentor.
        source_ids: [josh-site]
      - text: >-
          Albrecht co-founded Imbue, which started in 2021 as Generally Intelligent, and Imbue's
          about page lists Albrecht as CTO and co-founder alongside CEO Kanjun Qiu.
        source_ids: [josh-site, imbue-about]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Imbue builds open tools meant to let people understand, modify and verify the software
          agents they use. Its products include Sculptor, an open-source app for running coding
          agents in parallel; Vet, a local code review tool for catching coding agents' mistakes;
          and mngr, a command-line tool for managing many coding agents across hosts and sandboxes.
        source_ids: [imbue-about, imbue-sculptor, imbue-vet, imbue-mngr]
  - heading: Research
    paragraphs:
      - text: >-
          In 2022 the Imbue team, led on the paper by first author Josh Albrecht with Kanjun Qiu as
          last author, released Avalon, a benchmark for generalization in reinforcement learning
          built from procedurally generated 3D worlds.
        source_ids: [avalon-paper]
