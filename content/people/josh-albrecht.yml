headline: Co-founder and CTO of Imbue and first author of the Avalon reinforcement learning benchmark
bio:
  text: >-
    Josh Albrecht is a co-founder and the CTO of Imbue (formerly Generally Intelligent), a company
    that builds open software for AI agents people can understand, modify and verify. Albrecht is
    first author of Avalon, a benchmark for generalization in reinforcement learning, and earlier
    worked as an early engineer at Addepar.
  source_ids: [imbue-about, josh-site, avalon-paper]
  reviewed_at: 2026-10-21
