headline: Distinguished Scientist and Chief Scientist of Microsoft Research Asia; senior author of the BitNet papers
bio:
  text: >-
    Furu Wei is a Distinguished Scientist and Vice President at Microsoft Research, where Wei serves as
    Chief Scientist of Microsoft Research Asia and leads its General Artificial Intelligence (GenAI)
    group. Wei is the senior (last-listed) author of the BitNet line of 1-bit language model papers,
    including "BitNet: Scaling 1-bit Transformers for Large Language Models" (2023), "The Era of 1-bit
    LLMs" (2024), the bitnet.cpp CPU inference paper (2024) and the BitNet b1.58 2B4T technical report
    (2025).
  source_ids: [msr-wei, bitnet-paper, bitnet158-paper, bitnet-cpp-paper, bitnet-2b4t-paper]
  reviewed_at: 2026-10-22
