sections:
  - heading: Role
    paragraphs:
      - text: >-
          Wei is a Distinguished Scientist and Vice President at Microsoft Research and Chief Scientist of
          Microsoft Research Asia, where Wei leads the General Artificial Intelligence group. Wei's Microsoft
          Research page lists research areas in artificial intelligence and human language technologies, and a
          project on large-scale self-supervised pre-training across tasks, languages and modalities.
        source_ids: [msr-wei]
  - heading: BitNet
    paragraphs:
      - text: >-
          In October 2023 Wei was senior author of the BitNet paper, which trains transformers with 1-bit
          weights, and in February 2024 of "The Era of 1-bit LLMs", which introduced BitNet b1.58 with ternary
          weights. In October 2024 the group published bitnet.cpp, an inference framework for running BitNet b1.58
          models on CPUs, and in April 2025 the technical report for BitNet b1.58 2B4T, an open 2B-parameter
          model trained on 4 trillion tokens.
        source_ids: [bitnet-paper, bitnet158-paper, bitnet-cpp-paper, bitnet-2b4t-paper]
