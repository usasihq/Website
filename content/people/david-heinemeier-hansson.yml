work:
  - name: Omarchy
    artifact_slug: null
    url: https://omarchy.org/
    contribution: >-
      Created Omarchy, an MIT-licensed Linux system. Its manual's Local LLMs section recommends LM
      Studio, for finding, installing, and running open-weight models through a graphical app, and
      Ollama, for doing the same from the command line; both install from the Install > AI menu.
    source_ids: [dhh-site, omarchy-site, omarchy-ai-manual, omarchy-license]
  - name: Ollama setup in Omarchy
    artifact_slug: ollama
    url: https://github.com/omacom/omarchy
    contribution: >-
      Omarchy's Install > AI menu installs Ollama, choosing the CUDA build when it detects an NVIDIA
      GPU and the ROCm build when it detects an AMD GPU, and its removal command deletes Ollama
      together with the models it downloaded.
    source_ids: [omarchy-menu, omarchy-remove-ollama, omarchy-ai-manual]
  - name: Hermes and OpenClaw in Omarchy
    artifact_slug: hermes-agent
    url: https://github.com/omacom/omarchy/blob/quattro/manual/17-ai.md
    contribution: >-
      Omarchy can install Hermes Desktop and make Hermes, Nous Research's agent, or OpenClaw the
      default agent. Its manual documents how Omarchy manages the Hermes runtime and OpenClaw's
      Control UI with its own local gateway.
    source_ids: [omarchy-ai-manual, omarchy-menu]
  - name: Omacom sponsorship of local AI work
    artifact_slug: null
    url: https://omarchy.org/news/2026/09/omacom-foundation-to-be-premier-sponsor-of-0xsero/
    contribution: >-
      Announced on September 23, 2026 that the Omacom Foundation will be a premier sponsor of 0xSero's
      local AI work for three years, collaborating on making local models work out of the box on
      Omarchy; the post describes 0xSero's Local AI Registry of model configurations, hardware-specific
      recipes, and performance measurements.
    source_ids: [omarchy-0xsero-announcement]
