slug: david-heinemeier-hansson
name: David Heinemeier Hansson
initials: DHH
headline: Creator of Omarchy, a Linux system that sets up local-model tools such as Ollama and LM Studio
bio:
  text: >-
    David Heinemeier Hansson created Omarchy, an open-source Linux system released under the MIT
    License, and earlier created the Ruby on Rails web framework. Omarchy's manual has a Local LLMs
    section that recommends LM Studio and Ollama for finding and running open-weight models, and its
    Install > AI menu installs either one, along with agent apps such as Hermes and OpenClaw.
    Heinemeier Hansson is a co-owner of 37signals, where Omarchy is incubated. In September 2026,
    Heinemeier Hansson announced that the Omacom Foundation will sponsor 0xSero's local AI work through
    Sybil Solutions for three years, to make local models work well out of the box on Omarchy.
  source_ids: [dhh-site, omarchy-site, omarchy-ai-manual, omarchy-license, omarchy-0xsero-announcement]
