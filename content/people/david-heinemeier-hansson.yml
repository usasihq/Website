sections:
  - heading: Ruby on Rails and 37signals
    paragraphs:
      - text: >-
          Heinemeier Hansson created the Ruby on Rails web framework in 2003. Basecamp, the project management
          application launched by 37signals in 2004, was the original Rails application. In 2022 Heinemeier
          Hansson started The Rails Foundation, which works on documentation, education, marketing and events
          for the Rails ecosystem, and serves as its chairman.
        source_ids: [dhh-site]
      - text: >-
          Heinemeier Hansson owns 37signals together with Jason Fried. The company makes Basecamp and the HEY
          email service, launched in 2020, as well as other products such as Highrise, Campfire, Fizzy and the
          ONCE line of self-hosted software including Writebook. Since November 2024 Heinemeier Hansson has also
          served on the board of directors of Shopify.
        source_ids: [dhh-site]
  - heading: Omarchy and local AI
    paragraphs:
      - text: >-
          Omarchy is an opinionated Linux system that Heinemeier Hansson created, released under the MIT License
          and incubated at 37signals. Its manual includes a section on running local language models with tools
          such as LM Studio and Ollama, and its Install menu offers these tools along with agent applications.
          In 2026 Heinemeier Hansson started the Omacom Foundation, a nonprofit that holds Omarchy's trademarks,
          funds its infrastructure and supports the open-source projects it depends on, and serves as its
          president.
        source_ids: [dhh-site, omarchy-site, omarchy-license, omarchy-ai-manual, omarchy-menu]
      - text: >-
          In September 2026 the Omacom Foundation announced that it would be the premier sponsor of 0xSero's work
          on local AI through Sybil Solutions, with the goal of making local models work well on Omarchy without
          extra setup.
        source_ids: [omarchy-0xsero-announcement]
  - heading: Writing
    paragraphs:
      - text: >-
          With Jason Fried, Heinemeier Hansson has written four books drawn from running 37signals: Getting Real,
          on building Basecamp and an early software business; REWORK, on starting and running businesses; REMOTE:
          Office Not Required, on remote work; and It Doesn't Have To Be Crazy At Work, on running a calm company.
        source_ids: [dhh-site]
