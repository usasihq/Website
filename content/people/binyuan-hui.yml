specialties: [agents, language-models, developer-tools]
headline: Initiator of OpenDevin (now OpenHands); StarCoder2 co-author and first author of the Qwen2.5-Coder report
bio:
  text: >-
    Binyuan Hui works on autonomous coding models and coding agents. Hui's homepage describes Hui as
    the initiator of OpenDevin, the open platform for AI software-development agents now called
    OpenHands, and Hui is a co-author of the OpenHands paper (2024). After joining the BigCode
    collaboration in 2023, Hui co-authored "StarCoder 2 and The Stack v2" (2024). Hui was a staff
    research scientist on Alibaba's Qwen team, is first author of the Qwen2.5-Coder Technical Report
    and a co-author of the Qwen and Qwen3 technical reports; Hui's GitHub profile now lists the Qwen
    role as a former one.
  source_ids: [homepage, github-profile, openhands-paper, starcoder2-paper, qwen25coder-paper, qwen-paper, qwen3-paper]
  reviewed_at: 2026-10-13
