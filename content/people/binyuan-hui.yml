slug: binyuan-hui
name: Binyuan Hui
initials: BH
groups: [open-source, engineering]
sector: independent
specialties: [agents, language-models, developer-tools]
headline: Initiator of OpenDevin (now OpenHands); StarCoder2 co-author and first author of the Qwen2.5-Coder report
bio:
  text: >-
    Binyuan Hui works on autonomous coding models and coding agents. Hui's homepage describes Hui as
    the initiator of OpenDevin, the open platform for AI software-development agents now called
    OpenHands, and Hui is a co-author of the OpenHands paper (2024). After joining the BigCode
    collaboration in 2023, Hui co-authored "StarCoder 2 and The Stack v2" (2024). Hui was a staff
    research scientist on Alibaba's Qwen team, is first author of the Qwen2.5-Coder Technical Report
    and a co-author of the Qwen and Qwen3 technical reports; Hui's GitHub profile now lists the Qwen
    role as a former one.
  source_ids: [homepage, github-profile, openhands-paper, starcoder2-paper, qwen25coder-paper, qwen-paper, qwen3-paper]
  reviewed_at: 2026-10-21
affiliations:
  - name: Alibaba Group (Qwen Team)
    organization_slug: null
    role: Staff Research Scientist, Qwen Team
    current: false
    source_ids: [homepage, github-profile]
work:
  - name: OpenHands (formerly OpenDevin)
    artifact_slug: openhands
    type: open-source
    url: https://github.com/OpenHands/OpenHands
    contribution: >-
      Described on Hui's homepage as the initiator of OpenDevin, and a co-author of "OpenHands: An
      Open Platform for AI Software Developers as Generalist Agents" (2024), which introduces
      OpenHands (f.k.a. OpenDevin) and notes its release under the MIT license. The repository's
      commit history lists commits by Hui's account from March to May 2024, including support for the
      BIRD benchmark and early front-end and repository fixes, and Hui's GitHub profile pins the
      OpenHands repository.
    source_ids: [homepage, openhands-paper, openhands-commits, openhands-license, github-profile]
  - name: StarCoder2
    artifact_slug: starcoder2
    type: open-weights
    url: https://arxiv.org/abs/2402.19173
    contribution: >-
      Co-author of "StarCoder 2 and The Stack v2: The Next Generation" (2024) from the BigCode
      project, which introduces the StarCoder2 family of code models and makes the weights available
      under an OpenRAIL license.
    source_ids: [starcoder2-paper, homepage]
  - name: Qwen2.5-Coder
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2409.12186
    contribution: >-
      First author of the Qwen2.5-Coder Technical Report (2024); also a co-author of the Qwen
      Technical Report (2023) and the Qwen3 Technical Report (2025).
    source_ids: [qwen25coder-paper, qwen-paper, qwen3-paper]
  - name: BIRD text-to-SQL benchmark
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2305.03111
    contribution: >-
      Co-first author of "Can LLM Already Serve as A Database Interface? A BIg Bench for Large-Scale
      Database Grounded Text-to-SQLs" (BIRD), a NeurIPS 2023 spotlight paper on text-to-SQL evaluation.
    source_ids: [bird-paper, homepage]
