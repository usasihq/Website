sections:
  - heading: Research
    paragraphs:
      - text: >-
          Hui's early publications centre on text-to-SQL parsing and dialogue, including R²SQL (AAAI 2021)
          and S²SQL (ACL 2022 Findings) as first author, along with Graphix-T5 and STAR for converting
          questions into database queries. Hui is a co-first author of BIRD, a benchmark of large, real databases for
          text-to-SQL systems that was a NeurIPS 2023 spotlight.
        source_ids: [homepage, bird-paper]
      - text: >-
          Hui's homepage lists research interests in foundation models (pre-training and post-training),
          reasoning models for code, coding agents and computer-use agents, and states a goal of building
          autonomous coding models.
        source_ids: [homepage]
  - heading: Open models and agents
    paragraphs:
      - text: >-
          Hui was part of the Qwen team at Alibaba Group, which released its first Qwen model in April 2023,
          and is an author of the Qwen, Qwen2 and Qwen3 technical reports and first author of the
          Qwen2.5-Coder report. In July 2023 Hui joined the BigCode collaboration, contributing to OctoPack
          and StarCoder 2.
        source_ids: [homepage, qwen-paper, qwen2-paper, qwen3-paper, qwen25coder-paper, starcoder2-paper]
      - text: >-
          Hui is described as the initiator of OpenDevin, the open platform for software-development agents
          later renamed OpenHands and released under the MIT license; the 2024 OpenHands paper lists Hui among
          its authors.
        source_ids: [homepage, openhands-paper, openhands-license, github-profile]
