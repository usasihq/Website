headline: Co-founder and CEO of Perplexity; first author of CURL and Bottleneck Transformers
bio:
  text: >-
    Aravind Srinivas is the cofounder and CEO of Perplexity; NVIDIA's March 2026 announcement of the
    Nemotron Coalition quotes Srinivas under that title on Perplexity's plans to contribute to open
    frontier models. An AWS Startups article co-written by Perplexity co-founder Denis Yarats says
    Perplexity was founded in 2022 by Srinivas, Yarats, Johnny Ho and Andy Konwinski, and that
    Srinivas previously worked as an AI researcher at OpenAI. Srinivas earned a PhD in computer science
    at UC Berkeley in 2021 with a dissertation on representation learning for perception and control,
    advised by Pieter Abbeel. That research includes CURL, which applies contrastive learning to
    reinforcement learning from pixels, and Bottleneck Transformers (BoTNet), a self-attention
    backbone for computer vision, both with Srinivas as first author.
