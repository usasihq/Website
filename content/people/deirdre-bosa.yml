sections:
  - heading: Coverage
    paragraphs:
      - text: >-
          Deirdre Bosa formerly served as an anchor at CNBC, where Bosa's video reports in mid-2026
          focused on the business of artificial intelligence. Segments from June and July 2026 covered
          Chinese open-weight model developers such as Zhipu's Z.AI, enterprise demand for in-house AI,
          compute supply deals, and a shift in competition from larger models toward cheaper and more
          efficient systems.
        source_ids: [cnbc]
  - heading: Yahoo Finance
    paragraphs:
      - text: >-
          Yahoo Finance's programming page lists Bosa as host of Deirdre Bosa Live, a new weekday
          market close show in the 4 to 5 PM Eastern slot. The page describes the show as focused on how
          developments in AI and technology are reshaping companies, industries and the global economy.
        source_ids: [yahoo]
