headline: Business journalist and host of Deirdre Bosa Live, a new Yahoo Finance show about AI and technology
bio:
  text: >-
    Deirdre Bosa is a business journalist who reports on AI and technology. Yahoo Finance's programming
    page says Deirdre will host Deirdre Bosa Live, a new market close show about how developments in AI
    and technology are reshaping companies, industries, and the global economy. Deirdre formerly served as an
    anchor at CNBC, where Deirdre's 2026 video reports covered topics including AI agents, open-weight
    models, and the cost of AI compute.
