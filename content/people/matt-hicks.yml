sections:
  - heading: Career
    paragraphs:
      - text: >-
          Matt Hicks began in engineering roles at IBM and at startups before joining Red Hat in 2006 as a
          developer on the IT team. Hicks was a founding member of the engineering team that built Red Hat
          OpenShift, which Red Hat describes as becoming a Kubernetes platform for hybrid cloud.
        source_ids: [redhat-bio, ceo-announcement]
      - text: >-
          As Executive Vice President of Products and Technologies, Hicks was responsible for Red Hat's
          product strategy, engineering and support. Red Hat named Hicks President and Chief Executive
          Officer in July 2022, succeeding Paul Cormier, who became chairman; IBM lists Hicks as a Senior
          Vice President and CEO of Red Hat.
        source_ids: [ceo-announcement, redhat-bio, ibm-senior-leadership]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Under Hicks, Red Hat launched OpenShift AI and, in May 2025 at Red Hat Summit, Red Hat AI
          Inference Server, an enterprise inference server built from the open-source vLLM project and
          Neural Magic technologies. Red Hat completed its acquisition of Neural Magic in January 2025,
          and its announcement quotes Hicks on adding inference performance engineering and model
          optimization expertise to Red Hat AI.
        source_ids: [redhat-bio, inference-server-launch, neural-magic-completion]
