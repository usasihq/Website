headline: President and CEO of Red Hat and an IBM Senior Vice President; a founding engineer on the OpenShift team
bio:
  text: >-
    Matt Hicks is the President and Chief Executive Officer of Red Hat, a role held since 2022, and IBM
    lists Hicks among its senior leaders as Senior Vice President and CEO of Red Hat. Red Hat's biography
    describes Hicks as a founding engineer on the OpenShift team and, before becoming CEO, Executive Vice
    President of Products and Technologies, overseeing product strategy, engineering, and support. It
    says that under Hicks, Red Hat launched OpenShift AI and Red Hat Inference Server for developing and
    deploying models, and acquired Neural Magic, strengthening Red Hat's role in the open-source vLLM
    inference project. Hicks began in engineering roles at IBM and at startups.
  source_ids: [redhat-bio, ibm-senior-leadership, redhat-leadership]
  reviewed_at: 2026-10-13
