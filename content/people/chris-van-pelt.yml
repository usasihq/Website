sections:
  - heading: Career
    paragraphs:
      - text: >-
          Van Pelt co-founded Weights & Biases with Lukas Biewald and Shawn Lewis in 2017. In a June 2019 post
          marking the product's public launch, Biewald called Van Pelt a longtime co-founder and described six
          months of building the tool together with Lewis and early users.
        source_ids: [wandb-about, biewald-post]
      - text: >-
          Weights & Biases started from an experiment tracking tool built to help develop models at OpenAI and grew
          into a broader platform for machine learning practitioners. CoreWeave acquired the company in May 2025,
          and its leadership page lists Van Pelt as Distinguished Engineer and Cofounder; Van Pelt's GitHub profile
          gives wandb.com as Van Pelt's organization.
        source_ids: [wandb-about, github-profile]
