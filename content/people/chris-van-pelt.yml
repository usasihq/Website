headline: Co-founder and Distinguished Engineer of Weights & Biases, the machine learning developer platform
bio:
  text: >-
    Chris Van Pelt is a co-founder of Weights & Biases and is listed on its leadership page as Distinguished
    Engineer and Cofounder. Weights & Biases was founded in 2017 by Lukas Biewald, Van Pelt and Shawn Lewis, began
    with an experiment tracking tool developed to help build models at OpenAI, and was acquired by CoreWeave in
    May 2025.
  source_ids: [wandb-about]
  reviewed_at: 2026-10-22
