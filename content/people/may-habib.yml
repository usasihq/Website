headline: Co-founder and CEO of WRITER, which builds the Palmyra model family and an enterprise AI agent platform
bio:
  text: >-
    May Habib is a co-founder and the CEO of WRITER, an enterprise generative AI company that
    develops its own Palmyra family of large language models and the WRITER Agent platform. Habib
    co-founded WRITER with Waseem AlShikh in 2020, after the two had worked together since 2013 on
    machine translation and enterprise content localization.
