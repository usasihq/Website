sections:
  - heading: Career
    paragraphs:
      - text: >-
          According to WRITER, Habib and AlShikh started their first company together in 2013 to
          localize enterprise content dynamically, drawn by a shared interest in machine
          translation. Experiments with transformer models led them to launch WRITER in 2020 to
          bring generative AI to enterprises.
        source_ids: [writer-company]
  - heading: Products and projects
    paragraphs:
      - text: >-
          WRITER builds its own family of large language models, Palmyra, alongside WRITER Agent.
          Its flagship Palmyra X6 is the default model on the platform and is designed to stay on
          one goal across hours of work, call a customer's existing tools, and stay grounded in
          company knowledge.
        source_ids: [writer-company, writer-models]
