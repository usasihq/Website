sections:
  - heading: Career
    paragraphs:
      - text: >-
          Bernhardsson spent six years at Spotify, first managing its Analytics team and then building up and
          managing the machine learning team. Bernhardsson built the first version of Spotify's music
          recommendations, including features such as Related Artists, Radio and Discover Weekly.
        source_ids: [erik-about]
      - text: >-
          From February 2015 to January 2021, Bernhardsson ran the technology team at Better.com, a mortgage
          company. Bernhardsson then founded Modal with Akshat Bubna; Modal's blog lists Bernhardsson as CEO
          and co-founder, and the company describes building its own file system, container runtime,
          scheduler and image builder to make cloud development faster.
        source_ids: [erik-about, modal-company, modal-blog]
  - heading: Open-source work and writing
    paragraphs:
      - text: >-
          At Spotify, Bernhardsson open-sourced Annoy, a library for approximate nearest neighbor search
          that Spotify used to find similar users and items for music recommendations, and co-created Luigi,
          a workflow engine for batch pipelines. Bernhardsson writes a blog, has given talks on approximate
          nearest neighbors, Luigi and machine learning for music recommendations, and co-organizes the NYC
          Machine Learning meetup.
        source_ids: [annoy-readme, luigi-readme, erik-about]
      - text: >-
          In May 2026 Bernhardsson co-authored, with Charles Frye, Jonathon Belotti and Akshat Bubna, Modal's
          engineering post on how the company achieved serverless GPUs, covering idle GPU buffers, a custom
          filesystem for lazily loading container images, and related techniques.
        source_ids: [modal-serverless-gpus]
