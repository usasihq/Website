headline: Founder and CEO of Modal; creator of the open-source Annoy library and co-creator of Luigi at Spotify
bio:
  text: >-
    Erik Bernhardsson is the founder and CEO of Modal, a cloud platform for running data, AI and machine
    learning applications on its own serverless infrastructure. Before Modal, Bernhardsson ran the
    technology team at Better.com from 2015 to 2021 and spent six years at Spotify, where Bernhardsson
    built the first version of its music recommendation system and created the open-source Annoy
    library and, with Elias Freider, the Luigi workflow engine.
  source_ids: [erik-about, modal-company, modal-blog, annoy-readme, luigi-readme]
  reviewed_at: 2026-10-22
