headline: Executive director of the Alignment Research Center and technical advisor at NIST's CAISI
bio:
  text: >-
    Paul Christiano is the executive director of the Alignment Research Center (ARC), a nonprofit
    developing methods for white-box analysis of neural networks, and a technical advisor at the
    Center for AI Standards and Innovation within NIST. In April 2024 the U.S. Secretary of Commerce
    named Christiano head of AI safety at the U.S. AI Safety Institute, housed at NIST. Before founding
    ARC, Christiano ran the language model alignment team at OpenAI, and is first author of the 2017
    paper on deep reinforcement learning from human preferences.
  source_ids: [christiano-site, nist-aisi-2024, human-preferences-paper]
  reviewed_at: 2026-10-13
