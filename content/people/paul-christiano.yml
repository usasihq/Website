sections:
  - heading: Career
    paragraphs:
      - text: >-
          Paul Christiano received a PhD in statistical learning theory from UC Berkeley and later
          ran the language model alignment team at OpenAI. Christiano then founded the Alignment
          Research Center (ARC), a nonprofit developing methods for white-box analysis of neural
          networks, and is its executive director.
        source_ids: [christiano-site]
      - text: >-
          In April 2024 U.S. Secretary of Commerce Gina Raimondo named Christiano head of AI safety at
          the U.S. AI Safety Institute, housed at the National Institute of Standards and Technology.
          Christiano's site says Christiano previously served as Head of Safety at the Center for AI
          Standards and Innovation and the AI Safety Institute and is now a technical advisor at the
          Center for AI Standards and Innovation within NIST.
        source_ids: [nist-aisi-2024, christiano-site]
  - heading: Research
    paragraphs:
      - text: >-
          Christiano co-authored "Concrete Problems in AI Safety" (2016) and was first author of "Deep
          reinforcement learning from human preferences" (2017), which trains agents on goals defined
          by human comparisons between pairs of behavior clips. Christiano also co-authored the 2020
          paper "Learning to summarize from human feedback", which applied this kind of preference
          learning to language models.
        source_ids: [concrete-problems-paper, human-preferences-paper, summarize-paper]
      - text: >-
          With Buck Shlegeris and Dario Amodei, Christiano wrote "Supervising strong learners by
          amplifying weak experts" (2018), which proposes iterated amplification for training systems
          on tasks too hard for humans to evaluate directly. Christiano later co-authored
          "Formalizing the presumption of independence" (2022) with Eric Neyman and Mark Xu, on
          formalizing heuristic reasoning that relies on default independence assumptions.
        source_ids: [amplification-paper, independence-paper]
