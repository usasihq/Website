headline: Co-founder and Chief Executive Officer of Palantir Technologies since 2005
bio:
  text: >-
    Alexander Karp is one of the co-founders of Palantir Technologies and has served as its Chief Executive Officer
    since 2005. Karp has been a member of Palantir's Board of Directors since 2003 and has held various positions
    with the company since co-founding it.
