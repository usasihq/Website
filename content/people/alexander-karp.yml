          Palantir's investor relations site lists Karp as Co-Founder, Chief Executive Officer, and Director. Karp
          has served in various positions with Palantir since co-founding it, joined its Board of Directors in 2003,
          and became Chief Executive Officer in 2005.
        source_ids: [palantir-management]
      - text: >-
          Palantir's executive team listed alongside Karp includes fellow co-founder Stephen Cohen as President and
          Secretary, and Shyam Sankar as Chief Technology Officer and Executive Vice President.
