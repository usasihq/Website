headline: Machine learning researcher who makes YouTube videos analyzing AI research papers and ML news
bio:
  text: >-
    Yannic Kilcher describes themself as a machine learning researcher and engineer who runs a YouTube
    channel dedicated to AI research. The channel's videos cover recent machine learning research
    papers, programming, ML News, and the wider impact of AI on society. Yannic also runs a Community
    Paper Feed for sharing research and a Discord server that hosts paper discussions, and lists
    academic publications on their website, including the OpenAssistant paper.
  source_ids: [site, channel]
  reviewed_at: 2026-10-21
