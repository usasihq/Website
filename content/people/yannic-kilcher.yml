sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Yannic Kilcher's YouTube channel describes its videos as covering machine learning research
          papers, programming, issues in the AI community, and the broader impact of AI on society. The
          homepage highlights paper analyses, project videos and the ML News series, and lists a second
          channel, Yannic Out Of Distribution, for less formal content.
        source_ids: [channel, site]
      - text: >-
          Alongside the videos, Kilcher runs a Community Paper Feed, where anyone can submit an arXiv
          paper for manual review and sharing, and a Discord server that hosts regular paper discussions
          in voice chat.
        source_ids: [site]
  - heading: Research and open-source work
    paragraphs:
      - text: >-
          Kilcher's homepage lists academic publications from 2016 to 2021, many co-authored with Thomas
          Hofmann, on generative models, adversarial robustness and neural search. They include The
          Odds are Odd (2019), a statistical test for detecting adversarial examples, written with Kevin
          Roth and Hofmann.
        source_ids: [site, odds-paper]
      - text: >-
          Kilcher was a code owner of the LAION-AI Open-Assistant repository, a project to give everyone
          access to a chat-based large language model, which its README now marks as completed. Kilcher
          is second author of the OpenAssistant Conversations paper, which released a crowd-sourced,
          human-annotated assistant-style conversation corpus and was published in the NeurIPS 2023
          Datasets and Benchmarks track.
        source_ids: [oa-codeowners, github-profile, oa-readme, oa-paper, site]
timeline:
