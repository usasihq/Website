headline: Researcher on generative model pre-training at Google DeepMind; lead author of DreamBooth
bio:
  text: >-
    Nataniel Ruiz is an AI researcher working on pre-training of generative models in the GenMedia team
    at Google DeepMind. Ruiz worked on large-scale pretraining and new capabilities for Gemini Omni, an
    any-to-any multimodal model with video generation. Ruiz is the lead author of DreamBooth, a method
    for personalizing text-to-image diffusion models from a few images of a subject, presented by
    Google Research with an official dataset repository. Ruiz's other work on image and video
    generation includes HyperDreamBooth, StyleDrop, ZipLoRA, RealFill, Magic Insert, and ReCapture.
  source_ids: [ruiz-site, dreambooth-paper, dreambooth-project, dreambooth-dataset]
  reviewed_at: 2026-10-21
