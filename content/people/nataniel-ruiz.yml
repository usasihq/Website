sections:
  - heading: Research
    paragraphs:
      - text: >-
          Ruiz's PhD research in computer science at Boston University concerned simulating synthetic data for
          training and testing neural networks, beginning with "Learning To Simulate" (2018), written with Samuel
          Schulter and Manmohan Chandraker. With Sarah Adel Bargal and Stan Sclaroff, Ruiz also studied
          adversarial attacks that disrupt deepfake generation by image translation and face manipulation
          systems.
        source_ids: [ruiz-site, learning-to-simulate-paper, disrupting-deepfakes-paper]
      - text: >-
          At Google, Ruiz was lead author of DreamBooth (2022), which fine-tunes text-to-image diffusion models to
          generate a specific subject from a few example images, and of HyperDreamBooth (2023), which speeds up
          this personalization with hypernetworks. Ruiz co-authored StyleDrop for generating images in a given
          style, ZipLoRA for merging subject and style LoRAs, and RealFill for completing images from reference
          photos, and led Magic Insert (2024), a style-aware drag-and-drop method for placing subjects into
          images.
        source_ids: [dreambooth-paper, dreambooth-project, hyperdreambooth-paper, styledrop-paper, ziplora-paper, realfill-paper, magic-insert-paper]
  - heading: Video, games and multimodal models
    paragraphs:
      - text: >-
          Ruiz's work has extended to video and interactive generation. ReCapture (2024) re-renders a
          user-provided video from new camera viewpoints, and Unbounded (2024) is a generative game of character
          life simulation with open-ended mechanics produced in real time. Ruiz also worked on Camera Coach, a
          feature for Google Pixel phones announced at Made by Google 2025.
        source_ids: [recapture-paper, unbounded-paper, ruiz-site]
      - text: >-
          In Google DeepMind's GenMedia team, Ruiz works on pre-training of generative models and contributed to
          large-scale pretraining and new capabilities for Gemini Omni, an any-to-any multimodal model whose Flash
          version was released at Google I/O 2026.
        source_ids: [ruiz-site, gemini-omni]
