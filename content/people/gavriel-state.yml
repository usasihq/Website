headline: Senior Director for Simulation and AI at NVIDIA, heading the team behind Isaac Sim and Isaac Lab
bio:
  text: >-
    Gavriel State is a Senior Director for Simulation and AI at NVIDIA, where State leads the team
    building the Isaac Sim robotics simulator and Isaac Lab for reinforcement learning and
    sim-to-real robot transfer. State's work also covers real-to-sim 3D reconstruction, including
    rendering technologies such as 3D Gaussian Ray Tracing, and synthetic data generation with
    Omniverse Replicator. State co-authored the 2021 Isaac Gym paper on GPU-based physics
    simulation for robot learning, the 2023 Orbit paper on the framework Isaac Lab grew out of, and
    the 2025 Isaac Lab technical report. Before NVIDIA, State founded TransGaming Inc. and spent 15
    years on games and rendering technologies.
  source_ids: [nvidia-dev-author, nvidia-blog-author, isaacgym-paper, orbit-paper, isaaclab-paper, isaaclab-readme]
