sections:
  - heading: Career
    paragraphs:
      - text: >-
          State founded TransGaming Inc. and spent 15 years on games and rendering technologies before NVIDIA.
          An earlier NVIDIA author page describes State as a Senior Director, System Software, leading work on
          applications of AI to gaming and on remastering games for the SHIELD TV platform. In a December 2020
          NVIDIA blog post, State wrote about how GPUs can make deep reinforcement learning for robotics more
          accessible.
        source_ids: [nvidia-blog-author]
      - text: >-
          NVIDIA's developer blog now lists State as Senior Director for Simulation and AI, leading the team
          behind the Isaac Sim robotics simulator and Isaac Lab. That work extends to real-to-sim 3D
          reconstruction, including 3D Gaussian Ray Tracing, and to synthetic data generation with Omniverse
          Replicator.
        source_ids: [nvidia-dev-author]
  - heading: Robotics simulation
    paragraphs:
      - text: >-
          State co-authored the 2021 Isaac Gym paper, which ran physics simulation and policy training on the GPU
          for robot learning, and the 2023 Orbit paper describing a unified framework for interactive robot
          learning environments. Orbit grew into Isaac Lab, whose November 2025 technical report State also
          co-authored; the BSD-3-Clause Isaac Lab repository lists State among its developers and contributors.
        source_ids: [isaacgym-paper, orbit-paper, isaaclab-paper, isaaclab-readme, isaaclab-contributors]
      - text: >-
          In March 2025 State announced Newton, an open-source, extensible physics engine for robotics simulation
          built on NVIDIA Warp and developed by NVIDIA with Google DeepMind and Disney Research.
        source_ids: [newton-post]
