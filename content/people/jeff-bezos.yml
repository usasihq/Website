headline: Founder and Executive Chair of Amazon; co-founder and co-CEO of AI company Project Prometheus
bio:
  text: >-
    Jeff Bezos is the founder and Executive Chair of Amazon. Amazon's 2026 proxy statement says
    Bezos has been Chair of the Board since founding the company in 1994, served as Chief
    Executive Officer from May 1996 to July 2021, and became Executive Chair in July 2021. The
    same filing says Bezos co-founded the AI company Project Prometheus in February 2025 and has
    served as its co-CEO since November 2025.
