sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jeff Bezos founded Amazon in 1994 and has chaired its board since then. Bezos was the company's
          President from its founding until June 1999 and again from October 2000 to July 2021, and its Chief
          Executive Officer from May 1996 to July 2021, when Bezos became Executive Chair.
        source_ids: [amazon-proxy-2026]
  - heading: Other organizations
    paragraphs:
      - text: >-
          Amazon's 2026 proxy statement lists other roles alongside Amazon: Bezos founded the spaceflight company
          Blue Origin, owns The Washington Post, founded the Bezos Day One Fund, and is Executive Chair of the
          Bezos Earth Fund, which makes grants on climate and nature.
        source_ids: [amazon-proxy-2026]
      - text: >-
          In February 2025 Bezos co-founded the AI company Project Prometheus, and has served as its co-CEO since
          November 2025.
        source_ids: [amazon-proxy-2026]
