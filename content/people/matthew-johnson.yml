sections:
  - heading: Research
    paragraphs:
      - text: >-
          Matthew Johnson's research has combined probabilistic modeling with deep learning. In 2016
          Johnson was first author, with David Duvenaud, Alexander Wiltschko, Sandeep Datta and Ryan
          Adams, of "Composing graphical models with neural networks for structured representations
          and fast inference", which joins probabilistic graphical models with neural network
          observation models.
        source_ids: [svae-paper]
      - text: >-
          Johnson has also worked on automatic differentiation. With Alexey Radul, Adam Paszke, Roy
          Frostig and Dougal Maclaurin, Johnson co-authored "You Only Linearize Once: Tangents
          Transpose to Gradients" (2022), which follows up on the differentiation systems in the JAX and Dex projects by
          formalizing reverse mode as forward mode followed by unzipping and transposition.
        source_ids: [yolo-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Johnson is one of the authors of Autograd, the Python library for automatically
          differentiating NumPy code, whose README credits Dougal Maclaurin, David Duvenaud, Matt
          Johnson and Jamie Townsend as its writers. Johnson's GitHub profile describes Johnson as a
          research scientist at Google Brain.
        source_ids: [autograd-repo, github-profile]
      - text: >-
          Johnson then co-authored, with Roy Frostig and Chris Leary, the SysML 2018 paper "Compiling
          machine learning programs via high-level tracing", which the JAX README identifies as
          describing a nascent version of JAX, and is named in the repository's citation entry. In
          JAX's design documents Johnson wrote the September 2020 guide to the omnistaging upgrade and
          co-authored the January 2023 proposal for shard_map.
        source_ids: [jax-sysml, jax-readme, jax-license, jep-omnistaging, jep-shard-map]
