headline: Named author of JAX and co-author of the SysML 2018 paper on an early JAX; research scientist at Google
bio:
  text: >-
    Matthew Johnson, listed as Matthew James Johnson, is one of the authors named in the JAX
    repository's citation entry. With Roy Frostig and Chris Leary, Johnson co-authored the SysML
    2018 paper "Compiling machine learning programs via high-level tracing," which the JAX README
    identifies as describing a nascent version of JAX; the paper lists Johnson with Google Brain.
    Johnson also wrote JAX design documents published in its documentation, including the
    Omnistaging upgrade guide (2020), and co-authored the January 2023 design doc that proposed
    shard_map. Johnson's GitHub profile lists Google as their company.
