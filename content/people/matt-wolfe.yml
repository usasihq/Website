headline: Creator of Future Tools and host of The Next Wave Podcast, covering AI news and tools
bio:
  text: >-
    Matt Wolfe is a YouTuber and entrepreneur who makes videos about AI news and AI tools. Matt Wolfe
    created Future Tools, a site that began as a personal spreadsheet of AI tools in late 2022 and now
    publishes curated AI news, a tools directory, and a newsletter. Matt Wolfe also hosts The Next Wave
    Podcast, and the YouTube channel describes its aim as sifting through AI news to share what matters.
