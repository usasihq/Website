sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Matt Wolfe's YouTube channel, @mreflow, covers AI news, new models, and AI tools, with new
          videos posted every Friday and others in between. Recent uploads include AI news
          roundups covering new models and product updates.
        source_ids: [youtube, site]
      - text: >-
          Wolfe built FutureTools.io in December 2022 as a weekend project while learning Webflow and
          working with APIs, growing it out of a personal spreadsheet of AI tools. The site now
          focuses on curated AI news, a short list of recommended tools, a larger hand-added tools
          directory, and a newsletter sent twice a week, with every news item and pick reviewed by a
          person.
        source_ids: [futuretools-about, build-in-public]
  - heading: Podcast and interviews
    paragraphs:
      - text: >-
          Wolfe co-hosts The Next Wave Podcast with Nathan Lands, a show aimed at business owners
          working through changes brought by artificial intelligence. Future Tools' about page shows
          Wolfe interviewing technology executives including Satya Nadella, Demis Hassabis, Mustafa
          Suleyman, and Kevin Scott, and speaking on panels at CES and NAB.
        source_ids: [nextwave-youtube, futuretools-about]
