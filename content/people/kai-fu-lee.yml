headline: Founder and CEO of 01.AI; developed CMU's Sphinx speech recognizer; earlier at Apple, Microsoft and Google
bio:
  text: >-
    Kai-Fu Lee is the founder and CEO of 01.AI, which Lee founded in May 2023, and founded Sinovation
    Ventures in 2009. Lee earned a PhD at Carnegie Mellon University in 1988, developing the Sphinx
    large-vocabulary, speaker-independent, continuous speech recognition system for the doctoral
    thesis, and later served on CMU's faculty as an assistant professor. Lee spent six years at Apple Computer heading its
    multimedia division and was president of Cosmo Software, SGI's multimedia software unit, before
    joining Microsoft Research in 1998 as director of advanced interactive systems; at Microsoft, Lee
    founded Microsoft Research Asia and served as a global vice president. Lee later served as a
    global vice president at Google, and CMU named Lee a recipient of an honorary Doctor of Business
    Practice degree at its 2015 commencement.
  source_ids: [zeroone-team, sinovation-home, cmu-2015, ms-1998]
