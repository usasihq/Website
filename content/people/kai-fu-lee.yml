work:
  - name: Sphinx speech recognition system
    artifact_slug: null
    type: open-research
    url: https://publications.ri.cmu.edu/an-overview-of-the-sphinx-speech-recognition-system
    contribution: >-
      Developed Sphinx, a large-vocabulary, speaker-independent, continuous speech recognition
      system, for a 1988 CMU doctoral thesis, and is first-listed author (as K. F. Lee, with H. W. Hon
      and Raj Reddy) of "An overview of the SPHINX speech recognition system" (1990), which describes
