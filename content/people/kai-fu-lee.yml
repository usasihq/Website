sections:
  - heading: Research
    paragraphs:
      - text: >-
          Kai-Fu Lee earned a PhD at Carnegie Mellon University in 1988 with a thesis on Sphinx, a
          large-vocabulary, speaker-independent, continuous speech recognition system, and later taught at
          CMU as an assistant professor. With Hsiao-Wuen Hon and Raj Reddy, Lee described the system in a 1990
          overview, which explains how Sphinx used hidden Markov models with new subword units to handle
          coarticulation across a large vocabulary.
        source_ids: [cmu-2015, sphinx-paper]
  - heading: Career
    paragraphs:
      - text: >-
          Lee spent six years at Apple Computer heading its multimedia division and then led Cosmo Software,
          SGI's multimedia software unit, before joining Microsoft Research in July 1998 as director of
          advanced interactive systems. At Microsoft, Lee founded Microsoft Research Asia and served as a
          global vice president, and Lee was later a global vice president at Google and president of its
          Greater China operations.
        source_ids: [ms-1998, zeroone-team]
      - text: >-
          Lee founded Sinovation Ventures in 2009 and 01.AI in May 2023, and leads 01.AI as CEO.
        source_ids: [zeroone-team, sinovation-home]
  - heading: Products and projects
    paragraphs:
      - text: >-
          01.AI released the open-source foundation model Yi-34B in November 2023, followed by Yi-Large in
          May 2024 and the mixture-of-experts model Yi-Lightning in October 2024. The company then shifted
          toward enterprise software with its WorldWise enterprise model platform, adding agents with task
          planning in 2025 and multi-agent capabilities in a later version.
        source_ids: [zeroone-team]
