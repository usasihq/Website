headline: Carnegie Mellon assistant professor and part-time senior research scientist at Ai2; co-author of SOTOPIA
bio:
  text: >-
    Maarten Sap is an assistant professor in Carnegie Mellon University's Language Technologies
    Institute, with a courtesy appointment in the Human-Computer Interaction Institute, and a
    part-time senior research scientist and technical AI safety lead at the Allen Institute for AI
    (Ai2). Sap's research measures and improves the social and interactional intelligence of AI
    systems, assesses safety risks and socio-cultural biases in human- or AI-generated language, and
    builds narrative language technologies. Sap is a co-author of SOTOPIA, an open-ended environment in
    which language agents role-play social scenarios and are evaluated on their social intelligence.
