sections:
  - heading: Career
    paragraphs:
      - text: >-
          Sap completed a PhD in computer science and engineering at the University of Washington from 2015 to
          2022, advised by Yejin Choi and Noah Smith, with a thesis titled "Positive AI with Social Commonsense
          Models". During and after the PhD, Sap was a research intern, postdoctoral researcher and Young
          Investigator at the Allen Institute for AI, and interned at Microsoft Research in 2019.
        source_ids: [sap-cv]
      - text: >-
          Sap joined Carnegie Mellon's Language Technologies Institute as an assistant professor in 2022 and has
          been affiliated faculty in the Human-Computer Interaction Institute since 2024. At Ai2, Sap's
          visiting role has grown from research scientist to senior research scientist and AI safety lead. At
          CMU, Sap teaches courses including Ethics, Safety, and Social Impact in NLP and LLMs.
        source_ids: [sap-cv, sap-site]
  - heading: Research
    paragraphs:
      - text: >-
          Sap's doctoral work built resources for social commonsense reasoning. ATOMIC (2018) is an atlas of
          if-then knowledge about everyday events, SocialIQA (2019) is a benchmark for reasoning about social
          interactions, and Social Bias Frames (2019) models the social and power implications of language.
        source_ids: [atomic-paper, socialiqa-paper, social-bias-frames-paper]
      - text: >-
          Sap's group at CMU studies the social intelligence of AI systems, including theory of mind and
          pragmatic understanding, the safety of AI agents and people's reliance on them, cultural adaptability,
          and narrative understanding. SOTOPIA (2023) evaluates language agents as they role-play social
          scenarios, and "Artificial Hivemind" (2025) studies the homogeneity of open-ended language model
          outputs.
        source_ids: [sap-site, sotopia-paper, hivemind-paper]
