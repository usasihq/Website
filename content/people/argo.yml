headline: Maker of Fowl Labs Mac apps and NameThatUI, a visual dictionary of user interface terms
bio:
  text: >-
    argo makes Mac apps under the name Fowl Labs, including the FowyRing app launcher, the
    FowyBreak break timer, the FowlNote notes app, and FowlVoice, a voice dictation app that
    runs speech recognition on the Mac. argo also publishes NameThatUI, a visual dictionary of
    user interface terms for the web and macOS. Each NameThatUI entry gives an element's name,
    its API symbol, and a ready-to-paste prompt for coding agents, with terms checked against
    platform documentation and accessibility standards.
