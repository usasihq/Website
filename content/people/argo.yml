sections:
  - heading: Products and projects
    paragraphs:
      - text: >-
          argo publishes Mac apps under the Fowl Labs name. FowyRing opens up to ten favourite apps from a
          ring that appears with a held key, and FowyBreak is a menu-bar break timer that counts real activity
          rather than clock time; both are free, run on macOS 14 and later, and state that they collect no app
          telemetry.
        source_ids: [fowllabs-home, fowyring, fowybreak]
      - text: >-
          FowlNote is a paid notes app whose notes are plain Markdown files, with a command-line interface that
          coding agents can use to drive the app. FowlVoice, a free dictation app, supports push-to-talk,
          hands-free recording and a Flow Mode, and its about page says it is made by a solo developer, with
          core speech recognition running on the Mac.
        source_ids: [fowlnote-home, fowlvoice-about]
  - heading: NameThatUI
    paragraphs:
      - text: >-
          NameThatUI lets visitors describe an interface element in their own words and returns its proper
          name, its API symbol and a prompt for a coding agent, covering both web and macOS elements. The site's
          methodology page says each term must point to something visible, is checked against platform
          guidance, framework documentation and accessibility standards, and is shown with a demo that
          separates it from look-alike elements.
        source_ids: [namethatui-home, namethatui-methodology]
