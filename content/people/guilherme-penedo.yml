    contribution: >-
      First author of "The FineWeb Datasets: Decanting the Web for the Finest Text Data at Scale"
      (2024), the paper describing the FineWeb dataset.
    source_ids: [fineweb-paper, gp-site]
  - name: FineWeb2
    artifact_slug: null
