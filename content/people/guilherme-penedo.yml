headline: Machine Learning Research Engineer at Hugging Face; first author of FineWeb, FineWeb2 and RefinedWeb
bio:
  text: >-
    Guilherme Penedo is a Machine Learning Research Engineer at Hugging Face, where Penedo works on
    datasets for training large language models. Penedo is first author of the FineWeb datasets
    paper (2024), the FineWeb2 paper (2025) and the earlier RefinedWeb paper for the Falcon models
    (2023), and has since released datasets including FineWiki and FineTranslations.
  source_ids: [gp-site, gp-github, fineweb-paper, fineweb2-paper, refinedweb-paper]
  reviewed_at: 2026-10-22
