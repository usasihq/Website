sections:
  - heading: Datasets
    paragraphs:
      - text: >-
          Penedo was first author of the RefinedWeb paper (2023), which accompanied the Falcon language
          models, and of the FineWeb paper (2024), describing the FineWeb web-text dataset released by
          Hugging Face. The FineWeb2 paper (2025) adapts the same processing approach to many languages.
        source_ids: [refinedweb-paper, fineweb-paper, fineweb2-paper]
      - text: >-
          Penedo's site lists later releases including FineWiki (October 2025), an updated extraction of
          Wikipedia in more than 300 languages, and FineTranslations (January 2026), a multilingual to
          English parallel dataset built from FineWeb2.
        source_ids: [gp-site]
  - heading: Other work
    paragraphs:
      - text: >-
          Penedo is a co-author of the SmolLM2 paper (2025) and the first-listed author of the competitive-programming
          ("Olympic coding") datasets and models released through Hugging Face's Open-R1 project.
        source_ids: [smollm2-paper, gp-site]
