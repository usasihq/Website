    source_ids: [fineweb2-paper, gp-site]
  - name: RefinedWeb
    artifact_slug: null
    type: open-data
    url: https://arxiv.org/abs/2306.01116
    contribution: >-
      First author of "The RefinedWeb Dataset for Falcon LLM" (2023), on building a pretraining dataset
      from web data alone.
    source_ids: [refinedweb-paper, gp-site]
