sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ramaswamy held research positions at Bell Labs, Lucent Technologies and Bell Communications Research
          (Bellcore). Over 15 years at Google, Ramaswamy led the company's advertising products, which covered
          search, display and video advertising, analytics, shopping, payments and travel.
        source_ids: [snowflake-leadership, ceo-press-release]
      - text: >-
          Ramaswamy co-founded Neeva in 2019, a search engine built around AI and privacy. Snowflake acquired
          Neeva in May 2023, and Ramaswamy joined Snowflake as Senior Vice President of AI.
        source_ids: [snowflake-leadership, ceo-press-release]
  - heading: Snowflake
    paragraphs:
      - text: >-
          As Senior Vice President of AI, Ramaswamy led Snowflake's AI strategy and the launch of Snowflake
          Cortex. On February 28, 2024, Snowflake announced that Ramaswamy had been named Chief Executive
          Officer and a member of the Board of Directors, succeeding Frank Slootman, who remained Chairman.
        source_ids: [ceo-press-release]
