headline: Chief Executive Officer of Snowflake since February 2024; co-founder of Neeva
bio:
  text: >-
    Sridhar Ramaswamy is the Chief Executive Officer of Snowflake. Ramaswamy joined Snowflake in May 2023
    through the company's acquisition of Neeva, which Ramaswamy co-founded in 2019, and led Snowflake's AI
    strategy as Senior Vice President of AI before being named CEO in February 2024. Earlier, Ramaswamy spent
    15 years at Google, where Ramaswamy led the company's advertising products.
  source_ids: [snowflake-leadership, ceo-press-release]
