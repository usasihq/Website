sections:
  - heading: Career
    paragraphs:
      - text: >-
          From 1995 until August 2011, Neri served as Senior Vice President, Customer Services
          for the HP Personal Systems Group, before moving in August 2011 to lead the HP Technology
          Services business unit. From September 2013, Neri led the HP Servers business, and from
          May to October 2014 also led the HP Networking business unit.
        source_ids: [hpe-bod]
      - text: >-
          In October 2014, Neri became Senior Vice President and General Manager of the Enterprise
          Group at HP Co., continuing in that role at HPE. Neri was named
          President of HPE in May 2017 and President and CEO in February 2018.
        source_ids: [hpe-bod]
  - heading: AI infrastructure
    paragraphs:
      - text: >-
          Under Neri, HPE offers AI data center systems built with partners such as AMD. In
          September 2026, HPE announced its first order for the AMD Helios AI Rack by HPE, which
          combines rack-scale compute, HPE Networking scale-up switching and direct liquid cooling,
          and noted that Juniper Networks is now part of HPE.
        source_ids: [hpe-helios]
