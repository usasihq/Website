headline: President and CEO of Hewlett Packard Enterprise since February 2018, after more than two decades at HP
bio:
  text: >-
    Antonio Neri is the President and CEO of Hewlett Packard Enterprise (HPE), a role held since
    February 2018, and a member of HPE's board of directors. From 1995, Neri held senior roles at HP and HPE, starting in
    customer services for HP's Personal Systems Group and continuing through leadership of the
    Technology Services, Servers, Networking and Enterprise Group businesses before Neri became
    President of HPE in 2017.
  source_ids: [hpe-bod, hpe-helios]
  reviewed_at: 2026-10-21
