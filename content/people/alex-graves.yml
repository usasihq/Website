sections:
  - heading: Research on sequence learning
    paragraphs:
      - text: >-
          Graves's publication list centres on recurrent neural networks, and in particular LSTM, applied
          to labelling sequences such as speech and handwriting. With Jürgen Schmidhuber and colleagues,
          Graves published work on bidirectional LSTM for phoneme classification in 2005 and introduced
          Connectionist Temporal Classification at ICML 2006, a way to train recurrent networks on
          sequence data that has not been segmented in advance. The list also includes multidimensional
          recurrent networks for offline handwriting recognition at NIPS 2008 and a 2009 IEEE TPAMI
          article on unconstrained handwriting recognition.
        source_ids: [graves-site]
      - text: >-
          Graves's 2008 dissertation at Technische Universität München, "Supervised Sequence Labelling
          with Recurrent Neural Networks", was later extended into a 2012 Springer textbook of the same
          name. In 2013 Graves, Abdel-rahman Mohamed and Geoffrey Hinton reported deep LSTM networks
          trained end to end for speech recognition, evaluated on the TIMIT phoneme recognition
          benchmark.
        source_ids: [graves-site, speech-drnn-paper]
  - heading: Generative models and adaptive computation
    paragraphs:
      - text: >-
          In "Generating Sequences With Recurrent Neural Networks" (2013), Graves showed LSTM networks
          generating text and online handwriting by predicting one data point at a time, and extended
          the approach to synthesizing cursive handwriting from a given text. In 2016 Graves introduced
          Adaptive Computation Time, an algorithm that lets a recurrent network learn how many
          computation steps to take between receiving an input and producing an output.
        source_ids: [gen-seq-paper, act-paper]
      - text: >-
          In 2023 Graves, Rupesh Kumar Srivastava, Timothy Atkinson and Faustino Gomez, writing with
          NNAISENSE affiliations, introduced Bayesian Flow Networks. The paper derives loss functions
          for continuous, discretised and discrete data and reports experiments on image modelling and
          character-level language modelling.
        source_ids: [bfn-paper]
  - heading: Neural networks with external memory
    paragraphs:
      - text: >-
          With Greg Wayne and Ivo Danihelka, Graves wrote "Neural Turing Machines" (2014), which couples
          a neural network to an external memory through attention so that the whole system can be
          trained by gradient descent and can learn simple algorithms such as copying and sorting.
        source_ids: [ntm-paper]
      - text: >-
          The follow-up, "Hybrid computing using a neural network with dynamic external memory", was
          published in Nature on 12 October 2016 by Graves, Wayne and colleagues at Google DeepMind. It
          describes the differentiable neural computer, a network that reads from and writes to an
          external memory matrix. The paper's contributions statement records that Graves and Wayne
          conceived the project and that the two contributed equally.
        source_ids: [dnc-paper]
