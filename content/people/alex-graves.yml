headline: First author of Neural Turing Machines and of the Google DeepMind differentiable neural computer paper
bio:
  text: >-
    Alex Graves's University of Toronto homepage lists research interests in recurrent neural
    networks, especially LSTM, supervised sequence labelling such as speech and handwriting
    recognition, and unsupervised sequence learning, along with papers including "Generating
    Sequences With Recurrent Neural Networks". The homepage describes a CIFAR Junior Fellowship in
    the Department of Computer Science at the University of Toronto, supervised by Geoffrey Hinton. Graves is first author of "Neural Turing Machines" (2014), which couples
    neural networks to an external memory, and of the 2016 Nature paper on the differentiable neural
    computer, whose authors are listed with Google DeepMind affiliations.
  source_ids: [graves-site, ntm-paper, dnc-paper]
  reviewed_at: 2026-10-21
