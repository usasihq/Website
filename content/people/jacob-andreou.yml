sections:
  - heading: Career
    paragraphs:
      - text: >-
          Andreou was an SVP at Snap, where Microsoft says Andreou helped scale the company from its early
          days. At Microsoft AI, Andreou was CVP of Product and Growth and, in Satya Nadella's words, sped up
          the group's user-focused, AI-first approach to building and growing products.
        source_ids: [ms-copilot-2026]
  - heading: Copilot leadership
    paragraphs:
      - text: >-
          In a March 17, 2026 leadership update, Nadella announced that Microsoft's commercial and consumer
          Copilot work would become one effort across four pillars: the Copilot experience, the Copilot
          platform, Microsoft 365 apps and AI models. Andreou was named EVP, Copilot, leading the Copilot
          experience across consumer and commercial customers, with responsibility for design, product,
          growth and engineering, and reporting to Nadella.
        source_ids: [ms-copilot-2026]
      - text: >-
          In an October 1, 2026 update on Microsoft 365 and LinkedIn leadership, Microsoft said Jon Friedman
          would report to Andreou.
        source_ids: [ms-m365-2026]
