headline: Executive Vice President, Copilot at Microsoft; former CVP of Product and Growth at Microsoft AI
bio:
  text: >-
    Jacob Andreou is Executive Vice President, Copilot at Microsoft. In March 2026 Microsoft brought its
    consumer and commercial Copilot work together as one effort, and Andreou took charge of the Copilot
    experience across both, covering design, product, growth and engineering, reporting to Satya
    Nadella and serving on the Copilot Leadership Team. Andreou was previously CVP of Product and Growth
    at Microsoft AI and, before Microsoft, an SVP at Snap. In an October 2026 leadership update,
    Microsoft said Jon Friedman would report to Andreou.
