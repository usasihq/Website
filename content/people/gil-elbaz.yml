headline: Founder and Chairman of the Board of Common Crawl; co-founder of Applied Semantics
bio:
  text: >-
    Gil Elbaz founded Common Crawl in 2007 and serves as Chairman of its Board of Directors. Common
    Crawl's history says Elbaz's aim was to make web-scale crawl data available to researchers who lack
    the resources to run their own crawlers, and that Elbaz had earlier co-founded Applied Semantics.
  source_ids: [cc-about, cc-team]
