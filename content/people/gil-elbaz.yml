sections:
  - heading: Career
    paragraphs:
      - text: >-
          Elbaz co-founded Applied Semantics, which Google acquired in 2003 and whose technology was
          incorporated into Google AdSense. In 2007 Elbaz founded Common Crawl to give researchers access
          to web-scale crawl data, and the foundation began collecting data in 2008.
        source_ids: [cc-about]
      - text: >-
          Elbaz is Chairman of Common Crawl's Board of Directors. Over time the corpus became a common
          starting point for language-model training sets, including Google's C4 in 2019 and later
          filtered datasets such as RefinedWeb and FineWeb.
        source_ids: [cc-team, cc-about]
timeline:
  - date: "2003"
    text: Applied Semantics, which Elbaz co-founded, was acquired by Google.
    source_ids: [cc-about]
  - date: "2007"
    text: Founded Common Crawl as a nonprofit provider of open web crawl data.
    source_ids: [cc-about]
  - date: "2008"
    text: Common Crawl began collecting data with a custom Hadoop-based crawler.
    source_ids: [cc-about]
  - date: "2013"
    text: Common Crawl switched to an Apache Nutch-based crawler and the WARC format.
    source_ids: [cc-about]
