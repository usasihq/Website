slug: shantanu-jain
name: Shantanu Jain
initials: SJ
groups: [engineering, open-source]
sector: corporate
specialties: [language-models, developer-tools]
headline: Author of OpenAI's tiktoken tokenizer; mypy and typeshed maintainer and CPython core developer
bio:
  text: >-
    Shantanu Jain, who publishes open-source work under the username hauntsaninja, has worked on
    language models at OpenAI since 2020, studying training data and building training
    infrastructure. Jain is the listed author of tiktoken, OpenAI's open-source BPE tokeniser for use
    with its models, and is a maintainer of mypy and typeshed and a CPython core developer.
  source_ids: [jain-site, jain-github, tiktoken-pyproject, tiktoken-pypi, mypy-credits]
  reviewed_at: 2026-10-22
