sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jain worked at Quora before joining OpenAI. Jain's site states that Jain has worked on language
          models at OpenAI since 2020, studying what data to train them on and building the infrastructure
          used to train them; Jain's GitHub profile lists OpenAI as the current organization.
        source_ids: [jain-site, jain-github]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Jain is the listed author of tiktoken, a fast BPE tokeniser for use with OpenAI's models, whose
          README directs OpenAI staff with questions to Jain. The Python package first appeared on PyPI in
          December 2022 and has continued to receive releases, including version 0.14.0 in August 2026.
        source_ids: [tiktoken-pyproject, tiktoken-readme, tiktoken-pypi]
      - text: >-
          Outside OpenAI, Jain works in the Python static typing ecosystem: the mypy CREDITS file lists
          Jain among the non-Dropbox core team members, and Jain also maintains typeshed and is a CPython
          core developer. Jain wrote pyp, a tool for running Python one-liners at the shell.
        source_ids: [mypy-credits, jain-site, jain-github, pyp-readme]
timeline:
