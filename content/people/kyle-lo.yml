sections:
  - heading: Research
    paragraphs:
      - text: >-
          Lo's earlier work focused on scientific text and reading. Lo co-authored SciBERT (2019), a
          language model pretrained on scientific papers, and was first author of S2ORC, the Semantic Scholar
          Open Research Corpus. Lo also worked on specializing language models to domains, human-AI interaction
          for sensemaking over large document collections, and augmented reading interfaces, including the
          Semantic Reader project summarized in Communications of the ACM in 2024.
        source_ids: [scibert-paper, s2orc-paper, lo-site]
      - text: >-
          Lo's current research centers on large-scale pretraining, with emphasis on data curation, data mixing,
          benchmark validity, efficient experimentation and generalization across model scales. Recent papers
          listed on Lo's site include Signal and Noise, on why some benchmarks make task scaling laws hard to
          fit, FlexOlmo, a mixture-of-experts model whose experts are trained on separate data sources, and
          Olmix, the data mixing framework used for OLMo 3.
        source_ids: [lo-site]
  - heading: Open models and data
    paragraphs:
      - text: >-
          Lo co-led Ai2's OLMo project on fully open language models. Lo was the last-listed author of the
          Dolma pretraining corpus paper and a co-author of the original OLMo paper, both released in early
          2024 and both given best paper awards at ACL 2024. Lo then contributed to OLMoE, the family's first
          mixture-of-experts model, to OLMo 2 and its paper "2 OLMo 2 Furious", and to OLMo 3, released in
          November 2025 with its training datasets.
        source_ids: [lo-site, dolma-paper, olmo-paper, olmoe-pdf, olmo2-pdf]
      - text: >-
          Lo has also co-authored data tools that support this work, such as olmOCR (2025), which uses vision
          language models to turn PDFs into text for training corpora. In December 2024 Lo co-presented a
          NeurIPS tutorial, "Opening the Language Model Pipeline", with Akshita Bhagia and Nathan Lambert. Lo's
          site marks a farewell to Ai2 in March 2026.
        source_ids: [olmocr-paper, lo-site]
