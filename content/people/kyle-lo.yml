headline: Former Ai2 research scientist who co-led the OLMo project; last-listed author of the Dolma paper
bio:
  text: >-
    Kyle Lo was a research scientist at Ai2, where Lo co-led the OLMo project on open language
    modeling; Lo's site marks a farewell to Ai2 in March 2026. Lo's research centers on large-scale
    language-model pretraining, with an emphasis on data curation, data mixing, benchmark validity,
    and efficient experimentation. Lo is the last-listed author of the Dolma paper, a co-author of
    the original OLMo paper, and is credited in OLMo 2 with base-model development and in OLMoE with
    pretraining dataset creation and data experiments.
  source_ids: [lo-site, dolma-paper, olmo-paper, olmo2-pdf, olmoe-pdf]
  reviewed_at: 2026-10-13
