sections:
  - heading: Career
    paragraphs:
      - text: >-
          Dan Shipper is the CEO and cofounder of Every, a media and software company founded in 2020.
          Every publishes a daily newsletter about technology, builds its own software products, offers
          courses, and provides AI consulting and training services; its website runs on Ruby on Rails
          and was built in-house.
        source_ids: [every-about, author]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Shipper writes Chain of Thought, a weekly column on Every about the frontiers of AI, and hosts
          The Every Podcast, which features conversations with founders, investors and members of
          Every's own team. Shipper's author page on Every collects essays going back to 2020.
        source_ids: [author, podcast]
      - text: >-
          Many of Shipper's essays look at how people use language models in everyday work. They include
          "The End of Organizing" (January 2023), on using GPT-3 to work with personal notes, "GPT-4 Is a
          Reasoning Engine" (March 2023), and "The Knowledge Economy Is Over. Welcome to the Allocation
          Economy." (January 2024), which argues that people working with AI take on roles more like
          managers.
        source_ids: [author]
