sections:
  - heading: Career
    paragraphs:
      - text: >-
          Müller was a PhD student in computer science at the University of Bonn from 2010 to 2013,
          advised by Sven Behnke, and completed a thesis on methods for learning structured prediction
          in semantic segmentation in 2014. Müller then worked as a Machine Learning Scientist at
          Amazon from 2013 to 2014, designing large-scale machine learning and computer vision
          applications.
        source_ids: [cv, homepage]
      - text: >-
          From 2014 to 2016 Müller was a Research Engineer at the NYU Center for Data Science,
          developing open-source tools for machine learning and data science. From 2016 to 2020 Müller
          taught in Columbia University's Data Science Master program as a Lecturer in Discipline and
          Associate Research Scientist, and in 2020 joined Microsoft as a Principal Research SDE in the
          Gray Systems Lab.
        source_ids: [cv, homepage]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Müller is a core developer of scikit-learn, and the January 2021 CV lists membership of its
          Technical Committee; the project's About page lists Andreas Mueller in its current Maintainers Team.
          Müller co-authored the 2013 workshop paper "API design for machine learning software:
          experiences from the scikit-learn project," which the About page lists among the project's
          citable publications.
        source_ids: [cv, sklearn-about, homepage]
      - text: >-
          Müller created PyStruct, a library for structured learning and prediction, and described it
          with Sven Behnke in a 2014 Journal of Machine Learning Research paper. The CV also lists
          co-authorship of CUV, a C++ and Python interface to CUDA aimed at deep learning, and
          contributions to scikit-image, and names Müller an action editor for the JMLR open-source
          software track.
        source_ids: [cv, homepage]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          With Sarah Guido, Müller wrote Introduction to Machine Learning with Python (O'Reilly, 2016),
          which keeps formulas to a minimum and teaches the subject through code and a tour of
          scikit-learn's main modules. Müller also recorded the O'Reilly video course Advanced Machine
          Learning with scikit-learn and is a Software Carpentry instructor.
        source_ids: [homepage, cv]
      - text: >-
          Müller's homepage lists conference tutorials on scikit-learn, including two-part
          introductory tutorials at SciPy 2015 with Kyle Kastner and SciPy 2016 with Sebastian
          Raschka, and talks on automatic machine learning and on the design principles behind
          scikit-learn.
        source_ids: [homepage]
