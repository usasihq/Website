headline: Core developer and co-maintainer of scikit-learn; Principal Research SDE at Microsoft
bio:
  text: >-
    Andreas C. Müller is a Principal Research SDE at Microsoft, working in the Gray Systems Lab,
    and one of the core developers of the scikit-learn machine learning library, which they have
    co-maintained for several years. Müller's CV lists earlier positions as a Machine Learning
    Scientist at Amazon, a Research Engineer at the NYU Center for Data Science, and a Lecturer in
    Discipline and Associate Research Scientist at Columbia University, where the work included
    scikit-learn development. Müller also created and maintains the PyStruct and wordcloud Python
    packages and, with Sarah Guido, wrote the O'Reilly book Introduction to Machine Learning with
    Python, a practical guide built around scikit-learn.
  source_ids: [homepage, cv, sklearn-about]
  reviewed_at: 2026-10-13
