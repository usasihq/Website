sections:
  - heading: Career
    paragraphs:
      - text: >-
          Chen's homepage describes a joint PhD program between Harbin Institute of Technology and
          Microsoft Research Asia, with a research internship in MSRA's Natural Language Computing
          Group from May 2020, mentored by Yu Wu and Shujie Liu. The same page lists an earlier
          research internship at Harvard University's Data Systems Laboratory in 2018 and 2019.
          Chen's GitHub profile now gives the role of Research Scientist at Meta FAIR.
        source_ids: [chen-site, github-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Chen's research centers on language-model-style pre-training for speech and audio. WavLM
          (2021) is a self-supervised model meant to serve the full range of speech-processing tasks,
          and UniSpeech-SAT (ICASSP 2022) added speaker-aware pre-training. SpeechLM (2022) used
          unpaired text to improve speech pre-training.
        source_ids: [wavlm-paper, unispeech-sat-paper, speechlm-paper, chen-site]
      - text: >-
          BEATs (ICML 2023) pre-trains audio models with acoustic tokenizers, and VALL-E (2023) treats
          text-to-speech as language modeling over neural codec codes, synthesizing a voice from a
          short sample. Earlier work covered continuous speech separation, some of which the homepage
          says shipped in Microsoft's Conversation Transcription Service.
        source_ids: [beats-paper, valle-paper, chen-site]
timeline:
  - date: 2018-08
    text: Began a research internship at the Data Systems Laboratory at Harvard University.
    source_ids: [chen-site]
  - date: 2020-05
    text: Joined the Natural Language Computing Group at Microsoft Research Asia as a research intern.
    source_ids: [chen-site]
  - date: 2021-10-12
    text: Released UniSpeech-SAT, on speaker-aware pre-training for universal speech representations.
    source_ids: [unispeech-sat-paper]
  - date: 2021-10-26
    text: Released WavLM, a large-scale self-supervised pre-training model for full-stack speech processing.
    source_ids: [wavlm-paper]
  - date: 2022-09-30
    text: Co-first-authored SpeechLM, on enhancing speech pre-training with unpaired text data.
    source_ids: [speechlm-paper, chen-site]
  - date: 2022-12-18
    text: Released BEATs, on audio pre-training with acoustic tokenizers, later an ICML 2023 oral paper.
    source_ids: [beats-paper, chen-site]
  - date: 2023-01-05
    text: Co-first-authored the VALL-E paper on neural codec language models for zero-shot text to speech.
    source_ids: [valle-paper, chen-site]
