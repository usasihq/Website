headline: Research scientist at Meta FAIR; first author of WavLM and co-first author of VALL-E
bio:
  text: >-
    Sanyuan Chen's GitHub profile describes a role as a research scientist at Meta FAIR. Chen's
    homepage covers earlier work as a research intern in the Natural Language Computing Group at
    Microsoft Research Asia, focused on language model pre-training for speech and audio processing,
    where Chen developed pre-trained models including WavLM, VALL-E, and BEATs. Chen is first author
    of WavLM, a self-supervised pre-training model for full-stack speech processing, and co-first
    author of the VALL-E paper, Neural Codec Language Models are Zero-Shot Text to Speech
    Synthesizers.
  source_ids: [github-profile, chen-site, wavlm-paper, valle-paper]
  reviewed_at: 2026-10-21
