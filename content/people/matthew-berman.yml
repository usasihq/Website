headline: Founder of Forward Future, an AI media company with a YouTube channel, daily newsletter, and live show
bio:
  text: >-
    Matthew Berman is the founder of Forward Future, an AI media company that aims to help
    professionals understand AI. Forward Future publishes Matthew Berman's YouTube channel, which
    carries tutorials, analysis of AI news, and interviews, along with a free daily newsletter called
    The Future Today and a weekly live show, Forward Future Live.
