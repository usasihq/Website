sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Matthew Berman's YouTube channel, which joined YouTube in January 2008, states a mission of making
          the benefits of AI and emerging technology accessible to everyone. Forward Future describes the
          channel as carrying in-depth tutorials, analysis of breaking AI news and interviews.
        source_ids: [youtube-about, ff-about]
      - text: >-
          Forward Future's interview series includes conversations with Microsoft CEO Satya Nadella and Google
          CEO Sundar Pichai in May 2025 and with Greg Brockman in October 2025. Alongside the channel,
          the company publishes The Future Today, a free daily newsletter summarizing AI news, and Forward
          Future Live, a weekly Friday show with analysis and guest panels.
        source_ids: [ff-interviews, ff-about]
  - heading: Forward Future
    paragraphs:
      - text: >-
          Berman founded Forward Future, an AI media company whose stated aim is to help professionals
          understand the technology changing their industries; its team lists Nick Wentz as co-founder. The
          site also publishes original essays and guides and open tools such as Relay, an agent skill that
          routes a coding task through planner, executor and reviewer models, and a library of agent loops.
        source_ids: [ff-about, ff-home]
