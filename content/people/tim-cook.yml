headline: Apple executive chair and CEO from 2011 to 2026, whose tenure included Apple Intelligence
bio:
  text: >-
    Tim Cook is executive chair of Apple's board of directors and has been a director since 2011. Cook joined
    Apple in 1998, was chief operating officer before being named CEO in August 2011, and served as CEO until
    2026; Apple announced in April 2026 that John Ternus would become CEO and Cook executive chairman
    effective September 1, 2026. Apple's leadership page says Apple transitioned to Apple-designed silicon
    under Cook's leadership. Apple's June 2024 press release introducing Apple Intelligence, a personal
    intelligence system built on generative models for iPhone, iPad and Mac, includes a statement from Cook as
    Apple's CEO.
