sections:
  - heading: Career
    paragraphs:
      - text: >-
          Cook joined Apple in 1998. As chief operating officer, Cook was responsible for Apple's worldwide
          sales and operations, including end-to-end management of the supply chain, sales activities and
          service and support. Cook became a director in 2011 and was named CEO in August 2011.
        source_ids: [apple-leadership-cook]
      - text: >-
          On April 20, 2026 Apple announced that John Ternus, senior vice president of Hardware Engineering,
          would become CEO and that Cook would become executive chairman of the board, effective September 1,
          2026. Apple said Cook would assist with certain areas of the company as executive chairman,
          including engagement with policymakers.
        source_ids: [apple-transition-2026, apple-leadership-cook]
  - heading: Products and projects
    paragraphs:
      - text: >-
          As CEO, Cook oversaw new product categories including Apple Watch, AirPods and Apple Vision Pro, and
          services such as iCloud, Apple Pay, Apple TV and Apple Music. During Cook's tenure Apple
          transitioned to Apple-designed silicon, giving the company more control of its core technology.
        source_ids: [apple-leadership-cook]
      - text: >-
          In June 2024 Apple introduced Apple Intelligence, a personal intelligence system for iPhone, iPad and
          Mac built on generative models, with an introductory statement from Cook as CEO.
        source_ids: [apple-intelligence-2024]
