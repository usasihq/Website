sections:
  - heading: Career
    paragraphs:
      - text: >-
          Robert Tibshirani began as an assistant professor in the Department of Statistics and the
          Department of Preventive Medicine and Biostatistics at the University of Toronto in 1985,
          becoming an associate professor in 1989 and a professor in 1994. In 1998 Tibshirani joined
          Stanford University as a professor of Health Research and Policy and of Statistics.
        source_ids: [tibs-stanford]
      - text: >-
          Since 2015 Tibshirani has been a Professor of Biomedical Data Science and of Statistics at
          Stanford. Tibshirani's main interests are applied statistics, biostatistics and data
          mining, and current research addresses problems in biology and genomics, medicine and
          industry.
        source_ids: [tibs-stanford]
  - heading: Research and software
    paragraphs:
      - text: >-
          Many of Tibshirani's publications concern the lasso. With Bradley Efron, Trevor Hastie
          and Iain Johnstone, Tibshirani co-authored "Least Angle Regression" (2004), which showed that
          a simple modification of the LARS algorithm implements the lasso, a version of least squares
          that constrains the sum of the absolute regression coefficients. CRAN lists Tibshirani among
          the authors of glmnet, an R package that fits the full lasso or elastic-net regularization
          path for linear, logistic, multinomial, Poisson and Cox regression models.
        source_ids: [lars-paper, glmnet-cran]
      - text: >-
          Recent publications listed on Tibshirani's Stanford profile include uniLasso, a two-stage
          regression method guided by univariate coefficients, its use for polygenic risk scores in
          genomics, and "Pretraining and the lasso" (2026) in the Journal of the Royal Statistical
          Society, Series B. With Stanford collaborator Balasubramanian Narasimhan, Tibshirani also
          develops software packages for genomics and proteomics.
        source_ids: [tibs-stanford]
  - heading: Books
    paragraphs:
      - text: >-
          Tibshirani co-wrote "Generalized Additive Models" with Trevor Hastie, "An Introduction to the
          Bootstrap" with Bradley Efron, and "The Elements of Statistical Learning" with Hastie and
          Jerome Friedman. Tibshirani is also a co-author of "An Introduction to Statistical Learning",
          a less technical treatment whose first R edition appeared in 2013, followed by a second R
          edition in 2021 and a Python edition in 2023, each with hands-on labs.
        source_ids: [tibs-stanford, isl-site]
