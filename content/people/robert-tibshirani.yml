headline: Stanford statistician; co-author of glmnet, Least Angle Regression and The Elements of Statistical Learning
bio:
  text: >-
    Robert Tibshirani is a Professor of Biomedical Data Science and of Statistics at Stanford
    University. Tibshirani co-authored "Least Angle Regression" (2004), which showed that a simple
    modification of the LARS algorithm implements the lasso, and is listed on CRAN as an author of
    glmnet, the R package for lasso and elastic-net regularized generalized linear models. With
    Trevor Hastie and Jerome Friedman, Tibshirani co-wrote The Elements of Statistical Learning.
  source_ids: [tibs-stanford, lars-paper, glmnet-cran]
  reviewed_at: 2026-10-21
