headline: Author of the original lasso paper and co-author of glmnet and The Elements of Statistical Learning
bio:
  text: >-
    Robert Tibshirani is a Professor of Biomedical Data Science and of Statistics at Stanford
    University. Tibshirani is the author of the original lasso paper, "Regression shrinkage and
    selection via the lasso" (1996), and is listed on CRAN as an author of glmnet, the R package for
    lasso and elastic-net regularized generalized linear models. With Trevor Hastie and Jerome
    Friedman, Tibshirani co-wrote The Elements of Statistical Learning, which the authors offer as
    a PDF download.
  source_ids: [tibs-stanford, tibs-site, tibs-lasso, glmnet-cran, esl-site]
  reviewed_at: 2026-10-13
