sections:
  - heading: Career
    paragraphs:
      - text: >-
          Morris took part in a Google Brain research program and later worked as a part-time student researcher at Meta's
          FAIR lab. Morris's site highlights research on text embeddings, including a training method that
          incorporates context at test time (2024) and methods for inverting text embeddings (2023).
        source_ids: [jxm-site]
  - heading: Research
    paragraphs:
      - text: >-
          Morris's research focuses on text embeddings and language models. With Volodymyr Kuleshov, Vitaly
          Shmatikov and Alexander M. Rush, Morris showed in 2023 that text embeddings can be inverted to
          recover the original text, and with Rush introduced Contextual Document Embeddings (2024), which
          incorporate context from neighboring documents.
        source_ids: [inversion-paper, cde-paper, jxm-site]
      - text: >-
          Morris is the second author, after Zach Nussbaum, of the Nomic Embed technical report on a
          reproducible long-context text embedding model. Earlier, Morris was first author of TextAttack
          (2020), a Python framework for adversarial attacks and data augmentation in NLP.
        source_ids: [nomic-embed-paper, textattack-paper]
