headline: AI researcher (Jack Morris) and second author of the Nomic Embed technical report; creator of TextAttack
bio:
  text: >-
    John X. Morris, who goes by Jack Morris, is an AI researcher whose work focuses on text embeddings
    and language models. Morris is the second author of the Nomic
    Embed technical report (2024), which the nomic-embed-text-v1.5 model card cites, and has published
    work on text embeddings including Contextual Document Embeddings and methods for inverting text
    embeddings. Morris also created TextAttack, a Python framework for adversarial
    attacks in NLP.
  source_ids: [jxm-site, nomic-embed-paper, card-v15, cde-paper, inversion-paper, textattack-paper]
  reviewed_at: 2026-10-22
