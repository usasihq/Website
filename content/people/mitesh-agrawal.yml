headline: Lambda's Head of Cloud in 2023–2024 posts; introduced Lambda 1-Click Clusters of NVIDIA H100 GPUs
bio:
  text: >-
    Mitesh Agrawal was Head of Cloud at Lambda and was quoted in that role in Lambda's 2023 announcement of NVIDIA H100 GPUs coming to Lambda Cloud.
    Agrawal's posts on Lambda's blog introduced Lambda 1-Click Clusters of interconnected NVIDIA
    H100 GPUs for training large AI models (2024), smaller on-demand H100 instances, and Kubernetes
    cluster deployment with SkyPilot.
