sections:
  - heading: Lambda
    paragraphs:
      - text: >-
          Mitesh Agrawal served as Head of Cloud at Lambda, the AI compute company, and was quoted in
          that role in Lambda's March 2023 announcement that NVIDIA H100 Tensor Core GPUs would arrive
          on Lambda Cloud in early April 2023.
        source_ids: [lambda-h100-post]
      - text: >-
          Agrawal's 2024 posts on Lambda's blog announced several cloud products. In June 2024 Agrawal
          introduced 1-Click Clusters, on-demand clusters of 16 to 512 interconnected NVIDIA H100 GPUs
          for training large AI models without long-term contracts. Later posts covered the availability
          of the Hermes 3 model on Lambda's cloud with a chat completions API (August 2024),
          Kubernetes cluster deployment with SkyPilot (September 2024), and smaller on-demand 1x, 2x
          and 4x H100 SXM instances (October 2024).
        source_ids: [lambda-1cc-post, lambda-author]
