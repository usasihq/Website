sections:
  - heading: Career
    paragraphs:
      - text: >-
          Quesnelle's earlier publications include a 2015 guide to automotive Ethernet, co-authored for
          Intrepid Control Systems, and a 2017 sole-author paper on the linkability of Zcash transactions.
        source_ids: [jq-site, zcash-paper]
      - text: >-
          Quesnelle is a co-founder and the CTO of Nous Research, as stated on Quesnelle's homepage and
          GitHub profile. Quesnelle's selected open-source projects include transformers-openai-api, an
          OpenAI Completions API compatible server for transformers models, and literAI, which generates
          visual podcasts with open-source models.
        source_ids: [jq-site, jq-github]
  - heading: Research
    paragraphs:
      - text: >-
          With Bowen Peng and others, Quesnelle co-authored YaRN (2023), a method for extending the context
          window of large language models, and DeMo (2024), Decoupled Momentum Optimization, which appeared at
          ICLR 2026 with Diederik P. Kingma among its authors.
        source_ids: [yarn-paper, demo-paper, jq-site]
      - text: >-
          Quesnelle is a co-author of the Hermes 4 Technical Report (2025), whose first author is Ryan Teknium, which
          describes Nous Research's Hermes 4 family of hybrid reasoning models. The model cards for Hermes 4
          70B and Hermes 4.3 36B cite that report.
        source_ids: [hermes4-paper, hermes-4-70b-card, hermes-4-3-card]
