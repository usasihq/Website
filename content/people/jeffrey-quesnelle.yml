headline: Co-founder and CTO of Nous Research; co-author of the Hermes 4 technical report, YaRN and DeMo
bio:
  text: >-
    Jeffrey Quesnelle is a co-founder and the CTO of Nous Research, the open-source AI lab behind the
    Hermes models. Quesnelle co-authored the Hermes 4 Technical Report (2025), YaRN, a method for
    extending the context window of large language models (ICLR 2024), and DeMo, a decoupled momentum
    optimizer for training (ICLR 2026).
  source_ids: [jq-site, jq-github, hermes4-paper, yarn-paper, demo-paper]
  reviewed_at: 2026-10-22
