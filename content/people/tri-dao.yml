work:
  - name: Mamba and Mamba-2
    artifact_slug: null
    url: https://github.com/state-spaces/mamba
    contribution: >-
      Co-author with Albert Gu of the Mamba (2023) and Mamba-2 (2024) papers, and listed in the
      repository's AUTHORS file. The Apache-2.0 repository publishes pretrained Mamba and Mamba-2
      checkpoints from 130M to 2.8B parameters on Hugging Face, with model cards under the Apache
      2.0 license, and includes a script that downloads a checkpoint from the Hub and generates
      text.
    source_ids: [mamba-paper, mamba2-paper, mamba-readme, mamba-authors, hf-state-spaces, mamba-2-8b-card]
  - name: FlashAttention
    artifact_slug: null
    url: https://github.com/Dao-AILab/flash-attention
    contribution: >-
      First author of the FlashAttention paper (2022) and sole author of FlashAttention-2 (2023).
      The BSD-3-Clause repository, whose AUTHORS file lists Dao, provides the official
      implementation; its README lists support for Ampere, Ada, and Hopper GPUs including the RTX
      3090 and RTX 4090, and a ROCm version for AMD GPUs.
    source_ids: [fa-paper, fa2-paper, fa-readme, fa-authors, fa-license]
