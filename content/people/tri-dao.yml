slug: tri-dao
name: Tri Dao
initials: TD
headline: First author of FlashAttention and co-author of Mamba; Princeton professor and Together AI co-founder
bio:
  text: >-
    Tri Dao is an Assistant Professor of Computer Science at Princeton University, where Dao leads
    the Dao AI Lab, and a co-founder and the Chief Scientist of Together AI; Dao's site describes
    research on efficient training and inference through hardware-aware algorithms. Dao is first
    author of the FlashAttention paper and sole author of FlashAttention-2, whose official
    implementation lists support for consumer GPUs such as the RTX 3090 and RTX 4090. With Albert
    Gu, Dao co-authored the Mamba and Mamba-2 papers, and the Mamba repository publishes pretrained
    checkpoints from 130M to 2.8B parameters on Hugging Face under the Apache 2.0 license.
  source_ids: [dao-site, fa-paper, fa2-paper, fa-readme, mamba-paper, mamba2-paper, mamba-readme, mamba-2-8b-card]
  reviewed_at: 2026-10-02
