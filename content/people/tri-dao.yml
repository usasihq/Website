sections:
  - heading: Career
    paragraphs:
      - text: >-
          Dao completed a PhD in computer science at Stanford University from 2016 to 2023, advised by
          Christopher Ré and Stefano Ermon, with a dissertation on hardware-aware algorithms for efficient
          machine learning.
        source_ids: [dao-cv]
      - text: >-
          Dao co-founded Together AI in July 2023 and serves as its Chief Scientist, and joined Princeton
          University as an assistant professor of computer science in September 2024, where Dao leads the Dao AI
          Lab. Dao's research covers machine learning and systems, focused on hardware-aware algorithms and
          sequence models with long-range memory.
        source_ids: [dao-cv, dao-site]
  - heading: Research
    paragraphs:
      - text: >-
          Dao's FlashAttention (2022) computes exact attention with an IO-aware algorithm that reduces reads and
          writes to GPU memory, and FlashAttention-2 (2023) improved its parallelism and work partitioning.
          FlashAttention-3 (2024) targeted asynchrony and low precision on newer GPUs, and FlashAttention-4
          appeared at MLSys 2026. Dao's CV notes that FlashAttention has been integrated into frameworks including
          PyTorch, JAX, Hugging Face Transformers, vLLM and SGLang.
        source_ids: [fa-paper, fa2-paper, fa3-paper, dao-cv, fa-readme]
      - text: >-
          With Albert Gu, Dao co-authored Mamba (2023), a selective state space model for sequence modelling,
          and Mamba-2 (2024), which connects state space models and attention through structured state space
          duality; later work includes Mamba-3. Earlier, Dao was first author of Monarch (2022), on expressive
          structured matrices for efficient training.
        source_ids: [mamba-paper, mamba2-paper, mamba-readme, dao-cv, monarch-paper]
