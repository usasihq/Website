      test it.
    source_ids: [othello-paper, li-site]
  - name: "Inference-Time Intervention: Eliciting Truthful Answers from a Language Model"
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2306.03341
    contribution: >-
      Co-first author of the NeurIPS 2023 paper introducing Inference-Time Intervention (ITI), which
      shifts model activations during inference along directions in a limited number of attention
      heads; the paper reports improved truthfulness for LLaMA models on TruthfulQA.
    source_ids: [iti-paper, li-site]
