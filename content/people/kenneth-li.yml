headline: Thinking Machines Lab researcher; lead author of Othello world-model and Inference-Time Intervention papers
bio:
  text: >-
    Kenneth Li is a researcher at Thinking Machines Lab. Li completed a PhD at Harvard advised by
    Martin Wattenberg, Fernanda Viégas, and Hanspeter Pfister. Li's research looks inside language
    models: as first author, Li showed that a GPT-style model trained only on Othello move sequences
    forms an internal representation of the board, and introduced Inference-Time Intervention, which
    shifts activations along directions in a few attention heads to make answers more truthful. Li's
    later work covers instruction stability in long dialogs and lightweight probes for reward
    maximization.
  source_ids: [li-site, othello-paper, iti-paper]
  reviewed_at: 2026-10-13
