sections:
  - heading: Research
    paragraphs:
      - text: >-
          Kenneth Li describes the research goal as mechanistic control: understanding the inner workings
          of large language models and using that understanding to guide their behavior, so that humans
          stay in control in human-AI collaboration. Li's PhD at Harvard was advised by Martin Wattenberg,
          Fernanda Viégas and Hanspeter Pfister and supported by a Kempner Institute Graduate Fellowship.
        source_ids: [li-site]
      - text: >-
          Li's Othello study, presented as an oral at ICLR 2023, found an interpretable and controllable
          model of the game board inside a transformer trained on Othello transcripts. Inference-Time
          Intervention, a NeurIPS 2023 spotlight, adjusts activations during inference to draw out more
          truthful answers.
        source_ids: [othello-paper, iti-paper, li-site]
      - text: >-
          Later first-author work includes Q-Probe (ICML 2024), which uses a language model's own
          discriminative ability through rejection sampling to improve generation, and "When Bad Data
          Leads to Good Models" (ICML 2025), on how a small amount of toxic pretraining data can make models
          easier to align. With Vignav Ramesh, Li co-authored work at ICML 2025 showing language model
          agents communicating through activations rather than natural language.
        source_ids: [qprobe-paper, bad-data-paper, activations-paper, li-site]
