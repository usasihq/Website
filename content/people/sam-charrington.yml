headline: Host of the TWIML AI Podcast, which features conversations on machine learning and AI
bio:
  text: >-
    Sam Charrington hosts the TWIML AI Podcast, which grew out of This Week in Machine Learning & AI,
    a podcast Sam launched in 2016. The podcast features conversations with machine learning and AI
    researchers, practitioners, and builders about research, tools, and real-world deployment.
    TWIML's About page describes Sam as an industry analyst whose research focuses on business and
    consumer applications of machine learning and AI, and says Sam also writes a weekly newsletter
    on machine learning and AI.
  source_ids: [twiml-about, podcast]
  reviewed_at: 2026-10-21
