sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Charrington launched This Week in Machine Learning & AI in mid-2016, the podcast that became the TWIML AI
          Podcast. TWIML's About page says the organization has since added online meetups, study groups,
          conferences and education programs, and Charrington also writes a weekly newsletter on machine learning
          and AI.
        source_ids: [twiml-about]
      - text: >-
          TWIML says its programs share the voices of machine learning and AI researchers, practitioners and
          innovators. Recent episodes listed
          on the show page cover AI agents in enterprise settings, inference system engineering, world models and
          spatial AI, image generation, voice agents, retrieval-augmented generation for tax law and AI security.
          The show also runs series such as AI Trends 2023, with episodes reviewing natural language processing and
          reinforcement learning research.
        source_ids: [twiml-about, podcast]
  - heading: Analysis
    paragraphs:
      - text: >-
          TWIML describes Charrington as an industry analyst whose research covers business and consumer
          applications of machine learning and AI, bringing AI-powered products to market, and the technology
          platforms that support AI. TWIML also advises organizations on strategies for applying these
          technologies.
        source_ids: [twiml-about]
