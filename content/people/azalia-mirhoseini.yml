sections:
  - heading: Research
    paragraphs:
      - text: >-
          Mirhoseini describes a research interest in self-improving AI, including AI that helps design models,
          software and hardware. Early work introduced the sparsely-gated Mixture-of-Experts layer for language
          models in 2017, alongside deep reinforcement learning methods for placing model computations across
          devices. Mirhoseini co-founded and led AlphaChip, a deep reinforcement learning approach to chip
          layout published in Nature in 2021, whose layouts have been used for Google TPUs and data center CPUs.
        source_ids: [mirhoseini-site, moe-paper, chip-paper]
      - text: >-
          During time at Anthropic, Mirhoseini contributed to Constitutional AI, a 2022 training approach in
          which a model critiques and revises its own outputs against a set of principles. Later work on test-time
          scaling includes Large Language Monkeys, which studied how coverage grows as more samples are drawn at
          inference time, and the Scaling Intelligence lab's projects include KernelBench, SWiRL, Intelligence Per
          Watt and the open-source OpenJarvis framework for on-device agents.
        source_ids: [mirhoseini-site, monkeys-paper]
  - heading: Teaching
    paragraphs:
      - text: >-
          At Stanford, Mirhoseini has taught CS229S, Systems for Machine Learning, in fall 2023 and fall 2024, and
          CS329A, Self-Improving AI Agents, in winter 2024 and fall 2025. The Stanford profile lists CS 329A again
          for spring of the 2026–27 academic year.
        source_ids: [mirhoseini-site, stanford-profile]
