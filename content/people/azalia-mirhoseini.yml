headline: Stanford assistant professor directing Scaling Intelligence; co-founder of Ricursive Intelligence
bio:
  text: >-
    Azalia Mirhoseini is an Assistant Professor of Computer Science at Stanford University, where
    Mirhoseini directs Scaling Intelligence, a lab working on scalable and self-improving AI
    systems, and is a co-founder of Ricursive Intelligence, a lab using AI to design chips.
    Mirhoseini previously spent several years at Google Brain, Anthropic and Google DeepMind,
    working on projects including Gemini and Claude. Mirhoseini's published work includes the
    sparsely-gated Mixture-of-Experts layer, deep reinforcement learning for chip placement
    (the AlphaChip line of work), and research on scaling inference compute through repeated sampling.
  source_ids: [stanford-profile, mirhoseini-site, moe-paper, chip-paper, monkeys-paper]
  reviewed_at: 2026-10-19
