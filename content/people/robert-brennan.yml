headline: CEO of OpenHands (All Hands AI), the open-source platform for coding agents
bio:
  text: >-
    Robert Brennan is the CEO of OpenHands, the company also known as All Hands AI, which builds an
    open-source platform for coding agents. Brennan is a software engineer who specializes in
    developer tools, machine learning and natural language processing, and is a co-author of the
    OpenHands paper and of the OpenHands Software Agent SDK paper. Earlier, Brennan worked on Google
    Search and helped create Fairwinds Insights, a Kubernetes auditing platform.
  source_ids: [oh-about, rb-site, oh-paper, oh-sdk-paper]
  reviewed_at: 2026-10-22
