sections:
  - heading: Career
    paragraphs:
      - text: >-
          While at Google, Brennan wrote an algorithm for extracting answers to open-ended questions that
          was incorporated into Google Search in August 2013. Brennan later worked at Fairwinds, where
          Brennan helped conceive Fairwinds Insights, a platform for operationalizing Kubernetes auditing
          tools, and built the team that implemented it.
        source_ids: [rb-site]
      - text: >-
          Brennan is now the CEO of OpenHands, listed on the company's team page alongside Chief Scientist
          Graham Neubig and Chief AI Officer Xingyao Wang. Brennan has also written technical articles on
          running and costing Kubernetes workloads.
        source_ids: [oh-about, rb-site]
  - heading: OpenHands
    paragraphs:
      - text: >-
          OpenHands is an open-source platform for AI software development agents. Brennan is a co-author
          of the 2024 paper introducing it and of the 2025 paper describing the OpenHands Software Agent
          SDK, a composable foundation for production agents.
        source_ids: [oh-paper, oh-sdk-paper, rb-site]
