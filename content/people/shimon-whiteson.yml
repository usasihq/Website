headline: Oxford professor of computer science and Research Director at Google DeepMind; works on multi-agent RL
bio:
  text: >-
    Shimon Whiteson is a Professor of Computer Science at the University of Oxford and a Research
    Director at Google DeepMind, with research on deep reinforcement learning and imitation learning
    applied to robotics and video games. Before Oxford, Whiteson was an Assistant and then Associate
    Professor at the University of Amsterdam, and Whiteson's spin-out company Latent Logic was acquired
    by Waymo in 2019. Whiteson is the last-listed author of the multi-agent reinforcement learning papers
    QMIX (2018) and Counterfactual Multi-Agent Policy Gradients (COMA, 2017).
  source_ids: [lab-page, qmix-paper, coma-paper]
  reviewed_at: 2026-10-21
