sections:
  - heading: Career
    paragraphs:
      - text: >-
          Shimon Whiteson completed a doctorate at the University of Texas at Austin in 2007 and spent
          eight years as an assistant and then associate professor at the University of Amsterdam.
          Whiteson joined the University of Oxford as an associate professor in 2015 and is now a
          Professor of Computer Science there, where Whiteson heads the Whiteson Research Lab.
        source_ids: [lab-page]
      - text: >-
          Whiteson's spin-out company, Latent Logic, was acquired by Waymo in 2019. Whiteson
          is also a Research Director at Google DeepMind.
        source_ids: [lab-page]
  - heading: Research
    paragraphs:
      - text: >-
          Whiteson's research centres on deep reinforcement learning and imitation learning, with
          applications in robotics and video games. Several of Whiteson's papers address cooperative
          multi-agent learning: Whiteson is last-listed author of a 2016 paper in which agents learn
          communication protocols with deep reinforcement learning, of the COMA counterfactual policy
          gradient method (2017), and of the QMIX value-factorisation method (2018).
        source_ids: [lab-page, comm-paper, coma-paper, qmix-paper]
      - text: >-
          Whiteson is also last-listed author of the StarCraft Multi-Agent Challenge (2019), a benchmark
          for cooperative multi-agent reinforcement learning built on StarCraft II micromanagement
          scenarios.
        source_ids: [smac-paper]
