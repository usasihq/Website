sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Sara Dietschy's self-titled YouTube channel, whose feed dates it to September 2011, carries
          docu-series, tech reviews and lifestyle vlogs about the meeting point of technology and
          creativity. Recent uploads in 2026 include a MacBook buying guide, first looks at Sony
          cameras, a review of the Google Pixel 11 Pro centred on Gemini features, and a video on
          Apple's approach to AI.
        source_ids: [site, channel-feed]
      - text: >-
          Dietschy's website lists other projects, including That Creative Life Podcast, CreativeSpacesTV
          and HUSTLENY. The site also offers a studio setup guide covering camera gear, studio backgrounds and editing workflows.
        source_ids: [projects-page, studio-setup]
