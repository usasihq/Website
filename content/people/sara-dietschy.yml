bio:
  text: >-
    Sara Dietschy is a YouTube creator exploring tech, creativity, and the art of living. On a
    self-titled channel, Sara Dietschy publishes tech reviews, docu-series, and lifestyle vlogs about
    where technology and creative work meet. Sara Dietschy's website also documents a studio setup
    and brand work.
