headline: Senior research scientist at Ai2 leading the open multimodal team; co-first author of Molmo and Molmo2
bio:
  text: >-
    Christopher Clark is a senior research scientist at the Allen Institute for AI (Ai2), where Clark leads
    the open-ecosystem multimodal team working on vision-language models with a focus on openness, training
    efficiency and visual grounding. Clark is co-first author of the Molmo and PixMo paper and first-listed
    co-first author of the Molmo2 paper, and earlier worked on the Unified-IO line of any-to-any models.
  source_ids: [clark-site, molmo-paper, molmo2-paper, ai2-team]
  reviewed_at: 2026-10-22
