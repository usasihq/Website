sections:
  - heading: Career
    paragraphs:
      - text: >-
          Clark received a PhD from the University of Washington, advised by Luke Zettlemoyer, and is a
          senior research scientist at Ai2. Clark leads Ai2's open-ecosystem multimodal team and has also
          worked on data generation, generalization, language-model pre-training, game-playing and
          evaluation.
        source_ids: [clark-site, ai2-team]
  - heading: Research
    paragraphs:
      - text: >-
          Clark's earlier multimodal work centred on unified models: Unified-IO (2022) handled vision,
          language and multimodal tasks in one model, and Unified-IO 2 (2023) extended this to audio and
          action. Both papers list Clark as a co-first author.
        source_ids: [unifiedio-paper, unifiedio2-paper, clark-site]
      - text: >-
          Clark's recent work is on the Molmo line of fully open vision-language models, which share weights,
          code and training data. The Molmo and PixMo paper (2024) received a CVPR 2025 Best Paper Honorable
          Mention, and the Molmo2 paper (2026), adding video understanding and grounding, was a CVPR 2026
          best paper award candidate. Clark is also first author of MolmoPoint, on pointing with grounding
          tokens, at ECCV 2026.
        source_ids: [clark-site, molmo-paper, molmo2-paper]
