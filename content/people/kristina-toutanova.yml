sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kristina Toutanova completed a PhD in Computer Science at Stanford University with
          Christopher Manning, finishing in 2005, and then worked as a researcher at Microsoft
          Research. Toutanova joined Google in 2017 as a research scientist in Google AI
          Language and is an affiliate faculty member at the University of Washington, where the
          Department of Linguistics lists Toutanova as an Affiliate Assistant Professor.
        source_ids: [google-profile, uw-linguistics]
      - text: >-
          Toutanova is a past co-editor in chief of the journal Transactions of the Association for
          Computational Linguistics (TACL) and was a program co-chair of ACL 2014.
        source_ids: [google-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Toutanova's research models the structure of natural language with machine learning, most
          recently in representation learning, question answering, information retrieval, semantic
          parsing and knowledge base completion. Toutanova co-authored BERT (2018) with Jacob Devlin,
          Ming-Wei Chang and Kenton Lee, and the 2019 paper on latent retrieval for weakly supervised
          open-domain question answering.
        source_ids: [google-profile, bert-paper, orqa-paper]
      - text: >-
          Later work includes a 2020 study of compositional generalization in semantic parsing,
          Pix2Struct (2022), which pretrains visual language models by parsing screenshots, and QUEST
          (2023), a retrieval dataset of queries with implicit set operations. A 2025 paper with Peter
          Shaw, James Cohan and Jacob Eisenstein studies description-length objectives for transformers
          grounded in Kolmogorov complexity.
        source_ids: [compgen-paper, pix2struct-paper, quest-paper, mdl-paper]
