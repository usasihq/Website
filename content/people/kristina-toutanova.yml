headline: Research scientist at Google DeepMind and University of Washington affiliate faculty; co-author of BERT
bio:
  text: >-
    Kristina Toutanova is a research scientist at Google, listed with Google DeepMind on an ICLR 2026
    paper, and an affiliate faculty member at the University of Washington, where the Department of
    Linguistics lists Toutanova as an Affiliate Assistant Professor. Before joining Google in 2017, Toutanova was a researcher at Microsoft
    Research. Google Research's profile describes work on modeling the structure of natural language
    with machine learning, most recently in representation learning, question answering, information
    retrieval, semantic parsing, and knowledge base completion, and notes that Toutanova is a past
    co-editor in chief of TACL. Toutanova is a co-author of BERT: Pre-training of Deep Bidirectional
    Transformers for Language Understanding, whose code and pretrained models are released under the
    Apache 2.0 license in the google-research/bert repository.
