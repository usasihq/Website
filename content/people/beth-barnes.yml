headline: Founder and CEO of METR, a research nonprofit that evaluates the autonomous capabilities of frontier AI models
bio:
  text: >-
    Beth Barnes is the founder and CEO of METR (Model Evaluation and Threat Research), where Barnes oversees a
    technical team that designs and runs evaluations of generative AI models. Before METR, Barnes worked with
    DeepMind's Chief Scientist on scaling laws for forecasting deep learning progress, and at OpenAI on safety
    targets, scalable oversight techniques and pre-release evaluations of code models for misalignment.
  source_ids: [metr-bio, metr-about]
  reviewed_at: 2026-10-22
