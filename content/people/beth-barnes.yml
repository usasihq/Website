sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before founding METR, Barnes worked with DeepMind's Chief Scientist on scaling laws for forecasting
          progress in deep learning. At OpenAI, Barnes helped develop safety targets and evaluated scalable
          oversight techniques for alignment, as well as code models for misalignment before release.
        source_ids: [metr-bio]
      - text: >-
          As founder and CEO of METR, Barnes leads an organization that evaluates frontier AI models to inform
          the public about their risks and capabilities, with a focus on whether AI systems can autonomously
          carry out substantial tasks.
        source_ids: [metr-bio, metr-about]
  - heading: Research and evaluations
    paragraphs:
      - text: >-
          Barnes, listed on papers as Elizabeth Barnes, is a co-author of RE-Bench (2024), on evaluating
          language model agents' AI R&D capabilities against human experts, and a co-author of METR's 2025
          study measuring AI ability to complete long software tasks. Barnes also co-authored METR's
          randomized controlled trial on how early-2025 AI tools affected experienced open-source developers'
          productivity.
        source_ids: [rebench-paper, longtasks-paper, devprod-paper, metr-bio]
      - text: >-
          Barnes's recent METR publications include external reviews of sections of Anthropic's risk reports
          in 2026 and work on a per-action monitor for safer evaluations.
        source_ids: [metr-bio]
