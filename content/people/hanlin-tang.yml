sections:
  - heading: Career
    paragraphs:
      - text: >-
          Tang was a co-founder and the CTO of MosaicML, a generative AI startup that joined Databricks. At
          Databricks, Tang holds the title CTO of Neural Networks and is responsible for the company's AI
          products. Databricks' speaker biography notes that Tang has published in venues including NeurIPS,
          ICLR, ICML, Neuron and PNAS.
        source_ids: [dais-tang]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Tang was one of the bylined authors of the March 2024 post introducing DBRX, an open mixture-of-experts
          language model trained by Databricks. Tang's later Databricks posts include the March 2026 public
          preview of AI Runtime, a serverless training stack for distributed GPU training on the Databricks
          platform, and its general availability in October 2026.
        source_ids: [dbrx-post, ai-runtime-post, ai-runtime-ga-post, databricks-author]
      - text: >-
          Tang has also written about agent tools at Databricks. A June 2026 post co-written by Tang described
          updates to Agent Bricks, the company's product for building agents over enterprise data, presented at
          the 2026 Data + AI Summit, and a March 2026 post by Tang, Xing Chen and Matei Zaharia announced that
          Databricks was acquiring Quotient AI to add agent evaluation and reinforcement learning to products
          such as Genie and Agent Bricks.
        source_ids: [agent-bricks-post, quotient-post, dais-tang]
