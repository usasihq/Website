headline: CTO of Neural Networks at Databricks; co-founder and former CTO of MosaicML
bio:
  text: >-
    Hanlin Tang is the CTO of Neural Networks at Databricks, where Tang is responsible for the
    company's AI products, according to Databricks' Data + AI Summit 2026 speaker page. Tang was
    previously the co-founder and CTO of MosaicML, a generative AI startup that joined Databricks. Tang
    is one of six bylined authors of Databricks' March 2024 post announcing DBRX, a mixture-of-experts
    language model, and the 2026 summit program lists Tang in a founder conversation on open
    infrastructure for AI agents.
