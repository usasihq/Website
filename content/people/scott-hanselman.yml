sections:
  - heading: Work at Microsoft and GitHub
    paragraphs:
      - text: >-
          Hanselman is a VP and Member of Technical Staff at Microsoft and GitHub, working on developer
          productivity with .NET, Azure, GitHub and AI-powered developer tools and on making technical
          education more practical. Hanselman speaks to developers on topics such as AI developer tools,
          large-scale system architecture, cloud computing and .NET.
        source_ids: [about]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Hanselman began the weekly Hanselminutes podcast in January 2006 and has hosted it since; an October
          2026 episode, produced with ACM ByteCast, featured 2025 ACM A.M. Turing Award recipients Charles
          Bennett and Gilles Brassard. Hanselman also co-hosts Scott and Mark Learn To with Azure CTO Mark
          Russinovich, and presents Azure Friday on Microsoft Learn, where hosts talk with the engineers who
          build Azure.
        source_ids: [hanselminutes, hanselminutes-1, hanselminutes-1056, about, azure-friday]
      - text: >-
          Hanselman has written a blog for more than two decades and helped write books on ASP.NET 4.5 and
          ASP.NET MVC 4. Earlier, now-archived shows include This Developer's Life, long-form audio essays
          about developers made with Rob Conery.
        source_ids: [about, books-page]
