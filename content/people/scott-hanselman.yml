headline: Programmer, teacher, and podcaster; host of Hanselminutes and VP at Microsoft and GitHub
bio:
  text: >-
    Scott Hanselman is a programmer, teacher, speaker, and podcaster who writes and makes shows about
    developers, .NET, open source, AI developer experiences, Azure, and GitHub. Scott hosts
    Hanselminutes, a weekly talk show on technology, and co-hosts Scott and Mark Learn To, a video
    podcast with Azure CTO Mark Russinovich. Scott also makes Azure Friday, a video podcast about
    the cloud. Scott
    has written a blog for more than two decades and works as a VP and Member of Technical Staff at Microsoft and
    GitHub.
  source_ids: [about, hanselminutes]
  reviewed_at: 2026-10-21
