headline: Co-founder and CEO of Harvey, which builds AI tools and agents for law firms and legal teams
bio:
  text: >-
    Winston Weinberg is a co-founder and the CEO of Harvey, a company founded in 2022 that builds AI
    software and agents for law firms and in-house legal teams. Before Harvey, Weinberg was an
    associate at O'Melveny & Myers LLP, specializing in securities and antitrust litigation.
