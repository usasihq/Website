sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Harvey, Weinberg worked as an associate at O'Melveny & Myers, specializing in
          securities and antitrust litigation. Weinberg
          co-founded Harvey in 2022 and leads it as CEO.
        source_ids: [hv-author]
  - heading: Writing
    paragraphs:
      - text: >-
          Weinberg writes regularly on Harvey's blog, often with Gabe Pereyra. An August 2025 post marked the company's
          third anniversary, and a March 2026 post explained that Harvey first focused on law
          firms and is now extending to collaboration between firms and their corporate clients and
          to in-house legal teams.
        source_ids: [hv-anniversary, hv-collaborate, hv-author]
      - text: >-
          In May 2026 Weinberg co-wrote a post about Harvey Moot, describing the company's stated goal of
          increasing access to justice and its partnerships with law school faculty and students.
        source_ids: [hv-supreme]
