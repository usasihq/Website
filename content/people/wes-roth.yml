headline: Creator of the Wes Roth YouTube channel, which covers AI news and its implications
bio:
  text: >-
    Wes Roth makes the Wes Roth YouTube channel, which covers artificial intelligence news,
    machine learning, large language models, and the work of AI labs such as Google DeepMind,
    OpenAI, and Anthropic. The channel's About page says its goal is to help viewers understand
    AI and its implications and to prepare for what comes next.
