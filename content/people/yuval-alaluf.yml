headline: Research Scientist at Runway; first author of ReStyle and co-author of Attend-and-Excite
bio:
  text: >-
    Yuval Alaluf is a Research Scientist at Runway, working on video synthesis and creative applications
    including projects such as Runway Aleph, an in-context video model for editing, transforming, and
    generating video. Alaluf was previously a Research Scientist at Pika focusing on video synthesis and
    an intern at Snap Research. Alaluf's PhD research at Tel Aviv University, advised by Daniel Cohen-Or,
    explored how large-scale generative models can be controlled, edited, and personalized. Alaluf is
    first author of ReStyle, a StyleGAN encoder, and co-author of Attend-and-Excite, a guidance method
    for text-to-image diffusion models; both official repositories are MIT-licensed.
