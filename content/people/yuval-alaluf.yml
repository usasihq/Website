sections:
  - heading: Career
    paragraphs:
      - text: >-
          Alaluf earned a PhD in computer science at Tel Aviv University, advised by Daniel Cohen-Or, with
          research on how large generative models can be controlled, edited and personalized. Earlier, Alaluf
          led applied research projects in few-shot learning, object detection, representation learning and
          uncertainty estimation.
        source_ids: [alaluf-site]
      - text: >-
          Alaluf interned at Snap Research, exploring personalization in generative models, and was a research
          scientist at Pika working on video synthesis. At Runway, Alaluf works on video synthesis and creative
          applications, including Runway Aleph, Aleph 2.0 and Solaris.
        source_ids: [alaluf-site, runway-aleph]
  - heading: Research
    paragraphs:
      - text: >-
          Alaluf's early papers concerned StyleGAN. With Or Patashnik and Daniel Cohen-Or, Alaluf worked on
          encoders that map real images into StyleGAN's latent space for editing, including e4e (2021), ReStyle
          (2021), which refines an inversion iteratively, and HyperStyle (2021), which uses hypernetworks to
          adjust the generator for each image.
        source_ids: [e4e-paper, restyle-paper, hyperstyle-paper, alaluf-research]
      - text: >-
          Alaluf then turned to text-to-image diffusion models. Alaluf co-authored Textual Inversion (2022),
          which personalizes a model by learning a new word embedding from a few images, and Attend-and-Excite
          (2023), which guides cross-attention so that every subject in a prompt appears. Later work includes
          MyVLM (2024) for personalizing vision-language models and Solaris (2026), a model that generates an
          interactive interface frame by frame in response to user actions.
        source_ids: [textual-inversion-paper, ae-paper, myvlm-paper, solaris-paper]
