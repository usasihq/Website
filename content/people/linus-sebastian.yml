headline: Co-host of The WAN Show, Linus Media Group's weekly tech news and analysis podcast
bio:
  text: >-
    Linus Sebastian co-hosts The WAN Show with Luke Lafreniere, a weekly analysis and news podcast
    from Linus Media Group that is livestreamed and covers the week's technology topics alongside
    news about the company. Linus Media Group also produces the Linus Tech Tips channel, which mixes
    consumer-technology product reviews and engineering projects, plus the Techquickie,
    TechLinked and ShortCircuit channels.
  source_ids: [wan-channel, lmg-site, ltt-channel]
