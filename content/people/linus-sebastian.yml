sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Linus Sebastian is part of Linus Media Group, whose Linus Tech Tips YouTube channel joined YouTube
          in November 2008. The channel describes itself as a team of consumer-technology and video-production
          experts who aim to educate and entertain, and Linus Media Group presents it as a mix of product reviews
          and engineering projects.
        source_ids: [ltt-channel, lmg-site]
      - text: >-
          Sebastian co-hosts The WAN Show with Luke Lafreniere, a weekly analysis and news podcast that is
          livestreamed and covers the week's main technology topics, company news from Linus Media Group and
          questions from the live chat. In June 2026 the show gained its own YouTube channel.
        source_ids: [wan-channel, lmg-site]
  - heading: Linus Media Group
    paragraphs:
      - text: >-
          Besides Linus Tech Tips and The WAN Show, Linus Media Group runs ShortCircuit, which posts unboxings and
          first impressions, and TechLinked, a news digest released three times a week with a rotating cast of
          hosts. The company's site also links to LTT Labs, the LTT Store and Floatplane.
        source_ids: [lmg-site]
