sections:
- heading: Open-source work
  paragraphs:
  - text: >-
      Gerganov made the initial-release commits of three related repositories now hosted under the
      ggml-org organization on GitHub. The first was ggml, a tensor library for machine learning, in
      September 2022; ggml's site describes it as a low-level, cross-platform library with integer
      quantization, broad hardware support, no third-party dependencies and no memory allocations
      during runtime. A week later Gerganov released whisper.cpp, a C/C++ port of OpenAI's Whisper
      speech recognition model.
    source_ids:
    - ggml-initial-commit
    - whisper-initial-commit
    - ggml-site
    - whisper-readme
  - text: >-
      Gerganov's initial release of llama.cpp on 2023-03-10 contained ggml, a model conversion script,
      a quantization tool and a main program for running the model. The project's README describes
      its goal as running language and vision-language model inference with minimal setup across a
      wide range of hardware, locally and in the cloud, in plain C/C++ built on the ggml library. All
      three projects are MIT-licensed.
    source_ids:
    - llama-cpp-initial-commit
    - llama-cpp-readme
    - ggml-site
  - text: >-
      Gerganov remains an active maintainer of llama.cpp. The repository's CODEOWNERS file lists
      Gerganov as an owner for many core areas, and Gerganov authored commits to the project in
      October 2026.
    source_ids:
    - llama-cpp-codeowners
    - llama-cpp-commits
- heading: ggml.ai and Hugging Face
  paragraphs:
  - text: >-
      Gerganov founded ggml.ai in 2023 to support the development of ggml, and the company states that
      the library and related projects are freely available under the MIT license with an open
      development process. ggml.ai was acquired by Hugging Face in 2026.
    source_ids:
    - ggml-site
  - text: >-
      Hugging Face announced on 2026-02-20 that GGML, the creators of llama.cpp, were joining the
      company, and that Gerganov and team would join it. The announcement says the team keeps full
      autonomy and leadership over the project's technical direction and community, and that planned work includes
      making it easier to bring new models from the transformers library to llama.cpp. Gerganov's
      GitHub profile lists Hugging Face as the current company.
    source_ids:
    - hf-announcement
    - github-profile
