headline: Develops llama.cpp and the ggml tensor library for running models on local hardware
bio:
  text: Georgi Gerganov develops ggml, a tensor library for machine learning on commodity hardware, and
    llama.cpp, a C/C++ runtime for running language models locally. Gerganov's site also lists whisper.cpp,
    which runs OpenAI's Whisper speech recognition model on the CPU. Gerganov founded ggml.ai in 2023
    to support ggml development, and Hugging Face acquired the company in 2026. Hugging Face's announcement
    says the ggml team still spends all of its time maintaining llama.cpp and keeps full leadership of
    the project's technical direction.
  source_ids:
  - personal-site
  - ggml-site
  - hf-announcement
  reviewed_at: 2026-10-21
