sections:
  - heading: Research
    paragraphs:
      - text: >-
          Tan's research covers language models, multimodality and generative AI for audio and video. In language
          pretraining, Tan co-authored MASS in 2019, a masked sequence-to-sequence method for language generation,
          and MPNet in 2020, which combines masked and permuted pretraining for language understanding, both with
          Kaitao Song, Tao Qin and colleagues.
        source_ids: [tan-site, xt-mass, xt-mpnet]
      - text: >-
          Tan's speech work includes FastSpeech in 2019 and FastSpeech 2 in 2020 for fast, controllable
          text-to-speech, and the NaturalSpeech series, whose first paper Tan first-authored in 2022. Tan also
          co-authored HuggingGPT in 2023, an agent framework that uses a language model to plan tasks and call
          models from Hugging Face, and lists Muzic, a Microsoft project on music understanding and generation,
          among the systems Tan designed.
        source_ids: [fastspeech-paper, fastspeech2-paper, naturalspeech-paper, xt-hugginggpt, muzic-repo, tan-site]
  - heading: Career
    paragraphs:
      - text: >-
          At Microsoft Research Asia, Tan was a Principal Research Manager in the Machine Learning Group, and
          technologies from Tan's work were deployed in Microsoft products including Microsoft Translator, Azure
          text-to-speech and speech recognition, and Bing. As Research VP of Multimodality at Moonshot AI, Tan has
          worked on Kimi-Video, Kimi-TTS and Kimi-Audio, whose 2025 technical report lists Tan among its authors.
        source_ids: [tan-site, xt-kimiaudio]
