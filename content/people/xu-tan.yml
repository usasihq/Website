headline: Research VP of Multimodality at Moonshot AI; formerly Principal Research Manager at Microsoft Research Asia
bio:
  text: >-
    Xu Tan is Research VP of Multimodality at Moonshot AI (Kimi) and was previously a Principal
    Research Manager in the Machine Learning Group at Microsoft Research Asia, working on language
    models, multimodality, and generative AI for video and audio. Tan's homepage lists audio models
    such as FastSpeech 1 and 2, NaturalSpeech 1, 2, and 3, and Kimi-Audio, along with Muzic, an
    MIT-licensed Microsoft repository for music understanding and generation whose README lists Tan
    as a co-author of several of its papers. Tan is first author of the NaturalSpeech paper, which builds an end-to-end
    text-to-waveform system around a variational autoencoder, and a co-author of FastSpeech and
    FastSpeech 2.
  source_ids: [tan-site, github-profile, muzic-repo, naturalspeech-paper, fastspeech-paper, fastspeech2-paper]
