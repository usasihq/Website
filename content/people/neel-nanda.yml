headline: Runs the Google DeepMind mechanistic interpretability team; creator of the TransformerLens library
bio:
  text: >-
    Neel Nanda runs the Google DeepMind mechanistic interpretability team, which works on reverse
    engineering the algorithms and structures that trained neural networks have learned. Before that,
    Nanda did independent interpretability research and worked at Anthropic as a language model
    interpretability researcher, contributing as a core research contributor to Anthropic's 2021
    "A Mathematical Framework for Transformer Circuits". Nanda created TransformerLens, an MIT-licensed
    library for mechanistic interpretability of GPT-style language models, and is the last-listed author
    of Gemma Scope, an open suite of sparse autoencoders trained on Gemma 2 models.
  source_ids: [nanda-about, tc-framework, transformerlens-repo, gemma-scope-paper]
  reviewed_at: 2026-10-13
