sections:
  - heading: Career
    paragraphs:
      - text: >-
          Neel Nanda's About page says that after graduating in 2020, Nanda spent a year exploring AI
          safety through internships at the Future of Humanity Institute, DeepMind, and the Centre for
          Human-Compatible AI. Before the current role, Nanda worked at Anthropic as a language model
          interpretability researcher under Chris Olah and also did independent mechanistic
          interpretability research.
        source_ids: [nanda-about]
      - text: >-
          Nanda now runs the Google DeepMind mechanistic interpretability team, which tries to reverse
          engineer the algorithms and structures that trained neural networks have learned. Nanda also
          mentors researchers through a stream of the MATS program, a full-time research program held
          twice a year.
        source_ids: [nanda-about]
  - heading: Research
    paragraphs:
      - text: >-
          Nanda was a core research contributor to "A Mathematical Framework for
          Transformer Circuits" (2021) and the third-listed author of "In-context Learning and Induction
          Heads" (2022), which presents evidence that induction heads may account for much of in-context
          learning in large transformers.
        source_ids: [tc-framework, induction-heads-paper]
      - text: >-
          Nanda was first author of the January 2023 paper on progress measures for grokking, which
          reverse-engineers the algorithm small transformers learn for modular addition. Nanda is the
          last-listed author of "Refusal in Language Models Is Mediated by a Single Direction" (2024) and
          of Gemma Scope (2024), an open suite of sparse autoencoders trained on Gemma 2 models.
        source_ids: [grokking-paper, refusal-paper, gemma-scope-paper]
  - heading: Open-source work and teaching
    paragraphs:
      - text: >-
          Nanda created TransformerLens, an MIT-licensed library for mechanistic interpretability of
          GPT-2 style language models that is now maintained by Bryce Meyer and Jonah Larson. Nanda's other teaching
          materials include a searchable explainer and glossary of mechanistic interpretability terms and
          a YouTube channel of paper walkthroughs and live research walkthroughs.
        source_ids: [transformerlens-repo, nanda-about, github-profile]
