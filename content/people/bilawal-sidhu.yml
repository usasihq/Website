headline: Tech creator covering AI, AR/VR, and robotics; technology curator and host for TED
bio:
  text: >-
    Bilawal Sidhu is a tech creator who explains AI, AR/VR, robotics, and spatial computing on YouTube and in
    the Substack newsletter Map the World, and makes videos blending reality and imagination with VFX and AI. Bilawal is the
    technology curator and host for the TED conference, and was the inaugural host of The TED AI Show.
    Bilawal previously spent six years as a senior product manager at Google, working on AR, 3D Maps,
    Immersive View, and YouTube VR.
