sections:
  - heading: Career
    paragraphs:
      - text: >-
          Bilawal Sidhu describes a path from visual effects through software engineering and product design to
          product management, followed by full-time work as a creator. Sidhu spent six years as a senior product
          manager at Google, working on 3D Maps, Immersive View, ARCore and YouTube VR.
        source_ids: [youtube, site]
      - text: >-
          In May 2022 Sidhu, then a Senior Product Manager for Google Maps, co-wrote the Google Developers Blog
          post launching the ARCore Geospatial API, which gave AR developers access to the global localization
          technology behind Live View in Google Maps.
        source_ids: [arcore-geospatial]
  - heading: TED
    paragraphs:
      - text: >-
          Sidhu gave the TED2023 talk "The AI-powered tools supercharging your imagination", a tour of AI
          techniques such as 3D scans for reshaping captured scenes. Sidhu later became the inaugural host of The
          TED AI Show podcast, in which Sidhu talks with experts, artists and journalists about the future of AI,
          and now serves as technology curator and host for the TED conference.
        source_ids: [ted-talk, ted-ai-show, site]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Sidhu's YouTube channel publishes weekly deep dives on AI, AR/VR, robotics and technologies that blur
          physical and digital worlds, while a second channel and TikTok focus on blending reality and
          imagination with VFX and AI. The Substack newsletter Map the World describes itself as a guide to
          AI, AR/VR, robotics and the technologies blurring the physical and digital worlds.
        source_ids: [youtube, site, substack]
