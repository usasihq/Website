sections:
  - heading: Research
    paragraphs:
      - text: >-
          Two of Natalia Gimelshein's earlier papers addressed GPU efficiency. Gimelshein co-authored vDNN
          (2016), a runtime memory manager that lets deep neural networks train beyond a GPU's memory capacity by
          virtualizing memory across the GPU and CPU, and with Maxim Milakov wrote Online normalizer calculation for
          softmax (2018), which computes the standard softmax with fewer memory accesses.
        source_ids: [vdnn-paper, softmax-paper]
      - text: >-
          Gimelshein is a co-author of the 2019 PyTorch paper, listed there with NVIDIA, and of the ASPLOS 2024
          PyTorch 2 paper on TorchDynamo and TorchInductor, listed with OpenAI. Gimelshein also appears among the
          contributors to the October 2024 GPT-4o System Card.
        source_ids: [pytorch-paper-pdf, pt2-paper, gpt4o-card]
  - heading: Open-source work
    paragraphs:
      - text: >-
          PyTorch's governance page lists Gimelshein as one of the project's core maintainers and as a maintainer of
          its CUDA support, and as an emeritus maintainer of NestedTensor and of the profiling and monitoring tools.
          At PyTorch Conference Europe 2026, Gimelshein joined the "Meet the Developers" session for module
          maintainers.
        source_ids: [pytorch-maintainers, eu26-recap]
