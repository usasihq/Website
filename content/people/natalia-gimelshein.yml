headline: PyTorch core maintainer for CUDA; co-author of the PyTorch and PyTorch 2 papers
bio:
  text: >-
    Natalia Gimelshein is a PyTorch core maintainer and a maintainer of PyTorch's CUDA support,
    according to PyTorch's maintainers page, which also lists Gimelshein as an emeritus maintainer
    of NestedTensor and of the profiling and monitoring tools. Gimelshein co-authored the 2019
    PyTorch paper, listed there with NVIDIA, and the PyTorch 2 paper (ASPLOS 2024), listed with
    OpenAI. At PyTorch Conference Europe 2026, Gimelshein took part in the "Meet the Developers"
    session for PyTorch module maintainers.
  source_ids: [pytorch-maintainers, pytorch-paper-pdf, pt2-paper, eu26-recap]
  reviewed_at: 2026-10-13
