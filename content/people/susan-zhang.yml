sections:
  - heading: Career
    paragraphs:
      - text: >-
          Zhang's homepage describes a career building large systems for data and models. Before working on AI
          systems, Zhang scaled out data infrastructure and processing pipelines across cloud providers, then
          developed a large reinforcement learning system at OpenAI for OpenAI Five, the Dota 2 agent, and later
          built the LLM training infrastructure at Meta AI / FAIR that produced OPT-175B.
        source_ids: [zhang-site]
      - text: >-
          Zhang has given talks on both projects, including OpenAI Five at Harvard's CS50 and the Computer
          History Museum in 2022 and OPT-175B at NeurIPS 2022's "Has It Trained Yet?" workshop, the Stanford
          MLSys Seminar and CMU's LLM seminar in 2023.
        source_ids: [zhang-site]
  - heading: Research
    paragraphs:
      - text: >-
          At OpenAI, Zhang co-authored "Dota 2 with Large Scale Deep Reinforcement Learning" (2019) and "Neural
          Network Surgery with Sets" (2019), on transferring trained weights when a network's architecture
          changes during long training runs.
        source_ids: [dota-paper, surgery-paper]
      - text: >-
          Zhang is one of three equal-contribution first authors of OPT (2022), a suite of open decoder-only
          language models from 125M to 175B parameters released with a training logbook and the metaseq
          codebase. Later papers Zhang co-authored include scaling laws for generative mixed-modal language models, an
          effective theory of transformers at initialization, a theory of Adam instability in large-scale
          training, LIMA on alignment with few examples, and work on scaling autoregressive multimodal models.
        source_ids: [opt-paper, metaseq-license, mixed-modal-paper, effective-theory-paper, adam-paper, lima-paper, cm3leon-paper]
