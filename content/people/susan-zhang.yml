headline: Co-first author of Meta AI's OPT; built LLM training infrastructure at FAIR and RL systems for OpenAI Five
bio:
  text: >-
    Susan Zhang's homepage describes work building large-scale systems for data and models, including
    a reinforcement learning system at OpenAI for OpenAI Five and the LLM training infrastructure at
    Meta AI / FAIR that created OPT-175B. Zhang is one of three equal-contribution first authors of OPT:
    Open Pre-trained Transformer Language Models (2022), a suite of decoder-only models from 125M to
    175B parameters; the release included a logbook of the training run and the full training
    codebase, metaseq, which is published under the MIT License. Zhang is also a co-author of the
    OpenAI paper Dota 2 with Large Scale Deep Reinforcement Learning (2019).
  source_ids: [zhang-site, opt-paper, metaseq-license, dota-paper]
  reviewed_at: 2026-10-13
