sections:
  - heading: Role
    paragraphs:
      - text: >-
          Chen is a Technical Fellow and Corporate Vice President at Microsoft AI and leads a modeling team that
          trains large-scale models, including OpenAI and Microsoft AI models according to Chen's Microsoft
          Research page, with recent work on agentic and long-horizon reinforcement learning and synthetic data
          generation.
        source_ids: [msr-chen]
  - heading: Research
    paragraphs:
      - text: >-
          Chen is the senior author of DeBERTa (2020), a BERT variant with disentangled attention, and LoRA
          (2021), a method for adapting large language models with low-rank updates. Chen is also listed among
          the authors of the Phi-4-Mini technical report (2025).
        source_ids: [deberta-paper, lora-paper, phi4-mini-report]
      - text: >-
          With Liliang Ren as first author, Chen co-authored Samba (2024), a hybrid state-space language model,
          and the 2025 SambaY paper, whose decoder-hybrid-decoder architecture is used in
          Phi-4-mini-flash-reasoning.
        source_ids: [samba-paper, sambay-paper, phi4-flash-card]
