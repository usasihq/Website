headline: Technical Fellow and CVP at Microsoft AI; senior author of LoRA, DeBERTa and Samba
bio:
  text: >-
    Weizhu Chen is a Technical Fellow and Corporate Vice President at Microsoft AI, where Chen leads a
    modeling team working on large-scale model training with a recent focus on agentic and
    long-horizon reinforcement learning and synthetic data. Chen's Microsoft Research page lists the
    team's published work including LoRA, DeBERTa, Phi and Rho-1. Chen is senior author of DeBERTa
    (2020), LoRA (2021) and Samba (2024), and a co-author of the 2025 SambaY paper that describes the
    architecture of Phi-4-mini-flash-reasoning.
  source_ids: [msr-chen, deberta-paper, lora-paper, samba-paper, sambay-paper]
  reviewed_at: 2026-10-22
