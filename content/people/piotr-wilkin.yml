slug: piotr-wilkin
name: Piotr Wilkin
initials: PW
groups: [open-source, local]
sector: corporate
specialties: [inference, developer-tools]
headline: Maintains llama.cpp's parser code and contributes to Lemonade; systems architect at Syndatis
bio:
  text: >-
    Piotr Wilkin, who also uses the handle ilintar, describes Wilkin's work on GitHub as programmer
    and systems architect at Syndatis, maintainer of llama.cpp's parser code, contributor to
    Lemonade, and author of trellis.cpp. llama.cpp's CODEOWNERS file names Wilkin as owner of the
    parser tool and the chat tests, co-owner of the debug example, and a member of the shared-code
    (llama-common) team; Wilkin's commits there cover chat-template parsing and tool calls, support
    for new models, and CUDA and Vulkan kernels. In Lemonade, an AMD-sponsored local AI server,
    Wilkin's 2026 commits add asset- and audio-generation backends and a job engine, and fix its
    llama.cpp integration.
  source_ids: [github-profile, llama-cpp-codeowners, llama-cpp-commits, lemonade-commits, lemonade-readme]
  reviewed_at: 2026-10-21
affiliations:
  - name: Syndatis
    organization_slug: null
    role: Systems architect
    current: true
    source_ids: [github-profile]
  - name: llama.cpp project
    organization_slug: null
    role: Parser code maintainer; code owner for tools/parser and the chat tests
    current: true
    source_ids: [github-profile, llama-cpp-codeowners]
work:
  - name: llama.cpp
    artifact_slug: llama-cpp
    type: open-source
    url: https://github.com/ggml-org/llama.cpp
    contribution: >-
      CODEOWNERS names Wilkin for tools/parser and tests/test-chat, co-owner (with Daniel
      Bevenius) of examples/debug, and a member of the ggml-org/llama-common team. Commits authored
      from June to October 2026 split specialized chat parsers into common/parsers, fix DeepSeek and
      other chat templates and tool calls, add model support such as Kimi-K3, and tune CUDA, HIP and
      Vulkan kernels. The repository is MIT-licensed.
    source_ids: [llama-cpp-codeowners, llama-cpp-commits, llama-cpp-license]
  - name: Lemonade
    artifact_slug: lemonade
    type: open-source
    url: https://github.com/lemonade-sdk/lemonade
    contribution: >-
      Commits authored from July to September 2026 add asset generation (Trellis and OpenMOSS),
      audio generation backends (ThinkSound and ACE-Step) and a job engine, and fix how Lemonade
      finds and launches llama.cpp. The repository is Apache-2.0 licensed and states that the
      project is sponsored by AMD.
    source_ids: [lemonade-commits, lemonade-readme]
links:
  - label: GitHub
    url: https://github.com/pwilkin
sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Wilkin's contributions to llama.cpp began in May 2025 with a fix to the server's handling of
          OpenAI-compatible message arrays, and soon extended to adding model architectures such as Ernie 4.5 MoE
          (July 2025) and Apertus (October 2025). In December 2025 Wilkin was added to the project's CODEOWNERS
          for its chat files, and later work added Qwen3.5 dense and mixture-of-experts support (February 2026)
          and the Kimi-K3 text model (August 2026).
        source_ids: [pr-13540, pr-14658, pr-15852, pr-17789, pr-19435, pr-26185]
      - text: >-
          Much of Wilkin's later llama.cpp work concerns the shared parsing code that turns model output into
          reasoning text and tool calls. In September 2026 Wilkin split the specialised chat parsers into their
          own common/parsers module, and the current CODEOWNERS file lists Wilkin for tools/parser and the chat
          tests and as part of the llama-common team.
        source_ids: [pr-27764, llama-cpp-codeowners, llama-cpp-commits]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Wilkin writes standalone C++ runtimes built on GGML. trellis.cpp ports Microsoft's TRELLIS.2 image-to-3D
          pipeline to native C++ with CUDA, ROCm and Vulkan builds, and thinksound.cpp runs the ThinkSound
          text-to-sound-effect model without Python at inference time. trellis.cpp serves as the trellis backend
          of Lemonade, where Wilkin's July 2026 commits added asset generation with Trellis and OpenMOSS and audio
          generation with ThinkSound and ACE-Step.
        source_ids: [trellis-cpp-repo, thinksound-cpp-repo, lemonade-commits]
      - text: >-
          Earlier tools from Wilkin include Catapult, a desktop and terminal launcher that manages llama.cpp
          runtimes, models and server settings, whose README now points users to Lemonade instead.
        source_ids: [catapult-repo]
