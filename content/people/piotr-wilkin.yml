headline: Maintains llama.cpp's parser code and contributes to Lemonade; systems architect at Syndatis
bio:
  text: >-
    Piotr Wilkin, who also uses the handle ilintar, describes Wilkin's work on GitHub as programmer
    and systems architect at Syndatis, maintainer of llama.cpp's parser code, contributor to
    Lemonade, and author of trellis.cpp. llama.cpp's CODEOWNERS file names Wilkin as owner of the
    parser tool and the chat tests, co-owner of the debug example, and a member of the shared-code
    (llama-common) team; Wilkin's commits there cover chat-template parsing and tool calls, support
    for new models, and CUDA and Vulkan kernels. In Lemonade, an AMD-sponsored local AI server,
    Wilkin's 2026 commits add asset- and audio-generation backends and a job engine, and fix its
    llama.cpp integration.
  source_ids: [github-profile, llama-cpp-codeowners, llama-cpp-commits, lemonade-commits, lemonade-readme]
  reviewed_at: 2026-10-13
