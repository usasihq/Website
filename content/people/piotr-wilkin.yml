work:
  - name: llama.cpp
    artifact_slug: llama-cpp
    type: open-source
    url: https://github.com/ggml-org/llama.cpp
    contribution: >-
      CODEOWNERS names Wilkin for tools/parser and tests/test-chat, co-owner (with Daniel
      Bevenius) of examples/debug, and a member of the ggml-org/llama-common team. Commits authored
      from June to October 2026 split specialized chat parsers into common/parsers, fix DeepSeek and
      other chat templates and tool calls, add model support such as Kimi-K3, and tune CUDA, HIP and
      Vulkan kernels. The repository is MIT-licensed.
    source_ids: [llama-cpp-codeowners, llama-cpp-commits, llama-cpp-license]
  - name: Lemonade
    artifact_slug: lemonade
    type: open-source
    url: https://github.com/lemonade-sdk/lemonade
    contribution: >-
      Commits authored from July to September 2026 add asset generation (Trellis and OpenMOSS),
      audio generation backends (ThinkSound and ACE-Step) and a job engine, and fix how Lemonade
      finds and launches llama.cpp. The repository is Apache-2.0 licensed and states that the
      project is sponsored by AMD.
    source_ids: [lemonade-commits, lemonade-readme]
