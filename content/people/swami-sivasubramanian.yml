headline: Vice President of Agentic AI at AWS; co-author of Amazon's 2007 Dynamo paper
bio:
  text: >-
    Swami Sivasubramanian is Vice President of Agentic AI at Amazon Web Services and has been a
    member of Amazon's S-team since September 2023. Sivasubramanian leads the AWS agentic AI
    portfolio, whose launches include Amazon Quick Suite, Kiro, Amazon Bedrock AgentCore, DevOps
    Agent, Security Agent and Amazon Transform, and earlier led the wider AWS AI and machine
    learning portfolio, including Amazon SageMaker and Amazon Bedrock. Sivasubramanian has been at
    Amazon since 2005 and is a co-author of the 2007 SOSP paper on Dynamo and the 2022 USENIX ATC
    paper on Amazon DynamoDB. From May 2022 to May 2025, Sivasubramanian served on the National
    Artificial Intelligence Advisory Committee.
