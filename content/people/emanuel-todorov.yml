headline: Roboti LLC researcher whose lab built the MuJoCo physics engine; former UW and UC San Diego professor
bio:
  text: >-
    Emanuel (Emo) Todorov works on research and development at Roboti LLC, the company that developed
    the MuJoCo physics simulator for multi-body dynamics with contact. Todorov's CV lists faculty roles
    in Cognitive Science at UC San Diego from 2002 to 2009 and as Associate/Affiliate Professor of
    Applied Mathematics and Computer Science & Engineering at the University of Washington from 2009;
    the Movement Control Laboratory's site is now an archive. The lab built MuJoCo for model-based
    control, and Roboti's page notes that DeepMind acquired MuJoCo in October 2021 and released it as
    open source under the Apache 2.0 license. Todorov also co-authored a 2017 paper on learning
    dexterous manipulation with deep reinforcement learning and demonstrations.
  source_ids: [lab-page, cv, roboti, projects, dexterous-paper]
  reviewed_at: 2026-10-13
