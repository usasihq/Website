sections:
  - heading: Career
    paragraphs:
      - text: >-
          Todorov earned a PhD in cognitive neuroscience at MIT in 1998 and was a postdoctoral fellow at the
          Gatsby Computational Neuroscience Unit at University College London from 1999 to 2001. After a year
          as a research scientist at the Alfred Mann Institute for Biomedical Engineering at the University of
          Southern California, Todorov joined UC San Diego's Department of Cognitive Science in 2002.
        source_ids: [cv]
      - text: >-
          Todorov founded the Movement Control Laboratory at UC San Diego in 2002 and moved it to the
          University of Washington's Department of Computer Science and Engineering in 2009. The archival lab
          page says that its members have since graduated and that Todorov now works on research and
          development at Roboti LLC.
        source_ids: [lab-page, cv]
  - heading: Research
    paragraphs:
      - text: >-
          The Movement Control Laboratory studied the control of complex movement in animals and robots,
          treating both as optimization problems and developing methods for optimal control and learning.
          Its early work modeled human sensorimotor control, including a 2002 Nature Neuroscience paper on
          optimal feedback control as a theory of motor coordination.
        source_ids: [lab-page, projects]
      - text: >-
          Later projects included linearly-solvable optimal control, contact-invariant trajectory
          optimization for generating complex behaviors automatically, real-time model-predictive control for
          humanoid robots, and the design of a pneumatically actuated 20-degree-of-freedom robotic hand.
        source_ids: [projects]
  - heading: MuJoCo
    paragraphs:
      - text: >-
          The lab built MuJoCo, a physics engine for model-based control that combines recursive algorithms in
          generalized coordinates with contact solvers based on the lab's own formulations of contact physics;
          it was described at IROS 2012. Roboti LLC offered MuJoCo as a commercial product from 2015 to 2021.
          In October 2021 DeepMind acquired MuJoCo and released it as open source under the Apache 2.0 license.
        source_ids: [projects, roboti]
