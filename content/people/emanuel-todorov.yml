    contribution: >-
      The lab's projects page describes MuJoCo as "our physics engine designed for model-based
      control" and lists the IROS 2012 paper "MuJoCo: A physics engine for model-based control";
      Roboti LLC developed it and offered it as a commercial product from 2015 to 2021 before
      DeepMind made it open source under Apache 2.0.
