headline: Co-author of Contextual AI's open Reranker v2 models; machine learning software engineer at Google
bio:
  text: >-
    George Halal is a machine learning software engineer at Google, according to Halal's own site.
    At Contextual AI, where Halal was a member of technical staff, Halal trained the company's
    instruction-following rerankers and is the first-listed author of the Reranker v2 release (August
    2025), whose open-weight models come in 1B, 2B and 6B sizes. Halal earned a PhD in physics at
    Stanford University in July 2024.
  source_ids: [halal-site, ctx-rerank-v2-blog, ctx-rerank-v2-card]
  reviewed_at: 2026-10-22
