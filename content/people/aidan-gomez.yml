sections:
  - heading: Career
    paragraphs:
      - text: >-
          Gomez's work on "Attention Is All You Need" was performed while at Google Brain, and the 2018
          Tensor2Tensor paper also lists Gomez with a Google Brain affiliation. Gomez is now co-founder and CEO
          of Cohere, which lists Nick Frosst and Ivan Zhang as its other co-founders, and Gomez's GitHub profile
          names Cohere as Gomez's organization.
        source_ids: [attention-paper, t2t-paper, cohere-about, github-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Gomez is one of eight authors of "Attention Is All You Need" (2017), which introduced the Transformer,
          a sequence model built entirely on attention; its contribution note credits Gomez and Łukasz Kaiser
          with designing and implementing parts of Tensor2Tensor, which replaced the team's earlier codebase.
          The same year Gomez was second author of "One Model To Learn Them All", which trained a single
          model concurrently on image, translation, captioning, speech, and parsing tasks.
        source_ids: [attention-paper, multimodel-paper]
      - text: >-
          Gomez is first author of the 2017 RevNet paper, which introduced reversible ResNet-style networks
          that can be trained without storing most activations in memory, and of "Learning Sparse Networks Using Targeted
          Dropout" (2019), co-authored with Ivan Zhang and Geoffrey Hinton among others, which trains networks
          to be robust to later pruning.
        source_ids: [revnet-paper, targeted-dropout-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Gomez is a co-author of the 2018 paper describing Tensor2Tensor, Google Brain's Apache-2.0 library of
          deep learning models and datasets that includes the reference implementation of the Transformer.
        source_ids: [t2t-paper, t2t-repo]
