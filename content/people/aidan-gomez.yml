headline: Co-founder and CEO of Cohere; co-author of the Transformer paper, written while at Google Brain
bio:
  text: >-
    Aidan Gomez is the co-founder and CEO of Cohere, according to the company's about page. Gomez is a
    co-author of Attention Is All You Need (2017), which introduced the Transformer; the paper notes that
    Gomez's work on it was performed while at Google Brain, and its contribution note credits Gomez and
    Łukasz Kaiser with designing parts of and implementing Tensor2Tensor, which replaced the team's
    earlier codebase. Gomez is also listed with a Google Brain affiliation on the 2018 Tensor2Tensor paper.
  source_ids: [cohere-about, attention-paper, t2t-paper]
  reviewed_at: 2026-10-13
