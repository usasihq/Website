headline: Co-founder and CTO of TypeSafe AI; previously founded Ravel, a multimodal AI company for DNA sequencing
bio:
  text: >-
    Erik Gafni is a founder and the CTO of TypeSafe AI, a San Francisco company that builds System One
    models for typed, probabilistic decisions in software automation. TypeSafe's team page describes
    Gafni as a repeat founder, including of Ravel, a multimodal AI company for DNA sequencing, as an
    early employee at Invitae and Freenome, and as a specialist in building production AI systems.
  source_ids: [typesafe-team]
