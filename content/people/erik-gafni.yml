sections:
  - heading: Career
    paragraphs:
      - text: >-
          Gafni's earlier roles include founding Ravel, which worked on multimodal AI for DNA sequencing, and
          early positions at Invitae and Freenome; TypeSafe's team page also credits Gafni with publications
          and patents. Gafni is one of TypeSafe's three founders and serves as CTO, alongside
          CEO Diogo Almeida and COO Sasha Sheng.
        source_ids: [typesafe-team]
      - text: >-
          TypeSafe launched Jev in September 2026, describing a new model architecture, a parallel sampler and
          a calibrated-decision training method built for automation rather than chat.
        source_ids: [typesafe-launch]
