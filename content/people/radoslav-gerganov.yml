headline: Code owner for llama.cpp's RPC backend, which offloads computation to remote machines
bio:
  text: >-
    Radoslav Gerganov is the code owner for llama.cpp's RPC backend, according to the project's
    CODEOWNERS file, which lists Gerganov as the sole member of the ggml-rpc team covering the
    backend and its server tool. The project's documentation says the RPC server exposes ggml
    devices on a remote host and that the RPC backend offloads computations to one or several of
    those servers. Gerganov's commits add multi-device support, compute-graph caching and reuse, a
    refactored transport, and asynchronous backend APIs to the RPC backend, along with
    request-handling changes in llama-server.
  source_ids: [llama-cpp-codeowners, rpc-readme, llama-cpp-commits]
  reviewed_at: 2026-10-13
