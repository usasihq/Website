work:
  - name: llama.cpp RPC backend
    artifact_slug: llama-cpp
    type: open-source
    url: https://github.com/ggml-org/llama.cpp/tree/master/tools/rpc
    contribution: >-
      CODEOWNERS lists Gerganov as the ggml-org/ggml-rpc team, which owns ggml/src/ggml-rpc and
      tools/rpc; a September 2025 commit added Gerganov as RPC owner. Commits authored from
      September 2025 to August 2026 add multi-device support, graph caching and reuse, a transport
      refactor, and event and async backend APIs, plus llama-server changes such as returning HTTP
      400 when a prompt exceeds the context length. The repository is MIT-licensed.
    source_ids: [llama-cpp-codeowners, llama-cpp-commits, rpc-readme, llama-cpp-license]
  - name: Shanocast
    artifact_slug: null
    type: open-source
    url: https://xakcop.com/post/shanocast/
    contribution: >-
      Wrote this Chromecast receiver for Linux, built on the open-source Openscreen implementation of
      the Chromecast protocol, which can mirror a Chrome tab or the whole desktop.
    source_ids: [shanocast-post]
