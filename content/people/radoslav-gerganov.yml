sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Radoslav Gerganov authored the pull request that added the RPC backend to ggml and llama.cpp,
          merged in May 2024; its commit message describes a backend that proxies all operations to a remote
          server running a regular CPU, CUDA or Metal backend. Follow-up pull requests by Gerganov added
          RPC support to llama-server and SYCL support to rpc-server.
        source_ids: [pr-rpc-backend, pr-server-rpc, pr-rpc-sycl]
      - text: >-
          The project's CODEOWNERS file lists Gerganov as the sole member of the ggml-org/ggml-rpc team,
          which owns the backend source and the tools/rpc server. Gerganov's commits since September
          2025 add multi-device support, compute-graph caching and reuse, a transport refactor and
          asynchronous backend APIs. A March 2023 commit by Gerganov added a README section on
          running the project on Android.
        source_ids: [llama-cpp-codeowners, llama-cpp-commits, rpc-readme, first-commit]
  - heading: Writing and reverse engineering
    paragraphs:
      - text: >-
          Gerganov's blog, subtitled "random hacks," covers reverse engineering and hardware hacking.
          Posts include a 2021 look at how SoftHSMv2, a software PKCS#11 implementation, persists its
          state, a 2023 write-up of Shanocast, and 2025 posts on reverse engineering the MAGic Remote
          set-top-box protocol to build an open-source client and on weak algorithms routers use to
          generate default Wi-Fi passwords.
        source_ids: [blog, shanocast-post, magic-remote-post]
