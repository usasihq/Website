sections:
  - heading: Career
    paragraphs:
      - text: >-
          At OpenAI, McCandlish built and led a team studying the science and scaling of machine learning,
          whose work on scaling laws Anthropic credits with helping lead to large models such as GPT-3.
          McCandlish then co-founded Anthropic and served as its CTO until October 2025, when Rahul Patil
          became CTO and McCandlish became Chief Architect.
        source_ids: [anthropic-leadership, anthropic-cto-news]
      - text: >-
          As Chief Architect, McCandlish focuses on large-scale model training, continuing to lead pretraining
          and overseeing research productivity and RL infrastructure. As Responsible Scaling Officer,
          McCandlish also helps shape and implement Anthropic's Responsible Scaling Policy.
        source_ids: [anthropic-leadership, anthropic-cto-news]
  - heading: Research
    paragraphs:
      - text: >-
          McCandlish's OpenAI papers include "An Empirical Model of Large-Batch Training" (2018), on the
          largest useful batch size, and "Scaling Laws for Neural Language Models" (2020), which McCandlish
          co-led with Jared Kaplan. McCandlish also co-authored the GPT-3 paper "Language Models are Few-Shot
          Learners" (2020), "Scaling Laws for Autoregressive Generative Modeling" (2020) and the 2021 Codex
          paper that introduced HumanEval.
        source_ids: [large-batch-paper, scaling-laws-paper, gpt3-paper, ar-scaling-paper, codex-paper]
      - text: >-
          At Anthropic, McCandlish co-authored alignment research such as "A General Language Assistant as a
          Laboratory for Alignment" (2021), "Training a Helpful and Harmless Assistant with Reinforcement
          Learning from Human Feedback" (2022) and "Constitutional AI - Harmlessness from AI Feedback" (2022).
        source_ids: [hhh-lab-paper, hh-rlhf-paper, cai-paper]
