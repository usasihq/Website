headline: Anthropic co-founder and Chief Architect; co-led the 2020 scaling-laws research at OpenAI
bio:
  text: >-
    Sam McCandlish co-founded Anthropic and is its Chief Architect; McCandlish focuses on large-scale
    model training and leads pretraining, research productivity and RL infrastructure. According to
    Anthropic's leadership page, McCandlish previously built and led a team at OpenAI focused on the
    science and scaling of machine learning. McCandlish is first author of "An Empirical Model of
    Large-Batch Training" (2018), written with an OpenAI affiliation, and an equal-contribution author
    of "Scaling Laws for Neural Language Models" (2020), whose contribution statement says Jared Kaplan
    and McCandlish led the research.
  source_ids: [anthropic-leadership, large-batch-paper, scaling-laws-paper]
  reviewed_at: 2026-10-13
