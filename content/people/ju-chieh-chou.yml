sections:
  - heading: Research
    paragraphs:
      - text: >-
          Before TTIC, Chou worked on unsupervised voice conversion as a research assistant and master's
          student at National Taiwan University with Hung-yi Lee and Lin-shan Lee, including Interspeech papers
          in 2018 and 2019 on separating speaker and content representations. In 2020 Chou interned at Mila,
          developing end-to-end speech recognition recipes for the SpeechBrain toolkit.
        source_ids: [chou-cv]
      - text: >-
          Chou began the PhD at TTIC with Karen Livescu in April 2021. Chou's doctoral work includes a
          layer-wise analysis of wav2vec 2.0 representations, AV2Wav for diffusion-based audio-visual speech
          enhancement, and Flow-SLM, a spoken language model that learns linguistic and acoustic information
          together through a flow-matching objective.
        source_ids: [chou-cv, chou-site]
      - text: >-
          Chou's more recent work compares speech, speech-text, and text language models and studies
          distilling text language models into speech-to-speech models. Industry internships include
          transducer-based streaming speech translation at Microsoft in 2024 and robustness evaluation of
          audio-video-text language models at Meta in 2025.
        source_ids: [chou-cv]
