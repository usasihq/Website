headline: TTIC PhD student in speech and language processing; former research intern at Meta and Microsoft
bio:
  text: >-
    Ju-Chieh Chou is a final-year PhD student at the Toyota Technological Institute at Chicago
    (TTIC), advised by Karen Livescu, working on speech and language processing with a focus on
    learning from multimodal data and generative modeling for speech. Chou's CV lists research
    internships at Meta AI in 2022, Microsoft in 2024, and Meta in 2025, and earlier at Mila, where
    Chou developed end-to-end speech recognition recipes within SpeechBrain. During the 2022 Meta AI
    internship, Chou proposed a joint interleaved language model for discrete speech units and text,
    published as Toward Joint Language Modeling for Speech Units and Text.
