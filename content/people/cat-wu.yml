headline: Head of Product for Claude Code at Anthropic
bio:
  text: >-
    Cat Wu is the Head of Product for Claude Code at Anthropic, according to a March 2026 article on
    claude.com written by Wu. The article, "Product management on the AI exponential," describes how
    product teams are adapting their workflows and roadmaps as model capabilities change. In it, Wu
    describes testing each new Claude model, starting with Claude Sonnet 3.5 (new) in October 2024, by
    asking Claude Code, then an internal tool, to add a table tool to Excalidraw.
