sections:
  - heading: Career
    paragraphs:
      - text: >-
          Cat Wu joined Anthropic in August 2024 as a product manager on the Research PM team, which connects
          research work with customer needs. When Claude Code became available inside the company that autumn,
          Wu used it to build Streamlit apps for analyzing user feedback, run evaluations and create
          reinforcement-learning environments, and Wu now leads product for Claude Code.
        source_ids: [claude-pm-article]
  - heading: Writing
    paragraphs:
      - text: >-
          In the March 2026 article "Product management on the AI exponential," Wu describes a Claude Code team
          in which designers ship code, engineers make product decisions and product managers build
          prototypes and evaluations. The article credits short self-directed experiments with producing
          features such as Claude Code on Desktop, the AskUserQuestion tool and to-do lists, and recounts a
          habit, begun in October 2024, of testing each new model by asking it to add a table tool to
          Excalidraw.
        source_ids: [claude-pm-article]
