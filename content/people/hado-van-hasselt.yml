sections:
  - heading: Research
    paragraphs:
      - text: >-
          Hado van Hasselt's research focuses on reinforcement learning, including how agents estimate
          values and learn predictions efficiently. Before joining DeepMind, van Hasselt worked with
          Rich Sutton at the University of Alberta; together they wrote about learning predictions
          whose computational cost does not grow with their time span, and van Hasselt co-authored with
          A. Rupam Mahmood and Sutton a NIPS 2014 paper on weighted importance sampling for off-policy
          learning with linear function approximation.
        source_ids: [about, homepage]
      - text: >-
          In "Deep Reinforcement Learning with Double Q-learning" (2015), van Hasselt, Arthur Guez and
          David Silver showed that Q-learning combined with deep networks learns overoptimistic action
          values even in deterministic Atari games, and proposed the Double DQN variant to reduce this.
          Van Hasselt's 2016 paper "Learning values across many orders of magnitude" introduced
          adaptive normalization of learning targets, so agents need not clip rewards.
        source_ids: [ddqn-paper, popart-paper, homepage]
      - text: >-
          Van Hasselt also co-authored "Dueling Network Architectures for Deep Reinforcement Learning",
          which separates the value of a state from the advantage of each action and received the best
          paper award at ICML 2016, and Rainbow (2017), which combined several improvements to DQN in
          one agent. A 2018 paper led by van Hasselt studied the "deadly triad" of function
          approximation, bootstrapping and off-policy learning in deep reinforcement learning.
        source_ids: [dueling-paper, rainbow-paper, deadly-triad-paper, homepage]
  - heading: Teaching
    paragraphs:
      - text: >-
          In 2016 van Hasselt and Joseph Modayil taught the reinforcement learning part of the Advanced
          Topics in Machine Learning course at University College London, including two lectures about
          AlphaGo.
        source_ids: [homepage]
