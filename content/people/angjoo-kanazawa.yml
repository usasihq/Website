headline: Berkeley EECS associate professor whose lab builds the open-source nerfstudio and gsplat libraries
bio:
  text: >-
    Angjoo Kanazawa is an Associate Professor in the Department of Electrical Engineering and Computer
    Sciences at the University of California, Berkeley, and leads the Kanazawa AI Research (KAIR) lab
    under BAIR. Angjoo Kanazawa is a co-author of the papers introducing nerfstudio, a modular
    framework for neural radiance field development, and gsplat, an open-source library for Gaussian
    splatting; both projects are released under the Apache-2.0 license. Angjoo Kanazawa is also an
    Amazon Scholar on the Frontier AI & Robotics team, and was previously a Research Scientist at
    Google Research.
