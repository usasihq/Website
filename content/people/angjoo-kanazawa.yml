sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kanazawa completed a PhD in computer science at the University of Maryland, College Park, advised by
          David Jacobs, and was then a BAIR postdoctoral researcher at UC Berkeley advised by Jitendra Malik,
          Alexei A. Efros and Trevor Darrell. Kanazawa also worked as a Research Scientist at Google Research
          before leading the Kanazawa AI Research (KAIR) lab at Berkeley. Kanazawa's homepage notes advising
          companies such as Luma AI and Wonder Dynamics and a current role as an Amazon Scholar.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Kanazawa's research sits between computer vision, computer graphics and machine learning, with the
          goal of capturing and understanding the dynamic 3D world from everyday photos and video. As first
          author of "End-to-end Recovery of Human Shape and Pose" (2017), Kanazawa introduced Human Mesh
          Recovery (HMR), which reconstructs a full 3D body mesh from a single RGB image. The 2024 paper "Shape
          of Motion", which Kanazawa co-authored, reconstructs generic dynamic scenes from casually captured
          monocular video.
        source_ids: [homepage, hmr-paper, som-paper]
      - text: >-
          With students and collaborators, Kanazawa has worked on faster representations for radiance fields.
          PlenOctrees (2021) render neural radiance fields in real time using an octree-based representation,
          and Plenoxels (2021) represent a scene as a sparse 3D grid with spherical harmonics, optimized
          without any neural network components.
        source_ids: [plenoctree-paper, plenoxels-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Kanazawa's group maintains open-source tools for 3D capture and rendering. Nerfstudio, described in a
          2023 paper, is a modular framework for developing neural radiance field methods, and gsplat, described
          in 2024, is a library for Gaussian splatting; both are released under the Apache-2.0 license.
          Kanazawa's homepage lists nerfstudio, gsplat and viser among the group's open-source tools.
        source_ids: [nerfstudio-paper, nerfstudio-repo, gsplat-paper, gsplat-repo, homepage]
