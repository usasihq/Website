headline: Vice President of AI Engineering at Red Hat; a founder of Open Data Hub, which became Red Hat OpenShift AI
bio:
  text: >-
    Steven Huels is Vice President of Red Hat's AI Engineering organization, accountable for developing
    and releasing Red Hat's AI product portfolio. Red Hat's author biography says Huels previously served
    as Vice President and General Manager of Red Hat's AI business unit, where Huels led its strategy,
    product portfolio, and field readiness. Huels has more than 20 years of experience with data management and
    AI platforms, and as one of the founders of Open Data Hub, an open-source machine learning platform,
    was responsible for bringing it to market as Red Hat OpenShift AI.
