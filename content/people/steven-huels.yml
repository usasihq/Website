sections:
  - heading: Career
    paragraphs:
      - text: >-
          A 2018 profile on the Red Hat Collaboratory at Boston University site described Steven Huels as a
          Senior Manager in the Red Hat AI Center of Excellence, responsible for Red Hat's common analytics
          platform, which combined internal and upstream data for machine learning and advanced
          analytics. The profile noted an interest in applying image manipulation techniques to the ChRIS
          platform.
        source_ids: [bu-collab-profile]
      - text: >-
          A 2023 Red Hat TV webinar listed Huels as Senior Director for Red Hat's AI platform business,
          working on AI strategy, ecosystem partners and customer implementations. Huels later served as
          Vice President and General Manager of Red Hat's AI Business Unit and is now Vice President of the
          AI Engineering organization, accountable for developing and releasing Red Hat's AI product
          portfolio.
        source_ids: [redhat-tv-webinar, redhat-author-earlier, redhat-author-current]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Huels is one of the founders of Open Data Hub, which the 2023 webinar listing describes as a
          reference architecture for building a data science platform on Red Hat OpenShift. Red Hat's
          author biography says Huels was responsible for bringing Open Data Hub to market as Red Hat
          OpenShift AI.
        source_ids: [redhat-tv-webinar, redhat-author-current]
