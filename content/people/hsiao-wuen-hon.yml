sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hsiao-Wuen Hon earned a PhD in computer science at Carnegie Mellon University under Raj Reddy, and earlier
          in Hon's career was Technology Director at Apple for the Chinese Dictation Kit. During a 28-year career at
          Microsoft, Hon led the Natural Interaction Service Division, which shipped Microsoft Speech Server
          and the Natural User Interface platform, and was a founder of the Microsoft Search Technology Center,
          which helped deliver the Bing search stack for Asia-Pacific.
        source_ids: [msr-profile]
      - text: >-
          Hon served as Corporate Vice President of Microsoft's Asia-Pacific R&D Group and Managing
          Director of Microsoft Research Asia, and established the Microsoft Innovation Partnership Center for
          industry collaboration on AI. Hon is now an Emeritus Researcher at Microsoft Research, an independent
          board member of MediaTek and Ambarella, and a Vice-Chancellor Visiting Professor at The Chinese
          University of Hong Kong.
        source_ids: [msr-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Hon's research spans speech recognition, natural language processing and internet search. With
          Kai-Fu Lee and Raj Reddy, Hon co-authored a 1990 overview of SPHINX, a large-vocabulary,
          speaker-independent continuous speech recognition system based on hidden Markov models, and in 2019
          Hon co-authored UniLM, a Transformer pre-trained for both language understanding and generation.
        source_ids: [msr-profile, sphinx-paper, unilm-paper]
