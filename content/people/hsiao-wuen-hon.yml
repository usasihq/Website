headline: Emeritus Researcher at Microsoft Research; former Managing Director of Microsoft Research Asia
bio:
  text: >-
    Hsiao-Wuen Hon is an Emeritus Researcher at Microsoft Research after a 28-year career at Microsoft,
    where Hon served as Corporate Vice President of the Asia-Pacific R&D Group and Managing Director of
    Microsoft Research Asia. Hon was a founder of the Microsoft Search Technology Center, which helped deliver the
    Bing search stack for Asia-Pacific, and earlier led Microsoft's Natural Interaction Service
    Division, which shipped Microsoft Speech Server. Hon's work spans speech recognition, natural
    language processing, and internet search, and Hon is a co-author of the 2019 UniLM paper on unified
    pre-training for language understanding and generation. Hon is an IEEE Fellow.
  source_ids: [msr-profile, unilm-paper]
  reviewed_at: 2026-10-13
