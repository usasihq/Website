sections:
  - heading: Career
    paragraphs:
      - text: >-
          Li earned a PhD in computer science at Carnegie Mellon University, where one of Li's advisors was Alex
          Smola, according to a 2017 AWS profile. The same profile records that Li had served as a principal
          research architect at Baidu's Institute of Deep Learning and as CTO of the AI start-up Marianas Labs
          before joining AWS as a principal scientist for machine learning.
        source_ids: [aws-spotlight]
      - text: >-
          At AWS, Li led a team working mainly on the Apache MXNet framework, with a focus on making deep
          learning easier to use and to run at scale across many GPUs and machines. In 2023 Li and Smola founded
          Boson AI, which builds the Higgs multimodal models for voice and audio, and the company's team page
          lists Li as Co-Founder & CEO / CTO.
        source_ids: [aws-spotlight, boson-about, boson-team]
  - heading: Research and open-source systems
    paragraphs:
      - text: >-
          Li's research has centred on large-scale machine learning and the co-design of distributed systems and
          learning algorithms. At OSDI 2014, Li presented "Scaling Distributed Machine Learning with the
          Parameter Server", written with colleagues from Carnegie Mellon, Baidu and Google, which describes a
          framework where server nodes hold shared parameters while workers process distributed data.
        source_ids: [aws-spotlight, parameter-server-paper]
      - text: >-
          Li co-authored the 2015 MXNet paper describing a flexible library for distributed machine learning
          across heterogeneous hardware. Later papers with Li as a co-author include "Bag of Tricks for
          Image Classification with Convolutional Neural Networks" (2018) and the 2019 paper introducing the
          GluonCV and GluonNLP toolkits for computer vision and natural language processing.
        source_ids: [mxnet-paper, bag-of-tricks-paper, gluon-paper]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Li is one of the four main authors of Dive into Deep Learning, with Aston Zhang, Zachary C. Lipton and
          Alexander J. Smola. The interactive book pairs text with runnable code in several frameworks, and its
          site says it is forthcoming from Cambridge University Press. The source repository releases the text
          under CC BY-SA 4.0.
        source_ids: [d2l-site, d2l-repo]
