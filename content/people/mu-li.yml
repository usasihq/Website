headline: Co-founder of Boson AI; co-author of Dive into Deep Learning; led an AWS team working on Apache MXNet
bio:
  text: >-
    Mu Li co-founded Boson AI with Alex Smola in 2023, and the company's team page lists Li as
    Co-Founder & CEO / CTO. Earlier, Li was a principal scientist for machine learning at Amazon
    Web Services, where Li led a team working primarily on the Apache MXNet framework; Li is also
    a co-author of the 2015 paper introducing MXNet. With Aston Zhang, Zachary C. Lipton and
    Alexander J. Smola, Li co-wrote Dive into Deep Learning, an open-source book whose text is
    released under CC BY-SA 4.0 and whose code is implemented in PyTorch, NumPy/MXNet, JAX and
    TensorFlow.
  source_ids: [boson-team, boson-about, aws-spotlight, mxnet-paper, d2l-site, d2l-repo]
  reviewed_at: 2026-10-21
