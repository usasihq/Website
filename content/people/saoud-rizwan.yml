sections:
  - heading: Products and projects
    paragraphs:
      - text: >-
          Rizwan's account of Cline's origins describes a week in July 2024 spent building a demo for an
          Anthropic hackathon that gave a model file access, terminal commands and the ability to
          navigate a codebase. The demo did not win, but the project grew into Cline, and Rizwan writes
          that many early open-source contributors later joined the team.
        source_ids: [blog-5m]
      - text: >-
          Cline today is offered as an IDE extension, a CLI, a desktop app and an SDK built on one open
          agent runtime. In September 2026 Rizwan described migrating the VS Code extension from its
          original monolithic core to the shared Cline SDK, including a staged A/B rollout built
          because the marketplace offered no gradual release mechanism.
        source_ids: [cline-home, blog-migration]
  - heading: Writing
    paragraphs:
      - text: >-
          Rizwan's posts on the Cline blog cover agent design and evaluation. An August 2025 post
          introduced the Focus Chain, in which the agent drafts a numbered plan and keeps it in context to
          stay on task, and a November 2025 post introduced cline-bench, built from real open-source
          engineering work rather than puzzle-style tasks.
        source_ids: [blog-focus, blog-bench, blog-archive]
