headline: Founder of Cline, the open-source AI coding agent for editors, the terminal and an SDK
bio:
  text: >-
    Saoud Rizwan is the founder of Cline, an open-source coding agent that runs in code editors such
    as VS Code and JetBrains IDEs, in the terminal and as an embeddable SDK. Rizwan built the first
    version in July 2024 as a demo for an Anthropic hackathon and writes many of the Cline blog's
    engineering and announcement posts.
  source_ids: [github-profile, cline-home, blog-5m, blog-archive]
  reviewed_at: 2026-10-21
