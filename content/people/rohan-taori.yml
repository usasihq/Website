sections:
  - heading: Career
    paragraphs:
      - text: >-
          Taori studied EECS at UC Berkeley, working with Ludwig Schmidt, and helped run the Data Science
          class of Machine Learning at Berkeley for several semesters. Taori then completed a PhD in computer
          science at Stanford, advised by Tatsu Hashimoto, supported by an NSF Graduate Research Fellowship.
          Taori now works on the pretraining team at Anthropic.
        source_ids: [taori-site]
  - heading: Research
    paragraphs:
      - text: >-
          Taori's early research studied robustness and evaluation, including Measuring Robustness to Natural
          Distribution Shifts in Image Classification, a NeurIPS 2020 spotlight, and Accuracy on the Line at
          ICML 2021, which examined the link between in-distribution and out-of-distribution accuracy. Taori
          is also listed among the contributors to OpenCLIP, an open-source implementation of CLIP.
        source_ids: [taori-site, robustness-paper]
      - text: >-
          At Stanford, Taori and Hashimoto studied how models trained on their own outputs can amplify dataset
          biases, in Data Feedback Loops, an oral paper at ICML 2023. In 2023 Taori was one of the
          equal-contribution student authors of Stanford Alpaca, and then of AlpacaFarm, a NeurIPS 2023
          spotlight, and AlpacaEval, tools for studying and evaluating instruction-following models.
        source_ids: [taori-site, feedback-paper, alpaca-blog, alpacafarm-paper]
