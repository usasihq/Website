headline: Pretraining researcher at Anthropic; co-author of Stanford Alpaca, AlpacaFarm and AlpacaEval
bio:
  text: >-
    Rohan Taori is a researcher on the pretraining team at Anthropic. Taori received a PhD in computer
    science at Stanford, advised by Tatsu Hashimoto, and is one of the five graduate-student authors
    who contributed equally to Stanford Alpaca, an instruction-following model fine-tuned from a 7B
    LLaMA model. Taori also co-authored AlpacaFarm, a simulation framework for methods that learn from
    human feedback, and AlpacaEval, an automatic evaluator for instruction-following language models.
    Earlier work listed on Taori's site includes a study of how image classifiers hold up under natural
    distribution shifts.
  source_ids: [taori-site, alpaca-repo, alpacafarm-paper, alpacaeval-repo]
