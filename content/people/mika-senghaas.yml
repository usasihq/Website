sections:
  - heading: Research and engineering
    paragraphs:
      - text: >-
          Senghaas works as a research engineer at Prime Intellect, and the publications listed on Senghaas's
          site focus on decentralized training and reinforcement learning. Other listed work includes DiLoCo-SWARM,
          a report on scalable decentralized training.
        source_ids: [senghaas-site]
      - text: >-
          Senghaas is first author of the PRIME-RL report and of SYNTHETIC-2, and a co-author of the
          INTELLECT-2 report, which describes a reasoning model trained through globally decentralized
          reinforcement learning. Senghaas is the first named author on the INTELLECT-3 technical report
          (2025), whose model was trained with prime-rl and environments from the verifiers library.
        source_ids: [senghaas-site, intellect2-paper, intellect3-paper, intellect3-card]
