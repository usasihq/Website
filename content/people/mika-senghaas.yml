headline: Research engineer at Prime Intellect; first author of the INTELLECT-3 and PRIME-RL reports
bio:
  text: >-
    Mika Senghaas is a research engineer at Prime Intellect. Senghaas is the first named author of the
    INTELLECT-3 technical report, on a mixture-of-experts model post-trained with large-scale reinforcement
    learning, and of the PRIME-RL report on asynchronous, decentralized reinforcement learning training.
  source_ids: [senghaas-site, intellect3-paper]
  reviewed_at: 2026-10-22
