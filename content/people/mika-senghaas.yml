    contribution: >-
      First named author of the INTELLECT-3 technical report (2025), which describes the model's
      supervised fine-tuning and large-scale reinforcement learning starting from GLM-4.5-Air-Base.
    source_ids: [intellect3-paper, senghaas-site]
  - name: prime-rl
