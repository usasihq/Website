specialties: [language-models, reinforcement-learning, education]
headline: Co-founder of Trillium Labs; first author of the Tülu 3 report and former post-training lead at Ai2
bio:
  text: >-
    Nathan Lambert is the co-founder and Executive Director of Trillium Labs, a nonprofit fostering
    the open science of frontier AI, and a machine learning researcher who works on building and
    understanding open language models. Previously, Lambert was a senior research scientist and
    post-training lead at the Allen Institute for AI (Ai2), where Lambert trained open Olmo language
    models; Lambert is first author of the Tülu 3 post-training report and a co-author of the OLMo
    and OLMoE papers. Lambert is also listed among the authors of Hugging Face's TRL and Diffusers
    libraries and of the Zephyr paper, and wrote Reinforcement Learning from Human Feedback, a book
    on post-training published in print by Manning in 2026.
  source_ids: [lambert-site, interconnects-about, tulu3-paper, olmo-paper, olmoe-paper, trl-citation, diffusers-readme, zephyr-paper, rlhf-book]
  reviewed_at: 2026-10-13
