sections:
  - heading: Career
    paragraphs:
      - text: >-
          Lambert was a senior research scientist and post-training lead at the Allen Institute for AI (Ai2),
          where Lambert trained the open Olmo language models. In October 2026 Lambert announced Trillium Labs,
          a nonprofit co-founded to support open science of frontier AI, with Lambert as Executive Director.
        source_ids: [interconnects-about, lambert-site, trillium-intro]
  - heading: Research
    paragraphs:
      - text: >-
          Lambert's research centres on post-training of open language models. Lambert co-authored the Zephyr
          alignment paper (2023) and Tulu 2 (2023), was first author of RewardBench (2024), a benchmark for
          evaluating reward models, and first author of the Tülu 3 post-training report (2024), which released
          model weights, data, training code and the full recipe.
        source_ids: [zephyr-paper, tulu2-paper, rewardbench-paper, tulu3-paper]
      - text: >-
          Lambert is also a co-author of the OLMo (2024) and OLMoE (2024) papers on fully open language models,
          and is listed among the authors of Hugging Face's TRL post-training library and the Diffusers library.
        source_ids: [olmo-paper, olmoe-paper, trl-citation, diffusers-readme]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Lambert writes the Interconnects newsletter, which grew into a weekly publication after the release
          of ChatGPT and covers RLHF, reasoning models and open models, and hosts the Interconnects Interviews
          series. Lambert's book Reinforcement Learning from Human Feedback introduces post-training methods
          organized around the standard RLHF recipe, and is accompanied by a post-training course.
        source_ids: [interconnects-about, lambert-site, rlhf-book]
