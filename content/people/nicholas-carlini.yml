sections:
  - heading: Career
    paragraphs:
      - text: >-
          Nicholas Carlini completed a Ph.D. at UC Berkeley advised by David Wagner, with whom
          Carlini co-wrote early papers on adversarial machine learning. Carlini then worked as a research scientist at
          Google Brain from 2018 to 2023 and at DeepMind from 2023 to 2025, and now works at
          Anthropic on what harmful things could be done with, or to, language models.
        source_ids: [carlini-site]
  - heading: Research
    paragraphs:
      - text: >-
          Much of Carlini's research looks for flaws in machine learning models. Early work with
          David Wagner covered adversarial examples, including targeted audio attacks on
          speech-to-text systems, and the 2018 obfuscated-gradients paper showed that many proposed
          defenses against adversarial examples could be circumvented with stronger attacks.
        source_ids: [carlini-papers, obfuscated-paper]
      - text: >-
          Later work turned to privacy and security of large models. The 2020 paper Extracting
          Training Data from Large Language Models showed that individual training examples could be
          recovered by querying GPT-2, and the 2024 paper Stealing Part of a Production Language
          Model described an attack that recovers precise information from black-box production
          models. Carlini has also written on model-stealing attacks presented at CRYPTO 2020 and on
          practical poisoning of web-scale training datasets.
        source_ids: [extraction-paper, stealing-paper, carlini-site]
  - heading: Open-source work and writing
    paragraphs:
      - text: >-
          Carlini publishes Yet Another Applied LLM Benchmark, a GPL-3.0 test suite built from tasks
          Carlini has asked language models to perform. Carlini's site also hosts code projects
          such as an obfuscated Tic-Tac-Toe program written as a single call to printf, a Doom-style
          game in 13 kilobytes of WebGL and JavaScript, and a CPU built on Conway's Game of Life.
        source_ids: [yaallmb-repo, carlini-site]
