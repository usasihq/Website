headline: Research scientist at Anthropic working on machine learning security; formerly at Google Brain and DeepMind
bio:
  text: >-
    Nicholas Carlini is a research scientist at Anthropic who works at the intersection of machine
    learning and computer security, studying what harmful things could be done with, or to, language
    models. Carlini was previously a research scientist at Google Brain from 2018 to 2023 and at
    DeepMind from 2023 to 2025. Carlini is first author of "Extracting Training Data from Large
    Language Models" (2020) and "Stealing Part of a Production Language Model" (2024), and publishes
    Yet Another Applied LLM Benchmark, a GPL-3.0 test suite built from tasks Carlini has asked
    language models to do.
