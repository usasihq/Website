headline: Under Secretary of Commerce for Standards and Technology and 18th Director of NIST
bio:
  text: >-
    Arvind Raman is the fifth Under Secretary of Commerce for Standards and Technology and the 18th
    director of the National Institute of Standards and Technology (NIST). Raman came to NIST from
    Purdue University, where Raman joined the faculty in 2000 and was named the John A. Edwardson Dean
    of Engineering in February 2023. Raman's research has covered atomic force microscopy, human
    biomechanics and electronics manufacturing.
  source_ids: [nist-raman-bio, nist-director]
  reviewed_at: 2026-10-22
