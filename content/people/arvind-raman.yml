sections:
  - heading: Career
    paragraphs:
      - text: >-
          Raman joined Purdue University as an assistant professor in 2000 and was appointed the Robert
          V. Adams Professor of Engineering in 2012. In February 2023 Raman was named the John A.
          Edwardson Dean of Engineering at Purdue.
        source_ids: [nist-raman-bio]
      - text: >-
          Raman then joined NIST, where Raman serves as the fifth Under Secretary of Commerce for
          Standards and Technology and the agency's 18th director. NIST's biography notes that Raman
          collaborated with NIST researchers in nanotechnology from early in Raman's career.
        source_ids: [nist-raman-bio, nist-director]
  - heading: Research
    paragraphs:
      - text: >-
          Raman's research has focused on atomic force microscopy, human biomechanics and electronics
          manufacturing. NIST's biography says Raman's atomic force microscope work helped scientific and
          industrial communities recognize and exploit nonlinear effects to image and measure complex
          materials at the nanoscale.
        source_ids: [nist-raman-bio]
