headline: Started Apache Spark, helped develop MLflow and co-authored DSPy; UC Berkeley professor and Databricks CTO
bio:
  text: >-
    Matei Zaharia is an associate professor at UC Berkeley, working on computer systems and AI in the
    Sky Lab, and a co-founder and the CTO of Databricks. During PhD work Zaharia started the Apache
    Spark project and co-started Apache Mesos and Spark Streaming; at Databricks, Zaharia helped
    develop MLflow and Delta Lake. Zaharia's recent projects include the DSPy framework for LLM
    programs, the GEPA optimizer and the LOTUS engine for semantic queries, and Zaharia is a co-author
    of the DSPy paper.
  source_ids: [zaharia-site, dspy-paper]
