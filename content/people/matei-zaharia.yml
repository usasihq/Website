sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Matei Zaharia started the Apache Spark project during PhD work and co-started other datacenter
          software, including Apache Mesos and Spark Streaming. At Databricks, which Zaharia co-founded and
          serves as CTO, Zaharia helped develop MLflow and Delta Lake; Zaharia's homepage notes that most
          of Zaharia's research work is released as open source.
        source_ids: [zaharia-site]
      - text: >-
          Software from Zaharia's Berkeley group listed on the homepage includes MegaBlocks, ColBERT, DSPy,
          LOTUS, LEANN, Continual Learning Bench and GEPA. DSPy, described in a 2023 paper with Omar
          Khattab and colleagues, is maintained in the MIT-licensed stanfordnlp/dspy repository.
        source_ids: [zaharia-site, dspy-paper, dspy-repo]
  - heading: Research
    paragraphs:
      - text: >-
          Zaharia's research covers computer systems for large-scale workloads such as AI, data analytics
          and cloud computing, along with security and privacy for communication and Internet queries.
          Representative papers include ColBERT, a passage search method based on late interaction over
          BERT (SIGIR 2020), the Lakehouse platform paper (CIDR 2021), and GEPA, a reflective prompt
          evolution method presented at ICLR 2026.
        source_ids: [zaharia-site]
  - heading: Teaching
    paragraphs:
      - text: >-
          At UC Berkeley, Zaharia works in the Sky Lab and has taught CS 294-162 on AI systems in Fall 2023
          and Fall 2024, as well as a Fall 2023 course on responsible generative AI and decentralized
          intelligence. Zaharia advises PhD students and postdocs, several of them jointly with other
          faculty members.
        source_ids: [zaharia-site]
timeline:
