sections:
  - heading: Career
    paragraphs:
      - text: >-
          Abdelrahman Mohamed completed a PhD at the University of Toronto with Gerald Penn and Geoffrey
          Hinton, as part of the team that began applying deep learning to spoken language processing in
          2009. Mohamed was a researcher at Microsoft Research from 2014 to 2017 and then a principal
          scientist manager on Amazon's Alexa AI team.
        source_ids: [mohamed-site]
      - text: >-
          In September 2018 Mohamed joined Facebook AI Research (FAIR) as a research scientist. Mohamed's
          research interests span deep learning, spoken language processing and natural language
          understanding.
        source_ids: [mohamed-site]
  - heading: Research
    paragraphs:
      - text: >-
          Mohamed's early papers with George Dahl and Geoffrey Hinton used deep belief networks for phone
          recognition and acoustic modeling, and Mohamed co-authored "Speech recognition with deep
          recurrent neural networks" with Alex Graves and Hinton at ICASSP 2013. The paper
          "Convolutional Neural Networks for Speech Recognition," co-authored by Mohamed, received the
          IEEE Signal Processing Society Best Paper Award for 2016.
        source_ids: [mohamed-site]
      - text: >-
          Mohamed's work has also covered program synthesis, including RobustFill and neuro-symbolic
          program synthesis (both 2017), and analysis of how deep networks learn. At Facebook AI, Mohamed
          co-authored wav2vec 2.0 (2020), a framework for self-supervised learning of speech
          representations, and was last author of HuBERT (2021), which learns speech representations by
          masked prediction of hidden units.
        source_ids: [mohamed-site, wav2vec2-paper, wav2vec2-pdf, hubert-paper]
