headline: Speech researcher; co-author of wav2vec 2.0 and HuBERT at Facebook AI Research
bio:
  text: >-
    Abdelrahman Mohamed's homepage describes joining Facebook AI Research (FAIR) as a research
    scientist in September 2018, after work as a principal scientist manager on Amazon's Alexa AI
    team and, from 2014 to 2017, as a researcher at Microsoft Research. Mohamed's research spans
    deep learning, spoken language processing, and natural language understanding. At Facebook AI,
    Mohamed co-authored wav2vec 2.0, a framework for self-supervised learning of speech
    representations, and is the last author of HuBERT, a self-supervised speech representation model.
  source_ids: [mohamed-site, wav2vec2-paper, wav2vec2-pdf, hubert-paper]
  reviewed_at: 2026-10-13
