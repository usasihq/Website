sections:
  - heading: Career
    paragraphs:
      - text: >-
          Gilbert's Linux Foundation biography describes more than 25 years of taking AI work from
          research to large-scale deployment. Before AAIF, Gilbert was Director of Engineering for Google
          Distributed Cloud AI/ML and, at AT&T, VP of Network Analytics and Automation, building
          production machine learning, generative AI and agentic AI platforms.
        source_ids: [lf-speakers]
      - text: >-
          The same biography lists service on the boards of the Open Network Foundation, NSF MLWINS
          and the International Computer Science Institute.
        source_ids: [lf-speakers]
  - heading: Agentic AI Foundation
    paragraphs:
      - text: >-
          The Linux Foundation announced the Agentic AI Foundation in December 2025 as a neutral home for
          open agentic AI infrastructure, with founding project contributions including MCP, goose and
          AGENTS.md. Gilbert now leads it as Executive Director and is a featured keynote speaker at
          the foundation's AGNTCon + MCPCon Japan conference.
        source_ids: [lf-formation, aaif-staff, lf-speakers]
      - text: >-
          In September 2026, speaking for AAIF as executive director, Gilbert welcomed the Gates
          Foundation as the foundation's first philanthropic member, framing the move as a way to widen
          who takes part in building open agentic AI.
        source_ids: [lf-gates]
