headline: Executive Director of the Agentic AI Foundation at the Linux Foundation; IEEE Fellow
bio:
  text: >-
    Mazin Gilbert is the Executive Director of the Agentic AI Foundation (AAIF), the Linux Foundation
    home for open agentic AI projects such as the Model Context Protocol, goose and AGENTS.md. Gilbert's
    Linux Foundation biography describes earlier engineering leadership at Google and AT&T and a role in
    founding several open-source networking and AI projects.
  source_ids: [aaif-staff, lf-speakers, aaif-about]
  reviewed_at: 2026-10-21
