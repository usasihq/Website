sections:
  - heading: Career
    paragraphs:
      - text: >-
          Christoph Feichtenhofer completed a BSc, an MSc and a PhD in computer science at TU Graz,
          with a doctoral thesis titled "Deep Learning for Video Recognition" (2014–2017). During
          those years Feichtenhofer was a visiting researcher at the York University Vision Lab with
          Richard P. Wildes and at the Visual Geometry Group of the University of Oxford with Andrew
          Zisserman, then held a postdoctoral position at TU Graz.
        source_ids: [homepage, meta-profile]
      - text: >-
          Feichtenhofer joined Facebook AI Research (FAIR) as a research scientist in 2018. Since
          2021 Feichtenhofer has worked at Meta as a research scientist and director, a role the
          homepage now lists under Meta Superintelligence Labs.
        source_ids: [homepage, meta-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Feichtenhofer's early work centred on representations for video understanding, including
          two-stream network fusion for action recognition (CVPR 2016), the SlowFast architecture
          (ICCV 2019) and the efficient X3D family of video models (CVPR 2020). Later work extended
          transformers to video and images through Multiscale Vision Transformers (ICCV 2021) and
          the Hiera hierarchical vision transformer (ICML 2023).
        source_ids: [homepage, slowfast-paper]
      - text: >-
          More recent papers address self-supervised and multimodal learning, such as masked
          autoencoders for spatiotemporal data, the MetaCLIP study of CLIP training data, and the
          Perception Encoder and PerceptionLM releases of 2025. Feichtenhofer is also a co-author of
          ConvNeXt, which revisited convolutional networks for image recognition.
        source_ids: [homepage, convnext-paper]
  - heading: Segment Anything
    paragraphs:
      - text: >-
          Feichtenhofer is a co-author of SAM 2, which extended promptable segmentation from images to
          video, and of SAM 3, which adds segmentation from short noun phrases and image exemplars.
          The SAM 3 repository names Feichtenhofer as one of the project leads, and the homepage lists
          SAM 3 at ICLR 2026 and SAM Audio at ICML 2026.
        source_ids: [sam2-paper, sam3-paper, sam3-readme, homepage]
