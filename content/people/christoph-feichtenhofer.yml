headline: Director and research scientist at Meta Superintelligence Labs; SAM 3 project lead and SlowFast first author
bio:
  text: >-
    Christoph Feichtenhofer is a Director and Research Scientist at Meta Superintelligence Labs; a
    Meta AI profile notes that Feichtenhofer joined Facebook in spring 2018. Feichtenhofer is a
    co-author of the SAM 2 paper (2024) and one of the project leads named in the SAM 3 repository,
    with the SAM 3 paper listed at ICLR 2026. Earlier video-recognition work includes first
    authorship of SlowFast Networks (2018), whose PySlowFast codebase is released under Apache 2.0
    and names Feichtenhofer among its writers and maintainers, and co-authorship of ConvNeXt.
  source_ids: [homepage, meta-profile, sam2-paper, sam3-readme, sam3-paper, slowfast-paper, slowfast-readme, convnext-paper]
