headline: Writer of Not Boring, a newsletter of in-depth analyses of technology and startups
bio:
  text: >-
    Packy McCormick writes Not Boring, a Substack newsletter about tech strategy, analysis, and philosophy.
    Its about page says the newsletter tells the stories of ambitious, complex startups and covers their
    technology, business models, and markets, and that a Friday edition, the Weekly Dose of Optimism,
    collects stories from the frontier such as new medicines and models. The same page describes
    not boring world, a section where founders and researchers write essays with Packy's help, and Not
    Boring Capital, which invests in founders.
