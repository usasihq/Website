sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Packy McCormick began the newsletter in May 2019 under the name Per My Last E-mail, as a curated
          list of things McCormick was reading, listening to and writing, and it continues today as Not Boring. The newsletter
          publishes in-depth analyses of the technology and startup landscape, telling the stories of
          ambitious startups through their technology, business models and markets.
        source_ids: [first-edition, about]
      - text: >-
          Each Friday, Not Boring sends the Weekly Dose of Optimism, a roundup of promising stories in
          medicine, models and other research; the 215th edition appeared on October 16, 2026. The
          paid section, not boring world, publishes essays by founders and researchers written with
          McCormick's help.
        source_ids: [about, dose-215]
  - heading: Essays
    paragraphs:
      - text: >-
          McCormick often co-writes long essays with founders. In August 2025, McCormick and Sam
          D'Amico published "The Electric Slide", a history of the modern electric technology stack,
          which McCormick later included among the five favorite Not Boring essays of 2025.
        source_ids: [electric-slide, favorites-2025]
