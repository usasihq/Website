sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Micron, Bhatia held executive roles at Western Digital, SanDisk and Matrix Semiconductor, and worked
          as a consultant with McKinsey & Company. Bhatia joined Micron in 2017 and is now its President and Chief
          Operating Officer.
        source_ids: [micron-bio, micron-leadership]
      - text: >-
          Bhatia leads Micron's four business units together with fab and assembly/test manufacturing, global
          procurement and supply chain, global government and public affairs, information technology, smart
          manufacturing and artificial intelligence, with accountability for Micron's operating results across
          capital investment, manufacturing execution, and customer demand, pricing and delivery.
        source_ids: [micron-bio]
  - heading: Board service and recognition
    paragraphs:
      - text: >-
          Bhatia serves on the board of the quantum computing company Quantinuum and is a board member of the
          U.S.-Japan Business Council and the Singapore Economic Development Board. In 2024 Bhatia received
          Singapore's Public Service Medal (Friends of Singapore) for contributions to the country's semiconductor
          industry.
        source_ids: [micron-bio]
