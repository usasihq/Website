headline: President and Chief Operating Officer of Micron Technology, overseeing business units and operations
bio:
  text: >-
    Manish Bhatia is President and Chief Operating Officer of Micron Technology. Bhatia joined Micron in 2017 and
    leads the company's business units and global operations, which together form its Enterprise Business
    Organization, with a scope that includes fab and assembly/test manufacturing, supply chain, information
    technology, smart manufacturing and artificial intelligence.
