headline: Co-founder and Core Investigator at Arc Institute; leads the Hsu Lab behind the Evo genome models
bio:
  text: >-
    Patrick Hsu is a co-founder and Core Investigator of the Arc Institute and an Assistant Professor
    of Pathology at Stanford University. Hsu's lab works where biology meets machine learning to build
    tools for biological design, including the Evo series of genome foundation models and programmable
    bridge recombinases for rearranging DNA.
  source_ids: [arc-hsu-lab, arc-about]
  reviewed_at: 2026-10-21
