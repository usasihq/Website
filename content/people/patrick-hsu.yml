work:
  - name: Evo 2
    artifact_slug: evo-2
    type: open-weights
    url: https://github.com/ArcInstitute/evo2
    contribution: >-
      Co-author of the Evo 2 paper, published in Nature in March 2026, on a DNA foundation model
      trained on genomes from all domains of life for prediction and design across DNA, RNA and proteins.
      Arc Institute releases the model code on GitHub under the Apache-2.0 license.
    source_ids: [nature-evo2, arc-evo, evo2-repo]
  - name: Evo
    artifact_slug: null
    type: open-weights
    url: https://github.com/evo-design/evo
    contribution: >-
      Co-author, with Brian Hie among others, of the first Evo paper, published in Science in November 2024, on sequence modeling
      and design from the molecular to the genome scale.
    source_ids: [arc-evo, arc-hsu-lab, evo-repo]
  - name: Bridge RNAs
    artifact_slug: null
    type: open-research
    url: https://www.nature.com/articles/s41586-024-07552-4
    contribution: >-
      Last author of the 2024 Nature paper showing that bridge RNAs direct programmable recombination
      of target and donor DNA; the paper links code and a Python package for designing bridge RNA sequences.
    source_ids: [nature-bridge]
links:
  - label: Hsu Lab at Arc Institute
    url: https://arcinstitute.org/labs/hsulab
sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hsu co-founded the Arc Institute with Silvana Konermann and Patrick Collison; the three had
          earlier worked together on Fast Grants, a program for rapid science funding. Arc was founded in
          2021 as an independent nonprofit research organization working in partnership with Stanford,
          UC Berkeley and UC San Francisco.
        source_ids: [arc-about, arc-hsu-lab]
      - text: >-
          Arc's lab page lists A.M. and Ph.D. degrees from Harvard University and the Broad Institute of
          MIT and Harvard, where Hsu worked on early CRISPR-Cas9 genome-editing technologies. Hsu also
          holds a faculty appointment in pathology at Stanford University.
        source_ids: [arc-hsu-lab]
  - heading: Research
    paragraphs:
      - text: >-
          The Hsu Lab develops technologies for biological design at the boundary of biology and machine
          learning. Its Evo models are trained on genomic sequence: the first Evo paper appeared in
          Science in November 2024, and Evo 2, first released as a preprint in February 2025, was published
          in Nature in March 2026.
        source_ids: [arc-hsu-lab, arc-evo, arc-evo-news, nature-evo2]
      - text: >-
          A second line of work concerns bridge recombinases, an RNA-guided system that can insert, invert
          or excise DNA segments. The lab, often with the Konermann Lab, has followed its 2024 Nature paper
          on bridge RNAs with work on megabase-scale rearrangement of the human genome, published in
          Science in September 2025.
        source_ids: [nature-bridge, arc-hsu-lab, arc-about]
