headline: Apple senior vice president of Software Engineering, also responsible for Apple's core AI efforts
bio:
  text: >-
    Craig Federighi is Apple's senior vice president of Software Engineering, overseeing the development of
    Apple's software platforms, including iOS, iPadOS, macOS, watchOS, and visionOS. Apple's leadership page
    says Federighi also leads the company's core AI efforts, including the development of foundation models,
    applied AI technologies, and the research behind Apple Intelligence and Siri. Federighi returned to
    Apple in 2009 to lead macOS engineering and took on iOS in 2012, after earlier work at NeXT and Apple and
    a decade at Ariba, where roles included chief technology officer. Apple's December 2025 announcement
    added a vice president of AI to Federighi's leadership team, covering Apple Foundation Models, ML
    research, and AI Safety and Evaluation.
  source_ids: [apple-leadership, apple-2025-release]
  reviewed_at: 2026-10-13
