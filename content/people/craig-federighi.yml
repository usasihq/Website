sections:
  - heading: Career
    paragraphs:
      - text: >-
          Federighi worked at NeXT, then at Apple, and then spent a decade at Ariba, where roles included vice
          president of Internet Services and chief technology officer. Federighi returned to Apple in 2009 to
          lead Mac OS X engineering.
        source_ids: [apple-2012-svp, apple-leadership]
      - text: >-
          In August 2012 Apple promoted Federighi from vice president to senior vice president of Mac Software
          Engineering and named Federighi to the executive management team. Two months later Apple announced
          that Federighi would lead both iOS and OS X, bringing the company's operating system teams together.
        source_ids: [apple-2012-svp, apple-2012-ios]
  - heading: Software and AI responsibilities
    paragraphs:
      - text: >-
          As senior vice president of Software Engineering, Federighi oversees iOS, iPadOS, macOS, watchOS,
          and visionOS, with teams responsible for the user interface, applications, and frameworks, as well
          as privacy and security protections across Apple's platforms. Apple's leadership page lists
          Federighi as reporting to CEO John Ternus.
        source_ids: [apple-leadership]
      - text: >-
          Federighi also leads Apple's core AI efforts, covering foundation models, applied AI technologies,
          and the research behind Apple Intelligence and Siri. In December 2025 Apple announced that Amar
          Subramanya had joined as vice president of AI reporting to Federighi, leading Apple Foundation
          Models, ML research, and AI Safety and Evaluation.
        source_ids: [apple-leadership, apple-2025-release]
