sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kumar completed a PhD in Computer Science and Engineering at the University of Washington,
          advised by Emanuel Todorov and Sergey Levine, with a thesis on manipulators and
          manipulation in high-dimensional spaces. Kumar's CV then lists a role as a member of
          technical staff at OpenAI in 2017, a research scientist position at Google Brain from 2018
          to 2019, and a research scientist role at FAIR (Meta AI) from 2020 to 2023.
        source_ids: [cv, thesis-page]
      - text: >-
          Since January 2023 Kumar has been an Adjunct Professor at the Carnegie Mellon University
          Robotics Institute, and since May 2023 the co-founder and CEO of MyoLab.ai. MyoLab describes
          its work as building human-aware embodied intelligence, including a foundation model it
          calls MyoSapiens.
        source_ids: [cv, homepage, myolab-site]
  - heading: Research
    paragraphs:
      - text: >-
          Kumar's research looks at embodied movement across biological, digital and
          electromechanical systems, combining machine learning, biomechanics, robotics and optimal
          control. The doctoral work produced the ADROIT manipulation platform, a 28-degree-of-freedom
          arm-and-hand system driven by custom pneumatic actuation, together with methods for
          synthesizing dexterous behavior on physical hardware.
        source_ids: [homepage, thesis-page]
      - text: >-
          Kumar's publication list spans dexterous manipulation, model-based and multi-task robot
          learning, visual representations for robots such as R3M, and benchmarks such as ROBEL,
          a set of low-cost robots for learning research introduced in 2019 with colleagues
          including Sergey Levine.
        source_ids: [publications, robel-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Kumar is listed as lead creator of MyoSuite and RoboHive and as a founding member of the
          MuJoCo physics engine and the TorchRL library. MyoSuite, introduced in a 2022 paper,
          offers contact-rich musculoskeletal motor-control tasks simulated in MuJoCo, and RoboHive,
          described in a 2023 paper with Kumar as first author, gathers robot-learning environments
          under one framework.
        source_ids: [homepage, bio-page, myosuite-paper, robohive-paper, myosuite-repo, robohive-repo]
