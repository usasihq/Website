headline: Co-founder and CEO of Myolab.ai and CMU adjunct professor; lead creator of MyoSuite and RoboHive
bio:
  text: >-
    Vikash Kumar is the co-founder and CEO of Myolab.ai and an Adjunct Professor at the Carnegie Mellon
    University Robotics Institute, and previously held research scientist roles at FAIR (Meta AI),
    Google Brain and OpenAI. Kumar's research covers embodied movement
    across biological, digital and electromechanical systems, using machine learning, biomechanics,
    robotics and optimal control. Kumar's homepage lists Kumar as lead creator of MyoSuite and
    RoboHive, two Apache-2.0 collections of environments simulated with the MuJoCo physics engine, and
    as a founding member of MuJoCo and TorchRL.
  source_ids: [homepage, myosuite-repo, robohive-repo]
