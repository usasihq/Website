headline: Professor at the University of Liège leading the Science with AI Lab; former scikit-learn core developer
bio:
  text: >-
    Gilles Louppe is a Professor at the University of Liège and the group leader of the Science
    with AI Lab (SAIL) at the Montefiore Institute. Louppe's research covers deep generative
    models, approximate Bayesian inference and simulation-based inference, applied with domain
    scientists in fields such as particle physics, astrophysics and neuroscience. Before joining
    the Liège faculty, Louppe was a Postdoctoral Associate at New York University's Center for
    Data Science and Center for Cosmology and Particle Physics (2015–2017), after a Marie-Curie
    fellowship at CERN. From 2010 to 2015 Louppe was a core developer of scikit-learn, and the
    course materials for Louppe's teaching are published openly.
  source_ids: [homepage, cv, sklearn-about]
  reviewed_at: 2026-10-21
