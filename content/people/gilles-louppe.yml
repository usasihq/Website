sections:
  - heading: Career
    paragraphs:
      - text: >-
          Gilles Louppe completed a PhD in computer science at the University of Liège from 2010 to 2014,
          supervised by Pierre Geurts, with a thesis titled Understanding Random Forests, From Theory to
          Practice. During the same years Louppe was an FRS-FNRS Research Fellow at Liège and a core
          developer of scikit-learn.
        source_ids: [cv, random-forests-thesis]
      - text: >-
          Louppe then held a Marie-Curie fellowship at CERN from 2014 to 2015 and was a Postdoctoral
          Associate at New York University's Center for Data Science and Center for Cosmology and
          Particle Physics from 2015 to 2017. Louppe returned to Liège as an Assistant Professor in 2017
          and has been a Professor there since 2023, leading the Science with AI Lab at the Montefiore
          Institute.
        source_ids: [cv, homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Louppe's research develops deep learning models and statistical methods for scientific
          applications, with an emphasis on Bayesian inverse problems in the physical sciences. The CV
          describes work on simulation-based inference with deep neural networks, carried out with
          collaborators in particle physics, astrophysics, astronomy, biophysics, and neuroscience, and
          names Earth and climate sciences as the next area of focus.
        source_ids: [homepage, cv]
      - text: >-
          With Kyle Cranmer and Johann Brehmer, Louppe wrote "The frontier of simulation-based
          inference" (2019), a review prepared for the Sackler Colloquia of the US National Academy of
          Sciences. Louppe has co-organized the NeurIPS workshop on Machine Learning and the Physical
          Sciences and serves as an area chair for NeurIPS, ICML, ICLR, and AISTATS.
        source_ids: [sbi-frontier-paper, cv]
  - heading: Teaching and open-source work
    paragraphs:
      - text: >-
          Louppe teaches multi-year courses in Introduction to AI, Foundations of Data Science, Deep
          Learning, and Advanced Machine Learning, and publishes all course materials openly. Louppe was a
          core developer of scikit-learn from 2010 to 2015 and is listed among the project's emeritus
          maintainers; the library is distributed under the BSD 3-Clause License.
        source_ids: [cv, sklearn-about, sklearn-license]
