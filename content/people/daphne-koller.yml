sections:
  - heading: Career
    paragraphs:
      - text: >-
          Daphne Koller spent 18 years on the computer science faculty at Stanford University, where Koller held
          the Rajeev Motwani Professorship and remains an adjunct faculty member. Koller co-founded the online
          learning platform Coursera, serving as co-CEO and president, and later co-founded Engageli, an
          interactive digital learning platform.
        source_ids: [koller-insitro]
      - text: >-
          Koller was formerly chief computing officer of Calico, an Alphabet company working in health, and
          founded insitro in 2018. insitro applies machine learning to drug discovery and development, and Koller leads
          it as CEO and serves on its board.
        source_ids: [koller-insitro, insitro-about]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Koller's research has appeared in venues ranging from Science, Cell and Nature Genetics to NeurIPS
          and ICML. Koller is listed as the instructor of the Probabilistic Graphical Models specialization that
          Stanford Online offers on Coursera, and Stanford recognized Koller's teaching with its Medal for Excellence in
          Fostering Undergraduate Research and a Bass University Fellowship in Undergraduate Education.
        source_ids: [koller-insitro, pgm-coursera]
