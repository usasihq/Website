headline: Founder and CEO of insitro, Coursera co-founder, and Stanford adjunct professor of computer science
bio:
  text: >-
    Daphne Koller is the founder and CEO of insitro, a machine learning-driven drug discovery and
    development company. Koller was the Rajeev Motwani Professor of computer science at Stanford
    University, on the faculty for 18 years, and remains an adjunct faculty member. Koller
    co-founded the online education platform Coursera, where Koller was co-CEO and president,
    co-founded the digital learning platform Engageli, and was formerly chief computing officer of
    Calico, an Alphabet company. Koller is listed as the instructor of the Probabilistic Graphical
    Models specialization offered by Stanford Online on Coursera.
  source_ids: [koller-insitro, koller-stanford, pgm-coursera]
  reviewed_at: 2026-10-13
