sections:
  - heading: Career
    paragraphs:
      - text: >-
          DeBoer joined Micron in 1995 as a process technology engineer and held a series of technical and
          managerial positions, becoming vice president of Process R&D in 2007, executive vice president of
          Technology Development in 2017, and executive vice president of Technology and Products in 2019. In 2026
          DeBoer was appointed president and chief technology and products officer.
        source_ids: [micron-bio]
      - text: >-
          In the current role, DeBoer's organization includes Micron's core global technology, engineering and
          product development functions, along with test systems engineering, global quality, corporate strategy
          and Micron Ventures, and DeBoer oversees Micron Research Labs.
        source_ids: [micron-bio]
  - heading: Technical work and service
    paragraphs:
      - text: >-
          Micron credits DeBoer with directing the development and delivery of many technology nodes and with
          authoring technical publications and holding U.S. patents. DeBoer serves on the U.S. Department of
          Energy Office of Science Advisory Committee, on the board of Idaho Business for Education, and on the
          governing council of the Semiconductor Research Corporation's JUMP and nCORE research initiatives.
        source_ids: [micron-bio]
