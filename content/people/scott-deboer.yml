headline: President and Chief Technology and Products Officer of Micron Technology, overseeing Micron Research Labs
bio:
  text: >-
    Scott DeBoer is President and Chief Technology and Products Officer of Micron Technology, responsible for the
    company's memory and storage roadmap. DeBoer's organization covers Micron's core technology, engineering and
    product development functions, and DeBoer oversees Micron Research Labs, the company's research hub for memory
    and compute technologies. DeBoer joined Micron in 1995 as a process technology engineer.
  source_ids: [micron-bio, micron-leadership]
  reviewed_at: 2026-10-22
