headline: Co-founder of the Gradio library and machine learning team lead at Hugging Face
bio:
  text: >-
    Abubakar Abid co-founded Gradio, an open-source Python library for building web interfaces and
    demos for machine learning models, during PhD research at Stanford; Hugging Face announced its
    acquisition of Gradio in December 2021. Hugging Face's LLM Course describes Abid as a machine
    learning team lead at Hugging Face, and Abid's GitHub profile says Abid works on Gradio at
    Hugging Face. Abid is first author of the 2019 Gradio paper, which presented the package as a
    way for researchers to generate a visual interface for a model so collaborators without ML
    tooling can test it and give feedback.
  source_ids: [hf-course, gradio-joins-hf, github-profile, gradio-paper]
  reviewed_at: 2026-10-13
