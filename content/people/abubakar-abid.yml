sections:
  - heading: Career
    paragraphs:
      - text: >-
          Abubakar Abid started Gradio in 2019 while a PhD student at Stanford, after struggling to
          share a medical computer vision model with a collaborator who could not run Python. Abid
          recruited Ali Abdalla, Ali Abid, and Dawood Khan to release the first version that year.
        source_ids: [gradio-joins-hf]
      - text: >-
          Hugging Face announced its acquisition of Gradio in December 2021, and Abid continued
          working on Gradio at Hugging Face, where the LLM Course describes Abid as a machine learning
          team lead. Abid is also one of the authors of Hugging Face's LLM Course.
        source_ids: [gradio-joins-hf, github-profile, hf-course]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Gradio lets developers build web interfaces and demos for machine learning models in a few
          lines of Python. The 2019 Gradio paper, with Abid as first author, presented it as a way for
          researchers to let collaborators without ML tooling test a model and give feedback.
        source_ids: [gradio-paper, gradio-readme]
      - text: >-
          In October 2024, Abid announced the stable release of Gradio 5, aimed at building
          production-ready machine learning web apps with attention to performance, accessibility,
          and web security. In April 2025, Abid and Yuvraj Sharma described how Gradio apps can run
          as Model Context Protocol (MCP) servers whose tools language models can use.
        source_ids: [gradio-5-blog, gradio-mcp-blog]
  - heading: Research
    paragraphs:
      - text: >-
          Abid's doctoral work at Stanford was in applied machine learning. With
          Muhammad Fatih Balin and James Zou, Abid introduced concrete autoencoders in 2019, a way to
          select a small set of input features while still reconstructing the full input.
        source_ids: [concrete-ae-paper, hf-course]
