sections:
  - heading: Career
    paragraphs:
      - text: >-
          Scholak held a postdoctoral position at the University of Toronto before moving to industry at Unata
          and then Element AI.
          Element AI was acquired by ServiceNow in 2021.
        source_ids: [scholak-site]
      - text: >-
          At ServiceNow Research, Scholak leads the Foundation Model Lab and co-founded the ServiceNow Language
          Model (SLAM) initiative. Scholak's current focus is the Apriel family of open-weight models built for
          enterprise agentic tasks and efficient inference.
        source_ids: [scholak-site, github-profile]
  - heading: Research and open-source work
    paragraphs:
      - text: >-
          With Nathan Schucher and Dzmitry Bahdanau, Scholak wrote PICARD (2021), a method for constraining
          autoregressive decoding from language models by parsing incrementally, applied to text-to-SQL
          parsing. Scholak also co-organized the Deep Learning for Code workshop at ICLR 2022 and 2023 and
          helped build Hasktorch, a library for GPU-accelerated machine learning in Haskell.
        source_ids: [picard-paper, scholak-site]
      - text: >-
          Scholak was technical co-lead for pre-training and architecture on Apriel-1.5-15B-Thinker (2025),
          co-authored the release post for Apriel-1.6-15B-Thinker (2025), and led the Super Apriel project
          (2026), whose paper lists Scholak as a core contributor. Scholak is also a co-author of the StarCoder 2 paper (2024).
        source_ids: [apriel15-html, apriel16-blog, superapriel-html, starcoder2-paper]
