headline: Leads the Foundation Model Lab at ServiceNow Research; technical co-lead of the Apriel open-weight models
bio:
  text: >-
    Torsten Scholak leads the Foundation Model Lab at ServiceNow Research and co-founded the ServiceNow
    Language Model (SLAM) initiative, which develops the Apriel family of open-weight models for enterprise
    agentic tasks. Scholak was technical co-lead for pre-training and architecture on Apriel-1.5-15B-Thinker,
    is listed among the leads of Apriel-1.6-15B-Thinker, and led the Super Apriel project. Earlier
    work includes the PICARD constrained-decoding method for text-to-SQL parsing and the Hasktorch library.
  source_ids: [scholak-site, apriel15-html, apriel16-blog, superapriel-html, picard-paper]
  reviewed_at: 2026-10-22
