headline: President of Replit, where Catasta led the Replit Agent projects; former Google X applied research head
bio:
  text: >-
    Michele Catasta is the President of Replit, which Catasta joined in 2023 as VP of AI, and has led
    the projects behind Replit Agent and its later versions, Agent 3 and Agent 4. Before Replit,
    Catasta was Head of Applied Research at Google X and Google Labs, working on large language models
    for code including PaLM and PaLM 2; Catasta has also been a research scientist and instructor in AI at
    Stanford University.
  source_ids: [replit-about, catasta-readme, replit-ai-manifesto]
  reviewed_at: 2026-10-22
