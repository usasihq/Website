sections:
  - heading: Career
    paragraphs:
      - text: >-
          Catasta was a postdoc in machine learning at Stanford University advised by Jure Leskovec, and
          worked as a research scientist and instructor in AI at Stanford. Earlier, Catasta co-founded Sindice.com, a Semantic Web search engine whose technology
          evolved into the Apache Any23 project.
        source_ids: [catasta-readme]
      - text: >-
          At Google X and Google Labs, Catasta was Head of Applied Research, working on large language models
          for code, including PaLM-Coder and code pre-training and evaluation for PaLM 2, and designed the
          Google AI4Code Kaggle challenge. Catasta joined Replit as VP of AI in June 2023 and is now listed as
          the company's President.
        source_ids: [catasta-readme, replit-ai-manifesto, replit-about]
  - heading: Work at Replit
    paragraphs:
      - text: >-
          Catasta published the Replit AI Manifesto on joining the company and was principal investigator
          for Replit Code Repair, announced in April 2024. Catasta led the Replit Agent project, launched in
          September 2024, and its later versions, including Agent 4 in March 2026.
        source_ids: [replit-ai-manifesto, catasta-readme, replit-agent-post, replit-agent4-post]
      - text: >-
          Catasta was one of the instructors, with Andrew Ng, of the "Vibe Coding 101 with Replit" short
          course on DeepLearning.AI in 2025, and was principal investigator of ViBench, a benchmark on vibe
          coding accepted at ACM CAIS 2026.
        source_ids: [catasta-readme]
