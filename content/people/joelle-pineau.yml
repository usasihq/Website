headline: Chief AI Officer at Cohere and McGill professor; led Meta's FAIR research team from 2017 to 2025
bio:
  text: >-
    Joelle Pineau is Chief AI Officer at Cohere, where the company's about page lists Pineau on the
    executive team, and a Professor at McGill University's School of Computer Science and a core
    member of Mila; Pineau's McGill page notes a current part-time leave from McGill. From 2017 to
    2025, Pineau was VP of AI research at Meta, heading its Fundamental AI Research (FAIR) team.
    Pineau's research develops models and algorithms for planning and learning in complex domains,
    with applications in robotics, healthcare, and conversational agents. Pineau created the ML
    Reproducibility Checklist and the ML Reproducibility Challenge, served as the inaugural
    Reproducibility Chair of NeurIPS, and is a Fellow of AAAI and of the Royal Society of Canada.
