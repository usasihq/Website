sections:
  - heading: Career
    paragraphs:
      - text: >-
          Joelle Pineau is Chief AI Officer at Cohere, where the company's about page lists Pineau on
          the executive team. Pineau is also a Professor in McGill University's School of Computer
          Science and a core member of Mila, and is currently on part-time leave from McGill.
        source_ids: [cohere-about, mcgill-page]
      - text: >-
          From 2017 to 2025 Pineau was VP of AI research at Meta, leading its Fundamental AI Research
          (FAIR) team. Pineau is a past President of the International Machine Learning Society.
        source_ids: [mcgill-page]
  - heading: Research
    paragraphs:
      - text: >-
          Pineau's research develops models and algorithms for planning and learning in complex domains,
          and applies them to real-world problems in robotics, healthcare and conversational agents.
          Pineau's McGill page also notes a CIFAR Canada AI chair.
        source_ids: [mcgill-page]
  - heading: Reproducibility work
    paragraphs:
      - text: >-
          Pineau created the Machine Learning Reproducibility Checklist and the ML Reproducibility
          Challenge, and was the inaugural Reproducibility Chair of the NeurIPS conference. Pineau is
          first author of the 2020 report on the NeurIPS 2019 reproducibility program, which describes
          the code submission policy, the reproducibility challenge and the checklist used at the
          conference.
        source_ids: [mcgill-page, reproducibility-paper]
      - text: >-
          Pineau is on the keynote program for PyTorch Conference North America 2026, representing
          Cohere, with a talk titled "Open Science and AI Foundation Models: Allies in the Pursuit of
          Knowledge."
        source_ids: [keynote-na26]
