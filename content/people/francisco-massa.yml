    source_ids: [pytorch-paper]
links:
  - label: GitHub
    url: https://github.com/fmassa
sections:
  - heading: Research
    paragraphs:
      - text: >-
          Massa's early papers, written with Mathieu Aubry and Renaud Marlet, studied convolutional networks
          for detecting objects and estimating their pose and viewpoint, comparing approaches in 2014 and
          designing a multi-task network for viewpoint estimation in 2016.
        source_ids: [pose-paper, viewpoint-paper]
      - text: >-
          Massa was second author of DETR, which treats object detection as set
          prediction with a transformer, and co-authored DeiT, a method for training image transformers
          efficiently with distillation. Later work included the self-supervised vision models DINOv2 and DINOv3,
          a hybrid transformer for music source separation, and the CWM open-weights code model.
        source_ids: [detr-paper, deit-paper, dinov2-paper, dinov3-paper, music-paper, cwm-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Massa is the third author of the 2019 PyTorch paper describing the library's imperative,
          Pythonic programming style. PyTorch's persons-of-interest page lists Massa as an emeritus maintainer of
          TorchVision, and Massa is named in the citation entry of the Detectron2 detection and segmentation
          library.
        source_ids: [pytorch-paper, pytorch-poi, detectron2-readme]
timeline:
  - date: "2014-12"
    text: Posted a comparative study of convolutional networks for joint object detection and pose estimation as first author.
    source_ids: [pose-paper]
  - date: "2016-09"
    text: Posted "Crafting a multi-task CNN for viewpoint estimation" as first author.
    source_ids: [viewpoint-paper]
  - date: "2019-12"
    text: 'Co-authored "PyTorch: An Imperative Style, High-Performance Deep Learning Library".'
    source_ids: [pytorch-paper]
  - date: "2020-05"
    text: Co-authored DETR, end-to-end object detection with transformers, as second author.
    source_ids: [detr-paper]
  - date: "2020-12"
    text: Co-authored DeiT, on training data-efficient image transformers with distillation.
    source_ids: [deit-paper]
  - date: "2022-11"
    text: Co-authored "Hybrid Transformers for Music Source Separation".
    source_ids: [music-paper]
  - date: "2023-04"
    text: Co-authored DINOv2, on learning robust visual features without supervision.
    source_ids: [dinov2-paper]
  - date: "2025-08"
    text: Co-authored the DINOv3 vision foundation model paper.
    source_ids: [dinov3-paper]
  - date: "2025-09"
    text: Co-authored CWM, an open-weights language model for research on code generation with world models.
    source_ids: [cwm-paper]
