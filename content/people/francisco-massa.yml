slug: francisco-massa
name: Francisco Massa
initials: FM
groups: [open-source, engineering]
specialties: [ml-frameworks, vision]
headline: Emeritus TorchVision maintainer and co-author of Meta's DINOv3, DETR and Detectron2
bio:
  text: >-
    Francisco Massa lists Facebook AI Research as employer on GitHub. PyTorch's persons-of-interest
    page names Massa as an emeritus maintainer of TorchVision, the PyTorch computer vision library.
    Massa is a co-author of Meta's DINOv3 vision foundation model (2025), whose code and weights are
    released under the DINOv3 License, the second author of DETR (End-to-End Object Detection with
    Transformers), and is listed in the citation entry for the Detectron2 library.
  source_ids: [github-profile, pytorch-poi, dinov3-paper, dinov3-readme, detr-paper, detectron2-readme]
  reviewed_at: 2026-10-21
affiliations:
  - name: Meta (Facebook AI Research)
    organization_slug: meta
    role: Facebook AI Research, as listed on GitHub profile
    current: false
    source_ids: [github-profile]
work:
