    url: https://github.com/facebookresearch/dinov3
    contribution: >-
      Listed among the authors of the DINOv3 paper (2025) and in the repository README, which
      credits Meta AI Research, FAIR, and releases the code and model weights under the DINOv3
      License.
    source_ids: [dinov3-paper, dinov3-readme]
  - name: TorchVision
