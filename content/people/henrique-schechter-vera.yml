headline: Google DeepMind research engineer; first author of the EmbeddingGemma paper
bio:
  text: >-
    Henrique Schechter Vera is a research engineer at Google DeepMind. Schechter Vera is first author
    of "EmbeddingGemma: Powerful and Lightweight Text Representations" (2025), the paper describing
    the open EmbeddingGemma 300M text embedding model, and co-wrote the October 2026 launch post for
    EmbeddingGemma 2. Schechter Vera is also a co-author of the Gemini Embedding paper (2025).
  source_ids: [eg2-post, eg-paper, gemini-embedding-paper]
  reviewed_at: 2026-10-22
