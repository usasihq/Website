      - text: >-
          Schechter Vera's recent papers concern text embedding models. Schechter Vera co-authored the
          Gemini Embedding paper in March 2025 and was first author of the EmbeddingGemma paper in
          September 2025, which introduced a lightweight open embedding model built on Gemma.
        source_ids: [gemini-embedding-paper, eg-paper, eg2-post]
      - text: >-
