sections:
  - heading: Research
    paragraphs:
      - text: >-
          Rishi Bommasani studies the societal and economic impact of frontier AI. As a Stanford PhD student
          advised by Percy Liang and Dan Jurafsky, Bommasani was first author of the 2021 report "On the
          Opportunities and Risks of Foundation Models," and was one of the joint lead authors of HELM, the
          2022 framework for holistic evaluation of language models.
        source_ids: [bommasani-bio, cv, fm-paper, helm-paper]
      - text: >-
          Bommasani was also first author of the Foundation Model Transparency Index, first published in October 2023, which
          scores how much information foundation model developers disclose; the 2023 and 2024 editions
          appeared in Transactions on Machine Learning Research, with the 2023 index named an outstanding
          paper. Other recent work examines third-party evaluation and flaw disclosure for general-purpose AI
          and reporting of train-test overlap.
        source_ids: [cv, fmti-paper]
  - heading: Career and policy work
    paragraphs:
      - text: >-
          Bommasani completed a B.A. and M.S. at Cornell University advised by Claire Cardie, then a Stanford
          PhD from 2020 to 2025, and is now a senior research scholar at Stanford HAI. Bommasani's CV lists
          co-founding the Stanford Center for Research on Foundation Models and founding Stanford AI Policy.
        source_ids: [cv, bommasani-site]
      - text: >-
          Bommasani was lead author of the California Report on Frontier AI Policy, served as an independent
          expert chair for the EU AI Act Code of Practice, and is an author of the International Scientific
          Report on the Safety of Advanced AI.
        source_ids: [bommasani-bio, cv]
