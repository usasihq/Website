headline: Senior Research Scholar at Stanford HAI; HELM co-author and first author of the foundation models report
bio:
  text: >-
    Rishi Bommasani is a senior research scholar at Stanford's Institute for Human-Centered
    Artificial Intelligence (HAI), researching the societal and economic impact of frontier AI.
    Bommasani received a PhD in computer science from Stanford, advised by Percy Liang and Dan
    Jurafsky. Bommasani is the second-listed author of the HELM paper on holistic evaluation of
    language models and first author of "On the Opportunities and Risks of Foundation Models," the
    2021 report that called models trained on broad data at scale and adapted to many tasks
    foundation models.
