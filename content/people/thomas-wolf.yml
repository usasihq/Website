slug: thomas-wolf
name: Thomas Wolf
initials: TW
headline: Co-founder and Chief Science Officer of Hugging Face; created the Transformers library
bio:
  text: >-
    Thomas Wolf is a co-founder and the Chief Science Officer of Hugging Face. Wolf's site lists
    Transformers among the libraries Wolf created, and Wolf made the repository's first commit in 2018
    and is first author of the paper describing the library, whose Pipeline API downloads a pretrained
    model, caches it for reuse, and runs it. Wolf also made the first commit to Hugging
    Face's Accelerate library in 2020 and is among the authors of the 2025 announcement of SmolLM3, a
    3B-parameter model.
  source_ids: [wolf-site, github-profile, transformers-initial-commit, transformers-paper, transformers-readme, accelerate-initial-commit, smollm3-post]
  reviewed_at: 2026-10-01
