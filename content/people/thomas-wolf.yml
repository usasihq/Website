    organization_slug: hugging-face
    role: Co-founder and Chief Science Officer (CSO)
    current: true
    source_ids: [wolf-site, github-profile]
work:
  - name: Transformers
    artifact_slug: transformers
    url: https://github.com/huggingface/transformers
    contribution: >-
      Listed on Wolf's site as a library Wolf created. Wolf made the repository's initial commit in
      October 2018 and is first author of the Transformers paper, which the README asks users to cite.
      The README's quickstart loads a model through the Pipeline API, which downloads and caches it
      for reuse.
    source_ids: [wolf-site, transformers-initial-commit, transformers-paper, transformers-readme]
  - name: Accelerate
    artifact_slug: null
    url: https://github.com/huggingface/accelerate
    contribution: >-
      Made the repository's initial commit in October 2020 and is listed among the authors in the
      README's citation entry; Wolf's site names Accelerate among the libraries Wolf created or
      advised.
    source_ids: [accelerate-initial-commit, accelerate-readme, wolf-site]
  - name: SmolLM3
    artifact_slug: smollm
    url: https://huggingface.co/blog/smollm3
    contribution: >-
      Listed among the authors of Hugging Face's July 2025 announcement of SmolLM3, a 3B-parameter
      model in the SmolLM series.
    source_ids: [smollm3-post]
