sections:
  - heading: Career
    paragraphs:
      - text: >-
          Thomas Wolf's first career was in physics: Wolf worked on
          laser-plasma interactions at the BELLA Center of Lawrence Berkeley National Laboratory and earned
          a PhD in statistical and quantum physics at Sorbonne University and ESPCI. Wolf then worked as a
          patent attorney at the IP firm Cabinet Plasseraud for five years. Consulting for deep learning
          startups around 2015 led Wolf to machine learning, and about a year later Wolf joined the
          founding of Hugging Face.
        source_ids: [wolf-site]
      - text: >-
          At Hugging Face, where Wolf is co-founder and Chief Science Officer, Wolf's site describes
          involvement from the start in the company's open-source, open-science and robotics efforts. Wolf's
          current research interest is whether AI systems can help produce new scientific knowledge.
        source_ids: [wolf-site, github-profile]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Wolf's site lists the Transformers, Datasets, Diffusers, Accelerate, DataTrove, smolagents and
          LeRobot libraries among those Wolf created or advised. Wolf made the first commits to the
          Transformers repository in October 2018 and the Accelerate repository in October 2020.
        source_ids: [wolf-site, transformers-initial-commit, accelerate-initial-commit]
      - text: >-
          Wolf has also worked on open-science projects such as the BigScience Workshop, which led to the
          BLOOM model and dataset, the FineWeb dataset and the Ultra-Scale Playbook. Wolf is among the
          authors of the July 2025 SmolLM3 announcement.
        source_ids: [wolf-site, smollm3-post]
  - heading: Publications
    paragraphs:
      - text: >-
          Wolf is first author of the 2019 Transformers paper, which Wolf's site lists as an EMNLP 2020 Best
          Demonstration Paper, and a co-author of the Datasets paper, an EMNLP 2021 Best Demonstration Paper.
          Wolf also co-authored DistilBERT (2019), a distilled version of BERT, and TransferTransfo (2018),
          a transfer learning approach for conversational agents.
        source_ids: [transformers-paper, datasets-paper, distilbert-paper, wolf-site]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Wolf co-authored the O'Reilly book Natural Language Processing with Transformers and produced
          educational material including the Ultra-Scale Playbook. Wolf co-taught a tutorial on transfer
          learning in NLP at NAACL 2019 and a tutorial on neural language generation at EMNLP 2020.
        source_ids: [wolf-site]
