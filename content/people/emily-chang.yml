headline: Host and executive producer of The Circuit with Emily Chang and Posthuman at Bloomberg
bio:
  text: >-
    Emily Chang is a journalist and author at Bloomberg who covers technology, business, and
    culture. Emily is host and executive producer of The Circuit with Emily Chang on Bloomberg
    Television, which features interviews with founders and innovators, and of Posthuman, a
    Bloomberg Originals series about what it means to be human in an age of artificial
    intelligence. For more than a decade Emily anchored Bloomberg Technology, and is the author of
    the 2018 book Brotopia: Breaking Up the Boys' Club of Silicon Valley.
  source_ids: [bloomberg-talent]
