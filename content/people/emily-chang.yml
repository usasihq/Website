sections:
  - heading: Career
    paragraphs:
      - text: >-
          Emily Chang began as a news producer at NBC, then reported for KNSD, an NBC affiliate, where
          Chang filed reports for MSNBC. Chang later worked for CNN as an international correspondent,
          covering stories that included the 2008 Olympics, and also reported for CNN's American Morning.
        source_ids: [bloomberg-talent]
      - text: >-
          Chang joined Bloomberg in 2010 and for more than a decade anchored Bloomberg Technology, the
          network's daily program on innovation and the global technology industry. Chang now hosts and
          executive produces The Circuit with Emily Chang on Bloomberg Television and Posthuman, a
          Bloomberg Originals series about being human in an age of artificial intelligence.
        source_ids: [bloomberg-talent]
  - heading: Coverage
    paragraphs:
      - text: >-
          The Circuit features interviews with founders, innovators and cultural figures in business and
          technology. Chang's 2018 book, Brotopia: Breaking Up the Boys' Club of Silicon Valley, examines
          gender inequality in the technology industry.
        source_ids: [bloomberg-talent]
