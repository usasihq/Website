headline: Chief Business Officer of Supermicro; previously its SVP of Technology and AI
bio:
  text: >-
    Vik Malyala is the Chief Business Officer of Supermicro, which Malyala joined in 2009. At Supermicro Malyala previously served as Senior Vice President for
    Technology and AI and as president and managing director for EMEA. Malyala's background spans
    product engineering, ASIC development and technology leadership, including earlier work as a
    design engineer at ServerWorks.
