headline: AI and data science educator; YouTube creator and founder of KrishAI Technologies
bio:
  text: >-
    Krish Naik is an educator who explains machine learning, deep learning, NLP, and generative AI on
    a YouTube channel using real-world problem scenarios. Krish is the founder of KrishAI Technologies
    Private Limited, and through the Krish Naik Academy offers courses, live classes, bootcamps, and
    end-to-end projects, including a bootcamp on AI system design and infrastructure. Krish also
    teaches self-paced courses on Udemy and has given tech talks on data science, machine learning,
    and AI.
