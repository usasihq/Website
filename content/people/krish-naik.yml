sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Krish Naik's YouTube channel, which joined YouTube in February 2012, explains topics in machine
          learning, deep learning and AI through real-world problem scenarios. The channel's description
          presents Krish as the founder of KrishAI Technologies Private Limited, an educator and a mentor
          with industry experience in machine learning, deep learning and computer vision.
        source_ids: [youtube]
      - text: >-
          Krish also publishes the Krish Naik Academy Publication on Substack, and a GitHub profile of study
          materials and roadmaps, including collected data science materials, a Python bootcamp and
          roadmaps for learning data science and generative AI.
        source_ids: [substack, github-profile]
  - heading: Teaching
    paragraphs:
      - text: >-
          Through the Krish Naik Academy, a learning platform for data science, machine learning, deep
          learning, generative AI and big data founded by Krish, the site offers courses, mentor-led live
          classes and bootcamps, end-to-end industry projects, self-paced Udemy courses, webinars and
          corporate training. The academy describes its courses as built around industry applications,
          deployment and complete projects.
        source_ids: [site, substack]
      - text: >-
          A Complete AI System Design and Infrastructure Bootcamp is scheduled to start on January 3, 2027.
          Its curriculum covers AI-native software development with coding agents and inference engineering,
          including GPU sizing, benchmarking of serving engines such as vLLM and SGLang, batching, caching and
          quantisation.
        source_ids: [site]
