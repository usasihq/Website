sections:
  - heading: Early work
    paragraphs:
      - text: >-
          Prafulla Dhariwal works at OpenAI on generative models and unsupervised learning. Earlier
          papers Dhariwal co-authored include "Proximal Policy Optimization
          Algorithms" (2017) with John Schulman and others, and Glow (2018), a flow-based generative
          model with invertible 1x1 convolutions, written as co-first author with Diederik P. Kingma.
        source_ids: [dhariwal-site, ppo-paper, glow-paper]
      - text: >-
          Dhariwal was first author of Jukebox (2020), a generative model that produces music with
          singing as raw audio, and appears among the authors of "Language Models are Few-Shot
          Learners" (2020), the GPT-3 paper.
        source_ids: [jukebox-paper, dhariwal-site]
  - heading: Diffusion models and image generation
    paragraphs:
      - text: >-
          With Alex Nichol, Dhariwal co-first-authored "Improved Denoising Diffusion Probabilistic
          Models" (ICML 2021) and "Diffusion Models Beat GANs on Image Synthesis" (NeurIPS 2021), and
          OpenAI released MIT-licensed code and checkpoints for both. Dhariwal was also a co-first
          author of GLIDE (2021), a text-guided diffusion model for image generation and editing.
        source_ids: [iddpm-paper, adm-paper, improved-diffusion-repo, guided-diffusion-readme, guided-diffusion-license, glide-paper]
      - text: >-
          Dhariwal was a co-first author of the DALL·E 2 paper, "Hierarchical Text-Conditional Image
          Generation with CLIP Latents" (2022), co-authored Point·E (2022) for generating 3D point
          clouds from text prompts, and is listed among the authors of DALL·E 3. With Yang Song,
          Dhariwal co-authored "Consistency Models" (2023) and "Improved Techniques for Training
          Consistency Models" (2023), which generate samples in one or a few steps.
        source_ids: [dalle2-paper, pointe-paper, dhariwal-site, cm-paper, ict-paper, cm-readme]
