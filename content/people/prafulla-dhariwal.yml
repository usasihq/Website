headline: Research scientist at OpenAI; co-author of Diffusion Models Beat GANs, GLIDE, Jukebox, and Glow
bio:
  text: >-
    Prafulla Dhariwal is a research scientist at OpenAI working on generative models and unsupervised
    learning. Dhariwal is co-first author, with Alex Nichol, of "Improved Denoising Diffusion
    Probabilistic Models" and "Diffusion Models Beat GANs on Image Synthesis", whose MIT-licensed
    OpenAI codebases release checkpoints for the papers' main models, and a co-first author of GLIDE. Dhariwal is also
    first author of Jukebox, a generative model for music, and co-first author with Diederik P. Kingma
    of Glow. With Yang Song, Dhariwal co-authored the consistency models papers, whose PyTorch code
    OpenAI publishes under the MIT license.
  source_ids: [dhariwal-site, iddpm-paper, adm-paper, improved-diffusion-repo, guided-diffusion-readme, guided-diffusion-license, glide-paper, jukebox-paper, glow-paper, cm-paper, cm-readme]
  reviewed_at: 2026-10-13
