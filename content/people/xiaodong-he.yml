headline: Senior Vice President of JD Group; former head of Microsoft Research's Deep Learning Technology Center
bio:
  text: >-
    Xiaodong He is a Senior Vice President of JD Group (JD.com). Before
    joining JD.com, Xiaodong He worked at Microsoft Research as Principal Researcher and Head of the
    Deep Learning Technology Center, and Xiaodong He also serves as an Affiliate Professor at the
    University of Washington. Research interests include deep learning, speech, natural language,
    computer vision, and information retrieval; at Microsoft Research, Xiaodong He co-authored the deep
    structured semantic models (DSSM) paper for web search, the bottom-up and top-down attention method
    for image captioning and visual question answering, and AttnGAN for text-to-image generation.
    Xiaodong He is an IEEE Fellow.
