sections:
  - heading: Career
    paragraphs:
      - text: >-
          Xiaodong He worked at Microsoft Research as a Principal Researcher and head of its Deep
          Learning Technology Center. After joining JD.com, Xiaodong He became a Senior Vice President of JD Group and
          managing director of JD AI Research, and the IEEE MMSP 2025 programme also lists Xiaodong He as managing
          director of the JD Joy Future Academy.
        source_ids: [ieee-mmsp-2025]
      - text: >-
          Xiaodong He is also an affiliate professor in the University of Washington's Department of Electrical and
          Computer Engineering. Xiaodong He gave a keynote titled "From Digital Human to Humanoids" at IEEE MMSP 2025,
          on building digital humans and humanoid systems with large language and vision models.
        source_ids: [uw-profile, ieee-mmsp-2025]
  - heading: Research
    paragraphs:
      - text: >-
          Xiaodong He's research spans deep learning, speech, natural language, computer vision and information
          retrieval. Vision-and-language work includes the 2017 bottom-up and top-down attention method for
          image captioning and visual question answering, and AttnGAN, an attentional generative adversarial
          network for fine-grained text-to-image generation.
        source_ids: [uw-profile, bottom-up-paper, attngan-paper]
