headline: PyTorch module maintainer for torch.nn and the C++ API; author of PyTorch tutorials
bio:
  text: >-
    Mikayla Gawarecki is listed on PyTorch's maintainers page as a module maintainer for the NN APIs
    (torch.nn) and the C++ API (libtorch and StableABI), and as an emeritus maintainer of
    NestedTensor (torch.nested). Gawarecki wrote the PyTorch tutorial "Accelerating PyTorch
    Transformers by replacing nn.Transformer with Nested Tensors and torch.compile()," which covers
    nested tensors, scaled_dot_product_attention, torch.compile, and FlexAttention, and the recipe
    "Extension points in nn.Module for load_state_dict and tensor subclasses" (April 2024).
  source_ids: [pytorch-maintainers, tutorial-transformer-blocks, recipe-swap-tensors]
  reviewed_at: 2026-10-21
