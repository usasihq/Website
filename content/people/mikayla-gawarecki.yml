sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Mikayla Gawarecki is one of the PyTorch maintainers for torch.nn, the library's neural-network API, and
          for the C++ API, which covers libtorch and the StableABI. Gawarecki earlier maintained NestedTensor
          (torch.nested), PyTorch's support for tensors of variable-length inputs, and is now listed as an emeritus
          maintainer of that module.
        source_ids: [pytorch-maintainers]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Gawarecki wrote the PyTorch tutorial on replacing nn.Transformer with nested tensors and torch.compile,
          which shows how to build transformer layers from lower-level pieces such as
          scaled_dot_product_attention and FlexAttention, with the remaining layers published in a companion
          repository. In April 2024 Gawarecki also published a recipe on nn.Module extension points for
          load_state_dict and tensor subclasses, which introduces torch.utils.swap_tensors.
        source_ids: [tutorial-transformer-blocks, recipe-swap-tensors]
