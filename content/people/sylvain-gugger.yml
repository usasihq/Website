    source_ids: [fastai-paper]
  - date: "2020"
    text: Published the fastbook notebooks with Jeremy Howard as the basis of their deep learning book.
    source_ids: [fastbook-readme]
  - date: 2021-04-16
    text: Introduced the Accelerate library on the Hugging Face blog.
    source_ids: [accelerate-blog]
