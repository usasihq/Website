    url: https://huggingface.co/sgugger
sections:
  - heading: Career
    paragraphs:
      - text: >-
          Sylvain Gugger was a Research Scientist at fast.ai before joining Hugging Face as a Research
          Engineer, where Gugger became one of the core maintainers of the Transformers library.
          Hugging Face's course page describes Gugger's research focus as making deep learning more
          accessible through techniques that let models train quickly on limited resources.
        source_ids: [hf-course, github-profile]
  - heading: Open-source work
    paragraphs:
      - text: >-
          At fast.ai, Gugger co-wrote with Jeremy Howard the 2020 paper describing fastai's layered
          API, and the two share copyright on the fastbook notebooks, which are used for an online
          course and form the basis of the book Deep Learning for Coders with fastai and PyTorch.
        source_ids: [fastai-paper, fastbook-readme, hf-course]
      - text: >-
          Gugger is a co-author of the 2019 paper introducing the Transformers library. In
          April 2021, Gugger introduced Accelerate on the Hugging Face blog as a library for PyTorch
          users who want to keep full control of their training loops while running them on several
          GPUs, TPUs, or in mixed precision.
        source_ids: [transformers-paper, accelerate-blog, accelerate-readme]
timeline:
  - date: 2019-10-09
    text: Co-authored the paper introducing Hugging Face's Transformers library.
    source_ids: [transformers-paper]
  - date: 2020-02-11
