work:
  - name: Transformers
    artifact_slug: transformers
    type: open-source
    url: https://github.com/huggingface/transformers
    contribution: >-
      Co-author of the 2019 paper introducing Hugging Face's Transformers library (arXiv
      1910.03771), and described on Hugging Face's LLM Course page as one of the library's core
      maintainers. The repository is released under the Apache 2.0 license.
    source_ids: [transformers-paper, hf-course, transformers-readme]
  - name: Accelerate
    artifact_slug: null
    type: open-source
    url: https://github.com/huggingface/accelerate
    contribution: >-
      Listed first among the authors in the citation entry of the Accelerate README (2022). The
      Apache-2.0 library lets people who write their own PyTorch training loops run them in
      distributed or mixed-precision setups.
    source_ids: [accelerate-readme]
  - name: Deep Learning for Coders with fastai and PyTorch
    artifact_slug: null
    type: open-research
    url: https://github.com/fastai/fastbook
    contribution: >-
      Co-wrote the book with Jeremy Howard, according to the author biographies on Hugging Face's
      LLM Course page; the fastbook repository holds the notebooks the book is based on, copyright
      Jeremy Howard and Sylvain Gugger from 2020.
    source_ids: [hf-course, fastbook-readme]
  - name: "fastai: A Layered API for Deep Learning"
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2002.04688
    contribution: >-
      Co-author, with Jeremy Howard, of the 2020 paper describing the design of the fastai deep
      learning library as a set of layered APIs.
    source_ids: [fastai-paper]
links:
  - label: GitHub
    url: https://github.com/sgugger
