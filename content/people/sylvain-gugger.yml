headline: Former core maintainer of Hugging Face Transformers and co-author of Deep Learning for Coders
bio:
  text: >-
    Sylvain Gugger's GitHub profile lists past work at Hugging Face and fast.ai. Hugging Face's LLM
    Course describes Gugger as a Research Engineer at Hugging Face and one of the core maintainers
    of the Transformers library, and as a former Research Scientist at fast.ai who co-wrote Deep
    Learning for Coders with fastai and PyTorch with Jeremy Howard. Gugger is a co-author of the
    paper that introduced the Transformers library and is listed first in the citation for
    Accelerate, Hugging Face's thin wrapper for running PyTorch training loops on multiple GPUs,
    TPUs, or mixed precision without boilerplate code.
  source_ids: [github-profile, hf-course, transformers-paper, accelerate-readme]
  reviewed_at: 2026-10-13
