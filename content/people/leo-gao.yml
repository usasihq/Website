headline: First author of The Pile and first-listed author of EleutherAI's LM Evaluation Harness
bio:
  text: >-
    Leo Gao is first author of The Pile, an 825 GiB English text corpus for training language
    models that was published with an EleutherAI affiliation in 2020. Gao is the first-listed author
    in the citation entry for EleutherAI's LM Evaluation Harness, an open framework for few-shot
    evaluation of language models. Gao also co-authored the GPT-NeoX-20B paper, which credits Gao with work on
    evaluations, the tokenizer, and the section on alignment implications.
  source_ids: [pile-paper, pile-pdf, lmeval-readme, neox20b-pdf]
  reviewed_at: 2026-10-13
