sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Gao led The Pile, an English text corpus assembled from 22 diverse subsets for training large
          language models and published with an EleutherAI affiliation at the end of 2020. Gao is also the
          first-listed author in the citation entry for EleutherAI's LM Evaluation Harness, a framework for
          few-shot evaluation of language models.
        source_ids: [pile-paper, pile-pdf, lmeval-readme]
      - text: >-
          Gao co-authored the 2022 GPT-NeoX-20B paper describing EleutherAI's open-source autoregressive
          language model; its contributions appendix lists Gao, alongside other authors, under evaluations,
          tokenizer experiments, and alignment implications.
        source_ids: [neox20b-pdf]
  - heading: Research
    paragraphs:
      - text: >-
          Gao is first author of "Scaling Laws for Reward Model Overoptimization" (2022), written with John
          Schulman and Jacob Hilton under an OpenAI affiliation, which studies how optimizing against a learned
          reward model in reinforcement learning from human feedback diverges from the true objective.
        source_ids: [reward-overoptimization-paper]
      - text: >-
          Gao's later interpretability papers, also listed with OpenAI, include "Scaling and evaluating sparse
          autoencoders" (2024), on which Gao was the primary contributor, and "Weight-sparse transformers have
          interpretable circuits" (2025), which trains transformers with sparse weights so that the circuits
          behind their behavior are easier to study.
        source_ids: [sae-paper, weight-sparse-paper]
