sections:
  - heading: Career
    paragraphs:
      - text: >-
          Smith has more than 30 years of experience leading global go-to-market organizations at enterprise
          technology companies, including senior leadership roles at Microsoft and Salesforce. Smith joined
          ServiceNow in July 2020 and, as President of EMEA, was promoted in January 2022 to chief commercial
          officer, overseeing all regional sales teams along with sales enablement and sales operations.
        source_ids: [anthropic-cco-news, ps-sn]
      - text: >-
          In July 2025 Anthropic announced that Smith would join as its first Chief Commercial Officer later that
          year. Anthropic's leadership page now lists Smith in that role, leading commercial strategy and global
          go-to-market operations as the company serves enterprise customers.
        source_ids: [anthropic-cco-news, anthropic-leadership]
