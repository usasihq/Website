headline: Chief Commercial Officer at Anthropic; previously Chief Commercial Officer at ServiceNow
bio:
  text: >-
    Paul Smith is Chief Commercial Officer at Anthropic, which announced in July 2025 that Smith would
    join as its first Chief Commercial Officer later that year. Anthropic's leadership page says Smith
    leads commercial strategy and global go-to-market operations. Before Anthropic, Smith served as Chief
    Commercial Officer and President of Global Customer and Field Operations at ServiceNow, and held
    senior leadership roles at Salesforce and Microsoft.
