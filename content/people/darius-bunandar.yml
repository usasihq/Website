headline: Founder and Chief Scientist of Lightmatter; co-author of a 2025 Nature paper on photonic AI acceleration
bio:
  text: >-
    Darius Bunandar is a founder and the Chief Scientist of Lightmatter, which describes its work as photonic
    infrastructure for AI spanning interconnects, lasers and eventually compute, and serves on the company's board of directors. Bunandar is a
    co-author of "Universal photonic artificial intelligence acceleration", published in Nature in April 2025
    with Lightmatter CEO Nicholas Harris among the co-authors.
