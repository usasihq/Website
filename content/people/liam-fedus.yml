sections:
  - heading: Research
    paragraphs:
      - text: >-
          Publishing as William Fedus, Fedus first-authored MaskGAN in 2018 with Ian Goodfellow and Andrew M. Dai,
          a method for text generation by filling in masked spans, and in 2020 a study revisiting the
          fundamentals of experience replay in reinforcement learning with co-authors including Yoshua Bengio
          and Hugo Larochelle.
        source_ids: [lf-maskgan, lf-replay]
      - text: >-
          Several of Fedus's papers concern sparse mixture-of-experts language models. With Barret Zoph and Noam
          Shazeer, Fedus first-authored Switch Transformers in 2021, which simplified expert routing to train
          large sparse models efficiently; Fedus also co-authored ST-MoE in 2022 on stable and transferable sparse
          expert models and, with Jeff Dean and Zoph, a 2022 review of sparse expert models in deep learning.
        source_ids: [switch-paper, lf-st-moe, lf-review]
  - heading: Career
    paragraphs:
      - text: >-
          At OpenAI, the GPT-4 Technical Report credits Fedus as data flywheel lead, and the OpenAI o1 System
          Card lists Fedus in its reasoning research leadership. Fedus is now listed on the team of Periodic Labs,
          an AI research and deployment company building AI scientists and autonomous laboratories for the
          physical sciences.
        source_ids: [gpt4-report, o1-card, periodic-home]
