headline: On the Periodic Labs team; first author of Switch Transformers; in OpenAI o1 reasoning research leadership
bio:
  text: >-
    Liam Fedus is a machine learning researcher listed on the team of Periodic Labs, a company building
    AI models and autonomous laboratories for the physical sciences. At Google, Fedus was first author
    of Switch Transformers (2021), which simplifies mixture-of-experts routing to train large sparse
    language models efficiently. At OpenAI, the GPT-4 Technical Report credits Fedus as data flywheel
    lead, and the OpenAI o1 System Card lists Fedus in the reasoning research leadership.
  source_ids: [periodic-home, switch-paper, gpt4-report, o1-card]
  reviewed_at: 2026-10-21
