headline: Reporter covering artificial intelligence and author of Empire of AI
bio:
  text: >-
    Karen Hao is a reporter covering artificial intelligence and the author of Empire of AI: Dreams
    and Nightmares in Sam Altman's OpenAI (Penguin Press, May 2025), a book about OpenAI and the AI
    industry. Karen Hao works as a freelancer and speaker, has produced short documentaries for
    More Perfect Union, and co-hosted the BBC podcast The Interface. Earlier, Karen Hao reported
    on American and Chinese tech companies for The Wall Street Journal and was a senior AI editor at
    MIT Technology Review, and formerly wrote the weekly newsletter The Algorithm. Karen Hao
    co-created the Pulitzer Center's AI Spotlight Series, which trains journalists to cover AI.
