sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hao came to journalism from the technology industry, having worked as an application engineer at a
          startup spun out of Google X. Hao was previously a senior AI editor at MIT Technology Review and a
          reporter covering American and Chinese technology companies for The Wall Street Journal, and wrote a
          weekly newsletter, The Algorithm.
        source_ids: [about]
      - text: >-
          Hao now divides time between freelance reporting, speaking and collaborative projects, and has produced
          short documentaries for More Perfect Union and co-hosted the BBC podcast The Interface. Hao sits on the board
          of the research institute AI Now and co-created the Pulitzer Center's AI Spotlight Series, which trains
          journalists to report on AI.
        source_ids: [about]
  - heading: Reporting
    paragraphs:
      - text: >-
          Hao's selected writing spans explainers and investigations. It includes a 2018 explainer on how bias enters AI systems, illustrated flowcharts on AI and machine learning, a
          2019 analysis of trends in AI research papers, an interactive courtroom-algorithm game and, in 2020,
          a piece on OpenAI. Later pieces examined the human workers who filtered violence and abuse out of
          ChatGPT and AI's demand for water in desert regions.
        source_ids: [clips]
  - heading: Empire of AI
    paragraphs:
      - text: >-
          Hao's book Empire of AI: Dreams and Nightmares in Sam Altman's OpenAI was published by Penguin Press on
          May 20, 2025. Drawing on reporting that began with Hao's coverage of OpenAI in 2019, it follows the
          company alongside the engineers, data workers and communities affected by the AI industry's demand for
          computing power, data, energy and water.
        source_ids: [book, home]
      - text: >-
          The book won the National Book Critics Circle Award for nonfiction for publishing year 2025, announced
          in March 2026. Hao's site lists further awards for it, among them the Los Angeles Times Book Award and
          the New York Public Library's Helen Bernstein Book Award for Excellence in Journalism, and a range of
          translated editions.
        source_ids: [nbcc-2025, home]
