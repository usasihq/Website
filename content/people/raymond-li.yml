headline: First author of StarCoder and second author of StarCoder 2; core contributor to ServiceNow's Super Apriel
bio:
  text: >-
    Raymond Li is a contributor to the BigCode code models whose recent papers give ServiceNow Research as affiliation. Li is
    first author of the 2023 StarCoder paper and second author of the 2024 StarCoder 2 paper, which introduced
    StarCoder2-3B, a core contributor to ServiceNow's Apriel-H1 hybrid models (2025), and one of three core
    contributors to ServiceNow's Super Apriel (2026).
  source_ids: [starcoder-paper, starcoder2-paper, starcoder2-html, aprielh1-html, superapriel-html]
  reviewed_at: 2026-10-22
