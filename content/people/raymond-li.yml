sections:
  - heading: Code models
    paragraphs:
      - text: >-
          Li is first author of the StarCoder paper (May 2023) from the BigCode collaboration, which lists Li's
          affiliation as ServiceNow Research. In February
          2024, Li was second author, after Anton Lozhkov, of the StarCoder 2 and The Stack v2 paper, which
          lists Li's affiliation as ServiceNow Research and introduced StarCoder2-3B, a model trained on 17
          programming languages.
        source_ids: [starcoder-paper, starcoder-pdf, starcoder2-paper, starcoder2-html, starcoder2-card]
  - heading: Apriel-H1
    paragraphs:
      - text: >-
          Li is one of the core contributors to the Apriel-H1 technical report (November 2025) from ServiceNow,
          on hybrid 15B reasoning models built by distilling a transformer into a mix of attention and Mamba
          layers, and co-wrote ServiceNow-AI's November 2025 post on the work.
        source_ids: [aprielh1-paper, aprielh1-html, aprielh1-blog]
  - heading: Super Apriel
    paragraphs:
      - text: >-
          Li is one of three core contributors to the Super Apriel paper (April 2026), a 15B-parameter supernet
          from ServiceNow Research. The paper credits Li with experiment design, the placement optimization and
          evaluation code, the placement landscape experiments and Pareto frontier extraction, and activation
          distillation for supernet training.
        source_ids: [superapriel-paper, superapriel-html]
