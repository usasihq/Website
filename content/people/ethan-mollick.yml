headline: Wharton professor who writes One Useful Thing, a newsletter on the implications of AI
bio:
  text: >-
    Ethan Mollick is an associate professor of management at the Wharton School of the University of
    Pennsylvania, studying the effects of AI on work, entrepreneurship, and education, and
    co-directs the Generative AI Labs at Wharton. For a general audience, Ethan Mollick writes One
    Useful Thing, a research-based newsletter on the implications of AI for work, education, and
    life. Ethan Mollick is the author of the book Co-Intelligence, and its successor, Co-Existence:
    The Next Phase of AI, was released by Portfolio on October 20, 2026.
  source_ids: [wharton, newsletter, co-existence]
  reviewed_at: 2026-10-21
