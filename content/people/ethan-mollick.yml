sections:
  - heading: Research and teaching
    paragraphs:
      - text: >-
          At Wharton, Mollick holds the title of Ralph J. Roberts Distinguished Faculty Scholar and is a
          Rowan Fellow, with research interests in AI, innovation, entrepreneurship, and education. Mollick
          earned a PhD and MBA at MIT's Sloan School of Management, and before academia co-founded a
          startup company.
        source_ids: [wharton]
      - text: >-
          Mollick was part of a team of social scientists that ran a pre-registered field experiment with
          Boston Consulting Group consultants using GPT-4, reported in the 2023 working paper Navigating the
          Jagged Technological Frontier. The paper introduced the idea of a jagged frontier, in which some
          tasks fall easily within AI's capabilities while similar-seeming ones fall outside it.
        source_ids: [wharton, jagged-post]
      - text: >-
          With Lilach Mollick, Ethan Mollick has written a series of papers on using AI in teaching, such as
          Assigning AI: Seven Approaches for Students, with Prompts, and work on AI-agent classroom
          simulations such as PitchQuest, a venture capital pitching simulator. The Generative AI Labs at
          Wharton build research-based educational simulations and open-source tools for educators,
          including the Primer initiative.
        source_ids: [wharton, wharton-gail]
  - heading: Writing
    paragraphs:
      - text: >-
          Mollick's first book, The Unicorn's Shadow, was published by Wharton University Press in 2020 and
          addresses myths about startups, founders, and investors. Co-Intelligence: Living and Working with
          AI followed from Portfolio in 2024.
        source_ids: [wharton]
      - text: >-
          Co-Existence: The Next Phase of AI, also from Portfolio, is presented as a field guide to working
          alongside AI that is sometimes but not always more capable than people, built around the jagged
          frontier and the exponential pace of AI progress. Mollick also writes the One Useful Thing
          newsletter, stating that each post is written by Mollick, with AI feedback sought only on a
          finished draft.
        source_ids: [co-existence, newsletter]
