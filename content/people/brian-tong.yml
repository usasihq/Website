sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Tong's YouTube channel, which YouTube lists as joined in October 2006, publishes videos and product
          reviews about technology and geek culture. Tong also hosts a podcast, Apple Bitz XL, about technology
          and culture.
        source_ids: [youtube, aboutme]
  - heading: Hosting
    paragraphs:
      - text: >-
          Tong's about.me profile describes Tong as an independent host and video producer who has covered
          technology for more than 15 years, with appearances on CBS, CNN and local television and radio. The
          profile says Tong has hosted Consumer Electronics Show coverage since 2021 and hosts the
          "Salesforce Explained" series. Earlier hosting work it lists includes broadcasts of "Inside the NBA on
          TNT" during the 2019 playoffs, a Facebook interactive game show called "Outside Your Bubble", and
          co-hosting for the DC Universe platform.
        source_ids: [aboutme]
