headline: Co-founder, president and CEO of Mobileye; Sachs Chair in Computer Science at the Hebrew University
bio:
  text: >-
    Amnon Shashua co-founded Mobileye and leads it as CEO; in July 2026 Mobileye announced that
    Shashua plans to step down as CEO once a successor is appointed, remaining a director with the
    board offering the role of chairman. Intel's undated newsroom biography describes Shashua as a
    senior vice president at Intel leading its organization for advanced driver-assist systems (ADAS)
    and autonomous driving after Intel acquired Mobileye in 2017, and says Shashua co-founded
    Mobileye and served as its CTO and chairman. Shashua has held the Sachs Chair in Computer Science at
    the Hebrew University of Jerusalem since 2007, and Mobileye's announcement lists honors
    including the Dan David Prize in Artificial Intelligence (2020) and election to the National
    Academy of Engineering (2026).
  source_ids: [mobileye-transition, intel-bio]
  reviewed_at: 2026-10-13
