sections:
  - heading: Career
    paragraphs:
      - text: >-
          Amnon Shashua co-founded Mobileye, which was launched in 1999 to apply computer vision to driving
          safety, and served as its CTO and chairman before Intel acquired the company in 2017. Intel's
          newsroom biography describes Shashua as a senior vice president at Intel and as president and CEO of
          Mobileye, leading Intel's work on advanced driver-assist systems and autonomous driving.
        source_ids: [intel-bio, mobileye-transition]
      - text: >-
          On July 23, 2026, Mobileye announced that Shashua had told its board of a plan to step down as CEO
          once a successor is appointed. Shashua remains a director, and the board has offered the role of
          chairman after the transition, with a focus on long-term technology work including the company's
          humanoid robotics business.
        source_ids: [mobileye-transition]
  - heading: Research and teaching
    paragraphs:
      - text: >-
          Alongside the company, Shashua holds the Sachs Chair in Computer Science at the Hebrew University of
          Jerusalem, a post held since 2007. Intel's biography credits Shashua with scientific papers and
          patents in computer vision and machine learning, and Mobileye describes the work as extending to
          autonomous driving, robotics and large language models.
        source_ids: [intel-bio, mobileye-transition]
