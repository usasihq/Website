sections:
  - heading: Career
    paragraphs:
      - text: >-
          Vora began a career in product work at Microsoft, building tools for developers. At Meta, Vora
          held roles that included Vice President and Head of Product for Facebook Ads, work on scaling
          Instagram and the launch of Facebook's developer platform, and later led product and design for
          WhatsApp.
        source_ids: [datadog-board, anthropic-leadership]
      - text: >-
          Vora then served as Chief Product Officer at Faire, a wholesale marketplace for independent brands
          and retailers. In September 2025 Datadog announced Vora's appointment to its board of directors,
          and Vora joined Anthropic at the end of 2025.
        source_ids: [datadog-board, anthropic-labs]
  - heading: Product leadership at Anthropic
    paragraphs:
      - text: >-
          Anthropic's January 2026 announcement of an expanded Labs team said that Vora would lead the
          Product organization, working closely with CTO Rahul Patil to scale Claude products. Anthropic's
          leadership page describes Vora's role as turning each step in Claude's capabilities into
          products that people use.
        source_ids: [anthropic-labs, anthropic-leadership]
