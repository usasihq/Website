headline: Chief Product Officer of Anthropic, leading the product organization behind Claude
bio:
  text: >-
    Ami Vora is the Chief Product Officer of Anthropic and leads the company's product
    organization, which turns advances in Claude's capabilities into products. Anthropic announced
    in January 2026 that Vora, who joined at the end of 2025, would lead the Product organization
    in close partnership with CTO Rahul Patil. Before Anthropic, Vora was Chief Product Officer at
    Faire and spent more than 15 years at Meta in senior product roles across WhatsApp, Facebook
    and Instagram, after starting out building developer tools at Microsoft.
