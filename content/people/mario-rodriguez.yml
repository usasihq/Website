headline: Chief Product Officer of GitHub, leading the GitHub Product team and its AI and Copilot strategy
bio:
  text: >-
    Mario Rodriguez is the Chief Product Officer of GitHub, where Rodriguez leads the GitHub Product team,
    including product, design and product operations, and oversees GitHub's AI and Copilot strategy.
    Rodriguez has spent two decades in developer-tools leadership roles across Microsoft and GitHub, and
    previously oversaw the GitHub Copilot product line. On the GitHub Blog, Rodriguez has announced
    releases such as multi-model choice in Copilot, the GitHub Copilot SDK and the GitHub Copilot app.
  source_ids: [gh-leadership, copilot-app-post, rodriguez-author, universe-2024-post, copilot-sdk-post]
  reviewed_at: 2026-10-22
