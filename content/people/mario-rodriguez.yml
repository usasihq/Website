sections:
  - heading: Career
    paragraphs:
      - text: >-
          Rodriguez has held developer-tools leadership roles across Microsoft and GitHub for about twenty
          years. Before becoming Chief Product Officer, Rodriguez oversaw GitHub's AI strategy and the GitHub
          Copilot product line, and now leads the GitHub Product team, which includes product, design and
          product operations.
        source_ids: [gh-leadership, copilot-app-post]
  - heading: Products and launches
    paragraphs:
      - text: >-
          At GitHub Universe 2024, Rodriguez announced that developers could choose among models from
          Anthropic, Google and OpenAI in GitHub Copilot. In January 2026 Rodriguez introduced the GitHub
          Copilot SDK in technical preview, and in February 2026 announced that Claude by Anthropic and
          OpenAI Codex were available in public preview on Agent HQ.
        source_ids: [universe-2024-post, copilot-sdk-post, agent-hq-pick-post]
      - text: >-
          In June 2026, in a post on GitHub's Microsoft Build 2026 announcements, Rodriguez introduced the GitHub Copilot app as an
          agent-native desktop experience.
        source_ids: [copilot-app-post, rodriguez-author]
