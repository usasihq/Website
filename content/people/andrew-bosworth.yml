headline: Chief Technology Officer of Meta and head of Reality Labs; leads Meta's Agent Transformation Accelerator
bio:
  text: >-
    Andrew "Boz" Bosworth is the Chief Technology Officer of Meta and head of Reality Labs, the
    company's wearables and metaverse organization, which Bosworth established in 2017. Meta's
    leadership bio says Bosworth also leads the newly formed Agent Transformation Accelerator,
    which focuses on transforming how Meta works through AI agents and on accelerating
    improvements to Meta's core models.
    Bosworth joined Facebook as an engineer in 2006, built the original News Feed, Messenger and
    Groups, and later ran the Ads and Business Platform group.
  source_ids: [meta-leadership, meta-bio]
  reviewed_at: 2026-10-19
