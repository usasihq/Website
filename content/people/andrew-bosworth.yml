sections:
  - heading: Career
    paragraphs:
      - text: >-
          Andrew Bosworth joined Facebook in 2006 as one of its early engineers. Meta's leadership
          biography credits Bosworth with building the original News Feed, Messenger and Groups, along
          with early anti-abuse and infrastructure systems, and with serving as an engineering director
          over areas including Events, Places, Photos, Videos, Timeline and Privacy.
        source_ids: [meta-bio]
      - text: >-
          Bosworth later ran the Ads and Business Platform product group. In 2017 Bosworth established
          the organization now called Reality Labs, Meta's wearables and metaverse group, and today
          serves as Meta's Chief Technology Officer alongside leading Reality Labs.
        source_ids: [meta-bio, meta-leadership]
  - heading: Products and projects
    paragraphs:
      - text: >-
          As head of Reality Labs, Bosworth leads Meta's work on its next computing platform and
          consumer hardware, including the Quest headsets, Horizon and the Meta glasses portfolio.
          Bosworth also leads the Agent Transformation Accelerator, a newly formed group that Meta
          describes as focused on changing how the company works through AI agents and on speeding up
          improvements to Meta's core models.
        source_ids: [meta-bio]
