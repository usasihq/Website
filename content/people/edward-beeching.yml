sections:
  - heading: Research
    paragraphs:
      - text: >-
          Beeching completed a PhD at INSA Lyon with the INRIA CHROMA team, studying deep reinforcement learning
          for planning, navigation and embodied agents. Papers from that period, written with Christian Wolf,
          Jilles Dibangoye and Olivier Simonin, include EgoMap, a structured egocentric memory for reinforcement
          learning agents, and work on learning to plan with uncertain topological maps, presented as a spotlight
          at ECCV 2020.
        source_ids: [beeching-site]
      - text: >-
          At Hugging Face, Beeching's research turned to post-training and reasoning for language models.
          Beeching was co-first author, with Lewis Tunstall, of Zephyr, which distills supervised and preference
          signals to align a smaller open chat model, and later co-wrote papers on meta reinforcement
          fine-tuning for test-time compute and on QED-Nano, a small open model for Olympiad-level proofs.
        source_ids: [beeching-site, zephyr-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Beeching is listed among the authors of TRL, Hugging Face's library for post-training with supervised
          fine-tuning, preference optimization and reinforcement learning, and has co-written Hugging Face blog
          posts on its use, including a 2023 guide to RLHF fine-tuning of 20B models on a consumer GPU and the
          StackLLaMA tutorial. Other open projects on Beeching's site include Open R1, an open reproduction of
          reasoning-model training recipes, NuminaMath, a set of open models and competition-mathematics data,
          and JAT, a multi-purpose Transformer agent.
        source_ids: [trl-citation, beeching-site]
      - text: >-
          Beeching also co-authored Godot Reinforcement Learning Agents, an open interface between the Godot game
          engine and common reinforcement-learning frameworks, and is listed among the authors of the 2025
          SmolLM3 release.
        source_ids: [beeching-site, smollm3-blog]
