sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Michael Fisher's MrMobile channel describes itself as mobile technology videos for the
          discerning gadget enthusiast. The channel's about text says Fisher has spent roughly 15 years
          making videos that examine technology products through detailed reviews, from folding-screen
          phones to wearable tech. The MrMobile site also offers a newsletter.
        source_ids: [channel-about, site]
      - text: >-
          The MrMobile ethics statement says Fisher writes every video on the channel and controls its
          editorial calendar, that no company sees a video before publication, and that the channel
          does not publish reviews or comparisons sponsored by the companies whose products are
          covered. Sponsored ad segments within videos are labeled with a spoken disclaimer and an
          on-screen sponsor callout, and the statement notes that the MrMobile brand is owned and
          operated by Future plc.
        source_ids: [ethics]
