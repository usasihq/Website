headline: Creator of MrMobile, a YouTube channel of mobile technology reviews
bio:
  text: >-
    Michael Fisher makes MrMobile, a YouTube channel of mobile technology videos, including detailed
    reviews of products such as folding-screen phones and wearable tech. MrMobile also publishes a
