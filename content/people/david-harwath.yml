sections:
  - heading: Career
    paragraphs:
      - text: >-
          Harwath spent nearly a decade at MIT's Computer Science and Artificial Intelligence Laboratory,
          first as a graduate research assistant from 2011 and then as a research scientist from March 2018
          to August 2020. Along the way, Harwath interned with the Human Language Technologies Group at MIT
          Lincoln Laboratory and with the speech team at Google.
        source_ids: [harwath-cv]
      - text: >-
          Harwath completed a PhD in computer science at MIT in 2018 in the Spoken Language Systems Group,
          advised by James Glass. Harwath joined the computer science faculty at The University of Texas at
          Austin as an assistant professor in August 2020 and leads the Speech, Audio, and Language
          Technologies (SALT) Lab there.
        source_ids: [harwath-site, harwath-cv]
  - heading: Research
    paragraphs:
      - text: >-
          Harwath's research centers on automatic speech recognition, spoken language understanding, and
          multimodal machine learning across speech, environmental sound, and vision. The goal, as the UT
          Austin faculty page puts it, is speech and language models that are robust, flexible, and able to
          learn from several input modalities at once.
        source_ids: [utcs-profile]
      - text: >-
          Much of Harwath's MIT work studied visually grounded speech, in which models learn words and
          sub-word units by pairing spoken captions with images, as in papers at NeurIPS 2016, ACL 2017 and
          ECCV 2018. At UT Austin, Harwath's group has extended this line toward speech language models,
          including VoiceCraft, a neural codec language model for speech editing and zero-shot text-to-speech
          presented at ACL 2024.
        source_ids: [harwath-site, harwath-cv, voicecraft-paper]
  - heading: Teaching
    paragraphs:
      - text: >-
          At UT Austin, Harwath has taught the graduate course Spoken Language Technologies (CS395T/EE381V)
          and an undergraduate Introduction to Speech and Audio Processing. At MIT, Harwath was a teaching
          assistant for courses on automatic speech recognition and introductory machine learning.
        source_ids: [harwath-site, harwath-cv]
