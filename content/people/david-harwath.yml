headline: UT Austin assistant professor who leads the SALT Lab; former MIT CSAIL research scientist
bio:
  text: >-
    David Harwath is an Assistant Professor of Computer Science at The University of Texas at Austin,
    where Harwath leads the Speech, Audio, and Language Technologies (SALT) Lab. Harwath's research
    covers machine learning for speech, language, and sound, with a focus on multimodality and
    self-supervised approaches that can help low-resource languages and domains. Before UT, Harwath
    was a research scientist at MIT CSAIL from 2018 to 2020, and Harwath's homepage offers the spoken
    caption corpora Harwath collected, along with modeling code, for download. With Wei-Ning Hsu and
    James Glass, Harwath wrote Learning Hierarchical Discrete Linguistic Units from Visually-Grounded
    Speech (ICLR 2020).
