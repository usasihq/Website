sections:
  - heading: Career
    paragraphs:
      - text: >-
          Almeida's past roles include work at Google Brain and at OpenAI. In TypeSafe's launch post, Almeida writes of
          helping build, at OpenAI, the methods that made language models follow instructions and talk with
          people, and Almeida is listed among the authors of the March 2022 InstructGPT paper.
        source_ids: [typesafe-team, typesafe-launch, instructgpt-paper]
      - text: >-
          Almeida founded TypeSafe AI and leads it as CEO, alongside COO Sasha Sheng and CTO Erik Gafni. The
          launch post says the company spent two years in stealth before its public debut.
        source_ids: [typesafe-team, typesafe-launch]
  - heading: TypeSafe AI and Jev
    paragraphs:
      - text: >-
          On September 15, 2026, Almeida announced Jev, TypeSafe's first System One model, in early access.
          The post describes a new model architecture, a parallel sampler and a training method the company
          calls Reinforcement Learning for Calibrated Decisions (RLCD), with Jev returning structured decisions
          instead of free-form strings.
        source_ids: [typesafe-launch]
      - text: >-
          The same post introduced TypeSafe's workflow evaluations, which break automation tasks such as
          security incident triage, invoice processing and customer service into narrow typed questions and
          compare models against consensus labels.
        source_ids: [typesafe-launch, typesafe-evals-site]
