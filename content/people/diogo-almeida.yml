headline: Founder and CEO of TypeSafe AI; co-author of OpenAI's InstructGPT paper on training with human feedback
bio:
  text: >-
    Diogo Almeida is the founder and CEO of TypeSafe AI, a San Francisco company that builds what it
    calls System One models, which return typed, probabilistic decisions rather than generated text.
    Almeida is a co-author of "Training language models to follow instructions with human feedback"
    (2022), the OpenAI paper that introduced InstructGPT, and TypeSafe's team page notes earlier work
    at Google Brain. In September 2026 Almeida announced TypeSafe's first public model, Jev, together
    with the company's published workflow evaluations.
  source_ids: [typesafe-team, instructgpt-paper, typesafe-launch]
  reviewed_at: 2026-10-22
