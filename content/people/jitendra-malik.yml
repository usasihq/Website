sections:
  - heading: Career
    paragraphs:
      - text: >-
          Malik joined the Berkeley EECS faculty in
          January 1986, becoming a full professor in 1996 and holding the Arthur J. Chick professorship since
          2002. At Berkeley, Malik chaired the Computer Science Division from 2002 to 2004 and the EECS
          department in 2004–2006 and again in 2016–2017, and also holds an appointment in Bioengineering.
        source_ids: [malik-cv, bio-page]
      - text: >-
          Malik has also held industry research roles alongside the Berkeley appointment: visiting scientific
          director of Yahoo! Research Berkeley in 2007, visiting research scientist at Google in 2015–2016, and
          a series of positions at Facebook AI Research and Meta from 2018 to 2025, ending as VP of Robotics
          Research. Since 2026 Malik has been VP and Distinguished Scientist at Amazon's FAR lab while on
          partial leave from Berkeley.
        source_ids: [malik-cv, bio-page]
  - heading: Research
    paragraphs:
      - text: >-
          Malik's group works on computer vision, robotics and machine learning, and has also contributed to
          computational models of human vision, computer graphics and biological image analysis. Early papers
          include anisotropic diffusion for edge detection with Pietro Perona (1987–1990), normalized cuts for
          image segmentation with Jianbo Shi (1997–2000), recovering high-dynamic-range radiance maps from
          photographs with Paul Debevec (SIGGRAPH 1997), and shape contexts for shape matching with Serge
          Belongie.
        source_ids: [bio-page, malik-cv]
      - text: >-
          In 2013 Malik co-authored R-CNN with Ross Girshick, Jeff Donahue and Trevor Darrell, which combined
          region proposals with convolutional network features for object detection, and in 2018 co-authored
          SlowFast networks for video recognition. Malik's recent teaching includes CS 280 Computer Vision in spring 2025 and, on learning-based
          robotics, CS 294-277 Robots That Learn in spring 2026.
        source_ids: [rcnn-paper, slowfast-paper, homepage]
