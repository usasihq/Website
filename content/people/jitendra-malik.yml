headline: Arthur J. Chick Professor of EECS at UC Berkeley; VP and Distinguished Scientist at Amazon's FAR lab
bio:
  text: >-
    Jitendra Malik is the Arthur J. Chick Professor in the Department of Electrical Engineering and
    Computer Sciences at UC Berkeley, where Malik joined the faculty in 1986, and is currently on
    partial industrial leave as VP and Distinguished Scientist at the Amazon FAR lab. Malik's
    research group works on computer vision, robotics, and machine learning, and Malik's biography
    names normalized cuts, shape contexts, and R-CNN among the concepts and algorithms that came
    from this research. Malik is a co-author of the 2013 R-CNN paper and of SlowFast Networks for
    video recognition. Malik's homepage lists recent teaching of CS 280 Computer Vision (Spring 2025)
    and CS 294-277 Robots That Learn (Spring 2026).
