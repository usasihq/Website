headline: Co-founder of Arcee AI, which builds the open-weight Trinity models; co-author of Arcee's MergeKit paper
bio:
  text: >-
    Mark McQuade is a co-founder of Arcee AI, an open-weight model lab whose Trinity family of models
    is released under open licenses; a July 2025 Arcee announcement identified McQuade as CEO and
    co-founder. McQuade co-authored Arcee's MergeKit paper on merging language models and the Arcee
    Trinity Large Technical Report.
  source_ids: [arcee-strategic-round, arcee-about, mergekit-paper, trinity-report]
  reviewed_at: 2026-10-22
