sections:
  - heading: Arcee AI
    paragraphs:
      - text: >-
          McQuade co-founded Arcee AI, which describes itself as a model lab that began in post-training and
          later began pretraining its own open-weight models, the Trinity family. In a July 2025 company
          announcement, Arcee quoted McQuade as its CEO and co-founder.
        source_ids: [arcee-about, arcee-strategic-round]
      - text: >-
          In 2026 McQuade co-authored, with Lucas Atkins, Arcee's announcement of Genesis-Science-1, an open
          model for scientific research developed with the U.S. Department of Energy and its national
          laboratories.
        source_ids: [arcee-genesis]
  - heading: Research
    paragraphs:
      - text: >-
          McQuade is a co-author of Arcee's MergeKit paper (2024), on a toolkit for merging large language
          models, and of a 2024 study on adapting Llama-3-70B-Instruct to SEC data with continual
          pre-training and model merging. McQuade is also listed among the authors of the Arcee Trinity Large
          Technical Report (2026).
        source_ids: [mergekit-paper, domain-adaptation-paper, trinity-report]
