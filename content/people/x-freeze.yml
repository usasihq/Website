sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          X Freeze publishes posts and long-form articles on X about AI, engineering and space, with the stated
          aim of explaining complex technical ideas in plain language. The articles page highlights pieces
          from May to August 2026 on SpaceX, AI compute infrastructure and xAI's Grok Build agentic coding
          platform.
        source_ids: [site, articles]
      - text: >-
          Practical articles include a July 2026 guide to agent workflows that combine the X API with Grok
          Build for bookmarks, research, monitoring and automation, and an August 2026 write-up of a macOS app
          that uses Grok's speech-to-text as a voice-input layer across applications.
        source_ids: [articles]
  - heading: Products and projects
    paragraphs:
