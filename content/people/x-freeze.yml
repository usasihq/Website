headline: Writer on X (@XFreeze) explaining AI, space and engineering, and maker of free Grok bot templates
bio:
  text: >-
    X Freeze is the public name of the X account @XFreeze. Its website describes the work as
    following AI, space and engineering and explaining complex ideas in clear language. X Freeze
    publishes posts and long-form articles on X; topics listed on the website include Grok Build as
    an agentic engineering platform, agent workflows with the X API, a macOS voice-input app built on
    Grok speech-to-text, SpaceX, and AI compute infrastructure. The website also offers a set of
    free Grok bot templates, ready-made bots on xAI's Grok for tasks grouped into categories such as
    Create, Work, Business, Tech and Learning & Career.
