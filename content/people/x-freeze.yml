          The X Freeze website hosts a catalog of free Grok bot templates, each with a stated task, a
          description of what it will and will not do, and a link to the bot on xAI's Grok, grouped into
          categories such as Create, Work, Business, Tech and Learning & Career.
        source_ids: [grok-bots, grok-bots-data]
