sections:
  - heading: Career
    paragraphs:
      - text: >-
          Clarke worked as a reliability and product engineer at Motorola before joining Dell in 1987 as a
          quality engineer. Clarke's responsibilities at Dell later grew to leading the company's major
          transformations.
        source_ids: [clarke-bio]
      - text: >-
          As vice chairman and chief operating officer, Clarke directs the Infrastructure Solutions Group
          and Client Solutions Group and manages global operations, including manufacturing, procurement
          and supply chain. Clarke also leads Dell's planning for AI, cloud, edge and as-a-service offerings.
        source_ids: [clarke-bio]
