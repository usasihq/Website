headline: Vice Chairman and Chief Operating Officer of Dell Technologies, leading planning for AI
bio:
  text: >-
    Jeff Clarke is vice chairman and chief operating officer of Dell Technologies, responsible for
    day-to-day operations, the Infrastructure Solutions Group and Client Solutions Group, and global
    operations. Clarke also sets the company's long-term strategy and leads planning for emerging areas
    including AI, cloud, edge and as-a-service. Clarke joined Dell in 1987 as a quality engineer after
    working as a reliability and product engineer at Motorola.
