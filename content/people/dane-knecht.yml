sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Cloudflare, Knecht founded an e-commerce software-as-a-service company and held product
          leadership roles at MessageOne and Dell. Knecht joined Cloudflare when it was an early-stage
          company and now serves as its Chief Technology Officer, responsible for turning new ideas into
          products that shape the company's strategy.
        source_ids: [cf-press-kit]
  - heading: Products and projects
    paragraphs:
      - text: >-
          At Cloudflare, Knecht has led the development, launch and scaling of Cloudflare Zero Trust, the
          Cloudflare Developer Platform and the company's AI inference and agents platform. On the Cloudflare
          Blog, Knecht introduced Firebolt in 2017, announced in September 2025 that nearly every Cloudflare
          feature would become available to any customer, and in April 2026 co-wrote, with Rita Kozlov, the
          welcome post for Agents Week.
        source_ids: [cf-press-kit, firebolt-post, every-feature, agents-week]
