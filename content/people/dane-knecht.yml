headline: Chief Technology Officer of Cloudflare; led Zero Trust, the Developer Platform and AI inference work
bio:
  text: >-
    Dane Knecht is the Chief Technology Officer of Cloudflare. Over more than a decade at the company,
    Knecht has led the development, launch and scaling of products including Cloudflare Zero Trust, the
    Cloudflare Developer Platform and, most recently, its AI inference and agents platform. In April 2026
    Knecht co-wrote the post opening Cloudflare's Agents Week.
  source_ids: [cf-press-kit, dk-author, agents-week]
  reviewed_at: 2026-10-22
