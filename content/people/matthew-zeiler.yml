headline: Clarifai founder named SVP, Research at Nebius in May 2026; author of the ADADELTA paper
bio:
  text: >-
    Matthew Zeiler founded Clarifai, and Nebius announced in May 2026 that Zeiler, then Clarifai's founder
    and CEO, would join Nebius as SVP, Research, to head a team working on multimodal agentic reasoning, world
    models, token efficiency, and long-term memory, alongside Clarifai's core engineering and research
    team. With Rob Fergus at New York University's Courant Institute, Zeiler co-authored the 2013
    paper Visualizing and Understanding Convolutional Networks. Zeiler is also the sole author of the 2012
    ADADELTA paper on per-dimension adaptive learning rates, written during an internship at Google.
  source_ids: [nebius-release, zfnet-paper, adadelta-paper]
  reviewed_at: 2026-10-21
