sections:
  - heading: Research
    paragraphs:
      - text: >-
          Zeiler's research papers came from work with Rob Fergus at New York University's Courant Institute
          and an internship at Google. In 2012 Zeiler was sole author of ADADELTA, a per-dimension learning-rate
          method for gradient descent that needs no manual tuning of a global learning rate, and in early 2013
          Zeiler and Fergus proposed stochastic pooling, which regularizes convolutional networks by sampling
          activations within each pooling region.
        source_ids: [adadelta-paper, stochastic-pooling-paper]
      - text: >-
          "Visualizing and Understanding Convolutional Networks" (2013), with Fergus, introduced a technique for
          visualizing what intermediate layers of a large ImageNet-trained convolutional network respond to, and
          used it to diagnose and improve the network's architecture.
        source_ids: [zfnet-paper]
  - heading: Career
    paragraphs:
      - text: >-
          Zeiler founded Clarifai and led it as founder and CEO. In May 2026 Nebius announced that Clarifai's core
          engineering and research team, led by Zeiler, was joining Nebius, and that Nebius was licensing
          Clarifai's inference and compute orchestration technology for its Nebius Token Factory platform.
          The announcement said Zeiler would join Nebius as SVP, Research, leading a team on multimodal agentic
          reasoning, world models, token efficiency and long-term memory.
        source_ids: [nebius-release]
