headline: PyTorch core maintainer and co-author of the PyTorch and PyTorch 2 papers; research engineer at Meta
bio:
  text: >-
    Edward Yang is a Research Engineer at Meta and a PyTorch core maintainer. PyTorch's maintainers
    page also lists Yang as a module maintainer for TorchDynamo, autograd, the PT2 dispatcher,
    CUDA, and C10 utilities and operator dispatch. Yang co-authored the 2019 PyTorch paper and the
    PyTorch 2 paper (ASPLOS 2024), which introduced TorchDynamo and TorchInductor, the extensions
    that implement torch.compile. At PyTorch Conference Europe 2026, Yang gave the "PyTorch
    Updates" keynote.
  source_ids: [eu26-recap, keynote-na26, pytorch-maintainers, pytorch-paper, pt2-paper]
  reviewed_at: 2026-10-21
