sections:
  - heading: Career
    paragraphs:
      - text: >-
          Yang's homepage lists a PhD from Stanford University in 2017, with a thesis titled
          "Backpack: Towards Practical Mix-in Linking in Haskell", and describes work at Facebook
          AI Research on the intersection of programming languages and machine learning. At
          Stanford, Yang co-taught and later taught CS242, Programming Languages, between 2013 and
          2016.
        source_ids: [ezyang-site]
      - text: >-
          Yang is now a Research Engineer at Meta. In 2026 PyTorch announced Yang as a keynote
          speaker on PyTorch updates at both PyTorch Conference Europe in April and PyTorch
          Conference North America, the latter shared with Alban Desmaison.
        source_ids: [eu26-recap, keynote-na26]
  - heading: Open-source work
    paragraphs:
      - text: >-
          PyTorch's governance documentation lists Yang among the project's core maintainers and as
          a module maintainer for autograd, TorchDynamo, the PT2 dispatcher, CUDA, and C10 utilities
          and operator dispatch. At PyTorch Conference Europe 2026, Yang took part in the "Meet the
          Developers" session for PyTorch module maintainers.
        source_ids: [pytorch-maintainers, eu26-recap]
      - text: >-
          Before PyTorch, Yang worked on the Haskell toolchain, including GHC and the Cabal build
          system and package manager, and was primarily responsible for Backpack's implementation
          in GHC. Yang's homepage also lists earlier projects such as HTML Purifier, a
          standards-compliant HTML filter.
        source_ids: [ezyang-site]
  - heading: Publications and writing
    paragraphs:
      - text: >-
          Yang's research papers include work on dynamic space limits for Haskell (PLDI 2014) and
          COWL, a confinement system for JavaScript (OSDI 2014). Yang co-authored the 2019 PyTorch
          paper and the ASPLOS 2024 PyTorch 2 paper, which describes the TorchDynamo and
          TorchInductor components behind torch.compile.
        source_ids: [ezyang-site, pytorch-paper, pt2-paper]
      - text: >-
          On ezyang's blog, Yang published "PyTorch internals" in May 2019, an essay version of a
          talk given at the PyTorch NYC meetup that maps out the structure of PyTorch's C++ codebase
          for new contributors.
        source_ids: [pytorch-internals-post]
