headline: First author of the PyTorch paper and a named author of JAX; research scientist at Google
bio:
  text: >-
    Adam Paszke is the first author of the 2019 paper that describes PyTorch, and the PyTorch
    repository's license lists Paszke in its copyright notice. PyTorch's maintainers page lists
    Paszke as an emeritus maintainer of torch.nn, autograd, and multiprocessing. Paszke is also
    one of the authors named in the JAX repository's citation entry. Paszke's GitHub profile
    reads "Author of PyTorch. Research Scientist @ Google."
  source_ids: [pytorch-paper, pytorch-license, pytorch-maintainers, jax-readme, github-profile]
  reviewed_at: 2026-10-13
