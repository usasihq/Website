sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Adam Paszke's GitHub profile describes Paszke as the author of PyTorch and a Research Scientist
          at Google. PyTorch's license names Paszke in its copyright notice, and the project's maintainers
          page lists Paszke as an emeritus maintainer of torch.nn, autograd, and multiprocessing.
        source_ids: [github-profile, pytorch-license, pytorch-maintainers]
      - text: >-
          Paszke was the first author of the December 2019 NeurIPS paper describing PyTorch, which
          explains how the library pairs an imperative, Pythonic programming style with efficient
          execution on hardware accelerators such as GPUs. Paszke is also named among the authors in the
          citation entry of JAX, a library of composable transformations of Python and NumPy
          programs, released under the Apache License 2.0.
        source_ids: [pytorch-paper, jax-readme, jax-license]
  - heading: Research
    paragraphs:
      - text: >-
          Paszke's earlier research includes ENet (2016), a deep neural network architecture for
          real-time semantic segmentation designed to need fewer floating point operations. In 2021
          Paszke was first author of "Getting to the Point," which presents a programming language design
          that treats arrays as memoized functions on typed index sets and describes automatic
          differentiation that preserves parallelism.
        source_ids: [enet-paper, pointful-paper]
