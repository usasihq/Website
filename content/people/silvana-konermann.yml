headline: Co-founder and Executive Director of Arc Institute; Core Investigator leading the Konermann Lab
bio:
  text: >-
    Silvana Konermann is a co-founder, the Executive Director and a Core Investigator of the Arc
    Institute, and an Assistant Professor of Biochemistry at Stanford. Konermann's lab develops and
    applies functional genomics, including CRISPR tools for engineering RNA, to study the cellular
    pathways behind neurodegenerative disease such as Alzheimer's disease.
