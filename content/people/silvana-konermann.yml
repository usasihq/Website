sections:
  - heading: Career
    paragraphs:
      - text: >-
          Konermann co-founded the Arc Institute with Patrick Hsu and Patrick Collison, who had earlier
          collaborated on Fast Grants, and serves as its Executive Director. Arc, founded in 2021, runs
          a Virtual Cell Initiative and an Alzheimer's Disease Initiative alongside its investigator labs.
        source_ids: [arc-about]
      - text: >-
          Arc's lab page notes that Konermann's work on CRISPR tools for perturbing the transcriptome
          was recognized by an appointment as a Chan Zuckerberg Biohub Investigator and as a Hanna Gray
          Fellow of the Howard Hughes Medical Institute. Konermann also holds a faculty appointment in
          biochemistry at Stanford.
        source_ids: [arc-konermann-lab]
  - heading: Research
    paragraphs:
      - text: >-
          The Konermann Lab works on CRISPR technologies for transcriptome engineering, building on the
          Cas13d family of RNA-targeting enzymes, and on CRISPR screening in stem cell-derived models of
          the human brain. It also develops computational methods for analyzing large perturbation
          datasets to study the genetics of complex disease risk.
        source_ids: [arc-konermann-lab]
      - text: >-
          Many of the lab's recent papers are joint work with the Hsu Lab, including the 2024 Nature paper
          on bridge RNAs and a 2025 Cell paper proposing the Virtual Cell Challenge as a test for virtual
          cell models.
        source_ids: [arc-konermann-lab, nature-bridge]
