sections:
  - heading: Chroma
    paragraphs:
      - text: >-
          Huber's site lists Huber as a founder of Chroma. In an April 2023 company post signed by Jeff,
          Anton and the Chroma team, the founders described Chroma as an AI-native open-source embedding
          database that lets developers add state and memory to AI applications, and explained that the
          project began from interpretability work on model latent spaces.
        source_ids: [huber-site, chroma-seed-post]
      - text: >-
          The Chroma repository on GitHub was created in October 2022 and is published under the Apache
          2.0 license.
        source_ids: [chroma-repo]
  - heading: Research and writing
    paragraphs:
      - text: >-
          Huber is a co-author of two Chroma technical reports. Generative Benchmarking (April 2025)
          proposed generating evaluation queries for retrieval systems from production data, and Context
          Rot (July 2025) evaluated how 18 language models handle growing input lengths.
        source_ids: [chroma-generative-benchmarking, chroma-context-rot]
      - text: >-
          Huber's site also hosts essays on AI and company building, including "The Rise of Context
          Engineering" (August 2025) and "AI is a new computer" (June 2025).
        source_ids: [huber-site]
