headline: Founder of Chroma, the open-source search and retrieval database for AI applications
bio:
  text: >-
    Jeff Huber is a founder of Chroma, which builds an open-source embedding and search database for
    AI applications. With co-founder Anton Troynikov, Huber wrote the company's 2023 post explaining
    why the team built Chroma as an open-source project, and Huber has co-authored Chroma technical
    reports on retrieval evaluation and long-context model behavior.
  source_ids: [huber-site, chroma-seed-post, chroma-context-rot]
  reviewed_at: 2026-10-22
