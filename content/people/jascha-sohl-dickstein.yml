headline: Member of Technical Staff at Anthropic; first author of the 2015 paper that introduced diffusion models
bio:
  text: >-
    Jascha Sohl-Dickstein has been a Member of Technical Staff at Anthropic since 2024. Before that,
    Sohl-Dickstein spent 2015 to 2024 at Google Brain and Google DeepMind, most recently as a Principal
    Scientist, and earlier was a visiting scholar in Applied Physics at Stanford University.
    Sohl-Dickstein is first author of "Deep Unsupervised Learning using Nonequilibrium Thermodynamics"
    (2015), which Sohl-Dickstein's CV describes as the original paper introducing the diffusion model
    family, and a co-author of "Score-Based Generative Modeling through Stochastic Differential
    Equations". Sohl-Dickstein co-led BIG-bench, a collaborative benchmark for probing large language
    models, and wrote its original design document.
  source_ids: [jsd-cv, jsd-site, diffusion-2015-paper, sde-paper, bigbench-repo]
  reviewed_at: 2026-10-13
