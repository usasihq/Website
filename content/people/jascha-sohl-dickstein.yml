sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jascha Sohl-Dickstein worked as a research associate on NASA Jet Propulsion Laboratory's Mars
          Exploration Rovers from 2001 to 2005 and completed a PhD in biophysics at UC Berkeley in 2012.
          Sohl-Dickstein was then a visiting scholar in applied physics at Stanford and, from 2012 to 2014,
          worked at Khan Academy, an online education nonprofit.
        source_ids: [jsd-cv]
      - text: >-
          Sohl-Dickstein joined Google Brain in 2015 as a senior research scientist and became a principal
          scientist at Google DeepMind in 2023. In 2024 Sohl-Dickstein joined Anthropic as a Member of
          Technical Staff.
        source_ids: [jsd-cv, jsd-site]
  - heading: Research
    paragraphs:
      - text: >-
          Sohl-Dickstein's 2015 paper with Eric Weiss, Niru Maheswaranathan and Surya Ganguli introduced
          diffusion models, which learn to reverse a gradual noising process. A 2021 follow-up with Yang
          Song and others framed score-based generative modeling with stochastic differential equations.
        source_ids: [jsd-cv, diffusion-2015-paper, sde-paper]
      - text: >-
          Sohl-Dickstein's CV also groups work on the theory of infinite-width neural networks, showing that
          such networks are linear in their parameters throughout training and that their outputs are Gaussian processes;
          on learned optimizers, including VeLO (2022); and on adversarial examples that influence both
          machine and human perception.
        source_ids: [jsd-cv]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Sohl-Dickstein co-led BIG-bench, a collaborative benchmark of diverse tasks for probing large
          language models and extrapolating their capabilities, and wrote its original design document. The
          CV also lists Neural Tangents, a library for defining, training and evaluating both finite and
          infinite-width neural networks.
        source_ids: [jsd-cv, bigbench-repo]
