sections:
  - heading: Research
    paragraphs:
      - text: >-
          Bradbury's early papers are on neural networks for language. Bradbury is first author of
          "Quasi-Recurrent Neural Networks" (2016) and "Towards Neural Machine Translation with Latent Tree
          Attention" (2017), and co-authored "Learned in Translation - Contextualized Word Vectors" (2017),
          the Pointer Sentinel Mixture Models paper and work on non-autoregressive machine translation.
        source_ids: [qrnn-paper, cove-paper, arxiv-author]
      - text: >-
          Later papers focus on large-scale training and serving on accelerators. Bradbury co-authored a 2020
          study of concurrency limits in ML training on Google TPUs, the PaLM paper (2022) and "Efficiently
          Scaling Transformer Inference" (2022), and is listed among the authors of the PaLM 2 and Gemini
          technical reports.
        source_ids: [tpu-concurrency-paper, palm-paper, inference-paper, arxiv-author]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Bradbury is listed among the authors (in alphabetical order) in the citation entry for JAX,
          the library of composable transformations of Python and NumPy programs, and co-authored the January 2023 JAX design document
          that proposed shard_map for writing per-device code. Bradbury, listed with Google, is also a
          co-author of the 2019 PyTorch paper.
        source_ids: [jax-readme, jep-shard-map, pytorch-paper-pdf]
