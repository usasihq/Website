headline: Named author of JAX and co-author of the original PyTorch paper
bio:
  text: >-
    James Bradbury is one of the authors named in the JAX repository's citation entry and a
    co-author of the 2019 PyTorch paper, where Bradbury is listed with Google. The JAX documentation
    also credits Bradbury, under the handle jekbradbury, as a co-author of the January 2023 design
    doc that proposed shard_map for per-device code.
  source_ids: [jax-readme, pytorch-paper, pytorch-paper-pdf, jep-shard-map, github-profile]
  reviewed_at: 2026-10-21
