sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Apptronik, Cardenas worked in the Global Commercialization Group at the IC2
          Institute at the University of Texas at Austin, helping take innovations from research
          labs to market, and in the technology practice of Deloitte Consulting. Cardenas also
          previously founded several start-ups and a non-profit.
        source_ids: [ap-leadership]
      - text: >-
          Cardenas co-founded Apptronik, founded in 2016, and leads it as CEO, speaking for the
          company in its announcements on Apollo, its customer agreements and its work with Google
          DeepMind.
        source_ids: [ap-leadership, ap-apollo, ap-deepmind]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Apptronik unveiled its Apollo humanoid robot in August 2023 and in March 2024 announced a
          commercial agreement with Mercedes-Benz to use Apollo for physically demanding manual
          work. In December 2024 it announced a research partnership with the Google DeepMind
          robotics team.
        source_ids: [ap-apollo, ap-mercedes, ap-deepmind]
      - text: >-
          In June 2026 Apptronik opened an expanded Robot Park facility for collecting real-world
          training data and unveiled Apollo 2, in bipedal and wheeled configurations, whose data
          feeds AI models developed with Google DeepMind.
        source_ids: [ap-robot-park]
