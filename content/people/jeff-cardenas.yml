headline: Co-founder and CEO of Apptronik, maker of the Apollo humanoid robot
bio:
  text: >-
    Jeff Cardenas is a co-founder and the CEO of Apptronik, an AI-powered robotics company that
    builds the Apollo humanoid robot and collects real-world robot data with Google DeepMind's
    robotics team. Cardenas specializes in new product development and go-to-market strategy.
  source_ids: [ap-leadership, ap-robot-park]
