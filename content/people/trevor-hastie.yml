headline: Maintainer of the glmnet package and co-author of The Elements of Statistical Learning; Stanford emeritus
bio:
  text: >-
    Trevor Hastie is the John A. Overdeck Professor and Professor of Statistics and of Biomedical
    Data Science, Emeritus, at Stanford University, where Hastie held a joint appointment from 1994
    to 2025 after nine years at AT&T Bell Laboratories. Hastie is an author and the maintainer of
    glmnet, the R package for lasso and elastic-net regularized generalized linear models, whose
    version 5.0 replaced its Fortran code with C++. With Robert Tibshirani and Jerome Friedman,
    Hastie wrote The Elements of Statistical Learning, and the authors offer the book as a PDF
    download; Hastie also co-wrote An Introduction to Statistical Learning, in R and Python editions.
  source_ids: [hastie-site, glmnet-cran, esl-site, isl-site]
  reviewed_at: 2026-10-13
