sections:
  - heading: Research
    paragraphs:
      - text: >-
          Hastie completed a PhD at Stanford in 1985 with a dissertation on principal curves and surfaces,
          with Stuetzle listed as advisor. Stanford's Department of Statistics describes Hastie's main research
          contributions as applied nonparametric regression and classification, along with statistical computing,
          and notes later work on applied problems in biology, genomics, medicine and industry.
        source_ids: [stanford-statistics]
      - text: >-
          Hastie's more recent papers include a 2017 extended comparison, with Robert and Ryan Tibshirani, of best
          subset selection, forward stepwise selection and the lasso, and a 2019 study with Andrea Montanari, Saharon
          Rosset and Ryan Tibshirani on the behavior of ridgeless least squares interpolation in high dimensions.
        source_ids: [subset-comparison-paper, ridgeless-paper]
  - heading: Books and software
    paragraphs:
      - text: >-
          With Robert Tibshirani, Hastie wrote "Generalized Additive Models" (1991), and with John Chambers co-edited
          "Statistical Models in S" (1992), a library of modeling tools for the S-PLUS language. Hastie, Tibshirani and
          Jerome Friedman then wrote "The Elements of Statistical Learning", first published by Springer in 2001.
        source_ids: [stanford-statistics]
      - text: >-
          Hastie is a co-author, with Gareth James, Daniela Witten and Robert Tibshirani, of "An Introduction to
          Statistical Learning", a less technical treatment of the field with a lab in each chapter. Its first R
          edition was released in 2013, a second edition followed in 2021 and a Python edition in 2023. Hastie is
          also an author and the maintainer of glmnet, an R package for fitting lasso and elastic-net
          regularization paths for generalized linear models.
        source_ids: [isl-site, glmnet-cran]
