sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hasani earned a PhD in computer science at the Vienna University of Technology (TU Wien) in 2020,
          with a dissertation on liquid neural networks. Hasani then worked as a postdoctoral associate at MIT
          CSAIL with Daniela Rus, and later held a joint appointment as a principal AI and machine learning
          scientist at the Vanguard Group and a research affiliate at CSAIL.
        source_ids: [liquid-team]
      - text: >-
          Hasani co-founded Liquid AI with Mathias Lechner, Alexander Amini and Daniela Rus as a spin-out of
          MIT CSAIL, and leads the company as CEO. The company's official pages give its founding year as
          2023.
        source_ids: [liquid-about, liquid-team]
  - heading: Research
    paragraphs:
      - text: >-
          Hasani's 2020 paper on liquid time-constant networks describes recurrent models whose time
          constants vary with their hidden state, computed with numerical differential equation solvers.
          The same year, Hasani co-authored "Neural circuit policies enabling auditable autonomy" in Nature
          Machine Intelligence, with Lechner as first author.
        source_ids: [ltc-paper, ncp-paper]
      - text: >-
          Follow-up work by Hasani on closed-form continuous-time models (2021) approximated these dynamics
          in closed form, and "Liquid Structural State-Space Models" (2022) combined liquid networks with
          structured state-space models. Hasani is among the authors of the LFM2 technical report released by
          Liquid AI in 2025.
        source_ids: [cfc-paper, liquid-s4-paper, lfm2-report]
