headline: Co-founder and CEO of Liquid AI; first author of the Liquid Time-constant Networks paper
bio:
  text: >-
    Ramin Hasani is a co-founder and the CEO of Liquid AI, a company spun out of MIT CSAIL, and a
    machine learning scientist at MIT CSAIL. Hasani's research centres on robust deep learning and
    decision-making in complex dynamical systems, and Hasani is first author of the Liquid
    Time-constant Networks and closed-form continuous-time model papers. Hasani is also a co-author of
    the LFM2 technical report, which describes Liquid AI's second generation of foundation models.
  source_ids: [liquid-team, liquid-about, ltc-paper, cfc-paper, lfm2-report]
  reviewed_at: 2026-10-22
