sections:
  - heading: Career
    paragraphs:
      - text: >-
          At Google, Sanseviero worked as a software engineer and product manager, building machine learning
          models and infrastructure for Google Assistant and serving as a 20% product manager for the TensorFlow
          Graphics team. Sanseviero also spent several years at Hugging Face as Chief Llama Officer and Head of
          Platform and Community, where Sanseviero launched Hugging Face Spaces, built partnerships with model
          labs and open-source communities, set up integrations with libraries such as spaCy and Sentence
          Transformers, and created the developer advocacy engineering and moonshot teams.
        source_ids: [site, genaibook-repo]
      - text: >-
          At Google DeepMind, Sanseviero leads a team responsible for the developer experience of AI Studio, the
          Gemini API and Gemma. The work spans integrations with developer tools, documentation and educational
          material, and the developer side of launches for models including Gemini 3, Gemma and Nano Banana.
        source_ids: [site]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Sanseviero writes about machine learning, open source and developer tools on the hackerllama blog, and
          co-wrote the O'Reilly book "Hands-On Generative AI with Transformers and Diffusion Models" with Pedro
          Cuenca, Apolinário Passos and Jonathan Whitaker. At Google, Sanseviero has co-authored developer guides
          for Gemma 3n in June 2025 and Gemma 4 12B in June 2026, the latter covering local inference with tools
          such as llama.cpp and MLX.
        source_ids: [site, genaibook-repo, gemma3n-guide, gemma4-12b-guide]
