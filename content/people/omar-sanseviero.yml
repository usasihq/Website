slug: omar-sanseviero
name: Omar Sanseviero
initials: OS
headline: Developer Experience Lead at Google DeepMind, working on Gemma launches and developer guides
bio:
  text: >-
    Omar Sanseviero leads developer experience at Google DeepMind for AI Studio, the Gemini API,
    and Gemma, including the developer side of model launches. He describes himself as closely
    involved in Google DeepMind's open model efforts, among them MedGemma and EmbeddingGemma. He
    has co-authored Google Developers Blog guides to Gemma 3n, a mobile-first model for on-device
    use, and Gemma 4 12B, which the guide says is small enough to run locally on laptops with a
    dedicated GPU. He was previously Chief Llama Officer and Head of Platform and Community at
    Hugging Face.
  source_ids: [site, gemma3n-guide, gemma4-12b-guide]
