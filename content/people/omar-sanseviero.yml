headline: Developer Experience Lead at Google DeepMind, working on Gemma launches and developer guides
bio:
  text: >-
    Omar Sanseviero leads developer experience at Google DeepMind for AI Studio, the Gemini API and Gemma,
    including the developer side of model launches. Sanseviero's site describes close involvement in
    Google DeepMind's open model efforts, among them MedGemma and EmbeddingGemma. Sanseviero has
    co-authored Google Developers Blog guides to Gemma 3n, a mobile-first model for on-device use, and
    Gemma 4 12B, which the guide says is small enough to run locally on laptops with a dedicated GPU.
    Sanseviero was previously Chief Llama Officer and Head of Platform and Community at Hugging Face.
  source_ids: [site, gemma3n-guide, gemma4-12b-guide]
  reviewed_at: 2026-10-21
