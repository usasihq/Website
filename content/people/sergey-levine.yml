headline: UC Berkeley associate professor working on robot learning; co-author of the π0 robot foundation model paper
bio:
  text: >-
    Sergey Levine is an Associate Professor in the Department of Electrical Engineering and Computer
    Sciences at UC Berkeley, where Levine's research group, the Robotic Artificial Intelligence and
    Learning Lab (RAIL), works on algorithms that let autonomous agents and robots learn complex
    behaviors. Levine is a
    co-author of the π0 vision-language-action flow model paper, and the π0 model is published in
    Physical Intelligence's open-source openpi repository. Levine also co-authored the Trust Region
    Policy Optimization paper and teaches CS 185/285 Deep Reinforcement Learning at Berkeley, with
    lecture recordings shared publicly.
  source_ids: [homepage, pi0-paper, openpi-readme, trpo-paper, cs285]
  reviewed_at: 2026-10-21
