sections:
  - heading: Career
    paragraphs:
      - text: >-
          Levine received a PhD in computer science from Stanford University in 2014 and joined the faculty of
          UC Berkeley's Department of Electrical Engineering and Computer Sciences in fall 2016. Levine's
          research group is the Robotic Artificial Intelligence and Learning Lab (RAIL).
        source_ids: [homepage]
      - text: >-
          At Berkeley, Levine teaches CS 185/285 Deep Reinforcement Learning, whose lecture recordings are
          shared publicly. Levine's homepage also collects talks on topics such as real-world reinforcement
          learning, offline reinforcement learning and planning with reinforcement learning.
        source_ids: [cs285, homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Levine's work focuses on machine learning for decision making and control, with an emphasis on deep
          learning and reinforcement learning. Early contributions include Trust Region Policy Optimization
          (2015) and end-to-end training of deep visuomotor policies that map raw image observations directly
          to torques at a robot's motors (2015), and Levine co-authored Soft Actor-Critic (2018), an off-policy maximum-entropy
          algorithm.
        source_ids: [homepage, trpo-paper, visuomotor-paper, sac-paper]
      - text: >-
          Levine has also worked on offline reinforcement learning, writing a 2020 tutorial and review of the
          area with Aviral Kumar, George Tucker and Justin Fu and co-authoring Conservative Q-Learning. More
          recently, Levine co-authored π0, a vision-language-action flow model for general robot control whose
          weights are published in Physical Intelligence's openpi repository.
        source_ids: [offline-rl-tutorial, cql-paper, pi0-paper, openpi-readme]
