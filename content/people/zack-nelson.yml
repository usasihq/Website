sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Zack Nelson's JerryRigEverything channel, which joined YouTube in July 2012, reviews technology from
          the inside. Its videos include smartphone durability tests,
          teardowns of phones and gaming systems, and step-by-step repair tutorials that show viewers how to
          fix their own electronics.
        source_ids: [channel, about, home]
      - text: >-
          The JerryRigEverything site lists branded projects such as a first look inside the LG G6 smartphone,
          durability tests of the Galaxy S8 and LG G6, and a durability test of a charging cable. Nelson has
          also produced instructional and informational videos for manufacturers and factories.
        source_ids: [branded-content, about]
  - heading: Speaking
    paragraphs:
      - text: >-
          Nelson's site offers talks on social media strategy and building an online business around video,
          and lists appearances at creator events including Playlist Live, VidSummit and The Power of
          Video.
        source_ids: [speaking]
