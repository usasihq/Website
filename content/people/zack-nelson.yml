headline: Creator of JerryRigEverything, a YouTube channel of smartphone durability tests, teardowns, and repairs
bio:
  text: >-
    Zack Nelson makes the YouTube channel JerryRigEverything, which reviews technology from the inside
    through smartphone durability tests, teardown videos, construction overviews, and repair guides.
    The channel's tutorials show viewers how to fix electronics such as phones and gaming systems
    themselves. Zack has also made instructional and informational videos for manufacturers.
  source_ids: [about, home, channel]
