sections:
  - heading: Career
    paragraphs:
      - text: >-
          Oren Etzioni is Professor Emeritus at the University of Washington's Paul G. Allen School of
          Computer Science & Engineering. Etzioni was the founding Chief Executive Officer of the Allen
          Institute for AI, leading it from its start in 2013 until late 2022, and remains an adviser
          and board member there.
        source_ids: [etzioni-site, madrona-profile]
      - text: >-
          While at Ai2, Etzioni built the AI2 Incubator, which spun out more than 20 companies, and
          continues as its technical director. Etzioni joined the venture firm Madrona as a venture
          partner in 2000 and has founded or co-founded companies including Farecast, acquired by
          Microsoft in 2008, and Decide, acquired by eBay in 2013.
        source_ids: [madrona-profile, etzioni-site]
      - text: >-
          Etzioni later founded TrueMedia.org, a nonprofit set up to help identify deepfakes during the
          2024 election season. In December 2025 Georgetown University's Massive Data Institute took
          over the initiative, which it now hosts.
        source_ids: [etzioni-site, truemedia-about]
  - heading: Research
    paragraphs:
      - text: >-
          Etzioni's research at the University of Washington covered meta-search, online comparison
          shopping, machine reading, and open information extraction. Selected works include "A
          Softbot-based Interface to the Internet" (Communications of the ACM, 1994) and "Open
          Information Extraction from the Web" (Communications of the ACM, 2008).
        source_ids: [etzioni-site]
      - text: >-
          AAAI elected Etzioni a Fellow in 2003 for contributions to software agents, web-based
          technology, and intelligent user interfaces. The 2007 Robert S. Engelmore Memorial Award
          recognized research on AI on the Web and the deployment of AI technologies in applications.
        source_ids: [aaai-fellows, aaai-engelmore]
  - heading: Talks and writing
    paragraphs:
      - text: >-
          Etzioni has written for general audiences on artificial intelligence, with pieces in Wired,
          MIT Technology Review, Harvard Business Review, and Communications of the ACM. Etzioni gave
          the TEDx Seattle talk "Artificial Intelligence will empower us, not exterminate us" in
          November 2016 and co-taught a 2020 Coursera lecture with Andrew Ng on natural language
          processing with attention models.
        source_ids: [etzioni-site]
