headline: Founding CEO of Ai2 (2013–2022) and Professor Emeritus at the University of Washington
bio:
  text: >-
    Oren Etzioni was the founding Chief Executive Officer of the Allen Institute for AI (Ai2),
    serving as CEO from the institute's inception in 2013 until late 2022. Etzioni is Professor
    Emeritus at the University of Washington, where Etzioni's research included meta-search, online
    comparison shopping, machine reading, and open information extraction. Etzioni has also founded
    several companies, including Farecast, which was acquired by Microsoft.
