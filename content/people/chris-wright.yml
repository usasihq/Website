sections:
  - heading: Career
    paragraphs:
      - text: >-
          Over more than two decades as a software engineer, Wright has worked in the telecommunications
          industry on high-availability and distributed systems, and in the Linux industry on security,
          virtualization and networking. Red Hat says Wright has been a Linux developer for more than 15 years,
          most of that time on the Linux kernel itself.
        source_ids: [redhat-bio, redhat-author]
      - text: >-
          As Red Hat's chief technology officer, Wright leads the Office of the CTO, which incubates emerging
          technologies and develops Red Hat's outlook on areas such as artificial intelligence, cloud computing,
          distributed storage, software-defined networking, containers, automation and continuous delivery.
          Wright's title also covers global engineering, and Red Hat describes the team's job as guiding the
          company's technology vision and building technologies together with its communities and partners.
        source_ids: [redhat-author, redhat-bio, redhat-leadership]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Wright hosts Technically Speaking, an original Red Hat show in which IT leaders discuss the future of
          technology, with episodes grouped by topics such as AI and machine learning, edge computing and DevOps.
          Wright also writes for the Red Hat blog under an author page that collects Wright's posts.
        source_ids: [technically-speaking, redhat-author]
