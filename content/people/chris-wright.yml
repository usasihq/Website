headline: CTO and Senior Vice President of Global Engineering at Red Hat; longtime Linux kernel developer
bio:
  text: >-
    Chris Wright is Chief Technology Officer and Senior Vice President of Global Engineering at Red Hat,
    leading a team that guides Red Hat's technology vision and co-creates technologies. Red Hat's biography says Wright has spent more than 25 years as
    a software engineer on high-availability and distributed systems, including in telecommunications,
    and has worked on security, virtualization, and networking in Linux, with more than 15 years as a
    Linux developer, most of it deep in the Linux kernel.
  source_ids: [redhat-bio, redhat-leadership]
