headline: Co-founder of Boltz and first author of the Boltz-2 preprint on structure and binding affinity prediction
bio:
  text: >-
    Saro Passaro is the first author of "Boltz-2: Towards Accurate and Efficient Binding Affinity
    Prediction" (2025), which presents Boltz-2, a structural biology foundation model that predicts
    both biomolecular structures and binding affinity; the preprint lists Passaro with MIT CSAIL.
    Passaro is also a co-author of Boltz-1 (2024), the open model for biomolecular interaction modeling
    that preceded it, and co-founded Boltz, the public benefit corporation built on these open models,
    with Gabriele Corso and Jeremy Wohlwend.
  source_ids: [boltz2-preprint, boltz-readme, jclinic-2026, boltz-manifesto]
  reviewed_at: 2026-10-22
