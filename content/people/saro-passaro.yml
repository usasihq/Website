sections:
  - heading: Research
    paragraphs:
      - text: >-
          Passaro co-authored Boltz-1 (2024), an open model for biomolecular interaction modeling, with
          Jeremy Wohlwend, Gabriele Corso and co-authors including Tommi Jaakkola and Regina Barzilay. Passaro
          is first author of the Boltz-2 paper (2025), which describes a model that extends structure
          prediction to binding affinity, a property its abstract describes as critical to molecular
          function and therapeutic efficacy.
        source_ids: [boltz-readme, boltz2-preprint]
      - text: >-
          The Boltz-2 preprint lists authors from MIT CSAIL, the MIT Jameel Clinic, Recursion and Valence
          Labs, and the Boltz repository publishes the code with citations for both Boltz-1 and Boltz-2.
        source_ids: [boltz2-preprint, boltz-readme]
  - heading: Boltz
    paragraphs:
      - text: >-
          When Boltz-1 was presented at MIT in December 2024, MIT described Passaro as an MIT Jameel Clinic
          research affiliate who developed the model with lead developers Jeremy Wohlwend and Gabriele Corso.
          Passaro, Corso and Wohlwend later co-founded Boltz to apply the open models to therapeutic design,
          and the three co-signed the January 2026 manifesto announcing Boltz as a public benefit corporation.
        source_ids: [mit-boltz1-news, jclinic-2026, boltz-manifesto]
