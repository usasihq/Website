headline: Author of Lil'Log, a blog of long-form learning notes on machine learning research
bio:
  text: >-
    Lilian Weng writes Lil'Log, a blog of learning notes on machine learning published since 2017.
    Its long-form posts survey research topics such as scaling laws, recursive self-improvement,
    reward hacking in reinforcement learning, hallucinations in large language models, diffusion
    models for video, LLM-powered autonomous agents, and prompt engineering. Lilian Weng updates
    older posts periodically and notes each update at the top of the post.
  source_ids: [blog, archive, faq]
  reviewed_at: 2026-10-21
