sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Lil'Log's archive begins in June 2017 with "An Overview of Deep Learning for Curious People."
          Early posts include explainers on GANs and Wasserstein GANs, word embeddings, a multi-part series
          on object detection that includes a post on the R-CNN family, and a 2018 post on the multi-armed bandit
          problem.
        source_ids: [archive]
      - text: >-
          From 2023 the archive turns largely to large language models, with posts on inference
          optimization, a second version of "The Transformer Family," prompt engineering, LLM-powered
          autonomous agents, and adversarial attacks on LLMs. Posts in 2024 cover high-quality human data,
          diffusion models for video generation, extrinsic hallucinations, and reward hacking in
          reinforcement learning.
        source_ids: [archive]
      - text: >-
          More recent long-form posts include "Why We Think" (May 2025), "Scaling Laws, Carefully" (June
          2026), and "Harness Engineering for Self-Improvement" (July 2026). Every post in the archive is
          credited to Lilian Weng and lists an estimated reading time.
        source_ids: [archive, blog]
  - heading: Editorial practice
    paragraphs:
      - text: >-
          The blog's FAQ says Lilian Weng updates older posts periodically and adds a one-line note at
          the top of each revised post. It invites readers to report errors or suggest missing papers,
          allows translations that keep a link to the original at the top, and offers an RSS feed for new
          posts.
        source_ids: [faq]
