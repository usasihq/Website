sections:
  - heading: Research
    paragraphs:
      - text: >-
          Jacob Steinhardt's research aims to keep machine learning systems understood by and aligned with
          the people who use them. Steinhardt's work examines how models exploit errors in reward functions,
          including a 2022 study finding that more capable reinforcement learning agents often exploit
          misspecified rewards, and earlier work on certified defenses against data poisoning attacks.
        source_ids: [steinhardt-site, reward-paper, poisoning-paper]
      - text: >-
          Other lines of Steinhardt's research study models' latent activations to understand and adjust how
          outputs are produced, and build systems that summarize large datasets in natural language.
          Steinhardt co-authored the MMLU benchmark for measuring multitask language understanding and the
          study that traced an indirect object identification circuit in GPT-2 small.
        source_ids: [steinhardt-site, mmlu-paper, ioi-paper]
  - heading: Teaching and Transluce
    paragraphs:
      - text: >-
          As a graduate student, Steinhardt was advised by Percy Liang, and during a postdoc year Steinhardt
          worked at OpenAI and Open Philanthropy. At Berkeley Steinhardt has taught courses on
          robust statistics, forecasting, and data, inference and decisions.
        source_ids: [steinhardt-site, teaching]
      - text: >-
          Steinhardt co-founded Transluce and is its CEO; Transluce is a nonprofit lab building public technology for scalable
          oversight of AI. Its tools include Docent, which turns AI agent transcripts into traceable
          measurements for safety evaluations, reinforcement learning monitoring and agent development.
        source_ids: [transluce-site, transluce-about, docent]
