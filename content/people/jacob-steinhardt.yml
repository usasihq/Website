headline: UC Berkeley associate professor of Statistics and EECS; founder and CEO of the nonprofit lab Transluce
bio:
  text: >-
    Jacob Steinhardt is an Associate Professor of Statistics and EECS at UC Berkeley, part of BAIR and
    CLIMB, and the Founder and CEO of Transluce, a nonprofit research lab building open technology for
    understanding frontier AI systems. Steinhardt's research focuses on ensuring machine learning
    systems are understood by and aligned with humans, including work on models' latent activations and
    on systems that summarize large datasets in natural language. Steinhardt co-authored the MMLU
    benchmark paper and the indirect object identification circuit study in GPT-2 small, and spent a
    postdoc year at OpenAI and Open Philanthropy.
