headline: Northeastern professor studying neural-network internals; Bau's lab launched the NDIF project
bio:
  text: >-
    David Bau is an Assistant Professor of Computer Science at Northeastern University's Khoury
    College, where Bau's lab studies the structure and interpretation of deep networks. The lab
    launched the National Deep Inference Fabric (NDIF) project and points researchers to the
    open-source nnsight library, which lets users read and edit a model's internals; Bau is also a
    co-author of the ROME paper on locating and editing factual associations in GPT models. Bau's
    earlier industry work includes heading the team that created Google Talk, contributing to Google
    Image Search, and working on the Trident team for Microsoft Internet Explorer 4.
  source_ids: [baulab, nnsight-repo, rome-paper]
  reviewed_at: 2026-10-13
