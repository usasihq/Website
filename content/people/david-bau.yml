sections:
  - heading: Career
    paragraphs:
      - text: >-
          Bau's CV lists roles at Microsoft from 1993 to 2000, including work on the .NET Common Language
          Runtime and on the Trident engine behind Internet Explorer 4 to 6, followed by heading the design of
          the Weblogic Workshop developer tool at Crossgain and BEA Systems. At Google from 2004 to 2015, Bau
          built the team that created Google Talk, worked on how Google Search handles queries about people,
          and led Google Image Search teams on freshness, a continuous-results redesign and image clustering.
        source_ids: [bau-cv]
      - text: >-
          Bau then completed a PhD in EECS at MIT, with the thesis "Dissection of Deep Neural Networks" advised
          by Antonio Torralba, and was a postdoctoral fellow in Martin Wattenberg's lab at Harvard. Bau joined
          Northeastern's Khoury College as an assistant professor in 2022 and since 2024 has directed the
          National Deep Inference Fabric, a research infrastructure project supported by the National Science Foundation. Since 2013 Bau has also
          directed Pencil Code, an educational programming system that bridges block-based and text-based code.
        source_ids: [bau-cv, baulab]
  - heading: Research
    paragraphs:
      - text: >-
          Bau's early interpretability papers include Network Dissection (CVPR 2017), a way to quantify how interpretable the
          units of a vision network are, and GAN Dissection (ICLR 2019), which applies the same idea to
          generative adversarial networks; a 2020 PNAS paper on the role of individual units and an ECCV 2020
          paper on rewriting a deep generative model extended this work.
        source_ids: [bau-cv]
      - text: >-
          Later work turned to language models. The NeurIPS 2022 paper on locating and editing
          factual associations in GPT (ROME) and its ICLR 2023 follow-up on mass-editing memory in a transformer
          locate where facts are stored and change them directly. The lab's NNsight and NDIF paper (ICLR 2025)
          describes a programming library and a remote inference service that let researchers read and alter
          the internals of large open-weight models.
        source_ids: [rome-paper, bau-cv, nnsight-repo, ndif-site]
