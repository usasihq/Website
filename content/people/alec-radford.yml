sections:
  - heading: Research
    paragraphs:
      - text: >-
          Radford's early work was on generative models of images. As first author of the DCGAN paper, posted in
          November 2015 with Luke Metz and Soumith Chintala, Radford showed how deep convolutional generative
          adversarial networks can learn useful image representations without labels. Radford was also a
          co-author of "Improved Techniques for Training GANs" (2016).
        source_ids: [dcgan-paper, improved-gans-paper]
      - text: >-
          A 2017 paper by Radford with Rafal Jozefowicz and Ilya Sutskever studied byte-level
          recurrent language models and found a single unit that performs sentiment analysis. Radford was first author of "Improving
          Language Understanding by Generative Pre-Training", which pre-trains a Transformer language model on
          unlabelled text and then fine-tunes it for specific tasks, and of the GPT-2 paper in 2019.
        source_ids: [sentiment-paper, gpt1-paper, gpt2-repo]
      - text: >-
          Radford's later first-author work moved across modalities. CLIP (2021) trained image and text encoders
          together on paired captions, and Whisper (2022) trained speech recognition on large amounts of weakly
          supervised audio. Radford also co-authored the Proximal Policy Optimization paper (2017), the
          scaling-laws and GPT-3 papers (2020) and "Zero-Shot Text-to-Image Generation" (2021).
        source_ids: [clip-paper, whisper-paper, ppo-paper, scaling-laws-paper, gpt3-paper, dalle-paper]
  - heading: Independent work
    paragraphs:
      - text: >-
          On papers posted in early 2026, Radford's affiliation is given as Independent. "Shaping capabilities
          with token-level data filtering", written with Neil Rathi, studies removing undesired capabilities by
          filtering pretraining data at the token level. "Learning a Generative Meta-Model of LLM Activations",
          with UC Berkeley researchers, trains generative models on the internal activations of language models
          as an alternative to methods such as sparse autoencoders.
        source_ids: [token-filtering-paper, meta-model-paper]
