headline: First author of GPT-2, CLIP and Whisper at OpenAI; independent researcher on 2026 papers
bio:
  text: >-
    Alec Radford is a machine learning researcher who is first author of the papers behind GPT-2,
    CLIP and Whisper, whose code and model weights OpenAI released publicly. CLIP learns image
    representations by matching images with captions, and Whisper is a speech recognition model
    trained on large-scale weak supervision; both repositories are under the MIT license. Radford also
    co-authored the GPT-3 paper and the OpenAI scaling-laws paper, whose contribution statement says
    Radford helped develop the optimized Transformer implementation and the text datasets. On two
    papers from early 2026, on token-level pretraining data filtering and on generative models of
    language-model activations, Radford is listed as independent.
  source_ids: [gpt2-repo, clip-paper, clip-repo, whisper-paper, whisper-repo, gpt3-paper, scaling-laws-paper, token-filtering-paper, meta-model-paper]
