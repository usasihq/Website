headline: Co-founder and Distinguished Engineer of Weights & Biases; first listed author of the W&B Weave package
bio:
  text: >-
    Shawn Lewis is a co-founder of Weights & Biases and is listed on its leadership page as Distinguished Engineer
    and Cofounder. Lewis founded the company in 2017 with Lukas Biewald and Chris Van Pelt, and is the first author
    listed in the package metadata of Weave, the company's open-source toolkit repository.
  source_ids: [wandb-about, weave-pyproject]
  reviewed_at: 2026-10-22
