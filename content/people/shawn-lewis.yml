sections:
  - heading: Career
    paragraphs:
      - text: >-
          Lewis co-founded Weights & Biases with Lukas Biewald and Chris Van Pelt in 2017. In a June 2019 post marking
          the product's public launch, Biewald described Lewis as a new co-founder and recounted six months of
          building the tool with Lewis, Van Pelt and early users.
        source_ids: [wandb-about, biewald-post]
      - text: >-
          Weights & Biases began with an experiment tracking tool built to help develop models at OpenAI and was
          acquired by CoreWeave in May 2025. Its leadership page lists Lewis as Distinguished Engineer and Cofounder.
        source_ids: [wandb-about]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Lewis is the first listed author in the pyproject metadata of the wandb/weave repository, the open-source
          Weave package maintained by Weights & Biases, with Tim Sweeney and other company engineers listed after.
        source_ids: [weave-pyproject]
