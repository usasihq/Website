headline: GM of IBM Software, India and Software Innovation Lab; formerly vice president for AI at IBM Research
bio:
  text: >-
    Sriram Raghavan is General Manager, IBM Software, India and Software Innovation Lab, according to
    IBM's newsroom biography and IBM Research profile, a role in which Raghavan works closely with IBM
    Research to bring research innovations into IBM's software products. Raghavan was previously Vice
    President, IBM Research AI, responsible for a research agenda spanning foundational and applied AI and
    for moving technology from IBM Research into IBM's software business, and served as IBM chair of the
    MIT-IBM Watson AI Lab. Raghavan began at IBM Research leading research efforts in natural language
    processing, data management, and distributed systems, and co-authored the ACL 2010 paper "SystemT: An
    Algebraic Approach to Declarative Information Extraction."
  source_ids: [ibm-newsroom-bio, ibm-research-profile, mitibm-profile, systemt-paper]
  reviewed_at: 2026-10-13
