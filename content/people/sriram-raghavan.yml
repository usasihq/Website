sections:
  - heading: Career
    paragraphs:
      - text: >-
          Sriram Raghavan began an IBM career of more than two decades at the Almaden Research Center,
          leading research efforts in natural language processing, data management, and distributed
          systems. Raghavan later directed the IBM Research Lab in India and served as Chief Technology
          Officer for IBM India and South Asia.
        source_ids: [ibm-newsroom-bio, ibm-research-profile]
      - text: >-
          As Vice President, IBM Research AI, Raghavan led a worldwide research team across IBM Research
          locations, set the agenda for foundational and applied AI research, and oversaw technology
          transfer into IBM's software business. In that period Raghavan was also the IBM chair of the
          MIT-IBM Watson AI Lab.
        source_ids: [ibm-research-profile, mitibm-profile, ibm-newsroom-bio]
      - text: >-
          Raghavan is now General Manager of IBM Software, India, leading the country's software
          engineering and product management organization, and General Manager of the Software
          Innovation Lab, a global group of scientists and engineers that works with IBM Research to turn
          research into software products.
        source_ids: [ibm-newsroom-bio]
  - heading: Research and writing
    paragraphs:
      - text: >-
          Raghavan's IBM Research publication list includes the 2010 ACL paper on SystemT, an algebraic
          approach to declarative information extraction, and the 2011 SIGMOD paper on the SystemT IDE,
          along with later work on search database systems, analytic workflows on Hadoop, and indexing
          and matching trajectories.
        source_ids: [systemt-paper, ibm-research-profile]
      - text: >-
          On the IBM Research blog, Raghavan wrote an April 2023 deep dive on how IBM tailors generative
          AI for enterprises, co-wrote a May 2023 post on IBM's geospatial foundation model with Christina
          Shim, and co-signed the 2024 IBM Research annual letter with Mukesh Khare and Jay Gambetta.
        source_ids: [ibm-research-profile]
