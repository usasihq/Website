headline: Co-founder and VP of Engineering at Databricks, heading its AI efforts; Apache Spark committer
bio:
  text: >-
    Patrick Wendell is a co-founder of Databricks and its VP of Engineering; Databricks' Data + AI
    Summit 2026 speaker page says Wendell leads the company's AI efforts, including products such as
    Genie and Unity Gateway. Wendell is listed as a committer on the Apache Spark project's
    committers page, with Databricks as the organization. Wendell is also one of the bylined authors of Databricks' June 2024 post announcing the
    open-sourcing of Unity Catalog.
  source_ids: [dais-wendell, spark-committers, uc-post]
  reviewed_at: 2026-10-13
