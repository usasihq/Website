headline: Microsoft Technical Fellow and CVP setting direction for AI models; co-founder of MSR's Deep Learning Group
bio:
  text: >-
    Jianfeng Gao is a Technical Fellow and Corporate Vice President at Microsoft. Gao's Microsoft
    Research page describes Gao setting company-wide direction for the AI models behind Bing, Azure AI,
    Microsoft 365, and Copilot, and heading a Microsoft Research-backed investment in core capabilities
    such as multimodal reasoning, agentic coding, tool use, and long-context modeling. Gao was earlier a Distinguished Scientist and Vice President at
    Microsoft Research and a co-founder of its Deep Learning Group, and co-invented the deep structured
    semantic models (DSSM) used in web search. Gao is a co-author of the Phi-3 technical report and of
    LLaVA-Med, a vision-language assistant for biomedicine, and also serves as an Adjunct Professor at
    the University of Washington.
  source_ids: [msr-profile, phi3-paper, dssm-pub, llava-med-paper]
  reviewed_at: 2026-10-21
