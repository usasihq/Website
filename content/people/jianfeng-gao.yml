sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jianfeng Gao spent 1999 to 2005 as a research lead in the Natural Language Computing Group at
          Microsoft Research Asia, where the group built a Chinese speech recognition system shipped with
          Microsoft Office, Chinese and Japanese input method editors, and the natural language platform
          for Windows Vista. From 2005 to 2006 Gao was a research lead in Microsoft's Natural Interactive
          Services Division, working on a natural user interface effort for Windows.
        source_ids: [msr-profile]
      - text: >-
          From 2006 to 2014 Gao was a Principal Researcher in the Natural Language Processing Group at
          Microsoft Research in Redmond, working on web search, the Bing speller, query understanding,
          ads prediction and statistical machine translation. Gao later co-founded and long led the
          Deep Learning Group at Microsoft Research, rising to Distinguished Scientist and Vice President,
          and now serves as a Technical Fellow and Corporate Vice President.
        source_ids: [msr-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Gao's Microsoft Research page credits Gao as a co-inventor of the OWL-QN method, a variant of
          L-BFGS for optimizing sparse linear models, and of deep structured semantic models (DSSM). The
          DSSM paper, presented at CIKM in October 2013, learns semantic representations of queries and
          documents from search clickthrough data.
        source_ids: [msr-profile, dssm-pub]
      - text: >-
          With Michel Galley and Lihong Li, Gao wrote "Neural Approaches to Conversational AI", a survey
          of neural methods for question answering, task-oriented dialogue and chatbots, first
          posted in 2018. More recent co-authored work includes LLaVA-Med (2023), a vision-language
          assistant for biomedicine, and the Phi-3 technical report (2024).
        source_ids: [convai-survey, llava-med-paper, phi3-paper]
