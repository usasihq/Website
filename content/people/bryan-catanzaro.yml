work:
  - name: Megatron-LM
    artifact_slug: megatron-lm
    type: open-source
    url: https://github.com/NVIDIA/Megatron-LM
    contribution: >-
      Co-author, with Mohammad Shoeybi, Mostofa Patwary, Raul Puri, Patrick LeGresley and Jared
      Casper, of the 2019 Megatron-LM paper on intra-layer model parallelism for training
      transformer language models; the NVIDIA/Megatron-LM repository README asks users to cite
      this paper.
    source_ids: [megatron-paper, megatron-readme]
  - name: NVIDIA Nemotron
    artifact_slug: nemotron
    type: open-weights
    url: https://research.nvidia.com/labs/nemotron/files/NVIDIA-Nemotron-3-White-Paper.pdf
    contribution: >-
      Listed in the leadership credits and the NVFP4 contributor group of the NVIDIA Nemotron 3
      white paper (December 2025), which states that NVIDIA will release the model weights,
      training datasets and recipes; also wrote NVIDIA's September 2025 post "Open Secret: How
      NVIDIA Nemotron Models, Datasets and Techniques Fuel AI Development".
    source_ids: [nemotron3-paper, nvidia-blog-author]
  - name: cuDNN
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/1410.0759
    contribution: >-
      Co-author of "cuDNN: Efficient Primitives for Deep Learning" (2014), which describes a
      BLAS-like library of optimized deep learning routines for GPUs; NVIDIA's developer blog says
      Catanzaro's research at NVIDIA led to the creation of cuDNN.
    source_ids: [cudnn-paper, nvidia-dev-author]
