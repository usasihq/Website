sections:
  - heading: Career
    paragraphs:
      - text: >-
          Bryan Catanzaro earned a PhD in Electrical Engineering and Computer Sciences at the University
          of California, Berkeley, focusing on parallel computing, machine learning, and programming
          models. NVIDIA's blogs say Catanzaro's research at NVIDIA led to the creation of the cuDNN
          library. The developer blog adds that, prior to NVIDIA, Catanzaro worked at Baidu on systems
          for training and deploying end-to-end deep learning speech recognition.
        source_ids: [nvidia-blog-author, nvidia-dev-author]
      - text: >-
          As Vice President of Applied Deep Learning Research at NVIDIA, Catanzaro leads a team applying
          deep learning to areas from language understanding and video games to computer graphics and
          chip design, and helped lead the team that invented DLSS 2.0. NVIDIA's GTC session listings for
          October 2026 include a talk by Catanzaro on building open models that developers can inspect,
          adapt, and deploy.
        source_ids: [nvidia-dev-author, nvidia-blog-author, gtc-berlin-2026]
  - heading: Research
    paragraphs:
      - text: >-
          Catanzaro co-authored the 2014 cuDNN paper, which describes a library of optimized deep
          learning primitives for GPUs, and the 2015 Deep Speech 2 paper on end-to-end speech recognition
          in English and Mandarin.
        source_ids: [cudnn-paper, deepspeech2-paper]
      - text: >-
          Catanzaro's language model work includes the 2019 Megatron-LM paper on intra-layer model
          parallelism and the 2021 paper on efficient large-scale training on GPU clusters with
          Megatron-LM. Catanzaro also wrote NVIDIA technical blog posts on Megatron, including one on
          scaling training to a trillion parameters, and a 2023 post introducing NeMo Data Curator for
          building trillion-token datasets.
        source_ids: [megatron-paper, megatron-readme, megatron-scale-paper, nvidia-dev-author]
  - heading: Open models
    paragraphs:
      - text: >-
          In 2025 Catanzaro wrote a series of NVIDIA blog posts on the company's open models and data,
          including the September post on how Nemotron models, datasets, and techniques are shared, an
          October post on open models for language, biology, and robotics, and a December post on open
          model development announced at NeurIPS. Catanzaro is also listed in the leadership credits of
          the December 2025 Nemotron 3 white paper.
        source_ids: [nvidia-blog-author, nemotron3-paper]
