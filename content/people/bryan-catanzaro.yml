headline: VP of Applied Deep Learning Research at NVIDIA; co-author of the Megatron-LM and cuDNN papers
bio:
  text: >-
    Bryan Catanzaro is Vice President of Applied Deep Learning Research at NVIDIA, where Catanzaro
    leads a team applying deep learning to problems that range from language understanding and
    video games to computer graphics and chip design. Catanzaro co-authored the 2014 paper
    introducing cuDNN, a library of optimized deep learning routines for GPUs, and the 2019 Megatron-LM
    paper on training multi-billion-parameter language models with model parallelism; NVIDIA's
    developer blog also credits Catanzaro with helping lead the team that invented DLSS 2.0.
    Catanzaro appears in the leadership credits of NVIDIA's Nemotron 3 white paper and wrote
    NVIDIA's September 2025 blog post on how Nemotron models, datasets and techniques are shared
    openly. Before NVIDIA, Catanzaro worked at Baidu on systems for training and deploying
    end-to-end deep learning speech recognition.
  source_ids: [nvidia-blog-author, nvidia-dev-author, gtc-berlin-2026, cudnn-paper, megatron-paper, nemotron3-paper]
  reviewed_at: 2026-10-21
