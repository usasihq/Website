headline: First author of the Hyperopt paper and co-developer of Theano; former Research Scholar at Harvard
bio:
  text: >-
    James Bergstra co-developed Theano, an open-source optimizing compiler that can use GPUs, and
    is first author of "Hyperopt: a Python library for model selection and hyperparameter
    optimization" (2015); the Hyperopt project's BSD-style license names Bergstra as copyright
    holder. A 2012 University of British Columbia talk listing described Bergstra as a Research
    Scholar at Harvard University in David Cox's biological and computer vision group at the
    Rowland Institute, with research including hyperparameter optimization. Bergstra was then a
    postdoc at the University of Waterloo's Centre for Theoretical Neuroscience and a co-author of
    the paper "Nengo: A Python tool for building large-scale functional brain models" (2014).
