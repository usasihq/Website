sections:
  - heading: Career
    paragraphs:
      - text: >-
          Bergstra completed a master's degree in 2006 under Douglas Eck, on algorithms for classifying
          recorded music by genre, and doctoral studies at the University of Montreal in July 2011 under Yoshua
          Bengio, with a dissertation on incorporating complex cells into deep learning models. During graduate
          work, Bergstra co-developed Theano, an open-source optimizing compiler that can use GPUs for
          high-performance computation.
        source_ids: [waterloo-profile, ubc-talk]
      - text: >-
          Bergstra then spent a year as a Research Scholar in David Cox's computer and biological vision group
          at Harvard's Rowland Institute, and moved on to a postdoctoral position under Chris Eliasmith in the
          Centre for Theoretical Neuroscience at the University of Waterloo.
        source_ids: [ubc-talk, waterloo-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Much of Bergstra's research concerns hyperparameter optimization. "Random Search for
          Hyper-Parameter Optimization" (2012), with Yoshua Bengio, showed empirically and theoretically that
          randomly chosen trials are more efficient than a grid. "Algorithms for Hyper-Parameter Optimization"
          (NIPS 2011), with Rémi Bardenet, Bengio and Balázs Kégl, introduced sequential methods based on the
          expected improvement criterion for configuring neural networks and deep belief networks.
        source_ids: [jmlr-random-search, tpe-paper]
      - text: >-
          Bergstra is first author of the 2015 journal paper describing the Hyperopt Python library, whose
          license names Bergstra as copyright holder, and co-authored Hyperopt-Sklearn for automatic
          configuration of scikit-learn models. At Waterloo, Bergstra also co-authored Nengo, a
          Python tool for building large-scale functional brain models.
        source_ids: [waterloo-profile, hyperopt-license]
