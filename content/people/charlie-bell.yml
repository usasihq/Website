sections:
  - heading: Career
    paragraphs:
      - text: >-
          Charlie Bell spent more than two decades at Amazon Web Services, helping build its cloud
          infrastructure from the start. As a Senior Vice President at AWS, Bell led core
          engineering, utility computing, and operational teams, and in 2020 recorded a CVPR fireside
          chat with computer vision researcher Jitendra Malik for Amazon Science.
        source_ids: [tenable-2026, science-cvpr-2020]
      - text: >-
          Bell then joined Microsoft as Executive Vice President of Security, Compliance, Identity and
          Management, building that organization and overseeing enterprise security strategy,
          product engineering, and threat intelligence operations. In February 2026 Microsoft
          CEO Satya Nadella announced that Bell would take on a new role focused on engineering
          quality, reporting to the CEO and partnering with Scott Guthrie and Mala Anand on the
          company's Quality Excellence Initiative; the note described the change as reflecting
          Bell's wish to move from leading an organization to working as an individual-contributor
          engineer.
        source_ids: [tenable-2026, ms-2026, ms-bio-2025]
      - text: >-
          In October 2026, Tenable, an exposure management company, appointed Bell to its board of
          directors, citing Bell's background in building and scaling cloud systems.
        source_ids: [tenable-2026]
  - heading: Security work at Microsoft
    paragraphs:
      - text: >-
          Microsoft launched its Secure Future Initiative on 2 November 2023. As part of the launch,
          Bell sent Microsoft employees an email, co-authored with Scott Guthrie and Rajesh Jha,
          setting a new standard for how the company designs, builds, tests, and operates its
          technology.
        source_ids: [sfi-2023]
      - text: >-
          In November 2025, Bell wrote on the Official Microsoft Blog about AI agents in
          cybersecurity, describing how agents can either strengthen defenses or open new risks.
        source_ids: [ms-bio-2025]
