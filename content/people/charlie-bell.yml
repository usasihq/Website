headline: Former AWS senior vice president and Microsoft security executive; Tenable board member since October 2026
bio:
  text: >-
    Charlie Bell spent more than two decades at Amazon Web Services, where, as a Senior Vice
    President, Bell oversaw core engineering, utility computing and operational teams. Bell then
    served as Microsoft's Executive Vice President of Security, Compliance, Identity and
    Management, building that organization and helping drive the company's Secure Future
    Initiative; in February 2026, Microsoft announced that Bell would take on a new role focused
    on engineering quality as an individual-contributor engineer. In October 2026, Tenable
    appointed Bell to its board of directors.
