headline: Chair and Chief Executive Officer of AMD
bio:
  text: >-
    Lisa Su is Chair and Chief Executive Officer of AMD. Before becoming chair and CEO, Su was AMD's
    chief operating officer, having joined AMD in January 2012 as senior vice president and general
    manager, global business units. Earlier, Su was chief technology officer and then senior vice
    president and general manager, Networking and Multimedia, at Freescale Semiconductor; spent 13
    years at IBM in engineering and business leadership roles, including vice president of the
    Semiconductor Research and Development Center; and was a member of the technical staff at Texas
    Instruments. AMD's June 2025 Advancing AI release quotes Su on the launch of the AMD Instinct
    MI350 series accelerators and growing momentum for the ROCm open software stack, and AMD's
    leadership page lists honors including the 2026 National Medal of Science and the IEEE Robert N.
    Noyce Medal.
  source_ids: [amd-su-bio, amd-leadership, amd-advancing-ai-2025]
  reviewed_at: 2026-10-21
