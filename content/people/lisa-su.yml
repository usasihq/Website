sections:
  - heading: Career
    paragraphs:
      - text: >-
          Su was a member of the technical staff at Texas Instruments from 1994 to 1995,
          then spent 13 years at IBM in engineering and business leadership roles, including vice president of
          the Semiconductor Research and Development Center, responsible for the direction of IBM's silicon
          technologies and semiconductor R&D.
        source_ids: [amd-board, amd-su-bio]
      - text: >-
          Su joined Freescale Semiconductor in 2007 as chief technology officer and later led its Networking
          and Multimedia business. Su joined AMD in January 2012 as senior vice president and general manager
          of global business units, became chief operating officer in July 2014, and was appointed president and
          chief executive officer in October 2014. AMD's board named Su its chair in February 2022.
        source_ids: [amd-board, amd-ceo-release, amd-su-bio]
  - heading: AI products and industry roles
    paragraphs:
      - text: >-
          At AMD's Advancing AI event in June 2025, the company presented an end-to-end AI platform built on open
          industry standards, including the AMD Instinct MI350 series accelerators and the ROCm open software
          stack for GPU computing.
        source_ids: [amd-advancing-ai-2025, rocm-docs]
      - text: >-
          Outside AMD, Su chairs the board of the Semiconductor Industry Association and was appointed to the
          President's Council of Advisors on Science and Technology.
        source_ids: [amd-su-bio]
