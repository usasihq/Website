sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Figure, Adcock founded Archer and Vettery. In a master plan published in May
          2022 and signed as founder and CEO, Adcock described Figure as a sole focus to be built
          with a 30-year view.
        source_ids: [figure-master-plan]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Figure's first robot, F.01, took its first steps in May 2023. F.02 refined the design for
          work deployments with improved hands and a battery integrated into the torso, and
          Figure 03, introduced in October 2025, was redesigned for home use around the Helix model.
        source_ids: [figure-company, figure-03]
      - text: >-
          Helix, introduced in February 2025, is a generalist vision-language-action model that
          joins perception, language understanding and learned control. Helix 02, announced in
          January 2026, extends that control from the upper body to walking, manipulation and
          balance as one system, and in August 2026 Figure introduced Index, a dataset of
          real-world physical data for training robots.
        source_ids: [figure-helix, figure-helix-02, figure-index]
