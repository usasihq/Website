headline: Founder and CEO of Figure, which builds general-purpose humanoid robots and the Helix robot model
bio:
  text: >-
    Brett Adcock is the founder and CEO of Figure, an AI robotics company building a general-purpose
    humanoid robot and Helix, its vision-language-action model for robot control. Adcock set out
    Figure's goals in a 2022 master plan, and previously founded the companies Archer and Vettery.
  source_ids: [figure-master-plan, figure-helix]
  reviewed_at: 2026-10-21
