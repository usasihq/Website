headline: Co-founder and CEO of Chai Discovery, which builds AI models for designing molecules and antibodies
bio:
  text: >-
    Joshua Meier is a co-founder and the CEO of Chai Discovery, a company that builds AI models for
    designing molecules, including the open Chai-1 structure prediction model and the Chai-2
    antibody design model. Meier founded Chai Discovery in 2024 with Jack Dent, Matthew McPartlon
    and Jacques Boitreaud.
  source_ids: [chai-novartis, chai-readme, chai-2-mab]
  reviewed_at: 2026-10-21
