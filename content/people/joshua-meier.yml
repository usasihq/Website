sections:
  - heading: Chai Discovery
    paragraphs:
      - text: >-
          Meier co-founded Chai Discovery in 2024 with Jack Dent, Matthew McPartlon and Jacques
          Boitreaud; the company describes its team's backgrounds as spanning OpenAI, Meta FAIR,
          Stripe, molecular design and academic research. Chai Discovery says it is building a
          computer-aided design suite for molecules.
        source_ids: [chai-novartis, chai-home]
      - text: >-
          Chai's open chai-lab repository hosts Chai-1, described in the 2024 technical report
          "Chai-1: Decoding the molecular interactions of life", and cites a 2025 Chai-2 report on
          zero-shot antibody design.
        source_ids: [chai-readme]
  - heading: Products and projects
    paragraphs:
      - text: >-
          In November 2025 Chai published results on antibodies designed by Chai-2 against
          challenging targets, including tests of developability. In July 2026 Meier announced a
          collaboration with Novartis on AI-driven antibody discovery that gives Novartis access to
          Chai's newer models, including Chai-3.
        source_ids: [chai-2-mab, chai-novartis]
