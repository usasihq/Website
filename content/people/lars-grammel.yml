headline: Works on Vercel's AI SDK; first author of the AI SDK 5 release post and co-author of later releases
bio:
  text: >-
    Lars Grammel works on Vercel's open-source AI SDK, a TypeScript toolkit for building AI
    applications and agents; Grammel's GitHub profile lists Vercel. Grammel co-wrote the May 2024 AI
    SDK 3.1 post, which announced that the ModelFusion project was joining the team, and is the
    first-listed author of the AI SDK 5 release post (July 2025). Grammel's name appears on Vercel's
    release posts for AI SDK 3.2 through AI SDK 7 (June 2026).
  source_ids: [grammel-github, vercel-ai-sdk-3-1, vercel-ai-sdk-5, vercel-author-grammel, vercel-ai-sdk-7]
  reviewed_at: 2026-10-22
