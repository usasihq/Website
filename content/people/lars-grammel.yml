sections:
  - heading: AI SDK
    paragraphs:
      - text: >-
          Grammel co-wrote, with Jared Palmer, Vercel's May 2024 post on AI SDK 3.1, which announced that
          ModelFusion was joining the team and introduced AI SDK Core as a unified API for generating text,
          structured objects and tool calls. Grammel then appeared on the author lists of the AI SDK 3.2, 3.3,
          3.4, 4.0, 4.1 and 4.2 release posts.
        source_ids: [vercel-ai-sdk-3-1, vercel-author-grammel, vercel-ai-sdk-4]
      - text: >-
          Grammel is first-listed author of the AI SDK 5 post from July 2025 and a co-author of the AI SDK 6
          (December 2025) and AI SDK 7 (June 2026) posts. In 2025 Grammel also co-wrote, with Walter Korman,
          Vercel's announcement of the AI Gateway, and in 2026 co-wrote a post on building a software factory
          for the AI SDK.
        source_ids: [vercel-ai-sdk-5, vercel-ai-sdk-6, vercel-ai-sdk-7, vercel-author-grammel]
