headline: ML engineer at Hugging Face; second author of the FineWeb and FineWeb2 dataset papers
bio:
  text: >-
    Hynek Kydlíček is a machine learning engineer at Hugging Face. Kydlíček is the second author of
    the FineWeb datasets paper (2024) and the FineWeb2 paper (2025), both first-authored by Guilherme Penedo,
    and a co-author of the FineTranslations dataset and of the SmolLM2 paper (2025).
  source_ids: [hk-github, fineweb-paper, fineweb2-paper, gp-site, smollm2-paper]
  reviewed_at: 2026-10-22
