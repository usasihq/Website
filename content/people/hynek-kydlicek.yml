sections:
  - heading: Research
    paragraphs:
      - text: >-
          Kydlíček's early work includes a 2023 dataset and baselines for classifying Czech news texts
          and contributions to the BenCzechMark benchmark (2024). At Hugging Face Kydlíček co-authored
          the FineWeb (2024) and FineWeb2 (2025) dataset papers as second author.
        source_ids: [czech-news-paper, benczechmark-paper, fineweb-paper, fineweb2-paper, hk-github]
      - text: >-
          Kydlíček is also a co-author of the SmolLM2 paper (2025), of the FineTranslations dataset (2026)
          and of a 2026 study on synthesizing pretraining data.
        source_ids: [smollm2-paper, gp-site, synth-data-paper]
