sections:
  - heading: Career
    paragraphs:
      - text: >-
          Komatsuzaki's own page describes work on generative AI since 2017, with a focus on Transformer
          decoders, and a PhD in machine learning from Georgia Tech completed in 2023. In 2022 Komatsuzaki was
          an intern at Google Research, where the sparse upcycling work was carried out.
        source_ids: [aran-about, upcycling-paper]
  - heading: Open models and datasets
    paragraphs:
      - text: >-
          GPT-J-6B, a six-billion-parameter JAX-based Transformer language model, was released in June 2021
          with Ben Wang. The release post credits Komatsuzaki with proposing the project, designing its
          high-level plan and configurations, writing the article, and advising Wang, who wrote the code and
          ran the experiments; the model was built with assistance from EleutherAI.
        source_ids: [gptj-post, gptj-readme]
      - text: >-
          Komatsuzaki describes co-leading the development of the LAION image-text datasets and is a co-author
          of the LAION-400M paper (2021), which released an open dataset of CLIP-filtered image-text pairs.
        source_ids: [aran-about, laion400m-paper]
  - heading: Research
    paragraphs:
      - text: >-
          In "One Epoch Is All You Need" (2019), Komatsuzaki proposed training language models on a larger
          dataset for only one or a few epochs instead of many passes over a smaller one, adjusting
          regularization and model size to the compute budget. The 2022 sparse upcycling paper, with Google
          Research co-authors, initializes a sparsely activated mixture-of-experts model from a dense
          pretrained checkpoint to add capacity with modest extra training.
        source_ids: [one-epoch-paper, upcycling-paper, aran-about]
