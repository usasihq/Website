headline: Co-author of the GPT-J-6B open model; first author of the Sparse Upcycling paper from Google Research
bio:
  text: >-
    Aran Komatsuzaki works on generative AI and, by Komatsuzaki's own account, co-led the
    development of GPT-J in 2021 and of the LAION image-text datasets. The GPT-J repository's
    citation entry for the GPT-J-6B weights, released under the Apache 2.0 license, names Ben Wang
    and Komatsuzaki as authors. During a 2022 internship at Google Research, Komatsuzaki
    co-proposed sparse upcycling, a way to turn a pretrained dense model into a mixture-of-experts
    model, and is first author of the paper that introduced it.
  source_ids: [aran-about, gptj-readme, upcycling-paper]
  reviewed_at: 2026-10-13
