sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kylie Robison worked at Fortune and became a senior AI reporter at The
          Verge and then a senior correspondent at WIRED covering the business of artificial intelligence. Robison
          joined Core Memory, a science and technology publication and production company, as a writer and host.
        source_ids: [core-memory-bio, verge-author, wired-author]
  - heading: Coverage
    paragraphs:
      - text: >-
          Robison's first Core Memory piece, published in December 2025, was a feature on San Francisco's online
          underground. Since then Robison has written features such as a profile of Minerva Humanoids, which builds
          robots for oil rigs and bomb disposal, and an October 2026 episode of Core Memory's Canada series about the
          University of Waterloo.
        source_ids: [cm-first-piece, cm-minerva, cm-waterloo]
      - text: >-
          Robison has also shared a byline with Ashlee Vance on a Core Memory podcast episode post: the September
          2026 episode in which Vance interviewed Seamus Blackley, who talked Microsoft into building the Xbox.
        source_ids: [cm-blackley, core-memory-about]
