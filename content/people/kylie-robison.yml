headline: Writer and host at Core Memory reporting on technology; formerly a WIRED senior correspondent on AI
bio:
  text: >-
    Kylie Robison is a writer and host at Core Memory, a science and technology publication and
    production company, where Kylie reports on the people and machines shaping technology through
    long-form features and on-camera interviews. Kylie was previously a senior correspondent at WIRED
    covering the business of artificial intelligence, a senior AI reporter at The Verge, and a reporter
    at Fortune and Business Insider.
