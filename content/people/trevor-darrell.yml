sections:
  - heading: Career
    paragraphs:
      - text: >-
          Trevor Darrell was a member of the research staff at Interval Research Corporation from 1996
          to 1999, then joined the MIT EECS faculty, where Darrell directed the Vision Interface Group
          until 2008. From 2008 to 2014 Darrell led the Vision group at the International Computer
          Science Institute, which is affiliated with the University of California.
        source_ids: [homepage]
      - text: >-
          At UC Berkeley, Darrell is a founding co-director of Berkeley Artificial Intelligence Research
          (BAIR), Berkeley DeepDrive and the BAIR Commons program, and was Faculty Director of the PATH
          research center from 2015 to 2021. Darrell teaches graduate courses on large-scale vision and
          language models and on moving from research to startup, and co-founded and serves as
          President of Prompt AI.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Darrell's group develops algorithms for large-scale perceptual learning, including object and
          activity recognition and detection, with applications in autonomous vehicles, media search
          and multimodal interaction with robots and mobile devices. Darrell's interests span computer
          vision, machine learning, natural language processing and perception-based human-computer
          interfaces.
        source_ids: [homepage]
      - text: >-
          Darrell is a co-author of R-CNN (2013), which combined region proposals with convolutional
          network features for object detection, and of the 2014 paper on fully convolutional networks
          for semantic segmentation. Later co-authored work includes "A ConvNet for the 2020s" (2022),
          which introduced the ConvNeXt family of convolutional models.
        source_ids: [rcnn-paper, fcn-paper, convnext-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Darrell co-authored the 2014 paper describing Caffe, a deep learning framework. The Caffe
          repository describes the project as developed by Berkeley AI Research and the Berkeley Vision
          and Learning Center with community contributors, and releases it under the BSD 2-Clause
          license.
        source_ids: [caffe-paper, caffe-readme]
