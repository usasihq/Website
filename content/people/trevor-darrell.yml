headline: UC Berkeley professor who founded and co-leads BAIR; co-author of Caffe and R-CNN; President of Prompt AI
bio:
  text: >-
    Trevor Darrell is on the faculty of the CS and EE Divisions of the EECS Department at UC
    Berkeley, where Darrell founded and co-leads the Berkeley Artificial Intelligence Research (BAIR)
    lab, the Berkeley DeepDrive industrial consortia, and the BAIR Commons program. Darrell's group
    develops algorithms for large-scale perceptual learning, including object and activity
    recognition and detection. Darrell was previously on the MIT EECS faculty (1999–2008), directing
    the Vision Interface Group, and co-founded and serves as President of Prompt AI. Darrell is a
    co-author of the 2014 Caffe paper — Caffe is a BSD-licensed framework developed by BAIR and the
    Berkeley Vision and Learning Center with community contributors — and of the R-CNN and ConvNeXt
    papers.
  source_ids: [homepage, caffe-paper, caffe-readme, rcnn-paper, convnext-paper]
  reviewed_at: 2026-10-13
