    source_ids: [tvm-arduino]
  - date: "2022-10-11"
    text: Added Cortex-M DSP schedules for optimal conv2d layouts to Apache TVM.
    source_ids: [tvm-cortexm-dsp]
  - date: "2023-03-02"
    text: Contributed QNN-based schedules to improve microTVM performance on Cortex-M.
    source_ids: [tvm-qnn]
  - date: "2026-06-30"
