headline: Co-founder and CEO of Etched, which builds inference chips and racks; former Apache TVM contributor
bio:
  text: >-
    Gavin Uberti is a co-founder and the CEO of Etched, a company that co-designs chips, racks,
    software and manufacturing methods for running frontier AI models. Etched lists Uberti as a
    Thiel Fellow and an AI compiler engineer who developed the Arm Cortex-M backend for
    the open-source Apache TVM compiler.
  source_ids: [etched-home, etched-progress, github-profile]
  reviewed_at: 2026-10-21
affiliations:
  - name: Etched
    organization_slug: etched
    role: Co-founder and CEO
    current: true
    source_ids: [etched-home, github-profile]
work:
  - name: Apache TVM microTVM and Arm Cortex-M schedules
    artifact_slug: null
    url: https://github.com/apache/tvm/commit/fcbcd156c7dd995b24b363dbddca5a8766648693
    type: open-source
    contribution: >-
      Contributed microTVM support in Apache TVM, including Arduino project API support in 2021
      and Arm Cortex-M DSP convolution schedules in 2022 and 2023, the work Etched describes as
      developing TVM's Cortex-M backend.
    source_ids: [tvm-arduino, tvm-cortexm-dsp, tvm-qnn, etched-home]
  - name: Etched frontier inference clusters
    artifact_slug: null
    url: https://www.etched.com/progress
    contribution: >-
      Leads the company building co-designed chips, packages, boards, cooling and interconnects
      for inference; Etched reported its A0 silicon back from TSMC N4P and shipped its first rack
      in 2026.
    source_ids: [etched-progress, etched-zero-to-one]
links:
  - label: GitHub
    url: https://github.com/guberti
sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Before Etched, Uberti contributed to microTVM, the part of the Apache TVM compiler that
          targets microcontrollers. Commits from 2021 added Arduino support to microTVM's project
          API, and later commits added and modernized Cortex-M DSP schedules for convolution and
          used quantized schedules to speed up models on Arm Cortex-M chips.
        source_ids: [tvm-arduino, tvm-cortexm-dsp, tvm-qnn]
  - heading: Etched
    paragraphs:
      - text: >-
          Uberti co-founded Etched with Robert Wachen and Chris Zhu, and the company's site lists
          Uberti as CEO. Etched says it co-designs chips, racks, software and manufacturing to run
          frontier models for both prefill and decode workloads.
        source_ids: [etched-home, etched-progress]
      - text: >-
          In June 2026 Etched reported that its A0 silicon had come back from TSMC's N4P process and
          that it was validating its first rack-scale product with customers. In August 2026 it
          announced that it had shipped its first rack.
        source_ids: [etched-progress, etched-zero-to-one]
timeline:
