headline: Director of Research at Contextual AI; co-author of the open Contextual AI Reranker v2 models
bio:
  text: >-
    Sheshansh Agrawal is Director of Research at Contextual AI, the title given on the company's blog
    posts from August 2025 to March 2026. Agrawal is the second-listed author, after George Halal, of
    Contextual AI Reranker v2, an open-weight family of multilingual instruction-following rerankers
    released in August 2025, and co-authored the company's posts on agentic retrieval and faster search
    agents.
  source_ids: [ctx-rerank-v2-blog, ctx-rerank-v2-card, ctx-graphrag-blog, ctx-search-agents-blog]
  reviewed_at: 2026-10-22
