sections:
  - heading: Research at Contextual AI
    paragraphs:
      - text: >-
          Agrawal is credited as Director of Research on Contextual AI's August 2025 post open-sourcing
          Reranker v2, written with George Halal, which released instruction-following multilingual rerankers in
          1B, 2B and 6B sizes along with evaluation datasets. The 2B model card's citation lists Halal and
          Agrawal as authors.
        source_ids: [ctx-rerank-v2-blog, ctx-rerank-v2-card]
      - text: >-
          Agrawal also co-authored the company's November 2025 post on an agentic alternative to GraphRAG and
          its March 2026 post on making search agents faster and more accurate.
        source_ids: [ctx-graphrag-blog, ctx-search-agents-blog]
