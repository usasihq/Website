sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Zain Kahn is the named author of Superhuman AI, a newsletter whose site describes it as a way
          to learn AI in three minutes a day, covering the latest AI news and tools and how to use them
          at work. Daily editions combine a short news roundup with a step-by-step tutorial and a
          ready-to-use prompt.
        source_ids: [site, archive]
      - text: >-
          The newsletter's archive lists editions under Kahn's byline going back to January 2023, when
          the first issue appeared roughly weekly, and now includes daily editions along with themed
          issues such as Sunday and robotics specials.
        source_ids: [archive, archive-first-page]
