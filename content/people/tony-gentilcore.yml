headline: Co-founder of Glean and its Product Engineering lead; previously founded Google's Chrome Speed Team
bio:
  text: >-
    Tony Gentilcore is a co-founder of Glean and leads the company's product engineering. During a
    decade at Google, Gentilcore helped modernize the web search results page and later founded and
    led the Chrome Speed Team, which contributed to the HTML5 specification and helped form the W3C
    Web Performance Working Group.
