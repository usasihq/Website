sections:
  - heading: Career
    paragraphs:
      - text: >-
          Gentilcore spent about a decade at Google, where Gentilcore helped move the web search results
          page from a static list of links to a JavaScript-based page. Gentilcore later founded and led
          the Chrome Speed Team, whose work included contributions to the HTML5 specification and helping
          to form the W3C Web Performance Working Group.
        source_ids: [glean-about]
      - text: >-
          Gentilcore is one of the founders Glean lists for the company, founded in January 2019, and is
          titled co-founder for engineering. Glean describes Gentilcore's focus as building products with
          fast and smooth user interfaces across device sizes.
        source_ids: [glean-about]
