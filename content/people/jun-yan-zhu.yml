sections:
  - heading: Career
    paragraphs:
      - text: >-
          Zhu completed a PhD in computer science at UC Berkeley from 2013 to 2017, advised by Alexei A. Efros,
          with a thesis on learning to synthesize and manipulate natural images. Zhu then held a postdoctoral
          position at MIT CSAIL with William T. Freeman, Joshua Tenenbaum and Antonio Torralba, and worked as a
          research scientist in Adobe Research's Creative Intelligence Lab.
        source_ids: [zhu-cv]
      - text: >-
          Zhu joined Carnegie Mellon University in 2020 as the Michael B. Donohue Assistant Professor of Computer
          Science and Robotics and became associate professor in 2026, directing the Generative Intelligence Lab.
          Zhu has taught Learning-based Image Synthesis and Visual Learning and Recognition at CMU, and is
          co-founder and Chief Scientist of Nunchux AI, which works on multimodal inference for image, video and
          world models.
        source_ids: [zhu-cv, zhu-site, cmu-lab]
  - heading: Research
    paragraphs:
      - text: >-
          Zhu's research concerns generative models for computer vision, graphics and computational photography.
          The pix2pix paper (2016) used conditional adversarial networks for paired image-to-image translation,
          and CycleGAN (2017), with Zhu as first author, learned translation between image collections without
          paired examples; both are implemented in a BSD-licensed PyTorch repository.
        source_ids: [pix2pix-paper, cyclegan-paper, cyclegan-readme, cyclegan-license]
      - text: >-
          The Generative Intelligence Lab studies how creators can control, customize and rewrite generative
          models, how creators can opt in or out of training data and receive credit, and how synthetic data
          can help computer vision and robotics. Zhu's homepage notes that work such as iGAN, CycleGAN, Swapping
          Autoencoder, Custom Diffusion and GigaGAN contributed to features in Adobe Photoshop and Firefly, and
          that SPADE underlies NVIDIA Canvas.
        source_ids: [zhu-site, cmu-lab]
      - text: >-
          Recent work includes SVDQuant for 4-bit diffusion models and a method for generating physically stable
          brick structures from text, which received the ICCV 2025 Best Paper Award.
        source_ids: [zhu-cv, zhu-site]
