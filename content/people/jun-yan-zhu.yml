headline: CMU associate professor and Nunchux AI co-founder; first author of CycleGAN and co-author of pix2pix
bio:
  text: >-
    Jun-Yan Zhu is the Michael B. Donohue Associate Professor of Computer Science and Robotics in
    Carnegie Mellon University's School of Computer Science, where Zhu leads the Generative
    Intelligence Lab and works on generative models for computer vision, graphics, and computational
    photography. Zhu is also co-founder and Chief Scientist of Nunchux AI. Before joining CMU, Zhu was a
    Research Scientist at Adobe Research and a postdoc at MIT CSAIL. Zhu is first author of the CycleGAN
    paper on unpaired image-to-image translation and co-author of pix2pix, and co-wrote the BSD-licensed
    PyTorch implementation of both with Taesung Park.
  source_ids: [zhu-site, cmu-lab, cyclegan-paper, pix2pix-paper, cyclegan-readme, cyclegan-license]
  reviewed_at: 2026-10-21
