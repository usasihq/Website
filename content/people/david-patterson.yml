headline: Google Fellow and UC Berkeley professor emeritus; co-author of Google TPU papers and MLPerf Training
bio:
  text: >-
    David Patterson is a Google Fellow and the Pardee Professor of Computer Science, Emeritus, at UC
    Berkeley, and Google's research profile says Patterson worked at Berkeley for four decades and at
    Google for one decade. Patterson co-authored the 2017 paper evaluating Google's Tensor Processing
    Unit in production datacenters and later TPU papers, as well as the MLPerf Training Benchmark paper.
    Berkeley's faculty page describes Patterson's Berkeley projects, including RISC, RAID, and Networks
    of Workstations.
  source_ids: [patterson-google, patterson-berkeley, tpu-paper, mlperf-paper]
  reviewed_at: 2026-10-21
