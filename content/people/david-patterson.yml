sections:
  - heading: Career
    paragraphs:
      - text: >-
          David Patterson joined the University of California, Berkeley in 1976 after completing a PhD
          in computer science at UCLA, and spent four decades there before working at Google for a
          decade. At Berkeley, Patterson chaired the Computer Science Division; Patterson also chaired
          the Computing Research Association and served as President of ACM.
        source_ids: [patterson-berkeley, patterson-google]
      - text: >-
          Patterson is now the Pardee Professor of Computer Science, Emeritus, at Berkeley, a Google
          Fellow, and Board Chair of the Laude Institute. Berkeley's faculty page describes Patterson's
          research style as gathering interdisciplinary groups of faculty and students around a question
          for the computing industry and answering it with demonstration systems.
        source_ids: [patterson-google, patterson-berkeley]
  - heading: Research
    paragraphs:
      - text: >-
          Patterson's Berkeley projects included Reduced Instruction Set Computers (RISC), Redundant
          Array of Inexpensive Disks (RAID), and Networks of Workstations (NOW). Berkeley lists computer
          architecture, performance, security, and RISC-V among Patterson's research areas.
        source_ids: [patterson-berkeley]
      - text: >-
          At Google, Patterson co-authored the 2017 analysis of the Tensor Processing Unit, a custom
          chip for neural network inference in Google datacenters, and later papers on TPU v4i, TPU v4,
          and five generations of Google's training supercomputers through Ironwood. Patterson was also
          a co-author of the MLPerf Training Benchmark paper and of papers on the carbon footprint and
          energy use of machine learning.
        source_ids: [tpu-paper, patterson-berkeley, patterson-google, mlperf-paper]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Patterson has co-authored seven books, including two with John Hennessy. Among them are
          Computer Architecture: A Quantitative Approach, now in its 7th edition, Computer Organization
          and Design in a RISC-V edition, and The RISC-V Reader with Andrew Waterman.
        source_ids: [patterson-google, patterson-berkeley]
