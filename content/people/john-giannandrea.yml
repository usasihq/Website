headline: Former Apple senior vice president for Machine Learning and AI Strategy, overseeing Core ML and Siri
bio:
  text: >-
    John Giannandrea joined Apple in April 2018 and was named to the company's executive team that
    December as senior vice president of Machine Learning and Artificial Intelligence Strategy. In that
    role Giannandrea oversaw AI and machine learning strategy across Apple's products and services and
    the development of Core ML and Siri, and the team also worked on developer tools such as Core ML and
    Create ML. Apple announced in December 2025 that Giannandrea was stepping down from the position, at a
    time when the team was responsible for Apple Foundation Models, Search and Knowledge, Machine Learning
    Research, and AI Infrastructure, and would serve as an advisor before retiring in the spring of 2026.
  source_ids: [apple-2018-release, apple-2025-release]
  reviewed_at: 2026-10-13
