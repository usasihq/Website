sections:
  - heading: Apple
    paragraphs:
      - text: >-
          John Giannandrea joined Apple in April 2018, and in December 2018 Apple named Giannandrea to
          its executive team as senior vice president of Machine Learning and Artificial Intelligence
          Strategy. Apple's announcement said Giannandrea oversaw the strategy for AI and machine
          learning across all Apple products and services and the development of Core ML and Siri
          technologies, with a focus on integrating machine learning into products while protecting
          user privacy.
        source_ids: [apple-2018-release]
      - text: >-
          Giannandrea's team also worked on developer tools such as Core ML and Create ML, intended to
          make it easier to add machine learning to apps. By December 2025, Apple said, the team
          Giannandrea had built was responsible for Apple Foundation Models, Search and Knowledge,
          Machine Learning Research and AI Infrastructure.
        source_ids: [apple-2018-release, apple-2025-release]
      - text: >-
          On 1 December 2025 Apple announced that Giannandrea was stepping down as senior vice
          president and would serve as an advisor to the company before retiring in the spring of 2026.
          The same announcement said Amar Subramanya had joined as vice president of AI reporting to
          Craig Federighi, and that the rest of Giannandrea's organization would move to Sabih Khan and
          Eddy Cue.
        source_ids: [apple-2025-release]
