headline: Author of the SemiAnalysis newsletter on the semiconductor and AI supply chain
bio:
  text: >-
    Dylan Patel writes SemiAnalysis, a research newsletter on the semiconductor and AI industries that
    follows the supply chain from the equipment and materials used to make chips to the AI models,
    software, and infrastructure that run on them. The newsletter publishes free and paid analysis. It
    is part of SemiAnalysis, an independent research and analysis firm that also builds institutional
    industry models and offers consulting.
  source_ids: [newsletter-about, semianalysis-about]
  reviewed_at: 2026-10-19
