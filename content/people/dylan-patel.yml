sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Dylan Patel's SemiAnalysis newsletter covers semiconductor capital equipment and materials,
          fabrication and packaging, chip design, networking and optics, datacenter system architecture,
          electronic design automation, and the frameworks and infrastructure used to train and run AI models.
          The newsletter says it starts from the chips, systems and models themselves and draws on attendance
          at many industry conferences.
        source_ids: [newsletter-about]
      - text: >-
          Many SemiAnalysis reports are written by teams of analysts with Patel as a co-author. Examples
          include a November 2025 report on Google's TPUv7 accelerator, a January 2026 long-form report on
          co-packaged optics for datacenter interconnects, and February 2026 reports on datacenter CPUs and on
          the design of Nvidia's Vera Rubin platform.
        source_ids: [tpuv7-post, cpo-post, cpus-post, vera-rubin-post]
  - heading: SemiAnalysis
    paragraphs:
      - text: >-
          The SemiAnalysis website presents the firm as bridging the semiconductor industry and business,
          "by Dylan Patel." Alongside the newsletter it publishes industry models covering accelerators and
          high-bandwidth memory, datacenters, AI cloud cost of ownership, AI networking and wafer fabrication
          equipment, and a die yield calculator.
        source_ids: [semianalysis-about, newsletter-about]
