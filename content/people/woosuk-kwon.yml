sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kwon completed a PhD in Computer Science at UC Berkeley from 2021 to 2025, advised by Ion
          Stoica, who is also a co-author of the vLLM paper. Kwon also worked as a Research Scientist
          at Google DeepMind from March 2024 and as a Member of Technical Staff at Thinking Machines
          Lab from May 2025.
        source_ids: [personal-site, pagedattention-paper]
      - text: >-
          In November 2025 Kwon co-founded Inferact, a startup focused on AI inference, and serves as
          its CTO. Kwon's GitHub profile lists Inferact alongside the vllm-project organization.
        source_ids: [personal-site, github-profile]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Kwon is first author of "Efficient Memory Management for Large Language Model Serving with
          PagedAttention," posted to arXiv in September 2023 and published at the 29th ACM Symposium on
          Operating Systems Principles (SOSP). The paper proposes PagedAttention, an attention algorithm
          modeled on virtual memory and paging in operating systems, and presents vLLM, a serving
          system built on it that cuts wasted KV cache memory and lets requests share cache.
        source_ids: [pagedattention-paper, vllm-repo]
      - text: >-
          The vLLM repository asks users who build on the engine in research to cite that paper. The
          project's governance document names Kwon both as one of the Project Leads, who also form the
          Technical Steering Committee, and as one of the lead maintainers who share responsibility for
          the project's direction and strategy.
        source_ids: [vllm-repo, vllm-governance]
