slug: woosuk-kwon
name: Woosuk Kwon
initials: WK
headline: Co-creator and lead maintainer of vLLM; co-founder and CTO of Inferact
bio:
  text: >-
    Woosuk Kwon co-created vLLM, an open-source engine for serving and running
    large language models, and co-leads the project today; its governance
    document lists him among the lead maintainers responsible for overall
    direction and strategy. He is the first author of the paper that introduced
    vLLM and its PagedAttention approach to managing KV cache memory. He is also
    co-founder and CTO of Inferact, a startup working on AI inference.
  source_ids: [personal-site, vllm-governance, pagedattention-paper]
