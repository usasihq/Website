headline: Co-creator and lead maintainer of vLLM; co-founder and CTO of Inferact
bio:
  text: >-
    Woosuk Kwon co-created vLLM, an open-source engine for serving and running large language
    models, and co-leads the project; its governance document lists Kwon among the lead maintainers
    responsible for overall direction and strategy. Kwon is the first author of the paper that
    introduced vLLM and its PagedAttention approach to managing KV cache memory, and is co-founder
    and CTO of Inferact, a startup working on AI inference.
  source_ids: [personal-site, vllm-governance, pagedattention-paper]
  reviewed_at: 2026-10-21
