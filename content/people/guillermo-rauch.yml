sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Rauch's early open-source work was in JavaScript: Rauch was a member of the MooTools core
          team, and Rauch's startup LearnBoost contributed to Node.js ecosystem projects such as
          Express, Connect, Jade and Stylus. Rauch went on to author Socket.IO, for real-time
          communication, and Mongoose, for accessing MongoDB data.
        source_ids: [rauch-about, socketio-repo, mongoose-repo]
      - text: >-
          Rauch also authored the Hyper terminal emulator built on web technologies and collaborated
          with Shu Ding on the design of the SWR data-fetching library. Rauch wrote one of the early
          books on Node.js, "Smashing Node.js: JavaScript Everywhere".
        source_ids: [rauch-about]
  - heading: Vercel and Next.js
    paragraphs:
      - text: >-
          Rauch's company, then called ZEIT, started in 2016 with a command-line deployment tool for
          individual developers, and in October 2016 open-sourced Next.js in a launch post co-written
          by Naoyuki Kanezawa, Rauch and Tony Kovanen. In April 2020 the company renamed itself
          Vercel, with Rauch signing as CEO and founder.
        source_ids: [vercel-zeit-post, next-launch-post, nextjs-repo]
      - text: >-
          Rauch's 2025 essay "The AI Cloud" describes a shift in the web and the cloud from pages to
          agents, and the infrastructure Vercel builds for AI apps and agents. Vercel's about page now presents the company as agentic
          infrastructure for apps and agents.
        source_ids: [rauch-ai-cloud, vercel-about]
