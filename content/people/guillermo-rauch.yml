headline: Founder and CEO of Vercel; co-author of Next.js and author of Socket.IO and Mongoose
bio:
  text: >-
    Guillermo Rauch is a software engineer and the founder and CEO of Vercel, the company behind the
    Next.js React framework and a cloud platform for deploying web applications and agents. Rauch's
    own site describes a career built on the web and open source, including authoring the Socket.IO
    real-time library and the Mongoose MongoDB library, and designing and co-authoring Next.js.
  source_ids: [rauch-about, vercel-zeit-post, vercel-about]
  reviewed_at: 2026-10-21
