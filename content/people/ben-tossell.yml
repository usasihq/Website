headline: Writer of Ben's Bites, a newsletter for AI builders about building with agents and AI tools
bio:
  text: >-
    Ben Tossell writes Ben's Bites, a newsletter about startups and investing for AI builders of all
    levels, sharing what Ben Tossell is learning building with agents and which tools are worth
    trying. It is published on Substack and includes summaries of AI news and
    launches, video tutorials, tool reviews, and company deep-dives, produced with a small team.
    Ben Tossell started Ben's Bites in 2022 while on the AI team at Zapier, after earlier founding
    the no-code tutorial site Makerpad, which Zapier acquired in 2021. Ben Tossell also runs Ben's
    Bites Fund.
  source_ids: [about]
  reviewed_at: 2026-10-21
