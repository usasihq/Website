sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ben Tossell joined Product Hunt in 2015 to help with launches and run its community, and
          went on to build many products with no-code tools. In 2019 Ben Tossell started Makerpad, a
          tutorial site for building with no-code tools, which Zapier acquired in March 2021.
        source_ids: [about]
      - text: >-
          Ben Tossell later joined the AI team at Zapier, and in 2022 started the Ben's Bites
          newsletter.
        source_ids: [about]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Ben's Bites is published on Substack and, according to its about page, sends summaries of
          AI news and launches twice a week, along with video tutorials, tool reviews and commentary
          on founders and companies. The newsletter is produced by a small team and includes a paid
          community for people building with AI.
        source_ids: [about]
