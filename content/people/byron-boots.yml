headline: Amazon Professor of Machine Learning at the University of Washington; co-founder and CEO of Overland AI
bio:
  text: >-
    Byron Boots is the Amazon Professor of Machine Learning in the Paul G. Allen School of
    Computer Science and Engineering at the University of Washington, where Boots directs the UW
    Robot Learning Laboratory, and the co-founder and chief executive officer of Overland AI, which
    builds autonomous land systems. Boots's group works on theory and systems that integrate
    perception, learning and control, including state estimation, mapping, high-speed navigation,
    motion planning and manipulation. Boots was previously an assistant professor in Georgia
    Tech's School of Interactive Computing and is a co-author of the papers behind GPMP2, an
    open-source Gaussian-process motion planner started at the Georgia Tech Robot Learning Lab.
  source_ids: [boots-home, uw-faculty, overland-2026, gpmp2-readme]
  reviewed_at: 2026-10-21
