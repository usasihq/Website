sections:
  - heading: Career
    paragraphs:
      - text: >-
          Boots earned a PhD in the Machine Learning Department at Carnegie Mellon University, as a member of the
          SELECT Lab advised by Geoff Gordon, and then worked as a postdoctoral researcher in the Robotics and
          State Estimation Lab led by Dieter Fox at the University of Washington. Boots was next an assistant
          professor in Georgia Tech's School of Interactive Computing before returning to the University of
          Washington as a faculty member.
        source_ids: [boots-home, uw-faculty]
      - text: >-
          Boots is co-founder and chief executive officer of Overland AI. The company's April 2026
          announcement with DroneShield describes mounting DroneShield's DroneSentry-X Mk2 counter-drone
          system onto Overland AI's ULTRA unmanned ground vehicle.
        source_ids: [overland-2026]
  - heading: Research and teaching
    paragraphs:
      - text: >-
          Boots's group draws on deep learning, nonparametric statistics, graphical models, online learning,
          reinforcement learning and optimal control to build robots that combine perception, learning and
          control. Problems studied include computer vision, localization and mapping, high-speed navigation,
          motion planning and manipulation. GPMP2, an open-source Gaussian-process motion planner started at the
          Georgia Tech Robot Learning Lab, implements papers that Boots co-authored.
        source_ids: [boots-home, gpmp2-readme]
      - text: >-
          At the University of Washington, Boots has taught courses including Autonomous Robotics, Machine
          Learning and Reinforcement Learning, and at Georgia Tech taught Machine Learning, Statistical Techniques
          in Robotics, and Adaptive Control and Reinforcement Learning.
        source_ids: [boots-home]
