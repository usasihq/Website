sections:
  - heading: Career
    paragraphs:
      - text: >-
          Stanley was a professor of computer science at the University of Central Florida, where Stanley held
          the Charles Millican Professorship. Stanley co-founded Geometric Intelligence with Gary Marcus, Zoubin Ghahramani and Doug
          Bemis, serving as co-chief scientist; after Uber acquired the company and rebranded it as Uber AI Labs,
          Stanley led its core research.
        source_ids: [lila-stanley, stanley-site]
      - text: >-
          Stanley later led the Open-Endedness team at OpenAI and served as CEO of Maven. At Lila Sciences,
          Stanley is Senior Vice President of Open-Endedness, leading work on methods for continual, open-ended
          discovery and creativity in AI systems.
        source_ids: [stanley-site, lila-stanley]
  - heading: Research
    paragraphs:
      - text: >-
          Stanley's research centers on neuroevolution and open-ended search. With colleagues, Stanley created
          NeuroEvolution of Augmenting Topologies (NEAT) and its HyperNEAT and ES-HyperNEAT extensions,
          compositional pattern producing networks, novelty search and minimal criterion coevolution, along
          with interactive systems such as Picbreeder, NERO and Galactic Arms Race.
        source_ids: [stanley-site, lila-stanley]
      - text: >-
          In 2019, with Jeff Clune, Joel Lehman and others, Stanley co-authored Go-Explore, an approach
          to hard-exploration problems in reinforcement learning, and POET, which generates increasingly complex
          learning environments together with their solutions. The 2022 Evolution through Large Models paper
          applied code-generating language models as mutation operators in genetic programming.
        source_ids: [ks-goexplore, ks-poet, elm-paper]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          With Joel Lehman, Stanley wrote Why Greatness Cannot Be Planned: The Myth of the Objective, which
          examines open-ended exploration, rather than fixed objectives, as a route to discovery. Springer
          published the book in 2015, and its argument starts from a finding in artificial intelligence research.
        source_ids: [lila-stanley, stanley-site, ks-book]
