headline: SVP of Open-Endedness at Lila Sciences; former Open-Endedness Team Leader at OpenAI and creator of NEAT
bio:
  text: >-
    Kenneth O. Stanley is SVP of Open-Endedness at Lila Sciences. Stanley previously led the
    Open-Endedness Team at OpenAI, headed Core AI Research at Uber AI, co-founded Geometric
    Intelligence, served as CEO of Maven, and was the Charles Millican Professor in Computer Science
    at the University of Central Florida. With colleagues, Stanley invented methods including
    NeuroEvolution of Augmenting Topologies (NEAT), HyperNEAT, novelty search, Go-Explore, POET and
    Evolution through Large Models (ELM), and co-wrote "Why Greatness Cannot Be Planned" with Joel
    Lehman.
