headline: Head of Anthropic Labs; Instagram co-founder and former Anthropic Chief Product Officer
bio:
  text: >-
    Mike Krieger leads Anthropic Labs, Anthropic's team for incubating experimental products at the
    frontier of Claude's capabilities; Anthropic's October 2026 Claude Founder House event lists
    Krieger as Head of Anthropic Labs. Krieger joined Anthropic in May 2024 as Chief Product
    Officer, overseeing product engineering, product management and product design, and joined
    Labs in January 2026 after two years in that role. Before Anthropic, Krieger co-founded
    Instagram and served as its CTO, and later spent three years building Artifact, a personalized
    news app acquired by Yahoo. A July 2026 Anthropic article describes Krieger, as co-lead of
    Anthropic Labs, migrating a Python codebase to TypeScript with Claude Code over a weekend.
  source_ids: [anthropic-founder-house, anthropic-labs, krieger-joins, code-migration]
