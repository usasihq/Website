sections:
  - heading: Career
    paragraphs:
      - text: >-
          Krieger co-founded Instagram and served as its chief technology officer, building and scaling its
          engineering team. Krieger then spent three years building Artifact, a personalized news app, before
          the app was acquired by Yahoo.
        source_ids: [krieger-joins]
      - text: >-
          Krieger joined Anthropic as Chief Product Officer in May 2024, overseeing product engineering, product
          management and product design as the company expanded its enterprise applications. In January 2026,
          Anthropic expanded Labs, its team for incubating experimental products at the frontier of Claude's
          capabilities, and Krieger moved from the product leadership role to build in Labs alongside Ben Mann.
        source_ids: [krieger-joins, anthropic-labs]
  - heading: Products and projects
    paragraphs:
      - text: >-
          A July 2026 Anthropic article on AI-assisted code migration describes Krieger, as co-lead of Anthropic
          Labs, porting a Python codebase for an internal tool to TypeScript over a weekend with Claude Code,
          using many agents, phase gates and adversarial review rounds. The port cut the tool's compile step from
          minutes to seconds and let the team retire a separate deployment pipeline.
        source_ids: [code-migration]
      - text: >-
          In October 2026, Krieger was listed as Head of Anthropic Labs at Anthropic's Claude Founder House
          San Francisco event, in a fireside conversation with David Rosenthal of the Acquired podcast about
          start-ups building on Claude.
        source_ids: [anthropic-founder-house]
