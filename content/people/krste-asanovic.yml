sections:
  - heading: Academic career
    paragraphs:
      - text: >-
          Asanović received a PhD in computer science from UC Berkeley in 1998 and then joined the
          faculty at MIT, receiving tenure in 2005. Asanović returned to the Berkeley faculty in 2007,
          co-founding the Berkeley Parallel Computing Laboratory (Par Lab), leading the ASPIRE Lab,
          and co-leading the ADEPT and SLICE labs.
        source_ids: [krste-bio, krste-home]
      - text: >-
          Asanović's research covers computer architecture, VLSI design, parallel programming and
          operating system design. Projects listed on Asanović's page include the Chisel hardware
          construction language, the FireSim and FireBox datacenter-scale projects, and the Gemmini
          generator for systolic-array neural-network accelerators.
        source_ids: [krste-home]
  - heading: RISC-V and SiFive
    paragraphs:
      - text: >-
          RISC-V began as a Berkeley summer project in 2010, created by Asanović, Andrew Waterman and
          Yunsup Lee with David Patterson as a free and open instruction set. The project started in
          Par Lab, continued in ASPIRE and then ADEPT, and its standard is now managed by RISC-V
          International, where Asanović is Chief Architect.
        source_ids: [sifive-riscv-history, krste-home, krste-bio]
      - text: >-
          In 2015 Asanović co-founded SiFive to commercialize RISC-V processors and co-founded the
          RISC-V Foundation, which became RISC-V International. SiFive's leadership page lists
          Asanović as Co-Founder and Chief Architect.
        source_ids: [krste-bio, sifive-riscv-history, sifive-about]
