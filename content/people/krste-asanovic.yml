headline: Co-founder and Chief Architect of SiFive; RISC-V co-creator and UC Berkeley Professor Emeritus
bio:
  text: >-
    Krste Asanović is a co-founder and the Chief Architect of SiFive, the Chief Architect at RISC-V
    International, and a Professor Emeritus and Professor of the Graduate School in UC Berkeley's EECS
    Department. Asanović has led the RISC-V open instruction set architecture project at Berkeley
    since its start in 2010, and co-founded both SiFive and the RISC-V Foundation in 2015 to
    commercialize and standardize RISC-V.
  source_ids: [krste-home, krste-bio, sifive-about]
  reviewed_at: 2026-10-21
