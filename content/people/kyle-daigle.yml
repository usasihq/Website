headline: Chief Operating Officer and Chief Marketing Officer of GitHub; at GitHub since 2013
bio:
  text: >-
    Kyle Daigle is the Chief Operating Officer and Chief Marketing Officer of GitHub, leading teams
    responsible for culture, developer outreach, operations and communications. Daigle joined GitHub in
    2013, built and scaled its ecosystem engineering teams, and took on the COO role in 2023. On the GitHub
    Blog, Daigle introduced Agent HQ at GitHub Universe 2025 and co-authored the 2023 Octoverse report.
  source_ids: [gh-leadership, daigle-coo-post, daigle-author, agent-hq-post]
  reviewed_at: 2026-10-22
