sections:
  - heading: Career
    paragraphs:
      - text: >-
          Daigle joined GitHub in April 2013 and built and scaled the company's ecosystem
          engineering teams, also working on acquisitions including Semmle. Before GitHub, Daigle worked as
          an engineering and product leader at startups in fintech, real estate and consulting.
        source_ids: [gh-leadership, daigle-coo-post]
      - text: >-
          In 2020 Daigle wrote on the GitHub Blog as Senior Director of Strategic Programs, and in April 2023
          announced taking on the role of Chief Operating Officer. GitHub's leadership page now lists Daigle
          as Chief Operating Officer and Chief Marketing Officer, leading GitHub's own AI adoption strategy.
        source_ids: [daigle-author, daigle-coo-post, gh-leadership]
  - heading: Writing and launches
    paragraphs:
      - text: >-
          Daigle's earlier GitHub Blog posts covered platform integrations, including GitHub Marketplace
          (2017), GitHub's work with AWS CodeStar (2017) and Azure Pipelines in GitHub Marketplace (2018).
          Later posts include the 2023 Octoverse report and a 2024 survey on AI use by software development
          teams, both co-written with GitHub staff, and the October 2025 introduction of Agent HQ.
        source_ids: [daigle-author, agent-hq-post]
