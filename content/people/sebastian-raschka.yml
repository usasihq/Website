headline: LLM research engineer and author of Build a Large Language Model (From Scratch); formerly at Lightning AI
bio:
  text: >-
    Sebastian Raschka is an LLM research engineer whose recent work, according to Raschka's site,
    centers on LLM architectures and small-scale training, with an interest in inference and
    evaluation. Raschka is the author of Build a Large Language Model (From Scratch) and its sequel,
    Build a Reasoning Model (From Scratch); the first book's official code repository implements,
    pretrains and fine-tunes a GPT-like model in PyTorch and is designed to run on conventional
    laptops. Raschka's site describes earlier roles as a senior engineer at Lightning AI and as a
    statistics professor at the University of Wisconsin-Madison.
  source_ids: [raschka-site, raschka-about, llms-repo]
  reviewed_at: 2026-10-21
