sections:
  - heading: Career
    paragraphs:
      - text: >-
          Raschka was a professor in the Department of Statistics at the University of Wisconsin-Madison, teaching
          statistics, machine learning and deep learning and doing research on deep neural networks. Raschka later
          worked as a senior engineer at Lightning AI and now describes the current work as that of an LLM
          research engineer, focused on LLM architectures and small-scale training.
        source_ids: [raschka-about, raschka-site]
      - text: >-
          Raschka's research publications include work on rank-consistent ordinal regression with deep neural
          networks and machine learning classifiers for predicting protein–protein interaction hot spots, and a
          2026 preprint with Sten Rüdiger comparing a fine-tuning method called MiCA with LoRA and full
          fine-tuning.
        source_ids: [sr-research]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Raschka's book Python Machine Learning was published by Packt in 2015 and
          followed by second and third editions with Vahid Mirjalili, and by Machine Learning with PyTorch and
          Scikit-Learn in 2022 with Yuxi (Hayden) Liu and Mirjalili. In 2024 Raschka published Machine Learning
          Q and AI with No Starch Press and Build a Large Language Model (From Scratch) with Manning.
        source_ids: [sr-research, sr-books]
      - text: >-
          The Manning sequel, Build a Reasoning Model (From Scratch), starts from a pretrained model and implements
          inference-time scaling, reinforcement learning training and distillation in code. Each of the
          from-scratch books has an official code repository on GitHub, and Raschka's site also hosts
          a blog, course materials and an LLM Gallery.
        source_ids: [sr-books, sr-reasoning-repo, llms-repo, raschka-site]
