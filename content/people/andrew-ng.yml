sections:
  - heading: Career
    paragraphs:
      - text: >-
          Andrew Ng was Director of the Stanford AI Lab and remains an Adjunct Professor at Stanford
          University. Ng was the founding lead of the Google Brain team and later served as Vice
          President and Chief Scientist at Baidu, where Ng led the company's AI team.
        source_ids: [ng-site]
      - text: >-
          Ng's current roles span education and company building: founder of DeepLearning.AI,
          Managing General Partner at the venture studio AI Fund, Managing Partner at the AI Aspire
          advisory firm, Executive Chairman of LandingAI, and Chairman and co-founder of Coursera.
          AI Fund describes its approach as co-founding companies alongside entrepreneurs from the
          earliest stage.
        source_ids: [ng-site, ng-ai-fund]
  - heading: Teaching and online education
    paragraphs:
      - text: >-
          In 2011 Ng taught an online machine learning course at Stanford, one of the first massive
          open online courses, and the following year co-founded Coursera with Daphne Koller. In 2017
          Ng founded DeepLearning.AI, which offers short courses and professional certificates built
          with technology companies.
        source_ids: [ng-courses]
      - text: >-
          Featured courses listed on Ng's site include the Machine Learning Specialization with
          Stanford Online, the Deep Learning Specialization, AI For Everyone and Generative AI for
          Everyone.
        source_ids: [ng-courses]
  - heading: Research
    paragraphs:
      - text: >-
          Ng's research page describes work in machine learning, robotics, computer vision and
          natural language processing, from the Stanford AI Lab and the Google Brain project to
          applied research at Baidu. Early papers include latent Dirichlet allocation with David Blei
          and Michael Jordan (2003) and the 2012 DistBelief paper on training large deep networks
          across computing clusters.
        source_ids: [ng-research, lda-paper, distbelief-paper]
      - text: >-
          Recent co-authored work listed on the same page includes MedAgentBench, a virtual
          electronic-health-record environment for benchmarking medical language-model agents (2025),
          a global database of methane-emitting infrastructure (METER, 2026), and deep learning on
          satellite imagery for mapping natural gas compressor stations (2025).
        source_ids: [ng-research]
