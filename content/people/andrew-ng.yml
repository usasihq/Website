headline: Founder of DeepLearning.AI, Stanford adjunct professor, and founding lead of the Google Brain team
bio:
  text: >-
    Andrew Ng is the Founder of DeepLearning.AI, Managing General Partner at AI Fund, Managing
    Partner at AI Aspire, Executive Chairman of LandingAI, Chairman and Co-Founder of Coursera, and
    an Adjunct Professor at Stanford University, where Ng was formerly Director of the Stanford AI
    Lab. Ng was the founding lead of the Google Brain team and served as VP and Chief Scientist at
    Baidu. Ng co-authored the
    latent Dirichlet allocation paper (2003) and "Large Scale Distributed Deep Networks" (NIPS
    2012), and Ng's site says Ng now focuses primarily on AI training and entrepreneurial ventures.
  source_ids: [ng-site, lda-paper, distbelief-paper]
  reviewed_at: 2026-10-13
