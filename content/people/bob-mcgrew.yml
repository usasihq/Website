headline: Listed in OpenAI's executive leadership on the o1 System Card; led aspects of OpenAI's robot-hand research
bio:
  text: >-
    Bob McGrew worked at OpenAI, where the OpenAI o1 System Card (2024) lists McGrew under executive
    leadership. On OpenAI's 2019 paper on solving a Rubik's Cube with a robot hand, McGrew is an
    equal-contribution author, and the contributions section says McGrew led aspects of the project and
    set research directions. McGrew is also a co-author, with an OpenAI affiliation, of the 2021 Codex
    paper that introduced the HumanEval benchmark.
  source_ids: [o1-card, rubiks-paper, codex-paper]
  reviewed_at: 2026-10-13
