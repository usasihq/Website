sections:
  - heading: Career
    paragraphs:
      - text: >-
          Bob McGrew's papers cited here run from 2017 to 2024, beginning with robotics and
          reinforcement learning research. The OpenAI o1 System Card, released in December 2024,
          lists McGrew under executive leadership.
        source_ids: [her-paper, o1-card]
  - heading: Research
    paragraphs:
      - text: >-
          McGrew co-authored several robotics and reinforcement learning papers, starting with Hindsight Experience Replay
          (2017), a method for learning from sparse rewards. Later work trained a five-fingered robot
          hand in simulation for in-hand object manipulation (2018) and then for solving a Rubik's
          Cube (2019), where the paper credits McGrew with leading aspects of the project and setting
          research directions.
        source_ids: [her-paper, dexterous-paper, rubiks-paper]
      - text: >-
          McGrew also co-authored a 2019 hide-and-seek study on emergent tool use among
          competing agents. In language models, McGrew is a co-author of the 2021 Codex paper that
          introduced the HumanEval benchmark and is listed among the authors of the GPT-4 Technical
          Report (2023).
        source_ids: [hide-seek-paper, codex-paper, gpt4-report]
