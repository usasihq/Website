sections:
  - heading: Research
    paragraphs:
      - text: >-
          Several of Jamjoom's co-authored papers concern confidential computing for machine learning. With
          Zhongshu Gu and colleagues, Jamjoom co-wrote a 2018 paper on confidential inference through ternary
          model partitioning and a 2018 design called CalTrain for keeping training data confidential while
          preserving model accountability in collaborative learning. A 2021 paper on separation of powers in
          federated learning addressed information leakage from an untrusted aggregation server.
        source_ids: [confidential-inference-paper, hj-caltrain, hj-fl]
      - text: >-
          Jamjoom has also co-authored analyses of hardware trusted execution: a 2023 top-down study of Intel
          Trust Domain Extensions (TDX) and the 2025 security study of NVIDIA GPU Confidential Computing.
          Other recent co-authored systems work includes Rex, a 2025 design for safe and usable kernel
          extensions, and a 2026 reference architecture for quantum-centric supercomputers.
        source_ids: [hj-tdx, gpu-cc-paper, hj-rex, qcsc-paper]
