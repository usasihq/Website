headline: Systems security researcher listed with IBM Research; co-author of confidential-computing studies for AI
bio:
  text: >-
    Hani Jamjoom is listed with IBM Research as a co-author of papers on computing systems and their
    security. These include "Blueprint, Bootstrap, and Bridge" (2025), a security study of NVIDIA GPU
    Confidential Computing, which aims to provide secure execution for AI workloads, and "Confidential
    Inference via Ternary Model Partitioning" (first submitted in 2018), which uses trusted execution
    environments to limit information leakage from deep learning inference inputs. Jamjoom is also listed
    with the IBM T.J. Watson Research Center as a co-author of a 2026 reference architecture for
    quantum-centric supercomputers that combine quantum processors with GPUs and CPUs.
  source_ids: [gpu-cc-paper, confidential-inference-paper, qcsc-paper]
