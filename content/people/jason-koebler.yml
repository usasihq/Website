sections:
  - heading: Career
    paragraphs:
      - text: >-
          Koebler spent four years as a staff writer at Motherboard before serving as its editor-in-chief for
          six years, responsible for the brand's editorial, creative, and commercial direction. Koebler also
          created, produced, and hosted short and long documentaries and podcasts there, with reporting
          ranging from right to repair to the ticket scalping industry.
        source_ids: [about-404]
      - text: >-
          In August 2023 Koebler co-founded 404 Media with Samantha Cole, Emanuel Maiberg, and Joseph Cox,
          four journalists who had recently worked at Motherboard. The launch post describes it as a
          reader-supported technology media company created, owned, written, and edited by its journalists.
        source_ids: [welcome-404, about-404]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Koebler writes and edits for 404 Media, whose reporting covers hacking, cybersecurity, artificial
          intelligence, surveillance, privacy, and consumer rights; Koebler's recent articles include pieces on
          AI tools being used to decompile and reverse-engineer software. Koebler is also one of the four
          founders who catch listeners up on the week's stories on The 404 Media Podcast.
        source_ids: [author-404, about-404, podcast-404]
