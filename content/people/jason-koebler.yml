headline: Co-founder of 404 Media, a journalist-founded publication about technology
bio:
  text: >-
    Jason Koebler is a co-founder of 404 Media, a journalist-founded digital media company that
    publishes investigations, features, and blogs on topics including hacking, cybersecurity,
    artificial intelligence, surveillance, privacy, and consumer rights, along with The 404 Media
    Podcast. Jason Koebler was previously editor-in-chief of Motherboard for six years, and earlier a
    staff writer there, and has covered topics such as right to repair.
  source_ids: [about-404, author-404, podcast-404]
  reviewed_at: 2026-10-21
