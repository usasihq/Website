headline: Co-founder and President of Etched, which builds inference hardware for AI models
bio:
  text: >-
    Robert Wachen is a co-founder and the President of Etched, a company that builds inference systems
    for large AI models. Etched's site lists Wachen as a Thiel Fellow and as a co-founder of the earlier
    companies Prod and Mentor Labs.
