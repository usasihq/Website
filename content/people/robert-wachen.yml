sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Etched, Wachen co-founded Prod and Mentor Labs; Etched's site states that Mentor Labs was
          acquired by Crimson Education. Wachen co-founded Etched with CEO Gavin Uberti and serves as the
          company's President.
        source_ids: [etched-home]
      - text: >-
          In August 2026 Etched announced that it had shipped its first rack to a customer, describing it as
          the first step toward its goal of running inference at large scale.
        source_ids: [etched-zero]
