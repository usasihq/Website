headline: Creator of free AI tutorials and a newsletter of AI prompts, agents, and automations; founder of Blotato
bio:
  text: >-
    Sabrina Ramonov teaches AI for free through a YouTube channel and a Substack newsletter that shares AI
    prompts, agents, automations, and playbooks for entrepreneurs. Sabrina is the solo founder of Blotato, a tool for
    automating social media with AI agents, and was previously founder and CEO of the AI company Qurious,
    which was acquired by Pegasystems.
