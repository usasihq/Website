sections:
  - heading: Career
    paragraphs:
      - text: >-
          Blotato's founder page says Ramonov founded Qurious.io, an AI customer-experience startup that built real-time speech recognition and
          natural language processing tools. Qurious was acquired by Pegasystems, and the page says its
          technology now supports voice AI features in Pega Customer Service.
        source_ids: [blotato-about, channel]
      - text: >-
          Ramonov is now the solo founder of Blotato, which offers an API and an MCP server that let AI agents
          publish, schedule and read analytics for posts across several social media platforms, alongside a web
          app for creators and small businesses. Ramonov describes building Blotato first to manage Ramonov's
          own content.
        source_ids: [blotato-about, blotato-home, channel]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Ramonov's YouTube channel, which YouTube lists as joined in May 2024, teaches people to use AI for
          free. The Sabrina Ramonov newsletter on Substack sends free AI prompts,
          courses, agents and automations twice a week.
        source_ids: [channel, newsletter]
