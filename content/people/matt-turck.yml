sections:
  - heading: Career
    paragraphs:
      - text: >-
          Early in Turck's career, Turck co-founded TripleHop Technologies, an enterprise AI search startup that
          Oracle acquired, and then worked as an executive at Oracle. Before joining FirstMark, Turck was a
          Managing Director at Bloomberg Ventures, the incubation and venture arm of Bloomberg LP, which Turck
          helped start.
        source_ids: [firstmark-bio]
      - text: >-
          At FirstMark, Turck invests in early-stage companies, mostly at the seed and Series A stages, with a
          focus on enterprise software and a long-running interest in data, machine learning and AI, from
          infrastructure to applications.
        source_ids: [turck-about, firstmark-bio]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Turck has published the MAD Landscape, a market map of the machine learning, AI and data ecosystem, as
          an annual publication since 2012, each edition paired with a long overview post on mattturck.com. Recent
          editions include the 2023 landscape, "Full Steam Ahead" for 2024 and "Bubble & Build" for 2025.
        source_ids: [firstmark-bio, mad-2023, mad-2024, mad-2025]
      - text: >-
          Turck also hosts The MAD Podcast, a weekly interview show with founders, researchers and technical
          leaders about frontier models, agents and AI infrastructure, and organizes Data Driven NYC, a roughly
          monthly in-person meetup in New York on data and AI startups.
        source_ids: [mad-podcast, turck-about]
