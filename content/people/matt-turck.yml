headline: Host of The MAD Podcast and author of the annual MAD (machine learning, AI, and data) Landscape
bio:
  text: >-
    Matt Turck is a venture capitalist and partner at FirstMark who invests in early-stage startups,
    with a focus on enterprise software, data, machine learning, and AI. Matt Turck publishes the MAD
    Landscape, an annual market map and overview of the machine learning, data, and AI ecosystem; hosts
    The MAD Podcast with founders, researchers, and heads of AI; and runs Data Driven NYC, a meetup
    on data and AI startups.
