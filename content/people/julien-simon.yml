sections:
  - heading: Career
    paragraphs:
      - text: >-
          Simon spent the first part of a long engineering career in software and infrastructure leadership. Simon
          led R&D for mobile communications products at Oberthur Technologies from 2002, was Vice President of
          Engineering at Digiplug and Chief Technology Officer at Pixmania, and from 2010 to 2014 was Vice
          President of Engineering at Criteo, responsible for its online advertising platform.
        source_ids: [julien-experience]
      - text: >-
          In 2014 Simon was Chief Technology Officer for software at Aldebaran Robotics, leading software for the
          company's robots during the launch of Pepper, and then Chief Technology Officer of Viadeo, where Simon led
          a migration of the platform to AWS. From 2015 to 2021 Simon was a global machine learning and AI
          evangelist at Amazon Web Services and wrote launch posts for the AWS News Blog.
        source_ids: [julien-experience, aws-author]
      - text: >-
          Simon was Chief Evangelist at Hugging Face from 2021 to 2024, working with enterprise teams on deploying
          open models and on partnerships with cloud and hardware providers. Simon then became Vice President and
          Chief Evangelist at Arcee AI, benchmarking and deploying models across CPUs, GPUs and AI accelerators,
          before joining Fortino Capital as AI Operating Partner in November 2025.
        source_ids: [julien-experience, apn-2024, apn-2025, julien-site]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Simon is the author of Learn Amazon SageMaker, published by Packt, which Simon describes as the first
          book on the service. Simon's GitHub hosts code demos and tools such as an Amazon SageMaker container for
          serving small language models on CPUs with llama.cpp.
        source_ids: [julien-books, julien-experience, julien-github, container-repo]
      - text: >-
          Simon also publishes The AI Realist, a long-form newsletter built on primary sources such as filings,
          model cards and regulatory documents, covering new models, national AI ecosystems, digital sovereignty
          and access to compute.
        source_ids: [julien-site]
