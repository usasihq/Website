headline: AI Operating Partner at Fortino Capital; former Chief Evangelist at Hugging Face and Arcee AI
bio:
  text: >-
    Julien Simon is AI Operating Partner at Fortino Capital, where Simon works on cloud and AI
    initiatives across the firm's portfolios; Simon's GitHub profile also describes Simon as a
    technical author and open-source developer. Simon was previously Chief Evangelist at Arcee AI and, before that,
    Chief Evangelist at Hugging Face, as credited on AWS Partner Network posts from 2025 and 2024;
    earlier, Simon was an Artificial Intelligence and Machine Learning Evangelist for EMEA at AWS
    and wrote for the AWS News Blog. Simon's site lists Simon as the author of Learn Amazon
    SageMaker (Packt, first edition August 2020), and Simon's GitHub hosts an Amazon SageMaker
    container that serves small language models on CPUs with llama.cpp.
  source_ids: [julien-site, julien-books, julien-github, apn-2025, apn-2024, aws-author, container-repo]
  reviewed_at: 2026-10-21
