    artifact_slug: null
    type: null
    url: https://github.com/juliensimon/sagemaker-inference-container-cpu
    contribution: >-
      Simon's repository, published under a modified MIT license that adds conditions on who may
      use it, packages a llama.cpp build as an Amazon SageMaker container for small-language-model
      inference on Graviton (Arm64) and Intel Xeon (AMD64) instances; it can deploy models from the
      Hugging Face Hub with automatic GGUF conversion and quantization, and also runs on Docker or
      Kubernetes outside SageMaker.
    source_ids: [container-repo, julien-github]
