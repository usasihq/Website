headline: Vice president and general manager of healthcare at NVIDIA
bio:
  text: >-
    Kimberly Powell is vice president of healthcare at NVIDIA, listed as VP/GM, Healthcare among the
    GTC Berlin 2026 speakers, and is responsible for the company's worldwide healthcare business
    across medical imaging, life sciences, drug discovery and healthcare analytics. Powell joined
    NVIDIA in 2008 to establish NVIDIA GPUs as the accelerator platform for medical imaging
    instruments, and later led the company's higher education and research business, strategic
    evangelism programs, NVIDIA AI Labs and the NVIDIA Inception program. Powell's NVIDIA blog
    posts include a November 2023 announcement of NVIDIA BioNeMo for generative AI drug discovery on
    AWS and a January 2025 post on building agentic AI for healthcare and life sciences with IQVIA.
  source_ids: [nvidia-blog-author, gtc-berlin-2026]
  reviewed_at: 2026-10-21
