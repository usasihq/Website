sections:
  - heading: Career
    paragraphs:
      - text: >-
          Powell joined NVIDIA in 2008 with responsibility for establishing NVIDIA GPUs as the accelerator
          platform for medical imaging instruments. Powell later led the company's higher education and research
          business, along with its strategic evangelism programs, NVIDIA AI Labs and the NVIDIA Inception program
          for start-ups.
        source_ids: [nvidia-blog-author]
      - text: >-
          As vice president of healthcare, Powell is responsible for NVIDIA's worldwide healthcare business,
          covering hardware and software platforms for accelerated computing, AI and visualization used in
          medical imaging, life sciences, drug discovery and healthcare analytics. At GTC Berlin in October 2026,
          Powell was listed as VP/GM, Healthcare, and as the speaker for the talk "Turning AI Into the
          Infrastructure Advancing Human Health".
        source_ids: [nvidia-blog-author, gtc-berlin-2026]
  - heading: Writing
    paragraphs:
      - text: >-
          Powell's posts on NVIDIA's blog track the company's healthcare platforms. They include a 2021
          announcement of an AI computing platform for real-time sensing in medical instruments and devices, a
          2022 post on a fast DNA sequencing technique for critical-care diagnosis, the 2023 arrival of NVIDIA
          BioNeMo and Clara services on AWS, and a 2024 essay on generative AI and digital biology in drug
          discovery.
        source_ids: [nvidia-blog-author]
      - text: >-
          Later posts covered healthcare and biomedical computing projects in Japan and Taiwan in 2024 and, in
          January 2025, NVIDIA's work with IQVIA on custom foundation models and agentic AI workflows for
          healthcare and life sciences.
        source_ids: [nvidia-blog-author]
