sections:
  - heading: Career
    paragraphs:
      - text: >-
          Simon Willison co-created the Django web framework and in 2010 co-founded Lanyrd, which
          Eventbrite later acquired; Willison then worked at Eventbrite as an engineering director.
          Willison has since worked as an independent open-source developer, building tools for data
          journalism around Datasette and SQLite.
        source_ids: [about]
      - text: >-
          Willison serves on the board of directors of the Python Software Foundation, and the PSF's
          board page also lists Willison on its PyCon US Committee. Willison's disclosures note one
          day a week of work for Prime Radiant, an applied AI research lab.
        source_ids: [about, psf-board]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Willison shipped the first public version of Datasette in November 2017 as a tool for
          creating and publishing JSON APIs for SQLite databases. It has since grown into a tool for
          exploring data and publishing it as an interactive website.
        source_ids: [datasette-launch, datasette-changelog, datasette]
      - text: >-
          LLM began as an initial prototype release on 1 April 2023 and is now a command-line utility
          and Python library for running prompts against large language models from many providers.
        source_ids: [llm-changelog, llm]
  - heading: Writing
    paragraphs:
      - text: >-
          Willison has blogged about web development and programming at simonwillison.net since 2002.
          The weblog mixes longer entries with links, quotations, notes, and guide chapters, and much
          recent writing covers large language models and coding agents. A newsletter version goes out
          about once a week, with a shorter monthly briefing for sponsors.
        source_ids: [about, blog]
