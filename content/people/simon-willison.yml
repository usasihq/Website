headline: Writer of Simon Willison's Weblog on LLMs and software, creator of Datasette and co-creator of Django
bio:
  text: >-
    Simon Willison writes Simon Willison's Weblog, where they have published about web development and
    programming since 2002 and now write frequently about large language models, coding agents, and the tools
    built around them. A newsletter version of the blog goes out roughly weekly, with a shorter monthly
    briefing for sponsors on developments in LLMs. Simon is the creator of Datasette, an open-source tool for
    exploring and publishing data, and of LLM, a command-line utility and Python library for working with
    large language models. Simon is also a co-creator of the Django web framework.
  source_ids: [about, blog, datasette, llm]
  reviewed_at: 2026-10-17
