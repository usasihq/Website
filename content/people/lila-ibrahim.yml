sections:
  - heading: Career
    paragraphs:
      - text: >-
          DeepMind's 2018 announcement describes Ibrahim's start as a microprocessor designer and assembler
          programmer at Intel, where Ibrahim later led the emerging markets product group and worked with Intel
          CEO Craig Barrett. Ibrahim then served as chief of staff to investor John Doerr at Kleiner Perkins and
          as chief operating officer of the online learning company Coursera.
        source_ids: [gdm-coo-2018]
      - text: >-
          In April 2018 Demis Hassabis welcomed Ibrahim as DeepMind's first chief operating officer, partnering
          with Hassabis on the lab's next phase of growth. Ibrahim held the COO title into 2026, when Google
          bylines began listing Ibrahim as Chief AI Readiness Officer at Google DeepMind.
        source_ids: [gdm-coo-2018, india-feb-2026, edu-2026, india-oct-2026]
  - heading: Responsibility and partnerships
    paragraphs:
      - text: >-
          Google DeepMind's 2025 post on its approach to AGI safety describes the Responsibility and Safety
          Council, its internal review group, as co-chaired by Ibrahim and Senior Director of Responsibility
          Helen King. In November 2025 Ibrahim announced a new Google DeepMind research lab in Singapore,
          focused on Gemini research and on work with governments, businesses and academic institutions in the
          Asia-Pacific region.
        source_ids: [gdm-agi-path, gdm-singapore]
      - text: >-
          Ibrahim's 2026 posts focus on applying AI in education and science. A February 2026 post described the
          National Partnerships for AI initiative in India, a May 2026 post shared studies on how Gemini tools
          affected learning and lesson planning, and an October 2026 post announced initiatives in India across
          crop science, education, agriculture and economic inclusion.
        source_ids: [india-feb-2026, edu-2026, india-oct-2026]
