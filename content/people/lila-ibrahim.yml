headline: Chief AI Readiness Officer at Google DeepMind; the lab's first Chief Operating Officer
bio:
  text: >-
    Lila Ibrahim is Chief AI Readiness Officer at Google DeepMind, the title on Google bylines from May and
    October 2026. Ibrahim joined DeepMind in April 2018 as its first Chief Operating Officer, a title still on
    Google DeepMind bylines in November 2025 and February 2026, after earlier roles that DeepMind's
    announcement lists as microprocessor designer and assembler programmer at Intel, head of Intel's emerging
    markets product group, and COO of Coursera. Google DeepMind's 2025 post on AGI safety says the
    Responsibility and Safety Council, its internal review group, was co-chaired by COO Lila Ibrahim. In 2026
    Ibrahim co-authored Google posts on the National Partnerships for AI initiative in India and on studies
    measuring how Gemini affects teaching and learning.
  source_ids: [edu-2026, india-oct-2026, gdm-coo-2018, gdm-singapore, india-feb-2026, gdm-agi-path]
