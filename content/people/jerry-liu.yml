sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Jerry Liu is the listed author of LlamaIndex, an MIT-licensed framework whose citation file gives a
          release date of November 2022. The framework offers orchestration tools for building
          retrieval-augmented generation and agent applications.
        source_ids: [li-cff, li-license, li-repo]
  - heading: Products and projects
    paragraphs:
      - text: >-
          As CEO and co-founder of LlamaIndex, Liu wrote in September 2025 that the company had found the main
          challenge for AI engineers to be supplying reliable context from documents such as PDFs,
          presentations and word-processor files. Liu described LlamaParse as a document processing and
          workflow platform for agents, with layout-, table- and chart-aware parsing, extraction into
          schemas, indexing and classification, combined with LlamaIndex Workflows as the agent layer.
        source_ids: [li-blog-update]
      - text: >-
          The LlamaIndex README now states that the project's main focus is document parsing and extraction.
          Alongside the open-source framework it points to LlamaParse, the LiteParse text parser, and the
          ParseBench and ExtractBench benchmarks for parsing and extraction.
        source_ids: [li-repo]
