headline: Author of the open-source LlamaIndex framework; CEO and co-founder of LlamaIndex
bio:
  text: >-
    Jerry Liu is the CEO and co-founder of LlamaIndex. The LlamaIndex repository's citation file and
    README name Liu as the author of the LlamaIndex software, with a release date of November 2022, and
    the project's MIT license carries Liu's copyright. The framework provides orchestration tools for
    building retrieval-augmented and agent applications, and the company's current focus is document
    parsing and extraction with LlamaParse and the free LiteParse text parser.
  source_ids: [li-blog-update, li-cff, li-repo, li-license]
  reviewed_at: 2026-10-13
