headline: Co-founder and Chief Scientific Officer of Liquid AI; lead organizer of MIT 6.S191 Intro to Deep Learning
bio:
  text: >-
    Alexander Amini is a co-founder and the Chief Scientific Officer of Liquid AI and an AI scientist at
    MIT. Amini is the creator, lead organizer and lecturer of MIT 6.S191, Introduction to Deep Learning,
    and Amini's research covers autonomy, end-to-end control of autonomous systems and uncertainty
    estimation for neural networks. Amini is the first-listed author of the LFM2 technical report.
  source_ids: [liquid-team, amini-site, amini-bio, amini-cv, lfm2-report]
  reviewed_at: 2026-10-22
