sections:
  - heading: Career
    paragraphs:
      - text: >-
          Amini studied computer science at MIT, completing a bachelor's degree in 2017, a master's degree in
          2018 and a PhD in 2022 as a researcher at CSAIL advised by Daniela Rus. During that period Amini
          worked with NVIDIA's end-to-end driving team, working on confidence measures for deep networks.
        source_ids: [amini-cv, amini-site]
      - text: >-
          Amini became a research scientist at MIT CSAIL in June 2022 and co-founded Liquid AI in March 2023,
          serving as its Chief Scientific Officer. Amini's CV also lists a co-founder and advisor role at
          Themis AI from 2021.
        source_ids: [amini-cv, liquid-about]
  - heading: Research and teaching
    paragraphs:
      - text: >-
          Amini's research addresses learning end-to-end control for autonomous systems and estimating the
          confidence of neural networks, including the 2019 paper "Deep Evidential Regression". Amini
          co-authored the liquid time-constant network and closed-form continuous-time model papers with
          Ramin Hasani and Mathias Lechner.
        source_ids: [amini-site, edr-paper, ltc-paper, amini-cv]
      - text: >-
          Since January 2018, Amini has led MIT 6.S191, Introduction to Deep Learning, developing the
          curriculum, teaching lectures and publishing the course material online.
        source_ids: [amini-cv, intro-dl]
