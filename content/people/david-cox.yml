    contribution: >-
      Listed among the authors of the Granite Code models paper (2024), which releases code models from
      3 to 34 billion parameters under an Apache 2.0 license, and of the Granite Embedding models report
      (2025), which releases English and multilingual retrieval embedding models under Apache 2.0. IBM
      Research's profile describes Cox as responsible for the development and training of IBM's large
      language models.
    source_ids: [granite-code-paper, granite-embedding-paper, ibm-research-profile]
