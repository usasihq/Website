headline: VP, AI Foundations at IBM Research, working on IBM's Granite models; earlier a Harvard professor
bio:
  text: >-
    David Cox is VP, AI Foundations at IBM Research and the IBM director of the MIT-IBM Computing Research
    Lab, which IBM Research's profile lists as the MIT-IBM Watson AI Lab. IBM Research describes Cox as responsible for the
    development and training of IBM's large language models, and Cox is a co-author of the Granite Code
    and Granite Embedding papers, both of which release their models under the Apache 2.0 license; the
    Granite Code paper describes sizes from 3 billion parameters suited to on-device, memory-constrained
    use. Before IBM, Cox was the John L. Loeb Associate Professor of the Natural Sciences and of
    Engineering and Applied Sciences at Harvard University, where Cox's lab started the open-source
    Hyperopt hyperparameter optimization library.
  source_ids: [ibm-research-profile, mitibm-profile, granite-code-paper, granite-embedding-paper, hyperopt-paper, hyperopt-repo]
  reviewed_at: 2026-10-13
