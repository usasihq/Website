sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before joining IBM, Cox was the John L. Loeb Associate Professor of the Natural Sciences and
          of Engineering and Applied Sciences at Harvard University, with appointments in Computer
          Science, the Department of Molecular and Cellular Biology and the Center for Brain Science.
          Cox was also a Faculty Associate at the Berkman Klein Center for Internet and Society at
          Harvard Law School, and while at Harvard co-founded several AI startups, including DeepHealth,
          which developed FDA-cleared medical imaging software.
        source_ids: [ibm-research-profile, mitibm-profile]
      - text: >-
          At IBM Research, Cox is VP, AI Foundations, leading the innovation agenda for foundation
          models and responsible for the development and training of IBM's large language models. Cox is also IBM's
          director of the joint lab with MIT, which brings IBM researchers together with MIT faculty on
          fundamental AI research.
        source_ids: [ibm-research-profile, mitibm-profile]
  - heading: Research and open-source work
    paragraphs:
      - text: >-
          Cox's research spans neuroscience and AI. With James Bergstra and Daniel Yamins, Cox wrote an
          ICML 2013 paper on automating hyperparameter search for vision architectures, and Cox's
          Harvard lab started the open-source projects Hyperopt and Triton, the GPU compute framework
          now known as OpenAI Triton.
        source_ids: [ibm-research-profile, hyperopt-paper, hyperopt-repo]
      - text: >-
          At IBM, Cox is a co-author of papers on the Granite model family, including the 2024 Granite
          Code models, which are released under Apache 2.0, a Granite function-calling model presented at
          EMNLP 2024, and the 2025 Granite Embedding models for dense and sparse retrieval in English and
          multilingual settings. Other recent co-authored work listed by IBM Research includes Activated
          LoRA (NeurIPS 2025) and Self-MoE (ICLR 2025).
        source_ids: [granite-code-paper, granite-embedding-paper, ibm-research-profile]
