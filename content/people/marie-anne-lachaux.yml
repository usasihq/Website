sections:
  - heading: Research
    paragraphs:
      - text: >-
          Lachaux's early research at Facebook AI Research focused on machine learning for source code. As first
          author of "Unsupervised Translation of Programming Languages" in 2020, Lachaux and colleagues trained a
          neural transcompiler on monolingual open-source code to translate functions between C++, Java and
          Python. In 2021 Lachaux co-authored DOBF, a deobfuscation pre-training objective for programming
          languages, with Baptiste Roziere, Marc Szafraniec and Guillaume Lample.
        source_ids: [transcompiler-paper, mal-dobf]
      - text: >-
          Lachaux then worked on large language models, appearing among the authors of Meta's LLaMA paper in
          February 2023 and the Llama 2 paper in July 2023. Lachaux is also a co-author of the Mistral 7B paper
          in October 2023 and the Mixtral of Experts paper in January 2024, both describing models released
          under the Apache 2.0 license.
        source_ids: [llama-paper, llama2-paper, mistral7b-paper, mixtral-paper]
