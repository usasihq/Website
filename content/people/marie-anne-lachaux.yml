headline: Co-author of Meta's LLaMA and Llama 2 papers and of Mistral 7B; first author on unsupervised code translation
bio:
  text: >-
    Marie-Anne Lachaux is a co-author of LLaMA: Open and Efficient Foundation Language Models (2023),
    written at Meta AI, and of Llama 2: Open Foundation and Fine-Tuned Chat Models (2023), from GenAI
    at Meta. Earlier, listed with Facebook AI Research, Lachaux was first author of Unsupervised
    Translation of Programming Languages (2020), which trains a neural transcompiler on monolingual
    open-source code to translate functions between C++, Java and Python and releases a test set
    with unit tests. Lachaux also co-authored the Mistral 7B (2023) and Mixtral of Experts (2024)
    papers, whose abstracts say the models are released under the Apache 2.0 license.
  source_ids: [llama-paper, llama2-paper, transcompiler-paper, mistral7b-paper, mixtral-paper]
  reviewed_at: 2026-10-21
