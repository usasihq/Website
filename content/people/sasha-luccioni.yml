headline: AI and climate researcher; co-founder and Chief Scientific Officer of Sustainable AI Group
bio:
  text: >-
    Sasha Luccioni is an AI and climate researcher and the co-founder and Chief Scientific Officer
    of Sustainable AI Group, a research and advisory firm, announced in May 2026, that helps
    enterprises measure and act on the environmental impacts of AI. Luccioni was previously AI &
    Climate Lead at Hugging Face; Luccioni's CV lists a Research Scientist role there starting in
    2021, analyzing the data used to train large language models, quantifying the carbon footprint
    of AI, and co-chairing the Carbon working group of the BigScience project. Luccioni is first
    author of "Estimating the Carbon Footprint of BLOOM" (2022) and of "Power Hungry Processing"
    (2023), with Yacine Jernite and Emma Strubell, which compared the inference energy and carbon
    cost of task-specific and general-purpose models.
  source_ids: [luccioni-site, saig-team, luccioni-cv, bloom-carbon-paper, power-hungry-paper]
  reviewed_at: 2026-10-21
