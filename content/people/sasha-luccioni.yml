sections:
  - heading: Career
    paragraphs:
      - text: >-
          Luccioni began in industry research, first on dialogue systems and question answering as an AI/NLP
          research scientist at Nuance Communications from 2017 to 2018, and then on explainable AI and human-in-the-loop decision-making at Morgan Stanley's AI/ML Center of
          Excellence from 2018 to 2019. From 2019 to 2021 Luccioni was a postdoctoral researcher at Université de Montréal and Mila,
          working with Yoshua Bengio on "This Climate Does Not Exist", which used conditional GANs to depict
          possible effects of climate change.
        source_ids: [luccioni-cv]
      - text: >-
          Luccioni joined Hugging Face as a research scientist in 2021, studying the data used to train large
          language models and the carbon footprint of AI, and co-chaired the Carbon working group of the BigScience
          project. In May 2026 Luccioni and co-founder Boris Gamazaychikov announced Sustainable AI Group, where
          Luccioni is Chief Scientific Officer.
        source_ids: [luccioni-cv, luccioni-site, saig-team]
  - heading: Research
    paragraphs:
      - text: >-
          Luccioni's research measures the environmental costs of machine learning. A 2019 paper with Alexandre
          Lacoste and colleagues examined how to quantify the carbon emissions of training models, and Luccioni was
          first author of the 2022 estimate of the carbon footprint of the BLOOM language model and of "Counting
          Carbon" (2023), a survey of factors that influence emissions. "Power Hungry Processing" (2023) compared
          the energy and carbon costs of task-specific and general-purpose models at inference time.
        source_ids: [carbon-emissions-paper, bloom-carbon-paper, counting-carbon-paper, power-hungry-paper]
      - text: >-
          Luccioni has also studied social bias in generative models. "Stable Bias" (2023), written with
          Christopher Akiki, Margaret Mitchell and Yacine Jernite, analyzed how text-to-image diffusion models
          represent different social groups.
        source_ids: [stable-bias-paper]
