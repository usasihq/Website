sections:
  - heading: Career
    paragraphs:
      - text: >-
          Amanda Askell's CV lists doctoral study in philosophy at New York University from 2011 to 2018,
          with a thesis on Pareto principles in infinite ethics advised by Cian Dorr, and an earlier BPhil
          at the University of Oxford with a thesis on objective epistemic consequentialism. Askell's
          philosophical work has centered on ethics, decision theory, and formal epistemology.
        source_ids: [askell-cv, askell-site]
      - text: >-
          From 2018 to 2021 Askell was a research scientist on the policy team at OpenAI, working on AI
          safety via debate and on human baselines for AI performance. Askell joined Anthropic in 2021 as
          a research scientist in alignment finetuning, and Anthropic now credits Askell with leading its
          Character work.
        source_ids: [askell-cv, askell-site, claude-constitution]
  - heading: Research
    paragraphs:
      - text: >-
          From 2019 to 2021, Askell's publications included work on AI safety and social science, release
          strategies for language models, and cooperation in responsible AI development, along with
          co-authorship of the GPT-3 paper in 2020 and the CLIP paper in 2021.
        source_ids: [askell-pubs, gpt3-paper, clip-paper, clip-repo]
      - text: >-
          At Anthropic, Askell was the first author of "A General Language Assistant as a Laboratory for
          Alignment" in December 2021 and co-authored later papers including Constitutional AI (2022),
          work on moral self-correction in language models (2023), and studies of sycophancy and of
          specific versus general principles for constitutional AI (2023). Askell's team trains models to
          be more honest and to have good character traits, and develops finetuning techniques meant to
          scale to more capable models.
        source_ids: [hhh-paper, askell-pubs, askell-site]
  - heading: Claude's constitution
    paragraphs:
      - text: >-
          Claude's constitution, published by Anthropic in January 2026, names Askell as its primary
          author. Its acknowledgements say Askell wrote most of the text and led its development through
          several rounds of revision, with significant contributions from Joe Carlsmith and others, and
          the document is released under a CC0 1.0 deed.
        source_ids: [claude-constitution, constitution-news]
