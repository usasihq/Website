headline: Philosopher who leads Anthropic's Character work; primary author of Claude's constitution
bio:
  text: >-
    Amanda Askell is a philosopher working on finetuning and AI alignment at Anthropic, where Askell's
    team trains models to be more honest and to have good character traits. Anthropic credits Askell
    as the lead of its Character work and the primary author of Claude's constitution, released in
    January 2026 under a CC0 1.0 deed. Before Anthropic, Askell was a research scientist on OpenAI's
    policy team, working on AI safety via debate and human baselines for AI performance, and is a
    co-author of the GPT-3 and CLIP papers. Askell is also first author of Anthropic's 2021 paper
    "A General Language Assistant as a Laboratory for Alignment".
  source_ids: [askell-site, claude-constitution, constitution-news, gpt3-paper, clip-paper, hhh-paper]
  reviewed_at: 2026-10-13
