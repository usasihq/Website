sections:
  - heading: Research
    paragraphs:
      - text: >-
          Lin's homepage frames the research around three questions: how models can plan and act rather than
          only answer, how language and vision can work as one system, and which training methods support
          stronger post-training. Themes include long-horizon planning, tool use, multimodal representation
          and reinforcement-learning infrastructure.
        source_ids: [homepage]
      - text: >-
          On training methods, Lin co-authored Group Sequence Policy Optimization (GSPO), a sequence-level
          policy optimization method for reinforcement learning of large models, and "Gated Attention for
          Large Language Models" (2025), which studies gating in attention for non-linearity, sparsity and
          avoiding attention sinks.
        source_ids: [gspo-paper, gated-attention-paper, homepage]
  - heading: Qwen models and agents
    paragraphs:
      - text: >-
          Lin is a co-author of the Qwen Technical Report (2023), the Qwen2.5-VL Technical Report (2025) on
          vision-language models and the Qwen3 Technical Report (2025). The homepage also lists Qwen3-Coder,
          an agentic coding model the Qwen team announced in July 2025, and the Qwen-Image technical report on
          image generation among Lin's selected work.
        source_ids: [qwen-paper, qwen25vl-paper, qwen3-paper, qwen3-coder-blog, homepage]
      - text: >-
          Lin co-authored the 2024 OpenHands paper on an open platform for software-development agents.
          In a March 2026 essay, "From 'Reasoning' Thinking to 'Agentic' Thinking", Lin describes the shift
          from static reasoning models to agentic systems that think in order to act.
        source_ids: [openhands-paper, lin-essay]
