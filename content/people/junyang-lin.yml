headline: Independent researcher on language models and agents; co-author of the OpenHands and Qwen3 papers
bio:
  text: >-
    Junyang Lin is an independent researcher working on large language models, multimodal systems and
    agentic learning, with recent work on agentic coding, multimodal modeling, reinforcement-learning
    methods and efficient attention design. Lin is a co-author of the OpenHands paper (2024), which
    presents the MIT-licensed open platform for AI software-development agents formerly called
    OpenDevin, and Lin's GitHub profile pins the OpenHands repository. Lin's homepage lists selected
    work on the Qwen3 and Qwen3-VL technical reports, Qwen3-Coder, Group Sequence Policy Optimization
    (GSPO) and gated attention for language models, and Lin co-authored the Qwen Technical Report
    (2023).
  source_ids: [homepage, github-profile, openhands-paper, qwen3-paper, gspo-paper, qwen-paper]
  reviewed_at: 2026-10-13
