headline: Co-author of Microsoft's Phi-3 technical report on small language models that run on a phone
bio:
  text: >-
    Misha Bilenko is listed among the authors of the Phi-3 Technical Report (2024), a report credited
    to Microsoft that covers the Phi-3 and Phi-3.5 small language models. The report introduces
    phi-3-mini, a 3.8 billion parameter model small enough to be deployed on a phone, along with larger
    phi-3-small and phi-3-medium models and the phi-3.5 series, including a mixture-of-experts model
    and a vision model. The phi-3-mini-4k-instruct model card on Hugging Face lists the MIT license.
  source_ids: [phi3-paper, phi3-mini-card]
  reviewed_at: 2026-10-21
