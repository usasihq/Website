sections:
  - heading: Phi-3 small language models
    paragraphs:
      - text: >-
          The Phi-3 Technical Report, on which Bilenko is a listed author, describes phi-3-mini as a 3.8 billion
          parameter model trained on a scaled-up version of the phi-2 dataset of heavily filtered public web data
          and synthetic data. The report also covers 7B and 14B models, phi-3-small and phi-3-medium, trained on
          more tokens. A later revision added the phi-3.5 series: phi-3.5-mini, the mixture-of-experts model
          phi-3.5-MoE and the image-and-text model phi-3.5-Vision.
        source_ids: [phi3-paper]
      - text: >-
          Microsoft publishes the models on Hugging Face, where the phi-3-mini-4k-instruct model card gives the
          MIT license and points to quantized versions for local apps.
        source_ids: [phi3-mini-card]
