sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Latent Space began as a newsletter started by swyx in 2022; its podcast followed in 2023, led
          by swyx with co-hosts including Alessio Fanelli, and records mostly in person. The podcast
          and newsletter grew out of an informal Discord community that also runs a weekly LLM Paper
          Club.
        source_ids: [latent-about]
      - text: >-
          In a 2024 post marking the podcast's first year, Fanelli describes the show's three episode
          formats: topic-driven "101" episodes without guests, guest interviews timed to news and
          releases, and recap or emergency episodes with several speakers, including live coverage of
          events such as OpenAI DevDay and NeurIPS.
        source_ids: [blog-one-year]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Fanelli open-sourced smol-podcaster in 2023, a tool that automates parts of Latent Space's
          production: transcribing episodes with speaker labels and timestamps, formatting the
          transcript for publication, and using language models to draft chapters and title ideas. The
          repository describes it as a podcast production agent and is released under the MIT license.
        source_ids: [blog-smol-podcaster, smol-podcaster-repo]
      - text: >-
          Earlier in 2023, Fanelli built and open-sourced a web interface for LangChainHub, a collection
          of prompts for LangChain projects, with a TypeScript and Next.js frontend and a small Ruby
          backend that indexes the hub's repository.
        source_ids: [blog-langchainhub-ui]
  - heading: Career
    paragraphs:
      - text: >-
          Decibel's team page lists Fanelli as a partner. Fanelli's own site adds that Fanelli leads
          early-stage investments in AI, infrastructure software, security and developer tools,
          and serves as the firm's CTO, leading the development of its internal software platform. In
          November 2021, Fanelli shared slides from an invited talk on open-source monetization at the
          Linux Foundation Members Summit.
        source_ids: [decibel-team, personal-about, blog-lf-talk]
