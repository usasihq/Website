headline: Co-host of the Latent Space podcast for AI engineers and a partner at Decibel
bio:
  text: >-
    Alessio Fanelli co-hosts the Latent Space podcast with swyx. Latent Space is a technical
    newsletter, podcast, and community for AI engineers, covering the business and technology of AI;
    its podcast is recorded mostly in person, with technical deep dives into the people behind major
    AI projects and news. Alessio Fanelli is also a partner at the venture firm Decibel, where Fanelli
    leads early-stage investments in AI, infrastructure software, security, and developer tools, and serves as
    the firm's CTO.
  source_ids: [personal-about, latent-about, decibel-team]
  reviewed_at: 2026-10-21
