headline: Co-author of the sequence-to-sequence, GNMT, and neural architecture search papers at Google
bio:
  text: >-
    Quoc V. Le co-authored Sequence to Sequence Learning with Neural Networks (2014) with Ilya Sutskever
    and Oriol Vinyals, all listed at Google. With a Google Brain affiliation, Le co-authored Neural
    Architecture Search with Reinforcement Learning (2016) with Barret Zoph and the 2017 paper that
    introduced the sparsely-gated mixture-of-experts layer, and Le is also a co-author of the 2016 paper
    presenting GNMT, Google's neural machine translation system.
  source_ids: [seq2seq-paper, nas-paper, moe-paper, gnmt-paper]
  reviewed_at: 2026-10-13
