sections:
  - heading: Representation learning
    paragraphs:
      - text: >-
          Quoc V. Le co-authored Building high-level features using large scale unsupervised learning (2011), which
          trained a large network on unlabeled images to ask whether class-specific detectors, such as a face
          detector, can emerge without labels. With Tomas Mikolov, Le wrote Distributed Representations of
          Sentences and Documents (2014), which learns fixed-length vector representations of text as an
          alternative to bag-of-words features.
        source_ids: [unsupervised-features-paper, paragraph-vectors-paper]
  - heading: Sequence models and translation
    paragraphs:
      - text: >-
          In 2014 Le co-authored Sequence to Sequence Learning with Neural Networks with Ilya Sutskever and Oriol
          Vinyals, which maps input sequences to output sequences with multilayer LSTMs. Le was also a co-author of
          the 2016 paper presenting GNMT, Google's neural machine translation system, of the 2017 sparsely-gated
          mixture-of-experts layer, and of a 2017 large-scale study of neural machine translation architectures.
        source_ids: [seq2seq-paper, gnmt-paper, moe-paper, nmt-exploration-paper]
  - heading: Automated design and language-model reasoning
    paragraphs:
      - text: >-
          With Barret Zoph, Le co-authored Neural Architecture Search with Reinforcement Learning (2016), and with
          Mingxing Tan wrote EfficientNet (2019), which balances network depth, width and resolution when scaling
          convolutional networks and uses architecture search to design the base model.
        source_ids: [nas-paper, efficientnet-paper]
      - text: >-
          Later papers co-authored by Le address large language models: Finetuned Language Models Are Zero-Shot
          Learners (2021), which showed that instruction tuning improves zero-shot performance and called the
          resulting model FLAN, and Chain-of-Thought Prompting
          Elicits Reasoning in Large Language Models (2022), which showed that prompting with intermediate
          reasoning steps improves performance on complex reasoning tasks.
        source_ids: [flan-paper, cot-paper]
