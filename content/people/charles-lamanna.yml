headline: Executive Vice President, Copilot, Agents, and Platform at Microsoft
bio:
  text: >-
    Charles Lamanna is Executive Vice President, Copilot, Agents, and Platform at Microsoft. Microsoft's
    author pages say Lamanna oversees the design, product development and engineering of Microsoft
    Copilot, Agent 365, Copilot Studio, Power Platform, Dynamics 365, SharePoint and OneDrive, with an
    organization spanning Microsoft 365 and Dynamics 365 services, Exchange Online and Teams
    infrastructure, low-code platforms and agent technologies. In March 2026 Microsoft named Lamanna,
    with Ryan Roslansky and Perry Clarke, to lead Microsoft 365 apps and the Copilot platform as part of
    the Copilot Leadership Team, and an October 2026 update said Sumit Chauhan and Lan Ye would report to
    Lamanna.
