sections:
  - heading: Role at Microsoft
    paragraphs:
      - text: >-
          Charles Lamanna leads Microsoft's Copilot, Agents, and Platform organization. Microsoft's
          author biography says Lamanna's teams cover Microsoft 365 and Dynamics 365 services, Exchange
          Online and Teams infrastructure, low-code platforms and agent technologies, and that Lamanna
          oversees the design, product development and engineering of Microsoft Copilot, Agent 365,
          Copilot Studio, Power Platform, Dynamics 365, SharePoint and OneDrive.
        source_ids: [m365-author, power-author]
      - text: >-
          In March 2026 Microsoft combined its consumer and commercial Copilot efforts into a single
          organization and formed a Copilot Leadership Team that includes Lamanna; the announcement
          said Ryan Roslansky, Perry Clarke and Lamanna would lead Microsoft 365 apps and the Copilot
          platform. An October 2026 leadership update said Sumit Chauhan and Lan Ye would report to
          Lamanna.
        source_ids: [ms-copilot-2026, ms-m365-2026]
  - heading: Products and writing
    paragraphs:
      - text: >-
          Lamanna writes product announcements on Microsoft's Power Platform and Microsoft 365 blogs.
          Posts in 2024 covered autonomous agent capabilities in Copilot Studio, AI features across
          Power Platform and Power Apps, and the Dynamics 365 2024 release wave 2.
        source_ids: [power-author, m365-author]
      - text: >-
          In 2025 Lamanna's posts announced expanded model choice in Microsoft 365 Copilot, the ability
          to build apps and workflows from Microsoft 365 Copilot, and Microsoft Agent 365, which
          Microsoft describes as a control plane for AI agents. Later posts introduced Copilot Cowork
          and new Work IQ APIs.
        source_ids: [m365-author]
