headline: Apple's chief hardware officer, overseeing Apple silicon and the company's hardware technologies
bio:
  text: >-
    Johny Srouji is Apple's chief hardware officer. Apple's leadership page says Srouji oversees the team
    that creates and builds Apple's hardware products and underlying technologies, including Apple silicon,
    cellular, displays, cameras, sensors, and batteries. Srouji joined Apple in 2008 to lead development of
    application processors for the iPhone, work that Apple describes as the foundation of Apple silicon.
    Before Apple, Srouji held senior positions in processor development and design at Intel and IBM.
  source_ids: [apple-leadership]
