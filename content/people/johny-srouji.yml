sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Apple, Johny Srouji held senior positions in processor development and design at
          Intel and IBM. Srouji joined Apple in 2008 to lead development of the A4, the first
          Apple-designed system-on-a-chip; Apple describes that iPhone application-processor work as
          the foundation of Apple silicon.
        source_ids: [apple-leadership, cho-release]
      - text: >-
          Srouji later served as Apple's senior vice president of Hardware Technologies. On April 20,
          2026, Apple named Srouji chief hardware officer, an expanded role that adds leadership of
          Hardware Engineering to the hardware technologies organization.
        source_ids: [cho-release, m1-release]
  - heading: Apple silicon and hardware technologies
    paragraphs:
      - text: >-
          Apple credits teams under Srouji with custom chips and hardware technologies across its
          product line, including Apple silicon, batteries, cameras, storage controllers, sensors,
          displays and cellular modems. When Apple introduced the M1 system-on-a-chip for the Mac in
          November 2020, Srouji presented it as building on more than a decade of chip design for
          iPhone, iPad and Apple Watch.
        source_ids: [cho-release, m1-release]
      - text: >-
          As chief hardware officer, Srouji oversees the team that creates and builds Apple's
          hardware products, from product design and system engineering to reliability and
          durability testing.
        source_ids: [apple-leadership]
