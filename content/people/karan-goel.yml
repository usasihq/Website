sections:
  - heading: Career
    paragraphs:
      - text: >-
          Goel studied for a computer science PhD at Stanford, advised by Christopher Ré and
          affiliated with the Stanford AI Lab and the Center for Research on Foundation Models. Goel's site
          notes early involvement in the Stanford Mercury project, which became the Center for Research on
          Foundation Models.
        source_ids: [goel-site]
      - text: >-
          Cartesia's company page lists Goel as CEO and founder, alongside co-founders Albert Gu, Arjun Desai
          and Brandon Yang, and says the founding team met as PhD students at the Stanford AI Lab, where they
          worked on state space models. Cartesia's products include the Sonic text-to-speech and Ink
          speech-to-text models.
        source_ids: [cartesia-company]
  - heading: Research
    paragraphs:
      - text: >-
          Goel's PhD research covered model auditing and robustness (Robustness Gym, Mandoline and Model
          Patching), interactive data systems for machine learning (Meerkat), and sequence modelling with
          state space models. Goel co-authored S4 (2021) with Albert Gu and Christopher Ré, was first
          author of SaShiMi (2022) on audio generation, and co-authored S4ND (2022) on images and video.
        source_ids: [goel-site, s4-paper, sashimi-paper, s4nd-paper, model-patching-paper]
      - text: >-
          Goel also helped build the Stanford MLSys Seminar series and organized Data-Centric AI workshops,
          according to Goel's site. Cartesia's research page lists these papers.
        source_ids: [goel-site, cartesia-research]
