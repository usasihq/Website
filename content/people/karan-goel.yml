headline: CEO and founder of Cartesia; co-author of the S4 and SaShiMi state space model papers
bio:
  text: >-
    Karan Goel is the CEO and a founder of Cartesia, whose products include the Sonic text-to-speech
    and Ink speech-to-text models. Goel's PhD work at Stanford, advised by Christopher Ré, included co-authoring
    the S4 paper on structured state spaces and first-authoring SaShiMi, which applied state space
    models to raw audio generation.
  source_ids: [cartesia-company, goel-site, s4-paper, sashimi-paper]
  reviewed_at: 2026-10-22
