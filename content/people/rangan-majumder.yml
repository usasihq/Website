headline: Vice President of Search and AI at Microsoft; co-author of the MS MARCO reading comprehension dataset paper
bio:
  text: >-
    Rangan Majumder is Vice President of Search and Artificial Intelligence at Microsoft. Majumder's
    Microsoft Research page describes the team's mission as reducing the friction between a person's
    information need and knowledge found in images, documents, and videos, applying language, vision,
    and multimodal understanding to search, personal assistants, and productivity applications.
    Majumder is a co-author of the 2016 paper introducing MS MARCO, a large machine reading
    comprehension dataset built from questions sampled from Bing search query logs.
  source_ids: [msr-profile, msmarco-paper]
