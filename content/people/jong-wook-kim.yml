    artifact_slug: clip-vit-large-patch14
    type: open-weights
    url: https://arxiv.org/abs/2103.00020
    contribution: >-
      Second author, after Alec Radford, of the 2021 paper "Learning Transferable Visual Models From
      Natural Language Supervision", which introduced CLIP.
    source_ids: [clip-paper, kim-resume]
  - name: Whisper large-v3
