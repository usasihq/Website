headline: OpenAI member of technical staff; co-author of CLIP and Whisper and maintainer of the Whisper repository
bio:
  text: >-
    Jong Wook Kim is a member of technical staff at OpenAI, where Kim has worked since August 2019 on
    large-scale multimodal deep learning, including the CLIP, Jukebox and Whisper projects. Kim is the
    second author of the CLIP and Whisper papers, and as a maintainer of the openai/whisper repository
    announced the large-v3 and large-v3-turbo Whisper models.
  source_ids: [kim-site, kim-bio, clip-paper, whisper-paper, whisper-v3-announcement, whisper-turbo-announcement]
  reviewed_at: 2026-10-22
affiliations:
  - name: OpenAI
    organization_slug: openai
    role: Member of technical staff (since August 2019)
    current: true
    source_ids: [kim-site, kim-bio, kim-github]
work:
