      Second author of the Whisper paper, and posted the November 2023 announcement of the large-v3
      model in the openai/whisper repository as a maintainer.
    source_ids: [whisper-paper, whisper-v3-announcement]
  - name: Whisper large-v3-turbo
    artifact_slug: whisper-large-v3-turbo
    type: open-weights
    url: https://github.com/openai/whisper/discussions/2363
    contribution: >-
      Posted the October 2024 announcement of large-v3-turbo, a version of large-v3 with 4 decoder
      layers instead of 32, in the openai/whisper repository as a maintainer.
    source_ids: [whisper-turbo-announcement]
