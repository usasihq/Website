sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kim worked as a software engineer at NCSOFT and then as a recommender system engineer and data
          scientist at Kakao, building distributed systems and Spark applications for recommendations. Kim later
          held research internships at Pandora in 2017 and Spotify in 2018.
        source_ids: [kim-resume, kim-bio]
      - text: >-
          Kim joined OpenAI as a member of technical staff in August 2019. Kim's résumé describes developing
          and open-sourcing multimodal models such as Jukebox, CLIP and Whisper, building the Whisper API,
          and taking part in data engineering for GPT-4 with vision.
        source_ids: [kim-resume, kim-bio]
  - heading: Research
    paragraphs:
      - text: >-
          Kim's early research was in music information retrieval, including CREPE (2018), a convolutional
          model for pitch estimation. At OpenAI, Kim co-authored Jukebox (2020), a generative model for music.
        source_ids: [crepe-paper, kim-resume, jukebox-paper]
      - text: >-
          Kim is second author of the CLIP paper (2021), which trains image and text encoders together from
          natural language supervision, and of the Whisper paper (2022), on speech recognition trained with
          large-scale weak supervision. In the Whisper repository, Kim announced large-v3 in 2023, which uses
          128 Mel frequency bins, and large-v3-turbo in 2024, which reduces the decoder to 4 layers.
        source_ids: [clip-paper, whisper-paper, whisper-v3-announcement, whisper-turbo-announcement]
