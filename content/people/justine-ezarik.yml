headline: Tech creator and host who publishes as iJustine on YouTube and co-hosts the Same Brain podcast
bio:
  text: >-
    Justine Ezarik, who publishes as iJustine, is a digital creator, producer, and host whose YouTube
    channel has featured videos on technology, Apple products, and gaming since 2006. Justine co-hosts
    the Same Brain podcast with Jenna Ezarik, covering new technology, gaming, and creative trends, and
    has served as one of the official hosts of CES. Earlier web shows include AOL's Hardwired, which
    looked at how new technology is built.
  source_ids: [about, site]
  reviewed_at: 2026-10-21
