sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Justine Ezarik posted a first YouTube video in 2006 and in 2007 began lifecasting daily
          life around the clock on Justin.tv. Over time the iJustine channel
          moved from short one-off clips to edited videos about technology, Apple products and
          gaming, with a focus on reactions to new gadgets and plain explanations of how they work.
        source_ids: [about]
      - text: >-
          In 2015 Justine published the book I, Justine: An Analog Memoir. In 2020 Justine launched
          the Same Brain podcast with Jenna Ezarik, which covers new technology, gaming and creative
          trends, and the channel has since added short-form video and AI storytelling tools.
        source_ids: [about]
  - heading: Hosting
    paragraphs:
      - text: >-
          Justine hosted multiple seasons of AOL's Hardwired, meeting inventors, engineers and
          entrepreneurs to show how new technology is made. Justine has hosted Call of Duty events and
          launch livestreams, hosted the first Fortnite Pro-Am, and in 2016 appeared as a judge on
          NBC's The Celebrity Apprentice.
        source_ids: [about]
      - text: >-
          Justine regularly appears at technology events such as WWDC and CES, and for several years
          has been one of the official hosts of CES, covering smart devices, wearables and creative
          tools from the show floor and official livestreams. Justine has interviewed technology
          executives including Tim Cook, Sundar Pichai and Craig Federighi.
        source_ids: [about, site]
