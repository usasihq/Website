sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          TheBloke is the public handle of a Hugging Face account whose profile lists quantisation and fine tuning
          as interests. The account's repositories, created between April 2023 and January 2024, publish quantized
          versions of open language models so they can run on local hardware.
        source_ids: [hf-profile, hf-models-api, hf-models-api-latest]
  - heading: Quantization formats
    paragraphs:
      - text: >-
          The earliest repositories, for models such as Koala 7B, used the GPTQ and GGML formats, and the Koala
          GGML card notes that some files were quantized with an older version of llama.cpp to stay compatible with
          an earlier commit. Later repositories adopted the GGUF format alongside GPTQ and AWQ: the Llama 2 7B GGUF
          repository, for example, offers files from Q2_K to Q8_0 and lists llama.cpp and LM Studio among the
          clients that can load them.
        source_ids: [koala-gptq-card, koala-ggml-card, llama2-gguf-card]
      - text: >-
          Among the last repositories created, in January 2024, were GGUF, GPTQ and AWQ versions of Argilla's
          CapybaraHermes 2.5 Mistral 7B.
        source_ids: [hf-models-api-latest, capybara-gguf-card]
timeline:
  - date: "2023-04-07"
    text: Created the first TheBloke repositories on Hugging Face, including koala-7B-GPTQ.
    source_ids: [hf-models-api, koala-gptq-card]
  - date: "2023-09-04"
    text: Created the Llama-2-7B-GGUF repository of GGUF quantizations of Meta's Llama 2 7B.
    source_ids: [hf-models-api, llama2-gguf-card]
  - date: "2024-01-31"
    text: Created GGUF, GPTQ and AWQ repositories for CapybaraHermes 2.5 Mistral 7B, among the account's last uploads.
    source_ids: [hf-models-api-latest, capybara-gguf-card]
