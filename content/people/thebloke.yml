headline: Published quantized GGUF, GPTQ and AWQ versions of open language models on Hugging Face
bio:
  text: >-
    TheBloke is a public handle on Hugging Face, where the profile lists quantisation and fine
    tuning as interests and hosts quantized versions of open language models in the GGUF, GPTQ and
    AWQ formats. TheBloke's repository for Meta's Llama 2 7B, for example, offers GGUF files at
    quantization levels from Q2_K to Q8_0 and lists llama.cpp among the local clients and libraries
    that can run them. Earlier GGML repositories, such as the one for Koala 7B, say some of their
    files were quantized with an older version of llama.cpp, and in May 2023 TheBloke authored a
    merged commit to llama.cpp
    that let its convert.py script handle models stored in a single pytorch_model.bin file.
  source_ids: [hf-profile, llama2-gguf-card, koala-ggml-card, llama-cpp-commits]
  reviewed_at: 2026-10-13
