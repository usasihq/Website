    url: https://huggingface.co/TheBloke
    contribution: >-
      Publishes GGUF, GPTQ and AWQ quantizations of open models under the TheBloke account. The
      Llama-2-7B-GGUF card says the repository contains GGUF files for Meta's Llama 2 7B under the
      llama2 license, and lists llama.cpp, LM Studio and other clients that support the format.
      The koala-7B-GGML card says its original quantisation methods were quantized using an older
      version of llama.cpp so that they stay compatible with llama.cpp as of commit 2d5db48.
    source_ids: [hf-profile, llama2-gguf-card, koala-ggml-card]
