headline: Leads Snazzy Labs, an independent technology video channel about Apple, smart homes, and networking
bio:
  text: >-
    Quinn Nelson leads Snazzy Labs Media, an independent technology channel and creative studio. Snazzy
    Labs publishes videos on YouTube about Apple products, smart homes, networking, and consumer
    technology gear, and the studio also does sponsorships, production, and content licensing for
    brands.
