sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Snazzy Labs describes itself as independent technology media established in 2008, and its YouTube
          channel lists a December 2008 join date. The channel covers Apple hardware and operating systems,
          smart-home technology such as Matter, HomeKit and Home Assistant, and networking and home-lab builds,
          with reviews, comparisons, buyer's guides, teardowns and step-by-step tutorials.
        source_ids: [snazzy-home, snazzy-youtube]
      - text: >-
          Beyond the channel, Snazzy Labs Media works with brands on sponsorships, dedicated videos, production
          and content licensing, and links to Copland Supply as its shop.
        source_ids: [snazzy-home]
