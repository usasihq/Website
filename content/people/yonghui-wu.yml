headline: First author of the paper on Google's Neural Machine Translation system (GNMT); co-author of Lingvo
bio:
  text: >-
    Yonghui Wu is the first author of the 2016 paper presenting GNMT, Google's Neural Machine Translation
    system, which describes deep LSTM encoder and decoder networks with attention for translation and
    thanks the Google Brain and Google Translate teams. Wu is also a co-author of the 2019 paper on
    Lingvo, a TensorFlow framework for sequence-to-sequence modeling published in the TensorFlow GitHub
    organization under the Apache 2.0 license.
  source_ids: [gnmt-paper, lingvo-paper, lingvo-repo]
  reviewed_at: 2026-10-13
