links: []
sections:
  - heading: Research
    paragraphs:
      - text: >-
          Wu is first author of the 2016 paper describing GNMT, Google's Neural Machine Translation system, which
          used deep LSTM encoder and decoder networks with attention and acknowledges the Google Brain and Google
          Translate teams. Wu also co-authored the 2019 paper on Lingvo, a TensorFlow framework for
          sequence-to-sequence modeling whose code is published in the TensorFlow GitHub organization.
        source_ids: [gnmt-paper, lingvo-paper, lingvo-repo]
      - text: >-
          Wu's co-authored work extends across speech and vision. In speech, it includes Tacotron 2, a 2017
          architecture for synthesizing speech directly from text, and Conformer, a 2020 model combining
          convolution with Transformers for speech recognition. In 2022 Wu co-authored CoCa, a contrastive
          captioning approach to image-text foundation models, and Parti, an autoregressive text-to-image model.
        source_ids: [yw-tacotron2, yw-conformer, yw-coca, yw-parti]
