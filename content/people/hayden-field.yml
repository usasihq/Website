headline: Senior AI reporter at The Verge
bio:
  text: >-
    Hayden Field is the senior AI reporter at The Verge, leading coverage of AI companies including
    OpenAI, Anthropic, Google, and Meta, and reporting on how AI tools are used, their effects on
    society, and how regulators respond. Before The Verge, Hayden Field was the AI beat reporter at
    CNBC. Hayden Field's work has also appeared in MIT Technology Review and Wired UK.
  source_ids: [verge, cnbc]
