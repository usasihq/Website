sections:
  - heading: Career
    paragraphs:
      - text: >-
          Field was an AI beat reporter on CNBC's technology team, covering artificial intelligence with a
          focus on the industry's shifting power dynamics and its real-world implications. CNBC's author page
          also lists earlier bylines in MIT Technology Review, Wired UK, Fortune, Digital Trends, Morning Brew,
          and Entrepreneur.
        source_ids: [cnbc]
      - text: >-
          Field is now the senior AI reporter at The Verge. The Verge's author page describes Field's CNBC
          coverage as including competition among AI companies, concerns raised by employees at large AI
          developers, and Federal Trade Commission inquiries into tech companies.
        source_ids: [verge]
  - heading: Coverage
    paragraphs:
      - text: >-
          At The Verge, Field covers the major AI developers, including OpenAI, Anthropic, Google, and Meta,
          along with how AI tools are used, their effects on society, and how regulators respond. Recent stories
          on Field's author page examine consumer AI agents and their privacy
          promises, AI hardware companions, OpenAI's developer conference, and AI's effect on cybersecurity.
        source_ids: [verge, verge-archive]
