sections:
  - heading: Career
    paragraphs:
      - text: >-
          Sameer Singh received a PhD from the University of Massachusetts Amherst, with internships at
          Microsoft Research, Google Research and Yahoo! Labs, and was a postdoctoral researcher at the
          University of Washington from 2013 to 2016. Singh joined UC Irvine as an assistant professor of
          computer science in 2016, became an associate professor in 2021 and a full professor in 2024, with
          affiliations in Linguistics and EECS.
        source_ids: [singh-site]
      - text: >-
          From 2021 to 2023 Singh was an Allen Fellow at the Allen Institute for AI, and Singh's site lists a
          current role as co-founder and CTO of Spiffy AI.
        source_ids: [singh-site]
  - heading: Research
    paragraphs:
      - text: >-
          Singh's research concerns the robustness and interpretability of machine learning and models that
          reason over text and structure. LIME, introduced in 2016 with Marco Tulio Ribeiro and Carlos
          Guestrin, explains an individual prediction of any classifier by fitting an interpretable model
          locally around it. A related 2016 paper on model-agnostic interpretability received the workshop
          best paper award at the ICML Workshop on Human Interpretability in Machine Learning.
        source_ids: [singh-site, lime-paper, awards]
      - text: >-
          CheckList (2020), again with Ribeiro and others, proposed behavioral testing of NLP models with a
          matrix of linguistic capabilities and test types, and received the best paper award at ACL 2020.
          Later award-winning work from Singh's group includes FRUIT, a NAACL 2022 task on updating text to
          reflect new information.
        source_ids: [checklist-paper, awards]
