headline: UC Irvine professor of computer science; co-author of LIME and CheckList; former Ai2 Allen Fellow
bio:
  text: >-
    Sameer Singh is a Professor of Computer Science at the University of California, Irvine, working
    primarily on robustness and interpretability of machine learning algorithms and on models that
    reason with text and structure for natural language processing. Singh was a postdoctoral
    researcher at the University of Washington from 2013 to 2016 and an Allen Fellow at the Allen
    Institute for AI from 2021 to 2023, and lists a current role as co-founder and CTO of Spiffy AI.
    With Marco Tulio Ribeiro and Carlos Guestrin, Singh co-authored the paper that proposed LIME, a
    technique for explaining the predictions of any classifier, and Singh is a co-author of Beyond
    Accuracy: Behavioral Testing of NLP models with CheckList.
