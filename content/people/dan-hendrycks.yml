sections:
  - heading: Research
    paragraphs:
      - text: >-
          Hendrycks's early research, much of it with Kevin Gimpel, includes the 2016 paper proposing the GELU
          activation function and a 2016 baseline for detecting misclassified and out-of-distribution examples
          in neural networks. With Thomas Dietterich, Hendrycks introduced a 2019 benchmark of neural network
          robustness to common corruptions and perturbations, one of several distribution-shift benchmarks
          listed on Hendrycks's homepage.
        source_ids: [gelu-paper, dh-ood, dh-imagenetc, hendrycks-site]
      - text: >-
          Hendrycks later turned to measuring the knowledge of language models. As first author of the 2020
          MMLU paper, Hendrycks proposed a test of multitask accuracy across 57 tasks, and in 2025 Hendrycks
          was a co-author of Humanity's Last Exam, a benchmark of expert-written questions assembled with
          many contributing authors.
        source_ids: [mmlu-paper, hle-paper]
  - heading: Center for AI Safety
    paragraphs:
      - text: >-
          Hendrycks directs the Center for AI Safety, which lists Hendrycks as Executive & Research Director. The
          organization describes running a compute cluster used by outside safety researchers since March 2023,
          training students in machine learning safety, and publishing research through its programs and
          affiliates.
        source_ids: [cais-about, hendrycks-site]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Hendrycks developed the course Introduction to AI Safety, Ethics, and Society and wrote its textbook,
          published by Taylor & Francis in 2024 and also readable online. The course covers the technical
          challenges of building safe AI systems, sources of societal-scale risk, safety engineering and
          approaches to AI governance.
        source_ids: [dh-book]
      - text: >-
          Hendrycks co-organized the ICML Workshop on Robustness and Uncertainty Estimation in Deep Learning in
          2019, 2020 and 2021, an adversarial machine learning workshop at ICML 2021, and the VISDA domain
          adaptation competition at NeurIPS 2021.
        source_ids: [hendrycks-site]
