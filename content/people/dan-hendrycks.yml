headline: Executive and Research Director of the Center for AI Safety; co-author of MMLU and Humanity's Last Exam
bio:
  text: >-
    Dan Hendrycks directs the Center for AI Safety (CAIS); the organization's site lists Hendrycks as
    Executive & Research Director. Hendrycks received a PhD from UC Berkeley advised
    by Dawn Song and Jacob Steinhardt. Hendrycks is first author of the GELU activation function paper
    and of "Measuring Massive Multitask Language Understanding" (MMLU), and the last-listed author of
    Humanity's Last Exam, a multi-modal benchmark of expert-written questions across dozens of
    subjects.
  source_ids: [hendrycks-site, cais-about, gelu-paper, mmlu-paper, hle-paper]
  reviewed_at: 2026-10-13
