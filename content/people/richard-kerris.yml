headline: Industry general manager for media and entertainment at NVIDIA; former CTO of Lucasfilm
bio:
  text: >-
    Richard Kerris is the industry general manager for media and entertainment at NVIDIA. Kerris's
    career spans Apple, Lucasfilm and Amazon/AWS: at Apple, Kerris directed developer relations
    and managed Final Cut Pro, Logic and Aperture, and at Lucasfilm served as CTO, managing
    research and development, IT and information services. Kerris writes NVIDIA's posts on AI for
    media and entertainment, including the January 2025 introduction of NVIDIA Media2 for content
    creation, streaming and audience experiences and a March 2026 post on RTX-accelerated
    computers connecting directly to Apple Vision Pro through NVIDIA CloudXR 6.0.
  source_ids: [nvidia-blog-author]
