sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kerris's NVIDIA author biography describes a career across Apple, Lucasfilm, and Amazon/AWS that
          combines marketing and product development. At Apple, Kerris directed developer relations, managed
          the Final Cut Pro, Logic, and Aperture applications, and gave several Worldwide Developers Conference
          presentations; at Lucasfilm, Kerris was CTO, managing research and development, IT, and information
          services.
        source_ids: [nvidia-blog-author]
      - text: >-
          Kerris is now NVIDIA's industry general manager for media and entertainment and has given keynote
          addresses at GTC, Asia Broadcast, and China Joy Expo. Kerris also serves on the Bay Area board of the
          Visual Effects Society and is a member of the Society of Motion Picture and Television Engineers.
        source_ids: [nvidia-blog-author]
  - heading: Writing
    paragraphs:
      - text: >-
          Kerris writes NVIDIA blog posts on AI and graphics for the media industry. Earlier posts covered the
          NVIDIA Omniverse platform, including Industrial Light & Magic's use of Omniverse DeepSearch for
          virtual production in 2022, and later posts introduced NVIDIA Media2 in January 2025 and covered
          real-time AI for entertainment workflows on Blackwell hardware.
        source_ids: [nvidia-blog-author]
      - text: >-
          Posts from 2025 and 2026 describe NVIDIA's work with the European Broadcasting Union on sovereign AI
          for public broadcasters, native CloudXR 6.0 integration with Apple Vision Pro, agentic AI
          collaborations with Adobe and WPP, and agentic security for media organizations.
        source_ids: [nvidia-blog-author]
