headline: Under Secretary for Science at the U.S. Department of Energy; former IBM SVP and Director of Research
bio:
  text: >-
    Darío Gil is Under Secretary for Science at the U.S. Department of Energy, the department's principal
    advisor on science and technology, with an office that supports the National Laboratories and is
    responsible for programs including advanced computing. Before this role, Gil was IBM
    Senior Vice President and Director of Research. The department's biography credits Gil as the force
    behind the creation of the MIT-IBM Watson AI Lab and the AI Alliance, and notes election to the
    National Academy of Engineering for contributions to artificial intelligence and quantum computing.
