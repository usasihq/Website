sections:
  - heading: Career
    paragraphs:
      - text: >-
          Darío Gil earned a PhD in Electrical Engineering and Computer Science at MIT and then joined
          IBM Research, eventually becoming IBM Senior Vice President and Director of Research. The
          Department of Energy biography says IBM built programmable quantum computers and made them
          available through the cloud under Gil's leadership, and credits Gil with driving the creation
          of the International Science Reserve, the AI Alliance, the MIT-IBM Watson AI Lab and the
          COVID-19 High Performance Computing Consortium.
        source_ids: [doe-bio, doe-letter]
      - text: >-
          Gil has served on the President's Council of Advisors on Science and Technology and on the
          National Science Board, where the department says Gil was the first member from industry in
          30 years to be elected chair. Gil was elected to the National Academy of Engineering for
          contributions to artificial intelligence and quantum computing.
        source_ids: [doe-bio]
  - heading: Department of Energy
    paragraphs:
      - text: >-
          As Under Secretary for Science, Gil is the Department of Energy's principal advisor on
          science and technology, and the office supports the National Laboratories and programs in
          advanced computing, fusion, high energy physics, basic energy sciences, and biological and
          environmental research. In a November 2025 letter to the department, Gil introduced
          themself as the new Under Secretary and the newly appointed Director of the Genesis Mission,
          a national effort to build an integrated science and security platform with the National
          Laboratories, industry and academia.
        source_ids: [doe-bio, doe-letter, doe-genesis-frameworks]
      - text: >-
          In 2026 Gil charged the Office of Science Advisory Committee with two studies: a
          milestone-driven roadmap for quantum computing in science, released in September 2026, and
          the Genesis Mission Frameworks for AI-Accelerated National Breakthroughs report, released the
          same month. Gil's statements also appear in the department's October 2026 fact sheet on new
          science initiatives tied to the Genesis Mission.
        source_ids: [doe-quantum-roadmap, doe-genesis-frameworks, doe-fact-sheet]
