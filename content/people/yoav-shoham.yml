sections:
  - heading: Career
    paragraphs:
      - text: >-
          Shoham received a PhD from Yale in 1986 and was an AI professor in Stanford's Computer Science
          Department for 28 years, where Shoham is now professor emeritus. Shoham also served as a principal
          scientist at Google, according to AI21 Labs.
        source_ids: [stanford-profile, homepage, ai21-about]
      - text: >-
          Alongside academic work, Shoham has founded several AI companies: TradingDynamics, later acquired by
          Ariba; Katango and Timeful, both acquired by Google; and AI21 Labs, where Shoham is chairman and
          co-founder. Stanford HAI lists Shoham on the steering committee of the AI Index, which tracks AI activity
          and progress, and Shoham's Stanford profile describes Shoham as chairing WeCode, a nonprofit initiative
          that trains programmers from disadvantaged populations.
        source_ids: [stanford-profile, ai21-about, homepage, ai-index-people]
  - heading: Research and teaching
    paragraphs:
      - text: >-
          Shoham's research spans artificial intelligence, game theory and multi-agent systems. With Kevin
          Leyton-Brown, Shoham wrote Multiagent Systems: Algorithmic, Game-Theoretic, and Logical Foundations
          (Cambridge University Press, 2009), an introduction to systems of autonomous agents with differing
          information and interests. Shoham has also taught game theory in an online course.
        source_ids: [ai21-about, mas-book, stanford-profile]
      - text: >-
          Shoham is a co-author of the 2022 MRKL Systems paper from AI21 Labs, which proposes a modular architecture
          that combines large language models with external knowledge sources and discrete reasoning, and the
          2024 Jamba paper on a hybrid Transformer-Mamba language model.
        source_ids: [mrkl-paper, jamba-paper]
