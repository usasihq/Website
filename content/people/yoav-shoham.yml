headline: Co-founder and chairman of AI21 Labs; professor emeritus of computer science at Stanford
bio:
  text: >-
    Yoav Shoham is professor emeritus of computer science at Stanford University and the chairman
    and a co-founder of AI21 Labs, whose about page also describes Shoham as a former principal
    scientist at Google and notes work spanning AI, game theory and multi-agent systems. Shoham is
    a member of the steering committee of the AI Index at Stanford HAI, which tracks AI activity and
    progress, and Shoham's Stanford profile lists honors including the IJCAI Research Excellence
    Award (2019) and the AAAI/ACM Allen Newell Award (2013). Shoham is the last author of Jamba: A Hybrid Transformer-Mamba Language Model (2024), which says
    the model was released under the Apache 2.0 license.
  source_ids: [stanford-profile, ai21-about, ai-index-people, jamba-paper]
  reviewed_at: 2026-10-21
