headline: Listed author of Hugging Face's TRL library and co-author of the StarCoder2, Zephyr, and LLM.int8() papers
bio:
  text: >-
    Younes Belkada is listed among the authors of TRL, Hugging Face's Apache-2.0 library for
    post-training transformer models, and is a co-author of the Zephyr and StarCoder2 papers.
    DeepLearning.AI's short course Quantization Fundamentals with Hugging Face names Belkada as an
    instructor and a Machine Learning Engineer at Hugging Face. Belkada is also a co-author of
    LLM.int8() (2022), which described 8-bit matrix multiplication that made inference with very
    large transformer models possible on a single server with consumer GPUs. Belkada's 2026 paper
    on learnable multipliers for language model matrix layers lists the Falcon LLM Team as
    Belkada's affiliation.
  source_ids: [trl-citation, zephyr-paper, starcoder2-paper, dlai-course, llm-int8-paper, learnable-multipliers-paper]
  reviewed_at: 2026-10-13
