sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Several of Belkada's papers concern running and fine-tuning large models with fewer resources. Belkada
          co-authored LLM.int8() (2022) with Tim Dettmers, Mike Lewis and Luke Zettlemoyer, which introduced
          8-bit matrix multiplication for transformer inference, and Petals (2022), a system for running and
          fine-tuning large models collaboratively across many machines. Belkada also co-taught the
          DeepLearning.AI short course "Quantization Fundamentals with Hugging Face" with Marc Sun.
        source_ids: [llm-int8-paper, petals-paper, dlai-course]
      - text: >-
          Belkada is listed among the authors of TRL, Hugging Face's library for post-training transformer
          models with methods such as supervised fine-tuning, reward modeling, DPO and GRPO, and co-authored the
          Zephyr paper (2023), which aligned a smaller chat model using distilled direct preference
          optimization. Belkada was also a co-author of "StarCoder 2 and The Stack v2" (2024), on open code
          models and their training data.
        source_ids: [trl-citation, zephyr-paper, starcoder2-paper]
  - heading: Falcon models
    paragraphs:
      - text: >-
          Later papers concern the Falcon family of language models. Belkada co-authored the technical reports
          for Falcon Mamba 7B (2024), a base model built on the Mamba architecture without attention, and
          Falcon-H1 (2025), a series of models with a parallel hybrid of attention and state-space layers. A
          2026 paper on learnable multipliers for matrix layers lists Belkada with the Falcon LLM Team.
        source_ids: [falcon-mamba-paper, falcon-h1-paper, learnable-multipliers-paper]
