headline: Vice president at IBM Research, titled VP of AI platform in March 2026; co-author of LLM-serving research
bio:
  text: >-
    Priya Nagpurkar is a vice president at IBM Research. IBM Research's March 2026 post on contributing
    the llm-d distributed inference framework to the Cloud Native Computing Foundation quotes Nagpurkar as
    vice president of AI platform at IBM Research. In 2023, IBM Research described Nagpurkar as vice
    president of hybrid cloud platform and developer productivity, overseeing the research behind IBM's
    hybrid cloud platform. Nagpurkar is a co-author, listed with IBM Research, of a 2025 paper on
    category-aware semantic caching for LLM serving and of a 2024 IBM Research and University of Illinois
    white paper on transforming hybrid cloud systems for AI workloads.
  source_ids: [ibm-llmd-cncf, ibm-pytorch-foundation, ibm-open-source-qa, semantic-caching-paper, hybrid-cloud-paper]
