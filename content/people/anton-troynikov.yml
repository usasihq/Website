sections:
  - heading: Career
    paragraphs:
      - text: >-
          Troynikov's site describes Troynikov as a co-founder of Chroma, building the memory subsystem for
          language models, and notes earlier work in robotics on 3D computer vision, perception,
          large-scale mapping and state estimation.
        source_ids: [troynikov-site]
      - text: >-
          Chroma's April 2023 company post, signed by Jeff, Anton and the Chroma team, says Chroma was
          founded on the idea that models can be understood through the interpretability of their latent
          spaces, and that the founders built the database because they needed one for that work.
        source_ids: [chroma-seed-post]
  - heading: Research
    paragraphs:
      - text: >-
          Troynikov co-authored Chroma's Embedding Adapters report (May 2024), which applied a linear
          transform to query embeddings to improve retrieval, and Evaluating Chunking Strategies for
          Retrieval (July 2024).
        source_ids: [chroma-embedding-adapters, chroma-chunking]
      - text: >-
          Troynikov is also a co-author of Generative Benchmarking (April 2025) and Context Rot (July
          2025), which studied how model performance changes as input length grows.
        source_ids: [chroma-generative-benchmarking, chroma-context-rot]
