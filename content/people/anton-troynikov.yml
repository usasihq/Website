headline: Co-founder of Chroma; co-author of Chroma technical reports on retrieval and context
bio:
  text: >-
    Anton Troynikov is a co-founder of Chroma, the company behind the open-source Chroma database for
    AI applications. Troynikov's site says Troynikov previously worked on robotics, with a focus on 3D
    computer vision, perception, large-scale mapping and state estimation. Troynikov has co-authored
    Chroma technical reports on embedding adapters, document chunking, generative benchmarking and
    long-context performance.
  source_ids: [troynikov-site, chroma-embedding-adapters, chroma-chunking, chroma-generative-benchmarking, chroma-context-rot]
  reviewed_at: 2026-10-22
