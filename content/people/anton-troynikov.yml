      Co-founded the company behind the Apache-2.0 Chroma database, which the founders' 2023 post says
      grew out of their interpretability work and their need for an easy-to-use open-source vector database.
    source_ids: [chroma-seed-post, chroma-repo, troynikov-site]
  - name: Evaluating Chunking Strategies for Retrieval
