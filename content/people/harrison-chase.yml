sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Chase made the initial commit to the LangChain repository on October 24, 2022, when the project was a
          single Python package. The repository, now hosted by the langchain-ai organization and released under the
          MIT license, describes LangChain as an agent engineering platform.
        source_ids: [lc-first-commit, lc-repo, lc-license, lc-about]
      - text: >-
          In July 2025 Chase made the initial commits to Deep Agents, which the repository describes as a
          batteries-included agent harness and which the company presents as its harness for autonomous,
          long-horizon tasks. Like LangChain and LangGraph, a low-level orchestration framework for stateful agents,
          it is released under the MIT license.
        source_ids: [deepagents-repo, lc-about, langgraph-repo]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Chase and Ankush Gola founded LangChain as a company in early 2023. Following the framework, the company
          launched LangGraph to give developers control over complex agent systems, and LangSmith, a commercial
          platform for agent observability that later added evaluation, deployment and a no-code agent builder.
        source_ids: [lc-about]
  - heading: Writing
    paragraphs:
      - text: >-
          Chase writes "Harrison's In the Loop", a series of essays on the LangChain blog about building and
          running AI agents in companies, such as a July 2026 piece on what it means for a business to own the
          models, context and memory behind its AI systems.
        source_ids: [lc-blog-post]
