headline: Started the open-source LangChain framework and co-founded LangChain, the company behind it
bio:
  text: >-
    Harrison Chase started LangChain in late 2022 as a side project: a single Python package pushed
    from a personal GitHub account. In early 2023 Chase and co-founder Ankush Gola started LangChain,
    the company, which has since released LangGraph for building agent systems, the LangSmith
    platform for agent observability and evaluation, and the Deep Agents harness. The open-source
    LangChain framework is published under the MIT license, and Chase writes the "Harrison's In the
    Loop" series on the LangChain blog.
