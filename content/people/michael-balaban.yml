headline: Co-founder and Chief Product Officer of Lambda; author of Lambda's GPU deep learning benchmarks
bio:
  text: >-
    Michael Balaban is a co-founder and the Chief Product Officer of Lambda, which builds GPU cloud and AI
    infrastructure. Balaban has written GPU benchmark and hardware guides on Lambda's blog, including
    deep learning benchmarks of the Titan RTX and A100 versus V100 GPUs, a guide to choosing GPUs for deep
    learning, and an explainer on GPT-3.
