        source_ids: [lambda-leadership]
  - heading: Writing
    paragraphs:
      - text: >-
          Balaban's posts on Lambda's blog focus on GPU hardware for deep learning, with benchmarks of the
          Titan RTX (2018) and of the A100 against the V100 (2021), and a 2020 guide to choosing GPUs given
          the memory needs of large models. In July 2020 Balaban also published a guide to GPT-3.
        source_ids: [mb-titanrtx, mb-a100, mb-gpu-guide, mb-gpt3, mb-author]
