headline: Research engineer at Meridian Labs and lead author of Petri, the open-source alignment auditing tool
bio:
  text: >-
    Kai Fronsdal is a research engineer at Meridian Labs, a nonprofit that builds open-source tools for
    evaluating frontier AI models, where Fronsdal works on automated alignment auditing with the UK AI
    Security Institute. As an Anthropic Fellow and MATS researcher, Fronsdal developed Petri, an
    open-source tool that uses AI agents to audit model behavior, and is the first-listed author of the
    Petri, Petri 2.0 and Petri 3.0 announcements.
  source_ids: [meridian-team, meridian-about, petri-2025, petri-v2, petri-3]
