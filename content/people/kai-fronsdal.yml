sections:
  - heading: Petri
    paragraphs:
      - text: >-
          Anthropic's Alignment Science Blog released Petri (Parallel Exploration Tool for Risky Interactions)
          in October 2025, in a post by Fronsdal, Isha Gupta, Abhay Sheshadri, Jonathan Michala, Stephen
          McAleer, Rowan Wang, Sara Price and Samuel R. Bowman. Petri uses AI agents to test target models
          across many scenarios; the release post reports applying it to 14 frontier models with 111 seed
          instructions, eliciting behaviors such as autonomous deception and oversight subversion. The work was carried out as part of MATS and the Anthropic Fellows
          program.
        source_ids: [petri-2025]
      - text: >-
          Fronsdal, Jonathan Michala and Bowman wrote the January 2026 Petri 2.0 update, which added
          mitigations for evaluation awareness and 70 new scenarios. In May 2026 Fronsdal was first author
          of the Petri 3.0 announcement, which moved Petri's development to Meridian Labs and overhauled
          its architecture.
        source_ids: [petri-v2, petri-3]
  - heading: Meridian Labs
    paragraphs:
      - text: >-
          Fronsdal joined Meridian Labs in 2026 as a research engineer and works on automated alignment
          auditing and evaluations with the UK AI Security Institute. Meridian's team page notes Fronsdal's
          MSc from Stanford University, with research focused on AI safety and alignment.
        source_ids: [meridian-team]
