headline: VP and general manager of quantum at NVIDIA; earlier led product management for NVIDIA HPC software
bio:
  text: >-
    Timothy (Tim) Costa is vice president and general manager of quantum at NVIDIA, the title used
    in NVIDIA's September 2026 announcement of CUDA-Q Logical, an addition to the open-source
    CUDA-Q platform for developing fault-tolerant quantum computing applications. NVIDIA's blog
    describes Costa as heading the company's industrial engineering and quantum verticals and the
    NVIDIA CUDA-X product line, after several leadership positions at NVIDIA. An earlier NVIDIA
    developer blog profile describes Costa running product management for HPC software, covering
    the NVIDIA HPC SDK, HPC compilers and math libraries. Before NVIDIA, Costa worked at Intel as a
    performance library architect and HPC application engineer.
  source_ids: [cudaq-release, nvidia-blog-author, nvidia-dev-author]
  reviewed_at: 2026-10-13
