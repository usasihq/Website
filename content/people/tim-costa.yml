sections:
  - heading: Career
    paragraphs:
      - text: >-
          Tim Costa holds a PhD in mathematics from Oregon State University, with research on
          numerical methods for fluid flow in stochastic or evolving porous media. At Intel, Costa
          worked as a performance library architect and HPC application engineer and led enabling
          efforts for computational fluid dynamics applications.
        source_ids: [nvidia-dev-author]
      - text: >-
          At NVIDIA, Costa first led product management for HPC software, covering the NVIDIA HPC
          SDK, HPC compilers and math libraries along with programming-model strategy and standards
          work. NVIDIA's blog now describes Costa as heading the industrial engineering and quantum
          verticals and the CUDA-X product line, and its author page gives the title vice president
          and general manager for industrial and computational engineering.
        source_ids: [nvidia-dev-author, nvidia-blog-author]
  - heading: Quantum computing
    paragraphs:
      - text: >-
          In NVIDIA's September 2026 announcement of CUDA-Q Logical, Costa is quoted as vice president
          and general manager of quantum, describing the addition as an open platform for designing
          fault-tolerant quantum systems built on logical qubits. CUDA-Q Logical extends the
          open-source CUDA-Q platform so researchers can co-design algorithms, error-correction codes
          and hardware architectures.
        source_ids: [cudaq-release]
  - heading: Engineering simulation and writing
    paragraphs:
      - text: >-
          Costa writes on the NVIDIA Blog about accelerated engineering and scientific computing. Posts
          by Costa introduced NVIDIA Apollo, a family of open models for industrial and computational
          engineering, at the SC25 conference in November 2025, and announced the general
          availability of the NVIDIA cuDSS CUDA-X library for engineering and scientific simulation
          in October 2026.
        source_ids: [nvidia-blog-author, apollo-post, cudss-post]
