headline: Creator of NetworkChuck, a YouTube channel and academy teaching IT, networking, and security skills
bio:
  text: >-
    Chuck Keith started the NetworkChuck YouTube channel in 2014, first as a resource on Cisco
    collaboration and later focused on IT careers and certification preparation. The channel covers
    networking, hacking, cloud, home labs, and IT certifications from Cisco, CompTIA, AWS, and Microsoft, and NetworkChuck Academy offers
    IT courses aimed at certifications such as CCNA, CompTIA A+, and CompTIA Network+. Chuck is also a
    trainer at CBT Nuggets, holding the Cisco CCNA Routing and Switching and CCNA Voice certifications and CompTIA Security+.
