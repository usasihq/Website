sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          The NetworkChuck channel description sets out a goal of helping people move into IT work by earning
          certifications, and lists Cisco, CompTIA, AWS, and Microsoft topics among its subjects. Recent videos
          listed on the NetworkChuck website cover home-lab monitoring, home networking, open-source
          intelligence, and building applications with AI tools.
        source_ids: [youtube, networkchuck-site]
      - text: >-
          The NetworkChuck website describes the project as having started from the YouTube channel and as
          being dedicated to helping people become network engineers, security practitioners, or cloud
          engineers.
        source_ids: [networkchuck-about]
  - heading: NetworkChuck Academy
    paragraphs:
      - text: >-
          NetworkChuck Academy is the project's course platform, offering lessons with hands-on labs, practice
          quizzes, and a learner community. Its featured courses include a CCNA (200-301) course using Packet
          Tracer labs and a CompTIA A+ course, and it runs guided multi-month study programs for the CCNA.
        source_ids: [academy]
