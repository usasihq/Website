headline: Creator of NetworkChuck, a YouTube channel and academy teaching IT, networking, and security skills
bio:
  text: >-
    Chuck Keith is the creator of NetworkChuck, a YouTube channel started in 2014 that teaches information
    technology with the aim of helping people start IT careers through certifications. The channel covers
    networking, hacking, cloud, home labs, and certifications from Cisco, CompTIA, AWS, and Microsoft, and
    NetworkChuck Academy offers IT courses aimed at certifications such as CCNA, CompTIA A+, and CompTIA
    Network+. The channel's description also presents Chuck as a CBT Nuggets trainer.
  source_ids: [youtube, networkchuck-site, academy]
  reviewed_at: 2026-10-21
