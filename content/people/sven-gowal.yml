sections:
  - heading: SynthID
    paragraphs:
      - text: >-
          Google DeepMind's August 2023 post announcing a beta of SynthID, which embeds an imperceptible
          watermark in image pixels, was written by Gowal and Pushmeet Kohli and states that the two led
          the project. Gowal is first author of the 2025 SynthID-Image paper on image watermarking at
          internet scale.
        source_ids: [synthid-launch, synthid-image-paper]
      - text: >-
          Gowal is also a co-author of the Nature papers for SynthID Text (2024), on watermarking the
          outputs of large language models, and SynthID Bio (2026), on function-preserving watermarking
          of AI-generated proteins; both are released as Apache-2.0 repositories under Google DeepMind's
          GitHub organization.
        source_ids: [st-readme, sb-readme]
  - heading: Research
    paragraphs:
      - text: >-
          Gowal's earlier papers address robustness and verification of neural networks, including
          interval bound propagation for training verifiably robust models (2018), the limits of
          adversarial training against norm-bounded examples (2020) and using generated data to improve
          robustness (2021).
        source_ids: [ibp-paper, limits-paper, generated-data-paper]
