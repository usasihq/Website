headline: Co-led Google DeepMind's SynthID project; co-author of the SynthID Text and SynthID Bio papers
bio:
  text: >-
    Sven Gowal co-led Google DeepMind's SynthID project for watermarking and identifying
    AI-generated content with Pushmeet Kohli, according to the 2023 SynthID launch post.
    Gowal is a co-author of the Nature papers behind SynthID Text, Google DeepMind's open-source
    text watermarking library, and SynthID Bio, its watermarking tool for AI-generated proteins, and
    is first author of the SynthID-Image paper. Gowal's earlier research covers adversarial
    robustness and verification of neural networks.
  source_ids: [synthid-launch, st-readme, sb-readme, synthid-image-paper, ibp-paper]
  reviewed_at: 2026-10-22
