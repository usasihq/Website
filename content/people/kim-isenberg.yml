headline: Co-founder and Editor-in-Chief of Superintelligence, a daily AI newsletter, podcast and video 
  channel
bio:
  text: >-
    Kim Isenberg, who also publishes as "Chubby" on X (@kimmonismus), is the co-founder and
    Editor-in-Chief of Superintelligence, a daily AI briefing published at getsuperintel.com. The
    publication's About page describes Superintelligence as a newsletter, podcast, YouTube channel
    and X account covering AI news and product releases, with deep dives on AI and finance,
    robotics, AI research, longevity, AI and politics, and interviews. Kim Isenberg's own website
    describes the work as content creation and tech analysis covering artificial intelligence,
    compute, and the political economy of intelligence. With Peter Thum, Kim Isenberg co-hosts The
    Superintelligence Podcast, which features conversations with founders, researchers and business
    leaders building AI.
  source_ids: [about, home, linktree, site, podcast, watch-listen]
  reviewed_at: 2026-10-21
