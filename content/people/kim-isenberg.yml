sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Isenberg founded Superintelligence and writes its daily briefing, which covers AI news and product
          releases alongside deep dives on AI and finance, robotics, AI research, longevity, AI and politics,
          and interviews. The publication's team page lists Isenberg as Editor-in-Chief, with Peter Thum as
          CEO and Dan Sutera as head of product.
        source_ids: [about, home]
      - text: >-
          Trained as a sociologist, Isenberg describes the work as covering artificial intelligence, compute,
          and the political economy of intelligence. Isenberg's site collects video interviews with people at
          companies such as LTX, DataCamp, XPeng, Cloudflare, NVIDIA, and Google DeepMind, as well as invited
          on-the-ground vlogs from Microsoft Build 2026 and Google I/O 2026.
        source_ids: [site]
      - text: >-
          On The Superintelligence Podcast, Isenberg and Peter Thum interview founders, researchers, and
          executives; recent episodes cover topics such as facade-cleaning robots, sovereign AI in Europe, and
          whether AI video models understand physics.
        source_ids: [podcast, watch-listen]
