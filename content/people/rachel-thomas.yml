headline: Writer on AI, science, education, and ethics; co-founder of fast.ai and QUT professor of practice
bio:
  text: >-
    Rachel Thomas writes a blog on AI, science, education, and ethics, including essays on machine
    learning in medicine and biology and on AI hype. Rachel is a professor of practice at
    Queensland University of Technology's Centre for Data Science and co-founded fast.ai, whose
    free Practical Deep Learning for Coders course teaches deep learning to coders. Rachel was the
    founding director of the University of San Francisco Center for Applied Data Ethics, created
    and taught a data ethics course, and wrote book chapters including for Deep Learning for Coders
    with Fastai and PyTorch.
