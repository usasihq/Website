sections:
  - heading: Career
    paragraphs:
      - text: >-
          Thomas earned a PhD in mathematics at Duke University, is an author of "A Mathematical Model of Glutathione
          Metabolism", and was an early data scientist and software engineer at Uber. With Jeremy Howard,
          Thomas co-founded fast.ai and its free course, Practical Deep Learning for Coders.
        source_ids: [about, fastai-about]
      - text: >-
          At the University of San Francisco, Thomas designed and taught graduate courses on natural language
          processing and computational linear algebra in the Master of Science in Data Science program, and was
          the founding director of the Center for Applied Data Ethics. Thomas is a professor of practice at
          Queensland University of Technology's Centre for Data Science, and in an October 2026 blog post wrote
          of having re-joined fast.ai, which had grown into Answer.AI.
        source_ids: [about, fastai-about, career-update]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Thomas created and taught a data ethics course and wrote book chapters for Deep Learning for Coders
          with Fastai and PyTorch, 97 Things About Ethics Everyone in Data Science Should Know, and Redesigning AI.
          In a 2020 arXiv paper with David Uminsky, Thomas argued that overemphasizing metrics is a fundamental
          problem for AI, and Thomas's about page lists a related paper, "Reliance on Metrics is a Fundamental
          Challenge for AI", in Patterns.
        source_ids: [about, metrics-paper]
      - text: >-
          Thomas's blog covers AI, science, education and ethics, including essays on machine learning in
          medicine such as "Medicine's Machine Learning Problem" for the Boston Review. Talks have included a
          keynote on the new era in NLP at the 2019 SciPy conference and a keynote at Stanford's Artificial
          Intelligence in Medicine Symposium.
        source_ids: [blog, about]
