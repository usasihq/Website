sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Arista, Ullal was a senior vice president at Cisco, responsible for its
          datacenter, switching and services business.
        source_ids: [arista-mgmt]
      - text: >-
          Ullal became Arista's founding CEO in 2008, took the company public in 2014, and now
          serves as both CEO and Chairperson. The management team includes co-founders Andy
          Bechtolsheim, Arista's Chief Architect, and Kenneth Duda, its President and CTO.
        source_ids: [arista-mgmt]
