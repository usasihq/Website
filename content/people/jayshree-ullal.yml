headline: Founding CEO and Chairperson of Arista Networks; former Cisco senior vice president
bio:
  text: >-
    Jayshree V. Ullal has been the founding CEO of Arista Networks since 2008 and is now also its
    Chairperson. Ullal
    previously led a datacenter, switching and services business at Cisco as a senior vice
    president.
