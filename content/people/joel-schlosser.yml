sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Schlosser maintains two of PyTorch's core modules, the neural-network APIs in torch.nn and the
          optimizers in torch.optim, and is named with Alban Desmaison as an owner of the torch/nn directory in
          the project's CODEOWNERS file. PyTorch's maintainers page also lists Schlosser as an emeritus
          maintainer of NestedTensor (torch.nested) and of the C++ API.
        source_ids: [pytorch-maintainers, pytorch-codeowners]
  - heading: Performance writing
    paragraphs:
      - text: >-
          Schlosser has co-written several PyTorch blog posts on speeding up generative models with native
          PyTorch features. A January 2024 post in the "Accelerating Generative AI with PyTorch" series used
          torch.compile and CUDA Graphs to speed up inference for FAIR's Seamless M4T-v2 translation model, and
          an April 2025 post described FlexAttention for inference, including a decoding kernel and paged
          attention.
        source_ids: [gen-ai-iv-blog, flexattention-inference-blog]
      - text: >-
          As first author of the June 2025 post "Presenting Flux Fast", written with Christian Puhrsch of Meta
          and Sayak Paul of Hugging Face, Schlosser showed how to make the Flux image-generation pipeline run
          faster on H100 GPUs.
        source_ids: [flux-fast-blog]
