headline: PyTorch module maintainer for torch.nn and torch.optim
bio:
  text: >-
    Joel Schlosser is listed on PyTorch's maintainers page as a module maintainer for the NN APIs
    (torch.nn) and the optimizers package (torch.optim), and as an emeritus maintainer of
    NestedTensor (torch.nested) and of the C++ API. The PyTorch CODEOWNERS file names Schlosser,
    with Alban Desmaison, as an owner of the torch/nn directory. Schlosser is listed with Meta as
    the first author of the June 2025 PyTorch blog post "Presenting Flux Fast: Making Flux go brrr
    on H100s," and Schlosser's GitHub profile lists Facebook as their company.
  source_ids: [pytorch-maintainers, pytorch-codeowners, flux-fast-blog, github-profile]
  reviewed_at: 2026-10-21
