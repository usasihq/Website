headline: Co-Lead of Meta Compute; co-founder of Safe Superintelligence Inc. and of the search engine Cue
bio:
  text: >-
    Daniel Gross co-leads Meta Compute, Meta's initiative to expand its AI computing infrastructure,
    and is listed on Meta's leadership page as Co-Lead, Meta Compute. Gross co-founded Safe
    Superintelligence Inc. (SSI); SSI's updates page says that as of June 29, 2025, Gross was no
    longer part of the company. Earlier, Gross co-founded Cue, a search engine that Apple acquired
    in 2013, ran AI and search projects at Apple from 2013 to 2017, and was a partner at Y
    Combinator, where Gross started its AI program. Gross is also an early-stage venture investor
    and co-founded the investment firm NFDG with Nat Friedman.
  source_ids: [meta-bio, meta-leadership, gross-site, ssi-updates]
  reviewed_at: 2026-10-21
