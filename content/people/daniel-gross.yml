sections:
  - heading: Career
    paragraphs:
      - text: >-
          Gross co-founded Cue, a search engine that Apple acquired in 2013, and then ran AI and search projects
          at Apple until 2017. Gross later joined Y Combinator as a partner and started its AI program.
        source_ids: [gross-site, meta-bio]
      - text: >-
          Gross co-founded Safe Superintelligence Inc., a lab whose stated sole goal is building a safe
          superintelligence; SSI's updates page records that Gross was no longer part of the company as of June
          29, 2025. Gross also co-founded the investment firm NFDG with Nat Friedman and invests in early-stage
          companies.
        source_ids: [gross-site, ssi-home, ssi-updates, meta-bio]
      - text: >-
          At Meta, Gross is Co-Lead of Meta Compute, which the company describes as its initiative to expand
          its AI computing infrastructure. Gross's own website summarizes the role as running compute for Meta.
        source_ids: [meta-bio, meta-leadership, gross-site]
