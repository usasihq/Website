headline: Co-first author of GameNGen, a diffusion model that simulates DOOM in real time, and first author of UniTune
bio:
  text: >-
    Dani Valevski is a co-first author of "Diffusion Models Are Real-Time Game Engines" (2024), which
    presents GameNGen, a neural model that interactively simulates the game DOOM in real time by training a diffusion model to predict the next frame from past frames and
    actions. The GameNGen project page lists Valevski with Google Research. Valevski is also first
    author of "UniTune: Text-Driven Image Editing by Fine Tuning a Diffusion Model on a Single Image"
    (2022).
  source_ids: [gamengen-project, gamengen-paper, unitune-paper]
  reviewed_at: 2026-10-13
