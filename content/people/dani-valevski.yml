sections:
  - heading: Image and video editing
    paragraphs:
      - text: >-
          Valevski's papers, mostly written with Yaniv Leviathan and Yossi Matias, focus on controlling and
          editing the output of diffusion models. UniTune (2022) edits a single image from a text instruction by
          fine-tuning a diffusion model on that image, and Face0 (2023) conditions a text-to-image model on a
          face at sampling time, without fine-tuning or inversion. Valevski also co-authored Dreamix, which uses
          a video diffusion model for text-based editing of general videos, and a 2023 study showing that
          recaptioning training images improves how closely text-to-image models follow prompts.
        source_ids: [unitune-paper, face0-paper, dreamix-paper, recaptioning-paper]
  - heading: Game engines and generated interfaces
    paragraphs:
      - text: >-
          In 2024 Valevski was co-first author of the GameNGen paper, which trains an agent to play DOOM and
          then a diffusion model that generates each next frame from past frames and player actions, so the game
          can be played in real time on a single TPU. The project page lists Valevski with Google Research. In
          2026 Valevski co-authored "Generative UI: LLMs are Effective UI Generators", which argues that suitably
          prompted language models can generate whole interfaces rather than static text.
        source_ids: [gamengen-paper, gamengen-project, generative-ui-paper]
