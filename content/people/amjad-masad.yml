sections:
  - heading: Career
    paragraphs:
      - text: >-
          Masad was briefly at Yahoo and then became the first employee at Codecademy, where Masad led
          technical work and built product and infrastructure. Masad then joined Facebook, helping to start
          its JavaScript infrastructure team and serving as a tech lead; Masad describes being a founding
          engineer on React Native.
        source_ids: [masad-about, masad-decade]
      - text: >-
          Masad founded Replit, where Masad is founder and CEO. Replit's about page lists Masad at the head
          of a leadership team that includes co-founder Haya Odeh, President Michele Catasta and CTO Luis
          Héctor Chávez.
        source_ids: [replit-about, masad-replit-author]
  - heading: Writing on Replit
    paragraphs:
      - text: >-
          Masad writes regularly on the Replit blog. Posts include "The role of AI in coding" (2020), the
          announcement of the Ghostwriter AI and Complete Code beta and "Productizing Large Language Models"
          (both 2022), and in 2026 "The Self-Driving Company" and the introduction of Replit's Free Mode.
        source_ids: [masad-replit-author]
