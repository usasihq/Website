headline: Founder and CEO of Replit; former tech lead on Facebook's JavaScript infrastructure team
bio:
  text: >-
    Amjad Masad is the founder and CEO of Replit, an online platform for creating software that now
    lets people describe apps in natural language and build them with AI agents. Before Replit,
    Masad was a tech lead on Facebook's JavaScript infrastructure team, which built and maintained
    open-source tools including the Babel compiler, Jest and the React Native packager, and before
    that was the first employee at Codecademy.
  source_ids: [replit-about, masad-about, masad-replit-author]
  reviewed_at: 2026-10-22
