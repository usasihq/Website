sections:
  - heading: Career
    paragraphs:
      - text: >-
          Taylor began at Google, where Taylor co-created Google Maps, and later served as CTO of
          Facebook. Taylor then founded the productivity company Quip and went on to serve as
          co-CEO of Salesforce.
        source_ids: [sierra-about]
      - text: >-
          Taylor and Clay Bavor, who first met while working together at Google, co-founded
          Sierra to build AI agents for customer service and other customer conversations.
        source_ids: [sierra-about]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Sierra builds AI agents that businesses deploy to talk with their customers. In a November 2025 post
          co-authored by Bret Taylor and Clay Bavor, Sierra described Agent OS 2.0 and
          eight new products launched at Sierra Summit, its first customer conference, including a
          move from separate channels toward a single agent.
        source_ids: [sierra-agent-os-2]
      - text: >-
          In September 2026 the co-founders wrote about Ghostwriter, Sierra's tool for building and
          deploying agents from prompts, becoming a proactive teammate. In October 2026 they
          announced Personal Agent Protocol, an open standard Meta and Sierra are developing with
          industry partners to define how personal agents authenticate and interact with businesses.
        source_ids: [sierra-ghostwriter, sierra-pap]
