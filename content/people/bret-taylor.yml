headline: Co-founder of Sierra, which builds customer-facing AI agents; former Salesforce co-CEO and Facebook CTO
bio:
  text: >-
    Bret Taylor is a co-founder of Sierra, a company that builds AI agents businesses use to serve
    their customers. Taylor previously served as co-CEO of Salesforce, founded Quip, and was CTO of
    Facebook, after starting a career at Google, where Taylor co-created Google Maps. Taylor also
    serves on the board of OpenAI.
