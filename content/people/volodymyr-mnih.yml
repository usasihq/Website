sections:
  - heading: Career
    paragraphs:
      - text: >-
          Mnih completed a master's degree in computing science at the University of Alberta, supervised by
          Csaba Szepesvari, with a 2008 thesis on efficient stopping rules. Mnih then earned a PhD in machine
          learning at the University of Toronto under Geoffrey Hinton, with a 2013 thesis on machine learning
          for aerial image labeling, and is now a research scientist at Google DeepMind.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Mnih's doctoral work with Hinton applied deep learning to aerial imagery, including detecting roads
          in high-resolution aerial images (ECCV 2010) and learning to label aerial images from noisy data
          (ICML 2012), with datasets released from the homepage. Mnih also wrote CUDAMat, a CUDA-based matrix
          class for Python, described in a 2009 technical report.
        source_ids: [homepage]
      - text: >-
          Mnih was first author of a 2013 NIPS Deep Learning Workshop paper in which a convolutional network,
          trained with a variant of Q-learning, learned to play Atari 2600 games from raw pixels, and of the
          2015 Nature paper Human-level Control through Deep Reinforcement Learning. Mnih also first-authored
          Recurrent Models of Visual Attention (NeurIPS 2014) and the 2016 paper Asynchronous Methods for Deep
          Reinforcement Learning, which presented asynchronous variants of standard reinforcement-learning
          algorithms, including actor-critic.
        source_ids: [homepage, dqn-paper, attention-paper, a3c-paper]
