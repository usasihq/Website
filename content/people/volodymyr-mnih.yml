headline: Research scientist at Google DeepMind; first author of the deep Q-network (DQN) and A3C papers
bio:
  text: >-
    Volodymyr (Vlad) Mnih is a research scientist at Google DeepMind, according to Mnih's homepage,
    which lists publications on deep reinforcement learning and visual attention. Mnih is first author of "Playing Atari with Deep Reinforcement Learning" (2013), which trained a
    convolutional network with a variant of Q-learning to play Atari 2600 games from raw pixels, and of
    the Nature paper "Human-level Control through Deep Reinforcement Learning". Mnih is also first
    author of "Asynchronous Methods for Deep Reinforcement Learning" (2016), which introduced
    asynchronous actor-learner variants of standard reinforcement learning algorithms.
  source_ids: [homepage, dqn-paper, a3c-paper]
