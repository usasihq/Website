headline: AI business advisor and educator who writes the AI with ALLIE newsletter and teaches AI courses
bio:
  text: >-
    Allie K. Miller trains and advises companies on applying AI in business, and publishes the AI with
    ALLIE newsletter, which turns AI developments into business tactics and tutorials. Allie's website
    lists AI courses and guidebooks for businesses and a YouTube channel. Allie was previously Global
    Head of Machine Learning for Startups and Venture Capital at AWS, and before that launched a
    multimodal AI team at IBM.
  source_ids: [site, newsletter]
