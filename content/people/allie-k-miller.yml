sections:
  - heading: Career
    paragraphs:
      - text: >-
          Previously, Allie K. Miller was Global Head of Machine Learning for Startups and
          Venture Capital at Amazon Web Services, where the role involved building a business that gave machine
          learning founders, researchers and investors scaling advice and resources. Earlier, Miller launched a
          multimodal AI team at IBM and led product development work across computer vision, conversation, data
          and regulation.
        source_ids: [site]
      - text: >-
          Miller's website describes current work training and advising companies, financial institutions and AI
          labs on applying AI, speaking about AI at events, and advising on AI public policy. The site also notes
          a role as a national ambassador for the American Association for the Advancement of Science (AAAS).
        source_ids: [site]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Miller's courses include the AI-First Academy, a set of four progressive tracks on building AI
          assistants, automating workflows and prototyping no-code applications, and a LinkedIn Learning course,
          "How to Use Generative AI", that teaches a CRAFT framework for working with AI tools. Miller also appears
          with Ethan Mollick and others in the MasterClass guide "Achieve More with GenAI", and the website lists
          guidebooks for businesses on building and scaling with AI.
        source_ids: [site]
      - text: >-
          The AI with ALLIE newsletter translates AI developments into business tactics, with tutorials,
          walkthroughs and explainers.
        source_ids: [newsletter]
