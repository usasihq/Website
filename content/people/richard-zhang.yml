sections:
  - heading: Career
    paragraphs:
      - text: >-
          Zhang worked as a staff engineer at the Johns Hopkins University Applied Physics Laboratory from 2010
          to 2012 and then completed a PhD in EECS at UC Berkeley in 2018, advised by Alexei A. Efros, with a
          thesis on image synthesis for self-supervised visual representation learning. Zhang interned at
          Adobe Research in 2017 and joined it as a research scientist in May 2018, becoming senior research
          scientist in 2022 and later principal scientist.
        source_ids: [zhang-cv, zhang-bio, zhang-site]
  - heading: Research
    paragraphs:
      - text: >-
          Zhang's earlier work spans self-supervised learning, perceptual metrics and image forensics. It
          includes Colorful Image Colorization (ECCV 2016), the LPIPS perceptual similarity metric (CVPR 2018)
          and "Making Convolutional Networks Shift-Invariant Again" (ICML 2019), along with a CVPR 2022 study of
          FID calculation linked to the clean-fid package for evaluating generative models.
        source_ids: [zhang-cv, colorization-paper, lpips-paper, antialias-paper, zhang-site]
      - text: >-
          Zhang's recent research focuses on controllability, inference speed and data transparency for
          generative models. Examples include GigaGAN (CVPR 2023), one-step diffusion with distribution
          matching distillation (CVPR 2024) and its improved version (NeurIPS 2024), data attribution for
          text-to-image models, and fast causal video generation (CVPR 2025).
        source_ids: [zhang-cv, dmd-paper, zhang-site]
