headline: Principal Scientist at Adobe Research; first author of the LPIPS perceptual metric and image colorization work
bio:
  text: >-
    Richard Zhang is a Principal Scientist at Adobe Research, and Zhang's homepage lists research
    interests in computer vision, machine learning, deep learning, graphics, and image processing.
    Zhang is first author of "The Unreasonable Effectiveness of Deep Features as a Perceptual Metric"
    (CVPR 2018), whose BSD-licensed PerceptualSimilarity repository provides the LPIPS metric as the
    pip-installable lpips package. Zhang is also first author of "Colorful Image Colorization" (ECCV
    2016), with code released in the richzhang/colorization repository. Zhang's recent papers, listed on
    the homepage, cover image and video generation, diffusion distillation, and image editing.
  source_ids: [zhang-site, lpips-paper, lpips-readme, lpips-license, colorization-paper, colorization-license]
  reviewed_at: 2026-10-21
