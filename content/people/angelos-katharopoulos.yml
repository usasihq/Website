slug: angelos-katharopoulos
name: Angelos Katharopoulos
initials: AK
headline: One of the four initial developers of MLX, Apple's array framework for machine learning on Apple
  silicon
bio:
  text: Angelos Katharopoulos works in the Machine Learning Research group at Apple. The MLX README names
    Katharopoulos as one of the four people who initially developed the MLX software suite, an array framework
    for machine learning on Apple silicon. Katharopoulos still writes code for the project; 2026 commits
    to the MLX repository include work on JACCL, the MLX distributed backend for low-latency communication
    between Macs using RDMA over Thunderbolt.
