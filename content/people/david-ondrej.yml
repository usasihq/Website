headline: YouTube creator covering AI agents and AI tools; builder of the Vectal task manager
bio:
  text: >-
    David Ondrej runs the David Ondrej YouTube channel, which covers AI agents and AI tools. David
    started building Vectal, an AI-native task manager that AI agents can use through an API, CLI,
    and agent skill, in October 2024. The davidondrej GitHub account also hosts Cloudroom, an
    open-source, self-hostable runtime for running Claude Code, Codex, and Pi agents in the cloud.
  source_ids: [vectal-about, channel, cloudroom-core, cloudroom]
