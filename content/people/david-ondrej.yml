sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          David Ondrej runs the David Ondrej YouTube channel, which Vectal's about page describes as
          covering AI agents and AI tools. The channel page links to Ondrej's software projects,
          including Cloudroom.
        source_ids: [channel, vectal-about]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Ondrej started building Vectal in October 2024 as an AI-native task manager that keeps tasks,
          projects, notes and habits in one place, made by Vectal LLC. Coding agents such as Claude Code,
          Codex and Cursor can read and update a Vectal workspace through a REST API, the vectal CLI or
          an agent skill, and the public changelog lists more than 90 releases since October 2024.
        source_ids: [vectal-about, vectal-changelog]
      - text: >-
          The davidondrej GitHub account hosts cloudroom-core, an Apache-2.0-licensed, self-hostable
          Rust runtime that runs Claude Code, Codex and Pi agents in the cloud. The Cloudroom site
          describes running each agent in its own isolated sandbox, with a desktop app that shows the
          agents side by side.
        source_ids: [cloudroom-core, cloudroom]
