headline: Co-founder, President and Chief Strategy Officer of Crusoe, the AI infrastructure and cloud company
bio:
  text: >-
    Cully Cavness is a co-founder of Crusoe and serves as its President and Chief Strategy Officer,
    according to the company's leadership page, which lists Cavness and CEO Chase Lochmiller as
    Crusoe's founders. Crusoe's company history says it was founded in 2018 with an energy-first
    approach and now builds AI data centers and runs Crusoe Cloud. Before co-founding Crusoe, Cavness
    held leadership and management positions in the upstream oil and gas and geothermal energy
    industries and worked in energy investment banking.
  source_ids: [crusoe-leadership, crusoe-company]
  reviewed_at: 2026-10-22
