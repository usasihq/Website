sections:
  - heading: Career
    paragraphs:
      - text: >-
          Crusoe's leadership page describes Cavness as an energy industry professional whose earlier roles
          included leadership and management positions in upstream oil and gas and geothermal energy, as well
          as energy investment banking. Cavness co-founded Crusoe with Chase Lochmiller and serves as President
          and Chief Strategy Officer.
        source_ids: [crusoe-leadership]
      - text: >-
          Crusoe's history page traces the company from its 2018 founding, around technology that converted
          wasted natural gas into energy for computing, to the general availability of Crusoe Cloud in 2024
          and the launch of Crusoe Managed Inference in 2025.
        source_ids: [crusoe-company]
