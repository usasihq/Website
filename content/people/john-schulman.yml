sections:
  - heading: Career
    paragraphs:
      - text: >-
          John Schulman completed a PhD in computer science at UC Berkeley advised by Pieter Abbeel,
          working on robotics and reinforcement learning; the Abbeel group lists the December 2016 thesis
          "Optimizing Expectations: From Deep Reinforcement Learning to Stochastic Computation Graphs".
          Schulman then co-founded OpenAI, where Schulman led the creation of ChatGPT and from 2022 to 2024
          co-led the post-training team that developed models for ChatGPT and the OpenAI API.
        source_ids: [homepage, abbeel-group]
      - text: >-
          After OpenAI, Schulman did research on the Alignment Science team at Anthropic. Schulman is now a
          co-founder and the chief scientist of Thinking Machines Lab, and is a credited author of the
          lab's September 2025 Connectionism post "LoRA Without Regret".
        source_ids: [homepage, tml-lora]
  - heading: Research
    paragraphs:
      - text: >-
          Schulman's early deep reinforcement learning work includes Trust Region Policy Optimization
          (2015) and Generalized Advantage Estimation, presented at ICLR 2016, followed by Proximal Policy
          Optimization (2017). Later co-authored papers listed on Schulman's publications page include
          WebGPT (2021), the grade school math verifiers paper (2021), studies of scaling laws for reward
          model overoptimization (2022), and "Let's verify step by step" (2023).
        source_ids: [trpo-paper, ppo-paper, schulman-pubs]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Schulman's code page lists projects built with collaborators: TrajOpt (2012–2013), a C++ framework
          with a Python API for robot trajectory optimization; the Computation Graph Toolkit (2015), an
          automatic differentiation library; and, at OpenAI, OpenAI Gym and OpenAI Baselines (2016), Gym
          Retro (2018) and the Procgen Benchmark (2019).
        source_ids: [schulman-code]
