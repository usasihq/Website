headline: Co-founder and chief scientist of Thinking Machines Lab; OpenAI co-founder and first author of PPO and TRPO
bio:
  text: >-
    John Schulman is a co-founder and the chief scientist of Thinking Machines Lab. Before that,
    Schulman did research on the Alignment Science team at Anthropic, and earlier co-founded OpenAI,
    where Schulman led the creation of ChatGPT and from 2022 to 2024 co-led the post-training team.
    Schulman completed a PhD thesis on deep reinforcement learning in Pieter Abbeel's group at UC
    Berkeley and is first author of the Trust Region Policy Optimization (TRPO) and Proximal Policy
    Optimization (PPO) papers. At Thinking Machines, Schulman wrote the 2025 research post "LoRA
    Without Regret" in collaboration with colleagues.
  source_ids: [homepage, abbeel-group, trpo-paper, ppo-paper, tml-lora]
  reviewed_at: 2026-10-21
