sections:
  - heading: Career
    paragraphs:
      - text: >-
          Early in deSouza's career, deSouza founded two companies, which were acquired by Microsoft and
          Symantec, and later served as President of Products and Services at Symantec.
        source_ids: [scale-ceo]
      - text: >-
          deSouza joined Illumina, the genomics company, as President in 2013, leading its product
          development, commercial and manufacturing organizations, and became President and CEO in July
          2016 while continuing to serve on its board. deSouza later served at Google Cloud as Chief
          Operating Officer and President of Security Products.
        source_ids: [illumina-2016, scale-ceo]
  - heading: Scale AI
    paragraphs:
      - text: >-
          On July 30, 2026, Scale AI announced that its board had appointed deSouza as Chief Executive
          Officer effective August 10, 2026, succeeding Jason Droege, who had led the company as interim CEO
          since June 2025. In the announcement, deSouza named three priorities: bringing Scale's solutions to
          more businesses and governments, delivering data for AI labs, and demonstrating value through
          measurable outcomes.
        source_ids: [scale-ceo]
