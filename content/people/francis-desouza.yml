headline: Chief Executive Officer of Scale AI since August 2026; previously Google Cloud COO and Illumina CEO
bio:
  text: >-
    Francis deSouza is the Chief Executive Officer of Scale AI, appointed by its board effective August
    10, 2026. Before Scale, deSouza was Chief Operating Officer and President of Security Products at
    Google Cloud, and earlier President and CEO of Illumina, which deSouza joined as President in 2013.
    Earlier in deSouza's career, deSouza was President of Products and Services at Symantec and founded
    two companies that were acquired by Microsoft and Symantec.
  source_ids: [scale-ceo, scale-about, illumina-2016]
  reviewed_at: 2026-10-22
