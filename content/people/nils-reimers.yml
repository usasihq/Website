sections:
  - heading: Career
    paragraphs:
      - text: >-
          Reimers was a doctoral researcher in the UKP Lab at TU Darmstadt from 2014 to 2018, completing a PhD in
          deep learning and natural language processing under Iryna Gurevych, and stayed on as a postdoctoral
          researcher until 2021, leading research projects and lecturing on deep learning for NLP. In 2021 Reimers
          joined Hugging Face as a research scientist and built its neural search research team.
        source_ids: [reimers-vita]
      - text: >-
          Reimers joined Cohere in 2022 as Director of Machine Learning and Principal Scientist, leading the team
          that trains large language models for semantic search and text classification. Reimers's homepage now
          gives the title VP of AI Search, with a team working on dense and sparse embeddings, neural re-ranking
          and query generation.
        source_ids: [reimers-vita, reimers-site]
  - heading: Research and open-source work
    paragraphs:
      - text: >-
          Reimers created the Sentence Transformers library, first developed at the UKP Lab and released under
          the Apache-2.0 license, and with Gurevych wrote the 2019 Sentence-BERT paper. In 2020 Reimers and
          Gurevych showed how to make monolingual sentence embedding models multilingual through knowledge
          distillation, and Reimers co-authored Augmented SBERT, a data augmentation method for bi-encoders.
        source_ids: [st-readme, sbert-paper, multilingual-distillation-paper, augmented-sbert-paper]
      - text: >-
          Much of Reimers's later work concerns evaluating and adapting neural search. Reimers co-authored BEIR
          (2021), a benchmark for zero-shot evaluation of retrieval models, GPL (2021), a generative
          pseudo-labeling method for adapting dense retrievers to new domains without labeled data, and MTEB
          (2022), a benchmark covering many text embedding tasks.
        source_ids: [beir-paper, gpl-paper, mteb-paper]
