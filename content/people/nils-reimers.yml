headline: Creator of the Sentence Transformers library and VP of AI Search at Cohere
bio:
  text: >-
    Nils Reimers is VP of AI Search at Cohere, where Reimers's team develops search methods built
    on transformer networks, including dense and sparse embeddings, neural re-ranking, and query
    generation. Reimers created the Sentence Transformers library and, with Iryna Gurevych, wrote
    the Sentence-BERT paper (2019), which adapted BERT with siamese and triplet network structures
    to produce sentence embeddings for semantic similarity search. Reimers's vita lists a Research
    Scientist role at Hugging Face from 2021 to 2022, building a neural search research team, and
    earlier research positions at TU Darmstadt, whose UKP Lab first developed Sentence
    Transformers. Reimers is also a co-author of the BEIR and MTEB benchmarks for retrieval and
    text embeddings.
  source_ids: [reimers-site, github-profile, reimers-vita, sbert-paper, st-readme]
  reviewed_at: 2026-10-13
