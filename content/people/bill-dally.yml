headline: Chief scientist and SVP of Research at NVIDIA; co-author of Deep Compression; former Stanford CS chair
bio:
  text: >-
    Bill Dally is chief scientist at NVIDIA and senior vice president of NVIDIA Research, which
    Dally joined in 2009 after 12 years at Stanford University, where Dally chaired the computer
    science department. Before Stanford, Dally's team at MIT built the J-Machine and M-Machine
    experimental parallel computers, and at Caltech Dally designed the MOSSIM Simulation Engine and
    the Torus Routing chip. With Song Han and Huizi Mao, Dally co-authored Deep Compression (2015),
    which shrinks neural networks through pruning, trained quantization and Huffman coding. NVIDIA's
    pages list Dally as a member of the National Academy of Engineering, a Fellow of the American
    Academy of Arts & Sciences, the IEEE and the ACM, and a recipient of the ACM Eckert-Mauchly
    Award, the IEEE Seymour Cray Award and the ACM Maurice Wilkes Award.
  source_ids: [nvidia-blog-author, nvidia-research-profile, deep-compression-paper]
  reviewed_at: 2026-10-21
