sections:
  - heading: Career
    paragraphs:
      - text: >-
          Dally's research career began at the California Institute of Technology, where from 1983 to 1986 Dally
          designed the MOSSIM Simulation Engine and the Torus Routing chip, which introduced wormhole routing and
          virtual-channel flow control. From 1986 to 1997 Dally was at the Massachusetts Institute of Technology,
          where Dally's team built the J-Machine and M-Machine experimental parallel computers.
        source_ids: [nvidia-research-profile]
      - text: >-
          Dally then spent 12 years at Stanford University, including as chair of the computer science
          department, with a team that developed architecture, routing, signaling and synchronization technology
          for large parallel computers. Dally joined NVIDIA in January 2009 as chief scientist and also leads
          NVIDIA Research as senior vice president. NVIDIA's profile notes that Dally co-founded Velio
          Communications and Stream Processors and is an author of four textbooks.
        source_ids: [nvidia-research-profile, nvidia-blog-author]
  - heading: Research
    paragraphs:
      - text: >-
          NVIDIA Research lists Dally's areas as circuits and VLSI design, computer architecture, high
          performance computing, networking, programming systems, and artificial intelligence and machine
          learning. Recent publications on the profile include work on low-energy transceivers for die-to-die
          interfaces.
        source_ids: [nvidia-research-profile]
      - text: >-
          With Song Han and colleagues, Dally co-authored a series of papers on efficient neural networks. "Learning
          both Weights and Connections for Efficient Neural Networks" (2015) pruned unneeded connections, Deep
          Compression (2015) combined pruning, trained quantization and Huffman coding, and EIE (2016) described an
          inference engine that runs directly on compressed networks.
        source_ids: [pruning-paper, deep-compression-paper, eie-paper]
