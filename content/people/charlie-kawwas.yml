headline: President of Broadcom's Semiconductor Solutions Group since July 2022
bio:
  text: >-
    Charlie B. Kawwas, Ph.D., is President of the Semiconductor Solutions Group at Broadcom, the
    company's executive page shows. Broadcom's annual report says Kawwas has held the role since July
    2022, after serving as Chief Operating Officer from December 2020 and as Senior Vice President and
    Chief Sales Officer from June 2015. Kawwas joined Broadcom through its 2014 acquisition of LSI
    Corporation, where Kawwas had led worldwide sales.
  source_ids: [broadcom-kawwas-page, broadcom-10k-fy2025]
