sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kawwas led Product Line Management for the Optical Ethernet and Multi-service Edge portfolio at Nortel
          Networks before joining LSI Corporation, where Kawwas held executive roles from 2007, including Vice
          President of Sales and Marketing for the networking division, and led worldwide sales from 2010 until
          Broadcom acquired LSI in 2014.
        source_ids: [broadcom-10k-fy2025]
      - text: >-
          At Broadcom, Kawwas was Senior Vice President, Worldwide Sales from May 2014, Senior Vice President and
          Chief Sales Officer from June 2015, and Chief Operating Officer from December 2020, before becoming
          President of the Semiconductor Solutions Group in July 2022.
        source_ids: [broadcom-10k-fy2025, broadcom-kawwas-page]
