headline: UC San Diego assistant professor who leads the Hao AI Lab; FastVideo, vLLM and Chatbot Arena co-author
bio:
  text: >-
    Hao Zhang is an Assistant Professor in the Halıcıoğlu Data Science Institute and the
    Department of Computer Science and Engineering at UC San Diego, where Zhang leads the Hao AI
    Lab. Zhang's research sits at the intersection of machine learning and systems, and the lab
    maintains FastVideo, a framework for accelerating video diffusion models. Zhang is a co-author
    of the vLLM (PagedAttention), DistServe and Chatbot Arena papers and co-founded the nonprofit
    LMSYS Org.
  source_ids: [hz-site, hz-bio, haolab-people, fv-readme, vllm-paper]
  reviewed_at: 2026-10-22
