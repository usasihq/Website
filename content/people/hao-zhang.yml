sections:
  - heading: Career
    paragraphs:
      - text: >-
          Zhang completed a PhD in computer science at Carnegie Mellon University with Eric Xing from
          2014 to 2020, taking leave from 2016 to 2021 to work at the machine learning platform company
          Petuum as Director of Scalable Machine Learning. Zhang was then a postdoctoral researcher at UC
          Berkeley with Ion Stoica from 2021 to 2023.
        source_ids: [hz-bio, hz-site]
      - text: >-
          Zhang joined UC San Diego as an assistant professor in 2023 and leads the Hao AI Lab there. From
          2023 to 2026 Zhang also worked as a software engineer at Snowflake, and Zhang co-founded the
          nonprofit LMSYS Org, which maintains open models, evaluation platforms and systems.
        source_ids: [hz-site, hz-bio, haolab-people]
  - heading: Research
    paragraphs:
      - text: >-
          Zhang's work covers LLM inference and serving systems, efficient model architectures and
          algorithms, open data, models and evaluations, and model-parallel training systems. Projects
          listed on Zhang's site include vLLM, DistServe, Lookahead Decoding, Alpa, Vicuna, FastChat and
          Chatbot Arena.
        source_ids: [hz-site, vllm-paper, distserve-paper, arena-paper]
      - text: >-
          For video generation, Zhang's group published Sliding Tile Attention (2025) and Video Sparse
          Attention (2025), and maintains FastVideo, a framework for post-training and accelerated
          inference of video diffusion models whose V1 release was announced in April 2025.
        source_ids: [sta-paper, vsa-paper, fv-readme, fv-v1-blog]
