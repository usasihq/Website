sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before CoreWeave, Intrator co-founded Hudson Ridge Asset Management and held several roles
          at Natsource Asset Management. Intrator then co-founded CoreWeave and has led it since
          2017, building the company on the view that AI would require more than access to
          computing capacity and around a platform designed specifically for AI.
        source_ids: [cw-intrator]
      - text: >-
          CoreWeave's leadership page lists Intrator as Chief Executive Officer and co-founder, with
          fellow co-founders Brian Venturo, Brannin McBee and Peter Salanki in strategy,
          development and technology roles.
        source_ids: [cw-team]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Under Intrator, CoreWeave has grown into a publicly traded company whose cloud runs AI
          model training and production workloads. In September 2026 it announced CoreWeave Forge,
          a development layer for teams building and improving models and agents.
        source_ids: [cw-intrator, cw-forge]
