headline: Co-founder, Chairman and CEO of CoreWeave, a cloud built for AI training and inference
bio:
  text: >-
    Michael (Mike) Intrator is a co-founder and the Chairman and Chief Executive Officer of
    CoreWeave, a cloud provider purpose-built for training and serving AI models. Intrator has led
    CoreWeave since 2017, from startup to publicly traded company.
  source_ids: [cw-intrator, cw-team]
