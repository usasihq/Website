sections:
  - heading: Career
    paragraphs:
      - text: >-
          Cartesia's company page lists Desai as a co-founder, alongside CEO Karan Goel, Chief Scientist
          Albert Gu and Brandon Yang, and says the founding team met as PhD students at the Stanford AI Lab.
        source_ids: [cartesia-company]
  - heading: Research
    paragraphs:
      - text: >-
          Desai co-authored "Llamba: Scaling Distilled Recurrent Models for Efficient Language Processing"
          (2025) with Aviv Bick, Tobias Katsch, Nimit Sohoni and Albert Gu. The paper distils Llama 3.x
          models into the Mamba architecture using the MOHAWK method and provides an implementation for
          resource-constrained devices; Cartesia's research page lists it among the company's papers.
        source_ids: [llamba-paper, cartesia-research]
