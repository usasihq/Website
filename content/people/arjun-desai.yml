headline: Co-founder of Cartesia; co-author of Llamba, distilled recurrent language models
bio:
  text: >-
    Arjun Desai is a co-founder of Cartesia, a company whose founding team met as PhD students at the
    Stanford AI Lab while working on state space models. Desai is a co-author of Llamba, a family of
    recurrent language models distilled from Llama 3.x into the Mamba architecture.
