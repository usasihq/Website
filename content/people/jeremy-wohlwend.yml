headline: Co-founder of Boltz and first author of Boltz-1, an open model for biomolecular interaction prediction
bio:
  text: >-
    Jeremy Wohlwend is a co-founder of Boltz, a public benefit corporation that develops open models
    and agents for AI-driven drug discovery. Wohlwend is first author of the Boltz-1 technical
    report and co-author of Boltz-2, and the open-source Boltz repository is hosted under
    Wohlwend's GitHub account.
  source_ids: [boltz-manifesto, boltz-readme, boltz1-report]
  reviewed_at: 2026-10-21
