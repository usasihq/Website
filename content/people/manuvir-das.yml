headline: Stonepeak operating partner; as NVIDIA's Head of Enterprise Computing, launched NVIDIA AI Enterprise
bio:
  text: >-
    Manuvir Das is an Operating Partner in the Digital Infrastructure group at Stonepeak Partners,
    a role Das took in April 2025, and joined Western Digital's board of directors in May 2026. Das
    most recently served as Head of Enterprise Computing at NVIDIA, which Das joined in 2019,
    where Das led the company's enterprise AI strategy and launched the NVIDIA AI Enterprise software
    suite. Before NVIDIA, Das led Dell EMC's unstructured data storage business, including the
    Isilon scale-out NAS and ECS Object platforms, and spent 14 years at Microsoft as an original
    engineering leader behind Microsoft Azure. Das was also an affiliate professor at the
    University of Washington.
  source_ids: [wd-release, nvidia-blog-author]
  reviewed_at: 2026-10-21
