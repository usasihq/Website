sections:
  - heading: Career
    paragraphs:
      - text: >-
          Das spent 14 years at Microsoft, where Das was one of the original engineering leaders behind the
          Azure cloud computing platform, and was also an affiliate professor at the University of
          Washington. Das then led Dell EMC's unstructured data storage business, which included the
          scale-out Isilon NAS and ECS Object platforms.
        source_ids: [wd-release, nvidia-blog-author]
      - text: >-
          Das joined NVIDIA in 2019 and, as head of enterprise computing, led teams that brought full-stack
          accelerated computing to enterprise customers. Das led NVIDIA's enterprise AI strategy and launched
          the NVIDIA AI Enterprise software suite.
        source_ids: [nvidia-blog-author, wd-release]
      - text: >-
          In April 2025 Das became an Operating Partner in the Digital Infrastructure group at Stonepeak
          Partners, and on May 26, 2026 Das joined Western Digital's board of directors.
        source_ids: [wd-release]
  - heading: Enterprise AI at NVIDIA
    paragraphs:
      - text: >-
          In a January 2023 NVIDIA blog post, Das described a joint NVIDIA and Dell Technologies launch of
          Dell PowerEdge systems with NVIDIA acceleration, which could draw on NVIDIA GPUs, DPUs and the
          NVIDIA AI Enterprise software suite for applications such as speech recognition, cybersecurity and
          recommendation systems.
        source_ids: [nvidia-dell-post]
