sections:
  - heading: Mathematics research
    paragraphs:
      - text: >-
          Ronen Eldan's work also spans pure mathematics, and the mathematics department of the
          Weizmann Institute of Science lists Eldan's prizes among its faculty honors. The
          Breakthrough Prize Foundation credits Eldan with creating the stochastic localization method,
          which led to progress on open problems in high-dimensional geometry and probability, including
          Bourgain's slicing problem and the KLS conjecture.
        source_ids: [wis-math-honors, eldan-bp]
  - heading: Small language models
    paragraphs:
      - text: >-
          With Yuanzhi Li, Eldan wrote TinyStories, submitted in May 2023, which asks how small a
          language model can be while still producing coherent English. The paper's synthetic dataset of
          short stories and its family of small models are published on Eldan's Hugging Face account.
        source_ids: [tinystories-paper, hf-tinystories-dataset, hf-tinystories-33m, hf-profile]
      - text: >-
          Eldan co-authored Microsoft's phi-1 report in June 2023 and the phi-1.5 report in September
          2023, and is listed among the contributors in Microsoft Research's December 2023 post on Phi-2.
          Eldan's name also appears on the Phi-3 report from April 2024 and the Phi-4 report from
          December 2024.
        source_ids: [phi1-paper, phi15-paper, phi15-card, phi2-blog, phi3-paper, phi4-paper]
      - text: >-
          In October 2023, Eldan and Mark Russinovich posted "Who's Harry Potter?", which describes a
          way to make a language model forget a subset of its training data without retraining it from
          scratch.
        source_ids: [harry-potter-paper]
  - heading: AI for science
    paragraphs:
      - text: >-
          Eldan is one of the authors of "Early science acceleration experiments with GPT-5," submitted
          in November 2025. The paper collects short case studies in mathematics, physics, astronomy,
          computer science, biology, and materials science in which the authors used GPT-5 in their
          ongoing research.
        source_ids: [gpt5-science-paper]
