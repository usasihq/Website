headline: First author of TinyStories and co-author of Microsoft's Phi small language model reports
bio:
  text: >-
    Ronen Eldan is first author, with Yuanzhi Li, of the 2023 TinyStories paper, written at Microsoft
    Research, which introduced a synthetic dataset of simple short stories and showed that language
    models with fewer than 10 million parameters can learn to write fluent, consistent text. Eldan's
    Hugging Face account publishes the TinyStories dataset under the CDLA-Sharing-1.0 license, along
    with the small models trained for the paper. Eldan is also a co-author of the phi-1, phi-1.5, Phi-3,
    and Phi-4 technical reports and a listed contributor to Phi-2. With Mark Russinovich, Eldan wrote
    "Who's Harry Potter?", a 2023 paper on approximate unlearning in language models, and Eldan is a
    co-author, listed with an OpenAI affiliation, of the 2025 paper "Early science acceleration
    experiments with GPT-5."
  source_ids: [tinystories-paper, hf-tinystories-dataset, hf-profile, phi1-paper, phi15-paper, phi3-paper, phi4-paper, phi2-blog, harry-potter-paper, gpt5-science-paper]
