headline: Full-time software educator behind Epic Web, Epic React, Epic AI and Testing JavaScript courses
bio:
  text: >-
    Kent C. Dodds is a full-time educator who teaches people to build quality software through
    courses, blog posts, talks, workshops and podcasts. Kent's courses include Epic Product
    Engineer, Epic AI on building AI-powered applications with the Model Context Protocol, Epic
    Web on full-stack web apps, Epic React and Testing JavaScript. Kent's talks cover topics
    including JavaScript, React, testing and careers, with recent ones on AI agents and MCP, and Kent earlier represented PayPal on TC-39,
    the committee that standardizes JavaScript.
