sections:
  - heading: Career
    paragraphs:
      - text: >-
          Dodds's About page says Dodds set out early on to master JavaScript, writing it for employers and for
          open-source projects, and eventually represented PayPal on TC-39, the committee that standardizes the
          language. Dodds started speaking at meetups, went on to give more than a hundred talks on JavaScript,
          React, testing and careers, and moved into teaching after a talk was turned into a course on egghead.
        source_ids: [about]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Dodds now works as a full-time educator. The current course line-up starts with Epic Product
          Engineer, on deciding what should be built before implementation, and continues with Epic AI, on
          building AI applications with the Model Context Protocol, Epic Web for full-stack web applications,
          Epic React and Testing JavaScript. Earlier courses cover the Remix web framework and an introduction to
          React for beginners.
        source_ids: [courses]
      - text: >-
          Dodds's recent talks focus on AI agents and MCP, including "Please Make Jarvis (so I don't have to)"
          in May 2025, "Interactive MCP with React Router" in October 2025, "How I Build Web Applications in
          2026" in February 2026 and "Build a Free Agent" in April 2026.
        source_ids: [talks]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Dodds is listed first among the contributors to React Testing Library, credited for code,
          documentation and infrastructure, and the Testing Library documentation site carries a copyright
          notice for Dodds and contributors from 2018. Dodds's About page also lists recognition as a Google
          Developer Expert, a Microsoft MVP and a GitHub Star for open-source and community work.
        source_ids: [rtl-repo, rtl-docs, about]
