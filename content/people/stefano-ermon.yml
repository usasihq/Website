sections:
  - heading: Research
    paragraphs:
      - text: >-
          Ermon describes developing principled machine learning methods motivated by concrete
          real-world applications. With Yang Song, Ermon co-authored early work on score-based
          generative models, later extended into a framework based on stochastic differential
          equations.
        source_ids: [ermon-site, ncsn-paper, sde-paper]
      - text: >-
          Ermon is also a co-author of Direct Preference Optimization, which fine-tunes language
          models on preference data without a separately trained reward model. Later work applied
          diffusion to discrete data such as text, and Inception's about page lists papers on masked
          diffusion and block diffusion among the technologies its team has developed.
        source_ids: [dpo-paper, sedd-paper, inc-about]
  - heading: Inception
    paragraphs:
      - text: >-
          As CEO, Ermon writes that Inception was started to build fast, efficient AI models and that
          it launched Mercury, its first diffusion-based LLM, in February 2025. Mercury models
          generate blocks of text in parallel and refine them over a small number of denoising
          steps rather than producing one token at a time.
        source_ids: [inc-refresh, inc-about]
  - heading: Teaching
    paragraphs:
      - text: >-
          At Stanford, Ermon has taught Probabilistic Graphical Models (CS 228), Deep Generative
          Models (CS 236) and Data for Sustainable Development (CS 325B).
        source_ids: [ermon-site]
