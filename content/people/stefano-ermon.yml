headline: CEO of Inception, developer of Mercury diffusion LLMs; Associate Professor of Computer Science at Stanford
bio:
  text: >-
    Stefano Ermon is the CEO of Inception, an AI research and product company building
    diffusion-based large language models, and an Associate Professor in the Department of
    Computer Science at Stanford University, affiliated with the Artificial Intelligence Lab.
    Ermon's research is in machine learning and generative AI, and Ermon is a senior author of the
    Mercury technical report, which describes Inception's diffusion language models.
  source_ids: [inc-refresh, inc-about, ermon-site, mercury-paper]
  reviewed_at: 2026-10-21
