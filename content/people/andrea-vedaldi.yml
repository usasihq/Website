sections:
  - heading: Career
    paragraphs:
      - text: >-
          Vedaldi earned an MSc and a PhD in computer science at the University of California, Los Angeles,
          where the PhD thesis on invariant representations for computer vision was supervised by a committee
          chaired by Stefano Soatto. Vedaldi joined the University of Oxford as a postdoctoral research
          assistant in 2008, became a junior research fellow in 2010, an associate professor of engineering
          science in 2012, and Professor of Computer Vision and Machine Learning in 2020.
        source_ids: [resume]
      - text: >-
          Alongside the Oxford post, Vedaldi was a research scientist at Facebook AI Research in London from
          2018 to 2023 and at Meta Generative AI from 2023 to 2026, where the Royal Academy of Engineering
          described Vedaldi as a technical lead working on 3D computer vision and generative AI. In September
          2026 Vedaldi started as an Amazon Scholar in Amazon's Frontier AI and Robotics lab, and Vedaldi is a
          General Chair of ECCV 2026.
        source_ids: [resume, raeng-fellow, homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Vedaldi's research covers image and video understanding, unsupervised learning, and unsupervised
          3D geometry, motion, and physics, with a current focus on spatial intelligence. Recent work includes
          the self-supervised vision foundation model DINOv3 and VGGT, a feed-forward network that infers 3D
          scene attributes from one or many views.
        source_ids: [resume, homepage, dinov3-paper, vggt-paper]
      - text: >-
          Its successor, VGGT-Ω, scales reconstruction quality with data and model size while improving
          efficiency and handling of dynamic scenes, and was selected as a CVPR 2026 best paper finalist.
        source_ids: [homepage]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Vedaldi is the lead author of VLFeat, a library of classical computer vision tools such as SIFT, MSER and Harris
          affine feature extraction, which won the ACM Multimedia Open Source Software Competition in 2010
          with Brian Fulkerson and received the ACM SIGMM test of time award in 2020. Vedaldi is also the lead author of
          MatConvNet, a library for learning convolutional neural networks in MATLAB.
        source_ids: [code-page, resume]
