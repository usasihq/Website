headline: Oxford professor who co-leads the Visual Geometry Group; Amazon Scholar; co-author of DINOv3 and VGGT
bio:
  text: >-
    Andrea Vedaldi is Professor of Computer Vision and Machine Learning and a co-lead of the Visual
    Geometry Group (VGG) in the Engineering Science department at the University of Oxford,
    researching computer vision and machine learning methods with a focus on spatial intelligence.
    In September 2026 Vedaldi started as an Amazon Scholar in Amazon's Frontier AI & Robotics (FAR)
    lab. Vedaldi is a co-author of Meta's DINOv3 vision foundation model and of VGGT, a feed-forward
    3D reconstruction network whose code and models are public. The Royal Academy of Engineering
    elected Vedaldi a Fellow in 2025; its fellowship page also listed Vedaldi as a research
    scientist and technical lead at Meta at that time.
