sections:
  - heading: Career
    paragraphs:
      - text: >-
          Tong He earned a master's degree in computing science at Simon Fraser University in 2016 under the
          supervision of Martin Ester. After working as an embedded software developer at
          Fortinet from 2016 to 2017, Tong He joined Amazon Web Services in February 2018 as a
          Senior Applied Scientist working on computer vision and machine learning.
        source_ids: [homepage]
      - text: >-
          In September 2025 Tong He's homepage noted a move to a quantitative fund.
        source_ids: [homepage]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Tong He is listed as an author of the xgboost R package alongside Tianqi Chen and others, and also created or maintained the SwarmSVM,
          rLTP and pullword packages on CRAN. Tong He is a committer on XGBoost, Apache MXNet, GluonCV and the Deep
          Graph Library, and co-authored the 2019 paper describing the GluonCV and GluonNLP toolkits.
        source_ids: [homepage, xgboost-r-description, gluon-paper, github-profile]
  - heading: Research
    paragraphs:
      - text: >-
          With Tianqi Chen, Tong He wrote "Higgs boson discovery with boosted trees" for the 2014 NIPS workshop on
          high-energy physics and machine learning. At AWS, Tong He was first author of Bag of Tricks for Image
          Classification with Convolutional Neural Networks (2018), which collected training refinements for image
          classifiers, and later co-authored papers on preference optimization and sparse autoencoders accepted at
          ICML 2025.
        source_ids: [th-publications, bag-of-tricks-paper, homepage]
