headline: Co-author of the XGBoost R package; committer on DGL, GluonCV and Apache MXNet; former AWS applied scientist
bio:
  text: >-
    Tong He is a committer on the open-source projects Deep Graph Library (DGL), GluonCV, Apache
    MXNet and XGBoost, and created or maintained several R packages on CRAN, including xgboost;
    the XGBoost R package's DESCRIPTION file lists Tong He as an author alongside Tianqi Chen.
    From 2018, Tong He worked as a Senior Applied Scientist at Amazon Web Services, with research
    interests in computer vision and machine learning. Tong He's homepage notes joining a
    quantitative fund in September 2025.
  source_ids: [homepage, xgboost-r-description, github-profile]
  reviewed_at: 2026-10-13
