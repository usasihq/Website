sections:
  - heading: Career
    paragraphs:
      - text: >-
          Maxime Labonne is a Google Developer Expert in AI and machine learning. At Liquid AI, Labonne leads post-training for the company's
          own pre-trained language models, which use a custom architecture.
        source_ids: [substack-about, gh-profile]
  - heading: Models and research
    paragraphs:
      - text: >-
          Labonne is among the contributors to the LFM2 Technical Report, released in November 2025, which
          describes Liquid AI's LFM2 family of open-weight models built for efficient on-device deployment. Before
          and alongside that work, Labonne released fine-tuned and merged community models such as AlphaMonarch-7B
          and NeuralBeagle14-7B, and a collection of abliterated models with an accompanying article on removing
          refusals.
        source_ids: [lfm2-abs, lfm2-report, gh-profile]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          The LLM Course, published on GitHub, offers roadmaps and Colab notebooks for learning about large language
          models, along with tool notebooks such as LLM AutoEval, LazyMergekit and LazyAxolotl for automating
          evaluation, merging and fine-tuning. Labonne also curates LLM Datasets, a list of datasets for
          fine-tuning.
        source_ids: [llm-course, gh-profile]
      - text: >-
          Based on the course, Labonne co-wrote LLM Engineer's Handbook, a Packt book covering an LLM application
          from design to deployment, and is also the author of Hands-On Graph Neural Networks Using Python. Labonne
          writes technical analyses of LLMs and post-training on a Substack blog.
        source_ids: [llm-course, substack-about]
