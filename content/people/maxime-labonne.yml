headline: Head of Post-Training at Liquid AI; author of the LLM Course and its quantization tutorials
bio:
  text: >-
    Maxime Labonne is Head of Post-Training at Liquid AI, where Labonne's work is post-training the
    company's LFM2 and LFM2.5 models. Labonne is listed among the contributors to the LFM2 technical
    report, whose models ship with open weights and deployment packages for tools such as
    llama.cpp and ExecuTorch. Labonne also publishes the LLM Course on GitHub, which includes
    tutorials on quantizing models with GGUF and llama.cpp, GPTQ, and ExLlamaV2, and an AutoQuant
    notebook for producing quantized versions of a model.
  source_ids: [gh-profile, lfm2-report, llm-course]
  reviewed_at: 2026-10-21
