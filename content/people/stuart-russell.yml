sections:
  - heading: Career
    paragraphs:
      - text: >-
          Stuart Russell joined UC Berkeley's Computer Science Division in 1986 as an assistant professor, became associate professor in 1991 and professor in 1996, and has held the
          Michael H. Smith and Lotfi A. Zadeh Chair in Engineering since 2001.
        source_ids: [russell-cv]
      - text: >-
          Russell chaired Berkeley's Computer Science Division from 2006 to 2010 and again in 2024, and chaired the
          Department of Electrical Engineering and Computer Sciences from 2008 to 2010. In 2024 Russell also became a
          professor of Computational Precision Health at UC San Francisco. Russell's CV, last updated in September
          2026, lists the Berkeley and UCSF distinguished professorships as emeritus.
        source_ids: [russell-cv]
  - heading: Research centers
    paragraphs:
      - text: >-
          Russell is affiliated with Berkeley's Center for Human-Compatible AI, the Kavli Center for Ethics,
          Science, and the Public, which Russell directs, Berkeley Artificial Intelligence Research, and the
          Institute for Cognitive and Brain Sciences. Russell's CV dates the directorship of the Kavli Center
          to 2021.
        source_ids: [russell-site, chai-people, russell-cv]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          With Peter Norvig, Russell wrote the textbook Artificial Intelligence: A Modern Approach, now in its fourth
          edition, which won the Amity Booker Prize in 2017. Russell's book Human Compatible: Artificial
          Intelligence and the Problem of Control has a Penguin Books edition published in November 2020.
        source_ids: [aima-site, russell-cv, human-compatible-prh]
