headline: UC Berkeley Distinguished Professor Emeritus of Computer Science; co-author of AI, A Modern Approach
bio:
  text: >-
    Stuart Russell is Distinguished Professor of Computer Science, Cognitive Science, and
    Computational Precision Health, Emeritus, at the University of California, Berkeley, and holds
    the Michael H. Smith and Lotfi A. Zadeh Chair in Engineering, according to Russell's CV. Russell is affiliated with
    Berkeley's Center for Human-Compatible AI (CHAI) and Berkeley Artificial Intelligence Research
    (BAIR), and CHAI lists Russell as director of the Kavli Center for Ethics, Science, and the
    Public. Russell co-wrote the textbook Artificial Intelligence: A Modern Approach with Peter
    Norvig, whose site presents the fourth edition, and wrote Human Compatible, a book on AI and the problem of
    control.
  source_ids: [russell-cv, russell-site, chai-people, aima-site, human-compatible-prh]
  reviewed_at: 2026-10-21
