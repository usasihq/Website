sections:
  - heading: Research
    paragraphs:
      - text: >-
          Yarats's research before Perplexity focused on reinforcement learning from images. As first author,
          with Amy Zhang, Ilya Kostrikov, Brandon Amos and others, Yarats released a 2019 study of improving
          sample efficiency in model-free reinforcement learning from pixels, and in 2021 released Proto-RL, a
          method for learning prototypical representations, with Rob Fergus, Alessandro Lazaric and Lerrel
          Pinto.
        source_ids: [dy-sacae, dy-proto]
      - text: >-
          With Kostrikov and Fergus, Yarats co-wrote DrQ in 2020, showing that simple image augmentation can
          regularize deep reinforcement learning from pixels. Its 2021 successor DrQ-v2, first-authored by
          Yarats, improved data-augmented learning for visual continuous control, and its original PyTorch
          implementation is published in the facebookresearch GitHub organization.
        source_ids: [drq-paper, drqv2-paper, drqv2-repo]
  - heading: Perplexity
    paragraphs:
      - text: >-
          Yarats co-founded Perplexity in 2022 with Aravind Srinivas, Johnny Ho and Andy Konwinski, after work
          as an AI research scientist at Meta. A 2024 AWS Startups article co-written by Yarats says the team
          first experimented with translating natural language into SQL before combining a traditional search
          index with large language models to build an answer engine with cited sources.
        source_ids: [aws-perplexity-article]
      - text: >-
          The HumanX speaker page lists Yarats as co-founder and Chief Technology Officer and credits Perplexity
          under Yarats's leadership with its answer engine, the Comet browser and the Perplexity Computer
          orchestration system. With Perplexity colleagues, Yarats co-wrote DRACO, a 2026 benchmark for the
          accuracy, completeness and objectivity of deep research systems.
        source_ids: [humanx-yarats, draco-paper]
