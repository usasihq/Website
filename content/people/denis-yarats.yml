headline: Co-founder and CTO of Perplexity; first author of DrQ-v2 for reinforcement learning from pixels
bio:
  text: >-
    Denis Yarats is a co-founder and the CTO of Perplexity, according to a November 2024 AWS Startups
    article that Yarats co-wrote and the speaker page for the April 2026 HumanX conference. The AWS
    article says Yarats worked as an AI research scientist at Facebook AI Research before co-founding
    Perplexity. Papers from that period that list Yarats at New York University and Facebook AI
    Research include DrQ and DrQ-v2, off-policy methods that use data augmentation to learn continuous
    control directly from pixels, and DrQ-v2's original PyTorch implementation is published under the
    MIT license in the facebookresearch GitHub organization. With Perplexity colleagues, Yarats is a
    co-author of DRACO (2026), a benchmark of deep research tasks graded for accuracy, completeness and
    objectivity.
  source_ids: [aws-perplexity-article, humanx-yarats, drq-paper, drqv2-paper, drqv2-repo, draco-paper]
  reviewed_at: 2026-10-21
