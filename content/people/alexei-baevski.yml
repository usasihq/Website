    source_ids: [adaptive-input-paper]
  - date: "2019-04"
    text: Co-authored the fairseq toolkit paper and the original wav2vec speech pre-training paper.
    source_ids: [fairseq-paper, wav2vec-paper]
  - date: "2019-10"
    text: Posted vq-wav2vec, on self-supervised learning of discrete speech representations, as first author.
    source_ids: [vq-wav2vec-paper]
  - date: "2020-06"
    text: Posted wav2vec 2.0 as first author and co-authored the XLSR cross-lingual speech paper.
    source_ids: [wav2vec2-paper, xlsr-paper]
  - date: "2021-05"
    text: Posted "Unsupervised Speech Recognition", describing wav2vec-U, as first author.
    source_ids: [wav2vec-u-paper]
  - date: "2022-02"
    text: Posted data2vec, a shared self-supervised framework for speech, vision and language, as first author.
    source_ids: [data2vec-paper]
  - date: "2022-12"
    text: Posted data2vec 2.0, a more efficient version of the data2vec objective, as first author.
    source_ids: [data2vec2-paper]
  - date: "2023-05"
    text: Co-authored "Scaling Speech Technology to 1,000+ Languages", the Massively Multilingual Speech paper.
    source_ids: [mms-paper]
