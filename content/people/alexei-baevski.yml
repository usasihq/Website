headline: First author of wav2vec 2.0 and data2vec at Facebook AI; fairseq co-author
bio:
  text: >-
    Alexei Baevski is first author of wav2vec 2.0, a framework for self-supervised learning of
    speech representations whose paper lists the authors at Facebook AI, and of data2vec, which
    applies one self-supervised learning method to speech, vision, and language. Baevski is also a
    co-author of fairseq, Facebook AI Research's MIT-licensed sequence modeling toolkit, whose
    repository lists wav2vec 2.0 among its examples, and of the Massively Multilingual Speech paper
    on scaling speech technology to more than 1,000 languages. Baevski's GitHub profile lists Google
    as the current company.
  source_ids: [wav2vec2-paper, wav2vec2-pdf, data2vec-paper, data2vec-pdf, fairseq-paper, fairseq-repo, mms-paper, github-profile]
