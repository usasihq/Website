sections:
  - heading: Language modeling
    paragraphs:
      - text: >-
          Baevski's early papers with Michael Auli were on neural language modeling. "Adaptive Input
          Representations for Neural Language Modeling" (2018) extended the adaptive softmax to input
          representations of variable capacity, and Baevski was a co-author of the fairseq toolkit paper in
          2019, which describes an open-source PyTorch library for translation, summarization and language
          modeling.
        source_ids: [adaptive-input-paper, fairseq-paper]
  - heading: Speech representation learning
    paragraphs:
      - text: >-
          From 2019 Baevski's work turned to self-supervised learning from raw audio. Baevski co-authored the
          original wav2vec paper and was first author of vq-wav2vec, which learns discrete speech units, and
          of wav2vec 2.0, which masks speech in a latent space and solves a contrastive task over quantized
          representations. Follow-up work included XLSR, a cross-lingual version of wav2vec 2.0 pre-trained on
          many languages, and wav2vec-U (2021), a method for training speech recognition without labeled data.
        source_ids: [wav2vec-paper, vq-wav2vec-paper, wav2vec2-paper, xlsr-paper, wav2vec-u-paper]
  - heading: Self-supervised learning across modalities
    paragraphs:
      - text: >-
          The data2vec paper (2022) applied a single self-supervised objective, predicting latent
          representations of the full input from a masked view, to speech, images and text. Its successor,
          data2vec 2.0, made that training more efficient by not encoding masked tokens and by using a fast
          convolutional decoder. Baevski was also a co-author of the Massively Multilingual Speech paper on
          extending speech technology to more than 1,000 languages.
        source_ids: [data2vec-paper, data2vec2-paper, mms-paper]
timeline:
