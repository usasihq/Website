sections:
  - heading: Career
    paragraphs:
      - text: >-
          Toner worked as a Senior Research Analyst at Open Philanthropy, advising policymakers and grantmakers on
          AI policy and strategy. Toner was then a Research Affiliate of Oxford University's Center for the
          Governance of AI, studying the Chinese AI ecosystem, before helping to found CSET at Georgetown
          University in 2019.
        source_ids: [cset-bio, rising-tide-about]
      - text: >-
          At CSET Toner served as Director of Strategy and Foundational Research Grants and later as Interim
          Executive Director, the title CSET used when Toner testified before the U.S. Senate Committee on the
          Judiciary in April 2026. CSET's staff page now lists Toner as Executive Director.
        source_ids: [cset-bio, senate-testimony-2026]
  - heading: Writing and policy work
    paragraphs:
      - text: >-
          Toner has testified before several Congressional committees. In June 2019 Toner,
          Jeff Ding and Elsa Kania testified before the U.S.-China Economic and Security Review Commission at a
          hearing on technology, trade and military-civil fusion. Toner has also written for outlets including
          Foreign Affairs, the Economist and TIME on AI policy.
        source_ids: [cset-bio, uscc-testimony-2019]
      - text: >-
          For CSET, Toner has co-written explainers on how large language models work, including a March 2024
          series on pre-training and on the fine-tuning techniques developers use to steer model outputs, and a
          July 2024 explainer on evaluating language models. Toner was first-listed author of CSET's October 2024
          workshop report on preparing for AI agents, and writes Rising Tide, a newsletter about the transition
          to a world with highly advanced AI systems.
        source_ids: [llm-explainer-1, llm-explainer-2, llm-evals-explainer, cset-agents-report, rising-tide-about]
