headline: Executive Director of Georgetown's CSET and author of the Rising Tide newsletter on advanced AI
bio:
  text: >-
    Helen Toner is the Executive Director of the Center for Security and Emerging Technology (CSET), a
    policy research organization at Georgetown University that Helen Toner helped found in 2019.
    Helen Toner previously served as CSET's Director of Strategy and Foundational Research Grants and,
    before CSET, as a Senior Research Analyst at Open Philanthropy. Helen Toner writes Rising Tide, a
    newsletter about navigating the transition to a world with extremely advanced AI systems, and is the
    first-listed author of CSET's 2024 workshop report on preparing for AI agents.
  source_ids: [cset-bio, rising-tide-about, cset-agents-report]
  reviewed_at: 2026-10-21
