headline: Co-founder of Nous Research and first-listed author of the Hermes 3 and Hermes 4 technical reports
bio:
  text: >-
    Teknium is a co-founder of Nous Research and has contributed to its Hermes series of
    fine-tuned language models. Teknium is the first-listed author of the Hermes 3 and Hermes 4 technical
    reports, which Nous Research published alongside publicly released model weights. Teknium's
    GitHub profile names Hermes Agent as the current focus and describes it as a terminal-based
    agent that runs locally.
  source_ids: [gh-profile, tk-hermes3, tk-hermes4]
