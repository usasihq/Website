sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Teknium's GitHub profile describes work in AI and data engineering: building open-source AI agents and
          releasing open language models, datasets, synthetic data pipelines and reinforcement learning
          environments. At Nous Research, the profile lists contributions to the Hermes model series, from
          Nous-Hermes-Llama2-13b and the Hermes 2 models on Mixtral-8x7B and Yi-34B to the Hermes 3 and Hermes 4
          series, along with Atropos, a framework for reinforcement learning environments with LLMs.
        source_ids: [gh-profile]
      - text: >-
          Teknium is first-listed author of the Hermes 3 technical report, released in August 2024, and the
          Hermes 4 technical report, released in August 2025, which describes a family of hybrid reasoning models.
          On a personal Hugging Face account, Teknium has also released the OpenHermes models, including OpenHermes
          2.5 Mistral 7B.
        source_ids: [tk-hermes3, tk-hermes4, gh-profile]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Teknium names Hermes Agent as the current focus: a terminal-native, extensible coding and personal agent
          with persistent memory, skills and gateways to messaging platforms, which runs locally and works with
          major LLM providers. The Hermes Agent repository is published by Nous Research under the MIT license.
        source_ids: [gh-profile, tk-agent]
