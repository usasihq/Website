sections:
  - heading: Career
    paragraphs:
      - text: >-
          Schimpf founded and led Cornell University's autonomous vehicle research program, whose
          teams competed in the DARPA Grand Challenge and Urban Challenge, and published technical
          papers on autonomous vehicles based on that work. Schimpf then joined Palantir
          Technologies as an early hire, built the Foundry product and led the engineering and
          product organizations as Director of Engineering.
        source_ids: [anduril-leadership]
  - heading: Anduril
    paragraphs:
      - text: >-
          Anduril's December 2024
          announcement of its OpenAI partnership names Schimpf as co-founder and
          CEO, and quotes Schimpf on using AI to help military operators make faster, more accurate
          decisions. In January 2025, as CEO, Schimpf announced the promotion of Christian Brose and
          Matthew Steckman to president-level roles.
        source_ids: [anduril-openai, anduril-promotions]
