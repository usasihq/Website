headline: Co-founder and CEO of Anduril Industries, a defense technology company
bio:
  text: >-
    Brian Schimpf is a co-founder and the CEO of Anduril Industries, where Schimpf drives the
    strategic direction and product roadmap of the defense technology company. Before Anduril,
    Schimpf was an early hire at Palantir Technologies, and Anduril's announcements quote Schimpf
    as CEO on partnerships such as its December 2024 work with OpenAI on air defense.
  source_ids: [anduril-leadership, anduril-openai]
