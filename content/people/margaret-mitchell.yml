sections:
  - heading: Career
    paragraphs:
      - text: >-
          Margaret Mitchell's main areas of study have been natural language processing, natural language
          generation, assistive technology and AI ethics. After a postdoc at Johns Hopkins focused on Bayesian
          modeling, Mitchell was a researcher at Microsoft Research working on generating language from
          images, and contributed to Seeing AI, Microsoft's app for people who are blind or have low vision,
          which was released in July 2017.
        source_ids: [mitchell-about, mitchell-timeline]
      - text: >-
          Mitchell joined Google as a Senior Research Scientist in November 2016 and in March 2018 began
          leading Google's new Ethical AI team; Mitchell's site gives the Google title as Staff Research Scientist. In 2021 Mitchell joined
          Hugging Face, where Mitchell works as a researcher and Chief Ethics Scientist on ML data processing,
          responsible AI development and AI ethics.
        source_ids: [mitchell-timeline, mitchell-about]
  - heading: Research
    paragraphs:
      - text: >-
          Mitchell's vision-and-language work includes an image captioning system that took first place in
          the 2015 COCO captioning challenge, and the 2016 Visual Storytelling paper, which introduced a
          dataset of photo sequences aligned with both descriptive captions and story text.
        source_ids: [mitchell-timeline, storytelling-paper]
      - text: >-
          Mitchell's work on fairness and documentation includes a 2018 framework for mitigating unwanted
          biases by training a predictor together with an adversary, and "Model Cards for Model Reporting,"
          which proposed short documents describing a trained model's evaluated performance across groups and
          its intended uses.
        source_ids: [adversarial-paper, model-cards-paper]
