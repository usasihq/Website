headline: Researcher and Chief Ethics Scientist at Hugging Face; first author of Model Cards for Model Reporting
bio:
  text: >-
    Margaret Mitchell is a computer scientist who works at Hugging Face as a researcher and Chief
    Ethics Scientist, on ML data processing, responsible AI development, and AI ethics; Mitchell's
    timeline dates the Hugging Face role to 2021. Mitchell previously worked at Google AI as a Staff
    Research Scientist, where Mitchell founded and co-led Google's Ethical AI group, and before
    that was a researcher at Microsoft Research focused on vision-to-language generation, including
    work on the Seeing AI project for blind and low-vision people. Mitchell is first author of
    "Model Cards for Model Reporting" (2018), which proposed short documents that accompany trained
    models with benchmarked evaluation and intended-use information.
  source_ids: [mitchell-about, mitchell-timeline, model-cards-paper]
  reviewed_at: 2026-10-13
