headline: Penn State assistant professor and AG2 founder; first author of the AutoGen multi-agent framework paper
bio:
  text: >-
    Qingyun Wu is the first author of "AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent
    Conversation" (2023), the paper describing Microsoft's open-source AutoGen framework, and Wu's site
    lists Wu's role on the project as creator and maintainer. Wu's site says Wu joined the College of Information Science and Technology at Penn State
    University as an Assistant Professor in fall 2021, after a postdoctoral position at Microsoft Research's New York City lab from 2020 to 2021.
    Penn State's research portal lists Wu as an assistant professor in the College of Information Sciences
    and Technology, and Wu's GitHub profile describes Wu as founder and CEO of AG2, the project formerly
    called AutoGen. Wu is also a co-author of the FLAML automated machine learning library paper with Chi Wang.
  source_ids: [autogen-paper, wu-site, psu-pure, wu-github, flaml-paper]
  reviewed_at: 2026-10-22
