sections:
  - heading: Career
    paragraphs:
      - text: >-
          Wu completed a PhD in computer science at the University of Virginia in 2020, supervised by Hongning
          Wang, and was then a postdoctoral researcher at Microsoft Research's New York City lab, hosted by John
          Langford, from 2020 to 2021. Wu's site says Wu joined Penn State's College of Information Science and
          Technology as an assistant professor in fall 2021, with research on automated machine learning and
          large language models.
        source_ids: [wu-site]
  - heading: AutoGen and FLAML
    paragraphs:
      - text: >-
          Wu is first author, with Chi Wang as senior author, of the AutoGen paper posted in August 2023, which
          describes building applications from customizable agents that converse with each other. AutoGen's
          repository now says the project is archived and in maintenance mode, and points new users to
          Microsoft Agent Framework as its successor.
        source_ids: [autogen-paper, autogen-readme]
      - text: >-
          Wu's GitHub profile describes Wu as founder and CEO of AG2, whose repository presents it as the
          open-source project formerly called AutoGen and names Chi Wang and Wu as its project administrators.
        source_ids: [wu-github, ag2-readme]
      - text: >-
          Wu also co-authored FLAML, a library for fast automated machine learning and hyperparameter tuning,
          with Chi Wang, Markus Weimer and Erkang Zhu; Wu's site gives Wu's role on both FLAML and AutoGen as
          creator and maintainer.
        source_ids: [flaml-paper, wu-site]
