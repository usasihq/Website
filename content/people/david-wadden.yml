sections:
  - heading: Career
    paragraphs:
      - text: >-
          David Wadden was a PhD student at the University of Washington advised by Hanna Hajishirzi, then worked
          as a research scientist on the AllenNLP and Semantic Scholar teams at the Allen Institute for AI.
          Wadden is now a research scientist at Google DeepMind working on post-training for Gemini, with a
          stated interest in reinforcement learning approaches for long-horizon agentic tasks.
        source_ids: [wadden-site]
  - heading: Research
    paragraphs:
      - text: >-
          Wadden's earlier research centred on information extraction and scientific text. DyGIE++ (2019)
          is a multi-task framework for named entity recognition, relation extraction and event extraction
          that scores text spans in context, and Fact or Fiction (2020) introduced the task of scientific claim
          verification together with the SciFact dataset of expert-written claims paired with evidence.
        source_ids: [dygie-paper, scifact-paper]
      - text: >-
          MultiVerS (2021) extended claim verification by predicting labels and rationales from full-document
          context with weak supervision. At Ai2, Wadden then worked on open language models, co-authoring the
          Tülu 2 adaptation paper and contributing to base-model development for OLMo 2 and to evaluations for
          the OLMoE mixture-of-experts model.
        source_ids: [multivers-paper, tulu2-paper, olmo2-pdf, olmoe-pdf]
