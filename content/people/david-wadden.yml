headline: Research scientist at Google DeepMind on Gemini post-training; former Ai2 researcher on OLMo and Tülu
bio:
  text: >-
    David Wadden is a research scientist at Google DeepMind, working on post-training for Gemini.
    Before that, Wadden was a research scientist on the AllenNLP and Semantic Scholar teams at Ai2.
    Wadden co-authored the Tülu 2 paper on adapting open language models, is credited with base-model
    development in the OLMo 2 paper, which lists Wadden with an Ai2 affiliation, and ran DCLM
    evaluations for OLMoE. Wadden's earlier research
    includes SciFact and MultiVerS, work on verifying scientific claims.
  source_ids: [wadden-site, tulu2-paper, olmo2-pdf, olmoe-pdf]
  reviewed_at: 2026-10-13
