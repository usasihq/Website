headline: Machine learning engineer at ServiceNow; technical co-lead on the Apriel-1.5-15B-Thinker model
bio:
  text: >-
    Sathwik Tejaswi Madhusudhan is a machine learning engineer at ServiceNow, according to Madhusudhan's
    GitHub profile. Madhusudhan was technical co-lead for mid-training and post-training on ServiceNow's
    Apriel-1.5-15B-Thinker, a 15-billion-parameter open-weights multimodal reasoning model, and is the first
    named author of the December 2025 release post for Apriel-1.6-15B-Thinker, where Madhusudhan is listed
    under leads and management.
  source_ids: [gh-sathwik, hf-stm4, apriel15-html, apriel16-blog]
  reviewed_at: 2026-10-22
