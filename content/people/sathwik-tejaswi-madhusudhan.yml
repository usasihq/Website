sections:
  - heading: Apriel models
    paragraphs:
      - text: >-
          The Apriel-1.5-15B-Thinker paper (October 2025) lists Madhusudhan as technical co-lead for
          mid-training and post-training. The model starts from Pixtral-12B and applies a progressive
          three-stage training method.
        source_ids: [apriel15-paper, apriel15-html]
      - text: >-
          Madhusudhan is the first named author of the December 2025 post introducing Apriel-1.6-15B-Thinker,
          which builds on Apriel-1.5 with a focus on text and vision reasoning and lower reasoning-token use.
          Madhusudhan also appears among the authors of the April 2026 Super Apriel paper.
        source_ids: [apriel16-blog, superapriel-paper]
      - text: >-
          The Apriel-H1 technical report (November 2025), on hybrid models that replace some attention layers of a
          15B reasoning transformer with Mamba blocks through distillation, lists Madhusudhan as a technical
          co-lead under leads and management.
        source_ids: [aprielh1-paper, aprielh1-html]
      - text: >-
          Madhusudhan's GitHub profile gives the role of machine learning engineer at ServiceNow. That profile is
          linked from the Hugging Face account that Hugging Face lists as an author of the Apriel-1.5-15B-Thinker
          paper and as the first author of the Apriel-1.6-15B-Thinker release post.
        source_ids: [gh-sathwik, hf-stm4, hf-papers-apriel15, apriel16-blog]
