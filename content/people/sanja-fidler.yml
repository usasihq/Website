headline: University of Toronto associate professor, Vector Institute co-founder and NVIDIA VP of AI Research
bio:
  text: >-
    Sanja Fidler is an Associate Professor at the University of Toronto and an affiliated faculty
    member of the Vector Institute, where Fidler was one of the co-founding members. Fidler's
    research is in computer vision and machine learning, especially where vision meets graphics:
    3D vision, 3D reconstruction and synthesis, and interactive methods for image annotation.
    Fidler is also Vice President of AI Research at NVIDIA, leading a research lab, after
    joining NVIDIA in May 2018 as Director of AI. Fidler is a co-author of the 2025 Cosmos World Foundation Model Platform paper, whose
    abstract says the platform is open-source with open-weight models under permissive licenses.
  source_ids: [homepage, cv, cosmos-paper]
  reviewed_at: 2026-10-21
