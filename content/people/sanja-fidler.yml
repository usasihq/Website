sections:
  - heading: Career
    paragraphs:
      - text: >-
          Fidler completed a PhD in computer science at the University of Ljubljana in 2010, then spent 2010 as a
          visiting scientist at UC Berkeley and ICSI with Trevor Darrell and held a postdoctoral fellowship at the
          University of Toronto with Sven Dickinson. From 2012 to 2014 Fidler was a Research Assistant Professor at
          the Toyota Technological Institute at Chicago.
        source_ids: [cv, homepage]
      - text: >-
          Fidler joined the University of Toronto faculty in 2014, became a tenure-track assistant professor in
          2016 and has been an associate professor since July 2020; Fidler was also one of the co-founding members
          of the Vector Institute. At NVIDIA, Fidler was Director of AI from May 2018, Senior Director of AI from
          July 2021 and has been Vice President of AI Research since March 2022, leading a research lab.
        source_ids: [cv, homepage, uoft-directory]
  - heading: Research
    paragraphs:
      - text: >-
          Fidler's research lies where computer vision meets graphics, covering 3D vision, 3D reconstruction and
          synthesis, multimodal representations and human-in-the-loop image annotation. With Lluis Castrejon,
          Kaustav Kundu and Raquel Urtasun, Fidler co-wrote Polygon-RNN for annotating object instances, which
          received a best paper honorable mention at CVPR 2017.
        source_ids: [homepage, cv]
      - text: >-
          At NVIDIA, Fidler co-authored the 2025 paper on the Cosmos World Foundation Model Platform for physical
          AI, which presents pre-trained world foundation models, a video curation pipeline and video tokenizers, with the models released open-weight under permissive licenses.
        source_ids: [cosmos-paper]
