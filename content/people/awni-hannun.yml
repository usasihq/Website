headline: Co-creator of MLX, an array framework for machine learning on Apple silicon
bio:
  text: >-
    Awni Hannun co-created MLX while working as a Research Scientist at Apple. MLX is an array
    framework for machine learning on Apple silicon from Apple machine learning research, and its
    README names Hannun as one of the four people who initially developed the MLX software suite.
    Hannun is now a Member of the Technical Staff at Anthropic.
  source_ids: [personal-site, mlx-repo, github-profile]
  reviewed_at: 2026-10-01
