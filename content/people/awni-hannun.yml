slug: awni-hannun
name: Awni Hannun
initials: AH
headline: Co-creator of MLX, an array framework for machine learning on Apple silicon
bio:
  text: >-
    Awni Hannun co-created MLX while he was a Research Scientist at Apple. MLX is
    an array framework for machine learning on Apple silicon from Apple machine
    learning research, and its repository credits him as one of the four people
    who initially developed the MLX software suite. He is now a Member of the
    Technical Staff at Anthropic.
