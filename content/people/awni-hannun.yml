sections:
  - heading: Career
    paragraphs:
      - text: >-
          Awni Hannun completed a PhD in computer science at Stanford University advised by Andrew Ng, and
          co-led the Deep Speech projects at Baidu's Silicon Valley AI Lab. Hannun also spent time at Zoom and Facebook AI
          Research (FAIR), was a research scientist at Apple, and is now a Member of the Technical Staff at
          Anthropic.
        source_ids: [personal-site, github-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Much of Hannun's published research concerns speech recognition. Hannun is first author of Deep
          Speech (2014), an end-to-end deep learning speech recognizer that does without hand-designed
          components for noise and speaker variation, and wrote a 2017 Distill article explaining the
          connectionist temporal classification (CTC) algorithm used to train such models.
        source_ids: [deepspeech-paper, ctc-distill, publications]
      - text: >-
          Hannun's other work includes a 2017 convolutional network for detecting heart arrhythmias from
          single-lead electrocardiograms and papers on privacy in machine learning,
          including a method that uses Fisher information to measure how much a model leaks about its
          training data.
        source_ids: [ecg-paper, fisher-paper, publications]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Hannun's software page lists MLX, an array framework for Apple silicon, alongside earlier projects:
          GTN, a library for automatic differentiation with weighted finite-state transducers; the Flashlight
          C++ machine learning library; the wav2letter++ speech recognition toolkit; the CrypTen library for
          privacy-preserving machine learning on PyTorch; and a C implementation of the RNN Transducer loss.
        source_ids: [software, mlx-repo]
