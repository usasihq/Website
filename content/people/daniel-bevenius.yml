headline: llama.cpp code owner for model-conversion tooling and member of its CI team; Hugging Face
bio:
  text: >-
    Daniel Bevenius contributes to llama.cpp, the C/C++ runtime for running language models on local
    hardware; Bevenius's GitHub profile lists Hugging Face as company and links to ggml.ai, the
    company behind the ggml library, which Hugging Face acquired in 2026. llama.cpp's CODEOWNERS
    file names Bevenius as owner of the model-conversion example and the XCFramework build script,
    co-owner of the debug example, and a member of the CI and shared-code (llama-common) teams.
    Bevenius's recent commits cover build-time improvements, API and ABI checks in the release
    workflow, parallel server tests, and model-conversion tooling.
