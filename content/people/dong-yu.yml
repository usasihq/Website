sections:
  - heading: Career
    paragraphs:
      - text: >-
          Yu joined Microsoft in 1998 and became a principal researcher at Microsoft Research. In
          2017 Yu joined Tencent America and worked at Tencent AI Lab as a distinguished scientist and vice
          general manager until 2026. Yu is now VP of AI Foundations at Capital One and chief scientific
          advisor of Transsion.
        source_ids: [yu-home]
      - text: >-
          In professional service, Yu was a member of the IEEE Speech and Language Processing Technical
          Committee from 2013 to 2018, its vice-chair in 2020 and its chair in 2021–2022, and was a technical
          co-chair of ICASSP 2021. Yu has been an associate editor and, for 2025–2027, a senior area editor of
          the IEEE/ACM Transactions on Audio, Speech, and Language Processing.
        source_ids: [yu-home]
  - heading: Research
    paragraphs:
      - text: >-
          Yu's research covers deep learning for speech processing and recognition, large language models
          and multimodal agentic systems. With George Dahl, Li Deng and Alex Acero, Yu co-authored the 2012
          paper proposing context-dependent pre-trained deep neural network and hidden Markov model hybrids
          for large vocabulary speech recognition, which received the IEEE Signal Processing Society Best
          Paper Award in 2013.
        source_ids: [yu-home, cd-dnn-pub]
      - text: >-
          Yu wrote two monographs with Li Deng: "Deep Learning - Methods and Applications" (2014) and
          "Automatic Speech Recognition - A Deep Learning Approach" (Springer, 2014). Recent invited talks, such as an Interspeech 2025 survey talk, focus on building conversational
          agents.
        source_ids: [dlma-pub, asr-book, yu-home]
