headline: VP of AI Foundations at Capital One; former Microsoft Research principal researcher; first author on CNTK
bio:
  text: >-
    Dong Yu is VP of AI Foundations at Capital One and the chief scientific advisor of Transsion, and
    worked at Tencent AI Lab as a distinguished scientist and vice general manager until 2026. Before
    joining Tencent in 2017, Yu was a principal researcher at Microsoft Research and had been at
    Microsoft since 1998. Yu's research covers deep learning based speech processing and recognition, large
    language models, and multimodal agentic systems. At Microsoft Research, Yu co-authored the
    context-dependent deep neural network paper for large vocabulary speech recognition and was first
    author of the technical report
    introducing the Computational Network Toolkit (CNTK). Yu is a Fellow of ACM, IEEE, and ISCA.
  source_ids: [yu-home, cd-dnn-pub, cntk-pub]
