sections:
  - heading: Career
    paragraphs:
      - text: >-
          Mark Saroufim's homepage presents three current roles: co-founder of Core Automation,
          PyTorch maintainer, and co-founder of GPU MODE, a community formerly known as CUDA MODE.
          Saroufim is listed with Core Automation on the keynote program for PyTorch Conference
          North America 2026, with a session titled "Linear Algebra for the Age of Research."
        source_ids: [homepage, keynote-na26]
      - text: >-
          Saroufim's homepage lists earlier, pre-PyTorch projects on high-dimensional geometry and
          game AI built with reinforcement learning, and Saroufim co-authored a 2020 paper on parallel training
          of deep networks with local updates. A 2015 arXiv paper by Saroufim studies spatial trees,
          high-dimensional reductions and batch nearest-neighbor search.
        source_ids: [homepage, local-updates-paper, nn-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          The homepage groups Saroufim's PyTorch projects together, including torchao, TorchServe,
          the TorchX Ray scheduler, the launch of PyTorch 2.0, the PyTorch fast series, Project
          Popcorn, and the NeurIPS LLM efficiency and Hacker Cup AI challenges. PyTorch's maintainers
          page lists Saroufim as an emeritus maintainer of quantization (torch/ao) and among the
          TorchServe maintainers.
        source_ids: [homepage, pytorch-maintainers]
      - text: >-
          Saroufim is a co-author of the PyTorch 2 paper (ASPLOS 2024), which describes TorchDynamo and
          TorchInductor, and of the 2025 TorchAO paper, which presents quantization and sparsity tools
          spanning pre-training, fine-tuning and serving. The NeurIPS 2023 LLM efficiency challenge,
          listed on the homepage, asked entrants to fine-tune a foundation model on a single GPU within
          one day.
        source_ids: [pt2-paper, torchao-paper, homepage, llm-efficiency-challenge]
timeline:
