headline: Co-founder of Core Automation and of GPU MODE; PyTorch maintainer whose work includes torchao
bio:
  text: >-
    Mark Saroufim's homepage describes Saroufim as a co-founder of Core Automation, a PyTorch
    maintainer, and a co-founder of GPU MODE (formerly CUDA MODE). The homepage lists torchao,
    PyTorch's native quantization library, among Saroufim's PyTorch work, and PyTorch's maintainers
    page lists Saroufim as an emeritus maintainer of quantization (torch/ao) and among the
    maintainers of TorchServe, now grouped with sunsetted modules. Saroufim co-authored the PyTorch 2
    paper (ASPLOS 2024), listed with Meta, and is on the keynote program for PyTorch Conference
    North America 2026 with "Linear Algebra for the Age of Research."
  source_ids: [homepage, pytorch-maintainers, pt2-paper, keynote-na26]
  reviewed_at: 2026-10-13
