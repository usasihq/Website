headline: Co-founder and Managing Director of the Center for AI Safety; co-founder of the MATS program
bio:
  text: >-
    Oliver Zhang is a co-founder and the Managing Director of the Center for AI Safety (CAIS), a research
    nonprofit that works to reduce societal-scale risks from AI. Zhang previously co-founded the MATS program,
    which mentors early-career researchers in AI safety.
