headline: Senior Advisor at Meta; started Meta's Business AI Group; former CEO of Salesforce AI
bio:
  text: >-
    Clara Shih serves as a Senior Advisor at Meta Platforms, a role HubSpot's April 2026 proxy statement
    dates to November 2025. From October 2024 to November 2025, Shih was Head of the Business AI Group at
    Meta, which Shih started; HubSpot's November 2025 announcement adds that Shih oversaw product and
    engineering for the generative AI backend platform. From 2020 to 2024, Shih held senior leadership
    roles at Salesforce, including CEO of Salesforce AI and CEO of Service Cloud. Earlier, Shih founded and
    led Hearsay Systems, and Shih has served on HubSpot's Board of Directors since November 2025.
  source_ids: [hubspot-proxy-2026, hubspot-board-pr]
  reviewed_at: 2026-10-19
