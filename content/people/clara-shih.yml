sections:
  - heading: Career
    paragraphs:
      - text: >-
          Shih began as a technology entrepreneur, founding and leading Hearsay Systems, which HubSpot's 2025
          announcement notes is now part of Yext. From 2020 to 2024 Shih held senior leadership roles at
          Salesforce, serving as chief executive of Salesforce AI and of Service Cloud, and HubSpot credits Shih
          with leading Salesforce's move into generative AI.
        source_ids: [hubspot-board-pr, hubspot-proxy-2026]
      - text: >-
          From October 2024 to November 2025 Shih was Head of the Business AI Group at Meta, a group Shih
          started, and oversaw product and engineering for the generative AI backend platform behind Meta's business tools. HubSpot's April
          2026 proxy statement describes Shih as a Senior Advisor at Meta since November 2025.
        source_ids: [hubspot-board-pr, hubspot-proxy-2026]
  - heading: Board service
    paragraphs:
      - text: >-
          Shih served on the board of directors of Starbucks Corporation from 2011 to 2023. HubSpot appointed
          Shih to its board of directors effective November 3, 2025, pointing to Shih's background in building
          AI products as HubSpot embeds AI in its platform.
        source_ids: [hubspot-board-pr, hubspot-proxy-2026]
