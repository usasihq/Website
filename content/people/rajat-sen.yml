headline: Google Research scientist and one of the creators of TimesFM, the time-series forecasting foundation model
bio:
  text: >-
    Rajat Sen is a Research Scientist at Google Research and describes being one of the creators of TimesFM, a
    pretrained foundation model for time-series forecasting. Sen co-authored the 2023 paper introducing the
    decoder-only model behind TimesFM, co-wrote the Google Research posts announcing TimesFM in 2024 and TimesFM-3
    in 2026, and also works on making large language model inference faster.
  source_ids: [sen-site, timesfm-paper, timesfm-blog, timesfm3-blog]
  reviewed_at: 2026-10-22
