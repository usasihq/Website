sections:
  - heading: Career
    paragraphs:
      - text: >-
          Sen obtained a PhD from UT Austin in 2019, advised by Sanjay Shakkottai and working closely with Alex
          Dimakis, with research on contextual bandits, extreme classification and black-box optimization. Sen is
          now a Research Scientist at Google Research.
        source_ids: [sen-site]
  - heading: Research
    paragraphs:
      - text: >-
          Sen's current interests are pretrained models for time-series forecasting and other less explored
          modalities, along with faster inference for large language models. Sen co-authored the TiDE paper (2023)
          and the decoder-only foundation model paper behind TimesFM (2023), and co-wrote the February 2024 Google
          Research post that introduced TimesFM.
        source_ids: [sen-site, tide-paper, timesfm-paper, timesfm-blog]
      - text: >-
          Sen's site records the release of TimesFM-2.0 at the end of 2024. In August 2026, Sen and Ayush Jain
          introduced TimesFM-3 on the Google Research blog as a zero-shot model for multivariate forecasting,
          available on GitHub and Hugging Face and integrated into BigQuery.
        source_ids: [sen-site, timesfm3-blog]
