headline: Partner Researcher Manager at Microsoft Research; principal developer of Vowpal Wabbit
bio:
  text: >-
    John Langford is a machine learning researcher at Microsoft Research, credited as Partner
    Researcher Manager on the March 2026 Microsoft Research post about Phi-4-reasoning-vision-15B, of
    whose technical report Langford is a co-author. Langford's Microsoft Research page describes
    Langford as the principal developer of the Vowpal Wabbit learning system and the primary author of
    the machine learning weblog hunch.net, with earlier research projects including Isomap, Captcha,
    learning reductions, cover trees and contextual bandit learning.
  source_ids: [p4rv-blog, aneja-site, msr-langford]
  reviewed_at: 2026-10-22
