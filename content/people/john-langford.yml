sections:
  - heading: Career
    paragraphs:
      - text: >-
          Langford earned a double bachelor's degree in physics and computer science at the California
          Institute of Technology in 1997 and a PhD at Carnegie Mellon University in 2002. Langford's page lists
          later work at Yahoo!, the Toyota Technological Institute and IBM's Watson Research Center, and
          Langford is now at Microsoft Research.
        source_ids: [msr-langford]
  - heading: Research
    paragraphs:
      - text: >-
          Langford's research projects include Isomap, Captcha, learning reductions, cover trees and contextual
          bandit learning, and Langford is the principal developer of Vowpal Wabbit and primary author of the
          hunch.net weblog. Langford is among the six authors of the Phi-4-reasoning-vision-15B technical
          report, a compact multimodal reasoning model released by Microsoft in 2026.
        source_ids: [msr-langford, aneja-site, p4rv-blog]
