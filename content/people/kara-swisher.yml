headline: Journalist and host of On with Kara Swisher, and co-host of the Pivot podcast
bio:
  text: >-
    Kara Swisher is a journalist and podcast host who makes sense of tech, business, and media through
    interviews. Kara is editor-at-large of New York Magazine, host of On with Kara Swisher, and producer
    and co-host of the Pivot podcast, both on the Vox Media Podcast Network. Kara previously hosted the
    Recode Decode and Sway podcasts, co-founded Recode, and co-produced and co-hosted The Wall Street
    Journal's D: All Things Digital conference series with Walt Mossberg.
