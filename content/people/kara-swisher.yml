sections:
  - heading: Career
    paragraphs:
      - text: >-
          Starting in 2003, Swisher co-produced and co-hosted The Wall Street Journal's D: All Things Digital
          conference series with Walt Mossberg, a series later called the Code conference, whose interviewees
          included many technology company leaders. Swisher went on to co-found Recode and hosted the Recode
          Decode and Sway podcasts. Swisher is now editor-at-large of New York Magazine.
        source_ids: [host]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Swisher hosts On with Kara Swisher, published on Mondays and Thursdays on the Vox Media Podcast
          Network, which centers on interviews with figures from business, technology, media and other
          fields. Swisher also produces and co-hosts Pivot with NYU marketing professor Scott Galloway, a
          Tuesday and Friday show from New York Magazine about the week's stories in tech and business.
        source_ids: [show, host, ks-pivot]
