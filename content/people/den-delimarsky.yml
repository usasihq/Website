headline: Lead Maintainer of the Model Context Protocol; author of GitHub's Spec Kit launch post
bio:
  text: >-
    Den Delimarsky is a Lead Maintainer of the Model Context Protocol (MCP) project and a product manager
    and engineer focused on developer tools. As a Principal Product Manager for GitHub Copilot, Delimarsky
    wrote GitHub's September 2025 post introducing Spec Kit, an open-source toolkit for spec-driven
    development with AI coding agents. Delimarsky also builds PowerToys Awake for Windows and is listed
    as a maintainer of the MCP C# SDK. The April 2026 MCP announcement of Delimarsky's move from Core
    Maintainer to Lead Maintainer described Delimarsky as a Member of Technical Staff at Anthropic and,
    before that, a Principal Product Engineer in Microsoft's CoreAI division.
  source_ids: [den-about, mcp-maintainers, speckit-blog, mcp-lead-post]
  reviewed_at: 2026-10-22
