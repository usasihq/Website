sections:
  - heading: Career
    paragraphs:
      - text: >-
          Delimarsky describes steering a career toward developer tools, combining product management with
          hands-on coding, mainly in C# and Python. Delimarsky presented at Microsoft Build in 2023 and 2024
          on authentication brokers and single sign-on with Microsoft Entra ID.
        source_ids: [den-about]
      - text: >-
          In September 2025, writing as a Principal Product Manager for GitHub Copilot, Delimarsky introduced
          Spec Kit on the GitHub Blog. In April 2026 the MCP project announced that Delimarsky was moving
          from Core Maintainer to Lead Maintainer, describing Delimarsky as a Member of Technical Staff at
          Anthropic working across the specification, SDKs and governance, and crediting Delimarsky with
          co-authoring the authorization specification and leading the 2025-11-25 specification release.
          Delimarsky's site describes the Lead Maintainer role, and the project's maintainers file lists
          Delimarsky among its two Lead Maintainers.
        source_ids: [speckit-blog, mcp-lead-post, den-about, mcp-maintainers]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Spec Kit structures AI-assisted development around a living specification: the developer provides a
          high-level description of what to build and why, and the coding agent produces a detailed
          specification that then drives the implementation, checklists and task breakdowns. The toolkit works with
          coding agents including GitHub Copilot, Claude Code and Gemini CLI.
        source_ids: [speckit-blog]
      - text: >-
          Outside MCP and Spec Kit, Delimarsky has built PowerToys Awake, a .NET library for the Stream Deck
          based on its USB protocol, and an open-source list of resources for product managers.
        source_ids: [den-about]
