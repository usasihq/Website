headline: Stanford computer science professor; co-author of FlashAttention, Hyena and RedPajama; Together AI founder
bio:
  text: >-
    Christopher Ré is a professor in the Department of Computer Science at Stanford University, in the
    Stanford AI Lab, the Center for Research on Foundation Models and the Machine Learning Group; Ré's
    lab works on the foundations of the next generation of AI systems. Together AI lists Ré as a
    founder, and Ré's homepage notes co-founding a number of companies with students and
    collaborators. Ré is a co-author of the FlashAttention paper (2022), the Hyena paper on
    convolutional language models (2023), the HELM evaluation paper (2022) and the RedPajama open
    dataset paper (2024), and the lab's recent releases include ThunderKittens for building AI
    kernels. Ré's Stanford biography notes a MacArthur Foundation Fellowship and the NeurIPS 2020
    test-of-time award.
  source_ids: [re-site, re-bio, together-about, fa-paper, hyena-paper, helm-paper, redpajama-paper]
  reviewed_at: 2026-10-13
