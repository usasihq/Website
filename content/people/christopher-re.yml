sections:
  - heading: Career
    paragraphs:
      - text: >-
          Christopher Ré was an assistant professor at the University of Wisconsin–Madison from 2009
          to 2013 before joining the Stanford computer science faculty. At Stanford, Ré is a
          professor in the Stanford AI Lab and is affiliated with the Machine Learning Group and the
          Center for Research on Foundation Models.
        source_ids: [macarthur, re-bio, re-site]
      - text: >-
          Ré's homepage describes the lab's main goal as helping students become professors,
          entrepreneurs, and researchers, and notes that more than a dozen group members have gone on
          to professorships. With students and collaborators, Ré has co-founded several companies,
          and Together AI lists Ré among its founders.
        source_ids: [re-site, together-about]
  - heading: Research
    paragraphs:
      - text: >-
          Ré's research has spanned database theory, database systems, and machine learning. The
          MacArthur Foundation highlighted DeepDive, an inference engine that extracts facts from
          text, images, and other hard-to-process data into a knowledge base. HOGWILD!, a 2011
          lock-free approach to parallel stochastic gradient descent written with Feng Niu, Benjamin
          Recht, and Stephen J. Wright, later received the NeurIPS 2020 test-of-time award.
        source_ids: [re-bio, macarthur, hogwild-paper, re-site]
      - text: >-
          More recent work aims at the foundations of foundation models. The group's papers include
          FlashAttention, a faster and more memory-efficient exact attention algorithm, and Hyena, a
          convolution-based alternative to attention that the group also applied to DNA in HyenaDNA.
          Ré also co-authored the HELM evaluation and the RedPajama open
          dataset.
        source_ids: [fa-paper, hyena-paper, re-site, helm-paper, redpajama-paper]
      - text: >-
          The lab's current systems work includes ThunderKittens for building AI kernels, along with
          ParallelKittens for multiple GPUs and HipKittens for AMD hardware, and an Intelligence per
          Watt project that measures the efficiency of AI models.
        source_ids: [tk-paper, re-site]
