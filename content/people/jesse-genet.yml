headline: Co-founder of Lumi (YC W15) who now makes short videos about running personal AI agents and local models
bio:
  text: >-
    Jesse Genet co-founded Lumi, a Y Combinator Winter 2015 company that provided packaging and
    shipping supplies to online brands and was later sold to Narvar. Jesse's website describes the
    current work as vibe coding. The Jesse Genet YouTube channel publishes short videos about building
    and running personal AI agents with OpenClaw and Nous Research's Hermes Agent, and about running
    open models such as Gemma 4, GLM 5.1, and MiniMax 2.7 locally, including on a Mac Studio. The
    website lists 2026 guest appearances about AI agents on the a16z Podcast, The Cognitive
    Revolution, The Twist with Jason Calacanis, and How I AI.
  source_ids: [yc-lumi, site, youtube]
  reviewed_at: 2026-10-18
