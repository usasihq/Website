headline: Creator of step-by-step tutorials on AI tools, Microsoft 365, Windows, and other software
bio:
  text: >-
    Kevin Stratvert makes how-to videos and articles that teach AI tools, productivity software, and everyday
    apps, from ChatGPT, Claude, Gemini, and Microsoft Copilot to Excel, PowerPoint, and Windows. The tutorials
    appear on Kevin's YouTube channel and website, alongside a weekly newsletter of tech tips and AI workflows
    and lessons from a team of instructors. Before creating content full-time, Kevin was a product manager at
    Microsoft for more than ten years, working on products including Office.com, the Office app, FindTime, and
    Office Now.
  source_ids: [channel, site, about]
  reviewed_at: 2026-10-17
