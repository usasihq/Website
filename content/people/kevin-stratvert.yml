sections:
  - heading: Career
    paragraphs:
      - text: >-
          Stratvert worked as a product manager at Microsoft for more than ten years, leading and launching
          products including Office.com, the Office app, FindTime, and Office Now. Stratvert then became a
          full-time content creator, publishing tutorials on a YouTube channel and the KevinStratvert.com
          website.
        source_ids: [about]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          The channel publishes new step-by-step videos every week on AI assistants such as ChatGPT, Claude,
          Gemini, and Microsoft Copilot, as well as Excel, Windows, Microsoft 365, and automation, with a team of
          instructors joining Stratvert. KevinStratvert.com pairs these videos with written articles, courses,
          and a weekly newsletter.
        source_ids: [channel, site, about]
      - text: >-
          Recent tutorials listed on the website cover tools such as OpenAI Codex, ChatGPT Images,
          Microsoft Copilot, Zapier, QuickBooks Online, and Windows 11 customization.
        source_ids: [site]
