headline: Co-host of the Syntax web development podcast and creator of Level Up Tutorials
bio:
  text: >-
    Scott Tolinski co-hosts Syntax, a podcast about full-stack web development started with Wes Bos
    in 2017 that covers JavaScript, CSS, HTML, frameworks, TypeScript, servers, and databases. Scott
    Tolinski also created Level Up Tutorials in 2012 with Ben Schaaf, and has recorded and published
    web development video tutorials there. Scott Tolinski's own site collects posts and conference
    talks on topics such as CSS, local-first software, and durable AI agents.
  source_ids: [syntax-about, syntax-home, levelup, site]
  reviewed_at: 2026-10-17
