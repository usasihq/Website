sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Scott Tolinski and Wes Bos started Syntax in 2017 as a podcast about web development. Its episodes
          cover full-stack topics including server and client JavaScript, frameworks, HTML, CSS, databases and
          deployment, and the show also publishes video and a newsletter.
        source_ids: [syntax-about, syntax-home]
      - text: >-
          Tolinski created Level Up Tutorials with Ben Schaaf in March 2012 to provide in-depth, accessible
          tutorials on web technologies, and later continued the project alone, recording, editing and
          publishing its videos.
        source_ids: [levelup]
  - heading: Talks and writing
    paragraphs:
      - text: >-
          Tolinski's site collects posts, projects and conference talks. They include "Real World Local First,"
          a May 2025 Svelte Summit talk with a companion write-up; "This Component Could Have Been a Div," the
          materials from a React Summit 2026 talk presented as plain HTML and CSS demos; and an October 2026 post
          on building durable AI agents.
        source_ids: [site]
