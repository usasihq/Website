sections:
  - heading: Research
    paragraphs:
      - text: >-
          Song completed a PhD in computer science at Stanford and stayed on as a postdoc with Stefano Ermon.
          With Chenlin Meng and Ermon, Song wrote the 2020 DDIM paper, which introduced an accelerated sampler
          for diffusion models, and Song co-authored follow-up work on guided image synthesis and editing with
          SDEdit and on solving image restoration problems with Denoising Diffusion Restoration Models.
        source_ids: [song-site, ddim-paper, js-sdedit, js-ddrm]
      - text: >-
          In 2025 Song, Linqi Zhou and Ermon introduced Inductive Moment Matching, a class of generative models
          for one- or few-step sampling trained in a single stage without distillation. In a May 2026 note,
          Song described how autoregressive and diffusion methods can coexist in one generative system and
          discussed how flow maps relate to inference-time scaling.
        source_ids: [js-imm, js-blog]
  - heading: Career
    paragraphs:
      - text: >-
          After Stanford, Song was a research scientist at NVIDIA Research, working on multimodal generation and
          foundation model projects. As Chief Scientist at Luma AI, Song led research through the company's
          shifts from 3D generation with Genie to the Ray family of video generation models and then to Uni-1, a
          multimodal reasoning model for image generation and editing, working across model architectures,
          training infrastructure and data processing.
        source_ids: [song-site]
