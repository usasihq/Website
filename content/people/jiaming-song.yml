headline: Creator of DDIM; former Chief Scientist at Luma AI and former research scientist at NVIDIA Research
bio:
  text: >-
    Jiaming Song builds multimodal AI systems and is the former Chief Scientist of Luma AI, where Song
    led research as the company moved from 3D generation models with Genie to video generation with Ray
    and then to unified multimodal models with Uni-1. Before Luma, Song was a research scientist at
    NVIDIA Research and, earlier, a postdoc with Stefano Ermon at Stanford University. Song created
    DDIM, an accelerated sampler for diffusion models published as "Denoising Diffusion Implicit Models"
    with Chenlin Meng and Stefano Ermon; its MIT-licensed reference code notes that DDIM is also
    available in Hugging Face Diffusers.
  source_ids: [song-site, ddim-paper, ddim-readme, ddim-license]
  reviewed_at: 2026-10-21
