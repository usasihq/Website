sections:
  - heading: Research
    paragraphs:
      - text: >-
          Rajat Monga is a co-author, with Jeffrey Dean, Greg Corrado and colleagues, of "Large Scale
          Distributed Deep Networks" (NIPS 2012), which presents DistBelief, a software framework for
          training deep networks with billions of parameters on computing clusters. The later TensorFlow system paper describes TensorFlow as building on experience with
          DistBelief, Google's first-generation system.
        source_ids: [distbelief-paper, tf-osdi-paper]
      - text: >-
          With Jianmin Chen, Xinghao Pan, Samy Bengio and Rafal Jozefowicz, Monga co-authored "Revisiting
          Distributed Synchronous SGD" (2016), which revisits synchronous optimization for distributed
          training of deep learning models.
        source_ids: [sync-sgd-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Monga is a co-author of the TensorFlow white paper, which describes TensorFlow's interface and
          implementation and its open-source release under the Apache 2.0 license, and of the 2016 paper
          "TensorFlow: A system for large-scale machine learning". Monga also co-authored the 2019 paper
          on TensorFlow Eager, a multi-stage, Python-embedded domain-specific language that extends
          TensorFlow for interactive research and production.
        source_ids: [tf-whitepaper, tf-osdi-paper, tf-eager-paper]
