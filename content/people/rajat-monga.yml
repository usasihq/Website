headline: Co-author of the TensorFlow white paper and the TensorFlow system paper from Google Brain
bio:
  text: >-
    Rajat Monga is a co-author of the TensorFlow white paper, which lists its authors at Google Research
    and describes the interface and implementation built at Google and their open-source release under
    the Apache 2.0 license. Monga is also a co-author of the 2016 paper TensorFlow: A system for
    large-scale machine learning, whose authors are listed at Google Brain and which describes how
    TensorFlow builds on experience with Google's first-generation system, DistBelief.
  source_ids: [tf-whitepaper, tf-osdi-paper]
  reviewed_at: 2026-10-21
