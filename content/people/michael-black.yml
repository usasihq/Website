sections:
  - heading: Career
    paragraphs:
      - text: >-
          Black is a founding director of the Max Planck Institute for Intelligent Systems and an honorary
          professor at the University of Tübingen. Black
          co-founded Body Labs, which built AI for understanding 3D body shape and motion and was acquired by
          Amazon, and joined Amazon as a Distinguished Amazon Scholar in October 2017, when a 2017 Amazon
          announcement named Black director of the institute's Department of Perceiving Systems.
        source_ids: [meshcapade-team, amazon-2017, amazon-science-2020]
      - text: >-
          Black is co-founder and Chief Scientist of Meshcapade, a company whose work on digital humans builds
          on Black's research on virtual humans, and serves as the speaker of the Cyber Valley AI research
          network.
        source_ids: [meshcapade-team]
  - heading: Research
    paragraphs:
      - text: >-
          Black's research spans motion estimation and 3D models of the human body. The 2010 CVPR paper
          "Secrets of optical flow estimation and their principles", with Deqing Sun and Stefan Roth,
          evaluated the main techniques for computing motion in video and led to the Classic+NL algorithm.
        source_ids: [amazon-science-2020]
      - text: >-
          Black is the last author of the 2019 SMPL-X paper, which fits a single expressive model of the body,
          face and hands to an image, and the smplx code repository also cites Black on the SMPL body model and
          the MANO hand model.
        source_ids: [smplx-paper, smplx-readme]
