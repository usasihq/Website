headline: Co-author of the SMPL-X body model; co-founder of Body Labs; named a Distinguished Amazon Scholar in 2017
bio:
  text: >-
    Michael J. Black works in computer vision on 3D models of the human body and its motion. A 2017
    Amazon announcement identified Black as a director at the Max Planck Institute for Intelligent
    Systems (Department of Perceiving Systems) and a co-founder of Body Labs, a company acquired by
    Amazon that built AI for understanding 3D body motion and shape, and said Black would support the
    leadership of a new Amazon research center as a Distinguished Amazon Scholar; a 2020 Amazon
    Science article again described Black as a distinguished Amazon scholar. Black is the last-listed
    author of the SMPL-X paper on expressive 3D models of the body, face, and hands (2019), and the
    smplx code repository's citation list also includes Black on the SMPL and MANO models.
  source_ids: [amazon-2017, amazon-science-2020, smplx-paper, smplx-readme]
  reviewed_at: 2026-10-21
