headline: NLP researcher; first author of IBM's open-source PrimeQA toolkit and co-author of Granite Embedding
bio:
  text: >-
    Avi Sil (Avirup Sil on arXiv) is a natural language processing researcher whom IBM Research described
    in 2022 as an IBM researcher who led development of the Dr. Decr and GAAMA question-answering models
    behind PrimeQA. Sil is the first author of the PrimeQA paper, which introduces an open-source
    repository for multilingual question answering covering retrieval, reading comprehension, and
    question generation, released under the Apache-2.0 license. Sil is also a co-author of the 2025
    Granite Embedding Models report, whose English and multilingual retrieval models IBM released under
    the Apache 2.0 license.
