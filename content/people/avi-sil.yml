sections:
  - heading: Research
    paragraphs:
      - text: >-
          Sil's papers in the ACL Anthology begin in 2011 and through the 2010s focus on information
          extraction, including entity linking ("Linking Named Entities to Any Database", EMNLP 2012),
          language-independent named entity linking (ACL 2016), and cross-lingual relation and event
          extraction (EMNLP 2019).
        source_ids: [acl-anthology]
      - text: >-
          From 2020 the work shifts toward question answering and retrieval, with papers on span selection
          pre-training, the TechQA dataset, a reading comprehension system covering more than 100 languages,
          and cross-lingual information retrieval learned from an English retriever. Later work includes
          CLAPnq, a long-form question answering benchmark for retrieval-augmented generation (TACL 2025),
          and agent research such as SMART, on reducing unnecessary tool use (ACL Findings 2025).
        source_ids: [acl-anthology]
  - heading: Open-source work
    paragraphs:
      - text: >-
          A July 2022 IBM Research blog post describes Sil leading development of the multilingual
          question-answering models Dr. Decr and GAAMA and presenting Dr. Decr at NAACL. Sil is first
          author of the PrimeQA paper (ACL 2023 demos), which describes an Apache-2.0 repository that
          gathers retrieval, reading comprehension and question generation methods so researchers can
          reproduce and extend each other's work.
        source_ids: [ibm-primeqa-blog, primeqa-paper, primeqa-repo, ibm-primeqa-pub, acl-anthology]
