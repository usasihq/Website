sections:
  - heading: Career
    paragraphs:
      - text: >-
          Shinji Watanabe was a research scientist at NTT Communication Science Laboratories from 2001 to 2011, with a visiting
          scholarship at the Georgia Institute of Technology in 2009. Watanabe was then a senior principal
          research scientist at Mitsubishi Electric Research Laboratories from 2012 to 2017 and an associate
          research professor at Johns Hopkins University from 2017 to 2020.
        source_ids: [watanabe-site]
      - text: >-
          Watanabe is now an associate professor at Carnegie Mellon University, and is listed as the faculty member of the
          WAVLab speech research group. Watanabe has chaired the IEEE Signal Processing Society's Speech and
          Language Technical Committee.
        source_ids: [watanabe-site, wavlab-members]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Watanabe is first author of the 2018 paper introducing ESPnet, an Apache-2.0 end-to-end speech
          processing toolkit, and is last author of the 2024 paper on VERSA, a toolkit for versatile evaluation
          of speech and audio.
        source_ids: [espnet-paper, espnet-repo, versa-paper, versa-repo]
      - text: >-
          Watanabe's group also develops Open Whisper-style Speech Models (OWSM). The 2023 paper introducing
          OWSM, with Watanabe as last author, reproduces Whisper-style multilingual speech recognition and
          translation training using an open-source toolkit and publicly available data.
        source_ids: [watanabe-site, owsm-paper]
