headline: Associate Professor at Carnegie Mellon University; first author of the ESPnet speech processing toolkit
bio:
  text: >-
    Shinji Watanabe is an Associate Professor at Carnegie Mellon University, working on automatic
    speech recognition, speech enhancement, spoken language understanding, and machine learning for
    speech and language processing. Before CMU, Watanabe was a research scientist at NTT
    Communication Science Laboratories, a senior principal research scientist at Mitsubishi Electric
    Research Laboratories, and an associate research professor at Johns Hopkins University.
    Watanabe's homepage lists the ESPnet end-to-end speech processing toolkit, the VERSA evaluation
    toolkit, and Open Whisper-style Speech Models (OWSM) as software; Watanabe is first author of the
    ESPnet paper and last author of the VERSA paper, and both repositories use the Apache-2.0 license.
  source_ids: [watanabe-site, espnet-paper, espnet-repo, versa-paper, versa-repo]
  reviewed_at: 2026-10-13
