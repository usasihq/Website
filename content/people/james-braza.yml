sections:
  - heading: Research and engineering
    paragraphs:
      - text: >-
          Braza's site lists FutureHouse projects including Aviary and LDP (December 2024), on training
          language agents on challenging scientific tasks, and ether0 (June 2025), on training a scientific
          reasoning model for chemistry. Braza is second author on both papers, whose ether0 version lists
          FutureHouse as the affiliation, and contributed code to the Aviary, LDP and ether0 repositories.
        source_ids: [braza-site, aviary-paper, ether0-paper, ether0-html, aviary-repo, ether0-repo, aviary-commits, ldp-commits, ether0-commits]
      - text: >-
          Earlier projects on Braza's site include Configurator (2024), a toolchain for quality assurance
          across research and production settings. Braza's GitHub profile now lists the role of EECS PhD
          student at MIT.
        source_ids: [braza-site, github-profile]
