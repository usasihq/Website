headline: Second author of FutureHouse's ether0 chemistry model and contributor to its open-source agent tooling
bio:
  text: >-
    James D. Braza is an AI researcher and an EECS PhD student at MIT, according to Braza's GitHub profile.
    At FutureHouse, Braza was second author of "Training a Scientific Reasoning Model for Chemistry" (2025),
    which introduced the ether0 model, and of the Aviary paper (2024) on training language agents, and
    contributed to the ether0, Aviary and LDP repositories.
  source_ids: [github-profile, braza-site, ether0-paper, ether0-html, aviary-paper]
  reviewed_at: 2026-10-22
