headline: Founder and CEO of Glean, the enterprise AI platform; earlier co-founded Rubrik and led teams at Google
bio:
  text: >-
    Arvind Jain is the founder and CEO of Glean, an enterprise AI platform that began with
    workplace search and now offers an assistant and agents grounded in company context. Before
    Glean, Jain co-founded Rubrik and led its research and development, and spent more than a
    decade at Google as a distinguished engineer leading teams in Search, Maps and YouTube.
