sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jain began at Microsoft, held a leadership role at Akamai, and then spent more than ten
          years at Google as a distinguished engineer leading teams on Search, Maps and YouTube.
          Jain went on to co-found Rubrik, a data security company, where Jain led research and
          development.
        source_ids: [glean-about]
      - text: >-
          Jain founded Glean in 2019, and the team built enterprise search in stealth before
          its public launch in 2021.
        source_ids: [glean-about]
  - heading: Glean
    paragraphs:
      - text: >-
          Under Jain, Glean moved from enterprise search to a conversational assistant in 2023 and
          to agents that complete work across systems in 2025. Glean describes its approach as
          drawing on company context while preserving source permissions.
        source_ids: [glean-about]
      - text: >-
          As CEO, Jain writes regularly on Glean's blog about enterprise agents, including posts on
          autonomous agents that plan and self-evaluate, open agent architectures, and an agent
          development lifecycle.
        source_ids: [glean-author]
