sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Google's self-driving effort, Dolgov worked on autonomous driving at Toyota and at
          Stanford as part of Stanford's DARPA Urban Challenge team. Dolgov was one of the founders
          of the Google self-driving car project in 2009.
        source_ids: [waymo-dolgov]
      - text: >-
          The project became Waymo, an independent self-driving technology company under Alphabet,
          in 2016. Dolgov served as Waymo's CTO and is now co-CEO, responsible for overall company
          strategy with a primary focus on the Waymo Driver.
        source_ids: [waymo-dolgov, waymo-about, waymo-leadership]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Waymo launched Waymo One, a commercial autonomous ride-hailing service, in Metro Phoenix in
          2018 and opened its rider-only service there to the public in 2020. The company later
          moved its fleet to all-electric vehicles and, in 2026, added a new vehicle, the Ojai.
        source_ids: [waymo-about]
