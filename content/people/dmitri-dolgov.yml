headline: Co-CEO of Waymo and a founder of the Google self-driving car project; formerly Waymo's CTO
bio:
  text: >-
    Dmitri Dolgov is co-CEO of Waymo, the autonomous driving technology company, alongside Tekedra
    Mawakana. Dolgov is one of the founders of the Google self-driving car project, which began in
    2009 and became Waymo in 2016, and focuses on developing and deploying the Waymo Driver, the
    company's in-house autonomous driving stack.
