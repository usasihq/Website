headline: First author of FastSpeech and FastSpeech 2; former MSRA intern; leads video model research at HeyGen
bio:
  text: >-
    Yi Ren works at HeyGen, where Ren leads the foundation video model research team, and previously joined
    TikTok as a speech research scientist in 2023. Ren's research covers speech synthesis, neural
    machine translation, and automatic music generation, and Ren collaborated closely with Xu Tan,
    Tao Qin, and Tie-Yan Liu of Microsoft Research Asia, where Ren interned in the machine learning
    group in 2018 and 2019. Ren is first author of FastSpeech, which Ren's homepage describes as
    deployed in the Microsoft Azure TTS service, and of FastSpeech 2; Ren also co-authored the
    DiffSinger singing voice synthesis paper.
  source_ids: [ren-site, github-profile, fastspeech-paper, fastspeech2-paper]
  reviewed_at: 2026-10-13
