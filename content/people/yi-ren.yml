sections:
  - heading: Career
    paragraphs:
      - text: >-
          Yi Ren earned a master's degree in computer science at Zhejiang University advised by Zhou
          Zhao, a frequent co-author, and interned in the
          machine learning group at Microsoft Research Asia from August 2018 to February 2019. Ren has
          collaborated closely with Xu Tan, Tao Qin and Tie-Yan Liu of Microsoft Research Asia.
        source_ids: [ren-site]
      - text: >-
          Ren joined TikTok as a speech research scientist in January 2023 and now works at HeyGen,
          leading its foundation video model research team, with a focus on large generative models
          for video and speech. In 2021 Ren was among the young scholars who founded the MLNLP
          community for machine learning and NLP researchers, and serves as one of its committee
          chairs.
        source_ids: [ren-site, github-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Ren's research covers speech synthesis, neural machine translation and automatic music
          generation. Ren was first author of FastSpeech (2019), a fast, robust and controllable
          non-autoregressive text-to-speech model that Ren's homepage describes as deployed in the
          Microsoft Azure TTS service, and of FastSpeech 2 (2020), which trains directly on
          ground-truth targets instead of a teacher model's output.
        source_ids: [ren-site, fastspeech-paper, fastspeech2-paper]
      - text: >-
          Ren co-authored DiffSinger (2021), which synthesizes singing voices with a shallow diffusion
          mechanism, was first author of PortaSpeech (2021), a portable generative text-to-speech
          model, and co-authored Make-An-Audio (2023), a text-to-audio model built on prompt-enhanced
          diffusion.
        source_ids: [diffsinger-paper, portaspeech-paper, make-an-audio-paper]
