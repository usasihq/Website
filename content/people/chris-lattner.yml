slug: chris-lattner
name: Chris Lattner
initials: CL
headline: Co-founder of Modular, maker of the MAX inference framework and the Mojo language
bio:
  text: >-
    Chris Lattner co-founded Modular in January 2022. Modular develops MAX, which serves AI models
    through an OpenAI-compatible endpoint on a local server, and Mojo, a language for writing code that
    runs across CPUs, GPUs, and accelerators. Lattner is the original author of the LLVM compiler
    infrastructure and also started Clang, Swift, and MLIR. When Qualcomm completed its acquisition of
    Modular in July 2026, Modular announced that Lattner would take on the role of Executive Vice
    President of Advanced AI Software and Platforms.
  source_ids: [lattner-site, modular-qualcomm, max-get-started, mojo-1-0]
