sections:
  - heading: Career
    paragraphs:
      - text: >-
          Lattner worked at Apple from July 2005 to January 2017 in several positions, including managing the
          Developer Tools department responsible for Xcode, Instruments, Swift Playgrounds, compilers and
          debuggers. After briefly running the Tesla Autopilot team in early 2017, Lattner joined Google's
          TensorFlow team in August 2017 and led its infrastructure work, including hardware support for CPUs,
          GPUs and TPUs, the low-level runtime and language efforts.
        source_ids: [lattner-site]
      - text: >-
          From January 2020 to January 2022 Lattner led the engineering and product teams at SiFive, which
          builds RISC-V processors. In January 2022 Lattner and Tim Davis launched Modular to rebuild machine
          learning infrastructure, with Lattner as CEO. Modular's July 2026 announcement that Qualcomm had
          completed its acquisition said Lattner would become Executive Vice President of Advanced AI Software
          and Platforms, and that Mojo, MAX and Modular Cloud would continue as products.
        source_ids: [lattner-site, modular-qualcomm]
  - heading: Compilers and languages
    paragraphs:
      - text: >-
          Lattner is the original author of the LLVM compiler infrastructure, an open-source umbrella project
          for compilers, debuggers, JIT systems and related tools, and also started the Clang front end. LLVM is
          now overseen by the nonprofit LLVM Foundation, on whose board Lattner serves.
        source_ids: [lattner-site]
      - text: >-
          Lattner began work on the Swift programming language in July 2010; it became a major focus of
          Apple's Developer Tools group in July 2013 and was released as open source in December 2015. Lattner
          remained on the Swift Core Team until 2021. At Google, Lattner created the MLIR (Multi-Level
          Intermediate Representation) compiler infrastructure, starting from a whitepaper in April 2018; MLIR
          is now part of the LLVM project.
        source_ids: [lattner-site]
  - heading: Modular
    paragraphs:
      - text: >-
          Modular develops Mojo, a language for writing code that runs across CPUs, GPUs and accelerators, and
          MAX, a framework for serving AI models through an OpenAI-compatible endpoint. Modular released Mojo
          1.0 as part of its 26.5 release in August 2026, and its open-source code is published in the
          modular/modular repository.
        source_ids: [mojo-1-0, max-get-started, modular-repo]
