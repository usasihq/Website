headline: Georgia Tech professor whose Polo Club of Data Science created Transformer Explainer and CNN Explainer
bio:
  text: >-
    Duen Horng "Polo" Chau is a Professor and Associate Chair in the School of Computational Science and
    Engineering at Georgia Tech's College of Computing, and an Associate Director of the MS in Analytics
    program. Chau's research group, the Polo Club of Data Science, works at the intersection of machine
    learning and visualization; its AI explainers include Transformer Explainer, Diffusion Explainer and CNN
    Explainer.
  source_ids: [chau-bio, chau-cv, te-readme]
  reviewed_at: 2026-10-22
