sections:
  - heading: Career
    paragraphs:
      - text: >-
          Chau completed a PhD in machine learning at Carnegie Mellon University in 2012, with a thesis on
          combining data mining and human-computer interaction to make sense of large graphs. Chau joined
          Georgia Tech's School of Computational Science and Engineering as an assistant professor in 2012,
          became an associate professor in 2018 and a professor in August 2024.
        source_ids: [chau-cv]
      - text: >-
          Chau has been an Associate Director of Georgia Tech's MS in Analytics program since 2014, and from
          2019 to 2025 served as Director of Industry Relations at the Institute for Data Engineering and
          Science and Associate Director of Corporate Relations at the Center for Machine Learning.
        source_ids: [chau-cv, chau-bio]
  - heading: Research and AI explainers
    paragraphs:
      - text: >-
          Chau's group builds interactive tools that help people understand large datasets and machine
          learning models, with work spanning human-centered and interpretable AI, adversarial machine
          learning, graph mining and cybersecurity. Its AI explainers for learners include CNN Explainer
          (2020), Diffusion Explainer (2024) and Transformer Explainer.
        source_ids: [chau-bio, chau-cv]
      - text: >-
          Transformer Explainer, whose paper lists Aeree Cho first and Chau last, is an interactive visualization
          for learning how text-generative transformer models work. It was presented as an IEEE VIS 2024
          poster and as a paper at ACM CHI 2026, and the open-source tool is credited to its creators at the
          Georgia Institute of Technology.
        source_ids: [te-paper, te-readme, chau-cv]
