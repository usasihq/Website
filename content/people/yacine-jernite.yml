headline: Leads the ML and Society team at Hugging Face; co-author of the Transformers and StarCoder2 papers
bio:
  text: >-
    Yacine Jernite leads the ML and Society team at Hugging Face, working on ML systems governance
    at the intersection of regulatory and technical tools. Jernite's work has focused on NLP models
    and on data curation, documentation, and governance, including serving as co-organizer and data
    area chair for the BigScience workshop, whose ROOTS corpus was used to train the BLOOM model.
    Jernite is a co-author of the paper that introduced Hugging Face's Transformers library, the
    StarCoder2 paper, and "Power Hungry Processing" (2023), which compared the energy and carbon
    cost of deploying task-specific and general-purpose ML models.
  source_ids: [jernite-site, transformers-paper, starcoder2-paper, power-hungry-paper]
  reviewed_at: 2026-10-13
