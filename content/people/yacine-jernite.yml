sections:
  - heading: Career and early research
    paragraphs:
      - text: >-
          Jernite completed a PhD at New York University in January 2018, supervised by David Sontag, working on
          language modeling, graphical models and medical applications of natural language processing. During
          that time Jernite co-authored "Character-Aware Neural Language Models" (2015) with Yoon Kim, Sontag and
          Alexander Rush, a language model that relies only on character-level inputs.
        source_ids: [jernite-site, char-lm-paper]
      - text: >-
          In 2019 Jernite co-authored ELI5, a large corpus for long-form question answering presented at ACL 2019,
          and CraftAssist, a framework for building dialogue-enabled interactive agents in Minecraft. Jernite now
          leads the ML and Society team at Hugging Face, working on governance of machine learning systems at the
          intersection of regulatory and technical tools.
        source_ids: [eli5-paper, craftassist-paper, jernite-site]
  - heading: Data governance and open-source work
    paragraphs:
      - text: >-
          Jernite was a co-organizer and data area chair for the BigScience workshop, whose multilingual ROOTS
          corpus, described in a 2023 paper Jernite co-authored, was used to train the BLOOM model. Jernite is a
          co-author of the papers introducing Hugging Face's Transformers library (2019) and its community Datasets
          library (2021), and of StarCoder2 and The Stack v2 (2024), an open code model and dataset.
        source_ids: [jernite-site, roots-paper, transformers-paper, datasets-paper, starcoder2-paper]
      - text: >-
          Jernite has also co-authored work on the social and environmental effects of models. "Stable Bias"
          (2023) analyzed societal representations in text-to-image diffusion models, and "Power Hungry
          Processing" (2023) compared the energy and carbon cost of deploying task-specific and general-purpose
          models.
        source_ids: [stable-bias-paper, power-hungry-paper]
