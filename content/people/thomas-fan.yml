headline: scikit-learn maintainer; Member of Technical Staff at Modal
bio:
  text: >-
    Thomas J. Fan is a Member of Technical Staff at Modal and a maintainer of scikit-learn, where
    Fan is listed in the project's active Maintainers Team. Fan's blog includes a retrospective on
    six years as a scikit-learn maintainer, along with technical posts on PyTorch model
    serialization with torch.export, portable torch.compile caches, NumPy ufuncs with Cython, and
    Python extensions in Rust.
