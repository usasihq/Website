headline: UC Berkeley professor and Robot Learning Lab director; Amazon Scholar; former OpenAI research scientist
bio:
  text: >-
    Pieter Abbeel is a Professor at UC Berkeley, where Abbeel holds the Jim Gray Chair of Engineering,
    directs the Berkeley Robot Learning Lab and co-directs the Berkeley Artificial Intelligence Research
    (BAIR) lab; Abbeel has also been an Amazon Scholar since 2024. Abbeel's homepage lists earlier roles
    as a research scientist at OpenAI (2016–2017) and as co-founder, President and Chief Scientist of
    Covariant (2017–2024). Abbeel co-authored the Trust Region Policy Optimization paper and the
    Denoising Diffusion Probabilistic Models paper, and the homepage links Abbeel's CS294-158 Deep
    Unsupervised Learning course.
