sections:
  - heading: Career
    paragraphs:
      - text: >-
          Pieter Abbeel's Berkeley EECS faculty page lists a 2008 PhD in computer science from Stanford
          University. At UC Berkeley, Abbeel is a Professor holding the Jim Gray Chair of Engineering,
          directs the Berkeley Robot Learning Lab and co-directs the BAIR lab.
        source_ids: [eecs-faculty, homepage]
      - text: >-
          Outside the university, Abbeel co-founded Gradescope (2014–2018), was a research scientist at
          OpenAI (2016–2017) and an OpenAI advisor from 2015, and was co-founder, President and Chief
          Scientist of Covariant (2017–2024), a company working on AI for robotic automation. Abbeel has
          been an Amazon Scholar since 2024 and hosts The Robot Brains Podcast.
        source_ids: [homepage, eecs-faculty]
  - heading: Research
    paragraphs:
      - text: >-
          Abbeel's lab works on deep reinforcement learning, imitation learning, unsupervised learning,
          transfer learning and meta-learning, and studies how AI could advance other science and
          engineering fields. Earlier work with Adam Coates and Andrew Ng applied apprenticeship learning
          to autonomous helicopter aerobatics, and a 2010 ICRA paper on learning surgical tasks from
          human-guided demonstrations received a best medical robotics paper award.
        source_ids: [eecs-faculty]
      - text: >-
          With collaborators, Abbeel co-authored Trust Region Policy Optimization (2015), a policy
          optimization method for neural network policies, and Denoising Diffusion Probabilistic Models
          (2020) with Jonathan Ho and Ajay Jain, which showed high-quality image synthesis with diffusion
          models.
        source_ids: [trpo-paper, ddpm-paper]
  - heading: Teaching
    paragraphs:
      - text: >-
          Abbeel's courses include CS188 Introduction to Artificial Intelligence, CS287 Advanced Robotics,
          and CS294-158 Deep Unsupervised Learning, which was offered in Spring 2024. Abbeel also
          co-taught CS294-190 with Stuart Russell, presented an ICML 2021 tutorial on unsupervised
          reinforcement learning, and co-organized the Full Stack Deep Learning bootcamp.
        source_ids: [homepage, cs294-158-sp24]
