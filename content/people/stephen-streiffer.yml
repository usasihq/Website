sections:
  - heading: Career
    paragraphs:
      - text: >-
          Streiffer spent 24 years at Argonne National Laboratory in research and leadership
          roles. There Streiffer led the Photon Sciences Directorate and directed the Advanced
          Photon Source, a DOE Office of Science X-ray user facility, and helped lead its upgrade;
          the final Argonne post was deputy director for science and technology.
        source_ids: [ornl-profile]
      - text: >-
          In June 2022 Streiffer joined Stanford University as the vice president responsible for
          oversight of SLAC National Accelerator Laboratory and served as SLAC's interim director.
          Streiffer came to Oak Ridge in October 2023 as laboratory director, a role ORNL's
          leadership page lists today.
        source_ids: [ornl-profile, ornl-leadership]
  - heading: Research and facilities
    paragraphs:
      - text: >-
          From 2000 to 2009 Streiffer had a leadership role in developing Argonne's Center for
          Nanoscale Materials, another Office of Science user facility, and later helped create
          and lead Argonne's Physical Sciences and Engineering Directorate. Streiffer's research
          expertise covers nanostructured complex oxides and materials characterization by
          transmission electron microscopy and X-ray scattering.
        source_ids: [ornl-profile]
      - text: >-
          From March 2020 through May 2022, Streiffer was co-director of DOE's National Virtual
          Biotechnology Laboratory, a consortium of the national labs that worked on testing,
          treatment, epidemiological modeling and supply-chain problems during the COVID-19
          pandemic.
        source_ids: [ornl-profile]
