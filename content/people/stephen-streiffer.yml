headline: Director of Oak Ridge National Laboratory; former interim director of SLAC and Argonne deputy director
bio:
  text: >-
    Stephen K. Streiffer is the director of Oak Ridge National Laboratory (ORNL), the U.S.
    Department of Energy laboratory whose missions span neutron science, high-performance
    computing, advanced materials, energy, nuclear science and national security research.
    Streiffer's own scientific work is in nanostructured complex oxides and the structural
    characterization of materials with electron microscopy and X-ray scattering.
  source_ids: [ornl-profile]
