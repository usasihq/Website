sections:
  - heading: Research
    paragraphs:
      - text: >-
          Paine's graduate work at the University of Texas at Austin produced the UT Series Elastic
          Actuator, a compact, high-performance actuator for robots. As a member of the NASA-JSC team for the DARPA Robotics Challenge, Paine helped
          design series elastic actuators and wrote actuator-level controllers for the Valkyrie
          humanoid.
        source_ids: [ap-leadership]
      - text: >-
          Paine then spent a year as a postdoctoral researcher at UT Austin studying
          forced-convective cooling of electric motors and embedded system design.
        source_ids: [ap-leadership]
  - heading: Apptronik
    paragraphs:
      - text: >-
          Paine co-founded Apptronik in 2016 and has led its technical work since, on designs that
          range from commercial humanoids to exoskeletons and manipulators.
        source_ids: [ap-leadership]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Apptronik unveiled its Apollo humanoid robot in August 2023 and in March 2024 announced a
          commercial agreement with Mercedes-Benz to use Apollo for physically demanding manual
          work. In December 2024 it announced a research partnership with the Google DeepMind
          robotics team.
        source_ids: [ap-apollo, ap-mercedes, ap-deepmind]
      - text: >-
          In June 2026 Apptronik opened an expanded Robot Park facility for collecting real-world
          training data and unveiled Apollo 2, in bipedal and wheeled configurations, whose data
          feeds AI models developed with Google DeepMind.
        source_ids: [ap-robot-park]
