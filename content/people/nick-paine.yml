headline: Co-founder and CTO of Apptronik; worked on actuators for NASA's Valkyrie humanoid robot
bio:
  text: >-
    Nicholas (Nick) Paine is a co-founder and the Chief Technology Officer of Apptronik, which builds
    the Apollo humanoid robot. Since Apptronik's founding in 2016, Paine has directed its technical
    strategy and execution, across commercial humanoids, force-augmenting exoskeletons and robotic
    manipulators.
  source_ids: [ap-leadership]
