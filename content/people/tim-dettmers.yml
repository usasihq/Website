headline: Creator and maintainer of bitsandbytes; Assistant Professor at CMU and Research Scientist at Ai2
bio:
  text: >-
    Tim Dettmers works on making AI models practical to train and use with modest compute. Dettmers
    created and maintains bitsandbytes, a PyTorch library for k-bit quantization that provides 8-bit
    optimizers, LLM.int8() inference and support for QLoRA fine-tuning, and is first author of the QLoRA
    paper, which fine-tunes a frozen 4-bit quantized model through low-rank adapters. Dettmers is an
    Assistant Professor at Carnegie Mellon University and a Research Scientist at Ai2.
  source_ids: [about, bnb-repo, qlora-paper, cmu]
