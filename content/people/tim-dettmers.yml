sections:
  - heading: Career
    paragraphs:
      - text: >-
          Tim Dettmers completed a PhD at the University of Washington advised by Luke Zettlemoyer. Dettmers is
          now an assistant professor at Carnegie Mellon University and a research scientist at the Allen
          Institute for AI, with the stated goal of making AI accessible enough that anyone can tinker with
          it, learn from it and use it in their own work.
        source_ids: [about, cmu, ai2-team]
  - heading: Research
    paragraphs:
      - text: >-
          Dettmers's research holds that computationally efficient methods accelerate progress in deep
          learning. First-author papers include 8-bit optimizers via block-wise quantization (2021),
          LLM.int8() for 8-bit matrix multiplication in large Transformers (2022), QLoRA for fine-tuning
          4-bit quantized models through low-rank adapters (2023), and SpQR, a sparse-quantized format for
          near-lossless weight compression (2023).
        source_ids: [about, eightbit-paper, int8-paper, qlora-paper, spqr-paper]
      - text: >-
          Dettmers also co-authored Petals (2022), a system for collaborative inference and fine-tuning of
          large models over the internet. Current interests listed by Dettmers include open-source agents,
          on-device mixture-of-experts models, hierarchical LLM architectures and scientific automation.
        source_ids: [petals-paper, about]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Dettmers created and maintains bitsandbytes, a PyTorch library that brings these quantization methods
          to practitioners. Its README describes k-bit quantization support including 8-bit optimizers,
          LLM.int8() inference and 4-bit quantization for QLoRA fine-tuning.
        source_ids: [about, bnb-repo]
