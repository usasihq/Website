headline: Started MLC LLM, a compiler-based engine for running language models on GPUs, phones, and browsers
bio:
  text: Tianqi Chen is an Associate Professor in the Machine Learning and Computer Science departments
    at Carnegie Mellon University and a Distinguished Engineer at NVIDIA. Chen lists MLC LLM among the
    machine learning systems Chen started. MLC LLM uses machine learning compilation to deploy language
    models natively on AMD, NVIDIA, Apple, and Intel GPUs, in web browsers, and on iOS and Android devices.
    Chen's earlier projects include Apache TVM, an open machine learning compilation framework.
  source_ids:
