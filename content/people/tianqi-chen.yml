sections:
- heading: Career
  paragraphs:
  - text: >-
      Tianqi Chen completed a Ph.D. at the University of Washington's Paul G. Allen School of Computer
      Science & Engineering from 2013 to 2019, advised by Carlos Guestrin and working closely with Luis
      Ceze and Arvind Krishnamurthy as a member of the SAMPL and MODE labs. From 2019 to 2024 Chen was
      Chief Technologist of OctoAI, which NVIDIA later acquired.
    source_ids:
    - personal-site
  - text: >-
      Chen is now an Associate Professor in Carnegie Mellon University's Machine Learning and Computer
      Science departments and a Distinguished Engineer at NVIDIA. At CMU, Chen leads the Catalyst Group,
      which studies machine learning systems and AI infrastructure across the software and hardware stack.
    source_ids:
    - personal-site
    - cmu-career
- heading: Research
  paragraphs:
  - text: >-
      Chen's research sits at the intersection of machine learning and systems, taking a whole-stack view
      from models and systems down to low-level hardware backends. CMU describes the work as building
      scalable, open-source machine learning infrastructure and deployment systems that run across a wide
      range of computing environments.
    source_ids:
    - personal-site
    - cmu-career
  - text: >-
      The 2018 TVM paper presented a compiler exposing graph-level and operator-level optimizations so
      that deep learning workloads could run on mobile phones, embedded devices, and accelerators as well
      as server GPUs. In 2026 the National Science Foundation gave Chen a CAREER award for research in
      machine learning systems.
    source_ids:
    - tvm-paper
    - cmu-career
- heading: Open-source work
  paragraphs:
  - text: >-
      Chen lists MLC LLM, Apache TVM, and XGBoost as machine learning systems Chen started, and is a
      co-creator of Apache MXNet. XGBoost is a distributed gradient boosting library, TVM is an open
      machine learning compiler framework, and MLC LLM is a deployment engine for language models built
      on machine learning compilation.
    source_ids:
    - personal-site
    - xgboost-repo
    - tvm-repo
    - mlc-llm-repo
  - text: >-
      Chen also serves the research community as Board President of the MLSys Conference. Chen was
      Program Committee Chair of MLSys 2023, Artifact Evaluation Chair of MLSys 2022, and has been an Area
      Chair for ICML and NeurIPS.
    source_ids:
    - personal-site
