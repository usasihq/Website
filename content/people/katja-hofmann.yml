headline: Partner Research Manager at Microsoft Research Cambridge who led the Muse (WHAM) gameplay model project
bio:
  text: >-
    Katja Hofmann is a Partner Research Manager at Microsoft Research Cambridge, where Hofmann co-leads
    the People-Centric AI research area, with work on generative AI, interactive media and game
    intelligence. Hofmann led the project behind WHAM, the World and Human Action Model that Microsoft
    introduced as Muse in February 2025, and is one of the four senior authors of the accompanying Nature paper.
    Hofmann previously led Microsoft Research's Game Intelligence team and serves on the board of the
    International Conference on Learning Representations (ICLR).
  source_ids: [msr-hofmann, muse-blog, wham-nature]
  reviewed_at: 2026-10-22
