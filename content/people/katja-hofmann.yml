sections:
  - heading: Role
    paragraphs:
      - text: >-
          Hofmann is a Partner Research Manager at Microsoft Research Cambridge and co-leads its People-Centric
          AI research area, which combines machine learning with human-computer interaction, design and social
          science. Hofmann previously led the Game Intelligence team, focused on machine learning research for
          video games, which now forms part of that area.
        source_ids: [msr-hofmann]
      - text: >-
          Hofmann has served on the board of ICLR since 2022 and as Secretary of the Board since 2024, after
          serving as Senior Program Chair for ICLR 2021 and General Chair for ICLR 2022.
        source_ids: [msr-hofmann]
  - heading: Muse and WHAM
    paragraphs:
      - text: >-
          On February 19, 2025, Nature published "World and Human Action Models towards gameplay ideation", and
          Hofmann's Microsoft Research post introduced the model as Muse, a generative AI model for gameplay
          ideation. The paper's contributions statement says Hofmann led the project, and Microsoft released
          the WHAM weights and sample gameplay data on Hugging Face.
        source_ids: [wham-nature, muse-blog, wham-card]
