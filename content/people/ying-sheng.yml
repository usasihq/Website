slug: ying-sheng
name: Ying Sheng
initials: YS
headline: SGLang co-author and codeowner; first author of FlexGen, for running large models on a single
  GPU
bio:
  text: Ying Sheng works on systems for serving and running large language models. Sheng is first author
    of FlexGen, a 2023 system that runs large language models with limited GPU memory by spreading weights
    and cache across GPU, CPU memory, and disk and compressing them to 4 bits. Sheng is an author of the
    SGLang paper and a codeowner of the SGLang repository, whose maintenance guide names Sheng and Lianmin
    Zheng as the people who start nominations for new maintainers. Sheng is also an officer of LMSYS,
    the nonprofit that hosts SGLang.
