sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ying Sheng completed a PhD in computer science at Stanford University in the Centaur group,
          advised by Clark Barrett. Along the way Sheng was a research intern at Microsoft Research Asia
          (2015), a quantitative software engineer at Two Sigma (2018), a research intern at Facebook Novi
          working on smart contract verification (2021), and spent 2022 at X, the moonshot factory,
          working on AI for code.
        source_ids: [personal-site]
      - text: >-
          Sheng was a visiting researcher with Ion Stoica and Joseph E. Gonzalez at UC Berkeley's Sky lab
          (2023–2024) and then a member of technical staff at xAI from October 2024 to August 2025, where
          Sheng co-led the inference team. Sheng's homepage notes that it is no longer kept up to date.
        source_ids: [personal-site]
  - heading: Research
    paragraphs:
      - text: >-
          Sheng's early research was in formal methods and automated reasoning: "Politeness for the Theory
          of Algebraic Datatypes" received a best paper award at IJCAR 2020, and Sheng is a co-author of
          cvc5, an open-source SMT solver whose paper received the TACAS 2022 best tool paper award.
        source_ids: [publications-page]
      - text: >-
          Sheng's language model systems work includes FlexGen (2023), for high-throughput inference with
          limited GPU memory; S-LoRA (2023), for serving thousands of LoRA adapters concurrently; and
          SGLang (2023), a language and runtime for structured language model programs. Sheng also
          co-authored "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena" (2023) and contributed to
          the FastChat platform and the Vicuna chatbot.
        source_ids: [flexgen-paper, s-lora-paper, sglang-paper, llm-judge-paper, personal-site]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Sheng is an officer of LMSYS, a nonprofit founded to incubate early-stage open-source projects,
          and a codeowner of the SGLang repository. SGLang's maintenance guide names Sheng and Lianmin
          Zheng as the contacts who start nomination and review for new maintainers and CI on-call
          volunteers.
        source_ids: [lmsys-about, personal-site, sglang-codeowners, sglang-maintainers, sglang-repo]
