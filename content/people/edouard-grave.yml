sections:
  - heading: Career
    paragraphs:
      - text: >-
          Edouard Grave worked as a research scientist in two corporate research labs, Apple MLR and
          Facebook AI Research (FAIR). The November 2023 announcement of the Kyutai research lab says
          that at FAIR, Grave co-led the development of the LLaMA language model and of the fastText
          library.
        source_ids: [kyutai-launch]
      - text: >-
          Grave was one of the founding researchers named when Kyutai, a non-profit open-science AI
          lab, launched in November 2023. Kyutai's team page now lists Grave among its alumni, with the
          title Chief Language Officer.
        source_ids: [kyutai-launch, kyutai-team]
  - heading: Research
    paragraphs:
      - text: >-
          Grave co-authored the 2016 fastText papers on subword-aware word vectors and efficient text
          classification, and in 2019 co-authored CCNet, a pipeline for extracting high-quality
          monolingual datasets from Common Crawl. The fastText code was released under the MIT license.
        source_ids: [fasttext-subword-paper, fasttext-classification-paper, fasttext-license, ccnet-paper]
      - text: >-
          With Gautier Izacard and colleagues, Grave worked on retrieval for language models: the 2020
          Fusion-in-Decoder paper on combining passage retrieval with generative question answering,
          Contriever (2021) for unsupervised dense retrieval with contrastive learning, and Atlas
          (2022), a retrieval-augmented language model for few-shot learning.
        source_ids: [fid-paper, contriever-paper, atlas-paper]
      - text: >-
          Grave is one of the equal-contribution authors of LLaMA (2023), and at Kyutai co-authored the
          2024 paper introducing Moshi, a speech-text foundation model for real-time, full-duplex
          spoken dialogue.
        source_ids: [llama-paper, moshi-paper]
