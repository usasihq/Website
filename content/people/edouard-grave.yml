headline: Equal-contribution author of Meta's LLaMA paper; co-author of fastText and of Kyutai's Moshi
bio:
  text: >-
    The November 2023 announcement of the Kyutai research lab describes Edouard Grave as a research
    scientist with experience in the corporate research labs Apple MLR and Facebook AI Research (FAIR),
    and says that at FAIR, Grave co-led the development of the LLaMA large language model and the
    fastText library.
    Grave is one of the equal-contribution authors of LLaMA: Open and Efficient Foundation Language
    Models (2023) and a co-author of the two 2016 fastText papers on subword word vectors and efficient
    text classification. Kyutai's team page lists Grave among its alumni with the title Chief Language
    Officer, and Grave co-authored Kyutai's Moshi speech-text foundation model paper (2024).
  source_ids: [kyutai-launch, llama-paper, fasttext-subword-paper, fasttext-classification-paper, kyutai-team, moshi-paper]
  reviewed_at: 2026-10-13
