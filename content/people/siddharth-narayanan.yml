headline: First author of FutureHouse's ether0 chemistry reasoning model and the Aviary language-agent framework
bio:
  text: >-
    Siddharth Narayanan is a machine learning researcher whose GitHub profile lists Edison Scientific. At
    FutureHouse, Narayanan was first author of "Training a Scientific Reasoning Model for Chemistry" (2025),
    which introduced the 24-billion-parameter ether0 model, and of Aviary (2024), on training language agents
    on challenging scientific tasks.
  source_ids: [github-profile, ether0-paper, ether0-html, aviary-paper]
