sections:
  - heading: Research
    paragraphs:
      - text: >-
          Narayanan is first author of Aviary (December 2024), a FutureHouse framework for training language
          agents on challenging scientific tasks, and contributes to its open-source repositories.
        source_ids: [aviary-paper, aviary-repo, aviary-commits, ldp-commits]
      - text: >-
          In June 2025, Narayanan was first author of "Training a Scientific Reasoning Model for Chemistry",
          which lists FutureHouse as the authors' affiliation and introduced ether0, a 24B-parameter reasoning
          model for chemistry released with open weights. Narayanan's GitHub profile now lists Edison
          Scientific.
        source_ids: [ether0-paper, ether0-html, ether0-card, github-profile]
