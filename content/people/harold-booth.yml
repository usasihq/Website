sections:
  - heading: Dioptra
    paragraphs:
      - text: >-
          Booth is listed first among the authors of the June 2021 Securing AI Testbed (Dioptra)
          documentation, which describes an experimentation testbed built at NIST's National Cybersecurity
          Center of Excellence for evaluating attacks and defenses. Booth is also a named author of the
          Dioptra Test Platform software publication.
        source_ids: [nist-booth]
      - text: >-
          The Dioptra repository describes the platform as supporting research tracking, evaluations and
          challenges, and red-teaming, with reproducible, traceable and extensible experiments composed
          from modular components, with a plugin system for extending functionality.
        source_ids: [dioptra-readme]
  - heading: Software security
    paragraphs:
      - text: >-
          Booth works in NIST's Software Security Group. In July 2024 Booth was the first-listed author of "Secure
          Software Development Practices for Generative AI and Dual-Use Foundation Models: An SSDF
          Community Profile".
        source_ids: [nist-booth]
