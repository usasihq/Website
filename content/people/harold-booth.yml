headline: NIST computer scientist in the Software Security Group; co-author of the Dioptra AI test platform
bio:
  text: >-
    Harold Booth is a computer scientist in the Software Security Group at the National Institute of
    Standards and Technology (NIST). Booth is a co-author of NIST's Dioptra Test Platform, software for
    assessing the trustworthy characteristics of AI, and of its earlier documentation as the Securing AI
    Testbed. Booth is also the first-listed author of NIST's 2024 Secure Software Development Framework community
    profile for generative AI and dual-use foundation models.
  source_ids: [nist-booth, dioptra-readme]
  reviewed_at: 2026-10-22
