headline: Data analyst and YouTuber who makes tutorials and courses on SQL, Python, Excel, and Power BI
bio:
  text: >-
    Luke Barousse is a data analyst, engineer, and YouTuber who makes tutorials for people working with data.
    The YouTube channel shares Luke's learning as a data professional, and Luke's website offers hands-on
    courses in SQL, Python, Excel, and Power BI along with free email crash courses on data analytics and
    data engineering. Luke's site also describes work as a course instructor at DataCamp and earlier work as
    an analyst for the MrBeast channel.
  source_ids: [site, channel]
