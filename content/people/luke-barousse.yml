sections:
  - heading: Career
    paragraphs:
      - text: >-
          Barousse's website describes a path from service as a submariner to a management position, and then
          to full-time work on YouTube after Barousse found that helping others with data problems suited
          Barousse better than managing people. The site also lists work as a former analyst
          for the MrBeast YouTube channel and as a course instructor at DataCamp.
        source_ids: [site]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          The Luke Barousse YouTube channel, which YouTube lists as joined in August 2020, publishes tutorials
          for data analysts and shares Barousse's learning as a data professional; a second channel covers tech
          news. Barousse's GitHub profile lists free YouTube courses with public course repositories, covering
          Excel, SQL, intermediate SQL, Python and Power BI for data analytics, SQL for data engineering, and
          dbt.
        source_ids: [channel, site, github-profile]
      - text: >-
          Barousse also runs datanerd.tech, a free job-market analytics app that tracks skill demand and job
          openings for data analysts, engineers and scientists, and offers free email crash courses on what data
          analysts do and how to build skills for the job search.
        source_ids: [datanerd, site, github-profile]
