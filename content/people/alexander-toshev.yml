sections:
  - heading: Research
    paragraphs:
      - text: >-
          Alexander Toshev's early deep learning papers addressed computer vision. DeepPose, which Toshev
          wrote with Christian Szegedy in 2013, frames human pose estimation as regression of body-joint
          positions with a cascade of deep neural networks. In 2014 Toshev co-authored Show and Tell, a
          neural image caption generator built on a deep recurrent architecture that combines advances
          in computer vision and machine translation to generate sentences describing an image.
        source_ids: [deeppose-paper, showtell-paper]
      - text: >-
          More recent co-authored papers cover training data and image-text models. DataComp-LM (2024)
          offers a standardized Common Crawl corpus, OpenLM-based pretraining recipes and a suite of
          downstream evaluations for controlled dataset experiments, and MobileCLIP2 (2025) improves the
          multi-modal reinforced training of low-latency image-text models, with pretrained models and
          data-generation code released.
        source_ids: [dclm-paper, mobileclip2-paper]
  - heading: Agents
    paragraphs:
      - text: >-
          Several recent papers co-authored by Toshev concern agents. LLaRP (2023) adapts a frozen
          pre-trained language model into a policy for embodied visual tasks trained with reinforcement
          learning. A 2026 paper uses language models as simulated world models to generate stateful
          training data for API-calling agents, and RLTL;DR (2026) has an agent write short feedback
          insights after failed attempts and learn to internalize them.
        source_ids: [llarp-paper, simulate-paper, rltldr-paper]
