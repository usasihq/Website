headline: Apple machine learning researcher; co-author of DataComp-LM, MobileCLIP2, and recent agent-training work
bio:
  text: >-
    Alexander Toshev is a machine learning researcher at Apple, listed with Apple on papers through
    September 2026. Toshev's recent Apple work covers training agents, including RLTL;DR, a 2026 method in
    which an agent writes short feedback insights after failed attempts and conditions later attempts on
    them. Toshev is also a co-author of DataComp-LM, a testbed for controlled dataset experiments built
    around a standardized Common Crawl corpus, and of MobileCLIP2, which improves the training of
    low-latency image-text models.
  source_ids: [rltldr-paper, simulate-paper, dclm-paper, mobileclip2-paper]
  reviewed_at: 2026-10-13
