headline: Chief Technology Officer of Zoom; former Azure AI CTO and Technical Fellow at Microsoft
bio:
  text: >-
    Xuedong (X.D.) Huang is chief technology officer at Zoom, where Huang leads the company's AI
    strategy and services. Before joining Zoom in 2023, Huang worked at Microsoft as Azure AI CTO and
    technical fellow; Huang began Microsoft's speech technology group in 1993 and led Microsoft AI teams
    to human parity milestones in speech recognition, machine translation, natural
    language understanding, and computer vision. Huang is a co-author of the 2014 Microsoft Research
    report introducing CNTK, the Computational Network Toolkit, and is an IEEE and ACM Fellow and an
    elected member of the National Academy of Engineering and the American Academy of Arts and Sciences.
  source_ids: [zoom-team, cntk-pub]
  reviewed_at: 2026-10-21
