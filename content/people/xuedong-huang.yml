sections:
  - heading: Career
    paragraphs:
      - text: >-
          Xuedong Huang started Microsoft's speech technology group in 1993 and later
          served at Microsoft as Azure AI CTO and technical fellow.
        source_ids: [zoom-team]
      - text: >-
          Huang joined Zoom in 2023 as chief technology officer, leading the company's AI strategy and services.
        source_ids: [zoom-team]
  - heading: Research
    paragraphs:
      - text: >-
          Huang led Microsoft AI teams that reported human-parity results in several areas. Huang co-authored
          Achieving Human Parity in Conversational Speech Recognition (2016), measured on the NIST 2000
          conversational speech test set, and Achieving Human Parity on Automatic Chinese to English News Translation (2018).
        source_ids: [zoom-team, speech-parity-paper, mt-parity-paper]
      - text: >-
          Zoom's biography notes that Huang is the author of two books and an inventor on U.S. patents in
          speech and AI.
        source_ids: [zoom-team]
