headline: Chief Research Officer at OpenAI; first author of the Codex paper that released HumanEval
bio:
  text: >-
    Mark Chen is Chief Research Officer at OpenAI, as listed on an OpenAI Forum event page from March
    2026. Chen is first author of "Evaluating Large Language Models Trained on Code" (2021), the Codex
    paper that introduced and released the HumanEval benchmark, and a co-author of the DALL·E and
    DALL·E 2 papers. The GPT-4 Technical Report credits Chen as vision team co-lead and deployment
    lead, and the OpenAI o1 System Card lists Chen in the reasoning research leadership and in
    executive leadership. Chen is also listed among the contributors to the gpt-oss-120b and
    gpt-oss-20b model card.
  source_ids: [oai-forum-event, codex-paper, humaneval-repo, dalle-paper, dalle2-paper, gpt4-report, o1-card, gpt-oss-card]
  reviewed_at: 2026-10-13
