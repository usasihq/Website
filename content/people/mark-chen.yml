sections:
  - heading: Research
    paragraphs:
      - text: >-
          Mark Chen is first author of "Generative Pretraining from Pixels" (ICML 2020), which applies a
          GPT-2-scale sequence transformer to images by predicting pixels autoregressively and measures
          the resulting representations by linear probing and fine-tuning. Chen is also a co-author of
          "Zero-Shot Text-to-Image Generation" (2021), the original DALL·E paper, and the last-listed
          author of the 2022 DALL·E 2 paper on image generation with CLIP latents.
        source_ids: [igpt-paper, dalle-paper, dalle2-paper]
      - text: >-
          Chen is first and corresponding author of the 2021 Codex paper, "Evaluating Large Language
          Models Trained on Code," which introduced HumanEval, a set of programming problems for
          measuring functional correctness of programs synthesized from docstrings. The openai/human-eval
          repository, released under the MIT license, provides the evaluation harness and cites the
          paper.
        source_ids: [codex-paper, humaneval-repo]
  - heading: Leadership at OpenAI
    paragraphs:
      - text: >-
          OpenAI's technical reports credit Chen in several leadership roles. The GPT-4
          Technical Report (2023) lists Chen as vision team co-lead and deployment lead, and the OpenAI o1
          System Card (2024) lists Chen under reasoning research leadership and executive leadership.
          Chen is also among the contributors to the 2025 model card for the open-weight gpt-oss-120b
          and gpt-oss-20b models.
        source_ids: [gpt4-report, o1-card, gpt-oss-card]
      - text: >-
          An OpenAI Forum event page from March 2026 lists Chen as Chief Research Officer at OpenAI and
          announces a fireside conversation between Chen and mathematician Terence Tao on the role of AI
          in mathematical discovery, part of a convening with UCLA's Institute for Pure and Applied
          Mathematics.
        source_ids: [oai-forum-event]
