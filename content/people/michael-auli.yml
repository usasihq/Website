sections:
  - heading: Career
    paragraphs:
      - text: >-
          Auli's doctoral work at the University of Edinburgh, advised by Adam Lopez and Philipp Koehn, was on
          CCG parsing. At Microsoft Research, Auli was involved in early work on neural machine translation and
          neural dialogue models, including a 2015 paper on generating context-sensitive conversational
          responses with neural networks.
        source_ids: [auli-site, meta-profile, conversational-responses-paper]
      - text: >-
          At Facebook AI Research, Auli led the team that developed convolutional sequence-to-sequence models
          and later worked as a Principal Research Scientist/Director on self-supervised learning for speech and
          language. The 2025 Omnilingual ASR paper marks Auli's contribution as work conducted while at FAIR at
          Meta.
        source_ids: [meta-profile, auli-site, omnilingual-pdf]
  - heading: Research
    paragraphs:
      - text: >-
          The 2017 convolutional sequence-to-sequence paper replaced recurrent networks with convolutions for
          sequence learning. Auli then co-authored the wav2vec line of self-supervised speech models:
          wav2vec (2019) pre-trained on unlabeled audio for speech recognition, and wav2vec 2.0 (2020) learned
          speech representations by masking latent audio features.
        source_ids: [convs2s-paper, wav2vec-paper, wav2vec2-paper]
      - text: >-
          data2vec (2022) applied a single self-supervised method to speech, vision, and language by predicting
          contextualized latent representations, and data2vec 2.0 made that training more efficient. The
          Massively Multilingual Speech project (2023) built pre-trained wav2vec 2.0 models covering 1,406
          languages and a speech recognition model for 1,107 languages, and Omnilingual ASR (2025) extended
          open multilingual speech recognition to more than 1,600 languages.
        source_ids: [data2vec-paper, data2vec2-paper, mms-paper, auli-site, omnilingual-pdf]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Auli is the last author of the 2019 paper describing fairseq, Facebook AI Research's MIT-licensed
          PyTorch toolkit for sequence modeling, which Auli's homepage lists among the projects from this work.
        source_ids: [fairseq-paper, fairseq-repo, auli-site]
