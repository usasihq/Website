headline: Former Principal Research Scientist/Director at Meta FAIR; last author of wav2vec 2.0, fairseq, and MMS
bio:
  text: >-
    Michael Auli's homepage, last updated in April 2024, describes Auli as a Principal Research
    Scientist/Director at Meta's FAIR lab working on machine learning, speech processing, and natural
    language processing, with projects such as wav2vec, the fairseq toolkit, and convolutional
    sequence-to-sequence models; the 2025 Omnilingual ASR paper marks Auli's contribution as work
    conducted while at FAIR at Meta. Before Meta, Auli was at Microsoft Research, working on early
    neural machine translation and neural dialogue models. Auli is the last author of the wav2vec 2.0, data2vec, and fairseq papers
    and of Scaling Speech Technology to 1,000+ Languages, the Massively Multilingual Speech (MMS)
    project.
  source_ids: [auli-site, meta-profile, omnilingual-pdf, wav2vec2-paper, data2vec-paper, fairseq-paper, mms-paper]
  reviewed_at: 2026-10-13
