sections:
  - heading: Career
    paragraphs:
      - text: >-
          Christopher Bishop completed a PhD in theoretical physics at the University of Edinburgh with a
          thesis on quantum field theory, then joined the Theoretical Physics Division of Culham
          Laboratory to research magnetically confined fusion plasmas. An interest in machine learning
          led Bishop to become Head of the Applied Neurocomputing Centre at AEA Technology, and later to
          a Chair at Aston University, where Bishop set up and led the Neural Computing Research Group.
        source_ids: [msr-profile]
      - text: >-
          Bishop joined Microsoft in 1997 and directed Microsoft Research Cambridge from 2015 to 2022,
          when Bishop founded the AI for Science team. As a Technical Fellow, Bishop oversees a global
          research portfolio on machine learning for the natural sciences, and also holds an honorary
          professorship in computer science at the University of Edinburgh and a fellowship of Darwin
          College, Cambridge.
        source_ids: [msr-profile]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Bishop wrote the textbooks Neural Networks for Pattern Recognition (1995) and Pattern
          Recognition and Machine Learning (2006), and co-wrote Deep Learning: Foundations and Concepts
          with Hugh Bishop. The Microsoft Research page for Pattern Recognition and Machine Learning
          describes it as an introduction for advanced undergraduates and first-year PhD students with a
          Bayesian perspective, and offers exercise solutions and figures for course instructors.
        source_ids: [msr-profile, prml-page]
      - text: >-
          Bishop delivered the Royal Institution Christmas Lectures in 2008. Bishop was also a founding
          member of the UK AI Council and in 2019 was appointed to the Council for Science and
          Technology.
        source_ids: [msr-profile]
