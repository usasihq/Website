headline: Microsoft Technical Fellow, founder of Microsoft Research AI for Science, and machine learning textbook author
bio:
  text: >-
    Christopher Bishop is a Microsoft Technical Fellow and the founder of Microsoft Research AI for
    Science, where Bishop oversees a global research portfolio on machine learning for the natural
    sciences. Bishop joined Microsoft in 1997 and was Lab Director of Microsoft Research Cambridge from
    2015 until 2022, when Bishop founded the AI for Science team. Bishop wrote the machine learning
    textbooks Neural Networks for Pattern Recognition (1995) and Pattern Recognition and Machine
    Learning (2006), co-authored Deep Learning: Foundations and Concepts, and was elected a Fellow of
    the Royal Society in 2017.
  source_ids: [msr-profile, prml-page]
  reviewed_at: 2026-10-21
