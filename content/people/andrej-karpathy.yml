sections:
  - heading: Career
    paragraphs:
      - text: >-
          Karpathy's PhD at the Stanford Vision Lab, advised by Fei-Fei Li, focused on convolutional and
          recurrent neural networks for computer vision, natural language processing, and their intersection.
          From 2015 to 2017 Karpathy was a research scientist and founding member at OpenAI, and from 2017 to
          2022 was Director of AI at Tesla, leading the computer vision team of Tesla Autopilot and a team that
          handled data labeling, neural network training, and deployment on Tesla's custom inference chip.
        source_ids: [karpathy-site]
      - text: >-
          Karpathy returned to OpenAI from 2023 to 2024 to build a new team working on midtraining and
          synthetic data generation. Since 2024 Karpathy's site describes work making educational videos on AI.
        source_ids: [karpathy-site]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          During the PhD, Karpathy designed and was the primary instructor for Stanford's CS 231n,
          Convolutional Neural Networks for Visual Recognition, first taught in 2015. Karpathy's current
          YouTube lectures run in two tracks: the technical Zero to Hero playlist and general-audience videos
          such as Deep Dive into LLMs like ChatGPT and How I use LLMs.
        source_ids: [karpathy-site]
      - text: >-
          Essays listed on Karpathy's site include "The Unreasonable Effectiveness of Recurrent Neural Networks"
          (2015), "Software 2.0" (2017), and "A Recipe for Training Neural Networks" (2019).
        source_ids: [karpathy-site]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Karpathy's repositories favor small, readable code for training language models. nanoGPT is a compact
          repository for training and fine-tuning medium-sized GPTs that reproduces GPT-2 (124M) on
          OpenWebText; in November 2025 its README pointed readers to nanochat, a minimal harness that covers
          tokenization, pretraining, finetuning, evaluation, and inference on a single GPU node.
        source_ids: [nanogpt-readme, nanochat-readme, github-profile]
      - text: >-
          llm.c implements language model training in plain C and CUDA, focused on reproducing the GPT-2 and
          GPT-3 miniseries alongside a PyTorch reference, while llama2.c trains Llama 2 architecture models in
          PyTorch and runs them from a single C file. Earlier projects listed on Karpathy's site include the
          micrograd autograd engine, char-rnn, and arxiv-sanity.
        source_ids: [llmc-readme, llama2c-readme, llama2c-license, karpathy-site]
timeline:
  - date: "2011"
    text: Began a PhD at Stanford on neural networks for vision and language, advised by Fei-Fei Li.
    source_ids: [karpathy-site]
  - date: "2015"
    text: Taught the first offering of Stanford's CS 231n deep learning course as its primary instructor.
    source_ids: [karpathy-site]
  - date: "2015"
    text: Joined OpenAI as a research scientist and founding member.
    source_ids: [karpathy-site]
  - date: "2017"
    text: Became Director of AI at Tesla, leading the Autopilot computer vision team.
    source_ids: [karpathy-site]
  - date: "2023"
    text: Returned to OpenAI to build a team working on midtraining and synthetic data generation.
    source_ids: [karpathy-site]
  - date: "2024"
    text: Began making educational videos on AI in technical and general-audience tracks.
    source_ids: [karpathy-site]
  - date: "2025-11"
    text: Marked nanoGPT as deprecated in favor of nanochat, a minimal harness for training LLMs end to end.
    source_ids: [nanogpt-readme, nanochat-readme]
