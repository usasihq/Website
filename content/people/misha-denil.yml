headline: Former Google DeepMind research scientist whose work includes data-driven robotics and learned optimizers
bio:
  text: >-
    Misha Denil spent 10 years as a research scientist at Google DeepMind and now describes doing their own
    thing. From 2019 to 2024, Denil's work focused on data-driven robotics, covering learning from
    demonstrations, reward learning, real-world evaluation, and complete agent systems, and Denil is a
    co-author of RoboCat, a self-improving generalist agent for robotic manipulation. Denil is also a
    co-author, with Google DeepMind colleagues, of the 2016 paper Learning to learn by gradient descent by
    gradient descent, which casts the design of optimization algorithms as a learning problem.
  source_ids: [homepage, projects, publications, robocat-paper, l2l-paper]
  reviewed_at: 2026-10-13
