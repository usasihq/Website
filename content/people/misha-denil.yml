sections:
  - heading: Career
    paragraphs:
      - text: >-
          Misha Denil's homepage describes 10 years as a Research Scientist at Google DeepMind, followed
          by a current period of working independently. Denil completed a PhD in the Computer Science
          department at the University of Oxford supervised by Nando de Freitas, after a master's degree
          at the University of British Columbia, where Denil also worked with de Freitas.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          From 2019 to 2024 Denil worked on data-driven robotics, at the meeting point of large-scale
          machine learning and real robots. Denil groups this work into learning from demonstrations,
          reward learning, real-world evaluation and complete agent systems, with papers such as
          Task-Relevant Adversarial Imitation Learning (CoRL 2020), Positive-Unlabeled Reward Learning
          (CoRL 2021, with Danfei Xu) and RoboCat, a self-improving generalist agent for robotic
          manipulation.
        source_ids: [projects, publications, robocat-paper]
      - text: >-
          Earlier projects included learning to learn (2016–2017), among them the paper "Learning to
          learn by gradient descent by gradient descent," which treats the design of optimization
          algorithms as a learning problem, and learning to perform physics experiments with deep
          reinforcement learning (2016). Before that, Denil worked on predicting parameters in deep
          learning, deep learning for natural language processing, and the consistency of random
          forests.
        source_ids: [projects, publications, l2l-paper]
