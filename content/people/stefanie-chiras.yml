sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before Red Hat, Chiras was VP of Offering Management at IBM Cognitive Systems, overseeing worldwide
          business for systems and system software portfolios including AIX, IBM i, Linux and the cloud stack;
          Chiras has written of first getting involved with Linux on IBM's Power Systems team. Chiras joined Red Hat
          to lead the Red Hat Enterprise Linux organization as Senior Vice President and General Manager,
          responsible for the entire product line.
        source_ids: [redhat-bio, sc-blog]
      - text: >-
          In November 2021 Red Hat announced that Chiras would become Senior Vice President of Partner Ecosystem
          Success, leading the company's global partner ecosystem across its full product portfolio. In that role
          Chiras was quoted in Red Hat's May 2022 announcement of partner offerings for Red Hat Enterprise Linux.
        source_ids: [sc-blog, sc-pr]
  - heading: The Open Accelerator
    paragraphs:
      - text: >-
          As Senior Vice President of The Open Accelerator, Chiras leads Red Hat's strategy for engaging with
          regional AI ecosystems, starting with an AI innovation hub. Red Hat's biography says Chiras will lead
          the company's contribution to creating The Open Accelerator, a new AI accelerator for startups,
          building on the ecosystem work of the partner role.
        source_ids: [redhat-bio, redhat-leadership]
