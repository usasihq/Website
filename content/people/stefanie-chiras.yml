headline: Senior Vice President, The Open Accelerator at Red Hat; previously led Red Hat Enterprise Linux
bio:
  text: >-
    Stefanie Chiras is Senior Vice President of The Open Accelerator at Red Hat, responsible for Red Hat's
    strategy for engaging with and catalyzing regional AI ecosystems, beginning with an AI innovation
    hub. Red Hat's biography says Chiras will lead Red Hat's contribution to creating The Open
    Accelerator, a new AI accelerator for startups. Chiras was earlier Senior Vice President of Partner
    Ecosystem Success and Senior Vice President and General Manager of the Red Hat Enterprise Linux
    organization, and before Red Hat was VP of Offering Management at IBM Cognitive Systems, overseeing
    systems and system software portfolios including AIX, IBM i, and Linux.
