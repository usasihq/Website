headline: Co-founder of LlamaIndex; former research scientist at Uber ATG working on self-driving
bio:
  text: >-
    Simon Suo is a co-founder of LlamaIndex, the company behind the open-source LlamaIndex framework for
    building LLM applications over private data. Jerry Liu has written that Suo joined the project about two
    months after it began, and that together they turned it from an exploratory project into a
    comprehensive framework. Before LlamaIndex, Suo was a research scientist at Uber ATG and a PhD student
    at the University of Toronto, publishing on motion forecasting, planning and traffic simulation for
    self-driving.
  source_ids: [llamaindex-home, llamaindex-data-framework, suo-github, suo-site]
  reviewed_at: 2026-10-22
