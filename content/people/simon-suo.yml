sections:
  - heading: Research
    paragraphs:
      - text: >-
          Suo worked as a research scientist at Uber ATG R&D from September 2018 while a PhD student at the
          University of Toronto supervised by Raquel Urtasun, with research in machine learning and
          robotics. Suo's publications include the End-to-end Interpretable Neural Motion Planner (CVPR
          2019), work on scene-consistent motion forecasting (ECCV 2020) and streaming LiDAR object
          detection (CoRL 2020), and TrafficSim (CVPR 2021) as first author.
        source_ids: [suo-site]
  - heading: LlamaIndex
    paragraphs:
      - text: >-
          LlamaIndex's site lists Jerry Liu and Simon Suo as its founders. In a post on building a data
          framework for LLMs, Liu wrote that Suo joined two months into the project and that they developed
          it into a framework for connecting a user's private data with LLMs. The MIT-licensed llama_index
          repository was created in November 2022.
        source_ids: [llamaindex-home, llamaindex-data-framework, llamaindex-repo]
      - text: >-
          At the AI.Engineer Summit in October 2023, Suo led a workshop on building, evaluating and
          optimizing RAG applications for production with LlamaIndex.
        source_ids: [llamaindex-newsletter-2023-10]
