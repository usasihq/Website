sections:
  - heading: Research at Facebook AI Research
    paragraphs:
      - text: >-
          As a research scientist at Facebook AI Research, Guillaume Lample worked on unsupervised machine
          translation, symbolic mathematics and theorem proving. Lample was first author of a 2017 paper on
          translating between languages using only monolingual corpora, and of a 2018 follow-up that proposed
          both neural and phrase-based variants of the approach.
        source_ids: [github-profile, unmt-paper, pbmt-paper]
      - text: >-
          Lample was also first author of XLM (2019), which extends language model pretraining across languages, and a 2019
          paper applying deep learning to symbolic integration and differential equations. In 2022 Lample was
          first author of HyperTree Proof Search, an online training procedure for a transformer-based
          automated theorem prover inspired by AlphaZero.
        source_ids: [xlm-paper, symbolic-paper, htps-paper]
  - heading: Language models
    paragraphs:
      - text: >-
          Lample is one of the equal-contribution authors of the 2023 LLaMA paper from Meta AI, which
          presented a family of foundation language models trained on publicly available data. Mistral AI's
          about page says the company was started in April 2023, with Lample as co-founder and Chief Science
          Officer.
        source_ids: [llama-paper, mistral-about]
      - text: >-
          At Mistral AI, Lample co-authored the papers for Mistral 7B (2023) and the sparse mixture-of-experts
          model Mixtral (2024), both released under the Apache 2.0 license, and is listed among the authors of
          the 2025 report on Magistral, a reasoning model trained with reinforcement learning.
        source_ids: [mistral7b-paper, mixtral-paper, magistral-paper]
