headline: Co-founder and Chief Science Officer of Mistral AI; equal-contribution author of Meta's LLaMA paper
bio:
  text: >-
    Guillaume Lample is a co-founder and the Chief Science Officer of Mistral AI, according to the
    company's about page. Lample's GitHub profile lists a research scientist role at Facebook AI
    Research, working on unsupervised machine translation, symbolic mathematics, and theorem proving.
    Lample is one of the equal-contribution authors of LLaMA: Open and Efficient Foundation Language
    Models (2023), written at Meta AI, and first author of papers on unsupervised machine translation
    (2017), cross-lingual language model pretraining (XLM, 2019), and deep learning for symbolic
    mathematics (2019). Lample co-authored the Mistral 7B and Mixtral of Experts papers, which say the
    models are released under the Apache 2.0 license.
  source_ids: [mistral-about, github-profile, llama-paper, unmt-paper, xlm-paper, symbolic-paper, mistral7b-paper, mixtral-paper]
  reviewed_at: 2026-10-13
