sections:
  - heading: Career
    paragraphs:
      - text: >-
          Danilevsky's IBM Research profile records a PhD in computer science from the University of Illinois at
          Urbana-Champaign in 2014, with research in data mining supervised by Jiawei Han. Danilevsky is now a
          senior research scientist and manager for core language and conversational technologies at IBM
          Research, working on generative language models, evaluation and human-in-the-loop approaches. The
          profile also lists patents on topics including cross-lingual information extraction, table recognition
          in PDF documents, explainable rules learned with deep learning, and relevance modeling and
          clarification in conversational systems.
        source_ids: [ibm-research-profile]
  - heading: Research
    paragraphs:
      - text: >-
          In 2020 Danilevsky was first author of "A Survey of the State of Explainable AI for Natural Language
          Processing", with co-authors including Ranit Aharonov and Yannis Katsis. Danilevsky also
          co-authored Label Sleuth (2022), an open-source, no-code system for labeling text and building text
          classifiers.
        source_ids: [xai-survey-paper, label-sleuth-paper]
      - text: >-
          More recent work centers on evaluating retrieval-augmented generation (RAG). Danilevsky is the last
          author of MTRAG (2025), a human-generated benchmark of multi-turn RAG conversations published with its
          data in an Apache-2.0 repository, and co-authored the 2026 follow-ups MTRAG-UN and the SemEval-2026
          shared task MTRAGEval. Related papers include InspectorRAGet, an introspection platform for RAG
          evaluation (NAACL 2025), and a CHI 2025 paper on the difficulty of creating conversational datasets for
          RAG applications.
        source_ids: [mtrag-paper, mtrag-repo, ibm-research-profile]
