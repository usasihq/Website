headline: Senior Research Scientist and manager at IBM Research; co-author of the MTRAG multi-turn RAG benchmark
bio:
  text: >-
    Marina Danilevsky is a Senior Research Scientist and Manager for core language and conversational
    technologies at IBM Research, working on generative language models, evaluation, and
    human-in-the-loop approaches. Danilevsky is the last author of MTRAG, a human-generated benchmark of
    multi-turn retrieval-augmented generation conversations whose data and corpora IBM publishes in an
    Apache-2.0 repository, and a co-author of the follow-up MTRAG-UN benchmark. Danilevsky is also among
    the authors of Label Sleuth, an open-source no-code system for labeling text and building text
    classifiers.
  source_ids: [ibm-research-profile, mtrag-paper, mtrag-repo, label-sleuth-paper]
  reviewed_at: 2026-10-21
