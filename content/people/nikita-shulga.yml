    contribution: >-
      Listed as a PyTorch core maintainer and as a maintainer of the Apple M1/MPS/Metal backend and
      Build + CI; the PyTorch CODEOWNERS file names Shulga as an owner of the MPS and Metal source
      directories and of the CODEOWNERS file itself. The repository is under a BSD-style license.
    source_ids: [pytorch-maintainers, pytorch-codeowners, pytorch-license]
