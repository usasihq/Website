  - label: GitHub
    url: https://github.com/malfet
sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Shulga is one of PyTorch's core maintainers, and the project's governance documentation also names
          Shulga as a maintainer for two areas: the Apple M1/MPS/Metal backend and Build + CI. The repository's CODEOWNERS file assigns Shulga ownership of the MPS and
          Metal source directories.
        source_ids: [pytorch-maintainers, pytorch-codeowners]
      - text: >-
          A 2025 PyTorch event page described Shulga as a software engineer at Meta responsible, among other
          things, for PyTorch releases and continuous integration, and as a core maintainer.
        source_ids: [pt27-qa]
  - heading: Releases and community
    paragraphs:
      - text: >-
          Shulga has presented PyTorch releases to the community in live question-and-answer sessions,
          including PyTorch 2.7 in April 2025, PyTorch 2.10 in January 2026 and PyTorch 2.11 in March 2026. For the
          PyTorch 2.14 session in September 2026, which covered updates to Inductor, distributed training, dynamic
          shapes and Apple Silicon support, the event page lists Shulga with Thinking Machines Lab.
        source_ids: [pt27-qa, pt210-qa, pt211-qa, pt214-qa]
