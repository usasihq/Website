headline: PyTorch core maintainer for the Apple MPS/Metal backend and for PyTorch's build and CI
bio:
  text: >-
    Nikita Shulga is a PyTorch core maintainer, and PyTorch's maintainers page also lists Shulga as
    a maintainer of the Apple M1/MPS/Metal backend and of Build + CI. PyTorch's March 2026 release
    Q&A page described Shulga as a Software Engineer at Meta who maintains an MPS/Metal backend, and
    an April 2025 page credited Shulga with responsibility for PyTorch releases and continuous
    integration. The page for the PyTorch 2.14 release Q&A in September 2026 lists Shulga with
    Thinking Machines Lab.
  source_ids: [pytorch-maintainers, pt211-qa, pt27-qa, pt214-qa]
  reviewed_at: 2026-10-21
