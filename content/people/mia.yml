slug: mia
name: Mia
initials: M
groups: [local, open-source]
specialties: [inference]
headline: Developer of local model deployment recipes and the sparkDash monitoring dashboard
bio:
  text: >-
    Mia is a developer who publishes recipes for deploying and tuning AI models
    on local hardware through Mia's AI Lab. Mia's GLM-5.3 Flash recipe combines
    vLLM serving with launch scripts and documented measurements for NVIDIA DGX
    Spark systems. Mia also publishes sparkDash, a dashboard for monitoring
    hardware and local model servers.
  source_ids: [personal-site, glm-recipe, sparkdash-repo]
affiliations:
  - name: Mia's AI Lab
    organization_slug: null
    role: Developer
    current: true
    source_ids: [personal-site]
work:
  - name: Local deployment recipes using vLLM
    artifact_slug: vllm
    url: https://github.com/MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks
    contribution: >-
      Publishes a GLM-5.3 Flash deployment recipe with vLLM launch scripts,
      configuration guidance, and performance measurements, credited to Mia's
      AI Lab and the community. This is independent deployment work using
      vLLM. The recipe's code and documentation use AGPL-3.0, with earlier
      contributions under MIT; model weights retain separate terms.
    source_ids: [personal-site, glm-recipe]
  - name: sparkDash
    artifact_slug: null
    url: https://github.com/MiaAI-Lab/sparkDash
    contribution: >-
      Publishes a monitoring dashboard for NVIDIA DGX Spark systems and other
      Linux hosts with NVIDIA GPUs, including hardware and local model-server
      metrics. The repository identifies Mia's AI Lab as the author and lists
      an Apache-2.0 license.
    source_ids: [sparkdash-repo]
  - name: Engine-Aware Quantization (EAQ)
    artifact_slug: null
    url: https://mia-ai.net/eaq
    contribution: >-
      Develops EAQ, a quantization framework designed around how the TensorFold engine runs models
      and tuned for coding, agent, and tool-calling work; its first target is GLM 5.3 Flash, and it
      is still in validation and not yet public.
    source_ids: [eaq]
links:
  - label: Website
    url: https://mia-ai.net/
  - label: GitHub
    url: https://github.com/MiaAI-Lab
sections:
  - heading: Products and projects
    paragraphs:
      - text: >-
          Mia's AI Lab publishes free, open-source recipes for running open-weight models on NVIDIA
          DGX Spark systems and RTX GPUs, each run on Mia's own hardware with the launch scripts,
          patches, and benchmarks posted on GitHub. Recent recipes cover DeepSeek V4 Flash, GLM 5.3
          Flash, and Qwen3.8 Flash Next on one or two DGX Sparks, several of them served with the
          TensorFold engine.
        source_ids: [personal-site, deepseek-recipe, glm-recipe, glm-tensorfold-recipe, qwen-recipe]
      - text: >-
          Mia also builds tools for the lab. sparkDash is a monitoring dashboard for multiple DGX
          Spark systems, and Engine-Aware Quantization is a research framework, still in validation,
          that judges a quantized model against the original on what it writes and on the decisions an
          agent makes.
        source_ids: [sparkdash-repo, eaq]
  - heading: Model comparisons
    paragraphs:
      - text: >-
          Beyond deployment recipes, Mia runs open-weight and closed frontier models side by side on
          the same prompts, one attempt each, and publishes every raw output to show where each model
          succeeds or fails. The site also hosts a community tier list of models.
        source_ids: [personal-site]
