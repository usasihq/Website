sections:
  - heading: Career
    paragraphs:
      - text: >-
          Swayamdipta received a PhD from Carnegie Mellon University in 2019, advised by Noah A. Smith and
          Chris Dyer, and was then a postdoctoral researcher at the Allen Institute for AI and the University
          of Washington, working with Yejin Choi. Since fall 2022 Swayamdipta has been an assistant professor
          of computer science at USC, where Swayamdipta leads the Datasets, Interpretability, Language and
          Learning (DILL) Lab.
        source_ids: [usc-faculty]
  - heading: Research
    paragraphs:
      - text: >-
          Swayamdipta's work has focused on estimating dataset quality and finding and reducing undesirable
          biases in data and models. Papers in this line include "Annotation Artifacts in Natural Language
          Inference Data" (2018), Dataset Cartography (2020) and "Understanding Dataset Difficulty with
          V-Usable Information" (2021); Swayamdipta also co-authored "Don't Stop Pretraining" (2020) and
          MAUVE (2021), a measure of the gap between machine-written and human text.
        source_ids: [usc-faculty, artifacts-paper, cartography-paper, vusable-paper, dont-stop-paper, mauve-paper]
      - text: >-
          Current directions listed on Swayamdipta's site are robust evaluation of language models' generative
          capabilities, the mechanisms and geometry of language models, and private, safe human-AI
          collaboration in high-stakes settings. Recent papers include an ICML 2026 spotlight on the
          relationship between Transformer weight geometry and performance and an ACL 2026 study of
          language-model assistants for public health data annotation.
        source_ids: [swabha-site]
