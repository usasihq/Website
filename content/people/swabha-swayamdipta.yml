headline: USC Gabilan Assistant Professor and Amazon Scholar; first author of Dataset Cartography
bio:
  text: >-
    Swabha Swayamdipta is a Gabilan Assistant Professor of computer science at USC Viterbi, Associate
    Director of the USC Center for AI and Society, and an Amazon Scholar. Swayamdipta's research aims
    at robust and reliable evaluation of language models' generative capabilities, understanding the
    mechanisms that drive language models, and private and safe human-AI collaboration for high-stakes
    applications. Swayamdipta is first author of Dataset Cartography, which introduces data maps that
    use a model's training dynamics to characterize and diagnose datasets; its code is published in the
    Apache-2.0 allenai/cartography repository.
  source_ids: [swabha-site, cartography-paper, cartography-repo]
  reviewed_at: 2026-10-21
