headline: Research scientist in Meta Superintelligence Labs; former OLMo evaluation lead at Ai2
bio:
  text: >-
    Jesse Dodge is a research scientist in Meta Superintelligence Labs. From 2019 to 2025 Dodge was
    at Ai2, where Dodge led the evaluation team for OLMo and was research lead of the Ai2
    Playground, which includes OLMoTrace for tracing model outputs back to training data. Dodge's
    work covers building and evaluating large language models, documenting web-scale pretraining
    datasets such as Dolma, and the environmental impact of AI. Dodge is a co-author of both the
    OLMo and Dolma papers.
  source_ids: [dodge-site, olmo-paper, dolma-paper]
  reviewed_at: 2026-10-13
