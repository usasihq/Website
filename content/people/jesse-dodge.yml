sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jesse Dodge earned a PhD from the Language Technologies Institute at Carnegie Mellon
          University in 2020, advised by Noah Smith. During doctoral study, Dodge interned at Facebook
          AI Research in 2015, building the Movie Dialog and MovieQA datasets, and at Google AI in
          2018 with the MorphNet team.
        source_ids: [dodge-about]
      - text: >-
          Dodge joined the Allen Institute for AI in 2019 and stayed until 2025, working on the
          AllenNLP team and later leading the OLMo evaluation team and serving as research lead of
          Ai2's Playground. Dodge is now a research scientist in Meta Superintelligence Labs.
        source_ids: [dodge-site, dodge-about]
  - heading: Research
    paragraphs:
      - text: >-
          Dodge's research centers on building and evaluating open language models. Dodge
          contributed to OLMo, Ai2's project to create fully open large language models, including
          the Dolma pretraining corpus and the DataDecide evaluation framework, and co-authored What's
          In My Big Data?, a toolkit for examining the contents of pretraining datasets.
        source_ids: [dodge-about, olmo-paper, dolma-paper, wimbd-paper]
      - text: >-
          A second line of work measures the computational cost of AI. Dodge has studied the
          environmental impact of AI systems, including a 2025 paper that evaluates the impact of
          creating language models across the full development process.
        source_ids: [dodge-about, env-impact-paper]
  - heading: Research community
    paragraphs:
      - text: >-
          Dodge created the NLP Reproducibility Checklist, filled out by submissions to EMNLP 2020,
          NAACL 2021, ACL 2021, and EMNLP 2021, and helped create the Responsible NLP Checklist used
          across ACL Rolling Review. Dodge also organized the ML Reproducibility Challenge in 2020 and
          2021 and served as Reproducibility Chair at NAACL 2022.
        source_ids: [dodge-about]
