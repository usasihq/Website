headline: Bloomberg managing editor for Global Consumer Technology; writes Power On and hosts its podcast
bio:
  text: >-
    Mark Gurman is Bloomberg's managing editor for Global Consumer Technology and chief
    correspondent on Apple. Mark writes the weekly Power On newsletter about Apple and consumer
    technology, and since September 2026 has hosted the Power On podcast, a weekly show on Apple
    news and releases and developments at other consumer tech companies such as Samsung, Google,
    Amazon, and Meta.
