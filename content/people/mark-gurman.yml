sections:
  - heading: Coverage
    paragraphs:
      - text: >-
          Gurman reports for Bloomberg News as managing editor for Global Consumer Technology and chief
          correspondent on Apple, and writes the weekly Power On newsletter. Bloomberg describes the newsletter as
          a source of reporting and analysis on Apple and the wider consumer technology industry.
        source_ids: [power-on-podcast, bloomberg-law-author]
      - text: >-
          In September 2026 Bloomberg extended the newsletter into Power On, a weekly video and audio podcast
          hosted by Gurman. Episodes, released each Thursday, cover news and product releases from Apple as well
          as developments at Samsung, Google, Amazon and Meta, with guests from the consumer technology industry
          and from Bloomberg.
        source_ids: [power-on-podcast]
