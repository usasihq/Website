headline: Member of Profluent's machine learning team; co-author of the Profluent-E1 and ProGen3 protein model preprints
bio:
  text: >-
    Jeffrey A. Ruffolo is a member of the machine learning team at Profluent, which builds AI models for protein
    design. Profluent's team page says that while studying molecular biophysics at Johns Hopkins, Ruffolo
    developed machine learning models for antibody structure prediction and antibody-specific
    language models. Ruffolo is a co-author of the Profluent-E1 protein encoder preprint and the ProGen3
    scaling preprint.
  source_ids: [profluent-team, e1-preprint, progen3-preprint]
  reviewed_at: 2026-10-22
