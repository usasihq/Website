sections:
  - heading: Research
    paragraphs:
      - text: >-
          At Johns Hopkins, Ruffolo worked on machine learning for antibodies. In December 2021 Ruffolo was
          first author, with Jeffrey J. Gray and Jeremias Sulam, of a paper on deciphering antibody affinity
          maturation with language models and weakly supervised learning.
        source_ids: [profluent-team, antiberty-paper]
      - text: >-
          At Profluent, Ruffolo co-authored the April 2025 preprint accompanying the ProGen3 protein
          generation models and the November 2025 preprint introducing E1, a family of retrieval-augmented
          protein encoders released for research and commercial use.
        source_ids: [progen3-preprint, e1-preprint, profluent-e1]
