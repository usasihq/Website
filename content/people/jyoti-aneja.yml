sections:
  - heading: Career
    paragraphs:
      - text: >-
          Aneja trained in physics before moving to machine learning, earning master's degrees in physics and
          then a PhD at the University of Illinois Urbana-Champaign in 2021, advised by Alex Schwing and working
          closely with David Forsyth. Aneja joined Microsoft Research in November 2021, with research at the
          intersection of computer vision, deep learning and natural language processing.
        source_ids: [aneja-site, msr-aneja]
  - heading: Phi models
    paragraphs:
      - text: >-
          Aneja's site lists core contributions to Microsoft's Phi-1, Phi-2, Phi-3 and Phi-4 small language
          models, and Aneja appears on the author list of the December 2024 Phi-4 technical report. Aneja
          co-led Phi-4-reasoning-vision-15B, a compact open-weight multimodal reasoning model; the March 2026
          Microsoft Research post by Aneja and colleagues describes its vision encoder and image-processing
          choices, data curation, and the use of a mixture of reasoning and non-reasoning training data.
        source_ids: [aneja-site, phi4-report, p4rv-blog]
