headline: Member of Technical Staff at Microsoft Research AI Frontiers; co-lead of Phi-4-reasoning-vision-15B
bio:
  text: >-
    Jyoti Aneja is a Member of Technical Staff on the Microsoft Research AI Frontiers team. Aneja's
    site says Aneja co-led Phi-4-reasoning-vision, a 15B multimodal reasoning model, and was a core
    contributor to Phi-4, Phi-3, Phi-2 and Phi-1. Aneja is the first-listed author of the
    Phi-4-reasoning-vision-15B technical report and of the March 2026 Microsoft Research blog post on
    lessons from training the model. Aneja joined Microsoft in November 2021 after a PhD at the
    University of Illinois Urbana-Champaign advised by Alex Schwing.
  source_ids: [aneja-site, msr-aneja, p4rv-blog]
  reviewed_at: 2026-10-22
