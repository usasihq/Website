headline: Co-founder and CEO of Reka and associate professor of computer science at USC
bio:
  text: >-
    Dani Yogatama is a co-founder and the CEO of Reka and an associate professor in the Department of Computer
    Science at the University of Southern California. Yogatama was previously a senior staff research scientist at
    DeepMind from 2016 to 2022, and is a co-author of the 2024 Reka technical report that introduced the Reka Core,
    Flash and Edge multimodal language models.
  source_ids: [yogatama-site, reka-tech-report]
  reviewed_at: 2026-10-22
