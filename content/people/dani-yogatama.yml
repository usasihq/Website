sections:
  - heading: Career
    paragraphs:
      - text: >-
          Yogatama received a PhD from Carnegie Mellon University (2010 to 2015), advised by Noah Smith as a member of
          Noah's ARK. Yogatama then worked at the Baidu Silicon Valley AI Lab (2015 to 2016) and at DeepMind (2016 to 2022), where
          Yogatama was a senior staff research scientist.
        source_ids: [yogatama-site]
      - text: >-
          Yogatama is now a co-founder and the CEO of Reka, and an associate professor of computer science at the
          University of Southern California.
        source_ids: [yogatama-site]
  - heading: Research
    paragraphs:
      - text: >-
          Publications and news listed on Yogatama's site include work on semiparametric language models, random feature attention (ICLR 2021), episodic memory, and
          the cross-lingual transferability of monolingual representations (ACL 2020).
        source_ids: [yogatama-site, rfa-paper]
      - text: >-
          At Reka, Yogatama co-authored the 2024 technical report on Reka Core, Flash and Edge, multimodal language
          models trained from scratch that take text, image, video and audio inputs.
        source_ids: [reka-tech-report]
