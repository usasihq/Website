headline: Co-founder and CEO of Skild AI; Raj Reddy Associate Professor at Carnegie Mellon University
bio:
  text: >-
    Deepak Pathak is a co-founder and the CEO of Skild AI, which is developing a foundation model
    for robotics, and the Raj Reddy Associate Professor in Carnegie Mellon University's School of
    Computer Science. Pathak's research sits at the intersection of computer vision, machine
    learning and robotics, with a focus on agents that learn from raw sensory data.
  source_ids: [pathak-site]
  reviewed_at: 2026-10-21
