work:
  - name: Curiosity-driven exploration by self-supervised prediction
    artifact_slug: null
    url: https://arxiv.org/abs/1705.05363
    contribution: >-
      First author of a 2017 paper that uses an agent's error in predicting the consequences of its
      own actions as an intrinsic reward for exploration.
    source_ids: [curiosity-paper]
  - name: LocoFormer
    artifact_slug: null
    url: https://arxiv.org/abs/2509.23745
    contribution: >-
      Co-author of a 2025 paper on a generalist locomotion policy that adapts by accumulating
      experience in a long context, which Skild AI cites as its in-context learner for locomotion.
    source_ids: [locoformer-paper, skild-s1]
links:
