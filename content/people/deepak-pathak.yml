sections:
  - heading: Career
    paragraphs:
      - text: >-
          Pathak's site lists a PhD from UC Berkeley advised by Alyosha Efros and Trevor Darrell, a
          visiting postdoctoral appointment at UC Berkeley with Pieter Abbeel, and a year as a
          researcher at Meta AI Research. Pathak now holds the Raj Reddy chair at Carnegie Mellon,
          awarded in 2024, as a member of the Robotics Institute.
        source_ids: [pathak-site]
      - text: >-
          As co-founder and CEO of Skild AI, Pathak leads work on a single robot "brain" meant to
          operate many robot bodies and tasks. Skild AI has introduced S1, a robotic foundation
          model built as an in-context learner that executes a task after being shown a video.
        source_ids: [pathak-site, skild-s1]
  - heading: Research
    paragraphs:
      - text: >-
          Pathak's group draws on psychology to build systems that learn using data as their own
          supervision. Early work on curiosity-driven exploration used prediction error as an
          intrinsic reward, and later work with students covered legged locomotion over difficult
          terrain using egocentric vision.
        source_ids: [pathak-site, curiosity-paper, terrain-paper]
      - text: >-
          Skild AI's technical writing on its general-purpose robot brain cites several of Pathak's
          papers, including work on zero-shot visual imitation and on learning robot affordances
          from human videos.
        source_ids: [skild-brain-blog]
