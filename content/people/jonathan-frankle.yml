headline: Chief AI Scientist at Databricks; first author of the lottery ticket hypothesis paper; MosaicML founding team
bio:
  text: >-
    Jonathan Frankle is Chief AI Scientist at Databricks, where Frankle leads research projects on
    reinforcement learning, model training and agent evaluation; Frankle arrived through Databricks'
    acquisition of MosaicML, where Frankle was a member of the founding team. Frankle completed a PhD in
    computer science at MIT in 2023, and the main line of that research was the lottery ticket
    hypothesis, introduced in a 2018 paper with Michael Carbin, which studies how small neural networks
    can be during training. Frankle is a bylined author of Databricks' March 2024 post announcing the
    DBRX model and a co-author of the MosaicBERT paper on fast pretraining of a bidirectional encoder.
