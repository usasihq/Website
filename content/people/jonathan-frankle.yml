sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jonathan Frankle completed a PhD in computer science at MIT in 2023, where the main line of
          research was the lottery ticket hypothesis. Frankle was a member of MosaicML's founding team and
          joined Databricks when it acquired MosaicML.
        source_ids: [frankle-site, dais-frankle]
      - text: >-
          As Chief AI Scientist at Databricks, Frankle leads research projects on reinforcement learning,
          model training, and agent evaluation. Frankle's homepage describes Mosaic Research at Databricks
          as sharing its work through blog posts, open-source repositories such as Composer, Streaming,
          LLM Foundry, and MegaBlocks, and open models such as DBRX and MPT.
        source_ids: [frankle-site]
      - text: >-
          Frankle also works on technology policy, including with the OECD on implementing the AI
          Principles developed in 2019. Earlier, Frankle was the inaugural Staff Technologist at the
          Center on Privacy and Technology at Georgetown Law and co-developed a course on Computer
          Programming for Lawyers with Paul Ohm.
        source_ids: [frankle-site]
  - heading: Research
    paragraphs:
      - text: >-
          The lottery ticket hypothesis, introduced in a March 2018 paper with Michael Carbin, studies how
          large neural networks need to be in order to train. Frankle's homepage summarizes the finding
          that networks can be as small for much or all of training as they can be made after training.
          Follow-up work includes Linear Mode Connectivity and the Lottery Ticket Hypothesis (2019) and
          The Early Phase of Neural Network Training (2020).
        source_ids: [lth-paper, frankle-site, lmc-paper, early-phase-paper]
      - text: >-
          More broadly, Frankle studies the behavior of practical neural networks empirically, posing
          hypotheses and testing them with large-scale experiments. At Databricks, Frankle is the
          first-listed author of the March 2024 post announcing DBRX, and co-authored the December 2023
          MosaicBERT paper on a bidirectional encoder optimized for fast pretraining.
        source_ids: [frankle-site, dbrx-post, mosaicbert-paper]
