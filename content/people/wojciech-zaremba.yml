sections:
  - heading: Research
    paragraphs:
      - text: >-
          Zaremba's early papers, several with Ilya Sutskever, appeared in 2013 and 2014. "Intriguing properties
          of neural networks" (2013), with Christian Szegedy and others, showed that imperceptible perturbations can cause a network to misclassify an image;
          "Recurrent Neural Network Regularization" (2014), with Sutskever and Oriol Vinyals, showed how to apply
          dropout to LSTMs; and "Learning to Execute" (2014) trained recurrent networks to evaluate short
          computer programs.
        source_ids: [adversarial-paper, rnn-regularization-paper, learning-to-execute-paper]
      - text: >-
          Zaremba co-authored the OpenAI Gym toolkit for reinforcement learning research (2016) and
          robotics work including domain randomization for transferring networks trained in simulation to the
          real world (2017) and "Solving Rubik's Cube with a Robot Hand" (2019). Zaremba was the last-listed
          author of the 2021 paper introducing Codex and the HumanEval benchmark for code generation.
        source_ids: [gym-paper, domain-randomization-paper, rubiks-paper, codex-paper]
  - heading: OpenAI Foundation
    paragraphs:
      - text: >-
          In March 2026, the OpenAI Foundation announced that Zaremba, a co-founder of OpenAI, was joining as
          Head of AI Resilience. The program's initial areas are AI's effects on young people, biosecurity and AI
          model safety, including support for independent testing and evaluation and for foundational safety
          research. Zaremba set out the program's approach in the June 2026 essay "Resilience in the age of AI".
        source_ids: [oaif-update, oaif-resilience]
