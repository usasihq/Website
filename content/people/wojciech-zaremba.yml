headline: OpenAI co-founder; Head of AI Resilience at the OpenAI Foundation
bio:
  text: >-
    Wojciech Zaremba is a co-founder of OpenAI and Head of AI Resilience at the OpenAI Foundation,
    which announced in March 2026 that Zaremba was joining to lead that work. The Foundation says
    its AI Resilience program initially focuses on AI's impact on young people, biosecurity, and
    AI model safety, and Zaremba wrote its June 2026 essay "Resilience in the age of AI".
    Zaremba is a co-author of the 2016 OpenAI Gym paper, which introduced a toolkit for
    reinforcement learning research, and the last-listed author of the 2021 paper that introduced
    Codex and the HumanEval evaluation set.
  source_ids: [oaif-update, oaif-resilience, gym-paper, codex-paper]
  reviewed_at: 2026-10-19
