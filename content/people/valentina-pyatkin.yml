headline: Researcher at the ETH AI Center working on LLM post-training; core contributor to Tülu 3
bio:
  text: >-
    Valentina Pyatkin is a researcher at the ETH AI Center, working on post-training of large language
    models for the Swiss AI Initiative and contributing to Apertus. Pyatkin was previously a postdoctoral
    researcher at the Allen Institute for AI (Ai2) and the University of Washington, where Pyatkin worked
    on open post-training efforts including Tülu 3 and contributed to OLMo. Pyatkin is the third author
    of the Tülu 3 report and has built benchmarks such as RewardBench and IFBench.
  source_ids: [pyatkin-site, tulu3-paper]
  reviewed_at: 2026-10-22
