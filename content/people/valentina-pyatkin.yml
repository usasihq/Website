sections:
  - heading: Career
    paragraphs:
      - text: >-
          Pyatkin completed a PhD in computer science at the NLP lab of Bar-Ilan University, supervised by Ido
          Dagan and Reut Tsarfaty, and interned twice at Ai2. Pyatkin then held a postdoctoral position at Ai2
          and the University of Washington, advised by Hannaneh Hajishirzi and Yejin Choi.
        source_ids: [pyatkin-site]
      - text: >-
          Pyatkin is now a researcher at the ETH AI Center, working on post-training of language models for
          the Swiss AI Initiative and contributing to the Apertus models.
        source_ids: [pyatkin-site]
  - heading: Research
    paragraphs:
      - text: >-
          Pyatkin's research centres on post-training and adaptation of language models, including how models
          follow instructions and constraints and how preference and reward signals shape their behaviour. At
          Ai2, Pyatkin worked on the Tülu post-training pipelines, which combine supervised finetuning, direct
          preference optimization and reinforcement learning with verifiable rewards, and contributed to OLMo
          and OLMo 2.
        source_ids: [pyatkin-site, tulu3-paper]
      - text: >-
          Pyatkin has also built evaluation benchmarks, including RewardBench and IFBench, and co-authored
          RewardBench 2, published at ICLR 2026.
        source_ids: [pyatkin-site]
