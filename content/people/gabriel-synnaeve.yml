sections:
  - heading: Career
    paragraphs:
      - text: >-
          Gabriel Synnaeve's PhD work, supervised by Pierre Bessière, applied Bayesian modeling to
          StarCraft AI research. From 2013 to 2015 Synnaeve was a postdoctoral researcher at the École
          Normale Supérieure, modeling language acquisition and working on weakly supervised deep
          learning for acoustic modeling.
        source_ids: [synnaeve-cv]
      - text: >-
          Synnaeve joined Facebook AI Research as a postdoctoral researcher in 2015 and became a
          research scientist in 2016, working on end-to-end speech recognition and reinforcement
          learning benchmarks. From 2017 to 2019 Synnaeve was a research scientist and manager who
          tech-led a StarCraft: Brood War bot research project, and from 2019 to 2021 worked on robust
          and semi-supervised speech recognition and object detection with transformers, becoming a
          senior staff research scientist in 2021.
        source_ids: [synnaeve-cv, meta-profile]
      - text: >-
          Since 2021 Synnaeve has been a research scientist manager at FAIR, managing speech and audio
          work, audio compression and audio self-supervised learning while also doing individual
          research on code generation and translation. An October 2026 paper lists Synnaeve with Meta
          Superintelligence Labs.
        source_ids: [synnaeve-cv, plasticity-pdf]
  - heading: Research and open-source work
    paragraphs:
      - text: >-
          With Ronan Collobert and Christian Puhrsch, Synnaeve co-authored Wav2Letter (2016), an
          end-to-end convolutional speech recognition system released in the wav2letter repository
          (since consolidated into Flashlight), and later co-authored the 2022 paper on Flashlight, a C++ machine learning
          library. Synnaeve was also a co-author of DETR (2020), which frames object detection as a
          direct set prediction problem with transformers.
        source_ids: [wav2letter-paper, wav2letter-repo, flashlight-paper, flashlight-repo, detr-paper]
      - text: >-
          In audio, Synnaeve co-authored EnCodec (2022), a neural audio codec, and MusicGen (2023), a
          text-conditioned music generation model, both released through Meta's AudioCraft library. In
          code generation, Synnaeve is the last author of Code Llama (2023) and a co-author of CWM
          (2025), an open-weights language model from the FAIR CodeGen team for research on code
          generation with world models.
        source_ids: [encodec-paper, musicgen-paper, audiocraft-repo, codellama-paper, cwm-paper]
