headline: Research scientist at Meta; last author of Code Llama and co-author of Wav2Letter, EnCodec, and MusicGen
bio:
  text: >-
    Gabriel Synnaeve is a research scientist at Meta. Meta's AI people page places Synnaeve on the
    FAIR team, which Synnaeve joined as a postdoctoral researcher in 2015, and an October 2026 paper
    lists Synnaeve with Meta Superintelligence Labs. Synnaeve's CV describes FAIR
    work on end-to-end speech recognition and a StarCraft AI research project, and later work as a
    research scientist manager on speech and audio and audio compression, alongside individual
    research on code generation.
    Synnaeve is the last author of the Code Llama paper, which says the models are released under a
    permissive license for research and commercial use, and co-authored Wav2Letter with Ronan
    Collobert as well as the EnCodec and MusicGen audio papers.
  source_ids: [meta-profile, plasticity-pdf, synnaeve-cv, codellama-paper, wav2letter-paper, encodec-paper, musicgen-paper]
  reviewed_at: 2026-10-13
