headline: Creator of Two Minute Papers, a video series sharing new research, including AI research
bio:
  text: >-
    Károly Zsolnai-Fehér makes Two Minute Papers, a video series started in 2015 to share cutting-edge
    research, including coverage of AI. Károly's personal site describes
    them as an independent scientist and lists a PhD in computer graphics and machine learning from the
    Vienna University of Technology. The site also lists research publications in light transport and
    material synthesis, including work in ACM Transactions on Graphics (SIGGRAPH 2018), and a 2022
    article in Nature Physics.
