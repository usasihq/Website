sections:
  - heading: Career
    paragraphs:
      - text: >-
          The TU Wien Research Unit of Computer Graphics lists Károly Zsolnai-Fehér as a former member
          of its Rendering and Modeling workgroup, employed there from February 2013 until February 2020.
          Károly's doctoral thesis there, Photorealistic Material Learning and Synthesis, was supervised
          by Michael Wimmer and spans 2013 to 2019. In 2016 Károly gave an invited talk to Intel's
          Advanced Rendering Technology group titled Real-time Subsurface Scattering, Light Transport
          and Two Minute Papers.
        source_ids: [cg-staff]
  - heading: Research
    paragraphs:
      - text: >-
          Károly's research centers on light transport and the appearance of materials in rendered
          images. With Jorge Jimenez, Diego Gutierrez and other collaborators, Károly co-authored
          Separable Subsurface Scattering, published in Computer Graphics Forum in 2015. Gaussian
          Material Synthesis, written with Peter Wonka and Michael Wimmer, appeared in ACM Transactions
          on Graphics for SIGGRAPH 2018, and the research unit's news listing notes that the paper was
          on the journal's cover.
        source_ids: [cg-staff]
      - text: >-
          A follow-up paper with the same co-authors, Photorealistic Material Editing Through Direct
          Image Manipulation, appeared in Computer Graphics Forum in June 2020. With Christian Freude,
          Hiroyuki Sakai and Michael Wimmer, Károly also worked on ways to compare Monte Carlo
          renderings, including the R-Score technical report (2020) and a 2023 conference paper on
          sampling-distribution-based evaluation.
        source_ids: [cg-staff]
