    source_ids: [cg-staff]
  - date: "2018-08"
    text: Published Gaussian Material Synthesis in ACM Transactions on Graphics (SIGGRAPH 2018) as lead author.
    source_ids: [cg-staff]
  - date: "2019"
    text: Completed the PhD thesis Photorealistic Material Learning and Synthesis, supervised by Michael Wimmer.
    source_ids: [cg-staff]
  - date: "2020-06"
    text: Published Photorealistic Material Editing Through Direct Image Manipulation in Computer Graphics Forum.
    source_ids: [cg-staff]
  - date: "2023"
    text: Co-authored Sampling-Distribution-Based Evaluation for Monte Carlo Rendering in the 2023 proceedings of the International Joint Conference on Computer Vision, Imaging and Computer Graphics Theory and Applications.
    source_ids: [cg-staff]
