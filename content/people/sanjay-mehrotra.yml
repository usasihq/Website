headline: Chairman and CEO of Micron Technology; SanDisk co-founder with foundational flash memory patents
bio:
  text: >-
    Sanjay Mehrotra is the Chairman and Chief Executive Officer of Micron Technology, the memory and
    storage company, which Mehrotra joined in 2017. Mehrotra co-founded SanDisk, led it from its
    start-up in 1988 until its sale in 2016, and holds more than 70 patents, several of them
    foundational to high-capacity flash memory.
