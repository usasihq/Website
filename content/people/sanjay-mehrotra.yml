sections:
  - heading: Career
    paragraphs:
      - text: >-
          Mehrotra held engineering and leadership positions at Integrated Device Technology, SEEQ
          Technology and Intel before co-founding SanDisk. Mehrotra led SanDisk from its start-up
          in 1988 until its sale in 2016, serving as president and CEO from 2011.
        source_ids: [micron-leadership]
      - text: >-
          Mehrotra joined Micron in 2017 and serves as its Chairman and CEO. Mehrotra also serves on the board of the
          Semiconductor Industry Association.
        source_ids: [micron-leadership]
  - heading: Technical work
    paragraphs:
      - text: >-
          Micron's biography credits Mehrotra with more than 70 patents, several foundational to
          high-capacity flash memory, and with published articles on nonvolatile memory design and
          flash memory systems.
        source_ids: [micron-leadership]
