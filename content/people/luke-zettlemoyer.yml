sections:
  - heading: Career
    paragraphs:
      - text: >-
          Zettlemoyer is a Professor in the University of Washington's Paul G. Allen School of Computer Science &
          Engineering, where the faculty page notes more than ten years of teaching advanced AI and machine
          learning courses to undergraduate, PhD and professional master's students. Zettlemoyer is also a Senior
          Research Director at Meta FAIR.
        source_ids: [uw-faculty, lsz-site]
      - text: >-
          Zettlemoyer was named a Fellow of the Association for Computational Linguistics in January 2022 and was
          elected ACL President in December 2024, serving as vice president-elect in 2025, vice president in 2026
          and president in 2027. In November 2025 Schmidt Sciences named Zettlemoyer an AI2050 Senior Fellow.
        source_ids: [lsz-site]
  - heading: Research
    paragraphs:
      - text: >-
          Zettlemoyer's research covers empirical methods for natural language semantics, including new learning
          algorithms, tasks and datasets, and, more recently, how to build self-supervision signals for
          pre-training large language models. Earlier work includes TriviaQA (2017), a reading comprehension
          dataset, and the deep contextualized word representations paper (2018).
        source_ids: [lsz-site, uw-faculty, triviaqa-paper, elmo-paper]
      - text: >-
          Zettlemoyer co-authored a series of pretraining papers, including the RoBERTa
          study and BART, a denoising sequence-to-sequence model, in 2019, and Toolformer (2023), in which
          language models teach themselves to call external tools. The 2023 QLoRA paper introduced a method for
          finetuning quantized models through low-rank adapters.
        source_ids: [roberta-paper, bart-paper, toolformer-paper, qlora-paper]
      - text: >-
          Recent work studies mixed-modal and tokenizer-free models. Transfusion (2024) trains one model to predict
          text tokens and diffuse images, and the Byte Latent Transformer (2024) operates on dynamically sized
          byte patches instead of tokens; the BLT paper received an outstanding paper award at ACL 2025.
        source_ids: [transfusion-paper, blt-paper, lsz-site]
