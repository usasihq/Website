headline: University of Washington professor and Senior Research Director at Meta; co-author of RoBERTa and QLoRA
bio:
  text: >-
    Luke Zettlemoyer is a Professor in the Paul G. Allen School of Computer Science & Engineering at
    the University of Washington and a Senior Research Director at Meta FAIR. The Allen School's faculty page
    describes research on empirical methods for natural language semantics, new tasks and datasets,
    and how to train and deploy large language models, and notes that Zettlemoyer is a Fellow of the
    Association for Computational Linguistics. Zettlemoyer co-authored the RoBERTa pretraining study,
    the deep contextualized word representations paper, and QLoRA, a finetuning method that
    backpropagates through a frozen 4-bit quantized model into low-rank adapters so that a 65B
    parameter model can be finetuned on a single 48GB GPU.
  source_ids: [lsz-site, uw-faculty, roberta-paper, elmo-paper, qlora-paper]
  reviewed_at: 2026-10-13
