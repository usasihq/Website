sections:
  - heading: Career
    paragraphs:
      - text: >-
          Collier co-founded the OpenStack Foundation, now the OpenInfra Foundation, which began under
          Collier's leadership in 2012 and grew around the OpenStack cloud platform. The PyTorch Foundation's
          staff page also notes Collier's role in shaping the definition of open source AI through the Open
          Source Initiative.
        source_ids: [ptf-staff]
      - text: >-
          In February 2026, the PyTorch Foundation announced that Collier would become its Executive Director,
          as Matt White moved into the role of Chief Technology Officer. As Executive Director, Collier is
          responsible for the operational and business execution of the foundation, working with its Governing
          Board.
        source_ids: [ptf-transition, ptf-staff]
