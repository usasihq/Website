headline: Executive Director of the PyTorch Foundation since February 2026; co-founder of the OpenStack Foundation
bio:
  text: >-
    Mark Collier is the Executive Director of the PyTorch Foundation, where Collier leads the operational and
    business execution of the foundation and works closely with its Governing Board. Collier co-founded the
    OpenStack Foundation, now the OpenInfra Foundation, and led its development from 2012.
  source_ids: [ptf-staff, ptf-transition]
