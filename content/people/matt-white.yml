headline: Executive Director of the Open Intelligence Foundation; formerly led the PyTorch Foundation
bio:
  text: >-
    Matt White is the Executive Director of the Open Intelligence Foundation, a nonprofit for open-source AI,
    open models and open science that White joined as founding executive director in September 2026. White
    previously led the PyTorch Foundation as executive director from June 2024 and, after a February 2026
    leadership transition in which Mark Collier became executive director, served as its Chief Technology
    Officer and as Global CTO of AI at the Linux Foundation; White's résumé lists both roles as ending in
    August 2026. White also directed the Generative AI Commons at the LF AI & Data Foundation and co-founded
    the Open Metaverse Foundation.
  source_ids: [oif-who-we-are, mw-resume, ptf-transition, ptf-new-ed]
  reviewed_at: 2026-10-22
