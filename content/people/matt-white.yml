sections:
  - heading: Career
    paragraphs:
      - text: >-
          The PyTorch Foundation describes White as a technologist and researcher with experience in AI, data,
          autonomous systems and simulations. Before joining the PyTorch Foundation, White directed the
          Generative AI Commons at the Linux Foundation, and White co-founded and chaired the Open Metaverse
          Foundation, part of the Linux Foundation.
        source_ids: [ptf-new-ed]
      - text: >-
          White's résumé lists earlier industry roles as Head of Artificial Intelligence and Data at Amdocs
          (2020–2024) and National Director, Data Science at IBM (2018–2020), and a founding CTO role at the
          Agentic AI Foundation from December 2025 to May 2026. White is also the first author of the Model
          Openness Framework and designed the OpenMDW license for AI models.
        source_ids: [mw-resume, mw-about, oif-who-we-are]
  - heading: PyTorch Foundation and Linux Foundation
    paragraphs:
      - text: >-
          The PyTorch Foundation welcomed White as its executive director in June 2024. In a February 2026
          post, White announced a leadership transition: White became the foundation's Chief Technology Officer,
          alongside a new role as Global CTO of AI at the Linux Foundation, and Mark Collier became Executive
          Director.
        source_ids: [ptf-new-ed, ptf-transition]
      - text: >-
          White's résumé lists the PyTorch Foundation CTO role and the Linux Foundation Global CTO of AI role as
          ending in August 2026, and the PyTorch Foundation's staff page in October 2026 lists Collier as
          executive director without listing White. The Open Intelligence Foundation's people page describes
          White as previously Global CTO of AI at the Linux Foundation and Executive Director, later CTO, of
          the PyTorch Foundation.
        source_ids: [mw-resume, ptf-staff, oif-who-we-are]
  - heading: Open Intelligence Foundation
    paragraphs:
      - text: >-
          In September 2026 White became the founding Executive Director of the Open Intelligence Foundation,
          which White's site describes as a nonprofit that protects and advances open-source AI, open models and
          open science, supports projects and curates Open Source AI Week. The foundation's people page lists
          White among its officers as Executive Director.
        source_ids: [mw-resume, mw-about, oif-who-we-are]
