headline: Principal research scientist at NVIDIA Research; led the creation of the COCO dataset; Cosmos co-author
bio:
  text: >-
    Tsung-Yi Lin is a principal research scientist at NVIDIA Research, working on computer vision,
    machine learning, and generative AI, with a recent interest in generative AI in 3D; Lin was
    previously on the Brain Team at Google Research. Lin's site says Lin led the creation of the
    COCO (Common Objects in Context) dataset, and Lin is first author of the 2014 Microsoft COCO
    paper and of the 2017 Focal Loss paper. Lin is also among the authors of NVIDIA's 2025 Cosmos
    World Foundation Model Platform paper, which describes Cosmos as open-source with open-weight
    models.
  source_ids: [homepage, coco-paper, focal-paper, cosmos-paper]
  reviewed_at: 2026-10-21
