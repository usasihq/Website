sections:
  - heading: Career
    paragraphs:
      - text: >-
          Lin did a PhD at Cornell University, advised by Serge Belongie, and was then a member
          of the Brain Team at Google Research. Lin is now a principal research scientist at NVIDIA Research,
          working on computer vision, machine learning and generative AI, with a recent focus on generative
          AI in 3D.
        source_ids: [homepage, nvidia-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Lin led the creation of the COCO (Common Objects in Context) dataset, introduced in a 2014 paper with
          instance segmentation masks for common object categories. Lin was also first author of Feature
          Pyramid Networks for object detection (CVPR 2017) and of Focal Loss (ICCV 2017), which addresses the
          imbalance between foreground and background in dense object detection.
        source_ids: [homepage, coco-paper, fpn-paper, focal-paper]
      - text: >-
          At Google, Lin co-authored work on data augmentation, self-training and architectures, including
          "Rethinking Pre-training and Self-training" (NeurIPS 2020), simple copy-paste augmentation for
          instance segmentation (CVPR 2021) and Bottleneck Transformers (CVPR 2021). At NVIDIA, Lin co-authored
          Magic3D for high-resolution text-to-3D generation (2022) and is listed on the Cosmos world foundation
          model papers, including Cosmos-Reason1 (2025) and Cosmos 3 (2026).
        source_ids: [homepage, magic3d-paper, cosmos-paper, cosmos-reason-paper, cosmos3-paper]
