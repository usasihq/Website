sections:
  - heading: Career
    paragraphs:
      - text: >-
          Cordelia Schmid's doctoral thesis at the Institut National Polytechnique de Grenoble, on
          local greyvalue invariants for image matching and retrieval, received INPG's best thesis
          award in 1996. Schmid was then a post-doctoral research assistant in the Robotics Research
          Group at Oxford University in 1996–1997, and since 1997 has held a permanent research
          position at Inria, where Schmid is a research director in the WILLOW project team of Inria
          Paris and DI ENS.
        source_ids: [homepage]
      - text: >-
          Schmid received the Habilitation in 2001 for a thesis titled "From Image Matching to Learning
          Visual Models". Starting in 2018, Schmid has held a joint appointment with Google Research.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Schmid's research is in computer vision; Schmid's doctoral and habilitation theses ran from
          image matching and retrieval to learning visual models. Schmid also co-authored VideoBERT (2019), which learns joint visual-linguistic representations from
          unlabeled video, and ViViT (2021), a pure-transformer model for video classification
          presented at ICCV 2021.
        source_ids: [homepage, videobert-paper, vivit-paper]
  - heading: Editorial and community service
    paragraphs:
      - text: >-
          Schmid has been an associate editor of IEEE PAMI (2001–2005) and of IJCV (2004–2012), and
          editor-in-chief of IJCV from 2013 to 2018. Schmid was a program chair of IEEE CVPR 2005 and
          ECCV 2012 and a general chair of IEEE CVPR 2015, ECCV 2020 and ICCV 2023, and is listed as a
          general chair of ECCV 2028.
        source_ids: [homepage]
