headline: Inria research director in the WILLOW team, with a joint appointment at Google Research since 2018
bio:
  text: >-
    Cordelia Schmid is a research director at Inria, where Schmid has held a permanent research
    position since 1997, and works in the WILLOW project team of Inria and DI ENS. Since 2018
    Schmid has held a joint appointment with Google Research. Schmid's video and language research
    includes co-authorship of VideoBERT (2019), a joint model for video and language representation
    learning, and ViViT (2021), a video vision transformer. Schmid has served as editor-in-chief of
    IJCV (2013–2018) and as general chair of IEEE CVPR 2015, ECCV 2020, and ICCV 2023.
