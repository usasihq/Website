sections:
  - heading: Coverage
    paragraphs:
      - text: >-
          As an intern at Bloomberg, Zeff wrote some of its first stories on the Silicon Valley Bank crisis, and
          TechCrunch's author page also lists earlier work with MSNBC.
          Zeff then covered AI policy and content moderation for Gizmodo before becoming a senior AI reporter at
          TechCrunch, where Zeff reported on the startups and leaders of the AI industry.
        source_ids: [wired, techcrunch]
      - text: >-
          At WIRED, Zeff writes about the business of artificial intelligence. Stories listed on Zeff's WIRED
          author page in 2026, several published under the Model Behavior label, cover AI developers such as OpenAI,
          Anthropic and Meta, new AI agents and models, AI safety practices and the public's adoption of AI tools.
        source_ids: [wired]
