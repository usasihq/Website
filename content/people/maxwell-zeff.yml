headline: Senior writer at WIRED covering the business of artificial intelligence
bio:
  text: >-
    Maxwell Zeff is a senior writer at WIRED who covers the business of artificial intelligence. Maxwell was
    previously a senior reporter at TechCrunch specializing in AI, reporting on the startups and leaders in
    the industry. Before that, Maxwell covered AI policy and content moderation for Gizmodo and reported for
    Bloomberg.
