sections:
  - heading: Career
    paragraphs:
      - text: >-
          Rush completed a PhD in computer science at MIT in 2014, advised by Michael Collins, with a
          dissertation on relaxation methods for natural language decoding, and then held a post-doctoral
          fellowship at Facebook AI Research in 2015. Rush was an assistant professor of computer science
          at Harvard from 2015 to 2019 and then an associate professor of computer science at Cornell University.
        source_ids: [rush-cv]
      - text: >-
          From 2019 Rush also worked with Hugging Face, where the team built open-source LLMs. Rush later
          worked as an ML researcher at Cursor, helping develop the Composer series of models, and is a
          listed author of the Composer 2 technical report from Cursor Research.
        source_ids: [rush-site, rush-cv, composer2-paper]
  - heading: Research
    paragraphs:
      - text: >-
          Rush's academic group worked on early LLMs, natural language processing and infrastructure.
          Papers on Rush's list include "A Neural Attention Model for Abstractive Sentence Summarization"
          (EMNLP 2015) with Sumit Chopra and Jason Weston, "Character-Aware Neural Language Models" (AAAI
          2016), "Sequence-Level Knowledge Distillation" (EMNLP 2016) and "Compound Probabilistic
          Context-Free Grammars for Grammar Induction" (ACL 2019).
        source_ids: [rush-site, rush-cv]
      - text: >-
          More recent work covers language models without attention, including "Pretraining Without
          Attention" (EMNLP 2023 Findings) and MambaByte (COLM 2024), as well as "Simple and Effective Masked
          Diffusion Language Models" (NeurIPS 2024) and "Contextual Document Embeddings" (ICLR 2025).
        source_ids: [rush-site, rush-cv]
  - heading: Open-source work and community
    paragraphs:
      - text: >-
          Rush co-authored the OpenNMT toolkit for neural machine translation (ACL Demo 2017) and the
          LSTMVis tool for inspecting recurrent network hidden states (InfoVis 2017), wrote The Annotated
          Transformer (2018) and published GPU-Puzzles in 2021. Rush helped start the Conference on
          Language Modeling (COLM), served as a Senior Program Chair and a General Chair of ICLR.
        source_ids: [rush-site, rush-cv, colm-site]
