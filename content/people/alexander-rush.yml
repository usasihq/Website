headline: ML researcher; former Cornell and Harvard professor and former Cursor and Hugging Face researcher
bio:
  text: >-
    Sasha Rush (Alexander M. Rush in paper bylines) is an ML researcher, programmer and blogger.
    Rush was previously a professor at Harvard and then Cornell, worked as an ML researcher at
    Cursor on the Composer series of models, and worked at Hugging Face on open-source LLMs. Rush is a co-author of the paper
    that introduced Hugging Face's Transformers library and of the Zephyr alignment paper, wrote
    The Annotated Transformer (2018), and helped start the Conference on Language Modeling in 2024.
  source_ids: [rush-site, github-profile, transformers-paper, zephyr-paper]
  reviewed_at: 2026-10-21
