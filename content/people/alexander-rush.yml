headline: ML researcher at Cursor; former Cornell and Harvard professor and Hugging Face researcher
bio:
  text: >-
    Sasha Rush (Alexander M. Rush in paper bylines) is an ML researcher at Cursor who studies
    post-training of AI systems for coding and related tasks. From 2016 to 2026 Rush was a
    professor at Harvard and then Cornell, and from 2019 to 2024 Rush also worked as a researcher
    at Hugging Face, helping on early open-source LLM projects. Rush is a co-author of the paper
    that introduced Hugging Face's Transformers library and of the Zephyr alignment paper, wrote
    The Annotated Transformer (2018), and helped start the Conference on Language Modeling in 2024.
  source_ids: [rush-site, github-profile, transformers-paper, zephyr-paper]
