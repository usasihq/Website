sections:
  - heading: Career
    paragraphs:
      - text: >-
          Colin Raffel completed a PhD in electrical engineering at Columbia University in 2016, advised by
          Daniel P. W. Ellis in a laboratory for speech and audio research. Raffel then joined Google Brain in 2016 and stayed
          until 2021, holding research scientist roles from 2017 and becoming a staff research scientist in 2020.
        source_ids: [raffel-cv]
      - text: >-
          Raffel was an assistant professor of computer science at UNC Chapel Hill from 2020 to 2023 and has
          been a faculty researcher at Hugging Face since 2021. Since 2023 Raffel has been an associate
          professor at the University of Toronto and an associate research director at the Vector Institute.
        source_ids: [raffel-cv, raffel-site]
  - heading: Research
    paragraphs:
      - text: >-
          Raffel's lab works on decentralizing, democratizing and de-risking large-scale AI. At Google, Raffel
          was first author of the T5 paper, which recasts text-based language tasks as text-to-text problems
          and introduced the Colossal Clean Crawled Corpus.
        source_ids: [raffel-site, t5-paper]
      - text: >-
          Raffel's later papers cover training data, model merging and collaborative model development. They
          include "Scaling Data-Constrained Language Models" (2023), TIES-Merging for combining fine-tuned
          models (2023), Git-Theta, a git extension for machine learning models (2023), and the open
          datasets FineWeb (2024) and The Common Pile v0.1 of public domain and openly licensed text (2025).
        source_ids: [raffel-cv]
