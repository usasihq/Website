headline: University of Toronto associate professor and Hugging Face faculty researcher; first author of the T5 paper
bio:
  text: >-
    Colin Raffel is an associate professor of computer science at the University of Toronto, an
    associate research director at the Vector Institute, and a faculty researcher at Hugging Face;
    Raffel's lab works on decentralizing, democratizing, and de-risking large-scale AI. Raffel's CV lists Google
    Brain positions from 2016 to 2021, the last as Staff Research Scientist, and an assistant
    professorship at UNC Chapel Hill from 2020 to 2023. Raffel is first author of Exploring the Limits of
    Transfer Learning with a Unified Text-to-Text Transformer, which converts text-based language
    problems into a text-to-text format, and the google-research/text-to-text-transfer-transformer
    repository that accompanies it is released under the Apache 2.0 license.
  source_ids: [raffel-site, raffel-cv, t5-paper, t5-repo]
  reviewed_at: 2026-10-13
