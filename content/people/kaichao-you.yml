headline: Lead maintainer of vLLM; co-founder and Chief Scientist of Inferact; creator of depyf
bio:
  text: >-
    Kaichao You is a core and lead maintainer of vLLM, the open-source engine for serving large
    language models; the committers list names Kaichao You as a project lead for distributed execution,
    compilation, and community, and as an owner of the plugin interface. Kaichao You is first author of
    depyf, an open-source tool that opens up the PyTorch compiler for machine learning researchers,
    published in JMLR and listed as a PyTorch ecosystem project. Kaichao You is a co-founder and the
    Chief Scientist of Inferact, a company founded by vLLM's maintainers.
  source_ids: [personal-site, github-profile, vllm-governance, vllm-committers, depyf-paper, inferact-intro]
  reviewed_at: 2026-10-19
