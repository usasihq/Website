headline: Co-founder and Chief Architect of Arista Networks; co-founder of Sun Microsystems
bio:
  text: >-
    Andreas "Andy" Bechtolsheim is a co-founder and the Chief Architect of Arista Networks, where
    Bechtolsheim is responsible for advanced work in AI, silicon and optics. Bechtolsheim
    previously co-founded Sun Microsystems and served as its chief system architect, and has been
    a founding member of the Open Compute Project board since 2011.
