sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Soumith Chintala co-founded PyTorch and earlier maintained Torch-7. Before 2012, Chintala helped
          maintain EBLearn, a C++ deep learning framework, with Pierre Sermanet and Yann LeCun, and later
          created convnet-benchmarks, a deep learning benchmarking suite that hardware makers used from
          2015 to 2017 to tune their systems.
        source_ids: [soumith-site]
      - text: >-
          Chintala is the last-listed author of the 2019 paper "PyTorch: An Imperative Style,
          High-Performance Deep Learning Library." PyTorch's install page offers builds for NVIDIA CUDA,
          AMD ROCm and CPU-only machines, and ExecuTorch extends the project to running models on phones
          and other devices.
        source_ids: [pytorch-paper, pytorch-get-started, executorch-readme]
  - heading: Research
    paragraphs:
      - text: >-
          Chintala co-authored three papers on generative adversarial networks: LAPGAN (2015), which
          generates images with a Laplacian pyramid of adversarial networks, DCGAN (2015), on
          unsupervised representation learning with deep convolutional GANs, and Wasserstein GAN (2017).
          Other research has covered object and human detection, generative modeling of images and
          video, AI for video games and machine learning systems.
        source_ids: [soumith-site, lapgan-paper, dcgan-paper, wgan-paper]
      - text: >-
          At NYU, Chintala works on home robotics with Lerrel Pinto, often using a Hello Robot Stretch.
          Their papers include "On Bringing Robots Home" (2023) and "Robot Utility Models" (2024), which
          studies general policies that can be deployed zero-shot in new environments.
        source_ids: [soumith-site, robots-home-paper, rum-paper]
  - heading: Career
    paragraphs:
      - text: >-
          Chintala's homepage lists 11 years at Meta and current work at Thinking Machines and NYU on AI
          infrastructure, AI research and robotics.
        source_ids: [soumith-site]
