headline: Co-founder of PyTorch, the framework behind ExecuTorch's on-device AI stack
bio:
  text: >-
    Soumith Chintala co-founded PyTorch and earlier maintained Torch7. PyTorch's install page offers
    builds for NVIDIA CUDA, AMD ROCm, and CPU-only machines, and ExecuTorch is PyTorch's open-source
    stack for running AI locally on phones and other devices. Chintala's site lists 11 years at Meta
    and current work at Thinking Machines and NYU on AI infrastructure, AI research, and robotics.
  source_ids: [soumith-site, pytorch-get-started, executorch-readme]
