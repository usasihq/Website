sections:
  - heading: Career
    paragraphs:
      - text: >-
          See's Stanford page describes a PhD in computer science completed in September 2021, advised by
          Christopher Manning in the Stanford Natural Language Processing group, with internships at Google
          Brain and Facebook AI Research during the doctorate. Earlier, an internship at Microsoft Research
          working on termination analysis drew See toward computer science. Since January 2022 See has been a
          Research Scientist at Google DeepMind.
        source_ids: [see-stanford]
  - heading: Research
    paragraphs:
      - text: >-
          See's doctoral research, collected in the thesis "Neural generation of open-ended text and dialogue",
          aimed to improve the controllability, interpretability, and coherence of neural text generation for
          tasks such as story generation and chitchat dialogue. Papers from this period study how controllable
          attributes affect human judgments of conversation (NAACL 2019), whether large pretrained language
          models make better storytellers (CoNLL 2019), and user dissatisfaction in a neural generative chatbot
          (SIGDIAL 2021), and See was a co-first author of the Stanford team's Alexa Prize 2019
          paper on emotionally engaging mixed-initiative conversations.
        source_ids: [see-stanford]
      - text: >-
          See's 2017 pointer-generator paper with Peter J. Liu and Christopher Manning proposed a summarization
          model that can copy words from the source text while still generating new ones, with released code.
          At Google DeepMind, See is a co-author of the 2025 AlphaEvolve paper on a coding agent for scientific
          and algorithmic discovery.
        source_ids: [pg-paper, pg-repo, pg-license, alphaevolve-paper]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          See was co-instructor and Head TA of Stanford's CS224n, Natural Language Processing with Deep
          Learning, in 2018 and 2019, lecturing on recurrent networks, language models, machine translation, and
          natural language generation, and leading a redesign of the course assignments. See also developed AI
          teaching materials for high school students, delivered through AI4ALL and Girls Teaching Girls To
          Code, and organized the Stanford AI Lab's AI Salon discussion forum.
        source_ids: [see-stanford]
