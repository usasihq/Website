headline: Research Scientist at Google DeepMind; first author of the pointer-generator summarization paper
bio:
  text: >-
    Abigail See is a Research Scientist at Google DeepMind, a role See's Stanford page lists since
    January 2022. See completed a PhD in computer science at Stanford in 2021, advised by Christopher
    Manning in the Natural Language Processing group, with research on neural text generation for
    open-ended tasks such as story generation and chitchat dialogue. See is first author of Get To The
    Point: Summarization with Pointer-Generator Networks and released its code under the Apache
    License 2.0. At Stanford, See was co-instructor and Head TA of CS224n, Natural Language Processing
    with Deep Learning, in 2018 and 2019, and led a redesign of its assignments.
  source_ids: [see-stanford, pg-paper, pg-repo, pg-license]
  reviewed_at: 2026-10-13
