sections:
  - heading: Career
    paragraphs:
      - text: >-
          Saining Xie spent four years as a research scientist at Facebook AI Research and later worked as a
          research scientist on the GenAI team at Google DeepMind. Xie is a faculty member at NYU's Courant
          Institute, where Xie leads a research group of postdoctoral fellows and PhD students, and is co-founder
          and Chief Science Officer of AMI Labs.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Xie's architecture work includes the ResNeXt network family, introduced in a 2016 paper, and ConvNeXt, from A ConvNet for the 2020s (2022), which modernized convolutional
          networks. In representation learning, Xie co-authored Momentum Contrast (MoCo) in 2019 and Masked
          Autoencoders in 2021.
        source_ids: [resnext-paper, convnext-paper, moco-paper, mae-paper]
      - text: >-
          For generation, Xie and William Peebles introduced diffusion transformers (DiT) in Scalable Diffusion
          Models with Transformers (2022). Projects from Xie's NYU group include Cambrian-1, a fully open, vision-centric exploration of multimodal language models, and Solaris
          (2026), a multiplayer video world model built in Minecraft.
        source_ids: [dit-paper, homepage, cambrian-paper, solaris-paper]
