headline: Co-founder and CSO of AMI Labs and NYU assistant professor; co-creator of DiT and co-author of ConvNeXt
bio:
  text: >-
    Saining Xie is the co-founder and Chief Science Officer of AMI Labs and an Assistant Professor at
    NYU's Courant Institute. Xie was previously a research scientist at Google DeepMind on the
    GenAI team and, before that, spent four years as a research scientist at Facebook AI Research
    (FAIR). Xie co-created diffusion transformers (DiT) with William Peebles and is a co-author of
    ConvNeXt, MoCo, and Masked Autoencoders; recent work from Xie's group includes Cambrian, a
    project on multimodal models across images and video.
  source_ids: [homepage, dit-paper, convnext-paper, moco-paper, mae-paper]
