headline: Author of the LoRA repository for diffusion fine-tuning; AuraFlow collaborator and Diffusers contributor
bio:
  text: >-
    Simo Ryu, who publishes on GitHub as cloneofsimo, wrote the Apache-2.0-licensed lora repository,
    which applies low-rank adaptation to quickly fine-tune text-to-image diffusion models, along with
    minimal reference implementations such as minDiffusion and minRF. Ryu collaborated with fal on
    AuraFlow v0.1, an Apache-2.0 open-weights flow-based text-to-image model whose model card credits
    Ryu with bringing the project to life. Ryu has also contributed to Hugging Face Diffusers, including
    a merged pull request adding learned positional-embedding selection for AuraFlow.
  source_ids: [ryu-github, lora-repo, auraflow-card, fal-auraflow-blog, diffusers-pr-9182, diffusers-pr-4532]
  reviewed_at: 2026-10-21
affiliations:
  - name: fal
    organization_slug: null
    role: Collaborator on AuraFlow v0.1, credited on fal's AuraFlow model card
    current: false
    source_ids: [auraflow-card, fal-auraflow-blog]
work:
  - name: Hugging Face Diffusers
    artifact_slug: diffusers
    type: open-source
    url: https://github.com/huggingface/diffusers
    contribution: >-
      Authored merged pull requests to the Apache-2.0 Diffusers library, including #9182 (August 2024),
      which adds learned positional-embedding selection for AuraFlow, and #4532 (August 2023), which
      adds a section to the SDXL documentation pointing to minSDXL, a single-file implementation of
      the SDXL UNet.
    source_ids: [diffusers-pr-9182, diffusers-pr-4532, diffusers-license]
  - name: LoRA for diffusion fine-tuning (cloneofsimo/lora)
    artifact_slug: null
    type: open-source
    url: https://github.com/cloneofsimo/lora
    contribution: >-
      Author of the repository "Using Low-rank adaptation to quickly fine-tune diffusion models",
      released under the Apache License 2.0; fal's AuraFlow announcement points to it as Ryu's
      adaptation of the LoRA paper for text-to-image models.
    source_ids: [lora-repo, ryu-github, fal-auraflow-blog]
  - name: AuraFlow v0.1
    artifact_slug: null
    type: open-weights
    url: https://huggingface.co/fal/AuraFlow
    contribution: >-
      Credited, with fal's @isidentical, on the AuraFlow model card for bringing the project to life;
      fal's announcement says the collaboration grew out of Ryu's minRF reimplementation of MMDiT. The
      model card lists the apache-2.0 license.
    source_ids: [auraflow-card, fal-auraflow-blog]
links:
  - label: GitHub
    url: https://github.com/cloneofsimo
sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Ryu's lora repository adapted low-rank adaptation to fine-tuning text-to-image diffusion models such
          as Stable Diffusion. Its update log, which runs from December 2022 to February 2023, records features
          including text-encoder fine-tuning, conversion to checkpoint formats used by other tools, pivotal
          tuning inversion, LoRA applied to ResNet layers, merging of LoRA weights and inpainting training.
        source_ids: [lora-repo]
      - text: >-
          Ryu also writes minimal reimplementations of generative models, such as minDiffusion and minRF. In
          August 2023, Ryu contributed a pull request adding a minimalistic reimplementation of SDXL to the
          Diffusers documentation.
        source_ids: [ryu-github, diffusers-pr-4532]
  - heading: AuraFlow
    paragraphs:
      - text: >-
          According to fal, Ryu set out to implement the MMDiT architecture from scratch in the minRF repository,
          and its early result, Lavenderflow-v0, led to a collaboration with fal to train a larger model. The
          result was AuraFlow v0.1, an open-weights flow-based text-to-image model released in July 2024 under
          the Apache 2.0 license.
        source_ids: [fal-auraflow-blog, auraflow-card]
      - text: >-
          In August 2024, Ryu added learned positional-embedding selection for AuraFlow to Hugging Face
          Diffusers in a merged pull request.
        source_ids: [diffusers-pr-9182, diffusers-license]
timeline:
