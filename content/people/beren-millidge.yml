sections:
  - heading: Career
    paragraphs:
      - text: >-
          Millidge completed a PhD in machine learning and computational neuroscience at the University of
          Edinburgh (2017 to 2021) and then worked as a postdoctoral researcher at the University of Oxford with
          Rafal Bogacz on predictive coding and learning in the brain. Millidge was later a senior research
          scientist at Verses Research Lab and Head of Research at Conjecture, where the CV describes technical
          alignment research focused on interpretability of large language models.
        source_ids: [millidge-cv, millidge-about]
      - text: >-
          In 2023 Millidge was one of four co-founders of Apollo Research before leaving to start Zyphra, where
          Millidge has served as co-founder and Chief Scientist since July 2023.
        source_ids: [millidge-cv]
  - heading: Research at Zyphra
    paragraphs:
      - text: >-
          At Zyphra, Millidge is the last-listed author on the Zamba (2024) and Zamba2 (2024) technical reports,
          which describe hybrid models that pair Mamba state-space blocks with shared attention layers. Millidge is
          also the senior author of the 2026 Zamba2-VL report, which extends the Zamba2 backbone to
          vision-language tasks.
        source_ids: [zamba-paper, zamba2-paper, zamba2-vl-paper]
      - text: >-
          Millidge's CV also lists Zyphra work on BlackMamba, a mixture-of-experts state-space model, and on Tree
          Attention, a topology-aware decoding method for long-context attention on GPU clusters.
        source_ids: [millidge-cv]
