headline: Co-founder and Chief Scientist of Zyphra; senior author of the Zamba, Zamba2 and Zamba2-VL reports
bio:
  text: >-
    Beren Millidge is a co-founder of Zyphra, where Millidge's CV lists the role of Chief Scientist
    since July 2023 and Millidge's site says Millidge leads the company's technical teams. Millidge is
    the senior (last-listed) author of the technical reports for Zyphra's open-weight Zamba (2024),
    Zamba2 (2024) and Zamba2-VL (2026) hybrid state-space models. Before Zyphra, Millidge was a
    co-founder of Apollo Research, Head of Research at Conjecture, and a postdoctoral researcher in
    computational neuroscience at the University of Oxford.
  source_ids: [millidge-about, millidge-cv, zamba-paper, zamba2-paper, zamba2-vl-paper]
  reviewed_at: 2026-10-22
