headline: Executive Director of EleutherAI; first author of the Pythia open model suite
bio:
  text: >-
    Stella Biderman is the Executive Director of EleutherAI. Biderman is first author of the Pythia
    paper, which introduced 16 language models from 70M to 12B parameters, all trained on public
    data in the same order, with 154 checkpoints released for each model so researchers can study
    how models change over training and scale. Biderman is also among the credited authors of the
    Language Model Evaluation Harness, EleutherAI's open framework for evaluating language models.
  source_ids: [staff, pythia-paper, pythia-repo, lm-eval-repo]
  reviewed_at: 2026-10-21
