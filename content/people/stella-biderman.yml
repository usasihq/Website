sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Biderman leads EleutherAI, whose staff page describes researchers, engineers, and operators
          supporting open AI science across open models and infrastructure, evaluation, multilingual NLP,
          and AI for science. Biderman was the second author of The Pile, an 800GB dataset of diverse English
          text for language modeling posted at the end of 2020, and of the 2022 paper describing
          GPT-NeoX-20B, an open-source autoregressive language model.
        source_ids: [staff, pile-paper, neox-paper]
      - text: >-
          In 2023 Biderman was first author of the paper on the Pythia suite, built to let researchers study how
          language models change
          across training and scale. More recently Biderman co-authored the Common Pile v0.1, an 8TB dataset
          of public domain and openly licensed text, in 2025.
        source_ids: [pythia-paper, pythia-repo, common-pile-paper]
  - heading: Evaluation
    paragraphs:
      - text: >-
          Biderman is among the credited authors of the Language Model Evaluation Harness and first author of
          Lessons from the Trenches on Reproducible Evaluation of Language Models (2024), which draws on
          experience maintaining that framework to discuss reproducible evaluation practice.
        source_ids: [lm-eval-repo, lessons-paper]
