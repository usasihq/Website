headline: Creator of LightGBM; SVP of AI at DP Technology and former senior researcher at Microsoft Research Asia
bio:
  text: >-
    Guolin Ke is SVP of AI at DP Technology, working on AI for Science. Ke created LightGBM, an
    open-source gradient boosting decision tree framework, in 2016 during an internship at
    Microsoft Research Asia, and is first author of the NIPS 2017 paper that introduced its
    Gradient-based One-Side Sampling and Exclusive Feature Bundling techniques. Ke later became a
    Senior Researcher in the Machine Learning Group at Microsoft Research Asia, and in 2021 led the
    development of Graphormer. Ke also led the development of Uni-Fold, a reimplementation of
    AlphaFold with open-source training code, and Ke's homepage lists team releases including the
    Uni-Mol 3D molecular pretraining framework and Uni-3DAR, an autoregressive model for a range of
    3D tasks.
  source_ids: [homepage, github-profile, lightgbm-paper]
