sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Tina Huang's YouTube channel covers AI, coding, tech careers and self-study, and its about
          section introduces Tina Huang as a former data scientist at Meta. Lonely Octopus describes
          Tina Huang as a former software engineer and data scientist.
        source_ids: [channel, lonely-octopus]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Tina Huang is the founder and CEO of Lonely Octopus, a practical AI education company for
          working professionals. Its offerings include cohort-based programs, live workshops and
          intensives, and training on using AI in everyday work.
        source_ids: [lonely-octopus]
      - text: >-
          Lonely Octopus programs include a 28-day AI Agent Bootcamp on understanding, building and
          deploying AI agents, short-form workshops such as AI App Sprint and Breakthrough, and a
          masterclass on using AI to build a freelance career.
        source_ids: [lonely-octopus]
