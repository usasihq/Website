headline: YouTube creator on AI and coding, and founder and CEO of the AI education company Lonely Octopus
bio:
  text: >-
    Tina Huang makes YouTube videos about AI, coding, tech careers, and self-study, drawing on past
    work as a software engineer and data scientist, including at Meta. Tina Huang is the founder and
    CEO of Lonely Octopus, a practical AI education company that runs cohort programs, live
    workshops, and community learning, including an AI agent bootcamp.
