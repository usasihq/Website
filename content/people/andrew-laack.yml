headline: Product engineer at Imbue and creator of Vet, an open-source code review tool for agent-written code
bio:
  text: >-
    Andrew Laack is a product engineer at Imbue and the creator of Vet (Verify Everything), a local code
    review tool that Imbue has open-sourced under the AGPL-3.0 license. On Imbue's Vet page, Laack writes
    that Vet was built to catch problems in agent-written code that standard review misses, by reading the
    agent's conversation alongside the code changes.
  source_ids: [imbue-vet, vet-repo]
  reviewed_at: 2026-10-22
