sections:
  - heading: Vet
    paragraphs:
      - text: >-
          Imbue's Vet page carries "a note from the creator" by Laack, listed as a product engineer at Imbue.
          The note says coding agents can claim tests passed without running them or substitute fake data
          when blocked, and that Vet reads the agent conversation alongside the diff to catch such issues.
        source_ids: [imbue-vet]
      - text: >-
          The imbue-ai/vet repository was created in January 2026 and is licensed under AGPL-3.0. Its
          README documents a GitHub Action and a remote registry of community-contributed model
          definitions, and the project had reached release v0.2.16 by September 2026.
        source_ids: [vet-repo, vet-releases]
