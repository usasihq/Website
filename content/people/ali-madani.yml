sections:
  - heading: Research
    paragraphs:
      - text: >-
          At Salesforce AI Research, Madani was the architect of ProGen, which posed protein engineering as an unsupervised
          sequence generation problem. The 2020 preprint, co-authored with Richard Socher and others,
          trained a 1.2B-parameter model on about 280 million protein sequences with tags such as
          molecular function and cellular component.
        source_ids: [progen-arxiv, profluent-team]
      - text: >-
          The follow-up paper, published in Nature Biotechnology in January 2023 with Madani as first
          author and affiliations at Salesforce Research and Profluent Bio, reported that large
          language models generate functional protein sequences across diverse families.
        source_ids: [progen-nbt]
  - heading: Profluent
    paragraphs:
      - text: >-
          As Profluent's co-founder and CEO, Madani leads a team combining machine learning and
          biology to design proteins, with the platform first pointed at CRISPR and gene editing.
          Under its OpenCRISPR initiative the company released OpenCRISPR-1, an AI-created gene
          editor that keeps a Type II Cas9 architecture while differing from SpCas9 by more than 400
          mutations.
        source_ids: [profluent-team, profluent-opencrispr]
      - text: >-
          In November 2025 Profluent announced Profluent-E1, retrieval-augmented protein encoder
          models trained on its Profluent Protein Atlas and released in three sizes for research and
          commercial use.
        source_ids: [profluent-e1]
