headline: Co-founder and CEO of Profluent; led the ProGen protein language model work at Salesforce AI Research
bio:
  text: >-
    Ali Madani is a co-founder and the CEO of Profluent, a company that uses AI to design proteins,
    including gene editors. Profluent's team page describes Madani as a machine learning researcher
    who, before Profluent, was the architect of the ProGen project at
    Salesforce AI Research, which showed that language models can generate functional protein
    sequences.
  source_ids: [profluent-team, progen-nbt]
  reviewed_at: 2026-10-21
