sections:
  - heading: Career
    paragraphs:
      - text: >-
          Taylor's CV records a PhD in computer science from the University of Toronto in 2009, advised by
          Geoffrey Hinton and Sam Roweis, with a thesis on composable, distributed-state models for
          high-dimensional time series. Taylor then spent 2009 to 2012 as a postdoctoral fellow in the Vision,
          Learning and Graphics group at NYU's Courant Institute, working with Chris Bregler, Rob Fergus and
          Yann LeCun.
        source_ids: [taylor-cv]
      - text: >-
          Taylor joined the University of Guelph's School of Engineering as an assistant professor in 2012,
          became associate professor in 2017 and professor in 2021. Taylor was founding academic director of
          Guelph's Centre for Advancing Responsible and Ethical AI (CARE-AI) from 2018 and has been its academic
          co-director since 2020. At the Vector Institute, Taylor has been a faculty member since 2017 and served
          as interim research director and then research director between 2021 and 2023.
        source_ids: [taylor-cv]
      - text: >-
          Outside the university, Taylor co-founded Kindred Systems in 2014, has been a lab
          scientist at the Creative Destruction Lab since 2018, and is founding academic director of NextAI at
          NEXT Canada.
        source_ids: [taylor-cv]
  - heading: Research
    paragraphs:
      - text: >-
          Taylor's research areas include representation learning and deep learning, unsupervised learning and
          time series, applied to image and video understanding, motion capture, remote sensing and agri-food,
          and biodiversity. The group's current work covers generative modelling, multimodal representation
          learning across images, DNA and text, graph neural networks and uncertainty quantification.
        source_ids: [taylor-cv, taylor-site]
      - text: >-
          Much of the recent work supports biodiversity monitoring. BIOSCAN-5M pairs insect specimen images with
          DNA barcode sequences and taxonomic labels, and in 2026 a team led by Taylor's postdoctoral fellow Scott
          Lowe placed second in a fish species recognition challenge at the ECCV workshop on computer vision for
          ecology.
        source_ids: [bioscan-paper, taylor-cv]
