headline: University of Guelph professor and Vector Institute faculty member building deep learning for biodiversity
bio:
  text: >-
    Graham Taylor is a Professor and Canada Research Chair in Machine Learning at the University of
    Guelph, where Taylor leads the Machine Learning Research Group and co-directs the Centre for
    Advancing Responsible and Ethical AI (CARE-AI), and a faculty member at the Vector Institute. The
    group develops deep learning methods spanning generative modelling, multimodal representation
    learning across images, DNA, and text, graph neural networks, and uncertainty quantification, much
    of it motivated by monitoring biodiversity. Taylor's CV lists a postdoctoral fellowship at New
    York University's Courant Institute from 2009 to 2012 and a 2018–2019 term as Visiting Faculty at
    Google Brain. Taylor is a co-author of BIOSCAN-5M, a multimodal insect dataset that pairs specimen
    images with DNA barcode sequences and taxonomic labels.
  source_ids: [taylor-site, taylor-cv, bioscan-paper]
  reviewed_at: 2026-10-21
