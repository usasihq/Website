headline: Research scientist at Google DeepMind; co-creator of the Kinetics dataset and the Perception Test
bio:
  text: >-
    João Carreira is a Research Scientist at Google DeepMind working on computer vision, with a focus
    on learning from video. Speaker biographies published by the Simons Institute and the ICIST 2026
    conference describe Carreira as one of the core creators of the Kinetics dataset and, more
    recently, the Perception Test, and as an author of the I3D and Perceiver models. Carreira is
    first author, with Andrew Zisserman, of the 2017 I3D paper "Quo Vadis, Action Recognition?",
    whose trained models are published in Google DeepMind's kinetics-i3d repository, and is listed
    among the authors of the Perception Test benchmark, released in a Google DeepMind repository.
  source_ids: [simons-profile, icist-keynote, i3d-paper, i3d-readme, perception-test-readme, perceiver-paper]
  reviewed_at: 2026-10-13
