sections:
  - heading: Career
    paragraphs:
      - text: >-
          Carreira completed a PhD at the University of Bonn in 2012 on object segmentation, advised by Cristian
          Sminchisescu, and then worked as a postdoctoral researcher with Jitendra Malik at Berkeley on 3D and
          human pose estimation. Carreira's 2010 paper with Adrian Ion and Sminchisescu proposed a mid-level image
          segmentation framework built on ranked figure-ground hypotheses, and a 2015 first-author paper with
          Malik and others introduced iterative error feedback for human pose estimation.
        source_ids: [simons-profile, icist-keynote, segmentation-paper, ief-paper]
      - text: >-
          At DeepMind, now Google DeepMind, Carreira has focused on learning from video. Carreira's 2026 ICIST
          keynote described the team's recent work on 4D reconstruction, multitask vision models, city-scale
          perception and modeling the future for acting and robotics.
        source_ids: [simons-profile, icist-keynote]
  - heading: Video datasets and benchmarks
    paragraphs:
      - text: >-
          Carreira is one of the core creators of the Kinetics human action video dataset, described in a May 2017
          paper, and was first author with Andrew Zisserman of the I3D paper "Quo Vadis, Action Recognition?",
          which introduced inflated 3D convolutional networks trained on Kinetics. Carreira was also first author of follow-up
          notes extending the dataset, including Kinetics-700 in 2019.
        source_ids: [kinetics-paper, i3d-paper, i3d-readme, kinetics700-paper]
      - text: >-
          Carreira is a co-author of the Perception Test (2023), a diagnostic benchmark for multimodal video
          models released with data and baselines in a Google DeepMind repository.
        source_ids: [perception-test-paper, perception-test-readme]
  - heading: Models
    paragraphs:
      - text: >-
          Carreira co-authored the Perceiver (2021), a general architecture that uses iterative attention to
          handle many kinds of input. Later first-author papers include "Learning from One Continuous Video Stream"
          (2023), which studies learning online from a single stream of video, and "Scaling 4D Representations"
          (2024), on scaling self-supervised video models.
        source_ids: [perceiver-paper, continuous-stream-paper, scaling-4d-paper]
