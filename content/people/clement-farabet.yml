headline: VP of Research at Google DeepMind and Gemma 4 core contributor; formerly NVIDIA's VP of AI infrastructure
bio:
  text: >-
    Clément Farabet is VP of Research at Google DeepMind, the title on Farabet's bylines for Google's
    March 2025 Gemma 3 and April 2026 Gemma 4 launch posts; the Gemma 4 post says those models are
    released under a commercially permissive Apache 2.0 license. Farabet is listed among the core
    contributors of the Gemma 4 Technical Report (2026) and among the sponsors of the earlier Gemma,
    Gemma 2 and Gemma 3 reports. A 2022 NVIDIA blog post describes Farabet as NVIDIA's vice president
    of AI infrastructure, designing a data factory for autonomous-vehicle development on the SaturnV
    supercomputer. Farabet is also named, with NYU, among the copyright holders of the Torch7 machine
    learning library.
  source_ids: [gemma3-blog, gemma4-blog, gemma4-report, gemma-report, gemma2-report, gemma3-report, nvidia-blog, torch7-copyright]
  reviewed_at: 2026-10-21
