sections:
  - heading: Research and open-source work
    paragraphs:
      - text: >-
          Farabet's early research, with Camille Couprie, Laurent Najman and Yann LeCun, applied multiscale
          convolutional networks to scene parsing, labeling every pixel of an image with the category of the
          object it belongs to. A 2013 follow-up extended the approach to indoor scenes using depth information.
        source_ids: [scene-parsing-paper, indoor-paper]
      - text: >-
          Farabet is named with NYU among the copyright holders of Torch7, a machine learning library whose C
          backend libraries were later extended and rewritten in the ATen C++11 library. Farabet's GitHub profile also hosts companion projects such as
          torch-ios, a port of Torch7 to iOS, and gfx.js, a browser-based graphics backend with a Torch7 client.
        source_ids: [torch7-copyright, torch7-readme, github-profile]
  - heading: Career
    paragraphs:
      - text: >-
          In a 2022 NVIDIA blog post, Farabet was introduced as NVIDIA's vice president of AI infrastructure,
          with experience that included building Twitter's AI machine. At NVIDIA, Farabet designed a scalable
          data factory on the SaturnV supercomputer for training neural networks used in autonomous-vehicle
          development.
        source_ids: [nvidia-blog]
      - text: >-
          At Google DeepMind, Farabet holds the title of VP of Research and has co-signed the launch posts for
          Gemma 3 and Gemma 4. Farabet appears among the sponsors of the Gemma, Gemma 2 and Gemma 3 technical
          reports and among the core contributors of the Gemma 4 report.
        source_ids: [gemma3-blog, gemma4-blog, gemma-report, gemma2-report, gemma3-report, gemma4-report]
