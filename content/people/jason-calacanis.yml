sections:
  - heading: Shows
    paragraphs:
      - text: >-
          Jason Calacanis hosts This Week in Startups, which LAUNCH has published since 2009 and which
          documents the strategy and execution behind building startups. Journalist Alex Wilhelm co-hosts
          the show and anchors its market and earnings segments, and Calacanis also hosts the companion
          show This Week in AI.
        source_ids: [twist-about, twist-home]
      - text: >-
          Calacanis is a co-host and executive producer of the All-In Podcast, which the show's site
          lists as hosted with Chamath Palihapitiya, David Sacks, and David Friedberg. The show covers
          business, technology, and society, and recent episodes listed on its site regularly discuss AI.
        source_ids: [allin-about, allin-home]
  - heading: Startup programs and writing
    paragraphs:
      - text: >-
          Calacanis is CEO and founder of LAUNCH, which supports founders through events, podcasts,
          books, research products, and startup programs. Its programs include Founder University, a
          12-week pre-accelerator for founders going from idea to first product, which Calacanis runs, and the 14-week LAUNCH
          Accelerator.
        source_ids: [launch-home, twist-about]
      - text: >-
          Calacanis is the author of Angel, a book about early-stage investing.
        source_ids: [twist-about]
