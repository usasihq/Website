headline: Host of This Week in Startups and This Week in AI
bio:
  text: >-
    Jason Calacanis is an entrepreneur and investor who hosts This Week in Startups, a show
    published by LAUNCH since 2009 about the ideas, builders, and operators behind startups and
    what it takes to build a lasting company. Jason Calacanis also hosts This Week in AI. This
    Week in Startups is co-hosted with journalist Alex Wilhelm. Jason Calacanis is the author of the book
    Angel, about early-stage investing, and runs Founder University.
