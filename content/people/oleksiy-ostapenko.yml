headline: Core contributor to Super Apriel, ServiceNow Research's 15B supernet with switchable attention mixers
bio:
  text: >-
    Oleksiy Ostapenko is one of three core contributors to Super Apriel, a 15-billion-parameter supernet from
    ServiceNow Research in which every decoder layer offers several trained mixer choices, released as
    SuperApriel-15B-Base and SuperApriel-15B-Instruct. The paper's contributions section credits Ostapenko
    with model development, supernet training, serving infrastructure and throughput benchmarking. Ostapenko
    is also first author of the Apriel-H1 technical report (November 2025) on hybrid attention and Mamba models.
  source_ids: [superapriel-paper, superapriel-html, aprielh1-paper]
  reviewed_at: 2026-10-22
