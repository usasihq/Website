sections:
  - heading: Apriel-H1
    paragraphs:
      - text: >-
          Ostapenko is first author of the Apriel-H1 technical report (November 2025) from ServiceNow, which lists
          Ostapenko among its core contributors. The report introduces hybrid 15B reasoning models obtained by
          incremental distillation from Apriel-Nemotron-15B-Thinker, replacing less critical attention layers
          with Mamba blocks. Ostapenko also co-wrote ServiceNow-AI's November 2025 post describing the approach.
        source_ids: [aprielh1-paper, aprielh1-html, aprielh1-blog]
  - heading: Super Apriel
    paragraphs:
      - text: >-
          The Super Apriel paper (April 2026) lists Ostapenko first among three core contributors, alongside
          Raymond Li and Torsten Scholak, with authors sorted alphabetically. The model is a 15B-parameter
          supernet whose decoder layers each provide four trained mixer choices, so that one checkpoint can be
          served at several speeds.
        source_ids: [superapriel-paper, superapriel-html]
      - text: >-
          According to the paper's author contributions, Ostapenko worked on model development and experiment
          planning, optimized the vLLM supernet serving infrastructure, ran supernet training through
          distillation and supervised fine-tuning, contributed to mixer initialization and placement evaluation
          code, and benchmarked inference throughput.
        source_ids: [superapriel-html]
