sections:
  - heading: Career
    paragraphs:
      - text: >-
          Heiga Zen worked as an
          intern and co-op researcher at the IBM T.J. Watson Research Center from 2004 to 2005. Zen
          was then a Research Engineer at Toshiba Research Europe's Cambridge Research Laboratory from
          2008 to 2011.
        source_ids: [google-profile]
      - text: >-
          Zen joined Google's Speech team in July 2011 and joined the Brain team in August 2018.
          Since June 2023, Zen has been a Principal Scientist at Google DeepMind, with research
          interests in speech technology and machine learning.
        source_ids: [google-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Zen was one of the original authors and the first maintainer of HTS, the HMM-based speech
          synthesis system. Zen later co-authored WaveNet (2016), a generative model of raw audio waveforms, and
          Parallel WaveNet (2017), which made that approach fast enough to be deployed in Google
          Assistant.
        source_ids: [google-profile, wavenet-paper, parallel-wavenet-paper]
      - text: >-
          Zen has also worked on speech datasets and translation. LibriTTS (2019) adapted the
          LibriSpeech audiobook corpus for text-to-speech research, LibriTTS-R (2023) restored its
          sound quality, and Translatotron 3 (2023) is an unsupervised approach to direct speech-to-speech
          translation learned from monolingual speech-text datasets.
        source_ids: [libritts-paper, librittsr-paper, translatotron3-paper]
