headline: Principal Scientist at Google DeepMind; WaveNet co-author and an original author of HTS speech synthesis
bio:
  text: >-
    Heiga Zen is a Principal Scientist at Google DeepMind, a role Zen has held since June 2023,
    according to Google Research's people page. At Google, Zen was with the Speech team from July
    2011 to July 2018 and then joined the Brain team; earlier roles include an intern/co-op
    researcher position at the IBM T.J. Watson Research Center and a research engineer position at
    Toshiba Research Europe. Zen was one of the original authors and the first maintainer of the
    HMM-based speech synthesis system (HTS), and is a co-author of WaveNet: A Generative Model for
    Raw Audio. Google's page notes that Zen is a fellow of ISCA and IEEE.
  source_ids: [google-profile, wavenet-paper]
  reviewed_at: 2026-10-13
