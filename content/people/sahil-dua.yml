sections:
  - heading: Research
    paragraphs:
      - text: >-
          Dua's papers on embeddings include "Gemini Embedding: Generalizable Embeddings from Gemini"
          (2025) and "EmbeddingGemma: Powerful and Lightweight Text Representations" (2025), and Dua is a
          co-author of "Entity Image and Mixed-Modal Image Retrieval Datasets" (2025). Dua also
          co-authored the T5Gemma 2 paper (2025) and appears among the authors of the Gemma 4 Technical
          Report (2026).
        source_ids: [gemini-embedding-paper, eg-paper, retrieval-datasets-paper, t5gemma2-paper, gemma4-report]
      - text: >-
          In October 2026 Dua and Henrique Schechter Vera, both research engineers at Google DeepMind,
          wrote the Google blog post introducing EmbeddingGemma 2.
        source_ids: [eg2-post]
