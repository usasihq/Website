headline: Google DeepMind research engineer; co-author of EmbeddingGemma and co-writer of the EmbeddingGemma 2 launch
bio:
  text: >-
    Sahil Dua is a research engineer at Google DeepMind whose recent papers concern embedding models. Dua is the
    second author of the EmbeddingGemma paper (2025), a co-author of the Gemini Embedding and
    T5Gemma 2 papers, and co-wrote Google's October 2026 launch post for EmbeddingGemma 2 with
    Henrique Schechter Vera.
  source_ids: [eg2-post, eg-paper, gemini-embedding-paper, t5gemma2-paper]
  reviewed_at: 2026-10-22
