sections:
  - heading: Research
    paragraphs:
      - text: >-
          Xiao's early work covered visual representation learning and human pose estimation, including
          "Simple Baselines for Human Pose Estimation and Tracking" (ECCV 2018) as first author, the HRNet paper
          (CVPR 2019) and CvT, which added convolutions to vision transformers (ICCV 2021). Xiao's site lists
          first place in the single-person pose estimation track of the 2019 Look into Person challenge.
        source_ids: [xiao-site]
      - text: >-
          From 2020 to 2023 Xiao led the Florence-1 and Florence-2 vision foundation models; the Florence-2 paper,
          posted in November 2023 with Lu Yuan as senior author, unifies captioning, detection, grounding and
          segmentation behind text prompts. In 2024 Xiao led Phi-3 Vision and Phi-3.5 Vision.
        source_ids: [xiao-site, florence2-paper]
  - heading: Recent work
    paragraphs:
      - text: >-
          Xiao's site describes work on multimodal Llama post-training for visual understanding in 2024 and 2025,
          and since 2025 on post-training for reasoning, coding and agentic models, including Microsoft AI's
          MAI-Thinking-1 and MAI-Code-1-Flash releases in 2026.
        source_ids: [xiao-site]
