headline: Member of Technical Staff at Microsoft; first author of Florence-2 and former lead of Florence models
bio:
  text: >-
    Bin Xiao is a Member of Technical Staff on the Microsoft Superintelligence team, working on
    multimodal foundation models, computer vision and agentic AI. Xiao is the first author of
    "Florence-2: Advancing a Unified Representation for a Variety of Vision Tasks", presented as an
    oral paper at CVPR 2024, and Xiao's site says Xiao led the Florence-1 and Florence-2 vision
    foundation models from 2020 to 2023. Xiao also led the Phi-3 Vision and Phi-3.5 Vision models and
    co-authored the HRNet and CvT papers.
  source_ids: [xiao-site, florence2-paper]
  reviewed_at: 2026-10-22
