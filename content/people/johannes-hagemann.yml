headline: Co-founder and CTO of Prime Intellect; co-author of the INTELLECT-1, INTELLECT-2 and INTELLECT-3 reports
bio:
  text: >-
    Johannes Hagemann is a co-founder and the chief technology officer of Prime Intellect, which builds
    infrastructure for training and deploying open AI models. Hagemann's site describes earlier work at
    Aleph Alpha on a distributed training framework, and Hagemann is a co-author of the technical reports
    for Prime Intellect's INTELLECT-1, INTELLECT-2 and INTELLECT-3 models.
  source_ids: [hagemann-site, github-profile, intellect1-paper, intellect2-paper, intellect3-paper]
  reviewed_at: 2026-10-22
