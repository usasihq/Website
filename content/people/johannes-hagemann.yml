sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hagemann joined Aleph Alpha in early 2022 to help build a distributed training framework. At the end
          of 2023, Hagemann and Vincent Weisser committed to building Prime Intellect, which Hagemann describes
          as a stack for open AI, from agentic models to the infrastructure used to train, fine-tune and deploy
          them. Hagemann's GitHub profile lists the role of co-founder and CTO.
        source_ids: [hagemann-site, github-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Hagemann co-authored OpenDiLoCo (2024), an open-source framework for distributed training with low
          communication between sites, and the INTELLECT-1 technical report (2024) on a model trained across
          distributed infrastructure. Later reports include INTELLECT-2 (2025), a reasoning model trained
          through globally decentralized reinforcement learning, and INTELLECT-3 (2025).
        source_ids: [opendiloco-paper, intellect1-paper, intellect2-paper, intellect3-paper]
      - text: >-
          Hagemann is also a co-author of TOPLOC (2025), a locality-sensitive hashing scheme for verifiable
          inference, and of METAGENE-1 (2025), a metagenomic foundation model for pandemic monitoring.
        source_ids: [toploc-paper, metagene-paper]
