sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before joining Google Brain, Zoph worked at the Information Sciences Institute with Kevin Knight and
          Daniel Marcu on statistical machine translation. A 2016 paper with Deniz Yuret, Jonathan May and Knight
          presented a transfer learning method for neural machine translation of low-resource languages.
        source_ids: [zoph-site, lowres-nmt-paper]
      - text: >-
          At Google Brain, Zoph was a Staff Research Scientist who trained large sparse language models and
          worked on AutoML in both research and product; Zoph's homepage also mentions serving as a research
          technical lead for MuM. Zoph later became VP of Research (Post-Training) at OpenAI, where the team
          worked on alignment, tool use, evaluations, search and multimodality and trained the models released in
          ChatGPT and the API. The GPT-4o and o1 system cards list Zoph in post-training leadership and executive
          leadership roles.
        source_ids: [zoph-site, gpt4o-system-card, o1-system-card]
  - heading: Research
    paragraphs:
      - text: >-
          Zoph's work on neural architecture search began with a 2016 paper with Quoc V. Le that used a recurrent
          network trained with reinforcement learning to design neural network architectures. A 2017 follow-up
          learned architectures on a small dataset and transferred them to large-scale image recognition, and the
          2018 AutoAugment paper applied a similar search to data augmentation policies.
        source_ids: [nas-paper, nasnet-paper, autoaugment-paper]
      - text: >-
          Zoph also worked on sparse mixture-of-experts language models. Zoph co-authored "Switch Transformers"
          (2021) with William Fedus and Noam Shazeer, which simplified expert routing to scale models to very
          large parameter counts, and was co-first author of "ST-MoE" (2022), which addressed training
          instability and fine-tuning issues in sparse expert models.
        source_ids: [switch-paper, stmoe-paper, zoph-site]
