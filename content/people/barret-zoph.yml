headline: First author of neural architecture search at Google Brain; earlier VP of Research (Post-Training) at OpenAI
bio:
  text: >-
    Barret Zoph's homepage describes earlier roles as VP of Research (Post-Training) at OpenAI, where
    Zoph's team worked on alignment, tool use, evaluations, and the models shipped in ChatGPT and the
    API, and before that as a Staff Research Scientist at Google Brain working on large sparse language
    models and AutoML. With Quoc V. Le at Google Brain, Zoph wrote Neural Architecture Search with
    Reinforcement Learning (2016), and Zoph's homepage lists Switch Transformers and ST-MoE among
    Zoph's sparse-model papers. OpenAI's GPT-4o and o1 system cards credit Zoph as a post-training
    organization lead and in executive leadership, respectively.
