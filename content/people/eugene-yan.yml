headline: Member of Technical Staff at Anthropic; former Principal Applied Scientist at Amazon
bio:
  text: >-
    Eugene Yan is a Member of Technical Staff at Anthropic and describes the work as bridging the
    field and the frontier to help build safe, reliable AI systems. From 2020 to 2025, Yan was a
    Principal Applied Scientist at Amazon, building real-time retrieval, bandit rankers, and
    recommendation systems in search, as well as AI systems for summarization, translation, and
    question answering. Earlier, Yan led machine learning at Alibaba/Lazada as VP of Machine
    Learning. Yan led the bulk of the document integration and overall structure of the 2024 essay
    "What We've Learned From A Year of Building with LLMs", co-written with Bryan Bischof, Charles
    Frye, Hamel Husain, Jason Liu, and Shreya Shankar.
  source_ids: [yan-about, github-profile, applied-llms]
  reviewed_at: 2026-10-21
