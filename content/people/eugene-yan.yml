sections:
  - heading: Career
    paragraphs:
      - text: >-
          Yan worked as a data scientist at IBM from 2013 to 2014 on workforce analytics and fraud detection,
          then joined Alibaba's Lazada as a data scientist working on product ranking, machine learning
          automation and MLOps. Yan became Lazada's VP of Machine Learning in 2017 and in 2018 joined a
          healthtech startup as its machine learning lead, building systems for disease detection and cost
          estimation.
        source_ids: [yan-about]
      - text: >-
          From 2020 to 2025 Yan was a Principal Applied Scientist at Amazon, working on recommendation systems,
          real-time retrieval and search, and AI products for summarization, translation and question answering.
          In 2026 Yan joined Anthropic as a Member of Technical Staff.
        source_ids: [yan-about, github-profile]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Yan writes regularly about applying machine learning and language models. Posts include "System Design
          for Recommendations and Search" (2021), "Patterns for Building LLM-based Systems & Products" (2023),
          a long survey of LLM-evaluators in 2024, and the AlignEval app for building and aligning LLM-evaluators
          against labeled data.
        source_ids: [ey-writing]
      - text: >-
          Yan has given keynotes at the RecSys 2022 ORSUM workshop and at the AI Engineer conference in 2023,
          and joined the five co-authors of the "What We've Learned From A Year of Building with LLMs" essay for
          a closing keynote at AI Engineer 2024. In 2025 Yan spoke with Chip Huyen at NVIDIA GTC on building
          LLM-powered applications.
        source_ids: [ey-speaking, applied-llms]
