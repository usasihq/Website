sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hinton received a PhD in artificial intelligence from Edinburgh in 1978 and held research posts at
          Sussex University, the University of California San Diego and the MRC Applied Psychology Unit.
          From 1982 to 1987 Hinton was on the computer science faculty at Carnegie Mellon University,
          then joined the University of Toronto as a professor and became a fellow of the Canadian Institute
          for Advanced Research.
        source_ids: [hinton-cv, hinton-site]
      - text: >-
          From 1998 to 2001 Hinton set up and directed the Gatsby Computational Neuroscience Unit at University
          College London before returning to the University of Toronto, where Hinton has been an emeritus professor since 2014.
          Hinton directed CIFAR's program on Neural Computation and Adaptive Perception from 2004 to 2013. At
          Google, Hinton was a half-time Distinguished Researcher from 2013 and a Vice President and Engineering
          Fellow from 2016 to 2023, and since 2017 Hinton has been chief scientific adviser to the Vector
          Institute on a pro bono basis.
        source_ids: [hinton-cv, hinton-site]
  - heading: Research
    paragraphs:
      - text: >-
          Hinton's stated aim is to find learning procedures that efficiently discover complex structure in
          large, high-dimensional datasets, and to show that this is how the brain learns to see. Hinton was one
          of the researchers who introduced the back-propagation algorithm, was the first to use it to learn
          word embeddings, and contributed Boltzmann machines, distributed representations, time-delay neural
          networks, mixtures of experts, variational learning, products of experts and deep belief nets.
        source_ids: [hinton-site]
      - text: >-
          Hinton's Toronto group made advances in deep learning for speech recognition and object
          classification, including the 2012 AlexNet paper with Alex Krizhevsky and Ilya Sutskever, which
          trained a large convolutional network on ImageNet. With Oriol Vinyals and Jeff Dean, Hinton wrote the
          2015 paper on knowledge distillation, which compresses an ensemble of models into a single smaller
          model.
        source_ids: [hinton-site, alexnet-paper, distill-paper]
  - heading: Teaching
    paragraphs:
      - text: >-
          Hinton's homepage links a Coursera course on machine learning as well as 2013 undergraduate and
          graduate courses at the University of Toronto. Named lectures listed in Hinton's CV include the ACM
          Turing Lecture in 2019 and the Romanes Lecture in 2024.
        source_ids: [hinton-site, hinton-cv]
