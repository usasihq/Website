headline: 2024 Nobel laureate in Physics; University of Toronto emeritus professor and former Google Vice President
bio:
  text: >-
    Geoffrey Hinton is an emeritus distinguished professor at the University of Toronto. From 2013
    to 2023 Hinton worked half-time at Google, where Hinton became a Vice President and Engineering
    Fellow. Hinton designs machine learning algorithms and was one of the researchers who introduced
    the back-propagation algorithm. Hinton co-authored the AlexNet paper, "ImageNet Classification
    with Deep Convolutional Neural Networks" (NIPS 2012), and "Distilling the Knowledge in a Neural
    Network" (2015), and shared the 2024 Nobel Prize in Physics with John J. Hopfield "for
    foundational discoveries and inventions that enable machine learning with artificial neural
    networks".
  source_ids: [hinton-site, alexnet-paper, distill-paper, nobel-summary, nobel-facts]
  reviewed_at: 2026-10-21
