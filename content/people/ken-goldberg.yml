headline: UC Berkeley Distinguished Professor working on robot grasping and automation; senior author of Dex-Net 2.0
bio:
  text: >-
    Ken Goldberg holds the William S. Floyd Jr. Distinguished Chair of Engineering at UC Berkeley and is
    a Distinguished Professor of IEOR, EECS and Art Practice; Goldberg is also President of the Robot
    Learning Foundation and co-founder and Chief Scientist of Ambi Robotics. Goldberg's homepage links
    the AUTOLab (Automation Research) and the Dexterity Network (Dex-Net) grasping project. Goldberg is
    the senior author of the Dex-Net 2.0 paper, which trains a Grasp Quality Convolutional Neural
    Network on a synthetic dataset of point clouds, grasps and analytic grasp metrics.
