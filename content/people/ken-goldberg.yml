sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ken Goldberg completed an MS and PhD at Carnegie Mellon University's School of Computer Science with
          a dissertation on stochastic plans for robotic manipulation. Goldberg taught computer science at the
          University of Southern California from 1991 to 1995 and then joined UC Berkeley's Industrial
          Engineering and Operations Research department, becoming a full professor in 2002 and a
          Distinguished Professor in 2018.
        source_ids: [cv]
      - text: >-
          Goldberg has directed the Berkeley Automation Sciences Laboratory since 1995, has held secondary
          appointments in EECS since 2001 and in Art Practice since 2012, and has held the William S. Floyd Jr.
          Distinguished Chair of Engineering since 2017. Outside the university Goldberg co-founded Ambi
          Robotics in 2018, serving as Chief Scientist, co-founded Jacobi Robotics in 2024, and is President of
          the Robot Learning Foundation, which organizes the Conference on Robot Learning.
        source_ids: [cv, homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Goldberg's research interests listed on the CV include algorithms for feeding, fixturing, grasping
          and assembly in manufacturing and surgery, cloud and fog robotics, automated agriculture and deep
          learning for robots. The Dex-Net 2.0 paper, which Goldberg co-authored, trained a Grasp Quality
          Convolutional Neural Network on a synthetic dataset of point clouds and analytic grasp metrics to
          plan robust grasps.
        source_ids: [cv, dexnet2-paper]
      - text: >-
          Goldberg also works in art and new media, with an appointment in Art Practice and earlier service as
          director of the Berkeley Center for New Media from 2007 to 2010; the homepage lists projects such as
          the Telegarden and AlphaGarden.
        source_ids: [cv, homepage]
