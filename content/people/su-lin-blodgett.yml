headline: Researcher on the social implications and evaluation of NLP; formerly at Microsoft Research
bio:
  text: >-
    Su Lin Blodgett studies the social and ethical implications of natural language processing
    technologies, including principled evaluation and measurement of generative AI capabilities,
    behaviours, and impacts, how people perceive and use generative AI, and support for practitioners'
    ethical work. Blodgett is an independent visiting researcher at Mila and was
    previously a principal researcher in the Fairness, Accountability, Transparency, and Ethics in AI
    (FATE) group at Microsoft Research, where Blodgett was also a postdoctoral researcher.
    Blodgett is first author of Language (Technology) is Power: A Critical Survey of "Bias" in NLP,
    written with Solon Barocas, Hal Daumé III, and Hanna Wallach, and co-organizes a workshop series
    bridging human-computer interaction and NLP.
  source_ids: [blodgett-site, power-paper]
  reviewed_at: 2026-10-21
