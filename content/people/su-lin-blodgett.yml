sections:
  - heading: Career
    paragraphs:
      - text: >-
          Blodgett was a postdoctoral researcher in the Fairness, Accountability, Transparency, and Ethics in AI
          (FATE) group at Microsoft Research, continuing there as a senior researcher from
          May 2022 and becoming a principal researcher in September 2025. Since April 2026 Blodgett has been an
          independent visiting researcher at Mila - Québec AI Institute, hosted in Jackie Cheung's group.
        source_ids: [blodgett-site]
      - text: >-
          Blodgett served as ethics co-chair for ACL 2022 and is a general chair of the FAccT 2026 conference.
          Blodgett co-organizes a workshop series bridging human-computer interaction and NLP, whose third, fourth
          and fifth editions were planned for NAACL 2024, EMNLP 2025 and NAACL 2027, and co-organized a tutorial on
          human-centred evaluation of language technologies at EMNLP 2024.
        source_ids: [blodgett-site]
  - heading: Research
    paragraphs:
      - text: >-
          Blodgett's research examines the social and ethical implications of language technologies and the
          values and assumptions that shape them. As first author of "Language (Technology) is Power" (2020), with
          Solon Barocas, Hal Daumé III and Hanna Wallach, Blodgett surveyed how NLP papers analyze "bias" and
          argued for grounding such work in the relationships between language and social hierarchies.
        source_ids: [blodgett-site, power-paper]
      - text: >-
          Recent work focuses on evaluating generative AI. Blodgett co-authored position papers arguing that
          evaluating generative AI systems is a social science measurement challenge (ICML 2025) and that AI research
          needs a broader conception of rigour (NeurIPS 2025), along with studies of anthropomorphic AI behaviours,
          representational harms, AI-assisted writing and how generative AI affects information seeking and
          learning.
        source_ids: [blodgett-site]
