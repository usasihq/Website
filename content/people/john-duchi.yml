headline: Stanford associate professor of Statistics and Electrical Engineering; first author of the Adagrad paper
bio:
  text: >-
    John Duchi is an associate professor of Statistics and Electrical Engineering at Stanford University,
    with work spanning statistical learning, optimization, information theory, and computation. Duchi's
    stated goals include large-scale optimization methods that work robustly across machine learning
    problems and tools to assess the validity of machine-learned systems. Duchi is first author, with Elad
    Hazan and Yoram Singer, of the 2011 JMLR paper on adaptive subgradient methods, which PyTorch's
    documentation cites for its Adagrad optimizer, and before joining the Stanford faculty worked at Google
    as a software engineer and as a summer research intern and engineer.
