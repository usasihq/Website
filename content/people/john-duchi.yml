sections:
  - heading: Career
    paragraphs:
      - text: >-
          John Duchi worked as a research assistant with Daphne Koller at Stanford and as a software engineer
          at Google from 2007 to 2008, then completed a PhD in computer science at UC Berkeley advised by
          Michael I. Jordan and Martin J. Wainwright. During the doctorate Duchi spent summers from 2009 to 2014
          as a research intern and engineer working with Yoram Singer at Google.
        source_ids: [cv]
      - text: >-
          Duchi joined the Stanford faculty in September 2014 as an assistant professor of statistics and
          electrical engineering and was promoted to associate professor in September 2021.
        source_ids: [cv, homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Duchi's research spans statistical learning, optimization, information theory and computation. The
          2011 Adagrad paper with Elad Hazan and Yoram Singer introduced subgradient methods that adapt their
          step sizes to the geometry of previously observed data, and the method is implemented as an
          optimizer in PyTorch.
        source_ids: [homepage, adagrad-paper, pytorch-adagrad]
      - text: >-
          With Jordan and Wainwright, Duchi developed minimax theory for locally private estimation, published
          with discussion in the Journal of the American Statistical Association in 2018. Duchi's work with
          Hongseok Namkoong on variance-based regularization with convex objectives received a best paper award
          at NIPS 2017.
        source_ids: [cv]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          At Stanford, Duchi has taught information theory and statistics, the mathematics of convexity,
          applied statistics, probability and introductory matrix methods. The CV also lists a book in preparation,
          Statistics and Information Theory, hosted on the Statistics 311 course site.
        source_ids: [cv]
