sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jordan was a professor at MIT from 1988 to 1998 and then at UC Berkeley from 1998 to 2024; Jordan is now Pehong Chen
          Distinguished Professor Emeritus there, listed with the Departments of EECS and Statistics. Since 2023 Jordan has been a Directeur de Recherche at Inria and the École Normale Supérieure.
        source_ids: [jordan-site]
      - text: >-
          Jordan was an Amazon Scholar from 2018 to 2024 and has held visiting and honorary appointments,
          including a Laureate Professorship at Mohamed Bin Zayed University of Artificial Intelligence since
          2020. Jordan's homepage also lists Jordan as a co-founder of Anyscale and of Arena Intelligence.
        source_ids: [jordan-site]
  - heading: Research
    paragraphs:
      - text: >-
          With David Blei and Andrew
          Ng, Jordan wrote the 2003 paper introducing latent Dirichlet allocation, a generative probabilistic model
          for collections of discrete data such as text corpora. Jordan also co-authored the
          2017 paper presenting Ray, a distributed framework for emerging AI applications.
        source_ids: [lda-paper, ray-paper]
      - text: >-
          More recent work with Anastasios Angelopoulos, Stephen Bates, Clara Fannjiang and Tijana Zrnic
          introduced prediction-powered inference in 2023, a framework for valid statistical inference when
          experimental data are supplemented with machine-learning predictions.
        source_ids: [mj-ppi]
  - heading: Teaching and mentoring
    paragraphs:
      - text: >-
          Jordan's homepage lists current PhD students and postdocs along with a long roster of former students
          and postdocs who now hold academic and industry positions, among them David Blei, Francis Bach and
          Yoshua Bengio.
        source_ids: [jordan-site]
