headline: Co-author of the Ray and latent Dirichlet allocation papers; UC Berkeley Distinguished Professor Emeritus
bio:
  text: >-
    Michael I. Jordan is a Directeur de Recherche at Inria and the École Normale Supérieure and the
    Pehong Chen Distinguished Professor Emeritus in EECS and Statistics at UC Berkeley, where Jordan
    was a professor from 1998 to 2024 after a decade on the MIT faculty. Jordan was also an Amazon
    Scholar from 2018 to 2024. Jordan co-authored the latent Dirichlet allocation (LDA) paper with
    David Blei and Andrew Ng, and the paper introducing Ray, the distributed framework for AI
    applications.
  source_ids: [jordan-site, lda-paper, ray-paper]
  reviewed_at: 2026-10-21
