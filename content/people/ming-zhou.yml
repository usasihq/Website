headline: Founder and CEO of Langboat; former Vice President of Microsoft Research Asia, where Zhou led NLP research
bio:
  text: >-
    Ming Zhou is the founder and CEO of Langboat Technology, established in June 2021, which develops
    the Mengzi series of language models. Zhou joined Microsoft Research Asia in 1999 and led its
    natural language processing research for more than 20 years until the end of 2020, serving as a
    vice president of Microsoft Research Asia. Langboat's biography credits Zhou's teams with work on
    machine translation, the Windows Chinese-Japanese input method, Bing Dictionary, chatbot engines for
    XiaoIce, and pre-trained models including UniLM. Zhou is an ACL Fellow and has served as president of
    the ACL.
  source_ids: [langboat-resume, langboat-about, unilm-paper, mengzi-paper]
  reviewed_at: 2026-10-21
