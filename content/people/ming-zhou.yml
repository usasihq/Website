sections:
  - heading: Career
    paragraphs:
      - text: >-
          Zhou completed a doctorate in computer science at Harbin Institute of Technology in 1991, where the
          thesis research produced CEMT-I, an early Chinese-English machine translation system. From 1991 to
          1999 Zhou did postdoctoral research and taught at Tsinghua University, and from 1993 to 1999 led
          development of J-Beijing, a Chinese-Japanese machine translation product for Kodensha.
        source_ids: [langboat-resume]
      - text: >-
          Zhou joined Microsoft Research Asia in 1999 and led its NLP research for 21 years, rising to vice
          president, before leaving at the end of 2020. Zhou then founded Langboat Technology, officially
          established in June 2021, which develops the Mengzi language models and applies them in fields such
          as finance. Zhou has also served as president of the ACL and vice chairman of the China Computer
          Federation.
        source_ids: [langboat-resume, langboat-about]
  - heading: Research
    paragraphs:
      - text: >-
          At Microsoft Research Asia, Zhou's group worked on statistical and then neural machine translation,
          contributing methods later built into Microsoft Translator, and on language-learning tools such as
          the English Writing Assistant (2005) and Engkoo (2010), later offered through Bing. The group also
          built a statistical input method for Chinese and Japanese in Windows (2001) and a system for
          generating Chinese couplets with phrase-based statistical machine translation.
        source_ids: [langboat-resume]
      - text: >-
          Zhou's teams provided the retrieval-based and neural response engines behind Microsoft's XiaoIce
          chatbot, first released in 2015, and later worked on pre-trained models, including UniLM, which
          uses a shared Transformer with self-attention masks for both language understanding and generation.
          At Langboat, Zhou co-authored the 2021 Mengzi report on lightweight Chinese pre-trained models.
        source_ids: [langboat-resume, unilm-paper, mengzi-paper]
