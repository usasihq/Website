sections:
  - heading: Career
    paragraphs:
      - text: >-
          Johnson spent 24 years at Qualcomm, holding leadership roles across engineering, sales, marketing
          and business development and serving on the company's executive committee. Johnson led the
          Internet Services division, which launched the BREW app downloading platform in 2001.
        source_ids: [agility-johnson-ceo]
      - text: >-
          Johnson then spent six years as executive vice president of business development at Microsoft,
          where Johnson launched the M12 corporate venture fund, and later served as CEO of the spatial
          computing company Magic Leap, leading its shift from consumer to enterprise products and the
          launch of Magic Leap 2.
        source_ids: [agility-johnson-ceo]
  - heading: Agility Robotics
    paragraphs:
      - text: >-
          Agility Robotics appointed Johnson CEO on March 4, 2024, succeeding co-founder Damion Shelton, who
          had led the company since 2015. Agility's leadership page says Johnson is focused on bringing
          AI-powered humanoid robots to market.
        source_ids: [agility-johnson-ceo, agility-about]
      - text: >-
          In September 2026 Agility introduced Digit 5, a humanoid robot designed to work close to people
          without the safety barriers used in traditional automation, with Johnson quoted as CEO.
        source_ids: [agility-digit5]
