headline: CEO of Agility Robotics, maker of the Digit humanoid robot; former CEO of Magic Leap
bio:
  text: >-
    Peggy Johnson is the CEO of Agility Robotics, which builds the Digit humanoid robot for logistics and
    manufacturing work, and has led the company since March 2024. Johnson was previously CEO of Magic
    Leap, executive vice president of business development at Microsoft, and a member of Qualcomm's
    executive committee.
