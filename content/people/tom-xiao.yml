headline: Senior Corporate Vice President of Engineering at Supermicro, which Xiao joined in 2001
bio:
  text: >-
    Jin "Tom" Xiao is Senior Corporate Vice President of Engineering at Supermicro. Xiao joined the
    company in 2001 as a Staff Hardware Design Engineer and now oversees software engineering,
    product development, switch development, lab validation and global IT operations. Before
    Supermicro, Xiao was Assistant General Manager of R&D at Lenovo QDI.
