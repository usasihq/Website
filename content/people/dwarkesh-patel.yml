headline: Host of Dwarkesh Podcast and author of The Scaling Era, an oral history of AI from 2019 to 2025
bio:
  text: >-
    Dwarkesh Patel hosts Dwarkesh Podcast, a show of in-depth interviews published on YouTube, podcast
    apps, and a Substack publication. Through the podcast, Dwarkesh has interviewed AI researchers and
    company founders about work at the frontier of AI research and development. With Gavin Leech,
    Dwarkesh compiled those conversations into The Scaling Era: An Oral History of AI, 2019–2025,
    published by Stripe Press with accompanying definitions, graphics, and footnotes.
