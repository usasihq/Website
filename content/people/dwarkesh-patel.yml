sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Dwarkesh Patel hosts Dwarkesh Podcast; episodes from 2020 featured
          guests such as economists Bryan Caplan and Tyler Cowen and computer scientist Scott Aaronson.
          The show describes itself as deeply researched interviews and is released on YouTube, Apple
          Podcasts, Spotify, and Substack.
        source_ids: [ep-caplan, ep-cowen, ep-aaronson, about, home]
      - text: >-
          Since 2023 the podcast has featured long interviews with AI lab leaders and researchers,
          including Ilya Sutskever, Dario Amodei, Demis Hassabis, and Andrej Karpathy.
        source_ids: [ep-sutskever, ep-amodei, ep-hassabis, ep-karpathy]
  - heading: Publications
    paragraphs:
      - text: >-
          In October 2025, Stripe Press released The Scaling Era: An Oral History of AI, 2019–2025,
          which Patel compiled with Gavin Leech from the podcast's conversations with people at the
          frontier of AI research.
        source_ids: [scaling-era]
