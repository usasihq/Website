headline: Executive Vice President and Head of Data and AI at Siemens; former AWS Vice President of Generative
  AI
bio:
  text: >-
    Vasi Philomin has been Executive Vice President and Head of Data and Artificial Intelligence at
    Siemens since July 1, 2025, with a mandate that includes growing Siemens's AI offerings and
    developing an industrial foundation model. Philomin joined Siemens from Amazon, where Philomin
    most recently served as Vice President of Generative AI in charge of AWS's AI product strategy,
    helped build Amazon Bedrock and oversaw foundation model development. Earlier, Philomin held
    senior roles at Philips focused on computer vision and connected systems.
  source_ids: [siemens-2025, siemens-2026]
  reviewed_at: 2026-10-21
