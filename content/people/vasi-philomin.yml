sections:
  - heading: Career
    paragraphs:
      - text: >-
          Philomin has more than two decades of experience in technology leadership, according to Siemens. At
          Philips, Philomin held senior roles leading innovation initiatives in computer vision and connected
          systems, and Philomin is named as an inventor on U.S. patents. Philomin holds a PhD in computer
          science focused on machine learning and computer vision from the University of Maryland.
        source_ids: [siemens-2025]
      - text: >-
          At Amazon, Philomin most recently served as Vice President of Generative AI, in charge of the AI
          product strategy of Amazon Web Services. In that role Philomin helped build Amazon Bedrock and
          oversaw the development of foundation models.
        source_ids: [siemens-2025]
  - heading: Industrial AI at Siemens
    paragraphs:
      - text: >-
          Siemens appointed Philomin Executive Vice President and Head of Data and Artificial Intelligence
          effective July 1, 2025, reporting to Peter Koerte, the managing board member who serves as Chief
          Technology Officer and Chief Strategy Officer. The mandate covers growing Siemens's portfolio of AI
          applications, which includes the Industrial Copilot, and developing an industrial foundation model.
        source_ids: [siemens-2025]
      - text: >-
          Siemens's June 2026 announcement of two new capabilities for Siemens's Eigen
          Engineering Agent, an AI agent for industrial automation engineering that works alongside the TIA
          Portal and was launched at Hannover Messe in April 2026, quotes Philomin as head of Data and AI.
        source_ids: [siemens-2026]
