headline: Researcher at Meta Superintelligence Labs; earlier a contributor to GPT-4 and OpenAI o1
bio:
  text: >-
    Shengjia Zhao is a researcher at Meta. On its July 30, 2025 earnings call, Meta said Zhao was Chief
    Scientist for the new lab effort within Meta Superintelligence Labs, and Zhao is listed among the
    senior contributors to Meta's May 2026 Muse Spark Safety & Preparedness Report and the Code World
    Model Preparedness Report. Earlier, Zhao contributed to OpenAI models: the GPT-4 Technical Report
    credits Zhao as reward model lead, and the OpenAI o1 System Card lists Zhao among the foundational
    contributors to reasoning research.
  source_ids: [meta-q2-2025-call, muse-spark-report, cwm-report, gpt4-report, o1-system-card]
  reviewed_at: 2026-10-21
