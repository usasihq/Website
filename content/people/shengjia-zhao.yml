sections:
  - heading: OpenAI
    paragraphs:
      - text: >-
          Zhao is credited in the GPT-4 Technical Report (2023) as reward model lead and among contributors to
          flagship training runs, ChatGPT evaluations and model-graded evaluation infrastructure. Zhao is also
          listed among the authors of the GPT-4o System Card (2024), and the OpenAI o1 System Card (2024)
          names Zhao among the foundational contributors to reasoning research.
        source_ids: [gpt4-report, gpt4o-card, o1-system-card]
      - text: >-
          Zhao's name also appears in the author lists of OpenAI's gpt-oss-120b and gpt-oss-20b model card
          (August 2025) and the GPT-5 System Card.
        source_ids: [gptoss-card, gpt5-card]
  - heading: Meta Superintelligence Labs
    paragraphs:
      - text: >-
          On Meta's July 30, 2025 earnings call, Meta described a new lab effort within Meta Superintelligence
          Labs, with Alexandr Wang leading the overall team, Nat Friedman leading AI products and applied
          research, and Zhao as Chief Scientist. In 2026 Zhao was listed among the senior contributors to
          Meta's Code World Model Preparedness Report and Muse Spark Safety & Preparedness Report, and among
          the authors of the Muse Glimmer 30B on-device agentic model report.
        source_ids: [meta-q2-2025-call, cwm-report, muse-spark-report, glimmer-paper]
