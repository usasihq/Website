headline: Chief Technology Officer at Airbnb; founded Meta's Generative AI group and led the team behind Llama
bio:
  text: >-
    Ahmad Al-Dahle is Chief Technology Officer at Airbnb, which announced the appointment in January
    2026. According to that announcement, Al-Dahle joined Meta in 2020 to lead mapping and applied AI
    within Reality Labs, founded Meta's Generative AI group in early 2023, and led the team behind the
    Llama family of open-source models, along with the teams bringing AI features to Facebook,
    Instagram, and WhatsApp. Al-Dahle is listed among the core contributors of The Llama 3 Herd of
    Models (2024). Earlier, at Apple, Al-Dahle worked on the iPhone's display and multitouch systems
    and in 2014 created and led Apple's autonomous technology group.
