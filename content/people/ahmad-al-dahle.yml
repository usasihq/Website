sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ahmad Al-Dahle began working at Apple on the iPhone in 2005, two years before its launch,
          and later joined full time. Airbnb's announcement describes Al-Dahle as one of the core
          technologists behind the iPhone's display and multitouch systems, and says Al-Dahle went on
          to ship features across nearly a dozen devices in Apple's core technology platform group,
          including the first Apple Watch.
        source_ids: [airbnb-cto]
      - text: >-
          In 2014 Al-Dahle created and led Apple's autonomous technology group, which developed core
          AI systems for the company's self-driving car project. Al-Dahle joined Meta in 2020 to
          lead mapping and applied AI within Reality Labs.
        source_ids: [airbnb-cto]
  - heading: Generative AI and Llama
    paragraphs:
      - text: >-
          In early 2023 Al-Dahle founded Meta's Generative AI group, led the launch of the Llama
          family of open models, and headed the teams that brought AI features to Facebook, Instagram and
          WhatsApp. Al-Dahle is listed among the authors of The Llama 3 Herd of Models
          (2024), the paper describing the Llama 3 release.
        source_ids: [airbnb-cto, llama3-paper]
  - heading: Airbnb
    paragraphs:
      - text: >-
          Airbnb announced Al-Dahle as its Chief Technology Officer on January 14, 2026. In a
          September 2026 Airbnb post on access to OpenAI frontier models, Al-Dahle is quoted as
          Airbnb's Chief Technology Officer describing how those models support the company's
          developer tooling.
        source_ids: [airbnb-cto, airbnb-openai-post]
