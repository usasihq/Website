sections:
  - heading: Career
    paragraphs:
      - text: >-
          Palmer ran a software development and design studio before founding Turborepo, a build-system
          startup that Vercel acquired in late 2021. At Vercel, Palmer became VP of AI. Palmer's site lists
          later roles as SVP of Product at GitHub and VP of Engineering at Xbox, and names Palmer's current
          role as VP of Engineering at Cognition.
        source_ids: [palmer-site, palmer-github]
  - heading: AI SDK and v0
    paragraphs:
      - text: >-
          Palmer, with Shu Ding and Max Leiter, wrote Vercel's June 2023 announcement of the Vercel AI SDK, an
          open-source library for building streaming chat interfaces in JavaScript and TypeScript with React
          and Svelte. Palmer is also first-listed author of the March 2024 post on AI SDK 3.0, which open
          sourced the generative UI technology from v0.
        source_ids: [vercel-ai-sdk-intro, vercel-ai-sdk-3]
      - text: >-
          Palmer co-wrote the May 2024 AI SDK 3.1 post with Lars Grammel, which announced that the ModelFusion
          project was joining the team and introduced AI SDK Core, and appears on the author lists of later
          release posts including AI SDK 4.0 in November 2024.
        source_ids: [vercel-ai-sdk-3-1, vercel-ai-sdk-4]
