headline: VP of Engineering at Cognition; created Vercel's AI SDK and v0 while VP of AI at Vercel
bio:
  text: >-
    Jared Palmer is the VP of Engineering at Cognition, the company behind the Devin software
    engineering agent. Palmer's site says that, as VP of AI at Vercel, Palmer created the AI SDK and
    v0, after Vercel acquired Palmer's build-system startup Turborepo in late 2021, and that Palmer
    later served as SVP of Product at GitHub and VP of Engineering at Xbox. Palmer is the first-listed
    author of Vercel's June 2023 post introducing the AI SDK.
  source_ids: [palmer-site, palmer-github, vercel-ai-sdk-intro]
  reviewed_at: 2026-10-22
