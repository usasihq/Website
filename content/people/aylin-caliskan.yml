headline: University of Washington associate professor studying bias, safety, and societal impacts of AI
bio:
  text: >-
    Aylin Caliskan is an Associate Professor in the Information School at the University of Washington,
    with a courtesy appointment in the Paul G. Allen School of Computer Science & Engineering, and a
    co-director of the Tech Policy Lab. Caliskan's research covers technical and empirical AI ethics
    and safety in natural language processing, multimodal machine learning, and human-AI
    collaboration, developing methods to detect, quantify, and mitigate biases, errors, and potential
    harms of AI systems. Caliskan is first author, with Joanna J. Bryson and Arvind Narayanan, of
    Semantics derived automatically from language corpora contain human-like biases, which replicated
    standard human biases measured by the Implicit Association Test in GloVe word embeddings trained on
    web text.
  source_ids: [caliskan-site, semantics-paper]
  reviewed_at: 2026-10-13
