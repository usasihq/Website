sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before joining the University of Washington, Aylin Caliskan was a postdoctoral researcher
          and fellow at Princeton University's Center for Information Technology Policy and then an
          Assistant Professor of Computer Science at George Washington University. At UW, Caliskan was
          promoted to Associate Professor with tenure in the Information School, holds an adjunct
          appointment in the Paul G. Allen School of Computer Science & Engineering, and co-directs the
          Tech Policy Lab.
        source_ids: [caliskan-bio, caliskan-site]
      - text: >-
          In 2021 Caliskan was appointed a Nonresident Fellow in Governance Studies at the Brookings
          Institution, in its Center for Technology Innovation. Caliskan is a program co-chair of the
          AAAI/ACM Conference on Artificial Intelligence, Ethics, and Society (AIES 2026), held in
          October 2026.
        source_ids: [caliskan-bio, caliskan-site]
  - heading: Research
    paragraphs:
      - text: >-
          Caliskan develops evaluation methods and mitigation techniques to make the societal impacts
          of AI systems more transparent, working across natural language processing, multimodal
          machine learning and human-AI collaboration. The 2016 paper "Semantics derived automatically
          from language corpora contain human-like biases", written with Joanna J. Bryson and Arvind
          Narayanan, showed that word embeddings trained on ordinary web text reproduce biases measured
          by the Implicit Association Test.
        source_ids: [caliskan-bio, semantics-paper]
      - text: >-
          Caliskan's recent publications study bias in vision-language models and text-to-image
          generators, the influence of biased AI recommendations on human hiring decisions, and the
          safety of language-model agents. Examples include VIGNETTE, a socially grounded bias
          evaluation for vision-language models at ACL 2026, and work on personalized safety in large
          language models at NeurIPS 2025.
        source_ids: [caliskan-site]
