headline: Co-founder and COO of TypeSafe AI; former research engineer at Meta and FAIR
bio:
  text: >-
    Sasha Sheng is a founder and the COO of TypeSafe AI, a San Francisco company that builds System
    One models returning typed, probabilistic decisions for software automation. TypeSafe's team page
    describes Sheng as a former research engineer at Meta and FAIR, where Sheng worked on News Feed,
    AI experiences and AI research, and notes published work at NeurIPS and ECCV.
  source_ids: [typesafe-team, typesafe-launch]
