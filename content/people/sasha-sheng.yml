sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before TypeSafe, Sheng was a research engineer at Meta and its FAIR research group, working across
          News Feed, AI experiences and AI research, and published work at the NeurIPS and ECCV conferences.
          TypeSafe's team page lists Sheng among the company's three founders, as COO, alongside CEO Diogo
          Almeida and CTO Erik Gafni.
        source_ids: [typesafe-team]
      - text: >-
          TypeSafe came out of two years in stealth in September 2026 with Jev, a model that answers typed
          questions about supplied input with structured values and probabilities.
        source_ids: [typesafe-launch]
