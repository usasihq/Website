sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before MLCommons, Mattson founded the Programming Systems and Applications Group at NVIDIA
          Research, was vice president of software infrastructure at Stream Processors Inc., and
          was a managing engineer at Reservoir Labs.
        source_ids: [mlc-leadership]
      - text: >-
          Mattson founded the MLPerf consortium and served as its General Chair, then founded
          MLCommons, which Mattson leads as President while working as a senior staff engineer at
          Google.
        source_ids: [mlc-leadership]
  - heading: Benchmarks
    paragraphs:
      - text: >-
          Mattson is first author of the 2019 MLPerf Training Benchmark paper, which set out rules
          and methods for measuring machine learning training performance across systems, and a
          co-author of the companion MLPerf Inference Benchmark paper.
        source_ids: [mlperf-training, mlperf-inference]
      - text: >-
          Mattson also co-authored MLCommons' work on AI safety evaluation: the v0.5 AI Safety
          Benchmark in April 2024 and AILuminate v1.0, a benchmark of AI risk and reliability, in
          February 2025.
        source_ids: [safety-v05, ailuminate-paper]
