headline: Founder and President of MLCommons and founding General Chair of MLPerf; senior staff engineer at Google
bio:
  text: >-
    Peter Mattson founded and is President of MLCommons, the engineering consortium behind the
    MLPerf and AILuminate benchmarks, and founded and was General Chair of the MLPerf consortium
    that preceded it. Mattson is a senior staff engineer at Google whose research focuses on
    understanding machine learning models and data through quantitative metrics.
  source_ids: [mlc-leadership]
  reviewed_at: 2026-10-21
