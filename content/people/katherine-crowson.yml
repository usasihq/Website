sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Crowson's k-diffusion library implements the EDM framework from "Elucidating the Design Space of
          Diffusion-Based Generative Models" (Karras et al., 2022) in PyTorch, adding sampling algorithms and
          transformer-based diffusion models. It includes the image_transformer_v2 model type, which draws on
          the Hourglass Transformer and DiT and uses neighborhood attention at low levels of the hierarchy and
          global attention at higher ones.
        source_ids: [kdiff-readme, kdiff-license]
  - heading: Research
    paragraphs:
      - text: >-
          The 2022 VQGAN-CLIP paper, with Crowson and Stella Biderman as co-first authors, describes steering
          a VQGAN image generator with CLIP so that images can be generated and edited from text prompts; the
          paper credits Crowson with originating the idea and leading its development. Crowson is also a
          co-author of LAION-5B, an open image-text dataset paper in the NeurIPS 2022 Datasets and Benchmarks
          track.
        source_ids: [vqganclip-paper, vqganclip-html, laion5b-paper]
      - text: >-
          In 2024 Crowson was first author of the Hourglass Diffusion Transformer (HDiT) paper, on generating
          high-resolution images directly in pixel space with a hierarchical transformer. In 2026 Crowson
          co-authored LoRA-Muon, a paper on spectral steepest-descent optimization for low-rank adapters.
        source_ids: [hdit-paper, lora-muon-paper]
