headline: Creator of the k-diffusion library and co-first author of VQGAN-CLIP
bio:
  text: >-
    Katherine Crowson, whose GitHub profile reads "AI/generative artist", is the author of k-diffusion,
    an MIT-licensed PyTorch implementation of Karras et al.'s EDM diffusion framework with
    improved sampling algorithms and transformer-based diffusion models. Crowson is co-first author of
    "VQGAN-CLIP: Open Domain Image Generation and Editing with Natural Language Guidance" (2022), listed
    with an EleutherAI affiliation; the paper credits Crowson with originating the idea of combining
    VQGAN with CLIP and with heading the approach's development. Crowson is also first author of
    "Scalable High-Resolution Pixel-Space Image Synthesis with Hourglass Diffusion Transformers"
    (2024), and the k-diffusion README documents an hourglass diffusion transformer model type.
  source_ids: [crowson-github, kdiff-readme, kdiff-license, vqganclip-html, vqganclip-paper, hdit-paper]
  reviewed_at: 2026-10-21
