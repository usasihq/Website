sections:
  - heading: Efficient neural networks
    paragraphs:
      - text: >-
          Much of Wu's early research looked at making neural networks small and fast enough for edge devices such
          as cars and phones. SqueezeDet (2016) is a compact fully convolutional network for real-time object
          detection in autonomous driving, and SqueezeSeg (2017) segments road objects in 3D LiDAR point clouds;
          Wu released implementations of both on GitHub, the SqueezeDet one in TensorFlow. Wu's 2019 PhD dissertation, "Efficient Deep
          Neural Networks", gathers this line of work.
        source_ids: [squeezedet-paper, squeezeseg-paper, github-profile, dissertation]
      - text: >-
          Wu was also first author of "Shift" (2017), a zero-FLOP, zero-parameter alternative to spatial
          convolutions, and of FBNet (2018), which used differentiable neural architecture search to design
          efficient networks for mobile hardware. The FBNet family continued with FBNetV5 (2021), on searching
          architectures for multiple vision tasks in a single run.
        source_ids: [shift-paper, fbnet-paper, fbnetv5-paper]
  - heading: Vision transformers and generative video
    paragraphs:
      - text: >-
          Wu's 2020 paper "Visual Transformers" proposed representing images as semantic visual tokens
          processed with transformers. In late 2023, as first author of Fairy from GenAI at Meta, Wu worked on fast
          instruction-guided video editing, and Wu co-authored FlowVid, which uses optical flow together with
          spatial conditions to keep edited video frames consistent.
        source_ids: [visual-transformers-paper, fairy-paper, flowvid-paper]
