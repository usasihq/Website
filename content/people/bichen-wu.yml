headline: Computer vision researcher; first author of Meta's Fairy video-editing paper and of FBNet
bio:
  text: >-
    Bichen Wu's GitHub profile describes Wu as a research scientist in AI, and the work cited here covers
    efficient computer vision and generative video. Wu is first author of Fairy (2023), a paper from GenAI
    at Meta that adapts image-editing diffusion models for fast, instruction-guided video-to-video editing.
    Earlier, while listed with UC Berkeley, Wu was first author of FBNet (2018), a differentiable neural
    architecture search method for designing accurate and efficient ConvNets for mobile devices; the paper
    notes that Wu's work on it was done while interning at Facebook.
