headline: President and co-founder of Harvey; co-author of the post introducing Harvey's Legal Agent Benchmark
bio:
  text: >-
    Gabe Pereyra is the President and co-founder of Harvey, which builds AI software for legal and
    professional services. Harvey's author page says Pereyra co-founded the company in 2022 after working
    as a research scientist at DeepMind and as a machine learning engineer at Meta. Pereyra co-wrote the
    May 2026 post that introduced LAB, Harvey's open-source Legal Agent Benchmark.
  source_ids: [harvey-author-pereyra, harvey-lab-post]
  reviewed_at: 2026-10-22
