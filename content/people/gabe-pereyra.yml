sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before co-founding Harvey in 2022, Pereyra worked as a research scientist at DeepMind and as a
          machine learning engineer at Meta. Harvey's author page presents Pereyra today as the company's
          President and co-founder.
        source_ids: [harvey-author-pereyra]
  - heading: Research and writing at Harvey
    paragraphs:
      - text: >-
          Pereyra is a byline author, with Niko Grupen and Julio Pereyra, of "Introducing Harvey's Legal
          Agent Benchmark" (May 2026). The post introduced LAB, whose open-source repository combines a
          dataset of legal tasks with agent instructions, documents and rubrics, and an execution harness
          for running and scoring agents.
        source_ids: [harvey-lab-post, harvey-labs-readme]
      - text: >-
          Pereyra's author page also lists 2026 posts on training legal agents and review-table models,
          a research preview of Harvey Tenet, and post-training agents for M&A diligence.
        source_ids: [harvey-author-pereyra]
