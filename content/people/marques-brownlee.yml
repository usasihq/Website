headline: Creator of the MKBHD YouTube channel and co-host of the Waveform tech podcast
bio:
  text: >-
    Marques Brownlee, known as MKBHD, makes tech videos on the MKBHD YouTube channel, reviewing consumer
    electronics such as smartphones, cameras, and electric cars. Marques also co-hosts Waveform, a weekly tech
    podcast with Andrew Manganelli and David Imel that covers new technology and which products are worth
    buying; Waveform is part of the Vox Media Podcast Network. The official MKBHD website links the channel,
    the podcast, and the studio's other work.
