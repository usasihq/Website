sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Brownlee's main YouTube channel, MKBHD, dates from March 2008 and describes itself as making quality tech
          videos about consumer electronics. Its reviews range from new smartphones to cameras and electric cars,
          the subjects the Waveform channel cites when introducing Brownlee.
        source_ids: [channel, waveform]
      - text: >-
          The MKBHD studio also runs companion channels. The Studio, started in April 2021, carries
          behind-the-scenes videos, event reactions and challenges from the MKBHD team, and Auto Focus, started in
          August 2022, publishes car videos from Brownlee and Miles Somerville.
        source_ids: [studio-channel, autofocus-channel]
  - heading: Waveform
    paragraphs:
      - text: >-
          Waveform is a tech podcast that Brownlee co-hosts with Andrew Manganelli and David Imel, and its YouTube
          channel dates from March 2019. Each episode looks at recent technology and which products are worth
          buying, and the official MKBHD website links to it alongside Brownlee's other channels.
        source_ids: [waveform, site]
