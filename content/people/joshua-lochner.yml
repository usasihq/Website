slug: joshua-lochner
name: Joshua Lochner
initials: JL
headline: Works on Transformers.js at Hugging Face, a library for running Transformers models in the browser
bio:
  text: >-
    Joshua Lochner works on Transformers.js at Hugging Face, a library that runs
    Transformers models directly in the browser with no server required. He is a
    byline author of Hugging Face's release announcements for Transformers.js v3
    in 2024, which added WebGPU support, and v4 in 2026. His GitHub profile
    describes his work as bringing machine learning to the web.
