sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Transformers.js, whose repository was created in February 2023 and is released under the Apache-2.0
          license, lets developers run Hugging Face Transformers models directly in the browser with no need for a
          server. Lochner published releases ranging from the 2.0 alphas in May 2023 to the 4.3 releases
          in 2026, and wrote the Hugging Face blog posts announcing version 3,
          with WebGPU support and new models and tasks, and version 4.
        source_ids: [transformersjs-repo, transformersjs-releases, hf-blog-v3, hf-blog-v4]
  - heading: Browser demos and other projects
    paragraphs:
      - text: >-
          Lochner's own GitHub repositories include browser demos built on these tools. Whisper Web runs
          speech recognition entirely in the browser, and Kokoro Web does the same for speech synthesis.
          Earlier projects include sponsorblock-ml, a model that detects sponsored segments and self-promotion
          in YouTube videos.
        source_ids: [whisper-web-repo, kokoro-web-repo, sponsorblock-ml-repo]
