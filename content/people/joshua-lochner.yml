headline: Works on Transformers.js at Hugging Face, a library for running Transformers models in the browser
bio:
  text: >-
    Joshua Lochner works on Transformers.js at Hugging Face, a library that runs Transformers models
    directly in the browser without a server. Lochner wrote Hugging Face's announcement of
    Transformers.js v3 in 2024, which added WebGPU support, and co-wrote the v4 announcement in 2026.
    Lochner's GitHub profile describes the work as bringing machine learning to the web.
  source_ids: [github-profile, transformersjs-repo, hf-blog-v3, hf-blog-v4]
  reviewed_at: 2026-10-21
