headline: Co-founder and President of Cloudflare; co-author with Matthew Prince of Cloudflare's annual founders' letters
bio:
  text: >-
    Michelle Zatlyn is a co-founder and the President of Cloudflare, the connectivity cloud company that
    launched on September 27, 2010. Before co-founding Cloudflare, Zatlyn held positions at Google and
    Toshiba and launched two startups. With co-founder Matthew Prince, Zatlyn writes Cloudflare's annual
    founders' letter, which in 2026 discussed the rise of AI agents and automated traffic on the Internet.
  source_ids: [cf-press-kit, mz-author, letter-2026, letter-2025]
  reviewed_at: 2026-10-22
