sections:
  - heading: Career
    paragraphs:
      - text: >-
          Zatlyn held positions at Google and Toshiba and launched two startups before co-founding
          Cloudflare, which launched on September 27, 2010. Zatlyn is the company's President and also
          serves on the board of directors of Atlassian.
        source_ids: [cf-press-kit, letter-2026]
  - heading: Writing
    paragraphs:
      - text: >-
          Zatlyn and Matthew Prince co-write Cloudflare's annual founders' letters, with letters from 2020
          through 2026 listed on Zatlyn's Cloudflare Blog author page. The 2026 letter described how automated
          traffic from AI agents and crawlers passed human activity on the Internet earlier than the company
          had forecast. In 2021 Zatlyn announced Cloudflare's first Canadian office and team.
        source_ids: [mz-author, letter-2026, canada-post]
