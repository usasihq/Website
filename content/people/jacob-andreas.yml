headline: MIT associate professor in EECS and CSAIL studying language learning and how neural models represent meaning
bio:
  text: >-
    Jacob Andreas is an associate professor at MIT in EECS and CSAIL. Andreas's research aims to
    understand the computational foundations of language learning and to build systems that
    communicate with people and learn from human guidance in natural language. One line of the work
    asks what features and strategies black-box models learn: Andreas co-authored a study of
    in-context learning in transformers using linear models, and MILAN, a procedure that labels
    neurons in vision models with natural-language descriptions.
  source_ids: [andreas-site, icl-paper, milan-paper]
  reviewed_at: 2026-10-21
