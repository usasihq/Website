work:
  - name: "What learning algorithm is in-context learning? Investigations with linear models"
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2211.15661
    contribution: >-
      Co-author of the ICLR 2023 paper, which tests the hypothesis that transformer in-context
      learners implicitly implement standard learning algorithms, using linear regression as the
      test problem.
    source_ids: [icl-paper, andreas-site]
  - name: Natural Language Descriptions of Deep Visual Features (MILAN)
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2201.11114
    contribution: >-
      Last-listed author of the ICLR 2022 paper introducing MILAN, a procedure that
      automatically labels neurons in deep vision networks with natural-language descriptions.
    source_ids: [milan-paper, andreas-site]
  - name: Neural Module Networks
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/1511.02799
    contribution: >-
      First author of the paper that assembles neural networks from reusable modules according to
      the structure of each question, applied to visual question answering.
    source_ids: [nmn-paper]
