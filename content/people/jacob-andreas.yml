sections:
  - heading: Career
    paragraphs:
      - text: >-
          Jacob Andreas did PhD work at UC Berkeley as a member of the Berkeley NLP Group and the
          Berkeley AI Research Lab. Andreas is now an associate professor at MIT in the
          Department of Electrical Engineering and Computer Science and the Computer Science and
          Artificial Intelligence Laboratory.
        source_ids: [andreas-bio, andreas-site]
  - heading: Research
    paragraphs:
      - text: >-
          Andreas's group studies language as a communicative and computational tool, organized around
          interactive learning from natural-language supervision, scientific understanding of neural
          models, and human-like language understanding. Papers in the first line include work on
          eliciting human preferences with language models (ICLR 2025) and on learning planning
          representations from language guidance (ICLR 2024).
        source_ids: [andreas-site, elicitation-paper]
      - text: >-
          Work on understanding neural models includes "Implicit Representations of Meaning in Neural
          Language Models" (ACL 2021), the MILAN procedure for describing neurons in vision models
          (ICLR 2022), and an analysis of in-context learning with linear models (ICLR 2023). Andreas was also first author of Neural Module Networks, which composes question-specific
          networks from reusable modules for visual question answering.
        source_ids: [andreas-site, implicit-meaning-paper, milan-paper, icl-paper, nmn-paper]
