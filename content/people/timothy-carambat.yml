sections:
  - heading: Products and projects
    paragraphs:
      - text: >-
          Timothy Carambat's GitHub profile describes Carambat as the founder of Mintplex Labs, maker of
          AnythingLLM, and as a mechanical and software engineer. AnythingLLM's documentation presents it
          as an all-in-one application for chatting with documents and running AI agents, and the README
          lists local model runners such as Ollama, LM Studio and LocalAI alongside cloud providers.
        source_ids: [github-profile, anythingllm-docs-intro, anythingllm-readme]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Carambat made the AnythingLLM repository's initial commit in June 2023. The changelog for the
          v1.0.0 release credits Carambat with many of the project's early pull requests, including
          Chroma and LanceDB vector database support, authentication, workspace-specific settings and
          an AWS CloudFormation deployment template.
        source_ids: [anythingllm-initial-commit, release-v1-0-0]
      - text: >-
          Carambat publishes the project's releases on GitHub. The v1.1.0 release in August 2024 added
          multimodality support in a pull request by Carambat, and Carambat published v1.18.0 in October
          2026 while continuing to author commits to the repository.
        source_ids: [release-v1-1-0, release-v1-18-0, anythingllm-commits]
