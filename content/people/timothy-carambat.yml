headline: Founder of Mintplex Labs, maker of AnythingLLM, an AI application that runs locally by default
bio:
  text: >-
    Timothy Carambat founded Mintplex Labs, the company that builds AnythingLLM, an MIT-licensed
    application for chatting with documents and running AI agents that the README says runs locally
    by default. AnythingLLM connects to local model runners such as Ollama, LM Studio, and LocalAI as
    well as to cloud providers. Carambat made the repository's initial commit in June 2023 and
    continues to commit to it.
  source_ids: [anythingllm-docs-intro, github-profile, anythingllm-readme, anythingllm-initial-commit, anythingllm-commits]
  reviewed_at: 2026-10-02
