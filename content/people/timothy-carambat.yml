work:
  - name: AnythingLLM
    artifact_slug: anythingllm
    url: https://github.com/Mintplex-Labs/anything-llm
    contribution: >-
      Made the repository's initial commit on 2023-06-04 and continues to author commits. The
      README describes an all-in-one AI application that lets users connect a
      local or cloud model and their documents, lists local providers including Ollama, LM Studio,
      and LocalAI, and states that the project is MIT-licensed.
    source_ids: [anythingllm-initial-commit, anythingllm-commits, anythingllm-readme]
