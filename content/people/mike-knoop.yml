headline: Co-founder and board member of the ARC Prize Foundation; co-founder of Zapier and of the lab Ndea
bio:
  text: >-
    Mike Knoop is a co-founder and board member of the ARC Prize Foundation, the non-profit that runs
    the ARC Prize competitions and the ARC-AGI benchmarks, alongside co-founder François Chollet.
    Knoop wrote the June 2024 post announcing ARC Prize and is a co-author of the ARC Prize 2024
    technical report and the ARC-AGI-2 paper. Knoop's own site lists Knoop as a co-founder and board
    member of Zapier and as co-founder and CEO of Ndea, which it describes as an intelligence science
    lab; the site was last updated in February 2025.
  source_ids: [arc-about, arc-launch, arc-2024-report, arc-agi-2-paper, knoop-site]
  reviewed_at: 2026-10-22
