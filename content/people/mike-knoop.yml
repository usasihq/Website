sections:
  - heading: ARC Prize
    paragraphs:
      - text: >-
          Knoop wrote the June 11, 2024 announcement of ARC Prize, a public competition for progress on the
          ARC-AGI benchmark, which François Chollet introduced to measure
          a system's ability to acquire new skills efficiently. Knoop's site also lists Knoop's analyses of
          OpenAI o1 (2024) and DeepSeek R1-Zero and R1 (2025), posts that appear on the foundation's blog.
        source_ids: [arc-launch, knoop-site, arc-blog]
      - text: >-
          Knoop is a co-author, with Chollet, Greg Kamradt and Bryan Landers, of the ARC Prize 2024 technical
          report, and with those authors and Henry Pinkard of the ARC-AGI-2 paper (2025). Knoop also wrote the
          foundation's December 2025 analysis of ARC Prize 2025 results. The foundation's about page lists Knoop
          as co-founder and board member.
        source_ids: [arc-2024-report, arc-agi-2-paper, arc-2025-results, arc-about]
  - heading: Other roles
    paragraphs:
      - text: >-
          Knoop's site, last updated in February 2025, lists three roles: co-founder and CEO of Ndea,
          co-founder and board member of the ARC Prize Foundation, and co-founder and board member of the
          automation company Zapier.
        source_ids: [knoop-site]
