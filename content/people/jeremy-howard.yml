work:
  - name: FSDP/QLoRA
    artifact_slug: null
    url: https://github.com/AnswerDotAI/fsdp_qlora
    contribution: >-
      Answer.AI's announcement credits Howard with discussing the idea of combining FSDP and QLoRA in
      late 2023 and with exploring and documenting the issues that occurred when the two were
      combined. The Apache-2.0 repository documents fine-tuning Llama 2 70B on two 24 GB GPUs, with
      4-bit quantization through bitsandbytes or HQQ.
    source_ids: [fsdp-qlora-post, fsdp-qlora-readme, fsdp-qlora-license]
  - name: Hugging Face Transformers in FSDP/QLoRA
    artifact_slug: transformers
    url: https://github.com/AnswerDotAI/fsdp_qlora
    contribution: >-
      According to the announcement, Howard studied how Meta's Llama-Recipes worked with bitsandbytes
      and Hugging Face's PEFT, Transformers, and Accelerate libraries, then built a minimal standalone
      script covering every step needed to fine-tune a model. The project's installation steps use
      the Transformers library.
    source_ids: [fsdp-qlora-post, fsdp-qlora-readme]
