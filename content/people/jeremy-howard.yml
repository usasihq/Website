sections:
  - heading: Career
    paragraphs:
      - text: >-
          Howard's site lists early work as an analytical specialist at McKinsey & Co and in a machine learning
          and data analytics practice at A.T. Kearney, followed by the startups FastMail and Optimal Decisions
          Group, where Howard developed profit-optimized pricing for insurance. Howard was later the founding
          President and Chief Scientist of Kaggle, the data science competition community, and founded Enlitic,
          a company applying deep learning to medicine.
        source_ids: [jeremy-site]
      - text: >-
          Howard is a founding researcher at fast.ai and an honorary professor at the University of Queensland.
          In December 2023 Howard, as founding CEO, and Eric Ries, as founding director, launched Answer.AI, an
          R&D lab that builds practical end-user products from foundational research.
        source_ids: [jeremy-site, answerai-launch, github-profile]
  - heading: Research
    paragraphs:
      - text: >-
          With Sebastian Ruder, Howard wrote "Universal Language Model Fine-tuning for Text Classification"
          (2018), which introduced ULMFiT, a method for pretraining a language model and then fine-tuning it
          for text classification tasks. The fastai library's design is described in "fastai: A Layered API for
          Deep Learning" (2020), written with Sylvain Gugger.
        source_ids: [ulmfit-paper, fastai-paper]
      - text: >-
          At Answer.AI, Howard took part in the FSDP/QLoRA project, released in March 2024, which combines fully
          sharded data parallel training with quantized low-rank adaptation so that a 70-billion-parameter
          model can be fine-tuned on two 24 GB consumer GPUs.
        source_ids: [fsdp-qlora-post, fsdp-qlora-readme, fsdp-qlora-license]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Howard created course.fast.ai, the free Practical Deep Learning for Coders course for people with some
          coding experience, whose second part covers topics from matrix multiplication and backpropagation to
          Stable Diffusion and latent diffusion. The book "Deep Learning for Coders with Fastai and
          PyTorch: AI Applications Without a PhD", listed on Howard's site among Howard's works, accompanies the
          course and is written entirely as Jupyter notebooks that can also be read free online.
        source_ids: [fastai-course, fastai-book, jeremy-site]
      - text: >-
          Howard has also created open-source tools beyond fastai, including nbdev, which the fastai library itself
          uses for its tests and development workflow, and fastpages, a blogging platform.
        source_ids: [jeremy-site, fastai-repo]
