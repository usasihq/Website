headline: Co-founder of Answer.AI, which released FSDP/QLoRA for fine-tuning large models on gaming GPUs
bio:
  text: >-
    Jeremy Howard co-founded Answer.AI, an AI research and development lab, is a founding researcher
    at fast.ai, and created the fastai deep learning library. Answer.AI's first
    project, FSDP/QLoRA, is an open-source system for fine-tuning a 70-billion-parameter language
    model on a desktop computer with two 24 GB gaming GPUs. Answer.AI's announcement describes Howard
    discussing the combination of FSDP and QLoRA with Tim Dettmers, working with Hugging Face's Titus
    von Koeller to document the problems that arose, and writing a minimal standalone fine-tuning
    script for the project.
  source_ids: [jeremy-site, github-profile, fsdp-qlora-post]
  reviewed_at: 2026-10-01
