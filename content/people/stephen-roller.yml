headline: Member of Technical Staff at Thinking Machines Lab; co-first author of OPT; dialogue and LLM work at Meta FAIR
bio:
  text: >-
    Stephen Roller's homepage lists a current role as a Member of the Technical Staff at Thinky,
    linking to the Thinking Machines Lab website. Roller was previously a Senior Staff Research
    Scientist at Google DeepMind, a Member of the Technical Staff at Character.AI working on
    pretraining and training infrastructure, and, from 2017 to 2023, a Senior Staff Research Engineer
    at Meta's Fundamental AI Research (FAIR) team, where Roller worked on the large language model and
    dialogue teams. At FAIR, Roller was one of three equal-contribution first authors of OPT (2022) and
    first author of Recipes for Building an Open-Domain Chatbot (2020), which made its models and code
    publicly available; Roller also co-authored BlenderBot 3 (2022).
  source_ids: [roller-site, opt-paper, blender-paper, bb3-paper]
  reviewed_at: 2026-10-13
