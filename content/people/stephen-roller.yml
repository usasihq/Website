sections:
  - heading: Career
    paragraphs:
      - text: >-
          Stephen Roller's homepage divides Roller's publications into undergraduate work, a PhD period
          from 2010 to 2017, and a period at Meta's Fundamental AI Research team from 2017 to 2023. The
          PhD in Computer Science was completed at the University of Texas at Austin under the
          supervision of Katrin Erk, with a 2017 dissertation on identifying lexical relationships and
          entailments with distributional semantics.
        source_ids: [roller-site]
      - text: >-
          After FAIR, Roller led pretraining and training infrastructure work at Character.AI and then
          worked as a Senior Staff Research Scientist at Google DeepMind. The homepage now lists a role
          as a Member of the Technical Staff at Thinky, linking to Thinking Machines Lab, and notes that Roller's pretraining
          work since leaving FAIR has not been published.
        source_ids: [roller-site]
  - heading: Research
    paragraphs:
      - text: >-
          Roller's doctoral research, much of it with Katrin Erk, studied distributional semantics,
          including hypernymy detection, lexical substitution, and lexical entailment. At FAIR, Roller
          continued this line with the 2018 ACL paper on Hearst patterns for hypernym detection before
          moving into open-domain dialogue.
        source_ids: [roller-site]
      - text: >-
          Roller was first author of Recipes for Building an Open-Domain Chatbot, submitted in April
          2020, which describes building chatbots at several model sizes and releases the models and
          code. Roller later co-authored the BlenderBot 3 paper in August 2022 and the Science paper on
          playing the game Diplomacy by combining language models with strategic reasoning.
        source_ids: [blender-paper, bb3-paper, roller-site]
      - text: >-
          On large language models, Roller was a joint first author of OPT: Open Pre-trained Transformer
          Language Models, submitted in May 2022, whose code is published in the MIT-licensed metaseq
          repository. Roller was also first author of Hash Layers for Large Sparse Models, a 2021 NeurIPS
          paper that replaces learned mixture-of-experts routing with token hashing.
        source_ids: [opt-paper, metaseq-license, hash-layers, roller-site]
