headline: Google researcher; co-author of Tacotron and Tacotron 2 and first author of Tacotron prosody transfer
bio:
  text: >-
    RJ Skerry-Ryan is listed in Google Research's people directory, with Google publications from
    2017 through 2025 and speech processing among the research areas. Skerry-Ryan is the second author of Tacotron: Towards End-to-End Speech
    Synthesis, an end-to-end generative text-to-speech model whose paper lists its authors at
    Google, and a co-author of the Tacotron 2 paper. Skerry-Ryan is also first author of Towards
    End-to-End Prosody Transfer for Expressive Speech Synthesis with Tacotron, which extends Tacotron
    with a learned latent embedding space of prosody.
  source_ids: [google-profile, tacotron-paper, tacotron-pdf, tacotron2-paper, prosody-paper]
