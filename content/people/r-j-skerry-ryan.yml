sections:
  - heading: Research
    paragraphs:
      - text: >-
          Skerry-Ryan's research at Google centers on speech synthesis, and the Google Research people page lists
          machine intelligence and machine perception among Skerry-Ryan's research areas. Skerry-Ryan was second
          author of the 2017 Tacotron paper, an end-to-end generative text-to-speech model, and a co-author of
          Tacotron 2 later that year.
        source_ids: [google-profile, tacotron-paper, tacotron-pdf, tacotron2-paper]
      - text: >-
          In March 2018 Skerry-Ryan was first author of a paper extending Tacotron with a learned latent embedding
          space of prosody for expressive speech, and co-authored the Style Tokens paper on unsupervised style
          modeling, control and transfer. Later work on Tacotron includes location-relative attention mechanisms
          for robust long-form synthesis (2019) and Wave-Tacotron (2020), which generates speech waveforms directly
          from text without spectrograms.
        source_ids: [prosody-paper, style-tokens-paper, location-attention-paper, wave-tacotron-paper]
      - text: >-
          More recent publications on Skerry-Ryan's Google Research page include speaker generation with
          TacoSpawn (ICASSP 2022), Spectron, which adapts pretrained language models for spoken question answering
          and speech continuation (ICLR 2024), and ZeroBAS, a method for synthesizing binaural speech from
          monaural recordings (Interspeech 2025).
        source_ids: [google-profile]
