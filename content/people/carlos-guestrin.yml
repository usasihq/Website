headline: Stanford computer science professor; co-author of XGBoost and LIME and co-founder of Turi
bio:
  text: >-
    Carlos Guestrin is a Professor of Computer Science at Stanford University, the Fortinet
    Founders Professor, and a Senior Fellow at the Stanford Institute for Human-Centered AI.
    Guestrin was previously the Amazon Professor of Machine Learning at the University of
    Washington and the Finmeccanica Associate Professor at Carnegie Mellon University. Guestrin
    co-founded Turi (formerly GraphLab and Dato) and, after Apple acquired it, served as Apple's
    Senior Director of Machine Learning and AI. Guestrin's teams released open-source projects
    including XGBoost, LIME, Apache TVM, MXNet, Turi Create and GraphLab/PowerGraph, and Guestrin
    co-authored the XGBoost paper with Tianqi Chen and the LIME paper on explaining the
    predictions of any classifier.
  source_ids: [stanford-profile, xgboost-paper, lime-paper]
