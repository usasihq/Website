sections:
  - heading: Career
    paragraphs:
      - text: >-
          Guestrin's previous positions include the Finmeccanica Associate Professorship at Carnegie
          Mellon University and the Amazon Professorship of Machine Learning in Computer Science and
          Engineering at the University of Washington. Guestrin co-founded Turi, Inc., known earlier as
          GraphLab and Dato, which built a platform for developers and data scientists to build and
          deploy intelligent applications.
        source_ids: [stanford-profile]
      - text: >-
          After Apple acquired Turi, Guestrin served as Apple's Senior Director of Machine Learning and
          AI. Guestrin is now a Professor in Stanford's Computer Science Department, holds the Fortinet
          Founders Professorship, and is a Senior Fellow at the Stanford Institute for Human-Centered
          AI and a member of Bio-X. Guestrin is also a former member of DARPA's Information Sciences and
          Technology (ISAT) advisory group.
        source_ids: [stanford-profile]
  - heading: Research and open-source work
    paragraphs:
      - text: >-
          Guestrin's early systems work includes GraphLab, a framework for expressing parallel machine
          learning algorithms, introduced in a 2010 paper and extended to distributed cloud settings in
          2012. Guestrin's teams went on to release open-source projects including XGBoost, LIME, Apache
          TVM, MXNet, Turi Create, GraphLab/PowerGraph, SFrame and GraphChi.
        source_ids: [graphlab-paper, distributed-graphlab-paper, stanford-profile]
      - text: >-
          With Tianqi Chen, Guestrin wrote the 2016 paper describing XGBoost, a scalable end-to-end
          tree boosting system, and with Marco Tulio Ribeiro and Sameer Singh the 2016 paper introducing
          LIME, which explains an individual prediction of any classifier by learning a simple model
          around it. Guestrin is also a co-author of the 2018 TVM paper on an optimizing compiler that
          brings deep learning workloads to a wide range of hardware.
        source_ids: [xgboost-paper, lime-paper, tvm-paper]
  - heading: Teaching
    paragraphs:
      - text: >-
          At Stanford, Guestrin taught Machine Learning (CS 229) in the autumn and Ethics of Artificial
          Intelligence (CS 281) in the spring in each academic year from 2023–24 to 2025–26, and
          advises master's and doctoral students in computer science.
        source_ids: [stanford-profile]
