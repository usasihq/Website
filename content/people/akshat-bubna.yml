sections:
  - heading: Modal
    paragraphs:
      - text: >-
          Bubna and Erik Bernhardsson are Modal's founders, and Modal's blog lists Bubna as CTO and
          co-founder. Modal describes building its own infrastructure, including a custom file system,
          container runtime, scheduler and container image builder, so that customers can scale workloads
          such as generative AI inference and model fine-tuning across CPUs and GPUs.
        source_ids: [modal-company, modal-blog]
      - text: >-
          In May 2026 Bubna co-authored, with Charles Frye, Jonathon Belotti and Erik Bernhardsson, Modal's
          engineering post on making GPUs serverless, which describes the company's work over five years on
          fast replica start-up for inference workloads.
        source_ids: [modal-serverless-gpus]
