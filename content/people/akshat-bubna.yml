headline: Co-founder and CTO of Modal, the serverless cloud platform for AI and data workloads
bio:
  text: >-
    Akshat Bubna is a co-founder and the CTO of Modal, which builds a serverless cloud platform for
    data, AI and machine learning applications on its own file system, container runtime and scheduler.
    Bubna co-authored Modal's 2026 engineering post on how the company achieved serverless GPUs.
