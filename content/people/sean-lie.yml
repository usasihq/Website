headline: Co-founder and CTO of Cerebras; presenter of its wafer-scale engine architecture at Hot Chips
bio:
  text: >-
    Sean Lie is a co-founder and the CTO of Cerebras, the company that builds wafer-scale processors
    and systems for AI training and inference. Lie co-founded Cerebras in 2015 with Andrew Feldman, Gary
    Lauterbach, Michael James and Jean-Philippe Fricker, and has presented the company's wafer-scale
    architecture at the Hot Chips symposium, including the first Wafer Scale Engine in 2019.
  source_ids: [cerebras-company, hc31-slides, hc33-program, hc34-program]
  reviewed_at: 2026-10-22
