sections:
  - heading: Cerebras
    paragraphs:
      - text: >-
          Lie is one of the five people Cerebras names as founding the company in 2015 with the aim of
          bringing wafer-scale computing to market, and the company's leadership page lists Lie as CTO and
          co-founder. Cerebras's history lists the WSE-1 and CS-1, WSE-2 and CS-2, and WSE-3 and CS-3
          generations, followed by the CS-4 system in 2026.
        source_ids: [cerebras-company]
  - heading: Technical presentations
    paragraphs:
      - text: >-
          Lie has described Cerebras's hardware at the Hot Chips symposium on high-performance chips. In
          2019 Lie presented the first Wafer Scale Engine at Hot Chips 31, in 2021 presented "The
          Multi-Million Core, Multi-Wafer AI Cluster" at Hot Chips 33, and in 2022 gave a deep dive into
          the Cerebras architecture and its hardware and software co-design at Hot Chips 34.
        source_ids: [hc31-slides, hc33-program, hc34-program]
