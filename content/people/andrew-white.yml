headline: Co-founder and Head of Science of FutureHouse; co-founder and CTO of Edison Scientific
bio:
  text: >-
    Andrew White is a co-founder and the Head of Science of FutureHouse, a nonprofit that builds
    AI systems for scientific discovery, and a co-founder and the CTO of Edison Scientific, the
    company that spun out of FutureHouse in 2025. Edison's team page credits White with leading
    AI-for-science projects including the ChemCrow chemistry agent, the ether0 reasoning model and
    the PaperQA literature agent, and notes earlier work as a professor and researcher in machine
    learning for chemistry, explainable AI, statistical mechanics and chemical engineering.
  source_ids: [fh-team, fh-about, edison-team]
  reviewed_at: 2026-10-21
