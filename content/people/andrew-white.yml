sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before FutureHouse, White worked as a professor and researcher in machine learning for
          chemistry, explainable AI, statistical mechanics and chemical engineering, and Edison
          notes junior investigator awards from the NSF and NIH. White co-founded FutureHouse with
          Sam Rodriques in 2023.
        source_ids: [edison-team, fh-about]
      - text: >-
          In November 2025, White and Rodriques launched Edison Scientific to commercialize
          FutureHouse's AI Scientist. White is now Head of Science at FutureHouse and CTO at Edison.
        source_ids: [fh-edison, fh-team, edison-team]
  - heading: Research
    paragraphs:
      - text: >-
          White's work centers on language agents for science. ChemCrow connected a language model
          to chemistry tools, PaperQA and PaperQA2 answer questions from scientific literature, and
          the Aviary framework trains language agents on tasks ranging from literature research to
          protein design.
        source_ids: [chemcrow-paper, paperqa-paper, paperqa2-paper, aviary-paper, aviary-gh, fh-about]
      - text: >-
          White is the senior author of the ether0 paper, which trains a reasoning model for
          chemistry with reinforcement learning, and a co-author of Robin, a multi-agent system for
          automating scientific discovery.
        source_ids: [ether0-paper, robin-paper]
