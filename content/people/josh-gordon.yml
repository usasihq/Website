headline: Wrote the TensorFlow Hub launch post as Developer Advocate for TensorFlow, and later TensorFlow release posts
bio:
  text: >-
    Josh Gordon wrote the TensorFlow Blog's March 2018 introduction of TensorFlow Hub, a library for
    publishing and reusing pretrained machine learning modules, as Developer Advocate for TensorFlow.
    Gordon later wrote or co-wrote posts for the TensorFlow team, including the announcements of
    TensorFlow 2.3 in 2020 and TensorFlow 2.7 in 2021, and a 2022 post with Laurence Moroney on
    developing TensorFlow side by side with JAX.
  source_ids: [tf-hub-post, tf-23-post, tf-27-post, tf-toolbox-post]
