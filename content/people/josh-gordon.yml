sections:
  - heading: Writing for TensorFlow
    paragraphs:
      - text: >-
          As Developer Advocate for TensorFlow, Josh Gordon wrote the March 2018 TensorFlow Blog post
          introducing TensorFlow Hub, a library for publishing, discovering and reusing pretrained parts of
          machine learning models. The post framed the library as a shared repository of reusable model
          components, comparable to code libraries in conventional software development.
        source_ids: [tf-hub-post]
      - text: >-
          Gordon later wrote release announcements for the TensorFlow team. The TensorFlow 2.3 post in 2020
          covered new tools for loading and preprocessing data and for removing input-pipeline bottlenecks,
          and the TensorFlow 2.7 post, co-written with Goldie Gadde in 2021, covered clearer error messages,
          simplified stack traces and help for users migrating to TensorFlow 2.
        source_ids: [tf-23-post, tf-27-post]
      - text: >-
          In 2022 Gordon and Laurence Moroney co-wrote a TensorFlow team post on the direction of the
          framework, including work on interoperability between TensorFlow and JAX.
        source_ids: [tf-toolbox-post]
  - heading: Teaching materials
    paragraphs:
      - text: >-
          Gordon's GitHub profile publishes educational repositories, including slides and code from a
          TensorFlow workshop and tutorials and exercises prepared for International Women's Day 2021 events
          at Google and elsewhere.
        source_ids: [github-profile]
