headline: Research scientist at Google; first author of Prompt-to-Prompt image editing with cross-attention control
bio:
  text: >-
    Amir Hertz is a research scientist at Google, developing algorithms for intuitive image editing and
    creation and working on the training and distillation of fundamental vision models. Hertz received
    a PhD at Tel Aviv University under Daniel Cohen-Or and Raja Giryes, with doctoral work on 3D shape
    generation, texture synthesis, 3D modeling, and meshing. Hertz is first author of "Prompt-to-Prompt
    Image Editing with Cross Attention Control" and co-first author of "Null-text Inversion for Editing
    Real Images using Guided Diffusion Models", both presented by authors from Google Research and Tel
    Aviv University and released in the Apache-2.0-licensed google/prompt-to-prompt repository.
  source_ids: [hertz-site, p2p-paper, p2p-project, nti-paper, nti-project, p2p-repo]
  reviewed_at: 2026-10-21
