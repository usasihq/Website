sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hertz completed a PhD in the Department of Computer Science at Tel Aviv University,
          supervised by Daniel Cohen-Or and Raja Giryes. The doctoral work produced models and methods
          for 3D shape generation, texture synthesis, 3D modeling and meshing.
        source_ids: [hertz-site]
      - text: >-
          At Google, Hertz develops algorithms for intuitive image editing and creation and works on
          improving the training and distillation of fundamental vision models. Hertz describes the
          broader aim as adapting machine learning practice to computer graphics and vision so that
          design tools become easier to use.
        source_ids: [hertz-site]
  - heading: Research
    paragraphs:
      - text: >-
          Hertz's early papers dealt with geometry: MeshCNN applied convolutions to the edges of
          triangle meshes, Deep Geometric Texture Synthesis and PointGMM followed in 2020, and
          SPAGHETTI (SIGGRAPH 2022) let people edit implicit 3D shapes part by part.
        source_ids: [hertz-site, meshcnn-paper, spaghetti-paper]
      - text: >-
          From 2022 the work turned to text-to-image diffusion models. Prompt-to-Prompt showed that
          images can be edited by changing only the text prompt while controlling cross-attention,
          and Null-text Inversion extended such editing to real photographs. Later papers include
          Delta Denoising Score (ICCV 2023), Style Aligned image generation (CVPR 2024) and The Chosen
          One, on keeping a character consistent across generated images (SIGGRAPH 2024).
        source_ids: [p2p-paper, nti-paper, dds-paper, style-aligned-paper, chosen-one-paper, hertz-site]
