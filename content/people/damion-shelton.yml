headline: Co-founder and Chairman of the Board of Agility Robotics; its CEO from 2015 to 2024
bio:
  text: >-
    Damion Shelton is a co-founder and the Chairman of the Board of Agility Robotics, the maker of the
    Digit humanoid robot. Shelton served as Agility's CEO from the company's founding in 2015 until 2024,
    then as President and later Chief Engagement Officer. Before Agility, Shelton co-founded threeRivers
    3D and served as its CTO and the designer of a low-cost laser scanner for healthcare users.
  source_ids: [agility-about, agility-johnson-ceo, agility-leadership-2024]
  reviewed_at: 2026-10-22
