sections:
  - heading: Career
    paragraphs:
      - text: >-
          Shelton co-founded threeRivers 3D, serving as CTO and designing a low-cost, high-volume laser
          scanner for novice users in healthcare until the company was acquired in 2012. Shelton then
          co-founded Agility Robotics in 2015 and served as its CEO until 2024.
        source_ids: [agility-leadership-2024]
      - text: >-
          When Peggy Johnson became CEO in March 2024, Shelton took the role of President. In December
          2024 Shelton became Chief Engagement Officer, leading commercial and investor engagements.
          Agility's leadership page now lists Shelton as co-founder and Chairman of the Board, serving as a
          board member and advisor.
        source_ids: [agility-johnson-ceo, agility-leadership-2024, agility-about]
