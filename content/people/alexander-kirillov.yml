sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kirillov's homepage records doctoral work at Heidelberg University under the supervision of Carsten
          Rother, after a diploma at Lomonosov Moscow State University with Dmitry Vetrov and Alexander Dyakonov.
          Kirillov then became a research scientist at Facebook AI Research (FAIR), later led the multimodal
          research group at OpenAI that worked on Advanced Voice Mode and GPT-4o, and now works on multimodal AI
          models at Thinking Machines.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Much of Kirillov's research concerns image segmentation. "Panoptic Segmentation" (2018), with Kaiming He,
          Ross Girshick, Carsten Rother and Piotr Dollár, proposed a task that unifies semantic and instance
          segmentation along with a panoptic quality metric. Follow-up work included Panoptic Feature Pyramid
          Networks and PointRend, which treats segmentation as a rendering problem.
        source_ids: [panoptic-paper, panoptic-fpn-paper, pointrend-paper]
      - text: >-
          Kirillov co-authored DETR, which frames object detection as direct set prediction with a transformer,
          and later work on universal image segmentation with a masked-attention mask transformer. As first author of Segment Anything
          (2023), Kirillov introduced a promptable segmentation model released with a large segmentation dataset
          and its code.
        source_ids: [detr-paper, homepage, sam-paper, sam-readme]
