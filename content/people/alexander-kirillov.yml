headline: First author of Segment Anything; works on multimodal models at Thinking Machines; formerly OpenAI and FAIR
bio:
  text: >-
    Alexander Kirillov works on multimodal AI models at Thinking Machines. Before that, Kirillov led
    the multimodal research group at OpenAI, working on Advanced Voice Mode and GPT-4o, and was a
    research scientist at Facebook AI Research (FAIR), where Kirillov worked on Segment Anything.
    Kirillov is first author of the 2023 Segment Anything paper, whose repository releases the model
    under the Apache 2.0 license, is listed in the citation entry for the Detectron2 library, and is
    a co-author of DETR (End-to-End Object Detection with Transformers).
  source_ids: [homepage, sam-paper, sam-readme, detectron2-readme, detr-paper]
  reviewed_at: 2026-10-21
