headline: Princeton associate professor co-leading the Princeton NLP Group; co-author of RoBERTa and SimCSE
bio:
  text: >-
    Danqi Chen is an associate professor of computer science at Princeton University, where Chen
    co-leads the Princeton NLP Group and is an associate director of Princeton Language and
    Intelligence (PLI). Chen's homepage says Chen spent academic year 2025–26 as a member of technical
    staff at Thinking Machines Lab and earlier spent time as a research scientist at Facebook AI
    Research (FAIR) and Google DeepMind. Chen is a co-author of RoBERTa: A Robustly Optimized BERT
    Pretraining Approach and of SimCSE: Simple Contrastive Learning of Sentence Embeddings, whose code
    is released under the MIT license in the princeton-nlp/SimCSE repository.
  source_ids: [chen-site, roberta-paper, simcse-paper, simcse-repo]
  reviewed_at: 2026-10-21
