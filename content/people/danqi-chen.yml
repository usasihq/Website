sections:
  - heading: Career
    paragraphs:
      - text: >-
          Chen received a PhD in computer science from Stanford University in 2018, advised by Christopher
          Manning in the Stanford NLP Group; the thesis later received Stanford's Arthur Samuel Best Doctoral
          Thesis Award. At Princeton, Chen is an associate professor of computer science, co-leads the
          Princeton NLP Group, and is an associate director of Princeton Language and Intelligence.
        source_ids: [chen-site, chen-awards]
      - text: >-
          Outside Princeton, Chen has worked as a research scientist at Facebook AI Research and Google
          DeepMind, and spent the 2025–26 academic year as a member of technical staff at Thinking Machines
          Lab.
        source_ids: [chen-site]
  - heading: Research
    paragraphs:
      - text: >-
          Chen's earlier work focused on reading comprehension and open-domain question answering, including
          first-authored work on answering open-domain questions by reading Wikipedia (2017) and co-authorship
          of Dense Passage Retrieval (2020). Chen also co-authored the RoBERTa study of BERT pretraining in
          2019 and SimCSE, a contrastive method for sentence embeddings, in 2021.
        source_ids: [drqa-paper, dpr-paper, roberta-paper, simcse-paper]
      - text: >-
          Chen's more recent papers span language model training and alignment, long-context
          modeling, pretraining data curation, interpretability, and formal theorem proving. Examples include
          SimPO, a reference-free preference optimization method at NeurIPS 2024, and Goedel-Prover-V2, a
          series of open-source theorem-proving models at ICLR 2026.
        source_ids: [chen-papers, simpo-paper]
