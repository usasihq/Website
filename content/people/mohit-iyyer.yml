sections:
  - heading: Career
    paragraphs:
      - text: >-
          Mohit Iyyer completed a PhD in computer science at the University of Maryland, College Park
          between 2012 and 2017, advised by Jordan Boyd-Graber and Hal Daumé III. Iyyer then spent
          2017 to 2018 as a postdoctoral researcher at the Allen Institute for AI, supervised by Luke
          Zettlemoyer and Scott Yih, and joined UMass Amherst computer science as an assistant
          professor in 2018.
        source_ids: [iyyer-cv]
      - text: >-
          Iyyer became an associate professor at UMass Amherst in 2023. In January 2025 the lab joined
          the University of Maryland, where Iyyer is an associate professor of computer science and
          a member of the CLIP lab, while keeping an adjunct appointment at UMass Amherst.
        source_ids: [iyyer-cv, iyyer-site]
  - heading: Research
    paragraphs:
      - text: >-
          Iyyer's group works on natural language processing and large language models, with a focus
          on long-form text generation, long-context understanding, AI agents for collaborative
          writing, and detecting AI-generated text. Earlier projects included question answering for
          quiz bowl, computational analysis of fiction and comics, and the 2018 ELMo paper on deep
          contextualized word representations.
        source_ids: [iyyer-site, iyyer-cv, elmo-paper]
      - text: >-
          The group has released several evaluation resources, including NoCha in 2024, which asks
          long-context models to verify claims about full-length novels, and BEARCUBS in 2025, which
          tests computer-using web agents on live websites. Recent work also measures how much AI
          editing a text contains and audits AI-generated content in American newspapers.
        source_ids: [nocha-paper, bearcubs-paper, iyyer-site, iyyer-cv]
  - heading: Projects and platforms
    paragraphs:
      - text: >-
          Beyond papers, Iyyer's group has launched public platforms connected to its research. In
          November 2023 it launched litmt.org for sharing machine-translated world literature, and in
          April 2026 it released autofiction.ai, a site where people read and discuss AI-generated
          novels.
        source_ids: [iyyer-site]
