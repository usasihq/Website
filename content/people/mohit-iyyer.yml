headline: University of Maryland associate professor; former Young Investigator at Ai2
bio:
  text: >-
    Mohit Iyyer is an associate professor in computer science at the University of Maryland and a
    member of its CLIP lab; Iyyer was previously an associate professor at UMass Amherst and a Young
    Investigator at AI2. Iyyer's research focuses on natural language processing and large language
    models, with current interests in long-form text generation, long-context language understanding,
    AI agents for collaborative writing, and detection of AI-generated text. Iyyer is a co-author of
    Deep contextualized word representations, which learns word vectors from the internal states of a
    deep bidirectional language model, and Iyyer's group has released benchmarks such as NoCha for
    long-context models and BEARCUBS for computer-using web agents.
  source_ids: [iyyer-site, elmo-paper]
  reviewed_at: 2026-10-21
