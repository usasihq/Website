headline: PyTorch core maintainer and torch.compile contributor; wrote a Thinking Machines post on LLM nondeterminism
bio:
  text: >-
    Horace He is a PyTorch core maintainer, and PyTorch's maintainers page lists Horace He as an
    emeritus maintainer of TorchInductor and the PT2 dispatcher. Horace He's homepage describes work
    on PyTorch and torch.compile at Meta, including GPT-Fast, and Horace He co-authored the PyTorch 2
    paper (ASPLOS 2024), listed with Meta. In September 2025, Thinking Machines Lab published
    "Defeating Nondeterminism in LLM Inference," credited to Horace He in collaboration with others
    at Thinking Machines.
  source_ids: [pytorch-maintainers, homepage, pt2-paper, tml-nondeterminism]
  reviewed_at: 2026-10-21
affiliations:
  - name: Thinking Machines Lab
    organization_slug: thinking-machines-lab
    role: Credited "in collaboration with others at Thinking Machines" on a September 2025 research post
    current: false
    source_ids: [tml-nondeterminism]
  - name: PyTorch (open-source project)
    organization_slug: null
    role: Core Maintainer
    current: true
    source_ids: [pytorch-maintainers]
  - name: Meta
    organization_slug: meta
    role: Worked on PyTorch and torch.compile
    current: false
    source_ids: [homepage, pt2-paper]
work:
  - name: PyTorch (torch.compile)
    artifact_slug: pytorch
    type: open-source
    url: https://github.com/pytorch/pytorch
    contribution: >-
      Listed as a PyTorch core maintainer and an emeritus maintainer of TorchInductor and the PT2
      dispatcher; co-author of the PyTorch 2 paper introducing TorchDynamo and TorchInductor, which
      implement torch.compile. The repository is under a BSD-style license.
    source_ids: [pytorch-maintainers, pt2-paper, pytorch-license]
  - name: Defeating Nondeterminism in LLM Inference
    artifact_slug: null
    type: open-research
    url: https://thinkingmachines.ai/blog/defeating-nondeterminism-in-llm-inference/
    contribution: >-
      Credited author, with Thinking Machines Lab, of this Connectionism post, which examines why LLM inference results are not
      reproducible in practice and describes batch-invariant kernels for RMSNorm, matrix
      multiplication, and attention.
    source_ids: [tml-nondeterminism]
  - name: GPT-Fast
    artifact_slug: null
    type: open-source
    url: https://github.com/meta-pytorch/gpt-fast
    contribution: >-
      Horace He's homepage cites GPT-Fast as an example of Horace He's work on PyTorch and
      torch.compile; the BSD-3-Clause repository provides simple, PyTorch-native transformer text
      generation.
    source_ids: [homepage, gpt-fast-repo]
  - name: FlexAttention
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2412.05496
    contribution: >-
      Co-author of "Flex Attention: A Programming Model for Generating Optimized Attention Kernels"
      (2024), which describes generating fused attention kernels for many attention variants from short
      PyTorch functions.
    source_ids: [flexattention-paper]
links:
  - label: Website
    url: https://horace.io/
  - label: GitHub
    url: https://github.com/Chillee
sections:
  - heading: PyTorch and compilers
    paragraphs:
      - text: >-
          Horace He works at the meeting point of machine learning and compilers. A resume on Horace He's
          site records a 2019 internship on the PyTorch TorchScript/JIT team at Facebook, and Horace He
          later worked on PyTorch and torch.compile at Meta, including the GPT-Fast example of PyTorch-native
          transformer text generation.
        source_ids: [homepage, he-resume, gpt-fast-repo]
      - text: >-
          Horace He co-authored the ASPLOS 2024 PyTorch 2 paper on TorchDynamo and TorchInductor and the
          2024 FlexAttention paper on generating attention kernels. PyTorch's governance page lists Horace He
          as a core maintainer and as an emeritus maintainer of TorchInductor and the PT2 dispatcher.
        source_ids: [pt2-paper, flexattention-paper, pytorch-maintainers]
  - heading: Research and writing
    paragraphs:
      - text: >-
          Horace He's earlier research includes "Combining Label Propagation and Simple Models Out-performs
          Graph Neural Networks" (ICLR 2021) and "Better Set Representations for Relational Reasoning"
          (NeurIPS 2020), both as co-first author, and a reinforcement learning approach to optimizing deep
          learning kernels presented at the NeurIPS Workshop on ML for Systems.
        source_ids: [research-page, label-prop-paper]
      - text: >-
          Horace He's essays include "The State of Machine Learning Frameworks in 2019" and "Making Deep
          Learning Go Brrrr From First Principles" (2022). In September 2025 Thinking Machines Lab published
          "Defeating Nondeterminism in LLM Inference" by Horace He in collaboration with others at the lab,
          explaining batch-invariant kernels for reproducible inference.
        source_ids: [writing-page, tml-nondeterminism]
