headline: PyTorch core maintainer and torch.compile contributor; wrote a Thinking Machines post on LLM nondeterminism
bio:
  text: >-
    Horace He is a PyTorch core maintainer, and PyTorch's maintainers page lists Horace He as an
    emeritus maintainer of TorchInductor and the PT2 dispatcher. Horace He's homepage describes work
    on PyTorch and torch.compile at Meta, including GPT-Fast, and Horace He co-authored the PyTorch 2
    paper (ASPLOS 2024), listed with Meta. In September 2025, Thinking Machines Lab published
    "Defeating Nondeterminism in LLM Inference," credited to Horace He in collaboration with others
    at Thinking Machines.
  source_ids: [pytorch-maintainers, homepage, pt2-paper, tml-nondeterminism]
  reviewed_at: 2026-10-13
