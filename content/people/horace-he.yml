work:
  - name: PyTorch (torch.compile)
    artifact_slug: pytorch
    type: open-source
    url: https://github.com/pytorch/pytorch
    contribution: >-
      Listed as a PyTorch core maintainer and an emeritus maintainer of TorchInductor and the PT2
      dispatcher; co-author of the PyTorch 2 paper introducing TorchDynamo and TorchInductor, which
      implement torch.compile. The repository is under a BSD-style license.
    source_ids: [pytorch-maintainers, pt2-paper, pytorch-license]
  - name: Defeating Nondeterminism in LLM Inference
    artifact_slug: null
    type: open-research
    url: https://thinkingmachines.ai/blog/defeating-nondeterminism-in-llm-inference/
    contribution: >-
      Credited author, with Thinking Machines Lab, of this Connectionism post, which examines why LLM inference results are not
      reproducible in practice and describes batch-invariant kernels for RMSNorm, matrix
      multiplication, and attention.
    source_ids: [tml-nondeterminism]
  - name: GPT-Fast
    artifact_slug: null
    type: open-source
    url: https://github.com/meta-pytorch/gpt-fast
    contribution: >-
      Horace He's homepage cites GPT-Fast as an example of Horace He's work on PyTorch and
      torch.compile; the BSD-3-Clause repository provides simple, PyTorch-native transformer text
      generation.
    source_ids: [homepage, gpt-fast-repo]
