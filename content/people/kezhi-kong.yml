sections:
  - heading: Career
    paragraphs:
      - text: >-
          Kong earned a PhD in the Computer Science Department at the University of Maryland, College Park,
          advised by Tom Goldstein. Kong is now a research scientist at NVIDIA on the foundation model team
          in Applied Deep Learning Research, which trains the Nemotron family of models.
        source_ids: [kong-site]
  - heading: Research
    paragraphs:
      - text: >-
          Kong's research covers large language models, graph representation learning and trustworthy
          machine learning. Earlier first-author papers include "Robust Optimization as Data Augmentation
          for Large-scale Graphs" (CVPR 2022), GOAT, a global transformer on large-scale graphs (ICML 2023),
          and OpenTab, on large language models as open-domain table reasoners (ICLR 2024); Kong also
          co-authored work on the reliability of watermarks for large language models (ICLR 2024).
        source_ids: [kong-site]
      - text: >-
          With Dan Su and Ying Lin, Kong is a co-first author of "Nemotron-CC: Transforming Common Crawl into
          a Refined Long-Horizon Pretraining Dataset" (December 2024), which uses classifier ensembling and
          synthetic rephrasing to build a large English pretraining dataset, and co-wrote NVIDIA's January
          2025 announcement of the dataset.
        source_ids: [nemotron-cc-paper, adlr-page, nemotron-cc-blog]
