headline: NVIDIA research scientist on the ADLR foundation model team; co-first author of Nemotron-CC
bio:
  text: >-
    Kezhi Kong is a research scientist at NVIDIA on the foundation model team in Applied Deep Learning
    Research (ADLR), which trains the Nemotron models. Kong is a co-first author of the Nemotron-CC paper
    on a Common Crawl pretraining dataset, and earlier worked on graph representation learning and
    trustworthy machine learning during a PhD at the University of Maryland.
