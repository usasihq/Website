headline: Stanford professor of linguistics and computer science; co-author of Speech and Language Processing
bio:
  text: >-
    Dan Jurafsky is the Reynolds Professor in Humanities and a Professor of Linguistics and of
    Computer Science at Stanford University, and is listed among the faculty members of Stanford's
    Center for Research on Foundation Models. Jurafsky studies natural language processing, its
    implications for society, and its application to linguistics and the social and cognitive
    sciences. With James H. Martin, Jurafsky writes the textbook Speech and Language Processing,
    whose third-edition draft chapters and slides are published free online, most recently in an
    August 2026 release.
