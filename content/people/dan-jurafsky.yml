sections:
  - heading: Career
    paragraphs:
      - text: >-
          Dan Jurafsky earned a PhD in computer science at UC Berkeley in 1992, advised by Robert
          Wilensky, and was a postdoctoral researcher at the International Computer Science Institute
          from 1992 to 1995. Jurafsky then taught linguistics, computer science and cognitive science
          at the University of Colorado from 1996 to 2003, first as an assistant and then as an
          associate professor.
        source_ids: [jurafsky-cv]
      - text: >-
          Jurafsky joined Stanford as an associate professor in 2004, became a professor of
          linguistics and (by courtesy) of computer science in 2010, and chaired the Department of Linguistics from
          2014 to 2020. Since 2018 Jurafsky has held the Reynolds Professorship in Humanities.
        source_ids: [jurafsky-cv, jurafsky-site]
  - heading: Research
    paragraphs:
      - text: >-
          Jurafsky's research and teaching focus on language models and other natural language
          processing tools, and on applying them to the cognitive and social sciences. Recent work
          listed on Jurafsky's homepage includes studies of how people rely on language models and of
          how automatic speech recognition systems process speech, along with methods for efficient
          fine-tuning.
        source_ids: [jurafsky-bio, jurafsky-site]
      - text: >-
          Papers co-authored by Jurafsky received best paper awards at ACL 2006 and EMNLP 2013 and the
          2023 ACL Social Impact Award, according to Jurafsky's CV. Jurafsky is also listed among the
          faculty of Stanford's Center for Research on Foundation Models.
        source_ids: [jurafsky-cv, crfm-people]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          With James H. Martin, Jurafsky wrote Speech and Language Processing, whose second edition
          appeared in 2009 and whose third-edition draft is published free online with slides.
          Jurafsky taught a 2012 online natural language processing course with Christopher Manning,
          and is also the author of The Language of Food (2014), a finalist for a James Beard
          Foundation Book Award.
        source_ids: [jurafsky-cv, slp3, jurafsky-site]
