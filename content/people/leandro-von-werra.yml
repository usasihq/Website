specialties: [language-models, reinforcement-learning, agents]
headline: Machine learning at Hugging Face; first listed author of TRL and co-author of StarCoder2 and smolagents
bio:
  text: >-
    Leandro von Werra works in machine learning at Hugging Face, according to von Werra's GitHub
    profile, and Hugging Face's LLM Course describes von Werra as a machine learning engineer in the
    company's open-source team. Von Werra is listed first among the authors of TRL, Hugging Face's
    Apache-2.0 library for post-training transformer models, and is a co-author of the StarCoder
    and StarCoder2 code model papers. Von Werra also appears in the citation for smolagents,
    Hugging Face's library for running agents in a few lines of code, and co-wrote the O'Reilly
    book Natural Language Processing with Transformers.
  source_ids: [github-profile, hf-course, trl-citation, starcoder-paper, starcoder2-paper, smolagents-readme]
  reviewed_at: 2026-10-13
