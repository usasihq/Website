    url: https://github.com/huggingface/trl
    contribution: >-
      Listed first among the authors in TRL's citation file, which dates the project to 2020. TRL
      is an Apache-2.0 toolkit for post-training transformer models with SFT, reward modeling, DPO,
      and GRPO.
    source_ids: [trl-citation]
  - name: StarCoder2
    artifact_slug: starcoder2
