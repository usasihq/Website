sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Leandro von Werra is the first-listed author of TRL (Transformers Reinforcement Learning), whose
          citation file dates the project to March 2020. TRL is an Apache-2.0 library for post-training
          transformer models with methods such as supervised fine-tuning, reward modeling, Direct Preference
          Optimization and GRPO.
        source_ids: [trl-citation]
      - text: >-
          Von Werra is also listed in the citation for smolagents, a Hugging Face library for running agents
          in a few lines of code. Hugging Face's LLM Course describes von Werra as a machine learning engineer
          in the open-source team with industry experience bringing NLP projects into production, and as a
          co-author of the O'Reilly book Natural Language Processing with Transformers.
        source_ids: [smolagents-readme, hf-course]
  - heading: Code models and datasets
    paragraphs:
      - text: >-
          Von Werra co-authored a series of papers on open code models and their data. The Stack (2022)
          gathered permissively licensed source code in 30 programming languages with a data governance plan,
          and was followed by the SantaCoder (2023), StarCoder (2023) and StarCoder2 (2024) model papers.
        source_ids: [stack-paper, santacoder-paper, starcoder-paper, starcoder2-paper]
      - text: >-
          Von Werra is also a co-author of FineWeb (2024), a pretraining dataset derived from Common Crawl
          snapshots, and of SmolLM2 (2025), which documents the data-centric training of a 1.7-billion-parameter
          small language model.
        source_ids: [fineweb-paper, smollm2-paper]
