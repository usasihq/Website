work:
  - name: StyleGAN family (StyleGAN to StyleGAN3)
    artifact_slug: null
    type: open-research
    url: https://github.com/NVlabs/stylegan3
    contribution: >-
      First author of "A Style-Based Generator Architecture for Generative Adversarial Networks" (2018)
      and of "Alias-Free Generative Adversarial Networks" (StyleGAN3, NeurIPS 2021). The official
      StyleGAN3 implementation in NVlabs lists Karras first and is released under the NVIDIA Source
      Code License.
    source_ids: [stylegan-paper, stylegan3-paper, stylegan3-readme, nvidia-profile]
  - name: EDM and EDM2 diffusion models
    artifact_slug: null
    type: open-research
    url: https://github.com/NVlabs/edm2
    contribution: >-
      First author of "Elucidating the Design Space of Diffusion-Based Generative Models" (EDM, NeurIPS
      2022), "Analyzing and Improving the Training Dynamics of Diffusion Models" (EDM2, CVPR 2024), and
      "Guiding a Diffusion Model with a Bad Version of Itself" (NeurIPS 2024). The EDM2 repository
      releases source code and pretrained models under CC BY-NC-SA 4.0.
    source_ids: [edm-paper, edm2-paper, autoguidance-paper, edm2-readme]
