headline: Senior Distinguished Research Scientist at NVIDIA Research; primary author of the StyleGAN models
bio:
  text: >-
    Tero Karras is a Senior Distinguished Research Scientist at NVIDIA Research, which Karras joined in
    2009 after three years with NVIDIA's Tegra business. NVIDIA describes Karras as the primary author
    of the StyleGAN family of generative models and credits Karras with work on the hardware and
    software design of NVIDIA's RTX technology. Karras is first author of the StyleGAN, StyleGAN3, EDM,
    and EDM2 papers, whose official implementations NVIDIA publishes in its NVlabs GitHub organization.
    Karras's current research interests, per NVIDIA, are deep learning, generative models, and digital
    content creation.
  source_ids: [nvidia-profile, nvidia-blog-author, stylegan-paper, stylegan3-readme, edm-paper, edm2-readme]
  reviewed_at: 2026-10-21
affiliations:
  - name: NVIDIA Research
    organization_slug: nvidia
    role: Senior Distinguished Research Scientist
    current: true
    source_ids: [nvidia-profile, nvidia-blog-author]
work:
  - name: StyleGAN family (StyleGAN to StyleGAN3)
    artifact_slug: null
    type: open-research
    url: https://github.com/NVlabs/stylegan3
    contribution: >-
      First author of "A Style-Based Generator Architecture for Generative Adversarial Networks" (2018)
      and of "Alias-Free Generative Adversarial Networks" (StyleGAN3, NeurIPS 2021). The official
      StyleGAN3 implementation in NVlabs lists Karras first and is released under the NVIDIA Source
      Code License.
    source_ids: [stylegan-paper, stylegan3-paper, stylegan3-readme, nvidia-profile]
  - name: EDM and EDM2 diffusion models
    artifact_slug: null
    type: open-research
    url: https://github.com/NVlabs/edm2
    contribution: >-
      First author of "Elucidating the Design Space of Diffusion-Based Generative Models" (EDM, NeurIPS
      2022), "Analyzing and Improving the Training Dynamics of Diffusion Models" (EDM2, CVPR 2024), and
      "Guiding a Diffusion Model with a Bad Version of Itself" (NeurIPS 2024). The EDM2 repository
      releases source code and pretrained models under CC BY-NC-SA 4.0.
    source_ids: [edm-paper, edm2-paper, autoguidance-paper, edm2-readme]
