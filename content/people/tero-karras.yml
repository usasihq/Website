sections:
  - heading: Career
    paragraphs:
      - text: >-
          Karras worked for three years in NVIDIA's Tegra business before joining NVIDIA Research in 2009, where
          Karras is now a Senior Distinguished Research Scientist. NVIDIA credits Karras with a central role in
          developing its RTX technology, covering both hardware and software design, and lists Karras's
          research areas as computer graphics, generative AI and real-time rendering.
        source_ids: [nvidia-blog-author, nvidia-profile]
      - text: >-
          Karras's earlier interests, per the NVIDIA Technical Blog, included real-time ray tracing,
          representations for detailed 3D content, parallel algorithms and GPU computing. In late 2012 Karras
          wrote the blog's three-part "Thinking Parallel" series on collision detection, tree traversal and
          tree construction on the GPU.
        source_ids: [nvidia-blog-author]
  - heading: Research
    paragraphs:
      - text: >-
          Karras's generative modeling work began with "Progressive Growing of GANs" (2017), which trains
          generator and discriminator progressively from low to high resolution. The StyleGAN line followed:
          the style-based generator (2018), StyleGAN2 (2019), adaptive discriminator augmentation for training
          GANs with limited data (2020) and the alias-free StyleGAN3 (2021), each with Karras as first author.
        source_ids: [progan-paper, stylegan-paper, stylegan2-paper, ada-paper, stylegan3-paper, nvidia-profile]
      - text: >-
          Karras then turned to diffusion models. "Elucidating the Design Space of Diffusion-Based Generative
          Models" (EDM, 2022) separated the design choices in diffusion samplers and training, EDM2 (2023)
          analyzed and improved their training dynamics, and the 2024 autoguidance paper showed that guiding a
          diffusion model with a weaker version of itself can improve image quality. NVIDIA publishes the
          official implementations in its NVlabs GitHub organization.
        source_ids: [edm-paper, edm2-paper, autoguidance-paper, edm2-readme, stylegan3-readme]
