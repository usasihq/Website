headline: Senior Distinguished Research Scientist at NVIDIA Research; primary author of the StyleGAN models
bio:
  text: >-
    Tero Karras is a Senior Distinguished Research Scientist at NVIDIA Research, which Karras joined in
    2009 after three years with NVIDIA's Tegra business. NVIDIA describes Karras as the primary author
    of the StyleGAN family of generative models and credits Karras with work on the hardware and
    software design of NVIDIA's RTX technology. Karras is first author of the StyleGAN, StyleGAN3, EDM,
    and EDM2 papers, whose official implementations NVIDIA publishes in its NVlabs GitHub organization.
    Karras's current research interests, per NVIDIA, are deep learning, generative models, and digital
    content creation.
  source_ids: [nvidia-profile, nvidia-blog-author, stylegan-paper, stylegan3-readme, edm-paper, edm2-readme]
  reviewed_at: 2026-10-13
