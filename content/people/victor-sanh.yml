sections:
  - heading: Research at Hugging Face
    paragraphs:
      - text: >-
          Victor Sanh's work at Hugging Face includes efficient language models and open-source tooling.
          Sanh was first author of DistilBERT (2019), a distilled version of BERT that is smaller and
          faster, and a co-author of the 2019 paper describing Hugging Face's open-source Transformers
          library. With Thomas Wolf and Alexander M. Rush, Sanh also wrote "Movement Pruning" (2020),
          on adaptive sparsity during fine-tuning.
        source_ids: [distilbert-paper, distilbert-card, transformers-paper, movement-pruning-paper]
      - text: >-
          Sanh was first author of "Multitask Prompted Training Enables Zero-Shot Task Generalization"
          (2021), the BigScience paper that introduced the T0 family of models trained on many tasks
          phrased as natural-language prompts. The T0pp model card on Hugging Face documents one of the
          released checkpoints.
        source_ids: [t0-paper, t0pp-card]
  - heading: Vision-language models
    paragraphs:
      - text: >-
          Sanh later worked on open multimodal models released under Hugging Face's HuggingFaceM4
          organization. Sanh was a senior
          contributor to OBELICS (2023), an open web-scale dataset of interleaved image-text documents,
          and co-authored "What matters when building vision-language models?" (2024), the paper that
          released Idefics2, an 8-billion-parameter vision-language model.
        source_ids: [obelics-paper, obelics-dataset, idefics2-paper, idefics2-card]
      - text: >-
          In August 2024 Sanh co-authored a further paper with Hugo Laurençon, Andrés Marafioti and Léo
          Tronchon on insights and future directions in building vision-language models. Sanh's GitHub
          profile now describes Sanh as an AI builder previously at Hugging Face.
        source_ids: [vlm-insights-paper, github-profile]
