work:
  - name: Transformers
    artifact_slug: transformers
    type: open-source
    url: https://github.com/huggingface/transformers
    contribution: >-
      Third-listed author of "Transformers: State-of-the-Art Natural Language Processing" (2019), the
      paper describing the open-source library, written with a Hugging Face affiliation.
    source_ids: [transformers-paper]
  - name: DistilBERT
    artifact_slug: null
    type: open-weights
    url: https://huggingface.co/distilbert/distilbert-base-uncased
    contribution: >-
      First author of the DistilBERT paper (2019), which pre-trains a smaller general-purpose model
      through knowledge distillation and tests it on device; the distilbert-base-uncased model card
      lists the Apache 2.0 license.
    source_ids: [distilbert-paper, distilbert-card]
  - name: T0
    artifact_slug: null
    type: open-weights
    url: https://huggingface.co/bigscience/T0pp
    contribution: >-
      First author of "Multitask Prompted Training Enables Zero-Shot Task Generalization" (2021), which
      fine-tunes an encoder-decoder model on a prompted multitask mixture and releases the trained
      models; the T0pp model card lists the Apache 2.0 license.
    source_ids: [t0-paper, t0pp-card]
  - name: OBELICS, IDEFICS and Idefics2
    artifact_slug: null
    type: open-weights
    url: https://huggingface.co/HuggingFaceM4/idefics2-8b
    contribution: >-
      Marked as an equal and senior contributor on the OBELICS paper (2023), which releases an open
      interleaved image-text dataset and the IDEFICS models, and last-listed author of the 2024 study
      that develops and releases the Idefics2 8B vision-language model, whose model card lists the
      Apache 2.0 license.
    source_ids: [obelics-paper, obelics-dataset, idefics2-paper, idefics2-card]
