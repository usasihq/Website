headline: First author of DistilBERT and T0; co-author of the Transformers library paper and the Idefics2 model
bio:
  text: >-
    Victor Sanh's GitHub profile describes Sanh as an AI builder previously at Hugging Face and
    lists Rilix as the current company. At Hugging Face, Sanh was
    first author of DistilBERT, a smaller distilled version of BERT, and a co-author of the paper
    describing the open-source Transformers library. Sanh was also first author of the paper on
    multitask prompted training that introduced the T0 models, a senior contributor to the
    OBELICS dataset and IDEFICS models, and a co-author of the 2024 paper that released the Idefics2
    vision-language model.
  source_ids: [github-profile, distilbert-paper, transformers-paper, t0-paper, obelics-paper, idefics2-paper]
  reviewed_at: 2026-10-13
