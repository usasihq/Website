headline: First author of the VGG networks paper; joined Microsoft AI as Chief Scientist in 2024 from Inflection AI
bio:
  text: >-
    Karén Simonyan is first author, with Andrew Zisserman, of "Very Deep Convolutional Networks for
    Large-Scale Image Recognition" (2014), the VGG networks paper, and of two-stream convolutional
    networks for action recognition in videos; both papers appear on Simonyan's Oxford publication
    page, which links the VGG paper to a project page with the ILSVRC ConvNet models. A 2014 University of Oxford announcement described
    Simonyan, Max Jaderberg, and Andrew Zisserman as co-founders of Vision Factory who were teaming
    up with Google DeepMind. Microsoft's March 2024 announcement said Simonyan, a co-founder and
    Chief Scientist of Inflection, was joining the new Microsoft AI organization as Chief Scientist,
    reporting to Mustafa Suleyman.
