sections:
  - heading: Research
    paragraphs:
      - text: >-
          Karén Simonyan's early papers with Andrew Zisserman, listed on Simonyan's Oxford publications page,
          centered on deep convolutional networks. In 2013 Simonyan co-authored a method for visualizing image classification models
          and computing saliency maps, and in 2014 Simonyan and Zisserman introduced two-stream convolutional
          networks for action recognition in video and the very deep VGG networks, presented orally at ICLR 2015.
        source_ids: [saliency-paper, two-stream-paper, vgg-paper, oxford-page]
      - text: >-
          Simonyan also co-authored work on reading text in natural images and Spatial Transformer Networks with Max
          Jaderberg, and the BMVC 2014 paper Return of the Devil in the Details, which received the best paper
          prize.
        source_ids: [oxford-page, spatial-transformer-paper]
  - heading: Career
    paragraphs:
      - text: >-
          Simonyan later co-authored WaveNet, a generative model of raw audio, in 2016
          and the 2017 paper on mastering chess and shogi through self-play with a general reinforcement learning
          algorithm.
        source_ids: [wavenet-paper, alphazero-paper]
      - text: >-
          Simonyan later co-founded Inflection AI, serving as its Chief Scientist, and in March 2024 Microsoft
          announced that Simonyan and Mustafa Suleyman were joining to form the Microsoft AI organization, with
          Simonyan as its Chief Scientist.
        source_ids: [microsoft-2024]
