sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before joining Amazon, Tye Brady spent 15 years at Draper Laboratory leading technical projects in
          robotics and spacecraft engineering. Amazon's Delivering the Future 2024 speaker biography credits
          Brady with more than 30 years of experience in robotics, autonomous vehicles and system design.
        source_ids: [aa-dtf-2024]
      - text: >-
          As Chief Technologist of Amazon Robotics, Brady guides the division's work on automation and
          advanced technology. In a 2022 Amazon Science conversation marking the ICRA robotics conference,
          Brady was described as helping shape Amazon's robotics strategy and overseeing university outreach
          for robotics. Brady is also a founding partner of MassRobotics, a nonprofit that supports the
          robotics industry.
        source_ids: [aa-dtf-2024, science-icra-2022]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Amazon's October 2025 announcement of two operations systems quoted Brady as chief technologist for
          Amazon Robotics: Blue Jay, which coordinates multiple robotic arms in one workspace that previously
          needed three separate stations, and Project Eluna, an agentic AI model that helps operators make
          decisions. A February 2026 update to the announcement says Amazon no longer uses Blue Jay in
          operations. Amazon Science's author page lists Brady as a co-author of robotics papers at ICRA 2025,
          ICRA 2026 and IROS 2026.
        source_ids: [aa-bluejay-2025, sci-author]
