headline: Chief Technologist of Amazon Robotics
bio:
  text: >-
    Tye Brady is Chief Technologist of Amazon Robotics, focused on innovation in automation and
    advanced technology, and has more than 30 years of experience in robotics, autonomous vehicles
    and system design. Amazon Science has described Brady as helping shape Amazon's robotics
    strategy and overseeing university outreach for robotics. Before Amazon, Brady spent 15 years
    at Draper Laboratory on robotics and spacecraft engineering projects, and Brady is a founding
    partner of MassRobotics, a nonprofit that supports the robotics industry.
