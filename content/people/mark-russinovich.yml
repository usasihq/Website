sections:
  - heading: Career
    paragraphs:
      - text: >-
          In 1996, Russinovich
          created the Sysinternals web site to host advanced system utilities, and later co-founded Winternals
          Software; Microsoft acquired the company in 2006, when Russinovich joined Microsoft. Microsoft Learn
          now hosts the Sysinternals tools for managing and troubleshooting Windows and Linux systems.
        source_ids: [azure-blog-author, sysinternals]
      - text: >-
          Russinovich is Chief Technology Officer and Technical Fellow for Microsoft Azure. In a 2025 Microsoft
          Security blog series introducing the company's deputy chief information security officers, Russinovich
          described working
          with a large team to identify and resolve security risks across Azure, the core operating system and
          the company's engineering systems.
        source_ids: [azure-blog-author, ms-security-blog]
  - heading: Research
    paragraphs:
      - text: >-
          Russinovich's earlier co-authored research covers cloud systems, including a characterization of
          serverless workloads at a large cloud provider (2020), the Singularity scheduler for AI workloads
          (2022) and the Confidential Consortium Framework for secure multiparty applications (2023).
        source_ids: [serverless-paper, singularity-paper, ccf-paper]
      - text: >-
          More recent work concerns the security of language models. With Ronen Eldan, Russinovich studied
          approximate unlearning in "Who's Harry Potter?" (2023), and as first author described the Crescendo
          multi-turn jailbreak (2024) and GRP-Obliteration (2026), which removes a model's safety alignment
          using a single unlabeled prompt. Russinovich also co-authored lessons from red teaming 100 generative
          AI products and a design for securing AI agents with information-flow control.
        source_ids: [harry-potter-paper, crescendo-paper, grp-obliteration-paper, red-teaming-paper, ifc-agents-paper]
  - heading: Writing
    paragraphs:
      - text: >-
          Russinovich has written nonfiction and fiction books, including the Microsoft Press Windows Internals
          series, Troubleshooting with the Sysinternals Tools, and the cybersecurity thrillers Zero Day, Trojan
          Horse and Rogue Code.
        source_ids: [azure-blog-author]
