    contribution: >-
      Co-author with Ronen Eldan of a 2023 paper proposing a technique for unlearning a subset of a
      language model's training data without retraining from scratch, demonstrated on Llama2-7b.
    source_ids: [harry-potter-paper]
  - name: Sysinternals
    artifact_slug: null
    type: null
    url: https://learn.microsoft.com/en-us/sysinternals/
    contribution: >-
      Created the Sysinternals web site in 1996 to host advanced system utilities and technical
      information; Microsoft Learn now hosts the utilities for managing, troubleshooting, and diagnosing
      Windows and Linux systems and applications.
    source_ids: [sysinternals]
