headline: CTO and Technical Fellow for Microsoft Azure; creator of Sysinternals
bio:
  text: >-
    Mark Russinovich is Chief Technology Officer and Technical Fellow for Microsoft Azure. In a 2025
    Microsoft Security blog series on the company's deputy CISOs, Russinovich describes a team focused on technical strategy, architecture,
    and security risk management for the Azure platform, engineering systems, and core operating
    systems. Russinovich created the Sysinternals web site in 1996 to host advanced system utilities;
    Microsoft Learn now hosts the Sysinternals tools for troubleshooting Windows and Linux systems.
    Russinovich is first author of the Crescendo paper on multi-turn jailbreak attacks against
    language models, accepted at USENIX Security 2025, and co-authored "Who's Harry Potter?" with Ronen
    Eldan on approximate unlearning in language models.
  source_ids: [azure-blog-author, ms-security-blog, sysinternals, crescendo-paper, harry-potter-paper]
  reviewed_at: 2026-10-21
affiliations:
  - name: Microsoft
    organization_slug: microsoft
    role: Chief Technology Officer and Technical Fellow, Microsoft Azure
    current: true
    source_ids: [azure-blog-author]
work:
  - name: Crescendo multi-turn jailbreak attack
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2404.01833
    contribution: >-
      First author of "Great, Now Write an Article About That: The Crescendo Multi-Turn LLM Jailbreak
      Attack" (2024, accepted at USENIX Security 2025), which introduces a multi-turn jailbreak that
      starts with seemingly benign interactions.
    source_ids: [crescendo-paper]
  - name: "Who's Harry Potter? Approximate Unlearning in LLMs"
    artifact_slug: null
