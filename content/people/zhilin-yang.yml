headline: Co-first author of XLNet and Transformer-XL; earlier worked at Google Brain and Meta AI
bio:
  text: >-
    Zhilin Yang completed a PhD in 2019 at the School of Computer Science at Carnegie Mellon
    University, advised by Ruslan Salakhutdinov and William W. Cohen, and has worked at Google Brain
    with Quoc V. Le and at Meta AI with Jason Weston. With Zihang Dai, Yang is co-first author of
    Transformer-XL (2019), an attentive language model that goes beyond a fixed-length context, and
    of XLNet (2019), a generalized autoregressive pretraining method that integrates ideas from
    Transformer-XL; both repositories publish code and pretrained models under the Apache 2.0 license.
    Yang's homepage says Yang is working on a startup.
