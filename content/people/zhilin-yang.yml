sections:
  - heading: Research
    paragraphs:
      - text: >-
          Yang was first author of HotpotQA in 2018, a dataset for
          diverse, explainable multi-hop question answering. In 2019 Yang and Zihang Dai were co-first authors of
          Transformer-XL, a language model that attends beyond a fixed-length context, and of XLNet, a generalized
          autoregressive pretraining method built on ideas from Transformer-XL.
        source_ids: [zy-hotpotqa, txl-paper, xlnet-paper]
      - text: >-
          Yang's later co-authored work includes GLM, a general language model pretrained with autoregressive
          blank infilling, and P-Tuning v2, which showed prompt tuning can match fine-tuning across model scales
          and tasks; both appeared at ACL 2022. Yang's homepage also lists TLM, a framework for NLP without
          large-scale pretraining at ICML 2022, and the September 2022 release of CodeGeeX, a multilingual code
          generation model.
        source_ids: [zy-glm, zy-ptv2, homepage]
  - heading: Open-source work
    paragraphs:
      - text: >-
          The Transformer-XL and XLNet repositories publish code and pretrained models under the Apache 2.0
          license. Yang's homepage describes the current work as a startup, following research positions at
          Google Brain with Quoc V. Le and at Meta AI with Jason Weston.
        source_ids: [txl-repo, txl-license, xlnet-repo, xlnet-license, homepage]
