headline: Creator of Fireship, a YouTube channel of fast-paced code tutorials and tech news for developers
bio:
  text: >-
    Jeff Delaney created Fireship, a YouTube channel of short, fast-paced code tutorials and tech news
    for programmers, including the series 100 Seconds of Code and The Code Report.
    Fireship also publishes developer courses and works with ui.dev on the Bytes newsletter. In
    January 2026 Fireship announced that ui.dev and Fireship had joined forces, with Jeff continuing
    to work on and voice every Fireship video.
