sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Jeff Delaney created the Fireship YouTube channel, which joined YouTube in April 2017 and
          describes itself as high-intensity code tutorials and tech news for programmers. The channel is
          the original home of the series 100 Seconds of Code, The Code Report and Code This Not That, and
          its 2026 uploads often cover AI models, AI companies and developer tools.
        source_ids: [youtube, channel-feed]
      - text: >-
          The Fireship channel page also features a companion channel, Beyond Fireship, which dates from
          September 2022 and has published build and first-look videos such as a January 2025 video on a
          VS Code extension powered by DeepSeek R1. Fireship's about page lists Delaney on a small remote team that also produces
          courses, the Bytes newsletter and microsites such as npmtrends and useHooks.
        source_ids: [youtube, beyond-fireship-feed, fireship-about]
  - heading: Fireship and ui.dev
    paragraphs:
      - text: >-
          In January 2026 Fireship and ui.dev announced that they were joining forces to work together on
          Fireship videos, courses and the Bytes newsletter, with ui.dev courses such as react.gg and
          query.gg moving to the fireship.dev platform. The announcement states that Delaney keeps
          creative control and continues to work on and voice every video.
        source_ids: [join-forces]
