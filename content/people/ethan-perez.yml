headline: Leads the alignment team at Anthropic; co-author of the RAG, red-teaming, and Constitutional Classifiers work
bio:
  text: >-
    Ethan Perez leads the alignment team at Anthropic. Perez's site says Perez led the team that
    developed Constitutional Classifiers, safeguards trained on synthetic data generated from a
    natural-language constitution to defend against universal jailbreaks. Perez is first author of
    "Red Teaming Language Models with Language Models", which uses one language model to generate
    test cases that find harmful behavior in another, and a co-author of the retrieval-augmented
    generation (RAG) paper.
  source_ids: [perez-site, constitutional-classifiers-paper, red-teaming-paper, rag-paper]
  reviewed_at: 2026-10-13
