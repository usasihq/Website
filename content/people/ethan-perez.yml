sections:
  - heading: Research
    paragraphs:
      - text: >-
          Several of Ethan Perez's papers concern finding and measuring failures in language models.
          Perez was first author of "Red Teaming Language Models with Language Models" (2022), which uses one
          model to generate test cases that surface harmful behavior in another, and of "Discovering
          Language Model Behaviors with Model-Written Evaluations" (2022), which automates the writing
          of behavioral evaluations with language models.
        source_ids: [red-teaming-paper, model-written-evals-paper]
      - text: >-
          Perez is the last-listed author of "Inverse Scaling: When Bigger Isn't Better" (2023), which
          presents tasks where larger models perform worse, and a co-author of "Sleeper Agents" (2024),
          which studies whether deceptive behaviors trained into models persist through safety
          training. Earlier, Perez co-authored the 2020 retrieval-augmented generation (RAG) paper.
        source_ids: [inverse-scaling-paper, sleeper-agents-paper, rag-paper]
  - heading: Safety work at Anthropic
    paragraphs:
      - text: >-
          Perez is the last-listed author of the January 2025 Anthropic paper introducing
          Constitutional Classifiers, safeguards trained on synthetic data generated from a
          natural-language constitution to defend against universal jailbreaks. In August 2025 Perez
          co-authored Anthropic's posts on filtering harmful chemical, biological, radiological and
          nuclear content from pretraining data and on a pilot exercise in which Anthropic and OpenAI
          ran alignment evaluations on each other's public models.
        source_ids: [constitutional-classifiers-paper, blog-data-filtering, blog-openai-findings]
      - text: >-
          Perez is listed with an Anthropic affiliation on the August 2026 Alignment Science post
          introducing the Conceptual Reasoning Index, a set of benchmarks for the kinds of argument used
          in philosophy and AI futurism, written with researchers at Redwood Research.
        source_ids: [blog-conceptual-reasoning]
