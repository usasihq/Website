headline: Anthropic safety researcher; co-author of the RAG, red-teaming, and Constitutional Classifiers work
bio:
  text: >-
    Ethan Perez is an AI safety researcher at Anthropic, listed with an Anthropic affiliation on the
    company's Alignment Science blog in 2026. Perez is the last-listed author of the Anthropic paper
    introducing Constitutional Classifiers, safeguards trained on synthetic data generated from a
    natural-language constitution to defend against universal jailbreaks. Perez is also first author
    of "Red Teaming Language Models with Language Models", which uses one language model to generate
    test cases that find harmful behavior in another, and a co-author of the retrieval-augmented
    generation (RAG) paper.
  source_ids: [blog-conceptual-reasoning, constitutional-classifiers-paper, red-teaming-paper, rag-paper]
  reviewed_at: 2026-10-21
