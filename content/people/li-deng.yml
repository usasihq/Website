sections:
  - heading: Career
    paragraphs:
      - text: >-
          Li Deng began an academic career at the University of Waterloo, serving as an assistant
          professor from 1989, a tenured associate professor from 1992 and a full professor from 1996
          to 1999. During that period Deng also held faculty or research positions at the
          Massachusetts Institute of Technology, the Advanced Telecommunications Research Institute and
          the Hong Kong University of Science and Technology.
        source_ids: [uw-profile]
      - text: >-
          From 2000 to 2017 Deng worked at Microsoft and Microsoft Research, where Deng became Partner
          Research Manager, founded the Deep Learning Technology Center and served as Chief Scientist of
          AI. The University of Washington, where Deng has been an affiliate professor of electrical and
          computer engineering since 2000, states that Deng became Chief Artificial Intelligence Officer
          of Citadel in May 2017.
        source_ids: [uw-profile]
      - text: >-
          Deng was an elected member of the Board of Governors of the IEEE Signal Processing Society
          and served as editor-in-chief of IEEE Signal Processing Magazine and of the IEEE/ACM
          Transactions on Audio, Speech, and Language Processing between 2008 and 2014.
        source_ids: [uw-profile]
  - heading: Research and publications
    paragraphs:
      - text: >-
          At Microsoft Research, Deng worked on applying large-scale deep learning to speech
          recognition. With George Dahl, Dong Yu and Alex Acero, Deng co-authored the paper on
          context-dependent pre-trained deep neural networks for large vocabulary speech recognition,
          which received the IEEE Signal Processing Society's 2013 Best Paper Award, and later
          co-authored the CIKM 2013 paper introducing deep structured semantic models (DSSM) for web
          search.
        source_ids: [cd-dnn-pub, dssm-pub, uw-profile]
      - text: >-
          Deng is an author or co-author of six technical books on deep learning, speech processing,
          pattern recognition and machine learning, and natural language processing, the most recent
          published by Springer in June 2018. With Dong Yu, Deng also wrote "Deep Learning: Methods
          and Applications" (2014), published by Microsoft as a technical report.
        source_ids: [uw-profile, dlma-pub]
