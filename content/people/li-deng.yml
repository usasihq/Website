headline: Former Chief Scientist of AI at Microsoft and founder of its Deep Learning Technology Center
bio:
  text: >-
    Li Deng was Chief Scientist of AI, founder of the Deep Learning Technology Center, and Partner
    Research Manager at Microsoft and Microsoft Research from 2000 to 2017, after faculty positions at
    the University of Waterloo. At Microsoft Research, Deng co-authored the context-dependent deep neural
    network paper for large vocabulary speech recognition, the deep structured semantic models (DSSM) paper for web search, and,
    with Dong Yu, the book "Deep Learning: Methods and Applications." Deng received the 2015 IEEE Signal
    Processing Society Technical Achievement Award for contributions to automatic speech recognition and
    deep learning.
  source_ids: [uw-profile, cd-dnn-pub, dssm-pub, dlma-pub]
  reviewed_at: 2026-10-13
