sections:
  - heading: Career
    paragraphs:
      - text: >-
          Gergely Orosz worked as a software engineer at Skype and Microsoft, including on Skype for
          Xbox One and Skype for Web, and at Skyscanner. Orosz spent four years at Uber in charge of
          mobile, web and backend teams, and helped ship part of the company's payments system.
        source_ids: [blog-about]
      - text: >-
          After leaving Uber in October 2020, Orosz set aside time to finish The Software Engineer's
          Guidebook and, in 2021, launched The Pragmatic Engineer as a paid newsletter on Substack.
        source_ids: [newsletter-history]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Orosz began The Pragmatic Engineer blog in 2015, writing about software development, and
          added a periodic email digest in July 2019. The newsletter publishes Tuesday deepdives and,
          since its second year, a Thursday column called The Pulse (formerly The Scoop) on trends in
          Big Tech and startups.
        source_ids: [newsletter-history, newsletter-about]
      - text: >-
          In 2024 Orosz started The Pragmatic Engineer Podcast, with interviews on software
          engineering, AI engineering and engineering management. The newsletter states that it
          runs no advertisements or sponsorships, while the podcast has limited sponsor slots.
        source_ids: [newsletter-history, newsletter-about]
  - heading: Books
    paragraphs:
      - text: >-
          Orosz has published four books. The Software Engineer's Guidebook, which took four years to
          write, covers senior, tech lead, staff and principal roles; Building Mobile Apps at Scale
          collects 39 engineering challenges of large native iOS and Android apps; Growing as a Mobile
          Engineer gives career advice for mobile engineers; and The Tech Resume Inside Out covers
          resumes for software professionals.
        source_ids: [books]
