headline: Writer of The Pragmatic Engineer, a newsletter and podcast about software engineering at tech companies
bio:
  text: >-
    Gergely Orosz writes The Pragmatic Engineer, a newsletter for software engineers, AI engineers, and
    engineering leaders that covers how Big Tech and startups build software, along with The Pulse, a series
    on tech-industry trends, and weekly podcast episodes. The newsletter states that it takes no sponsorships.
    Gergely is the author of four books, including The Software Engineer's Guidebook, Building Mobile Apps at
    Scale, Growing as a Mobile Engineer, and The Tech Resume Inside Out. Before writing full-time, Gergely
    worked as an engineer and engineering manager at Uber, Skyscanner, and Skype/Microsoft.
