headline: Co-founder and CEO of Databricks; one of the creators of Apache Spark and co-author of the Mesos paper
bio:
  text: >-
    Ali Ghodsi is the co-founder and CEO of Databricks, a role Ghodsi took in January 2016 after
    serving as the company's VP of Engineering and Product Management. Databricks' speaker biography
    describes Ghodsi as one of the creators of the open-source Apache Spark project and as an adjunct
    professor at UC Berkeley. Ghodsi co-authored the 2011 NSDI paper on Mesos, a platform for
    fine-grained resource sharing in the data center, written by a UC Berkeley team. Ghodsi is also among
    the bylined authors of Databricks' 2024 posts announcing the DBRX language model and the
    open-sourcing of Unity Catalog.
  source_ids: [dais-ghodsi, mesos-paper, dbrx-post, uc-post]
  reviewed_at: 2026-10-21
