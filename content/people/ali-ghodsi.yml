sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ghodsi is a co-founder of Databricks. Before becoming chief executive in January 2016, Ghodsi served as
          the company's VP of Engineering and Product Management. Databricks' speaker biography also lists
          Ghodsi as an adjunct professor at UC Berkeley and a board member of the university's RiseLab, and
          notes a PhD in distributed computing from KTH Royal Institute of Technology in 2006.
        source_ids: [dais-ghodsi]
      - text: >-
          In July 2023 Databricks announced it had completed its acquisition of MosaicML; Ghodsi, quoted as
          co-founder and CEO, described it as a way for customers to train and deploy their own language
          models on their data. Ghodsi is among
          the bylined authors of the March 2024 post introducing DBRX, an open mixture-of-experts language model,
          and of the June 2024 post announcing the open-sourcing of Unity Catalog.
        source_ids: [mosaic-acq, dbrx-post, uc-post, uc-repo]
  - heading: Research
    paragraphs:
      - text: >-
          Databricks' biography notes that ideas from Ghodsi's academic research on resource management,
          scheduling and data caching have been applied in Apache Mesos and Apache Hadoop. At NSDI 2011 Ghodsi co-authored the Mesos paper on fine-grained resource sharing and was first
          author of "Dominant Resource Fairness", which addresses the fair allocation of multiple resource types
          in a shared cluster.
        source_ids: [dais-ghodsi, mesos-paper, drf-paper]
      - text: >-
          Ghodsi is described as one of the creators of the open-source Apache Spark project, which is developed
          under the Apache-2.0 license. With Michael Armbrust, Reynold Xin and Matei Zaharia, Ghodsi co-wrote the
          CIDR 2021 paper "Lakehouse", which argues for data platforms built on open direct-access file formats
          with built-in support for machine learning and data science.
        source_ids: [dais-ghodsi, spark-repo, lakehouse-paper]
