sections:
  - heading: Cognition
    paragraphs:
      - text: >-
          Scott Wu is the founder and CEO of Cognition. In March 2024 Wu wrote the company's post
          introducing Devin, which Cognition describes as an AI software engineer that can build
          alongside engineers or independently complete tasks for them to review.
        source_ids: [introducing-devin, cognizant-release]
      - text: >-
          In July 2025 Wu wrote to the Cognition team that the company had signed a definitive
          agreement to acquire Windsurf, the agentic IDE. In January 2026 Cognizant announced a
          partnership with Cognition to bring autonomous software engineering to enterprise
          modernization and engineering programs, quoting Wu as founder and CEO.
        source_ids: [windsurf-note, cognizant-release]
  - heading: Writing
    paragraphs:
      - text: >-
          Wu continues to write announcements on Cognition's blog. A June 2026 post introduced an AI
          estimator that reviews completed Devin sessions to measure productive engineering output,
          validated against engineers' own time estimates, as the basis for an AI Productivity
          Guarantee for enterprise customers. In July 2026 Wu welcomed The Interaction Company, the
          makers of the Poke assistant, to Cognition.
        source_ids: [ai-guarantee-post, interaction-post]
