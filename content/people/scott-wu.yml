headline: Founder and CEO of Cognition, the company behind the Devin AI software engineer and Windsurf
bio:
  text: >-
    Scott Wu is the founder and CEO of Cognition, as Cognizant's January 2026 announcement of a
    partnership with the company states. Wu wrote Cognition's March 2024 post introducing Devin, an
    AI software engineer the post describes as a teammate that can build alongside engineers or
    independently complete tasks for them to review, and the July 2025 note to the Cognition team on
    the company's acquisition of Windsurf. Wu continues to write company announcements on
    Cognition's blog, including a July 2026 post welcoming The Interaction Company, the makers of
    Poke, to Cognition.
  source_ids: [cognizant-release, introducing-devin, windsurf-note, interaction-post]
  reviewed_at: 2026-10-13
