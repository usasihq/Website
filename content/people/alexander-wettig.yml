headline: Researcher at Cursor; contributor to Ai2's OLMoE and co-author of SWE-bench
bio:
  text: >-
    Alexander Wettig is a researcher at Cursor working on reinforcement learning for the Composer
    models. Wettig was previously a PhD student at Princeton University advised by Danqi Chen, with
    research on building better language models through training data, including pre-training data
    selection, data mixtures, data repetition, and long-context recipes. The OLMoE paper credits
    Wettig with advising on pretraining and analyzing load balancing, routing, and domain
    specialization in Ai2's open mixture-of-experts model, and Wettig is a co-author of the SWE-bench
    benchmark paper.
  source_ids: [wettig-site, olmoe-pdf, swebench-paper]
  reviewed_at: 2026-10-21
