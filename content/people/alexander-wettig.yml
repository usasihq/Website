sections:
  - heading: Research
    paragraphs:
      - text: >-
          Wettig's doctoral research at Princeton, advised by Danqi Chen, focused on improving language models
          through simple methods and careful handling of training data. The work covered selecting pre-training
          data, optimizing data mixtures, repeating data carefully and recipes for long-context training, and
          was collected in a 2026 PhD thesis titled "Building Better Language Models With Data Curation".
        source_ids: [wettig-site]
      - text: >-
          QuRating (ICML 2024) proposed selecting pre-training text using language-model judgments of qualities
          such as writing style and educational value, and released its code, models and data. "Organize the
          Web" (ICML 2025), written with researchers including Kyle Lo, Luca Soldaini and Hannaneh Hajishirzi,
          introduced WebOrganizer, which sorts web pages into topic and format domains to guide data mixing. With Tianyu Gao, Howard Yen and
          Danqi Chen, Wettig was co-first author of "How to Train Long-Context Language Models (Effectively)", accepted to ACL 2025.
        source_ids: [qurating-paper, organize-web-paper, prolong-paper]
      - text: >-
          Earlier work examined masked language modeling, asking whether the customary 15 percent masking rate
          is the right choice, in a paper accepted to EACL 2023. Wettig has also co-authored papers on language model
          fine-tuning and on interpreting how transformers work, including "Learning Transformer
          Programs" (NeurIPS 2023) and "Finding Transformer Circuits with Edge Pruning" (NeurIPS 2024).
        source_ids: [mask-paper, wettig-site]
  - heading: Software engineering agents
    paragraphs:
      - text: >-
          Wettig was part of the team that built SWE-bench, a benchmark of real GitHub issues that
          language models must resolve, presented as an oral paper at ICLR 2024. Wettig is also a co-author of
          SWE-agent (NeurIPS 2024), which studies how agent-computer interfaces help language-model agents carry
          out software engineering tasks, and of SWE-smith (NeurIPS Datasets and Benchmarks 2025), on scaling
          training data for such agents.
        source_ids: [wettig-site, swebench-paper, sweagent-paper]
  - heading: Open models and industry work
    paragraphs:
      - text: >-
          Wettig contributed to open model releases from Ai2, including the OLMoE mixture-of-experts paper
          (ICLR 2025) and the Olmo 3 technical report (2025), where Wettig is listed under the Olmo Team. Wettig
          now works at Cursor on reinforcement learning for the Composer models, and the site lists the 2026
          Composer 2 Technical Report by the Cursor Research Team among Wettig's publications.
        source_ids: [wettig-site, olmoe-pdf]
