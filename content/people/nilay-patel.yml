sections:
  - heading: Career
    paragraphs:
      - text: >-
          Patel is a co-founder of The Verge, which The Verge's about page describes as founded in 2011 to cover
          technology and how it makes people feel, through breaking news, reviews, features, and
          investigations on its site, in video, and in podcasts. Patel leads the publication as
          editor-in-chief, heading a leadership team that includes an executive editor, an editor-at-large, and
          a managing editor.
        source_ids: [author, about-verge]
      - text: >-
          The Verge's author page notes that under Patel's leadership the publication received its first
          Pulitzer and National Magazine Award nominations, and that Patel appears on CNBC as a regular
          contributor.
        source_ids: [author]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Patel hosts Decoder, a Verge show about big ideas in which Patel talks with innovators and policy
          makers at the frontiers of business and technology; recent episodes discuss AI, wireless
          networks, surveillance technology, and media companies. Every Friday Patel also co-hosts The
          Vergecast, The Verge's daily podcast about gadgets and Big Tech, with David Pierce.
        source_ids: [decoder, vergecast, author]
