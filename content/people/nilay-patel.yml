headline: Co-founder and editor-in-chief of The Verge, host of Decoder and co-host of The Vergecast
bio:
  text: >-
    Nilay Patel is co-founder and editor-in-chief of The Verge, Vox Media's technology and culture
    publication, which covers tech news, reviews, AI, and policy on its site, in video, and in podcasts.
    Nilay hosts Decoder, a Verge show of conversations with innovators and policy makers working at the
    frontiers of business and technology. Nilay also co-hosts The Vergecast with David Pierce, a weekly
    podcast that makes sense of the week's technology news, from gadgets to Big Tech.
  source_ids: [author, decoder, vergecast]
