sections:
  - heading: Career
    paragraphs:
      - text: >-
          Peng completed a PhD in computer science at Johns Hopkins University's Center for Language and Speech
          Processing, then spent three years at the University of Southern California as a research assistant
          professor of computer science and a research lead at its Information Sciences Institute. Peng then
          joined UCLA's computer science department, where Peng directs PLUSLAB and received tenure in 2024, and
          is now a Senior Staff Research Scientist at Google while on leave from UCLA.
        source_ids: [peng-site]
      - text: >-
          In professional service, Peng was elected to the NAACL board in December 2024 and was named a program
          chair for ICLR 2025 and for EMNLP 2025, after earlier roles such as senior area chair for AACL 2022.
        source_ids: [peng-site]
  - heading: Research
    paragraphs:
      - text: >-
          Peng's group aims to make NLP systems better at communicating with people, with a particular focus on
          creativity in AI. Its work spans controllable and creative language generation, multimodal foundation
          models, automatic evaluation of foundation models, and low-resource and multilingual language
          understanding. An early example is Plan-And-Write (2018), which generates stories by first planning a
          storyline from a title.
        source_ids: [peng-site, planwrite-paper]
      - text: >-
          Peng's NSF CAREER project, which began in 2024, studies insertion-based language models that generate
          text by repeatedly inserting words into an incomplete context rather than writing strictly left to
          right. Papers reported under the award include work on whether language models can write human-level
          narratives, on controlling language models, and on melody-constrained lyrics editing.
        source_ids: [nsf-career, nsf-career-api, peng-site]
