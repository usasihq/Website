headline: Google Senior Staff Research Scientist and UCLA associate professor (on leave) working on creative NLP
bio:
  text: >-
    Nanyun (Violet) Peng is a Senior Staff Research Scientist at Google and an Associate Professor (on
    leave) in the Computer Science Department of the University of California, Los Angeles, where Peng
    directs PLUSLAB (Peng's Language Understanding and Synthesis Lab). The lab's research covers
    controllable and creative language generation, multimodal foundation models, automatic evaluation
    of foundation models, and low-resource, multilingual natural language understanding. Before UCLA,
    Peng was a Research Assistant Professor in computer science at the University of Southern
    California and a Research Lead at its Information Sciences Institute. Peng is a co-author of
    Plan-And-Write: Towards Better Automatic Storytelling, which first plans a storyline and then
    generates a story from it.
