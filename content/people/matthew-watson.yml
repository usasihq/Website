sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Watson is named among the authors in the KerasHub README's citation entry. KerasHub is a library of
          pretrained models built as an extension of the core Keras API and released under the Apache-2.0
          license. Watson's GitHub profile pins the keras-hub, keras, keras-cv and keras-io repositories.
        source_ids: [kerashub-repo, github-profile]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Watson has written several tutorials on keras.io. These include "Pretraining a Transformer from
          scratch with KerasHub," created in April 2022, and "Getting Started with KerasHub," co-written with
          Jonathan Bischof and created in December 2022. With Abheesht Sharma, Watson wrote a 2023 example on
          parameter-efficient fine-tuning of GPT-2 with LoRA, and with Samaneh Saadat a 2024 guide to uploading
          KerasHub models.
        source_ids: [mw-pretraining, kerashub-guide, mw-lora, mw-upload]
