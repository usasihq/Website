headline: Named author of KerasHub, the pretrained-model library for Keras, and co-author of its getting-started guide
bio:
  text: >-
    Matthew Watson is named among the authors in the "Citing KerasHub" entry of the KerasHub
    README, which describes KerasHub as a pretrained modeling library and an extension of the core
    Keras API, released under the Apache-2.0 license. Watson also co-wrote, with Jonathan Bischof,
    the "Getting Started with KerasHub" guide on keras.io, whose byline links to Watson's GitHub
    profile. Watson's GitHub profile lists
    Google as their company and pins the keras-hub, keras, keras-cv, and keras-io repositories.
  source_ids: [kerashub-guide, kerashub-repo, github-profile]
  reviewed_at: 2026-10-21
