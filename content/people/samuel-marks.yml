headline: Leads the Cognitive Oversight subteam at Anthropic; first author of a study on auditing hidden objectives
bio:
  text: >-
    Samuel Marks is a Member of Technical Staff at Anthropic and leads the Cognitive Oversight subteam
    of its Alignment Science team, which aims to oversee AI systems by examining the cognitive
    processes behind their behavior rather than only their inputs and outputs. Marks is first author
    and a core research contributor of "Auditing language models for hidden objectives" (2025), whose
    authors conducted the work at Anthropic; the study trains a model with a hidden objective and runs
    a blind auditing game to test whether teams can uncover it. Earlier, Marks was a postdoc at
    Northeastern University under David Bau, and co-authored the paper describing the NNsight library
    and the National Deep Inference Fabric as well as a survey of open problems in reinforcement
    learning from human feedback.
  source_ids: [mats-marks, anthropic-chive, auditing-paper, auditing-paper-html, marks-harvard-page, nnsight-repo, rlhf-open-problems-paper]
  reviewed_at: 2026-10-13
