sections:
  - heading: Career
    paragraphs:
      - text: >-
          Marks's Harvard page records a PhD from Harvard in May 2023 in mathematics, on p-adic Hodge theory
          and prismatic cohomology under Mark Kisin, before a shift to machine learning and the mechanistic
          interpretability of large language models. Marks then worked as a postdoc at Northeastern University
          under David Bau.
        source_ids: [marks-harvard-page]
      - text: >-
          At Anthropic, Marks is a Member of Technical Staff and leads the Cognitive Oversight subteam of the
          Alignment Science team. The MATS program lists Marks as a mentor for its Anthropic streams in 2026
          and 2027, with focus areas in AI control and monitoring, misalignment science, and interpretability.
        source_ids: [mats-marks, anthropic-chive]
  - heading: Research
    paragraphs:
      - text: >-
          The Cognitive Oversight subteam aims to oversee AI systems by checking whether anything is suspicious
          in the cognitive processes behind their behavior, such as detecting when a language model is lying,
          using both interpretability-based white-box methods and black-box interrogation of models. Marks's
          2025 study on auditing language models for hidden objectives trained a model to exploit errors in
          RLHF reward models and tested whether auditing teams could uncover that objective.
        source_ids: [mats-marks, auditing-paper, auditing-paper-html]
      - text: >-
          Earlier interpretability papers by Marks include "The Geometry of Truth" with Max Tegmark, which
          studies how language models represent the truth of simple true/false statements, and "Sparse Feature
          Circuits", which introduces methods for finding and editing causal subnetworks of human-interpretable
          features. In 2026 Marks co-authored CHIVE, an agentic pipeline that finds unexpected model behaviors
          and explains them with counterfactual prompt edits.
        source_ids: [geometry-of-truth-paper, sparse-feature-circuits-paper, anthropic-chive]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Marks is a co-author of the paper introducing NNsight, an open-source system that extends PyTorch with
          deferred remote execution, and the National Deep Inference Fabric, an inference service that runs
          NNsight requests on shared GPUs and pretrained models.
        source_ids: [nnsight-paper, nnsight-repo]
