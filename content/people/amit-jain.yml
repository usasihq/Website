sections:
  - heading: Luma AI
    paragraphs:
      - text: >-
          Jain leads Luma AI as co-founder and CEO. Luma describes its mission as building multimodal
          intelligence that can generate, understand and operate in the physical world, and its flagship
          Dream Machine platform lets users generate video and images with Luma's models.
        source_ids: [luma-london, luma-ray3]
      - text: >-
          During Jain's tenure as CEO, Luma released the Ray3 video model in September 2025, opened its first international
          office in London in December 2025, and announced a regional office in Riyadh in February 2026. In
          2026 Luma also launched the production company Innovative Dreams with Wonder Project and announced an
          open science lab focused on generalization in physical AI.
        source_ids: [luma-ray3, luma-london, luma-riyadh, luma-innovative-dreams, luma-physical-ai-lab]
