headline: Co-founder and CEO of Luma AI, the company behind the Dream Machine platform and Ray video models
bio:
  text: >-
    Amit Jain is a co-founder and the CEO of Luma AI, which builds multimodal generative models for
    video and images and offers them through its Dream Machine platform. In Luma's announcements Jain
    is quoted as CEO and co-founder on the September 2025 launch of the Ray3 video model, on the
    company's first international office in London (December 2025) and its regional office in Riyadh
    (February 2026), and on Innovative Dreams, a production services company Luma launched with Wonder
    Project in April 2026.
  source_ids: [luma-ray3, luma-london, luma-riyadh, luma-innovative-dreams]
  reviewed_at: 2026-10-22
