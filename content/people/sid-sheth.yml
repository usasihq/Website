headline: Founder and CEO of d-Matrix, which builds memory-centric inference accelerators and racks for AI
bio:
  text: >-
    Sid Sheth is the founder and CEO of d-Matrix, a company that builds memory-centric compute
    hardware for generative AI inference, including the Corsair accelerator and the Squadron
    multi-rack systems. Sheth describes d-Matrix as evolving from a specialized chip company into a
    data center compute infrastructure business.
  source_ids: [dm-about, dm-squadron]
  reviewed_at: 2026-10-21
