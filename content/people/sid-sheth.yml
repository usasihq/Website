sections:
  - heading: Career
    paragraphs:
      - text: >-
          d-Matrix's about page lists Sheth as founder and CEO, alongside co-founder and CTO Sudeep
          Bhoja. The company says its leadership team has a long history of building chip
          businesses and that it made an early bet on accelerating transformer inference.
        source_ids: [dm-about, dm-3dimc]
      - text: >-
          Sheth speaks for the company in its announcements, including the September 2026 NVIDIA
          collaboration and the October 2026 keynote at the OCP Global Summit where Sheth unveiled
          Squadron.
        source_ids: [dm-nvidia, dm-squadron]
  - heading: Products and projects
    paragraphs:
      - text: >-
          d-Matrix builds memory-centric hardware for AI inference. Its Corsair accelerator uses a
          chiplet-based digital in-memory compute design, and in August 2025 the company added 3D
          stacked digital in-memory compute (3DIMC) to its roadmap with Pavehawk, its first
          3DIMC silicon.
        source_ids: [dm-3dimc]
      - text: >-
          In September 2026 d-Matrix announced a collaboration with NVIDIA built around an NVLink
          Fusion rack-level system and introduced Raptor, a follow-on platform that stacks DRAM on
          an SRAM compute chip. In October 2026 it announced Squadron, a fleet of multi-rack
          inference systems, and said its Corsair servers and SquadRacks were generally available.
        source_ids: [dm-nvidia, dm-squadron]
