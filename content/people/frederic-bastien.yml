headline: Member of the JAX team at NVIDIA; first author of the 2012 Theano paper
bio:
  text: >-
    Frédéric Bastien works on the JAX team at NVIDIA. Bastien's commits to the JAX repository
    include documentation for jax.checkpoint policies, the compilation cache,
    jax.experimental.multihost_utils and cudaMallocAsync, along with error-message improvements
    and, in 2026, a fix to GPU name detection. Earlier, Bastien was first author of "Theano: new
    features and speed improvements" (2012), which describes the Theano compiler for turning
    symbolic math expressions into efficient code.
  source_ids: [github-profile, jax-commits, theano-paper]
  reviewed_at: 2026-10-13
