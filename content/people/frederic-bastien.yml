sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Frédéric Bastien was first author of the 2012 paper "Theano: new features and speed improvements,"
          which describes Theano, a compiler that turns symbolic mathematical expressions into efficient code
          for CPUs and GPUs. Bastien is also listed among the Theano Development Team authors of the 2016 paper
          presenting Theano as a Python framework for defining, optimizing and evaluating expressions over
          multi-dimensional arrays.
        source_ids: [theano-paper, theano2016-paper, theano-license]
      - text: >-
          In 2013 Bastien co-authored the paper introducing Pylearn2, a machine learning research library
          designed for flexibility and extensibility. Bastien's GitHub profile now describes membership of the
          JAX team at NVIDIA.
        source_ids: [pylearn2-paper, github-profile]
