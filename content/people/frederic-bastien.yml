    url: https://github.com/Theano/Theano
    contribution: >-
      First author of "Theano: new features and speed improvements" (2012), which presents new
      capabilities and speed gains in Theano; the Theano repository's commit history shows the
      nouiz account (Frédéric Bastien) merging pull requests into the project, and the license is
      held by the Theano Development Team.
    source_ids: [theano-paper, theano-commits, theano-license]
