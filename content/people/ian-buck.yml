sections:
  - heading: Career
    paragraphs:
      - text: >-
          At Stanford University, Buck was the development lead for Brook, a compiler and runtime for the Brook
          stream programming language on graphics hardware, released as a beta source package. Buck was first
          author of "Brook for GPUs: Stream Computing on Graphics Hardware," a SIGGRAPH 2004 paper, which
          used the GPU as a streaming coprocessor for general-purpose programs.
        source_ids: [brook-project, brook-paper, nvidia-author]
      - text: >-
          Buck joined NVIDIA in 2004 after completing the PhD, and NVIDIA describes Buck as the inventor of CUDA,
          its platform for GPU computing. Buck is now NVIDIA's vice president of hyperscale and high-performance
          computing and, as head of product for hyperscale AI, manages NVIDIA's AI hardware and software products
          developed with large cloud and AI companies.
        source_ids: [nvidia-author]
  - heading: Writing
    paragraphs:
      - text: >-
          Buck's posts on the NVIDIA blog cover deployments of NVIDIA systems with cloud providers, including
          GB200 NVL72 systems at CoreWeave and Oracle Cloud Infrastructure in 2025 and a GB300 NVL72
          supercomputing cluster on Microsoft Azure. Later posts describe NVIDIA's collaborations with Microsoft,
          AWS and Google Cloud and, in July 2026, the NVIDIA Vera CPU, which NVIDIA positions for agentic AI
          workloads.
        source_ids: [nvidia-author, nvidia-vera-2026]
