headline: Vice president of hyperscale and HPC at NVIDIA; described by NVIDIA as the inventor of CUDA
bio:
  text: >-
    Ian Buck is vice president of hyperscale and high-performance computing at NVIDIA, where, as head of
    product for hyperscale AI, Buck manages NVIDIA's AI hardware and software products. NVIDIA's author
    page describes Buck as the inventor of CUDA and says Buck joined NVIDIA in 2004 after completing a
    PhD in computer science at Stanford University, where Buck was development lead for Brook, the
    forerunner to generalized computing on GPUs. Buck is the first author of the 2004 paper Brook for
    GPUs, which presents a compiler and runtime for general-purpose computation on programmable graphics
    hardware.
  source_ids: [nvidia-author, nvidia-vera-2026, brook-paper, brook-project]
  reviewed_at: 2026-10-21
