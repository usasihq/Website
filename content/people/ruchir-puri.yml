headline: Chief Scientist of IBM Research and IBM Fellow; first author of the Project CodeNet dataset paper
bio:
  text: >-
    Ruchir Puri is the Chief Scientist of IBM Research, an IBM Fellow, and Vice President of IBM
    Technology and Technical Community, according to the IBM Research profile. The profile notes that
    Puri led IBM Watson as its CTO and Chief Architect from 2016 to 2019. Puri is the first author of the
    2021 paper introducing CodeNet, an AI-for-code dataset whose IBM/Project_CodeNet repository
    (Apache-2.0) provides processing tools and a download link for the full dataset, and a co-author of IBM's Granite Code models paper,
    whose models were released under the Apache 2.0 license. Puri also appears among the authors of ITBench, a benchmark for AI
    agents on IT automation tasks.
  source_ids: [ibm-research-profile, codenet-paper, codenet-repo, granite-code-paper, itbench-paper]
  reviewed_at: 2026-10-21
