sections:
  - heading: Career
    paragraphs:
      - text: >-
          Puri has held technical, research and engineering leadership roles across IBM's AI and research
          businesses. From 2016 to 2019 Puri led IBM Watson as its CTO and Chief Architect, and Puri is now
          Chief Scientist of IBM Research, an IBM Fellow and Vice President of IBM Technology and Technical
          Community.
        source_ids: [ibm-research-profile]
      - text: >-
          Outside IBM, Puri has been an adjunct professor at Columbia University and a visiting scientist at
          Stanford University, held the John von Neumann Chair at the Institute of Discrete Mathematics at the
          University of Bonn, and has served as an ACM Distinguished Speaker and an IEEE Distinguished
          Lecturer.
        source_ids: [ibm-research-profile]
  - heading: Research
    paragraphs:
      - text: >-
          Puri's recent research applies language models to software and hardware engineering. Puri was first
          author of the 2021 CodeNet dataset paper and co-authored IBM's Granite Code models (2024), the Qiskit
          Code Assistant for generating quantum computing code (2024) and a study of customizing a language
          model for VHDL design of high-performance microprocessors (2025).
        source_ids: [codenet-paper, granite-code-paper, qiskit-code-paper, vhdl-paper]
      - text: >-
          Work on AI agents includes ITBench (ICML 2025), a benchmark of IT automation tasks, and a 2026 paper
          on how far general-purpose coding agents can go in optimizing hardware through high-level
          synthesis.
        source_ids: [itbench-paper, ibm-research-profile, hls-agents-paper]
