sections:
  - heading: Career
    paragraphs:
      - text: >-
          Briski worked at IBM before joining NVIDIA in 2016.
          NVIDIA's blog author page describes Briski as vice president of generative AI software for
          enterprise, overseeing strategy, roadmaps and requirements for the company's AI software and services,
          and the GTC Berlin 2026 speaker list gives the title VP of AI Software Product Management.
        source_ids: [nvidia-blog-author, gtc-berlin-2026]
  - heading: Nemotron and open models
    paragraphs:
      - text: >-
          Briski is listed in the leadership credits of NVIDIA's December 2025 Nemotron 3 white paper and has
          written several of NVIDIA's blog announcements about the Nemotron family of open models. These include
          posts on the UK-LLM project for UK languages in September 2025, NVIDIA's partnership with Mistral AI in
          December 2025, Nemotron 3 Super in March 2026 and Nemotron 3 Nano Omni in April 2026.
        source_ids: [nemotron3-paper, nvidia-blog-author]
      - text: >-
          Later 2026 posts by Briski cover Nemotron 3.5 Lightning and the NeMo Switchyard tooling in August,
          Nemotron 3.5 Super VL in October, and NVIDIA open models for European industries. In NVIDIA's March 2026
          press release on expanded open model families, Briski was quoted as vice president of generative AI
          software.
        source_ids: [nvidia-blog-author, open-model-families-release]
