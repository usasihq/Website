      states that NVIDIA will release the model weights, training datasets and recipes; wrote
      NVIDIA's blog announcements of Nemotron 3 Super (March 2026), Nemotron 3 Nano Omni (April
      2026) and Nemotron 3.5 Lightning (August 2026).
