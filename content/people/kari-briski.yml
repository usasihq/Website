headline: VP of AI software product management at NVIDIA; listed in the Nemotron 3 leadership credits
bio:
  text: >-
    Kari Briski is VP of AI Software Product Management at NVIDIA, the title the GTC Berlin 2026
    speaker list gives, and NVIDIA's blog describes Briski's work as overseeing strategy, roadmaps
    and requirements for the company's AI software and services. Briski worked at IBM before
    joining NVIDIA in 2016. Briski appears in the leadership credits of NVIDIA's Nemotron 3 white
    paper, and in 2026 wrote NVIDIA's blog announcements of Nemotron 3 Super, Nemotron 3 Nano Omni
    and Nemotron 3.5 Lightning. In NVIDIA's March 2026 announcement of its expanded open model
    families, Briski was quoted as vice president of generative AI software.
