sections:
  - heading: Channel and publications
    paragraphs:
      - text: >-
          Zitron writes Where's Your Ed At, a newsletter of long-form essays on the technology industry, AI,
          and venture capital, and hosts Better Offline with iHeartRadio and Cool Zone Media. The show page
          describes Better Offline as a weekly program combining narrative storytelling, one-on-one
          interviews, and panel discussions about the tech industry's influence on society.
        source_ids: [home, about, iheart]
      - text: >-
          Zitron began as a games journalist, writing for PC Zone, CVG, Eurogamer and others, and has been
          published in The Atlantic, Business Insider, the Wall Street Journal, USA Today, and TechCrunch.
          Zitron also runs EZPR, a media relations and primary research company, and has a book in progress
          with Penguin Random House, Why Everything Stopped Working, which the newsletter's About page lists
          for release in mid-2027.
        source_ids: [about]
