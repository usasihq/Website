headline: Writer of the Where's Your Ed At newsletter and host of the Better Offline podcast about tech
bio:
  text: >-
    Ed Zitron writes Where's Your Ed At, a newsletter of long-form posts on the technology industry,
    AI, and venture capital, and hosts Better Offline, a weekly podcast with iHeartRadio and Cool Zone
    Media about the tech industry's influence on society, told through narrative episodes, interviews,
    and panel discussions. Ed Zitron is also CEO of EZPR, a media relations and primary research
    company, and has an upcoming book with Penguin Random House titled "Why Everything Stopped
    Working". Ed Zitron previously worked as a games journalist and has written for publications
    including The Atlantic and TechCrunch.
  source_ids: [about, home, iheart]
  reviewed_at: 2026-10-21
