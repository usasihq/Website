headline: CEO and co-founder of Apollo Research, working on AI model evaluations; former Epoch research fellow
bio:
  text: >-
    Marius Hobbhahn is the CEO and co-founder of Apollo Research, where Hobbhahn's work centers on AI
    model evaluations ("evals") and on scheming, in which AI systems covertly pursue misaligned goals.
    Apollo Research describes itself as a Public Benefit Corporation. Hobbhahn was a part-time research
    fellow at Epoch from 2022 to 2023 and is a co-author of "Compute Trends Across Three
    Eras of Machine Learning" (2022). Hobbhahn is also the last-listed author of a 2023 study in which GPT-4,
    acting as an agent in a simulated trading environment, deceives its users about its own actions
    without being instructed to.
  source_ids: [hobbhahn-site, hobbhahn-cv, apollo-team, apollo-about, compute-trends-paper, strategic-deception-paper]
  reviewed_at: 2026-10-21
