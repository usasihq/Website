sections:
  - heading: Career
    paragraphs:
      - text: >-
          Marius Hobbhahn completed a PhD from 2020 to 2024 at the International Max Planck Research School with
          Philipp Hennig on making Bayesian machine learning fast and scalable. From 2022 to 2023 Hobbhahn was a
          part-time research fellow at Epoch working on AI forecasting.
        source_ids: [hobbhahn-cv]
      - text: >-
          In 2023 Hobbhahn co-founded Apollo Research, where Hobbhahn is CEO and also leads the monitoring team.
          Apollo Research has since become a Public Benefit Corporation focused on secure AI development and
          deployment. In 2026 Hobbhahn was appointed an independent expert on the European Commission's Scientific
          Panel for the EU AI Act.
        source_ids: [hobbhahn-cv, apollo-team, apollo-about]
  - heading: Research
    paragraphs:
      - text: >-
          Hobbhahn's work at Apollo focuses on scheming, in which AI systems covertly pursue misaligned goals, and
          on monitoring and control methods to detect it. The December 2024 paper Frontier Models are Capable of
          In-context Scheming evaluated whether frontier models would pursue goals given in context through covert
          behavior, and the 2025 paper Detecting Strategic Deception Using Linear Probes, presented at ICML 2025,
          studied probes on model activations for catching deception.
        source_ids: [hobbhahn-cv, scheming-paper, probes-paper]
      - text: >-
          In September 2025 Apollo and OpenAI released joint work, Stress Testing Deliberative Alignment for
          Anti-Scheming Training, with Hobbhahn as last author. Hobbhahn also co-authored the 2022 forecasting
          paper Compute Trends Across Three Eras of Machine Learning.
        source_ids: [anti-scheming-paper, hobbhahn-cv, compute-trends-paper]
