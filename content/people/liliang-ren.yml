sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ren completed a PhD in computer science at the University of Illinois Urbana-Champaign, advised by
          ChengXiang Zhai, after a master's degree at the University of California San Diego. During the PhD,
          Ren held research internships at Microsoft Research in 2022 and at Amazon Science in 2023.
        source_ids: [ren-site]
      - text: >-
          Ren later worked at Microsoft Superintelligence and is now a Member of Technical Staff at Thinking
          Machines Lab.
        source_ids: [ren-site]
  - heading: Research
    paragraphs:
      - text: >-
          Ren's research aims at neural architectures with greater efficiency and capacity. Samba, posted in
          June 2024 with Weizhu Chen as senior author, combines state-space layers with sliding-window attention
          for language modeling with unlimited context length. The SambaY paper, posted in July 2025, introduces a
          decoder-hybrid-decoder design and was released with Phi-4-mini-flash-reasoning and a training codebase.
        source_ids: [ren-site, samba-paper, sambay-paper]
      - text: >-
          Ren's site notes five papers accepted at NeurIPS 2025, including SambaY and Routing Mamba, and a March
          2026 paper on hyperparameter transfer for scaling training compute.
        source_ids: [ren-site]
