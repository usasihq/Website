headline: Member of Technical Staff at Thinking Machines Lab; first author of SambaY and Samba
bio:
  text: >-
    Liliang Ren is a Member of Technical Staff at Thinking Machines Lab and was previously at
    Microsoft Superintelligence, according to Ren's site. Ren is the first author of
    "Decoder-Hybrid-Decoder Architecture for Efficient Reasoning with Long Generation" (2025), which
    introduced the SambaY architecture used in Microsoft's Phi-4-mini-flash-reasoning model, and of
    Samba (2024), a hybrid state-space architecture for language modeling with unlimited context. Ren
    earned a PhD in computer science at the University of Illinois Urbana-Champaign, advised by
    ChengXiang Zhai.
  source_ids: [ren-site, sambay-paper, samba-paper]
  reviewed_at: 2026-10-22
