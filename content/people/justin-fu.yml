sections:
  - heading: Career
    paragraphs:
      - text: >-
          Fu completed a PhD in electrical engineering and computer sciences at UC Berkeley from 2016 to 2021,
          advised by Sergey Levine. During the PhD, Fu was
          a student researcher at Google and a research intern at DeepMind, working on inverse reinforcement
          learning.
        source_ids: [fu-site, fu-cv]
      - text: >-
          Fu joined Waymo as a research scientist in August 2021. Fu's CV lists work on reinforcement-learning
          fine-tuning of driving foundation models and on combining such models with search and optimization
          for reliability.
        source_ids: [fu-cv]
  - heading: Research
    paragraphs:
      - text: >-
          Fu's research covers reinforcement learning, natural language processing and robotics. Fu was first
          author of D4RL (2020), datasets for deep data-driven reinforcement learning, and co-organized the
          NeurIPS 2021 Workshop on Offline Reinforcement Learning.
        source_ids: [fu-site, fu-cv, d4rl-paper]
      - text: >-
          At Waymo, Fu was lead developer of Waymax, released in 2023 as an open-source simulator for planning
          and behavior problems in autonomous driving. The Waymax paper lists Cole Gulino, Fu, Wenjie Luo and
          George Tucker as equal-contribution first authors.
        source_ids: [fu-cv, waymax-paper, waymax-readme]
