headline: Research scientist at Waymo Research and lead developer of the open-source Waymax driving simulator
bio:
  text: >-
    Justin Fu is a machine learning researcher at Waymo Research. Fu's CV describes the role of lead developer
    for Waymax, an open-source, hardware-accelerated simulator for planning and behavior research in
    autonomous driving, and Fu is one of four equal-contribution first authors of the Waymax paper. Before
    Waymo, Fu completed a PhD at UC Berkeley advised by Sergey Levine, with research on reinforcement learning
    including the D4RL benchmark.
  source_ids: [fu-site, fu-cv, waymax-paper, d4rl-paper]
  reviewed_at: 2026-10-22
