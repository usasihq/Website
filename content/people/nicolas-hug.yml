sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Hug describes the current work as part of the PyTorch team at Meta, focused on preprocessing and
          performance, and as the primary developer of TorchVision and TorchCodec. PyTorch's governance
          documentation lists Hug as a maintainer of both libraries: TorchVision provides datasets, transforms
          and models for computer vision, and TorchCodec handles media decoding and encoding for PyTorch.
        source_ids: [nh-about, pytorch-poi, torchvision-repo, torchcodec-repo]
      - text: >-
          Before joining Meta, Hug was a postdoc and part of scikit-learn's core development team for several
          years, and is now listed among its emeritus maintainers. In scikit-learn 0.21 Hug added the
          histogram-based gradient boosting estimators HistGradientBoostingClassifier and
          HistGradientBoostingRegressor, an implementation inspired by LightGBM.
        source_ids: [nh-about, sklearn-about, nh-skl021]
      - text: >-
          During a PhD, Hug developed Surprise, a Python library for building and analyzing recommender systems,
          which Hug described in a 2020 paper in the Journal of Open Source Software.
        source_ids: [nh-about, nh-joss]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Hug's blog explains technical topics in machine learning, including a four-part 2017 series on matrix
          factorization for recommendation, 2019 posts on gradient boosting and on Cython, and a 2022 deep dive
          into the internals of the FFCV data-loading library.
        source_ids: [nh-blog]
timeline:
