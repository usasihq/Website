headline: Maintainer of PyTorch's TorchVision and TorchCodec libraries; ML engineer at Meta AI
bio:
  text: >-
    Nicolas Hug is an ML engineer working on PyTorch at Meta AI. The PyTorch governance
    documentation lists Hug as a maintainer of TorchVision, the computer vision library of
    datasets, transforms and models, and of TorchCodec, which handles media decoding and encoding
    for PyTorch. Hug is also listed among the emeritus maintainers of scikit-learn, and Hug's
    GitHub account hosts Surprise, a Python toolkit for building and analyzing recommender systems.
  source_ids: [github-profile, pytorch-poi, torchvision-repo, torchcodec-repo, sklearn-about]
  reviewed_at: 2026-10-13
