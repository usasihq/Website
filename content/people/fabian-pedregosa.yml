headline: Research scientist at Google on the Gemini Core team; led scikit-learn's first public release in 2010
bio:
  text: >-
    Fabian Pedregosa is a research scientist at Google, working on the Gemini Core team on math,
    code and related topics. Pedregosa took over scikit-learn in 2010 while at INRIA, made its
    first public release and served as a developer, maintainer and release manager until 2012,
    and is first author of the 2011 JMLR paper that introduced the library. After postdoctoral
    work at INRIA and at UC Berkeley, Pedregosa joined Google Research. Pedregosa also started
    memory-profiler, a line-by-line memory profiler for Python, and co-authored the paper that
    describes the implicit differentiation framework of JAXopt, a library of differentiable
    optimizers built on JAX.
  source_ids: [homepage, sklearn-about, sklearn-jmlr, jaxopt-paper, jaxopt-repo]
  reviewed_at: 2026-10-13
