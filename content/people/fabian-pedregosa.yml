sections:
  - heading: Career
    paragraphs:
      - text: >-
          Fabian Pedregosa started in open source as a core contributor to the SymPy computer algebra system, then
          worked at INRIA on scikit-learn. Pedregosa went on to a PhD applying machine learning to brain imaging,
          followed by postdoctoral work on mathematical optimization at INRIA with Alexandre d'Aspremont and at UC
          Berkeley with Laurent El Ghaoui.
        source_ids: [homepage]
      - text: >-
          Pedregosa then joined Google Research, where the work focused on mathematical optimization until 2022
          and on AI for mathematics afterwards. Pedregosa's homepage describes being part of the team behind the
          International Mathematical Olympiad results of 2024 and 2025, and current work on the Gemini Core team on
          math, code and related topics.
        source_ids: [homepage]
  - heading: Open-source work
    paragraphs:
      - text: >-
          David Cournapeau started scikit-learn in 2007; Pedregosa took over the project in January 2010, made its
          first public release on 1 February 2010 and served as developer, maintainer and release manager until
          January 2012. Pedregosa is first author of the 2011 JMLR paper introducing the library and is listed
          among its emeritus maintainers.
        source_ids: [homepage, sklearn-jmlr, sklearn-about]
      - text: >-
          Pedregosa started memory-profiler, a line-by-line memory profiler for Python, in 2012 and remains its
          lead developer. At Google, Pedregosa co-authored the implicit differentiation framework behind JAXopt, a
          differentiable optimization library for JAX that was discontinued in December 2023 in favor of Optax, and
          also contributes to Optax.
        source_ids: [homepage, jaxopt-paper, jaxopt-repo]
