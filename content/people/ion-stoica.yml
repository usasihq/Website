headline: Co-author of the Ray and vLLM papers; UC Berkeley professor and co-founder of Databricks and Anyscale
bio:
  text: >-
    Ion Stoica is a Professor of Computer Science at UC Berkeley, where Stoica holds the Xu Bao
    Chancellor Chair and directs the Sky Computing Lab, and the Executive Chairman of Databricks and
    Anyscale, two of the three companies Stoica co-founded. Stoica's research sits at the
    intersection of AI and systems, cloud computing and distributed systems. Current projects listed
    on Stoica's homepage include Chatbot Arena, the vLLM inference engine, SkyPilot, the Ray
    distributed execution framework and Apache Spark, and Stoica is a co-author of the papers
    introducing Ray and vLLM's PagedAttention. Stoica is also an advisor to LMSYS.
  source_ids: [stoica-site, stoica-bio, ray-paper, vllm-paper, lmsys-about]
  reviewed_at: 2026-10-21
