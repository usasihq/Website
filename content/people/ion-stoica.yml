sections:
  - heading: Career
    paragraphs:
      - text: >-
          Ion Stoica earned a PhD in Electrical and Computer Engineering at Carnegie Mellon University
          in 2000, where Stoica's graduate projects included Dynamic Packet State and Core-Stateless
          Fair Queueing. Stoica is now a professor in UC Berkeley's EECS department, holding the Xu
          Bao Chancellor Chair and directing the Sky Computing Lab.
        source_ids: [eecs-faculty, stoica-site]
      - text: >-
          Alongside teaching and research, Stoica co-founded three companies: Conviva in 2006,
          Databricks in 2013 and Anyscale in 2019. Stoica serves as Executive Chairman of both
          Databricks and Anyscale, and is listed among the advisors of LMSYS.
        source_ids: [stoica-bio, stoica-site, lmsys-about]
  - heading: Research
    paragraphs:
      - text: >-
          Stoica's homepage describes research at the intersection of AI and systems, cloud computing
          and distributed systems, with an interest in both theoretical foundations and practical,
          deployable implementations. Earlier projects listed there include the Chord peer-to-peer
          lookup protocol, the Internet Indirection Infrastructure, Apache Mesos, Alluxio (formerly
          Tachyon), Succinct, Clipper and Alpa.
        source_ids: [stoica-site]
      - text: >-
          Current projects named on the homepage are Chatbot Arena, vLLM, SkyPilot, Ray and Apache
          Spark. Stoica is a co-author of the 2017 paper introducing Ray, the 2023 PagedAttention
          paper behind vLLM, and the 2024 paper describing Chatbot Arena as an open platform for
          evaluating language models by human preference.
        source_ids: [stoica-site, ray-paper, vllm-paper, arena-paper]
  - heading: Teaching and students
    paragraphs:
      - text: >-
          At Berkeley, Stoica has taught operating systems (CS 162), networking (EE 122, CS 268 and
          CS 168) and graduate systems courses (CS 262a and CS 294). The homepage lists the PhD
          students and postdocs Stoica has advised; the entries for past students include faculty
          posts and co-founded companies.
        source_ids: [stoica-site, eecs-faculty]
