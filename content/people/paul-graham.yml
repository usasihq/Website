headline: Programmer and essayist at paulgraham.com, author of Lisp books, co-founder of Viaweb and Y Combinator
bio:
  text: >-
    Paul Graham is a programmer, writer and investor who has published essays on paulgraham.com
    since 2001. Paul is the author of the programming books On Lisp and ANSI Common Lisp and the
    essay collection Hackers & Painters, and in 2019 published Bel, a Lisp dialect written in
    itself. Paul co-founded the software company Viaweb in 1995, which became Yahoo Store, and
    co-founded the startup incubator Y Combinator in 2005.
  source_ids: [bio]
  reviewed_at: 2026-10-21
