sections:
  - heading: Career
    paragraphs:
      - text: >-
          Graham started the software company Viaweb with Robert Morris in 1995, and Graham's bio describes it
          as a software-as-a-service company. Yahoo acquired Viaweb in 1998, and the product became
          Yahoo Store. In 2005 Graham, Jessica Livingston, Robert Morris and Trevor Blackwell started the startup
          incubator Y Combinator.
        source_ids: [bio]
  - heading: Programming languages
    paragraphs:
      - text: >-
          Graham's first book, On Lisp (Prentice Hall, 1993), studies advanced Lisp techniques with bottom-up
          programming as its theme, giving extended treatment to macros and building a working model of the
          Common Lisp Object System. ANSI Common Lisp (Prentice Hall, 1995) pairs an introduction to the language
          with a reference manual and more than twenty worked example programs. On Lisp is now offered as a
          free download from Graham's site.
        source_ids: [onlisp, acl]
      - text: >-
          Graham presented Arc, a new Lisp dialect, at the LL1 workshop in November 2001 when it was about three
          weeks old, and later released it through arclanguage.org. In October 2019 Graham published Bel, a specification
          for a Lisp dialect written in itself, made up of a language guide and the Bel source meant to be read side by side.
        source_ids: [arc, arc-ll1, bel]
  - heading: Essays and books
    paragraphs:
      - text: >-
          Graham has published essays on paulgraham.com since 2001, and the site's essay index collects writing
          on startups, programming and how to do good work. Hackers & Painters (O'Reilly, 2004) gathers essays on
          programmers, the people who become them and how technology shapes everyday life.
        source_ids: [bio, articles, hackpaint]
