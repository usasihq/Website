slug: daniel-han
name: Daniel Han
initials: DH
groups: [local, open-source]
sector: corporate
specialties: [training-systems, inference]
headline: Works on Unsloth, open-source software for fine-tuning and running models on local hardware
bio:
  text: >-
    Daniel Han works on Unsloth, which the README says can be used as a desktop app, a web UI, or
    in code to run and train language, diffusion, embedding, and audio models. Unsloth's About
    page lists Daniel Han for software, data, and algorithms. Daniel Han made the repository's first
    commits in November 2023 and still commits to it, and its CODEOWNERS file names Daniel Han as
    owner of the training, reinforcement learning, kernels, and diffusion training areas.
  source_ids: [unsloth-readme, unsloth-about, unsloth-first-commit, unsloth-commits, unsloth-codeowners]
  reviewed_at: 2026-10-21
affiliations:
  - name: Unsloth
    organization_slug: unsloth
    role: Listed on Unsloth's About page for software, data, and algorithms
    current: true
    source_ids: [unsloth-about, github-profile, hf-org]
work:
  - name: Unsloth (open-source library, Studio, and Desktop)
    artifact_slug: unsloth-library
    url: https://github.com/unslothai/unsloth
    contribution: >-
      Made the repository's initial commit and first upload of Unsloth code on 2023-11-29, and
      continues to author commits. The CODEOWNERS file names Daniel Han as area owner for training,
      reinforcement learning, kernels, and diffusion training, and the README's citation entry lists
      Daniel Han, Michael Han, and the Unsloth team as authors. The core library is Apache-2.0.
    source_ids: [unsloth-first-commit, unsloth-commits, unsloth-codeowners, unsloth-readme]
  - name: Unsloth on Hugging Face
    artifact_slug: null
    url: https://huggingface.co/unsloth
    contribution: >-
      One of the two members listed on the Unsloth organization page on Hugging Face, where Unsloth
      publishes model uploads, including GGUF versions for running models locally.
    source_ids: [hf-org, unsloth-readme]
links:
  - label: GitHub
    url: https://github.com/danielhanchen
  - label: Hugging Face
    url: https://huggingface.co/danielhanchen
  - label: Unsloth
    url: https://unsloth.ai/about
sections:
  - heading: Open-source work
    paragraphs:
      - text: >-
          Daniel Han made the first commits to the Unsloth repository on November 29, 2023, and the README's
          citation entry, dated 2023, credits Daniel Han, Michael Han and the Unsloth team as authors. The
          project's core package is licensed under Apache 2.0, with optional components such as the Studio
          interface under AGPL-3.0.
        source_ids: [unsloth-first-commit, unsloth-readme]
      - text: >-
          The repository's CODEOWNERS file lists Daniel Han as area owner for training, reinforcement
          learning, kernels and diffusion training, and assigns the core library directories for kernels,
          model patching, optimizers and data preparation to Daniel Han.
        source_ids: [unsloth-codeowners]
  - heading: Products and projects
    paragraphs:
      - text: >-
          Unsloth now ships as a desktop app, a browser-based Studio interface and a Python package for
          running and fine-tuning models on local hardware, with guides for reinforcement learning, vision,
          text-to-speech and embedding fine-tuning. Release versions of the package have been published on
          the Python Package Index since August 2024.
        source_ids: [unsloth-readme, unsloth-docs, unsloth-pypi]
      - text: >-
          Through the Unsloth organization on Hugging Face, of which Daniel Han is a member, the team
          publishes model uploads such as GGUF quantizations for running open models locally.
        source_ids: [hf-org, hf-profile]
timeline:
  - date: "2023-11-29"
    text: Made the initial commit and first code upload of the Unsloth repository.
    source_ids: [unsloth-first-commit]
  - date: "2024-08-04"
