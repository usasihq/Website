sections:
  - heading: Career
    paragraphs:
      - text: >-
          Malik worked as a reporter and writer in editorial roles at Business 2.0, Forbes.com, Red Herring and
          Quick Nikkei News, and wrote Broadbandits, a book about the telecom industry. In 2001 Malik started
          GigaOm as a one-person technology blog and built it into a media
          company and research firm.
        source_ids: [about]
      - text: >-
          Malik became a venture partner at True Ventures in 2008 and a full-time partner in 2014, and has since become
          partner emeritus. In that role Malik focuses on technology trends and on encouraging the True
          team to take on larger technology market risks.
        source_ids: [about]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          On my Om, subtitled "Technology & Change: Field Notes From The Present Future," carries Malik's writing on
          technology, science, photography and general observations, which Malik approaches through the lenses of
          technology and humanism. Malik's writing has also appeared in The New Yorker, Fast Company, Wired and The
          Wall Street Journal.
        source_ids: [about]
