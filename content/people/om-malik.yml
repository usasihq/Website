headline: Writer of On my Om, a site about technology and change, and founder of GigaOm
bio:
  text: >-
    Om Malik writes about technology, science, and photography on On my Om (om.co), through the lenses of
    technology and humanism to understand the present and future. Om founded GigaOm, which grew from a technology
    blog started in 2001 into a media company and research firm, and earlier held editorial roles at
    Business 2.0, Forbes.com, and Red Herring. Om is the author of Broadbandits, a book about the
    telecom industry, and joined the venture firm True Ventures in 2008, where Om is now partner emeritus.
  source_ids: [about]
  reviewed_at: 2026-10-21
