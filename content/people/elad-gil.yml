headline: Investor and co-host of No Priors, a podcast about AI, machine learning, tech, and startups
bio:
  text: >-
    Elad Gil is a technology entrepreneur and investor who co-hosts No Priors, an AI podcast, with Sarah
    Guo; the show talks with engineers, researchers, and founders about AI research, markets, and
    society. Elad also writes Elad Blog on Substack and wrote the High Growth Handbook. Elad runs the
    investment firm Gil&Co, previously ran AI-focused product teams at Google and Twitter, and
    co-founded MixerLabs and Color Health.
  source_ids: [site, blog, nopriors]
  reviewed_at: 2026-10-21
