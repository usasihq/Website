sections:
  - heading: Career
    paragraphs:
      - text: >-
          Elad Gil started two companies: MixerLabs, which Twitter acquired while Elad was its CEO,
          and Color Health. At Twitter, Elad served as VP of Corporate Strategy, and at Google Elad
          worked on ads targeting and mobile; Elad describes having run AI-centric product
          organizations at both companies.
        source_ids: [blog, site]
      - text: >-
          Elad now runs Gil&Co, a multi-stage investment firm. Elad's site also describes helping to
          incubate Braintrust, an AI evaluation company, and Brain Co, which builds an AI platform for
          large institutions.
        source_ids: [site]
  - heading: Channel and publications
    paragraphs:
      - text: >-
          No Priors is a podcast and YouTube channel co-hosted by Elad Gil and Sarah Guo, which the
          channel describes as a guide to AI built on conversations with engineers, researchers, and
          founders. Topics include research progress, which markets AI may change, and how commerce,
          culture, and society may shift.
        source_ids: [nopriors]
      - text: >-
          On Elad Blog, Elad publishes essays on technology and startups, including a series on the
          market structure of AI. Examples include "AI Platforms, Markets, & Open Source" (2023),
          "Things I Don't Know About AI" (2024), and "AI Market Clarity" (2025).
        source_ids: [blog, post-ai-platforms, post-dont-know, post-market-clarity]
  - heading: Teaching and writing
    paragraphs:
      - text: >-
          Elad wrote High Growth Handbook, published by Stripe Press, a guide to scaling startups from
          a few dozen people to thousands. The book covers the role of the CEO, board management,
          executive hiring, M&A, and IPOs, and it includes interviews with leaders such as Reid
          Hoffman, Marc Andreessen, and Aaron Levie. Its full text is also available free on the
          book's website.
        source_ids: [hgh-stripe, hgh-online, site]
