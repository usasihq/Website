headline: Founder and editor of Platformer, an independent publication about AI and social platforms
bio:
  text: >-
    Casey Newton is a technology journalist who founded Platformer in 2020 and is its founder and
    editor. Platformer is an independent publication about AI, social platforms, and the people
    shaping technology, combining original reporting, analysis, commentary, and curated links.
    Before founding Platformer, Casey covered Silicon Valley for The Verge, CNET, and the San
    Francisco Chronicle, and from 2021 to 2026 co-hosted the New York Times podcast Hard Fork.
