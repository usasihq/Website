sections:
  - heading: Career
    paragraphs:
      - text: >-
          Newton spent about ten years covering Silicon Valley for the San Francisco Chronicle, CNET and The
          Verge. Newton's Verge author archive begins in April 2013, and in 2017 Newton started The Interface,
          a daily newsletter at The Verge about the collisions between tech platforms and democracy.
        source_ids: [platformer-about, verge-author-archive, platformer-welcome]
      - text: >-
          Newton's reporting on content moderators was a finalist for the 2020 National Magazine Award. In
          September 2020 Newton left a staff role at The Verge to launch Platformer, keeping the title of
          contributing editor there, and from 2021 to 2026 co-hosted the New York Times podcast Hard Fork.
        source_ids: [platformer-about, platformer-welcome]
  - heading: Platformer
    paragraphs:
      - text: >-
          Newton announced Platformer on September 23, 2020 as an independent, reader-funded publication
          about social networks and their relationships with the world. Today Platformer describes its
          focus as artificial intelligence and its consequences, the politics and governance of technology,
          and the changing social web and technology industry.
        source_ids: [platformer-welcome, platformer-about]
      - text: >-
          Platformer publishes at least one free edition each week plus additional editions for paid
          subscribers, and its masthead lists Newton as founder and editor alongside a links editor and a
          fellow. Recent editions by Newton in October 2026 covered OpenAI and
          X.
        source_ids: [platformer-about, platformer-home]
