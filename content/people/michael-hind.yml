headline: Distinguished Research Staff Member at IBM Research; co-author of AI Fairness 360, AIX360 and FactSheets
bio:
  text: >-
    Michael Hind is a Distinguished Research Staff Member in IBM Research's AI department, who has worked
    on AI governance for much of the past decade and is now also pursuing ideas in generative computing,
    according to the IBM Research profile. The profile credits Hind and collaborators with transferring
    FactSheets and AI risk tools into IBM and with launching open-source projects including AI Fairness
    360, AI Explainability 360, and AI Risk Atlas Nexus, alongside programming-language projects such as
    Jikes RVM and WALA. Hind is a co-author of the papers introducing AI Fairness 360, AI
    Explainability 360, FactSheets, and IBM's Granite Guardian models, and the profile notes the SIGPLAN
    Software Award in 2012 for work on Jikes RVM.
  source_ids: [ibm-research-profile, aif360-paper, aix360-paper, factsheets-paper, granite-guardian-paper]
  reviewed_at: 2026-10-21
