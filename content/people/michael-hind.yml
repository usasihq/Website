sections:
  - heading: Career
    paragraphs:
      - text: >-
          Michael Hind received a PhD from NYU in 1991 and spent seven years as an assistant and then
          associate professor of computer science at SUNY New Paltz. At IBM Research, Hind has led
          researchers working on programming languages, software engineering, cloud computing and
          tools for AI systems.
        source_ids: [ibm-research-profile]
      - text: >-
          Hind's earlier IBM work includes the Jikes RVM research virtual machine and the WALA program
          analysis libraries, and Hind's profile also lists X10 and OpenWhisk among the open-source
          projects launched with collaborators. A 2000 paper by Hind on adaptive optimization was
          recognized as the OOPSLA 2000 Most Influential Paper.
        source_ids: [ibm-research-profile]
  - heading: AI governance and trustworthy AI
    paragraphs:
      - text: >-
          For much of the past decade Hind has worked on AI governance. Hind co-authored the 2018
          FactSheets paper, which proposes supplier's declarations of conformity documenting how AI
          services were built and tested, and IBM's profile says FactSheets, AI Risk Atlas and related
          risk tools were transferred to various parts of IBM.
        source_ids: [ibm-research-profile, factsheets-paper]
      - text: >-
          Hind is a co-author of the papers introducing the AI Fairness 360 toolkit (2018) for
          detecting and mitigating bias, and the AI Explainability 360 toolkit and taxonomy (2019).
          More recent work includes the Granite Guardian models for detecting risks in prompts and
          responses (2024) and the open-source AI Risk Atlas Nexus project.
        source_ids: [aif360-paper, aif360-repo, aix360-paper, granite-guardian-paper, atlas-nexus-repo]
