headline: Co-founder of World Labs; author of the Pulsar sphere-based renderer used as a PyTorch3D backend
bio:
  text: >-
    Christoph Lassner is a co-founder of World Labs. Lassner's work centers on interactive virtual
    representations of the physical world that can be optimized and rendered efficiently, with a focus on
    perception and rendering systems for humans. Before World Labs, Lassner led research teams at Epic Games
    and Meta Reality Labs Research, and wrote the Pulsar renderer, now the sphere-based rendering backend of
    PyTorch3D.
  source_ids: [lassner-site, worldlabs-about]
  reviewed_at: 2026-10-22
