sections:
  - heading: Career
    paragraphs:
      - text: >-
          Lassner completed a PhD at the Bernstein Center for Computational Neuroscience and the Max Planck
          Institute for Intelligent Systems. Before joining Meta, Lassner worked at Body Labs, a startup later
          acquired by Amazon. Lassner created the human pose estimation system for Amazon Halo, part of a system for
          building a 3D body model with a smartphone.
        source_ids: [lassner-site]
      - text: >-
          Lassner later led research teams at Meta Reality Labs Research and at Epic Games. At Meta, the team's
          work on reconstructing and rendering radiance fields interactively was shown at Meta Connect 2022.
          Lassner is now a co-founder of World Labs, which names Lassner among its founders with Fei-Fei Li, Justin
          Johnson and Ben Mildenhall.
        source_ids: [lassner-site, worldlabs-about]
  - heading: Research and software
    paragraphs:
      - text: >-
          Lassner's research covers neural rendering and dynamic scene reconstruction, including Non-Rigid Neural
          Radiance Fields (2020) and Neural 3D Video Synthesis (2021), and human-focused work such as TAVA, ARCH
          and UP.
        source_ids: [nrnerf-paper, n3dv-paper, lassner-site]
      - text: >-
          On the engineering side, Lassner wrote the Pulsar renderer in 2021, which became the sphere-based
          rendering backend for PyTorch3D, and received an Honorable Mention at the ACM Multimedia Open-Source
          Software Competition 2016 for work on decision forests.
        source_ids: [lassner-site, pulsar-paper]
