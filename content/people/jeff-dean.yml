headline: Co-founder of Discovery Loop; former Chief Scientist of Google DeepMind and Google Research
bio:
  text: >-
    Jeff Dean is a co-founder of Discovery Loop, a company building systems that automate experimental
    loops in machine learning, science and engineering, with Sanjay Ghemawat, Quoc Le and Oriol Vinyals.
    Google announced in August 2026 that Dean, after 27 years at the company, was launching an
    independent public benefit corporation with Ghemawat. Dean joined Google in 1999 and was its Chief
    Scientist for Google Research and Google DeepMind. Dean is a co-author of the TensorFlow white paper,
    which describes the system built at Google and its release as open source under the Apache 2.0
    license, and of the 2017 paper that introduced the sparsely-gated mixture-of-experts layer.
  source_ids: [discovery-loop, pichai-aug-2026, dean-author, tf-whitepaper, moe-paper]
  reviewed_at: 2026-10-21
