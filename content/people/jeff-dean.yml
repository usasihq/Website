headline: Chief Scientist of Google DeepMind and Google Research; co-author of the TensorFlow white paper
bio:
  text: >-
    Jeff Dean is Google's Chief Scientist for Google Research and Google DeepMind; Google's author page
    notes that Dean joined the company in 1999 and has held several leadership roles there. Dean is a
    co-author of the TensorFlow white paper, which describes the system built at Google and its release
    as open source under the Apache 2.0 license, and of the 2017 paper that introduced the sparsely-gated
    mixture-of-experts layer. Dean is listed among the executive sponsors of the first Gemma technical
    report and among the sponsors of the Gemma 2 and Gemma 3 reports.
  source_ids: [dean-author, gemini-35-post, tf-whitepaper, moe-paper, gemma-report, gemma2-report, gemma3-report]
  reviewed_at: 2026-10-13
