sections:
  - heading: Career
    paragraphs:
      - text: >-
          Dean joined Google in 1999 and held a series of leadership roles there, ending as Chief Scientist for
          Google Research and Google DeepMind. In an August 2026 message to employees, Sundar Pichai wrote that
          Dean and Google Senior Fellow Sanjay Ghemawat were launching an independent public benefit corporation
          to accelerate discoveries in machine learning, science and engineering.
        source_ids: [dean-author, pichai-aug-2026]
      - text: >-
          That company, Discovery Loop, was founded by Dean, Ghemawat, Quoc Le and Oriol Vinyals. Its website
          describes a plan to automate the cycle of proposing, running and evaluating experiments, beginning with
          machine learning research and engineering before moving to other problems in science and engineering.
        source_ids: [discovery-loop]
  - heading: Systems and research
    paragraphs:
      - text: >-
          With Sanjay Ghemawat, Dean wrote the MapReduce paper (OSDI 2004), describing a programming model for
          processing large data sets on clusters, and co-authored Bigtable (OSDI 2006), a distributed storage
          system for structured data. In 2012, Dean was first author of "Large Scale Distributed Deep Networks",
          on training deep networks across many machines.
        source_ids: [mapreduce-paper, bigtable-paper, distbelief-paper]
      - text: >-
          Dean co-authored the word2vec paper on efficient word representations (2013), "Distilling the Knowledge
          in a Neural Network" with Geoffrey Hinton and Oriol Vinyals (2015), the GNMT translation system (2016)
          and the sparsely-gated mixture-of-experts layer (2017). Dean is also a co-author of the TensorFlow white
          paper and of the 2016 TensorFlow systems paper.
        source_ids: [word2vec-paper, distillation-paper, gnmt-paper, moe-paper, tf-whitepaper, tf-osdi-paper]
      - text: >-
          Dean was listed among the executive sponsors of the first Gemma technical report and among the sponsors
          of the Gemma 2 and Gemma 3 reports, and appeared as a byline on Google's May 2026 Gemini 3.5 announcement.
        source_ids: [gemma-report, gemma2-report, gemma3-report, gemini-35-post]
