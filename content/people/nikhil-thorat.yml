sections:
  - heading: Career
    paragraphs:
      - text: >-
          Databricks' March 2024 announcement says Thorat and Daniel Smilkov each spent a decade at Google before
          founding Lilac. At Google Brain, Thorat co-created TensorFlow.js and Know Your Data. After Lilac joined
          Databricks, Thorat worked on AI quality there, and Thorat's GitHub profile now names Anthropic.
        source_ids: [lilac-databricks, github-profile]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Thorat's early papers with Smilkov, Fernanda Viégas and Martin Wattenberg focused on
          tools for understanding models. The Embedding Projector (2016) is an interactive tool for visualizing
          and interpreting embeddings, and SmoothGrad (2017) reduces noise in gradient-based saliency maps by
          averaging over noisy copies of an input.
        source_ids: [embedding-projector-paper, smoothgrad-paper]
      - text: >-
          The 2019 TensorFlow.js paper, with Thorat and Smilkov as co-first authors, describes a library for
          building and running machine learning models in JavaScript in the browser and in Node.js, released
          under the Apache 2.0 license. Lilac, which Thorat co-founded, is an open-source tool for exploring,
          clustering and curating text datasets for generative AI, used for tasks such as evaluating model
          outputs and preparing training data.
        source_ids: [tfjs-paper, tfjs-license, lilac-databricks, lilac-repo]
