headline: Co-creator of TensorFlow.js at Google Brain and co-founder of Lilac AI; now at Anthropic
bio:
  text: >-
    Nikhil Thorat's GitHub profile bio names Anthropic, and lists previous work on AI quality at
    Databricks after co-founding Lilac AI, which Databricks acquired. At Google Brain, Thorat
    co-created TensorFlow.js and Know Your Data. Thorat is co-first author, with Daniel Smilkov, of the 2019
    TensorFlow.js paper, which describes a library for building and running machine learning models in
    JavaScript, in the web browser and in Node.js, enabling on-device computation; the tfjs repository is
    released under the Apache 2.0 license.
