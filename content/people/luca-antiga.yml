sections:
  - heading: Career
    paragraphs:
      - text: >-
          Antiga began as a researcher in medical imaging and scientific computing, holding a PhD in bioengineering
          and working in research until 2009. During that period Antiga developed vmtk, a toolkit for modeling blood
          vessels from medical images, and contributed algorithms to ITK and 3D Slicer.
        source_ids: [antiga-site, domyn-profile]
      - text: >-
          Antiga later co-founded Orobix, which applied deep learning in healthcare and manufacturing. Antiga was CTO
          at Lightning AI from 2022 to 2026 and served as Chair of the Technical Advisory Council of the PyTorch
          Foundation. Domyn now lists Antiga as its CTO, responsible for the technology roadmap and foundation model
          development.
        source_ids: [domyn-profile]
  - heading: Open-source work and writing
    paragraphs:
      - text: >-
          Domyn describes Antiga as a founding contributor to PyTorch. Antiga co-wrote Deep Learning with PyTorch
          with Eli Stevens and Thomas Viehmann for Manning, and the PyTorch Lightning repository's CODEOWNERS file
          lists Antiga as a default reviewer for the codebase.
        source_ids: [domyn-profile, manning-book, pl-codeowners]
