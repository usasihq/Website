headline: CTO of Domyn; CTO of Lightning AI from 2022 to 2026 and co-author of Deep Learning with PyTorch
bio:
  text: >-
    Luca Antiga is the CTO of Domyn, where Antiga leads the technology roadmap and the development of foundation
    models. Antiga was CTO at Lightning AI from 2022 to 2026, is a founding contributor to PyTorch, and co-authored
    the Manning book Deep Learning with PyTorch. The PyTorch Lightning repository lists Antiga as a default code
    owner for the whole codebase.
  source_ids: [domyn-profile, manning-book, pl-codeowners]
  reviewed_at: 2026-10-22
