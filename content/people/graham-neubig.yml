headline: Carnegie Mellon associate professor and Chief Scientist at OpenHands; co-author of the OpenHands paper
bio:
  text: >-
    Graham Neubig is an associate professor at the Language Technologies Institute of Carnegie Mellon
    University, and the OpenHands team page lists Neubig as Chief Scientist. CMU's faculty page
    describes research on natural language processing and large language models, including
    applications such as software development, and notes that Neubig shares research papers, course
    materials, video lectures, and open-source software openly. Neubig is a co-author of OpenHands: An
    Open Platform for AI Software Developers as Generalist Agents, whose code is released under the MIT
    license, and of SOTOPIA, an environment for evaluating social intelligence in language agents.
  source_ids: [cmu-faculty, openhands-about, openhands-paper, openhands-repo, sotopia-paper]
