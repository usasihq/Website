sections:
  - heading: Research
    paragraphs:
      - text: >-
          Neubig's research statement at Carnegie Mellon describes a long-term goal of breaking down barriers in
          human-human and human-machine communication through natural language processing, including machine
          translation and natural language understanding. The work spans advances in core NLP methods and models
          of language connected to other modalities such as speech, and the faculty page lists applications of
          large language models to tasks such as software development.
        source_ids: [cmu-faculty]
      - text: >-
          Neubig's papers include a 2017 single-author tutorial on neural machine translation and
          sequence-to-sequence models, the XTREME benchmark (2020) for evaluating cross-lingual generalization
          across many languages, and a 2021 survey that organized research on prompting methods in natural
          language processing.
        source_ids: [nmt-tutorial-paper, xtreme-paper, prompting-survey-paper]
  - heading: Agents and open-source work
    paragraphs:
      - text: >-
          In 2017 Neubig was first author of the paper describing DyNet, a toolkit for neural networks whose
          computation graphs are built dynamically. More recent work centers on language agents. Neubig
          co-authored WebArena (2023), a realistic web environment for building and testing autonomous agents,
          and SOTOPIA, which evaluates social intelligence in language agents.
        source_ids: [dynet-paper, webarena-paper, sotopia-paper]
      - text: >-
          Neubig is a co-author of the 2024 paper introducing OpenHands, an open platform for AI software
          developers released under the MIT license, and the OpenHands team page lists Neubig as Chief Scientist.
          The CMU faculty page notes that Neubig shares papers, course materials, video lectures and open-source
          software openly.
        source_ids: [openhands-paper, openhands-repo, openhands-about, cmu-faculty]
