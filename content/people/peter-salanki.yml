headline: Co-founder and Chief Technology Officer of CoreWeave, the GPU cloud for AI training and inference
bio:
  text: >-
    Peter Salanki is a co-founder and the Chief Technology Officer of CoreWeave, a cloud provider
    built for training and serving AI models at scale. Salanki has been CTO since March 2024, after
    leading CoreWeave's engineering organization as Director and then Vice President of Engineering.
