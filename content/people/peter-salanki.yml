sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before CoreWeave, Salanki was Director, Americas, in the Office of the CTO at Sandvine, an
          application and network intelligence company, from January 2018 to June 2019. Salanki
          joined CoreWeave in June 2019 as Director of Engineering and became Vice President of
          Engineering in April 2022.
        source_ids: [cw-salanki]
      - text: >-
          CoreWeave named Salanki Chief Technology Officer in March 2024, and its leadership page
          lists Salanki among the company's co-founders alongside Mike Intrator, Brian Venturo and
          Brannin McBee.
        source_ids: [cw-salanki, cw-team]
  - heading: Products and projects
    paragraphs:
      - text: >-
          CoreWeave offers GPU compute and a managed Kubernetes service for AI workloads. In
          September 2026 the company announced CoreWeave Forge, a development layer that connects
          the steps of improving models and agents and works across models, frameworks and other
          clouds.
        source_ids: [cw-team, cw-forge]
