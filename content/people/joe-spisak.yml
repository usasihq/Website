headline: VP of Product and Head of Open Source at Reflection AI; PyTorch core maintainer
bio:
  text: >-
    Joe Spisak is Vice President of Product and Head of Open Source at Reflection AI, a PyTorch core
    maintainer, and a member of the PyTorch Foundation Governing Board, according to PyTorch's May
    2026 release Q&A page, which also notes Spisak's earlier work at Meta. "The Llama 3 Herd of
    Models" (2024) lists Spisak among the Llama 3 core contributors. At PyTorch Conference Europe
    2026, Spisak gave the keynote "Community Led Open Source RL."
  source_ids: [pt212-qa, pytorch-maintainers, llama3-paper, eu26-recap]
  reviewed_at: 2026-10-21
