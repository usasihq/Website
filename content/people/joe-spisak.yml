  - name: Llama 3
    artifact_slug: llama
    type: open-weights
    url: https://arxiv.org/abs/2407.21783
    contribution: >-
      Listed among the core contributors in "The Llama 3 Herd of Models" (2024), defined there as
      people who worked on Llama 3 for at least two-thirds of the project's runtime; the paper's
      abstract states that Meta publicly released Llama 3, including the 405B-parameter model.
    source_ids: [llama3-paper, llama3-pdf]
links:
  - label: GitHub
    url: https://github.com/jspisak
sections:
  - heading: Career
    paragraphs:
      - text: >-
          Joe Spisak worked on PyTorch and Llama at Meta, where Spisak is listed among the core
          contributors of The Llama 3 Herd of Models (2024). In a January 2026 PyTorch Foundation
          year-in-review post, Spisak contributed a perspective on PyTorch's role in an open,
          production-grade AI ecosystem, listed as a Product Director at Meta.
        source_ids: [llama3-paper, llama3-pdf, ptf-2025-review]
      - text: >-
          By May 2026 PyTorch's event pages described Spisak as Vice President of Product and Head of
          Open Source at Reflection AI, a role repeated on the September 2026 PyTorch 2.14 release
          Q&A page. Spisak also serves on the PyTorch Foundation Governing Board.
        source_ids: [pt212-qa, pt214-qa]
  - heading: Open-source work
    paragraphs:
      - text: >-
          PyTorch's governance documentation lists Spisak among the project's core maintainers. Spisak took part in the
          live Q&A panels for the PyTorch 2.12 release in May 2026 and the PyTorch 2.14 release in
          September 2026.
        source_ids: [pytorch-maintainers, pt212-qa, pt214-qa]
      - text: >-
          At PyTorch Conference Europe 2026, Spisak gave the keynote "Community Led Open Source RL",
          on how the reinforcement learning community collaborates in the open.
        source_ids: [eu26-recap]
timeline:
