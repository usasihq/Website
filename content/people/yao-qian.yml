sections:
  - heading: Research
    paragraphs:
      - text: >-
          Qian's research is on spoken language processing, most recently large-scale speech-language
          representation learning, in the Speech and Dialog Research Group at Microsoft. A 2012 Microsoft
          Research publication, "Tip Tap Tones" (MobileHCI 2012), on mobile microtraining of Mandarin sounds,
          received an honorable mention award.
        source_ids: [msr-profile, msr-publications]
      - text: >-
          In 2021 Qian co-authored a series of Microsoft speech pre-training papers: UniSpeech, which learns
          speech representations from labeled and unlabeled data; UniSpeech-SAT, which adds speaker-aware
          pre-training; SpeechT5, a unified encoder-decoder model for spoken language processing; and WavLM,
          for self-supervised pre-training across the full stack of speech tasks.
        source_ids: [unispeech-paper, unispeech-sat-paper, speecht5-paper, wavlm-paper]
  - heading: Professional service
    paragraphs:
      - text: >-
          Qian is a senior member of IEEE and a member of ISCA, has organized special sessions and chaired
          sessions at Interspeech, ICASSP and other conferences, and served as secretary of the ISCA SIG-CSLP
          from 2015 to 2018 and of SIG-MLSLP since 2020. A Speech Communication journal paper from work by an
          intern Qian mentored received the journal's best paper award for 2015 to 2020.
        source_ids: [msr-profile]
