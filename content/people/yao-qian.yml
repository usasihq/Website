headline: Principal Researcher in Microsoft's Speech and Dialog Research Group; co-author of WavLM
bio:
  text: >-
    Yao Qian is a Principal Researcher in the Speech and Dialog Research Group at Microsoft, with
    research on spoken language processing and, most recently, large-scale speech-language
    representation learning. Qian is a co-author of WavLM, a Microsoft model for self-supervised
    pre-training for full-stack speech processing, and of UniSpeech-SAT, which adds speaker-aware
    pre-training to universal speech representation learning.
