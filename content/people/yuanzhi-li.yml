headline: First author of the phi-1.5 report and co-author of TinyStories and Microsoft's other Phi model reports
bio:
  text: >-
    Yuanzhi Li is first author of the 2023 phi-1.5 technical report, which describes a 1.3 billion
    parameter model trained largely on synthetic "textbook quality" data and states that the model was
    open-sourced; its Hugging Face model card lists the MIT license. Li co-authored the TinyStories
    paper with Ronen Eldan, with both listed at Microsoft Research, and is a co-author of the phi-1,
    Phi-3, and Phi-4 technical reports and a listed contributor to Phi-2.
  source_ids: [phi15-paper, phi15-card, tinystories-paper, phi1-paper, phi3-paper, phi4-paper, phi2-blog]
  reviewed_at: 2026-10-13
