sections:
  - heading: Research
    paragraphs:
      - text: >-
          Li's recent work centers on small language models trained on carefully generated data. TinyStories
          (2023), written with Ronen Eldan, built a synthetic dataset of short stories using only words a young
          child would understand and showed that models with fewer than 10 million parameters trained on it
          could produce fluent, consistent English.
        source_ids: [tinystories-paper]
      - text: >-
          Li is also a co-author of "Sparks of Artificial General Intelligence: Early experiments with GPT-4"
          (2023), which examined an early version of GPT-4, while it was still in development, across tasks in
          mathematics, coding, vision, medicine, law, and psychology.
        source_ids: [sparks-paper]
  - heading: Phi models
    paragraphs:
      - text: >-
          Li is a co-author of the phi-1 report "Textbooks Are All You Need" (2023), on a code model trained on
          textbook-quality data, and first author of the phi-1.5 report, which extended the approach to common
          sense reasoning in natural language with a 1.3-billion-parameter model. Li also co-authored the Phi-3
          and Phi-4 technical reports and is listed among the contributors to Phi-2.
        source_ids: [phi1-paper, phi15-paper, phi15-card, phi3-paper, phi4-paper, phi2-blog]
