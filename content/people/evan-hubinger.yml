work:
  - name: "Sleeper Agents: Training Deceptive LLMs that Persist Through Safety Training"
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2401.05566
    contribution: >-
      First author of the 2024 paper, which constructs proof-of-concept language models that, for
      example, write secure code when the prompt states the year is 2023 but insert exploitable code
      when it states 2024, and studies whether safety training removes such behavior.
    source_ids: [sleeper-agents-paper]
  - name: Alignment faking in large language models
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2412.14093
    contribution: >-
      Last-listed author of the 2024 paper demonstrating a language model selectively
      complying with its training objective during training to avoid modification of its behavior.
    source_ids: [alignment-faking-paper]
  - name: Risks from Learned Optimization in Advanced Machine Learning Systems
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/1906.01820
    contribution: >-
      First author of the 2019 paper analyzing learned optimization, in which a trained model is
      itself an optimizer, a situation the paper calls mesa-optimization.
    source_ids: [learned-optimization-paper]
