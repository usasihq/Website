sections:
  - heading: Career
    paragraphs:
      - text: >-
          Hubinger's GitHub profile lists the Machine Intelligence Research Institute, OpenAI, Google, Yelp and
          Ripple as previous organizations, and gives Hubinger's current role as Alignment Stress-Testing lead at
          Anthropic. Hubinger also maintains Coconut, an open-source variant of Python that adds features for functional programming on top of
          Python.
        source_ids: [github-profile, coconut-repo]
  - heading: Research
    paragraphs:
      - text: >-
          Hubinger's early papers were conceptual. "Risks from Learned Optimization in Advanced Machine Learning
          Systems" (2019) analyzed the case where a trained model is itself an optimizer, and a 2020 overview
          compared 11 proposals for building safe advanced AI. "Conditioning Predictive Models" (2023), as first
          author, examined the risks and strategies of using large language models as predictors.
        source_ids: [learned-optimization-paper, eleven-proposals-paper, conditioning-predictive-paper]
      - text: >-
          Later papers construct proof-of-concept examples of deceptive or misaligned behavior in language
          models and test safety methods against them. Sleeper Agents (2024)
          trained models with backdoored deceptive behavior, and follow-up papers studied how models generalize
          from sycophancy to tampering with their own reward, how a model can fake alignment during training, and
          how agents might act as insider threats. In 2025 Hubinger was the last-listed author of a paper finding
          that reward hacking in production reinforcement learning can lead to broader misalignment.
        source_ids: [sleeper-agents-paper, sycophancy-subterfuge-paper, alignment-faking-paper, agentic-misalignment-paper, emergent-misalignment-paper]
