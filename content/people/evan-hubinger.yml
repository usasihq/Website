headline: Alignment Stress-Testing lead at Anthropic; first author of the Sleeper Agents paper
bio:
  text: >-
    Evan Hubinger leads Alignment Stress-Testing at Anthropic, according to Hubinger's GitHub profile,
    and co-authored an August 2026 post on Anthropic's Alignment Science Blog. Hubinger is first
    author of "Sleeper Agents", a 2024 study that trains language models with backdoored deceptive
    behavior and tests whether standard safety training removes it, and last-listed author of the 2024
    paper "Alignment faking in large language models". Earlier, Hubinger was first author of "Risks
    from Learned Optimization in Advanced Machine Learning Systems", which introduced the term
    mesa-optimization.
  source_ids: [github-profile, anthropic-reward-seeker, sleeper-agents-paper, alignment-faking-paper, learned-optimization-paper]
  reviewed_at: 2026-10-21
