work:
  - name: "Gated KalmaNet: A Fading Memory Layer Through Test-Time Ridge Regression"
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2511.21016
    contribution: >-
      Co-author (last author) of the paper, listed on Soatto's Amazon Science page as a CVPR 2026
      publication. The abstract describes a Kalman-filter-based layer that keeps more of the past
      than fading-memory models and says the code and 8B and 32B hybrid models are released under
      Apache 2.0.
    source_ids: [gkn-paper, science-author]
  - name: "EvoMAS: Evolutionary Generation of Multi-Agent Systems"
    artifact_slug: null
    type: open-research
    url: https://arxiv.org/abs/2602.06511
    contribution: >-
      Co-author (last author) of the ICML 2026 paper, which evolves the configurations of LLM-based
      multi-agent systems through feedback-driven mutation and crossover.
    source_ids: [evomas-paper, science-author]
