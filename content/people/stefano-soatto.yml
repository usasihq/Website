sections:
  - heading: Career
    paragraphs:
      - text: >-
          Soatto received a PhD in control and dynamical systems from Caltech in 1996. Before joining UCLA in 2000, Soatto was a researcher at the University
          of Udine from 1995 to 1998, an assistant and then associate professor of electrical and biomedical
          engineering at Washington University, and a research associate in applied sciences at Harvard.
        source_ids: [ucla-dcab, soatto-homepage]
      - text: >-
          At AWS, a UCLA Samueli advisory-board biography describes Soatto as vice president of applied science
          for AWS AI, heading the AI Labs that supported services such as Amazon Comprehend, Kendra, Textract, Lex
          and Personalize. Amazon Science now lists Soatto as a vice president and distinguished scientist in
          the AWS Agentic AI organization, and UCLA lists Soatto as a computer science professor currently on
          leave.
        source_ids: [ucla-dcab, science-author, ucla-sciencehub]
  - heading: Research
    paragraphs:
      - text: >-
          Soatto's UCLA homepage lists research interests in computer vision and nonlinear estimation and control, including
          shape and motion estimation, visual textures, shape from defocus, image analysis and statistical
          inference on manifolds, with an interest in how computers can use vision, sound and touch to interact
          with people and their surroundings. Work with Yi Ma, Jana Kosecka and Shankar Sastry on Euclidean
          reconstruction received the David Marr Prize, and work with Roger Brockett on optimal structure from
          motion received the Siemens Prize with an IEEE Computer Society Outstanding Paper Award.
        source_ids: [soatto-homepage, ucla-faculty]
      - text: >-
          Soatto's recent papers with AWS colleagues focus on language models and agents. Gated KalmaNet (CVPR
          2026) introduces a memory layer based on test-time ridge regression, and EvoMAS (ICML 2026) evolves
          configurations of LLM-based multi-agent systems through feedback-driven mutation and crossover.
        source_ids: [gkn-paper, evomas-paper, science-author]
