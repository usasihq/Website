headline: Vice president and distinguished scientist in AWS Agentic AI; UCLA professor of computer science
bio:
  text: >-
    Stefano Soatto is a vice president and distinguished scientist in the Amazon Web Services
    Agentic AI organization and a computer science professor at the UCLA Samueli School of
    Engineering, which lists Soatto as currently on leave. UCLA's Science Hub for Humanity and
    Artificial Intelligence lists Soatto as Vice President, Agentic AI, Amazon Web Services and
    Professor, UCLA Computer Science, and earlier UCLA pages describe Soatto as vice president of
    applied science for AWS AI. Soatto's recent papers with
    AWS colleagues cover memory layers for language models, such as Gated KalmaNet (CVPR 2026),
    and automatic design of multi-agent systems, such as EvoMAS (ICML 2026).
  source_ids: [science-author, ucla-dcab, ucla-sciencehub, gkn-paper, evomas-paper]
  reviewed_at: 2026-10-13
