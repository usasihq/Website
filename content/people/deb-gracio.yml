headline: Director of Pacific Northwest National Laboratory since October 2025; computational and data science leader
bio:
  text: >-
    Deborah (Deb) Gracio is the Director of Pacific Northwest National Laboratory (PNNL), which
    Battelle operates for the U.S. Department of Energy. Battelle appointed Gracio director effective
    October 1, 2025, after a career of more than 35 years at PNNL that began in research supporting
    DOE Office of Science programs and included leading the laboratory's National Security
    Directorate.
  source_ids: [pnnl-gracio, pnnl-director-release]
  reviewed_at: 2026-10-21
