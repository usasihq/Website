sections:
  - heading: Research career
    paragraphs:
      - text: >-
          Gracio began at PNNL as a researcher supporting DOE Office of Science programs, helping
          launch two national user facilities and advancing computational capabilities for science.
          PNNL credits Gracio with instrumentation, computational models, software and data-intensive
          methods that broadened the use of data science across scientific and national security
          work.
        source_ids: [pnnl-gracio, pnnl-director-release]
      - text: >-
          Gracio led PNNL's Computational and Statistical Analytics Division and directed the
          laboratory's Data-Intensive Computing research initiative. Gracio's role in developing the
          Molecular Sciences Software Suite earned an R&D 100 Award and a Federal Laboratory
          Consortium Award.
        source_ids: [pnnl-nsd-release]
  - heading: Laboratory leadership
    paragraphs:
      - text: >-
          In 2020 PNNL named Gracio associate laboratory director for its National Security
          Directorate, after service as the directorate's chief operating officer. In that role
          Gracio oversaw programs and partnerships serving the National Nuclear Security
          Administration, the Department of Homeland Security, the Department of Defense and the
          intelligence community.
        source_ids: [pnnl-nsd-release, pnnl-gracio]
      - text: >-
          Battelle announced on September 4, 2025 that Gracio, selected through a national search,
          would succeed Steven Ashby as PNNL's director effective October 1. As director, Gracio
          provides the vision, strategic direction and oversight for the laboratory's research.
        source_ids: [pnnl-director-release, pnnl-gracio]
