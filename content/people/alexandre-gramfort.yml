headline: Co-creator of scikit-learn and initial creator of MNE-Python; Research Science Director at Meta Reality Labs
bio:
  text: >-
    Alexandre Gramfort is a Research Science Director at Meta Reality Labs. Gramfort was
    previously a research director at Inria, leading the MIND team (formerly Parietal), and before
    that an assistant professor at Telecom Paris. Gramfort is a co-creator and long-standing core
    developer of scikit-learn: the project's history credits Fabian Pedregosa, Gaël Varoquaux,
    Alexandre Gramfort and Vincent Michel with taking leadership of it at INRIA in 2010 and making
    the first public release. Gramfort is also the initial creator and a core developer of
    MNE-Python, an open-source package for processing EEG and MEG data.
  source_ids: [homepage, sklearn-about, sklearn-jmlr]
  reviewed_at: 2026-10-13
