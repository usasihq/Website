sections:
  - heading: Career
    paragraphs:
      - text: >-
          Alexandre Gramfort's early research career included time at the Martinos Center for
          Biomedical Imaging at Harvard University, followed by five years as an assistant professor
          in the signal processing and machine learning department at Telecom Paris. Gramfort then
          became a research director at Inria, where they led the MIND team, formerly known as
          Parietal, and also served as a co-director of the Center for Data Science at Université
          Paris-Saclay.
        source_ids: [homepage]
      - text: >-
          Gramfort joined Meta in 2022 and is now a Research Science Director at Meta Reality Labs.
          Their current work applies machine learning to decoding surface electromyography (EMG)
          signals for neuromotor interfaces.
        source_ids: [homepage]
  - heading: Research
    paragraphs:
      - text: >-
          Gramfort's research spans statistical machine learning, signal and image processing,
          optimization and scientific computing, with primary applications in neuroscience and
          biosignal processing such as MEG and EEG. In 2015 Gramfort received a European Research
          Council Starting Grant for the project Signal and Learning Applied to Brain data (SLAB), and
          in 2019 an ANR Chair in Artificial Intelligence for a project called BrAIN.
        source_ids: [homepage]
      - text: >-
          At Meta, Gramfort is among the authors of "A generic non-invasive neuromotor interface for
          human-computer interaction", published in Nature in July 2025, which describes decoding
          surface EMG signals from the wrist to control computers.
        source_ids: [nature-emg, homepage]
  - heading: Open-source work
    paragraphs:
      - text: >-
          Gramfort is a co-creator of scikit-learn: the project's history records that Fabian
          Pedregosa, Gaël Varoquaux, Gramfort and Vincent Michel of INRIA took leadership of the project
          in 2010 and made its first public release on 1 February 2010. Gramfort co-authored the 2011
          JMLR paper describing the library and is still listed on the project's maintainers team.
        source_ids: [sklearn-about, sklearn-jmlr]
      - text: >-
          Gramfort is the initial creator of MNE-Python, a package for processing EEG and MEG data
          that covers forward and inverse modeling, preprocessing, statistics and time-frequency
          analysis, and stepped down as its BDFL in 2023. Gramfort has also co-created or contributed
          to Braindecode, pyRiemann, OpenMEEG and the Sphinx-Gallery documentation extension, while
          noting reduced open-source activity since joining Meta.
        source_ids: [homepage, mne-license]
