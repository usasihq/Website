headline: Chief Scientific Officer of Microsoft and former director of Microsoft Research
bio:
  text: >-
    Eric Horvitz is Chief Scientific Officer at Microsoft, where Horvitz leads initiatives at the
    intersection of science, technology, and society with emphases on AI, biosciences, and healthcare. Before taking
    that role, Horvitz served as director of Microsoft Research, overseeing its research labs. Horvitz's
    research has covered perception, reasoning, and decision-making under uncertainty and principles for
    human-AI collaboration, and Horvitz founded and chairs Microsoft's Aether committee on AI, effects,
    and ethics in engineering and research. Horvitz co-authored the 2023 studies "Capabilities of GPT-4
    on Medical Challenge Problems" and the Medprompt paper on steering generalist foundation models in
    medicine, and has received the Feigenbaum Prize and the Allen Newell Prize.
