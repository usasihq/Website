sections:
  - heading: Career
    paragraphs:
      - text: >-
          Before moving into the role of Chief Scientific Officer, Horvitz served as director of Microsoft
          Research, overseeing its research labs. As Microsoft's
          Chief Scientific Officer, Horvitz now leads initiatives that connect science, technology and society,
          with emphases on AI, the biosciences and healthcare.
        source_ids: [msr-profile, horvitz-home]
      - text: >-
          Horvitz founded and chairs Microsoft's Aether committee on AI, effects and ethics in engineering and
          research. Outside Microsoft, Horvitz established the One Hundred Year Study on AI (AI100) at Stanford
          University, co-founded the Partnership on AI and served as its board chair, served as president of
          AAAI, and sits on the advisory boards of the Allen Institute for AI and Stanford's Institute for
          Human-Centered AI.
        source_ids: [msr-profile, horvitz-home]
  - heading: Research
    paragraphs:
      - text: >-
          Horvitz's research has used probability and utility in machine learning and reasoning, developed
          models of bounded rationality, and built systems that perceive and act by interpreting streams of
          multisensory information. Horvitz has also written on principles of human-AI collaboration, and the
          work has led to fielded systems in healthcare, transportation, e-commerce, operating systems and
          aerospace.
        source_ids: [msr-profile, horvitz-home]
      - text: >-
          In 2023, Horvitz co-authored studies of large language models in medicine. One evaluated GPT-4 on
          medical competency examinations and benchmark datasets, and the Medprompt paper showed how prompting
          strategies can unlock specialist capabilities in a generalist foundation model on medical benchmarks.
        source_ids: [gpt4-medical-paper, medprompt-paper]
