sections:
  - heading: Research
    paragraphs:
      - text: >-
          Haarnoja's doctoral work at Berkeley centred on maximum entropy reinforcement learning for robots.
          A 2017 paper with Haoran Tang, Pieter Abbeel and Sergey Levine introduced soft Q-learning, which
          learns energy-based policies for continuous states and actions. The 2018 Soft Actor-Critic paper,
          presented at ICML 2018, followed with an off-policy actor-critic algorithm built on the same framework.
        source_ids: [abbeel-group, soft-q-paper, sac-paper]
      - text: >-
          A follow-up report, "Soft Actor-Critic Algorithms and Applications" (December 2018), described
          refinements to the algorithm and its use on real robots. A companion paper, "Learning to Walk via Deep
          Reinforcement Learning", presented at RSS 2019, applied the method to learning robot locomotion with
          little manual tuning.
        source_ids: [sac-apps-paper, walk-paper]
  - heading: Robot soccer at Google DeepMind
    paragraphs:
      - text: >-
          At Google DeepMind, Haarnoja was first author of a 2023 study that used deep reinforcement learning to train a miniature
          humanoid robot with 20 actuated joints to play one-versus-one soccer, with skills such as fall recovery,
          turning and kicking. Haarnoja is also a co-author of the 2024 follow-up, "Learning Robot Soccer from
          Egocentric Vision with Deep Reinforcement Learning", which trained soccer policies using onboard
          cameras and computation.
        source_ids: [soccer-paper, egocentric-soccer-paper]
  - heading: Open-source work
    paragraphs:
      - text: >-
          The Softlearning repository from Berkeley's RAIL lab is a reinforcement learning framework for training
          maximum entropy policies and includes the official implementation of Soft Actor-Critic. Its README lists
          Haarnoja as an author of the soft Q-learning, Soft Actor-Critic and related papers the code accompanies.
        source_ids: [softlearning-repo]
