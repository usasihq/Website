headline: First author of Soft Actor-Critic and a bipedal robot soccer paper; joined DeepMind after a Berkeley PhD
bio:
  text: >-
    Tuomas Haarnoja completed a PhD thesis, "Acquiring Diverse Robot Skills via Maximum Entropy Deep
    Reinforcement Learning", in Pieter Abbeel's group at UC Berkeley in December 2018, and the group's
    alumni list records Haarnoja's next role as Research Scientist at DeepMind. Haarnoja is first
    author of the Soft Actor-Critic paper (2018), an off-policy maximum-entropy deep reinforcement
    learning algorithm with a stochastic actor, written with Aurick Zhou, Pieter Abbeel and Sergey
    Levine. Haarnoja is also first author of "Learning Agile Soccer Skills for a Bipedal Robot with
    Deep Reinforcement Learning" (2023), which lists Haarnoja's affiliation as Google DeepMind and
    trained a miniature humanoid robot to play one-versus-one soccer.
  source_ids: [abbeel-group, sac-paper, soccer-paper]
  reviewed_at: 2026-10-21
