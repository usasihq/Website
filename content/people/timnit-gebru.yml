sections:
  - heading: Career
    paragraphs:
      - text: >-
          Timnit Gebru served as co-lead of the Ethical AI research team at Google and later founded
          the Distributed AI Research Institute (DAIR), where Gebru is executive director. DAIR
          describes itself as an independent organization that grounds its research in community
          needs and local expertise.
        source_ids: [dair-profile, dair-home]
      - text: >-
          Gebru also co-founded Black in AI, a nonprofit working on inclusion and visibility in the
          field of AI, and serves on the board of AddisCoder, a nonprofit that teaches algorithms and
          programming to high school students. DAIR's site announces "Deep Unlearning", a forthcoming
          book by Gebru.
        source_ids: [dair-profile, dair-home]
  - heading: Research
    paragraphs:
      - text: >-
          Gebru was first author of a 2017 study that used deep learning on Google Street View images
          to estimate the demographic makeup of neighborhoods across the United States. With Joy
          Buolamwini, Gebru co-authored "Gender Shades" (2018), which measured intersectional accuracy
          disparities in commercial gender classification systems.
        source_ids: [street-view-paper, gender-shades-paper]
      - text: >-
          Gebru's work on documentation practices includes "Datasheets for Datasets" (2018), which
          proposes that every dataset ship with a datasheet describing its motivation, composition,
          collection process and recommended uses, and "Model Cards for Model Reporting" (2018), which
          proposes short documents reporting a trained model's evaluation across conditions and
          groups.
        source_ids: [datasheets-paper, model-cards-paper]
