headline: Founder and executive director of DAIR; first author of Datasheets for Datasets
bio:
  text: >-
    Timnit Gebru is the founder and executive director of the Distributed AI Research Institute
    (DAIR), which describes itself as an independent organization conducting community-rooted
    research. Before DAIR, Gebru served as co-lead of the Ethical AI research team at Google. Gebru is
    first author of Datasheets for Datasets, which proposes that every dataset be accompanied by a
    datasheet documenting its motivation, composition, collection process, and recommended uses, and a
    co-author of Model Cards for Model Reporting, which proposes short documents that accompany trained
    machine learning models and report their evaluation across a range of conditions.
  source_ids: [dair-profile, dair-home, datasheets-paper, model-cards-paper]
  reviewed_at: 2026-10-13
