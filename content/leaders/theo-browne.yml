bio_sections:
  - heading: Education and early career
    paragraphs:
      - text: "Browne is an alumnus of RPI (Rensselaer Polytechnic Institute) and of Twitch, where Browne's first job
          came fresh out of university: a contract developer role on Twitch's Creative Team. In that role
          Browne wrote the code that ran Twitch's marathon streams, including Power Rangers, Yu-Gi-Oh!, and
          the viral Bob Ross marathon. Over four years at Twitch, Browne moved from team to team, building
          dozens of projects."
        source_ids:
          - t3-me
          - t3-blog-quitting
      - text: In February 2021, Browne joined Turntable's TTFM Labs as a full-stack engineer. Hired to build the
          Android app, Browne had the TTFM client running on all platforms within a month, and the team
          replaced a 7,000-line socket server with a lean implementation under 350 lines.
        source_ids:
          - t3-me
          - t3-blog-quitting
  - heading: Founding T3 Tools and Ping
    paragraphs:
      - text: A side project called Round, a tool for multi-person content, became the spark for Browne's own company.
          In September 2021, Browne announced T3 Tools, writing, "I want to make tools that inspire a sense of
          craftsmanship." In January 2022 the team introduced Ping, a live collaboration tool that lets
          streamers bring each guest into OBS as a separate source.
        source_ids:
          - t3-blog-quitting
          - t3-blog-announcing-ping
          - t3-tools-next
      - text: Browne and co-founder Mark Florkowski took the company through Y Combinator's Winter 2022 batch, and
          Ping 1.0 officially launched on June 30, 2022, with guest video at up to 1080p and 60fps. Browne
          summed up the journey as going "from engineer to founder."
        source_ids:
          - yc-t3-chat
          - t3-blog-dream-job
  - heading: The T3 Stack and tools for developers
    paragraphs:
      - text: Browne made the T3 Stack, built around Next.js and TypeScript, with Tailwind CSS, tRPC, and database and
          auth tools such as Prisma, Drizzle, and NextAuth.js. The create-t3-app CLI, built by experienced T3
          Stack developers, scaffolds a modular T3 Stack app guided by principles such as "Typesafety Isn't
          Optional." Browne has praised what that community built.
        source_ids:
          - create-t3-intro
          - create-t3-app-repo
          - t3-blog-2023-tech
      - text: The company also built UploadThing, which its documentation calls the easiest way to add file uploads to
          a full-stack TypeScript application, with support for Next.js, Astro, SolidStart, SvelteKit, and
          Nuxt.
        source_ids:
          - yc-t3-chat
          - uploadthing-docs
          - uploadthing-home
  - heading: T3 Chat, T3 Code, and sharing with developers
    paragraphs:
      - text: Browne founded T3 Chat, an AI chat app that lets people pick the model for each chat, working with
          providers including OpenAI, Anthropic, Google, and OpenRouter. T3 Code, the team's MIT-licensed
          "open-source control plane for coding agents," orchestrates tools such as Claude Code, Codex,
          Cursor, and OpenCode from one surface.
        source_ids:
          - github-t3dotgg
          - yc-t3-chat
          - t3chat-faq
          - t3code-site
          - t3code-repo
      - text: Browne also runs the YouTube channel "Theo - t3.gg"; as Browne's Y Combinator profile puts it,
          developers have probably seen Browne there. Browne has also spoken at GraphQLConf 2023 and Netlify's
          Compose Conference 2024.
        source_ids:
          - t3-home
          - youtube-channel
          - yc-t3-chat
          - graphqlconf-2023-speaker
          - netlify-compose-speaker
highlights:
  - text: Made the T3 Stack, a web development stack focused on simplicity, modularity, and full-stack typesafety,
      which the create-t3-app CLI scaffolds as a modular app.
    source_ids:
      - create-t3-intro
      - create-t3-app-repo
  - text: Founded, with Mark Florkowski, a Y Combinator Winter 2022 company that has built T3 Chat, UploadThing,
      PicThing, and Ping.gg.
    source_ids:
      - yc-t3-chat
  - text: Officially launched Ping 1.0 on June 30, 2022, giving streamers guest video at up to 1080p and 60fps,
      with each guest as an individual source.
    source_ids:
      - t3-blog-dream-job
  - text: Leads UploadThing as CEO, a file-upload service for full-stack TypeScript apps that it describes as "the
      easier (and safer) alternative" to S3.
    source_ids:
      - uploadthing-home
      - uploadthing-docs
  - text: Ships T3 Code, an MIT-licensed, open-source control plane that orchestrates coding agents such as Claude
      Code, Codex, and Cursor from one surface.
    source_ids:
      - t3code-site
      - t3code-repo
  - text: Wrote the code behind Twitch's marathon streams, including Power Rangers, Yu-Gi-Oh!, and the viral Bob
      Ross marathon.
    source_ids:
      - t3-blog-quitting
  - text: Delivered the keynote "The 'Right Size' For GraphQL" at GraphQLConf 2023, the official conference of the
      GraphQL Foundation.
    source_ids:
      - graphqlconf-2023-speaker
      - graphqlconf-2023
