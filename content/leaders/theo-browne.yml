slug: theo-browne
name: Theo Browne
initials: TB
headline: Founder and CEO behind T3 Chat, T3 Code, and UploadThing, and the maker of the typesafe T3 Stack
summary:
  text: Theo Browne, known as Theo of t3.gg, is the founder and CEO of the Y Combinator company behind T3 Chat,
    UploadThing, PicThing, and Ping.gg, and the maker of the T3 Stack, a web development stack focused on
    simplicity, modularity, and full-stack typesafety. After years as an engineer at Twitch, Browne set out to
    build tools for creators and developers, and now also ships T3 Code, an open-source control plane for
    coding agents.
  source_ids:
    - yc-t3-chat
    - github-t3dotgg
    - create-t3-intro
    - t3-blog-quitting
    - t3code-site
