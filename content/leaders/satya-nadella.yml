slug: satya-nadella
name: Satya Nadella
initials: SN
headline: Microsoft's Chairman and CEO, who led its shift to the cloud and brought Copilot and AI to Microsoft
summary:
  text: Satya Nadella joined Microsoft in 1992, led the company's shift to cloud infrastructure and services,
    and became chief executive officer in February 2014 and chairman in June 2021. Under Nadella, Microsoft
    formed a long-term partnership with OpenAI, introduced Microsoft 365 Copilot, and built AI offerings that
    span every layer of the technology stack. In 2026 Nadella received the National Medal of Technology and
    Innovation for transformative leadership of a critical American technology company.
  source_ids:
    - msft-bio
    - msft-10k-2026
    - msft-openai-2019
    - msft-365-copilot-2023
    - whitehouse-medals-2026
