bio_sections:
  - heading: Early life and education
    paragraphs:
      - text: Nadella was born in Hyderabad, India, and earned a bachelor's degree in electrical engineering from
          Mangalore University. Nadella then came to the United States and earned a master's degree in
          computer science from the University of Wisconsin-Milwaukee in 1990.
        source_ids:
          - uchicago-trustee-2018
          - msft-bio
          - uwm-2014
      - text: After graduating from UWM, Nadella joined the Chicago office of Sun Microsystems as a member of the
          technology staff, and later earned an MBA from the University of Chicago Booth School of Business in
          1997.
        source_ids:
          - uwm-2014
          - msft-bio
          - uchicago-trustee-2018
  - heading: Rising through Microsoft
    paragraphs:
      - text: Nadella joined Microsoft in 1992 and held leadership roles across both enterprise and consumer
          businesses, including vice president of the Microsoft Business Division. From 2008 to 2009 Nadella
          served as senior vice president of Search, Portal, and Advertising, and from 2009 to 2011 led
          research and development for the Online Services Division.
        source_ids:
          - msft-bio
          - msft-10k-2026
      - text: Nadella became president of Server and Tools in 2011 and, in July 2013, executive vice president of the
          Cloud and Enterprise group, where Nadella led Microsoft's shift to cloud infrastructure and
          services.
        source_ids:
          - msft-10k-2026
          - msft-bio
  - heading: Leading Microsoft
    paragraphs:
      - text: Nadella became Microsoft's chief executive officer on February 4, 2014, and was appointed chairman of
          the board in June 2021. Microsoft states its mission as "to empower every person and every
          organization on the planet to achieve more."
        source_ids:
          - uwm-2024
          - msft-10k-2026
      - text: With Nadella as CEO, Microsoft completed its acquisition of LinkedIn in December 2016 and of GitHub in
          October 2018, with GitHub continuing to operate independently and to remain an open platform for
          developers.
        source_ids:
          - linkedin-acquisition-2016
          - msft-github-2018
  - heading: Bringing AI to everyone
    paragraphs:
      - text: In July 2019 Microsoft and OpenAI formed a partnership to build new Azure AI supercomputing
          technologies, with OpenAI running its services on Azure and Microsoft becoming its preferred partner
          for commercializing new AI technologies. Nadella said at the time that "AI is one of the most
          transformative technologies of our time" and that "our ambition is to democratize AI."
        source_ids:
          - msft-openai-2019
          - msft-10k-2026
      - text: In March 2023 Microsoft introduced Microsoft 365 Copilot, which Nadella called "the next major step in
          the evolution of how we interact with computing." A year later Nadella created Microsoft AI, a new
          organization focused on Copilot and consumer AI, and brought in DeepMind and Inflection co-founder
          Mustafa Suleyman to lead it. In March 2026 Nadella unified Microsoft's consumer and commercial
          Copilot work under a single Copilot Leadership Team while doubling down on Microsoft's
          superintelligence mission.
        source_ids:
          - msft-365-copilot-2023
          - msft-suleyman-2024
          - msft-copilot-leadership-2026
      - text: Microsoft today describes AI offerings that span every layer of the technology stack, from Azure AI
          Foundry, a unified platform for designing and managing AI applications and agents, to Microsoft
          Copilot. When the White House presented Nadella with the National Medal of Technology and Innovation
          in October 2026, the citation recognized the construction of hyperscale infrastructure for training
          and deploying American superintelligence.
        source_ids:
          - msft-10k-2026
          - whitehouse-medals-2026
  - heading: Service and honors
    paragraphs:
      - text: Nadella serves on the Board of Trustees of the University of Chicago, an alma mater, after first being
          elected in 2018, and received the UWM Chancellor's Innovation Award in 2013. Nadella is also the
          author of the book Hit Refresh.
        source_ids:
          - uchicago-trustee-2018
          - msft-bio
          - uwm-2024
      - text: The Government of India conferred the Padma Bhushan on Nadella in 2022, Georgia Tech awarded Nadella an
          honorary Ph.D. in January 2024 for transformative leadership, and the American Academy of Arts and
          Sciences elected Nadella a member in 2025.
        source_ids:
          - pib-padma-2022
          - gatech-honorary-2024
          - amacad-nadella
highlights:
  - text: Led Microsoft's shift to cloud infrastructure and services as executive vice president of the Cloud and
      Enterprise group.
    source_ids:
      - msft-bio
  - text: Became Microsoft's CEO in February 2014 and its chairman in June 2021.
    source_ids:
      - msft-10k-2026
  - text: Brought LinkedIn (2016) and GitHub (2018) into Microsoft, with GitHub remaining an open platform for
      developers.
    source_ids:
      - linkedin-acquisition-2016
      - msft-github-2018
  - text: Launched a partnership with OpenAI in 2019 to build new Azure AI supercomputing technologies, with an
      ambition to democratize AI.
    source_ids:
      - msft-openai-2019
  - text: Led Microsoft's launch of Microsoft 365 Copilot in 2023, bringing AI into Word, Excel, PowerPoint,
      Outlook, Teams, and more.
    source_ids:
      - msft-365-copilot-2023
  - text: Created Microsoft AI in 2024 to advance Copilot and Microsoft's consumer AI products and research.
    source_ids:
      - msft-suleyman-2024
  - text: Received the National Medal of Technology and Innovation in October 2026.
    source_ids:
      - whitehouse-medals-2026
  - text: Honored with the Padma Bhushan, an honorary Ph.D. from Georgia Tech, and election to the American
      Academy of Arts and Sciences.
    source_ids:
      - pib-padma-2022
      - gatech-honorary-2024
      - amacad-nadella
