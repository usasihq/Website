slug: thibault-sottiaux
name: Thibault Sottiaux
initials: TS
headline: Leads Codex, OpenAI's software engineering agent, after guiding Gemini human data work at Google DeepMind
summary:
  text: Thibault "Tibo" Sottiaux leads Codex, OpenAI's software engineering agent, and is listed by OpenAI as
    its Head of Codex. Before OpenAI, Sottiaux led human data work for Gemini at Google DeepMind and built
    AI/ML workflow infrastructure for DeepMind research, after earlier work as a software engineer at Google.
    Sottiaux is also a hands-on contributor to the open-source Codex project and a co-author of OpenAI
    research on verifying code at scale.
