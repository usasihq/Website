bio_sections:
  - heading: Education and early ventures
    paragraphs:
      - text: Elon Musk holds a B.A. in physics from the University of Pennsylvania and a B.S. in business from the
          Wharton School of the University of Pennsylvania, according to the official biography in Tesla's
          2026 amendment to its annual report.
        source_ids:
          - tesla-10ka-2025
      - text: Musk's entrepreneurial career began with internet companies. Musk co-founded Zip2 Corporation, a
          provider of internet enterprise software and services that Compaq acquired in March 1999, and
          co-founded PayPal, an electronic payment system that eBay acquired in October 2002.
        source_ids:
          - tesla-10ka-2025
          - royal-society-musk
      - text: Musk also took on clean energy early, serving as chairman of the board of SolarCity, a solar
          installation company, from July 2006 until Tesla acquired it in November 2016.
        source_ids:
          - tesla-10ka-2025
  - heading: Building SpaceX
    paragraphs:
      - text: Musk has served as SpaceX's chief executive officer, chief technical officer and chairman since May
          2002. The Royal Society notes that, as lead designer, Musk oversees the development of SpaceX's
          rockets and spacecraft, and that SpaceX's Falcon 1 became the first privately developed liquid-fuel
          rocket to reach orbit, in 2008.
        source_ids:
          - tesla-10ka-2025
          - royal-society-musk
      - text: SpaceX's work soon reached the International Space Station. In May 2012, the SpaceX Dragon commercial
          cargo craft approached the station for grapple and berthing. On May 30, 2020, SpaceX's Crew Dragon
          lifted off on a Falcon 9 rocket carrying NASA astronauts Robert Behnken and Douglas Hurley, which
          NASA described as the first time in history that NASA astronauts launched from American soil in a
          commercially built and operated American crew spacecraft.
        source_ids:
          - nasa-dragon-2012
          - nasa-demo2-2020
      - text: Reusability became a SpaceX signature. Falcon Heavy, which first flew on February 6, 2018, is made of
          three reusable Falcon 9 first-stage boosters, and on that first flight its two side boosters made
          parallel touchdowns at Landing Zones 1 and 2. In April 2021, NASA chose SpaceX to continue
          developing the first commercial human lander to carry astronauts to the lunar surface under the
          Artemis program. Today SpaceX designs, manufactures, and launches reusable rockets and operates a
          worldwide high-speed, low-latency broadband network.
        source_ids:
          - nasa-falcon-heavy-2018
          - nasa-hls-2021
          - spacex-10q-2026
  - heading: Leading Tesla
    paragraphs:
      - text: Tesla was incorporated in 2003, and Musk joined its board in April 2004. Tesla began selling the Tesla
          Roadster in 2008, and its 2010 prospectus described Tesla as the first and, at the time, only
          company to commercially produce a federally compliant, highway-capable electric vehicle. Musk became
          chief executive officer in October 2008 and also holds the title Technoking of Tesla.
        source_ids:
          - tesla-s1-2010
          - tesla-10ka-2025
      - text: Under Musk, Tesla now manufactures five consumer vehicles, the Model 3, Model Y, Model S, Model X and
          Cybertruck, along with the Tesla Semi, a commercial electric vehicle that entered early production
          in 2022. Tesla also builds the Powerwall and Megapack lithium-ion battery energy storage products.
        source_ids:
          - tesla-10k-2025
  - heading: Advancing AI with xAI and Grok
    paragraphs:
      - text: "Musk's involvement in artificial intelligence reaches back years: the record of a November 2016 Senate
          hearing on AI describes the then-nonprofit OpenAI as chaired by Sam Altman and Musk. Musk served as
          chief executive officer and a director of X.AI Corp., an artificial intelligence company, beginning
          in March 2023, and xAI launched in July 2023 with the stated mission to understand the true nature
          of the universe. Musk also became chief technology officer and a board member of X Corp., the social
          media company, in October 2022."
        source_ids:
          - senate-2016-dawn-of-ai
          - tesla-10ka-2025
          - xai-series-b
      - text: xAI introduced Grok in November 2023 as an AI modeled after the Hitchhiker's Guide to the Galaxy, and in
          March 2024 it openly released the weights and architecture of Grok-1, its Mixture-of-Experts
          language model. Following the March 2025 merger of X and xAI, Musk served as president, treasurer
          and chief executive officer of X.AI Holdings Corp., which SpaceX acquired in February 2026. SpaceX
          now spans reusable rockets, Starlink broadband, and a vertically integrated AI platform built around
          the Grok models.
        source_ids:
          - xai-grok
          - xai-grok-os
          - tesla-10ka-2025
          - xai-joins-spacex
          - spacex-10q-2026
  - heading: Vision and recent work
    paragraphs:
      - text: Musk's companies set sweeping goals. Tesla's 2025 annual report states its mission as building a world
          of amazing abundance and describes Full Self-Driving (Supervised), the Robotaxi autonomous
          ride-hailing platform, the purpose-built Cybercab, and Optimus, a general-purpose, autonomous
          humanoid robot in development.
        source_ids:
          - tesla-10k-2025
      - text: Beyond cars and rockets, Musk is a founder of The Boring Company, an infrastructure company whose stated
          mission is to solve traffic, enable rapid point-to-point transportation, and transform cities, and
          which designs and manufactures its own tunnel boring machine, Prufrock. Musk is also a founder of
          Neuralink, a company focused on developing brain-machine interfaces, where Musk serves as chief
          executive officer. In 2018, the Royal Society elected Musk a Fellow.
        source_ids:
          - tesla-10ka-2025
          - boring-company-home
          - royal-society-musk
highlights:
  - text: Has led SpaceX as chief executive officer, chief technical officer and chairman since May 2002.
    source_ids:
      - tesla-10ka-2025
  - text: SpaceX's Falcon 1 became the first privately developed liquid-fuel rocket to reach orbit, in 2008.
    source_ids:
      - royal-society-musk
  - text: SpaceX's Crew Dragon launched NASA astronauts Robert Behnken and Douglas Hurley on May 30, 2020, the
      first time NASA astronauts launched from American soil in a commercially built and operated American
      crew spacecraft.
    source_ids:
      - nasa-demo2-2020
  - text: Falcon Heavy, built from three reusable Falcon 9 boosters, flew for the first time on February 6, 2018,
      with both side boosters touching down side by side.
    source_ids:
      - nasa-falcon-heavy-2018
  - text: NASA selected SpaceX in April 2021 to continue developing the first commercial human lander to carry
      astronauts to the Moon's surface for Artemis.
    source_ids:
      - nasa-hls-2021
  - text: Has led Tesla as chief executive officer since October 2008, growing it from the Roadster to five
      consumer vehicles, the Tesla Semi, and Powerwall and Megapack energy storage.
    source_ids:
      - tesla-10ka-2025
      - tesla-s1-2010
      - tesla-10k-2025
  - text: Led xAI as chief executive officer from March 2023, as the company introduced Grok and openly released
      the Grok-1 model weights.
    source_ids:
      - tesla-10ka-2025
      - xai-grok
      - xai-grok-os
  - text: Is a founder of The Boring Company and of Neuralink, a company developing brain-machine interfaces.
    source_ids:
      - tesla-10ka-2025
  - text: Co-founded Zip2, acquired by Compaq in 1999, and PayPal, acquired by eBay in 2002.
    source_ids:
      - tesla-10ka-2025
