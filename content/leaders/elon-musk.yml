slug: elon-musk
name: Elon Musk
initials: EM
headline: Leader of SpaceX and Tesla, bringing reusable rockets, crewed spacecraft, electric cars, and Grok to
  the world
summary:
  text: Elon Musk has led SpaceX as chief executive officer, chief technical officer and chairman since May
    2002, and has served as Tesla's chief executive officer since October 2008. Under Musk's leadership,
    SpaceX flew the first privately developed liquid-fuel rocket to reach orbit and launched NASA astronauts
    from American soil aboard a commercially built crew spacecraft, while Tesla grew from the Roadster into a
    maker of five consumer electric vehicles, the Tesla Semi, and energy storage products. Musk also led xAI,
    the company behind Grok, which became part of SpaceX in February 2026.
  source_ids:
    - tesla-10ka-2025
    - royal-society-musk
    - nasa-demo2-2020
    - tesla-10k-2025
    - xai-joins-spacex
