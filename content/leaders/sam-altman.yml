slug: sam-altman
name: Sam Altman
initials: SA
headline: Co-founder and CEO of OpenAI, the team behind ChatGPT and GPT-4, and former president of Y Combinator
summary:
  text: Sam Altman co-founded OpenAI in 2015 as a nonprofit research lab with the mission to build
    general-purpose artificial intelligence that benefits all humanity, and leads it as chief executive
    officer. OpenAI has since released the GPT-2 and GPT-3 language models, DALL·E 2, ChatGPT, and GPT-4.
    Earlier, Altman co-founded and led the location-based startup Loopt and served as president of the startup
    accelerator Y Combinator from 2014 to 2019.
  source_ids:
    - senate-2023-altman
    - stanford-gdpi-2018
