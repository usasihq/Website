slug: jensen-huang
name: Jensen Huang
initials: JH
headline: NVIDIA co-founder and CEO who led the company that introduced the GPU and helped spark the modern AI era
summary:
  text: Jensen Huang co-founded NVIDIA in 1993 and has led it as president and chief executive officer ever
    since. Under Huang's leadership, NVIDIA invented the GPU in 1999, opened its parallel processing power to
    science with CUDA in 2006, and grew into a data center scale AI infrastructure company. In 2026 Huang received the IEEE Medal of Honor, for leadership in the development of graphics processing units and their
    application to scientific computing and artificial intelligence, and the National Medal of Science, for advancing
    the GPU into a general-purpose computing architecture.
  source_ids:
    - nvidia-10k-fy2026
    - nvidia-bio
    - ieee-moh-recipient
    - whitehouse-medals-2026
