      - nvidia-corporate-timeline
  - text: Led the company that introduced the GPU in 1999, sparking the growth of PC gaming and changing computer
      graphics.
    source_ids:
      - nvidia-10k-fy2026
      - nvidia-bio
  - text: Opened GPU parallel computing to science and research with the launch of CUDA in 2006.
    source_ids:
      - nvidia-10k-fy2026
      - nvidia-corporate-timeline
  - text: Saw NVIDIA GPUs power AlexNet in 2012, the breakthrough NVIDIA credits with sparking the modern AI era.
    source_ids:
      - nvidia-corporate-timeline
      - nvidia-10k-fy2026
  - text: Introduced RTX in 2018, which NVIDIA describes as the first GPU capable of real-time ray tracing.
    source_ids:
      - nvidia-corporate-timeline
  - text: Built NVIDIA into a data center scale AI infrastructure company serving data center, gaming,
      professional visualization, and automotive markets.
    source_ids:
      - nvidia-10k-fy2026
  - text: Received the 2026 IEEE Medal of Honor, which IEEE calls the pinnacle of career achievement, for leadership in GPU development and its
      application to scientific computing and AI.
    source_ids:
      - ieee-moh-recipient
      - ieee-moh-announcement
  - text: Awarded the National Medal of Science in October 2026 for advancing the GPU into a general-purpose
      computing architecture.
    source_ids:
      - whitehouse-medals-2026
  - text: Elected to the National Academy of Engineering in 2024 and appointed to the President's Council of
      Advisors on Science and Technology in 2026.
