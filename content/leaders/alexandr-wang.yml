slug: alexandr-wang
name: Alexandr Wang
initials: AW
headline: Scale AI founder and Meta's first Chief AI Officer, leading Meta Superintelligence Labs and its Muse models
summary:
  text: Alexandr Wang founded Scale AI in 2016 at age 19 while a student at MIT, and led it as chief executive
    officer until June 2025, building a company whose work contributed to the development of most every
    leading model across the industry. Wang then joined Meta as its first-ever Chief AI Officer to lead Meta
    Superintelligence Labs, which introduced its first Muse model, Muse Spark, in April 2026.
  source_ids:
    - meta-leadership-wang
    - expedia-proxy-2026
    - meta-muse-spark-2026
