bio_sections:
  - heading: Early life and education
    paragraphs:
      - text: Wang grew up, in Wang's own words to Congress, "in the shadow of the Los Alamos National Lab," and has
          described the national security mission as a personal one.
        source_ids:
          - house-hearing-2023
      - text: As a student, Wang won medals in national math, computing, and physics competitions, including the USA
          Math Olympiad, USA Physics Olympiad, and USA Computing Olympiad. Wang went on to study machine
          learning at the Massachusetts Institute of Technology, then left to found Scale AI.
        source_ids:
          - expedia-proxy-2026
          - expedia-proxy-2024
  - heading: Founding Scale AI
    paragraphs:
      - text: Wang founded Scale AI in 2016, at age 19, while a student at MIT. As Wang later told Congress, Scale was
          founded "with a mission to accelerate the development of AI."
        source_ids:
          - meta-leadership-wang
          - house-hearing-2023
      - text: As chief executive officer from 2016 through June 2025, Wang built Scale into what Expedia Group's proxy
          statement describes as a leading test and evaluation partner for artificial intelligence companies.
          Meta credits Scale's work with contributing to the development of most every leading model across
          the industry.
        source_ids:
          - expedia-proxy-2026
          - meta-leadership-wang
  - heading: Advising on AI and national security
    paragraphs:
      - text: "On July 18, 2023, Wang testified as Scale's chief executive officer before a subcommittee of the House
          Armed Services Committee, at a hearing titled \"Man and Machine: Artificial Intelligence on the
          Battlefield.\" Wang urged the United States to adopt and integrate new AI technology rapidly and
          effectively to support national security."
        source_ids:
          - house-hearing-2023
          - hasc-hearing-page
      - text: That same summer Wang joined the board of Expedia Group as an independent director, elected effective
          June 1, 2023. Expedia's board cites Wang's extensive technology experience and expertise, including
          in artificial intelligence and machine learning.
        source_ids:
          - expedia-proxy-2024
          - expedia-proxy-2026
  - heading: Leading Meta Superintelligence Labs
    paragraphs:
      - text: In June 2025 Wang joined Meta as the company's first-ever Chief AI Officer, leading Meta
          Superintelligence Labs (MSL). Announcing the move, Scale said Wang would remain a director on its
          board and continue to support the company, and interim CEO Jason Droege spoke of realizing Wang's
          vision of bringing the benefits of AI to everyone.
        source_ids:
          - meta-leadership-wang
          - scale-next-phase-2025
  - heading: Vision and recent work
    paragraphs:
      - text: In April 2026 MSL introduced Muse Spark, the first in the Muse family of models and the first product of
          what Meta calls a ground-up overhaul of its AI efforts. Meta describes Muse Spark as a natively
          multimodal reasoning model that supports tool use, visual chain of thought, and multi-agent
          orchestration, and it powers the Meta AI app and meta.ai. Meta framed the launch as scaling towards
          personal superintelligence.
        source_ids:
          - meta-muse-spark-2026
          - meta-ai-muse-spark-blog
      - text: In August 2026 MSL released Muse Glimmer, an open-weight model built for agents that run locally on a
          Mac or a single consumer GPU, under the Apache 2.0 license, which Meta calls the most permissive
          license it has used for an open model. In September 2026 Meta introduced Muse, a personal AI agent
          powered by Muse Spark that completes tasks on a dedicated, secure cloud computer.
        source_ids:
          - meta-muse-glimmer-2026
          - meta-muse-agent-2026
