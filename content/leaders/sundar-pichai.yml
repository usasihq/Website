slug: sundar-pichai
name: Sundar Pichai
initials: SP
headline: CEO of Google and Alphabet who helped build Chrome and is leading Google into the Gemini era of AI
summary:
  text: Sundar Pichai joined Google in 2004, helped lead the development of Google Toolbar and Google Chrome,
    and went on to lead product and engineering for all of Google's products. Pichai became CEO of Google in
    2015 and CEO of its parent company, Alphabet, in December 2019. As CEO, Pichai has guided Google's journey
    as an AI-first company, from bringing together Google DeepMind in 2023 to launching the Gemini family of
    models.
  source_ids:
    - congress-bio-pichai
    - alphabet-proxy-2026
    - google-gemini-2023
    - google-deepmind-formation-2023
