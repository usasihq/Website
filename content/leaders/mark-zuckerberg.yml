slug: mark-zuckerberg
name: Mark Zuckerberg
initials: MZ
headline: Founder, Chairman and CEO of Meta, builder of Facebook and open Llama models, and champion of personal superintelligence
summary:
  text: Mark Zuckerberg founded Facebook in 2004 and leads the company, now Meta, as founder, chairman and chief
    executive officer, setting its overall direction and product strategy. Meta's family of apps includes
    Facebook, Instagram, Messenger, Meta AI, Threads, and WhatsApp, and under Zuckerberg the company has
    shared landmark AI tools openly, from the PyTorch framework to the Llama models. Zuckerberg also
    co-founded the Chan Zuckerberg Initiative in 2015 and serves as its co-CEO.
  source_ids:
    - meta-exec-bio
    - meta-10k-2025
    - lf-pytorch-2022
    - meta-open-source-ai-2024
