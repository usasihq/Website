slug: dario-amodei
name: Dario Amodei
initials: DA
headline: Co-founder and CEO of Anthropic, a physicist turned AI leader behind Claude and safety research
summary:
  text: Dario Amodei co-founded Anthropic and leads it as chief executive officer, setting the company's
    research direction and strategic vision for AI systems that are reliable, interpretable, and steerable.
    Trained as a physicist with a PhD from Princeton University, Amodei earlier served as vice president of
    research at OpenAI, where Amodei led the efforts to build GPT-2 and GPT-3. At Anthropic, Amodei has
    championed research such as constitutional AI and interpretability alongside the Claude family of AI
    models.
  source_ids:
    - anthropic-leadership
    - hertz-profile
    - senate-2023-amodei
