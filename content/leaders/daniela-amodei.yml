slug: daniela-amodei
name: Daniela Amodei
initials: DA
headline: Co-founder and President of Anthropic, building the people, culture, and governance behind Claude
summary:
  text: Daniela Amodei co-founded Anthropic and serves as its President and as chair of its Board of Directors,
    leading the organization's work across research, engineering, product, governance, and commercial
    execution. A literature graduate of UC Santa Cruz, Amodei built a career spanning global health, Capitol
    Hill, Stripe, and OpenAI, where Amodei was vice president of safety and policy, before co-founding
    Anthropic in 2021.
  source_ids:
