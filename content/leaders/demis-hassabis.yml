slug: demis-hassabis
name: Demis Hassabis
initials: DH
headline: DeepMind co-founder and Nobel laureate whose teams built AlphaGo and AlphaFold
summary:
  text: Sir Demis Hassabis co-founded DeepMind in 2010, led the teams behind AlphaGo and AlphaFold, and shared
    the 2024 Nobel Prize in Chemistry with John Jumper for protein structure prediction. After leading Google
    DeepMind as its CEO, Hassabis now serves as Chair of Google DeepMind and Chief Scientist of Alphabet,
    while continuing to lead Isomorphic Labs, the AI drug discovery company Hassabis founded in 2021.
