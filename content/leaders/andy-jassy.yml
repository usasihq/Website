slug: andy-jassy
name: Andy Jassy
initials: AJ
headline: Founder of Amazon Web Services and Amazon's President and CEO, building the cloud and AI that power invention
summary:
  text: Andy Jassy joined Amazon in 1997, founded Amazon Web Services and led it from its inception in 2006, and
    became Amazon's President and Chief Executive Officer in July 2021. As CEO, Jassy has made AI central to
    Amazon's strategy, describing it as a multiplier that will reshape every customer experience, from AWS
    infrastructure and custom chips to the new Alexa+.
  source_ids:
    - amzn-ir-bio
    - amzn-proxy-2026
    - amzn-10k-2025
    - amzn-letter-2025
