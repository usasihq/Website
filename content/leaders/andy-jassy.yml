bio_sections:
  - heading: Education and early years at Amazon
    paragraphs:
      - text: Jassy holds an AB from Harvard University and an MBA from Harvard Business School. Jassy joined Amazon
          in 1997 and held a range of business-to-business and business-to-consumer leadership roles, leading
          both businesses and functional areas across the company.
        source_ids:
          - amzn-ir-bio
          - amzn-proxy-2026
  - heading: Founding Amazon Web Services
    paragraphs:
      - text: Jassy founded Amazon Web Services and led it from its inception in 2006, serving as senior vice
          president of AWS from April 2006. That March, AWS announced Amazon S3, a simple storage service it
          called "storage for the Internet," giving developers access to the same scalable, reliable, and
          inexpensive infrastructure Amazon used for its own websites.
        source_ids:
          - amzn-proxy-2026
          - amzn-10k-2025
          - aws-s3-2006
      - text: In August 2006 AWS followed with the beta of Amazon EC2, a web service offering adjustable computing
          capacity that reduced the time required to obtain and boot new server instances to minutes. Jassy
          later recalled how EC2 launched with limited features and improved rapidly through customer
          feedback, illustrating the long, iterative work behind invention.
        source_ids:
          - aws-ec2-2006
          - amzn-letter-2021
  - heading: Leading AWS
    paragraphs:
      - text: Jassy served as CEO of AWS from April 2016 until July 2021. Today AWS serves developers and enterprises
          of all sizes with a broad set of on-demand technology services, including compute, storage,
          database, analytics, and artificial intelligence and machine learning, offering cloud and AI
          capabilities that let customers build nearly anything they can imagine.
        source_ids:
          - amzn-10k-2025
          - aws-about
  - heading: Becoming Amazon's CEO
    paragraphs:
      - text: In 2021 founder Jeff Bezos announced that Jassy would become Amazon's CEO, calling Jassy "an outstanding
          leader" who "has my full confidence" and noting that Jassy had been at Amazon almost as long as
          Bezos. Jassy became President and CEO, and joined the board of directors, in July 2021.
        source_ids:
          - bezos-email-2021
          - amzn-proxy-2026
          - amzn-10k-2025
      - text: In a first shareholder letter as CEO, Jassy argued that major innovations come from long, iterative work
          rather than single moments of insight, described the development of AWS's Graviton chips, and closed
          with the Amazon refrain, "It remains Day 1." Amazon's board cites Jassy's customer-focused and
          long-term-oriented approach.
        source_ids:
          - amzn-letter-2021
          - amzn-proxy-2026
  - heading: Vision and recent work
    paragraphs:
      - text: In the 2025 letter to shareholders, Jassy wrote that "AI is not a standalone initiative" but a
          multiplier that will reshape every customer experience. Jassy highlighted Amazon's custom silicon,
          noting that "Demand for Trainium is booming," a new inference engine for Amazon Bedrock built by a
          small, separate team, and the rebuilding of Alexa around generative AI as Alexa+, which Amazon
          introduced in February 2025.
        source_ids:
          - amzn-letter-2025
          - alexa-plus-2025
      - text: Jassy also pointed to the next inflections Amazon aims to invent, including Amazon Leo, a low Earth
          orbit satellite network designed to help close the rural digital divide, and Prime Air drone
          delivery, and encouraged Amazon to keep running like a startup that stays comfortable with
          experiments.
        source_ids:
          - amzn-letter-2025
      - text: Beyond Amazon, Jassy is a member of the National Academy of Engineering, serves on the Trust of the
          American Academy of Arts and Sciences and the Board of Trustees of Rainier Scholars, and chairs the
          board of Rainier Prep, a college-preparatory charter middle school for which Jassy was a founding
          board member.
        source_ids:
          - amzn-ir-bio
          - amzn-proxy-2026
