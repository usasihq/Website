slug: greg-brockman
name: Greg Brockman
initials: GB
headline: Co-founder and President of OpenAI, and Stripe's founding engineer and CTO
summary:
  text: Greg Brockman is co-founder and president of OpenAI, and the University of North Dakota has celebrated
    Brockman as a co-creator of ChatGPT. Before OpenAI, Brockman was the founding engineer and chief
    technology officer of Stripe. As OpenAI's co-founder and chief technology officer in its early years,
    Brockman helped build OpenAI Gym, worked on Universe, turned the game Dota into a learning environment for
    what became OpenAI Five, and later retrained as a hands-on machine learning practitioner.
  source_ids:
    - und-today-2023
    - house-bio-2018
    - senate-2016-dawn-of-ai
    - brockman-ml-practitioner
