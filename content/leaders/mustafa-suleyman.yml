slug: mustafa-suleyman
name: Mustafa Suleyman
initials: MS
headline: Co-founder of DeepMind and Inflection AI, now CEO of Microsoft AI pursuing humanist superintelligence
summary:
  text: Mustafa Suleyman is a founder of both DeepMind and Inflection AI and serves as Executive Vice President
    and CEO of Microsoft AI. Since joining Microsoft in 2024, Suleyman has reimagined Copilot as an AI
    companion, launched Microsoft's first in-house MAI models, and formed the MAI Superintelligence Team to
    build AI that stays controllable, aligned, and firmly in service of humanity.
