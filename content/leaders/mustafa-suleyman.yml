bio_sections:
  - heading: London roots and early work
    paragraphs:
      - text: Suleyman was born and raised in London, and is proud to have co-founded an AI business there. Suleyman
          studied at Oxford University as an undergraduate, then left the degree to help start a non-profit
          telephone counseling service.
        source_ids:
          - msft-london-hub-2024
          - greylock-suleyman
      - text: Before DeepMind, Suleyman co-founded Reos Partners, a global conflict resolution firm, working as a
          negotiator and facilitator for clients including the United Nations, the Dutch Government, and WWF.
        source_ids:
          - greylock-suleyman
  - heading: Co-founding DeepMind
    paragraphs:
      - text: Suleyman is one of the founders of DeepMind, which started in 2010 with an interdisciplinary approach to
          building general AI systems and was acquired by Google in January 2014. Over more than a decade at
          DeepMind and Google, Suleyman led teams building AI systems, and most recently served at Google as
          Vice President of AI Product Management and AI Policy.
        source_ids:
          - msft-suleyman-2024
          - deepmind-about
          - govuk-hassabis
          - greylock-suleyman
  - heading: Building Inflection and Pi
    paragraphs:
      - text: In early 2022 Suleyman co-founded Inflection AI with Karén Simonyan and Reid Hoffman, serving as its
          CEO. Inflection was established as a public benefit corporation with a purpose to develop products
          and technologies that harness the power of AI to improve human well-being and productivity.
        source_ids:
          - inflection-pi-2023
          - inflection-point-2023
      - text: In May 2023 Inflection introduced Pi, short for personal intelligence, designed as a kind and supportive
          companion for conversation, friendly advice, and concise information. "Pi is a new kind of AI, one
          that isn't just smart but also has good EQ," Suleyman said at the launch.
        source_ids:
          - inflection-pi-2023
  - heading: Leading Microsoft AI
    paragraphs:
      - text: In March 2024 Satya Nadella announced that Suleyman would join Microsoft as Executive Vice President and
          CEO of Microsoft AI, a new organization focused on advancing Copilot and Microsoft's other consumer
          AI products and research. Nadella described Suleyman as a visionary, a product maker, and a builder
          of pioneering teams, and Inflection co-founder Karén Simonyan joined as chief scientist.
        source_ids:
          - msft-suleyman-2024
      - text: Weeks later Suleyman announced Microsoft AI London, a new hub to drive pioneering work to advance
          state-of-the-art language models. In October 2024 Suleyman introduced "an AI companion for
          everyone," bringing new Copilot experiences such as Copilot Voice and Copilot Daily, along with
          experimental previews of Copilot Vision and Think Deeper in Copilot Labs.
        source_ids:
          - msft-london-hub-2024
          - msft-ai-companion-2024
      - text: "In August 2025 Microsoft AI introduced its first in-house models: MAI-Voice-1, a lightning-fast speech
          generation model, and MAI-1-preview, an in-house mixture-of-experts model. The MAI family has since
          grown to include models for reasoning, image generation, voice, transcription, and coding."
        source_ids:
          - mai-two-models-2025
          - microsoft-ai-home
  - heading: Vision and recent work
    paragraphs:
      - text: "In November 2025 Suleyman announced the MAI Superintelligence Team and set out a vision of humanist
          superintelligence: advanced AI that is problem-oriented, controllable, and \"always on humanity's
          side.\" Suleyman pointed to medical diagnosis and clean energy as early areas where such systems
          could help, citing Microsoft AI's MAI-DxO diagnostic orchestrator."
        source_ids:
          - mai-humanist-si-2025
      - text: In March 2026, as Microsoft unified its Copilot work, Suleyman turned to focus fully on Microsoft's
          superintelligence efforts and frontier models, with Nadella writing that "Mustafa is uniquely
          qualified to drive this forward." Suleyman is also the author of The Coming Wave, which discusses
          the containment and alignment of AI.
        source_ids:
          - msft-copilot-leadership-2026
          - msft-double-agents-2025
