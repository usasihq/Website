slug: lauren-tan
name: Lauren Tan
initials: LT
headline: React Compiler core team engineer who helped bring automatic memoization to React, now at xAI and Cursor
summary:
  text: Lauren Tan helps build and maintain React Compiler, the build-time tool that automatically memoizes
    React components and hooks, and co-authored the October 2025 post announcing its first stable release.
    Tan's GitHub profile lists Tan as a software engineer at xAI's GitHub organization, and React's team page
    lists Tan as an engineer at Cursor, which became part of SpaceX and SpaceXSI on August 14, 2026. Earlier,
    Tan was a software engineer at Facebook and an engineering manager at Netflix, and has spoken at
    conferences on TypeScript, React, GraphQL, Elixir, and engineering leadership.
