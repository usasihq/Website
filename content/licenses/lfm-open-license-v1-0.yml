slug: lfm-open-license-v1-0
name: LFM Open License v1.0
spdx: null
category: model-license
official_url: https://huggingface.co/LiquidAI/LFM2.5-2.6B/blob/main/LICENSE
summary:
  text: >-
    The LFM Open License v1.0 names Liquid AI, Inc. as the Licensor and is published in Liquid
    AI's LFM2.5 model repositories on Hugging Face. Its definitions, copyright and patent
    grants, and redistribution conditions closely follow the wording of the Apache License 2.0.
    It adds a Commercial Use Limitation in Section 5 tied to an annual-revenue Threshold that
    the license defines, and a termination clause in Section 11.
  reviewed_at: 2026-10-08
  source_ids: [lfm-open-license-text, lfm-open-license-text-8b, lfm-apache-2-0-text]
key_terms:
  - label: Copyright and patent grants
    text: >-
      Each Contributor grants copyright and patent licenses "including the Commercial Use
      limitation set forth in Section 5." Patent licenses end if you bring patent litigation
      alleging that the Work infringes (Sections 2 and 3).
    source_ids: [lfm-open-license-text, lfm-open-license-text-8b]
  - label: Commercial use limitation
    text: >-
      Rights for Commercial Use are "conditioned upon You or Your Legal Entity not exceeding the
      Threshold," an annual-revenue amount defined in Section 1. Commercial Use by a Legal Entity
      above it "is not licensed under this Agreement" (Section 5).
    source_ids: [lfm-open-license-text, lfm-open-license-text-8b]
  - label: Non-profit research use
    text: >-
      The Threshold does not apply to a Qualified Non-Profit Organization's use of the Work or a
      Derivative Work for Non-Commercial or Research Purposes (Section 5(c)).
    source_ids: [lfm-open-license-text, lfm-open-license-text-8b]
  - label: Redistribution conditions
    text: >-
      Redistributors must give recipients a copy of the license, mark modified files with
      prominent notices, keep copyright, patent, trademark, and attribution notices, and carry
      forward any NOTICE file's attribution notices (Section 4).
    source_ids: [lfm-open-license-text, lfm-open-license-text-8b]
  - label: Termination
    text: >-
      "This License will terminate automatically and immediately if You fail to comply with any
      of its terms and conditions." On termination you must stop all use of the Work and any
      Derivative Works and delete all copies (Section 11).
    source_ids: [lfm-open-license-text, lfm-open-license-text-8b]
