name: BigCode OpenRAIL-M v1 License Agreement
spdx: null
category: model-license
official_url: https://huggingface.co/spaces/bigcode/bigcode-model-license-agreement
summary:
  text: >-
    The BigCode OpenRAIL-M v1 License Agreement was "created under BigCode, an open and
    collaborative research project" on large language models for code, and its preamble says it
    "is generally applicable to any machine-learning Model." It grants a royalty-free copyright
    license for the Model and Modifications of the Model and a royalty-free patent license for
    the Model, conditioned on use restrictions listed in Attachment A. Source code, training data, and explanatory
    documentation are not licensed under it.
  reviewed_at: 2026-10-08
  source_ids: [bigcode-license-page, bigcode-license-app]
key_terms:
  - label: Copyright and patent grants
    text: >-
      Each Contributor grants a perpetual, worldwide, non-exclusive, no-charge, royalty-free
      copyright license and a patent license. If you bring patent litigation alleging that the
      Model or a Contribution infringes, "any rights granted to You under this License Agreement
      for the Model shall terminate" (Sections 2 and 3).
    source_ids: [bigcode-license-page, bigcode-license-app]
  - label: Use restrictions
    text: >-
      Compliance with Attachment A "is a condition to the grants." It lists restricted uses,
      including breaking the law, harming minors, generating malware, defamation, impersonating
      humans to deceive, and fully automated decisions in justice, law enforcement, immigration,
      or asylum processes (Section 4).
    source_ids: [bigcode-license-page, bigcode-license-app]
  - label: Restrictions carry forward
    text: >-
      You may Share the Model or Modifications under any license that includes Paragraph 4 and
      the Attachment A restrictions, or use conditions and restrictions that "accomplish the
      same purpose" (Section 5.1).
    source_ids: [bigcode-license-page, bigcode-license-app]
  - label: Sharing conditions
    text: >-
      When sharing, give recipients a copy of the agreement, retain all Explanatory
      Documentation (adding documentation of your changes for Modifications), and retain all
      copyright, patent, trademark, and attribution notices (Section 5.2).
    source_ids: [bigcode-license-page, bigcode-license-app]
  - label: Machine-generated content
    text: >-
      Attachment A restricts placing generated information in any public context "without
      expressly and intelligibly disclaiming that the information and/or content is machine
      generated."
    source_ids: [bigcode-license-page, bigcode-license-app]
  - label: Output
    text: >-
      "Licensor claims no rights in the Output," though use of the Output may not contravene the
      agreement. The licensor reserves the right to restrict usage of the Model that violates
      the agreement, remotely or otherwise (Sections 6 and 7).
    source_ids: [bigcode-license-page, bigcode-license-app]
