slug: cdla-permissive-2-0
name: Community Data License Agreement – Permissive, Version 2.0
spdx: CDLA-Permissive-2.0
category: data-license
official_url: https://cdla.dev/permissive-2-0/
summary:
  text: >-
    The Community Data License Agreement – Permissive, Version 2.0 (CDLA-Permissive-2.0) is a
    short agreement for sharing data, published on cdla.dev, a site of The Linux Foundation.
    Data Providers and Data Recipients agree that recipients may use, modify, and share the
    data, with one condition on sharing. It treats "Results," which it defines to include
    machine learning models, separately from the data itself.
  reviewed_at: 2026-10-08
  source_ids: [cdla-permissive-2-0-text]
key_terms:
  - label: Use, modify, and share
    text: >-
      A Data Recipient "may use, modify, and share the Data" made available under the agreement
      if it follows the agreement's terms. The agreement places no restriction on parts of the
      data that are in the public domain or usable under another legal exception (Section 1).
    source_ids: [cdla-permissive-2-0-text]
  - label: Condition for sharing
    text: >-
      A recipient may share the data, with or without modifications, "so long as the Data
      Recipient makes available the text of this agreement with the shared Data" (Section 2.1).
    source_ids: [cdla-permissive-2-0-text]
  - label: Results
    text: >-
      The agreement "does not impose any restriction or obligations" on using, modifying, or
      sharing Results, defined as "any outcome obtained by computational analysis of Data,
      including for example machine learning models and models’ insights" (Sections 3.1 and
      5.4).
    source_ids: [cdla-permissive-2-0-text]
  - label: No warranty
    text: >-
      The data is provided "AS IS," without warranties of title, non-infringement,
      merchantability, or fitness for a particular purpose, and no Data Provider is liable for
      damages arising from the data or results (Section 4).
    source_ids: [cdla-permissive-2-0-text]
