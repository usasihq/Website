summary:
  text: >-
    Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0) is
    a public license published by Creative Commons. It permits sharing and adapting the
    licensed material for NonCommercial purposes only, with attribution, and requires anyone
    who shares an adaptation to license it under the same or a compatible license.
  reviewed_at: 2026-10-08
  source_ids: [cc-by-nc-sa-4-0-legalcode]
key_terms:
  - label: NonCommercial only
    text: >-
      The grant covers reproducing and Sharing the licensed material, and producing and Sharing
      Adapted Material, "for NonCommercial purposes only" (Section 2).
    source_ids: [cc-by-nc-sa-4-0-legalcode]
  - label: Meaning of NonCommercial
    text: >-
      NonCommercial means "not primarily intended for or directed towards commercial advantage
      or monetary compensation." Exchanging the material through file-sharing counts as
      NonCommercial if no money is paid in connection with the exchange (Section 1).
    source_ids: [cc-by-nc-sa-4-0-legalcode]
  - label: Attribution
    text: >-
      When sharing, you must keep any creator identification, copyright notice, license and
      disclaimer notices, and a link to the material that the licensor supplies; indicate
      whether you modified it; and indicate that it is under this license (Section 3).
    source_ids: [cc-by-nc-sa-4-0-legalcode]
  - label: Share-alike
    text: >-
      If you share Adapted Material you produce, your license for it must be "a Creative Commons
      license with the same License Elements, this version or later, or a BY-NC-SA Compatible
      License," and you may not add terms that restrict the rights it grants (Section 3).
    source_ids: [cc-by-nc-sa-4-0-legalcode]
  - label: Patents, trademarks, royalties
    text: >-
      Patent and trademark rights are not licensed. The licensor waives royalties where
      possible but reserves any right to collect them, "including when the Licensed Material is
      used other than for NonCommercial purposes" (Section 2).
    source_ids: [cc-by-nc-sa-4-0-legalcode]
  - label: Termination
    text: >-
      If you fail to comply, your rights terminate automatically. They are reinstated
      automatically if the violation is cured within 30 days of your discovering it, or if the
      licensor expressly reinstates them (Section 6).
    source_ids: [cc-by-nc-sa-4-0-legalcode]
