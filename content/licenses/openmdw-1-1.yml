    text: >-
      If you file, maintain, or voluntarily take part in a lawsuit asserting that the Model
      Materials infringe any patent or copyright, all rights granted to you terminate, unless
      the lawsuit responds to one first brought against you.
    source_ids: [openmdw-1-1-text]
  - label: Outputs
    text: >-
      The agreement "does not impose any restrictions or obligations with respect to any use,
      modification, or sharing of any outputs generated by using the Model Materials."
    source_ids: [openmdw-1-1-text]
