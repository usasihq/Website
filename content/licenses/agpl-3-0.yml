summary:
  text: >-
    The GNU Affero General Public License, version 3, dated 19 November 2007, is a copyleft
    license published by the Free Software Foundation. Its preamble says it is "specifically
    designed to ensure cooperation with the community in the case of network server software."
    The SPDX identifier AGPL-3.0-only refers to code offered under version 3 only, as
    distinguished from "AGPL-3.0-or-later."
  reviewed_at: 2026-10-08
  source_ids: [gnu-agpl-3-0, spdx-agpl-3-0-only, osi-agpl-3-0]
key_terms:
  - label: Basic permissions
    text: >-
      Rights are granted for the term of copyright and are "irrevocable provided the stated
      conditions are met." The license "explicitly affirms your unlimited permission to run the
      unmodified Program," and you may make and run copies you do not convey without conditions
      while the license remains in force (Section 2).
    source_ids: [gnu-agpl-3-0, spdx-agpl-3-0-only, osi-agpl-3-0]
  - label: Share-alike
    text: >-
      A modified version you convey must carry prominent notices that you modified it, with a
      relevant date, and you must license "the entire work, as a whole, under this License" to
      anyone who comes into possession of a copy (Section 5).
    source_ids: [gnu-agpl-3-0, spdx-agpl-3-0-only, osi-agpl-3-0]
  - label: Source code with object code
    text: >-
      Conveying object code requires also conveying the machine-readable Corresponding Source in
      one of the ways Section 6 lists, such as with a physical product, through a written offer,
      or from the same place the object code is offered at no further charge.
    source_ids: [gnu-agpl-3-0, spdx-agpl-3-0-only, osi-agpl-3-0]
  - label: Network interaction
    text: >-
      If you modify the program, your modified version must prominently offer everyone
      interacting with it remotely through a computer network, if it supports such interaction,
      an opportunity to receive its Corresponding Source from a network server at no charge
      (Section 13).
    source_ids: [gnu-agpl-3-0, spdx-agpl-3-0-only, osi-agpl-3-0]
  - label: Patents
    text: >-
      Each contributor grants "a non-exclusive, worldwide, royalty-free patent license" under
      its essential patent claims to make, use, sell, and otherwise run, modify, and propagate
      its contributor version (Section 11).
    source_ids: [gnu-agpl-3-0, spdx-agpl-3-0-only, osi-agpl-3-0]
  - label: Termination
    text: >-
      Propagating or modifying the work outside the license automatically terminates your
      rights. Once you stop, rights return provisionally, and permanently if the copyright holder
      does not notify you within 60 days, or if it is that holder's first notice and you cure
      the violation within 30 days of receiving it (Section 8).
    source_ids: [gnu-agpl-3-0, spdx-agpl-3-0-only, osi-agpl-3-0]
