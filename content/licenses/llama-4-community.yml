summary:
  text: >-
    The Llama 4 Community License Agreement is Meta's license for the Llama 4 models, code,
    weights, and documentation, which it calls the "Llama Materials." Its version effective
    date is April 5, 2025. It grants a limited, royalty-free license with conditions on notices,
    naming, acceptable use, and licensees above a size threshold.
  reviewed_at: 2026-10-08
  source_ids: [llama-4-license-text]
key_terms:
  - label: License grant
    text: >-
      Meta grants "a non-exclusive, worldwide, non-transferable and royalty-free limited license"
      to use, reproduce, distribute, copy, create derivative works of, and make modifications to
      the Llama Materials (Section 1.a).
    source_ids: [llama-4-license-text]
  - label: Attribution and naming
    text: >-
      Distributors must include a copy of the agreement, "prominently display “Built with
      Llama”" on a related website, interface, or documentation, and keep a set attribution
      notice in a Notice file. A distributed AI model built or improved with the materials or
      their outputs must have "Llama" at the beginning of its name (Section 1.b).
    source_ids: [llama-4-license-text]
  - label: Acceptable use
    text: >-
      Use must comply with applicable laws, including trade compliance laws, and with the
      Acceptable Use Policy for the Llama Materials published at llama.com/llama4/use-policy,
      which is incorporated by reference (Section 1.b.iv).
    source_ids: [llama-4-license-text]
  - label: Additional commercial terms
    text: >-
      If, on the version release date, the products or services of the licensee or its
      affiliates exceeded a size threshold set out in Section 2 for the preceding calendar
      month, the licensee "must request a license from Meta," which Meta may grant "in its sole
      discretion" (Section 2).
    source_ids: [llama-4-license-text]
  - label: Termination and litigation
    text: >-
      Meta may terminate the agreement if you breach it, and you must then delete and stop using
      the materials. Licenses also end if you bring litigation alleging that the materials or
      their outputs infringe intellectual property or other rights owned or licensable by you
      (Sections 5.c and 6).
    source_ids: [llama-4-license-text]
  - label: Governing law
    text: >-
      The agreement is governed by California law, and California courts have exclusive
      jurisdiction over disputes arising from it (Section 7).
    source_ids: [llama-4-license-text]
