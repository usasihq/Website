  - label: Attribution
    text: >-
      When sharing, you must keep any creator identification, copyright notice, license and
      disclaimer notices, and a link to the material that the licensor supplies; indicate
      whether you modified it; and indicate that it is under this license, with the license text
      or a link to it (Section 3).
