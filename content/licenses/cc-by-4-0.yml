      "Patent and trademark rights are not licensed under this Public License." Moral rights and
      publicity, privacy, and similar personality rights are also not licensed (Section 2).
    source_ids: [cc-by-4-0-legalcode]
  - label: Termination
    text: >-
      If you fail to comply, your rights terminate automatically. They are reinstated
      automatically if the violation is cured within 30 days of your discovering it, or if the
      licensor expressly reinstates them (Section 6).
