slug: nvidia-open-model-license
name: NVIDIA Open Model License Agreement
spdx: null
category: model-license
official_url: https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-open-model-license/
summary:
  text: >-
    The NVIDIA Open Model License Agreement is NVIDIA Corporation's license for models it
    releases under it; the version on NVIDIA's agreements page was last modified on October 24,
    2025. Its opening states that models under it "are commercially usable," that licensees are
    free to create and distribute Derivative Models, and that NVIDIA does not claim ownership of
    outputs. These statements are subject to the agreement's conditions.
  reviewed_at: 2026-10-08
  source_ids: [nvidia-open-model-license-text]
key_terms:
  - label: License grant
    text: >-
      NVIDIA grants a "perpetual, worldwide, non-exclusive, no-charge, royalty-free, revocable"
      license to publicly perform, publicly display, reproduce, use, create derivative works of,
      make, have made, sell, offer for sale, distribute, and import the Model.
    source_ids: [nvidia-open-model-license-text]
  - label: Termination conditions
    text: >-
      Licenses end if you bring copyright or patent litigation alleging the Model or a Derivative
      Model infringes. Rights end automatically if you bypass, disable, reduce the efficacy of,
      or circumvent a "Guardrail" in the Model, such as a technical limitation or safety
      guardrail, without a substantially similar Guardrail appropriate for your use case.
    source_ids: [nvidia-open-model-license-text]
  - label: Attribution and notices
    text: >-
      Distributors must give recipients a copy of the agreement and a Notice file stating
      "Licensed by NVIDIA Corporation under the NVIDIA Open Model License." Distributing a
      Cosmos model, or a product or model that contains, uses, or was built with one or its
      outputs, also requires "Built on NVIDIA Cosmos" on a related website or documentation.
    source_ids: [nvidia-open-model-license-text]
  - label: AI ethics terms
    text: >-
      Use of the Models must be consistent with NVIDIA's Trustworthy AI terms, published at
      nvidia.com/en-us/agreements/trustworthy-ai/terms/.
    source_ids: [nvidia-open-model-license-text]
  - label: Ownership and outputs
    text: >-
      Subject to NVIDIA's underlying rights, you own the Derivative Models you create. NVIDIA
      claims no ownership rights in outputs, and you are responsible for outputs and their
      subsequent uses.
    source_ids: [nvidia-open-model-license-text]
  - label: Updates to the agreement
    text: >-
      NVIDIA may update the agreement to comply with legal and regulatory requirements at any
      time, and licensees agree either to comply with the updated license or to stop copying,
      using, and distributing the Model and any Derivative Model.
    source_ids: [nvidia-open-model-license-text]
