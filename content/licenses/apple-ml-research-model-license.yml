slug: apple-ml-research-model-license
name: Apple Machine Learning Research Model License Agreement
spdx: null
category: non-commercial
official_url: https://huggingface.co/apple/OpenELM-3B-Instruct/blob/main/LICENSE
summary:
  text: >-
    The Apple Machine Learning Research Model License Agreement is Apple Inc.'s license for
    models it releases "for the sole purpose of scientific research of artificial intelligence
    and machine-learning technology." It grants a limited license to use, copy, modify,
    distribute, and create Model Derivatives exclusively for Research Purposes. This guide uses
    the copies published in Apple's OpenELM-3B-Instruct and FastVLM-7B repositories on Hugging
    Face, which are identical.
  reviewed_at: 2026-10-08
  source_ids: [apple-mlr-license-openelm, apple-mlr-license-fastvlm]
key_terms:
  - label: Research purposes only
    text: >-
      The license is "personal, non-exclusive, worldwide, non-transferable, royalty-free,
      revocable, and limited" and applies "exclusively for Research Purposes." Any Model
      Derivatives must also be limited to Research Purposes.
    source_ids: [apple-mlr-license-openelm, apple-mlr-license-fastvlm]
  - label: No commercial use
    text: >-
      Research Purposes means "non-commercial scientific research and academic development
      activities" and "does not include any commercial exploitation, product development or use
      in any commercial product or service."
    source_ids: [apple-mlr-license-openelm, apple-mlr-license-fastvlm]
  - label: Redistribution and attribution
    text: >-
      Redistributors must provide a copy of the agreement and a set attribution notice. Model
      Derivatives must be clearly identified, with modifications disclosed, and Apple's name,
      trademarks, or logos may not be used to endorse or promote them.
    source_ids: [apple-mlr-license-openelm, apple-mlr-license-fastvlm]
  - label: No other rights
    text: >-
      Apple grants no other rights or licenses beyond those stated, "including but not limited
      to any patent, trademark, and similar intellectual property rights."
    source_ids: [apple-mlr-license-openelm, apple-mlr-license-fastvlm]
  - label: Termination
    text: >-
      Apple may terminate the agreement "at any time" if the licensee breaches it. The licensee
      must then stop using all Apple Machine Learning Research Models and Model Derivatives and
      permanently delete any copies.
    source_ids: [apple-mlr-license-openelm, apple-mlr-license-fastvlm]
