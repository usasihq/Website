summary:
  text: >-
    The Open Data Commons Attribution License (ODC-By) v1.0, published by Open Data Commons, is
    a license for databases. Its preamble says it is intended to allow free sharing,
    modifying, and use of a database "subject only to the attribution requirements set out in
    Section 4." It governs rights in the database itself, not in the individual contents,
    which may carry their own licenses.
  reviewed_at: 2026-10-08
  source_ids: [odc-by-1-0-text]
key_terms:
  - label: What it covers
    text: >-
      The license covers copyright and database rights in the database and is also a contract.
      It does not cover copyright in individual contents, computer programs used to make or run
      the database, patents, or trademarks (Section 2).
    source_ids: [odc-by-1-0-text]
  - label: Commercial use
    text: >-
      The rights granted "explicitly include commercial use, and do not exclude any field of
      endeavour," and include extracting contents and creating derivative and collective
      databases (Section 3.1).
    source_ids: [odc-by-1-0-text]
  - label: Notices when conveying
    text: >-
      If you Publicly Convey the database or a derivative database, you must do so under this
      license, include a copy of the license or its URI, and keep intact copyright, database
      right, and license notices (Section 4.2).
    source_ids: [odc-by-1-0-text]
  - label: Produced works
    text: >-
      Creating and using a Produced Work, such as an image or text made from query results, does
      not require those notices, but publicly using one requires a notice that content came from
      the database and is available under this license (Section 4.3).
    source_ids: [odc-by-1-0-text]
  - label: Termination
    text: >-
      Any breach "automatically terminates this License with immediate effect and without
      notice." If you stop the breach, your rights are reinstated provisionally and then
      permanently on the 60th day unless the licensor reasonably notifies you otherwise
      (Section 9).
    source_ids: [odc-by-1-0-text]
