summary:
  text: >-
    The BSD 2-Clause License, listed on the SPDX License List as the BSD 2-Clause "Simplified"
    License, is a short permissive license. It permits redistribution and use in source and
    binary forms, with or without modification, under two conditions about keeping the
    copyright notice. The text is a template in which each project supplies its own copyright
    line.
  reviewed_at: 2026-10-08
  source_ids: [spdx-bsd-2-clause]
key_terms:
  - label: Source redistribution
    text: >-
      Redistributions of source code "must retain the above copyright notice, this list of
      conditions and the following disclaimer" (clause 1).
    source_ids: [spdx-bsd-2-clause]
  - label: Binary redistribution
    text: >-
      Redistributions in binary form must reproduce the copyright notice, the list of
      conditions, and the disclaimer "in the documentation and/or other materials provided with
      the distribution" (clause 2).
    source_ids: [spdx-bsd-2-clause]
  - label: No warranty
    text: >-
      The software is provided "AS IS"; implied warranties of merchantability and fitness for a
      particular purpose are disclaimed, and the copyright holder and contributors are not
      liable for damages arising from its use.
    source_ids: [spdx-bsd-2-clause]
