summary:
  text: >-
    The BSD 3-Clause License, listed on the SPDX License List as the BSD 3-Clause "New" or
    "Revised" License, is a short permissive license. It permits redistribution and use in
    source and binary forms, with or without modification, under three conditions. The text is
    a template in which each project supplies its own copyright line.
  reviewed_at: 2026-10-08
