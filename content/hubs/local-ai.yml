primary_documents:
  - source_id: llamacpp-readme
    note: >-
      The project's own list of hardware backends and quantization formats. Use it to check
      whether your machine is supported before downloading a model.
  - source_id: ollama-cloud
    note: >-
      Explains which Ollama models run on Ollama's servers instead of your machine, and how to
      keep to local models only.
  - source_id: llamafile-readme
    note: >-
      Describes the single-file packaging approach and its basis in llama.cpp and Cosmopolitan
      Libc.
  - source_id: mlx-readme
    note: >-
      Apple's description of MLX and its unified memory model, which matters for how models
      use memory on Apple silicon.
  - source_id: executorch-readme
    note: >-
      Shows the export-then-run workflow for phones and embedded devices, and warns that
      accuracy, memory use, and performance must be validated on the target device.
  - source_id: awq-readme
    note: >-
      The authors' own description of the AWQ weight-quantization method, with the code and
      4-bit kernels that implement it.
  - source_id: gptoss20b-card
    note: >-
      A model card that ties a memory figure to a stated quantization and names local runtimes,
      a useful example of what to look for in a card.
