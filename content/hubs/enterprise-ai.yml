    note: >-
      An enterprise AI platform's terms, which describe permission-preserving connections and
      say that third-party models are governed by their own terms.
  - source_id: snowflake-cortex-functions
    note: >-
      Snowflake's documentation of which developers' models its AI functions use and where
      those models are deployed.
  - source_id: databricks-fmapi
    note: >-
      Databricks' description of the open models it hosts behind its Foundation Model APIs.
  - source_id: databricks-retired-models
    note: >-
      A data platform's lifecycle policy for hosted models, with deprecation notice periods
      and past retirement dates.
  - source_id: writer-models
    note: >-
      Shows a platform that defaults to its own model while letting administrators enable
      models from other providers.
  - source_id: granite-42-8b-card
    note: >-
      The model card for an open release from an enterprise software company, with its
      license statement.
  - source_id: palmyra-mini-card
    note: >-
      A card that names its base model, an example of provenance to check before relying on a
      release.
