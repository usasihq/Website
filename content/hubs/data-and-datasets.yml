    note: Start here. Separates which data was used, where it came from, access, and terms.
  - label: License scope
    href: /glossary/#license-scope
    note: Why a dataset license may not cover the works collected in it.
  - label: Availability is not permission
    href: /methodology/#openness
    note: How the catalog keeps what you can download separate from what you may do with it.
  - label: Gated download
    href: /glossary/#gated-download
    note: What it means when a dataset asks you to sign in and accept terms first.
  - label: What open weight and open source mean
    href: /learn/open-weight-vs-open-source/
    note: How data terms fit alongside the terms for weights and code in one release.
  - label: Unknown
    href: /glossary/#unknown
    note: A gap in a disclosure means not assessed or not documented, never "no".
  - label: Common Crawl corpus record
    href: /open/common-crawl-corpus/
    note: The catalog record for the web archive that many of these datasets build on.
