primary_documents:
  - source_id: cc-terms
    note: >-
      Common Crawl's Terms of Use, which put the risk and the duty to respect third-party
      rights on whoever uses the crawled content.
  - source_id: fineweb-card
    note: >-
      A dataset card that states its own license, the upstream terms that also apply, and
      its handling of personal information.
  - source_id: dolma-card
    note: >-
      Dolma's card, including its license change and the statement that the original
      sources' terms still apply.
  - source_id: rpv2-card
    note: >-
      Shows a dataset released with quality signals and duplicate IDs rather than a single
      filtered version, with separate terms for data and code.
  - source_id: nvidia-data-agreement
    note: >-
      An example of a dataset agreement that limits use to model training and disclaims any
      grant of rights to copyrighted content.
  - source_id: common-pile-paper
    note: >-
      Explains what "openly licensed" text means and why unlicensed training data limits
      sharing datasets.
  - source_id: cc-ccbot
    note: >-
      How website owners can identify Common Crawl's crawler and block it in robots.txt.
