    note: Find intended uses, out-of-scope uses, and known limitations for one release.
  - label: What open weight and open source mean
    href: /learn/open-weight-vs-open-source/
    note: Downloadable weights are not the same as permission to use them for anything.
  - label: Gated download
    href: /glossary/#gated-download
    note: Some vision checkpoints are released only after an access request.
  - label: License scope
    href: /glossary/#license-scope
    note: Code, weights, and training data can carry different terms.
  - label: AI content provenance
    href: /learn/ai-content-provenance/
