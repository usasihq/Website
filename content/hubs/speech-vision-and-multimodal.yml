primary_documents:
  - source_id: clip-modelcard
    note: >-
      A short model card with direct statements of out-of-scope uses, a useful example of what
      to look for before deploying a vision model.
  - source_id: whisper-modelcard
    note: >-
      Describes Whisper's training data by language and its documented limitations, including
      text that was not spoken and uneven accuracy across languages and accents.
  - source_id: parakeet-v3-card
    note: >-
      Lists supported languages, input format, audio length limits, and the license for one
      speech recognition release.
  - source_id: molmo2-card
    note: >-
      Shows how a vision-language model names its vision encoder and language model, and how
      license and training-data terms can differ.
  - source_id: gemma4-12b-card
    note: >-
      Explains the encoder-free design of Gemma 4 12B and which input types each Gemma 4 size
      accepts.
  - source_id: sam3-readme
    note: >-
      SAM 3's description, the SAM 3.1 update, installation needs, and the access request
      required for checkpoints.
  - source_id: dinov3-readme
    note: >-
      Explains how to request DINOv3 weights and use the backbones and task adapters, with the
      DINOv3 License noted at the end.
  - source_id: diffusers-readme
    note: >-
      The library's own summary of its pipelines, schedulers, and model components.
  - source_id: mochi-card
    note: >-
      A video generation model card that states its hardware needs, output resolution, and
      known limitations.
