primary_documents:
  - source_id: ptf-charter
    note: >-
      The PyTorch Foundation's participation agreement and charter, which define it as a
      directed fund of the Linux Foundation and leave technical oversight to each project's own
      charter.
  - source_id: aaif-charter
    note: >-
      The Agentic AI Foundation's charter, covering its governing board, project steering
      committees, and where project trademarks are held.
  - source_id: lfai-charter
    note: >-
      The LF AI & Data charter, which uses the same directed-fund structure for AI, machine
      learning, and data projects.
  - source_id: irs-business-leagues
    note: >-
      The IRS description of a 501(c)(6) business league, the tax category the Linux
      Foundation gives for itself.
  - source_id: irs-501c3-purposes
    note: >-
      The IRS list of 501(c)(3) exempt purposes, for comparison with business leagues.
  - source_id: mcp-license
    note: >-
      A hosted project's license file that changes on its own schedule, independent of the
      foundation's tax status.
  - source_id: eleuther-about
    note: >-
      A nonprofit research lab's own description of what it trains and releases.
