slug: open-source-foundations
title: Open-source foundations and stewards
summary: >-
  How foundations such as the Linux Foundation, the PyTorch Foundation, LF AI & Data, and the
  Agentic AI Foundation host AI projects, and why a nonprofit's tax status is separate from
  the openness of what it hosts.
intro:
  - text: >-
      An open-source foundation gives projects a neutral home. It can hold trademarks, raise
      and spend member funds, and run governing boards, while each project keeps its own
      technical leadership. The Linux Foundation, a 501(c)(6) nonprofit, describes itself as a
      neutral hub for developers to manage and scale open technology projects. Under the
      Agentic AI Foundation's charter, for example, trademarks relating to its projects must be
      held by LF Projects, LLC or the Linux Foundation.
    source_ids: [lf-about, aaif-charter]
    reviewed_at: 2026-10-01
  - text: >-
      Several AI-focused foundations are directed funds of the Linux Foundation. The charters
      of the PyTorch Foundation, LF AI & Data, and the Agentic AI Foundation each say that the
      fund raises, budgets, and spends money for its technical projects, operates under its
      governing board and the Linux Foundation consistent with the Linux Foundation's
      tax-exempt status, and leaves each project's governance to that project's own charter.
      The PyTorch Foundation supports PyTorch, vLLM, DeepSpeed, Ray, Helion, and Safetensors.
      The Agentic AI Foundation lists the Model Context Protocol, goose, AGENTS.md, and A2A
      among its projects, and LF AI & Data hosts projects such as ONNX.
    source_ids: [ptf-charter, lfai-charter, aaif-charter, ptf-page, aaif-projects, lfai-about]
    reviewed_at: 2026-10-01
  - text: >-
      Tax status describes the organization, not the license of what it hosts. The IRS
      defines a 501(c)(6) business league as an association of persons with a common business
      interest whose purpose is to promote that interest, not to run a regular business of a
      kind ordinarily carried on for profit. It lists charitable, scientific, and educational
      purposes among those of 501(c)(3) organizations. Neither status sets a project's terms.
      PyTorch is distributed under a BSD-style license and vLLM under Apache 2.0. The Model
      Context Protocol is moving from the MIT License to Apache 2.0 for new code and
      specification contributions, with documentation under CC BY 4.0.
    source_ids: [irs-business-leagues, irs-501c3-purposes, pytorch-license, vllm-license, mcp-license]
    reviewed_at: 2026-10-01
  - text: >-
      Nonprofit stewards also work outside the Linux Foundation. EleutherAI describes itself
      as a non-profit AI research lab that trains and releases open models, datasets, and
      tools. In this catalog, openness is described per artifact, and an organization is never
      labeled open because it has released one open-weight model. A steward's nonprofit status
      and the terms of each project it maintains are therefore recorded separately.
    source_ids: [eleuther-about, usasi-methodology]
    reviewed_at: 2026-10-01
scope: >-
  Covers foundations and nonprofit organizations that host, govern, or maintain open AI
  software, protocols, datasets, and models, including Linux Foundation directed funds. It
  explains legal form and governance; it does not rate how open a foundation is, and each
  hosted project's license is recorded on that project's own record. Featured records are
  examples chosen to cover the subject, not a ranking or a complete list.
