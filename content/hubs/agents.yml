slug: agents
title: AI agents and agent tooling
summary: >-
  What separates an agent from a model, and the open protocols, SDKs, and coding agents used
  to build agents, including the Model Context Protocol, A2A, and AGENTS.md.
intro:
  - text: >-
      A model takes an input and returns an output. An agent is software that wraps one or more
      models with instructions and tools so that it can take actions. The OpenAI Agents SDK,
      for example, defines agents as models configured with instructions, tools, guardrails,
      and handoffs to other agents, and its tools include functions, MCP servers, and hosted
      tools. Google's Agent Development Kit describes itself as a framework for building,
      evaluating, and deploying agents that is optimized for Gemini but model-agnostic.
    source_ids: [oai-agents-readme, adk-readme]
    reviewed_at: 2026-10-01
  - text: >-
      The agent and the model are often separate pieces with separate terms. Codex CLI,
      OpenAI's Apache-2.0 coding agent, runs on your computer but signs in with a ChatGPT plan
      or an API key to use OpenAI's models. goose, an agent with a desktop app, a command line,
      and an API, works with several model providers, among them Anthropic, OpenAI, Google,
      and Ollama. An open-source agent can therefore depend on a hosted model service.
    source_ids: [codex-readme, goose-readme]
    reviewed_at: 2026-10-01
  - text: >-
      Three open specifications connect agents to tools, to each other, and to codebases. The
      Model Context Protocol (MCP) uses JSON-RPC 2.0 messages between hosts (LLM
      applications), clients inside them, and servers that offer resources, prompts, and
      tools. Agent2Agent (A2A) lets agents built on different frameworks by different companies
      discover each other's capabilities through Agent Cards and work together without
      exposing their internal memory or tools. AGENTS.md is a Markdown file in a project that
      gives coding agents instructions; its maintainers call it a README for agents. All three
      are projects of the Agentic AI Foundation, a Linux Foundation project.
    source_ids: [mcp-spec, a2a-readme, agentsmd-readme, aaif-projects]
    reviewed_at: 2026-10-01
  - text: >-
      Because agents act, permissions matter. The MCP specification treats tools as arbitrary
      code execution, says hosts must obtain explicit user consent before invoking any tool,
      and notes that the protocol itself cannot enforce these principles. It asks implementers
      to build consent and authorization flows into their applications. When you assess an
      agent, look at how it asks for approval, what it is allowed to run, and what data it
      sends where.
    source_ids: [mcp-spec]
    reviewed_at: 2026-10-01
scope: >-
  Covers software that uses models to take actions: agent protocols and file conventions,
  agent SDKs and frameworks, coding agents, and benchmarks that test agents. The models that
  agents call are separate records with their own licenses. It does not cover hosted agent
  products in depth or compare agent performance. Featured records are examples chosen to
  cover the subject, not a ranking or a complete list.
