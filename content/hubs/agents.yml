      A concise statement of the parts of an agent (instructions, tools, guardrails, handoffs,
      tracing) as one SDK defines them.
  - source_id: codex-readme
    note: >-
      Shows that a locally running, open-source agent can still require a hosted model account
      or API key.
  - source_id: goose-readme
