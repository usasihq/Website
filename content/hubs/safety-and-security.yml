primary_documents:
  - source_id: nist-ai-100-1
    note: >-
      The AI Risk Management Framework itself, including the four core functions and the
      characteristics NIST uses to describe trustworthy AI.
  - source_id: nist-ai-100-2
    note: >-
      NIST's taxonomy of attacks on machine learning systems, with definitions of direct and
      indirect prompt injection and a statement of the limits of current mitigations.
  - source_id: nist-ai-100-4
    note: >-
      An overview of watermarking, metadata, and detection for synthetic content, with the
      trade-offs and research gaps of each approach.
  - source_id: c2pa-explainer
    note: >-
      The C2PA's plain-language explainer for Content Credentials, including what a valid
      credential does and does not tell you.
  - source_id: oai-preparedness-v2
    note: >-
      One developer's full framework, with its tracked categories, capability thresholds, and
      safeguard requirements, useful for reading model cards that cite it.
  - source_id: gptoss-model-card
    note: >-
      A model card for an open-weight release that explains how the developer tested
      adversarially fine-tuned versions, a step specific to models whose weights are public.
  - source_id: anthropic-rsp
    note: >-
      Lists every version of Anthropic's Responsible Scaling Policy with redlines and change
      notes, which shows how such a policy changes over time.
  - source_id: llamaguard4-card
    note: >-
      Shows the hazard categories a safety classifier is trained on and how it reports which
      category a prompt or response violates.
  - source_id: nist-caissi
    note: >-
      NIST's page for CAISSI, with its stated responsibilities and links to its published
      evaluations of specific models. The evaluation items listed there use the name Center
      for AI Standards and Innovation (CAISI).
  - source_id: dioptra-readme
    note: >-
      NIST's test platform for AI, with its intended uses from in-house testing to audits and
      red-teaming.
