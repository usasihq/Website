primary_documents:
  - source_id: claude-models-overview
    note: >-
      A hosted developer's own model list, with a model ID for each platform the models are
      offered on and a retirement commitment for each model.
  - source_id: claude-deprecations
    note: >-
      Defines the active, legacy, deprecated, and retired stages for hosted models and the
      notice given before retirement.
  - source_id: olmo31-think-card
    note: >-
      Shows a family split into many released checkpoints, with the training data and the
      license and intended-use statements for one release.
  - source_id: gptoss120b-card
    note: >-
      The model card for an open-weight release from a developer that also runs a hosted API.
  - source_id: llama4-license
    note: >-
      A custom model license with attribution, naming, and acceptable-use conditions that go
      beyond a standard open-source license.
  - source_id: grok2-license
    note: >-
      A community license that conditions commercial use and restricts training other models
      on the materials or their outputs.
  - source_id: gemma4-license
    note: >-
      Google's statement of the license for Gemma 4, which is Apache 2.0.
  - source_id: usasi-methodology
    note: >-
      USASI's rules for family and release records, and for keeping availability separate
      from permission.
