slug: foundation-models
title: Foundation models and the labs that build them
summary: >-
  How model developers in the catalog make their models available, hosted, as downloadable
  weights, or both, why a model family is not a release, and how to read access and license
  terms.
intro:
  - text: >-
      Model developers in this catalog make their models available in different ways. Some
      offer them as hosted services: Anthropic's documentation lists each Claude model by its
      ID on the Claude API and on cloud platforms run by Amazon, Google, and Microsoft. Some
      publish the weights: Ai2 says its Olmo 3 models were pre-trained on the Dolma 3 dataset
      and post-trained on the Dolci datasets, and that it is releasing the code, checkpoints,
      and training details. Others do both. OpenAI serves models through its API and also
      publishes gpt-oss, which its model card calls OpenAI's open-weight models, under the
      Apache 2.0 license.
    source_ids: [claude-models-overview, olmo31-think-card, openai-api-models, gptoss120b-card]
    reviewed_at: 2026-10-02
  - text: >-
      A model name often covers many releases. The Olmo 3 model card lists 7B and 32B models in
      Instruct and Think variants, and publishes a separate checkpoint for each training stage
      (supervised fine-tuning, preference tuning, and a final reinforcement-learning stage). In
      this catalog, a family record summarizes a named line of models, while licenses,
      availability, and openness tiers attach only to individual releases, because they can
      differ between releases in the same family.
    source_ids: [olmo31-think-card, usasi-methodology]
    reviewed_at: 2026-10-02
  - text: >-
      Downloadable weights come with different terms. Gemma 4 and gpt-oss use Apache 2.0. The
      Llama 4 Community License incorporates an acceptable use policy and requires anyone who
      distributes the models, or a product that contains them, to display "Built with Llama";
      a model trained or improved with them and then distributed must have a name beginning
      with "Llama". The Llama 4 Scout repository on Hugging Face asks you to sign in and review
      these conditions before access. The xAI Community License for Grok 2 allows commercial
      use only within xAI's acceptable use policy and bars using the materials or their outputs
      to train other general-purpose models.
    source_ids: [gemma4-license, gptoss120b-card, llama4-license, llama4-scout-hf, grok2-license]
    reviewed_at: 2026-10-02
  - text: >-
      A permissive license does not settle every question. Ai2's Olmo 3.1 32B Think card gives
      an Apache 2.0 license and also says the model is intended for research and educational
      use in line with Ai2's Responsible Use Guidelines. The catalog keeps availability
      separate from permission: being publicly downloadable does not by itself make a release
      unrestricted, open source, commercially usable, or redistributable.
    source_ids: [olmo31-think-card, usasi-methodology]
    reviewed_at: 2026-10-02
  - text: >-
      Hosted models change on the provider's schedule. Anthropic says every Claude model ID is
      a pinned snapshot, that a deprecated model is given a retirement date, and that requests
      to a retired model fail. It gives at least 60 days' notice before retiring publicly
      released models on the platforms it operates, while Amazon Bedrock and Google Cloud set
      their own schedules. Check the lifecycle page for any hosted model you build on.
    source_ids: [claude-models-overview, claude-deprecations]
    reviewed_at: 2026-10-02
scope: >-
  Covers organizations that train and publish general-purpose models, whether hosted, as
  downloadable weights, or both, and the family and release records for their models. It
  explains access and license terms; it does not compare model quality, report results, or
  give legal advice. Featured records are examples chosen to cover the subject, not a ranking
  or a complete list.
