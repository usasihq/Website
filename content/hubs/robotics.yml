primary_documents:
  - source_id: openpi-readme
    note: >-
      Physical Intelligence's description of its released checkpoints and its plain warning
      that they may not work on other robots.
  - source_id: gr00t-n17-card
    note: >-
      The GR00T N1.7 card, with its weights license, how it was evaluated in simulation and
      on real robots, and who is responsible for safe integration.
  - source_id: gr00t-readme
    note: >-
      The Isaac GR00T repository, whose license section separates code terms from weights
      terms.
  - source_id: cosmos3-nano-card
    note: >-
      A world-model card whose limitations section says what its outputs should not be used
      for.
  - source_id: isaaclab-readme
    note: >-
      Isaac Lab's license section, which notes that full workflows depend on Isaac Sim and its
      proprietary components.
  - source_id: wod-terms
    note: >-
      The Waymo Open Dataset license, which limits use to non-commercial purposes and
      excludes production systems.
  - source_id: agility-digit5-page
    note: >-
      A humanoid product page with its own disclaimers about features still in development
      and remaining operational risk.
