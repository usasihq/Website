primary_documents:
  - source_id: pytorch-readme
    note: >-
      PyTorch's own description of its components, from the tensor library to autograd and
      the neural network modules.
  - source_id: transformers-readme
    note: >-
      Explains Transformers as a shared model-definition layer and shows the Pipeline API for
      text, audio, vision, and multimodal tasks.
  - source_id: vllm-readme
    note: >-
      Lists vLLM's serving features, supported hardware, and model types, useful for checking
      whether a model and machine are supported.
  - source_id: sglang-readme
    note: >-
      Describes SGLang's scope, from language and vision-language models to image and video
      generation, and its supported hardware.
  - source_id: aisdk-readme
    note: >-
      Shows the default routing through Vercel's AI Gateway and how to connect to a provider
      directly instead.
  - source_id: dspy-readme
    note: >-
      DSPy's statement of its approach, writing Python modules instead of prompts, with links
      to the research papers about the framework.
  - source_id: geminicli-sandbox
    note: >-
      A detailed account of a coding agent's sandbox options, including what each profile
      allows for file writes and network access.
  - source_id: openhands-readme
    note: >-
      Describes running agents locally, in containers, or on servers, with a plain warning
      about running without a sandbox.
  - source_id: wandb-readme
    note: >-
      The quickstart for logging training runs to W&B, including the account and API key it
      requires.
  - source_id: mlflow-readme
    note: >-
      MLflow's features for tracing, evaluation, and prompt management, with a quickstart that
      runs the tracking server locally.
