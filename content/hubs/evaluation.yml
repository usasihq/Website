primary_documents:
  - source_id: mlperf-rules
    note: >-
      MLPerf's submission rules, including peer review between submitters and the
      requirement that submitted code can reproduce the results.
  - source_id: arc-policy
    note: >-
      ARC Prize Foundation's testing policy, which separates verified results from community
      submissions and discusses leakage through external APIs.
  - source_id: tb-continuous
    note: >-
      Explains how a benchmark can be versioned like software, and which changes require
      re-running or only re-grading.
  - source_id: hle-rolling
    note: >-
      A dated log of question changes, which shows that a benchmark's contents can differ
      between two results.
  - source_id: helm-maintenance
    note: >-
      What maintenance mode means for a harness whose tests depend on external model APIs.
  - source_id: lmeval-readme
    note: >-
      The harness's own description of supported model types, and of which task types need
      log probabilities.
  - source_id: usasi-methodology
    note: >-
      USASI's source standards, including its rule against publishing benchmark results.
