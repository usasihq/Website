primary_documents:
  - source_id: arc-evo2-news
    note: >-
      Arc Institute's announcement of Evo 2, which states what was shared openly and which
      pathogens were excluded from the training data.
  - source_id: esm3-card
    note: >-
      The ESM3 open model card, with its training-data removals, output filtering, and license
      statement.
  - source_id: boltz-readme
    note: >-
      The Boltz repository's statement that its code and weights are MIT-licensed for academic
      and commercial use, and its optional automatic MSA generation through an MSA server.
  - source_id: chai-readme
    note: >-
      Chai-1's current license statement for code and weights, and its hardware requirements.
  - source_id: e1-attribution
    note: >-
      Profluent-E1's attribution guidelines, an example of conditions that go beyond a
      standard open-source license.
  - source_id: ether0-card
    note: >-
      The ether0 card, which records the base model, training stages, and refusal training.
  - source_id: medgemma-card
    note: >-
      MedGemma's intended-use and limitations sections, which state what its outputs should
      not be used for.
  - source_id: paperqa-readme
    note: >-
      Shows how an open-source science agent depends on a separately configured model service.
