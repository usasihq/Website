# Deploys the static export to Cloudflare Workers (static assets only).
#
# Does nothing until the owner opts in. Required repository configuration:
#   Variable  CLOUDFLARE_DEPLOY = "true"
#   Secret    CLOUDFLARE_API_TOKEN   (token with "Workers Scripts: Edit" for the account)
#   Secret    CLOUDFLARE_ACCOUNT_ID
# Deploys run on pushes to main and on the 1st of each month (so the Local
# corner's monthly lineup rotates without a commit). Preview URLs are disabled
# in wrangler.jsonc, so pull requests are checked by CI but not deployed.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 6 1 * *"

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://unitedstatesofamericasuperintelligence.com
          NEXT_PUBLIC_BASE_PATH: ""
      - name: Deploy production
        run: npx wrangler deploy --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
