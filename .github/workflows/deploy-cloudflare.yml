# Deploys the static export to Cloudflare Workers (static assets only).
#
# Does nothing until the owner opts in. Required repository configuration:
#   Variable  CLOUDFLARE_DEPLOY = "true"
#   Secret    CLOUDFLARE_API_TOKEN   (token with "Workers Scripts: Edit" for the account)
#   Secret    CLOUDFLARE_ACCOUNT_ID
# Deploys run on pushes to main and on the 1st of each month (so the Local
# corner's monthly lineup rotates without a commit). Preview URLs are disabled
# in wrangler.jsonc, so pull requests are checked by CI but not deployed.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 6 1 * *"

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    # Same budget as CI. A cache miss redraws ~15,000 GitHub/Hugging Face
    # heroes in Chromium (~50 minutes); this job also refreshes jobs (up to
    # 22 minutes) and runs e2e before wrangler deploy.
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore Jobs operational state
        if: vars.JOBS_REFRESH == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/jobs/current.json
            data/jobs/indexing-quota.json
            data/jobs/hiring-index.json
            data/jobs/descriptions.json
            data/jobs/workday-meta.json
          key: jobs-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobs-v1-main-
      - name: Record hiring-index snapshot from current listings
        if: vars.JOBS_REFRESH == 'true'
        run: npm run jobs:snapshot
      - name: Preserve hiring-index if refresh does not finish
        if: vars.JOBS_REFRESH == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/jobs/current.json
            data/jobs/indexing-quota.json
            data/jobs/hiring-index.json
            data/jobs/descriptions.json
            data/jobs/workday-meta.json
          key: jobs-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-early
      - name: Refresh Jobs before ordinary releases
        if: vars.JOBS_REFRESH == 'true'
        timeout-minutes: 22
        run: npm run jobs:refresh
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ vars.USAJOBS_USER_AGENT }}
          JOBS_REFRESH_CONCURRENCY: "4"
          JOBS_SOURCE_TIMEOUT_MS: "180000"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Same OG cache as ci.yml. Without it, prepare:cards redraws ~15,000
      # GitHub/Hugging Face heroes and the job never reaches wrangler deploy.
      - name: Restore rendered cards and hero images
        uses: actions/cache@v4
        with:
          path: |
            .cache
            public/og
          key: og-${{ hashFiles('lib/page-cards.ts', 'scripts/page-cards.ts', 'scripts/hero-render.ts', 'scripts/github-heroes.ts', 'scripts/hf-heroes.ts', 'data/github/projects.json', 'data/huggingface/*.json') }}
          restore-keys: og-
      - name: Build static production snapshot
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://unitedstatesofamericasuperintelligence.com
          NEXT_PUBLIC_BASE_PATH: ""
      - run: npm run check:links
      - run: npm run test:e2e
      - name: Refuse an obsolete release before saving state or publishing
        run: |
          release_sha=$(git rev-parse HEAD)
          current_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$current_sha" && test "$release_sha" = "$current_sha"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
      - name: Preserve hiring-index after any refresh outcome
        if: always() && vars.JOBS_REFRESH == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/jobs/current.json
            data/jobs/indexing-quota.json
            data/jobs/hiring-index.json
            data/jobs/descriptions.json
            data/jobs/workday-meta.json
          key: jobs-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-snap
      - name: Preserve validated Jobs state
        if: vars.JOBS_REFRESH == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/jobs/current.json
            data/jobs/indexing-quota.json
            data/jobs/hiring-index.json
            data/jobs/descriptions.json
            data/jobs/workday-meta.json
          key: jobs-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy production
        run: npx wrangler deploy --message "${{ env.RELEASE_SHA }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
