# Activate only after integration: repository variable JOBS_REFRESH=true.
# Reuses the existing Cloudflare deployment credentials and production environment.
# No commits: operational state is cached and archived independently of editorial Git history.
name: Refresh Jobs
on:
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"
permissions:
  contents: read
concurrency:
  # Same lock as deploy-cloudflare.yml. Never race production uploads.
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && vars.JOBS_REFRESH == 'true' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    # Same budget as CI. A cache miss redraws ~15,000 GitHub/Hugging Face
    # heroes in Chromium (~50 minutes); the jobs refresh can take 22.
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore most recent validated operational state
        uses: actions/cache/restore@v4
        with:
          # descriptions.json and workday-meta.json skip Workday/SmartRecruiters
          # detail refetches; without them a run spends minutes per large board.
          path: |
            data/jobs/current.json
            data/jobs/indexing-quota.json
            data/jobs/hiring-index.json
            data/jobs/descriptions.json
            data/jobs/workday-meta.json
            data/jobs/indexnow-last.json
          key: jobs-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobs-v1-main-
      - name: Keep previous jobs snapshot for Indexing API
        run: |
          if [ -f data/jobs/current.json ]; then
            cp data/jobs/current.json data/jobs/previous.json
          fi
      - name: Record hiring-index snapshot from current listings
        run: npm run jobs:snapshot
      - name: Preserve hiring-index if refresh does not finish
        uses: actions/cache/save@v4
        with:
          path: |
            data/jobs/current.json
            data/jobs/indexing-quota.json
            data/jobs/hiring-index.json
            data/jobs/descriptions.json
            data/jobs/workday-meta.json
            data/jobs/indexnow-last.json
          key: jobs-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-early
      - name: Refresh supported official sources
        timeout-minutes: 22
        run: npm run jobs:refresh
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ vars.USAJOBS_USER_AGENT }}
          JOBS_REFRESH_CONCURRENCY: "4"
          JOBS_SOURCE_TIMEOUT_MS: "180000"
      - name: Preserve hiring-index after any refresh outcome
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/jobs/current.json
            data/jobs/indexing-quota.json
            data/jobs/hiring-index.json
            data/jobs/descriptions.json
            data/jobs/workday-meta.json
            data/jobs/indexnow-last.json
          key: jobs-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-snap
      # Cheap Hub upload (~seconds). Missing HF_TOKEN skips; Hub errors do not fail the refresh.
      - name: Push jobs snapshot to Hugging Face
        run: npm run jobs:hf-dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NEXT_PUBLIC_SITE_URL: https://unitedstatesofamericasuperintelligence.com
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # prepare:cards launches Chromium. Job-landing cards change after a
      # refresh; the ~15,000 GitHub/Hugging Face heroes do not, and must come
      # from the same Actions cache as ci.yml or a cold build takes ~50 minutes.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Restore rendered cards and hero images
        uses: actions/cache@v4
        with:
          path: |
            .cache
            public/og
          key: og-${{ hashFiles('lib/page-cards.ts', 'scripts/page-cards.ts', 'scripts/hero-render.ts', 'scripts/github-heroes.ts', 'scripts/hf-heroes.ts', 'data/github/projects.json', 'data/huggingface/*.json') }}
          restore-keys: og-
      - name: Build static production snapshot
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://unitedstatesofamericasuperintelligence.com
          NEXT_PUBLIC_BASE_PATH: ""
      - run: npm run check:links
      - name: Refuse an obsolete release before saving state or publishing
        run: |
          release_sha=$(git rev-parse HEAD)
          current_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$current_sha" && test "$release_sha" = "$current_sha"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
      - name: Preserve validated reconciliation state
        uses: actions/cache/save@v4
        with:
          path: |
            data/jobs/current.json
            data/jobs/indexing-quota.json
            data/jobs/hiring-index.json
            data/jobs/descriptions.json
            data/jobs/workday-meta.json
            data/jobs/indexnow-last.json
          key: jobs-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain operational dataset for recovery
        uses: actions/upload-artifact@v7
        with:
          name: jobs-state-${{ github.run_id }}
          path: data/jobs/current.json
          retention-days: 7
      - name: Deploy refreshed catalog using existing deployment access
        run: npx wrangler deploy --message "Jobs refresh ${{ env.RELEASE_SHA }} run ${{ github.run_id }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Notify Google Indexing API of added and removed job pages
        if: success()
        run: npm run jobs:index
        env:
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
          NEXT_PUBLIC_SITE_URL: https://unitedstatesofamericasuperintelligence.com
      - name: Notify IndexNow of new and changed sitemap URLs
        if: success()
        continue-on-error: true
        run: npm run indexnow
        env:
          NEXT_PUBLIC_SITE_URL: https://unitedstatesofamericasuperintelligence.com
      - name: Preserve IndexNow last URL set
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/jobs/current.json
            data/jobs/indexing-quota.json
            data/jobs/hiring-index.json
            data/jobs/descriptions.json
            data/jobs/workday-meta.json
            data/jobs/indexnow-last.json
          key: jobs-v1-main-${{ github.run_id }}-${{ github.run_attempt }}-post
