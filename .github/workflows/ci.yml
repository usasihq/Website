# Validation, tests, and a production static build on every push and pull request.
# Needs no secrets and deploys nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A cold build draws every per-page card and hero image (about 15,000 for
    # /github/ and /huggingface/); the cache below makes later runs much faster.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate catalog content
        run: npm run validate
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Restore rendered cards and hero images
        uses: actions/cache@v4
        with:
          path: |
            .cache
            public/og
          key: og-${{ hashFiles('lib/page-cards.ts', 'scripts/page-cards.ts', 'scripts/hero-render.ts', 'scripts/github-heroes.ts', 'scripts/hf-heroes.ts', 'data/github/projects.json', 'data/huggingface/*.json') }}
          restore-keys: og-
      - name: Production static build
        run: npm run build
      - name: Internal link check
        run: npm run check:links
      - name: People section pop-back guard (must stay on aipeoplewiki.com)
        run: npm run check:people-removed -- --require-out
      - name: Jobs section pop-back guard (must stay on aipeoplewiki.com)
        run: npm run check:jobs-removed -- --require-out
      - name: End-to-end tests against the static export
        run: npm run test:e2e
      - name: Base-path build and test (GitHub Pages project sites)
        run: npm run test:basepath
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            reports/screenshots/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
