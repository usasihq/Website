# Reviewed exclusions for AI on GitHub (/github/) that the automatic rules in
# lib/github/filters.ts miss. One entry per repository, with a reason
# (list | education | prompts | deepfake | non-ai | other) and a short note.
# Matching is case-insensitive on full_name. Keep this list small and explain
# every entry; it is summarized in the methodology. Reviewed 2026-10-18 against
# the top 600 of that day's ranking; projects below that were not reviewed
# individually.
entries:
