# Official hiring notes for /jobs/at/anthropic/. Only facts from the cited page.
slug: anthropic
reviewed_at: 2026-10-22
hosts:
  - anthropic.com
paragraphs:
  - >-
    Anthropic’s careers page has a “How we hire” section. It says the process is
    meant to find thoughtful people with diverse expertise, and that it cares
    about what you can do, not where you learned to do it.
  - >-
    Anthropic says all interviews are on Google Meet and that it can work across
    time zones. For technical roles it uses live coding tools such as Colab and
    CodeSignal and says you can look things up. For non-technical roles it says
    interviews are conversational.
  - >-
    Anthropic says recruiters only email from @anthropic.com addresses and will
    never ask for money, fees, or banking information before your first day. It
    also says it does not currently offer internships, and that you may re-apply
    after 12 months if you are not selected (or sooner if your experience or
    skills change in a material way).
sources:
  - title: Careers
    url: https://www.anthropic.com/careers
