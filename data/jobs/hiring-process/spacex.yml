# Official hiring notes for /jobs/at/spacex/. Only facts from the cited pages.
slug: spacex
reviewed_at: 2026-10-22
hosts:
  - spacex.com
paragraphs:
  - >-
    SpaceX’s careers pages say to apply through its official jobs board. SpaceX
    says it prioritizes hiring top talent and a culture based on merit. Those
    pages do not publish a step-by-step interview process for regular full-time
    roles.
  - >-
    For internships and graduate-engineer roles, SpaceX’s internships page says
    selected candidates go through technical phone screens, and that some groups
    also use a quiz, project, or programming test. SpaceX says it cannot reply
    to every intern applicant, and that recruiting for a posted intern or
    graduate-engineer role can take up to six months.
steps:
  - Apply on the official jobs page
  - Recruiter contact if selected to interview
  - Technical phone screens
  - Quiz, project, or programming test (some groups)
sources:
  - title: Careers
    url: https://www.spacex.com/careers/
  - title: Jobs
    url: https://www.spacex.com/careers/jobs
  - title: Internships
    url: https://www.spacex.com/internships/
