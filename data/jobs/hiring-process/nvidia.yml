# Official hiring notes for /jobs/at/nvidia/. Only facts from the cited pages.
slug: nvidia
reviewed_at: 2026-10-22
hosts:
  - nvidia.com
  - nvidia.wd5.myworkdayjobs.com
paragraphs:
  - >-
    NVIDIA publishes a “How We Hire” page. It says to apply through NVIDIA’s
    website or LinkedIn, that it is OK to apply to the top five roles that match
    your background, and that selected candidates typically hear from recruiting
    within a couple of weeks.
  - >-
    NVIDIA says you will meet the hiring manager, teammates, and people from
    other groups by phone, video, and in person, and that an onsite interview at
    an NVIDIA office is required before an offer. It says most candidates get a
    decision within a matter of weeks from the first interview. Technical roles
    may include a coding exercise; NVIDIA says using unapproved outside tools
    such as ChatGPT during the interview will end the candidacy.
steps:
  - Search and apply
  - Hear back if there is a match
  - Interviews (phone, then virtual or in person)
  - Decision and, if selected, an offer from the recruiter
sources:
