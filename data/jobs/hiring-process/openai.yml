# Official hiring notes for /jobs/at/openai/. Only facts from the cited pages.
slug: openai
reviewed_at: 2026-10-22
hosts:
  - openai.com
paragraphs:
  - >-
    OpenAI publishes an official interview guide. It says it wants every candidate
    to go through a consistent process, is not credential-driven, and looks for
    collaboration, communication, openness to feedback, and alignment with its
    mission. OpenAI also says your interview experience may differ.
  - >-
    OpenAI says interviews are virtual by default, with an option to interview
    onsite in San Francisco, and that you should expect to hear within one week
    of final interviews. It says expectations for AI tools vary by interview and
    that recruiters will explain what is allowed.
steps:
  - Application and résumé review
  - Introductory call with a recruiter or hiring manager
  - Skills-based assessment (format varies by team)
  - Final interviews
  - Decision
sources:
  - title: Interview guide
    url: https://openai.com/interview-guide/
  - title: Careers
    url: https://openai.com/careers/
