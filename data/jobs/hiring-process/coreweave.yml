paragraphs:
  - >-
    CoreWeave lists openings on its official careers page and does not publish a
    step-by-step interview process there. CoreWeave says genuine roles may also
    appear on trusted platforms such as LinkedIn, but they ultimately send
    candidates to that careers site.
  - >-
    CoreWeave’s recruitment-fraud notice says recruiters only email from
    @coreweave.com addresses, will not interview only over text or messaging
    apps, and will not ask for payments, banking details, or other sensitive
    personal data during hiring.
